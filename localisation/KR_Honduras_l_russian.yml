#Events
honduras.1.t: "Изначальная банановая республика"
honduras.1.d: "Попав под господство различных американских фруктовых компаний, превративших страну в экономический анклав, Гондурас достиг точки кипения в 1933 году. Крестьянское восстание штурмовало столицу и привело к самоубийству действующего президента, но даже после этой катастрофы правительство, созданное после революции, снова оказалось под доминированием американских интересов и клики интеллигенции. Теперь то, что осталось от государственного аппарата Гондураса, представляет собой беспорядок, очищенный от инакомыслящих и полагающийся на военную силу для поддержания железных дорог, ведущих к портам."
honduras.1.a: "Немного, но это дом."

honduras.2.t: "Дезертирство в армии"
honduras.2.d: "Уже долгое время мы полагаемся на военную силу для защиты узких железных дорог, соединяющих плантации с портами, чтобы поддерживать нашу экономику на плаву. Однако из-за продолжающегося экономического кризиса и политического недовольства лояльность армии стала неопределённой: сотни людей бросают свои посты, чтобы присоединиться к той или иной милиции."
honduras.2.a: "Они вернутся, когда проголодаются."

honduras.194.t: "Гондурас хочет купить USS South Dakota"
honduras.194.d: "Новый американский мандат Дель Валье в Гондурасе обратился к нам с предложением купить броненосный крейсер USS South Dakota в качестве престижного проекта для его правительства. Стоит ли нам соглашаться? Старушку в противном случае продали бы на слом."
honduras.194.a: "Нам не помешают наличные."

honduras.195.t: "Покупка одобрена"
honduras.195.d: "USS South Dakota теперь плывёт к нашим портам! Воистину, это великий день для этой молодой нации."
honduras.195.a: "Ура!"

honduras.100.t: "Американская экономика падает дальше"
honduras.100.d: "Каким-то образом им это удалось. С крахом немецкого фондового рынка инвестиции американских фирм пошли от плохого к худшему, и рынок импорта упал ещё сильнее, поскольку потребительские расходы на всё, кроме самых необходимых товаров, достигли дна."
honduras.100.a: "Спрос на бананы невелик..."

honduras.101.t: "Доктрина Монро рушится"
honduras.101.d: "Вооружённый конфликт поразил США, погрузив их правительство в хаос и угрожая полностью уничтожить его. В эти мрачные времена поддержание доктрины Монро, очевидно, невозможно."
honduras.101.a: "Кризис, да, но также и возможность."

honduras.102.t: "Взрыв на железной дороге"
honduras.102.d: "Ранним утром случилась катастрофа: группа дезертиров в знак протеста против политики Совета взорвала участок железной дороги, который они раньше охраняли. Уже поступили сообщения о грабежах остановившихся поездов."
honduras.102.a: "Соберите лоялистов и отправляйтесь за ними!"

honduras.103.t: "Стычки с дезертирами"
honduras.103.d: "Возможно, неудивительно, что при дезертирстве солдаты оставили себе оружие. Посланные нами лоялисты, чтобы выследить и арестовать подрывников железной дороги, были обстреляны, и к северу от столицы сейчас происходит затяжная стычка."
honduras.103.a: "Ну, по крайней мере, хуже быть не может."

honduras.104.t: "В Сальвадор"
honduras.104.d: "Несмотря на все усилия наших солдат, большинству повстанцев удалось бежать в направлении сальвадорской границы. Наша армия готова начать интервенцию, чтобы найти их и привлечь к правосудию."
honduras.104.a: "Сальвадорцы нам не друзья, отправьте войска."

honduras.105.t: "Гондурасские силы вторгаются"
honduras.105.d: "Сегодня подразделения гондурасской армии, заявившие, что преследуют повстанцев по горячим следам, пересекли границу с Сальвадором. Когда небольшой отряд, дислоцированный там, попытался развернуть их обратно, недисциплинированная толпа прорвала КПП и в перестрелке ранила двоих наших людей!"
honduras.105.a: "Они заплатят!"
honduras.105.b: "Следовать за ними, но избегать дальнейших столкновений."

honduras.106.t: "Военные столкновения с Сальвадором"
honduras.106.d: "Похоже, наша неудачная попытка быстро арестовать бомбистов вышла из-под контроля: между нашими силами и сальвадорцами вспыхнула перестрелка."
honduras.106.a: "Проклятье!"

honduras.107.t: "Военные столкновения с Гондурасом"
honduras.107.d: "Похоже, наши силы наконец настигли гондурасцев, и между ними вспыхнула перестрелка."
honduras.107.a: "Проклятье!"

honduras.108.t: "Победа!"
honduras.108.d: "Похоже, мы выиграли столкновение с нашим соседом из-за сбежавших гондурасских солдат. Похоже, сегодня ночью мы будем праздновать!"
honduras.108.a: "Откупорить шампанское!"

honduras.109.t: "Поражение!"
honduras.109.d: "Похоже, наши силы проиграли столкновение с соседом из-за сбежавших гондурасских солдат. Похоже, вечер будет мрачным."
honduras.109.a: "Унизительно..."

honduras.110.t: "Ничья"
honduras.110.d: "Похоже, столкновение закончилось без явного преимущества какой-либо из сторон."
honduras.110.a: "..."

honduras.111.t: "Суд над мятежниками"
honduras.111.d: "Сегодня Совет должен был вершить суд над мятежниками начала года. Однако в последнюю минуту толпа бедных крестьян ворвалась в зал суда и освободила их. Было созвано экстренное заседание Совета, чтобы позже попытаться решить проблему."
honduras.111.a: "О нет..."

honduras.112.t: "Просьба к Сальвадору"
honduras.112.d: "Поскольку военная сила не помогла, похоже, у нас нет иного выбора, кроме как попросить Сальвадор арестовать мятежников от нашего имени."
honduras.112.a: "Хорошо, телеграфируйте им."

honduras.113.t: "Гондурас требует выдачи преступников"
honduras.113.d: "Группа мятежных гондурасских солдат недавно пересекла границу, что спровоцировало вооружённое столкновение между нашими силами и плохо обученными гондурасскими солдатами, преследовавшими их. Теперь Гондурас потребовал их репатриации."
honduras.113.a: "Использовать это в пропагандистских целях."
honduras.113.b: "Можем и отправить их обратно."

honduras.114.t: "Сальвадор унижает нас!"
honduras.114.d: "Сегодня Сальвадор ответил на наше сообщение, сообщив, что не будет сдаваться на наши требования. Учитывая массовые беспорядки в нашей стране и отсутствие побед, чтобы успокоить народ, было созвано экстренное заседание Совета, чтобы позже попытаться решить проблемы."
honduras.114.a: "Как неловко."

honduras.115.t: "Антисальвадорские боевики"
honduras.115.d: "В ответ на унижение нашей великой нации со стороны подлых сальвадорцев у границы начали формироваться военизированные группы, намеренные отразить любое вторжение или возмездие с их стороны. Известные как «Mancha Brava», они представляют собой некое тайное общество и могут быть ценными для обороны нации."
honduras.115.a: "Что ж, это что-то..."

honduras.116.t: "Повстанцы найдены"
honduras.116.d: "После многих дней поисков в холмах и горах наши силы смогли захватить небольшую группу повстанцев, которые несли оружие на свою базу. Пообещав более мягкое наказание, они выдали местонахождение своей базы."
honduras.116.a: "Теперь они не сбегут."

honduras.117.t: "Повстанцы захвачены"
honduras.117.d: "Наши силы немедленно направились на базу повстанцев и начали планировать штурм, который был осуществлён несколько дней назад. Бой продолжался некоторое время, но наши силы одержали победу и теперь ждут, чтобы доставить выживших повстанцев обратно домой."
honduras.117.a: "Время вернуть их."

honduras.118.t: "Компенсация нашему соседу"
honduras.118.d: "На обратном пути домой многие солдаты пересказывали свои «приключения» в Сальвадоре. Эти истории быстро дошли до нас и поразили нас плохой дисциплиной наших солдат, но ещё больше - спокойствием сальвадорского правительства и солдат, которые, за исключением нескольких мелких инцидентов, избегали прямого вмешательства против нас. В знак признания их терпимости мы направим официальные извинения и небольшую денежную компенсацию, чтобы сохранить хорошие отношения между нами."
honduras.118.a: "Сейчас мы мало что ещё можем сделать."

honduras.119.t: "Гондурасцы уходят"
honduras.119.d: "После многих недель поисков в холмах и горах гондурасские силы захватили мятежников и направляются обратно в свою страну. Их правительство направило извинения и небольшую денежную компенсацию за хаос, причинённый их силами."
honduras.119.a: "Надеюсь, они больше не вернутся."

honduras.3.t: "Экстренное заседание Совета: Митинг Эрреры"
honduras.3.d: "Хотя Мануэль Каликс Эррера формально является членом Революционного совета, он всегда стоял несколько особняком. Перед экстренным заседанием по решению политического кризиса он провёл публичный митинг своих сторонников, чтобы заручиться поддержкой и продемонстрировать силу как армии, так и Совету. Действительно, многие шепчутся, что простая передача премьерства ему и его красногвардейцам могла бы вдохнуть жизненную силу в умирающую революцию."
honduras.3.a: "То, что нам нужно, ещё больше сильных личностей."

honduras.4.t: "Экстренное заседание Совета: Связи Кастро"
honduras.4.d: "Генерал Хосе Леон Кастро уже давно играет ключевую роль в мобилизации военной поддержки Совета, общаясь с различными офицерскими кликами и медленно формируя свою собственную группу лоялистов. Также хорошо известно, что, несмотря на антиамериканскую политику Революционного совета, он и другие члены поддерживают обширные контакты с United Fruit Company, которая всё ещё контролирует экономику. В Совете даже ходят слухи, что его влияние сделало бы военный режим предпочтительнее абсолютной потери власти, которая сопровождала бы серьёзные реформы."
honduras.4.a: "Так или иначе, Совет обречён."

honduras.5.t: "Мобилизация за демократию"
honduras.5.d: "Из-за дезертирства в армии подавление демонстраций стало гораздо более трудным. В результате сегодня в столице и по всей сельской местности прошли массовые митинги, поскольку народ Гондураса выразил свои истинные чувства недовольства режимом Совета..."
honduras.5.a: "Они взывают к свободе, которую им обещали."

honduras.6.t: "Экстренное заседание"
honduras.6.d: "Началось экстренное заседание Совета национального спасения, чтобы решить судьбу Крестьянской республики. Большая толпа собралась у зала заседаний Совета, и полиция не желает их разгонять. Первая задача Совета - избрать нового председателя, который определит повестку собрания. Члены Совета Эррера и Кастро едва не подрались из-за своих разных взглядов, и каждая сторона выдвигает дикие обвинения, в то время как советники Моралес и Кальехас сформировали единый фронт, выступая за роспуск Совета и его преобразование в выборный орган; в конечном счёте, кажется, есть лишь несколько вариантов..."
honduras.6.a: "Генерал Кастро будет председательствовать в Совете и введёт военное положение."
honduras.6.b: "Советник Эррера будет председательствовать в Совете и продвигать революцию."
honduras.6.c: "Все предложения о председательстве отклонены. Начать печать избирательных бюллетеней!"

honduras.11.t: "Выборы проходят"
honduras.11.d: "Проводятся экстренные выборы. Рамон Моралес и Венансио Кальехас - оба умеренные, обладающие относительной степенью популярности, которая может определить исход."
honduras.11.a: "Моралес вырывает победу!"
honduras.11.b: "Кальехас побеждает!"
honduras.11.c: "По правде говоря, выборы были сфальсифицированы с самого начала."

honduras.13.t: "Премьер Эррера берёт контроль"
honduras.13.d: "После устранения последних остатков оппозиции и назначения председателем совета приход к власти Мануэля Каликса Эрреры стал свершившимся фактом. Его новое государство обещает быть энергичным и прогрессивным и привести Гондурас в мир социализма XX века."
honduras.13.a: "Да здравствует народ!"

honduras.14.t: "Генерал Кастро берёт контроль"
honduras.14.d: "Сегодня генерал Хосе Кастро был приведён к присяге в качестве президента Гондураса и возведён в должность главы вооружённых сил. Как председатель ныне несуществующего Совета он фактически находился у власти несколько недель, но, похоже, только сейчас он чувствует себя достаточно уверенно, чтобы объявить о новой республике."
honduras.14.a: "Мы будем стоять твёрдо!"

#Totalism

HON_revolution: "Революция побеждает"
HON_revolution_desc: "Революционное государство поднимается, больше не Крестьянская республика, но теперь истинно Народная республика."
HON_callejas: "Премьер Эррера"
HON_callejas_desc: "Эрреристы и их революционная программа вышли на центральную сцену, и теперь начинается то, что они называют «перманентной революцией»."
HON_state_atheism: "Государственный атеизм"
HON_state_atheism_desc: "Хотя католицизм имеет глубокие корни, их необходимо выкорчевать, церковь - это орудие реакционной мысли."
HON_totalist_youth: "Красные рубашки"
HON_totalist_youth_desc: "Носим свои прекрасные красные рубашки, наше молодёжное крыло готово предоставить добровольцев для революции."
HON_patriotic_front: "Патриотический фронт"
HON_patriotic_front_desc: "Пока они согласны искоренить реакционную мысль в своих собственных рядах, эрреристы более чем готовы сформировать единый фронт с другими левыми."
HON_diplomatic_missions: "Организовать дипломатические миссии"
HON_diplomatic_missions_desc: "Один из первых проектов Эрреры - организация дипломатического корпуса для связи с синдикалистами по всему миру и обеспечения хороших отношений с ними."
HON_peace_in_our_time: "Мир в наше время"
HON_peace_in_our_time_desc: "Мир будет в наше время! Ну, кроме реакционеров."
HON_recognize_nicaragua: "Признать Никарагуа"
HON_recognize_nicaragua_desc: "Признав наших социалистических братьев на юге, мы можем обеспечить сотрудничество против реакционеров."
HON_purge_rightists: "Чистка правых"
HON_purge_rightists_desc: "О, да ладно, вы знали, что это будет."
HON_socialist_republic: "Социалистическая республика"
HON_socialist_republic_desc: "Хотя на самом деле это всего лишь формальность, официальное обозначение Гондураса как «социалистической республики», а не просто «республики», имеет жизненно важное церемониальное значение."
HON_Utopia: "Тоталистская утопия"
HON_Utopia_desc: "Был ли народ когда-либо счастливее или свободнее, чем под руководящей рукой премьера Эрреры? Нет, конечно нет."
HON_planned_economy: "Плановая экономика"
HON_planned_economy_desc: "Взяв под прямой контроль экономику, мы можем предотвратить экспорт жизненно важных ресурсов Гондураса и использовать их для собственных нужд."
HON_union: "Учредить профсоюзы"
HON_union_desc: "Учреждение самоуправляемых профсоюзов в Гондурасе под строгим руководством партии будет иметь важное значение для нашей новой экономики."
HON_tools_of_revolution: "Молот и серп"
HON_tools_of_revolution_desc: "Первый проект - расширить производство инструментов, чтобы обеспечить достаточное количество молотов, серпов и лопат для новой экономики."
HON_repatriate_americans: "Репатриировать американцев"
HON_repatriate_americans_desc: "Изгнать американскую мразь! Они слишком долго эксплуатировали народ!"
HON_begin_collectivization: "Коллективизация"
HON_begin_collectivization_desc: "Второй проект - захват банановых плантаций и частных ферм для создания нового урожая коллективных предприятий."
HON_seize_ufc_factories: "Захватить активы UFC"
HON_seize_ufc_factories_desc: "Третий проект - официально запретить United Fruit Company и всё, что с ней связано, чтобы разгромить капиталистическую систему в нашей стране."
HON_militarize_ufc: "Милитаризовать американскую собственность"
HON_militarize_ufc_desc: "Американская собственность будет преобразована в военные базы для Народной армии."
HON_strike: "Промышленный юнионизм"
HON_strike_desc: "Перевод профсоюзов с ферм на фабрики - четвёртый проект."
HON_transoceanic_railway: "Трансокеанская железная дорога"
HON_transoceanic_railway_desc: "Пятый проект - железная дорога от побережья до побережья - станет прекрасным символом нашего процветания и ценности революции."
HON_collective_farms: "Коллективное фермерство"
HON_collective_farms_desc: "Коллективное фермерство теперь хорошо налажено. Его необходимо массово расширять, чтобы прокормить наше растущее население."
HON_collective_housing: "Коллективное жильё"
HON_collective_housing_desc: "Чтобы обеспечить жильём всех людей Гондураса, мы должны упразднить семью и вместо этого поощрять людей совместно проживать в больших общежитиях с общим жилым пространством."
HON_end_rivalry: "Покончить с соперничеством"
HON_end_rivalry_desc: "Соперничество между нами должно закончиться, ибо кто мы, если не братья в стремлении к социализму?"
### Military Trees
## Army

HON_state_army: "Состояние армии"
HON_state_army_desc: "Мы всё ещё страдаем от последствий прошлогодней чистки армии. Если мы хотим поставить нашу армию на ноги, нам нужно начать оценку её состояния."
HON_military_roads: "Военная инфраструктура"
HON_military_roads_desc: "В Центральной Америке вам нужны не только винтовки и желание побеждать в войнах, вам также нужны припасы для этого. Суровая местность региона затрудняет создание цепочек поставок, поэтому мы должны подумать о расширении нашей инфраструктуры, чтобы не страдать от нехватки."
HON_mil_ind_complex: "Военно-промышленный комплекс"
HON_mil_ind_complex_desc: "Гондурасу нужно будет производить собственные военные материалы, если он надеется пережить грядущую бурю. Мы должны инвестировать в развитие малого военно-промышленного комплекса, чтобы кормить нашу военную машину."
HON_prof_army: "Профессиональная армия"
HON_prof_army_desc: "Профессиональная армия будет править бал в Центральной Америке! Мы не можем позволить себе тратить огромное количество живой силы, как Гватемала или Сальвадор, поэтому нам придётся полагаться на качество, а не на количество."
HON_stand_equi: "Стандартизированное снаряжение"
HON_stand_equi_desc: "У нас нет стандартной винтовки, и мы в основном используем остатки, которые Испания была так любезна разрешить нам купить дёшево несколько лет назад. Нам нужно это изменить, поэтому мы начнём испытания винтовок, чтобы принять одну модель в качестве стандартной."
HON_heavy_equi: "Тяжёлое снаряжение"
HON_heavy_equi_desc: "Нам нужны не только винтовки, но и тяжёлые орудия для обстрела позиций врага. Мы инвестируем в артиллерию, чтобы враг никогда не чувствовал себя в безопасности ни на поле боя, ни в окопах."
HON_chain_command: "Организованная цепочка командования"
HON_chain_command_desc: "Наша нынешняя цепочка командования в лучшем случае туманна и неэффективна, особенно после наших армейских чисток. Необходима реструктуризация, чтобы обеспечить чёткую командную иерархию и позволить нашим солдатам перегруппировываться под началом другого командующего офицера."
HON_smart_officers: "Обученные офицеры"
HON_smart_officers_desc: "Наши офицеры сейчас едва ли что-то знают о формальной военной доктрине. Нам придётся официально обучать их гондурасскому способу ведения войны, если мы хотим иметь хоть какой-то шанс против наших врагов."
HON_loyal_army: "Лояльная армия"
HON_loyal_army_desc: "Наша лояльная армия является основой вооружённых сил нации; ну, чем была бы лояльная армия, если бы не кучка непатриотичных солдат, ожидающих мятежа и полностью лишённых лояльности нации! Мы должны разобраться с этой чернью."
HON_irregular_army: "Нерегулярная армия"
HON_irregular_army_desc: "Мы не можем надеяться сравниться с нашими врагами в обычной войне. Поэтому мы должны мыслить нестандартно, чтобы выманить их с традиционных полей сражений."
HON_autonomous_officers: "Автономные офицеры"
HON_autonomous_officers_desc: "Наши офицеры должны обладать достаточной автономией, чтобы адаптироваться к боевым ситуациям без связи с высшим командованием. Мы предоставим им эту автономию и научим их, что делать, если они окажутся отрезанными."
HON_adapt_terrain: "Адаптация к местности"
HON_adapt_terrain_desc: "Суровая местность в Центральной Америке оказывается коварной для наших людей. Мы должны научить их адаптироваться в различных условиях. География должна быть нашим союзником, а не врагом!"
HON_guerilla_tactics: "Партизанская тактика"
HON_guerilla_tactics_desc: "Мы не можем надеяться сравниться с Гватемалой или Сальвадором в открытом бою. Нам придётся сражаться умно, заманивать их в засады и тщательно выбирать сражения. Дух партизанской борьбы следует этим идеям, и это доктрина, которой мы будем следовать."
HON_guerilla_spirit: "Партизанский дух"
HON_guerilla_spirit_desc: "Нам нужна не только тактика, нам нужен также боевой дух! Наши солдаты должны быть готовы сделать всё необходимое для победы, будь то честно или иначе..."
HON_large_army: "Большая армия"
HON_large_army_desc: "Большая армия - единственный способ победить никарагуанцев с их меньшей численностью и сдерживать сальвадорцев и гватемальцев, которые превосходят нас численностью. Если мы не сможем прикрыть весь фронт, у нас не будет шанса."
HON_Inf_equi_buy: "Импорт снаряжения"
HON_Inf_equi_buy_desc: "Закупка иностранного снаряжения долгое время была источником жизненной силы нашей армии, поскольку нам не хватает значительных внутренних мощностей для производства собственного."
HON_inf_equi_build: "Местное производство"
HON_inf_equi_build_desc: "Мы не можем вечно зависеть от иностранного импорта. Нам нужно сделать шаг к самодостаточности и начать собственное местное производство винтовок."
HON_finish_reform_prof: "Успешная профессионализация"
HON_finish_reform_prof_desc: "Наши усилия по профессионализации начинают приносить результаты. Наши офицеры входят в число лучших на континенте, а наша цепочка командования стабильна, как у любой европейской армии."
HON_finish_reform_irreg: "Успешное расширение"
HON_finish_reform_irreg_desc: "Наши усилия по расширению начинают приносить успех. Теперь наша армия хорошо оснащена и способна удерживать весь фронт."
HON_mil_research: "Военные исследования"
HON_mil_research_desc: "Независимо от нашего выбора в области доктрины, нельзя отрицать, что у нас не хватает специалистов и техников, чей опыт мог бы дать нам преимущество в конфликте. Нам нужно начать привлекать их на службу нашему делу!"


## Air Force
HON_air_founding: "FAH"
HON_air_founding_desc: "Наше высшее военное командование официально ввело в строй Гондурасские военно-воздушные силы (Fuerza Aérea Hondureña), чтобы подняться в небо против наших врагов."
HON_air_lads: "Лётные офицеры"
HON_air_lads_desc: "В Тегусигальпе сформирован авиационный корпус из храбрых пилотов-добровольцев, чтобы проложить путь для более осторожных новобранцев."
HON_defend_land: "Наземная ПВО"
HON_defend_land_desc: "Недавно закупленное зенитное оружие сможет защитить наш горизонт от вражеских самолётов, обеспечивая безопасность наших центральных районов."
HON_airfield: "Аэродром Тегусигальпы"
HON_airfield_desc: "Мы расчистили землю под взлётно-посадочные полосы для размещения современного воздушного флота для самообороны."
HON_fighter: "Истребители для FAH"
HON_fighter_desc: "Надёжные истребители необходимы для встречи и уничтожения бомбардировщиков, вторгающихся в нашу родину. Тем героям приходится нелегко."
HON_cas: "Штурмовики для FAH"
HON_cas_desc: "Многоцелевая непосредственная авиационная поддержка помогает нам защищать наши конвои и воздушные операции."
HON_bomber: "Бомбардировщики для FAH"
HON_bomber_desc: "Мечта о безопасном обеспечении победы с воздуха наконец осуществилась для FAH."
HON_air_protecc: "Защита неба"
HON_air_protecc_desc: "Мы должны мобилизовать наших граждан для защиты критически важных складов от авиаударов, а также для охраны наших границ."
HON_naval_air_coord: "Морская авиационная координация"
HON_naval_air_coord_desc: "Высшее военное командование наконец признало равный статус FAH в военной координации и планировании."
HON_naval_bomber: "Морские бомбардировщики для FAH"
HON_naval_bomber_desc: "Специально сконструированные бомбардировщики, способные уничтожать военные корабли, когда-нибудь спасут наши шкуры."

## Navy
HON_navy: "FNH"
HON_navy_desc: "Наше высшее военное командование официально ввело в строй Гондурасские военно-морские силы (Fuerza Naval Hondureña), чтобы отвоевать наше побережье у империалистов."
HON_port: "Порт Амапала"
HON_port_desc: "Маленький порт Амапала на протяжении десятилетий служил Гондурасу в торговле, но теперь он будет полностью милитаризован для обеспечения безопасности её народа."
HON_destroyer: "Эсминцы для FNH"
HON_destroyer_desc: "Эсминцы необходимы для защиты нашей торговой мощи в Карибском бассейне."
HON_submarine: "Подводные лодки для FNH"
HON_submarine_desc: "Новейшие герметичные подводные суда вселят страх в сердца империалистических захватчиков."
HON_cruiser: "Флагман FNH"
HON_cruiser_desc: "Крупный боевой корабль покажет миру, что Гондурас является мировым лидером в области военно-морских технологий."
HON_naval_lads: "Морские офицеры"
HON_naval_lads_desc: "Разработан профессиональный режим подготовки, чтобы помочь новым морским офицерам перейти от церемониальных к функциональным ролям."
HON_merchant_navy: "Торговый флот Гондураса"
HON_merchant_navy_desc: "Использование гражданских лиц в нашей военно-морской сети поможет нашей способности проецировать силу вовне, позволяя нам сосредоточить моряков нашего флота там, где они действительно нужны."
HON_coast_protecc: "Защита береговой линии"
HON_coast_protecc_desc: "Ни один захватчик больше никогда не высадится в нашей стране, какой бы ни была цена."

