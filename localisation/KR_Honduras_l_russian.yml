### Leaders ###
POLITICS_HONDURAN_COUNCIL_DESC: "Отставка президента Андино в 1933 году, последовавшая за взятием столицы крестьянскими мятежниками, вызвала шок по всему Гондурасу. После революции к власти пришла коалиция амбициозной интеллигенции и военных, которая провела «великую чистку» инакомыслящих и проамериканских элементов. Однако даже они не смогли устоять перед соблазном United Fruit Company и её мертвой хваткой на гондурасской экономике. Ныне находящаяся в серьёзном упадке «Крестьянская республика» держится, используя военную силу для контроля над хрупкими транспортными связями по всей стране, и практически утратила контроль."
POLITICS_SAM_ZEMURRAY_DESC: "Сэмюэл Земуррей прожил жизнь, более глубоко переплетённую с Центральной Америкой, чем большинство других американцев в истории. Родившись под именем Шмуэль Змурри в Бессарабии во времена правления бывшей Российской империи в 1877 году и иммигрировав на американский Юг в юном возрасте со своей еврейской семьёй, Земуррей привык к путешествиям смолоду. Он вошёл в мир бизнеса до двадцати лет, впервые попробовав банан в 16 лет в Мобиле, штат Алабама, что определило его путь к тому, чтобы стать «Сэмом - банановым человеком». Ответственный за перевороты и политический подрыв в Гондурасе и Гватемале после начала своей метеоритной карьеры в United Fruit Company, деловая хватка Земуррея почти не имеет себе равных в мире торговли фруктами. После хаоса Второй американской гражданской войны он попытал удачи за морем и бежал в Гондурас, чтобы заявить права на «Перешейке возможностей». Теперь, достигнув своей конечной цели - доминирования над одной из старых банановых республик благодаря своему возвышению до правителя Гондураса, Земуррей и UFC будут неустанно трудиться, чтобы усилить хватку конгломерата над Центральной Америкой."
#Ideas
HON_peasant_republic: "Крестьянская республика"
HON_peasant_republic_desc: "Гондурас является «крестьянской республикой»; то есть ею управляет совет от имени крестьянства, и её официальное название - Крестьянская и рабочая республика Гондураса. Однако на практике это правительство находится в состоянии упадка и перестало представлять народ."
HON_december_revolution: "Декабрьская революция"
HON_december_revolution_desc: "Декабрьская революция произошла в 1932 году, когда крестьяне заняли столицу, и рыхлая коалиция различных группировок взяла власть как «Крестьянский совет Гондураса». Теперь революция считается одними провалившейся, а другими - недостаточно радикальной..."
HON_great_purge: "Великая чистка"
HON_great_purge_desc: "Великая чистка была массовым преследованием членов вооружённых сил, в первую очередь гондурасской армии, имевших связи с Америкой. Хотя коммерческие реалии ситуации означали, что американское влияние должно было просочиться обратно, а доктрина Монро остаться в силе, это всё равно нанесло урон гондурасской армии, что... возможно, можно считать чем-то."

