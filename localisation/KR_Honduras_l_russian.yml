HON_empowering_workers_idea: "Расширение прав и возможностей рабочих"
HON_empowering_workers_idea_desc: "Мы должны работать над укреплением положения простого рабочего в Гондурасе, чтобы обеспечить справедливые и надлежащие условия труда и почтить тех, кто усердно работает, чтобы государство оставалось маяком экономической активности."

HON_naval_production_idea: "Защита нашей страны"
HON_naval_production_idea_desc: "Недавнее разрешение на создание военно-морского флота открыло дух для многих, кто начал вступать в него, чтобы испытать воды, и помогает повысить эффективность нашего небольшого флота."

#Events
honduras.200.t: "Состояние армии"
honduras.200.d: "Армия Гондураса немногочисленна и в настоящее время страдает от острой нехватки компетентного руководства из-за произошедших чисток офицеров, связанных с Америкой. Существует две основные конкурирующие школы мысли, стремящиеся исправить этот недостаток: одна предлагает профессионализировать армию, сделав её небольшой и элитной, с очень строгим отбором, в то время как другая выступает за большую армию, полностью сосредоточенную на обороне, а не на наступательных операциях за пределами Гондураса."
honduras.200.a: "Направьте громкий конец на другого парня."

honduras.201.t: "Приобретение тяжёлого вооружения"
honduras.201.d: "Некоторые жизнерадостные продавцы сделали различные предложения о приобретении артиллерийских орудий, достаточных для оснащения нескольких рот поддержки для армии Гондураса. Стоит ли нам заключать сделку? И если да, то с кем?"
honduras.201.a: "Тот милый американский парень!"
honduras.201.b: "Немец в шляпе."
honduras.201.c: "Человек из Японии."
honduras.201.e: "Тот самый настоящий английский парень."

honduras.202.t: "Адаптация к местности"
honduras.202.d: "Гондурас и Центральная Америка в целом имеют большое разнообразие ландшафтов. В наших горных регионах мы можем обучить пехоту ходьбе на лыжах для улучшения мобильности или научить их специальной тактике боя в джунглях. Как вариант, мы могли бы принять сбалансированный подход и попытаться создать вездеходную армию."
honduras.202.a: "Лыжные войска обеспечат безопасность наших южных регионов."
honduras.202.b: "Война в джунглях победит на севере."
honduras.202.c: "Сбалансированный подход - лучший."

honduras.203.t: "Приобретение пехотного снаряжения"
honduras.203.d: "Торговцы оружием всегда ведут хороший бизнес в Гондурасе. Они должны! В противном случае они будут вести хороший бизнес с Никарагуа!"
honduras.203.a: "Прошу! Мистер Арисака!"
honduras.203.b: "Позвоните немцам!"
honduras.203.c: "Узнайте, открыты ли англичане для бизнеса."

honduras.210.t: "Приобретение истребителей"
honduras.210.d: "Воздушная мощь станет краеугольным камнем современной эпохи, как говорят. Как нам поспевать за временем?"
honduras.210.a: "Купить немецкие."
honduras.210.b: "Купить американские."
honduras.210.c: "Купить японские."
honduras.210.e: "Купить британские."

honduras.211.t: "Приобретение штурмовиков"
honduras.211.d: "Авиационная поддержка - жизненно важная часть возможностей любых военно-воздушных сил. Где нам следует искать возможности для создания собственных?"
honduras.211.a: "Купить японские."
honduras.211.b: "Купить немецкие."
honduras.211.c: "Купить канадские."
honduras.211.e: "Купить британские."

honduras.212.t: "Приобретение бомбардировщиков"
honduras.212.d: "Бомбардировка - жизненно важная часть любых военно-воздушных сил. Где нам взять наш бомбардировочный флот?"
honduras.212.a: "Купить японские."
honduras.212.b: "Купить немецкие."
honduras.212.c: "Купить канадские."
honduras.212.e: "Купить британские."

honduras.213.t: "Приобретение морских ударных самолётов"
honduras.213.d: "Морское бомбометание - критически важная возможность для военно-воздушных сил морской нации. Где нам приобрести собственные возможности в этой области?"
honduras.213.a: "Купить японские."
honduras.213.b: "Купить немецкие."
honduras.213.c: "Купить канадские."
honduras.213.e: "Купить британские."

honduras.220.t: "Оснащение военно-морского флота Гондураса - эсминцы"
honduras.220.d: "Пара эсминцев станет идеальным дополнением к военно-морскому арсеналу Гондураса. Где нам их приобрести?"
honduras.220.a: "Купить их за границей."
honduras.220.b: "Запросить пару у Союза Британии."
honduras.220.c: "Построить свои собственные!"

honduras.221.t: "Оснащение военно-морского флота Гондураса - подводные лодки"
honduras.221.d: "Подводные лодки могут дать нашему флоту возможность сражаться выше своего веса в бою. Где нам их взять?"
honduras.221.a: "Купить их за границей."
honduras.221.b: "Построить свои собственные!"

honduras.222.t: "Оснащение военно-морского флота Гондураса - крейсеры"
honduras.222.d: "Строительство крейсера, который будет служить флагманом военно-морского флота Гондураса, будет жизненно важно для будущего нашей военно-морской мощи."
honduras.222.a: "Время приступить к работе!"

### Tooltips
honduras_revolution_tt: "§CТоталисты захватили правительство§!"
HON_better_trait_natpop: "§GНаш дорогой лидер получит хорошую черту.§!"
HON_american_reinforcements: "Две дивизии морской пехоты будут отправлены для защиты нашей нации."

honduras_destroyers_tt: "Два эсминца технологического уровня 1919 года появятся на нашем тихоокеанском побережье."
honduras_submarines_tt: "Две подводные лодки технологического уровня 1919 года появятся на нашем тихоокеанском побережье."

#FOCII

#Castro
HON_monzada: "Генерал Кастро"
HON_monzada_desc: "Генерал Хосе Леон Кастро был приведён к власти правдой или неправдой, и Гондурас теперь вступает в эру военной диктатуры - всё во имя укрепления нации против чужаков!"
HON_corruption: "Заставить замолчать оппозицию"
HON_corruption_desc: "Нелояльная оппозиция попыталась помешать генералу Кастро восстановить порядок в республике. Проблема Гондураса всегда заключалась в отсутствии единого направляющего голоса. Пришло время решить эту проблему."
HON_root_out_socialists: "Смерть социалистам"
HON_root_out_socialists_desc: "Нет вежливого способа выразить это: социалисты должны умереть, если Гондурас хочет избежать революции и безумия, которые поразили его в начале 1930-х годов."
HON_endcorruption: "Очистить коррумпированных чиновников"
HON_endcorruption_desc: "Коррупция эндемична в консульской бюрократии. Искоренив её и заменив стратократической системой военного правительства, мы сможем поддерживать надлежащую дисциплину."
HON_corporate_economics: "Корпоративная экономика"
HON_corporate_economics_desc: "Используя корпоративную власть, Гондурас может стать сильнее. Сотрудничество с такими компаниями, как United Fruit Company, позволит нам осуществлять контроль над рынком."
HON_roads: "Трансокеанская железная дорога"
HON_roads_desc: "Построив железную дорогу, соединяющую два океана, мы можем улучшить наше торговое здоровье, а также соединить наши города, чтобы лучше открыть наши рынки для бизнеса."
HON_allow_UFC: "Помочь UFC"
HON_allow_UFC_desc: "Деятельность United Fruit Company была, к сожалению, ограничена заблудшим старым правительством. Пока они оставались активными, их влияние и способность расширяться были затруднены. Чтобы обеспечить будущее Гондураса, мы должны исправить это."
HON_i_love_the_ufc: "Связи с UFC"
HON_i_love_the_ufc_desc: "Учитывая, что UFC намеревается расширить свои инвестиции в нашу новую, благоприятную для бизнеса экономику, мы должны углубить наши связи с UFC."
HON_banana_industry: "Богат калием"
HON_banana_industry_desc: "Знаете ли вы, что бананы полезны для здоровья? Что ж, теперь знаете! В Гондурасе нужно выращивать больше бананов, выпрямлять и экспортировать их для роста её экономики."
HON_fruity_future: "Принудительный труд"
HON_fruity_future_desc: "Похоже, некоторые из наших людей не согласны с нашей политикой столь тесного сотрудничества с UFC ради продажи бананов всем и вся. У нас есть решение этой проблемы: кнут!"
HON_economic_prosperity: "Экономический бум"
HON_economic_prosperity_desc: "Рост экономики, вызванный нашим энергичным подходом к бананам, позволит нам также развивать наши важные отрасли."
HON_autocratic_republic: "Автократическая республика"
HON_autocratic_republic_desc: "Хватит этой чепухи о «крестьянской республике». Мы возвысим генерала Кастро до титула Верховного автократа и покончим с этой демократической глупостью."
HON_secure_the_state: "Обезопасить государство"
HON_secure_the_state_desc: "Хотя Великая чистка была проведена несовершенно и унесла много несправедливых жизней, новая диктатура Кастро гораздо более благосклонна. Вместо смерти инакомыслящим найдут работу на наших самых отдалённых банановых плантациях!"
HON_cult_of_personality: "Культ личности"
HON_cult_of_personality_desc: "Вы говорите «культ», как будто это плохо. Генерал Кастро справедливо почитается и обожается за свою благожелательность."
HON_border_patrol: "Пограничные патрули"
HON_border_patrol_desc: "После пограничного столкновения с Сальвадором и Никарагуа необходима дисциплина, чтобы мы не проиграли ещё одно. Более того, мы должны создать, обучить и оснастить надлежащую пограничную охрану."
HON_dead_beast: "О смерть, где твоя победа?"
HON_dead_beast_desc: "О могила, где твоё жало? Никарагуа пала перед нашей мощью!"
HON_destroy_the_revolution: "Идеологический крестовый поход"
HON_destroy_the_revolution_desc: "Великий крестовый поход должен теперь начаться по всей Центральной Америке - грандиозная пропагандистская кампания, чтобы напомнить людям о зле социализма."
HON_allow_free_press: "Свобода прессы?"
HON_allow_free_press_desc: "Генерал Кастро, конечно, поддерживает свободу слова и прессы. Разумеется, при условии, что они говорят о нём хорошие вещи."

#DEMOCRATS
HON_galvez: "Председатель Кальехас"
HON_galvez_desc: "Кальехас победил на свободных и честных выборах и теперь приступит к программе рыночных реформ."
chairman_galvez: "Венансио Кальехас является председателем"
chairman_moralez: "Рамон Вильеда Моралес является председателем"
HON_better_coffee: "Расширить кофейную промышленность"
HON_better_coffee_desc: "Кофе уже хорошо поставляется остальным миром, но расширение нашего бизнеса в этом секторе станет началом диверсификации нашей экономики, зависящей от бананов."
HON_bigger_roads: "Улучшить инфраструктуру"
HON_bigger_roads_desc: "Расширение инфраструктуры жизненно важно для будущего Гондураса как современной нации."
HON_lower_taxes: "Снизить налоги"
HON_lower_taxes_desc: "Снижение налогов для всех - от беднейших до богатейших - возможно, сделает государство немного беднее, но обогатит наш народ и высвободит средства для их инвестиций."
HON_cooperate_ufc: "Сотрудничать с UFC"
HON_cooperate_ufc_desc: "Мы должны установить отношения с UFC, но основанные на взаимном уважении и обмене, а не на эксплуатации и враждебности."
HON_labor_regulations: "Трудовое регулирование"
HON_labor_regulations_desc: "Администрация Кальехаса ввела в Конгрессе Гондураса трудовые нормы для детей и женщин, а также установление восьмичасового рабочего дня. Принятие Конгрессом этих законов ознаменует монументальное изменение в трудовом законодательстве Гондураса."
HON_agricultural_school: "Панамериканская сельскохозяйственная школа"
HON_agricultural_school_desc: "Создав школу для всех стран Америки для изучения новейших методов ведения сельского хозяйства, мы сможем улучшить наши методы, укрепить наши международные связи и углубить наше понимание химии."
HON_press_freedom: "Увеличить свободу прессы"
HON_press_freedom_desc: "По-настоящему свободная пресса необходима для по-настоящему свободного Гондураса!"
HON_modernize_the_state: "Модернизировать государство"
HON_modernize_the_state_desc: "Бюрократические реформы должны быть продвинуты, чтобы защитить либерализм в Америке."
HON_neighbours: "Возлюби ближнего своего"
HON_neighbours_desc: "В эти трудные времена христианские ценности, разделяемые многими гондурасцами, - одни из немногих вещей, которые все мы должны лелеять."
HON_lasting_democracy: "Да здравствует демократия"
HON_lasting_democracy_desc: "Здесь, в Гондурасе, мы построим демократию, которой будет завидовать вся Центральная Америка! Да здравствует республика!"
HON_education: "Образовательная реформа"
HON_education_desc: "Предоставляя значительные стимулы для привлечения иностранных учителей, мы можем улучшить образование нашей молодёжи, постепенно реформировать нашу школьную систему и улучшить наши исследования."
HON_urbanization: "Урбанизировать сельскую местность"
HON_urbanization_desc: "Поощряя переселение в города, мы будем развивать экономику и население Гондураса, а также сделаем себя менее сельскими и менее зависимыми от фруктов."
HON_peace_security: "Мир и безопасность"
HON_peace_security_desc: "Мир и безопасность - два лозунга нашего правительства. Где бы ни проводилась политика, она должна способствовать миру и безопасности."
HON_free_market: "Свободная рыночная экономика"
HON_free_market_desc: "Мы должны освободить наш бизнес от бессмысленных бюрократических проволочек. Чем свободнее рынок, тем свободнее люди!"

HON_ufc_plantations: "Американские друзья"
HON_ufc_banned: "UFC удалена"
HON_monzadas_revolution: "Чистое правительство"
HON_urban_growth: "Урбанизация"
HON_red_youth: "Красные рубашки"
HON_peacenik: "Мир в наше время"
HON_callejas_revolution: "Революция"
HON_church_property: "Церковное имущество конфисковано"
HON_coffee_cash: "Прибыль от кофе"

HON_morales: "Председатель Моралес"
HON_morales_desc: "Моралес победил на свободных и честных выборах и теперь приступит к программе столь необходимых социальных реформ."
HON_agrarian_reform: "Земельная реформа"
HON_agrarian_reform_desc: "Перераспределение земли безземельным - жизненно важный шаг для обеспечения всеобщего процветания."
HON_industrial_developement: "Индустриальное развитие"
HON_industrial_developement_desc: "Финансируя промышленное развитие, Гондурас более чем способен достичь большого богатства для себя."
HON_expand_bananas: "Расширить производство бананов"
HON_expand_bananas_desc: "Скромный банан - жизненно важная часть экономики Гондураса. Поощряя мелкие плантации к расширению производства, мы можем развивать этот сектор нашей экономики, не прибегая к уступкам United Fruit Company."
HON_let_do: "Экономика свободы"
HON_let_do_desc: "Свобода покупать и продавать, без оказания предпочтения крупному бизнесу, является важной основой нашей стратегии по принесению свободы гондурасскому народу."
HON_press_regulations: "Свободная пресса"
HON_press_regulations_desc: "По-настоящему свободная пресса необходима для по-настоящему свободного Гондураса!"
HON_southern_friends: "Завоевать южную периферию"
HON_southern_friends_desc: "Ища друзей за рубежом, мы можем защитить себя от тех, кто мог бы на нас охотиться. Начнём с юга."
HON_border_solve: "Гарантировать северную границу"
HON_border_solve_desc: "Гарантирование границ нашего северного соседа и побуждение его сделать то же самое - жизненно важный шаг к миру в наше время."
HON_combat_ufc_influence: "Подорвать монополию UFC"
HON_combat_ufc_influence_desc: "Независимые производители фруктов, защищённые от головорезов UFC, могут выращивать наши бананы без эксплуатации и страданий, которые приходят с корпоративной экономикой."
HON_workers_union: "Продвигать создание профсоюзов"
HON_workers_union_desc: "Поощряя профсоюзы и мирный диалог с работодателями, мы можем улучшить условия труда по всей стране."
HON_schools: "Расширить образование"
HON_schools_desc: "Значительная часть нашего населения всё ещё неграмотна, что сдерживает нашу экономику и интеллектуальную жизнь. Мы должны решить эту проблему с помощью целевых государственных инвестиций."
HON_social_welfare: "Защищать безработных"
HON_social_welfare_desc: "Безработные, больные, пожилые. Все эти люди нуждаются в нашей защите, если они хотят процветать."
HON_human_rights: "Установить права человека"
HON_human_rights_desc: "Принимая хартию основных прав человека и закрепляя её в законе, мы можем помочь создать институциональную основу для защиты людей ещё долго после окончания этого правительства."
HON_stronghold: "Оплот либерализма"
HON_stronghold_desc: "Гондурас останется оплотом либерализма на долгие годы, продвигая достоинство, равенство и братство всех людей."
HON_motto: "Суверенный, независимый и свободный"
HON_motto_desc: "Мы больше никогда не склоним головы перед тиранами, мы сейчас и навсегда суверенны, независимы и свободны."

HON_The_Bananas_Must_Flow: "Бананы должны течь"
HON_The_Bananas_Must_Flow_desc: "Социалисты попытались взять контроль, они попытались бросить вызов UFC. Это было их последней ошибкой; теперь, когда нанятая Земурреем бригада наёмников прошла маршем на Тегусигальпу, власть UFC будет железной. Поскольку UFC находится под прямым контролем, Земуррей решил не повторять ошибок прошлого."
HON_Expand_Banana_Plantations: "Расширить банановые плантации"
HON_Expand_Banana_Plantations_desc: "Бананы - длинный жёлтый фрукт, богатый калием, и основа экономики Гондураса. Поскольку Земуррей управляет государством, он проследит, чтобы наша основная товарная культура процветала и приносила значительное количество денег."
HON_Irrigation_Schemes: "Ирригационные схемы"
HON_Irrigation_Schemes_desc: "Бананам нужна вода для роста, а для доставки воды на плантации нам нужна инфраструктура! Изменение русел рек, прокладка надлежащих труб - всё это необходимо сделать, чтобы водоснабжение страны использовалось в полной мере."
HON_Pay_off_our_Rivals: "Подкупить наших соперников"
HON_Pay_off_our_Rivals_desc: "Некоторые люди всё ещё могут противиться нам, некоторые всё ещё могут претендовать на нашу землю, но кому какое дело?\n\nПросто подкупите их, достаточно зелени в их карманах, несомненно, заставит их замолчать и убраться с наших глаз."
HON_Stop_Fucking_up_Buisness: "Хватит портить бизнес!"
HON_Stop_Fucking_up_Buisness_desc: "Земуррей не из тех, кто будет молчать, когда что-то делается неправильно. Даже несмотря на то, что UFC у руля, некоторые паршивые бюрократы продолжают портить наш бизнес. Мы сделаем так, чтобы Гондурас управлялся правильно, управлялся как бизнес."
HON_Choke_Cooperatives: "Придушить кооперативы"
HON_Choke_Cooperatives_desc: "Паршивые красные продолжают портить дела UFC своими «забастовками» и «вооружёнными восстаниями». Довольно! Красные уже однажды разрушили Гондурас, и мы, чёрт возьми, не позволим им сделать это снова!"
HON_Control_the_Railroads: "Контролировать железные дороги"
HON_Control_the_Railroads_desc: "Как все дороги ведут в Рим, так и все железнодорожные линии будут вести в Тегусигальпу. У UFC глубокие карманы, и они используют эту зелень, чтобы каждая железнодорожная линия, каждый поезд, идущий от Панамы до Гватемалы, так или иначе контролировались UFC."
HON_Build_up_Honduras: "Подъём Гондураса"
HON_Build_up_Honduras_desc: "Не заработаешь денег, когда все голодают, хотят есть и болеют. Итак, давайте построим достаточно домов, больниц и центров отдыха, чтобы наше население было не просто здоровым, но и счастливым. Хотя это лучше всего для зарабатывания денег, это также поступок, исходящий из доброты сердца Земуррея."
HON_Eradicate_Disease: "Искоренить болезни"
HON_Eradicate_Disease_desc: "Плохая санитария и здравоохранение привели к тому, что сельскую местность Гондураса опустошают различные тропические болезни. Чтобы исправить это, Земуррей вложил значительные средства в хорошее здравоохранение и санитарию, чтобы сохранить здоровье гондурасцев, а паразитов и болезни - в бегах."
HON_Refuge_for_Jews: "Убежище для евреев"
HON_Refuge_for_Jews_desc: "Земуррей - человек еврейской веры и не из тех, кто будет смотреть, как его братья сталкиваются с бедами преследований и хаоса по всему миру. Пока Палестина отмечена войной между египтянами и османами, а Мадагаскаром правит безумный адмирал, отправляющий Божий избранный народ умирать ради удовлетворения своего эго, Гондурас станет убежищем здравомыслия и мира для всех евреев."
HON_Influence_Our_Neighbors: "Влиять на наших соседей"
HON_Influence_Our_Neighbors_desc: "Пока Земуррей занимает пост главы государства Гондурас, его United Fruit Company ведёт дела по всей Центральной Америке. По всей Центральной Америке UFC готова иметь больший контроль над странами, в которых она ведёт бизнес, чем их собственные правительства."
HON_Banana_Republicanism: "Банановый республиканизм"
HON_Banana_Republicanism_desc: "Гондурас, возможно, был первой банановой республикой, но UFC была вовлечена в дела по всей Центральной Америке. Мы должны использовать наши высокие связи для улучшения нашего государства и защиты Гондураса от социалистических орд."
HON_Rule_of_Money: "Процветание и прибыль"
HON_Rule_of_Money_desc: "«Сэм - банановый человек» теперь, пожалуй, самый богатый человек в Центральной Америке, и он не стесняется использовать богатство для улучшения нации или продвижения своих интересов. И хотя некоторые гондурасцы всё ещё недовольны тем, что их страной открыто управляет UFC, даже они должны признать, что Гондурас при Земуррее процветал так, как никогда раньше."
HON_Private_Welfare_System: "Частная система социального обеспечения"
HON_Private_Welfare_System_desc: "У нас куча денег, почему бы не поделиться? В конце концов, именно народ Гондураса поддерживает UFC на плаву. Хорошее здравоохранение, хорошие дома, асфальтированные дороги, счастливые люди, нация, работающая вместе. Мы преуспели там, где старое правительство потерпело неудачу!"
HON_Military_Modernization: "Военная модернизация"
HON_Military_Modernization_desc: "UFC много инвестировала в Гондурас, и для защиты своих инвестиций им нужно будет вложить немного больше. Используя глубокие карманы и связи UFC, гондурасские военные будут полностью переоснащены. Новое современное оборудование будет служить защите нации вместе с недавно нанятыми наёмниками. Это может быть дорого, но мы можем позволить себе эту цену."

##BANANERS##

hon_ufc.1.t: "Знакомое лицо возвращается в Гондурас"
hon_ufc.1.d: "Пока Вторая американская гражданская война бушует в вечно фрагментирующемся аду бывших Соединённых Штатов, беженцы из всех штатов бегут как на север, так и на юг, спасаясь от ужасов войны. Прямо через Мексиканский залив от умирающего Союза расположено наше гордое народное государство, и из-за этого прямого пути в Америку, близкого по морю, Гондурас принял более чем свою долю мигрантов. Одним из самых шумных и откровенных из этих бегущих лиц является Сэмюэл Земуррей, известный еврейско-американский эмигрант из России и ненасытный бизнесмен. Бежав от режима «Америка прежде всего» из своего дома в Новом Орлеане после разрыва с Хьюи Лонгом, а также от антисемитских друзей Союза в Серебряном легионе, Земуррей прибыл на лодке к нашим берегам с последней волной бегущих янки. Учитывая его прошлые связи с гондурасским переворотом, который закрепил господство UFC над нашей страной на десятилетия, Земуррей выбрал Гондурас в качестве места изгнания, возможно, стремясь повторить прошлые успехи на наших землях. С его прибытием наша администрация ожидает, что он быстро войдёт в высший круг гондурасского общества, учитывая его огромное богатство и деловую хватку, предыдущую историю и его репутацию поджигателя и интригана, ранее игравшего роль в предыдущей администрации, павшей с революцией. Мы пока позволим ему оставаться в наших границах, но будем следить за ним, чтобы обеспечить безопасность Революции!"
hon_ufc.1.a: "Мы должны сохранять бдительность с прибытием этой змеи."

hon_ufc.2.t: "Отрубание головы змее"
hon_ufc.2.d: "Нам надоело проповедование Сэмюэла Земуррея о капитализме на наших берегах и в наших городах. Мы должны обезглавить эту змею, если Революция хочет сохраниться в нашем гордом государстве. Даже сейчас гнусный змей вползает в щели нашей администрации, его огромное богатство и харизма несут его далеко в нашей, надо признать, коррумпированной бюрократии. Чтобы положить конец этому заражению, пока оно не вышло из-под контроля, председатель [tag.leadernamer] и его приспешники призвали арестовать этого негодяя, чтобы раз и навсегда отсечь голову этому капиталистическому зверю. Однако более умеренные и либеральные крылья нашего революционного конгресса стремятся уважать его права как беженца и лишь поддерживать наш строгий надзор за Земурреем. Окончательный выбор будет зависеть от голосования в палате, поскольку в конгрессе разгораются страсти по этому важному дебату."
hon_ufc.2.a: "Мы будем уважать его права как беженца и лишь наблюдать за ним издалека."
hon_ufc.2.b: "Арестовать этого капиталистического смутьяна немедленно."

hon_ufc.3.t: "Правительство выступает против Земуррея"
hon_ufc.3.d: "Сэмюэл Земуррей стоял в своём кабинете, вглядываясь в окно своего скромного дома в Манагуа, где он скрывался несколько недель. Услышав о возможном ходе лживого «революционного» правительства и их головорезов, стареющий бизнесмен уставился на город перед собой, чувствуя, что что-то не так в неподвижном ночном воздухе. Услышав слабый звук сирен вдалеке, его ум загорелся планами и схемами: Земуррей обдумывал план действий, одновременно лихорадочно упаковывая свои важные вещи. Он мог бы выбрать «безопасный» подход: быстро нанять лодку у местного докера и отплыть обратно в дружественные воды и Штаты. Хотя огонь гражданской войны всё ещё бушевал, возможно, он мог бы переселиться в Союзное государство, или если режим [TEX.getleader] окажется слишком нестабильным или враждебным к нему, он мог бы искать убежища у федералов или даже в Тихоокеанских штатах. В резком контрасте с этим альтернатива была бы гораздо более проактивной: Земуррей мог бы нанять местных наёмников и стрелков, чтобы они служили его свитой или отрядом, охраняя его от фальшивых революционных «красных» с помощью его горы зелёного капитала, оставшегося от его деловых предприятий. Хотя это рискованно, этот путь может сулить больше возможностей для старого капитана промышленности, поскольку потенциал экономического вмешательства в Центральную Америку был бы огромен, и без бюрократических проволочек, которые, несомненно, имело бы возможное благо от помощи в восстановлении послевоенной Америки. Земуррей должен думать на ходу, поскольку сирены, которые он слышит, начинают приближаться..."
hon_ufc.3.a: "Давайте поспешим обратно в Штаты, чтобы нажиться на eventual reconstruction!"
hon_ufc.3.b: "Гондурас теперь мой дом, я найму несколько вооружённых людей для защиты."

hon_ufc.4.t: "Земуррей нанимает наёмников"
hon_ufc.4.d: "Полиция прибыла к небольшому бунгало в полном составе, поднялась по лестнице с оружием наготове и ворвалась в парадную дверь, когда сирены и мигающие огни осветили сумерки. Когда полиция хлынула в комнату, их встретил не шквал выстрелов отчаявшегося человека, которого они так ожидали, а тишина и темнота в явно заброшенном доме. Пока полиция разрывала дом в поисках улик, Земуррей мчался по дороге к своему заранее определённому убежищу, ожидая неизбежного натиска стражей порядка, который скоро обрушится на него. По пути он связался со своими сообщниками, сообщив детали: несколько десятков местных головорезов и профессионалов были наняты охранять Земуррея и встретят его в убежище. Когда он мчался по главной дороге, вдалеке послышались новые сирены, более громкие и многочисленные, чем та небольшая группа, которой он едва избежал у своего бунгало. Он доберётся до места назначения как раз перед ними, и ему и его людям лучше быть готовыми к бою, когда они прибудут.\n\nКогда сумерки сменились ночью, Земуррей и его отряд молча притаились за подоконниками и мебелью, когда ослепительный свет фар засиял в передние окна, залив убежище Земуррея светом. Как только звук открывшейся первой полицейской машины раздался, по комнате разнёсся ряд металлических щелчков: преступники начали взводить свои пистолеты и карабины, готовясь к предстоящей битве. Когда звук шагов ведущего офицера обогнул внешний угол дома и остановился перед парадной дверью, ощутимое чувство тревоги и напряжения наполнило тёмную комнату. В мгновение ока дверь была выбита, и за ней последовал шквал горячего свинца, когда начался полный хаос и завязалась полномасштабная перестрелка. Революционная полиция, не зная о осином гнезде, которое они только что открыли, бросилась укрываться за бетонными блоками и полицейскими машинами, в то время как их ведущий офицер, открывший дверь, лежал в всё увеличивающейся луже собственной крови, зажимая огнестрельное ранение шеи, пока водоворот свинца и дыма продолжался. Окликнув своего ведущего офицера, который теперь лежал неподвижно в своей багровой луже у парадной двери убежища, остальная часть отряда запаниковала, осознав, что их командующий офицер пал, оставив контроль за принятием решения помощнику-новичку. Под огромным давлением он должен решить: отступить перед лицом этой неожиданной ответной реакции или удвоить ставки и привлечь Земуррея к ответственности, чтобы защитить Крестьянскую революцию Гондураса! Пока пули летят в воздухе, стекло и дым разлетаются повсюду, помощник должен сделать свой выбор!"
hon_ufc.4.a: "Отступить, он вооружён и нанял стрелков! Мы не прольём ещё невинную кровь сегодня."
hon_ufc.4.b: "Какие-то дешёвые наёмники не остановят прилив социализма! Ворваться в убежище и застрелить их!"

hon_ufc.5.t: "Столкновение красного и зелёного"
hon_ufc.5.d: "С полным провалом облавы на убежище Земуррея город Тегусигальпа и весь Гондурас в целом бушуют в лихорадочной истерии и панике, поскольку страна сотрясается от действий Земуррея. В то время как многие гондурасцы опасаются, что этот американец является предвестником гибели их социалистического рая, другие празднуют его прибытие как своего рода чемпиона капитализма и разрушения предполагаемой «коррупции» правительства. Администрация должна исправить ошибки своих неопытных офицеров и предотвратить повторение эпох американского господства. Поскольку Земуррей нанимает всё больше боевиков и партизан, уже вспыхивают бои, в крошечной стране Гондурас произошло столкновение цветов: зелёного - денег и жадности капиталиста и красного - праведной Революции рабочих! Поскольку первое настоящее сражение этой борьбы за власть быстро приближается, кто же восторжествует в этой дикой земле?"
hon_ufc.5.a: "Наёмники сдаются, Земуррей бежит!"
hon_ufc.5.b: "Земуррей даёт отпор и побеждает революционеров."

hon_ufc.6.t: "Красные разгромлены"
hon_ufc.6.d: "Доказав свою точку зрения и разгромив первую волну революционных «красных», Сэм Земуррей теперь сидит на вершине иерархии Гондураса, пусть даже неофициально и достигнув этого лишь через большое раздражение правящего режима. Выиграв первый раунд конфликтов с возглавляемыми элитой «революционерами», Земуррей мог бы заставить администрацию принять его прибытие и оставить его в покое, позволив ему сосредоточиться на своём бизнесе и отдыхе. Однако это не единственный его вариант; с недавней чередой побед за плечами Сэм Земуррей потенциально мог бы выдвинуть себя на передний план гондурасской политики и экономики, удвоив ставку на свои недавние действия, наняв больше наёмников и дальше тесня коррумпированное «крестьянское» правительство, пока не будут достигнуты реальные изменения. Поскольку будущее Гондураса потенциально висит на волоске, выбор теперь лежит исключительно на плечах Земуррея."
hon_ufc.6.a: "Отпустить их с предупреждением."
hon_ufc.6.b: "У меня довольно глубокие карманы, нанять ещё наёмников."

hon_ufc.7.t: "Наёмники Земуррея маршируют на Тегусигальпу"
hon_ufc.7.d: "С утверждённым планом действий и поставленной на карту судьбой Сэмюэл Земуррей собрал шокирующе огромную армию наёмников и наёмных сил, и сообщается, что они маршируют из глубинки Гондураса к его сердцу - самой Тегусигальпе. Трубя о своих недавних победах, Сэм Земуррей решил попытаться совершить переворот в правительстве Гондураса во второй раз в своей жизни, на этот раз стремясь сделать его постоянным. Навстречу им, чтобы организовать оборону, мчатся революционная гвардия и вооружённые силы Гондураса - гордые и ревностные революционные воины, готовые отдать свои жизни за нацию и дело. Предстоящая битва будет жестокой, но победитель может быть только один. С пронзительным криком артиллерийских залпов вдалеке, похоже, битва за душу Гондураса скоро нас настигнет."
hon_ufc.7.a: "Наёмники разгромлены! Земуррей бежит обратно в Соединённые Штаты."
hon_ufc.7.b: "Социалистический фронт рушится под натиском Земуррея!"

hon_ufc.8.t: "Новое правительство"
hon_ufc.8.d: "После своей недавней победы над псевдореволюционными псами, когда-то управлявшими этими землями, Сэмюэл Земуррей теперь стоит во главе гондурасского государства, успешно свергнув режим в этой стране во второй раз в своей жизни, навсегда закрепив свой след в регионе. Теперь, когда он держит бразды правления судьбой Гондураса, Земуррей должен решить, кто будет официальным лицом нации. Он может назначить дружественную хунту под руководством давнего соратника и уважаемого генерала Хосе Кастро, правя страной из тени, пока Кастро служит фронтменом нашей операции. В качестве альтернативы он может избежать своей прошлой ошибки - назначения посредника - и вместо этого взять прямой контроль над Гондурасом сам, устраняя любые недопонимания относительно того, кто на самом деле будет заправлять в правительстве. Окончательный выбор за ним, но независимо от этого Земуррей будет обладать большей частью власти при любой системе."
hon_ufc.8.a: "Назначить дружественную хунту под руководством Хосе Леона Кастро."
hon_ufc.8.b: "Земуррей берёт прямой контроль над Гондурасом!"

hon_ufc.9.t: "Хосе Кастро берёт власть"
hon_ufc.9.d: "Сэмюэл Земуррей повторил свои действия 1910-х годов и решил управлять Гондурасом из тени после организации своего переворота, оставив лицо нации и повседневные операции Хосе Кастро, знаменитому генералу, который привлёк внимание общественности после подавления крестьянских восстаний до возвышения псевдореволюционного правительства. Под его стальным присмотром Гондурас сбросит свою псевдореволюционную, элитарную оболочку и наденет мантию United Fruit Company, став маяком капиталистического излишества и американского влияния в Центральной Америке, одновременно разрушая институты относительно недолгого социалистического режима, предшествовавшего ему."
hon_ufc.9.a: "Мы будем сильны под руководством Кастро и UFC!"

hon_ufc.10.t: "Земуррей берёт прямой контроль над Гондурасом"
hon_ufc.10.d: "Стремясь избежать ошибок, преследующих его прошлое, особенно когда его предыдущий переворот 1912 года привёл к успешному господству United Fruit Company в Гондурасе до тех пор, пока рабочие и крестьянские волнения под руководством элитарных хозяев не подточили его основы, Сэмюэл Земуррей решил взять прямой контроль над Гондурасом. Благодаря своей знаменитой деловой хватке и острому интеллектуальному уму ожидается, что Земуррей будет управлять Гондурасом очень расчётливо, открывая двери ресурсов и плодородных земель Гондураса для UFC. «Банановый король» вернулся на высший пост Гондураса."
hon_ufc.10.a: "Да здравствует Банановый король!"

hon_ufc.11.t: "«Диктатор банановой индустрии»"
hon_ufc.11.d: "Поскольку его бизнес-империя уже простирает своё влияние по всему миру, с его возвращением в Гондурас и повторным приобретением UFC плодородной почвы и климата страны, Земуррей вернулся на мировую сцену как «Банановый король» или «Сэм - банановый человек», снова став доминирующей фигурой в мировой торговле бананами. С этими шагами деньги снова начали поступать рекой, поскольку состояние Земуррея экспоненциально расширялось. С заживлением ран Чёрного понедельника по всему миру спрос на жёлтые фрукты снова начал расти, а вместе с их ростом растут и власть, и богатство Земуррея."
hon_ufc.11.a: "И подумать только, что это просто жёлтый фрукт..."

hon_ufc.12.t: "UFC набирает силу в Центральной Америке"
hon_ufc.12.d: "По мере того как растут власть и состояние Земуррея, они растут и для United Fruit Company. Международный конгломерат с огромными резервами капитала и рабочей силы в своём распоряжении, UFC в целом быстро начала опережать сами страны Центральной Америки как доминирующая политическая сила в регионе. С их новыми источниками богатства UFC, а вместе с ней и Гондурас Земуррея, выдвинулись на передний план Центральной Америки, став доминирующим игроком на перешейке, и с их недавно завоёванной позицией они начали внедряться в администрации и экономики наших соседей. Это лишь вопрос времени, когда UFC станет лицом самой Центральной Америки..."
hon_ufc.12.a: "Амбиции UFC не знают границ."

hon_ufc.13.t: "Банановый доход"
hon_ufc.13.d: "Хотя другие ресурсы всегда были важны и исторически экспортировались из нашей страны в больших количествах, помимо бананов: орехи, рыба, текстиль, кофе и другие специи - вот лишь некоторые из крупных экспортных товаров, которые конкурировали с банановой промышленностью, но с приходом Земуррея на пост главы государства и, следовательно, с усилением доминирования UFC, бананы поднялись до уровня как нашего крупнейшего экспорта, так и самого прибыльного продукта. Пока рынок бананов остаётся сильным и востребованным, экономика Гондураса будет продолжать расти, и вместе с ней будет процветать Гондурас."
hon_ufc.13.a: "Золотой век, возвещённый золотым фруктом."

hon_ufc.14.t: "Восстановленные руины майя"
hon_ufc.14.d: "В своих экспедициях по поиску ресурсов или будущих мест для выращивания UFC наткнулась на участок земли, изобилующий старыми руинами майя. Первоначально намереваясь тихо сровнять участок с землёй, чтобы освободить место для новых банановых полей, Земуррей вмешался и объявил альтернативу: передать права на землю с руинами нашим соседям в Гватемалу как жест доброй воли и сотрудничества, а также заложить основу для будущих дружественных отношений с их режимом. Мы отправим предложение немедленно!"
hon_ufc.14.a: "С этими руинами мы закладываем основу для будущих отношений."

hon_ufc.15.t: "Предложение от UFC"
hon_ufc.15.d: "Мы получили весть от нового поддерживаемого американцами режима в нашем соседнем Гондурасе, которая заинтересовала как политиков, так и учёных в нашей администрации. Гондурасцы предложили право собственности на участок земли на их западных окраинах, который, как они утверждают, полон руин и артефактов давно заброшенного города майя! С этой новостью наша администрация ликует и собралась, чтобы подготовить ответ на этот дружественный жест сотрудничества. Наш кабинет, несомненно, примет сделку, и с её помощью мы не только получим право собственности на реликвии нашего далёкого прошлого, но и посадим семена сотрудничества между нашими двумя государствами."
hon_ufc.15.a: "Мы с благодарностью принимаем этот исторический дар."
hon_ufc.15.b: "Поместить лицо Земуррея на марку в знак благодарности."

hon_ufc.16.t: "Проекты для гондурасцев"
hon_ufc.16.d: "С недавним притоком капитала и власти UFC под руководством Земуррея приступила к новой серии программ развития, чтобы превратить эту глухомань в современное государство, которым мы можем гордиться. Начиная с множества новых жилых комплексов, пригородов и квартир, администрация решит жилищный кризис, который псевдореволюционеры обещали, но не смогли решить. Как только будут заложены основы для новых жилых единиц, мы перейдём к созданию новых центров отдыха и, что наиболее важно, новых общественных клиник, чтобы усеять ими страну, расширяя медицинское обслуживание и общественную радость по всему Гондурасу. Для облегчения транспортировки и связи всех этих новых проектов будут построены новые дороги и железнодорожные остановки, чтобы ещё больше связать Гондурас и укрепить его единство, а также усилить нашу власть над страной."
hon_ufc.16.a: "Земуррей и UFC отдадут долг нашей приёмной родине."

hon_ufc.17.t: "Евреи бегут в Гондурас"
hon_ufc.17.d: "С возвышением Сэмюэла Земуррея на пост главы государства Гондураса многие евреи со всего мира начали смотреть на Гондурас как на потенциальное убежище для своего народа, как из-за того, что сам Земуррей был еврейского происхождения, так и из-за мягкого отношения нации к религии и её народам. За последние несколько месяцев прибыли маленькие лодки и вагоны, полные еврейских иммигрантов, их число растёт экспоненциально с каждым прибытием, и многие начали селиться в новых районах застройки, построенных UFC, в поисках свободных земель и новых возможностей. Хотя их число относительно невелико, сейчас в Гондурасе живёт больше евреев, чем в любой другой стране Центральной Америки, и темпы их прибытия, похоже, не замедлятся в ближайшее время. Будет интересно посмотреть на их влияние на эту землю и на то, как они сольются с местным испаноязычным населением."
hon_ufc.17.a: "Новая земля бананов и кофе для Избранного Богом народа."

hon_ufc.18.t: "Отношения с Убико"
hon_ufc.18.d: "С момента нашего щедрого дара руин майя нашим соседям в Гватемале наши две страны ещё больше укрепили связи друг с другом, увеличив как объёмы торговли, так и дипломатические взаимодействия между нами. Из всех благородных государственных деятелей в их администрации никто не принял нашу делегацию теплее, чем Хорхе Убико, печально известный Наполеон Латинской Америки. Соглашаясь с нашей позицией в отношении UFC и акцентом нашей нации на порядке и милитаризме, Убико стал близким другом и Сэмюэла Земуррея, и Хосе Кастро; эти трое тесно сотрудничают друг с другом по сделкам и будущим планам. То, что эти титаны Центральной Америки совместно создадут, ещё предстоит увидеть, но любая лоза их сотрудничества, скорее всего, принесёт обильные плоды как для Гондураса, так и для Гватемалы и их народов."
hon_ufc.18.a: "Наполеон Центральной Америки едет с UFC."

hon_ufc.19.t: "Скупка железных дорог"
hon_ufc.19.d: "По мере того как их гегемония над Центральной Америкой растёт с каждым днём, United Fruit Company начала осуществлять свой план по покупке всех железных дорог, как частных, так и государственных, которые тянутся и извиваются по перешейку. Владея артериями региона, доминирование UFC будет обеспечено, а другие страны региона смогут лишь подчиняться требованиям UFC, чтобы просто перевозить товары в пределах своих собственных границ. Хотя скупка каждой последней железнодорожной линии потребует времени, усилий и огромного количества капитала, результаты будут монументальны в плане United Fruit Company по подчинению всей Центральной Америки своему сапогу."
hon_ufc.19.a: "Все пути ведут в Тегусигальпу."

hon_ufc.20.t: "Поддержка еврейских домов за рубежом"
hon_ufc.20.d: "С чудесной новостью о создании безопасной родины для еврейского народа на далёкой территории Аляски Сэмюэл Земуррей и другие евреи Гондураса ликуют, и в различных еврейских общинах и хуторах, разбросанных по нашей стране, начались празднества. Чтобы отметить это событие и поддержать дело, Земуррей отправил щедрые пожертвования в поддержку недавно созданного государства. Поскольку Гондурас является безопасной гаванью для тысяч евреев, а их собственный дом теперь находится на севере, будущее «Божьего избранного народа» ещё никогда не выглядело таким безопасным."
hon_ufc.20.a: "Рука об руку к Земле обетованной."

hon_ufc.21.t: "Полный корпоративный захват?"
hon_ufc.21.d: "Прошло много месяцев с тех пор, как UFC Сэмюэла Земуррея установила неоспоримую власть над Гондурасом после того, как социалистическая угроза попыталась погрузить страну в хаос. Хотя создание Свободного государства означало сохранение существующих правительственных структур Гондураса, но теперь укомплектованных лояльными людьми компании, некоторые не удовлетворены только этим. Поскольку наши тщательно выстроенные отношения с простыми людьми Гондураса медленно улучшались благодаря всем усилиям Сэма - бананового человека по модернизации и улучшению жизни простых гондурасцев, мы не можем рисковать, ставя под угрозу эту ситуацию. Хотя перспектива возвращения наследия старой Cuyamel Fruit Company Земуррея может показаться очень ностальгической некоторым его соратникам, такое решение не будет принято многими нашими гражданами. Однако решение лежит в руках Сэма Земуррея и только его. Так что же это будет?"
hon_ufc.21.a: "Ради старых времён, Компания станет Государством!"
hon_ufc.21.b: "Мы не можем рисковать, отчуждая наши отношения с гондурасцами."

hon_ufc.22.t: "Семейные узы Земуррея"
hon_ufc.22.d: "Хотя UFC - раньше просто Cuyamel Fruit Company или даже Hubbard-Zemurray Steam Ship Company до всего этого, во времена до того, как Сэм перебил цену своему партнёру Ашбеллу Хаббарду, чтобы начать свой личный подъём по корпоративной лестнице - долгое время была доминирующим интересом нашего патриарха и его жены, семья Земурреев не заперта исключительно в мире потребительского капитала благодаря красочной жизни Дорис Земуррей - старшей дочери Сэма. В то время как её мать, писательница Сара, её отец Сэм - банановый человек, её брат, ветеран Национальной гвардии Луизианы Сэм-младший, и их деловые партнёры, такие как Адольф Кац и Джейкоб Вайнбергер, все провели свою недавнюю жизнь, создавая величайшую капиталистическую корпоративную конструкцию в Новом Свете, Дорис вместо этого провела свою молодую жизнь, исследуя мир и живя жизнью, полной научных приключений. Родившаяся в 1909 году в Новом Орлеане до того, как семья Земурреев продолжила своё путешествие на юг, Дорис училась в Тулейнском университете, который до сих пор находится через улицу от семейного дома Земурреев в особняке Beaux-Arts на Сент-Чарльз-авеню в Новом Орлеане, прежде чем её образование позже привело её в Кембридж, Гарвард, Union College и Исследовательский институт Средней Америки, пройдя путь от простой студентки до научного сотрудника и в конечном итоге почётного профессора.\n\nАрхеолог, этнограф и антрополог, специализирующийся на доколумбовых мезоамериканских культурах в так называемой «промежуточной зоне» нижней Центральной Америки вокруг Коста-Рики, Дорис и её новый муж Роджер Тайер Стоун - коллега-антрополог - путешествовали по Новому Свету, распространяя радость образования и научных знаний, работая над раскрытием исторических тайн туземного прошлого Мезоамерики. Хотя Дорис может быть не вовлечена напрямую в управление нашим корпоративным государством или UFC, она всё ещё является огромным источником поддержки для своего отца, и Сэм - банановый человек даже использует часть своего огромного богатства для открытия исследовательских центров, школ, библиотек, центров помощи туземцам и других гуманитарных источников образования и знаний для масс под своим контролем, чтобы угодить своей дочери. С такими людьми, как Дорис, на его стороне, Сэм, несомненно, будет держать массы в своём сердце, даже когда строит эту массивную корпоративную структуру над их головами."
hon_ufc.22.a: "Истинная новая псевдоблагородная семья для этого процветающего рая."

hon_ufc.23.t: "Окончательная судьба семейного дома Земурреев"
hon_ufc.23.d: "Хотя наша семья и наши корпоративные интересы осели в Гондурасе и Центральной Америке в целом, мы, Земурреи, никогда не забывали наш истинный дом - Новый Орлеан. После бегства от царских сил в том, что сейчас является Украиной, до начала века, Сэм оказался в бедных районах меньшинств Нью-Йорка, прежде чем начал своё путешествие как на юг, так и к капиталу на плечах своих многочисленных деловых предприятий. К 1917 году Земуррей сделал свои первые несколько состояний и использовал своё накопленное богатство, чтобы купить особняк Beaux-Arts на Сент-Чарльз-авеню в Новом Орлеане, прямо через улицу от Тулейнского университета, где его дети, такие как Дорис, в конечном итоге будут учиться. Именно этот дом, в котором Земурреи жили десятилетиями, и этот дом в сердце Нового Орлеана мы теперь хотим спасти. Растущий конфликт и беспорядки в Соединённых Штатах подвергают наш старый дом опасности падения под радикализм или что-то похуже. Стоит ли нам рисковать войной с нашими собратьями-американцами только ради возвращения нашего старого дома, или нам просто следует посмотреть правде в глаза и признать, что теперь мы центральноамериканцы?"
hon_ufc.23.a: "Бросить особняк. Центральная Америка - наш единственный дом теперь."
hon_ufc.23.b: "Мы спасём Новый Орлеан от самого себя! В Луизиану!"

