### Leaders & Traits ###

POLITICS_KYRIL_ROMANOV_TRM_DESC: "Божией Милостью, Мы, Кирилл I, Император и Самодержец Всероссийский, Царь Сибирский; всех северных стран Повелитель; и иных, и иных, и иных."
POLITICS_KAZEMBEK_DESC: "§YОписание лидера\nРождение:§! §g15 февраля 1902 года в Казани, Казанская губерния, Российская империя§!\n§YПолитическая карьера:§! Мало кто мог предсказать, что Александр Казем-Бек окажется в том положении, в котором он находится сегодня. Кажется, что его жизнь может быть просто уроком о нестабильности мироздания; о хаосе политики и человеческого существования. Родившись в знатной ирано-азербайджанской семье, Казем-Бек испытал на себе всю тяжесть Русской революции; что, несомненно, сформировало его эксцентричные политические взгляды. Однако вместо того, чтобы настроить его против советской власти, Революция внушила ему определённую степень уважения к Советской системе. И хотя Красная революция провалилась, Казем-Бек всё равно включил части советских идеалов в свою личную политику.\n\nЕго харизма и опыт оратора выдвинули его на передний план новой группы «Молодая Россия», группы, отвергшей реакционный царизм в пользу «Нового и динамичного видения». По мере ухудшения ситуации в России профессор Николай Устрялов убедил секретаря партии Казем-Бека встать на сторону Александра Колчака и его путча против Петроградского правительства. Однако путч Колчака провалился, что привело к созданию государства Приамурье - государства-осколка, куда бежали Казем-Бек и Устрялов. Эта череда событий привела к тому, что Устрялов и Казем-Бек отвергли идеологию белых в пользу большевиков. Эта идеализация привела к разработке концепции «Трудовой монархии» и системы, сочетающей советскую демократию, православный интегрализм, русский национализм и «революционный дух». И по мере того, как его идеология росла и менялась, росло и влияние младороссов в Приамурье. Их влияние росло и расширялось до такой степени, что они смогли захватить власть после Антиколчаковского переворота.\n\nТеперь Казем-Бек стоит как «Вождь» государства-осколка Приамурья. И хотя его влияние сейчас может быть невелико, у Казем-Бека есть планы восстановить Царя и вскоре отвоевать всю Россию."
POLITICS_KYRIL_ROMANOV_MLAD_DESC: "Великий князь Кирилл Владимирович, ныне Кирилл I Российский, - один из самых беспокойных членов дома Романовых. Волевой, амбициозный и полный решимости захватить трон, он несколько раз доставлял головную боль своему двоюродному брату Николаю II. Открытым секретом является то, что во время Февральской революции Кирилл активно действовал против Царя и остальных членов Дома, вплоть до того, что приказал своим людям поднять красный флаг над Петроградом - не из-за какой-либо преданности революционным идеалам, а из-за надежды стать регентом или, возможно, даже Царём после отречения его кузена.\n\nПосле казни Николая и его семьи Кирилл заявил о своей власти над разрозненным домом Романовых - заявление, которое было горячо оспариваемо остальными членами семьи, утверждавшими, что Кирилл не имеет права ни на восстановленный российский престол, ни на то, чтобы возглавлять российскую императорскую семью. Однако к 1929 году он был в конечном счёте признан, чему, несомненно, способствовала безвременная смерть великого князя Николая. Хотя Кирилл неохотно отдаёт дань уважения младороссам, ему в действительности безразлично, кто держит ключи от власти; пока он в той или иной форме находится у руля. Даже если Кирилл находится под фактическим домашним арестом и является не более чем бессильной фигурой по сравнению с Вождём."
POLITICS_ALEXANDR_KOLCHAK_DESC: "§YОписание лидера\nРождение:§! §g16 ноября 1874 года в Александровском, Санкт-Петербургская губерния, Российская империя§!\n§YПолитическая карьера:§! Александр Васильевич Колчак, несомненно, самый важный адмирал в российской истории. Родившись в семье мелких дворян украинского происхождения, Александр присоединился к полярной экспедиции Эдуарда Толля в качестве молодого офицера - первому из многих полярных приключений Колчака, его страсти. Получив своё первое командование в Русско-японскую войну, Колчак выдвинулся на первый план благодаря своей программе военно-морских реформ. Он командовал минным заградительным дивизионом Балтийского флота с большим успехом в Мировую войну и уже был известным офицером к моменту Февральской революции. Будучи монархистом, Колчак тем не менее сотрудничал с Февральской революцией из чувства долга и был избран Верховным правителем России после государственного переворота в ноябре 1918 года, к большому своему удивлению. Хотя он ненавидел заниматься политикой, Колчак смог сохранить единство среди белых до конца войны, уйдя в отставку с поста Верховного правителя после временных выборов новой республики. Однако, будучи назначенным Верховным адмиралом флота, его отношения с правительством новообразованной Российской республики быстро становились всё более враждебными, во многом из-за неприязни эсеров к перевороту 1918 года, несмотря на принесённую им победу, или из-за собственных устаревших понятий адмирала о рыцарстве и дворянской умеренности. Неудачные реформы эсеров в начале 1920-х годов, их сопротивление пользовавшемуся большим уважением президенту Сазонову и назначение Александра Керенского новым президентом побудили адмирала поддержать казачий путч 1925 года против «прогерманских прихвостней» Керенского. Путч провалился, и Колчак был вынужден бежать на Восток, где он был в значительной степени снова вынужден занять пост Верховного правителя в мятежном государстве Приамурье - прояпонском буфере во главе с богатейшей семьёй Меркуловых и оккупированном Квантунской армией. Его неприязнь к политике не прошла, поэтому, несмотря на то, что он теперь центральная фигура на Дальнем Востоке, вокруг которого, несмотря на него и с его позволения, плетутся интриги, он всё ещё мечтает, что его долг отпустит его, и он отправится в полярную ночь и к холодным льдам Арктики."
POLITICS_SHUMYATSKY_DESC: "Родители Бориса Шумяцкого были сосланы в Сибирь за отказ покинуть свой дом. Этот случай запомнился Шумяцкому, постоянно напоминая ему о коррупции внутри царского правительства в Петрограде. Бывший большевик, Шумяцкий был вынужден покинуть Россию по окончании Гражданской войны и стал влиятельным политиком в Приамурье. Несмотря на то, что его политические взгляды сместились вправо, Шумяцкий продолжает стремиться к превращению Приамурья в государство всеобщего благосостояния. Его прошлый опыт большевистского агитатора помог ему получить большинство голосов на президентских выборах."
POLITICS_MERKULOV_DESC: "§YОписание лидера\nРождение:§! §g1870 год, Благовещенск, Амурская область, Российская империя§!\n§YПолитическая карьера:§! Бывший лидер прояпонского Временного правительства Приамурья, Меркулов и его брат - самые богатые люди в Приамурье. Теперь, когда Колчак больше не стоит у него на пути, а демократия наконец вернулась во Владивосток, Меркулов, сын скромного крестьянина, стремится привести Приамурье к процветанию. Его огромные личные связи с народом помогли ему получить большинство голосов на президентских выборах."
POLITICS_SERGEY_VOYTSEKHOVSKIY_MILITARY_DESC: "§YОбщее описание\nРождение:§! §g16 октября 1883 года в Витебске, Витебская губерния, Российская империя§!\n§YПроисхождение:§! Генерал от артиллерии Сергей Войцеховский выдвинулся как видная фигура в Чехословацком легионе во время своего пребывания в Челябинске, став героем Белого движения. Он возглавил необычайное восстание Чехословацкого легиона, которое широко рассматривалось как ключевое событие, значительно повлиявшее на победу белых. Служа под командованием адмирала Александра Колчака, Войцеховский одержал множество побед для своей наступающей армии.\n\nПосле окончания войны Войцеховский и другие старшие командиры Чехословацкого легиона, включая Радолу Гайду, отказались возвращаться в Австро-Венгрию после того, как чехословакам в Богемии была предоставлена значительная автономия. Неспособность администрации Керенского противостоять немецкому наступлению привела к тому, что Чехословацкий легион поддержал колчаковский путч 1925 года и впоследствии был вынужден укрыться в Сибири."
POLITICS_SERGEY_VOYTSEKHOVSKIY_DESC: "§YОписание лидера\nРождение:§! §g16 октября 1883 года в Витебске, Витебская губерния, Российская империя§!\n§YПроисхождение:§! Генерал от артиллерии Сергей Войцеховский выдвинулся как видная фигура в Чехословацком легионе во время своего пребывания в Челябинске, став героем Белого движения. Он возглавил необычайное восстание Чехословацкого легиона, которое широко рассматривалось как ключевое событие, значительно повлиявшее на победу белых. Служа под командованием адмирала Александра Колчака, Войцеховский одержал множество побед для своей наступающей армии.\n\nПосле окончания войны Войцеховский и другие старшие командиры Чехословацкого легиона, включая Радолу Гайду, отказались возвращаться в Австро-Венгрию после того, как чехословакам в Богемии была предоставлена значительная автономия. Неспособность администрации Керенского противостоять немецкому наступлению привела к тому, что Чехословацкий легион поддержал колчаковский путч 1925 года и впоследствии был вынужден укрыться в Сибири.\n\nТеперь, как опытный лидер легионеров, Войцеховский контролирует русский Дальний Восток и готов восстановить порядок не только в России, но и на всех славянских территориях."
POLITICS_GAJDA_MILITARY_DESC: "§YОбщее описание\nРождение:§! §g14 февраля 1892 года в Которе, Королевство Далмация, Австро-Венгерская империя§!\n§YПроисхождение:§! Жизнь Рудольфа Гейдля, ныне известного как Радола Гайда, увлекательна. Родившись в семье австрийского унтер-офицера и бедной черногорской дворянки, жизнь Гайды была сложным образом связана с судьбами как немцев, так и славян. Мобилизованный в австро-венгерскую армию во время Великой войны, он вскоре дезертировал, чтобы присоединиться к черногорской армии. После её поражения он бежал в Россию, где вовлёкся в чехословацкое легионерское движение. Вместе с Сергеем Войцеховским он организовал восстания легиона в Сибири, позже став одним из лидеров Сибирской армии. Благодаря его усилиям была захвачена Вятка, и Белые армии соединились на Волге.\n\nПосле войны Гайда предпочёл не возвращаться в Чехословакию, несмотря на амнистию, предоставленную новым правительством, и вместо этого создал тёмное альтернативное «правительство» в изгнании."
POLITICS_GAJDA_DESC: "§YОписание лидера\nРождение:§! §g14 февраля 1892 года в Которе, Королевство Далмация, Австро-Венгерская империя§!\n§YПроисхождение:§! Жизнь Рудольфа Гейдля, ныне известного как Радола Гайда, увлекательна. Родившись в семье австрийского унтер-офицера и бедной черногорской дворянки, жизнь Гайды была сложным образом связана с судьбами как немцев, так и славян. Мобилизованный в австро-венгерскую армию во время Великой войны, он вскоре дезертировал, чтобы присоединиться к черногорской армии. После её поражения он бежал в Россию, где вовлёкся в чехословацкое легионерское движение. Вместе с Сергеем Войцеховским он организовал восстания легиона в Сибири, позже став одним из лидеров Сибирской армии. Благодаря его усилиям была захвачена Вятка, и Белые армии соединились на Волге.\n\nПосле войны Гайда предпочёл не возвращаться в Чехословакию, несмотря на амнистию, предоставленную новым правительством, и вместо этого создал тёмное альтернативное «правительство» в изгнании.\n\nБудучи заклятым противником всего немецкого, Гайда теперь оказывается у руля командования и управления на Дальнем Востоке - золотая возможность возмездия против немцев и австрийцев и возвращения Чехословацкого легиона на его исконную родину."
POLITICS_ANATOLIY_PEPELYAEV_MILITARY_DESC: "§YОбщее описание\nРождение:§! §g15 июля 1891 года в Томске, Томская губерния, Российская империя§!\n§YПроисхождение:§! Родившись в военной семье, Анатолий Николаевич Пепеляев избрал военную карьеру.\n\nВ начале Великой войны Пепеляев участвовал в ожесточённых боях на Западном и Северном фронтах. Несмотря на поддержание дисциплины среди своих войск в то время, когда остальная русская армия разваливалась, Пепеляев тем не менее оставался настолько популярным, что был избран своими солдатами сохранить командование после Октябрьского переворота.\n\nПосле захвата большевиками Томска Пепеляев немедленно присоединился к городскому белому подполью. Он руководил освобождением города от красного контроля и созданием антибольшевистского правительства. Пепеляев и его войска сыграли важную роль в обращении вспять контроля красных над Сибирью, за что ему было присвоено звание генерал-майора всего в 27 лет. Омский переворот в ноябре того же года был для Пепеляева неоднозначным благом, поскольку он успел возненавидеть сибирское эсеровское правительство, но всё ещё считал себя демократом с эсеровскими симпатиями. Он продолжал верно служить, и его Среднесибирский корпус прошёл почти непобеждённым от Перми до Волги. Пепеляев заслужил прозвище «сибирский Суворов» и был удостоен командования 2-й армией после отражения жестоких красных контрнаступлений 1919 года.\n\nСтав широко известным в России благодаря своей молодости и успехам, он остался в армии после Гражданской войны. Вместе со своим братом Виктором Пепеляев поддержал колчаковский путч 1925 года, бежав в Приамурье и став одним из лидеров Генерального штаба новой Сибирской армии. Пепеляев остаётся одним из самых известных генералов России и проводит много времени, выступая за большую личную инициативу среди младших офицеров."
POLITICS_ANATOLIY_PEPELYAEV_DESC: "§YОписание лидера\nРождение:§! §g15 июля 1891 года в Томске, Томская губерния, Российская империя§!\n§YПроисхождение:§! Родившись в военной семье, Анатолий Николаевич Пепеляев избрал военную карьеру.\n\nВ начале Великой войны Пепеляев участвовал в ожесточённых боях на Западном и Северном фронтах. Несмотря на поддержание дисциплины среди своих войск в то время, когда остальная русская армия разваливалась, Пепеляев тем не менее оставался настолько популярным, что был избран своими солдатами сохранить командование после Октябрьского переворота.\n\nПосле захвата большевиками Томска Пепеляев немедленно присоединился к городскому белому подполью. Он руководил освобождением города от красного контроля и созданием антибольшевистского правительства. Пепеляев и его войска сыграли важную роль в обращении вспять контроля красных над Сибирью, за что ему было присвоено звание генерал-майора всего в 27 лет. Омский переворот в ноябре того же года был для Пепеляева неоднозначным благом, поскольку он успел возненавидеть сибирское эсеровское правительство, но всё ещё считал себя демократом с эсеровскими симпатиями. Он продолжал верно служить, и его Среднесибирский корпус прошёл почти непобеждённым от Перми до Волги. Пепеляев заслужил прозвище «сибирский Суворов» и был удостоен командования 2-й армией после отражения жестоких красных контрнаступлений 1919 года.\n\nСтав широко известным в России благодаря своей молодости и успехам, он остался в армии после Гражданской войны. Вместе со своим братом Виктором Пепеляев поддержал колчаковский путч 1925 года, бежав в Приамурье и став одним из лидеров Генерального штаба новой Сибирской армии. Пепеляев остаётся одним из самых известных генералов России и проводит много времени, выступая за большую личную инициативу среди младших офицеров.\n\nПосле падения адмирала-диктатора задача спасения Дальнего Востока, Сибири и, возможно, всей России теперь ложится на плечи Пепеляева."
POLITICS_SEMYONOV_DESC: "§YОписание лидера\nРождение:§! §g25 сентября 1890 года в Куранже, Забайкальская область, Российская империя§!\n§YПолитическая карьера:§! Григорий Михайлович Семёнов - истинный сын сибирской тайги, родившийся в семье забайкальского казака и старообрядки. Наряду с родным русским он в совершенстве овладел монгольским и бурятским языками. Он поступил на военную службу в 1911 году и вскоре оказался в китайской Внешней Монголии, где у него сложились прекрасные отношения с местным населением. Он даже помогал революционерам во время Монгольской национальной революции, прежде чем служить на Северо-Западном фронте в Великой войне.\n\nПо личной просьбе он был отправлен на Персидский фронт в 1917 году, перед тем как стать свидетелем Февральской революции. Летом он был назначен правительственным комиссаром по всем монгольским и бурятским добровольческим частям в Забайкалье. С этими войсками Семёнов поднял мятеж против большевиков после Октябрьского переворота и провозгласил себя походным атаманом Забайкальского казачьего войска при поддержке Японии и с многонациональным Особым Маньчжурским отрядом под своим командованием. Хотя Колчак формально назначил Семёнова командующим всеми войсками в Забайкалье в 1919 году, на практике Семёнов правил как независимый полевой командир.\n\nЕго правление закончилось в 1921 году, когда большевики были разгромлены на западе и русско-японские отношения были урегулированы. Грабежи и жестокость Семёнова не были забыты его соотечественниками-русскими, и без его японских покровителей он был вынужден бежать в Маньчжурию. В изгнании Семёнов стал наёмником, помогая Фэнтяньской клике в её войнах против Чжилийской клики в 1920-х годах. Чтобы вернуться в Россию, он заручился поддержкой китайских наёмников и японских офицеров, начав восстание на русском Дальнем Востоке в 1925 году. Для кого-то этот «колчаковский путч» провалился, но для Семёнова это была чистая победа, поскольку он убедил Колчака назначить себя верховным командующим Сибирской армией в Приамурье и вернул Забайкалье в свой почти независимый удел."
POLITICS_YUI_DESC: "§YОписание лидера\nРождение:§! §g27 ноября 1860 года в Коти, княжество Тоса, Япония\n§YПолитическая карьера:§! Старый генерал Мицуэ хорошо знаком с принятием командования, так как он руководил Японским экспедиционным корпусом во время Гражданской войны в России. Как почётный военный герой, он получил от императора высший дар - мирно править землями, которые он завоевал много лет назад. Старик - изоляционист и не стремится вести какие-либо войны. Когда он приходит к власти в качестве главы Приамурья, мечта о Великом Приамурье умирает."
POLITICS_MIKHAIL_DITERIKHS: "§YОписание лидера\nРождение:§! §g17 апреля 1874 года в Санкт-Петербурге, Санкт-Петербургская губерния, Российская империя§!\n§YПолитическая карьера:§! §gСолдат веры в эпоху компромиссов, Михаил Константинович Дитерихс стоит особняком среди раздробленных остатков Белого движения. В то время как другие говорили о «непредрешенчестве», он требовал ясности - Бог, Царь и Святая Русь. Ветеран Великой войны и один из главных организаторов восстания Чехословацкого корпуса, Дитерихс впервые проявил себя как человек действия и дисциплины. Глубоко разочарованный провалами республиканизма и моральной двусмысленностью руководства белых, Дитерихс отверг компромисс с революционным наследием. В хаосе изгнания и поражения он собрал единомышленников-офицеров в организацию, открыто приверженную восстановлению монархии и возрождению православной России. Будь то как пророк реставрации или предвестник новых потрясений, его возвышение знаменует возвращение более старого, более жёсткого видения России: неделимой, священной и абсолютной.§!"
POLITICS_MIKHAIL_DITERIKHS_GENERAL: "§YОбщее описание\nРождение:§! §g17 апреля 1874 года в Санкт-Петербурге, Санкт-Петербургская губерния, Российская империя§!\n§YВоенная карьера:§! §gМихаил Дитерихс родился в семье полковника артиллерии и дворянки. С рождения он был предназначен к военной карьере. Он получил хорошее военное образование и служил на различных штабных должностях до начала Русско-японской войны. Во время войны он участвовал в таких значимых сражениях, как Мукден и битва на реке Шахе. Позже он был назначен начальником отделения Мобилизационного отдела Главного управления Генерального штаба. На этой должности он встретил начало Мировой войны. В годы войны он служил начальником штаба 3-й армии. В начале сентября 1916 года он отправился из Архангельска в Салоники для поддержки сербской армии. Под его руководством были разбиты части болгарской армии, в результате чего союзники заняли город Битола 19 ноября. Однако на этом военные успехи закончились. После Февральской революции его отозвали обратно в Россию и назначили начальником штаба Особой Петроградской армии. В ноябре 1917 года он переехал в Украину, где в марте 1918 года стал начальником штаба Чехословацкого корпуса. Он отправился с ними во Владивосток. Он поддержал Александра Колчака и 17 января 1919 года был назначен главой комиссии по расследованию убийства царской семьи. В последние годы Гражданской войны Дитерихс занимал множество должностей, включая командующего Сибирской армией, командующего Восточным фронтом и начальника штаба Верховного главнокомандующего Колчака. Он также сыграл ключевую роль в создании добровольческих формирований летом и осенью 1919 года, которые основывались на защите веры. К ним относились православные «Дружины Святого Креста» и мусульманские «Дружины Зелёного Знамени».\n\nВо время колчаковского путча Дитерихс поддержал своего бывшего союзника и остался на Дальнем Востоке в качестве главы дальневосточного отделения РОВСа. Он стал одним из лидеров Сибирской армии, в отличие от многих монархистов, оставшихся верными Петрограду.§!"
POLITICS_VLADIMIR_KAPPEL_DESC: "§YОбщее описание\nРождение:§! §g28 апреля 1883 года в Царском Селе, Санкт-Петербургская губерния, Российская империя§!\n§YВоенная карьера:§! §gВладимир Каппель происходил из дворянской семьи военных офицеров и поэтому решил пойти по стопам отца, хотя тот погиб в бою, когда он был ещё ребёнком. Хотя он получил образование как кавалерийский офицер, он окончил учёбу, создав доклад об устаревании кавалерии перед лицом моторизованных сил. Он добросовестно служил в Мировую войну и участвовал в Брусиловском прорыве, но его отношение изменилось, когда вспыхнула Февральская революция. Будучи убеждённым монархистом, Каппель сначала хранил молчание, надеясь на восстановление Романовского порядка после стабилизации ситуации, но вскоре начал строить заговоры с другими будущими белыми генералами. Когда большевики захватили власть, он находился в Перми и отправился в Самару, чтобы присоединиться к Народной армии Комуча - республиканской социалистической силе, которая клялась восстановить Учредительное собрание. Зрелище было ещё то - монархист, возглавляющий социалистические силы.\n\nКаппель выполнял свои обязанности с блестящими результатами - он проявил своё мастерство как расчётливый тактик и эксперт по зимней войне, что позволяло ему без особого труда разбивать в несколько раз превосходящие силы большевиков. Большевистские газеты даже прозвали его «маленьким Наполеоном», но закрепившееся прозвище было «генерал-солдат» - командир, который всегда оставался со своими людьми и сражался рядом с ними с винтовкой и гранатой. После окончания большевистского восстания Каппель остался в армии и стал одним из важнейших генералов в её пехотном корпусе, но вскоре он решил присоединиться к колчаковскому путчу и оказался на Дальнем Востоке. Он является сторонником моторизации армии и модернизации офицерского корпуса."
POLITICS_NIKITA_ROMANOV_ABS_DESC: "§YРождение:§! §g17 января 1900 года в Санкт-Петербурге, Санкт-Петербургская губерния, Российская империя§!\n§YПроисхождение:§! Никита Александрович Романов - князь императорской крови, сын великого князя Александра Михайловича и внук императора Александра III. Князь Никита учился в Морском кадетском корпусе, но был слишком молод, чтобы участвовать в Гражданской войне. Он тяжело пережил потерю семейных имений в Крыму, и в 1920-х годах сблизился с ультраправыми монархическими позициями, такими как позиции Национально-государственной партии Пуришкевича. Как и его отец, Никита высоко ценил военных и не одобрял сосредоточенность Кирилла Владимировича на социальных вопросах.\n\nВ политической сумятице, последовавшей за колчаковским путчем, Никита близко познакомился с ДВСВ и его реакционными взглядами. После восстановления Российской империи Михаилом Дитерихсом новосозванный Земский собор избрал Никиту новым Царём, обойдя более скомпрометированные старшие линии. По всей вероятности, генерал Дитерихс искал монарха, с которым у него ранее была связь. Несмотря на неопытность Никиты в политике, он проявил себя как упрямый Царь, часто конфликтуя со своими советниками. Тем не менее, в конечном счёте он соглашается с видением Союза монархистов - вечной, Святой Руси, основанной на традиции и православной вере.§!"

