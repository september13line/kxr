lenzoloto_desc: "Ассоциация золотодобывающих предприятий Лены (Лензолото) долгое время монополизировала не только транспорт, но и добычу и торговлю золотом в Ленинском золотодобывающем районе и на протяжении четверти века была крупнейшей золотодобывающей компанией России. Несмотря на национализацию советским правительством, которая на практике была лишь номинальной, к 1928 году британская компания Lena Goldfields Co. утратила контрольный пакет акций рудников."
