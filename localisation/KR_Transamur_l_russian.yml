TRM_Spheres_Of_Influence_desc: "\n\n£trm_test_kolchak£\n\n\n\nЗахватив власть в [TRM.GetNameDefCap] в 1925 году, адмирал Колчак объединил различные группы людей в государство постоянной политики, скандалов, дебатов и конфликтов интересов.\nЭто делает адмирала Колчака важной фигурой в центре дальневосточной политики, пытающейся обуздать амбиции каждой группы и в то же время проводить свою собственную политику.\n\nСредняя поддержка §X[TRM.GetKolchakiteLeader]§!: [?TRM.TRM_Overall_Kolchak_Support|X%0][TRM_stavka_sentiments]\n\nСредняя власть §gказаков§!: [?TRM.TRM_Overall_Cossack_Support|g%0]\nСредняя власть §nДВСВ§!: [?TRM.TRM_Overall_ROVS_Support|n%0]\n\nСредняя власть §lобластников§!: §l[?TRM.TRM_Overall_Oblastniki_Support|l%0]§!"

