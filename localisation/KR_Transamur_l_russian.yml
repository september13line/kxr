### Parties ###
TRM_totalist_party: "Младороссы"
TRM_totalist_party_long: "Младоросская партия\n§LИстория движения «Молодая Россия» неразрывно связана с его лидером, харизматичным аристократом Александром Львовичем Казем-Беком, родившимся в 1902 году в богатой дворянской семье азербайджанского и иранского происхождения. Три идеологические фазы младороссов можно тесно сопоставить с жизнью и опытом самого Казем-Бека; что неудивительно, учитывая его роль оратора и идеолога. Будучи студенческим активистом, Казем-Бек помог сформировать «Союз Молодой России» в 1923 году. Объединяя 29 организаций и 4000 человек, молодороссы представляли монархическое молодёжное крыло. Склонные к интеллектуализму и идеологически расплывчатые, его члены совместно отвергали реакционный царизм в пользу «нового и динамичного видения». Будучи секретарём, Казем-Бек встретился с профессором Николаем Устряловым, некогда главой пресс-бюро при адмирале Колчаке. Устрялов убедил молодого аристократа поддержать путч против президента Керенского в 1924 году. Оба бежали в Приамурье после провала переворота, взяв с собой своих соответствующих сторонников. Устрялов разочаровался в Белом движении и начал боготворить большевиков как защитников российского суверенитета.\n\nФормирование «Союза молодороссов» в 1925 году ознаменовало вторую идеологическую фазу младороссов. Казем-Бек начал формулировать свой тезис о «Трудовой монархии» под руководством Устрялова. Зарождающаяся идеология младороссов сочетала абсолютную монархию, советскую демократию, православный интегрализм, русский национализм и «революционный дух». В этот период 1925-1933 годов большинство младороссов объединяли только театральные церемонии принесения клятв и чтение таких журналов, как «Бодрость!» и «К молодой России». Третья фаза наступила вскоре после поездок Казем-Бека в синдикалистские страны Европы. Казем-Бек был особенно вдохновлён прото-тотализмом французских и итальянских национальных синдикалистов, а также британских мозлистов. По возвращении в 1934 году Казем-Бек сформировал «Младоросскую партию» как её «Вождь».§!"
TRM_syndicalist_party: "Центросибирь"
TRM_syndicalist_party_long: "Народно-революционная армия — Центральный исполнительный комитет Советов Сибири\n§gЦентросибирь, сокращённо от Центральный исполнительный комитет Сибирских Советов, был избран Первым съездом Сибирских Советов, состоявшимся в Иркутске в ноябре 1917 года. После временного падения Советской власти в Сибири Центросибирь прекратила своё существование летом 1918 года. Однако многие делегаты остались в Сибири и залегли на дно, включая первого председателя президиума Бориса Шумяцкого, который получил амнистию после окончания Гражданской войны. Отойдя от ортодоксального большевизма, Центросибирь ставит своей целью отделение Сибири от России и построение синдикалистского государства рабочих, видя в этом единственное спасение для промышленно неразвитого региона.§!"
TRM_radical_socialist_party: "НРА"
TRM_radical_socialist_party_long: "Народно-Революционная Армия\n§LРождённая из 53-й Сибирской стрелковой дивизии, НРА вряд ли является армией, а скорее сборищем партизан, объединённых социалистическими лозунгами и авторитетом штабс-капитана Николая Калашникова. Сейчас НРА не является ни серьёзной силой, ни жёсткой оппозицией. Пытаясь объединить рабочих и крестьян и саботировать заводы и железные дороги, НРА только мечтает о восстановлении советской власти на Дальнем Востоке. Однако ситуация может измениться, и быстро.§!"
TRM_social_democrat_party: "Политцентр"
TRM_social_democrat_party_long: "Политический центр\n§LПолитический центр - это политическая организация, состоящая из Всесибирского областного комитета эсеров, Бюро сибирских меньшевистских организаций, Земского политического бюро и других. Политцентр является основной левой и революционно-демократической оппозицией режиму Колчака на Дальнем Востоке. Первоначально созданный во время Гражданской войны для свержения правительства Колчака как реакция на ужасное положение крестьянских хозяйств в Сибири, мятеж был отменён, так как ситуация, к удивлению, была взята под контроль, благодаря усилиям Бориса Савинкова, который смог убедить Верховного правителя в необходимости уступок крестьянам. Однако говорят, что за последние десять лет Политический центр готовил почву для нового восстания, во многом благодаря подрывной деятельности партизан НРА и интеллектуальной и философской поддержке СОФ.§!"
TRM_social_liberal_party: "СОФ"
TRM_social_liberal_party_long: "Союз Областников-Федералистов\n§LСОФ является основной политической организацией сибирского областнического движения, также известного как сибирский регионализм - общественно-политического и культурного течения среди сибирской интеллигенции. Главная цель и идея СОФ - борьба за федерализацию России, и в частности, предоставление Сибири широкой региональной автономии и представительства. Хотя разные участники высказывают взгляды от национальной и культурной автономии до полной независимости Сибири и создания отдельного государства, их объединяет одно - нетерпимость как к левым, так и к правым диктатурам, что делает СОФ, пожалуй, единственной по-настоящему демократической организацией на Дальнем Востоке."
TRM_market_liberal_party: "Либералы"
TRM_market_liberal_party_long: "Либералы\n§LКонституционных демократов Дальнего Востока возглавляет лояльный колчаковец Виктор Пепеляев, бывший правый кадет и премьер-министр России в 1919-1920 годах. Он поддержал путч Колчака и согласился снова стать премьер-министром России.§!"
TRM_social_conservative_party: "СНО"
TRM_social_conservative_party_long: "Съезд Несоциалистических Организаций\n§LСъезд несоциалистических организаций не является партией в полном смысле слова, а скорее своего рода альянсом политических сил, в основном связанных с именами братьев Меркуловых и различными купеческими интересами Приамурья. Сформированный во время Гражданской войны, Съезд фактически легитимизировал японскую оккупацию Дальнего Востока, активно поддерживая и возглавляя её. С момента переворота Колчака СНО занимает выжидательную позицию, преследуя интересы японских корпораций через недобросовестные тендеры и закупки, и лоббируя интересы японского правительства в правительственной и деловой среде Верховного правителя.§!"
TRM_authoritarian_democrat_party: "ВКС"
TRM_authoritarian_democrat_party_long: "Восточный Казачий Союз\n§LДальневосточные казачьи войска, объединённые Григорием Семёновым в ВКС, представляют собой прояпонскую военную организацию, стремящуюся к дальнейшему сотрудничеству с Японской империей. ВКС характеризуется жестокостью по отношению к социалистам и радикальным неодобрением либеральной демократии. В отличие от других казачьих войск в России, Дальневосточное войско считает себя независимым от влияния Петроградского режима.§!"
TRM_paternal_autocrat_party: "Правительство Колчака"
TRM_paternal_autocrat_party_long: "Правительство Колчака\n§LПравительство Колчака является высшей инстанцией власти на территории Приамурья. Впервые созданное в 1918 году во время Гражданской войны в России, правительство было реорганизовано после переворота Колчака.§!"
TRM_national_populist_party: "Националисты"
TRM_national_populist_party_long: "Всероссийская Национально-Революционная Трудовая Рабоче-Крестьянская Партия Националистов\n§LВсероссийская национально-революционная трудовая рабоче-крестьянская партия националистов, или как их обычно называют, Всероссийское националистическое движение или просто Националисты, представляет собой ультранационалистическую политическую организацию, которая в последние годы стала всё более популярной среди граждан Приамурья. Сформированная в 1931 году местным политиком и лоялистом Колчака Анастасием Вонсяцким, Националисты нашли поддержку среди русских маньчжурцев и монархистов в изгнании. Молодые эмигранты, всё ещё верные идеалам русского Царства, стекались в это движение, восхищаясь пламенными речами Вонсяцкого, обличающими большевизм, Керенского и западный капитализм. Во всём этом он обвиняет разложение русского народа, одновременно заявляя о лояльности адмиралу Колчаку, Русской Православной Церкви и восстановленному Царству. Исповедуя идеологию отечественного происхождения «Истинного русского национализма», Националисты организовали своих членов в военизированную силу, известную как Чёрная гвардия, что, несомненно, является отсылкой к Чёрной сотне.\n\nЧёрная гвардия обеспечивала безопасность режима Колчака и участвовала в облавах на политических диссидентов, а также на видных членов еврейской общины Владивостока, обвиняемых в продвижении «опасных иностранных идеологий». Адмирал Колчак позволил этим действиям происходить, официально не поддерживая движение, возможно, чтобы успокоить японские власти, опасающиеся антииностранного движения.§!"

## Alternative parties ##
TRM_rovs_party: "ДВСВ"
TRM_rovs_party_long: "Дальневосточный союз военных\n§gДальневосточный союз военных под руководством генерала Михаила Дитерихса объединил группу офицеров Белой гвардии, которые либо активно поддерживали путч 1925 года, либо по воле судьбы оказались в то время на Дальнем Востоке России и решили не присоединяться к правительству Керенского. Объединившись в основном под лозунгом борьбы за восстановление самодержавной монархии в России и призывом вернуть Русскую Землю силой веры, ДВСВ представляет собой высокоцентрализованную и радикальную фракцию среди ветеранов. Хотя формально они поддерживают правительство Колчака, их недовольство растет, так как за все эти годы Колчак не смог предложить им даже малейшей перспективы восстановления монархии.§!"
TRM_siberian_army: "Сибирская армия"
TRM_siberian_army_long: "Сибирская армия"

TRM_rovs_party_russia: "РСВ"
TRM_rovs_party_russia_long: "Российский союз военных\n§gРоссийский союз военных, возникший на базе бывшего ДВСВ генерала Дитерихса, представляет собой организацию офицеров и ветеранов Белой гвардии, официально аполитичную, но в состав которой входят исключительно генералы-монархисты.§!"
TRM_rovs_party2: "РОНД"
TRM_rovs_party2_long: "Русское Освободительное Национальное Движение\n§LПолитическая организация, созданная ДВСВ для того, чтобы играть более важную роль в новом дальневосточном режиме, РОНД объединяет ветеранов Гражданской войны и бывших членов генерального штаба Верховного правителя, которые всё ещё хотят изменить Россию в соответствии со своим видением патернализма, православия и дисциплины.§!"
TRM_rovs_party2_russia: "ВСМ"
TRM_rovs_party2_russia_long: "Всероссийский союз монархистов\n§gПолитическая организация «ВСМ», являющаяся правопреемницей РОНД, объединяет всех монархистов России в единую легальную политическую структуру.§!"
TRM_semyonov_party: "Войсковой Круг"
TRM_semyonov_party_long: "Войсковой Круг\n§LДальневосточное казачье войско под руководством Григория Семёнова является прояпонской казачьей организацией, стремящейся к дальнейшему сотрудничеству с Японией и Монголией. Войско характеризуется жестокостью по отношению к социалистам и радикальным неодобрением либеральной демократии. В отличие от других казачьих войск в России, Дальневосточное войско считает себя независимым от влияния Петроградского режима.§!"
TRM_japanese_party: "Квантунская Армия"
TRM_japanese_party_long: "Квантунская Армия"
TRM_Mlad_party_socdem_long: "Младоросская партия\n§LСоциал-демократическое крыло младороссов, возглавляемое Александром Угримовым, было вынуждено захватить власть из-за постоянной коррупции Казем-Бека и его нежелания восстанавливать монархию. Верная своим первоначальным идеалам, фракция Угримова будет стремиться к подлинному пролетарскому благосостоянию для всех граждан России.§!"
TRM_NRA_party: "НРА"
TRM_NRA_party_long: "$TRM_radical_socialist_party_long$"
TRM_NRA_party2: "Дальбюро"
TRM_NRA_party2_long: "Дальневосточное Бюро"
TRM_czech_party: "Чехословацкий Легион"
TRM_czech_party_long: "Чехословацкий Легион\n§LЧехословацкий легион, как объявил Сергей Войцеховский, теперь контролирующий российский Дальний Восток, должен стать основной силой, которая будет управлять всеми политическими, экономическими и внешнеполитическими делами. Со своими панславистскими заявлениями Войцеховский стремится объединить сначала всю Россию, а затем и все славянские народы в единую трансконтинентальную федеративную страну.§!"
TRM_czech_party2: "ЧНС"
TRM_czech_party2_long: "Чехословацкий Национальный Совет\n§LЧехословацкий легион, как объявил Радола Гайда, теперь контролирующий российский Дальний Восток, должен стать основной силой, которая будет управлять всеми политическими, экономическими и внешнеполитическими делами. Более того, с единственной амбицией Гайды освободить и восстановить «Истинную Чехословакию», он провозгласил собственную Чехословакию на землях российского Дальнего Востока с чёткой целью однажды вернуться домой.§!"
TRM_social_democrat_kolchak: "РСДП"
TRM_social_democrat_kolchak_long: "Российская Социал-Демократическая Партия\n§LРСДП теперь является главной партией пролетариата и крестьянства в стране. Созданная после объединения Россией с Дальнего Востока, она считается марионеточной партией, без реальной оппозиции.§!"
TRM_market_liberal_kolchak: "КДП"
TRM_market_liberal_kolchak_long: "Конституционно-Демократическая Партия\n§LКонституционно-демократическая партия была возрождена под руководством Виктора Пепеляева, верного сторонника Колчака. Партия теперь является главной либеральной партией в России.§!"
TRM_musketeers_party: "Союз Мушкетёров"
TRM_musketeers_party_long: "Союз Мушкетёров Его Высочества Князя Никиты Александровича\n§L§!"
TRM_pepelyaev_party: "Правительство Пепеляева"
TRM_pepelyaev_party_long: "Правительство Пепеляева\n§LКогда предатели попытались свергнуть законнейшего Верховного правителя, Анатолий Пепеляев сплотил лояльных офицеров и предотвратил погружение Приамурья в полную анархию. Теперь новый лидер, прозванный «Сибирским Суворовым», должен привести остатки российского Дальнего Востока к долгожданной славе.§!"
TRM_psr_party: "ПСР(о)"
TRM_psr_party_long: "Партия Социалистов-Революционеров (объединённая)\n§LВоссоединившись с остатками эсеров и меньшевиков на базе Всесибирского областного комитета эсеров, Бюро сибирских меньшевистских организаций, Земского политического бюро и Народно-революционной армии, ПСР(о) теперь является основным левым и революционно-демократическим движением.§!"


