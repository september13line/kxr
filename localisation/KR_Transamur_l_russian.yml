### Decisions ###
TRM_restore_control_over_state: "Восстановить порядок в [FROM.GetName]"
TRM_flag_picker: "Выбор флага Приамурья"

TRM_japanese_influence: "Японское присутствие во Владивостоке"
TRM_japanese_influence_desc: "Наше правительство не воспринимается русским народом как законное российское государство, что становится ещё более очевидным из-за растущего влияния Токио. Нам нужно будет убедиться, что мы «хорошо играем роль», пока они проводят свои встречи, в надежде, что они не заподозрят никаких признаков нелояльности.\n\n§cЯпонское§! влияние: £GFX_social_conservative_texticon [?TRM.party_popularity@social_conservative|c%0]"

TRM_increase_japanese_shipments: "Увеличить японские поставки"
TRM_japanese_arm_shipments: "Закупить японское снаряжение"
TRM_buy_bombers: "Закупить японские бомбардировщики"

TRM_support_anti_japanese_rally: "Поддержать антияпонский митинг"
TRM_support_anti_japanese_rally_desc: "Наши специальные агенты тесно сотрудничают с местным антияпонским движением. Мы можем профинансировать проведение «стихийного» митинга, который ослабит позиции японцев здесь."
TRM_visit_from_japan: "Визит от наших хозяев"
TRM_visit_from_japan_desc: "В эти суровые времена нам нужны сильные союзники для защиты. Японские чиновники во Владивостоке заявили, что готовы оказать нам некоторую поддержку. Они будут посещать нас время от времени. Но каждый раз, когда мы принимаем их здесь, делегация становится сильнее и всё более амбициозной."

TRM_disperse_vladivostok_duma: "Разогнать Владивостокскую думу"

TRM_cossack_uprising_looming: "Надвигающееся казачье восстание"

TRM_rename_russian_cities: "Переименовать русские города"

TRM_zaibatsus: "Открыть концессию дзайбацу"
TRM_zaibatsus_desc: "Наше экономическое партнёрство с Японией привлекает много денег и инвестиций, это правда. Сегодня японская делегация во Владивостоке обратилась к нашему руководству с прямым предложением открыть новую концессию в Приамурье."
TRM_Jap_Inv1: "Помощь от Японии"
TRM_Jap_Inv1_desc: "Мы можем попросить Японию вложить немного денег в нашу промышленность. Это позволит нам быстрее развивать нашу страну. Однако углубление связей между нами также станет всё более заметным, а это значит, что наш народ будет недоволен."
TRM_Jap_Inv2: "Инвестиции дзайбацу"
TRM_Jap_Inv2_desc: "Японские промышленные гиганты всё чаще рассматривают нас как полезный рынок для своих товаров. Однако, запрашивая дальнейшие финансовые вложения от них, народ Приамурья, несомненно, не одобрит наше заигрывание с Токио."
TRM_Jap_Military_Mission: "Японская военная миссия"
TRM_Jap_Military_Mission_desc: "Наш флот пожинает большие плоды от нашей сердечности с Японией, которая стала ещё более заметной благодаря нашим недавним совместным усилиям по развитию флота. Мы должны установить аналогичные отношения с японской армией. Однако это, вероятно, приведёт к дальнейшему гневу среди нашего населения."

TRM_hold_vladivostok: "Удержать Владивосток от Японии"
TRM_hold_vladivostok_desc: "У нас мало шансов отбросить японские войска к океану. Наше единственное решение для выживания - удерживать Владивосток достаточно долго, чтобы вся суть этой войны стала бессмысленной в глазах японского народа. Как гласит русская пословица: «Неуловимый Джо потому и неуловим, что его никто не хочет искать». Мы должны стать таким Джо для японцев."

TRM_raise_militia: "Сформировать городское ополчение во Владивостоке"
TRM_raise_militia_desc: "Настало время бороться за нашу свободу. Патриотически настроенные граждане Владивостока формируют группы ополчения для защиты своей родины. С нашей небольшой помощью мы можем организовать их во вспомогательные подразделения, чтобы заполнить линии фронта."

TRM_oblastniki_influence: "Сибирское областничество"
TRM_oblastniki_influence_desc: "Областники, сибирские регионалисты - это те, кто считает, что весь сибирский регион должен быть по крайней мере автономным. После путча Колчак пообещал предоставить Сибири широкую автономию. Однако его сотрудничество с японцами и авторитарное правление ограничивают мечты областников. Их сопротивление будет расти день ото дня, если Колчак не выполнит своего обещания."

