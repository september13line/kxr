TRM_dealing_with_minorities: "Непокорные инородцы"
TRM_dealing_with_minorities_desc: "При администрации адмирала Колчака автономия якутов и бурят на Дальнем Востоке снова была значительно ограничена. §lБурнацком§! и якутское §7Областное народное управление§! продолжают существовать, но явно выступают против власти центрального правительства.\n\nВ настоящее время ситуация в этих районах довольно напряжённая, периодически происходят различные акты саботажа и беспорядки. Тем не менее, мы должны решить эту проблему."
