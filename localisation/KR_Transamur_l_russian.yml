POLITICS_KYRIL_ROMANOV_TRM_DESC: "Божией поспешествующей милостью, Мы, Кирилл I, Император и Самодержец Всероссийский, Царь Сибирский; и всех северных стран Повелитель; и прочая, и прочая, и прочая."
POLITICS_KAZEMBEK_DESC: "§YОписание лидера\nДата рождения:§! §L15 февраля 1902 года, Казань, Казанская губерния, Российская Империя§!\n§YПолитическая карьера:§! Мало кто мог предсказать, что Александр Казем-Бек окажется в том положении, в котором он находится сегодня. Кажется, что его жизнь - это просто урок нестабильности вселенной; хаоса политики и человеческого существования. Родившись в знатной ирано-азербайджанской семье, Казем-Бек испытал на себе всю тяжесть Русской революции; это, несомненно, сформировало его эксцентричные политические взгляды. Однако вместо того, чтобы настроить его против Советов, революция внушила ему определённый уровень уважения к Советской системе. И даже несмотря на то, что Красная революция провалилась, Казем-Бек всё равно включил части Советских идеалов в свою личную политику.\n\nЕго харизма и опыт оратора выдвинули его на передний край новой группы «Молодая Россия», группы, отвергавшей реакционный царизм в пользу «нового и динамичного видения». По мере ухудшения ситуации в России профессор Николай Устрялов убедил партийного секретаря Казем-Бека поддержать Александра Колчака и его переворот против Петроградского правительства. Однако переворот Колчака провалился, что привело к созданию государства Приамурье; государства-осколка, куда бежали Казем-Бек и Устрялов. Эта череда событий привела к тому, что Устрялов и Казем-Бек отвергли идеологию белых в пользу большевиков. Эта идеализация привела к развитию концепции «Трудовой монархии» и системы, сочетающей советскую демократию, православный интегрализм, русский национализм и «революционный дух». И по мере того как его идеология росла и менялась, росло и влияние младороссов внутри Приамурья. Их влияние росло и расширялось до такой степени, что они смогли захватить власть после Антиколчаковского переворота.\n\nТеперь Казем-Бек стоит как «Вождь» государства-осколка Приамурье. И хотя его влияние сейчас может быть невелико, у Казем-Бека есть планы восстановить Царя и вскоре вернуть всю Россию."
POLITICS_KYRIL_ROMANOV_MLAD_DESC: "Великий князь Кирилл Владимирович, ныне Кирилл I России, - один из самых проблемных членов Дома Романовых. Сильный волей, амбициозный и решительный захватить трон, он не раз доставлял головную боль своему двоюродному брату Николаю II. Это открытый секрет, что во время Февральской революции Кирилл активно действовал против Царя и остального Дома, даже до такой степени, что приказал своим людям поднять красный флаг над Петроградом - не из-за какой-либо приверженности революционным идеалам, а из-за надежды, что он станет регентом или, возможно, даже Царём после отречения своего кузена.\n\nПосле казни Николая и его семьи Кирилл заявил о своей власти над разрозненным домом Романовых, что было оспорено остальной семьёй, которая заявляла, что Кирилл не имеет права на восстановленный российский трон и на то, чтобы возглавлять русскую царскую семью. Однако к 1929 году он был в конечном счёте признан - преждевременная смерть великого князя Николая, безусловно, помогла. Хотя Кирилл неохотно воздаёт должное младороссам, для него на самом деле неважно, кто держит ключи от власти; до тех пор, пока он в какой-то форме у руля. Даже если Кирилл находится под фактическим домашним арестом и является не более чем бессильной марионеткой по сравнению с Вождём."
POLITICS_ALEXANDR_KOLCHAK_DESC: "§YОписание лидера\nДата рождения:§! §L16 ноября 1874 года, Александровское, Санкт-Петербургская губерния, Российская Империя\n§YПолитическая карьера:§! Некогда полярный исследователь и командир в Императорском Российском флоте, участвовавший как в Русско-японской войне, так и в Мировой войне, Колчак теперь является самопровозглашённым «Верховным правителем России» в марионеточном квази-государстве на Дальнем Востоке, безуспешно пытающемся сбросить оковы японского империализма. Как он пришёл к такой жизни?\n\nКогда гражданская война бушевала на просторах России, Колчак, во многом неожиданно для себя самого, был провозглашён Верховным правителем России во время путча в ноябре 1918 года. Сначала арестовав эсеров и объявив военное положение, неминуемую катастрофу предотвратил Борис Савинков, договорившийся с Колчаком о принятии эсеровской аграрной реформы. Белые были едины и сильны. Сибирская армия вскоре соединилась с другими белыми армиями, и к концу 1919 года большевики сдались. Сделав трудный выбор в пользу России, Колчак сделал столь же трудный выбор, отказавшись от верховной власти и утвердив Второе Учредительное собрание в 1920 году.\n\nОднако его отношения с правительством новосозданной Российской Республики были довольно враждебными из-за Брест-Литовского договора, который они согласовали и подписали, японской интервенции в Приамурье и Восточно-Карельского восстания. Эти отношения только ухудшились в 1925 году после неудавшейся попытки государственного переворота Колчака против правительства «немецких прихвостней» Керенского. Мятежному адмиралу удалось бежать из России и, по иронии судьбы, найти убежище в прояпонском государстве Приамурье, власть в котором принадлежала Квантунской армии и богатейшей семье Меркуловых. Заручившись поддержкой атамана забайкальских казаков Семёнова и восточносибирских областников, а также поддержкой Токио, Колчак снова оказался в кресле Верховного правителя, но на этот раз с чёткой целью - закончить начатое и свергнуть Петроградский режим."
POLITICS_SHUMYATSKY_DESC: "Родители Бориса Шумяцкого были вынуждены отправиться в ссылку в Сибирь, потому что отказались покинуть свой дом. Этот случай засел в памяти Шумяцкого, постоянно напоминая ему о коррупции в царском правительстве, базировавшемся в Петрограде. Бывший большевик, Шумяцкий был вынужден покинуть Россию по окончании Гражданской войны и стал влиятельным политиком в Приамурье. Несмотря на смещение его политических взглядов вправо, Шумяцкий продолжает преследовать цель превратить Приамурье в государство всеобщего благосостояния. Его прошлый опыт агитатора-большевика помог ему получить большинство голосов на президентских выборах."
POLITICS_MERKULOV_DESC: "§YОписание лидера\nДата рождения:§! §L1870 год, Благовещенск, Амурская область, Российская Империя§!\n§YПолитическая карьера:§! Бывший лидер прояпонского Временного правительства Приамурья, Меркулов и его брат являются самыми богатыми людьми в Приамурье. Теперь, когда Колчак больше не стоит на его пути и демократия наконец вернулась во Владивосток, Меркулов, сын простого крестьянина, стремится привести Приамурье к процветанию. Его обширные личные связи с народом помогли ему получить большинство голосов на президентских выборах."
POLITICS_SERGEY_VOYTSEKHOVSKIY_MILITARY_DESC: "§YОписание генерала\nДата рождения:§! §L16 октября 1883 года, Витебск, Витебская губерния, Российская Империя§!\n§YПроисхождение:§! Генерал от артиллерии Сергей Войцеховский стал видной фигурой в Чехословацком легионе во время своего пребывания в Челябинске, став героем Белого движения. Он возглавил чрезвычайное восстание Чехословацкого легиона, которое широко считалось ключевым событием, значительно повлиявшим на победу белых. Служа под командованием адмирала Александра Колчака, Войцеховский одержал множество побед для его наступающей армии.\n\nПосле окончания войны Войцеховский и другие старшие командиры Чехословацкого легиона, включая Радолу Гайду, отказались возвращаться в Австро-Венгрию после того, как чехословакам в Богемии была предоставлена значительная автономия. Неспособность администрации Керенского противостоять немецкому наступлению привела к тому, что Чехословацкий легион поддержал переворот Колчака 1918 года и впоследствии был вынужден укрыться в Сибири."
POLITICS_SERGEY_VOYTSEKHOVSKIY_DESC: "§YОписание лидера\nДата рождения:§! §L16 октября 1883 года, Витебск, Витебская губерния, Российская Империя§!\n§YПроисхождение:§! Генерал от артиллерии Сергей Войцеховский стал видной фигурой в Чехословацком легионе во время своего пребывания в Челябинске, став героем Белого движения. Он возглавил чрезвычайное восстание Чехословацкого легиона, которое широко считалось ключевым событием, значительно повлиявшим на победу белых. Служа под командованием адмирала Александра Колчака, Войцеховский одержал множество побед для его наступающей армии.\n\nПосле окончания войны Войцеховский и другие старшие командиры Чехословацкого легиона, включая Радолу Гайду, отказались возвращаться в Австро-Венгрию после того, как чехословакам в Богемии была предоставлена значительная автономия. Неспособность администрации Керенского противостоять немецкому наступлению привела к тому, что Чехословацкий легион поддержал переворот Колчака 1918 года и впоследствии был вынужден укрыться в Сибири.\n\nТеперь, как опытный лидер легионеров, Войцеховский контролирует российский Дальний Восток и готов восстановить порядок не только в России, но и на всех славянских территориях."
POLITICS_GAJDA_MILITARY_DESC: "§YОписание генерала\nДата рождения:§! §L14 февраля 1892 года, Котор, Королевство Далмация, Австро-Венгерская монархия§!\n§YПроисхождение:§! Жизнь Рудольфа Гейдля, ныне известного как Радола Гайда, увлекательна. Родившись в семье австрийского унтер-офицера и бедной черногорской дворянки, жизнь Гайды была сложным образом переплетена с судьбами как немцев, так и славян. Мобилизованный в австро-венгерскую армию во время Великой войны, он вскоре дезертировал, чтобы присоединиться к черногорской армии. После её поражения он бежал в Россию, где включился в чехословацкое легионерское движение. Вместе с Сергеем Войцеховским он организовал восстания Легиона в Сибири, позже став одним из лидеров Сибирской армии. Благодаря его усилиям была взята Вятка и Белые армии соединились на Волге.\n\nПосле войны Гайда предпочёл не возвращаться в Чехословакию, несмотря на амнистию, предоставленную новым правительством, а вместо этого учредил теневое альтернативное «правительство» в изгнании."
POLITICS_GAJDA_DESC: "§YОписание лидера\nДата рождения:§! §L14 февраля 1892 года, Котор, Королевство Далмация, Австро-Венгерская монархия§!\n§YПроисхождение:§! Жизнь Рудольфа Гейдля, ныне известного как Радола Гайда, увлекательна. Родившись в семье австрийского унтер-офицера и бедной черногорской дворянки, жизнь Гайды была сложным образом переплетена с судьбами как немцев, так и славян. Мобилизованный в австро-венгерскую армию во время Великой войны, он вскоре дезертировал, чтобы присоединиться к черногорской армии. После её поражения он бежал в Россию, где включился в чехословацкое легионерское движение. Вместе с Сергеем Войцеховским он организовал восстания Легиона в Сибири, позже став одним из лидеров Сибирской армии. Благодаря его усилиям была взята Вятка и Белые армии соединились на Волге.\n\nПосле войны Гайда предпочёл не возвращаться в Чехословакию, несмотря на амнистию, предоставленную новым правительством, а вместо этого учредил теневое альтернативное «правительство» в изгнании.\n\nБудучи ярым противником всего немецкого, Гайда теперь оказывается у руля командования и управления на Дальнем Востоке - золотая возможность воздать должное немцам и австрийцам и вернуть Чехословацкий легион на их исконную родину."
POLITICS_ANATOLIY_PEPELYAEV_MILITARY_DESC: "§YОписание генерала\nДата рождения:§! §L15 июля 1891 года, Томск, Томская губерния, Российская Империя§!\n§YПроисхождение:§! Родившись в военной семье, Анатолий Николаевич Пепеляев избрал военную карьеру.\n\nВ начале Великой войны Пепеляев участвовал в ожесточённых боях на Западном и Северном фронтах. Несмотря на то, что он поддерживал дисциплину среди своих войск, в то время как остальная Российская армия разваливалась, Пепеляев тем не менее оставался настолько популярным, что после Октябрьского переворота был избран своими войсками для сохранения командования.\n\nПосле того как большевики захватили контроль над Томском, Пепеляев немедленно присоединился к городскому белому подполью. Он руководил освобождением города от красного контроля и созданием антибольшевистского правительства. Пепеляев и его войска сыграли важную роль в обращении вспять контроля красных над Сибирью, за что в возрасте всего 27 лет он был удостоен звания генерал-майора. Омский переворот в ноябре того же года был для Пепеляева смешанным благословением, который недолюбливал сибирское эсеровское правительство, но всё же считал себя демократом с эсеровскими симпатиями. Он продолжал верно служить, и его Среднесибирский корпус прошёл почти непобеждённым от Перми к Волге. Пепеляев заслужил прозвище «Сибирский Суворов» и был награждён командованием 2-й армией после отражения жестоких красных контрнаступлений 1919 года.\n\nБудучи известным в России именем благодаря своей молодости и успехам, он остался в армии после Гражданской войны. Вместе со своим братом Виктором Пепеляев поддержал путч Колчака в 1925 году, бежав в Приамурье и став одним из лидеров Генерального штаба новой Сибирской армии. Пепеляев остаётся одним из самых известных генералов России и проводит много времени, выступая за большую личную инициативу среди младших офицеров."
POLITICS_ANATOLIY_PEPELYAEV_DESC: "§YОписание лидера\nДата рождения:§! §L15 июля 1891 года, Томск, Томская губерния, Российская Империя§!\n§YПроисхождение:§! Родившись в военной семье, Анатолий Николаевич Пепеляев избрал военную карьеру.\n\nВ начале Великой войны Пепеляев участвовал в ожесточённых боях на Западном и Северном фронтах. Несмотря на то, что он поддерживал дисциплину среди своих войск, в то время как остальная Российская армия разваливалась, Пепеляев тем не менее оставался настолько популярным, что после Октябрьского переворота был избран своими войсками для сохранения командования.\n\nПосле того как большевики захватили контроль над Томском, Пепеляев немедленно присоединился к городскому белому подполью. Он руководил освобождением города от красного контроля и созданием антибольшевистского правительства. Пепеляев и его войска сыграли важную роль в обращении вспять контроля красных над Сибирью, за что в возрасте всего 27 лет он был удостоен звания генерал-майора. Омский переворот в ноябре того же года был для Пепеляева смешанным благословением, который недолюбливал сибирское эсеровское правительство, но всё же считал себя демократом с эсеровскими симпатиями. Он продолжал верно служить, и его Среднесибирский корпус прошёл почти непобеждённым от Перми к Волге. Пепеляев заслужил прозвище «Сибирский Суворов» и был награждён командованием 2-й армией после отражения жестоких красных контрнаступлений 1919 года.\n\nБудучи известным в России именем благодаря своей молодости и успехам, он остался в армии после Гражданской войны. Вместе со своим братом Виктором Пепеляев поддержал путч Колчака в 1925 году, бежав в Приамурье и став одним из лидеров Генерального штаба новой Сибирской армии. Пепеляев остаётся одним из самых известных генералов России и проводит много времени, выступая за большую личную инициативу среди младших офицеров.\n\nПосле падения адмирала-диктатора задача спасения Дальнего Востока, Сибири и, возможно, всей России теперь лежит на плечах Пепеляева."
POLITICS_SEMYONOV_DESC: "§YОписание лидера\nДата рождения:§! §L25 сентября 1890 года, Куранжа, Забайкальская область, Российская Империя§!\n§YПолитическая карьера:§! Атаман байкальских казаков, Семёнов и его ребята сумели установить Забайкальское государство, ныне известное как Приамурье, чтобы бороться с большевиками, которые агитировали на российском Дальнем Востоке. Его новорождённая страна вскоре была подчинена Японией. Когда переворот Колчака в 1925 году провалился и мятежный адмирал покинул Россию, направившись в Приамурье, Семёнов был вынужден уйти в отставку и продолжить свою карьеру в качестве военного командира. Однако «отец-основатель» сумел вернуться, будучи политически влиятельным. Единственная цель Семёнова - видеть Приамурье процветающим, и для этого он не желает вести неопределённые войны."
POLITICS_YUI_DESC: "§YОписание лидера\nДата рождения:§! §L27 ноября 1860 года, Коти, область Тоса, Япония\n§YПолитическая карьера:§! Старый генерал Мицуэ знаком с принятием командования, так как он возглавлял японский экспедиционный корпус во время Гражданской войны в России. Будучи благородным военным героем, он удостоен от императора высочайшего дара; мирно править землями, которые он завоевал много лет назад. Старик - изоляционист и не стремится вести какую-либо войну. С его приходом к власти в качестве главы Приамурья мечта о Великом Приамурье умерла."
POLITICS_MIKHAIL_DITERIKHS: "§YОписание лидера\nДата рождения:§! §L17 апреля 1874 года в Санкт-Петербурге, Санкт-Петербургская губерния, Российская Империя§!\n§YПолитическая карьера:§! §LМихаил Дитерихс, потомственный военный и глава местного РОВС, был известен своими экстравагантными взглядами на устройство общества. Взглядами, которые он последовательно продвигал на протяжении десятилетий. Убеждённый монархист и сторонник самодержавия, Дитерихс видит спасение России в новом Земском соборе, а себя - проводником традиционного русского православия и монархизма. Желая разделить государство на церковные приходы как единицы самоуправления, Дитерихс мечтает построить истинно православную Россию.§!"
POLITICS_MIKHAIL_DITERIKHS_GENERAL: "§YОписание генерала\nДата рождения:§! §L17 апреля 1874 года в Санкт-Петербурге, Санкт-Петербургская губерния, Российская Империя§!\n§YВоенная карьера:§! §LМихаил Дитерихс родился в семье полковника артиллерии и дворянки. С рождения ему была уготована военная карьера. Он получил хорошее военное образование и служил на различных штабных должностях до начала Русско-японской войны. Во время войны участвовал в крупных сражениях, таких как Мукден и на реке Шахэ. Позже был назначен начальником отделения в Мобилизационном отделе Главного управления Генерального штаба. На этой должности он встретил начало Мировой войны. В годы войны служил начальником штаба 3-й армии. В начале сентября 1916 года он отправился из Архангельска в Салоники для поддержки сербской армии. Под его руководством были разгромлены части болгарской армии, в результате чего союзники 19 ноября заняли город Монастир. Однако на этом военные успехи закончились. После Февральской революции он был отозван обратно в Россию и назначен начальником штаба Особой Петроградской армии. В ноябре 1917 года перебрался на Украину, где в марте 1918 года стал начальником штаба Чехословацкого корпуса. Вместе с ними отправился во Владивосток. Поддержал Александра Колчака и 17 января 1919 года был назначен председателем комиссии по расследованию убийства царской семьи. В последние годы Гражданской войны Дитерихс занимал несколько должностей, включая командующего Сибирской армией, командующего Восточным фронтом и начальника штаба Верховного главнокомандующего Колчака. Он также сыграл ключевую роль в создании добровольческих формирований летом и осенью 1919 года, которые основывались на защите веры. К ним относились православные «Дружины Святого Креста» и мусульманские «Дружины Зелёного Знамени».\n\nВо время путча Колчака Дитерихс поддержал своего бывшего союзника и остался на Дальнем Востоке в качестве главы дальневосточного отделения РОВС. Он стал одним из лидеров Сибирской армии, в отличие от многих монархистов, сохранивших верность Петрограду.§!"
POLITICS_VLADIMIR_KAPPEL_DESC: "§YОписание генерала\nДата рождения:§! §L28 апреля 1883 года, Царское Село, Санкт-Петербургская губерния, Российская Империя§!\n§YВоенная карьера:§! §LВладимир Каппель происходит из дворянской семьи военных и поэтому решил пойти по стопам отца, хотя тот погиб в бою, когда он был ещё ребёнком. Хотя он получил образование кавалерийского офицера, окончил он учёбу, создав доклад об устаревании кавалерии перед лицом моторизованных сил. Он добросовестно служил в Мировую войну и участвовал в Брусиловском прорыве, но его отношение изменилось, когда вспыхнула Февральская революция. Ярый монархист, Каппель поначалу хранил молчание, надеясь на восстановление романовского порядка после стабилизации ситуации, но вскоре начал строить заговоры с другими будущими белыми генералами. Когда большевики захватили власть, он находился в Перми и отправился в Самару, чтобы вступить в Народную армию Комуча, республиканскую социалистическую силу, поклявшуюся восстановить Учредительное собрание, - было удивительно видеть монархиста, возглавляющего социалистические силы.\n\nКаппель выполнял свои обязанности с впечатляющими результатами - он проявил своё мастерство расчётливого тактика и эксперта по зимней войне, что позволило ему без труда разгромить в несколько раз превосходящие силы большевиков. Большевистские газеты даже прозвали его «маленьким Наполеоном»; однако прижившееся прозвище было «Солдат-генерал» - командир, который всегда оставался со своими людьми и сражался бок о бок с винтовкой и гранатой. После окончания большевистского восстания Каппель остался в армии и стал одним из важнейших генералов в её пехотном корпусе, хотя вскоре решил присоединиться к путчу Колчака и оказался на Дальнем Востоке. Он является сторонником моторизации армии и модернизации офицерского корпуса.§!"

