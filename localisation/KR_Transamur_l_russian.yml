TRM_Spheres_Of_Influence: "Дальневосточная смута"
TRM_Spheres_Of_Influence_desc: "\n\n£trm_test_kolchak£\n\n\n\nЗахватив власть в Приамурье в 1925 году, £kolcak_texticon£ §gАдмирал Колчак§! объединил различные  £operatives_diplomatic_pressure_texticon£  §7группы людей§! в состояние постоянных £stage_coup_risk_texticon£  §Lдискуссий,§!\n£impact_texticon£ скандалов и £SOV_propaganda_text_icon£ споров.\n\nЭто привело к £decrease_reversed_texticon£ §Vсозданию§! номинальных  £production_licence_cost_texticon£  сфер влияния, в которых определенные политические £morale_texticon£ §8группы§! имеют больший £occupation_cost_gain_texticon£ §gавторитет§! и\n£operatives_boost_popularity_texticon£  влияние среди £population_texticon£ граждан, чем другие.\n\nПоскольку £manpower_cost_texticon£ политические группы £pb_nationalistic_fervour_texticon£ §gидеологически§! различимы,\n£balance_texticon£  §Lконфликт интересов§! является §Rнеизбежной§! частью современной политики правительства Приамурья.\n\nВсё это, делает адмирала £kolcak_texticon£ §gКолчака§! центральной £operatives_boost_popularity_texticon£ фигурой в\n£political_violence_texticon£ §8хаосе§! Дальнего Востока, пытающегося £operatives_root_out_resistance_texticon£ обуздать амбиции каждой политической £manpower_cost_texticon£ §gгруппы§! и в то же время §7навязать§! свою собственную политику.\n\nЕсли ситуация £border_texticon£ §Vвыйдет§! из под контроля и будет §9нарушен§! £stability_texticon£ балланс сил, то  £violence_damage_texticon£ §8сопротивление§! правительству §gКолчака§! станет очевидным...\n\n                                    £kolcak_texticon£  поддержка режима  §gКолчака:§!  -»  [?TRM.TRM_Overall_Kolchak_Support|g%0]\n\n          §4Казаки:§!  влияние  -  [?TRM.TRM_Overall_Cossack_Support|C%0]     §X«§! £cossack_texticon£ §X»§!   §4Казаки:§!  лояльность  -  [GetCossackOrientation]\n\n                              £oblastniki_influence_texticon£  §7Областники:§!  среднее сопротивление  -»  §l[?TRM.TRM_Overall_Oblastniki_Support|l%0]§!\n\n                    §nДВСВ§!:  влияние - [?TRM.TRM_Overall_ROVS_Support|n%0]   §X«§! £dorovs_texticon£ §X»§!  §nДВСВ§!:  лояльность - [GetROVSOrientation]"

