TRM_Increase_Trade_With_Japan: "Увеличить торговлю с Японией"
TRM_Increase_Trade_With_Japan_desc: "Мы можем ненавидеть японцев, но даже слепой может понять, что мы зависим от их экономики. Было бы более чем разумно улучшить наши торговые отношения с Империей."
TRM_Aid_From_Japan: "Контакты с Mitsui"
TRM_Aid_From_Japan_desc: "Одним из дзайбацу, наиболее заинтересованных в улучшении отношений с нами, является Mitsui, который предпринял значительные усилия по политическому лоббированию, чтобы заручиться поддержкой японского правительства для Дальневосточной армии. Они надеются, что их действия обеспечат им особое положение в отношении контроля над нашими природными ресурсами, а также расширят их присутствие на рынке в Приамурье. Если мы выполним их просьбы, последует дополнительная помощь."
TRM_Zaibatsu_Investments: "Инвестиции «Дзайбацу»"
TRM_Zaibatsu_Investments_desc: "Японские промышленные гиганты все чаще рассматривают нас как полезный рынок для своих товаров. Однако, требуя от них дальнейших финансовых инвестиций, жители Приамура, несомненно, не одобрят нашего расположения к Токио."
TRM_unlock_japanese_manufacturers: "Открывает следующие компании:\n- §Y$toyota$§!\n- §Y$nissan$§!\n- §Y$nagoya_arsenal$§!\n- §Y$kr_osaka_army_arsenal$§!\n"
TRM_unlock_najakima: "Открывает компанию §Y$nakajima_factory_vladivostok$§!"

TRM_lease_resources: "Арендовать ресурсы в [FROM.GetName]"
TRM_lease_resources_unlock_tt: "Открывает решение: £GFX_decision_icon_small §YАрендовать ресурсы§!"
TRM_develop_civ_unlock_tt: "Открывает решение: £GFX_decision_icon_small §YРазвивать промышленность§!"
TRM_develop_mil_unlock_tt: "Открывает решение: £GFX_decision_icon_small §YРазвивать военную промышленность§!"

TRM_Invite_Japanese_Instructors: "Привлечь японских инструкторов"
TRM_Invite_Japanese_Instructors_desc: "Несмотря на то что японская помощь и инвестиции оказались весьма выгодными, наша экономика до смешного неэффективна по сравнению с экономикой страны восходящего солнца. Нам следует обратиться к нашим друзьям на востоке за экономическими консультациями и попросить личной помощи японских промышленников. Однако такой шаг может привести к массовым волнениям среди нашего народа; эти инструкторы могут быть восприняты как колонизаторы."
TRM_Russo_Japanese_Naval_Treaty: "Русско-японский военно-морской договор"
TRM_Russo_Japanese_Naval_Treaty_desc: "По мере сближения с Японией они готовы подписать с нами договор, который позволит нам сотрудничать с японскими учеными в разработке военно-морских доктрин. Однако это, вероятно, разозлит наш народ, который ненавидит японских империалистов."
TRM_Japanese_Military_Mission: "Японская военная миссия"
TRM_Japanese_Military_Mission_desc: "Наш флот извлекает огромную выгоду из сердечных отношений с Японией, которые становятся все более выраженными благодаря нашим недавним совместным военно-морским разработкам. Мы должны установить такие же отношения с японской армией. Однако это, скорее всего, вызовет ещё больший гнев среди нашего населения."
TRM_Fengtian_Mutual_Excercises: "Фэнтяньские совместные учения"
TRM_Fengtian_Mutual_Excercises_desc: "Мы проведем совместные военные учения с правительством Фэнтяня, чтобы улучшить навыки нашей пехоты и установить хорошие отношения между двумя нашими частично признанными, но, тем не менее, законными государствами."
TRM_Japanese_Arms: "Японское оружие"
TRM_Japanese_Arms_desc: "Поскольку наше военное производство всё ещё находится в плачевном состоянии, мы вынуждены полагаться на японские вооружения, чтобы обеспечить нашу армию оружием."

TRM_Seek_For_Entente_Support: "Поиск поддержки Антанты"
TRM_Seek_For_Entente_Support_desc: "Прошли годы с тех пор, как были разорваны связи между Россией и Антантой. Хотя они некоторое время поддерживали наше правительство в Гражданской войне, их помощь прекратилась, как только правительство Керенского, состоящее из прогерманских подхалимов, укрепило своё правление. Мы должны показать британскому королю, что Россия всё ещё здесь и по-прежнему является верным союзником."
TRM_North_Pacific_Trade_Route: "Северо-Тихоокеанский торговый путь"
TRM_North_Pacific_Trade_Route_desc: "Восстановив связи с Канадой, мы должны создать официальный Северо-Тихоокеанский торговый путь и, возможно, построить лучший порт на Камчатке, поскольку вход в Охотское море может быть заблокирован японцами."
TRM_Open_British_Embassy: "Открыть британское посольство во Владивостоке"
TRM_Open_British_Embassy_desc: "Хотя мы всегда были в хороших отношениях с Канадой, у них до сих пор не было представительства на дальневосточной земле. Мы должны открыть посольство во Владивостоке, чтобы обеспечить лучшие отношения между нашими странами."
TRM_russo_canadian_naval_treaty: "$TRM_Russo_Canadian_Naval_Treaty$"
TRM_russo_canadian_naval_treaty_desc: "$TRM_Russo_Canadian_Naval_Treaty_desc$"

TRM_regain_port_vladivostok: "Вновь овладеть портом Владивостока"

### Focuses ###

### Navy ###
TRM_Russias_Eastern_Harbour: "Восточная гавань"
TRM_Russias_Eastern_Harbour_desc: "При царизме Владивосток был крупным портом и городом на Дальнем Востоке России, но после русско-японской войны он несколько утратил своё значение. После Вельткрига и неудачного переворота Колчака в 1925 году город снова пережил возрождение как крупный торговый порт для японцев."
TRM_Expand_The_Vladivostok_Port_Authority: "Расширить администрацию порта Владивосток"
TRM_Expand_The_Vladivostok_Port_Authority_desc: "Еженедельно в наш порт заходит все большее количество судов, и гавань Владивостока стала перегруженной из-за бесконечных волн грузовых кораблей. Мы расширим порт, чтобы облегчить эти проблемы."
TRM_The_Grand_Fleet: "Великий флот"
TRM_The_Grand_Fleet_desc: "После поражения России в русско-японской войне Тихоокеанский флот стал живым примером несчастья. Как законное правительство России мы обязаны восстановить былую славу нашего Тихоокеанского флота."
TRM_Pearl_Of_The_East: "Жемчужина Востока"
TRM_Pearl_Of_The_East_desc: "Владивосток - наша великая жемчужина. Мы должны сделать все, чтобы наш город стал центром силы Восточной Азии. Результатом наших усилий станут большие военно-морские сооружения и мощные военно-морские укрепления."
TRM_Legacy_Of_The_Weltkrieg: "Наследие Вельткрига"
TRM_Legacy_Of_The_Weltkrieg_desc: "С момента окончания Вельткрига прошло много времени. Военно-морская мысль изменилась, и новые технологии, такие как авианосцы и подводные лодки, получили большое развитие. И все же эти легкомысленные новые игрушки - ничто по сравнению со старыми военными кораблями. Мощный флот сокрушит все на своем пути."
TRM_Develop_Cruisers: "Развитие крейсеров"
TRM_Develop_Cruisers_desc: "Мы ещё не готовы строить большие линкоры, поэтому разумнее будет сосредоточиться на небольших кораблях, таких как крейсеры. Они - один из ключей к морскому господству и достойная начальная цель для нашего флота."
TRM_Destroyers_Of_Amur: "Эсминцы Амура"
TRM_Destroyers_Of_Amur_desc: "Эсминцы - это небольшие быстроходные корабли, которые производятся для сопроВождения торговых конвоев и более крупных судов. Хотя они не являются вершиной военного флота с точки зрения тоннажа и мощности, мы не можем позволить себе игнорировать их."
TRM_A_New_Path: "Новый путь"
TRM_A_New_Path_desc: "Появление подводных лодок и авианосцев во время Вельткрига было неожиданным. С тех пор они доказали свою эффективность. Хотя мы, скорее всего, по-прежнему будем полагаться на наш сохранившийся основной флот, возможно, мы могли бы дополнить его этими новыми типами кораблей?"
TRM_Invisible_Navy: "Невидимый флот"
TRM_Invisible_Navy_desc: "Эти коварные машины тотального уничтожения отлично подходят для охоты на вражеские конвои и надводные корабли. Мы должны получить их немедленно!"
TRM_Pacific_Carriers: "Тихоокеанские авианосцы"
TRM_Pacific_Carriers_desc: "Многие считают, что за авианосцами будущее войны в открытом море, особенно в большом Тихом океане. Было бы разумно воспользоваться нашим положением и возможностями для строительства этих новых кораблей."
TRM_Russo_Canadian_Naval_Treaty: "Русско-канадский морской договор"
TRM_Russo_Canadian_Naval_Treaty_desc: "Наши давний друг Канада - это также нация, которая должна полагаться на свою мощную военно-морскую армаду для своей безопасности. Было бы разумно подписать с ними договор, который обеспечил бы наше сотрудничество в вопросах военно-морского флота."
TRM_Jap_Naval_Treaty: "Русско-Японский морской договор"
TRM_Jap_Naval_Treaty_desc: "Раз мы всё сильнее сближаемся с Японией, они решили заключить с нами договор, который даст нам возможность кооперироваться с японскими учёными для развития морских доктрин. Однако, это, скорее всего, расстроит людей, которые ненавидят Японских империалистов."

### Economy Focuses ###

TRM_Expand_Industry_In_Vladivostok: "Начальная индустриализация"
TRM_Expand_Industry_In_Vladivostok_desc: "Самодержавное правительство Колчака почти ничего не сделало для развития нашей страны в 1920-е годы. Сейчас у нас явно отсталая промышленность, и эту ситуацию необходимо срочно исправлять. Мы должны начать развивать нашу страну шаг за шагом. Даже если прогресс будет медленным, постепенные улучшения когда-нибудь приведут к процветанию страны."
TRM_Expand_Industry_In_Khabarovsk: "Промышленность в Хабаровске"
TRM_Expand_Industry_In_Khabarovsk_desc: "Хабаровск - наш второй по величине город. Хотя слово "большой" трудно использовать в отношении нашей страны, мы можем расширить промышленность в этом городе, чтобы он соответствовал нашим планам на будущее."
TRM_Expand_Industry_In_The_Far_East: "Развить промышленность Дальнего Востока"
TRM_Expand_Industry_In_The_Far_East_desc: "Дальний Восток России - это просто бескрайняя пустошь, покрытая снегом и тундрой. Но даже в этом суровом климате мы можем открыть несколько новых объектов для развития нашей промышленности."
TRM_Improve_The_Nikolayevsk_Port: "Улучшить порт Николаевска"
TRM_Improve_The_Nikolayevsk_Port_desc: "Порт Николаевска находится в плохом состоянии из-за неиспользования его прежними владельцами. Реконструкция позволит создать новую военно-морскую базу."
TRM_Mineral_Wealth: "Добыча полезных ископаемых"
TRM_Mineral_Wealth_desc: "Поскольку большая часть наших финансовых ресурсов уходит на поддержку войны, у нас остаётся очень мало денег на внутреннее развитие. Это ещё одна область, где наши японские союзники могут нам помочь - возможность для Империи получать прибыль от дальневосточных ресурсов России была одной из основных причин их решения поддержать наше правое восстание, поэтому они охотно помогут нам в разведке и добыче новых источников сырья."

TRM_Siberian_Scientists: "Сибирские учёные"
TRM_Siberian_Scientists_desc: "Наши недавние завоевания привлекли множество мудрых умов в наши научные учреждения. Мы можем использовать их для улучшения практических возможностей нашей науки."
TRM_Build_Up_White_Russia: "Обустроить Белороссию"
TRM_Build_Up_White_Russia_desc: "В последние годы регион Белой Руси не слишком развивался, поэтому мы должны работать над его улучшением."
TRM_Appease_The_Polish: "Умиротворить поляков"
TRM_Appease_The_Polish_desc: "Поляки - мятежный народ, поэтому их нужно не подавлять, а приручать. Мы можем распространить наш промышленный проект на этот регион, чтобы оказать им желанную помощь."
TRM_Deal_With_Ukrainian_Navy: "Договориться с украинским флотом"
TRM_Deal_With_Ukrainian_Navy_desc: "У Севастополя большой флот, и мы можем решить, что с ним делать - перепрофилировать его или продать, чтобы получить доход."
TRM_Industrialise_Central_Asia: "Индустриализация Центральной Азии"
TRM_Industrialise_Central_Asia_desc: "Центральная Азия - отличное место для развития промышленности, так как её не хватает по сравнению с другими регионами государства, давайте развивать этот регион."
TRM_Develop_The_Caucasus: "Освоение Кавказа"
TRM_Develop_The_Caucasus_desc: "Земли Кавказа богаты нефтью, поэтому Германия стремилась закрепить за собой этот регион. Взяв регион под свой контроль, мы сможем улучшить промышленность для народа, который давно страдает."
TRM_Expand_The_Baltic: "Развитие Прибалтики"
TRM_Expand_The_Baltic_desc: "Прибалтика снова под нашим контролем, стоит ли продолжать русификацию, но вместо этого развивать промышленность в регионе, чтобы они были довольны нашим правлением."
TRM_RDS_1: "РДС-1"
TRM_RDS_1_desc: "После того как столица была вновь захвачена, учёные, находящиеся в ней, теперь участвуют в наших исследованиях, что дает нам преимущество перед соперниками. Кроме того, после завершения кампании по индустриализации все больше учёных в новых завоеванных регионах вливаются в наши ряды. Это сочетание помогло нам изобрести совершенно новые виды оружия для использования в войнах."

TRM_Trade_Jap: "Развитие торговли с Японией"
TRM_Trade_Jap_desc: "Мы можем ненавидеть японцев, но даже слепой может понять, что мы зависим от их экономики. Было бы более чем разумно улучшить наши торговые отношения с Империей."
TRM_Jap_Inv3: "Пригласить японских инструкторов"
TRM_Jap_Inv3_desc: "Хотя японская помощь и инвестиции приносят огромную прибыль, наша экономика смехотворно неэффективна по сравнению с экономикой страны восходящего солнца. Нам следует обратиться к нашим друзьям на востоке за экономическими консультантами и попросить личной помощи японских промышленников. Однако такой шаг может привести к массовым волнениям среди нашего народа; эти инструкторы могут быть восприняты как колонизаторы."

TRM_Feng_Dip: "Сближение с Фэнтянем"
TRM_Feng_Dip_desc: "Фэнтяньский режим также находится под большим влиянием Японии, а значит, является нашим союзником. Несмотря на это и близкое географическое соседство, наша страна имеет с Фэнтянем дипломатические и экономические связи, сопоставимые с любыми другими. Мы должны расширить нашу дипломатическую миссию в столице Фэнтяня, чтобы способствовать более тесным связям."
TRM_Feng_Workforce: "Привлечь фэнтяньских рабочих"
TRM_Feng_Workforce_desc: "На западе лежат обширные земли Маньчжурии, которыми правит Чжан Цзуолинь, наш случайный партнер и союзник. Многие бедные китайцы готовы работать на нас, даже за миску риса в день. Дешевая рабочая сила могла бы нам очень помочь, но японские чиновники, несомненно, воспользуются ею, чтобы усилить своё влияние в нашей политике."
TRM_Feng_Smugglers: "Контрабанда оружия от триад"
TRM_Feng_Smugglers_desc: "Постоянная нестабильность в Азии создает хорошие условия для различных контрабандистов и других преступников. Поскольку нам нужно оружие для борьбы, мы будем получать его из всех возможных источников. Триады из городов Легации предложили нам особую сделку. За определенную цену они доставят нам контрабандой значительное количество винтовок."

### Focuses ###

## Socialist Army ##
TRM_Celebrate_NRA_Triumph: "Торжество триумфа НРА"
TRM_Celebrate_NRA_Triumph_desc: "\n       «По долинам и по взгорьям\n       Шла дивизия вперёд,\n       Чтобы с бою взять Приморье,\n       Белой армии оплот!»\n\nДальний Восток наконец освобождён, и НРА выросла из небольшой силы в поистине народную армию."

TRM_Form_Revolutionary_Military_Council: "Расширить Реввоенсовет"
TRM_Form_Revolutionary_Military_Council_desc: "Революционный военный совет, или Реввоенсовет (РВС) - это не только необходимый символ народной Революции, но и важнейшее средство управления НРА. Теперь, когда весь Дальний Восток под нашим контролем, мы должны расширить как финансирование, так и кадры РВС, чтобы эффективно управлять нашими вооружёнными силами."
TRM_Political_Commissars: "Политические комиссары"
TRM_Political_Commissars_desc: "Решение IX съезда РКП, утвердившее более жёсткий контроль партии над Красной армией и расширившее роль политических комиссаров, также повлияло на партизанское движение на Дальнем Востоке. Несмотря на драматический крах как Военной оппозиции, так и самой Советской России, идея армии, верной делу социализма и партии, всё ещё присутствует среди руководства НРА."

TRM_Save_The_Decentralized_Structure: "Сохранить децентрализованную структуру"
TRM_Save_The_Decentralized_Structure_desc: "Децентрализованная структура НРА доказала свою эффективность как превосходная стратегия для победы над реакционерами на этой огромной земле. Мы должны сохранить её эффективность и инициативу наших партизан."
TRM_From_Militia_To_Regular_Army: "От ополчения к регулярной армии"
TRM_From_Militia_To_Regular_Army_desc: "Децентрализованная структура нашей армии была необходимым шагом в разбросанных холмах и лесах российского Дальнего Востока. Но по мере того, как наша армия становится сильнее и привлекает много солдат, необходимо централизовать её командование, установить призыв и начать мобилизацию."
TRM_Legacy_Of_53rd_Siberian_Rifle_Division: "Наследие 53-й дивизии"
TRM_Legacy_Of_53rd_Siberian_Rifle_Division_desc: "Мятежная 53-я Сибирская стрелковая дивизия под руководством Николая Калашникова фактически служила оплотом и в то же время инициатором НРА. И хотя она давно расформирована, именно героизм её ветеранов и их многолетняя борьба позволили нам выжить и победить тёмные силы."
TRM_Red_Cossacks: "Красные казаки"
TRM_Red_Cossacks_desc: "Казачье движение на Дальнем Востоке, несомненно, было скомпрометировано коррумпированными атаманами и японским оружием, с помощью которых они устраивали террор и репрессии в Забайкалье, Благовещенске и Уссури. Но в их рядах были ещё казаки, верные народу, которые держались в стороне от беззакония и грубости семёновских выродков. Нам нужно развивать красное казачество на Дальнем Востоке и привлекать на свою сторону казаков из ещё не освобождённых регионов."

TRM_Peoples_Revolutionary_Fleet: "Народно-революционный флот"
TRM_Peoples_Revolutionary_Fleet_desc: "Хотя Русско-японская война фактически уничтожила любое военно-морское господство, которое мы могли иметь в Азии, военно-морские силы НРА должны быть созданы для медленного восстановления Сибирской и Амурской флотилий, а также для закладки основы будущего Тихоокеанского флота [RUS.GetNameDef]"
TRM_Demand_Return_Of_Our_Fleet: "Требовать возвращения кораблей"
TRM_Demand_Return_Of_Our_Fleet_desc: "Мы точно знаем, что бывшая Сибирская военная флотилия была захвачена Императорским флотом Японии после нашей славной революции. Мы должны требовать возвращения всех наших судов!"
TRM_Modernize_Amur_Flotilla: "Модернизировать Амурскую военную флотилию"
TRM_Modernize_Amur_Flotilla_desc: "Амурская флотилия Морских сил [ROOT.GetNameDef] была организована НРА на базе нескольких достроенных речных канонерских лодок, несмотря на их довольно разрушенное и полузатопленное состояние. Мы должны модернизировать их и сделать основой нашего флота."
TRM_Coastal_Fleet: "Акцент на корабли для защиты побережья"
TRM_Coastal_Fleet_desc: "Будем откровенны, могучий Красный флот на Тихом океане остаётся далёкой перспективой. Тем не менее, мы можем начать с защиты наших берегов."

TRM_Peoples_Revolutionary_Air: "Народно-революционные воздушные силы"
TRM_Peoples_Revolutionary_Air_desc: "Наследие бывшего белого воздушного флота в регионе было преобразовано в Авиабригаду НРА, но в этой области предстоит ещё много работы. Основа будет заложена, когда мы создадим Народно-революционные воздушные силы Республики."


## Army ##
TRM_Continue_The_Militarisation: "Дальнейшая милитаризация"
TRM_Continue_The_Militarisation_desc: "Слишком долго мы полагались на защиту Японии. Нам нужна своя армия, но это потребует времени и усилий."
TRM_Expand_Military_Staff: "Расширить Госохрану"
TRM_Expand_Military_Staff_desc: "Госохрана (Государственная охрана), впервые сформированная во время Гражданской войны в России правительством Колчака в Омске."
TRM_Expand_OMON: "Расширить сибирский ОМОН"
TRM_Expand_OMON_desc: "ОМОН (Отряды милиции особого назначения) - подразделения милиции особого назначения - были впервые введены указом Колчака «Об охране общественного порядка и общественного спокойствия» в 1919 году. Колчак подчеркнул, что ОМОН является боевой единицей для охраны и восстановления государственного порядка и общественного спокойствия и служит резервом для формирования милиции в районах, освобождённых от советской власти, для подготовки опытных сотрудников милиции. Состоя из четырёх пехотных и одного конного взвода, эти стражники составляют костяк аппарата внутренних дел нашего государства."
TRM_Elite_Siberian_Squadron: "Элитный сибирский эскадрон"
TRM_Elite_Siberian_Squadron_desc: "Сибирская армия в её нынешнем состоянии имеет гораздо больше преимуществ для ведения наземной войны в Сибири, чем раздробленные и неэффективные армейские силы Петроградского режима. Мы должны продолжать развивать наши силы как элитные сибирские части, которые легко пройдут через сибирскую тайгу до Уральских гор."
TRM_Cossack_Army: "Казачья армия"
TRM_Cossack_Army_desc: "Веками казаки были прикованы к трону Царя, их свободы и честь были повержены к стопам далёкого деспота. Даже наши жертвы в войне против сатанинских большевиков не изменили отношения нового правительства в [RUS.Capital.GetName], которое продолжало пытаться искоренить нашу культуру и традиции. Мы больше не потерпим этого - казаки теперь свободны и ведомы сами собой, и война не прекратится, пока тот, кто правит в Москве, не будет вынужден это принять."

TRM_Obligatory_Conscription: "Мобилизовать Дальний Восток"
TRM_Obligatory_Conscription_desc: "Хотя Сибирская армия, несомненно, является самой эффективной силой для ведения сухопутной войны в Сибири, она слишком мала по численности. В одной только Москве живёт больше людей, чем на всех наших землях. Чтобы победить врага, мы должны быть более безжалостными, чем он - призыв в армию будет обязательным для всех мужчин трудоспособного возраста."
TRM_Northern_Expansion: "Расширение на север"
TRM_Northern_Expansion_desc: "Наша страна истощена боеспособными мужчинами, и нынешний уровень призыва, по-видимому, недостаточен для укомплектования наших вооружённых сил. Если мы введём принудительный призыв, у нас будет больше войск для борьбы с нашими врагами."
TRM_Drill_The_Troops: "Обучать войска"
TRM_Drill_The_Troops_desc: "Сила эффективной армии заключается не в численности, а в подготовке. Хорошо обученная армия приведёт нас к победе!"
TRM_Import_Military_Hardware: "Модернизировать снаряжение"
TRM_Import_Military_Hardware_desc: "Мы не обновляли наше снаряжение с 1920-х годов, и многое наше оружие, мягко говоря, устарело. Мы не сможем достичь ни одной из наших целей, если у наших солдат будет неэффективное оружие."
TRM_Equipment_Breakthrough: "Прорыв в вооружении"
TRM_Equipment_Breakthrough_desc: "Недавно мы успешно разработали совершенно новое огнестрельное оружие для наших солдат. Хотя сейчас это всего лишь прототипы, мы можем вложить немного денег в их производство в достаточном количестве."
TRM_Improve_Supply_Network: "Улучшить сеть снабжения"
TRM_Improve_Supply_Network_desc: "По мере того как Транссибирская магистраль расширяется всё больше, её полезность становится всё более очевидной. У нас даже есть потенциал создать общенациональную железнодорожную систему снабжения для доставки товаров по всей стране."
TRM_Create_A_Motorised_Corps: "1-й моторизованный корпус"
TRM_Create_A_Motorised_Corps_desc: "Поскольку наша армия растёт с каждым днём, нам нужно больше транспорта для наших войск. Новые грузовики должны оказаться полезными."
TRM_Expand_The_Dalzavod_Facilities: "Расширить мощности Дальзавода"
TRM_Expand_The_Dalzavod_Facilities_desc: "Мы можем использовать наш завод «Дальзавод» для производства ограниченной серии собственных танков. Танки неоценимы в современной войне из-за их живучести."
TRM_Legacy_of_the_Whites: "Марш сибирских стрелков"
TRM_Legacy_of_the_Whites_desc: "В каждом конфликте, в котором они участвовали, сибирские стрелки заслужили себе устрашающую репутацию исключительной храбрости, стойкости и выносливости. В этом конфликте эта репутация будет защищена вновь. Сибирская армия наполнена людьми, которые с раннего детства привыкли жить в суровой среде, и их опыт охоты сделал их превосходными стрелками. Они не остановят свой марш, пока Сибирь не будет освобождена от коррумпированных деспотов на западе."
TRM_Pogranichniki: "Пограничные отряды"
TRM_Pogranichniki_desc: "У нас есть прекрасные естественные границы с Петроградским режимом по озеру Байкал и Патомскому нагорью, но этого недостаточно. Мы должны установить хорошо охраняемые границы с постоянным присутствием пограничных отрядов и даже построить несколько фортов на случай нападения нашего врага."

### Air ###

TRM_Subsidise_The_Aviation_Sector: "Субсидировать авиационную отрасль"
TRM_Subsidise_The_Aviation_Sector_desc: "Наши военно-воздушные силы были ниже среднего в течение многих лет. Чтобы привести их в порядок и конкурировать с региональными державами, мы должны любой ценой вкладывать финансовые ресурсы в авиационные исследования."
TRM_Develop_Fighters: "Разработать истребители"
TRM_Develop_Fighters_desc: "Истребители - основной тип самолётов, который мы должны использовать. Без них мы не сможем господствовать в небе."
TRM_Strengthen_CAS_Units: "Усилить подразделения штурмовой авиации"
TRM_Strengthen_CAS_Units_desc: "Теперь, когда у нас есть превосходство в воздухе, мы можем атаковать наземные цели с помощью наших штурмовиков. Они также ценны для нас."
TRM_Bombers_Of_The_East: "Бомбардировщики Востока"
TRM_Bombers_Of_The_East_desc: "Небо наше, наши штурмовики атакуют землю, и теперь мы можем производить самолёты, способные уничтожать наших врагов с помощью взрывчатки большой мощности."
TRM_Modernise_The_Air_Command: "Модернизировать командование ВВС"
TRM_Modernise_The_Air_Command_desc: "Даже с современными самолётами, которые у нас есть, нам всё равно нужен надлежащий военный штаб для управления ими. Мы должны интенсивно обучать новых офицеров."
TRM_Expand_The_Vladivostok_Airport: "Расширение аэропорта"
TRM_Expand_The_Vladivostok_Airport_desc: "Наша страна отстала от авиационной революции. У нас нет ни одного современного аэродрома. Со времён Мировой войны самолёты стали очень смертоносным оружием войны, и поэтому мы должны обладать ими. Без авиабаз даже самые большие военно-воздушные силы будут бесполезны."
TRM_Irkutsk_Air_Base: "Авиабаза в Иркутске"
TRM_Irkutsk_Air_Base_desc: "В Сибири, безусловно, есть место для новых взлётно-посадочных полос и аэродромов. Мы были бы глупцами, не воспользовавшись этим фактом."
TRM_Develop_Siberian_Air_Fields: "Развивать сибирские аэродромы"
TRM_Develop_Siberian_Air_Fields_desc: "Наши ВВС отчаянно нуждаются в новых аэродромах базирования. По этой причине мы должны инвестировать в Новосибирск."


### Political ###
TRM_Kolchak: "Укрепить власть Колчака"
TRM_Kolchak_desc: "Колчаку удалось пережить переворот и разгромить мятежных генералов. Однако дух неопределённости всё ещё витает над Владивостоком. Только сильный лидер способен успокоить народ и восстановить порядок в Приамурье."

TRM_Kolchak_Purge: "Очистить армию"
TRM_Kolchak_Purge_desc: "Чтобы избежать дальнейших переворотов и восстаний, необходимо проверить весь аппарат высшего военного командования. Однако эти жёсткие меры на некоторое время нарушат боеспособность нашей армии."

TRM_Crisis: "Антиколчаковский переворот"
TRM_Crisis_desc: "Напряжённость в режиме Приамурья наконец достигает апогея, и сейчас мало сомнений в том, что положение Колчака становится всё более несостоятельным."
TRM_Kolchak_Dies: "Колчак мёртв"
TRM_Kolchak_Dies_desc: "Колчак мёртв. Теперь различные силы попытаются захватить контроль над страной."

TRM_Mil_Inf: "Закупить современное оборудование"
TRM_Mil_Inf_desc: "Наше оборудование устарело, поэтому мы должны обратиться к мировому рынку. Возможно, мы даже сможем приобрести чертежи, чтобы производить новое оборудование самостоятельно."

TRM_Dictatorship: "Военная диктатура"
TRM_Dictatorship_desc: "Военная диктатура - единственный тип правительства, который нам подходит: мы должны держать общество под контролем. Если быть точнее, под военным контролем и сильным лидером."

TRM_Monarchy: "Вознесение Святого Царя"
TRM_Monarchy_desc: "Сам Дитерихс - убеждённый монархист. Его величайшее желание - восстановить абсолютную монархию - ту, которую Россия потеряла во время Революции 1917 года. Однако не все в ДВСВ разделяют одинаковое мнение о будущем Приамурья и России."
trm_monarchy_date: "\n§YВы должны восстановить Монархию §7до§! смерти Дитерихса§!\n"

TRM_Emperor_Of_Russia: "Император Всероссийский"
TRM_Emperor_Of_Russia_desc: "К счастью, Российское правительство уже восстановило монархию. Теперь мы можем присоединиться к Российской Империи."

TRM_Russian_Empire_In_Exile: "Российская Империя в изгнании"
TRM_Russian_Empire_In_Exile_desc: "К сожалению, Российское правительство решило остаться республикой. Мы должны провозгласить Российскую Империю в изгнании и восстановить царя из рода Романовых как Царя Сибири."

TRM_ROVS_Secures_The_Power: "Чехословацкий легион захватывает власть"
TRM_ROVS_Secures_The_Power_desc: "Братья, время пришло, поднимайтесь из подполья! Со смертью Дитерихса Приамурьем теперь правят легионеры, и оно готово к войне с Россией."

TRM_Democracy_In_Transamur: "Демократия на Дальнем Востоке"
TRM_Democracy_In_Transamur_desc: "Мы наконец достигли нашей свободы. Больше никаких диктаторов, больше никаких безумных милитаристов. Пришло время истинной демократии подняться и стереть присутствие автократов."
TRM_Peoples_Directorate: "Народная директория"
TRM_Peoples_Directorate_desc: "Слишком долго русский Дальний Восток находился под властью военных и их директив; пора переходить к истинному народному управлению, и поэтому необходимо созвать Народную директорию - новое демократическое правительство."

TRM_Politcentre: "ПСР формирует кабинет"
TRM_Politcentre_desc: "Коалиция эсеров под руководством Колосова, открыто поддерживающая пророссийскую политику, одержала победу на выборах."
TRM_Regionalists: "Победа регионалистов"
TRM_Regionalists_desc: "Сибирские областники под руководством Ивана Лаврова одержали победу на выборах."
TRM_Liberals: "Победа либералов"
TRM_Liberals_desc: "Виктор Пепеляев, премьер-министр в правительстве Колчака, был ведущей фигурой в истории Приамурья. Именно он поддерживал либерализм и демократию в Приамурье и удерживал Колчака от слишком автократических реформ. Теперь, когда демократия восстановлена, КДВ, вероятно, сделает Приамурье второй экономикой Азии после Японии."
TRM_Conservatives: "Съезд несоциалистических организаций"
TRM_Conservatives_desc: "СНО - это съезд партий и организаций, возглавляемый братьями Меркуловыми. Он объединяет богатых русских бизнесменов и землевладельцев. Его долг - наконец выбрать судьбу русского Дальнего Востока: полная экономическая зависимость от Японии или обеспечение независимости того, что он называет законным российским государством."

TRM_Reinstitute_Siberian_Duma: "Сибирская областная дума"
TRM_Reinstitute_Siberian_Duma_desc: "По мере того как мы начинаем наш путь к консолидации власти и окончательному освобождению России, становится все более необходимым создать надлежащий орган власти. Опираясь на опыт прошлого, но по-прежнему отвергая иллюзии левых, мы создадим региональный парламент - Сибобдуму."
TRM_Major_Education_Reform: "Крупная реформа образования"
TRM_Major_Education_Reform_desc: "Неважно, диктатура это или демократия, аспекты, касающиеся образования, в обоих случаях ясны. Ни один мужчина или женщина никогда не выигрывали войну, но выигрывала наука. Мы должны инвестировать как можно больше, чтобы дать нашим учёным всё, что они захотят."

TRM_Support_Peasants: "Поддержать крестьян"
TRM_Support_Peasants_desc: "Крестьяне Приамурья все эти годы боролись за выживание. Правительство должно поддержать их субсидиями и грантами."
TRM_Siberian_Identity: "Сибирская нация"
TRM_Siberian_Identity_desc: "Сибиряки - это отдельная идентичность, со своей собственной культурой, языком и историей, отличной от тех, кто провозглашает «неделимость» некоего воображаемого концепта, расположенного в поясе Петроград-Москва. Мы должны направить значительные ресурсы на популяризацию такой идентичности, позволяя людям заново открыть свои истинные корни."
TRM_Federalisation: "Федерализация"
TRM_Federalisation_desc: "Грандиозный проект федерализации сибирских земель, некогда обещанный бывшим диктатором-адмиралом, так и не был осуществлён. Он погиб среди множества пустых обещаний, данных Колчаком. Однако с нашим приходом к власти мы наконец можем осуществить мечту, за которую боролось наше движение."
TRM_Fight_Russian_Imperialism: "Борьба с русским империализмом"
TRM_Fight_Russian_Imperialism_desc: "Русские из «имперской метрополии» в Москве слишком долго угнетали множество меньшинств на своих территориях. Наш гордый сибирский народ не был исключением, и поэтому, чтобы иметь хоть какой-то шанс на выживание и процветание в будущем, мы должны готовиться к неизбежному конфликту с западными колонизаторами."
TRM_Subsidise_Industrial_Expansion: "Субсидировать промышленное расширение"
TRM_Subsidise_Industrial_Expansion_desc: "Дальнейшие инвестиции позволят нам расширить наши предприятия и сделать нашу промышленность более продуктивной. Может быть создано много новых рабочих мест, что означает более стабильную занятость и безопасность для людей."
TRM_Secure_Workers_Rights: "Обеспечить права рабочих"
TRM_Secure_Workers_Rights_desc: "Пришло время обратить внимание на крайне пренебрегаемые права российских рабочих. Одним из наших первых шагов по исправлению этой ситуации должно стать принятие разумной минимальной заработной платы."
TRM_Welfare_State: "Государство всеобщего благосостояния"
TRM_Welfare_State_desc: "Истинная демократия означает, что каждый гражданин нашей страны заслуживает лучшего. Введя систему социального обеспечения, мы заслужим большое уважение нашего народа. Счастливое население будет работать усерднее и требовать меньше, что означает больше процветания для всех нас."

TRM_Federalism: "Сибирский федерализм"
TRM_Federalism_desc: "Наша страна слишком разнообразна, чтобы быть централизованным государством. Наши люди должны иметь возможность жить своей жизнью в новой и славной федерации, уважающей права каждого."

TRM_Support_Small_Business: "Поддержать малый бизнес"
TRM_Support_Small_Business_desc: "Средний класс и их малые предприятия являются истинными столпами общества и экономики. Они держат на своих плечах всю нашу нацию, подобно тому, как титан Атлант держал мир. Нам нужно поддерживать малый бизнес, чтобы средний класс стал больше."

TRM_Attract_Foreign_Investments: "Привлечь иностранные инвестиции"
TRM_Attract_Foreign_Investments_desc: "Мы не можем надеяться полагаться только на отечественных предпринимателей для нашей экономики. Крайне важно заинтересовать иностранных инвесторов, чтобы помочь нам."

TRM_Approach_Entente: "Сблизиться с Антантой"
TRM_Approach_Entente_desc: "Было бы хорошей идеей обратиться к нашим старым канадским друзьям, чтобы обеспечить возможность взаимопомощи в будущем."

TRM_Rep_Res: "Инвестиции в науку"
TRM_Rep_Res_desc: "Влияние науки на современный мир неоспоримо, и мы должны воспользоваться этим и вложить немного денег в великие умы нашей страны. Создав для них надлежащие условия труда, их усилия станут ещё более эффективными."

TRM_Fight_Radicals: "Борьба с радикализмом"
TRM_Fight_Radicals_desc: "Революционеры из НРА - самая большая угроза нашей демократии. Их организацию необходимо остановить, прежде чем они причинят больший вред."

TRM_Support_Local_Landowners: "Поддержать местных землевладельцев"
TRM_Support_Local_Landowners_desc: "Землевладельческая элита на Дальнем Востоке - одна из групп, которая нас сильно поддерживает. Мы должны протянуть им руку помощи, чтобы они продолжали поддерживать нас."

TRM_Secure_Our_Borders: "Обезопасить наши границы"
TRM_Secure_Our_Borders_desc: "Если мы хотим остаться независимыми, наши границы необходимо обезопасить от внешних угроз."

TRM_Pol_Research: "Крупная образовательная реформа"
TRM_Pol_Research_desc: "Неважно, диктатура это или демократия, аспекты, касающиеся образования, в обоих случаях ясны. Ни один мужчина или женщина никогда не выигрывали войну, но выигрывала наука. Мы должны инвестировать как можно больше, чтобы дать нашим учёным всё, что они захотят."

TRM_State_Above_All: "Государство превыше всего"
TRM_State_Above_All_desc: "Как считает наш лидер Устрялов, сильная государственная власть, способная объединить обширную территорию, важнее, чем конкретная форма правления или идеологическая догма. Новый режим должен стать «железной когортой государственности», способной восстановить порядок после хаоса революции и Гражданской войны."
TRM_Revive_National_Spirit: "Возродить русскую идею"
TRM_Revive_National_Spirit_desc: "Согласно заветам известного славянофила Юрия Самарина, нам необходима сильная национальная политика и государственное строительство, основанное на национальном укладе жизни, поскольку у России свой уникальный путь и своё историческое развитие. Наша государственность должна основываться на нашем национальном духе и традициях."
TRM_Nationalist_Consolidation: "Националистическая консолидация"
TRM_Nationalist_Consolidation_desc: "Мы должны призвать все патриотические силы, несмотря на наши разногласия, объединиться вокруг нашего национального правительства и спасти Россию от пороков, которые принесло ей последнее десятилетие."

# Temporary until rework 
TRM_Land_Quotas: "Земельные квоты"
TRM_Land_Quotas_desc: "Мы должны ввести компромиссное законодательство, учитывающее земельную реформу, которое позволило бы проводить полноценное обобществление земли в отдельных нуждающихся регионах, принимая во внимание национальную и культурную составляющую. Кроме того, частновладельческие земли будут облагаться дополнительным налогом на роскошь."
TRM_Subsidise_Small_Business: "Поддержать малый бизнес"
TRM_Subsidise_Small_Business_desc: "Средний класс и их малые предприятия являются истинными столпами общества и экономики. Они держат на своих плечах всю нашу нацию, подобно тому, как титан Атлант держал мир. Нам нужно поддерживать малый бизнес, чтобы средний класс стал больше."
TRM_Far_Eastern_Zemstva: "Дальневосточные земства"
TRM_Far_Eastern_Zemstva_desc: "Земство - это форма местного самоуправления и представительства, впервые введённая Александром II в 1864 году. Она сильно благоволит аристократам, но всё же обеспечивает представительство низших классов. Это, без сомнения, обеспечит стабильность в нашей раздираемой на части стране."

TRM_Ties_To_Japan: "Связи с Японией"
TRM_Ties_To_Japan_desc: "Узы между нашей страной и Японией, особенно с их корпорациями, долгое время служили катализатором нашего экономического роста, внося значительный вклад в финансовые резервы Владивостока. Было бы неразумно разрывать эти связи, пока денежные поступления легко достигаются."
TRM_Rely_On_Church: "Опора на церковь"
TRM_Rely_On_Church_desc: "Несмотря на то, что Патриарх Православной церкви в Петрограде позорно отказался поддерживать приходы на Дальнем Востоке, продемонстрировав свой статус простой политической пешки, в нашем регионе всё ещё существует множество священнослужителей, осуществляющих свою власть. Россия - страна, глубоко укоренённая в духовности, и нам нужна поддержка Церкви."
TRM_Island_Of_Old_Russia: "Дух Старой России"
TRM_Island_Of_Old_Russia_desc: "Возможно, Дальний Восток - единственный бастион, где дух Старой России всё ещё процветает даже в отсутствие Царя. Керенский режим, запятнанный влиянием левых, никогда не сможет восстановить идеальное состояние гармонии между властью и народом, которое характеризовало имперскую эпоху. Сохранение и продвижение старого порядка необходимы, ибо только через них мы можем защитить то немногое, что осталось от нашей нации."
TRM_Far_Eastern_Business_Zone: "Торговый дом братьев Меркуловых"
TRM_Far_Eastern_Business_Zone_desc: "Благодаря нашим усилиям мы сделали порт Владивосток одним из важнейших портов в северной части Тихого океана. Другие страны региона хотели бы инвестировать в нас, чтобы мы стали богаче и процветали."

TRM_Victory_For_Democracy: "Торжество демократии"
TRM_Victory_For_Democracy_desc: "Мы наконец-то обрели свободу. Больше никаких диктаторов, никаких безумных милитаристов. Пришло время для подъема истинной демократии и искоренения автократии."

TRM_Continue_Kolchak_Policies: "Продолжить политику Колчака"
TRM_Continue_Kolchak_Policies_desc: "Несмотря на свои многочисленные провалы, адмирал-диктатор был прав в том, что касалось того, что нужно России: освобождение от антигосударственного социализма, гнилого либерализма и всех видов коррупции. Только продолжая его жесткую политику, мы сможем освободить нашу родину."

TRM_Moryaki_In_Power: "Моряки у власти"
TRM_Moryaki_In_Power_desc: "Моряки, или моряки, являются высшим командованием Белого флота - стратегического Дальневосточного флота. Моряки возглавляются Верховным главнокомандующим флотом - контр-адмиралом Георгием Старком, другом Колчака и соратником по гражданской войне."

TRM_Legacy_Of_Peters_Fleet: "Наследие Петра Великого"
TRM_Legacy_Of_Peters_Fleet_desc: "Первый российский император Петр Великий был отцом российского флота. Он значительно улучшил конкурентоспособность нашей страны в морской сфере и заложил основу морской мощи России."

### NRA ###
TRM_NRA_Seizes_Control: "НРА захватывает власть"
TRM_NRA_Seizes_Control_desc: "Теперь, когда диктатор-адмирал мёртв, ничто не мешает НРА взять власть. Да здравствует Революция!"

TRM_Crush_ROVS: "Разгромить ДВСВ"
TRM_Crush_ROVS_desc: "ДВСВ - не что иное, как сборища мелких реакционеров. Организация и их прихвостни должны быть искоренены, чтобы наша революция выжила."
TRM_Expel_Czechs: "Изгнать чехословацких легионеров"
TRM_Expel_Czechs_desc: "Чехословацкие легионеры под командованием Сергея Войцеховского слишком долго терроризировали наши земли. Пришло время изгнать эти орды из нашей страны."
TRM_Ban_The_Church: "Разобраться с клирикалами"
TRM_Ban_The_Church_desc: "Церковь - не что иное, как сборище псевдореакционных предателей, церковь должна быть запрещена. Это может быть непопулярно среди многих, но это необходимо сделать."
TRM_Revolutionary_Terror: "Революционный террор"
TRM_Revolutionary_Terror_desc: "Хотя Дальневосточный регион ещё не полностью высвободился из тисков помещиков, купцов и прочих представителей мелкой и крупной буржуазии, мы должны поддерживать революционный террор под эгидой чрезвычайной комиссии, позволяя нашему правительству проводить необходимые реформы, направленные на освобождение населения от его оков."

TRM_Anti_Japanese_Propaganda: "Анти-японская пропаганда"
TRM_Anti_Japanese_Propaganda_desc: "Теперь, когда мы разорвали связи с Японией, мы можем сосредоточить нашу пропаганду против неё. Мы должны чётко дать понять, что правительство в Токио нам не друг, а враг."

TRM_Promise_Autonomy_To_Buryats: "Пообещать автономию бурятам"
TRM_Promise_Autonomy_To_Buryats_desc: "Буряты издавна отделяли свою идентичность от остальной России. Они стали нашими союзниками, и теперь мы должны вознаградить их за лояльность."

TRM_Integrate_Buryats: "Интегрировать бурят"
TRM_Integrate_Buryats_desc: "Теперь, когда буряты получили автономию, мы можем сосредоточиться на их интеграции в наш режим. Это обеспечит стабильность и единство для всех людей на наших землях."

TRM_Rapid_Industrialization: "Форсированная индустриализация"
TRM_Rapid_Industrialization_desc: "Япония взирает на наши земли, замышляя нашу гибель. Чтобы обезопасить нашу новую нацию, мы можем сосредоточиться на милитаризации государства и производстве достаточного количества оружия для оснащения нашей могучей армии."

TRM_Militarization_Of_Labour: "Милитаризация труда"
TRM_Militarization_Of_Labour_desc: "Рабочие теперь правят нашими землями, но их новообретённая свобода не находится в безопасности. Чтобы обезопасить наши земли, каждый рабочий будет выполнять свой долг."

TRM_Destroy_Japanese_Influence: "Уничтожить японское влияние"
TRM_Destroy_Japanese_Influence_desc: "Влияние Японии всё ещё сохраняется на нашей земле. Оно должно быть искоренено, Восходящему солнцу больше нельзя позволять сиять на наших землях."
TRM_Cut_Ties_With_Japan: "Разорвать связи с Японией"
TRM_Cut_Ties_With_Japan_desc: "Япония своими действиями доказала, что она не друг мировой революции и не друг НРА. У нас больше нет причин поддерживать их."

TRM_NRA_Seizes_Production: "Экспроприировать средства производства"
TRM_NRA_Seizes_Production_desc: "Слишком долго фабрики принадлежали богатым промышленникам; пришло время передать средства производства в руки рабочих."
TRM_Crush_Merchant_Oligarchate: "Уничтожить купеческую олигархию"
TRM_Crush_Merchant_Oligarchate_desc: "Благодаря махинациям японских империалистов и соучастию военщины Колчака Приморье превратилось в чёрную дыру на карте, место, где исчезают деньги, налоговые поступления, оружие и контрабанда. Эта политическая машина должна быть демонтирована, поскольку она продолжает оказывать влияние на нашу страну даже в революционные времена."
TRM_Solve_The_Land_Issue: "Решить земельный вопрос"
TRM_Solve_The_Land_Issue_desc: "Дальний Восток остаётся регионом, где вопрос землевладения не решён полностью. Несмотря на меньшую плотность населения по сравнению с Европейской Россией, крестьяне Дальнего Востока не добились значительных успехов, поскольку монастырские, казачьи и помещичьи земли долгое время отравляли наш аграрный сектор. Мы должны положить конец этой ситуации."

TRM_NRA_Temporary_Dictatorship: "Третий съезд НРА"
TRM_NRA_Temporary_Dictatorship_desc: "Первоначальные реформы были проведены, однако продолжающаяся борьба внутри Совета Народных Комиссаров, проявление разногласий между двумя различными фракциями, наносит непоправимый вред в этот критический момент. Становится необходимым созвать Третий съезд Народно-революционной армии, что станет ключевым шагом на пути к переходу к гражданскому и советскому управлению."


TRM_Look_Out_To_Brother: "Присоединиться к «Большому Братству»"
TRM_Look_Out_To_Brother_desc: "Теперь, когда революция в России безопасна, у нас нет причин отделяться от наших восточных братьев. Пришло время воссоединиться с ними."

TRM_The_Last_Bolshevism: "Последний бастион большевизма"
TRM_The_Last_Bolshevism_desc: "Остальная Россия, может, и пала от рук реакционеров, но мы всё равно продержимся. Против орды и за рабочих мы встанем, и скоро мы объединим Россию!"

TRM_Autonomous_Republic: "Автономная Республика"
TRM_Autonomous_Republic_desc: "Запад, возможно, и освобожден, но это не повод отказываться от нашей независимости. Мы перейдем под крыло Советского правительства на востоке и станем автономной нацией под его защитой. "

## Semyonov ##
TRM_Semyonov_In_Power: "Поход на Владивосток"
TRM_Semyonov_In_Power_desc: "После свержения Колчака Дитерихсом Григорий Семёнов решил, что время действовать пришло, и теперь он правит нацией."
TRM_Legacy_Of_OMO: "Наследие ОМО"
TRM_Legacy_Of_OMO_desc: "Особый Маньчжурский отряд никогда не был обычной воинской частью. Это было братство границы - казаки, буряты, монголы и авантюристы, связанные верностью и возможностью. Его наследие - выживание в самых суровых условиях и рейды на врагов. Если Приамурью суждено выстоять, оно должно унаследовать тот же безжалостный дух, не скованный иллюзиями старой армии."
TRM_Defenders_Of_East: "Защитники Востока"
TRM_Defenders_Of_East_desc: "Наши союзники в Ниппоне, несмотря на все слухи, - наши лучшие друзья против всех наших врагов. При их поддержке, в основном материальной, мы можем легко победить всех наших врагов."

TRM_Cossack_Statehood: "Свободная воля казаков"
TRM_Cossack_Statehood_desc: "Поскольку Семёнов возглавляет забайкальских казаков, он знает, что их образ жизни необходимо защищать и даже распространить на остальной Дальний Восток, чтобы укрепить его."
TRM_Discipline_The_Host: "Дисциплинировать Войско"
TRM_Discipline_The_Host_desc: "Казаки горды, свирепы и яростно независимы, но если Войско должно вести за собой, оно также должно и подчиняться. Семёнов напомнит войсковым атаманам и их людям, что свобода достигается службой, и даже самый свободный всадник должен откликнуться, когда его позовут."
TRM_Land_Of_Freemen: "Земля вольных людей"
TRM_Land_Of_Freemen_desc: "Эти земли были завоёваны не клерками и не министрами, а всадниками, изгоями и теми, кто отказался кланяться. Дальний Восток не станет очередной удушающей провинцией, управляемой издалека, он останется землёй вольных людей, где Войско управляет само собой, где обычай перевешивает указ и где атаман ведёт за собой через уважение. Пусть другие мечтают об империях - мы построим границу, которая не подчиняется никому, кроме самой себя."
TRM_Will_Of_The_Host: "Использовать хунхузов"
TRM_Will_Of_The_Host_desc: "Кто сказал, что в нашем восстании против тирании мы можем полагаться только на народы России? Хунхузы - это банды китайских воинов, которые взялись за оружие против правительства в Пекине и зарабатывали на жизнь, отбирая имущество у богатых и раздавая его бедным. Некоторые из них тесно сотрудничали с нашими казаками и уже зачислены в нашу армию. Мы можем использовать эти контакты, чтобы предложить службу другим, которые всё ещё находятся в Маньчжурии."


TRM_A_Cossacks_Life_For_Me: "Казачья жизнь для меня"
TRM_A_Cossacks_Life_For_Me_desc: "Нет большего призвания на этих землях, чем казачье. Скакать на свободе, носить оружие, подчиняться только своим братьям и атаману - это жизнь, которой многие завидуют и которую немногие заслуживают. Если наша Казакия должна процветать, этот образ жизни нужно не только сохранить, но и расширить. Пусть другие приходят, служат и заслуживают своё место среди Войска."

TRM_All_Power_From_Chita: "Вся власть из Читы"
TRM_All_Power_From_Chita_desc: "Слишком много голосов ослабляют государство. Слишком много рук тянутся к власти. Время переговоров прошло. Должен быть единый центр, единая воля, единое командование. Из Читы атаман будет править, и все остальные узнают своё место в созданном им порядке."
TRM_Anti_Socialist_Sentiments: "Развязать Белый террор"
TRM_Anti_Socialist_Sentiments_desc: "Одна из вещей, которые объединяют Колчака и Семёнова, - это их презрение к социалистам. Для атамана они не более чем предательские элементы, которые хотят навредить нашему народу."
TRM_Distribute_Government_Posts_To_Loyalists: "Наградить верных"
TRM_Distribute_Government_Posts_To_Loyalists_desc: "Законы не удерживают государство вместе. Его удерживают верные, проверенные люди. Должности власти будут отданы тем, кто стоял рядом с атаманом во времена неопределённости."

TRM_The_Shadow_Economy: "Теневая экономика"
TRM_The_Shadow_Economy_desc: "Граница никогда не подчинялась правилам далёких столиц. Торговля течёт туда, где может, а не туда, где разрешена. Контрабандисты, посредники и теневые сети уже поддерживают значительную часть дальневосточной экономики. Вместо того чтобы бороться с тем, что нельзя искоренить, мы будем направлять это и извлекать выгоду."
TRM_Licenses_For_Underworld: "Лицензии для преступного мира"
TRM_Licenses_For_Underworld_desc: "Есть те, кто действует вне закона. Преступный мир не исчезнет, но его можно заставить служить. Те, кто примет нашу власть, будут процветать. Те, кто нет - исчезнут."
TRM_Tax_The_Frontier: "Обложить налогом границу"
TRM_Tax_The_Frontier_desc: "Даже самой свободной земле нужно пропитание. Граница должна платить за своё собственное выживание. Налогообложение здесь не будет похоже на удушающие системы Запада; оно будет твёрдым, выборочным и применяемым там, где это важнее всего. Те, кто извлекает выгоду из защиты атамана, внесут вклад в её продолжение."

TRM_Convene_Peoples_Assembly: "Вопрос о Народном собрании"
TRM_Convene_Peoples_Assembly_desc: "Народное собрание во Владивостоке предлагает способ представить единство, собрать голоса со всего Дальнего Востока и облачить власть в легитимность. Станет ли оно истинным институтом или лишь отражением воли атамана... будет зависеть от того, как его использовать."
TRM_Establish_The_Regency: "Учредить Регентство"
TRM_Establish_The_Regency_desc: "Россия - это традиция, порядок и идея трона. Хотя сама корона может быть далека, её авторитет всё ещё можно призвать. Учредив Регентство, атаман станет хранителем будущей реставрации. Новой России, которая грядёт, когда будет завоёвана."
TRM_Establish_The_Regency_trigger1: "Народное собрание вынудило атамана Семёнова создать Регентство."
TRM_Establish_The_Regency_trigger2: "Атаман Семёнов решает, что Регентство укрепит его власть."
TRM_Fear_And_Respect: "Страх и уважение"
TRM_Fear_And_Respect_desc: "Легитимность - это роскошь для тех, у кого есть время на дебаты. Пусть другие прячутся за коронами и собраниями. Атаман будет править так, как всегда правил: через силу, через волю и через понимание того, что лучше, чтобы тебя боялись, чем чтобы тебе бросали вызов."

TRM_The_Atamans_Ride: "Атаманов поход"
TRM_The_Atamans_Ride_desc: "По степи, вдоль рельсов, через города и стойбища скачет Орда Семёнова, чтобы её видели, слышали и чтобы напомнить всем, кто держит вожжи России, что люди атамана подчиняются и следуют."
TRM_Ally_Mongolia: "Союз с Монголией"
TRM_Ally_Mongolia_desc: "Никакая личная храбрость и японская поддержка не могут компенсировать тот факт, что мы полностью превосходим силами, всё ещё верными [RUS.Capital.GetName]. Успех нашей кампании зависит от нашей способности захватить контроль над Сибирью до того, как враг решит множество кризисов на других фронтах. Чтобы вызвать такой крах московской власти, нам нужны могущественные союзники - возможно, мы сможем найти одного в Монголии."

TRM_The_Last_Battle: "Последняя битва"
TRM_The_Last_Battle_desc: "Все пути ведут сюда. То, что началось как авантюра в хаосе Востока 10 лет назад, стало чем-то большим. Будь то ради одного Приамурья или всей России, атаман поскачет в последний раз. И история запомнит, что последует."

## Pepelyaev ##
TRM_Siberian_Suvorov_Regime: "Режим «Сибирского Суворова»"
TRM_Siberian_Suvorov_Regime_desc: "Генерал Анатолий Пепеляев, доверенное лицо адмирала Колчака, совершил переворот, чтобы обеспечить стабильность нации. Теперь «Сибирский Суворов» должен навести порядок в больной структуре Приамурья."
TRM_Stabilize_Regime: "Стабилизировать режим"
TRM_Stabilize_Regime_desc: "НРА, Семёнов и его казаки, японские корпорации, монархисты, областники, чехословаки - Дальний Восток представляет собой кипящий котел нестабильности, побочный продукт недавних потрясений. Наш долг - сделать все, что в наших силах, для решения этих критически важных вопросов управления, чтобы построить новый, процветающий Дальний Восток и Россию."

TRM_For_Russian_Greatness: "За величие России!"
TRM_For_Russian_Greatness_desc: "Петроградский режим продал саму душу России за немецкие марки. Как он может считаться представителем народной воли после такого предательства? Пусть падут западные предатели, пусть их режим будет разорван яростью угнетенных масс. Благодаря этому и нашим будущим действиям величие России будет восстановлено!"
TRM_For_Siberian_Freedom: "За свободу Сибири!"
TRM_For_Siberian_Freedom_desc: "Слишком долго Сибирь подвергалась грабежу со стороны московско-петербургского имперского ядра. Наконец-то настало время для забытого Востока освободиться от оков колониального угнетения!"

TRM_One_Country_One_Center: "Одна страна - один центр"
TRM_One_Country_One_Center_desc: "Вся эта фикция «федерации» - не что иное, как массовое заблуждение, раздуваемое Керенским и ему подобными. Сильная рука над народом, слава единой структуры всегда были естественны для нашей страны. Нет никаких причин менять то, что принесло России величие в предыдущие века."
TRM_Federation_Of_Equal_Peoples: "Федерация равных народов"
TRM_Federation_Of_Equal_Peoples_desc: "Продолжая строить новую страну, мы должны искать возможности внедрения новых принципов, одним из важнейших из которых является идея всеобщего равенства. Пусть безопасный статус всех разнообразных народов, живущих на наших землях, станет основополагающей ценностью для возрождающегося государства, которое мы формируем."
TRM_Legacy_Of_Old_Russia: "Постигая наследие Старой России"
TRM_Legacy_Of_Old_Russia_desc: "Наследие старой России - царский режим со множеством недостатков и провалов - по-прежнему влияет на наше настоящее. Но мы не должны отвергать его; напротив, мы должны принять прошлое и стремиться извлечь из него моменты триумфа и добра - используя лучшее из того, что осталось в этом наследии."
TRM_Beaty_Of_Siberia: "Красота Сибири"
TRM_Beaty_Of_Siberia_desc: "Бескрайние просторы сибирской дикой природы, белый снег, мягко покрывающий землю и окружающие вечнозеленые деревья, флора и фауна, в которой даже есть тигры; такой прекрасный вид способен растопить даже самое ледяное сердце. Великолепный облик наших земель настолько захватывает дух, что его невозможно описать словами; именно поэтому мы должны сделать все, чтобы защитить его и сохранить для тех, кто придет после нас."
TRM_Honest_Government: "Честное правительство"
TRM_Honest_Government_desc: "Россия на протяжении многих лет не знала правления по-настоящему честного правительства. Руководство адмирала Колчака было заметным исключением, прежде чем ушло в прошлое. Мы должны сделать все, что в наших силах, чтобы развивать его наследие и искоренять коррупцию в корне, особенно в армии. Благодаря нашим усилиям мы создадим новую систему правления, которая будет честной и подотчетной перед народом."

TRM_Strike_Bureacracy: "Сокрушить бюрократию"
TRM_Strike_Bureacracy_desc: "Крупный бюрократический аппарат всегда был силой, злоупотребляющей своей властью, когда речь шла о принятии серьезных и решительных мер. Именно поэтому его необходимо сократить и преобразовать в более эффективную систему."
TRM_Deal_With_Bourgeouis: "Вопрос крупного капитала"
TRM_Deal_With_Bourgeouis_desc: "Несмотря на то, что Александр Колчак многого добился, у него были определенные недостатки, которые нельзя игнорировать. Одним из них была значительная поддержка, которую он получал от крупных капиталистов. Однако сейчас на первый план должен выйти вопрос о том, что лучше для народа."
TRM_Socialize_Land: "Обобществить землю"
TRM_Socialize_Land_desc: "Хотя некоторым это может показаться не так, вопрос о земле в Приамуре является чрезвычайно актуальным. Единственное жизнеспособное решение этой проблемы заключается в социализации земли в соответствии с принципами, аналогичными тем, которые поддерживали NRA и эсеры."
TRM_Listen_To_Brothers_Advice: "Внять братскому совету"
TRM_Listen_To_Brothers_Advice_desc: "Виктор, который долгое время был доверенным лицом Колчака, как и его брат, советует не предпринимать поспешных действий в вопросе земельной реформы. По его мнению, до тех пор, пока Россия не будет восстановлена и стабилизирована, условия не позволяют сделать больше, чем просто ввести земельные квоты. Следует прислушаться к мудрому совету этого опытного государственного деятеля."
TRM_Neither_Left_Nor_Right: "Ни левых, ни правых"
TRM_Neither_Left_Nor_Right_desc: "Наша политическая система не является ни правой, ни левой; она служит интересам народа и стремится к консенсусу, который приносит пользу всем. Под руководством Пепеляева не будет идеологических разногласий и конфликтов - мы должны стремиться к единству на благо нации."

TRM_Legacy_Of_Middle_Siberian_Corps: "Наследие Пепеляевского корпуса"
TRM_Legacy_Of_Middle_Siberian_Corps_desc: "Под командованием Анатолия Пепеляева 1-й Среднесибирский корпус Белой Сибирской армии, легендарное формирование, выступил на Пермь и нанес решающий удар Красной армии. Состоящий из добровольцев, многие из которых продолжают служить под знаменем Пепеляева, мы несем факел истории, обеспечивая триумф завтрашнего дня."
TRM_Not_A_Single_Death_Sentence: "Ни одного смертного приговора"
TRM_Not_A_Single_Death_Sentence_desc: "Требования войны требуют жертв, но мы не должны позволять эмоциям одолевать нас. В отличие от нигилистических большевиков, мы не можем оправдывать вынесение смертных приговоров, поскольку это противоречит нашим моральным и прагматическим императивам."
TRM_Perm_Experience: "Пермский опыт"
TRM_Perm_Experience_desc: "Большевики назвали события в Сибири «Пермской катастрофой». Однако на самом деле Сибирская армия проложила путь для Народной армии Каппеля, что привело к освобождению Вятки. Это событие сыграло решающую роль в объединении белых сил и в конечном итоге способствовало поражению Красной армии. Пермская операция должна быть изучена будущими поколениями генералов и офицеров."
TRM_Muzhik_General: "Мужицкий генерал"
TRM_Muzhik_General_desc: "Генерал Пепеляев не был похож на других военачальников - он был скромным русским «мужиком», простым, но сердечным крестьянином, как и все его солдаты. Эта черта характера позволяла ему быть ближе к своим подчиненным, чем любой другой командир, и до сих пор приносит свои плоды, делая его лично популярным среди масс, находящихся под его командованием."
TRM_Eradicate_Servility: "Искоренить раболепие"
TRM_Eradicate_Servility_desc: "Вопреки традициям русской и сибирской армий, мы не требуем раболепия или почтения. Армия - это единое целое, в котором все члены равны перед лицом бедствий."
TRM_Everything_For_The_Soliders: "Всё для солдат!"
TRM_Everything_For_The_Soliders_desc: "Генералы осознают, что победы не достигаются за закрытыми дверями, а на поле боя - и эти победы одерживают солдаты, которые жертвуют своей жизнью ради благополучия своей родины. Мы обязаны этим людям оказать им нашу максимальную поддержку."
TRM_Army_Worthy_Of_Suvorov: "Армия, достойная великого Суворова"
TRM_Army_Worthy_Of_Suvorov_desc: "Александр Васильевич Суворов, русский генерал и военный теоретик, широко считается одним из величайших полководцев в истории России. Его военное мастерство было беспрецедентным, поскольку он никогда не проигрывал сражений. Суворов известен своими успешными штурмами крепостей, таких как Измаил, блестящими победами в русско-турецких конфликтах и походами в Италию и Швейцарию. Его легендарные подвиги в швейцарской кампании, во время которой его войска преодолели Альпы, стали фольклором. Мы создали армию, которой, несомненно, гордился бы Суворов."

TRM_May_The_Country_Be_Free: "Да будет Россия, свободная страна!"
TRM_May_The_Country_Be_Free_desc: "Поскольку к настоящему моменту мы провели самые неотложные реформы, наконец-то настало время для нации обрести истинную свободу. До тех пор, пока все наши противники не будут побеждены, свобода может оставаться ограниченной в некоторых частях России, но это цель, к которой мы стремимся несмотря ни на что."

### Czechoslovak ###
TRM_Czech_Legion_In_Power: "Легион берёт власть"
TRM_Czech_Legion_In_Power_desc: "Остатки Чехословацкого легиона, некогда грозной силы во время бурной гражданской войны, ослабли, но все же не было разумно вступать с ними в конфликт. Воспользовавшись предоставленной им возможностью, отважные мужчины из Чехии, Словакии и Карпатии взяли страну под свой контроль."
TRM_Panslavist_Direction: "Панславистское направление"
TRM_Panslavist_Direction_desc: "Сейчас не время для раздора и грандиозных планов по созданию великой Чехословакии. Мы должны сосредоточиться на всем славянском населении, угнетаемом немецким правлением. Крайне важно объединить всех славян под одним знаменем."
TRM_Gajdas_Czech_Path: "Истинная Чехословакия"
TRM_Gajdas_Czech_Path_desc: "Предательство Масарика, который подчинил свою страну австрийскому игу, нельзя простить. Даже если легион по-прежнему не может вернуть себе историческую родину, здесь, в далекой Сибири, мы провозгласим существование Чехословакии - с надеждой проложить путь к самой Праге."

TRM_Rely_On_Peasantry: "Опора на крестьянство"
TRM_Rely_On_Peasantry_desc: "Без поддержки аполитичных и бедных крестьян Дальнего Востока, которые составляют подавляющее большинство населения, будет невозможно создать мощную армию, способную пересечь весь континент."
TRM_Support_From_Big_Capitalists: "Поддержка со стороны крупного капитала"
TRM_Support_From_Big_Capitalists_desc: "Мы должны обратить внимание на купцов и предпринимателей Дальнего Востока для реализации наших великих устремлений, поскольку именно их поддержка станет основой для нашей борьбы за освобождение."
TRM_Corporativist_Economy: "Строительство корпоративистской экономики"
TRM_Corporativist_Economy_desc: "Рынок свободной конкуренции в той или иной форме не может реально обеспечить стабильную экономику для этой страны. Вместо этого мы создадим корпоративную систему, ориентированную на ключевые промышленные секторы, чтобы достичь наших целей."

TRM_Take_Control_Over_ROVS: "Взять под контроль Генеральный штаб"
TRM_Take_Control_Over_ROVS_desc: "Бывший генеральный штаб Колчака сейчас находится в состоянии упадка и беспорядка. Однако под нашим просвещенным руководством будет восстановлена сплоченность командования Приамурской армии."
TRM_Strict_Discipline2: "Установить легионерскую дисциплину"
TRM_Strict_Discipline2_desc: "Несмотря на свою славу боевой силы, годы относительной бездеятельности на Дальнем Востоке значительно подорвали боевые способности Чехословацкого легиона. Мы должны вновь привести наших солдат в форму, чтобы они стали по-настоящему дисциплинированной силой, способной достичь своих целей."
TRM_Vostokoslavia: "Провозгласить Восточнославию"
TRM_Vostokoslavia_desc: "Восточные славяне - белорусы, русские и украинцы - должны быть объединены под единым знаменем, которое не будет угнетать друг друга. С этим посланием мы должны объявить о создании Востославии или Восточнославии, нового политического образования, призванного освободить всю Евразию от немецкого господства."

TRM_Control_The_Railways: "Установить контроль над ж/д"
TRM_Control_The_Railways_desc: "Как мы узнали во время Гражданской войны, эксплуатируя знаменитый бронепоезд «Орлик», созданный благодаря нашей изобретательности и захвату уже существующих машин, таких как «Заамурец», владение железными дорогами имеет жизненно важное значение для осуществления контроля над всей страной. Мы должны помнить уроки нашей истории, устанавливая новые связи в направлении наших утраченных земель."
TRM_The_Marine_Department: "Морское ведомство"
TRM_The_Marine_Department_desc: "Хотя Влтава впадает только в Эльбу, а затем в далекое Северное море, все же было бы разумно изучить возможность морского возвращения в Чехию. Мы должны стремиться создать корпус элитных морских пехотинцев, который мог бы способствовать успешному освобождению различных территорий, находящихся под контролем Германии, что потенциально могло бы открыть путь к распаду их азиатской империи."
TRM_Roman_Catholic_Diocese: "Связи с католической епархией"
TRM_Roman_Catholic_Diocese_desc: "Россия, несомненно, является преимущественно православной страной, но на Дальнем Востоке все ещё существует католическое представительство. Владивостокская епархия, отделившаяся от Апостольского викариата Сибири после отделения России и Приамура, уже более десяти лет служит нашим верным братьям. Хотя мы должны уважать наших «православных» соседей, было бы разумно использовать католические связи в предстоящей совместной борьбе против протестантской гуннской угрозы."

TRM_Green_Ukrainian_Army: "Зелёная украинская армия"
TRM_Green_Ukrainian_Army_desc: "Юрий Глушко уже заработал себе место в истории Дальнего Востока благодаря своей попытке создать местное украинское государство во время Гражданской войны в России. Хотя в то время он потерпел неудачу, его сторонники все ещё можно найти на наших землях, и поэтому их можно использовать в качестве союзных сил. Давайте построим плодотворные отношения с национальным движением «Зеленый Клин»."
TRM_Question_Of_Japanese: "Задать вопросы японцам"
TRM_Question_Of_Japanese_desc: "Квантунская армия долгое время поддерживала местных лидеров, но с приходом к власти Легиона прежний статус-кво оказался в странном вакууме. Мы, и, по-видимому, гегемон в Токио, должны задуматься о будущем нашего уголка Азии."
TRM_Ally_Oblastniki_czech: "Выполнить обещание областников"
TRM_Ally_Oblastniki_czech_desc: "Борьба за подавление сибирского регионализма никогда не была нашей, ведь именно Колчак и ему подобные использовали наши войска для борьбы с стремящимся к свободе населением Дальнего Востока. Придя к власти, мы согласились заняться вопросом, за который ратовали областники, и наконец-то пришло время исправить ситуацию."

TRM_For_Freedom_Of_Slavic_Peoples: "За свободу Славии!"
TRM_For_Freedom_Of_Slavic_Peoples_desc: "Наконец-то настал момент, когда закончились приготовления к величайшей миссии, которую нам предстоит выполнить. Мы проложим путь через всю Азию, Европу и любой уголок Земли, чтобы освободить славянские народы от тирании германских угнетателей."
TRM_For_Freedom_Of_Czechoslovakia: "За свободу Чехословакии!"
TRM_For_Freedom_Of_Czechoslovakia_desc: "Мы не можем больше позволять себе тосковать по родине; время освобождения Чехословакии настало! Давайте начнем великий крестовый поход за освобождение нашей семьи во имя нашей родины."

### Japanese ###
TRM_Yui_Focus: "Японские «собаки»"
TRM_Yui_Focus_desc: "Японцев в Приамурье никогда не приветствовали. Новость о том, что Приамур будет напрямую управляться из Токио генералом Мицуэ, шокировала многих во Владивостоке и вызвала большой шок среди многих ярых националистов. Потребуется много времени и больших усилий, чтобы узаконить этот новый режим «собаки» в глазах народа."

TRM_Yui_Jap: "Начало японизации"
TRM_Yui_Jap_desc: "Теперь, когда наш марионеточный режим стоит на более прочной почве, пришло время сделать первые шаги к японизации всего региона. Уже прибыла первая волна японских колонистов - учителей, врачей и инженеров; их квалификация нам очень поможет."

TRM_Yui_Fac: "Пригласить японских рабочих"
TRM_Yui_Fac_desc: "Поскольку программа колонизации уже осуществляется, вскоре тысячи голодных бедных японцев сбегут в нашу страну в поисках работы. Дешёвая рабочая сила и капиталовложения с материка означают новые помещёния и новые возможности."

TRM_Yui_End: "Прояпонская пропаганда"
TRM_Yui_End_desc: "Сопротивление нашей культурной ассимиляции оказалось даже сильнее, чем мы ожидали. Поэтому мы должны принять меры, чтобы они не говорили, не слушали и даже не думали по-русски. Мы должны начать массовую пропагандистскую кампанию, чтобы подорвать то, что значит быть русским, укрепить любовь народа к Японии и, наконец, ассимилировать их."

TRM_Rising_Sun: "Восходящее солнце России"
TRM_Rising_Sun_desc: "Наконец, пришло время объявить наш последний акт. Попрощайтесь с Приамуром! Приветствуем новое Восходящее Солнце над Россией - Энкаишу."

TRM_Japanese_Annexation: "Японская аннексия"
TRM_Japanese_Annexation_desc: "Приамур как концепция изжила себя. Эти земли управляются японцами, для японцев, с учётом интересов Японии. Естественно, что их нужно включить в империю."

TRM_Japanese_Colony: "Японская колония"
TRM_Japanese_Colony_desc: "Эта земля ещё не готова быть официальной частью Империи. Нужно больше времени на стадии колонизации, чтобы она была достойна своего восхождения."

TRM_Give_Ussuri_To_Fengtian: "Передача Уссури Фэнтьяну"
TRM_Give_Ussuri_To_Fengtian_desc: "Пока мы владеем землями Внешней Маньчжурии, приобретёнными Российской империей по Николаевскому договору, мы должны поддержать наших союзников в Фэнтяне, вернув их."

TRM_New_Far_Eastern_Republic: "Окраина Востока"
TRM_New_Far_Eastern_Republic_desc: "Своими действиями мы превратили загнивающий Приамур в новую, сильную Дальневосточную республику."

TRM_Co_Prosper_With_Japan: "Взаимное партнёрское процветание с Японией"
TRM_Co_Prosper_With_Japan_desc: "Хоть и правда, что Япония дала нам многое, однако это не означает, что мы должны отказаться от нашей независимости. Мы должны поддерживать тесные связи с ними как с партнерами, а не со слугами."

TRM_Co_Prosper_Within_Japan: "Союзное процветание с Японией"
TRM_Co_Prosper_Within_Japan_desc: "Мы слишком многим обязаны Японии, чтобы просто сидеть сложа руки и оставаться независимыми. Пришло время нашего подъёма."

TRM_Expand_RCW: "Уроки путча Колчака"
TRM_Expand_RCW_desc: "После путча Колчака у нас было несколько пограничных конфликтов с Россией, но мы сохранили Дальний Восток и теперь знаем их слабые места."

TRM_Deal_With_Mongolia: "Сделка с Монголией"
TRM_Deal_With_Mongolia_desc: "Монголия не только оккупирует наши законные земли, но и открывает путь в сердце петроградского режима. Мы должны привлечь Монголию на свою сторону, прежде чем наступать на Петроград."

TRM_Demand_Sakhalin: "Потребовать Сахалин"
TRM_Demand_Sakhalin_desc: "Сахалин и Курильские острова - естественные притязания России. Пока у нас хорошие отношения с японцами, мы можем попытаться получить от них эти территории в обмен на нашу лояльность."

TRM_FE_RUS: "Утвердить нашу сферу"
TRM_FE_RUS_desc: "Россия сейчас находится в состоянии войны. Пока они заняты на Западе, мы можем оказать на них давление на Востоке. Мы должны немедленно вытеснить их с наших законных земель."

TRM_Refuse_War: "Отказ от всероссийских амбиций"
TRM_Refuse_War_desc: "Мы больше не должны заявлять о себе как о законном российском правительстве. Мы выбрали другой путь - путь независимого Дальнего Востока и Сибири."

TRM_Demand_Bai: "Претензия на Байкальский регион"
TRM_Demand_Bai_desc: "Российский Дальний Восток - это просто пустошь. Если мы хотим расшириться ещё больше, нам нужны промышленные базы. Байкал кажется нам хорошим началом."

TRM_Cap_Irkutsk: "Перенести столицу в Иркутск"
TRM_Cap_Irkutsk_desc: "Теперь мы контролируем Иркутск, что означает для нас рост промышленности. Объявление города нашей новой столицей снизит влияние японцев в нашем государстве, но они не будут этому рады."

TRM_Demand_Mon: "Сломить монголов"
TRM_Demand_Mon_desc: "Часть Транссибирской магистрали всё ещё остаётся в руках безумного барона Штернберга. Если мы вернём себе Транссиб, это продемонстрирует нашу растущую мощь и ещё больше поднимет нашу промышленность."

TRM_Integrate_Bai: "Интеграция Байкала"
TRM_Integrate_Bai_desc: "Завоевать кусок земли - это одно. А заставить её жителей принять тебя - совсем другое. Нам потребуется некоторое время, чтобы навести порядок в Байкальском регионе, но если мы добьемся успеха, то сможем даже объявить себя настоящей Дальневосточной республикой, демонстрируя нашу возросшую силу и стремление к окончательной победе над незаконным режимом в Петрограде."

TRM_Integrate_Mon: "Интеграция земель Монголии"
TRM_Integrate_Mon_desc: "Эта часть Транссиба теперь наша. Мы должны заменить прежнюю администрацию на лояльную, а затем начать использовать Транссиб."

TRM_Leave_Japan: "Отказаться от японской сферы"
TRM_Leave_Japan_desc: "Поскольку мы реализовали свои амбиции, мы больше не нуждаемся в японцах. Теперь мы можем официально выйти из сферы их влияния и стать полностью свободными."

TRM_Aftermath_Of_Sib_War: "Последствия Сибирской войны"
TRM_Aftermath_Of_Sib_War_desc: "После Сибирской войны мы должны глубоко и жестко оценить наши поражения и победы."

TRM_Trial_Socialists: "Суд над социалистами"
TRM_Trial_Socialists_desc: "В России проживает множество социалистов, большинство из которых скрываются в тени. Хотя их партии уже запрещены, более решительные действия могут навсегда лишить их свободы."

TRM_Trial_ROVS: "Суд над РОВС"
TRM_Trial_ROVS_desc: "Позволить РОВС и, как следствие, военным действовать бесконтрольно - это политическое самоубийство, которое всегда приводит к катастрофе. С ними нужно что-то делать, и делать быстро."

TRM_Trial_SR: "Суд над ПСР"
TRM_Trial_SR_desc: "Хотя Керенский явно не реабилитирован, в ПСР всё ещё есть люди, которые могли бы стать нашими союзниками в деле обеспечения безопасности России. По тем или иным причинам они ополчились на этого ничтожного человека и готовы сотрудничать."

TRM_Secure_The_Regime: "Обезопасить режим"
TRM_Secure_The_Regime_desc: "После того как мы разобрались с новыми внутренними врагами, должно наступить время стабилизации. Сибирская война была тяжёлой для нашего народа, и мы должны справиться с её последствиями, если хотим обеспечить безопасность нашего правления."


TRM_Reclaim_Lands: "Путь к освобождению наших земель"
TRM_Reclaim_Lands_desc: "Теперь, когда мы стали Россией, мы должны отвоевать наши бывшие земли у тиранов, правящих в Центральной Европе"

TRM_Attack_CA: "Освободить Среднюю Азию"
TRM_Attack_CA_desc: "Теперь все российское государство находится под нашим командованием. Пришло время отвоевать наши земли в Центральной Азии у различных повстанческих государств."
TRM_Demand_ALO: "Защитите Казахстан"
TRM_Demand_ALO_desc: "Казахстан - обширная и богатая страна. После того, как мы его присоединим, мы сможем смотреть ещё дальше на юг, в Туркестан."
TRM_Invade_Turkestan: "Обеспечить безопасность Туркестана"
TRM_Invade_Turkestan_desc: "Туркестан не особенно богат и даже не очень населен. Но очень скоро он станет нашим и послужит прекрасным плацдармом к богатым персидским и индийским провинциям, если нам это понадобится."

TRM_Attack_Caucasus: "Освободить Кавказ"
TRM_Attack_Caucasus_desc: "Теперь все российское государство находится под нашим командованием. Настало время отвоевать у разных мятежных государств нашу землю на Кавказе."
TRM_Demand_DKB: "Вопрос о Казаках"
TRM_Demand_DKB_desc: "Донско-Кубанская область - такая же русская, как и Россия, или так утверждает наш военный штаб. Они также утверждают, что казаки, живущие там, хотя и являются крепкими людьми, но они не настолько крепки, чтобы сражаться с коней против наших современных, неудержимых армий."
TRM_Invade_Azerbaijan: "Бакинские нефтяные месторождения"
TRM_Invade_Azerbaijan_desc: "В течение долгого времени мы зависели от импорта дорогостоящей нефти, чтобы поддерживать нашу военную машину в рабочем состоянии. Все, что стоит между нами и самодостаточной экономикой, - это маленькое, слабое государство Азербайджан."
TRM_Invade_Georgia: "Грузинский вопрос"
TRM_Invade_Georgia_desc: "Хотя Грузия не является крупным, богатым и не представляет никакой угрозы для нашего государства... Это принципиальный вопрос. Это земля, украденная у нас во время Вельткрига. Скоро она вернется к нам, вместе с остальными."
TRM_Invade_Armenia: "Статус Армении"
TRM_Invade_Armenia_desc: "Армянский народ разделяет нашу веру и будет только рад вернуться к нам. Нет?"

TRM_Attack_Europe: "Русская Восточная Европа"
TRM_Attack_Europe_desc: "Все Российское государство сейчас под нашей властью. Настало время восстановить наше влияние в Восточной Европе и уничтожить, отколовшиеся от Российской империи, государства."
TRM_Invade_Finland: "Поставить Финляндию на колени"
TRM_Invade_Finland_desc: "Финляндия и их нелегитимный Король издевались над Россией достаточно долго. Пришло время снова отправить русские войска в Хельсинки."
TRM_Invade_WHR: "Вторжение в Беларусь"
TRM_Invade_WHR_desc: "Отколовшееся государство, обычно называемое Беларусью, было провозглашено Кайзером. Мы не потеряем наши земли на этот раз!"
TRM_Invade_Ukraine: "Уничтожить проект\n«Украина»"
TRM_Invade_Ukraine_desc: "Могущественные немецкие армии защищали Украину от аннексии после Октябрьской революции. Однако теперь, когда мы вернулись к власти, у нас появился шанс воссоединить Украину с Россией."
TRM_End_Poland: "Вернуть Польшу"
TRM_End_Poland_desc: "Поляки всегда были мятежным народом, требовавшем своей независимости. Однако они забыли, что Конституция Польши в Конгрессе навечно связала их с Россией. Напомним им об этом."
TRM_Demand_Bessarabia: "Вернуть Бессарабию"
TRM_Demand_Bessarabia_desc: "Бессарабия важна не только в стратегическом, но и в культурном плане, поскольку там проживает русское меньшинство. Мы будем требовать её передачи от правительства Румынии."
TRM_End_Germany: "Время покончить с Рейхом"
TRM_End_Germany_desc: "Потери по Брест-Литовскому мирному договору слишком велики, чтобы их можно было сосчитать. Пришло время вернуть России славу, которую мы имели до Вельткрига!"
TRM_Attack_Mongolia: "Атаковать Монголию"
TRM_Attack_Mongolia_desc: "Монголы не только оккупируют Туву, нашу законную землю, но и стоят на нашем пути в Китай. Мы должны что-то с этим делать."
TRM_China_Policy: "Интервенция в Китай"
TRM_China_Policy_desc: "Китайский регион сейчас находится в состоянии Гражданской войны. Различные полевые командиры и правительства пытаются установить контроль над всеми территориями бывшей Империи Цин. И немцы, и японцы пытаются втянуть Китай в сферу своего влияния. Однако претензии к Китаю есть и у России. Мы должны выбрать сторону, которую будем поддерживать, и попытаться помочь ей установить контроль над всем Китаем, тем самым мы получим сильного союзника."
TRM_Demand_KVZHD: "Вернуть КВЖД"
TRM_Demand_KVZHD_desc: "КВЖД, Китайско-Восточная железная дорога, была построена нами, чтобы помочь с железнодорожным сообщением в порт Владивосток. Она был утерян после Революции, когда её захватили китайцы. Пора требовать её возвращения вместе со всеми окружающими землями."
TRM_Secure_Straits: "Обеспечить контроль над проливами"
TRM_Secure_Straits_desc: "Россия всегда стремилась контролировать Стамбул, хотя судьба жестоко скрывала это от нас. Нам предоставляется бесценная возможность взять Босфор под свой контроль."
TRM_Demand_North_Iran: "Захват Северного Ирана"
TRM_Demand_North_Iran_desc: "Обеспечение нашего контроля над Северным Ираном важно для нашего господства в районе Каспийского моря."
TRM_Invade_Afghanistan: "Вторжение в Афган"
TRM_Invade_Afghanistan_desc: "Афганистан всегда имел жизненно важное значение для наших геополитических замыслов. В конце концов, в прошлом мы вели «Большую игру» с британцами. Если мы сможем победить Афганистан, наш путь в Индию будет обеспечен."
TRM_India: "Политика в отношении Индии"
TRM_India_desc: "Наш лучший способ гарантировать соблюдение наших интересов, когда речь идет об Индии, - это поддержать одну из трёх сторон, борющихся за господство там."
TRM_join_entente: "Истинные союзники"
TRM_join_entente_desc: "Во время Вельткрига мы стояли рядом с Великобританией и Францией против германских гуннов и их союзников. Теперь, когда мы вернулись к власти, они наверняка захотят нам помочь, ведь Колчак был хорошим другом Георга V."
TRM_on_our_own: "Свой альянс"
TRM_on_our_own_desc: "Россия не должна быть псом для любой другой нации. Пришло время сформировать свой собственный альянс и больше не танцевать под чужую трубу!"
TRM_Realpolitik: "Расширить деятельность Росторга"
TRM_Realpolitik_desc: "И немцы, и социалисты располагают собственными экономическими союзами, которые используют для укрепления сотрудничества между близкими по духу государствами, а в случае Германии - ещё и для продвижения собственных материальных интересов. Теперь, когда Россия начала укреплять своё влияние в Европе, возможно, настало время последовать их примеру. Российское торговое сообщество, или Росторг, станет противовесом Миттельевропе и будет продвигать российские экономические интересы за рубежом."

### Mladorossi Focuses ###
TRM_Triumph_Of_True_Mladorossi: "Торжество истинных младороссов"
TRM_Triumph_Of_True_Mladorossi_desc: "Мы не позволили лидеру Казем-Беку осуществить свою диктатуру без участия народа. Благодаря удачному стечению обстоятельств мы смогли свергнуть этот фальшивый режим до того, как он смог закрепиться. Теперь мы сможем донести до масс истинно верную идею младороссов."

TRM_Cleanse_Party_From_Vozhdists: "Очистить партию от вождистов"
TRM_Cleanse_Party_From_Vozhdists_desc: "Руководство Казем-Бека глубоко проникло в нашу партию за долгие годы его лидерства. Мы не позволили лидеру Казем-Беку осуществить свою диктатуру без участия народа. Благодаря удачному стечению обстоятельств мы смогли свергнуть этот фальшивый режим до того, как он смог закрепиться. Теперь мы сможем донести до масс истинно верную идею «Молодой России». И хотя изначальные идеалы движения младороссов были справедливы для русского народа, в самой организации всё ещё остаётся много сторонников твёрдой руки и авторитарного правления, что противоречит самой идее советской демократии."

TRM_Return_Throne_To_True_Tsar: "[TRM_Return_Throne_To_True_Tsar_Focus]"
TRM_Return_Throne_To_True_Tsar_desc: "[TRM_Return_Throne_To_True_Tsar_Focus_desc]"
TRM_Return_Throne_To_True_Tsar_1: "Вернуть трон истинному царю"
TRM_Return_Throne_To_True_Tsar_1_desc: "Капиталисты в [RUS.Capital.GetName] помазали своего марионеточного царя, пусть и из благородного дома Романовых. Хотя некоторые провозгласили, что это сигнализирует о провале нашего движения, они всего лишь заблуждающиеся глупцы. Мы должны бороться с этой несправедливостью и поставить во главе другого кандидата - того, кто готов к народной власти."
TRM_Return_Throne_To_True_Tsar_2: "Новый народный царь"
TRM_Return_Throne_To_True_Tsar_2_desc: "Новый царь России станет истинно народным монархом, готовым служить вместе с народом, а не над ним. Благодаря направляющему руководству нашей партии мы не только восстановим священную монархию, но и сохраним власть нашего народа."

TRM_The_Monarch_Reigns_Not_Rules: "Монарх царствует, но не правит"
TRM_The_Monarch_Reigns_Not_Rules_desc: "Россия поистине не знала счастья самоуправления. Прежние цари делали всё для укрепления своей власти, но младороссы не готовы это терпеть. Хотя Казем-Бек пытался установить диктатуру своего правительства, мы готовы к осуществлению истинной демократии и конституционной монархии - под властью Советов."

TRM_Tsar_And_Soviets: "Восстановить славу «Молодой России»"
TRM_Tsar_And_Soviets_desc: "В то время как Александр Казем-Бек и его группа превратили движение младороссов в посмешище, наша фракция восстановит славу великой идеи сочетания традиционного русского монархизма со справедливой социалистической системой."

TRM_Mlad_Cut_Ties_With_Japan: "Разорвать все связи с Японией"
TRM_Mlad_Cut_Ties_With_Japan_desc: "Без всяких сомнений, господство Квантунской армии и их марионеток в Приморье беспокоит наше правительство. Мы должны немедленно разорвать все связи с Японской империей, прежде чем они нанесут ответный удар!"

TRM_Mlad_Crush_NRA: "Решение вопроса о НРА"
TRM_Mlad_Crush_NRA_desc: "Народно-революционная армия, представляющая вооружённое крыло эсеро-большевистского подполья, была почти разгромлена колчаковцами до их своевременного конца. Нам предстоит принять окончательное решение о конечной судьбе НРА, будь то установление сотрудничества с нашей партией или полное уничтожение этих подконтрольных Западу криптосоциалистов."
TRM_Mlad_Crush_NRA_tt: "§YПРИМЕЧАНИЕ:§!\nЗавершение либо §C$TRM_Nationalize_Large_Capital$§!, либо §C$TRM_7_Democracy_Principles$§! до выполнения этого национального фокуса позволит нам сотрудничать с §NNRA§!"

TRM_Democracy_Of_Soviets: "Демократия Советов"
TRM_Democracy_Of_Soviets_desc: "Народническая идея советской демократии, неудачно реализованная большевиками, заслуживает нового шанса. Распространив советскую систему на Дальний Восток, мы получим поддержку народа и прочный фундамент для нашего государства."

TRM_Fair_Distribution: "Справедливое распределение ресурсов"
TRM_Fair_Distribution_desc: "Это настоящая трагедия, что веками честный и трудолюбивый народ России лишали заслуженной награды силы, стоящие над ним. Мы изменим это, взяв марксистскую концепцию «От каждого по способностям, каждому по потребностям», но заменив потребность заслугой, и создадим общество, которое приносит пользу всему трудолюбивому коллективу в целом и наиболее ярким его представителям в частности."

TRM_Healty_National_Consciousness: "Здоровое национальное сознание"
TRM_Healty_National_Consciousness_desc: "У каждой здоровой нации есть инстинкт самосохранения, связанный с верой в страну. В таких обществах он проявляется в желании сохранить независимость и безопасность общего блага. Люди должны уважать и ценить свою нацию как внутри страны, так и за рубежом, ибо без этого не будет веры в родину. Национальная гордость должна оставаться первостепенной в понимании того, что мы все являемся частью чего-то большего."

TRM_Nationalize_Large_Capital: "Национализировать крупный капитал"
TRM_Nationalize_Large_Capital_desc: "Под иностранной защитой японских империалистов Дальний Восток оказался во власти крупных землевладельцев, буржуазии и прочих «меркуловских» пиявок. Мы должны вернуть контроль над нашим государством во всех его аспектах и отдать народу всё, что было у него украдено."

TRM_7_Democracy_Principles: "Семь принципов демократии"
TRM_7_Democracy_Principles_desc: "Как изложил Александр Угримов, демократия - это не просто система правления, а скорее метафизический набор основных ценностей. Направляя наш процесс в соответствии с Семью принципами демократии, восстановленная монархия будет с гордостью стоять в будущем как нечто большее, чем просто корона, министры или граждане."

TRM_Sobornost: "Соборность"
TRM_Sobornost_desc: "Соборность - это уникальная русская религиозно-философская концепция, подразумевающая свободное, духовное, братское единение людей в любви и вере. Она проявляется как в Церкви, так и в мирской жизни в целом, ибо эта сплочённая общность не подавляет свободу личности, а обогащает её. Мы должны популяризировать её среди наших граждан, чтобы спасти Россию от самой возможности исчезновения."

TRM_Cooperation_With_Novy_Grad: "Сотрудничество с «Новым градом»"
TRM_Cooperation_With_Novy_Grad_desc: "Мы стремимся создать новое, преображённое христианское общество; общество с соборностью, где вера проявляется в личных действиях и активном участии в общественной жизни. Это, конечно, противопоставляется «Старому граду» (уходящей императорской России) и чрезмерно индивидуалистическому «неохристианству». Христианство «Нового града» сосредоточено на «общем спасении» и построении Царства Божьего на Земле через культурную трансформацию, а не только на личном спасении души. Мы должны сотрудничать с такими великими фигурами, как Николай Лосский, Сергей Булгаков и Николай Бердяев, чтобы возродить верующее сердце России."

TRM_Unity_Of_Church_And_State: "Единство церкви и государства"
TRM_Unity_Of_Church_And_State_desc: "В то время как многие социалисты, преимущественно из марксистских школ мысли, категорически отвергают идею существования религии в мире, о котором они мечтают, мы думаем иначе. Россия имеет свой особый путь в истории, проложенный Небесами, и поэтому вполне естественно, что Церковь всегда будет оставаться на его переднем крае. её единство с нашим государством должно стать основой для нового духовного пути русского народа под властью царя и Советов."

TRM_Universality_Of_Gospel_Doctrine: "Вселенскость евангельского учения"
TRM_Universality_Of_Gospel_Doctrine_desc: "Вселенскость евангельского учения - это христианская вера в то, что весть о спасении через Иисуса Христа предназначена для всех людей, независимо от их расы, нации или социального положения. Любовь нашего Господа не была дана только избранной группе людей, ибо Божья любовь беспристрастна, а потребность человека в искуплении всеобща. Нужно только взглянуть на семена, посеянные в Ветхом Завете, где эти обещания недвусмысленно изложены и исполнены через новозаветное благовестие и великое поручение. Разнообразные народы мира, не только в России и соседних странах, заслуживают надежды и пути к счастью."

TRM_Cooperate_With_Eurasianists: "Сотрудничать с евразийцами"
TRM_Cooperate_With_Eurasianists_desc: "Не пользующееся широкой популярностью у масс, но известное в среде интеллигенции, евразийское движение в Петрограде, несомненно, заслуживает внимания, особенно идеи Якобсона и Трубецкого. Мы должны попытаться найти с ними общий язык."

TRM_Turn_To_Scythians: "Обратиться к «скифам»"
TRM_Turn_To_Scythians_desc: "Группа «скифов» была сформирована Разумником Ивановым-Разумником. Кроме него самого, в эту группу входили и другие, среди них известные русские поэты Сергей Есенин, Александр Блок и Андрей Белый. По мнению Иванова-Разумника, история русской мысли представляет собой борьбу творческой интеллигенции с «сословным мещанством» и духом конформизма, и только интеллигенция способна победить этот дух городского обывателя, принеся освобождение всему народу, сначала индивидуально, а затем и в социальном и политическом плане. Его социальные идеи близки идеям левых, что делает его неплохим союзником для нас. Именно такие люди, как Иванов-Разумник, могут создать в России новую, истинно народную интеллигенцию."

TRM_Czech_Question: "Чешский вопрос"
TRM_Czech_Question_desc: "Чехословацкий легион, вернее небольшая часть оставшихся чехословаков, не согласных с Масариком и не признавших его авторитет, осталась в России и присоединилась к адмиралу-диктатору. Несомненно, их руководство полно правых фанатиков, которые считают наше правление нежелательным перерывом в своей жизни. Хотя они ещё не предприняли никаких действий, мы всё же должны решить, что с ними будет."

TRM_Free_Literature: "Свобода литературы"
TRM_Free_Literature_desc: "Хотя законы военного времени всё ещё налагают определённые ограничения на крамольные и изменнические публикации (которые будут сохранены, если наступит такое тёмное время), ясно, что любая дальнейшая цензура была бы неразумна. Давайте освободим прессу и литературу от оков, обеспечив народу России законное право на интеллектуальный расцвет."

TRM_Unity_Of_Tsar_And_People: "Единство царя и народа"
TRM_Unity_Of_Tsar_And_People_desc: "Царство как институт не пользовалось искренним одобрением нашего vast населения, по крайней мере, после смерти Александра II Освободителя. Императорский двор осознаёт, что наш монарх должен быть связан с бедными массами Империи, как это было с Царём-Освободителем, и поэтому учредил программу многочисленных общественных мероприятий, в ходе которых богоизбранный монарх выходит к нации."

TRM_tsar_soviets: "Царь и Советы!"
TRM_tsar_soviets_desc: "Для многих младороссы - группа слишком нелепая, чтобы вообще существовать, но в хаосе переворота им каким-то образом удалось захватить власть. Теперь Александр Казем-Бек и его группа будут стремиться реформировать Приамурье в соответствии со своим радикальным видением. С младороссами у руля две, казалось бы, противоречащие друг другу силы - монархизм и социализм - наконец-то объединятся."

TRM_ally_smen: "Союз с чехословацкими легионерами"
TRM_ally_smen_desc: "Мы должны заключить союз с чехословацкими легионерами, также известными как белые чехословацкие панслависты. С их помощью мы сможем восстановить Царство в ещё большей степени."

TRM_party_order: "Партия порядка"
TRM_party_order_desc: "Мы - партия порядка, партия силы и партия Единства. И мы клянёмся нашему народу сохранять целостность нашего народа любыми средствами, включая средства, которые некоторые более либеральные и анархистские элементы сочли бы «авторитарными» или даже «реакционными»."

TRM_social_monarchy: "Современный богатырь"
TRM_social_monarchy_desc: "Блистательные в синей форме, одноимённые «синерубашечники» вызывают образ легендарного богатыря: патриотичного, набожного и мужественного. Осуществив национальную революцию, синерубашечники будут преобразованы из партийной милиции во Внутренние войска Приамурья, верные Вождю."

TRM_soviet_democracy: "Советская демократия"
TRM_soviet_democracy_desc: "Слишком долго рабочие угнетались рукой реакции, пришло время отбросить старую автократию Приамурья и установить новую форму демократии, управляемую рабочим и крестьянином! Мы сделаем это, внедрив советскую систему, теоретизированную Лениным, которую, к сожалению, не удалось установить из-за поражения большевиков во время Гражданской войны. Наши рабочие и крестьяне наконец смогут выражать себя и принимать решения на местном уровне, конечно, под бдительным оком членов партии."

TRM_cult: "Культ Вождя"
TRM_cult_desc: "Как у Ленина были верные последователи, и как культ личности сформировался вокруг Царя, так и Казем-Бек обрёл культовых последователей. Привлекая легионы лояльных сторонников, которые сделают всё, что прикажет Вождь. И с лояльным пролетариатом на стороне младороссов все враги Царя и Вождя будут повержены!"

TRM_vlad_conference: "Владивостокская конференция"
TRM_vlad_conference_desc: "В связи с нынешним положением Казем-Бека он решил созвать совещание своих союзников из младороссов, чтобы лучше определить будущее Приамура. Однако приглашены были не только младороссы. На конференцию также позвали представителей других влиятельных политических течений, включая евразийцев, националистов и сменовеховцев, несмотря на то, что многие из них не разделяют взглядов Казем-Бека или политического курса младороссов. Тем не менее он прекрасно понимает, что ему необходимы союзники, и что по итогам конференции одна из этих фракций будет приглашена к сотрудничеству с правительством Казем-Бека."

TRM_ally_evra: "Союз с национал-максималистами"
TRM_ally_evra_desc: "Евразийцы желают установления братства славянских и азиатских народов, чтобы служить оплотом против западного меркантилизма. Их преклонение перед героизмом, духовностью и иерархией было замечено Вождём, а также японскими ультранационалистами, близкими к Императору. Однако нам лучше заключить союз с их национал-максималистским крылом, которое лучше отражает наши идеалы."

TRM_ally_nationalists: "Союз с националистами"
TRM_ally_nationalists_desc: "Революция поставила националистов Вонсяцкого перед выбором: погибнуть вместе с Колчаком или помочь осуществить Царство. Хотя их лояльность Казем-Беку и Партии остаётся под вопросом, никто не может отрицать их вечную любовь к России, ни ярость тех, кто идёт под флагом Черепахи."

TRM_our_hand_alone: "Лишь своей рукой"
TRM_our_hand_alone_desc: "Нами не правят слабые японцы, и нас не остановят орды русских на востоке. Мы сильны, свободны и трудолюбивы. Нация усердных, трудолюбивых мужчин и женщин, которые не остановятся ни перед чем, чтобы спасти свою нацию и сопротивляться любому захватчику до победного конца. И с властью, данной нашим лояльным гражданам, мы будем править любым, кто попытается остановить нашу могучую нацию!"

TRM_eurasia: "Евразийское братство"
TRM_eurasia_desc: "Одна из главных идей евразийцев заключается в том, что все народы Европы и Азии должны объединиться как одно целое. И с их влиянием в правительстве мы будем стремиться создать братство между всеми гражданами Евразии. Особенно братство между японцами и русскими, которые слишком долго были разделены."

TRM_worker_solidarity: "Панславянская солидарность"
TRM_worker_solidarity_desc: "Установление истинно панславянского Царства означает постановку славянских наций во главу угла. Славяне будут иметь право на плоды своего труда. И когда славяне наконец возглавят наше государство, реакционные и буржуазные институты старой капиталистической России будут наконец разрушены."

TRM_modern_bog: "Социальная монархия"
TRM_modern_bog_desc: "Настало время сделать Приамурье истинно народным Царством. Младороссы завоевали достаточно влияния, чтобы установить истинно рабочего Царя и начать процесс возвращения Трона и всей России. И вскоре мы воистину воплотим дух Социальной монархии."

TRM_imperial_council: "Всеимперский экономический совет"
TRM_imperial_council_desc: "Чтобы лучше подготовиться промышленно к освобождению Родины, Царь приказал создать Всеимперский экономический совет, который будет контролировать превращение Приамурья из бесплодного захолустья в индустриальную сверхдержаву. И как только Приамурье будет полностью индустриализировано, мы сможем перейти к уничтожению фальшивого правительства на востоке."

TRM_plan_return: "Традиционные пролетарские ценности"
TRM_plan_return_desc: "Хотя наша красная политика указывала бы на прогресс и уничтожение традиционализма, мы, по счастью, знаем лучше, чем разрушение старого. Мы должны не только поддерживать старые структуры власти, но и расширять дворянство и заслуги дворянских семей не только в Приамурье, но вскоре и во всей России."

TRM_orthodox: "Православный интегрализм"
TRM_orthodox_desc: "Хотя мы и красные, мы достаточно умны, чтобы понимать, что Православная Церковь невероятно важна, и сохранение власти Церкви необходимо, если мы хотим иметь какую-либо легитимность в качестве Царства. Поэтому мы должны оставить Церковь жизненно важной частью нашего общества; до такой степени, чтобы она была неотделима от самой нации. Этот «Православный интегрализм» обеспечит единство в нашем деле, как политически, так и религиозно."

TRM_spirit_revolution: "Революция духа!"
TRM_spirit_revolution_desc: "Время, когда идеология правит нами, прошло, правительство Казем-Бека создало революцию более могущественную, чем любой материальный предмет или секта; он создал Революцию Духа, которая объединяет всех нерушимой связью. Эта революция, ставящая интегральный национализм превыше всего, восторжествовала в Приамурье и скоро восторжествует во всём мире. Вместо того чтобы быть разделённой классами, Россия будет объединена нацией!"

TRM_Soviet_Tsardom: "Красный царь торжествует!"
TRM_Soviet_Tsardom_desc: "Хотя нас сначала высмеяли на международной арене, нам удалось достичь цели, к которой мы стремились годами. Ложные тираны, такие как [RUS.GetLeader] и [SOV.GetLeader], были устранены, и воля Вождя Казем-Бека и Рабочего Царя восторжествовала. Мы вернули наследие Царей; однако наша работа ещё не закончена. Освобождение нашей законной родины только началось..."

TRM_restoring_tsardom: "Восстановление границ Царства"
TRM_restoring_tsardom_desc: "Теперь, когда мы вернули Россию, мы можем сосредоточиться на возвращении земель, которые с тех пор были потеряны. С тех пор как мы были всего лишь государством-обрубком в Сибири, у нас были мечты вернуть каждый дюйм старого Царства, и теперь у нас наконец есть инструменты, чтобы воплотить наши мечты в реальность!"

TRM_invade_manchuria: "Занять Маньчжурию"
TRM_invade_manchuria_desc: "Хотя мы, возможно, потеряли контроль над Маньчжурией в прошлом, теперь мы в состоянии нанести удар по фальшивому республиканскому правительству в Маньчжурии и вернуть неотъемлемую часть нашей империи."

TRM_invade_persia: "Вторгнуться в Персию"
TRM_invade_persia_desc: "Чтобы лучше укрепить наши позиции на Ближнем Востоке, мы должны обезопасить Каспийское море, Персия должна быть устранена. Необходимо установить связь между Средней Азией и Кавказом; и необходимо создать послушное правительство в Тегеране."

TRM_invade_romania: "Вернуть наши румынские земли"
TRM_invade_romania_desc: "Валахия и Молдавия по праву являются русскими землями; и эти законные русские земли должны быть возвращены. Пришло время сокрушить правительство Румынии и освободить наши утерянные земли."

TRM_take_back_alaska: "Вернуть Аляску"
TRM_take_back_alaska_desc: "Было глупостью когда-либо отказываться от Аляски, теперь это совершенно ясно. Однако, поскольку американцы погрязли в гражданской войне, у нас есть возможность нанести удар по Аляске и вернуть наш плацдарм в Америке."

TRM_natural_borders_restored: "Естественные границы России восстановлены!"
TRM_natural_borders_restored_desc: "Законные границы России теперь восстановлены; наша нация снова едина. И с восстановленным правом первородства мы можем теперь обеспечить нашу гегемонию над всей Евразией. Слава Царю и Советам!"

