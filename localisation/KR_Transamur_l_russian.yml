### Events ###
tram.intro.t: "Приамурье - Временное Российское государство во Владивостоке"
tram.intro.d: "Сибирь и российский Дальний Восток были основным районом конфликта во время Гражданской войны в России, как место недолговечной демократической республики, восстания «Чехословацкого легиона» и японской интервенции. Хотя они были вынуждены эвакуировать свои силы из-за давления Германии (а также ожесточённого сопротивления местных казаков), японцы оставались заинтересованными в расширении своего влияния и в 1922 году выступили за создание независимого государства в Приамурском регионе. Это предложение получило поддержку деловых кругов Владивостока, несмотря на то, что оно делало их уязвимыми для формирования экономической зависимости от Японии. Однако большинство деловых кругов рассматривали экономические и дипломатические отношения с восходящей державой на Востоке как значительное преимущество, особенно по сравнению с альтернативой быть втянутыми дальше в беспорядки, охватившие остальную Россию. Новая нация получила видную номинальную фигуру в лице адмирала Колчака, одного из самых успешных белых генералов гражданской войны и некогда самопровозглашённого «Верховного правителя всея Руси», который был вынужден бежать из России после своей неудачной попытки захватить власть в 1925 году.\n\nВ 1936 году Приамурская республика стала корпоративным и милитаристским государством, сильно связанным экономически с Японской империей. И всё же у Колчака есть свои амбиции. Может ли он просто играть в очень опасную игру, используя японскую защиту для установления своей собственной власти сначала над Сибирью, а затем и над всей Россией?"
tram.intro.a: "Интересно..."
tram.intro.b: "Расскажите подробнее о политике Приамурья."

tram.999.t: "Областники - Сибирские регионалисты"
tram.999.d: "Сибирское областничество - это политическое движение за создание автономной Сибири. Впервые разработанное в XIX веке сибирскими студентами, оно приобрело огромную популярность во время Гражданской войны в России с созданием Временного правительства автономной Сибири. Однако Временное Сибирское правительство пожертвовало собственной независимостью ради консолидации всех возможных сил для борьбы с большевиками.\n\nВо время правления Керенского, хотя Россия и была объявлена федеративной республикой, президент последовательно блокировал все резолюции о предоставлении более широкой автономии Сибири, и она до сих пор остаётся неразвитым регионом.\n\nВ то время как большая часть Сибири находится под контролем Петроградского режима, большинство областников, как левых, так и правых, поддержали своего бывшего союзника - адмирала Колчака - в путче, поскольку он обещал широкую автономию Сибири и даже пригласил видного областника - Петра Вологодского - стать премьер-министром.\n\nВ 1936 году они всё ещё ждут, когда Колчак наконец объединит Россию под своей властью и провозгласит Сибирскую автономию. Их сопротивление растёт вместе с их популярностью, и если оно станет достаточно высоким, они даже могут попытаться свергнуть Колчака."

tram.998.t: "Японские интересы в Приамурье"
tram.998.d: "Императорское правительство Японии имеет огромное влияние на нашу страну - оно по праву считается единственным интервентом во время Гражданской войны, введя огромный контингент войск Квантунской армии в Приамурском регионе. В 1922 году они добились создания буферного государства во Владивостоке при поддержке местного делового сообщества. Всё изменилось в 1925 году, когда в результате пресловутого «Колчаковского путча», несмотря на ничтожную роль самого адмирала в этом казачьем демарше, почти весь Дальний Восток стал независимым, а сам Колчак стал номинальным «Верховным правителем». Будучи подозрительным, а порой и откровенно непокорным по отношению к единственному иностранному союзнику, Колчак всячески пытается контролировать японское влияние, несмотря на свободный военный доступ Квантунской армии и их контроль над портом Владивосток."

tram.997.t: "Деловое сообщество Владивостока"
tram.997.d: "Деловые круги Владивостока - а именно братья Меркуловы и другие, более мелкие предприниматели - были основой Приамурья, когда это государство только провозглашалось. Хотя в 1925 году они не вошли в состав колчаковского Совета министров, фактически вся внешняя торговля держится на них. Под их контролем вместе с Квантунской армией находится порт Владивостока. Такая ситуация позволяет Меркуловым богатеть, японскому гарнизону получать щедрые взятки, а Колчаку остаётся лишь молча наблюдать за разгулом преступности. С каждым визитом японской делегации деловое сообщество всё больше ориентируется на торговлю с Японией. И, похоже, такое положение вещей останется неизменным, пока Колчак не решит окончательно разорвать все связи с Японской империей."

tram.996.t: "ДВСВ - сибирские монархисты"
tram.996.d: "Дальневосточный союз военных, или просто ДВСВ - возник как братство офицеров-монархистов, вступивших в ряды новой Сибирской армии после 1925 года. Его ядро - небольшой круг генералов, ветеранов и преданных людей, связанных общей верой, но их влияние растёт с каждым месяцем. В центре этого круга стоит Михаил Константинович Дитерихс, человек, для которого Гражданская война никогда по-настоящему не заканчивалась. Для него борьба никогда не шла о конституциях или собраниях, а о грехе и искуплении. Убийство Императорской семьи - правду о котором он сам помог раскрыть - остаётся, в его глазах, определяющим преступлением эпохи. Россия, как он считает, не просто пала - она была низвергнута, и только через веру, жертвенность и восстановление священной власти она сможет подняться вновь.\n\nПод его руководством ДВСВ приобрёл почти литургический характер. Дитерихс даже возродил идею Дружин Святого Креста. Хотя они малочисленны и полностью добровольны, эти отряды черпают силы из той же веры, что когда-то питала их предшественников: они сражаются не просто за землю или власть, а за защиту самой православной веры.\n\nПока что власти терпят ДВСВ. Адмирал Колчак, всегда прагматичный, видит в Дитерихсе одновременно и полезного союзника, и опасного мечтателя. В столь хрупком государстве, как Приамурье, убеждённость может быть столь же ценной, сколь и нестабильной. Однако доверие Колчака непрочно, он разрывается между слишком многими соперниками - среди них и атаман Семёнов, чьи амбиции и иностранная поддержка вызывают не меньше подозрений."

tram.995.t: "Атаман Семёнов и казаки"
tram.995.d: "Григорий Михайлович Семёнов не притворяется тем, кем не является. Он не государственный деятель старого порядка, не хранитель конституций, не слуга далёких столиц. Для многих в Приамурье он - необходимое зло. Для других - бандит в мундире. Однако атаман понимает землю, народы и неписаные правила, управляющие и тем и другим. Монголы, буряты, казаки, переселенцы, даже хунхузы - все в разное время оказывались втянутыми в его сеть.\n\nКогда в 1925 году произошёл путч, носивший имя Колчака, именно Семёнов и его ВКС (Высший казачий круг) возглавили восстание в Забайкалье, помогая отделить Дальний Восток от остальной России. Хотя в конечном итоге Верховным правителем стал адмирал Колчак, атаман Семёнов сохранил за собой контроль как над Забайкальем, так и над Ставкой, став начальником армии Колчака. И Верховному правителю пришлось с этим смириться, поскольку вместе с Семёновым приходят японская помощь и столь необходимый порядок. Семёнов открыто не бросает ему вызов, но и полностью не подчиняется. Вместо этого он правит независимо, прагматично и с оглядкой прежде всего на собственное положение.\n\nТень Японии нависает над его правлением. Их поддержка сделала возможным его восстание в 1925 году, их офицеры и агенты остаются постоянно присутствующими, и их интересы никогда не далеки от его собственных."
tram.997.a: "Пограничье принадлежит тем, кто способен его удержать."

tram.994.t: "НРА и Политцентр"
tram.994.d: "Когда большая часть восточной Сибири перешла под власть казаков и сторонников адмирала-диктатора в 1925 году, были и те, кто не оказался здесь в изгнании. Сибирские эсеры, державшие власть в регионе и избранные законным путём, оказались на распутье - либо бежать из родных краёв в Россию, переживавшую тяжёлый политический кризис на заре президентства Керенского, либо остаться здесь - и взяться за оружие.\n\nЧтобы противостоять военной диктатуре и беззаконию казаков, лидер сибирских эсеров Евгений Колосов учредил Политический центр - объединение последних настоящих революционных демократов Дальнего Востока. Его поддержал Николай Калашников, видный офицер и бригадир 53-го Сибирского стрелкового полка. Повстанцы вскоре стали Народно-революционной армией - крайне малочисленной, но довольно эффективной партизанской силой, периодически устраивающей налёты на Транссибирскую магистраль. Вскоре к ним присоединились, не по великому желанию, а от отчаяния, Борис Шумяцкий, бывший лидер Сибирского совета, Пётр Никифоров и даже воинствующие безбожники Емельяна Ярославского.\n\nОднако восстание провалилось. Пытаясь поднять восстание против Сибирской армии, Калашников дезертировал и скрылся в сибирской тайге. Удивительно, но каким-то образом партизанское движение в Забайкалье смогло выжить до наших дней. Возможно, этому способствовали рабские условия жизни рабочих в Чите и Хабаровске и возвращение помещичьего землевладения в сельскохозяйственных районах, но сейчас НРА представляет собой лоскутное одеяло из партизан, разбросанных по всему Забайкалью, агитирующих за возвращение к социализму и, вероятно, всё это время спонсируемых режимом Керенского. Ведущее подпольную борьбу и организующее диверсии, это движение должно быть уничтожено."

tram.993.t: "Непокорные инородцы"
tram.993.d: "Инородцы, буквально означающее «другого происхождения», - это особая категория населения по этническому признаку, пользующаяся особым положением по закону. Отношения между нерусским населением нашей страны и правительством, мягко говоря, напряжённые. После Омского переворота в 1918 году национальные автономии были упразднены и восстановлены лишь в значительно урезанном виде по настоянию либеральных и консервативных представителей в Учредительном собрании. Хотя они и получили автономию, она была не в той форме, которую они желали.\n\nПри администрации адмирала Колчака автономия якутов и бурят на Дальнем Востоке снова была значительно ограничена. Бурят-Монгольский Бурнацком и Якутское областное народное управление продолжают существовать, но явно выступают против власти центрального правительства.\n\nВ настоящее время ситуация в этих районах довольно напряжённая, периодически происходят различные акты саботажа и беспорядки. Тем не менее, мы должны решить эту проблему."
tram.993.a: "Либо дать им свободу, либо успокоить навеки."

tram.992.t: "Сибирская армия"
tram.992.d: "То, что известно как Сибирская армия, представляет собой достаточно значительную силу, сформировавшуюся за последние десять лет. Под покровительством мятежных казаков Семёнова и каппелевцев, поддержавших Колчака, в 1925 году почти весь Дальний Восток был стремительно захвачен и передан под контроль армии. В Чите была сформирована Ставка Верховного главнокомандующего, возглавленная Верховным правителем адмиралом Колчаком. Одним из главных выгодоприобретателей восстания стал атаман Семёнов, назначенный заместителем. Однако спустя десять лет адмирал уже обзавёлся куда более верными сторонниками, такими как генерал Пепеляев, нежели атаман Семёнов, устроивший для казаков в Забайкалье настоящую вольницу.\n\nТем не менее Ставка всё ещё остаётся разделённой между различными силами влияния, включая достаточно новую силу, возникшую в противовес как Семёнову, так и Пепеляеву, - Дальневосточный союз военных генерала Дитерихса, призывающий отказаться от якобы провалившегося «непредрешенчества», которого всё ещё придерживается Верховный правитель, и открыто поднять монархические знамёна."
tram.992.a: "Свободная Русь вновь восстанет, пылая нашей верой!"
tram.992.b: "Я хочу узнать больше о генерале Дитерихсе."
tram.992.c: "Я хочу узнать больше об атамане Семёнове."

tram.991.t: "Две Ставки"
tram.991.d: "Формальная структура Сибирской Ставки не допускает двусмысленности. Вся власть исходит от должности главнокомандующего, атамана Григория Семёнова, чьё положение признано указом Верховного правителя. Приказы издаются от его имени, а командование, по крайней мере в самом начале, оставалось в основном единым. Со временем, однако, начала складываться иная система. Оперативное планирование, штабная координация и разработка долгосрочных стратегических соображений всё чаще выходят за пределы личного командования Семёнова. Другие офицеры, связанные с ДВСВ, проявили себя более дисциплинированными, методичными и, что важнее всего, предсказуемыми в своей службе. Так или иначе, все ветераны первой Гражданской войны хорошо помнят Семёнова: стремительного, умного, с характерной казачьей сметкой, превосходного боевого офицера, но с заметной склонностью к интригам и неразборчивости в средствах достижения своих целей. Не остаётся сомнений и в том, что он явно пользуется японской поддержкой.\n\nЭтот раскол не остался незамеченным. Среди казачьего командования зреет тихое недовольство тем, что воспринимается как посягательство со стороны «штабных людей». Среди их противников существует не меньшее опасение, что государство не может бесконечно полагаться на личные связи и иррегулярные привычки, определяющие систему Семёнова. Подобная двойственность не несёт немедленной угрозы, однако, поскольку правление Верховного правителя уже перешагнуло десятилетний рубеж, вопрос о том, должна ли Ставка и дальше медленно превращаться в два параллельных штаба, нельзя откладывать бесконечно."
tram.991.a: "Командование должно оставаться чётко определённым."
tram.991.b: "Мы должны поощрять штабную инициативу."

tram.1.t: "Приамурье отделяется!"
tram.1.d: "Приамурская республика была сильно оскорблена нашими попытками регулировать её внутренние дела и разрывает все политические связи с нами!"
tram.1.a: "Уничтожить их!"
tram.1.b: "Нам остаётся только отпустить их..."

tram.2.t: "Михаил Дитерихс уходит из жизни"
tram.2.d: "Флаги приспущены, страна в трауре: Господь призвал на небеса Своего Воеводу Михаила Константиновича Дитерихса. В Москве готовятся пышные государственные похороны нашего возлюбленного Благочестивого Генерала. Дитерихс был исполином среди людей, прошедшим две мировые войны и две гражданские, ни разу не дрогнув и не отступив от своего долга.\n\nЕго тело ещё не остыло, как за кулисами уже начались интриги. Дитерихс был диктатором, пусть даже формально числился слугой царя Никиты. Чёткого преемника нет, и хотя Никита I, вероятно, попытается укрепить свои позиции, у него вряд ли есть необходимые связи, чтобы править самостоятельно.\n\nПервым действовать начал Сергей Соколов, председатель РОНД - единственной легальной политической организации в стране. Соколов, будучи лидером подпольного «Братства Русской Правды», - человек амбициозный; в последние дни Дитерихса он поднимался по служебной лестнице, а теперь пустил в ход все свои связи и ресурсы. Сторонники БРП в Земской Думе уже рекомендовали назначить Соколова Печатником - фактическим премьер-министром и ближайшим советником монарха.\n\nЭтой кампании в Земской Думе противостоят люди из ДВСВ, верные Дитерихсу, в первую очередь Григорий Вержбицкий и Викторин Молчанов. Они выражают опасения, что Соколов поведёт режим по ещё более радикальному пути, тогда как, по их утверждениям, Дитерихс всегда намеревался в конечном счёте смягчить и нормализовать режим, умерив его самые угнетательские стороны. В этой борьбе за власть победитель может быть только один."
tram.2.a: "Человек смертен..."
tram.2.b: "...но святая Русь вечна."

tram.3.d: "Сегодня ушёл из жизни лидер ДВСВ Михаил Дитерихс. Мы всегда будем помнить его как героя России. Он участвовал во многих войнах, но войну со смертью выиграть не смог. Артиллерия в бухте Владивостока дала залп в его честь. После его смерти новым лидером ДВСВ стал Владимир Каппель."
tram.3.a: "Memento Mori"

tram.4.d: "Сегодня от старости скончался русский генерал Михаил Дитерихс, известный как первый глава Чехословацкого корпуса, радикальный монархист и лидер ДВСВ - Дальневосточного союза военных. Последние годы он провёл в попытках восстановить российскую монархию и будет особенно памятен верующим, духовенству и тем остаткам старых каппелевцев, что ещё сохранились в Сибирской армии."

tram.6.t: "Паника в Сибири!"
tram.6.d: "Российское правительство оказалось неспособным обеспечить безопасность своих сибирских территорий. Нам стало известно, что многие местные лидеры хотят отделиться и присоединиться к Приамурью! Возможны международные осложнения, но второго такого шанса может и не быть!"
tram.6.a: "Заявить права на земли до озера Байкал!"
tram.6.b: "Спросить разрешения у Японской империи."
tram.6.c: "Это рискованно..."

tram.7.t: "Амбиции Приамурья в Сибири"
tram.7.d: "Руководство Приамурья рассматривает растущую нестабильность в России как прекрасную возможность наконец взять под контроль Восточную Сибирь. Официальный дипломатический представитель Приамурья прибыл к нам с просьбой разрешить применить силу против России, если она будет сопротивляться их законным требованиям в отношении Сибири."
tram.7.a: "Дать зелёный свет."
tram.7.b: "Россия останется нетронутой!"

tram.8.t: "Япония принимает наши притязания на Сибирь"
tram.8.d: "Японское правительство приняло наше предложение и дало зелёный свет на захват российского Дальнего Востока у незаконного российского режима."
tram.8.a: "Отлично!"

tram.9.t: "Япония отклоняет наши притязания на Сибирь"
tram.9.d: "Японское правительство отклонило наше предложение."
tram.9.a: "Проклятье! Может, мы ещё не готовы."
tram.9.b: "С меня хватит! Объявить независимость!"

tram.10.t: "Сибирские земства заявляют о своей верности [ROOT.GetLeader]!"
tram.10.d: "[RUS.GetAdjective]ое правительство оказалось неспособным обеспечить безопасность своих сибирских территорий. Нам стало известно, что многие местные лидеры хотят отделиться и присоединиться к Приамурью! Возможны международные осложнения, но второго такого шанса может и не быть!"
tram.10.a: "Сибирская армия выступает для занятия ключевых городов..."

tram.21.t: "Приамурье вторгается на Дальний Восток!"
tram.21.d: "Приамурье воспользовалось беспорядками в Сибири, чтобы установить свой контроль над регионом. Хотя это большое посягательство на наш суверенитет, мы сейчас очень слабы и, возможно, не сможем выиграть войну за возврат наших земель, особенно учитывая, что война с Приамурьем может означать войну и с Японией."
tram.21.a: "Бесполезно воевать за ледяную пустошь."
tram.21.b: "А ну-ка, попробуйте отобрать - кто вообще поверит в эту уловку?"
tram.21.c: "Что!? Сибирь всегда принадлежала России!"

tram.22.t: "Приамурье вторгается в Иркутск"
tram.22.d: "Приамурье воспользовалось беспорядками в Сибири, чтобы установить свой контроль над Иркутском. Хотя это большое посягательство на наш суверенитет, мы сейчас очень слабы на Дальнем Востоке и не можем надеяться выиграть войну за возврат наших земель, особенно учитывая, что мы едва контролируем земли к востоку от Урала."
tram.22.a: "Проклятье!"

tram.23.t: "Россия отказывается вмешиваться"
tram.23.d: "Так называемое «Российское правительство», судя по всему, приняло свершившийся факт в Сибири и не предприняло никаких серьёзных военных действий против наших освободительных усилий."
tram.23.a: "Мудрый выбор."

tram.24.t: "Россия отвечает силой!"
tram.24.d: "Так называемое «Российское правительство» не только отказалось уступить наши законные земли. Более того, они объявили нам войну и намерены отбить Владивосток."
tram.24.a: "Значит, война!"
tram.24.b: "Отступить."

tram.25.t: "Красные чистки на российском Дальнем Востоке"
tram.25.d: "Недавно установленный социалистический режим в Западной России показал, что он слишком слаб, чтобы контролировать районы, удалённые от его городского центра. Наши войска успешно захватили у них российский Дальний Восток, искоренив то небольшое влияние, которое они имели в регионе."
tram.25.a: "Мы не потерпим леваков на нашей законной территории."

tram.26.t: "Россия отказывается уступить Дальний Восток"
tram.26.d: "Похоже, что, хотя нелегитимный российский режим признаёт наши усилия по захвату контроля над Сибирью, они отказались вывести свои силы и позволить региону перейти в наши руки. Похоже, теперь мы должны принять решение, продолжать ли вторжение и рисковать открытой войной."
tram.26.a: "Война решит наши споры!"
tram.26.b: "Мы не готовы к конфликту."

tram.27.t: "Лёд, который зовёт"
tram.27.d: "Ещё до того, как стать Верховным правителем, Александр Колчак был известен в военно-морских и научных кругах как человек Севера. В 1900 году на борту «Зари» он присоединился к русской полярной экспедиции барона Эдуарда фон Толля в качестве гидролога, магнетолога и картографа, отвечая за измерения, съёмку и описание того, что карты империи лишь предполагали. Экспедиция была организована для поисков легендарной Земли Санникова и картографирования малоизученных вод к северу от Сибири; в последующие годы она стала одним из определяющих эпизодов ранней карьеры Колчака.\n\nРабота была тяжёлой, требующей точности службой: маршрутные съёмки под ветром и мокрым снегом, астрономические наблюдения, измерения льда, течений и береговых линий, терпеливый труд первооткрывателя. Когда барон Толль и несколько спутников исчезли, покинув корабль экспедиции в поисках острова Беннетта, Колчак оказался в числе тех, кто взял на себя бремя последующих поисков. Он организовал и возглавил спасательные работы, и хотя пропавших так и не нашли, это испытание закрепило за ним репутацию по-особенному русскую: как человека расчёта и одновременно человека, который не бросает своих. Арктика не вернула то, что забрала, но даровала ему вторую идентичность - отдельную от флота и политики.\n\nРезультаты экспедиции дали серьёзную научную ценность и данные, обработка которых потребовала потом многих лет, и Колчак продолжал работать, публикуя труды об арктических льдах и участвуя в дальнейших гидрографических экспедициях. За этот труд он был удостоен высоких наград, включая Константиновскую медаль Императорского Русского географического общества, и один из островов Карского моря позже получил его имя.\n\nБыли и меньшие, более человеческие подробности: в своей экспедиции Колчак называл географические объекты в честь дорогих ему людей, включая остров и мыс, связанные с его невестой. Такие поступки принадлежали миру, в котором он жил до того, как политика поглотила его: миру, где будущее казалось достаточно большим, чтобы вместить открытия. Теперь, во Владивостоке, государство бедно, железные дороги перенапряжены, флот уменьшен, а Дальний Восток зависит от многих договорённостей. Тем не менее, на столе у адмирала лежит предложение - осторожное и неполное - о возобновлении северных работ. Не экспедиция - нет ни кораблей, ни людей, ни достаточных денег для этого - но, возможно, исследовательская комиссия. Возможно, Север снова нашёл его."
tram.27.a: "Подготовьте исследования. Россия снова будет нуждаться в Севере."
tram.27.b: "Мы не можем позволить себе мечты."

tram.28.t: "Анна Тимирёва"
tram.28.d: "Победа белых не сделала частную жизнь проще. В годы после Гражданской войны положение Колчака как Верховного правителя, а затем как Верховного адмирала Российского флота поместило его в центр государства, всё ещё находившегося в стадии формирования. Его законная жена, Софья Фёдоровна, вернулась в Россию в первые годы республики, как и многие, кто временно искал убежища за границей. Их брак, уже ослабленный годами войны и разлуки, расторгнут не был, но фактически не существовал. Софья Фёдоровна поселилась в тихой жизни вдали от служебных обязанностей мужа. Их сын, Ростислав, достигал совершеннолетия в России, которую помог обеспечить его отец, желая получить военно-техническое образование в соответствии с семейными традициями. Он был, по всем отзывам, многообещающим и дисциплинированным молодым человеком, хотя его отношения с отцом оставались формальными и формировались скорее ожиданиями.\n\nПоложение Анны Тимирёвой оказалось более неопределённым. Во время войны она была неразлучна с адмиралом, следуя за ним через потрясения командования и отступлений. Однако после победы её присутствие становилось всё труднее согласовать с восстановленными нормами республики. Некоторое время она оставалась в личном кругу Колчака, и её роль понималась близкими к адмиралу людьми. Хотя новая Россия не была столь нетерпима к публичным фигурам и к различным возникающим нормам семейной жизни в целом.\n\nЧерез несколько лет после победы сложилось неформальное расставание. Тимирёва покинула Петроград, а позже уединилась от московского общества, живя тихо. Связь между ней и адмиралом никогда не прерывалась полностью и сохранялась, сдержанно, в переписке и в памяти об общем прошлом, которое нелегко было вписать в настоящее. Неудавшийся путч 1925 года привёл к решительному разрыву. Бегство Колчака на Восток было стремительным, и не все, кто был частью его жизни, могли последовать за ним. Софья Фёдоровна осталась в России, вдали от политических интриг и благодаря остаточному уважению к её имени. Ростислав, уже взрослый, не мог остаться - его светлое будущее, предсказанное ему из-за его имени, было перечёркнуто по той же причине, и после отъезда из России он был вынужден искать себя в более отдалённых местах, например в Алжире. Судьба Тимирёвой была менее определённой: она ещё больше ушла из общественной жизни. По необходимости или по собственному выбору, она не сопровождала адмирала в его очередном изгнании.\n\nТак жизни, некогда связанные вместе, были разделены обстоятельствами. Где-то на западе, куда Колчак уже не может войти, в безвестности живёт женщина, чьё место в его жизни никогда не было юридически признано, но никогда и не стёрто."
tram.28.a: "Пусть остаётся как есть."

tram.29.t: "Дисциплина поражения"
tram.29.d: "В годы после победы те, кто служил под командованием адмирала Колчака, часто говорили о его руководстве на языке дисциплины, а не гения. Это было не совсем неверно, хотя и неполно. Он не был тем командующим, который ослепляет импровизацией или театральной отвагой. Его сила заключалась в точности, в выносливости, в отказе относиться к трудностям как к оправданию беспорядка.\n\nМировая война научила Колчака суровой привычке ума. Россия могла выигрывать сражения и всё равно проигрывать больший мир; она могла вынести триумф и всё равно унаследовать катастрофу. Для него поражение никогда не было просто военным событием. Это было состояние, которое нужно переносить и преодолевать без жалости к себе. Это была та же дисциплина, которая пронесла его через Арктику, через балтийские мины, через крушение старых институтов и через странную честь быть назначенным Верховным правителем, когда он меньше всего этого желал.\n\nВ первые годы республики, пока другие говорили о реставрации, реформах и компромиссах, Колчак оставался примечательно последователен в более старом языке долга. Он не представлял жертву как самоцельную добродетель. Он относился к ней как к необходимости, требуемой Россией и принимаемой без жалоб. Именно это качество - суровое, почти аскетичное - сохраняло его авторитет, когда другие вокруг него уставали, разделялись или впадали в сентиментальность.\n\nТеперь, во Владивостоке, эта дисциплина стала одной из немногих вещей в адмирале, которые всё ещё выглядят полностью нетронутыми. Окружающее его государство ослаблено иностранным влиянием, обременено коммерческими интересами, находится под наблюдением японских офицеров, оспаривается партизанами НРА в лесах и никогда не бывает полностью защищено от более страстных монархистов из кругов Каппеля и Дитерихса. Тем не менее Колчак не управляет с помощью иллюзий. Он выиграл Россию не тем, что был самым полным надежды человеком. Он выиграл её и сохранил в ней своё место, будучи одним из немногих, кто был готов нести то, что сделала необходимым сама победа."
tram.29.a: "Пусть дисциплина остаётся первой обязанностью государства."

tram.30.t: "Старый кодекс"
tram.30.d: "Адмирал Колчак никогда полностью не принадлежал той политической эпохе, в которой живёт. Он остаётся - по темпераменту не меньше, чем по привычке - человеком, сформированным поздним Императорским флотом: формален в обращении, точен в обязательствах и склонен судить о поведении по старым меркам. Для одних этот кодекс - последний цивилизованный остаток более благородной России. Для других - наследие, слишком жёсткое для мира, последовавшего за войной. Дальний Восток управляется не одним лишь благородным поведением - он держится на контрактах, на шатком соглашении меркуловых, на влиянии японских представителей и т.д. Колчак не заблуждается насчёт таких реалий. Но и не может совсем оставить допущения собственного воспитания. Когда он встречается с подчинённым, он ожидает учтивости офицера, и это не просто старомодность.\n\nВопрос в том, может ли такой кодекс всё ещё управлять государством вроде Приамурья. Правителем могут восхищаться за сдержанность, но сдержанность не всегда побеждает интриги, и честь сама по себе не может дать ответа ни Японии, ни мятежу."
tram.30.a: "Сохраняй старые стандарты, чего бы ни требовала эпоха."
tram.30.b: "Государство должно жить тем, что работает, а не тем, что льстит душе."

tram.31.t: "Репутация, заслуженная дважды"
tram.31.d: "Было время, когда имя Колчака не нуждалось в пояснениях. В последние годы Мировой войны, в Балтийской кампании, а затем и во время Гражданской войны, оно несло на себе груз достижений, командования и национальных ожиданий. Он был офицером, умевшим организовать флот, Верховным правителем, который помог объединить белые армии. В те годы его репутация строилась не пропагандой, а людьми, которые понимали, что Россия выбрала его, потому что немногие другие были способны нести это бремя.\n\nОднако в Приамурье легитимность приходится подтверждать заново - меньшими и не столь славными способами. Молодые офицеры, собирающиеся во Владивостоке, не сражались рядом с адмиралом, как и купцы. Хотя репутация Колчака поистине заслужена дважды: один раз на войне, когда Россия видела в нём завоевателя и организатора; и второй раз во Владивостоке, где сам факт того, что он остаётся прямым, компетентным и некоррумпированным среди компромиссов, доказывает его власть, всё равно существует потребность в дополнительных способах продвижения заслуг Верховного правителя."
tram.31.a: "Восстанови имя адмирала как символ новой великой России."
tram.31.b: "Пусть его власть основывается на его заслугах, а не на зрелищах."

tram.42.t: "Части Сибири переходят к [TRM.GetLeader]"
tram.42.d: "Наш союзник, [TRM.GetNameDef], установил контроль над несколькими частями Сибири после очередной революции в России. Силы Сибирской армии уже движутся к занятию ключевых городов и посёлков этих обширных земель. Пока [TRM.GetNameDef] растёт, растут и амбиции [TRM.GetLeader], как полагает наше командование. Возможно, он становится слишком могущественным, и его нужно сдерживать, пока не стало поздно."
tram.42.a: "Хорошо иметь сильные клиентские государства!"
tram.42.b: "[TRM.GetLeader] слишком жаден для собственного блага. Может, попробуем заменить его?"

tram.47.t: "Япония требует базы"
tram.47.d: "Японцы поздравили нас с захватом Сибири, но представитель Микадо заявляет, что нам следует разрешить Японии управлять Камчаткой и позволить им создать военно-морскую базу в Охотском море."
tram.47.a: "Да, нам всё ещё нужна японская защита."
tram.47.b: "Пора сбросить японское иго!"

tram.48.t: "Япония планирует переворот против [TRM.GetLeader]!"
tram.48.d: "Японцы считают, что [TRM.GetLeader] изжил свою полезность, и обратились к элите Приамурья с планом поддержать государственный переворот, чтобы заменить его более сговорчивым советом деловых и военных лидеров."
tram.48.a: "Да, [TRM.GetLeader] должен быть устранён!"
tram.48.b: "За кого они себя принимают?"

tram.49.t: "Владивосток подчиняется"
tram.49.d: "[TRM.GetLeader] решил подчиниться и преклонить колени перед нами. Теперь должность владивостокского губернатора пустует, и мы должны найти замену. Логичным выбором будут наши старые союзники в регионе - братья Меркуловы, которые готовы укрепить свою купеческую власть над областью. Если мы им не доверяем, можно учредить колониальную администрацию с генералом Юи Мицуэ, который некогда командовал Японским экспедиционным корпусом во время Гражданской войны в России."
tram.49.a: "Генерал Мицуэ, у вас новый приказ."
tram.49.b: "Смиренные слуги вроде Семёнова всегда желанны."
tram.49.c: "Лояльное демократическое правительство устроит."

tram.50.t: "Новый порядок в Приамурье"
tram.50.d: "Японцы решили, что отныне [TRM.GetLeader] должен вести нас. У нас нет выбора, кроме как подчиниться их воле."
tram.50.a: "Теперь мы зависим ещё сильнее!"

tram.51.t: "Союз Мушкетёров Его Высочества Князя Никиты Александровича"
tram.51.d: "«Союз Мушкетёров» был основан в 1924 году в Харбине князем Владимиром Иннокентьевичем Гантимуровым. Гантимуров, уроженец Забайкалья и выходец из семьи тунгусских князей, служил под началом генерала Молчанова в 1920 году на заре Гражданской войны. Гантимуров, сын офицера пограничной стражи, оказался в Харбине в раннем возрасте. А в 1924 году ему было всего 18 лет. Свой «Союз Мушкетёров» Владимир Гантимуров, романтик и мечтатель, решил создать после просмотра фильма «Три мушкетёра». Первый девиз организации - «Один за всех, и все за одного» - также был взят из фильма о трёх мушкетёрах. Члены Союза Мушкетёров придумали себе отличительную форму: чёрные клёши, носимые навыпуск, и чёрные рубашки «апаш» со шнуровкой на воротнике и манжетах. Костюм дополнялся чёрными поясами с кистями на талии и чёрным картузом. Впоследствии каждая ветвь получила определённый цвет, и на форме использовались повязки соответствующего цвета.\n\nИзначально организация при своём создании не преследовала никаких политических целей. Задача была простой - бить детей харбинских большевиков, оказавшихся в Красном Харбине после поражения красных на Дальнем Востоке. В поисках идеологической поддержки руководство Союза Мушкетёров обратилось к великому князю Никите Романову с предложением взять Союз под своё покровительство. После его положительного ответа 20 декабря 1929 года название организации было изменено, и отныне она стала именоваться «Союз Мушкетёров Его Высочества Князя Никиты Александровича». У Союза появились и политические цели, главными из которых были свержение эсеровского режима в России и восстановление монархии. В 1931–1932 годах Союзом совместно с Дальневосточным союзом военных были открыты унтер-офицерские курсы, и вскоре Гантимуров оказался в Николаевске, где вступил в ряды ДВСВ."
tram.51.a: "В молодости наша надежда."
tram.51.b: "Мы что - клоуны?!"

tram.52.t: "Королевские мушкетёры"
tram.52.d: "С коронацией нового Царя и возвращением монархии в России наконец, пусть пока только в одной её части, деятельность Союза мушкетёров значительно активизировалась. Несмотря на то, что покровитель организации Никита всё это время не особенно интересовался делами мушкетёров, он увидел перед собой хорошо дисциплинированных и организованных бойцов, давно вышедших за рамки детских игр.\n\nЛидер мушкетёров князь Гантимуров обратился к Государю Императору с просьбой учесть заслуги мушкетёров и предоставить ему место в Совете министров в качестве советника Его Величества.\n\nХотя Никита Алексеевич понимал, что лучше окружать себя определённо лояльными подданными, возможно, в той ситуации, в которой он оказался, лучше было положиться на более опытных бойцов РОВС, фактически прошедших войну."
tram.52.a: "Продвинуть наших лояльных мушкетёров в правительство!"
tram.52.b: "Никита Александрович предпочитает, чтобы руководили более опытные офицеры."

tram.53.t: "Верхнеудинское кооперативное товарищество «Экономия»"
tram.53.d: "В 1913 году по инициативе рабочего Верхнеудинского железнодорожного депо Г. И. Камынина было организовано всесословное кооперативное общество «Экономия», ставшее одним из крупнейших кооперативов Сибири и Забайкалья.\n\nВ конце 1916 года кооператив открыл хлебопекарню, а позже приобрёл крупорушку, кожевенный и хромовый заводы, мыловаренный завод, лесопилку, лесной склад в селе Ганзурино, рыбоконсервный завод в Посольском, молочную ферму и свиноводческую ферму в Верхнеудинске. В 1916 году кооператив открыл собственное колбасное производство с целью «улучшения качества и снижения цены». Кооперативная колбаса поступила в продажу в феврале 1917 года, что сразу снизило цену в частных лавках на 20 копеек за фунт, и вскоре частные производители также были вынуждены улучшить своё качество вслед за кооперативом.\n\nОднако уже в конце 1918 года в Верхнеудинске был создан подпольный комитет НРА. И с тех пор считается, что именно благодаря ему НРА координировала свои подрывные действия в Забайкалье. Так продолжаться не может, и либо этот кооператив должен быть распущен, либо он должен быть реорганизован в потребительское общество и поставлен под прямой государственный контроль."
tram.53.a: "Распустить товарищество."
tram.53.b: "Реорганизовать и поставить под государственный контроль."

tram.54.t: "Письмо князю"
tram.54.d: "...Нам нужно Ваше принципиальное согласие, чтобы Сибирская армия, уже собранная на своей территории, имела право сказать: «С нами внук императора Александра III; мы присягнули исторической, народной, религиозной и национальной идее Великой Самодержавной России; теперь пришло время создать в последней борьбе то идеологическое монолитное ядро, которое должно привлечь вокруг себя массы общерусских народов, разложенных социализмом и сбитых со своего исторического пути, разделённых на бесчисленные секты, и вернуть их под единое Святое знамя Веры, Царя и Отечества...»"
tram.54.a: "И князь с готовностью согласился."

tram.55.t: "Заседание ГЭС 1936 года"
tram.55.d: "В последние годы наша страна сталкивается с вызовами, и нынешняя глобальная экономическая нестабильность оказывает значительное влияние на нашу экономику. Стоимость сибирского рубля упала, и в то же время мы сильно зависим от японских инвестиций и нуждаемся в развитии нашей военной промышленности. Это ставит администрацию Колчака в положение большой ответственности, поскольку они должны определить направление нашего экономического развития в ближайшие годы. ГЭС - Государственное экономическое собрание - представительный орган, разрабатывающий чрезвычайные меры в области финансов, снабжения армии, торгового и промышленного аппарата, собрался впервые за два года, чтобы выбрать новое направление дальневосточной экономики и назначить Председателя Собрания."
tram.55.a: "Нам нужно сосредоточиться на укреплении сибирского рубля."
tram.55.b: "Назначить Меркулова - нам нужна поддержка бизнеса и иностранных инвесторов."
tram.55.c: "Дальний Восток остро нуждается в наращивании военной мощи."

tram.56.t: "Борьба с дальневосточным хаосом"
tram.56.d: ""
tram.56.a: "Только твёрдая рука покончит с хаосом и приведёт нас к победе."

tram.57.t: "Антиколчаковская оппозиция объединяется"
tram.57.d: ""
tram.57.a: "Они формируют Единый фронт?"

tram.58.t: "Сибирская дума"
tram.58.d: ""
tram.58.a: "Дума поможет нам указать путь."
tram.58.b: "Возможно, Думу лучше восстановить после того, как мы освободим остальную Россию."

tram.59.t: "Старый казак"
tram.59.d: "Григорий Михайлович Семёнов - атаман Забайкальского казачьего войска. Правительство Колчака терпело его только благодаря его высоким покровителям из Токио, потому что он был главным проводником японского влияния и благодаря ему Япония поставляла нам различные необходимые вещи, будь то продовольствие или различные виды оружия. Хотя эти поставки были полезны, они делали Приамурье всё более зависимым от Японии. Но теперь настало время нам разорвать все связи с японскими империалистами, которые только хотят нажиться на ресурсах нашей страны, и чтобы скрепить этот «договор» о разрыве отношений, мы подпишем его кровью атамана и его приспешников."
tram.59.a: "Разобраться с японской пешкой!"
tram.59.b: "Мы не можем так рисковать"

tram.60.t: "НРА - друзья или враги?"
tram.60.d: "Более десяти лет красные партизаны, объединённые под знаменем Народно-революционной армии, занимались различной подрывной деятельностью против правительства Колчака в Приамурье. Но Колчака теперь нет. На его месте теперь Пепеляев. И теперь перед ним стоит вопрос - что делать с НРА? Генералы говорят, что НРА - красная шваль, и с ней нужно поступить соответственно, и наконец добить этот последний осколок Красного Октября. С другой стороны, есть голоса, утверждающие, что НРА состоит не только из большевиков, но и из эсеров, и, учитывая взгляды самого Пепеляева, он мог бы найти общий язык с той частью НРА и разгромить остальных большевиков. Выслушав доводы «за» и «против» обеих сторон, Анатолий Пепеляев решил, что..."
tram.60.a: "... «Нужно раз и навсегда разгромить НРА!»"
tram.60.a2: "... «НРА несущественна и не имеет влияния.»"
tram.60.b: "... «Мы должны найти компромисс с эсерами из НРА.»"

tram.61.t: "Вопрос о монархистах"
tram.61.d: "Дальневосточный отдел РОВС, в отличие от своего собственного отдела, действующего в России, всегда был монархической организацией, и этого никогда не скрывали. Теперь мы должны решить, что делать с монархистами Дитерихса. И снова мнения здесь разделились: одни говорят, что нужно привлечь монархистов на свою сторону, и для этого нужно пообещать им восстановление монархии, потому что это их главная цель. Другие говорят, что монархисты - это главный рассадник реакции и, играя на чувствах Пепеляева, утверждают, что они за восстановление старого крепостнического помещичьего строя, и поэтому мы не должны с ними сотрудничать, а подавлять их всеми возможными средствами. В конце долгого совещания Пепеляев решил, что..."
tram.61.a: "«В это время любой человек, борющийся за величие России, - наш союзник.»"
tram.61.b: "«Именно монархия ввергла нашу страну в кровавую гражданскую войну!»"

tram.62.t: "Нейтрализовать чехов"
tram.62.d: "Чехословацкий легион формально является подчинённой Колчаку воинской частью, но на деле он более чем независим, преследуя свои собственные интересы, важнейшим из которых является освобождение Богемии и Словакии от гнёта Австро-Венгерской империи. Но их независимость - наша главная угроза, ибо они по сути были хозяевами Транссибирской магистрали, курсируя взад и вперёд и останавливая вагоны с солдатами и припасами. Мы не можем позволить такой военной силе свободно находиться на наших территориях, потому что они могут ударить нам в спину в любой момент."
tram.62.a: "Они не должны быть для нас угрозой."

tram.63.t: "Вечерний разговор"
tram.63.d: "'...Анатолий, брат, послушай, мы не можем просто национализировать всю крупную промышленность. Многие промышленники тогда отвернутся от нашего правительства, и я не думаю, что твои новые наместники смогут управлять их предприятиями лучше, чем они.'\n\n 'Виктор, я всё понимаю, но сейчас важный момент, эти самые промышленники заботятся только о своей прибыли, как те же Меркуловы, им нет дела до народа Христова, они заботятся только о своём доходе и деньгах, им выгоднее без боя продать нашу родину Токио или Петрограду, чем воевать за нашу малую и большую родину. Поэтому мы должны национализировать её, иначе нашему правительству конец.'\n\n 'Этот спор ни к чему не приведёт, поэтому я предлагаю компромисс, чтобы не отпугнуть всех крупных промышленников, тогда давай национализируем только военную промышленность? Пойми, нам нужна их помощь, так что давай остановимся на этом варианте, хорошо?'\n\nПосле пары минут размышлений Анатолий сказал:"
tram.63.a: "'Давай национализируем все активы крупных капиталистов.'"
tram.63.b: "'Всё же я готов пойти на этот компромисс.'"

tram.64.t: "Ошибка Колчака"
tram.64.d: ""На встречах с Колчаком я неоднократно поднимал вопрос о передаче земли тем, кто её обрабатывает. Я говорил, что это поднимет его авторитет в глазах простых людей. Но он не слушал меня, доверяя больше болтунам в правительстве. И вот где он теперь - в могиле. Именно отсутствие народной поддержки свело его в могилу, потому что во время переворота за адмиралом никто не пошёл.""
tram.64.a: "Упокой Господи его душу...""

tram.65.t: "Ещё один день, ещё один спор"
tram.65.d: ""Ещё один день, ещё один спор. На этот раз мы с братом обсуждали, что делать с землёй. Я утверждал, что вся земля должна быть передана людям, которые её обрабатывают. Виктор, с другой стороны, настаивал, что полное обобществление земли навредит малому бизнесу. В конце долгого спора он предложил мне компромисс: не обобществлять всю землю, а только её часть, создать и издать так называемый «Закон о земельных квотах». Я согласился с ним на этот компромисс, но при условии, что он сам полностью подготовит этот законопроект.""
tram.65.a: "Хотя бы компромисс."

tram.66.t: "Прояснение"
tram.66.d: ""...Мне сегодня лучше - немного легче. Мысли начинают приходить в порядок. Что значит вера. Господи, какая милость и утешение людям. Я верю в Промысл Божий. По Его Божественному Промыслу нужно мне испить эту чашу душевных страданий. Много, много сомнений вызвало наше нынешнее положение. Тяжёлый поход впереди, плохая одежда, безумно плохое питание, малочисленность отряда. Я и сам временами впадал в уныние. Видимо, на то была воля Божья, чтобы мы шли, так да будет над нами Его святая воля...""
tram.66.a: "...И станет легче, ни уныния, ни бодрости.""

tram.67.t: "Федерация, но какого типа?"
tram.67.d: "Наше правительство решило, что наиболее желательной формой территориального устройства для нашего государства является федерация. Но здесь мы снова сталкиваемся с вопросом - какая федерация? Областнические элементы настаивают, что местные власти должны иметь такие же широкие полномочия, как штаты в Соединённых Штатах. Им противостоят кадетские элементы, точку зрения которых выражает брат генерала Пепеляева Виктор, который также признаёт важность федеративного устройства и местных властей, но считает, что если центр издал закон, местные власти должны ему подчиняться.\nВзвесив все за и против, Пепеляев решил, что..."
tram.67.a: ""Внедрить план федерализации регионалистов!""
tram.67.b: ""Я уверен, Виктор меня не подведёт.""

tram.68.t: "Мужицкий генерал"
tram.68.d: ""Меня неоднократно за глаза называли мужицким генералом из-за моего, по их мнению, слишком мягкого отношения к солдатам, из-за того, что я не позволял им грабить сёла и города, из-за настоящих братских отношений в подконтрольных мне частях, из-за истинной христианской нравственности в них. Но на ком сейчас Божья благодать? Если меня называют «мужицким генералом», то пусть я не отказываюсь от этого прозвища, а лучше приму его, чтобы показать свою истинно народную сущность.""
tram.68.a: "За народ..."

tram.69.t: "Да будет страна свободна"
tram.69.d: ""...Одно во мне крепко - чувство веры, это действительно помощь и надежда. Не оставь меня, Господи, томящегося в скорби, сомневающегося, слабого, малодушного, если Ты послал меня сюда на это служение, дай силы, Боже, помоги мне, дай возможность довершить дело с меньшей кровью - спаси мою семью - больше мне ничего не нужно. Спаси родину, дай ей мир, прекрати эту войну, восстанови братство православной веры, устрой так, Господи, чтобы в будущем году все сердца примирившихся прославили Рождество Твоё в русских храмах...""
tram.69.a: ""Слава в вышних Богу, и на земле мир, в человеках благоволение.""

tram.70.t: "Отставка Пепеляева?"
tram.70.d: "С ужасным убийством Верховного правителя Виктор Пепеляев остался, пожалуй, последним лояльным колчаковцем. Будучи его правой рукой, премьер-министром в тяжёлые времена Гражданской войны, он продолжал поддерживать Колчака и после провалившегося путча. С уходом Верховного правителя в Приамурье открылось окно для либерализации. Пепеляев должен решить, уйти ли ему в отставку, окончательно завершив эпоху колчаковцев и открыв дорогу Николаю Ухтомскому, второму по влиятельности кадету на Дальнем Востоке, или остаться на своей должности."
tram.70.a: "Пепеляев остаётся."
tram.70.b: "Пепеляев уходит в отставку."

tram.73.t: "Преобразование в федерацию"
tram.73.d: "Земли Сибири слишком долго были централизованы под властью Москвы или Петрограда. Пришло время нам федерализовать эти земли - и есть два варианта. Первый - радикальный: создать Соединённые Штаты Сибири, предоставив широкую автономию всем «штатам», которые составят ядро нашей новой республики. Второй вариант - просто предоставить автономию национальным меньшинствам, таким как якуты, тунгусы, бурят-монголы и другие."
tram.73.a: "Американский вариант отвечает нашим потребностям!"
tram.73.b: "Нам не нужен такой радикализм - только меньшинства могут получить федеративные права."

tram.74.t: "Сибирская мова"
tram.74.d: "В 1873 году в России в издании «Известия Сибирского отделения Российского газета общества (РГО)» были опубликованы «Заметки и словарь сибирского наречия» Павла Ровинского. О сибирском древнем наречии отмечается следующее: «Сибирский говор происходит от севернорусского наречия, но двухвековое отчуждение, совершенно иные природные условия жизни и другие исторические обстоятельства придали ему самобытное направление. Восточносибирское наречие имеет своеобразную фонетику, набор своеобразных грамматических форм. Словарь включает более 3000 местных слов, неизвестных в общерусском языке».\n\nОсновываясь на этих выводах, правительство предложило признать сибирский язык официальным языком и разработать программу официальной грамматики, орфографии и начать преподавать его в школах, чтобы следующее поколение сибиряков уже могло свободно общаться на сибирском языке!"
tram.74.a: "Начать преподавание сибирского в школах!"

tram.75.t: "Дружины Святого Креста"
tram.75.d: "Наши холодные и бедные земли не имеют ресурсов, о которых можно было бы говорить, кроме веры. Чтобы задействовать эту великую духовную силу русского народа, генерал Дитерихс сформировал «Дружины Святого Креста», также называемые Святыми Стражами с явной отсылкой к древнерусским личным дружинам и войскам князя. Они созданы по образцу Добровольцев гражданской войны, с клятвами и униформой - но вместо Добровольческой армии это будет Армия Крестоносцев.\n\nДружины организованы как регулярные воинские части с более строгой, чем обычно, дисциплиной, обращаются друг к другу как к братьям и приносят присягу генералу Дитерихсу сражаться до конца за Христово Царство. Не сомневайтесь: вместо простой символической силы Дитерихс начал переводить лучшее снаряжение и офицеров в эти бригады, полностью намереваясь сделать их основой своих сил."
tram.75.a: "Солнце взойдёт над Россией!"

tram.76.t: "Дмитрий Хорват скончался"
tram.76.d: "Дмитрий Леонидович Хорват долгое время казался не столько отдельным человеком, сколько целым учреждением, облачённым в привычки одного человека. Рождённый на старой императорской службе и обученный как инженер, он провёл десятилетия на железных дорогах империи, где компетентность значила очень много. К тому времени, когда пришли война и революция, он уже стал одним из тех редких чиновников, чей авторитет покоился на доверии тех, кто знал: поезда будут ходить, мосты - держаться, а приказы - исполняться без лишнего шума.\n\nВо время Гражданской войны эта репутация почти против его воли привела его в политику. На Китайско-Восточной железной дороге он стал центральной русской властью в Маньчжурии - сначала как комиссар Временного правительства, а затем, недолго, как временный правитель, пока не удастся восстановить российский суверенитет. В хаосе, последовавшем за крушением центральной власти, Харбин некоторое время жил под тихим, практичным порядком, который современники позже назвали «Счастливой Хорватией» - ирония судьбы, когда железнодорожная зона вела себя скорее как государство, чем само государство.\n\nХорват не принадлежал к великой театральной линии белых командиров, как Колчак или Корнилов, но был для неё незаменим. Он имел дело с японским давлением, китайской неопределённостью, большевистской подрывной деятельностью, охраной КВЖД и административным выживанием Русской Маньчжурии с тем же методичным терпением, которое когда-то сделало его ценным на пограничных линиях империи. После войны Дмитрий Леонидович оставался в Харбине многие годы как старший гражданский и технический хранитель русских железнодорожных интересов, хотя КВЖД перешла под тень Мантэцу и Фэнтяньской клики. Здесь старейший государственный деятель Дальнего Востока России наконец скончался от старости в возрасте семидесяти восьми лет. Его запомнят как человека, который превратил железную дорогу во временное государственное образование и укрепил русское присутствие в Маньчжурии на долгие годы."
tram.76.a: "Старый железнодорожник завершил свой последний путь."

tram.77.t: "Александр Андогский и Ревнители военных знаний"
tram.77.d: "Среди многих офицеров, прошедших через потрясения войны и революции, немногие оставались столь же неизменно преданными изучению самой войны, как Александр Иванович Андогский. Офицер Генерального штаба по образованию, он принадлежал к тому слою старой русской армии, для которого военная служба была неотделима от военной мысли. Во время Мировой войны он занимал штабные должности, где точность, планирование и теоретическое понимание значили не меньше, чем храбрость на поле боя.\n\nГражданская война привела Андогского на службу к адмиралу Колчаку, где он работал в высших структурах командования, внося вклад в организацию и логистическую связность белых сил. После победы Андогский не стремился к известности на командных постах, вместо этого культивируя военные знания. В первые годы республики эта роль оставалась второстепенной, затмеваемая восстановлением и политической борьбой. Однако после событий 1925 года и установления власти адмирала Колчака в Приамурье Андогский оказался в положении, когда его работа обрела новую актуальность.\n\nВо Владивостоке он стал ведущей фигурой в Дальневосточном обществе ревнителей военных знаний - не политической организации, не фракции внутри Ставки, а дисциплинированного кружка офицеров, лекторов и студентов, посвятивших себя систематическому изучению войны. Лекции, дискуссии и публикации составляли основу его деятельности; его члены изучали уроки Мировой войны, Гражданской войны и зарубежные военные разработки. В Приамурье его влияние ощущается в формировании молодых офицеров и в постепенном возрождении активной военной культуры."
tram.77.a: "Знание - тоже форма служения."

### Harbin Crisis ###
tram_harbin_crisis.1.t: "Русский Харбин и Мантэцу"
tram_harbin_crisis.1.d: ""
tram_harbin_crisis.1.a: "Мы надеемся, что наши сограждане продолжат работу над индустриальной мощью Китая"

TRM_clash_over_ussuri_island: "Столкновение за остров Большой Уссурийский"

tram_harbin_crisis.10.t: "Маленькая победоносная война"
tram_harbin_crisis.10.d: "В рамках «неравноправного» Пекинского договора 1860 года северные территории Империи Цин перешли под юрисдикцию Российской империи. Новоустановленная граница между Китаем и Россией была проведена по рекам Амур и Уссури.\n\nС этого момента остров Большой Уссурийский, расположенный на реке, стал предметом спора. Естественно, ослабленная династия Цин не осмелилась бы бросить вызов могуществу Российской империи. Однако в 1925 году, в разгар потрясений, вызванных путчем Колчака, и на волне успеха во Второй Чжили-Фэнтяньской войне, милитарист Чжан Цзолинь приказал захватить контроль над островами Тарабаров и Большой Уссурийский. Россия не смогла эффективно ответить. В результате поселения в Хабаровске оказались под угрозой обстрела с артиллерийских позиций на островах.\n\nТеперь, десять лет спустя, некоторые из наших генералов Высшего командования предложили восстановить контроль над незаконно захваченным островом — в частности, установить контроль над всем водным путём по рекам Амур и Уссури, чтобы создать удобную буферную зону для Хабаровска. По его плану, операция потребует одного казачьего полка и артиллерийской бригады и не будет слишком сложной. И учитывая покровительство Японии, маловероятно, что Квантунская армия вмешается."
tram_harbin_crisis.10.a: "Отбить остров!"
tram_harbin_crisis.10.b: "Не стоит ставить под угрозу наши отношения с Чжан Цзолинем."

tram_harbin_crisis.11.t: "[FROM.GetName] вторгается на остров Хэйсяцзы!"
tram_harbin_crisis.11.d: "В рамках неравного Пекинского договора 1860 года северные территории Империи Цин перешли под юрисдикцию Российской империи. Новоустановленная граница между Китаем и Россией была проведена по рекам Амур и Уссури.\n\nС этого момента остров Большой Уссурийский, расположенный на реке, стал предметом спора. Естественно, ослабленная династия Цин не осмелилась бы бросить вызов могуществу Российской империи. Однако в 1925 году, в разгар потрясений, вызванных путчем Колчака, и на волне нашего успеха во Второй Чжили-Фэнтяньской войне, Чжан Цзолинь приказал захватить контроль над островами Тарабаров и Большой Уссурийский. Россия не смогла эффективно ответить.\n\nОднако десять лет спустя государство-обрубок [FROM.GetName] решило «восстановить свой контроль». Наша разведка сообщает, что казаки вторглись на остров, произошло небольшое столкновение с нашим местным небольшим гарнизоном там, и в настоящее время они оккупировали оба острова. Хотя это и не большая проблема, такая самоуверенность и грубость со стороны казаков не могут остаться незамеченными."
tram_harbin_crisis.11.a: "Отразить вторжение!"
tram_harbin_crisis.11.b: "Требовать вмешательства Японии!"
tram_harbin_crisis.11.c: "Пусть забирают эти бесхозные земли."

tram_harbin_crisis.12.t: "Столкновение Фэнтяня и Приамурья за Амурские острова"
tram_harbin_crisis.12.d: "На реке Амур находятся два небольших острова, Тарабаров и Большой Уссурийский, которые перешли под контроль России после Пекинского договора 1860 года и оставались таковыми до 1925 года. Однако после Второй Чжили-Фэнтяньской войны и во время хаоса, вызванного Колчаковским путчем, Чжан Цзолинь захватил контроль над этими островами.\n\nНедавно Владивосток, по-видимому, решил вернуть эти территории и начал небольшую операцию по их «освобождению». Произошёл краткий обмен выстрелами и пограничная стычка, но правительство Фэнтяня теперь просит нашего вмешательства в этот вопрос."
tram_harbin_crisis.12.a: "Требовать официального признания островов китайскими!"
tram_harbin_crisis.12.b: "Уступить острова русским."
tram_harbin_crisis.12.c: "Установить протекторат Квантунской армии над островами!"

tram_harbin_crisis.13.t: "Япония вмешивается на нашей стороне!"
tram_harbin_crisis.13.d.TRM: "В ходе нашего возвращения островов трусливые китайцы обратились за помощью к своим японским хозяевам. Япония, как и ожидалось, отказалась от своих собственных марионеток и вынудила их признать острова частью нашей суверенной территории." # TRM наша сторона
tram_harbin_crisis.13.d.FNG: "В результате нашего обращения к Японии Квантунская армия оказала нам решающую поддержку, и контроль над островом был восстановлен - русские были вынуждены отступить без сопротивления по указанию [TRM.GetLeader]. Япония настояла на том, чтобы русские официально признали острова принадлежащими нам, и на этом вопрос был закрыт." # FNG наша сторона
tram_harbin_crisis.13.a: "Мы знали, что на японцев можно положиться."

tram_harbin_crisis.14.t.TRM: "Япония вмешивается на стороне Китая!"
tram_harbin_crisis.14.t.FNG: "Япония вмешивается на стороне России!"
tram_harbin_crisis.14.d.TRM: "В ходе нашего возвращения островов трусливые китайцы обратились за помощью к своим японским хозяевам, и, к сожалению, они встали на их сторону. Следовательно, Квантунская армия оказала поддержку китайским злодеям, и контроль над островом был восстановлен - мы были вынуждены отступить без сопротивления по указанию [TRM.GetLeader]. Япония настояла на том, чтобы мы официально признали острова принадлежащими Китаю, и на этом дело закончилось." # TRM не наша сторона 1
tram_harbin_crisis.14.d.FNG: "В результате нашего обращения к Японии они вероломно встали на сторону русских. Япония настояла на том, чтобы мы официально признали острова принадлежащими русским, и на этом вопрос был закрыт." # FNG не наша сторона 1
tram_harbin_crisis.14.a: "Мы знали, что на японцев нельзя положиться!"

tram_harbin_crisis.15.t: "Квантунская армия вторгается на Амурские острова!"
tram_harbin_crisis.15.d.TRM: "В ходе нашего возвращения островов трусливые китайцы обратились за помощью к своим японским хозяевам. Следовательно, Квантунская армия взяла на себя роль защитника островов, объявив их нейтральной территорией под своей защитой и разместив там небольшое воинское подразделение. Япония пообещала вернуться к этому вопросу в будущем и созвать новую конференцию для определения того, под чьей юрисдикцией в конечном итоге окажутся острова." # TRM не наша сторона 2
tram_harbin_crisis.15.d.FNG: "В результате нашего обращения к Японии Квантунская армия взяла на себя роль защитника островов, объявив их нейтральной территорией под своей защитой и разместив там небольшое воинское подразделение. Япония пообещала вернуться к этому вопросу в будущем и созвать новую конференцию для определения того, под чьей юрисдикцией в конечном итоге окажутся острова." # FNG не наша сторона 2
tram_harbin_crisis.15.a: "У Японии своё понятие справедливости."

tram_harbin_crisis.16.t: "Фэнтяньская армия сопротивляется!"
tram_harbin_crisis.16.d: "Вопреки нашим ожиданиям и заверениям атамана Семёнова, Чжан Цзолинь не собирался отдавать один из своих трофеев. Он объявил о российской провокации на границе и приказал немедленно отбить остров!"
tram_harbin_crisis.16.a: "Мы им покажем!"

tram_harbin_crisis.17.t.TRM: "Освобождение Большого Уссурийского"
tram_harbin_crisis.17.t.FNG: "Освобождение острова Хэйсяцзы"
tram_harbin_crisis.17.d.TRM: "Несмотря на решение Чжан Цзолиня отбить остров Большой Уссурийский, его попытка не повторила его успех 1925 года и обернулась для него сокрушительным поражением. Учитывая ограниченные ресурсы в его распоряжении, он не смог даже подчинить себе небольшой остров. Слава русскому солдату и оружию!"
tram_harbin_crisis.17.d.FNG: "Сокрушительная мощь армии Чжан Цзолиня вынудила русских полностью уйти с острова Хэйсяцзы."
tram_harbin_crisis.17.a: "Пусть знают своё место!"

tram_harbin_crisis.18.t.TRM: "Потеря Большого Уссурийского"
tram_harbin_crisis.18.t.FNG: "Потеря острова Хэйсяцзы"
tram_harbin_crisis.18.d.TRM: "К сожалению, силы Чжан Цзолиня были подавляющими, и мы были вынуждены отступить с Большого Уссурийского, оставив его в руках Фэнтяня."
tram_harbin_crisis.18.d.FNG: "Несмотря на решение Чжан Цзолиня отбить остров Хэйсяцзы, его попытка не повторила его успех 1925 года и обернулась для него сокрушительным поражением. Учитывая ограниченные ресурсы в его распоряжении, он не смог даже подчинить себе небольшой остров."
tram_harbin_crisis.18.a: "Досадная потеря."


tram.79.t: "Антиколчаковский переворот"
tram.79.d: "Сопротивление областников уже некоторое время было слишком высоким, их недовольство Колчаком сильно возросло. Теперь они открыто восстают против нас. Колчак может подчиниться и фактически передать им бразды правления или подавить это движение."

tram.80.t: "Последняя вахта"
tram.80.d: "В этом месяце адмирал Александр Колчак всё ещё делал то, что делал всегда: лично принимал доклады, собственноручно правил проекты документов и настаивал на том, чтобы самому присутствовать на самых утомительных совещаниях. Годы не сделали его менее требовательным, только более суровым. Вечером в день случившегося он вернулся с инспекции, связанной с портовой безопасностью и графиками поставок - рутинное дело, которое никто не ожидал запомнить. Погода была лютая. Говорили, что он отмёл опасения по поводу холода с той же сухой сдержанностью, которую когда-то проявлял в арктических водах. Вскоре после этого свидетели заметили, что он стал двигаться неуверенно, а затем замолчал. К ночи вызвали врача. К утру диагноз уже не вызывал сомнений: внезапное кровоизлияние в мозг, вызванное возрастом, перенапряжением и годами ношения бремени власти.\n\nКолчак, который всю свою жизнь выживал в море, на войне, в революции и в компромиссах мирного времени, в конце концов был побеждён чем-то совершенно аполитичным. Последствия этой скоропостижной кончины были немедленными. На Дальнем Востоке власть никогда по-настоящему не покоилась в одном месте, но присутствие Колчака придавало этой конструкции форму, которая исчезла с его падением."
tram.80.a: "Верховный правитель мёртв."

tram.81.t: "Колчак убит!"
tram.81.d: "Александр Колчак, лидер Приамурья более двенадцати лет, был зверски убит в результате взрыва! Есть несколько претендентов на его место, поскольку все они пользуются либо народной поддержкой, либо поддержкой вооружённых сил."
tram.81.a: "[ROOT.GetLeader] - новый лидер Приамурья!"
tram.81.b: "Атаман Семёнов - новый лидер Приамурья!"
tram.81.c: "Генерал Пепеляев возглавляет Приамурье!"
tram.81.e: "В хаосе младороссы захватывают власть!"
tram.81.f: "Областники захватывают власть и восстанавливают демократию."

transamur_elections_tt: "§YМы восстановим истинную демократию на Дальнем Востоке§!"

tram.84.t: "Правление атамана Семёнова в Приамурье заканчивается"
tram.84.d: "К нам недавно поступили новости о перевороте в [TRM.GetName]. Похоже, что Григорий Семёнов, наша надёжная пешка со времён Гражданской войны в России, отстранён от власти и предан военному суду, а [TRM.GetLeader] стал новым главой государства. Возможно, нам стоит попытаться организовать контрпереворот против него, прежде чем он попытается вывести Владивосток из нашей сферы влияния?"
tram.84.a: "Приветствовать новое правительство."
tram.84.b: "Следует попытаться свергнуть новое правительство."


tram.85.t: "Руководство Директории"
tram.85.d: "Хотя архитекторами Народной директории определённо были эсеры и НРА, Союз областников-федералистов также сыграл решающую роль в новом режиме. Сегодня Советы и Собрания по всей нашей стране избирают своих представителей, и, в свою очередь, эти представители назначат окончательный состав нашего народного правительства. Кто же победит на этих выборах?"


tram.86.t: "Выборы в Думу"
tram.86.d: "После нескольких месяцев подготовки временное правительство завершило подготовку к первым свободным выборам в [ROOT.GetName] с 1920 года. В национальном собрании доступно 90 мест, и различные политические партии начали свои кампании. В настоящее время только четыре партии имеют шанс получить большинство и, таким образом, сформировать новое правительство. Какая из них победит?"
tram.86.a: "Сибирские эсеры"
tram.86.b: "Областникам удаётся получить мандат."
tram.86.c: "Кадеты Дальнего Востока!"
tram.86.e: "Съезд несоциалистических организаций!"
tram.86.f: "Армия должна положить конец этой хаотичной демократии!"

tram.87.t: "Выборы в Думу"
tram.87.d: "Согласно Конституции, выборы проводятся каждые четыре года. Срок полномочий Государственной Думы истёк, и настало время избрать новый парламент. В Думе доступно 90 мест, и различные политические партии начали свои кампании. Только три партии имеют шанс получить большинство и, таким образом, сформировать новое правительство. Какая из них победит?"
tram.87.a: "Народная дальневосточная партия!"
tram.87.b: "Партия народной свободы!"
tram.87.c: "Земская краевая партия!"
tram.87.e: "Армия должна положить конец этой хаотичной демократии!"

tram.90.t: "Юи Мицуэ скончался"
tram.90.d: "Сегодня наш колониальный губернатор, генерал Юи Мицуэ, скончался в возрасте 79 лет. Ряд японских лоялистов и прихлебателей во Владивостокской думе уже призвали к прямой интеграции нашей страны в Японию, превращению в новую префектуру Империи. Однако их слова - не более чем бессмысленная болтовня. Всё зависит от того, что Япония решит с нами сделать."
tram.90.d2: "Сегодня официальный представитель Квантунской армии в Приамурье, генерал Юи Мицуэ, также известный как начальник штаба Сибирской экспедиционной армии в 1918 году, скончался накануне своего 80-летия. Хотя он давно находился в запасе, он был главным идеологическим и военным куратором японской Северной операции на Дальнем Востоке."
tram.90.a: "Значит ли это, что мы больше не независимы?"
tram.90.b: "В ад с ним!"

tram.91.t: "Юи Мицуэ скончался"
tram.91.d: "Сегодня наш колониальный губернатор в [TRM.GetName], достопочтенный генерал Юи Мицуэ скончался накануне своего 80-летия. В то время как некоторые прояпонские политики во Владивостокской городской думе призвали сделать [TRM.GetName] новой префектурой нашей Империи. Должны ли мы принять их предложение?"
tram.91.a: "Интегрировать собственно Приамурье, остальное пусть остаётся колонией."
tram.91.b: "Слишком дорого. Отправить Ои Сигэмото главой нового колониального правительства."

tram.92.t: "Предложить воссоединение с Россией?"
tram.92.d: "Поскольку наши шансы преодолеть мощь Японии невелики, ряд ведущих деятелей Приамурья призывают отложить в сторону наше прежнее соперничество с Россией и присоединиться к ней, чтобы отразить японскую угрозу. Предложив мирное присоединение к Российскому государству, мы могли бы наконец покончить с годами изоляции, навязанной нам воинственностью Колчака, и, надеюсь, избежать подчинения Токио."
tram.92.a: "Мы должны обеспечить наше выживание. Отправить предложение."
tram.92.b: "Ты с ума сошёл?"

tram.93.t: "Приамурье предлагает воссоединение"
tram.93.d: "Похоже, что предатели в Приамурье наконец осознали безрассудство своих действий. Их жалкое государство-осколок находится в состоянии войны с Японией и, несомненно, не имеет шансов на победу перед лицом японской военной мощи. Представители Приамурья прибыли к нам с мольбой о мирном воссоединении с нашей нацией, предположительно в надежде избежать завоевания Японией. Владивосток - важный порт, без сомнения, но готовы ли мы уже сейчас противостоять Токио?"
tram.93.a: "Добро пожаловать домой, русские."
tram.93.b: "Это слишком рискованно..."

tram.94.t: "Приамурье воссоединяется с Россией"
tram.94.d: "Похоже, что предательская мразь в Приамурье временно избежала неизбежного завоевания, воссоединившись с Россией. Наша гордость требует возмездия за их предательство, но разумно ли сейчас наносить удар по России?"
tram.94.a: "К войне!"
tram.94.b: "Приамурье того не стоит."

tram.95.t: "Россия отказывается от объединения"
tram.95.d: "Несмотря на все наши усилия по присоединению к России, переговоры провалились, так как российские представители отказались рассматривать наше мирное воссоединение. Столкнувшись с огромными японскими силами, похоже, мы предоставлены сами себе."
tram.95.a: "Проклятье."

tram.96.t: "Катастрофа"
tram.96.d: "Так называемое «Российское правительство» отказалось вернуть наши земли. Более того, они объявили нам войну и стремятся отбить Владивосток."
tram.96.a: "Проклятье!"

tram.97.t: "Российская Республика отделяется!"
tram.97.d: "Российская Республика решила покинуть нашу сферу влияния и прекратить все контакты с нами! Наша тщательно продуманная военно-промышленная хватка над ними и их гнилым режимом рухнула, и похоже, что наши тщательно разработанные планы по увеличению нашего влияния на российском Дальнем Востоке развалились."
tram.97.a: "Уничтожить их!"
tram.97.b: "Мы ничего не можем поделать, пока."

tram.98.t: "Переворот во Владивостоке"
tram.98.d: "К нам недавно поступили новости о перевороте во Владивостоке. Похоже, что Александр Колчак, лидер, которого мы принудили к сотрудничеству с нами, отстранён от власти, а [TRM.GetLeader] стал новым главой государства. Возможно, нам стоит попытаться организовать контрпереворот против него, прежде чем он попытается вывести Владивосток из нашей сферы влияния?"
tram.98.a: "Приветствовать новое правительство."
tram.98.b: "Следует попытаться свергнуть новое правительство."

tram.100.t: "Адмирал Колчак убит в Приамурье"
tram.100.d: "Новости об антиколчаковском перевороте в Приамурье недавно дошли до нас. Похоже, что мятежники успешно убили Александра Колчака, нашего близкого союзника, и генерал Дитерихс стал новым диктатором. Хотя он менее смел и амбициозен, чем его бывший политический соперник, Дитерихс всё ещё верит в великое экспансионистское видение для Приамурья. Может быть, нам стоит попытаться свергнуть его, прежде чем он начнёт геополитический кризис?"
tram.100.a: "Приветствовать новое правительство."

tram.102.t: "Адмирал Колчак убит в Приамурье"
tram.102.d: "Лидер переворота 1925 года, мятежный адмирал Александр Колчак был недавно убит собственными солдатами во время военного переворота в его любимом государстве Приамурье. Человек великих амбиций, он оспаривал наши права на управление Российской Республикой до самого своего последнего вздоха. С его смертью наше общество становится немного спокойнее."
tram.102.a: "Итак, ублюдок ушёл. Отлично!"

tram.103.t: "Приамурская валюта в Харбине"
tram.103.d: "Харбин - важный город, расположенный в центре территории Фэнтяня и соединяющий две части Китайско-Восточной железной дороги, которую наша республика продала правительству Фэнтяня в 1927 году. Но даже сейчас там живёт много русских, играющих значительную роль в железной дороге. Поскольку многие из них имеют связи с нами, они предпочитают использовать более или менее стабильный приамурский рубль вместо колеблющегося фэнтяньского таэля, хотя неясно, законны ли операции с нашей валютой или нет. Наш министр экономики предложил, чтобы мы заключили соглашение с Фэнтянем, которое разрешит использование приамурского рубля в Харбине, но позволит дополнительное налогообложение со стороны правительства Фэнтяня."
tram.103.a: "Давайте предложим это!"
tram.103.b: "Текущая ситуация приемлема."

tram.104.t: "Сибирский рубль в Харбине"
tram.104.d: "Приамурье предложило разрешить обменные операции между нашей собственной валютой и сибирским рублём в Харбине, где проживает самое большое русское население во всём Северо-Востоке. Правительство во Владивостоке говорит, что мы сможем облагать налогом эти операции, более того, такое соглашение могло бы положительно повлиять на промышленное развитие города, а также региона, где местный русский бизнес начал делать различные инвестиции. Но некоторые члены нашего правительства упоминают, что свободное использование сибирского рубля может привести к росту автономии Харбина."
tram.104.a: "Соглашение поможет нашей экономике."
tram.104.b: "Нам не нужна эта сделка."

tram.105.t: "Фэнтянь принимает"
tram.105.d: "Правительство Фэнтяня согласилось разрешить использование нашей валюты в Харбине. Мы надеемся, что это укрепит экономические связи между нашими странами."
tram.105.a: "Отлично."

tram.108.t: "Военные неудачи в войне против Приамурья"
tram.108.d: "Похоже, мы недооценили наших врагов во Владивостоке. Их силы прокатываются по Восточной Сибири, нанося поражение нашим войскам и захватывая города. Возможно, было бы разумно рассмотреть вопрос об уступке земель, на которые они претендуют, в обмен на мир между нами?"
tram.108.a: "В конце концов, это просто пустоши..."
tram.108.b: "Нет! Это всего лишь временная неудача."

tram.109.t: "Россия предлагает мир"
tram.109.d: "Наши могучие военные силы прокатываются по Восточной Сибири, освобождая города и людей от угнетения. Эти трусы, осмеливающиеся называть себя российским правительством, по-видимому, готовы уступить земли, которые мы ранее у них требовали. Должны ли мы подписать мирный договор или воспользоваться военной слабостью России, продолжив войну?"
tram.109.a: "Разумное предложение."
tram.109.b: "Нет договоров с предателями!"

tram.110.t: "Иркутский договор"
tram.110.d: "Поскольку режим в Приамурье, по-видимому, отвечает взаимностью на наши мирные инициативы, конфликт, кажется, окончен. Наши силы эвакуируются с уступленных земель на российском Дальнем Востоке, оставляя Владивосток под контролем над большими территориями нашей страны. Хотя это унизительная неудача, наступил мир - по крайней мере, пока."
tram.110.a: "У нас нет выбора..."

tram.111.t: "Приамурье отвергает мир!"
tram.111.d: "Похоже, что безумцы из Приамурья не желают прекращать проливать кровь русских. Мы должны защищаться!"
tram.111.a: "К оружию!"

tram.112.t: "Неудачи против Приамурья"
tram.112.d: "Похоже, мы недооценили наших врагов во Владивостоке. Их силы прокатываются по Сибири, нанося поражение нашим войскам и захватывая города. Возможно, было бы разумно рассмотреть вопрос об уступке земель, на которые они претендуют, в обмен на мир между нами?"
tram.112.a: "В конце концов, это просто пустоши..."
tram.112.b: "Нет! Это всего лишь временная неудача."

tram.113.t: "Россия предлагает мир"
tram.113.d: "Наши могучие военные силы прокатываются по Сибири, освобождая города и людей от угнетения. Эти трусы, осмеливающиеся называть себя российским правительством, по-видимому, готовы уступить земли, которые мы ранее у них требовали. Должны ли мы подписать мирный договор или воспользоваться военной слабостью России, продолжив войну?"
tram.113.a: "Разумное предложение."
tram.113.b: "Нет договоров с предателями!"

tram.114.t: "Новосибирский договор"
tram.114.d: "Поскольку режим в Приамурье, по-видимому, отвечает взаимностью на наши мирные инициативы, конфликт, кажется, окончен. Наши силы эвакуируются с уступленных земель в Сибири, оставляя Владивосток под контролем над большими территориями нашей страны. Хотя это унизительная неудача, наступил мир - по крайней мере, пока."
tram.114.a: "У нас нет выбора..."

tram.115.t: "Приамурье отвергает мир!"
tram.115.d: "Похоже, что безумцы из Приамурья не желают прекращать проливать кровь русских. Мы должны защищаться!"
tram.115.a: "К оружию!"

tram.118.t: "Анти-японские демонстрации"
tram.118.d: "Сегодня во Владивостоке прошёл крупный анти-японский митинг. Толпы разгневанных протестующих потребовали прекратить наше партнёрство с Японией и изгнать их мощную делегацию из нашей страны. Специальные агенты уже опознали агитаторов, ответственных за эту демонстрацию. Хотя мы должны попытаться раздавить эти подрывные элементы, мы могли бы вместо этого использовать их для уменьшения японского влияния в Приамурье."
tram.118.a: "Мы не можем позволить себе этих пропагандистов."
tram.118.b: "Они могут быть полезными марионетками против японского господства."

tram.119.t: "Япония требует контроля"
tram.119.d: "С каждым днём японское влияние растёт, и мы едва ли можем контролировать страну. Сегодня Императорская делегация из Токио потребовала, чтобы правительство [TRM.GetLeader] ушло в отставку и позволило Квантунской армии управлять Приамурьем - поистине грубое оскорбление. Хотя это навлечёт на нас гнев могущественной японской военщины, у нас всё ещё есть возможность изгнать их и объявить о полной независимости от Японии. Гордый народ Приамурья - не простые крепостные, и если нам суждено умереть, мы умрём, защищая свою страну от этого откровенного империализма!"
tram.119.a: "С другой стороны, мы можем избежать бессмысленного кровопролития..."
tram.119.b: "Мы не их прислужники! К оружию!"

tram.120.t: "Япония требует контроля"
tram.120.d: "С каждым днём японское влияние растёт, и мы едва ли можем контролировать страну. Сегодня Императорская делегация из Токио потребовала, чтобы правительство [TRM.GetLeader] объявило об официальном союзе с Японией и позволило Квантунской армии оккупировать все ключевые города. Хотя это навлечёт на нас гнев могущественной японской военщины, у нас всё ещё есть возможность изгнать их и объявить о полной независимости от Японии. Гордый народ Приамурья - не простые крепостные, и если нам суждено умереть, мы умрём, защищая свою страну от этого откровенного империализма!"

tram.121.t: "Белые беженцы во Владивостоке"
tram.121.d: "После своей победы во Второй Гражданской войне красные начали терроризировать своих внутренних врагов. Многие бывшие белые силы и их сторонники сумели бежать из материковой России, чтобы присоединиться к нашему делу против большевиков, воспользовавшись периодом нестабильности и анархии в Сибири, чтобы бежать на восток. Вместе с солдатами прибыло несколько хорошо образованных офицеров, предлагающих свои услуги. Независимо от их прежних политических пристрастий, вместе мы должны нанести удар по Красной Гидре!"
tram.121.a: "Добро пожаловать домой, братья!"

tram.122.t: "Ещё больше изгнанников прибывают в Приамурье"
tram.122.d: "Длительный период политической нестабильности в материковой России вызвал анархию в отдалённых частях Сибири. Поскольку режим [RUS.Capital.GetName] занят сдерживанием нестабильности на Западе, им довольно трудно осуществлять реальную власть над этим регионом. Люди теряют надежду на своих лидеров и бегут в нашу страну. Всё больше и больше беженцев и изгнанников присоединяются к нашему делу."
tram.122.a: "Добро пожаловать домой, братья!"

tram.123.t: "Отправить агитаторов в Сибирь"
tram.123.d: "Со смертью Керенского политическая ситуация в самой России стала ещё более хаотичной, чем в последние годы. Некоторые наши министры считают, что теперь у нас есть возможность снова нанести удар. Мы должны начать с отправки агентов для продвижения нашей повестки по всей Восточной Сибири. Если люди услышат нас, они неизбежно присоединятся к нам, чтобы свергнуть коррумпированный режим на Западе."
tram.123.a: "Отправить агитаторов."
tram.123.b: "Это слишком рискованно."

tram.124.t: "Результаты наших агитационных усилий"
tram.124.goodagit: "Недавние отчёты, достигшие нас, ясно дают понять, что наш план по отправке агитаторов в Сибирь для распространения наших идей был даже более эффективным, чем мы предполагали ранее. Ряд людей, многие из которых вооружены и имеют военную подготовку, покинули свои дома и направились в наше Войско. Теперь у нас достаточно дополнительной живой силы для хорошей дивизии."
tram.124.agit: "Недавние отчёты, достигшие нас, ясно дают понять, что наш план по отправке агитаторов в Сибирь для распространения наших идей был эффективным. Ряд людей, некоторые из которых вооружены, покинули свои дома и направились в наше Войско. Теперь у нас достаточно дополнительной живой силы для усиления существующих дивизий."
tram.124.badagit: "Недавние отчёты, достигшие нас, ясно дают понять, что наш план по отправке агитаторов в Сибирь для распространения наших идей был неэффективным. Люди Сибири, несмотря на анархию, охватившую страну, похоже, не желают бросать свою жизнь и присоединяться к нам ради такой безнадёжной мечты. Похоже, мы потратили ресурсы впустую."
tram.124.a: "Добро пожаловать домой, братья!"
tram.124.b: "Добро пожаловать домой, братья!"
tram.124.c: "Они нам всё равно не нужны..."

tram.125.t: "Наш старый друг мёртв"
tram.125.d: "Новости о смерти Георга V, короля Соединённого Королевства в изгнании, недавно достигли Владивостока. Некогда союзник Колчака, монарх гарантировал его безопасность в 1925 году до самой Британской революции. Его сын, [CAN_king_first_name], теперь взошёл на трон в Канаде. Хотя ни Колчак, ни [CAN_king_first_name] не знают друг друга лично, это возобновление отношений может стать началом долгого периода партнёрства между нашими странами. Мы должны отправить посланника для переговоров о поддержке."
tram.125.a: "Сильные союзники - это всегда хорошо."

tram.126.t: "Посланник из Приамурья"
tram.126.d: "Сегодня посланник из мелкой военной хунты Приамурья прибыл с визитом к Его Величеству, [CAN_king_full_name]. В своей речи посланник сообщил нам о прежней поддержке королём Георгом V неудачного переворота Колчака 1925 года в Петрограде и заверил нас, что на этот раз мятежный адмирал восторжествует - однако он снова просит поддержки у Антанты. Мы ничего не должны Колчаку, но, может, он не так уж бесполезен? Как нам ответить?"
tram.126.a: "Заверить его, что он получит всё необходимое."
tram.126.b: "Ограниченной поддержки будет достаточно."
tram.126.c: "Он просто старый шут."

tram.127.t: "Отчёт о встрече с [CAN_king_full_name]"
tram.127.fullsupport: "Наш посланник вернулся с великолепными новостями: [CAN_king_full_name] выразил глубокое уважение к нашему делу. Король пообещал, что мы можем рассчитывать на него в плане некоторой военной поддержки. Кажется, что Антанта теперь является эффективным партнёром для нашего режима."
tram.127.partialsupport: "Наш посланник вернулся с хорошими новостями: [CAN_king_full_name] выразил уважение к нашему делу. Однако, хотя король пообещал частично поддержать нас, он отказался дать нам полную поддержку. Хотя результат не так хорош, как мы надеялись, любая поддержка со стороны Антанты весьма желанна."
tram.127.nosupport: "Наш посланник вернулся с неутешительными новостями: [CAN_king_full_name] выразил мало интереса к нашему делу, мягко говоря. Король прямо сказал, что мы не более чем клика шутов, отчаянно пытающихся сохранить свою власть. Он не пообещал абсолютно ничего от Антанты, и наши отношения определённо ухудшились."
tram.127.a: "Курс - [RUS.Capital.GetName]!"
tram.127.b: "Это лучше, чем ничего!"
tram.127.c: "Какой грубый человек..."

tram.128.t: "Владивостокский договор"
tram.128.d: "Война между Японией и Приамурьем, кажется, утратила всякий смысл, который имела прежде. Японские войска, неся потери от храбрых русских защитников, не смогли завоевать Владивосток так долго, что вся перспектива усмирения Приамурья теперь может стоить больше, чем Приамурье может дать взамен.\n\n[JAP.GetLeader] и [TRM.GetLeader] встречаются сегодня во Владивостоке, чтобы подписать мирный договор без аннексий и контрибуций и положить конец всем военным действиям между этими двумя странами. Кажется, что Япония потеряла свой единственный инструмент давления на Россию. Народ Приамурья празднует эту выдающуюся победу."
tram.128.trm: "Наша маленькая месть за 1905 год."
tram.128.jap: "Проклятие вам, предатели."

tram.145.t: "Меняющееся отношение"
tram.145.d: "Большинство людей в России устали от постоянных войн и желают положить конец боевым действиям. С недавней победой нашего режима мы можем дать мир и процветание людям, которые так долго страдали."
tram.145.a: "Россия больше никогда не должна воевать сама с собой."

tram.147.t: "Проблема областников"
tram.147.d: "Областники требуют всё больше и больше от нашего правительства. Сначала они требовали свои местные комитеты, затем местные Думы, теперь они просят местных губернаторов. Их влияние - и, следовательно, сопротивление - растёт день ото дня. Но мы даём им то, чего Российская Республика никогда не давала - самую широкую автономию. В Совете министров много членов-областников, лоббирующих сепаратистские влияния. Может быть, нам стоит наконец начать ограничивать это жалкое движение?"
tram.147.a: "Им лучше умерить свои требования."

tram.1481.t: "Новый кабинет"
tram.1481.d.kolchaksurvivedthecoup: "Некоторые министры в правительстве допустили переворот. Колчак твёрдо верит, что эта ситуация произошла только из-за его обещаний и недостаточной жёсткости. Теперь будет сформирован новый Совет Верховного правителя, и теперь почти каждая политическая организация считается угрозой."
tram.1481.d.nocoup: "Последний шаг перед возвращением всей России. Новый Совет Верховного правителя, лучшие люди, которые поведут нашу страну к становлению новой и лучшей Россией."
tram.1481.a: "Колчак должен сам возглавить правительство!"
tram.1481.b: "Совет под влиянием областников идеален."
tram.1481.c: "Меркулов станет премьер-министром!"
tram.1481.e: "Семёнов станет премьер-министром!"
tram.1481.f: "Дитерихс станет премьер-министром!"
tram.1481.g: "Нам не нужны перемены!"

tram.148.t: "Разгром НРА!"
tram.148.d: "Народно-революционная армия уже давно является проблемой. Спонсируемая большевиками, французскими синдикалистами или кем бы то ни было ещё, они агитируют в сельской местности и после переворота стали сильнее, чем когда-либо. Мы должны уничтожить их влияние раз и навсегда."
tram.148.a: "Приамурье будет свободно от социализма."

tram.149.t: "Наши отношения с японцами"
tram.149.d: "С момента основания нашего государства Япония была нашим ближайшим союзником. Хотя [TRM.GetLeader] считает нынешнее состояние отношений с Японией временной и необходимой мерой для силы, он понимает, что эта позиция может считаться уязвимой и сделать его правление нелегитимным в глазах простых русских. Тем не менее, нам нужны эти связи пока, и кажется, что нам придётся мириться с японским влиянием до тех пор, пока Сибирская армия не войдёт в Москву."
tram.149.a: "Нам не нужны японцы."
tram.149.b: "Преимущества нашей дружбы слишком важны."

tram.1491.t: "Долой японское влияние!"
tram.1491.d: "С момента основания нашего государства Япония была нашим ближайшим союзником. Однако всё изменилось. Влияние Японии становится всё более подавляющим, что делает нас уязвимыми. Мы должны сделать правильный выбор раз и навсегда: либо мы официально присоединяемся к Японии, либо полностью разрываем с ними связи."


tram.150.t: "Приамурье разрывает с нами связи"
tram.150.d: "[FROM.GetAdjective]ое правительство решило разорвать с нами связи. Они отослали нашу делегацию обратно, прекратили торговлю и выдвигают требования, чтобы мы вывели наши гарнизоны. Пока Приамурье становится всё сильнее и сильнее, мы должны вернуть его силой - сейчас или никогда."
tram.150.d2: "[FROM.GetNameDefCap] решило покинуть нашу сферу влияния и прекратить все контакты с нами! Наша тщательно продуманная военно-промышленная хватка над ними и их гнилым режимом рухнула, и похоже, что наши тщательно разработанные планы по увеличению нашего влияния на российском Дальнем Востоке развалились."
tram.150.a: "Объявить войну!"
tram.150.b: "Нам нечего делать в Приамурье."

tram.151.t: "Приамурье хочет присоединиться к нам"
tram.151.d: "Правительство Приамурья решило присоединиться к нашему альянсу. Это момент, которого мы так долго ждали. Некоторые наши генералы даже спрашивали, не можем ли мы вмешаться в Приамурье напрямую. Но с подписанием нового договора - Приамурье уже в японской Сфере."
tram.151.a: "Тост за наших друзей!"

tram.152.t: "Религиозный авторитет на Востоке"
tram.152.d: "Московский патриархат - это порождение Революции, которая заменила Святейший Синод на Патриарха - должность, кажущуюся скорее светским царём, чем пастырем Божьего стада. Пока патриарх Сергий кланяется [RUS.GetLeader] и его приспешникам, верные продолжают борьбу против безбожников. Однако сам патриархат как институт остаётся священным, будучи восстановлением древнего уклада Русской церкви.\n\nВосток всегда был домом для тех, кого Москва считала неконформистами, и остаётся им поныне.\n\nЭто даёт естественный шанс устроить религиозную власть на Востоке подобающим образом - не продиктованным Москвой. Сам генерал Дитерихс начитан в богословии и связан как с mainstream православным духовенством, так и со старообрядцами региона, которые составляют значительное региональное меньшинство в Восточной Сибири. Он не стремится упразднить патриархат, но сохранить и защитить его священный принцип, пока тот не сможет быть восстановлен в подлинной независимости. Таким образом, духовенство дальневосточных территорий призывается признать старшего иерарха, который будет служить хранителем церковного порядка на Востоке.\n\nПопулярным выбором был бы митрополит Виссарион (Зорнин), который уже был смещён с поста митрополита Омского из-за конфликтов с патриархом Сергием. Виссарион - харизматичный лидер, подходящий для руководства раскольнической церковью, особенно после того, как мы будем править всей Россией.\n\nДругим вариантом было бы обратиться к местным жителям, а именно к старообрядцам Восточной Сибири. Старообрядческий митрополит стал бы прекрасным жестом по отношению к верующим региона, но многим простым православным его было бы труднее принять. Лучшим выбором в этом случае был бы епископ Афанасий (Федотов) из Верхнеудинска - уважаемая и популярная местная фигура."
tram.152.a: "Виссарион."
tram.152.b: "Афанасий."

TRM_metropolitan_vissarion: "Митрополит Виссарион"
TRM_metropolitan_afanasy: "Митрополит Афанасий"
TRM_patriarch_sergius: "Патриарх Сергий"

tram.1521.t: "Военная диктатура"
tram.1521.d: "Несмотря на желание Дитерихса восстановить монархию в России, большинство военных генералов настаивали на сохранении текущего режима. Дитерихс не может действовать в одиночку и должен согласиться с предложением Военного кабинета."
tram.1521.a: "Да здравствует Россия!"

tram.153.t: "Восстановление монархии"
tram.153.d: "Генерал Дитерихс наконец решил восстановить монархию в Дальневосточной республике. Хотя это действие требует некоторой подготовки, мы можем заявить сейчас - Русский Монарх вернётся на своё законное место - возглавляя русский народ."
tram.153.a: "Да здравствует Приамурье! Единое и Неделимое!"
transamur_monarchy_restored: "Приамурье восстановило монархию."

tram.154.t: "Император Всероссийский"
tram.154.d: "С упразднением бывшей Российской Республики и восстановлением монархии нет необходимости держать народ России разделённым. И граждане Запада, и граждане Востока живут под одним небом и разделяют общую историю, поэтому следует инициировать официальную встречу для начала процесса объединения государств."
tram.154.a: "Мы должны быть едины!"
tram.154.b: "(Играть за Российскую Империю)"

tram.155.t: "Коронация Никиты Александровича во Владивостоке"
tram.155.t2: "Коронация Никиты Александровича в Москве"
tram.155.d: "Скупо освещённая церковь-школа иконы Божией Матери «Утоли моя печали», посвящённая памяти русских воинов, вместила немногочисленную паству в благоговейной тишине. По стенам мерцали свечи, отбрасывая длинные тени на верующих, собравшихся со всех уголков дальневосточных земель. В центре князь Никита Александрович преклонил колени перед [TRM_who_leads_church], который должен был вручить ему священные символы монархии. На почтительном расстоянии стоял Воевода [ROOT.GetLeader], неумолимо стареющий, но неколебимый страж дальневосточных земель России. Его глаза, отягощённые грузом десятилетий борьбы, обводили собрание.\n\n«Боговенчанный, Богоданный и Богопрославленный, Благочестивейший, Самодержавнейший, Великий Государь Император Всероссийский!» - возгласил [TRM_who_leads_church], вручая скипетр в правую руку Никиты, а державу - в левую. «Прими их как видимые образы самодержавия, дарованного Всевышним, для управления народом Твоим и сохранения его праведного благоденствия».\n\nРуки Никиты дрожали, когда он принимал священные эмблемы. «Благочестивейший, Самодержавнейший, Великий Государь Император Всероссийский!» - продолжал [TRM_who_leads_church], - «Сие видимое украшение Главы Твоей явит невидимое венчание от Царя Славы, Христа, утверждая Тебе верховную власть над народом Твоим».\n\nВоевода хранил молчание, пока продолжались молитвы. С этого дальневосточного форпоста должно было начаться восстановление всей России, с Никитой как её священным символом единства и надежды."
tram.155.d2: "Успенский собор, чей золочёный иконостас сверкал в утреннем солнце, был заполнен собравшейся иерархией Русской православной церкви, военачальниками и посланниками со всех освобождённых русских земель. В центре князь Никита Александрович преклонил колени перед [TRM_who_leads_church], который должен был вручить ему священные символы монархии, и чей голос зазвучал под сводами: «Боговенчанный, Богоданный и Богопрославленный, Благочестивейший, Самодержавнейший, Великий Государь Император Всероссийский!»\n\nПатриарх вложил скипетр в правую руку Никиты, а державу - в левую. Вокруг него собравшиеся священнослужители и воины возносили молитвы и песнопения, объединяясь в торжественном провозглашении, что Россия, долго разделённая и истерзанная, обрела своего помазанника. «Прими их как видимые образы самодержавия, дарованного Всевышним, для управления народом Твоим и сохранения его праведного благоденствия».\n\nВ дальнем конце собора Воевода [ROOT.GetLeader] стоял как гарант порядка и легитимности. Его присутствие напоминало всем, что восстановление Империи было делом не только Божественного промысла, но и дисциплинированного правления и военной решимости. «Сия видимая корона, - возгласил [TRM_who_leads_church], - знаменует не только признание Твоей верховной власти людьми, но и невидимое венчание от самого Христа, утверждая Твою роль как главы всего русского народа». Когда Патриарх, впервые за столетия, возложил корону на голову Царя, собор взорвался криками «Боже, Царя храни!». Многолетняя кампания Михаила Дитерихса достигла своей кульминации: от Дальнего Востока до старой столицы восстановление Святой Руси, освящённое Верой и ведомое рукой Воеводы, наконец стало реальностью."
tram.155.a: "С Дальнего Востока Святая Русь начинает пробуждаться под Богоданным Государем."
tram.155.b: "Вся Россия преклоняет колени, свидетельствуя о Богоданном Государе и Воеводе, приведшем её к возрождению."


tram.156.t: "Чехословацкий легион"
tram.156.d: "После смерти Дитерихса большинство генералов присоединились к Сергею Войцеховскому - видному русскому генералу и члену Чехословацкого легиона. Дальневосточная республика перейдёт под военное правление Генерала и его военного кабинета и будет готовиться к предстоящей войне с Россией."
tram.156.a: "Ещё один диктатор взял бразды правления."

tram.157.t: "Монархически настроенные генералы бегут из России"
tram.157.d: "После коронации Кирилла I несколько русских генералов, включая многих выдающихся военных героев, бежали из России в Приамурье. С ними на нашей стороне нам будет намного легче восстановить власть Дома Романовых на всех землях Российской Империи."
tram.157.a: "Великолепно!"

tram.158.t: "Сепаратизм в Империи"
tram.158.d: "Движение областников, или сибирских федералистов, раздирает Родину на части уже несколько десятилетий. Но с возвращением монарха все разговоры об автономной Сибири будут запрещены. Сами областники не должны питать никаких надежд относительно будущего Сибири. Она должна оставаться единой и неделимой."
tram.158.a: "Россия едина и неделима!"

tram.159.t: "Российская Империя восстановлена на Дальнем Востоке"
tram.159.d: "Новый режим во Владивостоке пригласил законного наследника российского престола править их страной, и теперь они провозгласили Российскую Империю в изгнании. Это решение, однако, открывает новые возможности для нас, наконец, объединиться с непризнанным государством на Дальнем Востоке. С другой стороны, если мы этого не сделаем, некоторые генералы-монархисты могут присоединиться к их правительству."
tram.159.a: "Пригласить [TRM.GetLeader] править как конституционный монарх."
tram.159.b: "Объединиться с Приамурьем в рамках режима абсолютной монархии."
tram.159.c: "Мы не признаем [TRM.GetLeader] нашим Царём."

tram.1590.t: "Российская Империя восстановлена на Дальнем Востоке"
tram.1590.d: "Новый режим во Владивостоке пригласил законного наследника российского престола править их страной, и теперь они провозгласили Российскую Империю в изгнании. Это решение, однако, открывает новые возможности для нас, наконец, объединиться с непризнанным государством на Дальнем Востоке. С другой стороны, если мы этого не сделаем, некоторые генералы-монархисты могут присоединиться к их правительству. Чхеидзе произнёс большую речь в Сенате, где теоретически обосновал, что восстановление монархии Романовых необходимо для получения народной поддержки нашего правительства. Он утверждает, что с возвращением Царя наша легитимность может быть обеспечена, и долгая традиция монархии продолжится.\n\nОднако Сенат разделился в этом вопросе. Одни заявили, что мы не должны отходить от православной евразийской доктрины, но другие поверили в тезисы Чхеидзе. Учитывая перспективу мирного объединения с Дальним Востоком, его предложение, вероятно, будет принято большинством Сената. Однако они могут также прислушаться к мнению Трубецкого и других отцов-основателей, которые вряд ли поддержат Чхеидзе."
tram.1590.a: "Мы должны пригласить Царя и воссоединиться с Приамурьем."
tram.1590.b: "Мы не признаем [TRM.GetLeader] нашим Царём."


tram.160.t: "Предполагаемое объединение России"
tram.160.d: "Российское правительство решило признать [TRM.GetLeader] законным правителем Всероссийским. Однако они пригласили его править как конституционного монарха. Как нам ответить?"
tram.160.a: "Конституционная монархия? Это смешно."
tram.160.b: "Принять их предложение."

tram.1600.d: "Российское правительство решило признать [TRM.GetLeader] законным правителем Всероссийским. Однако это противоречит планам нашего главы правительства. Как нам ответить?"
tram.1600.a: "Потребовать, чтобы они сделали Дитерихса главой правительства."

tram.1601.t: "[TRM.GetLeader] требует, чтобы мы сделали Дитерихса главой правительства"
tram.1601.d: "Царь попросил сделать Дитерихса главой своего правительства в России. Хотя у [ROOT.GetLeader] есть свои амбиции, это, возможно, единственный способ объединиться мирно."
tram.1601.a: "[ROOT.GetLeader] никуда не денется."

tram.1602.t: "[TRM.GetLeader] отклоняет предложение"
tram.1602.d: "Так называемый «законный» Царь отклонил наше честное предложение объединиться мирно."
tram.1602.a: "Скоро их суверенитету придёт конец."

tram.1603.t: "[RUS.GetLeader] отклоняет предложение"
tram.1603.d: "Петроградский режим отклонил наше честное предложение объединиться мирно."
tram.1603.a: "Скоро их суверенитету придёт конец."



tram.161.t: "Владивостокский референдум"
tram.161.d: "Новое правительство, в связи с тем, что [RUS.GetNameDef] управляется дружественным режимом, теперь решило провести референдум о присоединении к России. Мы должны провести референдум как можно скорее."
tram.161.a: "Нам нужен мир."

tram.162.t: "Иностранные инвестиции"
tram.162.d: "Мы должны попросить наших ближайших иностранных партнёров - Японию и Канаду - инвестировать в нас. Это не только принесёт пользу нашей экономике, но и улучшит наши международные отношения."
tram.162.a: "Отправить им наше предложение."

tram.163.t: "Предложение от [TRM.GetNameDef]"
tram.163.d: "Правительство [TRM.GetNameDef] прислало нам предложение инвестировать в их экономику - это поможет нам приобрести нового партнёра в Тихоокеанском регионе."
tram.163.a: "Согласиться."
tram.163.b: "Отклонить предложение."
can_inv_trm: "Канада инвестировала в нас"

tram.164.t: "[FROM.GetNameDef] приняло предложение"
tram.164.d: "Правительство [FROM.GetNameDef] согласилось инвестировать в нашу экономику."
tram.164.a: "Это выгодная сделка."

tram.165.t: "Канада отказалась инвестировать в нас"
tram.165.d: "Правительство Канады отказалось инвестировать в нас. Это сильно испортило наши отношения. Может быть, нам стоит больше полагаться на Японию?"
tram.165.a: "Проклятье."

tram.167.t: "Тесные связи с Антантой?"
tram.167.d: "У нас может быть большое будущее в Антанте - наших бывших союзниках во время Мировой войны. Хотя нам выгоднее сотрудничать с Японией, если мы хотим быть признаны истинным российским правительством, нам следует работать с Антантой."
tram.167.a: "Отправить им договор."

tram.168.t: "Договор от [TRM.GetNameDef]"
tram.168.d: "Правительство [TRM.GetNameDef] стремится к сотрудничеству с нами. Хотя может быть опасно сотрудничать с союзником Японии, и нам следует сосредоточиться на Европе, мы могли бы признать Приамурье независимым государством."
tram.168.a: "Подписать договор."
tram.168.b: "Наш ответ - нет."

tram.169.t: "[CAN.GetNameDef] отказалась"
tram.169.d: "Канадское правительство отказалось сотрудничать с нами."
tram.169.a: "Предатели."

tram.170.t: "[CAN.GetNameDef] согласилась"
tram.170.d: "Канадское правительство согласилось сотрудничать с нами."
tram.170.a: "Великолепно!"

tram.173.t: "«Варяг»"
tram.173.d: "«Варяг» когда-то был русским бронепалубным крейсером. Он прославился стойкостью и храбростью своего экипажа во время боя в Чемульпо. Будучи морской державой, мы всегда должны помнить о героизме команды «Варяга»."
tram.173.a: "Пусть эта история станет вдохновением для наших воинов!"

tram.175.t: "Суд над социалистами"
tram.175.d: "Лидеры и организаторы партий НСП, ПЛСР и РКП были теми, кто привёл нашу страну к Гражданской войне в 1918 году и теми, кто продолжал дестабилизировать её в 1920-х и 1930-х годах. Теперь мы должны решить - либо мы продолжим с ограничениями и запретами, либо решим их судьбу раз и навсегда - приговорим их за измену."
tram.175.a: "Запретить эти партии."
tram.175.b: "Приговорить их лидеров."

tram.176.t: "Суд над РОВС"
tram.176.d: "РОВС, организация Белых генералов, созданная Лавром Корниловым и его ближайшими союзниками, была силой, которая помешала России полностью демократизироваться. Состоящая из адептов крайне правых, монархистов и сторонников сильной диктаторской власти. Если мы позволим им действовать, они продолжат продвигать правую риторику, однако у нас будет сильная и достаточная армейская организация."
tram.176.a: "Запретить РОВС."
tram.176.b: "Позволить им действовать - они могут быть полезны."

tram.177.t: "Суд над ПСР"
tram.177.d: "Эсеры когда-то были самой популярной партией в России, которая продвигала многие социальные реформы в нашей стране. Однако, поскольку Керенский оказался довольно плохим лидером, многие члены ПСР отвернулись от него. С другой стороны, большинство из них поддерживают ещё более радикальную политику, которую Керенский слишком боялся проводить. Что нам делать?"
tram.177.a: "Запретить ПСР и приговорить их лидеров."
tram.177.b: "У них нет ничего общего с Керенским - оставить их в покое."
tram.177.c: "Просто запретить их - они ничего не смогут сделать против нас."

tram.1000.t: "Предложение от старого союзника?"
tram.1000.d: "Государство-осколок Владивостока на самом деле победило, и теперь создано правительство, которое будет править Россией. Поскольку мы оказали некоторую помощь в их безвыходном положении, они предложили свою поддержку Антанте."
tram.1000.a: "Их помощь жизненно важна, пусть входят!"
tram.1000.b: "Разве они не проиграли в прошлый раз?"

tram.1001.t: "Теперь мы являемся членом Антанты"
tram.1001.d: "Британцы решили снова принять нас в Антанту, что знаменует новую эру взаимного сотрудничества и возобновление важности нашего положения на мировой арене."
tram.1001.a: "Мы отомстим за павших в Мировой войне."

tram.1002.t: "Предложение от старого союзника?"
tram.1002.d: "[FROM.GetNameDefCap] на самом деле победило, и теперь создано правительство, которое будет править Россией. Поскольку мы оказали некоторую помощь в их безвыходном положении, они предложили свою поддержку [ROOT.GetFactionName]."
tram.1002.a: "Их помощь жизненно важна, пусть входят!"
tram.1002.b: "Разве они не проиграли в прошлый раз?"

tram.1003.t: "Теперь мы являемся членом [FROM.GetFactionName]"
tram.1003.d: "[FROM.GetAdjective]ое государство решило снова принять нас в [FROM.GetFactionName], что знаменует новую эру взаимного сотрудничества и возобновление важности нашего положения на мировой арене."
tram.1003.a: "Мы отомстим за павших в Мировой войне."

tram.1004.t: "Российская Республика захватила одно из наших клиентских государств"
tram.1004.d: "Россия недавно вышла из огромной гражданской войны, в которой из всех стран победило Приамурье. Этот режим считает, что, поскольку оно захватило всю Россию, оно может забрать наших марионеток. Что нам делать с этими предателями?"
tram.1004.a: "Мы ничего не можем с этим поделать."
tram.1004.b: "Мы, по крайней мере, введём против них эмбарго."
tram.1004.c: "Мы можем снова их победить!"

tram.1005.t: "Правительство Приамурья пало"
tram.1005.d: "Российская армия вторглась в Приамурье, и нам ничего не остаётся, кроме как вывести наши гарнизоны. Наши деловые интересы в Приамурье теперь бесперспективны и убыточны."
tram.1005.a: "Очень жаль."

tram.200.t: "Верховный правитель России"
tram.200.d: "Ещё во время Гражданской войны, когда орды кровожадных большевиков пытались ввергнуть Россию в хаос, адмирал Колчак принял важное и ответственное решение - стать Верховным правителем России до созыва Учредительного собрания, чтобы объединить силы белых в борьбе против красных.\n\nЕдва поддерживаемый мир между эсерами, кадетами и белыми генералами продержался до конца войны, и в 1920 году, после изгнания большевиков, Колчак, тогдашний премьер-министр Сазонов и Корнилов были вынуждены подписать Минский договор. Спустя некоторое время было созвано второе Учредительное собрание, и Колчак сложил с себя полномочия Верховного правителя России.\n\nНо следующие 5 лет изменили всё. Во-первых, голод. Во-вторых, оккупация потерянных земель. В-третьих, продажа российского промышленного потенциала немцам за гроши. Всё это привело к событию, известному как пресловутый колчаковский путч 1925 года, хотя сам адмирал сыграл в тех событиях небольшую роль. Лишённый командования военно-морскими силами, он был вынужден отступить на восток, где мятежные казаки Семёнова провозгласили свою власть и независимость от обезумевшей республики. Здесь, во Владивостоке, Колчак оказался обязанным вновь принять на себя роль Верховного правителя, возглавив этот остаток старой России. Как долго это продлится?"
tram.200.a: "И вот мы здесь..."

tram.201.t: "Партизанская война НРА"
tram.201.d: "С самого момента, когда белые захватили власть в Сибири и на Дальнем Востоке, в регионе действовала Дальневосточная народно-революционная армия (НРА), финансируемая большевиками. После поражения большевиков НРА продолжила свою деятельность, но полностью ушла в подполье, периодически устраивая политические убийства и покушения на высокопоставленных чиновников. 15 лет спустя НРА всё ещё активна... и то ли нехватка офицеров ДВСВ, то ли некомпетентность забайкальских казаков, то ли отсутствие инфраструктуры мешают разоблачению и уничтожению этой террористической группировки.\n\nКроме того, НРА распространяет откровенно большевистскую пропаганду, которая пытается радикализировать рабочих крупных промышленных городов Дальнего Востока: Читы, Хабаровска и др. Мы должны выявить и уничтожить все подпольные ячейки НРА, схватить их руководство и казнить их, прежде чем они погрузят Дальний Восток в хаос большевизма."
tram.201.a: "Народничество должно наконец вымереть."
tram.201.b: "Я хочу узнать больше о НРА"

tram.202.t: "Братья Меркуловы"
tram.202.d: "Деловые круги Владивостока - это истоки такого государства, как Приамурье. Именно они, спонсируемые японским правительством, провозгласили Приамурский протекторат. Всё изменилось в 1925 году, когда территория Приамурья радикально увеличилась, и во Владивостоке, помимо них и японцев, появились Сибирская армия Колчака, ДВСВ, казаки и сибирские областники. Владивосток, будучи столицей Приамурья, стал шахматной доской для всех политических групп Приамурья. И возможно, Колчак думает, что здесь главный он, но это ошибка.\n\nВо главе Владивостока стоит японский гарнизон Квантунской армии, который охраняет порт Владивостока, и без его разрешения во Владивосток не поступает ни один товар. Но разрешение получить очень легко, особенно если принадлежишь к семье Меркуловых - богатейших предпринимателей Дальнего Востока. Имея в кармане японский гарнизон, братья Меркуловы пытаются подчинить себе не только всю владивостокскую торговлю, но и политику, причём Национально-демократический союз Спиридона Меркулова является одной из крупнейших разрешённых политических партий на Дальнем Востоке."
tram.202.a: "Следите за ними в оба..."
tram.202.b: "Я хочу узнать больше о японцах."
tram.202.c: "Я хочу узнать больше о Меркуловых."

tram.205.t: "Помочь в борьбе с НРА?"
tram.205.d: "На войне все средства хороши, и чтобы наконец покончить с эсеровской заразой на Дальнем Востоке, мы можем обратиться к одной из лояльных нам политических групп. Есть только два варианта: казаки Семёнова, которые легко разберутся с партизанами в родных краях, или организованные и дисциплинированные военные ДВСВ Дитерихса, которые ненавидят большевиков почти так же сильно, как и мы."
tram.205.a: "Нам понадобится помощь Семёнова."
tram.205.b: "Нам понадобится помощь Дитерихса."
tram.205.c: "Мы справимся сами."

tram.206.t: "Крестовый поход против народников!"
tram.206.d: "Генерал Дитерихс объявил крестовый поход против социализма любого рода. Вооружённые не только винтовками и патронами, но и верой в нашего Спасителя Иисуса Христа, дружинники Святого Креста готовы уничтожить проклятую ересь социализма.\n\nУничтожая любую агитацию и пропаганду партизан Народно-революционной армии, Дружины Святого Креста несут свет необразованным массам Дальнего Востока. Да здравствует новая инквизиция! Да здравствует генерал Дитерихс! Да здравствует адмирал Колчак!"
tram.206.a: "Похоже, НРА обречена."

tram.207.t: "Казаки, вооружённые японскими винтовками!"
tram.207.d: "Участие забайкальских казаков в подавлении партизанской войны Народно-революционной армии принесло не только пользу, но и подозрительные слухи. Местные жители говорят, что казаки, пришедшие освободить их от гнёта социализма, были вооружены японскими винтовками, а некоторые колонны состояли из фэнтяньских и японских офицеров. Конечно, довольно странно, что казаки спокойно разгуливают в присутствии иностранных вооружённых сил, но есть такой вопрос. Откуда местные жители вообще знают, как выглядят японские винтовки?"
tram.207.a: "По крайней мере, они борются с НРА."

tram.208.t: "Сибирский областной совет"
tram.208.d: "Слишком долго мы обещали дать областникам автономию, ничего не делая. Неудивительно, что с годами их недовольство росло всё больше и больше. Пора перестать давать обещания и что-то с этим сделать. Мы сформируем Сибирский областной совет, или Сибсовет, который будет уполномоченным органом Верховного правителя в землях с гражданским управлением. Этот орган будет иметь высшую исполнительную и законодательную власть в этих регионах, которая, конечно, будет ограничена только Верховным правителем и Советом министров."
tram.208.a: "Триумф сибирского областничества!"

tram.210.t: "Земский собор"
tram.210.d: "В городе Владивостоке проходит Великий Земский собор под руководством воеводы Михаила Дитерихса. В условиях того, что наша родина порабощена врагами-социалистами, мы являемся последним оплотом русского народа, хранящего в сердцах пламенную любовь к умирающей Родине!\n\nЗемский собор принимает следующее решение:\n«Грамота Амурского Земского собора к русским людям великой Российской земли»: Призываем к национальному единению вокруг владивостокского правительства, дабы Господь даровал единого Державного Вождя великодержавной Русской земле. Вручаем верховную власть династии Романовых, да будет так!\n\nДо прибытия русского Царя во Владивосток и его коронации как действующего Царя Всесибирского и Царя Всероссийского в изгнании регентом будет [ROOT.GetLeader], ранее избранный Воеводой Земского края и Земской рати. На этом Собор завершается."
tram.210.a: "Царь вернётся!"

tram.211.t: "Меркуловы у власти"
tram.211.d: "Богатейшая семья в Приамурье наконец захватила власть в стране, даже путём демократических выборов. Со Спиридоном Меркуловым в качестве президента и Николаем Меркуловым в качестве премьер-министра, оба они с жадностью смотрят на восстановление связей с Японией и расширение своих деловых интересов. Меркуловы стремятся обогатиться, а не претендовать на роль законного правительства Приамурья. Но, возможно, если они будут контролировать всю Россию, они станут ещё богаче и могущественнее."
tram.211.a: "Оставаться во Владивостоке."
tram.211.b: "Мы - законное Российское правительство!"
TRM_MERK_tooltip: "§RМы не сможем расширять нашу территорию и завоевать Россию§!"

tram.212.t: "Заявление Верховного правителя"
tram.212.d: "Сегодня Верховный правитель России Александр Колчак объявил Совету министров, что в ближайшее время планирует распустить Совет Верховного правителя и сформировать новое правительство. Не то чтобы новость была встречена министрами с энтузиазмом, так как многие из них заподозрили неладное. Главные и наиболее обоснованные подозрения возникли, разумеется, у премьер-министра Пепеляева, несмотря на его давнее знакомство и должность премьер-министра в самом первом правительстве Колчака ещё во время Гражданской войны.\n\nУ Колчака не так много вариантов формирования нового правительства, но одно из ключевых решений - удалить из правительства региональных чиновников и заменить их либо более лояльными военными или казаками, либо, напротив, сформировать правительство «народного доверия»."
tram.212.a: "Посмотрим."

tram.213.t: "Напряжённость во Владивостоке"
tram.213.d: "Заявление Колчака, несмотря на его, казалось бы, рутинный характер в политической сфере, похоже, привело к кризису среди министров, что сказалось на общей стабильности страны. Новость о формировании нового правительства навострила уши всего Владивостока, и люди гадают, кто станет новым премьер-министром при Верховном правителе. Кроме того, граждане опасаются вмешательства Японии в решение Колчака. На фоне небольших народных волнений и резкого обострения недоверия к Верховному правителю на улицах снова звучат лозунги свободных и справедливых выборов."
tram.213.a: "Что-то происходит..."

tram.215.t: "Делегация из [FROM.GetName]"
tram.215.d: "Правительство [FROM.GetNameDef] прислало нам иностранную делегацию с просьбой об официальном признании нашего государства законным российским правительством. Режим самопровозглашённого Верховного правителя России может показаться нам нелепым, но если мы чувствуем себя вправе противостоять [219.Owner.GetAdjective]ому правительству в Москве, мы можем формально признать [TRM.GetAdjective]ое государство законным."
tram.215.a: "Мы не должны признавать эту японскую колонию..."
tram.215.b: "Они получат наше признание."

tram.2151.t: "[FROM.GetName] признало Приамурье!"
tram.2151.d: "Мы только что получили известие о том, что [FROM.GetAdjective]ое правительство вероломно признало Владивосток законным российским правительством и открыло посольство. Мы должны стойко противостоять любым угрозам нашей легитимности и принять меры против них!"
tram.2151.a: "Мы должны применить торговые санкции!"
tram.2151.b: "Разорвать все связи с ними!"

tram.2152.t: "Прекращение дипломатических отношений с [FROM.GetName]"
tram.2152.d: "Мы только что получили известие о том, что [FROM.GetAdjective]ое правительство разорвало все связи с нами и прекратило любые дипломатические отношения между нашими странами из-за нашего признания «Владивостокского режима»."
tram.2152.a: "Что мы можем поделать?"

tram.216.t: "[FROM.GetName] отказывается признавать нас"
tram.216.d: "Трусливое [FROM.GetAdjective]ое правительство отказалось признавать нас и отослало нашу делегацию обратно во Владивосток. Посмотрим, что они будут делать, когда сапоги Сибирской армии зашагают по Москве."
tram.216.a: "Это не наша проблема."

tram.217.t: "[FROM.GetName] признало нас"
tram.217.d: "Дружественное правительство [FROM.GetName] признало наше правительство законным российским правительством. Это добавит несколько очков к легитимности Верховного правителя в глазах мирового сообщества."
tram.217.a: "Великолепно!"

tram.218.t: "Суды начинаются"
tram.218.d: "Наша родина, снова разбитая, окровавленная и слабая, и всё по вине таких уродов, как Керенский, Милюков и другие, продавших нашу страну немцам за проклятые рейхсмарки. Но кроме них, страна прогнила насквозь социалистическими идеями, буквально отравляющими воздух, а армия под руководством бездарного Корнилова была просто разрушена. Пора твёрдой рукой навести порядок. Да свершится справедливый и праведный суд!"
tram.218.a: "Прошу всех встать, суд идёт!"

tram.219.t: "Суд над большевиками"
tram.219.d: "Несколько десятков человек, которые нами идентифицированы непосредственно как члены или бывшие члены группы большевиков, также известных как красные, или коммунисты, проходят по делу о государственном перевороте и попытке государственного переворота. Некоторые из них не были пойманы или успели покинуть пределы страны, пока Сибирская армия штурмовала Москву, но некоторые из обвиняемых не смогли избежать правосудия. Итак, обвиняемые по делу Бухарин Н. И., Жуков Г. К., Спиридонова М. А., Рыков А. И. и другие обвиняются в измене Родине, а также в создании нескольких партийных социалистических организаций, ставящих своей целью, как заявлено, установление власти рабочих и крестьян. Тем не менее, фактически эти группы лиц планировали установить свою собственную единоличную власть, уничтожить и разложить армию, поставить под сомнение и подвергнуть остракизму патриотов Родины, у которых ещё есть честь, достоинство и совесть. Суд постановил. Вина вышеупомянутых граждан доказана, решение суда по делам о государственной измене обжалованию и пересмотру не подлежит. Принимая во внимание обстоятельства в виде планов по свержению именно режима А. Ф. Керенского, который также был посмертно объявлен преступником, суд смягчает решение и назначает обвиняемым пожизненное заключение."
tram.219.a: "Достаточно справедливо."

tram.220.t: "Суд над эсерами и меньшевиками"
tram.220.d: "Обвиняемые по делу об антироссийской деятельности, направленной на разрушение государственных устоев, арестовали несколько высокопоставленных лиц, так или иначе связанных с А. Ф. Керенским и так называемой Партией социалистов-революционеров, включая В. М. Чернова, Н. Д. Авксентьева и других. Кроме того, лидеры партии РСДРП, или так называемые меньшевики, которые также так или иначе принимали участие в Петроградском режиме, также проходят по делу. Принимая во внимание прошлые заслуги этих политиков, включая участие в подавлении большевистского путча во время Гражданской войны, а также отстранение от управления страной А. Ф. Керенским, суд вынес следующее решение. Учитывая смягчающие обстоятельства, эти лица..."
tram.220.a: "Невиновны!"
tram.220.b: "Виновны!"

tram.221.d: "Недавнее заседание Совета министров под председательством Верховного правителя было созвано для обсуждения дальнейшего курса действий в отношении Партии социалистов-революционеров, главной причины смуты последних лет и развала России. Провал их реформ, радикализм и революционный террор являются несомненным приговором к полному и немедленному уничтожению всех эсеровских партий, включая остатки НРПР Бориса Савинкова.\n\nОднако народ не может оставаться без иллюзии контроля. В связи с этим было предложено создать марионеточную партию под руководством Георгия Гинса, которая бы «курировала» профсоюзы, сельсоветы и прочие «нежелательные элементы», играя роль оппозиции нашему режиму, но при этом была абсолютно лояльной."


tram.222.t: "Судьба КДП"
tram.222.d: "Несмотря на то, что либеральная партия не отличалась бешеной русофобией, как предыдущие, её лидер Павел Милюков все годы правления Керенского был премьер-министром, то есть, по сути, был главным лицом, допустившим разгул немцев и коррупцию в стране, поэтому его следовало арестовать и судить как преступника, несмотря на весь его патриотизм и что бы он там ни говорил. Сама партия КДП должна перейти в руки... более лояльных людей, таких как Виктор Пепеляев. Однако, может быть, нам стоит избежать прошлых ошибок и запретить всё это гнилое движение либералов?"
tram.222.a: "Арестовать Милюкова и объединить кадетов с партией Пепеляева."
tram.222.b: "Запретить КДП!"
tram.222.c: "Пусть живут..."

tram.223.t: "Судьба НРПР"
tram.223.d: "Борис Викторович Савинков... он мог бы стать очень полезным соратником Колчака на его трудном пути. Однако он выбрал иной путь. Бывший террорист и член Партии социалистов-революционеров создал свою партию, но надо отдать ему должное - он так же сильно, как и Колчак, хотел свергнуть Керенского. Его партия выступала против немцев и против Керенского и стремилась возродить русский народ. Однако он всё же социалист и имеет большие амбиции, и оставлять его на свободе, по меньшей мере, рискованно."
tram.223.a: "Арестовать Савинкова и запретить НРПР."
tram.223.b: "Оставить его в живых, но запретить НРПР."
tram.223.c: "Пусть живут..."

tram.224.t: "Судьба Лавра Корнилова"
tram.224.d: "Русские генералы - люди, с которыми мы плечом к плечу сражались в Гражданской войне, но которые предали Россию ради немецких субсидий. Генерал Корнилов - предатель, погубивший страну и армию. Генералы Врангель и Деникин - его сообщники. К сожалению, последним двум удалось бежать из страны, а генерал Корнилов остался, и теперь он обвиняемый на военном трибунале. Он уже старик, поэтому с ним не будут обращаться так сурово, и суд приговаривает его к высшей мере - расстрелу. Со смертью генерала Корнилова закончится позорная эпоха в истории армии."
tram.224.a: "Конец, которого он заслуживал."

tram.225.t: "Судьба профсоюзов"
tram.225.d: "Петроградский режим под руководством социалиста Керенского, несомненно, изобиловал разного рода профсоюзами, якобы защищающими права рабочих. На самом деле они были рассадниками социализма, большевизма и прочей антирусской ереси. Важнейшим из них был ВЦСПС под руководством меньшевика Лозовского, предателя Родины. Мы можем полностью запретить профсоюзное движение в России, чтобы больше не сталкиваться с забастовками и протестами. Другой вариант - поставить своих людей на высшие должности в этих профсоюзах, а также десоциализировать их, чтобы они отвечали интересам страны. Или мы можем оставить всё как есть в надежде, что таким образом завоюем доверие рабочего класса."
tram.225.a: "Запретить эти движения!"
tram.225.b: "Сделать их проправительственными."
tram.225.c: "Пусть живут..."

tram.226.t: "Конституция России [GetYear] года"
tram.226.d: "Сегодняшний день ознаменовался принятием новой конституции - Конституции Российского государства, в которой были официально закреплены полномочия Верховного правителя России. Вся верховная власть принадлежит Верховному правителю России и назначаемому им Кабинету Совета министров. Кроме того, будет учреждена Государственная дума, обладающая законодательными функциями, но любой законопроект до его принятия должен быть одобрен Верховным правителем России. Кроме того, устанавливается и порядок прекращения полномочий Верховного правителя России - в случае тяжёлой болезни, смерти или отставки его должность займёт глава Совета министров до созыва специального собрания, на котором будет избран новый Верховный правитель."
tram.226.a: "Начинается новая российская эра!"

tram.227.t: "Выборы в новое Учредительное собрание"
tram.227.d: "Сегодня переходное правительство России официально объявило, что выборы в предстоящее Учредительное собрание состоятся через два месяца с целью окончательного восстановления мира, стабильности и процветания в стране.\n\nПосле недавних бурных событий многие политические партии сейчас восстанавливаются и готовятся выдвинуть своих кандидатов. Однако всем очевидно, что [TRM.GetLeader] и [TRM.GetRulingParty] не позволят этим выборам пройти каким-либо образом, угрожающим их интересам."
tram.227.a: "Будем надеяться, что очередные выборы не разрушат страну."

tram.228.t: "Вопрос о левых партиях"
tram.228.d: "Одним из важнейших вопросов, который продолжает решать наше переходное правительство, является вопрос о левых политических партиях. Единогласно определено, что партии, принимавшие участие в революционных событиях, не имеют права на восстановление - в первую очередь это относится к так называемому Народному фронту. Профсоюзы, сельские советы, фабрично-заводские комитеты и другие революционные организации также были включены в это решение. Однако особое внимание было уделено Партии социалистов-революционеров, которая не участвовала в Народном фронте, но остаётся левой силой, хотя и на крайне левом фланге, в контексте современной России.\n\nБолее того, именно так называемые правые эсеры были ответственны за Колчаковский переворот и широкое недовольство среди казаков, которые твёрдо верят, что эсеры лишат их прав. Этим событиям нельзя позволить повториться вновь.\n\nОднако народ не может оставаться без иллюзии контроля. В связи с этим было предложено создать марионеточную партию под руководством Георгия Гинса, которая бы «курировала» профсоюзы, сельсоветы и прочие «нежелательные элементы», играя роль оппозиции нашему режиму, но при этом была абсолютно лояльной."
tram.228.d2: "Одним из важнейших вопросов, который продолжает решать наше переходное правительство, является вопрос о левых политических партиях. Единогласно определено, что партии, принимавшие участие в революционных событиях, не имеют права на восстановление - в первую очередь это относится к так называемому Народному фронту. Профсоюзы, сельские советы, фабрично-заводские комитеты и другие революционные организации также были включены в это решение. Однако особое внимание было уделено Партии социалистов-революционеров, которая не участвовала в Народном фронте, но остаётся левой силой, хотя и на крайне левом фланге, в контексте современной России.\n\nВ течение первых недель правления Пепеляева было достигнуто соглашение с Народно-революционной армией и Политическим центром, и эсеры вошли в правительство Пепеляева, хотя и без портфелей. В связи с этим наш лидер убеждён, что стоит оставаться верным идеалам и обещаниям, данным народу..."
tram.228.a: "Новая национальная партия для представления левых избирателей."
tram.228.c: "Поддержать объединение эсеров под руководством Политцентра."
tram.228.b: "Без сомнений - запретить, запретить, запретить!"

tram.229.t: "Судьба НРПР"
tram.229.d: "Одной из самых заметных партий межвоенного периода была, несомненно, Народно-республиканская партия, основанная Савинковым, бывшим эсером и террористом. Она быстро стала значительной политической силой, привлекая многочисленные националистические элементы внутри страны. Однако незадолго до окончательной победы нашего правительства эта партия распалась, и Савинков исчез со сцены.\n\nНесмотря на эту неудачу, многие националисты остаются разделёнными и недовольными, хотя видят новое серьёзное объединительное движение, исходящее с Дальнего Востока под руководством Анастасия Вонсяцкого."
tram.229.a: "Попытаться сплотить националистов под знамёнами Вонсяцкого."
tram.229.b: "Оставить их в покое."

tram.230.t: "Офицеры лоббируют монархию"
tram.230.d: "Перспектива восстановления монархии приобрела неожиданную степень важности в предстоящем Учредительном собрании. Для начала, значительная часть наших военачальников, многие из которых либо казаки, либо связаны с ДВСВ, активно продвигают это видение совместно с консервативными монархистами и правыми либералами. Они уверены, что их шансы на успех на этих выборах высоки, особенно если наше правительство примет активно монархическую позицию.\n\nОднако, напротив, республика остаётся единственным жизнеспособным вариантом для дальнейшего существования нашей нации, несмотря на бурные обстоятельства."
tram.230.a: "Монархия пала и никогда не возродится."
tram.230.b: "Без Царя Россия не вернётся на путь стабильности."

tram.231.t: "Обеспокоенность по поводу федеративного устройства"
tram.231.d: "Переходное правительство уделяло особое внимание вопросу о федеративном устройстве государства, которое было принято на предыдущем Учредительном собрании. В то время левые демократы и социалисты решительно выступали за это решение, добившись значительного большинства. Однако их влияние ослабло, а сторонники единой и неделимой России набирают всё большую силу. Это ставит нас перед важным выбором - но готовы ли мы оттолкнуть те меньшинства, которые мы надеемся включить в наше видение Великой России?"
tram.231.a: "Россия едина и неделима."
tram.231.b: "Россия - федерация под руководством русского народа."

tram.232.t: "Исполнительная власть"
tram.232.d: "Вопрос об исполнительной власти в последнее время занимает умы избираемых в Учредительное собрание. Идея поставить одного человека во главе такой огромной и разнообразной страны неизбежно вызывает опасения по поводу тирании, диктатуры и необходимости парламентского контроля над президентством - подобно положениям Российской Конституции 1920 года, но с большим упором на парламентские сдержки и противовесы.\n\nС другой стороны, существует мнение, что парламенты могут быть по своей сути нестабильными и трудно контролируемыми, движимыми стремлением к власти. Такое решение не лишено своих проблем."
tram.232.a: "Единоличная власть будет только вредна для нации."
tram.232.b: "Только власть одного человека, подчиняющаяся парламентскому надзору, может спасти Россию."

tram.233.t: "Третье Учредительное собрание"
tram.233.d: "И вот Третье Учредительное собрание подходит к концу. Избранные делегаты приняли все важнейшие решения, и на этот раз никакие потрясения не омрачат Россию. Мы должны с гордостью нести решения Учредительного собрания и приступить к строительству новой России."
tram.233.a: "Да здравствует Российская Империя!" #monarchy
tram.233.b: "Да здравствует Российская Федеративная Республика!" #federal
tram.233.c: "Да здравствует Российское государство!" #unitary

tram.234.t: "Отставка [TRM.GetLeader]?"
tram.234.d: "Конечной целью [TRM.GetLeader] с момента его прихода к власти было восстановление порядка в России, пока страна наконец не освободится от слишком большого горя, которое на неё обрушилось. Теперь, когда Смута близится к концу, народ должен принять новое лицо у власти, если [TRM.GetLeader] считает, что он сделал всё, что мог на данный момент."
tram.234.a: "Его долг выполнен. Пусть он служит Родине иначе."
tram.234.b: "Его долг не закончен, пока вся Россия не будет свободна!"

tram.235.t: "Вопрос о сибирской автономии"
tram.235.d: "Движение сибирских областников давно мечтало об автономной Сибири, независимой от московских властей и способной самостоятельно управлять собой, пусть и ограниченно. Наши обещания регионалистам должны быть выполнены, но у нас всё ещё есть возможность оставить эти дикие земли под более централизованным контролем."
tram.235.a: "Выполнить наши обещания областникам."
tram.235.b: "Обеспечить, чтобы они оставались лишь философами на обочине."

tram.236.t: "Екатеринбургское расследование"
tram.236.d: "В России есть раны, которые никогда не затягивались, и среди них ни одна не гноится глубже, чем судьба Императорской семьи. В хаосе 1918 года, когда фронты смещались, а власть рассыпалась на осколки, вопрос о том, что стало с императором Николаем II и его семьёй, оставался неопределённым. Ходили разные слухи о судьбе заложников в Екатеринбурге, но новость о казни Царя стала известна почти сразу, так как большевики с гордостью признали это. Однако подробности о судьбе остальных членов его семьи оставались неизвестны. Только после того, как белые силы захватили Екатеринбург, Колчак поручил эту задачу человеку, который не терпел двусмысленности: Михаилу Константиновичу Дитерихсу. Работая вместе со следователем Николаем Соколовым всего несколько месяцев, Дитерихс обнаружил улики, собранные в Ипатьевском доме, показания и мрачные следы, найденные на Ганиной Яме. Император, Императрица, их дети и верные слуги - все были жестоко казнены. Казнены по преднамеренному приказу из Москвы.\n\nСами тела были осквернены, уничтожены втайне, их останки сожжены и разбросаны в попытке уничтожить любые улики. Правительство эсеров в начале 1920-х годов, столкнувшись с неопровержимыми доказательствами, якобы оказало давление на Верховный суд, чтобы тот не инициировал судебный процесс, который, как они полагали, мог повлиять на общественное мнение об их собственном правительстве. Поступок, который Дитерихс безоговорочно классифицировал как государственную измену."
tram.236.d.RUS: "Вопрос о судьбе бывшего императора уже давно преследует судьбу России. В 1918 году, после захвата Екатеринбурга антибольшевистскими силами, под руководством генерала Михаила Дитерихса было начато расследование. При содействии следователя Николая Соколова комиссия собрала обширные доказательства, касающиеся гибели Николая II и его семьи. Их выводы утверждали, что бывший император вместе с его ближайшими родственниками и слугами был казнён по приказу большевистских властей, и что были предприняты усилия по уничтожению останков. В последующие годы последовательные правительства отказывались инициировать официальный судебный процесс относительно судьбы Романовых. По сей день не было проведено ни одного всестороннего суда или государственного обвинения. Хотя эсеровские правительства дорого заплатили за этот отказ, поскольку монархические круги утверждают, что правосудие было принесено в жертву политической целесообразности, выводы комиссии Соколова-Дитерихса пока остаются лишь вопросом истории и интерпретации."
tram.236.a: "Правда была найдена, но правосудие для мучеников было отвергнуто."
tram.236.b: "Некоторые истины больше разделяют, чем объединяют."

# new event chain for post-Kolchak

tram.237.t: "Правительство без правителя"
tram.237.d: "Смерть адмирала Александра Колчака оставила после себя пустоту. Теоретически власть Верховного правителя была абсолютной. На практике же она давно уже распылилась, растянувшись по министрам, командирам, городским думам и иностранным покровителям. Теперь, с исчезновением центра, иллюзия единства начала рассеиваться с пугающей быстротой. Во Владивостоке Совет министров под руководством Виктора Пепеляева взял на себя временную власть, ссылаясь на преемственность и необходимость. Сам Пепеляев, верный слуга Колчака и человек умеренного нрава, не имеет ни воли, ни средств, чтобы установить безусловный контроль. Однако по ту сторону города поднялся ещё один голос.\n\nНародное собрание - долгое время терпимое как совещательный орган, любопытный эксперимент в корпоративном представительстве - отказалось оставаться сторонним наблюдателем. Состоящее из непрочной коалиции областников, националистических кругов и политических союзов, оно теперь претендует на то, чтобы воплощать волю Приамурья в отсутствие верховной власти. Его лидеры утверждают, что с уходом Верховного правителя суверенитет должен вернуться к нации, или по крайней мере к тем, кто заявляет, что говорит от её имени. Во главе этого движения стоят Спиридон Меркулов и Николай Меркулов, чья давно укоренившаяся политическая машина во Владивостоке не теряла времени даром, мобилизуя поддержку. При тихой поддержке японских интересов Меркуловы превратили Городскую думу в соперничающий центр власти. В результате во Владивостоке заговорили две власти.\n\nЗа пределами города ситуация с каждым часом становится всё более шаткой, поскольку атаман Григорий Семёнов наблюдает из Читы, имея нетронутые силы и нескрываемые амбиции."
tram.237.a: "Собрание должно взять на себя ответственность за нацию."
tram.237.b: "Правительство должно превыше всего удерживать порядок."

TRM_side_of_merkulovs: "Мы примем сторону §cбратьев Меркуловых§!, что, возможно, даст Народному собранию следующие возможности:\n £white_dot избрать новое правительство;\n £white_dot передать власть §gатаману Семёнову§!;\n £white_dot или передать её более §Vрадикальным§! §Fдвижениям§!."
TRM_side_of_pepelyayev: "Мы примем сторону §PСовета министров§!, что, возможно, даст Виктору Пепеляеву следующие возможности:\n £white_dot назначить §6Анатолия Пепеляева§! Верховным правителем;\n £white_dot призвать на помощь §nМихаила Дитерихса§!."

tram.238.t: "Атаман выступает"
tram.238.d: "Вскоре после смелого заявления Народного собрания о власти с Запада пришли новости: атаман Григорий Семёнов объявил о своей поддержке Собрания и приказал своим казакам двигаться на восток. Его поезда, гружёные казачьими отрядами и верными офицерами, теперь грохочут по Транссибирской магистрали к Жемчужине Тихого океана. Хотя Семёнов и союзник, прибытие таких сил рискует омрачить хрупкую власть городского гражданского правительства и вызвать потенциальный партизанский террор в Забайкалье. Его промедление могло бы позволить Собранию укрепить власть.\n\nДругой проблемой для Собрания являются каппелевцы, которые внимательно следят за ситуацией как из самого Владивостока, так и из порта Николаевска, видя в этом хаосе возможность; бездействие может позволить радикалам захватить власть."
tram.238.d2: "Когда после смерти Колчака его правительство решительно двинулось на роспуск политической машины братьев Меркуловых, с Запада пришло открытое неповиновение. Атаман Григорий Семёнов объявил правительство нелегитимным и двинулся на Владивосток. Его эшелоны с казаками и верными офицерами уже пересекают сибирские равнины, приближая их к столкновению. Хотя Совет министров меньше всего хочет рисковать гражданской войной внутри остатков белых сил, позволить Семёнову пройти - значит рисковать потерей всякой власти.\n\nМы должны действовать, чтобы устранить эту неопределённость, поскольку каппелевцы, другая фракция Сибирской армии, ждут возможности установить сильную, дисциплинированную руку над городом - и Верховного правителя, чтобы объединить раздробленное государство."
tram.238.a: "Попытаться вести переговоры и задержать продвижение Семёнова."
tram.238.b: "Заблокировать орду атамана в Благовещенске."
tram.238.c: "Пропустить его с доброй волей."

TRM_semyonov_will_coup: "Переворот §gатамана Семёнова§! практически гарантирован."
TRM_diterikhs_will_coup: "Переворот §nгенерала Дитерихса§! практически гарантирован."

tram.239.t: "Переговоры с атаманом"
tram.239.d: "Лидеры Собрания быстро двинулись, чтобы утвердить свою власть, не желая позволять даже лояльному военному деятелю омрачить их хрупкое правление, как только узнали о выступлении Семёнова. В серии напряжённых переговоров братья Меркуловы и их союзники приблизились к авангарду Семёнова. Они заверили атамана, что в знак признания его службы на посту заместителя Верховного главнокомандующего при покойном Колчаке он примет на себя роль Верховного командующего Сибирской армией. Кроме того, его должность военного губернатора Забайкалья будет оформлена официально, что даст ему политическое влияние на местное управление и автономию в военных вопросах. Традиционные привилегии для его казаков также были подтверждены. Семёнов принял эти заверения, хотя хорошо знал, что обещания могут быть отозваны и что власть без людей и оружия хрупка. В то время как областники, казалось, поддержали новое положение вещей, националисты колебались, поскольку если они выберут поддержку Семёнова вместо своих давних союзников - младороссов, то могут потерять потенциальный шанс на власть."
tram.239.a: "Собрание поддерживает новое положение вещей."
tram.239.b: "Младороссы пользуются хаосом, чтобы захватить власть."

tram.240.t: "Власть атамана"
tram.240.d: "Поскольку атаману Григорию Семёнову позволили продвигаться без сопротивления, его силы прошли через восточные провинции, и сам Владивосток приготовился к прибытию. Оказав минимальное сопротивление, Семёнов вошёл в город в сопровождении верных офицеров и отряда казаков, жаждущих увидеть власть, восстановленной по их образу. Он не терял времени, утверждая свою позицию: сочетая запугивание, военное присутствие и апелляцию к чувству преемственности Собрания, он потребовал официального признания себя новым Верховным правителем Приамурья.\n\nСобрание, столкнувшись с демонстрацией подавляющей силы и неявной угрозой вооружённого противостояния, имело мало выбора. Неохотно оно издало официальный указ, признающий власть Семёнова. Хрупкое гражданское управление превратилось в личный домен атамана, были посеяны семена будущего конфликта с лоялистами ДВСВ и Дитерихсом - неизбежного столкновения, которое определит ближайшие месяцы."
tram.240.a: "Атаман Семёнов возглавляет Приамурье!"

tram.241.t: "Благовещенское противостояние"
tram.241.d: "Когда атаман Семёнов приблизился к Благовещенску, он обнаружил, что ворота города наглухо заперты. Верные Пепеляеву сибирские полки, лояльные Совету министров, отказались пропускать его колонны. Переговоры балансировали на грани вооружённого конфликта: Семёнов требовал признания, но Совет министров настаивал, что верховная власть в Приамурье не может быть захвачена силой. В этот решающий момент Совет действовал и провозгласил Анатолия Пепеляева новым Верховным правителем - фигурой, уважаемой среди многих сибирских полков. Чтобы обеспечить выполнение этого решения, Совет призвал Михаила Дитерихса и лоялистов ДВСВ. Верный своему благородному характеру и чувству долга, лоялисты Дитерихса прибыли во Владивосток, чтобы поддерживать закон, защищать порядок и обеспечить легитимность нового Верховного правителя. Народное собрание, прибывшее протестовать или утверждать свою власть, обнаружило, что ему запрещён вход в собственные залы, бессильное сопротивляться без вооружённой поддержки казаков.\n\nСтолкнувшись с реальностью блокады, атаман отступил, по крайней мере на данный момент, оставив новое правительство без вызова."
tram.241.a: "Генерал Пепеляев возглавляет Приамурье!"

tram.242.t: "Дитерихс восходит во Владивостоке"
tram.242.d: "Поезда атамана Григория Семёнова грохотали по направлению к Владивостоку, но новости достигли его слишком поздно: судьба города уже изменилась. За кулисами Михаил Дитерихс действовал решительно с дисциплинированными силами ДВСВ, находившимися под его командованием, усиленными верными чехословацкими легионерами и поддерживаемыми крупными контингентами Сибирской армии, всё ещё расквартированной по всему Дальнему Востоку.\n\nВ ходе быстрой и контролируемой операции Народному собранию было запрещено входить в свои залы, что не позволило ему предотвратить установление власти Дитерихса. Старое колчаковское правительство, признав как его силу, так и неизбежность событий, добровольно ушло в отставку, успокоенное обещанием Дитерихса созвать Земский собор, который установит новую, легитимную власть. Хотя силы Семёнова приближались с запада, они замешкались, услышав об успехе Дитерихса. Пока атаман отступил, но его амбиции однажды обязательно столкнутся с новым порядком Дитерихса."
tram.242.a: "Порядок восстановлен."

tram.243.t: "Созыв Земского собора"
tram.243.d: "После восстановления порядка во Владивостоке Михаил Дитерихс обратился к более старой и, по его мнению, более чистой традиции русской государственности. По окончательному постановлению уходящего Совета министров началась подготовка к созыву Земского собора - собрания, не виданного в его истинном виде со времён далёких веков, предшествовавших реформам Петра Великого. Во времена испытаний, когда судьба нации была неопределённой, такие соборы созывались, чтобы дать голос не партийным интересам, а совести самой земли. Принципы его состава были разработаны с намеренной тщательностью: выборов в современном смысле не будет. Вместо этого представительство будет следовать древнему сословному порядку. Таким образом, приглашения были разосланы по всему Приамурью и за его пределы. Бывшие члены Совета министров и ныне распущенного Народного собрания призваны присутствовать. Духовенство со всего Дальнего Востока, наряду с представителями старообрядцев и мусульманских общин, должны занять своё место среди делегатов. Армия и флот будут представлены назначенными офицерами, а также казачьими атаманами, включая триумвират Семёнова, Гамова и Калмыкова. От городов прибывают делегаты городского самоуправления, домовладельцы и торговые круги. От сельской местности - сельские старосты и волостные представители. Купцы, промышленники и несоциалистические организации получают свой голос, как и русские общины КВЖД и высшие учебные заведения. Даже профсоюзы включены. Ожидается, что всего соберутся сотни человек, каждый как представитель своего сословия.\n\nОднако регламент Собора недвусмыслен: Партия социалистов-революционеров и их союзники, наряду со всеми интернационалистскими социалистическими движениями, не допускаются к участию. Те, кто, по мнению многих, принёс России разорение, раскол и цареубийство, признаны недостойными говорить от её имени."
tram.243.a: "Земля призвана говорить."

tram.244.t: "Открытие Земского собора"
tram.244.d: "Первый день Земского собора наступил в торжественном величии. Делегаты со всего Приамурья и Дальнего Востока собрались во владивостокском соборе, где архиепископ Киприан освятил proceedings молитвой, каждением и древними песнопениями Русской церкви. Первая сессия началась и завершилась повторяющимся возгласом «Царю Небесный». Приветственные речи произнесли члены бывшего Совета министров, уважаемые священнослужители и старшие офицеры. Делегаты соблюдали протокол с торжественным вниманием, сознавая, что решения, принятые здесь, сформируют будущее Русской земли и сохранение её традиций. Участники избрали Никандра Миролюбова, учёного профессора истории и права, председателем Собора. Собрание также увидело формирование Комитета монархических организаций Дальнего Востока (КМОДВ), призванного объединить все монархические голоса не только с Дальнего Востока, но и со всей России; комитет должен координировать обсуждение, разрабатывать предложения и служить единым голосом.\n\nХотя в первый день не было сделано никаких официальных провозглашений, цель Собора была ясна всем: восстановление монархии, воссоздание священной власти и укрепление роли сословий в управлении."
tram.244.a: "Земский собор открывает свою работу в торжественной молитве и единстве."

tram.245.t: "Решения Земского собора"
tram.245.d: "В последний день Земского собора собрание приступило к самому весомому делу своего мандата: утверждению наследственного суверенитета России и определению верховной власти в дальневосточном регионе. После торжественных молитв и песнопений в соборе делегаты обсудили первые тезисы, предложенные генералом Михаилом Дитерихсом, отражающие убеждения верных и лояльных подданных Амурского края.\nТезис 1: Права на осуществление Верховной власти в России принадлежат династии ДОМА РОМАНОВЫХ (Голосов: 482 за / 18 против.)\nТезис 2: Необходимо и соответствует желанию населения, чтобы национальную Государственность Амурского края возглавил Верховный правитель из членов династии ДОМА РОМАНОВЫХ, указанной для этой цели династии (Голосов: 471 за / 29 против.)\n\nРезультаты были ясны: Земский собор подавляющим большинством утвердил священную роль династии Романовых как законных обладателей русского престола. Когда обсуждение перешло к вопросу о том, кого именно пригласить, генерал Дитерихс обратился к собранию с суровой откровенностью. Старшие кандидаты, такие как великий князь Кирилл Владимирович и великий князь Дмитрий Павлович, были широко известны, но, по оценке Дитерихса, скомпрометированы прошлыми связями с движением младороссов и, в случае Кирилла, его односторонним провозглашением императорского титула в 1920-х годах, предпринятым без совета с законным Земским собором, а также политическим оппортунизмом и публичным актом предательства в революционные годы. Вместо этого Дитерихс обнародовал переписку с князем Никитой Александровичем, третьим сыном великого князя Александра Михайловича и великой княгини Ксении Александровны, племянником мученически погибшего императора Николая II. Находясь в изгнании в [CAN.GetName], пережив судьбу большей части своей семьи, князь Никита представлял, по мнению Дитерихса, преемственность, благочестие и легитимность, необходимые для восстановления монархии. Хотя Собор выразил полную поддержку этому выбору, приглашение было намеренно отложено до установления стабильной власти на дальневосточных землях."
tram.245.a: "Историческая победа будет нашей, ибо с нами Бог!"

tram.246.t: "Торжественная присяга Земского воеводы"
tram.246.d: "Великий собор Владивостока был заполнен собранием Амурского Земского собора. Делегаты со всех уголков дальневосточных земель - епископы, духовенство, старообрядцы, военные офицеры, атаманы казачьих войск, сельские старосты, купцы и гражданские представители - стояли в тишине. Взоры верных и преданных были устремлены на центральную трибуну, где генерал Михаил Константинович Дитерихс, новоназначенный Земский воевода, готовился принять на себя свои торжественные обязанности. Сделав шаг вперёд, он поднял правую руку над раскрытым Святым Евангелием.\n\n«Обещаю и клянусь Всемогущим Богом перед Святым Его Евангелием и Животворящим Крестом Господним, - провозгласил генерал, - что принимаю руководство Дальневосточным временным правительством, во время смут и неустройств народных, с единой мыслью о благе и пользе всего населения Амурского края, дабы сохранить его как достояние государства Российского. Не ища и не преследуя никаких личных выгод, обязуюсь положить все силы своего разума и самую жизнь свою на высокое и ответственное служение нашей родине, памятуя, что во всём, что я буду делать как Правитель, я должен буду дать ответ Царю Русскому и Земле Русской».\n\nЭто была великая церемония, обязательство перед Богом и нацией. В тот миг Дитерихс воплотил в себе единство военного командования, гражданской власти и нравственного попечения о дальневосточных землях. Колокола собора зазвонили, словно знаменуя рассвет новой главы в непреходящей истории Святой Руси."
tram.246.a: "С верой в милость Божию к нам поведу народ."

tram.247.t: "Приходское самоуправление"
tram.247.d: "С торжественного благословения Земского собора генерал Михаил Дитерихс начал реорганизацию государственного управления на дальневосточных землях. Церковные приходы были объявлены основными единицами местного самоуправления, каждый во главе со священником и председателем приходского совета, избираемым по жребию в подражание апостольской традиции, уповая, что Сам Бог направит выбор достойных.\n\nДелегаты от каждого прихода вместе с представителями профсоюзов, казачьих войск и сельских самоуправлений должны были собраться в Земской думе - новом совещательно-законодательном органе, призванном объединить регион под законным и упорядоченным управлением. Реформа была тщательно разработана, чтобы предотвратить злоупотребления революционной партийной политикой: никакие социалисты, интернационалисты и партийные представители не допускались к участию, что гарантировало, что воля народа будет выражаться через его сословия и общины, а не через фрагментированные партийные списки и бюрократические манипуляции.\n\nКупцы, сельские старосты и казачьи атаманы единодушно признали в этой системе возвращение к истинному принципу местной ответственности и инициативы, поскольку реформа уменьшала бремя государственной бюрократии, восстанавливала широкое самоуправление и утверждала древнюю мудрость, что сам народ, действуя по совести и преданности земле, лучше всего способен направлять свои общины. Первые приходские советы уже были созваны и избрали своих делегатов."
tram.247.a: "С верой в Божье руководство народ будет управлять собой сам."

tram.248.t: "Смертная казнь"
tram.248.d: "С момента формирования Земской рати генерал Михаил Дитерихс боролся с вопросом о наказаниях. Он презирает репрессии и считает смертную казнь пятном на чести любой праведной военной или гражданской власти. Однако русские земли ещё не полностью освобождены, и враги Святой Руси остаются угрозой. На совете со своими ближайшими советниками, Викторином Молчановым и Григорием Вержбицким, Дитерихс размышлял о цене каждой жизни, отнятой во имя государственной власти. Он обдумывал, какой сигнал это пошлёт и союзникам, и врагам: что Дальневосточным регионом управляет не страх, а моральное убеждение. Но он также понимал, что отказ от высшей меры может ободрить предателей и поставить под угрозу хрупкий порядок, который он поклялся сохранить."
tram.248.a: "Сохранить смертную казнь до полного освобождения России."
tram.248.b: "Отменить смертную казнь немедленно!"

tram.249.t: "Освящённый собор Церкви"
tram.249.d: "Наряду с Земским собором во Владивостоке собралось второе собрание: Церковный собор, созванный из высших иерархов Русской православной церкви и духовенства дальневосточных епархий, призванный быть верховным религиозным голосом Русской земли. Когда Собор собрался, духовенство говорило о грехе, покаянии и Божественном порядке. Революция была описана не как простое потрясение власти, а как наказание за предательство священной клятвы в 1917 году, когда народ России оставил своего Богом помазанного Государя. Из этого греха, заявили они, проистекли разорение, страдания и порабощение Святой Руси. Собор ясно провозгласил, что единственный способ возродить великую, сильную и свободную Россию - это восстановить в ней монархию. Восстановление дома Романовых было представлено как акт национального покаяния, возвращение к Божественному завету между Царём, Церковью и народом.\n\nВ соответствии с новым порядком амбициозной реформы приходского самоуправления Собор призвал всех прихожан, независимо от сословия, объединиться вокруг Церкви. Торжественные богослужения проводились под монархическими знамёнами, иконы проносились в крестных ходах, и молитвы открыто возносились о здравии и будущем царствовании Никиты Александровича, который теперь открыто почитался как избранный носитель династической преемственности. В своём заключительном соборном послании Церковный собор призвал верных готовиться к восстановлению Государя и стоять в готовности принести ему присягу на верность, когда придёт время."
tram.249.a: "В вере, покаянии и единстве Россия будет восстановлена."

tram.250.t: "Атаманы и приходская реформа"
tram.250.d: "На казачьих землях Забайкалья и Приамурья введение приходского самоуправления не обошлось без колебаний. Веками станица и атаман были естественными центрами власти, объединяя военную, гражданскую и общинную жизнь в единую структуру. Теперь, когда церковные приходы были возведены в ранг основных единиц управления, некоторые атаманы начали задаваться вопросом, не подрывается ли их традиционная власть тихо. Хотя реформа формально не отменяет казачьи институты, она вводит параллельную структуру, которая подчиняется не Войску, а новому Земскому порядку.\n\nДелегации казачьих старейшин обратились к администрации с просьбой разъяснить: остаётся ли приход всего лишь территориальной единицей, или же он постепенно заменит власть Войска?"
tram.250.a: "Уважать традиции Войск и заверить атаманов."
tram.250.b: "Приход превыше всего."

tram.251.t: "Воля Божья или воля человеческая?"
tram.251.d: "По деревням Приморья начали формироваться первые приходские советы. В соответствии с реформой их председатели избираются не голосованием, а по жребию - древняя практика, вдохновлённая самими апостолами. Для некоторых это принесло тихую веру в то, что в вытягивании жребия Сам Бог открывает достойных. Однако другие менее уверены: в нескольких приходах крестьяне и местные старейшины задаются вопросом, может ли случай действительно заменить мудрость общинного суждения. Уже появились случаи, когда были избраны люди с малой репутацией или способностями, в то время как более уважаемые фигуры остались в стороне."
tram.251.a: "Довериться воле Божьей - жребий не подлежит обжалованию."
tram.251.b: "Общины могут сами направлять исход."

tram.252.t: "Города и сословия"
tram.252.d: "Во Владивостоке и крупных городах Дальнего Востока купцы, промышленники и городские ассоциации приняли своё место в новом Земском порядке, но некоторые из них тихо сетуют на отсутствие политической организации. При старой системе партии обеспечивали средство координации и влияния. Теперь, когда представительство привязано к сословиям и профессиям, а не к программам, городские элиты обнаруживают, что делят власть с сельскими старостами, духовенством и казаками. Те, кто против этого, опасаются, что новая Земская дума размоет экспертизу и экономическое лидерство, отдав управление государством в слишком много неопытных рук."
tram.252.a: "Мы не вернёмся к коррумпированным политическим машинам."
tram.252.b: "Предоставить городам более сильный и организованный голос."

tram.253.t: "Первая Земская дума"
tram.253.d: "Во Владивостоке первая Земская дума собралась в торжественном порядке. Делегаты от приходов, казачьих войск, городских сословий и сельских общин собрались как части единого целого, каждый сознавая свой долг перед Богом и Землёй. Приходская реформа пустила корни с удивительной твёрдостью. Открытие сессии было отмечено молитвой и дисциплиной, и хотя различия оставались под поверхностью, Дума предстала такой, какой и задумывалась: живым выражением единого народа, связанного верой и долгом. Впервые со времён Смуты казалось, что Россия, хотя и сократившаяся до далёкой окраины, вновь обрела принцип соборного единства."
tram.253.d2: "Во Владивостоке первая Земская дума собралась с тихой неуверенностью. Делегаты прибыли от приходов, казачьих земель и городов, но единство, задуманное Земским собором, оказалось несовершенным. В одних регионах приходская реформа укоренилась, в других сомнения по поводу местной власти сохранялись. Открытие сессии было отмечено молитвой и дисциплиной, и хотя различия были очевидны, особенно в видении того, как должно достигаться единство русского народа."
tram.253.d3: "Первая Земская дума собралась во Владивостоке в напряжённых и неопределённых обстоятельствах. По всей сельской местности приходская реформа дала неравномерные результаты, породив делегатов сомнительной легитимности. Казачьи войска в основном бойкотировали «выборы», а в самом Владивостоке купцы и ассоциации оказались ограничены системой, которой они не вполне доверяли. Делегаты собрались, но ещё не сформировали единую волю."
tram.253.a: "Земская дума стоит как голос Земли."

tram.254.t: "О вопросе безбожников"
tram.254.d: "Среди многих резолюций, принятых Земским собором, одна выделялась как своей суровостью, так и двусмысленностью: указ о том, что те, кто отвергает веру - те, кто находится вне духовной жизни нации - подлежат высылке. На практике это постановление приняло более сдержанную форму. Считающиеся безбожниками не высылаются массами с Дальнего Востока, но они исключаются из приходской жизни, а вместе с ней - из участия в местном самоуправлении и более широком политическом порядке. Таким образом, их тихо оттесняют на обочину общества.\n\nОднако в определённых кругах - среди радикального духовенства, среди ревностных офицеров и в рядах самых преданных - раздаются призывы придать указу более буквальное значение. Они утверждают, что возрождение «России Христовой» невозможно, пока безверие просто терпится. Умеренные, однако, предупреждают, что такие меры приведут к беспорядкам и нарушат экономическую жизнь."
tram.254.a: "Вера восторжествует без излишеств."
tram.254.b: "Усилить меры против безбожников."

tram.255.t: "Консолидация национального монархического движения"
tram.255.d: "В продолжение работы Амурского Земского собора генерал Михаил Дитерихс созвал первое заседание Комитета монархических организаций Дальнего Востока (КМОДВ) как руководящего органа национального монархического движения. От Владивостока до отдалённых казачьих станиц представители монархических кругов собрались, чтобы скоординировать усилия и объединить свою борьбу против революционных и социалистических сил. Съезд национального движения поставил чёткие цели: консолидировать все антисоциалистические силы под лозунгами Земского собора; укрепить моральный и практический авторитет Земского воеводы как в гражданских, так и в военных вопросах; и вовлечь более широкие массы населения в антиреволюционную борьбу через пропаганду, гражданскую работу и публичные демонстрации лояльности России и Вере. КМОДВ также учредил Съездовский совет, состоящий из членов Земского собора и пятнадцати избранных делегатов от национального движения, ответственный за руководство местными ассоциациями и координацию общественной работы в соответствии с указами Воеводы.\n\nСобрание завершилось смелой декларацией: Дальний Восток послужит ядром единого национального движения, инструментом возрождения Святой Руси и маяком порядка и верности для всех монархистов - как в изгнании, так и на родине."
tram.255.a: "Дальний Восток объединит монархическое дело."

tram.256.t: "Японцы обращаются к новому руководству"
tram.256.d: "Возвышение [ROOT.GetLeader] было встречено японскими представителями в Хабаровске с осторожностью. С Семёновым было легко заключать сделки, так как этот человек совершенно бесхребетный, без каких-либо моральных качеств. И великий адмирал понимал давление и своё деликатное положение. Но [ROOT.GetLeader] - человек огромной решимости и моральной стойкости, и такие люди не будут столь же гостеприимны в делах с иностранными державами.\n\nПоэтому была быстро организована встреча между генералом Ои Сигэмото и [ROOT.GetLeader] с целью получить от нового русского сильного человека подтверждение более ранних сделок, принятых Колчаком. [ROOT.GetLeader] всегда был противником предоставления японцам слишком многих уступок и считал такое поведение потенциально предательским, но даже при этом он признаёт, что японская материальная поддержка важна для нашей боеспособности."
tram.256.a: "Продолжать сделки с ними без энтузиазма."
tram.256.b: "Уменьшить нашу зависимость от японцев."
tram.256.c: "Изгнать их с наших земель!"

tram.257.t: "Хунхузы"
tram.257.d: "Хунхузы, или хунхузы, - это выносливые разбойники, которые зарабатывают на жизнь в суровом русско-маньчжурском пограничье. Эти банды бандитов были обычным шипом в боку как для цинской, так и для русской администраций, но для атамана Семёнова они являются на удивление полезным ресурсом.\n\nВ 1920-х годах многие банды хунхузов развились дальше, постепенно становясь местной военной силой, иногда против, а иногда за Чжан Цзолиня. Они были реальным законом на границе, и их грабежи, контрабанда и нелегальные горные работы приносили им значительные деньги. Однако после того, как режим Чжан Цзолиня начал лучше контролировать границы, многие были вытеснены ещё дальше на север - и в конце концов нашли путь в Войско Семёнова, получая плату добычей и золотом.\n\nНесмотря на общую ненависть к этим китайским наёмникам, Семёнов странно привязался к ним, часто сравнивая их с казаками в более выгодном свете."
tram.257.a: "Убедиться, что им правильно платят."
tram.257.b: "Плата - это земля, которую они завоюют!"

tram.258.t: "Хунхузский атаман"
tram.258.d: "Многие бандиты из северной Маньчжурии бежали на север и присоединились к силам Григория Семёнова в качестве наёмников, привлечённые богатствами Сибири. Хотя это означает, что мы теряем некоторое количество искусных всадников, которых могли бы нанять обычно, это сделает северные регионы безопаснее - по крайней мере, пока."
tram.258.a: "Чем чёрт не шутит, я полагаю."

tram.259.t: "Золото Амура"
tram.259.d: "Наша земля сурова и не очень густо населена, но у нас есть то, что в прошлом возносило и низвергало империи: золото. В горах Приморья и Приамурья лежат огромные неразработанные запасы золота. Имперский режим только начинал крупномасштабную добычу, а в 1920-х годах многие крупные рудники были открыты с использованием дешёвой китайской рабочей силы с той стороны границы. Теперь эти рудники финансируют нашу войну, позволяют нам платить войскам и оснащать их.\n\nНо можно сделать больше. Национализация рудников значительно увеличит наш бюджет, даже если это сделает врага из самого богатого человека в Приамурье... хотя он, вероятно, станет бывшим самым богатым человеком, если мы заберём его рудники."
tram.259.a: "Просто выжать из них побольше налогов."
tram.259.b: "Земля будет принадлежать нам."

tram.260.t: "Империя или Царство"
tram.260.d: "С восстановлением монархии вопрос, долгое время погребённый под революцией и Гражданской войной, вернулся в центр российской государственности: чем, по сути, должна быть Россия?\n\nДля одних ответ прост. Россия должна снова стать Империей - большой, внушающей страх и признанной миром как наследница старого имперского порядка. Это имя величия и преемственности, титул, который говорит об армиях, границах и достоинстве власти. Для других это слово несёт холодную память о Петровской эпохе: государство, возвышенное по форме, но слишком часто оторванное от священных корней Русской земли.\n\nДля Михаила Дитерихса этот вопрос глубже. Он видит в Царстве завет - священный союз Веры, Государя и Земли, старше министров и сильнее бюрократий. Царь - не украшение государства, а его живое освящение. Если Россия должна обновиться, она должна сначала вспомнить, какая власть давала ей силу до искушений современности и революции."
tram.260.a: "Россия будет Империей - великой, суровой и признанной."
tram.260.b: "Россия будет Царством - священным, древним и цельным."

tram.261.t: "Суд над Царственными мучениками"
tram.261.d: "Годами убийство Императорской семьи было не просто преступлением, но и раной на совести России. В Екатеринбурге, в разрушенных покоях Ипатьевского дома, кровь помазанников была пролита людьми, которые утверждали, что говорят от имени народа. Правда давно уже была раскрыта Дитерихсом и Соколовым, но в годы раздора не было ни сил, ни единства, чтобы судить это преступление так, как оно того заслуживало.\n\nТеперь, когда Россия воссоединена, а старое государство восстановлено, это оправдание исчезло. Убийцы больше не могли прятаться за революцией, хаосом или иностранными границами. Их деяние больше нельзя было обсуждать лишь шёпотом, как вопрос политики или неудобства. Суд был созван открыто, под властью возрождённого Российского государства, перед законом, Церковью и самой землёй.\n\nДля Дитерихса этот суд был расплатой. Преступление было совершено против Царя, против его невинных детей, против священной связи, которая скрепляла Россию. Оставить его без ответа значило бы принять, что такой грех может быть погребён под временем. Судить его сейчас - значит объявить, что Святая Русь не забыла и не простит молчанием."
tram.261.a: "Пусть правосудие говорит за мучеников России."

tram.262.t: "Сергей Соколов восходит"
tram.262.d: "Юридический переворот Соколова удался. При неожиданной поддержке царя Никиты Сергей Соколов был назначен Печатником, главным советником Никиты и главой императорского правительства. Попытка генералов ДВСВ阻止 этот провалилась, и к их dismay, аполитичный и умеренный Михаил Васильевич Ханжин был назначен Воеводой. Соколов быстро развил свой успех: в сотрудничестве с Никитой I новые указы ограничили власть военных и расширили полномочия императорского правительства.\n\nТихая военная диктатура Дитерихса была расформирована, но это не привело к какой-либо либерализации; лишь к большему вовлечению РОНДа Соколова."
tram.262.a: "Победа, которой никто не ожидал."

tram.263.t: "Хранители наследия Воеводы"
tram.263.d: "Юридический переворот Соколова провалился. Царь Никита остался в стороне от дебатов, и в конечном счёте генералы сплотили свои ряды. Руководство ДВСВ перешло к Викторину Молчанову и Григорию Вержбицкому - военным, ориентированным на стабильность. Да, они убеждённые монархисты и консерваторы, но они не разделяют религиозного фанатизма ни Соколова, ни Дитерихса. Благодаря связям Вержбицкого он смог заручиться поддержкой антисоколовцев в РОНДе, и интриги поставили дроздовца Антона Туркула в положение, позволяющее бросить вызов Соколову.\n\nЗахват власти Соколовым рухнул, потому что он настроил против себя многие высшие эшелоны режима. Вместо этого он был вынужден уйти из политики по «предложению» генерала Вержбицкого, который вместо него стал Печатником. Молчанов, в свою очередь, стал новым Верховным Воеводой в рамках соглашения о разделе власти с Вержбицким."
tram.263.a: "Они стабилизируют государство."

tram.264.t: "Государственные мушкетёры побеждают"
tram.264.d: "Замыслы Соколова и амбиции генералов были в конечном счёте пресечены не интригами, а волей самого Государя. Царь Никита, долгое время считавшийся далёким от фракционной борьбы, действовал решительно, доверившись Союзу Мушкетёров и их лидеру, князю Владимиру Гантимурову.\n\nМушкетёры, некогда отвергаемые как романтичные юноши, играющие в войну, доказали свою дисциплинированность, верность и, прежде всего, личную преданность Короне. Усиленные, расширенные и поставленные в прямое распоряжение Трона, они быстро двинулись, чтобы взять под контроль ключевые институты и нейтрализовать сторонников Соколова. В то же время их присутствие дало понять генералам ДВСВ, что сопротивление приведёт лишь к расколу и, возможно, к гражданской войне внутри самого восстановленного государства.\n\nСтолкнувшись с этой реальностью, генералы выбрали сотрудничество. Власть военных была сохранена, но больше не была верховной; теперь она была уравновешена и находилась под наблюдением собственной гвардии Государя. Гантимуров, возведённый в должность Печатника, стал ближайшим советником Царя, представляя новую силу внутри режима: не суровый мистицизм Дитерихса и не заговорщический пыл Соколова, а личную, лояльную монархию, сосредоточенную вокруг самого Трона."
tram.264.a: "Один за всех, и все за одного!"

tram.265.t: "Конец Второй Смуты"
tram.265.d: "Царь Никита Александрович играет всё более значительную роль в управлении государством после смерти генерала Дитерихса. Человек, который изначально казался немногим больше, чем марионеткой генералов, всё чаще идёт против них, часто полагаясь на публичные обращения к народу как на способ заставить военных подчиниться. В конце концов, Дитерихс начал культ вокруг Царя как способ легитимизировать власть, которая иначе была бы по сути военной диктатурой, и это оказалось основой для собственного культа личности Никиты.\n\nЦарь неуклонно заполняет свой кабинет и такие организации, как Монархический союз, своими сторонниками, часто вопреки желаниям [GetOtherPrimeMinister] и его собственным амбициям. Никита часто посещает народ и создал вокруг себя отличную пропагандистскую машину. Несмотря на идеализацию прошлой России, его режим принял массовую политику, частые радиообращения и другие очень современные методы обращения к массам и сочетал их со старыми методами, такими как указание церковным проповедям всегда молиться о здравии Царя, напоминая русским о том, что действительно важно.\n\nКонечно, режим вряд ли популярен, но благодаря смеси беспощадного подавления и умной пропаганды он стоит на прочном фундаменте, по крайней мере пока. В недавнем обращении Василий Шульгин - влиятельный государственный деятель в правительстве - заявил, что наконец Россия была отпущена от греха убийства Николая II и находится на лучшем пути после двадцати лет Новой Смуты. Если бы только верные имперцы удержали свои позиции в 1917 году, России не нужно было бы проходить через огонь и кровь так много раз - но именно жертвенная кровь потребовалась, чтобы смыть грехи цареубийства и братоубийства."
tram.265.a: "Подобно Мессии, Святая Русь восстаёт вновь."

tram.266.t: "Переговоры с Анастасием Вонсяцким"
tram.266.d: "Анастасий Вонсяцкий, лидер Всероссийского национального движения и командир печально известной Чёрной гвардии, представляет собой небольшую, но всё же организованную силу. Полувоенная дисциплина его организации, бескомпромиссная идеология и пламенная харизма её «Вождя» привлекли внимание как монархов-эмигрантов, так и руководства РОНДа. Наличие такого союзника с сильным региональным присутствием было бы полезно для нашего дела.\n\nОднако переговоры чреваты трудностями, поскольку невозможно игнорировать личные амбиции, которые блестят в словах Вонсяцкого, когда он представляет себя истинным Вождём, направляющей рукой для молодого монархического движения, даже при номинальном монархе.\n\nЕго требования резки и бескомпромиссны: он добивается официального признания Чёрной гвардии как законного военизированного формирования, свободы организации тренировок и пропаганды, а также возможности действовать в рамках монархической коалиции без помех. Фанатизм националистов и их репутация безжалостности в подавлении инакомыслящих делают их инструментом, который наше руководство не может полностью отвергнуть, но за которым необходимо внимательно следить."
tram.266.a: "Нам нужны союзники, а не вечные соревнования и интриги."
tram.266.b: "Никто не считает их силой, заслуживающей быть воспринятой всерьёз."

tram.267.t: "Сергей Соколов избран председателем РОНДа"
tram.267.d: "Прошло некоторое время с тех пор, как к нам присоединилось Братство Русской Правды - тайная монархическая организация из Ростова, от Войска Донского. Тем не менее, паутина связей и влияния, которую Сергей Соколов-Кречетов, долгое время скрывавшийся под псевдонимом «Брат №1», создавал десятилетиями, уже ощущается.\n\nВсего месяц назад Братья прибыли во Владивосток, но уже на одном собрании РОНДа Сергей смог обеспечить своё избрание председателем организации, удивив даже Дитерихса.\n\nХотя Братья могут быть нашими самыми значительными союзниками, важно не недооценивать их влияние как на РОНД, так и на правительство в целом."
tram.267.a: "Интересно."

tram.268.t: "Присоединиться к Народному ополчению?"
tram.268.d: "Поскольку [TRM.GetLeader] созвал Земский собор и теперь призывает всех русских монархистов вступать в ряды его ополчения против режима [RUS.Capital.GetName] и [RUS.GetLeader], мы получили официальную делегацию во главе с Никандром Миролюбовым из [TRM.Capital.GetName]. Они предлагают нам выйти из германской сферы влияния и объединить усилия для совместной борьбы. Как нам ответить?"
tram.268.a: "Они наши братья, и мы присоединимся к ним."
tram.268.b: "Ни за что."
tram.268.c: "Напротив, это они должны присоединиться к нам!"

tram.269.t: "[FROM.GetName] выражает отказ!!"
tram.269.d: "Безумный [FROM.GetLeader] отказался заключать с нами союз!"
tram.269.a: "Они будут уничтожены так же."

tram.270.t: "Контрпредложение [FROM.GetName]"
tram.270.d: "Хотя [TRM.GetLeader] изложил свою позицию довольно ясно, Братство Русской Правды предложило вместо присоединения к нам присоединиться к ним, так как они считают нас неспособными эффективно вести сухопутную войну в Сибири, тогда как они могут использовать свою обширную сеть подпольных монархических организаций, чтобы начать настоящую партизанскую войну в Европейской России."
tram.270.a: "Они безумны?"
tram.270.b: "Мы лучше присоединимся!"

tram.271.t: "Григорий Семёнов изгнан в Приамурье!"
tram.271.d: "Новое правительство [TRM.GetLeader] недавно начало чистку против нашего верного казака Григория Семёнова. Ещё со времён Гражданской войны в России мы поддерживали его и его отряды деньгами и оружием, и после его недолгой службы в Маньчжурии он сумел поднять восстание на русском Дальнем Востоке в 1925 году, сильно помогая нашим интересам.\n\nПоскольку он был арестован вчера утром, мы должны задаться вопросом, действительно ли [TRM.GetLeader] подходит для управления тем, что должно стать нашими колониями на Дальнем Востоке."
tram.271.a: "Нам нужен лояльный Владивосток."
tram.271.b: "Мы должны прекратить нашу помощь им."
tram.271.c: "Старый казак изжил свою полезность."

tram.272.t: "Япония сокращает помощь!"
tram.272.d: "Японская делегация выразила неодобрение по поводу нашей недавней «чистки» бандитов Семёнова и неспокойных казаков. Когда наши силы начинают укреплять законный контроль над Забайкальем, похоже, что Токио начинает опасаться [TRM.GetLeader]. Пока что они решили сократить помощь нашему правительству."
tram.272.a: "Почему они думают, что это плохо для нас?"

TRM_Start_The_Trials_tt: "Начнётся суд, который определит судьбу некоторых личностей."

tram.10001.t: "Якутское восстание"
tram.10001.d: "Из-за нашего решения ввести военное положение в Якутске якутское меньшинство создало ВЯОНУ - Временное якутское областное народное управление, чтобы объявить нам независимость. Мы должны обеспечить их лояльность нашему государству!"
tram.10001.a: "Им никогда не победить нас!"

tram.10003.t: "Бурят-монгольское восстание"
tram.10003.d: "Из-за нашего решения ввести военное положение в Верхнеудинске бурят-монгольское меньшинство создало Бурнацком и теперь бастует, чтобы повлиять на Колчака и заставить его отменить военное положение, иначе они объявят независимость."
tram.10003.a: "За кого они себя принимают?!"

tram.300.t: "Временное правительство Якутии"
tram.300.d: "Из-за нашей жёсткой политики по отношению к якутскому народу местное гражданское правительство, известное как Временное якутское областное народное управление, объявило независимость и отделилось от нашей республики. К нашему великому удивлению, нынешний генерал-губернатор Якутска, Иннокентий Смолин, находился во Владивостоке с визитом к [ROOT.GetLeader]. Воевать в вечной мерзлоте будет трудно, но мы должны победить мятежных якутов!"
tram.300.a: "Завоевать якутских предателей!"
tram.300.b: "Да здравствует Свободная Якутия!"

tram.310.t: "Национальный комитет бурят-монголов"
tram.310.d: "Похоже, что последние желания и попытки адмирала Колчака удержать нашу нацию вместе были тщетны. Бурят-монголы провозгласили своё собственное государство в Забайкалье и отделились. Более того, казаки присоединились к ним, поддерживая восстание против нашего лидера."
tram.310.a: "Да здравствует [BRY.GetName]!"
tram.310.b: "Разобраться с этими предателями!"

tram.301.t: "Японцы завоёвывают наши земли!"
tram.301.d: "В непосредственном хаосе владений Колчака японцы с помощью деловых кругов Владивостока захватили некоторые из наших территорий. Квантунская армия теперь контролирует наши города, а японский флот охраняет наши порты. Мы должны решить, что делать."
tram.301.a: "Мы сейчас слишком слабы..."
tram.301.b: "Ни пяди земли японцам!"

tram.302.t: "Победа в дальневосточной смуте!"
tram.302.d: "Наше правительство сумело победить других претендентов на верховную власть над дальневосточными землями, и теперь мы можем продолжить наши реформы."
tram.302.a: "Великолепно!"

tram.309.t: "Сибирь наша!"
tram.309.d: "Сибирская армия славно прошла через тайгу и болота, достигнув Екатеринбурга и Уральских гор. Кажется, победа так близка к нам, что мы можем быть уверены, что достигнем её очень скоро. Жители освобождённых сибирских городов с трепетом встретили великих солдат Сибирской армии, которые снова, как и в 1918 году, прошли через их города."
tram.309.a: "Эх, Сибирь, моя родина Сибирь, мы постоим за тебя."

tram.400.t: "Интеграция Дальнего Востока"
tram.400.d: "После нескольких месяцев переходного периода сегодня наконец был издан указ о роспуске временного правительства Дальневосточного региона и полной реинтеграции этой области в Россию."
tram.400.a: "Россия наконец едина!"

tram.401.t: "Прибытие Анненкова"
tram.401.d: "Анненковцы прибыли сегодня во Владивосток. Генерал Борис Владимирович Анненков - печально известный атаман и Семиреченский губернатор времён Гражданской войны, чьи войска совершали ужасные зверства даже по сравнению с повседневными ужасами той братоубийственной войны. За это Анненкову не было места в России, и он предпочёл самоизгнание, а не лишение чинов и званий, возможно, что-то похуже. Так что предприимчивый Борис Владимирович служил наёмником, военным экспертом по найму и командиром своего небольшого отряда верных людей в различных китайских конфликтах и наконец поступил на службу к генералу-собаке, Чжан Цзунчану.\n\nНо даже наёмник устаёт от бессмысленной войны, и Анненкова привлекло наше дело обещанием [ROOT.GetLeader] о помиловании. Такова судьба, как Матушка-Россия призывает своих сыновей в самое трудное время."
tram.401.a: "Все патриоты должны быть вместе."

tram.402.t: "Судьба атамана Семёнова"
tram.402.d: "У нас есть подтверждённые сообщения о том, что атаман Семёнов был коррумпированным японским агентом, получавшим оружие и деньги, чтобы свергнуть Колчака и превратить российский Дальний Восток в японскую колонию. Хотя мы помиловали других офицеров Приамурья, судьба этого конкретного предателя должна быть очень ясна - смерть."
tram.402.a: "Это правильное решение."

tram.403.t: "Судьба атаманов Гамова и Калмыкова"
tram.403.d: "Атаман Амурского казачьего войска Гамов и атаман Уссурийского казачьего войска Калмыков присоединились к адмиралу Колчаку и известны как близкие соратники атамана Семёнова. Они, вероятно, знали о его планах, и поэтому им нельзя доверять."
tram.403.a: "Пусть живут..."
tram.403.b: "Никакой пощады приспешникам Семёнова!"

tram.404.t: "Судьба адмирала Колчака"
tram.404.d: "Этот человек - адмирал-предатель или герой России? Кто такой адмирал Колчак? Русский Цинциннат, сделавший трудный выбор во время Гражданской войны, а затем снова - ради спасения Родины и противостояния керенщине. Возможно, нам стоит пощадить адмирала, если он готов отказаться от всех притязаний на титул Верховного правителя и продолжить свою службу на флоте, как он всегда хотел."
tram.404.a: "Пусть служит своей Родине."
tram.404.b: "Нет, он будет осуждён за измену."

tram.405.t: "[TRM.GetName] требует нашего присоединения!"
tram.405.d: "Владивостокское правительство обратилось к нам с ультиматумом. Они не только требуют вернуть их земли в Алтайском регионе, но и контроля над нашим правительством. Если мы не решим этот вопрос дипломатически, возможно, [FROM.GetName] вторгнется к нам."
tram.405.a: "У нас действительно есть выбор?"
tram.405.b: "Мы будем противостоять российской агрессии!"

tram.406.t: "[FROM.GetName] соглашается!"
tram.406.d: "[FROM.GetAdjective]ое правительство неожиданно согласилось на наше предложение, дав нам большое преимущество против Петроградского режима!"
tram.406.a: "Отлично!"

tram.407.t: "[FROM.GetName] выражает отказ!"
tram.407.d: "[FROM.GetAdjective]ое правительство отказалось от нашего предложения. Без доступа к Алтаю мы застрянем у озера Байкал, и наше наступление провалится."
tram.407.a: "Пора покончить с Монголией!"
tram.407.b: "Мы сейчас не совсем готовы с ними воевать."

tram.408.t: "Вопрос о КВЖД"
tram.408.d: "Китайско-Восточная железная дорога, ныне находящаяся под влиянием Мантэцу, должна принадлежать нам, что по сути означает оккупацию большей части Северной Маньчжурии. Это определённо пойдёт против японских интересов в регионе, но, возможно, мы сможем сделать это без особого вмешательства Токио."
tram.408.a: "Посетить Токио для консультаций."
tram.408.b: "Это только между нами и Фэнтянем."
tram.408.c: "Забыть об этом."

tram.409.t: "Интересы Приамурья в Северной Маньчжурии"
tram.409.d: "[FROM.GetAdjective]ое правительство сегодня посетило Токио для решения вопроса о Китайско-Восточной железной дороге. Будучи когда-то частью Транссибирской магистрали, она соединяла Владивосток с остальной Империей, но теперь Приамурье остро нуждается в контроле над этой дорогой для снабжения своих войск при подготовке наступления на [RUS.GetName]. Хотя доступ к железной дороге - это только половина дела, они хотят полного контроля над Северной Маньчжурией, что мы не можем позволить без каких-либо значительных выгод для нас."
tram.409.a: "Они могут получить это, но мы требуем контроля над их правительством."
tram.409.b: "Они могут получить это, но мы требуем значительных уступок."
tram.409.c: "Они могут получить это, но Мантэцу всё равно будет контролировать."
tram.409.e: "Мы можем разрешить только военный доступ."
tram.409.f: "Им стоит забыть о Маньчжурии!"

tram.410.t: "Япония требует контроля над нашим правительством"
tram.410.d: "Японское правительство согласилось отдать нам Северную Маньчжурию, но требует контроля над нашим правительством, что, скорее всего, сделает нас их колонией. Это означает, что мы не сможем вести независимую внешнюю политику."
tram.410.a: "Мы не можем этого допустить."
tram.410.b: "Похоже, у нас нет выбора."

tram.411.t: "Япония требует значительных уступок"
tram.411.d: "Японское правительство согласилось отдать нам Северную Маньчжурию, но со значительными уступками. Во-первых, они получат полный доступ к порту Владивосток, Камчатке и Охотску, буквально закрывая наш доступ к Тихому океану."
tram.411.a: "Это слишком рискованно."
tram.411.b: "КВЖД сейчас очень важна."

tram.412.t: "Япония соглашается с оговорками"
tram.412.d: "Японское правительство согласилось отдать нам Северную Маньчжурию, но Мантэцу по-прежнему будет контролировать железную дорогу, что означает, что их влияние широко распространится в нашей стране."
tram.412.b: "Нас не волнует владение железной дорогой."
tram.412.a: "Это нам не подходит."

tram.413.t: "Япония разрешает военный доступ"
tram.413.d: "Японское правительство согласилось предоставить нам только военный доступ к Китайской железной дороге, без передачи какой-либо территории Фэнтяня."
tram.413.a: "По крайней мере, у нас есть это."

tram.414.t: "Япония отказала!"
tram.414.d: "Японцы полностью отказали в наших требованиях, даже сказав, что нам стоит забыть о Маньчжурии."
tram.414.a: "Они, вероятно, правы."
tram.414.b: "Сказать им, что нам всё равно."

tram.415.t: "[TRM.GetName] планирует вторгнуться в Северную Маньчжурию"
tram.415.d: "Несмотря на наши «усилия», [TRM.GetAdjective]ое правительство решило нас не слушать. Их войска уже находятся на границе с [FNG.GetName], готовясь вторгнуться на наши законные земли."
tram.415.a: "Дать им то, что они хотят, но сохранить контроль Мантэцу."
tram.415.b: "Отправить официальный ультиматум с требованием отступить!"

tram.416.t: "Ультиматум из Токио"
tram.416.d: "Японцы прислали нам официальный ультиматум с требованием отступить, пока не поздно. Они угрожают нам полномасштабным вторжением, если мы не откажемся от оккупации Северной Маньчжурии."
tram.416.a: "Отступить."
tram.416.b: "Мы не отступим."

tram.417.t: "Интересы Приамурья в Северной Маньчжурии"
tram.417.d: "[FROM.GetAdjective]ое правительство обратилось к нам и потребовало контроля над Китайско-Восточной железной дорогой. Единственная проблема в том, что они также хотят Северную Маньчжурию, а сама железная дорога контролируется японской Мантэцу."
tram.417.a: "Мы должны отступить."
tram.417.b: "Квантунская армия защитит нас!"

tram.418.t: "[FROM.GetName] соглашается!"
tram.418.d: "[FROM.GetAdjective]ое правительство согласилось на наши требования, что конкретно означает, что Мантэцу потеряет контроль над железной дорогой. Более того, мы готовы оккупировать Северную Маньчжурию."
tram.418.a: "Отлично!"

tram.419.t: "Приамурье оккупировало Северную Маньчжурию!"
tram.419.d: "Без всякого предупреждения [TRM.GetAdjective]ие войска оккупировали Северную Маньчжурию, включая железную дорогу Мантэцу! Это невероятно! Мы должны потребовать, чтобы они немедленно отступили!"
tram.419.a: "Они серьёзно?"

tram.420.t: "Ультиматум из Токио"
tram.420.d: "Японцы прислали нам официальный ультиматум с требованием вывести войска из Северной Маньчжурии, пока не поздно. Они угрожают нам полномасштабным вторжением, если мы не покинем этот район и не восстановим границу до статус-кво."
tram.420.a: "Мы не отступим сейчас."
tram.420.b: "У нас нет выбора..."

tram.421.t: "Вторжение в Северную Маньчжурию"
tram.421.d: "Наши войска готовы пересечь границу. [FROM.GetAdjective]ое правительство отказалось от наших требований, и теперь у нас нет другого выбора, кроме как вмешаться."
tram.421.a: "В атаку!"
tram.421.b: "Слишком большой риск..."

tram.422.t: "Сговор Японии и Приамурья"
tram.422.d: "Без какого-либо уведомления правительства Японии и Приамурья договорились об оккупации последней Северной Маньчжурии вместе с железной дорогой Мантэцу. Хотя Япония ведёт себя так, будто мы их колония, похоже, у нас нет другого выбора, кроме как принять эти ужасные условия."
tram.422.a: "У нас нет выбора..."

tram.423.t: "Умиротворение [FROM.GetName]"
tram.423.d: "[FROM.GetAdjective]ое правительство отказалось от нашего ультиматума, что теперь приведёт к полномасштабной войне. Мы всегда можем отказаться от неё, хотя это сильно рискует нашим авторитетом и амбициями..."
tram.423.a: "Мы разберёмся с ними позже..."
tram.423.b: "Русские нам не указ!"

tram.501.t: "Наши силы сдаются!"
tram.501.d: "Тревожные сообщения поступают со всех сторон, и телеграммы от главнокомандующих не перестают поступать - армия разваливается повсюду, солдаты массово сдаются [RUS.GetName] или переходят на их сторону. В городах полиция больше не в состоянии подавлять народные волнения. [RUS.GetAdjective]ие силы одерживают решительную победу на земле, всё больше регионов переходит под их контроль. Развал фронта и всей нации предвещает нам только поражение. Несмотря на всё, что было поставлено на карту, [ROOT.GetLeader] не смог одержать победу в этом последнем раунде гражданской междоусобицы."
tram.501.a: "Дальний Восток пал."

tram.502.t: "Их силы сдаются!"
tram.502.d: "Отличные новости распространяются по Дальнему Востоку, и телеграммы от командующих нашим Генеральным штабом не перестают поступать - вражеские силы разваливаются повсюду, их войска либо массово сдаются нам, либо переходят на нашу сторону. В городах полиция больше не в состоянии сдерживать народные волнения. Наши войска триумфально наступают, и всё больше территорий переходит под наш контроль. Развал фронта [FROM.GetName] и их псевдогосударства может означать только нашу несомненную победу. И, несмотря на всё, что было поставлено на карту, у предателя [FROM.GetLeader] всё равно не было надежды."
tram.502.a: "Дальний Восток пал!"

tram.503.t: "Падение Дальнего Востока"
tram.503.d: "Несмотря на нашу поддержку правительства во Владивостоке, не удалось выдержать давление противника или убедить местное население в легитимности их решений или обоснованности их намерений. К сожалению, фронт рухнул, а страна была опустошена недовольными солдатами и гражданскими лицами.\n\nЕсли ничего не предпринимать, знамя медведя снова взовьётся над Владивостоком. Мы предлагаем заключить мир с пробудившимся ото сна медведем и сосредоточиться на других направлениях. В качестве альтернативы мы можем оккупировать порт Владивостока и обеспечить соблюдение части Дайренского соглашения, хотя это может привести к новому конфликту."
tram.503.a: "Нам лучше сосредоточиться на других областях."
tram.503.b: "Оккупировать Владивосток и начать переговоры с русскими!"

tram.504.t: "Япония оккупирует Владивосток!"
tram.504.d: "Вместе с падением Дальневосточного режима Япония решила не бежать с нашей земли с позором. Вместо этого, кажется, они решили поторговаться и оккупировали порт Владивосток и сам город. Несмотря на то, что их присутствие там уже было, они усилили гарнизоны и ввели военный флот в бухту."
tram.504.a: "Они заплатят за это!"

tram.505.t: "Мир с Японией?"
tram.505.d: "Видя неизбежное падение Владивостока, Япония решила вступить с нами в переговоры. В обмен на прекращение войны они потребовали, чтобы мы держались подальше от азиатских дел."
tram.505.a: "Никогда!"
tram.505.b: "Нам нужен этот мир сейчас."

tram.600.t: "[FROM.GetName] предлагает мир"
tram.600.d: "Сепаратисты из [FROM.GetName] ожесточённо сражались против наших войск, нанося нам тяжёлые потери. Хотя их сопротивление было упорным, теперь они задумались о заключении перемирия, чтобы сохранить свою власть. Их делегации были направлены в наше Верховное командование, однако окончательное решение остаётся за [TRM.GetLeader]."
tram.600.a: "Принять, мы не будем больше терять жизни."
tram.600.b: "Что? Марш на [FROM.Capital.GetCapitalVictoryPointName]!"

tram.601.t: "Угроза японским интересам в Приамурье"
tram.601.d: "Поскольку правительство [FROM.GetLeader] неспособно подавить сепаратистские мятежи на своей собственной территории, Императорская миссия во Владивостоке задаётся вопросом перед своими заинтересованными сторонами и командованием Императорской армии Японии, можем ли мы действительно доверять [FROM.GetAdjective]ому правительству как легитимному и достаточно сильному. В связи с возросшими подозрениями Квантунской армии они предлагают, что простое устранение [TRM.GetLeader] позволит нам укрепить наш контроль над русским Дальним Востоком без каких-либо ограничений. Однако эта операция, вероятно, приведёт к войне с их правительством."
tram.601.a: "Разделяй и властвуй."
tram.601.b: "Мы всё ещё можем доверять [TRM.GetLeader]."

tram.10000.t: "Вопрос об Охотске"
tram.10000.d: "С нашей победой над режимом во Владивостоке была установлена японская временная военная администрация в бывших российских регионах Охотска и Камчатки. Хотя земли бесплодны с точки зрения природных ресурсов, не говоря уже об их малонаселённости, они занимают важное положение, когда речь идёт о безопасности архипелага Тысячи островов. Теперь многие в нашем правительстве спорят о том, что должно стать с этими землями: должны ли они быть включены в Великую Японию как защищённое Охотское море и восстановленная Петропавловская военно-морская база? Или правы противники этой идеи, и лояльные русские - более предпочтительный вариант для управления полуостровом?"
tram.10000.a: "Владение этими землями не будет иметь никакой ценности."
tram.10000.b: "Нет, мы должны сохранить нашу проекцию силы."

tram.100000.t: "Партизаны в Сибири"
tram.100000.d: "Предательские псы, называющие себя истинными русскими, подстрекнули значительную часть нашего населения в Сибири взяться за оружие и начать вооружённую борьбу в нашем тылу! Мы должны быстро разобраться с ними, прежде чем наши силы будут окружены и вымотаны голодом."
tram.100000.a: "Проклятье!"

tram.10002.t: "Судьба старого русского влияния"
tram.10002.d: "По мере того как наша власть на старом русском Дальнем Востоке укрепляется с каждым днём, мы столкнулись с перспективой изменения названий городов от старого колчаковского режима в честь достопочтенного Хризантемового трона. Хотя японизация Дальнего Востока может занять время, это изменение неизбежно. Тем не менее, в наших землях всё ещё есть те, кто лелеет старую тиранию русских, и это, несомненно, разозлит тех, кто всё ещё считает себя наследниками истинной России. Должны ли мы сделать этот дерзкий шаг, чтобы ещё больше интегрировать эту землю в Токио?"
tram.10002.a: "Отличный план, к чёрту русских."
tram.10002.b: "Мы не должны действовать слишком опрометчиво."

tram.10005.t: "Выбор нашего флага"
tram.10005.d.vostokoslavia: "Есть два возможных варианта флага, которые мы можем выбрать: один - панславянский триколор с русским орлом и восточнославянским гербом, а другой - панславянский триколор с золотой полосой и восточнославянским гербом, но без русского орла."
tram.10005.d.pepel: "У нас есть четыре варианта нашего флага. Первый - диагональный зелёно-красно-белый триколор с золотой полосой. Второй - сибирский флаг с Иисусом и золотой полосой. Третий - сибирский флаг с крестом и золотой полосой. Четвёртый - такой же, как третий, но без золотой полосы."
tram.10005.d.pepel_sib: "У нас есть два варианта нашего флага. Первый - сибирский флаг с крестом и золотой полосой. Второй - такой же, но без золотой полосы."
tram.10005.d.pepel_rus: "У нас есть два варианта нашего флага. Первый - российский триколор с крестом и золотой полосой. Второй - такой же, но без золотой полосы."
tram.10005.d.sib_rovs: "У нас есть два варианта нашего флага. Первый - бело-зелёный полосатый флаг с орлом Дитерихса и золотым лавром. Второй - такой же, но с зелёным лавром."
tram.10005.d.tsardom: "С восстановлением Русского Царства у нас есть три варианта нашего флага. Первый - российский триколор с орлом. Второй - предполагаемый флаг первого военного корабля «Орёл», построенного во времена Алексея Михайловича. Третий - лик нашего Всемогущего Господа, вдохновлённый знаменем Всемилостивого Спаса."
tram.10005.d.mlad: "У нас есть два варианта нашего флага. Первый использует чёрно-жёлто-белый флаг с гербом на красном кантоне. Второй - такой же, но с символом младороссов."
tram.10005.a: "Флаг с орлом."
tram.10005.b: "Флаг с гербом и золотой полосой."
tram.10005.c: "Диагональный триколор с золотой полосой."
tram.10005.d: "Флаг с Иисусом."
tram.10005.e: "Сибирский флаг с крестом и золотой полосой."
tram.10005.f: "Сибирский флаг с крестом без золотой полосы."
tram.10005.g: "Российский триколор с крестом и золотой полосой."
tram.10005.h: "Российский триколор с крестом без золотой полосы."
tram.10005.i: "Флаг с золотым лавром."
tram.10005.j: "Флаг с зелёным лавром."
tram.10005.k: "Флаг с гербом."
tram.10005.l: "Флаг с символом младороссов."
tram.10005.m: "Российский триколор с орлом."
tram.10005.n: "Возможный вымпел корабля «Орёл»."
tram.10005.o: "Флаг, вдохновлённый знаменем Всемилостивого Спаса."

## NRA events ##

trmnra.1.t: "Благовещенское восстание"
trmnra.1.d: "Город Благовещенск является крупнейшим транспортным узлом и промышленным центром Амурской области. С вчерашнего дня рабочие Благовещенска требуют повышения заработной платы и сокращения рабочего дня. Забастовки, организованные совместно Народно-революционной армией и Центросибирью, переросли в открытые беспорядки. Необходимо принять срочные меры для подавления этого злостного восстания!"
trmnra.1.a: "Восстание должно быть подавлено!"

trmnra.2.t: "Восстание НРА"
trmnra.2.d: "Стало известно, что генерал Богуславский перешёл на сторону повстанцев, и дивизия под его командованием присоединилась к мятежникам. Более того, Благовещенский гарнизон сложил оружие.\n\nАмурские казаки, расквартированные на другом берегу реки Зеи, а также оставшиеся верные части оказались отрезаны от Благовещенска взорванными мостами через Амур и Зею."
trmnra.2.a: "Катастрофа!"

trmnra.3.t: "Провозглашение Дальневосточной Народной Республики"
trmnra.3.d: "С эскалацией конфликта в Благовещенске рабочие других крупных городов - Читы, Хабаровска и Владивостока - также выступили против нашего правительства. Несмотря на то, что военное положение было объявлено по всей Дальневосточной Республике, это не помешало НРА вооружить отряды самообороны. Лидер повстанцев, генерал Калашников, сделал заявление о свержении диктатуры на всём Дальнем Востоке. Хотя это заявление было ложным, оно побудило многих крестьян присоединиться к восстанию. Сейчас власть в крупных городах действительно перешла к НРА, но ещё остаются последние очаги сопротивления."
trmnra.3.a: "Конец диктатуре!"

trmnra.4.t: "Белогвардейский переворот!"
trmnra.4.d: "Сегодня японцы и их приспешники нанесли ответный удар из Маньчжурии и тех пограничных земель, которые всё ещё находились под контролем казаков. Казачьи полки, китайские бандиты-хунхузы и все недовольные элементы встали под единственную организованную силу бандитов - атаман Семёнов, поддерживаемый японскими штыками и монетой, смог нанести решительный удар по нашим уязвимостям почти на всём протяжении Транссибирской магистрали в Забайкалье и Приамурье.\n\nВо Владивостоке ситуация была иной. Из-за сопротивления со стороны капиталистически настроенных элементов и близости к границе японцы ввели войска и захватили город под командованием генерала Бакшеева, ещё одного семёновца. Мы были вынуждены снова вернуться к партизанской тактике, и НРА, не успевшая полностью консолидировать свои силы, была вынуждена отступить в леса, болота и горы.\n\nВойна проиграна, и остаётся неясным, сможем ли мы когда-нибудь вновь обрести силы, чтобы дать отпор реакции!"
trmnra.4.a: "Слава казакам и их атаману!"

trmnra.5.t: "Белогвардейские партизаны"
trmnra.5.d: "После десятилетий оков власть наконец стала подлинно народной! Храбрые калашниковские партизаны благодаря тщательно спланированной операции смогли захватить контроль над Читой, Владивостоком и другими крупными городами Дальнего Востока. Однако наша власть остаётся хрупкой. Японские силы ещё не полностью выведены, а казачьи станицы всё ещё не признали нашу власть. У нас есть все основания полагать, что белогвардейцы, бежавшие в Маньчжурию и Харбин, планируют гнусное контрреволюционное восстание, которое, очевидно, снабжается японскими империалистами. Пока влияние Японии не ослабнет, мы будем в опасности."
trmnra.5.a: "Долой белый террор!"

trmnra.40.d: "НРА определённо недооценила нас. После того как рабочие поднялись в Хабаровске, мы расстреляли их лидеров. Оставшиеся ополченцы и наёмники отправились во Владивосток в своей жалкой попытке свергнуть Колчака, но Армия уничтожила их. Вскоре после этого рабочие в Чите сдались. Приамурье живёт и идёт вперёд со своим Верховным правителем - адмиралом Колчаком."
trmnra.40.a: "Да здравствует адмирал Колчак!"

trmnra.41.t: "Социалистический переворот в Приамурье"
trmnra.41.d: "Один из наших главных союзников - Приамурье - пал под красным знаменем некоего Калашникова. Абсолютно верно, что они попытаются разорвать наши экономические связи с бывшим приамурским правительством. Мы могли бы вмешаться напрямую или ничего не делать."
trmnra.41.a: "Нам следует внимательно следить за ними."

trmnra.7.t: "Анти-японская пропаганда"
trmnra.7.d: "Японцы слишком долго влияли на нашу страну, но есть одна вещь, которой коррумпированное правительство Колчака не знало. Мы ненавидим японцев и хотим нашей независимости. Более того, мы хотим независимости для всех рабочих, пострадавших под японским сапогом."
trmnra.7.a: "Эксплуататоры нам не друзья!"

trmnra.8.t: "Уничтожение японского влияния"
trmnra.8.d: "После Революции мы экспроприировали средства производства и запретили частную собственность, но этого недостаточно для полного уничтожения японского влияния. У них всё ещё есть военный доступ в нашу страну, и мы считаем, что они всё ещё надеются восстановить своё колониальное правительство. Мы должны что-то сделать!"
trmnra.8.a: "Закрыть границы с Японией, обезопасить наши морские рубежи и разорвать все договоры."

trmnra.9.t: "Бурят-монгольская СР"
trmnra.9.d: "Забайкальский край - это не только логово казаков Семёнова, но и земля людей, которых всегда угнетали - бурят. Мы уважаем рабочих-бурят и желаем им свободы. Им нужна свобода, которой они никогда не получали ни от Императора, ни от Керенского, ни от Колчака."
trmnra.9.a: "Пообещать им автономию."

trmnra.10.t: "Земля бурят-монголов"
trmnra.10.d: "Мы понимаем насущную потребность рабочих-бурят в независимости, но Забайкальский край долгое время находился под властью атамана Семёнова - антибольшевистской мрази, японской марионетки и труса. Мы не поймали его во время Гражданской войны, и он, вероятно, сбежит, когда мы освободим Читу. Но мы должны значительно усилить гарнизоны на границе с Монголией."
trmnra.10.a: "Вы уже освобождены!"

trmnra.90.t: "Буряты требуют автономии"
trmnra.90.d: "На прошлой неделе в регионе Бурят-Монголии произошли волнения. Многие рабочие требовали автономии, которую мы обещали им год назад."
trmnra.90.a: "Подавить восстание - мы единая страна."

trmnra.11.t: "Чистка армии"
trmnra.11.d: "Большинство генералов ДВСВ и колчаковской клики бежали за границу, но мы знаем, что некоторые остались. Мы должны вычистить тех, кто не будет сражаться за нас и за свободу рабочих."
trmnra.11.a: "Присоединяйся к нам или умри."

trmnra.12.t: "Красное казачество"
trmnra.12.d: "Хотя красное казачество представляет собой прежде всего украинское явление, в контексте Дальнего Востока и его влиятельной казачьей общины НРА признаёт определённые преимущества в стремлении привлечь тех, кто устал от разрушений, причинённых казакам под руководством атамана Семёнова и его подчинённых. Формирование красных казачьих частей потенциально может способствовать региональной стабильности и усилению нашей военной мощи. Однако важно отметить, что мы не можем полностью доверять казакам в настоящее время."
trmnra.12.a: "Мы не можем полностью им доверять."
trmnra.12.b: "Они покажут хороший пример другим казакам!"

trmnra.13.t: "Судьба церкви"
trmnra.13.d: "Русская Дальневосточная Православная Церковь когда-то поддерживала Колчака и его буржуазную политику. Мы должны казнить священников, взорвать церкви или сжечь их дотла."
trmnra.13.a: "Религия - опиум для народа."
trmnra.13.b: "Мы современное светское государство. Оставить церковь в покое."

trmnra.14.t: "[TRM.GetNameDef] хочет присоединиться к нам"
trmnra.14.d: "Дальневосточная республика недавно пала под социалистическими знамёнами, рабочие освобождены, японцы изгнаны. Теперь они просят присоединиться к нам как одна нация."
trmnra.14.a: "Добро пожаловать домой!"

trmnra.16.t: "Последний оплот большевизма"
trmnra.16.d: "С поражением красных в Гражданской войне земли первой в мире социалистической республики стали опасной зоной для социалистов. Многие из них бежали во Францию и другие социалистические страны, но некоторые остались. Наш лидер, Василий Блюхер, один из них. И он с гордостью скажет, что Дальневосточная республика - последний оплот большевизма, но не последний.\n\nОднако это порождает новую дискуссию. Некоторые считают, что Дальневосточная республика в её нынешнем виде - единственно возможный и прочный способ продлить существование большевизма. Поэтому товарищ Блюхер предлагает, чтобы он ушёл в отставку и пригласил либо товарища Краснощёкова, либо товарища Никифорова возглавить гражданское правительство на Дальнем Востоке. Второй выбор, однако, - провозгласить Российскую Советскую Республику в изгнании и попытаться восстановить настоящую советскую власть по всей России. Третий вариант - оставить Приамурье под военным правлением Блюхера до дальнейшего уведомления..."
trmnra.16.a: "Да здравствует товарищ Краснощёков!"
trmnra.16.a2: "Поздравить товарища Никифорова!"
trmnra.16.b: "Готовиться к восстановлению российского социализма."
trmnra.16.c: "Оставить военное правительство."

trmnra.17.t: "Послание с Дальнего Востока."
trmnra.17.d: "Дальневосточная республика просит присоединиться к нам в тесном союзе - но их лидер, товарищ Блюхер, желает остаться главой государства. Мы уважаем тех, кто сражался против Колчака, и нам, вероятно, нужна буферная зона между нами и Японией."
trmnra.17.a: "Принять сделку."

trmnra.18.t: "Приамурье разорвало с нами связи!"
trmnra.18.d: "Приамурье сегодня объявило, что разорвёт связи с нашей империей и пойдёт по новому пути в одиночку. Это стало шоком для многих в Японии, которые рассматривают государство Приамурье как одну из главных колоний и союзников Японии. Тем не менее, мы не оставим это оскорбление без внимания."
trmnra.18.a: "Проклятые русские!"

trmnra.19.t: "[SOV.GetNameDef] финансирует вооружённое восстание против нашего правительства"
trmnra.19.d: "Несмотря на то, что ранее мы разгромили НРА, её лидер и многие члены покинули нашу страну. С установлением советской власти в России они вернулись, и теперь у них есть огромные средства для организации открытого восстания."
trmnra.19.a: "Они ничего не сделают против нас."
trmnra.19.b: "Объявить войну первыми."

trmnra.20.t: "Вооружённые восстания в Чите и Хабаровске"
trmnra.20.d: "Крупные промышленные города Чита и Хабаровск снова стали синдикалистскими и теперь пытаются свергнуть наше правительство."
trmnra.20.a: "Попытаться раздавить их!"

trmnra.21.t: "Переворот удаётся"
trmnra.21.d: "К сожалению, их было слишком много. Они убили наших солдат и захватили административные здания в крупнейших городах. [TRM.GetLeader] был убит, и были вывешены красные знамёна. На следующий день советские войска пересекли границу и установили полный контроль над нашими территориями. Однако теперь мы должны решить, что делать дальше."
trmnra.21.a: "Присоединиться к Старшему брату!"
trmnra.21.b: "Просить автономии!"

trmnra.22.t: "Переворот провалился"
trmnra.22.d: "К сожалению для НРА, мы их раздавили. Однако теперь мы можем опасаться, что советское правительство объявит нам войну, поскольку ясно, что их марионетка была уничтожена."
trmnra.22.a: "Мы никогда не сдадимся."

trmnra.23.t: "Переворот НРА провалился"
trmnra.23.d: "Переворот, который мы устроили в Приамурье, провалился, революционеры были раздавлены, и теперь границы стали только более контролируемыми."
trmnra.23.a: "Раздавить их!"
trmnra.23.b: "Отступить."

trmnra.42.t: "Приамурье закрывает границу"
trmnra.42.d: "Новое социалистическое правительство Приамурья попыталось уничтожить наше влияние в регионе, но они не подумали, что окружены морем."
trmnra.42.a: "Как они смеют, к войне!"
trmnra.42.b: "Их мелочность нас не касается."
trmnra.42.c: "Ввести морскую блокаду их судов."

trmnra.43.t: "Японская морская блокада"
trmnra.43.d: "После наших действий японцы установили против нас морскую блокаду. Хотя это значительно увеличит наши импортные расходы, мы должны полагаться на себя. Они нас не сломят."
trmnra.43.a: "Держаться."

TRM_japan_seized_our_fleet: "Япония захватила Дальневосточный флот"
TRM_japan_destroyed_our_fleet: "Япония уничтожила Дальневосточный флот"

trmnra.44.t: "Контр-адмирал Старк захватил Дальневосточный флот"
trmnra.44.d: "Когда рабочие и крестьяне российского Дальнего Востока поднялись на восстание против капиталистического и помещичьего классов, волнения начали распространяться и среди моряков Владивостока. Трагедия, однако, была неизбежна - проклятые белые морские офицеры отдали приказ открыть огонь по восставшим, а затем покинули Жемчужину Дальнего Востока, забрав с собой на борт кораблей своих сообщников, беженцев и других желающих бежать. Но куда они отправились? Возникает вопрос: где Сибирская военная флотилия?"
trmnra.44.a: "Проклятые предатели!"

trmnra.45.t: "Блудный флот бывшего Приамурья"
trmnra.45.d: "Во время революции социалистической НРА в Дальневосточной Республике контр-адмирал бывших белых военно-морских сил при адмирале Колчаке, Георгий Старк, увёл всю Сибирскую военную флотилию в Японию и запросил убежище. Более того, он намеревается продать этот флот нам и использовать эти деньги для организации про-японского переворота во Владивостоке. Его мотивы не совсем ясны нам, хотя он явно заслуживает доверия, но Императорский флот Японии предлагает просто реквизировать все эти корабли в пользу Империи или потопить их как гарантию того, что Тихий океан никогда не будет русским!"
trmnra.45.a: "Уничтожить флот!"
trmnra.45.b: "Реквизировать флот и интегрировать в наш флот."
trmnra.45.c: "Купить корабли, они нам нужны."

trmnra.46.d: "Во время революции социалистической НРА на российском Дальнем Востоке контр-адмирал бывших военно-морских сил при адмирале Колчаке, Георгий Старк, увёл всю Сибирскую военную флотилию через Тихий океан на Филиппины. Он предлагает продать флот нам."
trmnra.46.a: "Это отличная идея."
trmnra.46.b: "У нас нет реальной заинтересованности в его покупке."

trmnra.47.t: "Русские требуют флот!"
trmnra.47.d: "Новое правительство во Владивостоке требует, чтобы мы немедленно передали полный контроль над всеми эвакуированными кораблями контр-адмирала Старка в руки их Морского министерства."
trmnra.47.a: "Нет."
trmnra.47.b: "Их жалкие суда не могут сравниться с величием нашего флота."

trmnra.48.t: "Японцы согласились!"
trmnra.48.d: "Японцы согласились передать нам всю Сибирскую военную флотилию, эвакуированную контр-адмиралом Георгием Старком из Владивостока. Это послужит основой для воссоздания наших военно-морских сил на Дальнем Востоке."
trmnra.48.a: "Отлично!"

trmnra.49.t: "Японцы отказались!"
trmnra.49.d: "Японцы отказались передать нам всю Сибирскую военную флотилию, эвакуированную контр-адмиралом Георгием Старком из Владивостока."
trmnra.49.a: "Придётся начинать с нуля."

trmnra.50.t: "Земельный вопрос"
trmnra.50.d: "Вопрос о землевладении является крайне актуальным в Дальневосточном регионе, где существует множество споров между различными фракциями, несмотря на то, что их позиции имеют поразительное сходство. Социалисты-революционеры, доминирующие в НРА, выступают за свою основную доктрину социализации земли, которая подразумевает передачу всех земельных активов в общественную собственность, фактически превращая их в общинную собственность. Напротив, большевики придерживаются того же принципа, но твёрдо верят в государственный надзор за процессом распределения."
trmnra.50.a: "Национализировать землю!"
trmnra.50.b: "Социализация земли!"

trmnra.51.t: "Конец временной диктатуры?"
trmnra.51.d: "Диктатура НРА была временной до тех пор, пока ситуация на Дальнем Востоке не стабилизируется после революции. Сегодня, после серии выборов Советов всех уровней, был созван Третий съезд Народно-революционной армии, которому поручено избрать новый состав Совета Народных Комиссаров Дальневосточной Республики, что ознаменует переход к гражданскому управлению.\n\nВ предыдущие недели произошли значительные сдвиги в динамике власти как внутри самих Советов, так и внутри съезда. Предстоит решающее голосование, но нет сомнений, что это далеко не конец. В конечном счёте, шаткость двухпартийной системы несёт риск катастрофы."
trmnra.51.a: "Большевистское крыло берёт власть."
trmnra.51.b: "Калашников решает продлить диктатуру."
trmnra.51.c: "Политцентр берёт власть."

trmnra.52.t: "Выборы премьера Дальневосточной Республики"
trmnra.52.d: "Власть во вновь сформированном Совете Народных Комиссаров Дальнего Востока перешла к большевистской ветви НРА, но задача остаётся завершить процесс и избрать единственного представителя, который возглавит эту новую администрацию. Некоторые предполагали, что разнообразие в рядах большевиков может стать проблемой для их восхождения, но Съезд был готов обсуждать окончательный выбор."
trmnra.52.a: "Емельян Ярославский, Воинствующий безбожник."
trmnra.52.b: "Пётр Никифоров, кандидат-зиновьевец."
trmnra.52.c: "Борис Шумяцкий, из Центросибири."
trmnra.52.e: "Александр Краснощёков, сторонник НЭПа."
trmnra.52.g: "Мартемьян Рютин, стойкий бухаринец из Харбина."

trmnra.53.t: "Определение конечной цели"
trmnra.53.d: ""
trmnra.53.a: "Мы должны двинуться, чтобы вернуть всю Россию."
trmnra.53.b: "Мы должны поддержать независимость Сибири."

trmnra.54.t: "Политическая система"
trmnra.54.d: ""
trmnra.54.a: "Мы учредим официальную Советскую республику."
trmnra.54.b: "Мы восстановим Сибирскую думу."

trmnra.55.t: "Легализация кадетов?"
trmnra.55.d: ""
trmnra.55.a: "Мы должны разрешить их ради демократии."
trmnra.55.b: "Мы не должны допускать этих колчаковцев!"

trmnra.56.t: "Крестьянские волнения"
trmnra.56.d: "Партизаны НРА ослабляют стабильность нашей Родины. Недавно одному из них удалось поднять крестьянское восстание в одной из наших провинций. К счастью, восстание вскоре было успокоено нашими верными офицерами, а остальные крестьяне разбежались по домам."
trmnra.56.a: "Я хочу, чтобы с провокаторами разобрались!"

trmnra.57.t: "Демонстрации рабочих"
trmnra.57.d: "Хотя технологический прогресс привёл к медленному, но неуклонному улучшению условий труда, рабочие оставались очень уязвимыми для агитации НРА. В городах время от времени организовывались демонстрации, их требования варьировались в зависимости от того, кто дёргал за ниточки."
trmnra.57.a: "Ну что ж..."

trmnra.58.t: "Атака на оружейный завод"
trmnra.58.d: "Прошлой ночью на оружейном заводе в Благовещенске произошёл взрыв, уничтоживший целую производственную линию. По сообщениям с места происшествия, жертв нет, но есть пострадавшие среди рабочих. Никто иной, как НРА, взял на себя ответственность за нападение, заявив, что их атака была направлена на подрыв позиций Японии в нашей стране. Чтобы восстановить разрушенную промышленность, потребуется время, но наши граждане с каждым днём всё больше устают от насилия. Если мы хотим вернуть поддержку нашего народа, мы должны уничтожить НРА как можно скорее, прежде чем они предпримут более решительные меры."
trmnra.58.a: "Они заплатят за это!"

trmnra.59.t: "Промышленный саботаж"
trmnra.59.d: "Сегодня утром жители Хабаровска проснулись от ужасающего зрелища и звука: на заводе взорвалась бомба, в результате чего несколько человек погибли и десятки получили ранения. Бомба серьёзно повредила завод, а также нанесла ущерб местной инфраструктуре. Никто иной, как НРА, взял на себя ответственность за нападение, заявив, что целью атаки было нанести удар по японскому бизнесу в стране. Хотя реакция местных пожарных и полиции достойна восхищения, многие местные жители крайне встревожены, а некоторые даже обвиняют Дальневосточное правительство в бездействии. Даже растёт ропот о том, что действия правительства в последние дни только провоцируют НРА на организацию новых терактов. Если мы хотим вернуть доверие нашего народа, мы должны удвоить наши усилия, чтобы показать людям, что мы можем их защитить!"
trmnra.59.a: "Мы победим!"

trmnra.60.t: "Взрыв на железной дороге"
trmnra.60.d: "Жители вдоль Транссибирской магистрали проснулись среди ночи от громкого взрыва и облака дыма. По-видимому, террористы НРА быстро нанесли удар в темноте и так же быстро скрылись в сибирских лесах. Смысл их атаки ясен: железнодорожные линии в Сибири играют ключевую роль в снабжении, и без них войска в Забайкалье будут испытывать трудности с продовольствием и боеприпасами. Хотя мы отправим восстановительные бригады, чтобы как можно быстрее запустить наши поезда, последняя атака отражает всё более жестокий характер НРА. Мы сделаем всё возможное, чтобы, когда мы их найдём, они заплатили за свои преступления."
trmnra.60.a: "Мы поймаем их!"

trmnra.61.t: "Неудачная атака"
trmnra.61.d: "Сегодня военное командование во Владивостоке было абсолютно восхищено, когда до них дошла новость о фактической победе. Оказывается, в своём самонадеянном высокомерии псы НРА попытались совершить налёт на небольшой военный пост под Читой средь бела дня. Скорее всего, они намеревались совершить налёт на базу исключительно ради припасов, поскольку они были в бегах и у них, вероятно, заканчивалось топливо для их так называемого восстания. После глупой атаки на базу защитники открыли огонь с укреплённых позиций и вышек, утыканных мешками с песком, отбивая силы НРА как сельдей в бочке. Наконец, понеся значительные потери, НРА снова бежала, но не сразу, оставив своих раненых и павших товарищей. Новость о победе достигла улиц каждого сибирского городка, и военные и правительство высоко оценили реакцию. Наконец-то у нас был большой успех, свидетельство силы нашего правительства и лояльности наших военных [ROOT.GetLeader]!"
trmnra.61.a: "Скатертью дорога."

trmnra.100.t: "Василий Блюхер уходит в отставку"
trmnra.100.d: "Дальневосточная республика теперь является последним оплотом большевизма в мире. Достигнув этой конечной цели восстановления советской власти, мы теперь столкнулись с гораздо более сильным врагом на Западе. Вот почему Василий Блюхер решил уйти с поста лидера. Он говорит, что вся власть теперь делегирована..."
trmnra.100.a: "...большевикам, вернувшимся из изгнания."
trmnra.100.b: "...Фрунзе."
trmnra.100.c: "...Тухачевскому."

trmnra.101.t: "Марш на Петроградский режим"
trmnra.101.d: "Слишком долго мы ждали шанса освободить наших братьев-россиян от тирании коррумпированных немецких прихвостней и Реакционеров. Наши ребята готовы сражаться, ружья заряжены, грузовики заправлены. Должны ли мы официально объявить им войну?"
trmnra.101.a: "К оружию!"
trmnra.101.b: "Нам нужен ещё месяц, чтобы подготовить вторжение."
trmnra.101.c: "Нам нужно ещё полгода, чтобы подготовить вторжение."
trmnra.101.e: "Нам нужен ещё год, чтобы подготовить вторжение."

trmnra.102.t: "Красные во Владивостоке"
trmnra.102.d: "Владивостокский режим пал, только чтобы быть заменённым большевиками, вернувшимися из изгнания. Кажется, что Вторая Гражданская война в России теперь неизбежна. Мы должны вернуть наши Дальневосточные земли и наконец уничтожить красных!"
trmnra.102.a: "К оружию!"
trmnra.102.b: "Нам нужен ещё месяц, чтобы подготовить вторжение."
trmnra.102.c: "Нам нужно ещё полгода, чтобы подготовить вторжение."
trmnra.102.e: "Нам нужен ещё год, чтобы подготовить вторжение."

trmnra.103.t: "НРА и Гражданская война в России"
trmnra.103.d: "Снова Россия впала в кровавую гражданскую войну, когда социалисты и реакционеры идут друг на друга. В то время как промышленные города были захвачены рабочими, всё ещё есть сторонники старого режима. Командование, естественно, рассматривает Петроградское правительство как наших союзников в освобождении всей России, однако есть также мнения, что [RUS.GetLeader] не является истинным представителем народной воли, а является оппортунистом. Мы должны решить, должны ли мы объединить усилия с ними против [RVA.GetLeader] и [RRF.GetLeader], или же провозгласить лидерство рабочих и крестьян только за нами."
trmnra.103.a: "Мы должны помочь нашим союзникам в Петрограде!"
trmnra.103.b: "Долой предателей! [ROOT.GetLeader] - законный правитель всея Руси!"

trmnra.104.t: "НРА присоединяется к нам!"
trmnra.104.d: "Народно-революционная армия на Дальнем Востоке присягнула на верность нашему режиму и согласилась объединить усилия с нами против контрреволюционеров."
trmnra.104.a: "Скоро вся Россия будет освобождена..."

trmnra.105.t: "Удар в спину!"
trmnra.105.d: "Народно-революционная армия на Дальнем Востоке предала идеалы Революции и объявила наше правительство нелегитимным. Эти предатели теперь пересекли границу в войне против рабочих и крестьян."

trmnra.106.t: "Большевистское восстание в Петрограде!"
trmnra.106.d: "Недавние потери наших союзников в Москве и Нижнем Новгороде ясно показали, что они не способны управлять страной и выигрывать войну. Российская Коммунистическая партия, находившаяся в оппозиции к ним, захватила власть в Петрограде, арестовав правительство. Теперь, когда Григорий Зиновьев возглавляет нацию, возможно, нам пора пересмотреть наше сотрудничество и объявить их правительство нелегитимным, также предоставив убежище левым эсерам."
trmnra.106.d2: "Недавние потери наших врагов в Москве и Нижнем Новгороде ясно показали, что они не способны управлять страной и выигрывать войну. Российская Коммунистическая партия, находившаяся в оппозиции к ним, захватила власть в Петрограде, арестовав правительство. Теперь, когда Григорий Зиновьев возглавляет нацию, возможно, нам пора пересмотреть нашу верность и признать их правительство, подписав мирный договор и присоединившись к их силам."
trmnra.106.a: "Большевики виноваты. Мы - истинное революционное правительство!"
trmnra.106.b: "Левые эсеры были виноваты. Присоединиться к большевикам!"
trmnra.106.c: "Мы не должны пересматривать наши союзы в эти ужасные времена."

trmnra.107.t: "Анархистское восстание в Петрограде!"
trmnra.107.d: "Коммунисты продержались недолго... победили анархисты, связанные с левыми эсерами, и все те, кто был возмущён большевистским переворотом. Теперь, когда анархия охватывает Россию, возможно, нам пора пересмотреть наше сотрудничество и объявить их правительство нелегитимным."
trmnra.107.a: "России нужна стабильность, а не анархия. Мы - истинное революционное правительство!"

trmnra.108.t: "Прекращение огня с [RUS.GetName]"
trmnra.108.d: "С завершением Третьего съезда НРА и окончательным приходом [TRM.GetLeader] к руководству партизанскими отрядами в [ROOT.Capital.GetCapitalVictoryPointName] состоялось экстренное совещание с целью сложить оружие и прекратить наступление на дружественное правительство [RUS.GetNameDef]. Поскольку правительство Калашникова и его предателей-эсеров ранее вступило в открытый конфликт с правительством [RUS.Capital.GetName], большинство наших командиров считают, что пришло время объединиться против наших общих врагов."
trmnra.108.a: "Нам пора держаться вместе."
trmnra.108.b: "Мы принесём истинный социализм в [RUS.Capital.GetName]!"

trmnra.109.t: "Эсеровские генералы бегут в [FROM.Capital.GetCapitalVictoryPointName]!"
trmnra.109.d: "В то время как наше новое правительство опасалось «красного термидора» со стороны генералов-эсеров, имевших значительное влияние в Красной Армии, с разрывом всех связей дальневосточной НРА с нами, они, кажется, сбежали и присоединились к их рядам."
trmnra.109.a: "Мы были правы насчёт их контрреволюционных симпатий."

trmnra.110.t: "Эсеровские генералы прибывают в [ROOT.Capital.GetCapitalVictoryPointName]"
trmnra.110.d: "С большевистским восстанием в [RUS.GetNameDef] бывшие командиры Красной Армии из рядов левых эсеров сегодня прибыли в [ROOT.Capital.GetCapitalVictoryPointName], чтобы объединить свои силы с нами против кровавого большевистского режима!"
trmnra.110.a: "Отлично!"

trmnra.111.t: "[FROM.GetLeader] становится новым председателем на Дальнем Востоке"
trmnra.111.d: "На недавнем Третьем съезде Народно-революционной армии Дальнего Востока консенсус между эсерами и большевиками, существовавший в годы подполья и первые месяцы социалистического правления в регионе, наконец достиг своей кульминации. Фактически коалиция распалась, и съезд избрал нового председателя Совета Народных Комиссаров на Дальнем Востоке - [FROM.GetLeader]."
trmnra.111.a: "Будем надеяться, мы найдём общий язык."

trmnra.112.t: "Белая реакция в [TRM.GetName]!"
trmnra.112.d: "К сожалению, дружественный режим на Дальнем Востоке был свергнут в результате переворота, совершённого предателями-казачьими бандитами под руководством Григория Семёнова, вооружёнными японскими винтовками. Используя слабость молодой революции в Чите и Владивостоке, они сумели быстро свергнуть наших союзников."
trmnra.112.a: "Ужасные новости, мобилизуйтесь против казаков!"
trmnra.112.b: "Мы не можем раздавить их пока что."

## The Militant Godless & NRA ##
atheists.1.t: "СВБ консолидирует власть!"
atheists.1.d: "Теперь, когда Емельян Ярославский и его Союз воинствующих безбожников (СВБ) наконец консолидировали контроль над руководством [TRM.GetName] и НРА, организация становится всё более могущественной, практически параллелью Совета народных комиссаров. Поскольку члены СВБ контролируют все ключевые должности в правительстве, некоторые из них идут ещё дальше - требуя, чтобы само [TRM.GetNameDef] носило имя организации, неся атеизм, как радикальный, так и научный, всем народам. Не как часть естественного развития к коммунизму, а стремительно, принудительно."
atheists.1.a: "Мы светское государство, но мы не психопаты."
atheists.1.b: "Бог мёртв, и безбожники докажут это Земле!"

atheists.2.t: "Православная церковь запрещена"
atheists.2.d: "Наконец, самый важный из наших декретов был приведён в исполнение - полный запрет православной церкви. Религия - опиум народа, который отравил столько жизней, отбросил нашу страну на несколько столетий назад в развитии. Религия - это регресс, и отныне миллионы нищих, чьи жизни были разрушены верой, будут не молиться, а работать на благо Родины.\n\nСогласно декрету, новый запрет распространяется на всю территорию бывшей Российской империи в границах 1914 года. Несоблюдение декрета будет означать смерть для непокорных церквей и священников."
atheists.2.a: "Проснитесь, люди!"

atheists.3.t: "Великое разрушение церквей"
atheists.3.d: "Уже началась государственная кампания по уничтожению церквей - прежде убежищ для бедных и кошельков для толстых священников. Отныне бедные будут работать и получать зарплату, а не сидеть и молиться о хороших временах.\n\nОтныне все православные церкви в Забайкалье будут уничтожены на государственном уровне. Вся Россия - следующая в очереди. Только взрывами мы добьёмся справедливости для всех униженных."
atheists.3.a: "Горите в аду!"

atheists.4.t: "Массовые убийства священников"
atheists.4.d: "Хотя Дальний Восток не так богат священниками, они всё же есть, и прежде чем они успеют сбросить свои рваные рясы, они будут убиты. Вооружив рабочих винтовками, мы дадим им цель - убить каждого священника без суда. Пока не останется ни одного священника."
atheists.4.a: "Красный террор в лучшем виде."

atheists.5.t: "Принудительная секуляризация"
atheists.5.d: "Забайкалье медленно очищается от скверны религии. Буддизм и православие почти канули в Лету. Массовые расстрелы священников, уничтожение церквей привели к тотальному страху населения перед Забайкальским советом. Теперь вместо молебнов люди работают, ведь освобождение нашей родины ещё впереди."
atheists.5.a: "Слава Совету!"


tramsem.1.t: "Фронда атамана Семёнова"
tramsem.1.d: "В пределах [TRM.GetNameDef] лежит Забайкалье, где власть государства принимает заметно иной характер. Там, под прямым влиянием атамана Григория Семёнова, управление - это вопрос личного командования, а не положения. Доклады, доходящие до Владивостока, описывают систему, которая жёстко функционирует через реквизиции, неформальные сборы и неоспоримую власть казачьих отрядов. Железнодорожные линии охраняются, потоки снабжения поддерживаются, а беспорядки подавляются с прямотой, которую многие в столице сочли бы чрезмерной. Столь же верно и то, что без таких методов контроль над этой окраиной мог бы оказаться куда более слабым.\n\nКак консервативные офицеры Ставки, так и гражданские власти в Приамурье утверждают, что ни одно государство, стремящееся к долговечности, не может терпеть такую автономию бесконечно. Власть без сдержек рискует подорвать тот самый порядок, который она якобы защищает - порядок [TRM.GetLeader].\n\nС другой стороны, регион явно является окраиной и должен управляться как окраина. 10 лет они успешно держат линию."
tramsem.1.a: "Некоторая автономия для этих вольнодумцев и разбойников требуется."
tramsem.1.b: "Напомнить Семёнову, кто командует."

tramsem.2.t: "Сеть атамана"
tramsem.2.d: "Формальная структура власти в нашем государстве хорошо определена на бумаге. Однако в Забайкалье и прилегающих регионах власть опирается на паутину личных связей, построенных за годы войны, окраинного командования и нужды. Офицеры, служившие под началом атамана Семёнова в самые неопределённые периоды Гражданской войны, продолжают смотреть на него напрямую. Местные администраторы поддерживают отношения с его представителями, которые предшествуют нынешнему государству и во многих случаях превосходят его. Эта сеть связывает воедино казачьи войска, бурятских сепаратистов, китайских рабочих-отходников и гражданских посредников в структуру, одновременно эффективную и непрозрачную. Демонтаж этой сети рискнул бы привести к серьёзной нестабильности."
tramsem.2.a: "Такие договорённости... необходимы."
tramsem.2.b: "То, что кажется нашей силой, может оказаться нашей слабостью."

tramsem.3.t: "Дальневосточное казачье войско"
tramsem.3.d: "Сегодня вступил в законную силу чрезвычайный указ Верховного правителя об учреждении Забайкальского военного округа под юрисдикцией Забайкальского казачьего войска атамана Семёнова. В округ включены территории Верхнеудинска и Читы и прилегающие территории, в которых вводится чрезвычайное положение и военное положение для борьбы с партизанщиной НРА."
tramsem.3.a: "Надеюсь, он скоро с этим разберётся."
tramsem.3.b: "Время разобраться со смутой! (Играть за Забайкалье)"

tramsem.4.t: "Смута в Забайкалье"
tramsem.4.d: "Забайкальский край является плацдармом для постоянного сопротивления режиму Колчака. С одной стороны, в регионе проживает бурят-монгольское меньшинство - буддийский народ, живущий здесь. Во время Гражданской войны Бурят-Монгольское государство некоторое время существовало как независимое государство. С присоединением Забайкалья к Приамурью деятельность местного бурят-монгольского самоуправления была приостановлена, но власть в регионе по-прежнему была сосредоточена в руках гражданских сибирских областников.\n\nПомимо бурят-монголов и местных областников, в Забайкалье расположены земли Забайкальского казачьего войска Семёнова, и здесь же наиболее сконцентрированы партизаны НРА. Фактически регион находится в состоянии гражданской войны, и нам нужно решить, что делать."
tramsem.4.a: "Мы должны разобраться с ситуацией."

tramsem.5.t: "Поддержать областников"
tramsem.5.d: "Атаман Семёнов имеет тесные связи с бурятским народом. Мы можем заручиться поддержкой областников, если пообещаем дать им автономию. А атаман Семёнов всегда держит свои обещания."
tramsem.5.a: "Поговорить с их лидерами."

tramsem.6.t: "Пакт с [TRM.GetLeader]?"
tramsem.6.d: "Новое правительство [TRM.GetName] под руководством атамана Семёнова просит нашей поддержки, чтобы выступить против тирана в [RUS.Capital.GetName], подобно тому, как Штернберг выступал в 1918 году. Его силы имеют поддержку сибирских казаков, якутов, бурят и других различных несогласных. Что нам с этого? Борьба за правое дело и значительное количество золота с амурских приисков, чтобы «убедить» нас."
tramsem.6.a: "Их дело стоит того."
tramsem.6.b: "Это упражнение в безумии."

tramsem.61.t: "Монголия согласилась"
tramsem.61.d: "Монгольское правительство ответило на наш призыв к оружию. Они готовы подписать с нами договор о союзе и выступить вместе против тирана [RUS.GetLeader]. Мы понесёмся вместе через Сибирь, как ураган!"
tramsem.61.a: "Начало чего-то великого."

tramsem.62.t: "Монголия игнорирует нас"
tramsem.62.d: "Монгольское правительство объяснило, что у них нет интереса начинать войну с Россией. Трусы!"
tramsem.62.a: "Какая разница."
tramsem.62.b: "Хорошо, мы вторгнемся в них."

TRM_MON_friendship: "Монголия заключила союз с [TRM.GetFlagWithName]"
tramsem.61.t: "Монголия принимает"
tramsem.61.d: "Монголия приняла наше предложение о сотрудничестве."
tramsem.61.a: "Великолепно!"

tramsem.62.t: "Монголия отвергает"
tramsem.62.d: "Монголия отклонила наше предложение о сотрудничестве."
tramsem.62.a: "Очень жаль!"

tramsem.7.t: "Бурят-Монгольское государство"
tramsem.7.d: "Земли к западу от Читы населяют храбрые бурят-монголы. При поддержке областников и лично атамана Семёнова эти земли по праву принадлежат живущему там народу. Бурятское государство теперь будет существовать с помощью атамана Семёнова и при военной и экономической зависимости от России. Атаман Семёнов решил передать всю власть в новом государстве Цогто Бадмажапову, национал-демократу, симпатизирующему казачьему делу."
tramsem.7.a: "Бурят-монголы будут свободны."

tramsem.9.t: "Восточная окраина"
tramsem.9.d: "Восточная окраина, или Российская Восточная окраина, - это государство, где вся гражданская и военная власть на территории Российской Восточной окраины сосредоточена в руках атамана Семёнова. Наша страна сильна как никогда."
tramsem.9.a: "Да здравствует атаман Семёнов!"

tramsem.8.t: "Забайкальский союз"
tramsem.8.d: "Дальневосточная республика - родина различных казачьих войск - Уссурийского, Амурского и семёновского - Забайкальского. Мы объединили все Войска - но мы должны провозгласить, что мы - земля казаков, и мы должны продвигать нашу идентичность и заставить всех уважать её."
tramsem.8.a: "Союз навеки!"

tramsem.10.t: "Судьба гражданской власти"
tramsem.10.d: "Народное собрание стало неизбежной проблемой. То, что когда-то было представлено как гражданский ответ на хаос Дальнего Востока, при братьях Меркуловых выросло в институт, который говорит от имени местного общества, выступает посредником в компромиссах между городами и районами и требует доли власти, которую нельзя игнорировать.\n\nНекоторые считают, что это именно то, что нужно Приамурью: гражданское лицо, местное участие и более широкая база за пределами меча и седла. Но собрание, которое начинается с совещания, может вскоре начать и командовать. Семёнов не заинтересован в том, чтобы отдавать Восток политикам. Но он также не желает править мёртвой землёй, скреплённой только силой. Поэтому атаман считает, что Народное собрание можно распустить и заменить его Областным народным советом - органом, избираемым от городских дум, уездных управ, казачьих войск, бурятских и якутских национальных представителей и общественных организаций, - строго совещательным по функциям. Сохранение Собрания в руках Меркуловых и их местных сторонников даст нам более кооперативную администрацию ценой предоставления гражданским лицам реального влияния на жизнь Приамурья."
tramsem.10.a: "Распустить его. Вместо этого мы созовём Областной народный совет."
tramsem.10.b: "Сохранить Собрание. Меркуловы могут заниматься гражданскими делами."

tramsem.11.t: "Первое заседание Областного народного совета"
tramsem.11.d: "Новый Областной народный совет наконец собирается: городские люди, уездные старейшины, казачьи делегаты и представители коренных народов собираются в тени власти атамана. Среди присутствующих мало иллюзий, и никто не принимает этот орган за парламент в полном смысле слова. Таким не было и Народное собрание. Среди имён, предложенных для руководства Советом, одно выделяется выше остальных: Сергей Таскин, кадет по убеждениям, но уроженец Забайкалья, казак - человек, который действительно представляет Читу и является политическим выживальщиком. Для Семёнова он именно тот человек, который нужен такому Совету: уважаемый и достаточно умеренный, чтобы управлять гражданскими лицами. Однако не все представители поддерживают его. Если Совету суждено существовать, то с самого начала должно быть ясно, чью волю он отражает. Наиболее верные казаки и старейшины Семёнова считают, что сам атаман может председательствовать и командовать без посредничества какой-либо гражданской фигуры."
tramsem.11.a: "Мы можем доверять Таскину - он опытный политик."
tramsem.11.b: "Власть атамана должна оставаться неоспоримой."

tramsem.12.t: "Юбилейный знак Особого Маньчжурского отряда"
tramsem.12.d: "В двадцатую годовщину формирования Особого Маньчжурского отряда атаман Григорий Семёнов учреждает юбилейный знак для тех, кто служил в старом ОМО. Отличие призвано увековечить формирование: импровизированное, мобильное, которое принесло Семёнову его место под солнцем. Сам знак собран из трёх основных элементов: основы, с эмалевым щитком или без него; двуглавого орла; и центрального щитка. Он отчеканен из серебра или серебрёной бронзы, произведён в Харбине и носится на винте. В некоторых версиях восходящее солнце и щиток на груди орла акцентированы позолотой, что придаёт знаку острый, воинственный блеск, соответствующий вкусу Семёнова к символам власти.\n\nТе, кто получает знак, - выжившие свидетели восхождения атамана, люди, которые удерживали железные дороги, совершали рейды на позиции и помогали создать пограничную власть, которая до сих пор несёт на себе его отпечаток. Почитая их, Семёнов почитает себя."
tramsem.12.d2: "В двадцатую годовщину формирования Особого Маньчжурского отряда атаман Григорий Семёнов выдаёт юбилейный знак бывшим членам ОМО в том же духе, в каком он давно выдаёт свои собственные знаки отличия: лично, нерегулярно и не дожидаясь санкции [ROOT.GetLeader]. Сам знак собран из трёх основных элементов: основы, с эмалевым щитком или без него; двуглавого орла; и центрального щитка. Он отчеканен из серебра или серебрёной бронзы, произведён в Харбине и носится на винте. В некоторых версиях восходящее солнце и щиток на груди орла акцентированы позолотой, что придаёт знаку острый, воинственный блеск, соответствующий вкусу Семёнова к символам власти.\n\nСемёнов не предоставляет документов, дающих формальное право на ношение знака, а лишь приказывает строгую регистрацию получателей. По его мнению, знак принадлежит людям, которые заслужили его с оружием в руках, а не министрам, советам или какому-либо главе государства, который может возразить, что только [ROOT.GetLeader] может создавать награды, медали или ордена."
tramsem.12.a: "ОМО помнит своего атамана."
tramsem.12.b: "Осудить несанкционированный знак."
tramsem.12.c: "Проигнорировать вопрос; ветераны могут оставить свою железяку."

tramsem.13.t: "Русский департамент Ассоциации согласия"
tramsem.13.d: "Политическая архитектура Маньчжурии строится не на партиях в старом русском смысле, а на ассоциациях, комитетах, лоббистских группах и тщательно управляемых общественных органах, которые собирают людей влияния под уважаемым именем. Среди них ни одна не является более полезной для японцев, чем Ассоциация согласия в Фэнтяне: структура, которая представляет себя как широкая, упорядоченная и кооперативная, но на практике служит каналом для интересов Мантэцу и, при необходимости, других японских дзайбацу, стремящихся к влиянию в собрании Фэнтяня.\n\nМаньчжурия - один из наших крупных соседей, и как личная служба атамана в качестве наёмника у Чжан Цзолиня, так и наследие его Особого Маньчжурского отдела наводят на мысль о создании некоего представительства для русского населения полосы отчуждения КВЖД. Однако атаман прекрасно понимает, что такой департамент - не патриотический институт в обычном смысле, а политический инструмент, который может купить: доступ, легитимность, средства и более громкий русский голос в Маньчжурии. Поэтому Семёнов не доверяет это дело второстепенному человеку. Он готов отправить Льва Власьевского, главу своего личного офиса, чтобы возглавить русский департамент Ассоциации согласия. Лев Филиппович - компетентный и осторожный белый офицер, который будет тщательно контролировать и распространять собственную сеть атамана в институты соседнего порядка."
tramsem.13.a: "Создать русский департамент в Фэнтяне."
tramsem.13.b: "России не нужна ещё одна маска для иностранных интересов."

tramsem.14.d: "Предложение от [TRM.GetLeader] из Приамурья о создании Русского департамента Ассоциации согласия с его приспешником Львом Власьевским во главе не осталось незамеченным в нашем правительстве. Для нас это не просто вопрос русской эмигрантской политики - это вопрос инфраструктуры, покровительства и распределения власти внутри государства. Ассоциация согласия долгое время служила политическим инструментом, с помощью которого интересы, связанные с Мантэцу и другими японскими коммерческими акторами, могли войти в Собрание под уважаемым и упорядоченным знаменем. Однако Коммуникационная клика - железнодорожники, телеграфисты и практические магнаты старого Бэйянского аппарата - остаётся единственной политически когерентной фракцией, способной ответить на это влияние на её собственном языке.\n\nЕсли мы попытаемся отказать [TRM.GetLeader] в его предприятии, проблема русского политического влияния не исчезнет. Некоторые предполагают, что более мудрым курсом было бы вместо этого усилить Коммуникационную клику и привязать к ней русских через более техническую и менее открыто политическую структуру. Назначение Бориса Остроумова, харбинского инженера, в Русско-Китайское управление железных дорог создаст полезный инструмент, который служит интересам контроля над железными дорогами, а не партийной политике."
tramsem.14.a: "Одобрить русский департамент."
tramsem.14.b: "Вместо этого усилить Коммуникационную клику."
tramsem.14.c: "Лоббировать запрет на политическое участие русских."

tramsem.15.t: "Политика железнодорожников"
tramsem.15.d: "Маньчжурия выбрала более узкое, более техническое решение. Вместо того чтобы позволить создать русский департамент внутри Ассоциации согласия, власти вместо этого пролоббировали создание Русско-Китайского управления железных дорог в ассоциации с Коммуникационной кликой, поместив в его центр Бориса Остроумова. Для антияпонских политиков внутри правительства Фэнтяня это своего рода победа: расширение его влияния на русские круги и способ противостоять Мантэцу и Ассоциации согласия. Для нас, однако, это провал."
tramsem.15.a: "Вопрос закрыт."

tramsem.16.t: "Закрытая дверь в [FNG.Capital.GetCapitalVictoryPointName]"
tramsem.16.d: "Ответ из Маньчжурии краток: не будет никакого русского департамента Ассоциации согласия. Какую бы политическую полезность ни могло предложить это предложение, она перевешена желанием сохранить влияние централизованным и читаемым. Дверь остаётся закрытой для русской политической структуры, которая когда-нибудь может стать неудобной. В то время как прагматичные круги вокруг Семёнова надеялись на санкционированный канал в маньчжурский порядок, более подозрительные офицеры видят в отказе доказательство того, что управляемые японцами институты никогда не будут делиться властью, если могут просто раздавать услуги вместо этого."

tramsem.17.t: "Отложенная корона"
tramsem.17.d: "Народное собрание взялось за дело, которое Семёнов не намеревался делать своим. То, что начиналось как осторожные разговоры среди депутатов, старых офицеров и самозваных хранителей русской преемственности, переросло в открытое требование: восстановление монархии. Правые монархисты, особенно собравшиеся вокруг Михаила Дитерихса и его круга, громко говорят о Земском соборе, о священной легитимности и о необходимости без промедления провозгласить истинного царя. Но такой путь нельзя оставлять без контроля.\n\nСемёнов лучше большинства знает, что его власть сильна, но не абсолютна. Он может командовать Войском, железными дорогами и страхом людей, живущих на границе, но у Народного собрания есть свои амбиции, своё давление и своё представление о том, чем должен стать Дальний Восток. Если он будет игнорировать их слишком явно, он рискует превратить сторонников в соперников, а союзников - в фанатиков. И всё же здесь есть и преимущества. Миссия придаёт форму правлению. Поэтому Семёнов уступает, хотя и не полностью и не без расчёта.\n\nБудет провозглашён Регентский совет, а сам он станет Регентом. О возвращении Царя будут говорить как о долге, поскольку Москва и Петроград всё ещё недосягаемы. Пока что Дальний Восток понесёт бремя опекунства, тогда как истинное восстановление остаётся отложенным обещанием."
tramsem.17.a: "Провозгласить Регентство."

tramsem.18.t: "Вопрос перед Советом"
tramsem.18.d: "Областной народный совет, конечно, не является парламентом в полном смысле. Он не принимает законов и не стоит над атаманом. Среди делегатов, среди офицеров, среди клерков и казачьих старейшин есть голоса, которые настаивают на том, что Дальний Восток не может навсегда оставаться в состоянии приостановленного командования. Если Россия должна выжить, то какая-то форма монархии должна быть восстановлена - возможно, не здесь и не сейчас. Монархия могла бы дать правлению атамана высшую цель, миссию за пределами простого выживания. Она превратила бы Дальний Восток в хранителя русского будущего и позволила бы ему стоять как человеку, сохраняющему путь к восстановлению. В конце концов, как он говорит: «Мы русские офицеры, мы присягали Вере, Царю и Отечеству, и мы остались верны этой присяге - мы не приняли революцию и боролись с большевизмом до последней возможности».\n\nРешение принадлежит только Семёнову."
tramsem.18.b: "Никакой короны над атаманом."

tramsem.19.t: "Нож в зале совета"
tramsem.19.d: "Предупреждающие знаки были видны неделями. Слишком много обидчивых соперников. Слишком много пренебрежённых союзников. Слишком много командиров, поставленных перед выбором между послушанием и совестью. Семёнов всегда правил силой личности, страхом, наградами и наказаниями, применяемыми в нужный момент. Но даже самый опасный человек может переступить черту. Алексей Бакшеев, его собственный заместитель как войсковой атаман Забайкальского казачьего войска, действовал первым.\n\nНа рассвете верные отряды окружают ключевые офисы, стража разоружена, и советы один за другим замолкают. Бакшеев выступает как человек, который утверждает, что предотвратил катастрофу. Семёнов, заявляет он, нажил слишком много врагов, сделал слишком много ошибок и дал слишком много опасных обещаний. Он толкал государство к краху, но никто не осмеливался говорить против него открыто - потому что это означало риск быть обвинённым в измене Японии, чья поддержка стала щитом одного человека.\n\nСемёнов арестован под стражу и предстаёт перед военным судом. Старый атаман, который так часто относился к суду как к чему-то предназначенному для других, теперь оказывается подчинён той самой дисциплине, которую требовал от земли.\n\nНовый порядок объявлен с unsettling спокойствием. Бакшеев станет временным лидером, возможно, намереваясь позже отказаться от власти."
tramsem.19.a: "Атаман пал."

tramsem.20.t: "Конец фронды на границе"
tramsem.20.d: "Даже без формального правления влияние атамана Семёнова распространилось слишком далеко, чтобы его можно было терпеть. Офицеры возмущаются им, гражданские боятся его, а центральное правительство устало от бесконечной необходимости терпеть его имя. Слишком долго к нему относились как к неприкасаемому, защищённому старыми связями, частными сетями и предположением, что его устранение вызовет больше проблем, чем решит. [ROOT.GetLeader] пришёл к выводу, что время такой осторожности прошло.\n\nАлексей Бакшеев, второй по значимости человек в Забайкальском войске, выбирает лояльность центральному правительству вместо личной зависимости и помогает нам организовать довольно тихий переворот в Чите. Если Дальний Восток должен оставаться управляемым, то даже самый сильный местный владыка должен подчиняться высшей власти.\n\nВ назначенный час Семёнова хватают без особых церемоний и предают военному суду. Хотя автономия казаков будет сохранена - без неё Бакшеев никогда бы не пошевелился - нам удалось срезать Семёнова, не дав региону рухнуть вокруг него."

tramsem.21.t: "Власть без будущего"
tramsem.21.d: "Переворот удался, но это была самая лёгкая часть. Алексей Бакшеев теперь сидит там, где когда-то стоял Семёнов, неся титул, который с каждым часом становится всё тяжелее. Бакшеев - не Семёнов. У него нет той же тяги к личной власти, того же инстинкта доминирования. Он, прежде всего, солдат. Вокруг него снова зашевелились те же фракции, которые когда-то маневрировали при Семёнове: офицеры, администраторы и гражданские лица - все ждут, сможет ли этот новый атаман консолидировать власть... или уступит её.\n\nНародное собрание, долгое время терпимое и часто отодвигаемое на второй план, теперь нажимает на своё преимущество."
tramsem.21.d2: "Переворот удался, но он ничего не решил. Алексей Бакшеев устранил Семёнова во имя стабильности, полагая, что режим можно сохранить, если отсечь самый опасный его элемент. Но, сделав это, он раскрыл истину, которую сам Семёнов понимал слишком хорошо: власть в Приамурье покоится исключительно на лояльности вооружённых людей.\n\nПри растущем недовольстве Сибирской армии ситуация ясна: один атаман свергнут другим, и если этот цикл не будет разорван, Приамурье пожрёт само себя в бесконечной цепи переворотов. Действуя быстро, Анатолий Пепеляев собирает верных офицеров и выступает, прежде чем Бакшеев успеет консолидировать ту малую власть, которой обладает - так что ему пришлось отступить. В течение нескольких дней вся власть в государстве была восстановлена в том, что осталось от старой колчаковской армии, Анатолий Пепеляев был провозглашён Верховным правителем и восстановил Адмиральский Совет министров, когда-то упразднённый."
tramsem.21.a: "Ситуация ещё не стабильна."
tramsem.21.b: "Войско выполнило свой долг."
tramsem.21.c: "Это был правильный шаг."

tramsem.22.t: "Верховный атаман"
tramsem.22.d: "Церемония устроена с той обдуманной пышностью, тщательным заимствованием символов из старых, более великих традиций. Офицеры в отполированных мундирах стоят в строгом строю. Казачьи старейшины собираются под знамёнами, пережившими несколько правительств. Клерки, священники и знатные люди призваны засвидетельствовать то, что является одновременно и провозглашением, и представлением.\n\nДекрет зачитывается вслух перед собравшимися рядами, оформляя трансформацию власти Семёнова во власть Верховного атамана. Это титул, напоминающий Гетманат Скоропадского своим смешением реставрации, военного достоинства и политической импровизации. Только здесь степь и тайга, а не старые земли Днепра, служат местом действия. Летописцы говорят о Ермаке. Старый завоеватель Сибири упоминается как прецедент, и старообрядческий митрополит благословляет Верховного атамана и помазывает его священным миром. И так Семёнов становится не только главой этого нового Атаманата, но и его избранным воплощением как завоеватель, защитник и наследник неспокойного сибирского похода."
tramsem.22.a: "Остаться Дальневосточным казачьим государством."
tramsem.22.b: "Провозгласить Сибирское казачье государство."

tramsem.23.t: "Верховный атаман"
tramsem.23.d: "Провозглашение не стало неожиданностью. К тому моменту, когда декрет был зачитан вслух, его форма уже была подготовлена месяцами тихого накопления: обеспечены железнодорожные линии, подчинены пограничные советы, заисканы монгольские нойоны, защищены маньчжурские поселения, разбиты, подкуплены или поставлены на службу банды хунхузов. Семёнов стоит перед собравшимися офицерами, казачьими старейшинами, клерками, поселенцами и посланцами под знаменем, которое больше не принадлежит просто региону или одному войску. Термин «Желтороссия» произносится с намеренной осторожностью. Это старая идея, но не простая. Для одних она означает ведомую русскими пограничную полосу, проходящую через земли Приамурья, Маньчжурии и восточных окраин, где русское поселение, военный порядок и азиатская политика сливаются в единую восточную систему.\n\nРусским поселенцам в Маньчжурии говорят, что их больше не оставят на произвол судьбы, репрессиям или хищнической местной власти. Их фермы, мастерские, железнодорожные депо и кварталы теперь являются частью более широкого восточного государства, защищаемого людьми, которые понимают, что значит жить за пределами досягаемости Московии. О бурятах и монголах говорят не как о подданных, которых нужно стереть, а как о народах, земли и лояльности которых должны быть организованы в новый порядок, а не раздавлены им.\n\nМонгольские князья, ламы и местные командиры знают его имя и помнят, что Верховный атаман понимает степную политику лучше, чем большинство русских командиров когда-либо понимали. Если Унгерн был безумным пророком степи, то Семёнов представляет себя её практическим хозяином. Хунхузам тоже есть место в этом новом порядке - некоторые выслеживаются и уничтожаются, но те, кто лоялен, поглощаются, лицензируются или подкупаются. В этом истинный гений Желтороссии в том виде, как её использует Семёнов: пограничная цивилизация с русским хребтом и азиатским размахом, скреплённая военной властью, поселением, торговлей и страхом."
tramsem.23.a: "Верховный атаман будет править Желтороссией."

tramsem.24.t: "Казачья конституция"
tramsem.24.d: "Настал час придать форму власти. Армия, советы, комитеты и оставшиеся собрания больше не могут сосуществовать как соперники, притворяющиеся институтами. При новом порядке вся власть в Казачьем государстве будет исходить из одного источника: от Атамана.\n\nТо, что последует, - это не просто хартия, а заявление о том, каким государством должно стать Приамурье. Некоторые приводят в пример атамана Краснова на Дону, где Войско стоит как живое тело государства, а местное казачье самоуправление сохраняется под сильной военной булавой. Другие указывают на Украину гетмана Скоропадского, где порядок поддерживается через более формальную, бюрократическую государственность, где министерствам, ведомствам и дисциплине отдаётся предпочтение перед старыми кругами и обычаями.\n\nНо есть и третий путь: конституция, сформированная необходимостью. В этой версии законы Казачьего государства будут созданы только для Приамурья - достаточно жёсткие, чтобы командовать на границе, достаточно гибкие, чтобы выжить в ней, и полностью сосредоточенные на воле Семёнова, который только и может решить, является ли Государство Войском, Гетманатом или чем-то ещё более странным."
tramsem.24.a: "Мы создадим нашу конституцию по образцу Краснова."
tramsem.24.b: "Гетманат Скоропадского будет нашим примером."
tramsem.24.c: "Мы должны адаптировать наш Закон к обстоятельствам... и климату."

tramsem.25.t: "Войско как государство"
tramsem.25.d: "Новая конституция провозглашена, а вместе с ней - своего рода возвращение к традициям Дона.\n\nПоскольку Казачье войско больше не является просто военным сословием, а самой основой государства, власть исходит от Атамана, но передаётся и поддерживается войсковыми атаманами, Войсками, станицами и их избранными или утверждёнными лидерами. Местные Казачьи круги не упраздняются, а встраиваются в иерархию, которая сохраняет их обычаи, обеспечивая при этом их лояльность.\n\nДля многих казаков это чувствуется как оправдание. Их образ жизни не заменяется чиновниками и бумажными декретами, земля, служба и привилегии снова связаны воедино, и граница дышит немного легче в знакомом ритме.\n\nНо за пределами Войска картина менее определённая. Поселенцы, горожане и неказачье население теперь оказываются в системе, к которой они не полностью принадлежат. Государство сильно там, где сильно Войско, и слабее там, где его нет."
tramsem.25.a: "Войско понесёт Государство."

tramsem.26.t: "Порядок превыше всего"
tramsem.26.d: "Используя пример Гетманата, казачье государство было преобразовано во что-то более дисциплинированное, более читаемое и более контролируемое. Учреждена Казачья дума, определены должности, а власть распределяется по цепи командования, которая мало обязана импровизациям. Войско остаётся одним из столпов наряду с другими, подчинённое централизованной администрации, которая отчитывается непосредственно перед Атаманом.\n\nДля офицеров и чиновников это облегчение, поскольку хаос перекрывающихся полномочий начинает отступать, заменяясь процедурами, отчётами и предсказуемым управлением. Для казаков, однако, изменение более двусмысленно, поскольку их традиции сохраняются по названию, но ограничиваются на практике. Свобода уступает место порядку, медленно, но неуклонно.\n\nСемёнов решил дисциплинировать свою Границу. Поступая так, он приблизился к чему-то напоминающему государство..."
tramsem.26.a: "Государство должно быть сильнее границы."

tramsem.27.t: "Закон границы"
tramsem.27.d: "Конституция казачьего государства стоит как нечто совершенно особенное. Она заимствует, где должна, игнорирует, где может, и изгибается, где вынуждена. В одних местах Войско управляет само собой. В других - назначенные коменданты правят с почти полной властью. В городах администраторы импровизируют между регламентацией и выживанием. Нет единой системы, только иерархия, которая в конечном счёте ведёт обратно к одному человеку.\n\nДля посторонних это выглядит непоследовательным, даже противоречивым. Семёнов не пытался разрешить хаос Приамурья, вместо этого он заставил его служить себе. И в центре всего этого не остаётся сомнений в том, где на самом деле находится власть."
tramsem.27.a: "Граница устанавливает свои собственные правила."

tramsem.28.t: "Атаман и преступный мир"
tramsem.28.d: "От железнодорожных депо на побережье до караванных путей внутри страны, от рынков городов до отдалённых переправ - теневая экономика выросла во что-то огромное и неоспоримое. Контрабандисты перемещают товары быстрее официальных каналов, банды хунхузов устанавливают свой собственный порядок, казачьи патрули, ответственные за подавление, теперь собирают дань, улаживают споры и решают, какие потоки торговли разрешены.\n\nВо многих местах различие между властью и преступностью размылось до неузнаваемости. Некоторые в администрации предупреждают, что государство растворяется в лоскутном одеяле личных договорённостей, что чиновники становятся брокерами, а лояльность покупается, а не приказывается. Они утверждают, что если это продолжится, не останется закона, который можно было бы обеспечивать, - только конкурирующие интересы, скреплённые страхом и выгодой.\n\nДругие менее обеспокоены. Они указывают, что поезда ходят, рынки снабжаются, и граница по-своему более стабильна, чем была годами. Семёнов понимает истину, стоящую за обоими взглядами. Он построил государство, где страх обеспечивает послушание, где казачий образ жизни расширяется и где выживание зависит от силы, а не от разрешения. Но теперь перед ним стоит другой вопрос: обеспечивать соблюдение своих правил или извлекать выгоду из их?"
tramsem.28.a: "Пусть они работают. Всё течёт через нас."
tramsem.28.b: "Это зашло слишком далеко. Вернуть контроль."

tramsem.29.t: "Корона для России"
tramsem.29.d: "Месяцами, возможно, годами, Регентство существовало как обещание, а не как реальность. Трон без государя, государство без коронованной главы - скреплённое утверждением, что однажды, когда придёт время, Романов вернётся.\n\nТеперь этот момент настал. Или, скорее, его заставили настать. Приглашения были разосланы по остаткам эмиграции, через тихие каналы и осторожных посредников. Имена рассматривались - люди с более сильными претензиями, более чёткой легитимностью и более широким признанием среди монархистов. Но один за другим они отказывались. Они не будут коронованы при Семёнове - не при его методах, его союзах, его репутации. Принять такой трон, утверждали они, запятнает монархию безвозвратно. И так круг сузился.\n\nВ конце концов согласился только один. Великий князь Никита Александрович Романов, человек с меньшими претензиями, но достаточным именем, принял предложение - по убеждению или по амбициям. Церемония была подготовлена со всей возможной торжественностью: подняты знамёна, собрано духовенство, вызваны офицеры и делегаты.\n\nОднако в мыслях атамана было вот что: это не империя, какой она была когда-то. Человек, который примет её, готов, но не бесспорен. И тот, кто сделал всё это возможным, не отступает в сторону, а стоит за этим, наблюдает, оценивает. Если корона будет возложена, это легитимизирует его государство, но Царь, даже слабый, меняет природу власти, и власть больше не принадлежит только ему, даже если на практике мало что изменится. Но если он остановится сейчас, если объявит момент недостаточным, кандидата недостойным - тогда его собственное правление останется неоспоримым."
tramsem.29.a: "Пусть Никита Александрович будет коронован."
tramsem.29.b: "Нет. Только истинный Царь может занять трон."

tramsem.30.t: "Волк мёртв"
tramsem.30.d: "Новости из степи прибывают фрагментарно, затем с полной уверенностью: барон Роман фон Унгерн-Штернберг мёртв. Годами его имя путешествовало по Монголии одновременно как проклятие и молитва. Для одних он был освободителем, для других - безумцем, для многих - правителем более ужасным, чем хаос, который он якобы победил. Он пытался навязать степи своё собственное видение через огонь, наказания, мистицизм и меч. Теперь это видение закончилось кровью и крахом.\n\nДля Семёнова Унгерн никогда не был полностью надёжен, но он был полезен - восточный военачальник, который понимал, что власть в Монголии нельзя построить только на мягкости. Что более важно, его смерть оставляет после себя соперничающие фракции, бандитов, претендентов и оппортунистов, стремящихся забрать то, что осталось. Если Монголию предоставить самой себе, она не станет стабильной."
tramsem.30.a: "Монголия должна быть стабилизирована, прежде чем она будет захвачена хаосом."

tramsem.31.t: "Против безбожных Советов"
tramsem.31.d: "Они выходят из лесов по ночам, из деревень, с заброшенных путей и замёрзших речных дорог - партизаны, называющие себя мстителями и наследниками проигранного дела. Для Семёнова и его людей они проще: живые остатки безбожной советской власти, враги порядка, веры и самой России.\n\nРейды приказано проводить в районы, где, как говорят, прячутся партизаны. Заподозренные сочувствующие допрашиваются, информаторы вознаграждаются, а целым поселениям даётся понять цену укрывательства. Казаки говорят об очищении, о наказании, о создании примеров, настолько ярких, что ни один деревенский староста никогда больше не забудет, где находится власть."
tramsem.31.a: "Пусть узнают, что значит страх."

tramsem.32.t: "Колчаковско-семёновский раскол и последствия"
tramsem.32.d: "Из всех людей, которые помогли сформировать недоверие адмирала Колчака к Григорию Семёнову, немногие были столь же важны, как генерал Дмитрий Лебедев - штабной офицер большого влияния и малой привлекательности. Для него Сибирь была гнездом сложностей: нерегулярные лояльности, японское вмешательство, казачьи амбиции и слишком много личной власти в слишком немногих руках. В ухо Колчаку такие предупреждения имели вес. Семёнову нельзя доверять, утверждал Лебедев. Он слишком независим, слишком жесток, слишком привязан к иностранной поддержке и слишком опасен, чтобы оставлять его без контроля.\n\nГодами это суждение следовало за Семёновым как тень. Оно формировало назначения, отравляло доверие и делало каждое предложение атамана похожим на схему военачальника, а не на план государственного строителя. Но история имеет привычку менять своих свидетелей.\n\nПосле 1925 года, когда Семёнов вернулся на Восток с силой и поднял своё восстание, старое равновесие перевернулось. То, что когда-то было предупреждениями Лебедева, стало обвинениями Семёнова. Тот самый человек, который когда-то так уверенно говорил о дисциплине и ответственности, теперь стоял перед режимом, который больше ему не подчинялся.\n\nЛебедев стар теперь, но всё ещё опасен тем способом, которым такие люди всегда опасны. Он знает слишком много, помнит слишком много и провёл слишком много лет, веря, что правильно судил о казаках. Теперь атаман должен решить, что делать с генералом, который помог убедить Колчака в том, что Семёнов недостоин доверия."
tramsem.32.a: "Предать старого обвинителя военному суду."
tramsem.32.b: "Отослать его с Востока."
tramsem.32.c: "Держать его под наблюдением. Такой человек полезен живым."


tramjap.3.t: "Судьба российского Дальнего Востока"
tramjap.3.d: "Временная оккупационная администрация Юи Мицуэ подошла к концу, как сообщается из Токио. Однако это не конец колониальной администрации, поскольку различные японские чиновники предлагают сменить правительство во Владивостоке, чтобы успокоить местное население. Среди кандидатов - наш давний казачий союзник Григорий Семёнов, а также Меркуловы, представляющие владивостокские деловые круги."
tramjap.3.a: "Наш верный марионетка, атаман Семёнов, должен взять на себя руководство."
tramjap.3.b: "Продлить полномочия оккупационной администрации Мицуэ."
tramjap.3.c: "Передать власть гражданскому правительству."

tramjap.44.t: "Русско-Японская промышленная компания"
tramjap.44.d: "То, что начиналось как отдельные владения таких компаний, как Nissan и Mitsui, было оформлено как дзайбацу (японский корпоративный конгломерат) под названием Русско-Японская промышленная компания. Эта холдинговая компания частично принадлежит нашему правительству и отвечает за разработку сибирских минеральных богатств и их продажу в Японию через Владивосток. Mitsui переправляет китайских и корейских рабочих на свои новые шахты, обходя проблему нехватки рабочей силы в регионе. В других регионах используются русские, хотя условия там ужасны. Тем не менее, ресурсы региона редко разрабатывались так глубоко. Несомненно, это обогатит нас в долгосрочной перспективе."
tramjap.44.a: "Превосходно."
tramjap.44.b: "Договориться о большей доле для нас."
tramjap.44.c: "Следить, чтобы с христианскими рабочими обращались хорошо."

tramjap.45.t: "Опиумная проблема"
tramjap.45.d: "После того как регион оказался отрезанным как от отечественной российской промышленности, так и от большей части мировой торговли, японские компании пришли на смену, чтобы заполнить пробелы. Они продают многие повседневные промышленные товары более обеспеченным жителям Владивостока, Хабаровска, Благовещенска и других городских центров региона. В дополнение к более типичным потребительским товарам наблюдается также большой рост торговли опиумом, поскольку японские компании ищут более высокую прибыль. Особенно печально известны пропитанные опиумом сигареты, производимые в Корее, которые сочетают аддиктивные свойства табака с опиумом. Растущий доступ к дешёвому опиуму делает его употребление всё более распространённым, тогда как раньше это была в значительной степени привычка русских среднего класса."
tramjap.45.a: "Водка, опиум - какая разница."
tramjap.45.b: "Запретить опиум."
tramjap.45.c: "Как нам войти в этот бизнес?"

tramjap.46.t: "Инвестиции в Приамурье окупаются"
tramjap.46.d: "Создание Русско-Японской промышленной компании на русском Дальнем Востоке принесло японскому бизнесу хорошие дивиденды, поскольку Mitsui и Nissan отправляют российские руды на переработку и использование промышленностью островной Японии. Хотя на беспокойной русской стороне были местные проблемы, с незначительными затратами наша северная авантюра уже окупилась."
tramjap.46.a: "Превосходно."

tramjap.47.t: "Приобретены права на добычу в [TRM_lease.GetName]"
tramjap.47.d: "Права на добычу в [TRM_lease.Controller.GetNameDef] были проданы дзайбацу Mitsui-Nissan - Русско-Японской промышленной компании - по очень низкой цене. Компании уже начали переправлять туда рабочих из Кореи для строительства инфраструктуры и улучшения горнодобывающих объектов."
tramjap.47.a: "Превосходно."

tramnews.1.t: "Смерть адмирала Колчака"
tramnews.1.d: "Сообщения из Владивостока подтверждают скоропостижную смерть адмирала Александра Колчака, Верховного правителя Дальневосточной республики. В официальном коммюнике его кончина приписывается кровоизлиянию в мозг после нескольких дней ухудшающегося здоровья. Колчак, один из самых выдающихся командиров Гражданской войны в России и центральная фигура в установлении послевоенного порядка на Дальнем Востоке, управлял Приамурьем как посредническая власть между конкурирующими военными, политическими и коммерческими интересами. Его руководство, хотя часто описываемое как неохотное, широко считалось стабилизирующей силой в регионе, определяемом конкурирующими фракциями и иностранным влиянием.\nЕго смерть оставляет после себя неопределённость, поскольку во Владивостоке различные элементы, включая военные круги, гражданских администраторов и иностранных представителей, уже маневрируют, чтобы определить будущее государства. Наблюдатели отмечают, что личный авторитет Колчака долгое время маскировал глубинные разногласия, которые теперь могут выйти на первый план."
tramnews.1.a: "Наблюдать за развитием событий, прежде чем принимать обязательства." #JAP
tramnews.1.b: "Трагическая потеря для России." #russian friends
tramnews.1.c: "Пережиток прошлого ушёл." #russian foes
tramnews.1.e: "Внимательно следить за ситуацией." #others

tramnews.2.t: "Покушение на адмирала Колчака в Приамурье"
tramnews.2.d: "Сегодня во Владивостоке нелояльные генералы предприняли попытку убийства бессменного лидера Приамура, адмирала Колчака. Недовольные твёрдой политикой Колчака и японской зависимостью, офицеры во главе с Михаилом Дитерихсом были разбиты гвардейцами Колчака. Возможно, теперь адмирал Колчак будет управлять страной ещё более твёрдой рукой, очищая армию и уничтожая оппозицию."
tramnews.2.a: "Ублюдок считает себя непобедимым."
tramnews.2.b: "Тревожные новости."

tramnews.3.t: "Возрождение Царства в Приамурье"
tramnews.3.d: "Российская республика, созданная в последние годы Вельткрига, кажется, останется сильной без абсолютной власти Царя. Однако это не относится к частично признанному государству Приамур на Дальнем Востоке. Государственные информационные агентства теперь сообщают, что преемник Николая II был коронован царём всех россиян.\n\nПока неизвестно, каковы международные приоритеты возрождённой Российской империи, и даже если коронация Царя успокоит бурную нацию, многочисленные монархи по всему миру уже поздравили Романовых с восстановлением их божественного права на Царствование."

tramnews.4.t: "[TRM.GetLeader] принимает руководство над Россией"
tramnews.4.d: "Около года или двух назад никто не поверил бы, что частично признанное государство, сильно зависимое от Японии и едва поддерживаемое русскими, объединит страну под своим знаменем. Лидер Дальневосточной республики Приамурье после тяжёлой Сибирской войны капитулировал перед предыдущим российским правительством и провозгласил суверенитет Приамурья по всей стране. Как мир отреагирует на новую Россию, чего ожидать от нового правительства, пока неизвестно, однако опасаются, что Русский Медведь будет более решителен, чем когда-либо."
tramnews.4.a: "Россия наконец едина."

tramnews.5.t: "Социалистическая победа в Приамурье"
tramnews.5.d: "Народно-революционная армия, подпольная большевистская организация, действующая в Приамурье, свергла адмирала Колчака и восстановила Советскую власть по всей стране. Хотя неизвестно, является ли новое социалистическое правительство прямым преемником большевиков, ясно, что это событие сильно дестабилизирует регион и повлияет на весь мир."
tramnews.5.a: "Поздравить новое правительство."
tramnews.5.b: "Это определённо дестабилизирует азиатский регион."

tramnews.6.t: "Атаман Семёнов захватывает власть в Приамурье"
tramnews.6.d: "Лидер Забайкальского казачьего войска, атаман Семёнов, захватил власть в Дальневосточной республике Приамурье. Говорят, что Семёнов имеет связи с Японской империей и что он не сделал бы этого без вмешательства Токио. Хотя неизвестно, чего теперь можно ожидать от Приамурья, ясно, что это событие сильно дестабилизирует регион."
tramnews.6.a: "Казачье государство на Дальнем Востоке?"

tramnews.7.t: "Приамурье погружается в хаос!"
tramnews.7.d: "К нам поступили тревожные новости: вчера произошло падение Дальневосточной республики Приамурье и её распад на части. Будущее самопровозглашённого законного Российского государства неизвестно, и пока политики борются за легитимность и власть, нам остаётся только наблюдать, кто выйдет победителем из этой гражданской войны."
tramnews.7.a: "Тревожно."

tramnews.8.t: "Иннокентий Смолин восстанавливает порядок на Дальнем Востоке"
tramnews.8.d: "Несмотря на почти невозможные шансы, губернатор Якутии Иннокентий Смолин восстановил порядок в Дальневосточной республике Приамурье. Выступив из замерзших пустошей Якутии, мало кто ожидал, что Смолин добьётся успеха в своей цели восстановить порядок на Дальнем Востоке. Бывший доверенное лицо покойного адмирала-диктатора, новый Верховный правитель клянётся продолжить миссию Колчака по объединению России."
tramnews.8.a: "Новый Верховный правитель?"

tramczech.1.t: "Чехословацкий легион блокирует железную дорогу!"
tramczech.1.d: "Чехословацкие легионеры вышли на поле боя... Наше решение резко ограничить их свободу привело к военному мятежу, возглавляемому этими офицерами. Сегодня легионеры нарушили движение на нескольких ключевых узлах Транссиба, стремясь парализовать линии связи с целью захвата контроля над всем Дальневосточным регионом.\n\nРешающее сражение разворачивается недалеко от [ROOT.Capital.GetName] под командованием Радолы Гайды, и исход этой схватки определит не только будущее Легиона, но и судьбу всей нации."
tramczech.1.a: "Обезоружить предателя Гайду!"
TRM_disarmed_czech_legion: "Чехословацкий легион был разоружён"
tramczech.1.b: "Легионеры движутся на [ROOT.Capital.GetName]!"

tramczech.2.t: "[ROOT.Capital.GetName] захвачен Легионом!"
tramczech.2.d: "К сожалению, правительство не смогло действовать достаточно быстро, чтобы предотвратить мятежную угрозу. Используя бронепоезда и заручившись поддержкой некоторых офицеров и воинских формирований под командованием генерала Войцеховского, повстанцы захватили стратегические позиции в нашей столице и арестовали действующее правительство."
tramczech.2.a: "С арестом [ROOT.GetLeader] генерал Войцеховский захватывает власть."

tramczech.3.t: "Вопрос о руководстве"
tramczech.3.d: "Относительно бескровный путч чехословаков не разрешил фундаментальный вопрос о том, кто возглавит эту новую военную диктатуру. Сергей Войцеховский, доверенное лицо Генерального штаба, и в то же время знакомый с Дальним Востоком и Сибирью, был бы наиболее логичным выбором. Однако сами легионеры поддерживают Радолу Гайду, этнического чехословака, у которого есть особые идеи как относительно будущего Дальнего Востока, так и относительно будущего Чехословакии."
tramczech.3.a: "Генерал Войцеховский поведёт нас!"
tramczech.3.b: "Вверить правительство Гайде!"

trammlad.1.t: "Судьба Казем-Бека"
trammlad.1.d: "Александр Казем-Бек - отец нашего младоросского движения. Наша группа, восприняв большинство тезисов Казем-Бека, не могла смириться с одним - его вождизмом. Именно вождизм Казем-Бека, которым он, по-видимому, заменил свои монархические убеждения, был причиной, по которой мы совершили против него переворот. Некогда великий основатель нашего движения впал в оппортунизм ради личной власти.\nНо теперь перед нами встал вопрос - что с ним делать?\n\nОдна часть наших товарищей по партии считает, что, поскольку Казем-Бек является основателем нашего движения, мы должны отнестись к нему как можно более гуманно - оставить в живых, но запретить заниматься какой-либо политической деятельностью вообще.\n\nДругая часть, также не отрицая вклада Казем-Бека в наше движение, считает, что его следует заключить в тюрьму, поскольку его свобода представляет опасность, так как он потенциально может совершить переворот против нашего правительства.\n\nВ результате внутрипартийной дискуссии было решено, что..."
trammlad.1.a: "...Казем-Бек не представляет для нас опасности, пусть живёт на воле."
trammlad.1.b: "...Влияние Казем-Бека всё ещё велико. Посадить его в тюрьму!"

trammlad.2.t: "Принципы демократии"
trammlad.2.d: "По сути, по содержанию демократия означает совокупность определённых принципов. Где есть эти принципы, там есть демократия, а где таких принципов нет, там нет демократии. И никакая фразеология этого изменить не может. (Но, конечно, возможны разные степени приближения. С этой точки зрения одни государства могут быть более, а другие менее демократичными. Но сути это не меняет).\nИтак, каковы эти принципы? В краткой статье трудно дать исчерпывающую характеристику. Но можно обозначить общие черты. Сведём их к семи положениям.\n1) Свобода совести и культов.\n2) Свобода слова, мысли, печати и научного творчества.\n3) Политическая свобода - для всех, и особенно для оппозиции. Где нет оппозиции, там нет демократии. Наличие или отсутствие оппозиции - один из самых ярких критериев. Нелепо говорить, что демократия даёт свободу только сторонникам правящего большинства (а иногда добавляют - и правящего меньшинства). Любое правительство даёт своим сторонникам свободу и поощрение, а особое - недемократическое. Вопрос о пределах допустимой оппозиции (в демократиях) решается реально, то есть психологией общества, его культурными и правовыми понятиями.\n4) Представительные учреждения действенны и реальны, а не формальны и фиктивны.\n5) Свободные выборы.\n6) Ответственное министерство.\n7) Независимые суды.\nИ опять же - ответственное правительство, независимые суды - всё это трудно определить формально, но абсолютно реально «почувствовать», «пережить»."
trammlad.2.a: "Мы должны построить истинно демократическую Россию!"

trammlad.3.t: "Владивостокская коронация"
trammlad.3.d: "Сегодня во Владивостоке состоялась торжественная церемония коронации и восшествия на престол нашего нового монарха - после десятилетий пустующего трона. Полностью организованная партией младороссов, церемония соответствовала всем канонам, за исключением ярко выраженного национального характера - повсюду были развешаны красные флаги, а Царь был одет в алые и багряные тона.\n\nЦеремония завершилась торжественным маршем, фейерверком и ощущением, что новая власть принесёт России долгожданную свободу и процветание."
trammlad.3.a: "Да здравствует наш славный Царь!"

trammlad.4.t: "Владивостокская коронация"
trammlad.4.d: "Хотя Россию, предположительно, уже возглавляет монарх, сегодня во Владивостоке, без официальной церемонии коронации, отложенной на потом - когда вся Россия будет под нами, состоялась процедура избрания нового Царя. Специально созванный, демократически избранный Регентский совет должен решить, кому из четырёх кандидатов нового поколения Романовых будет предложен трон."
trammlad.4.a: "Роман I."
trammlad.4.b: "Всеволод IV."
trammlad.4.c: "Андрей IV."
trammlad.4.e: "Георгий как Михаил II."

trammlad.5.t: "Здоровое национальное сознание"
trammlad.5.d: "Самой надёжной гарантией и одновременно абсолютно необходимым условием правильного и прочного решения всех вопросов государственной жизни, при любых обстоятельствах, является здоровое национальное сознание, присущее, если не всей нации, то, по крайней мере, её ведущему слою. Но здоровое национальное сознание зависит, прежде всего, от степени укоренённости в нём некоторых предпосылок, представляющих собой как бы фундамент государственного бытия нации. Твёрдость этих предпосылок в национальном сознании - первое условие жизнеспособности государства. Поэтому всё, что им противоречит, что создаёт прецеденты, подрывающие их твёрдость в восприятии людей, что служит ослаблению их ясности в национальном сознании - всё это должно отвергаться без всяких колебаний, и никакие обстоятельства, никакие соображения, никакие цели не могут этого оправдать. Ибо нелепо ради спасения государства подрывать его самую основную жизнеспособность, нападать на сами источники его существования. Также нелепо ради борьбы за свою веру нарушать, искажать и отбрасывать её самые основные требования и заветы.\nНам представляется, что самая основная, самая необходимая предпосылка, без наличия которой в национальном сознании просто немыслимо само существование великого и жизнеспособного государства, - это вера в само отечество. Эта вера состоит из двух элементов: во-первых, вера в то, что независимое существование, развитие и величие Отечества есть ценность высшего порядка, и во-вторых, вера в духовные и физические силы нации, в то, что она достойна великого исторического жребия и способна собственными силами справиться с выпавшей на её долю исторической миссией. Заметим, кстати, что вера русской нации в самой себе, в глазах всех её составных частей, всех племён и народностей, её составляющих, служит, в частности, главным фактором, обеспечивающим существование России как единого государства. Именно падение этого престижа лежит в основе всех сепаратистских течений, всех центробежных сил нашего времени.\nКак всякий живой организм, всякая здоровая и жизнеспособная нация обладает естественным инстинктом самосохранения. И вот, у нации, достигшей в своём культурном развитии государственного бытия, этот инстинкт неотделим, скажем, сливается с верой в своё отечество. Он порождает эту веру, но и ею порождается и укрепляется. Более того, он перерождается ею из инстинкта обычного, принадлежащего только подсознанию, в осознанное и разумное стремление. Ибо только вера может вложить в этот инстинкт здоровый смысл и дать ему разумное оправдание и обоснование в глазах людей. Но у здоровой нации, живущей государственной жизнью, инстинкт самосохранения находит конкретное выражение, прежде всего, в том, что все стремления этой нации подчиняются желанию сохранить и обеспечить независимость и безопасность своей страны, в её целостности. Практически, преобладание этого стремления над всеми другими выражается в неуклонной верности, сознательной или бессознательной, принципам, требующим от нас: 1) охранять любой ценой и в предпочтение всем другим делам суверенитет нашего отечества, 2) защищать целостность его территории и 3) отстаивать, при всех обстоятельствах, его престиж, как вовне, так и внутри.\nВне этих принципов не может быть ни веры в отечество, ни национальной гордости, ни вообще истинного национального сознания."
trammlad.5.a: "Вне этих принципов - пораженчество!"

trammlad.6.t: "Судьба сибирского областничества"
trammlad.6.d: "Хотя сибирское областническое движение всё ещё остаётся по большей части региональной легендой, их влияние с годами возросло, и некоторые офицеры до сих пор их поддерживают. Хотя мы стоим за Единую и Неделимую Россию, мы можем искать некоторое сотрудничество с этой интеллигенцией, чтобы обеспечить дополнительных союзников для нашего режима."
trammlad.6.a: "Раздавить сепаратистов!"
trammlad.6.b: "Сотрудничать с областниками!"

trammlad.7.t: "Судьба НРА"
trammlad.7.d: "НРА, будучи близкой к нашим взглядам, в то же время выступает против любой монархической идеи. Для них мы - реакционеры, прячущиеся за красными знамёнами. Однако они являются полезными союзниками, учитывая их опыт партизанской войны и идеалы социалистической Родины. Мы должны решить, стоит ли заключать с ними союз."
trammlad.7.a: "Раздавить партизан!"
trammlad.7.a2: "Они несущественны, не обращать внимания."
trammlad.7.b: "Найти компромисс."

trammlad.8.t: "Союз с евразийцами... но с какими?"
trammlad.8.d: "Евразийство - это движение, возникшее после большевистской революции 1917 года, интерпретирующее её как бунт народа против европеизированной элиты. Евразийцы утверждают, что Россия - это не Европа и не Азия, а нечто третье: Евразия. Говоря, что российская государственность происходит не только из Киевской Руси, но и из Золотой Орды, они проповедуют уникальный путь России, не принадлежащий ни Европе, ни Азии. И вот мы обращаемся к ним за поддержкой нашего движения. Но партия евразийцев - это партия многих людей, поэтому мы должны решить, с кем нам следует попытаться установить связи. С одной стороны, самый очевидный вариант - попытаться связаться с Трубецким, потому что он глава партии, и если он поддержит нас, то и вся партия евразийцев вместе с ним. Но есть одно но - у нас с ним слишком мало точек соприкосновения, поэтому такой союз вряд ли будет долговечным. С другой стороны, в партии есть небольшое число так называемых левых евразийцев под руководством Дмитрия Святополк-Мирского и Романа Якобсона, которые ближе к нашим социальным взглядам, но антимонархичны. И теперь мы должны решить, с кем нам лучше установить контакты - с Трубецким или со Святополк-Мирским и Якобсоном."
trammlad.8.a: "Хотя Трубецкой не самый надёжный союзник, он сможет привлечь больше на нашу сторону."
trammlad.8.b: "Святополк-Мирский и Якобсон будут нашими верными союзниками."

trammlad.9.t: "Чехословацкий вопрос"
trammlad.9.d: "Чехословацкие легионеры слишком долго терроризировали наши земли. Пришло время изгнать эти орды из нашей страны."
trammlad.9.a: "Разоружить Легион!"
trammlad.9.b: "Сотрудничать с ними."

trammlad.10.t: "Переворот Угримова и социал-демократической фракции"
trammlad.10.d: "Тот факт, что Казем-Бек и его приближённые не смогли справиться с простейшим решением - восстановить российский престол - является позором для партии молодороссов, не говоря уже о широко распространённом руководстве и культе личности. Благодаря благородным офицерам, не поддержавшим этот вопиющий режим, небольшая фракция Александра Угримова и его соратников смогла организовать дворцовый переворот, взяв руководство партией младороссов под временную охрану.\n\nАлександр Угримов был немедленно избран председателем Младоросского регентского совета и провёл новые выборы в его состав, тем самым получив легитимность для своего режима. Новая фракция у власти гораздо более демократична и, как утверждается, исповедует истинные устремления молодороссов и ортодоксальный взгляд на доктрину «Царь и Советы»."
trammlad.10.a: "Истинное движение младороссов восстало!"

trammlad.11.t: "Восхождение России..."
trammlad.11.d: "Жизнь учит нас, что вечные идеалы людей, будь то идеал племени, нации или народа, находят своё ярчайшее выражение в единовластии, и именно в том случае, когда руководство принадлежит лицу, указанному вековечным обычаем, - как бы самой природой для того предназначенному. И такой человек, не по мере своих личных заслуг, а именно по своему высокому предназначению, более других способен постигать общие идеалы и самоотверженно им служить. Так, забота родителей о детях вообще осмысленнее и действеннее труда чужих, даже очень хороших людей. Дети могут не считать своих родителей людьми, самыми лучшими - это было бы наивно. Но дети чувствуют и вообще правы, что их родители именно по отношению к ним, их детям, лучше других людей. Такого рода соображения применимы ко всякого рода исторически сложившемуся единовластию. Монархическая власть, собственно, и основана на признаках целесообразности такого единовластия. По смыслу своему и по характеру происхождения монархическая власть возможна только в условиях органического общежития людей, иначе говоря, в таком общежитии, которое в результате долгого существования обрело единство и в той самой области своей жизни, где оно пришло к безраздельному авторитету и выработало себе вождя. А поскольку власть монарха зиждется на всеобщем единении, целесообразность её усугубляется тем неоспоримым фактом, что везде, где цели и средства их достижения ясны, единоначалие всегда наиболее действенно и плодотворно. Хотя бы в силу такого чисто практического соображения идеал соборной жизни требует монархии. Но если власть монарха, завершая собою единение нации, является, прежде всего, выражением и оплотом её идеалов, то ясно, что в своих действиях монарх несвободен, а подчинён им, этим идеалам."
trammlad.11.a: "Да здравствует Царь!"

trammlad.12.t: "Восхождение России..."
trammlad.12.d: "Это обстоятельство, отличающее его власть от власти абсолютной, не знающей никаких преград и руководствующейся единственно собственным разумением и волей, является самой существенной чертой русского понимания монархии, той монархии, которая у нас искони называлась самодержавной. При таком положении вещей монарх предстаёт как бы исполнителем не воли своих современников, а совокупной воли всей нации. Поэтому его власть нельзя назвать исполнительной в обычном смысле этого слова. Однако чтобы монарх успешно нёс бремя власти, он должен иметь тесную связь с нацией в целом, с её прошлым, настоящим и будущим. Ведь сущность монархической власти, собственно, и есть полное единение нации с её вождём. Этого единения требуют и русские национальные идеалы, которым служит монарх. Так, согласно русскому пониманию монархии, Царь должен быть православным. Православное понимание соборности требует участия всех верующих в раскрытии воли Божией. Православная церковь, таким образом, есть церковь соборная. А соборное понимание воли Божией создаёт особенно благоприятные условия для самодержавной монархии. Истинное самодержавие, в чисто русском смысле, в отличие от деспотического абсолютизма западных монархий, возможно только при православии. Согласно русскому пониманию монархии, Царем может быть только тот, кто предназначен к тому церковным строем, - предназначен судьбой, а не людьми. Царь, как и отец, должен быть естественным. Многовековая общая жизнь нации и возглавляющей её династии способствует их духовному единению и делает то, что идеалы нации, в создании и развитии которых династия участвует не только бесспорно, но и огромно, получают своё ярчайшее выражение именно в династии - становятся её родовым достоянием. И именно через династию монарх оказывается связанным со всем прошлым своей нации.\nВремя связывает нацию с её династией, - время наполняет их совместную жизнь взаимопониманием и доверием, взаимной любовью и чувством ответственности друг за друга. Время уничтожает зависимость монарха от народа, от его воли и тем ставит его в условия, наиболее благоприятствующие его беспристрастности, а значит, и справедливости. Но ещё более, чем независимость от воли подданных, монарх нуждается в постоянном и живом общении с ними. Ибо общение - источник всякого единения. Где нет общения, там нет единения, а где нет единения, там нет монархии. Общение монарха с подданными духовно их объединяет, и каждый отдельный момент не только охраняет созданное - их духовное единение, - но и продолжает творить это единение, питает его, распространяя на всё новое, что выдвигает вечно меняющаяся жизнь."
trammlad.12.a: "Да здравствует Царь!"

trammlad.13.t: "Восхождение России..."
trammlad.13.d: "Чувство и сознание этой беды неизбежно распространится среди подданных, ибо каждый из них так или иначе является носителем национальных идеалов... Но русская история почти не знает таких моментов. Поскольку монарх сочетает понимание национальных идеалов и верность им с беспристрастием и справедливостью, постольку добровольное подчинение ему современников и естественно, и выгодно, ибо даёт возможность осуществить то, что нужнее всего нации, - её духовное единство. Но монарх не видит в насилии пути к установлению единства.\nОн должен дать всем возможность свободно участвовать в исканиях правды и лишь в случаях непримиримых разногласий указывать на мнение, которое он считает, чьё бы оно ни было, наиболее правильным. И всеобщее согласие с указанием монарха будет зиждиться или на всеобщем стремлении к правде и единению, или на сознании справедливости монаршего суждения, или на смирении перед мыслью, что единение необходимо, что только таким согласием его можно спасти, что иного пути к единению нет, да и быть не может. Ввиду того, что общие и, так сказать, надвременные интересы нации стоят выше местных и временных интересов её отдельных частей, голос монарха должен быть средоточием политической жизни нации, иначе говоря, верховная власть должна принадлежать монарху. Если считать, что монарх отстаивает перед современниками интересы всей нации, - интересы её прошлого, настоящего и будущего, и если распространить идею формальной демократии на всю совокупность членов нации - умерших, живущих и ещё не родившихся, - станет ясным, что монарх оказывается в большинстве и что он, один, должен иметь перевес над всеми своими современниками, вместе взятыми. Такое соображение, однако, будучи основано на признании превосходства большинства над меньшинством, а не правды над заблуждением, не согласуется с духом соборной жизни и не заслуживает, по-видимому, рассмотрения. Всеобщее и свободное искание правды, с монархом, выступающим в роли верховного судьи в борьбе различных чувствований и мнений, есть единственный путь к духовному единению нации. При этом сказанном функция монарха есть то, что ныне любят называть арбитражем. Монарх - это верховный арбитр. Но арбитражем не исчерпывается то значение, которое имеет монарх в соборной жизни нации.\nЕго участие в обсуждении вопросов, угрожающих всеобщему единению, облагораживает деятельность собора, сообщая ей дух искания правды и справедливости, иначе говоря, давая ей то нравственное направление, которое одно лишь и может привести людей к единению. Арбитраж - дело верховной власти. Верховная власть подчинена только тем идеалам, служить которым она призвана. В этом смысле самодержавный монарх не связан волей своих подданных. Но он обязан вести их по пути духовного единения, прислушиваться к их мнениям и решать по совести, где правда. И мы знаем, что отказ верховной власти от этого\nИтак, самодержавная монархия не только опирается на духовное единение нации, но и творит его. Рост национального единения и воспитание и творческая жизнь самодержавной монархии - процессы неразделимые, один от другого зависящие и один другой обусловливающие."
trammlad.13.a: "Русская история - богатейший пример этому."

trammlad.147.t: "Союз младороссов"
trammlad.147.d: "История движения «Молодая Россия» неразрывно связана с его лидером, харизматичным аристократом Александром Львовичем Казем-Беком, родившимся в 1902 году в богатой дворянской семье азербайджанского и иранского происхождения. Три идеологические фазы младороссов можно тесно сопоставить с жизнью и опытом самого Казем-Бека; что неудивительно, учитывая его роль оратора и идеолога. Будучи студенческим активистом, Казем-Бек помог сформировать «Союз Молодой России» в 1923 году. Объединяя 29 организаций и 4000 человек, молодороссы представляли монархическое молодёжное крыло. Склонные к интеллектуализму и идеологически расплывчатые, его члены совместно отвергали реакционный царизм в пользу «нового и динамичного видения». Будучи секретарём, Казем-Бек встретился с профессором Николаем Устряловым, некогда главой пресс-бюро при адмирале Колчаке. Устрялов убедил молодого аристократа поддержать путч против президента Керенского в 1924 году. Оба бежали в Приамурье после провала переворота, взяв с собой своих соответствующих сторонников. Устрялов разочаровался в Белом движении и начал боготворить большевиков как защитников российского суверенитета.\n\nФормирование «Союза молодороссов» в 1925 году ознаменовало вторую идеологическую фазу младороссов. Казем-Бек начал формулировать свой тезис о «Трудовой монархии» под руководством Устрялова. Зарождающаяся идеология младороссов сочетала абсолютную монархию, советскую демократию, православный интегрализм, русский национализм и «революционный дух». В этот период 1925-1933 годов большинство младороссов объединяли только театральные церемонии принесения клятв и чтение таких журналов, как «Бодрость!» и «К молодой России». Третья фаза наступила вскоре после поездок Казем-Бека в синдикалистские страны Европы. Казем-Бек был особенно вдохновлён прото-тотализмом французских и итальянских национальных синдикалистов, а также британских мозлистов. По возвращении в 1934 году Казем-Бек сформировал «Младоросскую партию» как её «Вождь». Его идеи о том, как организовать Молодороссийское государство, сформировались в однопартийную корпоративную модель под руководством Рабочего-Монарха.\n\nС жёсткой партийной структурой и растущим военизированным крылом Казем-Бек надеется достичь контроля над Приамурьем, а затем и над своей любимой родиной - Россией."
trammlad.147.a: "Националисты-монархисты? Интересно..."

trammlad.148.t: "Всероссийское националистическое движение"
trammlad.148.d: "Всероссийская национально-революционная трудовая рабоче-крестьянская партия националистов, или как их обычно называют, Всероссийское националистическое движение или просто Националисты, представляет собой ультранационалистическую политическую организацию, которая в последние годы стала всё более популярной среди граждан Приамурья. Сформированная в 1931 году местным политиком и лоялистом Колчака Анастасием Вонсяцким, Националисты нашли поддержку среди русских маньчжурцев и монархистов в изгнании. Молодые эмигранты, всё ещё верные идеалам русского Царства, стекались в это движение, восхищаясь пламенными речами Вонсяцкого, обличающими большевизм, Керенского и западный капитализм. Во всём этом он обвиняет разложение русского народа, одновременно заявляя о лояльности адмиралу Колчаку, Русской Православной Церкви и восстановленному Царству. Исповедуя идеологию отечественного происхождения «Истинного русского национализма», движение Националистов организовало своих членов в военизированную силу, известную как Чёрная гвардия, что, несомненно, является отсылкой к Чёрной сотне.\n\n Чёрная гвардия обеспечивала безопасность режима Колчака и участвовала в облавах на политических диссидентов, а также на видных членов еврейской общины Владивостока, обвиняемых в продвижении «опасных иностранных идеологий». Адмирал Колчак позволил этим действиям происходить, официально не поддерживая движение, возможно, чтобы успокоить японские власти, опасающиеся антииностранного движения."
trammlad.148.a: "Истинные русские патриоты, верные Колчаку!"

trammlad.149.t: "Александр Казем-Бек коронует себя как временный Царь!"
trammlad.149.d: "Из-за отсутствия интереса со стороны основных претендентов-царистов Александр Казем-Бек был вынужден импровизировать и объявить себя Временным Регентом до тех пор, пока не будет коронован настоящий Царь. Этот шаг доказал многим, что младороссы - не более чем шутка, и сильно подорвал нашу легитимность в глазах русского народа. Но Казем-Бек всё ещё питает надежду, что какой-нибудь претендент из Романовых свяжется с нами и позволит нам короновать его как Царя. Однако есть один положительный момент: позиции Казем-Бека никогда не были сильнее, так как технически над ним нет Царя, который бы царствовал; даже если бы Царь обладал небольшой реальной властью. Однако пока Народному Царству Приамурья придётся оставаться Царством только по названию."
trammlad.149.a: "Да здравствует Народный Царь-Вождь!"

trammlad.150.t: "Регентский совет делает окончательный выбор"
trammlad.150.d: "В одном из зданий Владивостока собрались богатые владивостокские политики, промышленные деятели и младороссы, чтобы устроить вечеринку, хоть и небольшую. Регентский совет завершил свою работу и был готов объявить нового Царя Всея Руси. Когда Казем-Бек объявил имя претендента, начались празднования и вечеринки, триумф гедонизма. Вскоре после этого всё тихо закончилось официальной коронацией самого Царя и речью Казем-Бека о введении России в современность и приведении её к величайшему времени со времён Екатерины Великой."
trammlad.150.a: "Слава Кириллу I!"
trammlad.150.b: "Слава Владимиру III!"
trammlad.150.c: "Слава Андрею IV!"

trammlad.152.t: "Сформирован Регентский совет"
trammlad.152.d: "Пока не будет коронован Царь, объявлен Младоросский регентский совет во главе с Великим Регентом самим Александром Казем-Беком. Однако ожидается, что Регентский совет просуществует недолго, и многие считают, что Коронация Царя не за горами."
trammlad.152.a: "Социалистический Царь? Боже мой!"

trammlad.500.t: "Вонсяцкий приглашён советовать Вождю"
trammlad.500.d: "Анастасий Вонсяцкий, глава фракции Националистов, был приглашён нашим Славным Регентом и Вождём Казем-Беком. После победы его фракции на Конференции! С этим был сформирован союз Националистов и младороссов, что сделало их самой доминирующей фракцией на Дальнем Востоке."
trammlad.500.a: "Ура Казем-Беку! Ура Вонсяцкому!"

trammlad.501.t: "Шихматов приглашён советовать Вождю"
trammlad.501.d: "Пётр Ширинский-Шихматов, один из глав Евразийцев, был официально приглашён после успеха его фракции на Конференции. С этим будет сформирован союз младороссов и евразийцев, обеспечивающий доминирование на дальневосточной политической сцене."
trammlad.501.a: "Ура Казем-Беку! Ура Шихматову!"

trammlad.502.t: "Войцеховский приглашён советовать Вождю"
trammlad.502.d: "Сергей Войцеховский, один из лидеров Чехословацкого легиона, был официально приглашён Вождём и Регентом Александром Казем-Беком стать его советником после победы его фракции на Конференции. Панславизм и младоросство объединятся в борьбе против Старой России."
trammlad.502.a: "Славяне и Советы!"

trammlad.503.t: "Большая конференция во Владивостоке"
trammlad.503.d: "Младороссам нужны союзники, и они нужны им отчаянно. Чтобы заполучить таких союзников, наш Великий Регент созвал конференцию для всех таких же радикалов, как они сами. Три главных участника конференции: панслависты, чехословацкие легионеры, всё ещё находящиеся в изгнании в Приамурье; Националисты, сторонники превосходства восточных славян, которые стремятся пропагандировать Россию для русских и только для русских и верят, что восточные славяне - это раса господ; и, наконец, национал-максималистская фракция евразийцев, люди, выступающие за империю не России, а Евразии от Британских островов до Японских островов и от самой северной России до самой южной Индии. То, что произойдёт на конференции, окажет долгосрочное влияние на усилия младороссов по возвращению России из-под власти Московского правительства и построению современной России."
trammlad.503.a: "Союз с Националистами."
trammlad.503.b: "Союз с Панславистами."
trammlad.503.c: "Союз с Национал-максималистами."

trammlad.505.t: "Смерть Кирилла Владимировича"
trammlad.505.d: "Царь всея Руси Кирилл I и защитник всех своих подданных трагически скончался на этой неделе от осложнений, связанных с преклонным возрастом. Состоялись государственные похороны, где тысячи людей собрались, чтобы оплакать смерть своего лидера, после чего он был тихо похоронен в присутствии только государственных чиновников и его семьи. Князь Владимир уже объявлен правительством новым Царём, ожидается, что он примет власть позднее на этой неделе."
trammlad.505.a: "С Богом."

trammlad.507.t: "Великому Регенту Казем-Беку нужны советские дворяне, чтобы возглавить Советскую Империю"
trammlad.507.d: "Демографическая ситуация на Дальнем Востоке не позволяет нам легко привести русское дворянство в наше руководство. Чтобы заполнить наши ряды достаточным количеством советских дворян, мы должны возвысить некоторых до нашего дворянского сословия. Великий Регент может выбрать один из двух путей для удовлетворения потребностей младороссов: мы можем либо возвести самых трудолюбивых людей Приамурья в статус дворян, либо возвести в дворянство и даровать титулы местным политикам."
trammlad.507.a: "Нам нужны политические услуги! Возвести их в дворянство!"
trammlad.507.b: "Даровать титулы самым трудолюбивым труженикам Приамурья!"

trammlad.508.t: "Вождь Казем-Бек о Владимире Ленине"
trammlad.508.d: "'...Ленин был заблудшим глупцом. Своей программой «Военного коммунизма» он убил несметное число людей, истощив Святую Русь, лишив её мужчин для борьбы с германским зверем. Его идеалы также были злы и распространяли зло. Синдикализм никогда не сработает в России. Единственный социализм, который восторжествует, - это НАШ социализм.'"
trammlad.508.a: "'Без него не будет России.'"

trammlad.509.t: "Партия о Николае II и Белой армии"
trammlad.509.d: "'Белая армия была армией, построенной на жадности и зле. Следуя приказам своих дьяволопоклонников-хозяев, они совершали ВЕЛИКИЕ зверства против народов России, чтобы победить большевистских «дьяволов»; в конечном счёте потребовался сам Великий Сатана, кайзер Германии, чтобы спасти их от героев Октябрьской революции. Их Царь-Дьявол Николай II был, безусловно, худшим Царём, который у нас когда-либо был, позволяя своей жене соблазняться дьяволом Распутиным и ничего с этим не делая! Сам он был слабой овцой, позволявшей кому угодно и чему угодно указывать ему, что делать. Кулаки-промышленники сказали ему не позволять Брусилову уничтожить германских агрессоров! Кулаки-промышленники сказали ему отречься, чтобы спасти свои шкуры! Кулаки-промышленники ПОТРЕБОВАЛИ не ехать в Англию, чтобы он мог умереть!'"
trammlad.509.a: "'Московское правительство - это правительство, построенное на лжи, обмане и манипуляциях!'"

trammlad.510.t: "Младоросская партия о Гражданской войне в России"
trammlad.510.d: "'...Это был конфликт, начатый немцами, чтобы осквернить Святую Русь своим коварным германизмом. Обе стороны играли им на руку! На самом деле они должны были объединиться, чтобы раз и навсегда победить германских агрессоров!'"
trammlad.510.a: "'Когда младороссы придут в Берлин, мы сделаем так, что не останется немцев, чтобы оспаривать господство России!'"

trammlad.512.t: "Марш гордых Синих Рубашек!"
trammlad.512.d: "Сильный Вождь требует не менее сильной армии, армии, верной несмотря ни на какие испытания. Армии, которая будет стоять плечом к плечу, готовой умереть за своего лидера и нацию. Армии, которая последует за Вождём до врат ада, никогда не подвергая сомнению приказ. Такую армию и создал Казем-Бек - Синие Рубашки, названные так из-за их тёмно-синих рубашек с красными нарукавными повязками и белых брюк. Эти титаны среди людей олицетворяют силу, необходимую для восстановления Русского Царства, но эти люди - не элитарные подхалимы, которые раньше стояли за Царём. Синие Рубашки состоят из суровых пролетариев рабочего класса, которые эволюционировали от драк на улицах Владивостока до дисциплинированных солдат, размахивающих знаменем России и младороссов. Вдохновлённые как преданными опричниками Ивана Грозного, так и ультранационалистическими ополчениями Чёрной сотни, они могут не иметь специальной подготовки и современного снаряжения, но они компенсируют это своей верой в матушку Россию!"
trammlad.512.a: "Мы шли в строю..."

trammlad.513.t: "Восхождение России..."
trammlad.513.d: "'Россия была страной, потерявшей свою идентичность, свою мораль и свой дух. Гниющий труп некогда великой империи, поистине печальное состояние для любого патриота родины... Однако не всё было потеряно! В самый тёмный час России нашёлся человек, который не собирался тихо уходить в ночь. Александр Казем-Бек горел пламенной страстью, которая зажгла свет в умах и душах работающих патриотов по всей русской земле. Он отверг падение в бездну, вызванное грызнёй фракций безжизненных орд, жаждущих разорвать друг друга на части во имя власти и наживы! Казем-Бек сплотил этих храбрых соратников-националистов, и вместе они победили внутреннего врага! Россия восстала из своего застойного состояния, она больше не больной человек на планете. Сердце России - это сердце младороссов, движение стало новой идентичностью России. И по мере того как устрашающая риторика Казем-Бека становится всё более доминирующей в умах многих, растёт и Россия. Будущее принадлежит нам, товарищи!'\n\n- Первая полоса сегодняшнего выпуска газеты «К молодой России»"
trammlad.513.a: "Посмотрим, что ждёт Казем-Бека в будущем..."

trammlad.514.t: "Покушение на Казем-Бека!"
trammlad.514.d: "Какой-то безумный фанатик сегодня совершил покушение на нашего Лидера, Александра Казем-Бека. Проклятому преступнику, несмотря на то, что Казем-Бека окружали Синие Рубашки, удалось прорваться почти в упор к Вождю и выстрелить в Вождя несколько раз!\n\nБыстро растерзанный разгневанной толпой, террорист так и не был опознан, его мотивы и политическая принадлежность остаются неизвестными...\n\nТяжело раненный лидер был отправлен в больницу во Владивостоке, где лучшие врачи Приамурья будут бороться за его жизнь."
trammlad.514.a: "Вонсяцкий временно заменит его."
trammlad.514.b: "Вождь скоро поправится."

trammlad.515.t: "Казем-Бек скончался!"
trammlad.515.d: "Даже лучшие врачи Приамурья не смогли спасти жизнь нашего лидера. Несколько пуль урода, извращенца, еретика - и человека больше нет.\n\nСмерть Вождя настигла нас в трудное время, и пока нет ему замены, кроме нового Лидера - Вонсяцкого, который согласился взять на себя ответственность за страну и народ в такое трудное для неё время.\n\nПо всей стране будет объявлен семидневный траур, флаги будут приспущены, а Вонсяцкий будет готовиться к священной присяге Регента."
trammlad.515.a: "Да здравствует новый Вождь!"

trammlad.516.t: "Знамя националистов поднято"
trammlad.516.d: "Вскоре после смерти Казем-Бека новое дальневосточное правительство во главе с Вонсяцким начало стремительно «обновлять» государство. К великому удивлению многих, красное знамя младороссов было спущено, и на смену ему подняли флаг партии националистов.\nВ дополнение к перетасовке правительства многие младороссы вскоре были уволены со своих постов и заменены кандидатами-националистами. Но это было только начало. Начало конца младороссов.\n\nОчень скоро начались массовые чистки. Не ограничиваясь увольнениями, националисты начали арестовывать младороссов, а руководителей местных отделений, по слухам, казнили без суда. Вскоре младороссы были официально объявлены «Врагами Короны», их знамёна были захвачены и сожжены на центральной площади Владивостока.\n\nФлаги националистов с огромными черепахами были развешены почти на каждом здании, а Вонсяцкий изображался в СМИ как великий лидер, единственный, кто мог спасти Россию от большевизма и керенщины."
trammlad.516.a: "Да здравствует Вонсяцкий!"

trammlad.517.t: "Союз Четвертороссов"
trammlad.517.d: "Вскоре после смерти Казем-Бека новый лидер Вонсяцкий объявил о создании так называемого «Союза Четвертороссов» - по сути, партийной коалиции младороссов и националистов.\n\nЧетвертороссы, по словам самого Вождя, являются лучшими сынами Родины, борющимися за четвёртый путь - отвергающий царизм, большевизм и демократию. Четвёртый путь - это путь русского народа. Объединённые Царём и Вождём, власть трудящихся масс, борющихся за нацию, униженную японцами и немцами, преданную союзниками.\n\nДа здравствует наш великий союз, ибо его путь осветит всю Россию. И когда огромная армия Чёрной гвардии встанет у стен древнего Кремля, а благодетельный Царь сядет на трон, Россия будет могучей и великой."
trammlad.517.a: "Да здравствуют Четвертороссы!"

trammlad.518.t: "Частный разговор с лидерами ДВСВ"
trammlad.518.d: "Сегодня националисты провели встречу с представителями ДВСВ, на которой присутствовал сам Вождь Вонсяцкий. Партия националистов предложила сотрудничество ДОРС в борьбе против Петроградского режима, поставив одной из своих главных целей восстановление монархии и возвращение Царя на трон, что должно было порадовать некоторых присутствующих.\n\nК вечеру встреча закончилась, но ответа от ДВСВ пока не последовало, однако они пообещали дать ответ в ближайшее время."
trammlad.518.a: "Подождём."

trammlad.519.t: "ДВСВ присоединяется к нам в нашей борьбе!"
trammlad.519.d: "Лидер ДВСВ отправил личную телеграмму Вождю, в которой заявил о решительной готовности ДВСВ и всего командного состава присоединиться к борьбе против Петроградского режима, признать Вонсяцкого Вождём и вместе вернуть царскую династию на трон."
trammlad.519.a: "Отлично!"

trammlad.520.t: "ДВСВ отказалось от сотрудничества!"
trammlad.520.d: "Лидер ДВСВ отправил личную телеграмму Вождю, в которой заявил, что ДВСВ никогда не признает Вонсяцкого Вождём, поскольку организация преследует иные цели. Они признали, что сотрудничество с младороссами неприемлемо, каким бы оно ни было."
trammlad.520.a: "Они пожалеют об этом!"

trammlad.521.t: "Чёрная гвардия вычищает ДВСВ из Приамурья!"
trammlad.521.d: "Вскоре после того, как ДВСВ официально отказалось сотрудничать с националистами, стало известно о нападении на их базу в Николаевске, а также о беспорядках и грабежах в центре города. Сама база с расквартированными там военизированными отрядами ВС подверглась вооружённому нападению, в результате которого многие военнослужащие были убиты.\n\nКроме того, все представители высшего генерального штаба ВС были найдены и арестованы, а затем расстреляны за измену. Ключевые заставы на Транссибирской магистрали вскоре были захвачены Чёрной гвардией, обеспечив свободный доступ националистов в Якутию и Забайкалье."
trammlad.521.a: "Они это заслужили!"

trammlad.522.t: "Письмо Деникину"
trammlad.522.d: "Вождь Вонсяцкий лично отправил письмо генералу Деникину и призвал его присоединиться к войскам истинной русской армии. Он напомнил ему, что служил в Добровольческой армии под его началом и помнит, как они вместе шли в смертный бой против большевиков. Вождь также указал, что ждёт генералов, ближайших к Деникину, способных на подвиги во имя русской нации."
trammlad.522.a: "С почтением, Вождь."

trammlad.523.t: "Ответ не последовал"
trammlad.523.d: "Прошёл месяц, но Вождь так и не получил ответа от генерала Деникина, и это может означать только то, что либо письмо не дошло, что маловероятно, либо что оно не пришло, что тоже маловероятно. Однако, по мнению Вождя, наиболее вероятно то, что Деникин - трус, подлец и мерзавец, который ненавидит русскую нацию и готов служить немецким ублюдкам.\n\nТаким людям не будет места в новой России."
trammlad.523.a: "Он будет повешен, когда мы возьмём Москву."

trammlad.524.t: "Старый генерал прибывает"
trammlad.524.d: "Письмо от Деникина так и не пришло, и Вождь уже начинал разочаровываться в своём бывшем командире, как вдруг ему сообщили, что во Владивосток прибыл корабль, на котором присутствуют переодетые генералы, включая Деникина.\n\nВскоре Деникин сам пришёл к Вонсяцкому, где они побеседовали, и Деникин заявил о своей готовности бороться за русскую идею."
trammlad.524.a: "Приятно знать."

trammlad.525.t: "Деникин и его соратники покидают Россию"
trammlad.525.d: "Сегодня генерал Деникин вместе со своими соратниками покинул страну. По данным разведки, они направились во Владивосток, где, скорее всего, присоединятся к новоявленному «Вождю»."
trammlad.525.a: "Предатели!"

trammlad.526.t: "Дом Романовых в Приамурье"
trammlad.526.d: "Улицы были пусты и безлюдны, лишь изредка по ним маршировала Чёрная гвардия, распевая «Знамена вверх!», партийный гимн националистов.\n\nСегодня в одном из купеческих домов состоялась важная встреча, на которой присутствовали оппозиционные националисты и некоторые представители царской династии Романовых. Вождь Вонсяцкий долго беседовал с одним из кандидатов в Цари, и, кажется, они нашли общий язык. В целом все присутствующие кандидаты выразили поддержку националистам и были готовы, по словам Лидера, пожертвовать собой ради победы русского народа, что бы это ни значило. В любом случае, так называемый «Регентский совет», состоящий в основном из ближайших соратников Вонсяцкого и его самого, должен решить вопрос о коронации нового Царя."
trammlad.526.a: "Кирилл Владимирович поведёт нацию!"
trammlad.526.b: "Владимир Кириллович поведёт нацию!"
trammlad.526.c: "Андрей Александрович поведёт нацию!"

trammlad.532.t: "[ROOT.GetLeader] коронован как Царь"
trammlad.532.d: "В одном из зданий Владивостока собрались богатые владивостокские политики, промышленные деятели и светские львы, чтобы устроить вечеринку, хоть и небольшую. Здесь [ROOT.GetLeader] теперь коронован как Царь Сибири и Всея Руси. Не было ни празднований, ни вечеринок вообще, за ними последовал небольшой военный парад Сибирской армии и Чёрной гвардии. Вскоре после этого всё тихо закончилось формальной коронацией самого Царя и речью Вонсяцкого о введении России в современность и приведении её к величайшему времени со времён Елизаветы Петровны."
trammlad.532.a: "Да здравствует Царь! Да здравствует Вождь!"

trammlad.533.t: "О черепахах и людях"
trammlad.533.d: "Сидя в своём тщательно организованном кабинете под звуки симфонии Рахманинова, Вождь Вонсяцкий проворно двигал своими ловкими и нежными руками, размытым пятном рисуя что-то за своим столом. Известный любитель всего, что связано с черепахами, Вонсяцкий рисовал не на холсте из ткани или бумаги, а на панцире! Держа в своём доме большой личный зверинец из различных видов черепах, разбросанных по разным прудам, садам и террариумам по всему поместью, Вонсяцкий обожает этих маленьких созданий и приобрёл довольно странное хобби, связанное с ними.\n\nХотя иногда люди красят панцири своих домашних черепах, наш Вождь пошёл дальше, рисуя на их панцирях символ державы младоросского движения и выставляя их напоказ как партийных талисманов. Наш Вождь зашёл в этом так далеко, что даже носит маленькую черепашью булавку на лацкане и берёт с собой повсюду несколько таких раскрашенных пропагандистских черепах, чтобы распространять послание и известность нашего нового кредо. Какова бы ни была его причина любви к этим странным и медлительным созданиям, которые он называет своим собственным «танковым корпусом», неизвестно, но они всё равно стали символом нашего нового движения."
trammlad.533.a: "Какое странное хобби."

trammlad.527.t: "Тень Косой Черепахи"
trammlad.527.d: "Вместе с властью националистов пришла суровая дисциплина. Улицы дальневосточных городов теперь тихи и чисты, без бродяг и пьяниц. Здания украшены бело-сине-красными знамёнами с Черепахой, а по улицам ходит Чёрная гвардия, получившая от самого Вождя разрешение на осуществление правоохранительной деятельности.\n\nЭто страна света, где тихоокеанское солнце светит на светлые лица людей, русских людей, где лишь изредка можно увидеть лица ещё не успевших уехать японцев, трусливо шныряющих по переулкам. Русская нация восстала. Но в тени Черепахи сыро и холодно. В тени Черепахи людей забирают из домов, избивают и арестовывают за критику партии и Вождя. Но это наша новая реальность. И она не может не радовать простого русского крестьянина."
trammlad.527.a: "Русские люди, восстаньте!"

trammlad.528.t: "Искоренение японского влияния"
trammlad.528.d: "Недоверие к японской общине внутри нашей нации всегда было известно, и националисты усиливали его, клеймя японцев как затаившихся предателей, агентов иностранного правительства и тех, кто держит русских в подчинении своим контролем над банками. Эти митинги и речи действовали как канистра с бензином, вылитая на деревянные дрова перед костром, когда одетые в форму члены Националистов организовывали марши через японские поселения и рисовали восходящее солнце на предприятиях, принадлежащих японцам, указывая всему городу, кому они принадлежат.\n\nЭто было, конечно, началом, и бензину нужна была лишь искра, чтобы воспламениться, и сегодня эта искра была предоставлена. На далёком горизонте разыгралась теневая игра пламени и дыма, идущих от горящих японских домов, где их предприятия были подожжены толпами Националистов, а люди, оказавшиеся в это время на улице, были зверски избиты. Ночь оказалась долгой и ужасающей для тех, кто укрывался в своих домах, надеясь, что их не подожгут. Однако, наконец, толпы рассеялись, и появились военные, которых сначала сочли восстанавливающими порядок, но они, в конце концов, оказались горьким концом для японской общины, которая приветствовала их, когда они приказали им грузиться в грузовики. Их переселяли для их собственной «безопасности», безопасности, которая, как назло, оказалась по ту сторону границы, за пределами России."
trammlad.528.a: "Угроза изнутри, угроза извне."

trammlad.530.t: "Слава!"
trammlad.530.d: "Анастасий Вонсяцкий, Вождь нашей великой нации, и почему бы ему не быть? Это человек, который восстановил величие нашей нации. Он сам сражался с красной угрозой много лет назад, и даже после того, как эта работа была сделана, решил продолжить свои усилия против яда большевизма, организовав националистов здесь, во Владивостоке. Проповедуя правду о том, что необходимо для возвращения России к величию и победы над немцами, японцами и красной угрозой, скрывающейся в тени. Теперь сам Царь восстановлен на троне - подвиг, за который мы можем благодарить только Анастасия!\n\nТак что нация должна быть благодарна. На улицах нашей столицы висят огромные портреты Вонсяцкого, семьи нашей нации благодарят его за хлеб, а наши войска будут думать о том, что он сделал для нашей нации, пока сражаются за неё. Не должно быть ни минуты, когда наш народ не вспоминал бы о том, что он для них сделал, и о его величии, поскольку школьники будут петь песни о его деяниях, стремясь доказать свою верность человеку, которому они всем обязаны, потому что кто ещё дал бы детям нашей нации образование, если не Вождь? Все, кто любит свою нацию и возрождение, которое она пережила, будут троекратно скандировать эти всё более частые слова."
trammlad.530.a: "Да здравствует Вождь!"

trammlad.531.t: "Восхождение России..."
trammlad.531.d: "'Россия была страной, потерявшей свою идентичность, свою мораль и свой дух. Гниющий труп некогда великой империи, поистине печальное состояние для любого патриота родины... Однако не всё было потеряно! В самый тёмный час России нашёлся человек, который не собирался тихо уходить в ночь. Анастасий Вонсяцкий горел пламенной страстью, которая зажгла свет в умах и душах работающих патриотов по всей русской земле. Он отверг падение в бездну, вызванное грызнёй фракций безжизненных орд, жаждущих разорвать друг друга на части во имя власти и наживы! Вождь сплотил этих храбрых соратников-националистов, и вместе они победили внутреннего врага! Россия восстала из своего застойного состояния, она больше не больной человек на планете. Сердце России - это сердце националистов, движение стало новой идентичностью России. И по мере того как устрашающая риторика Вонсяцкого становится всё более доминирующей в умах многих, растёт и Россия. Будущее принадлежит нам, товарищи!'\n\n- Первая полоса сегодняшнего выпуска газеты «Националист»"
trammlad.531.a: "Да здравствует Царь [ROOT.GetLeader]!"

### Ideas ###
TRM_dream: "Великие амбиции Приамурья"
TRM_dream_desc: "С 1925 года правительство Приамурья заявляет, что оно является законным правительством всей России, свергнутым грязными предателями из кабинета Керенского. Хотя страна не в лучшей форме, её руководство питает надежды, что однажды Приамурье может стать великой державой."
TRM_improving_army: "Модернизация армии"
TRM_dream_fulfilled: "Россия воссоединилась"
TRM_dream_fulfilled_desc: "Наконец-то никто не может оспорить наши притязания на то, что мы являемся законным Российским Государством. С уничтожением как советского, так и московского режимов наши амбиции наконец-то оправдались. Теперь, когда мы находимся во власти, мы можем работать над внутренним улучшением страны."
TRM_kolchak: "Адмирал-Диктатор"
TRM_kolchak_desc: "Как бывший адмирал Российской Империи, Колчак уделяет много внимания морским исследованиям. Его знания о кораблях дают ему возможность преуспевать в морских исследованиях."
TRM_JAP_MIL_MIS: "Японские военные советники"
TRM_JAP_MIL_MIS_desc: "Наш режим вряд ли является существенной военной силой, и, в значительной степени, как это ни прискорбно, он полагается, в определённой степени, на ряд японских военных советников и делегатов, которые оказывают помощь в наращивании мощи наших зарождающихся Вооружённых Сил."
TRM_JAP_NAV_MIS: "Японские военно-морские советники"
TRM_JAP_NAV_MIS_desc: "Хотя Приамур и заявляет о себе как о серьёзной военно-морской державе на севере Тихого океана, базирующейся в главном порту Владивостока, на самом деле, наши военные корабли находятся в весьма плачевном состоянии, а опыт наших экипажей удручающе минимален. Чтобы восполнить эти недостатки, Японская Империя предложила нам военно-морских советников, которые помогут восстановить и расширить наши военно-морские силы."
TRM_CAN_NAV_TRE: "Канадские военно-морские советники"
TRM_JAP_INF_START: "Японское влияние"
TRM_JAP_INF_START_desc: "Режим Владивостока стал безнадёжно зависимым от Японской Империи, и тенденции имперского влияния доминируют во многих институтах и аспектах Приамурского общества."
TRM_JAP_INF_TRADE: "Японское влияние"
TRM_JAP_INF_TRADE_desc: "Режим Владивостока стал безнадёжно зависимым от Японской Империи и тенденции имперского влияния доминируют во многих институтах и аспектах Приамурского общества. Последующие японские финансовые инвестиции в регион, по крайней мере, дают нам некоторые преимущества от этой договорённости."
TRM_JAP_DEP_1: "§CЗависимость от Японии:§! §7низкое§!"
TRM_JAP_DEP_1_desc: "Наши отношения с Японской Империей медленно переходят от взаимовыгодного партнёрства, как минимум, к партнёрству, которое несёт в себе все признаки серьёзного торгового дисбаланса."
TRM_JAP_DEP_2: "§CЗависимость от Японии:§! §Yвысокое§!"
TRM_JAP_DEP_2_desc: "Для многих становится всё более очевидным, что наша зависимость от Японской империи растёт с каждым днем. Корабли прибывают из Токио с грузом и выходят из Владивостокского порта с пустыми трюмами. Мы стали не более чем рынком."
TRM_JAP_DEP_3: "§CЗависимость от Японии:§! §Rкрайне высокое§!"
TRM_JAP_DEP_3_desc: "Немногие всерьёз оспаривают, что наша страна на данный момент является не более чем японской «собачкой», а слабость режима Приамура превратилась из открытого секрета в вопиющий факт."
TRM_OBL_INF_1: "Угасающий сибирский регионализм"
TRM_OBL_INF_1_desc: "Областническое движение никогда не было сильным или самодостаточным. Призрачная Сибирская республика с таким же призрачным временным правительством канула в Лету, когда к власти пришёл адмирал Колчак. Идея независимой Сибири никогда не получала достаточной поддержки даже в самых радикальных кругах и в значительной степени рассматривалась как временное решение, если бы красные силы смогли оттеснить русскую армию за Урал. Однако этого не произошло, и сибирский сепаратизм, вероятно, исчезнет, и навсегда, если, конечно, что-то не изменится в привычном укладе жизни Приамурья."
TRM_OBL_INF_2: "Растущий сибирский регионализм"
TRM_OBL_INF_3: "Высокая поддержка сибирского регионализма"
TRM_NRA_INF_1: "§CСопротивление Нра:§! §Lнизкое§!"
TRM_NRA_INF_1_desc: "Народно-революционная армия и Политцентр залегли на дно, не имея возможности протестовать против нашего правительства.\n§RЕсли их сопротивление слишком велико, они могут взбунтоваться.§!"
TRM_NRA_INF_2: "§CСопротивление НРА:§! §Yвысокое§!"
TRM_NRA_INF_2_desc: "Народно-революционная армия и Политцентр все чаще протестуют против нашего правления.\n§RЕсли их сопротивление слишком велико, они могут взбунтоваться.§!"
TRM_NRA_INF_3: "§CСопротивление НРА:§! §Rчрезвычайно высокое§!"
TRM_NRA_INF_3_desc: "Народно-революционная армия и Политцентр крайне недовольны нашим правительством из-за наших репрессивных законов против крестьян и рабочих.\n§RОни могут взбунтоваться, если мы ничего не предпримем.§!"

