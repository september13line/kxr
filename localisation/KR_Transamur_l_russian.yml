TRM_NRA_party2_long: "Дальневосточное Бюро"
TRM_czech_party: "Чехословацкий Легион"
TRM_czech_party_long: "Чехословацкий Легион\n§LЧехословацкий легион, как объявил Сергей Войцеховский, теперь контролирующий российский Дальний Восток, должен стать основной силой, которая будет управлять всеми политическими, экономическими и внешнеполитическими делами. Со своими панславистскими заявлениями Войцеховский стремится объединить сначала всю Россию, а затем и все славянские народы в единую трансконтинентальную федеративную страну.§!"
TRM_czech_party2: "ЧНС"
TRM_czech_party2_long: "Чехословацкий Национальный Совет\n§LЧехословацкий легион, как объявил Радола Гайда, теперь контролирующий российский Дальний Восток, должен стать основной силой, которая будет управлять всеми политическими, экономическими и внешнеполитическими делами. Более того, с единственной амбицией Гайды освободить и восстановить «Истинную Чехословакию», он провозгласил собственную Чехословакию на землях российского Дальнего Востока с чёткой целью однажды вернуться домой.§!"
TRM_social_democrat_kolchak: "РСДП"
