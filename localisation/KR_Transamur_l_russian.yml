TRM_martial_law: "Военное положение"
TRM_martial_law_desc: "Ситуация в нашей стране нестабильна. Чтобы предотвратить очередной переворот, военное положение поможет защитить наш народ от самого себя."
TRM_research: "Либеральные учёные"
TRM_research_desc: "Приамурье не может процветать без светлых умов. Взаимодействуя с научными исследованиями, мы можем превзойти наши возможности на мировой арене."
TRM_factory: "Инвестиции в тяжёлую промышленность"
TRM_factory_desc: "Государственные субсидии обеспечат расширение нашего сектора тяжёлой промышленности. Приамурье больше не будет считаться убогой пустошью на краю света, а станет индустриальной державой шлака и стали."
TRM_goods: "Государство всеобщего благосостояния"
TRM_goods_desc: "Жизнь в Сибири может быть трудной. Самое малое, что мы можем сделать для наших граждан, - это предоставить им полноценное государство всеобщего благосостояния. Кстати, это также обезоруживает значительную оппозицию нашему режиму."
TRM_mil_stuff: "Земская рать"
TRM_mil_stuff_desc: "Последствия наших недавних военных реформ привели к созданию более послушной военной машины, что необходимо в таком государстве, как Приамурье."
trm_workers_rights: "Социальное обеспечение"
TRM_small_business: "Субсидирование бизнеса"
TRM_purge: "Последствия чистки"
TRM_purge_desc: "Восстановить святость целой военной машины за одну ночь - сложное и неприятное дело. Неизбежны последствия. Однако в долгосрочной перспективе у нас будет армия, достойная этого имени."
TRM_new_military: "Новый военный кабинет"
TRM_new_military_desc: "В результате наших недавних реформ наши вооружённые силы стали гораздо более лояльны нашему режиму и эффективны."
TRM_new_military_1: "Новый военный кабинет"
TRM_new_military_1_desc: "В результате наших недавних реформ наши вооружённые силы стали гораздо более лояльны нашему режиму и эффективны."
TRM_orthodox_church_old_believer: "Митрополит старообрядцев"
TRM_orthodox_church: "Раскольничий митрополит"
TRM_ships: "Новые проекты кораблей"
TRM_ships_desc: "Наша страна, до некоторой степени, это флот с государством. Новые военные корабли необходимы для нашего военного престижа, а в долгосрочной перспективе - для нашего выживания."
TRM_supply: "Улучшенная сеть снабжения"
TRM_supply_desc: "Контроль над Транссибирской магистралью позволяет нам воспользоваться дополнительными инфраструктурными преимуществами, позволяя улучшить нашу логистику."
TRM_modest_society: "Политическая стабилизация"
TRM_modest_society_desc: "Наша страна, кажется, наконец стабилизировалась, и новая эра процветания и могущества ждёт всё Приамурье под нашим новым так называемым «Скромным обществом»."
TRM_anti_kolchak: "Антиколчаковские настроения"
TRM_anti_kolchak_desc: "У режима Колчака мало сторонников и много ненавистников. Большинство либералов открыто выступают против него, а его собственные генералы ненадёжны. Есть даже вероятность, что они начнут переворот, чтобы свергнуть Колчака."
TRM_JAP_CONS: "Японская концессия"
TRM_JAP_CONS_desc: "Влияние японских деловых кругов и лоббистов в Приамурье становится всё более очевидным, и Концессия является тому доказательством. Если раньше европейские державы заставляли открывать азиатские рынки, то в Приамурье, кажется, верно обратное."
trm_for_inv: "Иностранные инвестиции"
trm_for_inv_1: "Иностранные инвестиции"
TRM_JAP_hostile: "Приамурье разорвало связи с Японией"
RUS_Siberian_Identity: "Сибирская идентичность"

