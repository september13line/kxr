### 1936 Crisis ###
tram_crisis_1936.1.t: "Баргузинский инцидент"
tram_crisis_1936.1.d: "Сегодня в Баргузине, Забайкалье, наши пограничники заметили, что самолёт, по-видимому, принадлежащий Российским ВВС, нарушил границы. Новейшие японские дальневосточные истребители поднялись в воздух на перехват, но самолёт не удалось отследить - выполнив манёвр высшего пилотажа, он, казалось, исчез в облаках над Байкалом.\n\nНемедленно в Петроград была отправлена нота протеста с требованием прекратить незаконные облёты Дальнего Востока."
tram_crisis_1936.1.a: "Нам следует усилить противовоздушную оборону в регионе."

tram_crisis_1936.2.t: "Баргузинский инцидент"
tram_crisis_1936.2.d: "Сегодня в Баргузине, Забайкалье, пограничники Приамурья, как сообщается, заметили, что самолёт, по-видимому, принадлежащий Российским ВВС, нарушил «границы». Новейшие японские дальневосточные истребители поднялись в воздух на перехват, но самолёт не удалось отследить - выполнив манёвр высшего пилотажа, он, казалось, исчез в облаках над Байкалом.\n\nНемедленно нам была отправлена нота протеста с требованием прекратить незаконные облёты Дальнего Востока."
tram_crisis_1936.2.a: "Их обвинения беспочвенны."

tram_crisis_1936.3.t: "Витимский инцидент"
tram_crisis_1936.3.d: "По многим забайкальским газетам разнеслись слухи о призрачном витимском катере - в рыбацком городке близ границы с непризнанной [RUS.GetName]. По словам местных жителей, ночью они видели бронекатер российских речных войск, опасно близко подошедший к городу. Рыбаки, напуганные высадкой десанта и началом войны, заперлись в своих домах, но всего через несколько минут бронекатер исчез.\n\nТаинственный инцидент произошёл пару дней назад, когда погода была туманной, но некоторые генералы из Генерального штаба считают, что история не выдумана и нам следует опасаться других российских бронекатеров."
tram_crisis_1936.3.a: "Местные пьяницы снова сочиняют истории."

tram_crisis_1936.4.t: "Нижнеангарский снайпер"
tram_crisis_1936.4.d: "Сегодня во время стандартного патрулирования границы и наблюдения за районом близ самого северного берега озера Байкал и устья реки Кичера один из наших пограничников был смертельно ранен метким выстрелом снайпера с [RUS.GetAdjective]ой стороны.\n\nВ последнее время участились нападения на наших храбрых пограничников со стороны наглой [RUS.GetName], что побудило правительство немедленно направить ноту протеста в [RUS.Capital.GetName] с предупреждением о возможном ответе."
tram_crisis_1936.4.a: "Действия [RUS.Capital.GetName] ведут к эскалации."

### 1937 Crisis ###
tram_crisis_1937.1.t: "Слюдянский инцидент"
tram_crisis_1937.1.d: "Экстренная телеграмма от министра иностранных дел достигла сегодня [ROOT.GetLeader], заверяя, что вчера в 15 км от заставы «Слюдянка» на нашей территории пограничный патруль заметил двух [TRM.GetAdjective]их солдат, которые пытались подключиться к линии связи. Солдат был убит, а унтер-офицер задержан, у нарушителей изъяты винтовка и ручной пулемёт. Вскоре после этого была замечена ещё одна группа [TRM.GetAdjective]их солдат, которые, по заверению министра, первыми открыли огонь. Несколько наших пограничников были убиты в перестрелке, но другая сторона также понесла потери.\n\nМинистр иностранных дел немедленно возложил ответственность за это на так называемое правительство Приамурья и потребовал, чтобы [ROOT.GetLeader] немедленно принял решение об упреждающем ударе. Вполне возможно, что именно этого от нас и ждут в [TRM.Capital.GetName]..."
tram_crisis_1937.1.a: "Требовать официальных извинений от [TRM.GetName]!"

tram_crisis_1937.2.t: "Слюдянский инцидент"
tram_crisis_1937.2.d: "Вчера произошла ужасная провокация со стороны российских сил в 15 км от заставы «Слюдянка» глубоко на [RUS.GetAdjective]ой территории. Их министр иностранных дел заявил, что пограничный патруль заметил двоих наших солдат, которых обвинили в попытке подключиться к линии связи. Один из них был убит, а другой, унтер-офицер, задержан, при них были винтовка и даже ручной пулемёт. Более того, они заявили, что вскоре после этого на их территории была замечена другая группа наших солдат, которые, по заверению их министра, открыли огонь! Вооружённые столкновения привели к раненым и убитым с обеих сторон. [RUS.GetLeader] потребовал от нас официальных извинений за инцидент, и похоже, что [RUS.GetName] в настоящее время мобилизуется для нанесения упреждающего удара!"
tram_crisis_1937.2.a: "Похоже на провокацию!"

tram_crisis_1937.3.t: "[FROM.GetName] требует официальных извинений"
tram_crisis_1937.3.d: "Как уже говорилось ранее, [FROM.GetAdjective]ое правительство потребовало официальных извинений за «Слюдянский инцидент». Однако, учитывая явные признаки провокации и отсутствие реальных доказательств, представленных нам, [ROOT.GetLeader] решил, что лучшая тактика сейчас - хранить молчание и не извиняться за действия, которые они сами выдумали."
tram_crisis_1937.3.a: "Не реагировать на эту провокацию."

tram_crisis_1937.4.t: "Молчание с той стороны"
tram_crisis_1937.4.d: "Очевидно, что незаконное [TRM.GetAdjective]ое правительство отказалось как-либо реагировать, не извиняясь и не отвечая на наши запросы. Учитывая их ежедневные нарушения нашей территории, теперь становится ясно, что скоро начнётся серьёзное противостояние. Выслушав совет нашего начальника армии, [ROOT.GetLeader] решил отправить дивизию в Забайкалье, напоминая [TRM.GetName], кто должен контролировать эти территории."
tram_crisis_1937.4.a: "Отправить одну дивизию в Забайкалье."

tram_crisis_1937.5.t: "[FROM.GetAdjective]ие войска пересекают границу в Забайкалье"
tram_crisis_1937.5.d: "Наши пограничники только что отправили экстренную телеграмму в [ROOT.Capital.GetName] о большом отряде [RUS.GetAdjective]их солдат, пересекающих границу в Слюдянке и пытающихся продвинуться вглубь Забайкалья. Хотя официального объявления войны не было, мы должны защищать свою территорию, не нарушая того, что [RUS.GetAdjective]ое правительство считает «своей территорией». Другой выбор, представленный [ROOT.GetLeader], - это прямое объявление войны этим ублюдкам!"
tram_crisis_1937.5.a: "Мы должны защищаться!"
tram_crisis_1937.5.b: "Время пришло - вся Россия должна быть нашей!"

tram_crisis_1937.6.t: "[TRM.GetName] отбивает атаку"
tram_crisis_1937.6.t2: "Наши силы отбили атаку"
tram_crisis_1937.6.d: "К сожалению для нас, [TRM.GetAdjective]ие пограничники, получив подкрепление из Читы, отбили нашу атаку и сумели защитить свою территорию."
tram_crisis_1937.6.d2: "К счастью для нас, наши пограничники, получив подкрепление из Читы, отбили [FROM.GetAdjective]ую атаку и сумели защитить нашу территорию."
tram_crisis_1937.6.a: "Мы должны собраться с силами, чтобы вторгнуться снова."
tram_crisis_1937.6.b: "Победа!"

tram_crisis_1937.7.t: "[TRM.GetAdjective]ие силы отступают"
tram_crisis_1937.7.t2: "Наши силы отступают!"
tram_crisis_1937.7.d: "Мы успешно разгромили [TRM.GetAdjective]их пограничников, вынудив их отступить."
tram_crisis_1937.7.d2: "К сожалению для нас, [RUS.GetAdjective]ие силы разгромили наших пограничников, вынудив их отступить."
tram_crisis_1937.7.a: "Обезопасить границу."
tram_crisis_1937.7.b: "Проклятье!"

tram_crisis_1937.8.t: "Пограничный конфликт закончился безрезультатно"
tram_crisis_1937.8.d: "К сожалению, этот пограничный конфликт закончился, так как ни одна из сторон не смогла получить преимущества."
tram_crisis_1937.8.a: "Проблема «Приамурья» скоро будет решена."
tram_crisis_1937.8.b: "[RUS.Capital.GetName] заплатит за свои преступления."

tram_crisis_1937.16.t: "Пограничный конфликт у Байкала"
tram_crisis_1937.16.d: "Несколько недель назад произошла эскалация напряжённости между частично признанным [TRM.GetName] и [RUS.GetNameDef], что привело к пограничному конфликту. По сообщениям российского правительства, [TRM.GetAdjective]ие силы, оснащённые винтовками и ручными пулемётами, начали боевые действия, открыв огонь по российским пограничным патрулям, что привело к потерям с обеих сторон. Это вызвало серию настоящих пограничных стычек, ещё больше обострив ситуацию и приведя к дополнительным жертвам.\n\nКонфликт ещё не окончен, и становится всё более очевидным, что растущая напряжённость между этими двумя образованиями, оспаривающими само существование друг друга, потенциально может перерасти в полномасштабную войну."
tram_crisis_1937.16.a: "Серьёзная нестабильность на Дальнем Востоке."

