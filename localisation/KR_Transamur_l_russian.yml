### New Kolchak Focuses ###
TRM_Kolchak_Doc: "Верховный правитель"
TRM_Kolchak_Doc_desc: "Колчак называет себя «Верховным правителем России». Чтобы наш лидер укрепил свой имидж, ему нужна мощная пропагандистская машина, способствующая созданию эффективного культа личности. Все должны знать о его славной персоне и великих деяниях. Колчак должен быть Отцом нации в глазах своего народа."

TRM_Deal_With_Oblastniki: "Разобраться с областниками"
TRM_Deal_With_Oblastniki_desc: "Областники уже давно являются бельмом на глазу у государства Колчака. Когда Колчак стал лидером Приамурья, он пообещал широкую автономию Сибири, как только она будет под контролем Белой гвардии Колчака. Момент настал. Хотя Колчак помнит о своих обещаниях, областники - это те, кто поддерживает либералов и социалистов - наших главных врагов. Областники становятся всё более претенциозными и, следовательно, опасными для нас."
TRM_Placate_The_Cossacks: "Умиротворить казаков"
TRM_Placate_The_Cossacks_desc: "Казаки - верные союзники нашего режима, и мы должны ещё больше расширить их права, чтобы обеспечить их лояльность нашему государству."
TRM_Limit_Cossack_Autonomy: "Ограничить автономию казаков"
TRM_Limit_Cossack_Autonomy_desc: "Казаки обладают большой властью и влиянием в регионах своих войск, и Колчак считает, что их власть следует ограничить. Хотя это сделает казаков ещё менее лояльными к нам, мы можем быть уверены, что они не будут злоупотреблять властью."
TRM_Crush_NRA: "Разгромить НРА"
TRM_Crush_NRA_desc: "Народно-революционная армия является главной угрозой существованию нашей страны. Социалисты пытаются подорвать государство террористическими методами, но, к счастью, их недавняя активность выдала их. Секретная служба Колчака уже знает их местонахождение и готова нанести удар."
TRM_Industry_For_Reclamation: "Экономия ради восстановления"
TRM_Industry_For_Reclamation_desc: "Рабочие всегда проблема, потому что они склонны слушать всякие глупые революционные идеи. Они должны работать на наше государство, не критикуя наше правительство. Любые подозрительные действия будут жестоко подавляться."

TRM_Liberalization_For_Survival: "Ослабить хватку"
TRM_Liberalization_For_Survival_desc: "Десятилетие практически диктаторского правления Верховного правителя привело к некоторым нежелательным последствиям - возможно, по совету министра Пепеляева, либерализация ради выживания является единственным приемлемым решением в текущей ситуации."
TRM_Decentralisation_Of_Governance: "Сблизиться с регионалистами"
TRM_Decentralisation_Of_Governance_desc: "И сибирские областники, и меньшинства бурят и якутов желают иметь больше автономии. Мы считаем, что нам следует создать некоторые автономные области на соответствующих территориях, чтобы умиротворить их и повысить нашу популярность."
TRM_Siberian_Regional_Council: "Признать сибирскую автономию"
TRM_Siberian_Regional_Council_desc: "Когда-то некоторые сибирские областники поддерживали притязания Колчака в обмен на автономную Сибирь, как только она будет полностью контролироваться Сибирской армией. Колчак - человек чести, и он понимает, что без поддержки областников он никогда не преуспел бы в своих планах стать Верховным правителем Всероссийским. Мы должны учредить Сибирский областной совет, который будет отвечать за все гражданские вопросы, хотя это сделает нашу страну более децентрализованной."
TRM_Appease_The_Workers: "Умиротворить рабочих"
TRM_Appease_The_Workers_desc: "Мы должны повысить заработную плату рабочим и сделать наше правительство более легитимным и дружественным по отношению к пролетариату. Будем надеяться, это поможет снизить популярность НРА."
TRM_Find_Common_Ground_With_Merkulovs: "Заручиться поддержкой СНО"
TRM_Find_Common_Ground_With_Merkulovs_desc: "«Меркуловщина», несмотря на всю свою коррупцию, может предоставить нам главное - поддержку купечества, бизнеса на Дальнем Востоке и деньги на освобождение всей России в обмен на уступки. Хотя этот вариант довольно скользкий и имеет много недостатков, возможно, братья Меркуловы - единственные, кто может финансировать наше правительство и армию."

TRM_Ensure_Czech_Legion_Loyalty: "Обеспечить лояльность легиона"
TRM_Ensure_Czech_Legion_Loyalty_desc: "Чехословацкие легионеры поддерживали Колчака во время Гражданской войны, но они застряли в чужой стране на десятилетия и теперь являются чем-то вроде военизированной силы без политических предпочтений. Но это лишь то, как они себя позиционируют. Мы должны быть полностью уверены, что в каких-либо чрезвычайных ситуациях они не предадут нас."
TRM_Kolchak_Mil: "Заполнить Владивостокские арсеналы"
TRM_Kolchak_Mil_desc: "Мир вступает в эпоху глобального кризиса и войны, невиданной в истории, включая даже Мировую войну. Эта война, несомненно, испытает наш дух, поэтому мы должны быть готовы. Мы должны расширить наши предприятия, чтобы производить ещё больше снаряжения."
TRM_Shape_A_New_Council_Supreme_Ruler: "Сформировать новый Совет Верховного правителя"
TRM_Shape_A_New_Council_Supreme_Ruler_desc: "Очевидно, что были министры, которые, если не сочувствовали, то открыто поддерживали переворот. Чтобы быть уверенным, что это не повторится, кабинет необходимо перетасовать."

TRM_Self_Government_Minorities: "Самоуправление меньшинств"
TRM_Self_Government_Minorities_desc: "Меньшинства бурят и якутов желают иметь больше автономии. Мы считаем, что нам следует создать некоторые автономные области на соответствующих территориях, чтобы умиротворить их и областников и повысить нашу популярность."

TRM_Martial_Law_In_Minority_Areas: "Ввести армию в районы проживания меньшинств"
TRM_Martial_Law_In_Minority_Areas_desc: "Регионы Бурятии и Якутии, находящиеся под контролем областников и местных властей меньшинств, менее стабильны и меньше подконтрольны Сибирской армии. Мы должны ввести военное положение и комендантский час на этих территориях и поставить их под прямой контроль наших военных."

TRM_Stake_On_Military: "Память об Омске"
TRM_Stake_On_Military_desc: "В Приамурье есть те, кто до сих пор помнит дни, когда адмирал Колчак носил титул Верховного правителя всей России. В Омске его правительство командовало армиями, простиравшимися от Урала до Тихого океана. Это государство ушло, но многие помнят единство и дисциплину, несмотря на суровые меры и непреклонную власть. Омск никогда не был поражением - он был незавершённым началом."

TRM_Invest_In_The_Pacific_Fleet: "Инвестировать в Тихоокеанский флот"
TRM_Invest_In_The_Pacific_Fleet_desc: "Тихоокеанский флот - единственный институт и сила, которой доверяет Верховный правитель. Так называемые моряки - лояльные и верные люди, которые поддержат Колчака в любом случае. Тем не менее, мы должны инвестировать в Тихоокеанский флот, повышая жалованье морякам и строя новые корабли."

TRM_The_Japanese_Qustion: "Сблизиться с Японией"
TRM_The_Japanese_Qustion_desc: "Российское государство находилось под экономической и военной защитой Японии более десяти лет. Мы должны доверять нашим друзьям с островов, хотя и теряя некоторый суверенитет, по крайней мере сейчас, иначе мы обречены."

TRM_Rely_On_Japan: "Положиться на Японию"
TRM_Rely_On_Japan_desc: "Мы должны полагаться на наших ближайших союзников - они, вероятно, вложат много денег в нашу страну, и это сделает нас сильными."

TRM_Increase_Our_Legitimacy: "Легитимация нашего режима"
TRM_Increase_Our_Legitimacy_desc: "Мы должны открыто заявить о наших амбициях - о том, что мы являемся законным Российским государством, а Колчак - законным Верховным правителем России. Это сообщение должно быть опубликовано в каждой мировой газете!"

TRM_Form_A_New_Cabinet: "Новый совет Верховного правителя"
TRM_Form_A_New_Cabinet_desc: "Очевидно, что были министры, которые, если не сочувствовали, то открыто поддерживали переворот. Чтобы быть уверенным, что это не повторится, кабинет необходимо перетасовать."

### New NATIONALISTS ###
TRM_Nationalists_Take_Over: "Националисты берут власть"
TRM_Nationalists_Take_Over_desc: "Получив ещё большее влияние в правительстве и в сердцах людей, Националисты наконец совершили свой властный ход против правительства, чтобы захватить контроль."

TRM_Destroy_Mladorossi: "Уничтожить младороссов"
TRM_Destroy_Mladorossi_desc: "Хотя когда-то они были нашими союзниками, их идеалы были слишком нишевыми, слишком далёкими, чтобы каким-либо образом привнести их в наше правительство. Мы должны убедиться, что они не затаят обиду и не попытаются вернуть власть, уничтожив их и развеяв их останки по морю."

TRM_Union_With_Mladorossi: "Союз с младороссами"
TRM_Union_With_Mladorossi_desc: "То, что мы захватили власть, не означает, что мы должны отказаться от наших бывших союзников, ибо они проявляют мастерство в завоевании сердец и умов граждан и простых людей. Мы можем использовать эту объединяющую харизму."

TRM_Contact_DO_ROVS: "Связаться с ДВСВ"
TRM_Contact_DO_ROVS_desc: "Нам было бы полезно установить связи с теми старыми генералами и националистами в Петрограде и Москве, которые могут разделять наши убеждения или, по крайней мере, надеяться подорвать позиции тех, кто продолжает выступать против наших целей."

TRM_All_Russian_Movement: "Всероссийское движение"
TRM_All_Russian_Movement_desc: "Русские люди были рассеяны по новым границам, созданным политическими распрями или иноземными королями. Неважно, на какой земле они находятся, они будут приняты в наше движение."

TRM_Forget_Former_Confederates: "Забыть бывших соратников"
TRM_Forget_Former_Confederates_desc: "Несмотря на то, что наш лидер был когда-то братом по оружию с соратниками белой армии Деникина, мы должны торжественно признать тот факт, что они не принимают веяния перемен. Эти старые бойцы не соответствуют нашему идеологическому профилю и сражаются только за старые идеалы."

TRM_Talks_With_ROVS: "Союз с бывшими соратниками"
TRM_Talks_With_ROVS_desc: "Наш лидер Вонсяцкий взялся за оружие против большевиков в 1917 году, когда он присоединился к Добровольческой армии Деникина и сражался с красными по всей западной части России.\n\nТеперь пришло время собрать наших бывших коллег и установить контакт с самим командующим добровольческой армией Деникиным. Будем надеяться, они присоединятся к нашему делу."
TRM_Talks_With_ROVS_tt: "Если [RUS.GetFlag] §Y[RUS.GetName]§! НЕ является монархией и находится под контролем §gАнтона Деникина§!, §cПётра Врангеля§! или §hдроздовцев§!, мы сможем §Gмирно объединиться§! с ними."

TRM_Meet_Royal_Family: "Встреча с царской семьёй"
TRM_Meet_Royal_Family_desc: "Царская семья приняла трон при младороссах, поэтому теперь, когда мы пришли к власти, мы должны встретиться с ними и заверить их, что мы по-прежнему признаём их суверенитет."

TRM_All_Russian_Economic_Council: "Всеимперский экономический совет"
TRM_All_Russian_Economic_Council_desc: "Создание совета для решения общих финансовых, торговых и денежных вопросов в Российском государстве и его сфере влияния усилит наш контроль и компетенцию в вопросах нашей сферы."

TRM_Strict_Discipline: "Строгая дисциплина"
TRM_Strict_Discipline_desc: "Преступление и наказание - это естественный порядок, удерживающий Россию от падения в анархию и беззаконие. И так должно оставаться, ибо если мы проявим какую-либо доброту к множеству преступных организаций, бандитов и экстремистов, они будут гнить и ослаблять нашу нацию до основания."

TRM_Arrest_Treacherous_Cossacks: "Арестовать вероломных казаков"
TRM_Arrest_Treacherous_Cossacks_desc: "В нашей стране всё ещё бродят банды казаков, которые угрожают свергнуть нашу власть. Они всё ещё придерживаются реакционных и чуждых идеалов старого порядка и стремятся подорвать наше восстановление закона и порядка в сельской местности. Начать уничтожение этих предательских банд."

TRM_Eradicate_Japanese_Influence: "Искоренить японское влияние"
TRM_Eradicate_Japanese_Influence_desc: "В пределах Владивостока всё ещё остаются японские поселения и бизнесмены, которые продолжают подрывать наш гражданский порядок и надеются, что однажды военно-морские силы их родины придут, чтобы завоевать законные российские земли. Мы должны изгнать этих внутренних термитов, прежде чем они пригласят иностранное вторжение."

TRM_Deal_With_NRA_Partisans: "Разобраться с партизанами НРА"
TRM_Deal_With_NRA_Partisans_desc: "Глубоко в лесах вдоль границы по ночам воют шакалы, шакалы, которые поддерживают убийство наших сил и восстание против идеалов Националистов. Остатки НРА - это угроза, за которой нужно охотиться, прежде чем они соберутся с силами, чтобы двинуться на Владивосток, как они это делали раньше."

TRM_Peoples_Liberation: "Освобождение народа"
TRM_Peoples_Liberation_desc: "Националисты - единственный путь, который увидят люди, и за это они будут вечно благодарны, поскольку бывшие альтернативы, ныне уничтоженные, были оплотами анархии и опасности для их благополучия. Теперь народ по-настоящему освобождён под нашим знаменем."

TRM_Peoples_Army: "Народная армия"
TRM_Peoples_Army_desc: "Необходима перекованная армия, армия, которая полностью воплотит идеалы, которые наша партия выдвигает для улучшения жизни народа. Их рвение достигнет таких высот, что они не будут знать страха, столкнувшись с врагом нашей нации, и специально обученные офицеры будут наблюдать за установлением этого рвения."

TRM_Hail_Tsar: "Да здравствует Царь!"
TRM_Hail_Tsar_desc: "Царь олицетворяет силу нашей нации, порядок, который оберегает народ ночью, и решимость, которую мы продолжаем проявлять, даже когда мир обращает на нас свои хищные взоры. Да здравствует Царь!"

TRM_Hail_Vozhd: "Слава Вождю!"
TRM_Hail_Vozhd_desc: "Народ должен воздать благодарность Вождю, человеку, который сделал всё это возможным своим руководством. Вонсяцкий сражался с красными десятилетия назад, он организовал и основал нашу организацию здесь, а затем привёл нас к этому моменту, когда нашу силу невозможно отрицать. Да здравствует Вонсяцкий!"

### DO-ROVS Focuses ###
TRM_The_New_Supreme_Ruler: "Военный переворот"
TRM_The_New_Supreme_Ruler_desc: "Дальневосточный союз военных (ДВСВ) теперь взял власть во Владивостоке, что знаменует конец неэффективных дней прошлого и наступление истинного освобождения России, поддерживаемого сильными людьми и храбрыми солдатами."
TRM_Mil_ML_End: "Созвать Земский собор"
TRM_Mil_ML_End_desc: "Ситуация наконец стабилизировалась. Никто не может спорить против нашей легитимности, наши границы защищены сильной и современной армией. Люди научились быть скромными и не тратить свои деньги и усилия на бессмысленные вещи. Порядок наконец вернулся в Приамурье. Вот почему пришло время созвать Земский собор - и наконец вернуть Романовых на престол."
TRM_Assume_The_Title_Of_Voyevoda: "Принять титул Воеводы"
TRM_Assume_The_Title_Of_Voyevoda_desc: "Как заявил Земский собор, должна быть установлена Земская рать - Войско, а любому войску нужен его вождь - Воевода. Присягая на Святом Евангелии, Дитерихс должен принять свой новый титул Воеводы и повести Святую Русь к её восстановлению."
TRM_New_Time_Pozharsky: "Князь Пожарский нового времени"
TRM_New_Time_Pozharsky_desc: "Как и во времена старой Смуты, когда князь Пожарский собрал народное ополчение, чтобы избавиться от всех врагов русского народа, Воевода объединит всех монархистов России, готовых сражаться против современных врагов нашего государства."
TRM_Unity_Of_Russian_People: "Единство русского народа"
TRM_Unity_Of_Russian_People_desc: "Последние десятилетия русский народ был разделён и отделён друг от друга - религией, политическими взглядами или этничностью. Мы больше не будем поощрять наши разделения, а вместо этого сформулируем новое будущее для нашего народа, где он сможет быть единым и процветать."

TRM_Ties_With_Large_Business: "Самопожертвование среди коммерсантов"
TRM_Ties_With_Large_Business_desc: "Выдвинутая Земским собором национально-религиозная историческая идея, призывающая разумные силы Общества и торгово-промышленный класс к самопожертвованию во имя борьбы за Веру, права народа и Помазанника Божия, не допускает никакого насилия. Реализация идеи и призыва заключается в исповедовании русской национальной идеологии, которая проистекает из учения Христа и которая никогда не погибнет, как не погибнет и сама вера Христова. Но время её торжества в Великой России наступит только тогда, когда вся масса российских общественных сил пропитается тем же национальным самопожертвованием, которым пропитана горстка бойцов на фронте. Это время придёт, но один Бог знает когда."

TRM_Parish_Self_Government: "Приходское самоуправление"
TRM_Parish_Self_Government_desc: "С начала Революции применение всеобщего, прямого, равного и тайного избирательного права считалось лучшим средством достижения цели власти для всего народа, но большевики и социалисты заменили подлинное представительство народа представительством партий. Избирательная комедия превратилась в полное издевательство над подлинной волей народа. Русская общественная мысль на горьком опыте пришла к выводу, что если всеобщее избирательное право и имеет какой-то смысл существования на Западе, то оно неприменимо в нынешних российских условиях. Отсюда поиск новых путей выявления воли народа."
TRM_Expand_Marine_Ministry: "Расширить Морское министерство"
TRM_Expand_Marine_Ministry_desc: "Морское министерство, учреждённое адмиралом Колчаком, имеет под своим прямым контролем все корабли Белого флота. Министерство также имеет право производить новые корабли, подписывать морские договоры и назначать главнокомандующего флотом."
TRM_Expand_Defense_Ministry: "Доверить оборону каппелевцам"
TRM_Expand_Defense_Ministry_desc: "Несмотря на то, что Приамурье - морская нация, наша страна окружена враждебными странами, которые стремятся захватить наши земли. Мы должны быть уверены, что можем защитить себя не только на море, но и на материке."
TRM_Freedom_Blazes_in_the_East: "Свобода пылает на Востоке"
TRM_Freedom_Blazes_in_the_East_desc: "Печальные дни смуты, распрей и политических махинаций скоро закончатся на наших законных землях к Западу. ДВСВ зажёг истинный маяк свободы, а не воображаемой либеральной, на Дальнем Востоке и принесёт это славное будущее всей России."
TRM_Crusade_Against_Heretics: "Крестовый поход против безбожников"
TRM_Crusade_Against_Heretics_desc: "Безбожный режим в Петрограде и Москве, что бы они ни говорили, действительно предал и русский народ, и нашего Святого Спасителя. Мы должны провозгласить последний Крестовый поход и сражаться с честью за нашего Бога и Великого Царя Великой Русской Земли."

TRM_Mil_Doc: "Сформировать Земскую рать"
TRM_Mil_Doc_desc: "Любая диктатура опирается на свою армию, и поэтому крайне важно немедленно провести реформы для повышения эффективности вооружённых сил. Только самые лояльные и боеспособные войска смогут нас сохранить. Более того, генерал Дитерихс настаивает на переименовании Сибирской армии - в Земскую рать. В рамках политики Дитерихса по восстановлению традиционного уклада жизни России, армейский корпус Земской рати был организован в группы, разделённые на полки, сформированные из бывших бригад. Бывшие полки были сведены в батальоны и дружины. Для восполнения потерь, понесённых войсками в Приамурье, была объявлена мобилизация молодого мужского населения."
TRM_Holy_Cross: "Армия Святого Креста"
TRM_Holy_Cross_desc: "Во время Гражданской войны генерал Дитерихс объявил крестовый поход против большевизма и призвал всех православных христиан на защиту своей родины. Теперь Дитерихс хочет возродить ополчение Святого Креста, чтобы увеличить призыв."

TRM_Ties_With_Church: "Заручиться поддержкой церкви"
TRM_Ties_With_Church_desc: "Благодаря нашим публичным заявлениям о восстановлении монархии, Церковь на Дальнем Востоке согласилась помочь нам в достижении наших целей. Будучи близкими союзниками Колчака, они имеют прочные позиции, которые мы могли бы использовать."
TRM_Christian_Call: "Христианский призыв"
TRM_Christian_Call_desc: "Не мсти и не имей злобы на сынов народа твоего, но люби ближнего твоего, как самого себя (Левит 19:18). Это сказано в ветхозаветной заповеди Закона Божьего. Хотя мы не можем не гневаться на то, что режим Керенского и его преемники сделали с нашей Святой Русью, мы можем сделать им великое дело - дать им жизнь вместо смерти, которую они вполне заслужили, но при условии, что они полностью откажутся от политики."
TRM_End_Ataman: "Выгнать японцев"
TRM_End_Ataman_desc: "Атаман Семёнов, японская пешка, должен быть отстранён от любой должности и лишиться любой легитимности, которой он сейчас обладает. Без него японское правление над нашими землями также прекратится."
TRM_The_Fourth_Rome: "Четвёртый Рим"
TRM_The_Fourth_Rome_desc: "Дальний Восток разнообразен в верованиях и взглядах, и без единства под знаменем Истинного Русского Царя мы не сможем успешно справиться с кровавым петроградским режимом."


TRM_restore_monarchy: "Восход Святого Царя"


### United Transamur ###
TRM_Become_Siberia: "Хозяева Сибири"
TRM_Become_Siberia_desc: "Война наконец окончена; мы пережили тиранов из [RUS.Capital.GetName], и их решительное поражение оставляет нас новой доминирующей силой в Сибири. Из нескольких отрядов недовольных офицеров и казаков мы выросли до одного из крупнейших государств в мире за считанные годы, поэтому нам нужно сделать оперативную паузу, чтобы закрепить свои завоевания. Необходимо также оценить новую геополитическую ситуацию: будем ли мы продолжать борьбу за объединение России или попытаемся построить новое государство на её руинах?"
TRM_Consolidate_Siberia: "Дом на Востоке"
TRM_Consolidate_Siberia_desc: "Многие из наших граждан всё ещё сомневаются, что независимое сибирское государство будет жизнеспособной альтернативой пребыванию в составе России, тем более из-за военно-центричного способа управления, который мы до сих пор принимали. Чтобы смягчить их страхи, мы значительно сократим наши военные расходы и вместо этого направим наши доходы от экспорта сырья на улучшение местной промышленности и инфраструктуры по всей Сибири. Пусть никто не чувствует себя забытым."
TRM_Nation_Of_Free_Peoples: "Нация свободных народов"
TRM_Nation_Of_Free_Peoples_desc: "Сибиряки всегда отличались от остальных русских большей стойкостью, независимостью и самонадеянностью. Благодаря нашей победе они теперь могут использовать эти качества для строительства нации, не сдерживаемые грабителями, стремящимися извлечь все ценные ресурсы из этой земли, инвестируя при этом минимум для её развития. Сибирь, которую мы построили, - свободна, федеративна и могущественна, предоставляя своим гражданам возможность процветать под защитой могучих казаков."

TRM_Become_Russia: "Новая Россия"
TRM_Become_Russia_desc: "Время войны подошло к концу. Настало время для новой, более сильной России. Больше никаких предателей, больше никаких большевиков, больше никаких японских империалистов. Теперь мы - Россия!"
TRM_return_to_czechoslovakia: "Восстановить Чехословацкое государство"
TRM_proclaim_slavic_federation: "Провозгласить Славянскую федерацию"
TRM_proclaim_zheltorossiya: "Провозгласить Желтороссию"
