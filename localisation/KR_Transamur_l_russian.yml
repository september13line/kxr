TRM_legitmacy_level_none: "Нет легитимности"
TRM_legitmacy_level_none_desc: "Ни одна фракция в России не воспринимает наше дело всерьёз. И пока нас вышучивают, шансы на то, что Истинное Рабочее Царство будет доминировать в России, с каждым днём становятся всё ниже.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_level_low: "Низкая легитимность"
TRM_legitmacy_level_low_desc: "Немногие фракции в России воспринимают наше дело всерьёз. И пока многие всё ещё игнорируют нас, шансы на то, что Истинное Рабочее Царство будет доминировать в России, всё ещё кажутся малыми.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_level_medium: "Средняя легитимность"
TRM_legitmacy_level_medium_desc: "Некоторые фракции в России воспринимают наше дело всерьёз. И пока некоторые всё ещё игнорируют нас, шансы на то, что Истинное Рабочее Царство будет доминировать в России, кажутся не такими уж невозможными, как считалось изначально.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_high: "Хорошая легитимность"
TRM_legitmacy_high_desc: "Многие фракции в России воспринимают наше дело всерьёз. И пока лишь немногие всё ещё игнорируют нас, идея Истинного Рабочего Царства, доминирующего в России, кажется недалёкой от реальности.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_unquestioned: "Высокая легитимность"
TRM_legitmacy_unquestioned_desc: "Все фракции в России воспринимают наше дело всерьёз. И поскольку в России больше нет тех, кто игнорирует нас, истинное Русское Рабочее Царство обязательно состоится, и все в России это знают.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_nats_level_none: "Нет легитимности"
TRM_legitmacy_nats_level_none_desc: "Ни одна фракция в России не воспринимает наше дело всерьёз. И пока нас вышучивают, шансы на то, что Истинное Рабочее Царство будет доминировать в России, с каждым днём становятся всё ниже.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_nats_level_low: "Низкая легитимность"
TRM_legitmacy_nats_level_low_desc: "Немногие фракции в России воспринимают наше дело всерьёз. И пока многие всё ещё игнорируют нас, шансы на то, что Истинное Русское Царство будет доминировать в России, всё ещё кажутся малыми.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_nats_level_medium: "Средняя легитимность"
TRM_legitmacy_nats_level_medium_desc: "Некоторые фракции в России воспринимают наше дело всерьёз. И пока некоторые всё ещё игнорируют нас, шансы на то, что Истинное Русское Царство будет доминировать в России, кажутся не такими уж невозможными, как считалось изначально.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_nats_high: "Хорошая легитимность"
TRM_legitmacy_nats_high_desc: "Многие фракции в России воспринимают наше дело всерьёз. И пока лишь немногие всё ещё игнорируют нас, идея Истинного Русского Царства, доминирующего в России, кажется недалёкой от реальности.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_legitmacy_nats_unquestioned: "Высокая легитимность"
TRM_legitmacy_nats_unquestioned_desc: "Все фракции в России воспринимают наше дело всерьёз. И поскольку в России больше нет тех, кто игнорирует нас, истинное Русское Национальное Царство обязательно состоится, и все в России это знают.\n\n§RЭтот дух отражает количество людей, которые видят в нас законных правителей России§!"

TRM_Soviet_Tsardom_Idea: "Истинное Советское Царство"
TRM_Soviet_Tsardom_Idea_desc: "К удивлению многих, мы наконец восторжествовали, Красный Царь вернул Россию, и теперь идеалы младороссов доминируют во всей России. Теперь Вождь Казем-Бек и Царь смотрят вовне, чтобы вернуть Царство и наследие, связанное с ним."

TRM_nra_resistance_modifier: "£pol_idea Сопротивление НРА"

TRM_japanese_vladivostok: "Дайренское соглашение 1920 года"
TRM_japanese_vladivostok_desc: "18 февраля 1918 года Верховный совет Антанты принял решение об оккупации Владивостока и Харбина, а также зоны Китайско-Восточной железной дороги японскими войсками. В течение следующих двух лет красные были полностью разгромлены на Дальнем Востоке, и контроль над территорией осуществлялся главным образом атаманом Семёновым совместно с Императорской армией Японии. За это время на Дальнем Востоке японцы скупили земельные участки, заводы и различные концессии у возвращавшихся русских владельцев.\n\nПосле окончания Гражданской войны в России правительство Сазонова было вынуждено подписать пресловутое Дайренское соглашение, уступив Японии Северный Сахалин и согласившись на создание буферного государства Приамурье со столицей во Владивостоке."
TRM_japanese_vladivostok_modifier: "Японский контроль\n§WПорт Владивостока контролируется японской Квантунской армией, что ограничивает наши торговые возможности§!"

TRM_japanese_naval_blockade: "Японская морская блокада"

TRM_economic_ties_to_japan: "Вынужденное японское сотрудничество"
TRM_economic_ties_to_japan_desc: "Несмотря на номинальную независимость нашей страны и нежелание Александра Колчака принимать японскую помощь, которое часто шло вразрез с пожеланиями японского правительства, становится всё труднее сопротивляться их колониальным планам и экономической экспансии на Дальнем Востоке."
TRM_economic_ties_to_japan_low: "Экономические связи с Японией"
TRM_economic_ties_to_japan_low_desc: "Наши отношения с Японской империей медленно переходят от, по крайней мере номинально, взаимовыгодного партнёрства к отношениям, несущим все признаки серьёзного торгового дисбаланса."
TRM_economic_ties_to_japan_increased: "Возросшая зависимость от Японии"
TRM_economic_ties_to_japan_increased_desc: "Для многих становится всё более очевидным, что наша зависимость от Империи Японии растёт с каждым днём. Корабли из Токио прибывают с товарами и покидают Владивостокский порт с пустыми трюмами. Мы стали не более чем рынком сбыта."
TRM_economic_ties_to_japan_high: "Японские кукловоды"
TRM_economic_ties_to_japan_high_desc: "Мало кто серьёзно оспаривает, что наша страна на данный момент - не более чем японская болонка, а слабость режима Приамурья превратилась из секрета Полишинеля в вопиющий факт."

TRM_nationalised_gold: "Национализированное золото"
TRM_russo_japanese_mining: "Русско-Японская промышленная компания"
TRM_russo_japanese_mining_desc: "Русско-Японская промышленная компания - это конгломерат-дзайбацу, в значительной степени принадлежащий Mitsui и Nissan в сотрудничестве с нашим правительством."
