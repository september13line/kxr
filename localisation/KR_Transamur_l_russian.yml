TRM_sov: "§RУ красных не было времени консолидировать свою власть, и они слишком слабы, чтобы контролировать российский Дальний Восток; мы аннексируем его.§!\n"
TRM_rus: "§RПетроградский режим уже давно слишком слаб, чтобы установить прямой контроль за озером Байкал, но с политическим хаосом в России мы можем сделать свой ход.§!\n"
