TRM_ind_russia: "§CТеперь, когда Россия под нашим контролем, мы можем инвестировать в улучшение слаборазвитых районов нашей страны.§!\n"
TRM_change: "§CПриамурье достигнет конечной цели, к которой стремилось с 1925 года, официально сменив российский режим.§!\n"
