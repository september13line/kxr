TRM_russian_expansion: "Дела Российского государства"
TRM_russian_expansion_desc: "Мы являемся законным российским государством, а не самозванцы, которых мы называем Петроградским режимом. Однако есть несколько вещей, которые нам нужно сделать, чтобы не только российский народ, но и весь мир видел это именно так. Да здравствует Россия единая и неделимая!"
TRM_lessons_of_kolchak_putsch: "Уроки Колчаковского путча"
TRM_lessons_of_kolchak_putsch_desc: "После Колчаковского путча у нас были некоторые пограничные конфликты с Россией, но мы удержали Дальний Восток и теперь знаем их слабые места."
TRM_message_annenkov: "Послание Анненкову"
TRM_message_annenkov_desc: "Борис Анненков, печально известный русский наёмник, сделал карьеру для себя и своих людей в войсках полевого командира Чжан Цзунчана. Но теперь его старый товарищ призывает его вернуться к более благородным целям."
TRM_refuse_war: "Отказаться от всероссийских амбиций"
TRM_refuse_war_desc: "Нам больше не следует называть себя законным российским правительством. Мы выбрали другой путь - путь независимого Дальнего Востока и Сибири."
TRM_deal_with_mongolia: "Монгольский коридор"
TRM_deal_With_mongolia_desc: "Монголия не только занимает наши законные земли, но и открывает путь в сердце Петроградского режима. Мы должны иметь Монголию на нашей стороне, прежде чем двинуться на Петроград."
TRM_Claim_West_Sib: "Марш на Запад"
TRM_Claim_West_Sib_desc: "Чем больше растёт наша мощь, тем больше становятся наши амбиции. Наши цели ясны - мы пойдём на Запад и освободим всю Сибирь."
TRM_Claim_Russia: "Окончательное решение"
TRM_Claim_Russia_desc: "Время пришло! День за днём мы мечтаем о том времени, когда нанесём удар по нашим врагам в Петрограде. Мы больше не просто Приамурье и не Дальневосточная Республика. Нет. Наше притязание на мантию Российской Республики больше не будет простой претензией, а станет неоспоримым фактом! Мы освободим Матушку-Россию от предателей, которые её разрушили."

TRM_Integrate_West_Sib: "Интегрировать Западную Сибирь"
TRM_Integrate_West_Sib_desc: "Теперь мы контролируем весь сибирский регион, и всё же существует явная трудность в управлении этими огромными землями. В результате мы должны расширить административный аппарат. Это займёт некоторое время, но с нашим более жёстким контролем над регионом наша страна неизмеримо усилится."

TRM_Cap_Novosibirsk: "Перенести столицу в Новосибирск"
TRM_Cap_Novosibirsk_desc: "Поскольку наша мощь с каждым днём становится сильнее, мы становимся более независимыми от Японии и её имперских амбиций. Перенос столицы в Новосибирск покажет им, что мы больше не их прихвостни."

TRM_relocate_capital: "Перенести столицу в [FROM.GetCapitalVictoryPointName]"

TRM_russian_integaration: "Реинтеграция России"
TRM_russian_integaration_desc: "С нашим расширением на бывшие земли нам нужно будет не забывать реинтегрировать территории, чтобы мы могли управлять ими более эффективно. Однако проведение этого процесса потребует значительного количества §YВремени§! и §YПолитической власти§!."

