### Leaders ###
POLITICS_IVANOE_BONOMI_DESC: "Когда в 1926 году сицилийцы и сардинцы вышли из Итальянской Федерации, её последней оставшейся составной частью стала Республика Ломбардия-Венеция. Иванаэ Бономи, премьер-министр Республики и исполняющий обязанности главы Федерации, распустил это образование в 1930 году. Несмотря на призывы официально провозгласить новую Итальянскую Республику, правительство решило заключить очередное соглашение с австрийцами, согласившись формально сохранить название Ломбардии-Венеции, хотя в действительности все называют государство Итальянской Республикой, до полного вывода австрийского гарнизона под командованием Артура Эдлера фон Шушнига. Готовность Бономи сотрудничать с крайне непопулярной Австрией, хотя и приносит экономическую выгоду, продолжает вызывать серьёзную критику внутри страны. Бономи пытается выдержать всё более ожесточённые нападки, одновременно укрепляя политические институты республики."

### World Tension ###
italian_wars_threat: "Гражданская война в Италии"

### Ideas ###
ITA_austrian_occupation_idea: "Австрийская «оккупация»"
ITA_austrian_occupation_idea_desc: "После краха так называемой «Итальянской Федерации» Ломбардия-Венеция была оккупирована австрийцами, стремившимися защитить свои интересы в регионе и не допустить дальнейшего расширения социалистов. Избежать полномасштабного восстания удалось лишь благодаря соглашению с либеральными и республиканскими силами, и теперь Ломбардия-Венеция остаётся одной из самых запутанных частей австро-венгерской мозаики, причём даже Гражданское правительство не до конца понимает сложившуюся ситуацию. Статус Ломбардии-Венеции остаётся предметом ожесточённых споров как в Вене, так и в Венеции, поскольку губернатор Артур Шушниг неоднократно откладывал обсуждение будущего территории по рекомендации венского Министерства иностранных дел. Постоянная неопределённость вокруг Ломбардии-Венеции породила немало недовольства и лишь усилила нестабильность и без того пошатнувшейся Австрийской империи. Гражданское правительство, хотя на бумаге и наделено значительными полномочиями, на деле часто оказывается оттеснено на второй план венскими интригами, что ещё сильнее подогревает недовольство. Любое потрясение, способное поколебать австрийскую сферу влияния, может наконец заставить Австрию всерьёз решить судьбу одного из самых беспокойных своих владений."
ITA_deal_with_the_devil_idea: "Сделка с дьяволом"
ITA_deal_with_the_devil_idea_desc: "Отречение Витторио Эмануэле III и последовавшая Итальянская революция значительно усилили и без того зарождавшееся республиканское движение в Италии. Разумеется, последующий окончательный поворот захвативших инициативу республиканских сил к синдикализму серьёзно охладил пыл тех, кто выступал против монархии, но при этом желал сохранить существующую демократическую систему. Позднейший крах поддерживаемой Австрией «Итальянской Федерации» открыл перед демократическими республиканцами новую возможность, и они заключили соглашение с подконтрольным Вене губернаторством Ломбардии-Венеции, чтобы обеспечить стабильность на землях к западу от Изонцо. Австрийцы согласились позволить создание республики, номинально лояльной Вене и формально возглавляемой австрийским губернатором, а взамен республиканцы получили право управлять регионом как демократической республикой и помогать поддерживать в нём порядок. Этот компромисс, приемлемый для одних, вызвал заметное недовольство как монархистов, желающих вновь попытаться воплотить идею Итальянской Федерации, так и националистов, ненавидящих соглашение за то, что оно снова позволяет Австрии господствовать над итальянскими делами."
ITA_republic_federation: "Нестабильная республика"
ITA_republic_federation_desc: "Когда в 1920 году Австрия спасла нашу страну, Габсбурги вынудили нас передать значительную часть полномочий субъектам Федерации, особенно Венето, в рамках устройства Итальянской Федерации. Однако уже шесть лет её деятельность фактически приостановлена, а сама Федерация практически распущена, что создало крайне запутанную бюрократическую ситуацию. Оппозиция также не перестаёт доставлять неприятности: одни требуют восстановления Федерации, другие - полного отказа от демократии и австрийского влияния. В ближайшее время политическая обстановка едва ли стабилизируется."
ITA_republic_unitary: "Новая унитарная республика"
ITA_republic_unitary_desc: "Полномочия регионов урезаны, и вся власть теперь сосредоточена в руках центрального правительства - правительства, которое отменило выборы и объявило себя неподотчётным народу ради блага всей страны. Хотя ANI пользуется значительной поддержкой, новое правительство по-прежнему сталкивается с серьёзным сопротивлением, особенно со стороны республиканцев и старых монархистов в бывших субъектах страны."
ITA_republic_unitary_2: "Укреплённая унитарная республика"
ITA_republic_unitary_2_desc: "Полномочия регионов урезаны, и вся власть теперь сосредоточена в руках центрального правительства - правительства, которое отменило выборы и объявило себя неподотчётным народу ради блага всей страны. После устранения республиканцев и старых монархистов ANI теперь обладает полной монополией на власть."
ITA_federation_transition: "Федерация восстановлена"
ITA_federation_transition_desc: "Теперь, когда полномочия Федерального совета восстановлены, нам предстоит долгая и трудная работа: убедить народ и государственный аппарат признать своим правительством то, что ещё недавно они считали не более чем музейным экспонатом."
ITA_federation_secure: "Возрождённая Федерация"
ITA_federation_secure_desc: "Авторитет Федерального совета практически не оспаривается ни внутри страны, ни за её пределами. Теперь Совет намерен вернуть своим членам их прежние земли." 
ITA_austrian_influence: "Австрийское влияние"
ITA_austrian_influence_desc: "Влияние Австрии ощущается на всех уровнях нашей страны: от владения множеством наших компаний до верности, которую ей хранят многие высокопоставленные политики. Ненависть к этому влиянию велика, ведь, несмотря на то что австрийцы защитили нас от синдикалистов, именно они несут ответственность за наше поражение в Вельткриге. И всё же разрыв связей с Австрией окажется трудным и дорогостоящим делом."
ITA_austrian_sanctions: "Последствия национализации"
ITA_austrian_sanctions_desc: "Нашей экономике потребуется время, чтобы оправиться от так называемого «развода» с австрийским господством."
ITA_decentralize_idea: "Экономические возможности децентрализации"
ITA_decentralize_idea_desc: "Идеалы Итальянской Федерации предполагают сильные региональные правительства. Это должно значительно упростить инвестиции на местном уровне."
