italy_generic_weaken_resistance: "Ослабить сопротивление в области §Y[FROM.GetName]§!"
italy_generic_increase_control: "Усилить контроль в области §Y[FROM.GetName]§!"
ITA_claim_savoy: "Выдвинуть ирредентистские претензии на Савойю"
ITA_claim_savoy_desc: "Аннексированная Францией в 1860 году Савойя по праву является частью итальянских земель, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_upper_savoy: "Выдвинуть ирредентистские претензии на Верхнюю Савойю"
ITA_claim_upper_savoy_desc: "Аннексированная Францией в 1860 году Верхняя Савойя по праву является частью итальянских земель, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_trentino: "Выдвинуть ирредентистские претензии на Трентино"
ITA_claim_trentino_desc: "Некогда итальянская территория, Трентино перешёл к австрийцам после Наполеоновских войн, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_southern_tyrol: "Выдвинуть ирредентистские претензии на Южный Тироль"
ITA_claim_southern_tyrol_desc: "Хотя наши права на эту территорию довольно слабы, Южный Тироль является продолжением Трентино и некогда входил в состав римских владений. В наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_istria: "Выдвинуть ирредентистские претензии на Истрию"
ITA_claim_istria_desc: "Некогда входившая во владения Венеции Истрия по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_dalmatia: "Выдвинуть ирредентистские претензии на Далматинское побережье"
ITA_claim_dalmatia_desc: "Некогда входившее во владения Венеции Далматинское побережье по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_lika: "Выдвинуть ирредентистские претензии на Лику"
ITA_claim_lika_desc: "Некогда входившая во владения Венеции Лика по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_malta: "Выдвинуть ирредентистские претензии на Мальту"
ITA_claim_malta_desc: "Остров Мальта является неотъемлемой частью Италии, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_corsica: "Выдвинуть ирредентистские претензии на Корсику"
ITA_claim_corsica_desc: "Некогда входившая во владения Генуи Корсика по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_trieste: "Выдвинуть ирредентистские претензии на Триест"
ITA_claim_trieste_desc: "Долгое время находившийся под властью Австрийской империи Триест по-прежнему по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_postumia: "Выдвинуть ирредентистские претензии на Постумию"
ITA_claim_postumia_desc: "Некогда входившая во владения Венеции Постумия по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_cattaro: "Выдвинуть ирредентистские претензии на Каттаро"
ITA_claim_cattaro_desc: "Некогда входивший во владения Венеции порт Каттаро по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_claim_fiume: "Выдвинуть ирредентистские претензии на Фиуме"
ITA_claim_fiume_desc: "Некогда входивший во владения Венеции Фиуме по праву является итальянской территорией, и в наших интересах закрепить более прочные претензии на этот регион."
ITA_occupation_decisions: "Итальянская оккупация"
ITA_erode_italian_legitimacy: "Подорвать [From.GetAdjective]ую легитимность"
ITA_erode_italian_legitimacy_desc: "[From.GetAdjective]ое правительство потерпело поражение и теперь скрывается в изгнании. Учитывая, что его притязания на легитимность далеко не бесспорны, со временем мы должны суметь ослабить [From.Adjective]ое сопротивление."

