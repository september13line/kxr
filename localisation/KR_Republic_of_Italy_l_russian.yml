### Republic Path ###
ITA_REP_social_liberal_victory: "Республика выстояла"
ITA_REP_social_liberal_victory_desc: "Несмотря на привлекательность ANI и иностранные интриги, Республика выстояла. Хотя ANI всё ещё существует, мы можем утешаться тем, что республике больше не угрожают внутренние враги."
ITA_REP_protect_democracy: "Защитить демократию"
ITA_REP_protect_democracy_desc: "Наконец мы можем облегчённо вздохнуть - выборы закончились, а вместе с ними постепенно начала спадать и внутренняя напряжённость. Наша Республика выстояла."
ITA_REP_contain_extermism: "Сдержать экстремизм"
ITA_REP_contain_extermism_desc: "Хотя наша республика до сих пор выдерживала натиск радикалов всех мастей, любой момент слабости может стать возможностью для тиранов. Нельзя позволить свободе погибнуть. Мы должны подавить социалистические и ультранационалистические организации."
ITA_REP_banking_reform: "Банковская реформа"
ITA_REP_banking_reform_desc: "Внутренняя уязвимость нынешней мировой банковской и финансовой системы больше не вызывает сомнений. Нам следует принять чрезвычайное законодательство для стабилизации терпящих крах банков и провести наименее спорные реформы всей системы."
ITA_REP_work_programs: "Программы занятости"
ITA_REP_work_programs_desc: "Безработица угрожает как благополучию нашего народа, так и стабильности страны. Чтобы бороться с ней, следует привлечь безработных к строительству новых зданий и инфраструктуры."
ITA_REP_workers_rights: "Права рабочих"
ITA_REP_workers_rights_desc: "Итальянские рабочие больше никогда не должны поддаваться коварной сиреновой песне социализма или быть раздавленными сапогом работодателя. Пора положить конец злоупотреблениям в отношении трудящихся."
ITA_REP_economic_recovery_act: "Закон об экономическом восстановлении"
ITA_REP_economic_recovery_act_desc: "Наши первоначальные меры по восстановлению смягчили часть трудностей, вызванных Чёрным понедельником. Теперь следует реализовать всеобъемлющий план в духе прежних инициатив, чтобы окончательно положить конец этой депрессии."
ITA_REP_bussiness_relations: "Хорошие отношения с бизнесом"
ITA_REP_bussiness_relations_desc: "Многие ошибочно опасаются, что наше правительство придерживается взглядов, мало отличающихся от взглядов социалистов за По. Чтобы развеять эти беспочвенные тревоги, нам следует проводить регулярные встречи с видными представителями деловых кругов для обсуждения государственной политики."
ITA_REP_union_ties: "Связи с профсоюзами"
ITA_REP_union_ties_desc: "Хотя многие профсоюзы поддержали социалистическое восстание, Partito Liberale Democratico тесно сотрудничала с умеренными союзами, помогая укрепить власть нашей республики в первые бурные годы её существования. Нам следует вновь подтвердить приверженность дальнейшему сотрудничеству с профсоюзами."
ITA_REP_christian_democracy: "Христианская демократия"
ITA_REP_christian_democracy_desc: "Христианство проповедует сострадание к людям и устанавливает прочные нравственные принципы. Эти ценности неотделимы от демократии нашей страны и должны официально стать основой партийного мировоззрения."
ITA_REP_ubranization: "Урбанизация"
ITA_REP_ubranization_desc: "Наши города пришли в упадок из-за неблагоприятного исхода Вельткрига и разрушений Гражданской войны, а вместе с ними остановился и рост промышленного потенциала. Теперь, когда Чёрный понедельник остался позади, мы можем восстановить промышленные центры и дать новый толчок урбанизации."
ITA_REP_stable_democracy: "Стабильная демократия"
ITA_REP_stable_democracy_desc: "Экономический кризис завершён, а политические вызовы со стороны экстремистов преодолены. Итальянская демократия теперь функционирует как никогда прежде, и наша страна стала заметно стабильнее."

### ANI Path ###
ITA_REP_ani_elected: "ANI у власти"
ITA_REP_ani_elected_desc: "Associazione Nazionalista Italiana пришла к власти в Республике и приступила к превращению Италии в Легионерское государство, обещая уничтожить всех врагов страны и вернуть ей былое величие."
ITA_REP_purge_red_meance: "Искоренить красную угрозу"
ITA_REP_purge_red_meance_desc: "Демократия - фарс, а её институты неспособны противостоять социалистическому проникновению. Каждый государственный служащий должен пройти тщательную проверку, и если обнаружится хотя бы какая-либо связь с социалистической организацией, он должен быть немедленно отстранён от должности."
ITA_REP_italian_militerism: "Итальянский милитаризм"
ITA_REP_italian_militerism_desc: "На нашу страну могут напасть в любой момент. Все истинные сыны Италии обязаны всегда сохранять бдительность и быть готовыми по первому зову встать на защиту Родины. Мы должны сделать всё возможное, чтобы напомнить народу о его долге."
ITA_REP_four_economic_battles: "Четыре экономические битвы"
ITA_REP_four_economic_battles_desc: "Наша страна лежит в руинах не из-за ошибок национально мыслящих итальянцев, а из-за действий бесчисленных болванов по всему миру. Мы больше никогда не должны зависеть от иностранной некомпетентности. Четыре крупнейшие проблемы, стоящие перед нашей страной, должны быть одна за другой превращены в сражения и разгромлены."
ITA_REP_destroy_austrian_influence: "Создать унитарную республику"
ITA_REP_destroy_austrian_influence_desc: "Республика предоставила входящим в неё государствам слишком широкую автономию - пережиток австрийского влияния и прежней Федерации. Настало время упразднить их права и сосредоточить всю власть в руках центрального правительства, даже если это вполне может привести к борьбе с теми, кого мы лишим автономии."
ITA_REP_corporate_alliance: "Воплотить истинный корпоративизм"
ITA_REP_corporate_alliance_desc: "Производительные силы нашей пролетарской нации должны быть объединены в единый великий организм, государство, где различные корпорации соберутся вместе и создадут экономику, способную противостоять плутократам этого мира. Пришло время воплотить идеи нашего главного экономиста Альфредо Рокко, ныне широко популярные, но искажённые в других странах."
ITA_REP_corporate_militarism: "Корпорации ради оружия, оружие ради освобождения"
ITA_REP_corporate_militarism_desc: "Наша борьба за освобождение итальянской Родины невозможна без перевода корпоративизированной экономики на полномасштабное производство вооружений."
ITA_REP_purge_opposition: "Очистить оппозицию"
ITA_REP_purge_opposition_desc: "Некоторые заблудшие глупцы упорно не желают отказываться от своих бессильных демократических идеалов. Раз их невозможно легко убедить принять националистическое мировоззрение, их следует удалить из государственной службы и руководства корпораций."
ITA_REP_centralized_power: "Централизованная власть"
ITA_REP_centralized_power_desc: "Венецианское сопротивление подавлено, и теперь вся власть полностью сосредоточена в руках центрального правительства."
ITA_REP_military_loyalty: "Верные вооружённые силы"
ITA_REP_military_loyalty_desc: "Политические выступления изнутри вооружённых сил свергли бесчисленное множество режимов. Чтобы обеспечить лояльность, следует предложить генералам низшие должности в гражданской администрации и предоставить им иные политические привилегии."
ITA_REP_italian_liberation: "Освобождение Италии"
ITA_REP_italian_liberation_desc: "День воссоединения Италии стремительно приближается, и мы должны быть полностью готовы освободить остальную часть полуострова, как только представится возможность."
ITA_REP_italy_is_reborn: "Италия возрождена"
ITA_REP_italy_is_reborn_desc: "Подобно фениксу, вновь восставшему из пепла, Италия возродилась. Теперь необходимо окончательно закрепить саму сущность нашей нации. Как во времена древних римлян, Республика будет навеки упразднена, а на её месте восстанет Империум!"

### Monarchy Path ###
ITA_REP_king_of_italy: "Восстановление Федерации"
ITA_REP_king_of_italy_desc: "Хотя республиканизм направлял нашу страну последние семь лет, настало время вернуться к децентрализованному аристократическому правлению Итальянской Федерации."
ITA_REP_invest_in_countryside: "Инвестиции в деревню"
ITA_REP_invest_in_countryside_desc: "Сельская местность хранит традиции и нравственность так, как не способен ни один город. Разорённую деревню необходимо восстановить, если наше правительство рассчитывает заручиться народной поддержкой."
ITA_REP_decentralization: "Идеалы децентрализации"
ITA_REP_decentralization_desc: "Итальянская Федерация поощряет экономическую свободу входящих в неё государств, а центральное правительство вмешивается лишь тогда, когда это необходимо. Такой подход должен сделать наши земли богаче."
ITA_REP_state_intervention: "Государственное вмешательство"
ITA_REP_state_intervention_desc: "Свободный рынок очевидно потерпел неудачу, ведь иначе либералы сохранили бы власть. Только государственное вмешательство способно остановить падение наших рынков."
ITA_REP_build_legitimacy: "Укрепить легитимность"
ITA_REP_build_legitimacy_desc: "Для многих Итальянская Федерация была не более чем навязанным извне порядком. Они считают наше правительство никому не нужным анахронизмом, который вскоре рухнет. Мы обязаны доказать им обратное."
ITA_REP_fight_republicanism: "Борьба с республиканизмом"
ITA_REP_fight_republicanism_desc: "Теперь мы располагаем достаточным политическим влиянием, чтобы активнее бороться с республиканским влиянием внутри правительства. Посредством политических манёвров можно оправдать отстранение главой Федерации наиболее непримиримых республиканских политиков."
ITA_REP_traditional_values: "Традиционные ценности"
ITA_REP_traditional_values_desc: "Революционные идеалы, распространившиеся по всему миру, отвратительны и являются оскорблением нравственности. Мы должны превратить себя в оплот традиционализма в Европе."
ITA_REP_church_ties: "Связи с Церковью"
ITA_REP_stable_institutions: "Стабильные институты"
ITA_REP_stable_institutions_desc: "Хотя либералы и социалисты обвиняют монархии и консервативные правительства в неспособности приспосабливаться к переменам, именно они действуют слишком поспешно. Мы же пережили больше изменений, чем можно сосчитать, и потому знаем силу традиционных институтов. Теперь мы докажем её народу."
ITA_REP_church_ties_desc: "Католическая вера даёт прочные нравственные ориентиры и надёжный фундамент для правильного государственного управления. Мы должны вновь подтвердить свою преданность католицизму и теснее сблизиться с консервативными кругами внутри Церкви."
ITA_REP_end_depression: "Возвращение процветания"
ITA_REP_end_depression_desc: "После множества инициатив, одни из которых увенчались успехом, а другие провалились, нам удалось остановить экономический спад. Теперь мы наконец можем заявить, что преодолели последствия Чёрного понедельника, а наш народ способен вновь обрести экономическую стабильность и смотреть в процветающее будущее."
ITA_REP_defend_the_kingdom: "Защитить Федерацию"
ITA_REP_defend_the_kingdom_desc: "Наша страна никогда не будет полностью защищена от нападения. Мы должны построить новые укрепления и иные оборонительные сооружения, чтобы сорвать любое вражеское вторжение."
ITA_REP_towards_risorgimento: "К единой Италии"
ITA_REP_towards_risorgimento_desc: "Теперь, когда мы доказали народу справедливость нашего правления, мы готовы объединить Италию. Пусть все, кто встанет на нашем пути на мировой арене, падут так же, как пали наши внутренние соперники! Viva l'Italia!"


### Economic Focuses ###
ITA_REP_assess_the_economy: "Финансировать итальянскую промышленность"
ITA_REP_assess_the_economy_desc: "Институт промышленной реконструкции был создан в 1924 году для восстановления нашей тяжёлой промышленности после гражданской войны. Следует увеличить его финансирование, чтобы он и дальше помогал промышленности страны."
ITA_REP_industrial_improvements: "Промышленная модернизация"
ITA_REP_industrial_improvements_desc: "Значительная часть промышленности страны находится в плачевном состоянии, а продолжающие работать заводы всё сильнее устаревают. Чтобы решить проблему, следует начать государственную программу модернизации предприятий."
ITA_REP_create_autostrada: "Создать Автостраду"
ITA_REP_create_autostrada_desc: "Автострада задумывалась как система широких автомобильных дорог, соединяющих крупнейшие города. Хотя гражданская война остановила планы её строительства, теперь мы способны возвести хотя бы часть первоначально задуманной сети."
ITA_REP_support_auto_industry: "Поддержать автомобильную промышленность"
ITA_REP_support_auto_industry_desc: "С самого рождения автомобильной отрасли Италия была одним из центров технических новшеств. Следует воспользоваться этим преимуществом и предоставить промышленности значительные субсидии для увеличения производства."
ITA_REP_modernize_agriculture: "Модернизировать сельское хозяйство"
ITA_REP_modernize_agriculture_desc: "Многочисленные мелкие сельские хозяйства не только до сих пор несут на себе следы Гражданской войны, но и не смогли внедрить новые сельскохозяйственные технологии и способы обработки земли. Нам следует субсидировать импорт современного оборудования, чтобы ускорить этот процесс."
ITA_REP_create_theistituto_luce: "Создать Istituto Luce"
ITA_REP_create_theistituto_luce_desc: "Многие недовольные наверняка отложили бы свой гнев, если бы им лишь показали правду. Чтобы продемонстрировать им нашу несомненную доброжелательность, следует создать ведомство, посвящённое народному просвещению и нравственному воспитанию посредством новых форм массовой информации."
ITA_REP_economic_planning: "Экономическое планирование"
ITA_REP_economic_planning_desc: "Теперь, когда депрессия, вызванная Чёрным понедельником, завершилась, мы должны позаботиться о том, чтобы подобный крах больше никогда не повторился. Для этого следует создать государственную организацию, занимающуюся долгосрочной экономической политикой."
ITA_REP_new_defense_contracts: "Новые оборонные контракты"
ITA_REP_new_defense_contracts_desc: "Оружейные предприятия в недавно освобождённых частях Италии можно без труда расширить. Выдавая им новые контракты, мы сможем стимулировать дальнейший рост производства."
ITA_REP_military_contacts: "Военные контракты"
ITA_REP_military_contacts_desc: "Чтобы одновременно оживить экономику и вооружить армию, следует разместить дополнительные заказы на стрелковое оружие среди небольших предприятий оборонной промышленности."
ITA_REP_defense_contracts: "Оборонные контракты"
ITA_REP_defense_contracts_desc: "Оружейная промышленность является важным сектором экономики. Тесно сотрудничая с подрядчиками и выдавая новые заказы, мы можем стимулировать расширение многочисленных военных предприятий."
ITA_REP_military_economics: "Милитаризированная экономика"
ITA_REP_military_economics_desc: "Экономика и армия не должны противостоять друг другу, они обязаны работать как две взаимодополняющие шестерни одного большого механизма."
ITA_REP_new_economy: "Новая экономика"
ITA_REP_new_economy_desc: "Теперь, когда Италия объединена, следует сосредоточиться на экономическом развитии тех частей страны, которые прежде были для нас потеряны."
ITA_REP_research_institutes: "Исследовательские институты"
ITA_REP_research_institutes_desc: "Наша система исследований и разработок пришла в упадок. Мы не можем позволить врагам обладать технологическим преимуществом. Пора основать новые государственные исследовательские институты."
ITA_REP_new_venetian_arsenal: "Новый Венецианский арсенал"
ITA_REP_new_venetian_arsenal_desc: "Когда-то Венеция была домом для одной из крупнейших верфей Европы, и её судостроительные мощности до сих пор обладают огромным потенциалом для расширения. Создадим новый военно-морской арсенал в Венеции."
ITA_REP_market_protection: "Защита рынка"
ITA_REP_market_protection_desc: "Чтобы стимулировать внутреннее производство, необходимо защитить экономику от хищнической торговой политики иностранных держав. Следует ввести высокие пошлины на ряд готовых товаров."
ITA_REP_synthetic_research: "Исследования синтетических материалов"
ITA_REP_synthetic_research_desc: "Наша страна не располагает собственными источниками нефти и каучука. Однако мы можем производить их, используя огромное богатство природных ресурсов Итальянского полуострова."
ITA_REP_expand_research_institutes: "Расширить исследовательские институты"
ITA_REP_expand_research_institutes_desc: "Созданные нами исследовательские институты помогли сократить технологический разрыв между нашей страной и другими европейскими державами. Следует реформировать неэффективные элементы научной системы и сделать весь механизм более рациональным."
ITA_REP_new_industry: "Новые промышленные программы"
ITA_REP_new_industry_desc: "Теперь, когда заводы Италии вновь способны служить Италии, нам следует заняться их полноценной интеграцией в национальную экономику."
ITA_REP_expand_dockyards: "Расширить верфи"
ITA_REP_expand_dockyards_desc: "Порты значительной части страны лежат в руинах. Мы должны расширить и восстановить их."
ITA_REP_expand_air_ports: "Расширить аэродромы"
ITA_REP_expand_air_ports_desc: "Авиационная промышленность стремительно растёт по всему миру. Мы должны оказаться в авангарде этого нового сектора экономики."
ITA_REP_expand_the_autostrada: "Расширить Автостраду"
ITA_REP_expand_the_autostrada_desc: "Автострада уже принесла огромную пользу северо-восточной Италии, и теперь, когда остальная страна находится под нашим контролем, мы можем распространить её сеть на весь полуостров."
ITA_REP_southern_industry: "Индустриализировать Юг"
ITA_REP_southern_industry_desc: "Юг всегда отставал в промышленном развитии. Мы обязаны сократить этот разрыв."
ITA_REP_italian_factories: "Фабрики для Италии"
ITA_REP_italian_factories_desc: "Значительная часть Италии остаётся слаборазвитой. Если мы действительно хотим стать одной из великих держав Европы, это необходимо изменить."
ITA_REP_italian_miracle: "Итальянское чудо"
ITA_REP_italian_miracle_desc: "Воссоединённая Италия преодолела прежние бедствия и стремительно вышла на мировую арену как одна из крупнейших экономик Европы."

### Unification ###
ITA_REP_unification: "Начать Рисорджименто"
ITA_REP_unification_desc: "Время пришло. Италия, эта прекрасная и изобильная земля, вновь будет объединена. Viva l'Italia!"
ITA_REP_naval_exercises: "Морские учения"
ITA_REP_naval_exercises_desc: "Чтобы продемонстрировать силу и поднять боевой дух флота, следует провести серию военно-морских учений в Адриатическом море. Пусть враги нашей страны трепещут."
ITA_REP_reenforce_po_line: "Укрепить оборонительную линию По"
ITA_REP_reenforce_po_line_desc: "Импровизированные укрепления, остановившие синдикалистов в 1920 году, теперь их не удержат. Мы должны усилить пограничные форты и окопы, готовясь к новому наступлению социалистов."
ITA_REP_military_exercises: "Военные учения"
ITA_REP_military_exercises_desc: "Чтобы продемонстрировать силу и поднять моральный дух армии, следует провести серию приближённых к боевым условиям учений у реки По. Пусть враги нашей страны трепещут."
ITA_REP_italy_is_united: "Италия объединена"
ITA_REP_italy_is_united_desc: "Свершилось. Италия, прекрасная Италия, вновь едина. В сердцах всех патриотов этот момент навсегда останется в памяти."
ITA_REP_naples_officers: "Привлечь сицилийских генералов"
ITA_REP_naples_officers_desc: "Сицилийский офицерский корпус, каким бы отвратительным ни был его прежний король, несомненно располагает множеством способных генералов. Стоит ли позволить им служить Италии?"
ITA_REP_sardinian_officers: "Привлечь сардинских генералов"
ITA_REP_sardinian_officers_desc: "Многие достойные люди сражались и погибли за Сардинию. Теперь, когда раны войны начинают заживать, необходимо решить судьбу сардинских генералов."
ITA_REP_italian_irredentism: "Политика итальянского ирредентизма"
ITA_REP_italian_irredentism_desc: "Теперь, когда Италия объединена, а наиболее насущные внутренние вопросы решены, мы можем обратить взгляд наружу, прежде всего на те земли, которые по праву должны принадлежать Италии."
ITA_REP_nationalist_question: "Стабильная Итальянская Республика"
ITA_REP_nationalist_question_desc: "Наша политика оставалась нестабильной с самого окончания гражданской войны, но теперь, когда Итальянская Республика правит всей Италией, мы наконец можем покончить с нестабильностью, мучившей нас долгие годы."

### Military Army Focuses ###
ITA_REP_mobile_warfare_focus: "Доктрина Родольфо Грациани"
ITA_REP_mobile_warfare_focus_desc: "Самая подвижная армия получает значительное преимущество на поле боя. Пусть наши враги насчитывают миллионы солдат, если наши силы достаточно быстры, чтобы в полной мере использовать тактические возможности, победа будет за нами."
ITA_REP_grand_battle_plan_focus: "Доктрина Эмилио Де Боно"
ITA_REP_grand_battle_plan_focus_desc: "Сохранение оперативной целостности и точное исполнение тщательно разработанных планов являются ключом к победе в современной войне. Поражение Италии в Вельткриге проще всего объяснить некомпетентным планированием и пренебрежением общей стратегией. Это больше никогда не повторится."
ITA_REP_superior_firepower_focus: "Доктрина Этторе Бастико"
ITA_REP_superior_firepower_focus_desc: "Современное оружие позволяет уничтожать противника на расстоянии. Мы должны насытить вооружённые силы артиллерией и другим вспомогательным оборудованием."
ITA_REP_begin_modernizing: "Начать модернизацию"
ITA_REP_begin_modernizing_desc: "Теперь, когда армия руководствуется единой доктриной, мы можем приступить к перестройке её структуры и состава."
ITA_REP_modernize_alpini: "Модернизировать Альпини"
ITA_REP_modernize_alpini_desc: "Если бы не храбрость и мастерство Альпини, Италия наверняка пала бы перед Центральными державами ещё раньше во время Вельткрига. Однако после окончания войны эти выдающиеся горные стрелки пришли в упадок. Следует вновь привести Альпини в боевую готовность."
ITA_REP_create_paratroopers: "Реформировать Ардити"
ITA_REP_create_paratroopers_desc: "Ардити воплощают лучшее, что способна предложить Италия. Эти элитные подразделения специализируются на проникновении в тыл противника, особенно нестандартными способами и в суровых условиях. Следует реорганизовать Ардити, чтобы они лучше соответствовали стремительно меняющейся роли сил специального назначения в современной войне."
ITA_REP_high_command_reform: "Реформы высшего командования"
ITA_REP_high_command_reform_desc: "Итальянское высшее военное командование оказалось расколото вместе с самой страной. Однако с тех пор его структура почти не изменилась. Следует реорганизовать высшее командование в соответствии с требованиями нынешней ситуации."
ITA_REP_italian_armored_cars: "Итальянские бронеавтомобили"
ITA_REP_italian_armored_cars_desc: "Бронеавтомобили доказали свою эффективность во время Вельткрига как средство повышения мобильности войск и дешёвой огневой поддержки. Теперь, когда наша армия делает ставку на подвижность, бронеавтомобили также необходимо модернизировать, а их доктрину приспособить к новому стилю ведения боя."
ITA_REP_cruiser_tanks: "Крейсерские танки"
ITA_REP_cruiser_tanks_desc: "Крейсерские танки специально предназначены для поддержки моторизованной пехоты. Это кавалерия современной эпохи."
ITA_REP_artillery_effort: "Развитие артиллерии"
ITA_REP_artillery_effort_desc: "Артиллерия и прочие средства поддержки должны быть безупречно интегрированы в наши сухопутные части. Ни одна атака не должна проводиться без поддержки."
ITA_REP_infantry_tanks: "Пехотные танки"
ITA_REP_infantry_tanks_desc: "Бронетехника должна тесно взаимодействовать с пехотой, чтобы оба рода войск могли сражаться эффективнее."
ITA_REP_planning_school: "Школы планирования"
ITA_REP_planning_school_desc: "Все унтер-офицеры должны получать хотя бы некоторую формальную офицерскую подготовку, а не полагаться исключительно на личный опыт. Для этого следует создать несколько новых офицерских академий, ориентированных на краткосрочные дополнительные курсы для унтер-офицеров. Мы полагаем, что это значительно повысит способность отдельных частей правильно понимать и исполнять приказы."
ITA_REP_commander_initative: "Инициатива командиров"
ITA_REP_commander_initative_desc: "Офицерам необходимо предоставить возможность самостоятельно реагировать на изменения тактической обстановки в своих подразделениях. Следует поощрять их планировать и действовать в соответствии с реальной ситуацией на местности."
ITA_REP_modernize_guns: "Модернизировать стрелковое оружие"
ITA_REP_modernize_guns_desc: "Наши вооружённые силы по-прежнему в значительной степени используют то же устаревшее оружие, что и во время Вельткрига. Необходимо привести стрелковое вооружение в соответствие с современными европейскими стандартами."
ITA_REP_create_the_saf: "Servizio Ausiliario Femminile"
ITA_REP_create_the_saf_desc: "Потенциал итальянских женщин в военных усилиях до сих пор остаётся в значительной степени неиспользованным. Создав полностью женские добровольческие подразделения для вспомогательной службы в армии, мы сможем начать использовать способности наших достойных сестёр."
ITA_REP_finish_reforms: "Завершить реформы"
ITA_REP_finish_reforms_desc: "Армия практически полностью реформирована. Наши солдаты и офицеры готовы вернуть Италии её законное место среди великих держав Европы."

### Military Navy Focuses ###
ITA_REP_republican_navy: "Marina Nazionale Italiana"
ITA_REP_republican_navy_desc: "Наш флот по-прежнему организован примерно по той же импровизированной системе, что возникла с началом Гражданской войны. Следует централизовать военно-морское управление в рамках новой структуры."
ITA_REP_merchant_marine: "Торговый флот"
ITA_REP_merchant_marine_desc: "Во время Вельткрига Атлантика превратилась в кладбище торговых судов наших союзников, а успех в следующей войне будет не меньше зависеть от способности торгового флота пересекать опасные воды. Поэтому нам необходимо единое управление торговым судоходством, отвечающее за конвои."
ITA_REP_modernize_the_navy: "Модернизировать флот"
ITA_REP_modernize_the_navy_desc: ""
ITA_REP_grand_navy: "Большой флот"
ITA_REP_grand_navy_desc: "Наш флот необходимо стремительно расширить, уделяя особое внимание строительству новых крупных кораблей."
ITA_REP_heavy_cruisers: "Тяжёлые крейсеры"
ITA_REP_heavy_cruisers_desc: ""
ITA_REP_battle_cruisers: "Броненосные крейсеры"
ITA_REP_battle_cruisers_desc: "Броненосные крейсеры одновременно быстры и вооружены крупнокалиберными орудиями. Хотя они и не способны стать основой нашего флота, их роль остаётся весьма ценной."
ITA_REP_battleships: "Итальянские линкоры"
ITA_REP_battleships_desc: "Линкоры являются гордостью любого флота. Огромные, хорошо бронированные и вооружённые, а также чрезвычайно дорогие в производстве, новые линкоры на нашей службе несомненно покажут миру, что Италия намерена вернуть своё место среди великих держав."
ITA_REP_defend_the_coast: "Защитить побережье"
ITA_REP_defend_the_coast_desc: "Новый флот должен быть ориентирован на защиту нашего побережья и нарушение вражеского торгового судоходства."
ITA_REP_subs: "Итальянские подводные лодки"
ITA_REP_subs_desc: "Германия с огромным успехом применяла подводные лодки во время Вельткрига. Если наш флот хочет быть эффективным, нам необходимы собственные подводные силы."
ITA_REP_destroyers: "Итальянская береговая охрана"
ITA_REP_destroyers_desc: "Следует создать новое подразделение военно-морских сил, сосредоточенное на защите наших территориальных вод."
ITA_REP_light_cruisers: "Лёгкие крейсеры"
ITA_REP_light_cruisers_desc: "Лёгкие крейсеры являются универсальными кораблями поддержки, способными значительно помогать как крупным, так и малым боевым единицам."
ITA_REP_reenforce_the_coast: "Укрепить побережье"
ITA_REP_reenforce_the_coast_desc: "Северное побережье Адриатики является нашей жизненно важной связью с мировыми рынками и потому ни в коем случае не должно попасть в руки врага. Следует построить новые береговые укрепления, чтобы ни один противник не смог высадиться на этих берегах."
ITA_REP_republican_marines: "Расширить бригаду Сан-Марко"
ITA_REP_republican_marines_desc: "Чтобы вести войну на чужих берегах или высаживаться в тылу противника и нарушать его организацию, нам придётся вложиться в новое десантное оборудование и методы подготовки."
ITA_REP_rule_the_seas: "Владычествовать на морях"
ITA_REP_rule_the_seas_desc: "Наш флот теперь как минимум не уступает прежней Regia Marina и полностью готов защищать Италию и обрушиваться на её врагов подобно великой волне."

### Military Air Force Focuses ###
ITA_REP_establish_anr: "Aeronautica Nazionale Italiana"
ITA_REP_establish_anr_desc: "Наши небольшие воздушные силы состоят из добровольцев, использующих немногочисленные самолёты, которые удаётся собрать из иностранных излишков. Необходимо создать полноценные военно-воздушные силы и начать подготовку новых пилотов."
ITA_REP_pilot_training: "Подготовка пилотов"
ITA_REP_pilot_training_desc: "Добровольцы, составляющие сейчас основную массу наших военных лётчиков, в основном являются бывшими энтузиастами-любителями с немалым опытом полётов. Следует привлечь этих опытных авиаторов к созданию системы подготовки новых пилотов."
ITA_REP_upgrade_air_ports: "Модернизировать аэродромы"
ITA_REP_upgrade_air_ports_desc: "Чтобы обеспечить деятельность настоящих военно-воздушных сил, многочисленные небольшие гражданские аэродромы по всей стране следует национализировать и расширить."
ITA_REP_aviation_industry: "Авиационная промышленность"
ITA_REP_aviation_industry_desc: "Итальянские авиастроители серьёзно пострадали от потрясений, терзавших полуостров с окончания Вельткрига. Чтобы вернуть их на уровень иностранных компаний, необходима государственная поддержка."
ITA_REP_army_air_support: "Стратегический упор"
ITA_REP_army_air_support_desc: "Наши военно-воздушные силы должны сосредоточиться на нанесении ущерба промышленности и военному потенциалу противника. Главное - наступление, а не оборона."
ITA_REP_bomber_efforts: "Развитие бомбардировщиков"
ITA_REP_bomber_efforts_desc: "Чтобы по-настоящему помогать армии, наши воздушные силы должны быть способны уничтожать укреплённые позиции и нарушать вражескую инфраструктуру. Для этого следует сосредоточиться на разработке новых тактических и стратегических бомбардировщиков."
ITA_REP_air_supremcy: "Господство в воздухе"
ITA_REP_air_supremcy_desc: "Небо должно быть очищено от врага, а наши армии не должны страдать от действий неприятельской авиации. Основной задачей военно-воздушных сил должно стать установление и сохранение господства в воздухе."
ITA_REP_fighter_support: "Развитие истребителей"
ITA_REP_fighter_support_desc: "Истребители являются основой любых военно-воздушных сил, и чтобы завоевать небо, мы должны разработать новые модели."
ITA_REP_paracadutisi: "Паракадутисти"
ITA_REP_paracadutisi_desc: "Парашютисты являются новым типом войск, позволяющим перебрасывать подразделения в районы, куда иначе невозможно попасть. Развивая более совершенное воздушно-десантное оснащение, мы получим уникальное тактическое преимущество над врагами."
ITA_REP_female_pilots: "Женщины-пилоты"
ITA_REP_female_pilots_desc: "Многие патриотично настроенные женщины с опытом полётов лишены возможности напрямую участвовать в военных усилиях. Следует разрешить женщинам-пилотам добровольно служить в транспортной авиации и на вспомогательных должностях."
ITA_REP_radar_effort: "Развитие радиолокации"
ITA_REP_radar_effort_desc: "Радар является многообещающей новой технологией, которая при дальнейшем развитии способна предоставить огромное количество сведений о тактике и позициях противника, а также обнаруживать маршруты вражеских самолётов."
ITA_REP_rule_the_skies: "Владычествовать в небесах"
ITA_REP_rule_the_skies_desc: "Наши военно-воздушные силы больше не являются разношёрстным сборищем добровольцев, а превратились в полноценный род вооружённых сил. Пусть небо Италии и далёких земель принадлежит нам!"




### Events ###
italianrepublic.1.t: "История Итальянской Республики: поражение и гражданская война"
italianrepublic.1.d: "После поражения Франции и краха итальянской военной кампании Австрия и Королевство Италия в августе 1919 года подписали перемирие, согласно которому австрийским войскам разрешалось занимать Ломбардию и Венецию до заключения мирного договора. Всего через несколько дней после унизительного объявления о мире разгневанные националисты провозгласили в Милане новую Итальянскую Республику, заявив, что все договоры, подписанные Савойским домом, должны считаться недействительными. По всей Италии республиканцы и националисты поднялись против королевской власти, и даже отречения короля Виктора Эммануила и его сына оказалось недостаточно, чтобы остановить распад монархического порядка. После того как роялистов вытеснили из большей части Центральной и Северной Италии, стало очевидно, что противоречия между различными фракциями внутри республики слишком глубоки, чтобы их можно было примирить. То, что начиналось с отдельных актов саботажа, переросло в полномасштабный конфликт между Красными и Белыми, остановивший наступление против монархистов."
italianrepublic.1.a: "Ужасно."

italianrepublic.22.t: "Положение Итальянской Республики: крах Федерации"
italianrepublic.22.d: "По мере затягивания гражданской войны удача всё больше отворачивалась от Белых, и когда Австрия предложила республиканцам помощь в обмен на присоединение к общему государству вместе с роялистами на юге, у них не осталось иного выбора, кроме как согласиться или оказаться уничтоженными. После победы над социалистами на По Белые и австрийские войска были вынуждены проглотить горькую пилюлю продолжительного сотрудничества. Республика была обязана юридически войти в Итальянскую Федерацию под австрийской защитой. Кроме того, Венеции предоставили значительную автономию, а австрийцам и Совету Итальянской Федерации - большое влияние на правительство. Взамен премьер-министр Республики получил титул Временного главы Итальянской Федерации.\n\nОднако в 1926 году это тщательно выстроенное равновесие рухнуло после вступления Британского Союза в Третий Интернационал. Социалисты воспрянули духом, и вновь заговорили о войне, но австрийцы ясно дали понять, что их войска не станут атаковать социалистов, если те нападут на юг. Это погрузило полуостров в хаос и дало сицилийцам и савойцам, давно недовольным промиланским балансом сил в Совете Итальянской Федерации, возможность покинуть его. Хотя социалисты так и не напали, Совет окончательно утратил смысл своего существования, и его десятилетний срок полномочий истёк в 1930 году. Одновременно была распущена сама федеральная структура, а вся полнота власти перешла к последней оставшейся составной части - Республике Ломбардия-Венеция, неофициально именуемой Итальянской Республикой. Пока коридоры гражданской власти в Милане кипят деятельностью и амбициями, зал Совета теперь пустует."
italianrepublic.22.a: "Заполнится ли он когда-нибудь вновь?"

italianrepublic.18.t: "Положение Итальянской Республики: восстановление и Рисорджименто"
italianrepublic.18.d: "Хотя связь с Австрией дорого обошлась национальной гордости, она постепенно улучшила экономическое положение Республики, которая черпала силы из германской Миттельевропы и австрийских инвестиций. Однако по мере восстановления Италии после разрушений гражданской войны всё больше жителей Республики начинали сожалеть о соглашении правительства с Габсбургами, а поддержка антиавстрийской Associazione Nazionalista Italiana - Итальянской националистической ассоциации Энрико Коррадини - росла в Ломбардии и Фриули.\n\nЛевоцентристская коалиция Иваноэ Бономи правит страной с 1927 года, однако её популярность в основном держится на экономической стабильности. Если она исчезнет, другие партии, такие как Partito Liberale Italiano или Unione Politica Popolare, могут набрать достаточно поддержки для формирования правительства. Если же ситуация окончательно выйдет из-под контроля и силы, ориентированные на Федерацию, силой восстановят порядок на севере, к власти может прийти даже старый Совет Итальянской Федерации, недавно переименовавшийся в Signoria Federale. Однако все партии объединяет одно - стремление к свободной и единой Италии, и многие уверены, что грядёт второе Рисорджименто."
italianrepublic.18.a: "Viva l'Italia!"

italianrepublic.2.t: "Чёрный понедельник обрушивается на Республику"
italianrepublic.2.d: "Экономический кризис, начавшийся в Германии, вышел из-под контроля и перекинулся на Италию. Процветание Итальянской Республики было разбито Чёрным понедельником, а доверие к правительству серьёзно пошатнулось."
italianrepublic.2.a: "Да защитит нас Господь!"

italianrepublic.3.t: "Иваноэ Бономи объявляет всеобщие выборы"
italianrepublic.3.d: "После того как Чёрный понедельник обрушился на Итальянскую Республику, премьер-министр Иваноэ Бономи решил объявить досрочные всеобщие выборы. Они пройдут в 1936 году вместо ранее запланированного 1937-го. Есть надежда, что благодаря выборам премьер-министр сможет укрепить поддержку своей политики по преодолению экономического кризиса."
italianrepublic.3.a: "Будем надеяться..."

italianrepublic.4.t: "Речь Коррадини"
italianrepublic.4.d: "Сегодня Энрико Коррадини из Associazione Nazionalista Italiana выступил с речью в Вероне. В своём выступлении он обвинил правительство Республики в возникновении экономического кризиса. Более того, Коррадини заявил, что именно Австрия продолжает держать Италию раздробленной и слабой, а синдикалистам позволено существовать лишь в качестве противовеса Республике. По его словам, только ANI способна вернуть Италии былую славу и уничтожить всех её врагов."
italianrepublic.4.a: "За ним стоит присматривать."

italianrepublic.5.t: "Церковь высказывается о кризисе"
italianrepublic.5.d: "Ряд влиятельных церковных деятелей начал открыто склонять прихожан к поддержке определённых политиков во время проповедей. Особого внимания заслуживают архиепископ Милана и патриарх Венеции, призвавшие верующих придерживаться традиционных католических ценностей в нынешний кризис, что стало едва прикрытой поддержкой консервативной Unione Politica Popolare. Некоторые епископы, пусть и менее влиятельные, чем их коллеги из Милана и Венеции, напротив, призвали поддерживать католическое социальное учение и правящую Реформистскую социалистическую партию. В обоих случаях народ прислушивается к советам Церкви."
italianrepublic.5.a: "Будем надеяться, что Церковь права."

italianrepublic.6.t: "Оливетти поддерживает Бономи"
italianrepublic.6.d: "Адриано Оливетти, лидер Movimento Comunità - либерально-социалистической партии, состоящей в коалиции с Иваноэ Бономи, выступил в Милане с речью в поддержку премьер-министра. Это оказало весьма ценную помощь осаждённой со всех сторон правящей партии."
italianrepublic.6.a: "Спасибо, Оливетти."

italianrepublic.7.t: "Протесты против аукционов фермерского имущества"
italianrepublic.7.d: "Нынешний экономический кризис привёл к тому, что множество фермеров перестали справляться с выплатами по займам и ипотекам, после чего местные власти обычно выставляют их скот и имущество на аукцион тому, кто предложит наибольшую цену. Эта практика крайне непопулярна среди итальянских фермеров, однако её сторонники утверждают, что долги необходимо возвращать, а аукционы являются неизбежным злом свободной рыночной экономики. Вчера Итальянская народная партия внесла законопроект о полном запрете таких аукционов. Какую позицию займёт правительство?"
italianrepublic.7.a: "Пусть аукционы продолжаются."
italianrepublic.7.b: "Принять закон и запретить аукционы."

italianrepublic.8.t: "Влияние на итальянское правительство"
italianrepublic.8.d: "В 1919 году мы подписали перемирие с Королевством Италия, позволившее нам разместить гарнизоны в Ломбардии и Венеции до заключения мирного договора. Итальянцы остались крайне недовольны поражением и подняли революцию против своего савойского монарха. Вскоре он и его сын отреклись, в Италии возник вакуум власти, а социалистические мятежники, казалось, были готовы захватить всю страну. Мы предложили отчаявшимся итальянцам помощь наших армий в остановке социалистического наступления в обмен на вступление в новую Итальянскую Федерацию - законное государство, с которым мы могли бы иметь дело. Савойцы, Белые республиканцы и силы юга согласились на наши условия, после чего наши армии вытеснили социалистов из Ломбардии. Республиканцам мы уступили лишь в том, что именно республиканский лидер станет временным главой Федерации, тогда как Федеральный совет сохранит часть реальной власти за кулисами. Однако когда в 1926 году социалисты начали готовить нападение на южные государства Федерации, мы были поглощены Иллирийским кризисом и не могли пообещать вмешаться на их стороне. Возмущённые Сардиния, Бурбоны в Неаполе и даже сам Святой Отец покинули нашу Федерацию, оставив нам лишь Милан. К несчастью, в 1930 году срок полномочий находившегося там Федерального совета истёк, и с тех пор он так и не был восстановлен. Хуже того, недавно из-за кризиса Чёрного понедельника мы вывели из страны свои войска, сделав её куда более независимой, чем прежде.\n\nТеперь нынешнее либеральное правительство Иваноэ Бономи перенесло выборы на более ранний срок, рассчитывая укрепить поддержку в законодательном органе. Однако его победа далеко не гарантирована, и у нас остаются возможности повлиять на исход голосования. Реальные шансы на победу имеют три умеренные партии: находящиеся у власти Реформистские социалисты, Народный союз - консервативная партия, ранее пользовавшаяся нашей поддержкой, и Итальянские либералы, враждебные монархии, но столь же решительно настроенные против ANI и социалистов. Мы можем оказать поддержку одной из проавстрийских политических сил и обеспечить приход к власти в Милане подходящей партии. Однако некоторые министры опасаются, что слишком открытое вмешательство лишь усилит крайне правую и антиавстрийскую Итальянскую националистическую ассоциацию."
italianrepublic.8.a: "Поддержать Реформистских социалистов."
italianrepublic.8.b: "Поддержать Народный союз."
italianrepublic.8.e: "Открытое вмешательство лишь усилит ANI."

italianrepublic.9.t: "Австрия поддерживает Реформистских социалистов"
italianrepublic.9.d: "Австрийцы оказали поддержку правящим Реформистским социалистам, пытаясь помочь им победить на выборах. Хотя это действительно принесло ожидаемый результат и усилило поддержку правящей партии, одновременно гораздо больше внимания привлекла крайне правая и антиавстрийская ANI."
italianrepublic.9.a: "Будем надеяться, это поможет нам удержать власть."

italianrepublic.10.t: "Австрия поддерживает Unione Politica Popolare"
italianrepublic.10.d: "Австрийцы оказали поддержку Unione Politica Popolare, пытаясь помочь ей победить на выборах. Хотя это действительно принесло ожидаемый результат и усилило поддержку пополяров, одновременно гораздо больше внимания привлекла крайне правая и антиавстрийская ANI."
italianrepublic.10.a: "Похоже, даже наши союзники хотят смены власти."

italianrepublic.12.t: "Всеобщие выборы"
italianrepublic.12.d: "Сегодня итальянский народ выбирает новый парламент. Борьба идёт чрезвычайно напряжённо, и её исход, скорее всего, определит путь Италии на ближайшие годы. Возможны четыре основных результата. Коалиция Реформистских социалистов премьер-министра Бономи может сохранить власть, либо победу одержит либеральная коалиция во главе с антиавтократической правоцентристской Partito Liberale Italiano. Кроме того, успеха может добиться консервативная коалиция под руководством Unione Politica Popolare, однако мало кто может позволить себе забыть о неожиданно популярной Associazione Nazionalista Italiana. Кого выберет итальянский народ?"
italianrepublic.12.a: "Partito Socialista Riformista Italiano."
italianrepublic.12.b: "Partito Liberale Italiano."
italianrepublic.12.c: "Unione Politica Popolare."
italianrepublic.12.e: "Associazione Nazionalista Italiana."

italianrepublic.13.t: "Итальянцы желают заключить союз"
italianrepublic.13.d: "Итальянцы официально запросили вступление в наш союз. Многие в Вене предлагают принять их, хотя звучат и голоса против."
italianrepublic.13.a: "Пусть итальянцы вступают."
italianrepublic.13.b: "Они нам не нужны."

italianrepublic.14.t: "Австро-итальянская дружба"
italianrepublic.14.d: "Австрийцы позволили нам вступить в свой союз. Некоторых может раздражать формальное нахождение в австрийской сфере влияния, однако это даёт Италии безопасность и защиту от угрозы безбожного синдикализма."
italianrepublic.14.a: "За вечную дружбу!"

italianrepublic.15.t: "Австрийцы не подтверждают дружбу"
italianrepublic.15.d: "Австрийцы отказались принять нас в свой союз. ANI не стала терять времени и немедленно выступила с заявлением, осуждающим попытку «официально закрепить наше рабство перед австрийскими варварами»."
italianrepublic.15.a: "Этого следовало ожидать."

italianrepublic.16.t: "Съезд руководства Movimento Comunità"
italianrepublic.16.d.lib_dem_in_power: "Сегодня начинается съезд руководства Movimento Comunità. Хотя премьер-министр Адриано Оливетти пользуется доверием подавляющего большинства партии, некоторые задаются вопросом, не следует ли ему уйти в отставку и передать руководство Ферруччо Парри. Как проголосует партия?"
italianrepublic.16.d.lib_dem_not_in_power: "Сегодня начинается съезд руководства Movimento Comunità. Хотя лидер партии Адриано Оливетти пользуется доверием подавляющего большинства её членов, некоторые задаются вопросом, не следует ли ему уйти в отставку и передать руководство Ферруччо Парри. Как проголосует партия?"
italianrepublic.16.a: "Адриано Оливетти!"
italianrepublic.16.b: "Ферруччо Парри!"

italianrepublic.17.t: "Съезд руководства Partito Liberale Italiano"
italianrepublic.17.d.italy_republicans_in_power: "Сегодня начинается съезд руководства Partito Liberale Italiano. Хотя премьер-министр Луиджи Эйнауди пользуется доверием подавляющего большинства партии, некоторые задаются вопросом, не следует ли ему уйти в отставку и передать руководство Марчелло Солери. Как проголосует партия?"
italianrepublic.17.d.italy_republicans_not_in_power: "Сегодня начинается съезд руководства Partito Liberale Italiano. Хотя лидер партии Луиджи Эйнауди пользуется доверием подавляющего большинства её членов, некоторые задаются вопросом, не следует ли ему уйти в отставку и передать руководство Марчелло Солери. Как проголосует партия?"
italianrepublic.17.a: "Луиджи Эйнауди!"
italianrepublic.17.b: "Марчелло Солери!"

italianrepublic.19.t: "Выборы [GetYear] года"
italianrepublic.19.d: "Наступили выборы [GetYear] года. Останется ли премьер-министр [From.GetLeader] во главе Итальянской Республики или победу одержит новая партия?"
italianrepublic.19.a: "Partito Socialista Riformista Italiano."
italianrepublic.19.b: "Movimento Comunità."
italianrepublic.19.c: "Partito Liberale Italiano."
italianrepublic.19.e: "Unione Politica Popolare."
italianrepublic.19.f: "Partito Economico."

italianrepublic.20.t: "ANI проводит митинг"
italianrepublic.20.d: "Хотя наше федеративное правительство заручилось значительной народной поддержкой, ANI продолжает поощрять незаконное насилие и политические действия против властей. Теперь националисты вновь появились в Удине, где Энрико Коррадини в очередной раз призвал изгнать нас из «его великой нации». Местная полиция отказалась арестовывать Коррадини, и теперь некоторые члены правительства требуют вмешательства армии."
italianrepublic.20.a: "Отправить армию."
italianrepublic.20.b: "Со временем его поддержка угаснет."

italianrepublic.21.t: "Либеральные социалисты отказываются участвовать"
italianrepublic.21.d: "Выступая в Венеции, Адриано Оливетти и другие лидеры Movimento Comunità осудили либеральные партии за согласие на сделку, восстановившую фиктивную Федерацию, и объявили бойкот выборам, назвав их «фарсом» и «пятном на истинном федерализме»."
italianrepublic.21.a: "Предатели!"

italianrepublic.23.t: "Что делать с синдикалистской экономикой?"
italianrepublic.23.d: "Теперь, когда мы взяли под контроль территорию Социалистической Республики Италия, перед парламентом встал вопрос о судьбе синдикалистских фабрик и хозяйств. Левые предлагают в основном не трогать коллективизированные предприятия и фермы, позволив новым компаниям развиваться как частным. Правые парламентарии уже осудили эту идею как «потворство синдикализму» и требуют провести деколлективизацию и приватизацию. Центристы считают, что экономику следует десиндикализировать, но постепенно, чтобы не вызвать гнев синдикалистов."
italianrepublic.23.a: "Оставить всё как есть."
italianrepublic.23.b: "Постепенно десиндикализировать экономику."
italianrepublic.23.c: "Немедленно десиндикализировать экономику."

italianrepublic.24.t: "Интеграция генералов"
italianrepublic.24.d: "Сегодня несколько генералов, ранее сражавшихся за Королевство Обеих Сицилий, попросили разрешения служить [Root.GetName]. Некоторые считают, что им нельзя доверять защиту Италии, ведь совсем недавно они воевали против нас. Другие же уверены, что возможность сражаться за общую страну станет прекрасным символом национального единства."
italianrepublic.24.a: "Пусть сражаются за Италию!"
italianrepublic.24.b: "Нам не нужны люди, воевавшие против нас."

italianrepublic.25.t: "Интеграция генералов"
italianrepublic.25.d: "Сегодня несколько генералов, ранее сражавшихся за Сардинию, попросили разрешения служить [Root.GetName]. Некоторые считают, что им нельзя доверять защиту Италии, ведь совсем недавно они воевали против нас. Другие же уверены, что возможность сражаться за общую страну станет прекрасным символом национального единства."
italianrepublic.25.a: "Пусть сражаются за Италию!"
italianrepublic.25.b: "Нам не нужны люди, воевавшие против нас."


italianrepublic.28.t: "Королевская академия Италии"
italianrepublic.28.d: "Сегодня королевским указом была основана Reale Accademia d'Italia - Королевская академия Италии, созданная по образцу Французской академии. Шестьдесят итальянцев были избраны в её состав за выдающиеся достижения в науке, литературе и искусстве. Члены Академии получают право на проезд первым классом по национальным железным дорогам, обращение «Ваше Превосходительство» и ежемесячное содержание в размере 3 000 лир. Одной из заявленных целей учреждения является поддержка и развитие науки, литературы и искусства, другой - укрепление принятия новой монархии итальянским народом. Пусть и медленно, но Академия добивается успеха в обоих направлениях."
italianrepublic.28.a: "Благородное начинание."

italianrepublic.29.t: "Accademia Nazionale di Arte Drammatica"
italianrepublic.29.d: "Сегодня в Риме была основана Accademia Nazionale di Arte Drammatica - Национальная академия драматического искусства, призванная стать центром исполнительских искусств в [Root.GetName], теперь когда Рим вновь является нашей столицей. Академия будет заниматься подготовкой людей, желающих посвятить себя искусству."
italianrepublic.29.a: "Поддержим культуру."

italianrepublic.30.t: "Вмешаться в Италию?"
italianrepublic.30.d: "Становится всё очевиднее, что ANI неспособна взять ситуацию в Италии под контроль, хотя и Венецианское восстание пока не может добиться решающего преимущества. Если мы собираемся вмешиваться, то сейчас для этого самое подходящее время. Однако нашей целью должно быть восстановление власти Итальянской Федерации под руководством Габсбурга, а не возрождение провалившейся Итальянской Республики. Разумеется, для этого потребуется согласие венецианцев, но едва ли они откажутся от нашей помощи?"
italianrepublic.30.a: "Предложить венецианцам помощь."
italianrepublic.30.b: "Пусть разбираются сами."

italianrepublic.31.t: "Помощь от австрийцев?"
italianrepublic.31.d: "[AUS.GetNameDefCap] предложила помочь нам в борьбе против [ITA.GetNameDef]. Если австрийцы вмешаются и добьются успеха, после войны нам придётся подчиниться их влиянию. Они намерены покончить с Итальянской Республикой и вместо неё восстановить старую Итальянскую Федерацию... несомненно, под властью представителя Габсбургов, например великого герцога Тосканского. Однако нам гарантировали, что наша автономия будет восстановлена в том объёме, которым мы обладали до выборов."
italianrepublic.31.a: "Неважно - нам нужна помощь."
italianrepublic.31.b: "Нет, мы справимся сами."

italianrepublic.32.t: "Венецианцы отказываются"
italianrepublic.32.d: "По всей видимости, опасаясь нашего будущего вмешательства, венецианцы отказались от помощи и намерены самостоятельно вести гражданскую войну. Нам остаётся лишь наблюдать за развитием событий со стороны."
italianrepublic.32.a: "Пусть будет так!"

italianrepublic.33.t: "Время пришло"
italianrepublic.33.d.austriawar: "Очевидно, что [ITA.GetNameDef] потеряла контроль над положением в стране и не может добиться преимущества над венецианскими мятежниками. Это уже втянуло [AUS.GetNameDef] в войну на стороне венецианцев и ставит перед нашим правительством вопрос: не следует ли и нам нанести удар? Это будет означать гонку с австрийцами за то, кто первым возьмёт Милан, и создаст риск прямого столкновения с австрийскими частями на поле боя... а такая ситуация при недостаточной осторожности может быстро выйти из-под контроля."
italianrepublic.33.d.austriarefuse: "Очевидно, что [ITA.GetNameDef] потеряла контроль над положением в стране и не может добиться преимущества над венецианскими мятежниками. Хорошей новостью для нас является то, что австрийцы отказались вмешиваться, а значит, перед нами, возможно, открывается возможность для нападения. Не пора ли нанести удар, пока наши враги ослаблены?"
italianrepublic.33.d.noaustria: "Очевидно, что [ITA.GetNameDef] потеряла контроль над положением в стране и не может добиться преимущества над венецианскими мятежниками. Ещё лучше то, что на этот раз Белых некому защищать. Они воюют между собой и крайне уязвимы. Не настало ли время нанести удар?"
italianrepublic.33.a: "Это наш шанс!"
italianrepublic.33.b: "Мы не можем рисковать."

italianrepublic.34.t: "Социалистическая Республика атакует"
italianrepublic.34.d.haswar: "[SRI.GetNameDefCap] ответила на наше вмешательство в итальянскую войну, начав наступление на [ITA.GetNameDef]. Теперь начинается гонка за то, кто первым захватит Милан! Остаётся надеяться, что ситуация не выйдет из-под контроля."
italianrepublic.34.d.nowar: "[SRI.GetNameDefCap] ответила на наш отказ вмешаться на стороне венецианских мятежников, начав наступление на [ITA.GetNameDef]. Возможно, нам ещё придётся пожалеть о своём решении, хотя перспектива столкнуться с социалистами непосредственно на поле боя тоже не вызывает радости."
italianrepublic.34.a: "Будем внимательно следить за происходящим..."

italianrepublic.35.t: "Социалистическая Республика Италия пала"
italianrepublic.35.d: "[SRI.GetNameDefCap] пала под ударами войск [ITA.GetNameDef], и теперь нам следует спросить себя, действительно ли дальнейшее продвижение в Италию стоит затраченных усилий. Итальянцы могут стать хорошими союзниками, однако втягивание в новую войну и дополнительные потери лишь ослабят нас к тому моменту, когда придётся сражаться с немцами. Следует ли запросить мир у [ITA.GetNameDef] или продолжить войну?"
italianrepublic.35.a: "Запросить мир."
italianrepublic.35.b: "Мы всё ещё можем победить!"

italianrepublic.36.t: "[From.GetNameDefCap] просит мира"
italianrepublic.36.d: "Наша победа над [SRI.GetNameDef] наконец вызвала реакцию со стороны [From.GetNameDef]. Они не желают ещё глубже втягиваться в войну в Северной Италии и предлагают бросить социалистическую республику на произвол судьбы, если мы немедленно прекратим конфликт с ними. Если мы откажемся, другого подобного шанса может уже не представиться."
italianrepublic.36.a: "Покончим с этим сейчас."
italianrepublic.36.b: "Нет - мы победим их всех!"

italianrepublic.37.t: "[From.GetNameDefCap] отказывается от мира"
italianrepublic.37.d: "Наши попытки заключить мир с [From.GetNameDef] были отвергнуты. Они намерены сражаться с нами до самого конца."
italianrepublic.37.a: "Пусть будет так!"

italianrepublic.38.t: "Оккупация региона [759.GetName]"
italianrepublic.38.d: "После аннексии [ITA.GetNameDef] государством [SRI.GetNameDef] регион [759.GetName] оказался отрезан от остальных территорий, а местные жители обратились к [Root.GetNameDef] с просьбой вмешаться и спасти их от социалистической власти."
italianrepublic.38.a: "Разумная идея."

italianrepublic.39.t: "Оккупация региона [759.GetName]"
italianrepublic.39.d: "После аннексии [ITA.GetNameDef] государством [SRI.GetNameDef] регион [759.GetName] оказался отрезан от наших сил, а местные жители, по всей видимости, обратились к [From.GetNameDef] с просьбой вмешаться и спасти их от нашей власти. В настоящий момент мы буквально ничего не можем с этим сделать."
italianrepublic.39.a: "Со временем мы разберёмся с ними."

italianrepublic.40.t: "Итальянское правительство свергнуто"
italianrepublic.40.d: "Население всё больше уставало от затянувшейся войны против венецианцев, и в итоге собравшаяся толпа вынудила правительство бежать. Временное военное правительство подписало мирное соглашение с [VNC.GetNameDef] и согласилось на аннексию. Что произойдёт дальше, теперь полностью зависит от них."
italianrepublic.40.a: "Вот и всё."

italianrepublic.41.t: "Итальянское правительство свергнуто"
italianrepublic.41.d: "Не сумев добиться быстрой победы над венецианским правительством, правительство ANI в Легионерской Италии было свергнуто собравшейся толпой и вынуждено бежать. Пришедшее ему на смену военное правительство подписало мирное соглашение с [Root.GetNameDef] и согласилось на нашу аннексию. Теперь всё полностью зависит от нас."
italianrepublic.41.a: "Прекрасно!"

italianrepublic.42.t: "Победа Венеции!"
italianrepublic.42.d.noaustria: "Мы контролируем всю Ломбардию, а сопротивление ANI практически полностью подавлено. Теперь необходимо решить, что ждёт страну дальше. Широкой поддержкой пользуется идея полного восстановления старой Итальянской Федерации, в которой государства-члены обладали бы широкой автономией, а все территории, кроме самой Венеции, вновь перешли бы под власть монархии и подчинялись Signoria Federale. Глава этого совета получит значительную власть, а основными кандидатами являются габсбургский великий герцог Тосканский, миланский герцог Висконти ди Модроне и сам предводитель венецианского восстания Джузеппе Вольпи. Однако некоторые считают, что Венеции следует сохранить независимость и вовсе не вступать ни в какую федерацию."
italianrepublic.42.d.austria: "Мы контролируем всю Ломбардию, а сопротивление ANI практически полностью подавлено. Теперь настало время выполнить соглашение с австрийцами и полностью восстановить старую Итальянскую Федерацию. Её государства-члены получат широкую автономию, а все территории, кроме самой Венеции, вновь перейдут под власть монархии и будут подчиняться Signoria Federale. Некоторые считают, что нам следует сохранить независимость, однако по справедливости мы должны поблагодарить австрийцев за то, что они вновь пришли нам на помощь и защитили нас. Без них мы, скорее всего, вообще не добились бы победы."
italianrepublic.42.a: "Восстановить Федерацию под властью великого герцога Тосканского."
italianrepublic.42.b: "Восстановить Федерацию под властью герцога Висконти ди Модроне."
italianrepublic.42.c: "Восстановить Федерацию под властью Джузеппе Вольпи."
italianrepublic.42.e: "Мы сохраним независимость как [Root.GetNameDef]."

italianrepublic.43.t: "Итальянская Федерация восстановлена"
italianrepublic.43.d.habsburg: "Старая Итальянская Федерация была восстановлена, республика отброшена в сторону, а её место заняли автономные государства под властью аристократии и руководством Signoria Federale... во главе с габсбургским великим герцогом Пьетро Тосканским. Великий герцог связался с нами и приветствовал установление дружественных отношений между Федерацией и [Root.GetNameDef]. Это действительно лучший исход, на который мы могли надеяться."
italianrepublic.43.d.visconti: "Старая Итальянская Федерация была восстановлена, республика отброшена в сторону, а её место заняли автономные государства под властью аристократии и руководством Signoria Federale... хотя во главе Федерации вместо габсбургского великого герцога был поставлен миланский герцог Висконти ди Модроне. Тем не менее хорошим знаком можно считать то, что герцог связался с [Root.GetNameDef] и предложил сохранить добрые отношения между нашими странами."
italianrepublic.43.d.volpi: "Старая Итальянская Федерация была восстановлена, республика отброшена в сторону, а её место заняли автономные государства под властью аристократии и руководством Signoria Federale... хотя во главе Федерации вместо габсбургского великого герцога был поставлен президент Венеции Джузеппе Вольпи. Тем не менее хорошим знаком можно считать то, что Вольпи связался с [Root.GetNameDef] и предложил сохранить добрые отношения между нашими странами."
italianrepublic.43.a: "Приветствуем их в нашем союзе."
italianrepublic.43.b: "Пока что восстановим гарантии их независимости."
italianrepublic.43.c: "Будем рады дальнейшему сотрудничеству."

italianrepublic.44.t: "Ломбардия пала"
italianrepublic.44.d.austria: "Несмотря на вмешательство Австрии, этого оказалось недостаточно, чтобы не дать [SRI.GetNameDef] захватить Ломбардию. Теперь [Root.GetNameDef] осталась в одиночестве и способна защититься от социалистических орд ещё хуже, чем прежде."
italianrepublic.44.d.noaustria: "Похоже, наша гражданская война предоставила [SRI.GetNameDef] именно ту слабость, которой они ждали. Они захватили Ломбардию, и теперь мы остались в одиночестве, способные защититься от социалистических орд ещё хуже, чем прежде."
italianrepublic.44.a: "Обратиться к австрийцам за защитой."
italianrepublic.44.b: "Разберёмся сами."

italianrepublic.45.t: "Венеция просит защиты"
italianrepublic.45.d.austria: "Нашего вмешательства оказалось недостаточно, чтобы не дать [SRI.GetNameDef] захватить Ломбардию. Теперь [Root.GetNameDef] осталась в одиночестве и способна защититься от социалистических орд ещё хуже, чем прежде. Венецианцы попросили нашей защиты... однако её предоставление может втянуть нас в войну против Третьего Интернационала."
italianrepublic.45.d.noaustria: "Похоже, гражданская война в Италии предоставила [SRI.GetNameDef] именно ту слабость, которой они ждали. Они захватили Ломбардию, и теперь [VNC.GetNameDef] осталась беззащитной. Венецианцы попросили нашей защиты... однако её предоставление может втянуть нас в войну против Третьего Интернационала."
italianrepublic.45.a: "Разумеется, мы защитим их всеми доступными средствами."
italianrepublic.45.b: "Пусть разбираются сами."

italianrepublic.46.t: "Австрия предлагает защиту"
italianrepublic.46.d: "К счастью, австрийцы признали нашу ценность и предложили защиту. Если социалисты попытаются напасть на нас, их будет ждать куда более серьёзная война, чем они рассчитывали."
italianrepublic.46.a: "Какое облегчение."

italianrepublic.47.t: "Австрия отказывается от защиты"
italianrepublic.47.d: "Австрия отказалась предоставить нам защиту, по крайней мере пока. Мы остались одни."
italianrepublic.47.a: "Пусть будет так."

italianrepublic.50.t: "Битва за лиру"
italianrepublic.50.d: "Первой из четырёх экономических «битв», призванных исправить положение в стране, станет Битва за лиру, целью которой будет стабилизация валюты Республики. Как и всякая битва, она потребует усилий, однако устойчивость нашей валюты позволит Италии исполнить свою судьбу."
italianrepublic.50.a: "Viva l'Italia!"

italianrepublic.51.t: "Битва за землю"
italianrepublic.51.d: "Вторая экономическая битва - Битва за землю - преобразит саму итальянскую землю. Болота и топи будут осушены, сельскохозяйственные угодья получат ирригацию, а население будут поощрять переселяться в сельскую местность, чтобы итальянское земледелие процветало."
italianrepublic.51.a: "Viva l'Italia!"

italianrepublic.52.t: "Битва за зерно"
italianrepublic.52.d: "После успеха Битвы за землю начинается Битва за зерно. Новые сельскохозяйственные угодья должны будут обеспечить продовольствием растущее население Италии и её армии. В конце концов, армия марширует на желудке, а итальянской армии ещё предстоит маршировать на войну."
italianrepublic.52.a: "Viva l'Italia!"

italianrepublic.53.t: "Битва за рождаемость"
italianrepublic.53.d: "Последней из экономических битв станет Битва за рождаемость. Эта программа призвана помочь семейным парам заводить больше детей. Она включает оплачиваемые отпуска по материнству и отцовству, налоговые льготы и займы для семей с детьми, одновременно правительство будет принимать на работу только женатых мужчин и замужних женщин. Благодаря такой политике будущие поколения Италии будут созданы и защищены."
italianrepublic.53.a: "Viva l'Italia!"

italianrepublic.54.t: "Унитарная Республика"
italianrepublic.54.d: "В столице стремительно приняты законы, отменяющие права и автономию Ломбардии и Венеции, как, впрочем, и любого другого региона Республики. Официальная линия ANI гласит, что всё это делается «во благо страны», и тем же объясняется приостановка будущих выборов. Италия не может позволить себе слабеть из-за корыстных интересов и внешних привязанностей - ни сейчас, ни, возможно, когда-либо. Однако в Венеции эти новости были встречены крайне враждебно: местные законодатели пришли в ярость, считая происходящее захватом власти центральным правительством. Люди уже выходят на улицы, и в ближайшие дни можно ожидать более официальных действий."
italianrepublic.54.a: "Будем надеяться, этим всё и ограничится."

italianrepublic.55.t: "Беспорядки в Венеции"
italianrepublic.55.d: "Сопротивление унитарной республике растёт по всей Италии, но особенно сильно оно сосредоточено в Венеции. Там лидер Partito Republicano Veneto Джузеппе Вольпи выступает с пламенными речами, осуждая ANI и призывая «верных венецианцев» подняться на борьбу с её тиранией. По всему городу вспыхнули беспорядки, а насилие прежде всего направлено против учреждений центрального правительства и правительственных войск. Чиновники опасаются, что до голосования регионального законодательного собрания о выходе из Республики остаются считанные дни."
italianrepublic.55.a: "Пусть кричат, дальше слов дело не зайдёт!"
italianrepublic.55.b: "Мы не можем рисковать! Оккупировать Венецию!"

italianrepublic.56.t: "Венецианское восстание"
italianrepublic.56.d: "Как и ожидалось, голосование в Венеции, где контролирующая парламент Partito Republicano Veneto единогласно выступила за отделение, привело к официальному заявлению о сопротивлении унитарной республике. До тех пор, пока права регионов не будут восстановлены, Республика Венеция будет считать себя отделившейся от [ITA.GetNameDef]. В последнюю минуту ещё ведутся переговоры, однако правительственным войскам уже приказано покинуть Венецию, а местное ополчение спешно мобилизуется - скорее всего, при поддержке и содействии австрийцев."
italianrepublic.56.a: "Мы не можем это позволить!"
italianrepublic.56.b: "Сражаться за Ла Серениссиму! (Играть за Венецию)"

italianrepublic.57.t: "Венецианское восстание"
italianrepublic.57.d: "Похоже, эксперимент Итальянской Республики действительно завершён. После победы ANI на выборах партия попыталась превратить страну в унитарную республику, лишив входящие в неё регионы прежних прав, и теперь Венеция подняла восстание. Венецианцы призвали нас на помощь, однако нам следует выждать хотя бы несколько месяцев, прежде чем вмешиваться напрямую, иначе это будет выглядеть как обычная попытка завоевания. Если мы всё же вмешаемся, многие в австрийском правительстве считают, что нашей единственной целью должно стать восстановление старой Итальянской Федерации, на этот раз под властью Габсбурга. В самом деле, итальянцы настолько устали от провала демократии, что могут встретить такой вариант с распростёртыми объятиями."
italianrepublic.57.a: "За этим необходимо внимательно следить."

italianrepublic.58.t: "Война с Венецией"
italianrepublic.58.d: "Венецианское восстание продолжает разрастаться, а вооружённые ополченцы изгоняют верных и патриотичных итальянцев. Этого нельзя допустить. Мы должны действовать быстро: если в течение нескольких месяцев не покажем, что контролируем ситуацию, то рискуем спровоцировать вмешательство австрийцев или, что ещё хуже, убедить Социалистическую Республику Италия в том, что она может напасть без серьёзного международного осуждения."
italianrepublic.58.a: "Пора поставить этих венецианцев на место."

italianrepublic.59.t: "Итальянская империя"
italianrepublic.59.d: "После победы над австрийцами мы наконец можем провозгласить Итальянскую империю. Италия больше не будет скована иностранными державами - отныне она сама будет вершить свою судьбу!"
italianrepublic.59.a: "Avanti Italia!"

italianrepublic.60.t: "Веронские процессы"
italianrepublic.60.d: "Сегодня в Вероне начался судебный процесс над руководителями Социалистической Республики Италия. Как и следовало ожидать, Муссолини и его приспешники признаны виновными в предательстве Италии и приговорены к смерти. Та же участь ждёт остальных руководителей ложной республики. С синдикализмом покончено."
italianrepublic.60.a: "Смерть Муссолини и его предателям!"

italianrepublic.61.t: "Позволить Карине Масоне Негроне летать?"
italianrepublic.61.d: "Теперь, когда Республика находится в состоянии войны, Карина Масоне Негроне попросила разрешения служить лётчицей в республиканских ВВС. Подобная просьба со стороны женщины крайне необычна, и ряд министров считает, что ей следует отказать. Однако великий государственный деятель Энрико Коррадини, являющийся её личным другом, предлагает компромисс: позволить Негроне возглавить женское авиационное подразделение, выполняющее небоевые задачи. Это высвободит больше мужчин для непосредственного участия в боевых вылетах."
italianrepublic.61.a: "Пусть летает!"
italianrepublic.61.b: "Ей следует остаться дома."
italianrepublic.61.c: "Пусть создаст лётную школу."

italianrepublic.62.t: "Орден Римского орла"
italianrepublic.62.d: "Орден Римского орла был учреждён для награждения людей, заслуживших особые заслуги перед Италией. Он считается высшей наградой, которую человек может получить за службу стране. Новый орден должен вдохновить граждан отдавать Италии все свои силы."
italianrepublic.62.a: "Почтим этих людей."

italianrepublic.63.t: "Корпоративное государство"
italianrepublic.63.d: "Указом самого Дуче был создан Национальный совет корпораций. Он будет организован по корпоративному принципу и разделён на десять различных секторов, каждый из которых представят министры соответствующей отрасли экономики. В официальном указе говорилось: «Национальный совет корпораций является для итальянской экономики тем же, чем Генеральный штаб является для вооружённых сил - мыслящим мозгом, который готовит и координирует»."
italianrepublic.63.a: "Avanti Italia!"

italianrepublic.64.t: "Opera Nazionale Balilla"
italianrepublic.64.d: "Недавно по распоряжению Дуче была создана Opera Nazionale Balilla. Организация получила своё название от прозвища итальянского мальчика, поднявшего восстание против габсбургских войск во время Войны за австрийское наследство. По своей структуре она напоминает детское скаутское движение. Существуют две параллельные структуры - для мальчиков и для девочек, каждая разделённая на три возрастные группы. Организация призвана готовить молодое поколение к будущим ролям в обществе и одновременно воспитывать из него преданных Италии граждан."
italianrepublic.64.a: "Книга и винтовка - совершенный итальянец."

italianrepublic.65.t: "Opera Nazionale Dopolavoro"
italianrepublic.65.d: "По указу Дуче была создана Opera Nazionale Dopolavoro - Национальная организация досуга. OND поддерживает множество видов отдыха и развлечений, призванных развивать туризм и одновременно укреплять верность граждан Итальянскому государству. Организация финансирует итальянскую культуру во всех её проявлениях - от оперы, театра и музыки до книжных клубов и поездок по сельской местности. OND быстро приобрела огромную популярность по всей Республике."
italianrepublic.65.a: "Avanti Italia!"

italianrepublic.66.t: "Создание DCPP"
italianrepublic.66.d: "Чтобы защитить Республику и всех итальянцев от любых угроз, была создана Direzione Centrale della Polizia di Prevenzione - Центральная дирекция превентивной полиции, сокращённо DCPP. Она будет выполнять функции тайной полиции Республики и следить за тем, чтобы каждый, кто осмелится предать Итальянское государство, понёс суровое наказание."
italianrepublic.66.a: "Всё внутри государства, ничего вне государства, ничего против государства."

italianrepublic.67.t: "Зелёный или синий?"
italianrepublic.67.d: "Официальным цветом итальянской футбольной сборной долгое время оставался синий, унаследованный от Королевства Италия. Теперь, когда власть находится в наших руках, мы наконец можем заменить его зелёным, который лучше отражает цвета самой Италии, а не Савойского дома. Однако это наверняка вызовет недовольство среди многочисленных болельщиков, привыкших к синему."
italianrepublic.67.a: "Сохраним старые цвета."
italianrepublic.67.b: "Сменим цвета."

italianrepublic.68.t: "Бригады синерубашечников"
italianrepublic.68.d: "Синерубашечники, созданные ещё до Гражданской войны, официально именуются Sempre Pronti per la Patria e per il Re - «Всегда готовы за Родину и короля», сокращённо SP, однако куда чаще их называют по неофициальному имени из-за характерных синих рубашек. Синерубашечники организованы по военному образцу, вдохновлённому подразделениями ардити, что отражается и в их униформе. Уже долгое время они служили силовой опорой ANI, а теперь, когда страна находится в состоянии войны, выступили на защиту Республики от всех её врагов."
italianrepublic.68.a: "Смерть врагам Италии!"

italianrepublic.69.t: "Венецианские адмиралы присоединяются к восстанию!"
italianrepublic.69.d: "Венецианские адмиралы Альберто да Дзара и Джузеппе Фиораванцо решили присоединиться к восстанию против нашей власти, объявив наше правительство тираническим. К несчастью, им удалось увести с собой значительную часть флота."
italianrepublic.69.a: "Они заплатят за своё предательство!"

italianrepublic.81.t: "Усилить Федерацию в Италии?"
italianrepublic.81.d.early_demands: "Итальянская Республика представляет собой угрозу, признаёт она это или нет. Хотя итальянцы и заявляют о своей принадлежности к Федерации, после захвата Турина они вполне могут предать нас, возомнив себя достаточно сильными. Мы должны потребовать, чтобы они реорганизовали своё правительство и привели его в большее соответствие с той Федерацией, частью которой они себя называют."
italianrepublic.81.d.yes_i_can: "Теперь, когда безбожные синдикалисты из Социалистической Республики Италия уничтожены, возник вопрос о дальнейшей судьбе Итальянской Республики. Угроза со стороны Социалистической Республики Италия всегда удерживала наш союз от распада, а Республика служила оплотом против синдикалистской волны. Теперь эта угроза исчезла, и нам предстоит решить, стоит ли направить ультиматум с требованием преобразовать Республику в Федерацию, что будет куда приемлемее для Вены. Впрочем, мы всегда можем оставить этот вопрос без внимания."
italianrepublic.81.a: "Отправить ультиматум."
italianrepublic.81.b: "Оставить этот вопрос."

italianrepublic.82.t: "Австрийский ультиматум"
italianrepublic.82.d.early_demands: "Австрийцы вновь перешли к активной внешней политике и в рамках нового курса потребовали, чтобы мы преобразовали своё правительство, сделав его более похожим на ту Итальянскую Федерацию, которой мы себя называем. Пока [SRI.GetNameDef] с вожделением наблюдает за нами, мы едва ли можем позволить себе ссориться с нашим покровителем."
italianrepublic.82.d.yes_i_can: "Австрийцы предъявили нам ультиматум. Поскольку [SRI.GetNameDef] больше не существует, мы уже не нужны им как оплот против синдикализма, и теперь они требуют предоставить реальные полномочия Совету Федерации, который долгое время оставался в тени. Мы, разумеется, можем согласиться и короновать Петера Фердинанда как Джузеппе Фердинандо, главу Итальянской Федерации, либо ответить отказом и рискнуть войной."
italianrepublic.82.a: "Мы принимаем."
italianrepublic.82.b: "Мы отказываемся!"

italianrepublic.83.t: "Итальянцы согласились"
italianrepublic.83.d: "Итальянцы приняли наш ультиматум, и вскоре Петер Фердинанд будет коронован как Джузеппе Фердинандо Тосканский и глава Итальянской Федерации."
italianrepublic.83.a: "Боже, храни Италию!"

italianrepublic.84.t: "Итальянцы отказались"
italianrepublic.84.d: "Итальянцы отвергли наш ультиматум. Следует ли нам показать им, насколько глупую ошибку они совершили, или же оставить этот вопрос?"
italianrepublic.84.a: "Значит, будет война!"
italianrepublic.84.b: "Оставить этот вопрос."

italianrepublic.85.t: "Итальянский ирредентизм"
italianrepublic.85.d: "Мы должны определить политику Республики. По-прежнему существуют по праву итальянские земли, на которые претендуют другие державы, прежде всего Австрия. Одни предлагают сосредоточиться исключительно на территориях под властью Австрии, тогда как другие считают, что нам также следует обратить внимание на Мальту."
italianrepublic.85.a: "Заявить права на наши законные земли."
italianrepublic.85.b: "Заявить права на наши законные земли и Мальту."

italianrepublic.86.t: "Великая Италия"
italianrepublic.86.d: "Теперь, когда объединение Италии завершено, мы можем провозгласить Великую Италию. Вокруг нашей Республики всё ещё находится немало земель, по праву принадлежащих итальянцам, и вскоре все они станут нашими."
italianrepublic.86.a: "Avanti Italia."

italianrepublic.87.t: "Новые земли"
italianrepublic.87.d: "Прошло немало времени, но наконец мы освободили наши законные земли. Теперь, когда Республика вернула эти территории, мы можем быть уверены в их преданности Италии."
italianrepublic.87.a: "Avanti Italia."

italianrepublic.88.t: "Новые земли"
italianrepublic.88.d: "Прошло немало времени, но наконец мы освободили наши законные земли. Теперь, когда Республика вернула эти территории, мы можем быть уверены в их преданности Италии."
italianrepublic.88.a: "Avanti Italia."

italianrepublic.89.t: "Anni di Piombo"
italianrepublic.89.d: "Ряд синерубашечников из Associazione Nazionalista Italiana выступил против правительства и объявил войну [ITA.GetNameDef]. Это заявление быстро переросло в кровавые перестрелки в нескольких небольших городах, захваченных ANI, хотя в более крупных городах, таких как Верона и Падуя, нападения ANI были отражены армией и полицией. Журналисты как внутри Федерации, так и за её пределами уже называют эту войну Anni di Piombo, или «Свинцовыми годами». Остаётся надеяться, что она не продлится настолько долго."
italianrepublic.89.a: "Они за это заплатят."

italianrepublic.90.t: "Теракт ANI"
italianrepublic.90.d: "Синерубашечники атаковали фабрику в регионе [attack_state.GetName], причинив огромный ущерб и унеся множество жизней. Карабинеры уже находятся на месте происшествия, и хотя им удалось задержать нескольких террористов, главари всё ещё остаются на свободе. Несомненно, вскоре их найдут и привлекут к ответственности."
italianrepublic.90.a: "Проклятая ANI."

italianrepublic.91.t: "Теракт ANI"
italianrepublic.91.d: "Синерубашечники атаковали военный завод в регионе [attack_state.GetName], причинив огромный ущерб и унеся множество жизней. Карабинеры уже находятся на месте происшествия, и хотя им удалось задержать нескольких террористов, главари всё ещё остаются на свободе. Несомненно, вскоре их найдут и привлекут к ответственности."
italianrepublic.91.a: "Проклятая ANI."

italianrepublic.92.t: "Теракт ANI"
italianrepublic.92.d: "ANI устроила серию взрывов в регионе [attack_state.GetName], серьёзно повредив железные дороги, уничтожив множество поездов и погубив бессчётное число невинных людей."
italianrepublic.92.a: "Проклятая ANI."

italianrepublic.93.t: "ANI атакует карабинеров!"
italianrepublic.93.d: "Ночью ANI атаковала казармы карабинеров в регионе [attack_state.GetName], перебив спавших там военнослужащих. Карабинеры поклялись отомстить и намерены принять дополнительные меры для полного уничтожения террористов, чтобы положить конец этому национальному позору."
italianrepublic.93.a: "Им остаётся только бежать."

italianrepublic.94.t: "Покушение предотвращено"
italianrepublic.94.d.habsburg: "Сегодня отважные карабинеры предотвратили покушение на главу Федерации, великого герцога Джузеппе Фердинандо. Эта новость потрясла правительство, а народ уже требует разыскать членов ANI. Однако представитель ANI заявил, что в следующий раз они не потерпят неудачи и избавят мир от «австрийской шавки»."
italianrepublic.94.d.visconti: "Сегодня отважные карабинеры предотвратили покушение на главу Федерации, герцога Марчелло Висконти ди Модроне. Эта новость потрясла правительство, а народ уже требует разыскать членов ANI. Однако представитель ANI заявил, что в следующий раз они не потерпят неудачи и избавят мир от «лжекороля»."
italianrepublic.94.d.volpi: "Сегодня отважные карабинеры предотвратили покушение на главу Федерации Джузеппе Вольпи. Эта новость потрясла правительство, а народ уже требует разыскать членов ANI. Однако представитель ANI заявил, что в следующий раз они не потерпят неудачи и избавят мир от «венецианского пидора»."
italianrepublic.94.a: "Слава Богу!"

italianrepublic.95.t: "Министр убит"
italianrepublic.95.d: "Сегодня во время выступления в Падуе один из членов ANI застрелил депутата парламента, известного своими открыто монархическими взглядами. Хотя убийцу удалось задержать, руководители ANI всё ещё остаются на свободе."
italianrepublic.95.a: "Проклятая ANI."

italianrepublic.96.t: "ANI наносит удар"
italianrepublic.96.d: "Сегодня синерубашечникам ANI удалось захватить Брешию. Падение города в руки террористов стало крупнейшей победой ANI в войне против режима. Жители Брешии встретили их как освободителей, вывесив итальянские флаги с вырезанным центральным гербом. Синерубашечники патрулируют улицы, а насилие против всех подозреваемых в симпатиях к монархии уже началось."
italianrepublic.96.a: "Мы должны вернуть Брешию!"

italianrepublic.97.t: "Освобождение Брешии"
italianrepublic.97.d: "Наконец нам удалось освободить Брешию от отбросов ANI. Битва была кровопролитной, и сражаться приходилось буквально за каждый квартал, но в итоге мы выбили их из города. Хотя первоначально ANI встречали как освободителей, террор, развязанный синерубашечниками во время чисток монархистов, быстро изменил отношение жителей. Сегодня уже армия встречается как настоящий освободитель города."
italianrepublic.97.a: "Они бегут."

italianrepublic.98.t: "Главари пойманы"
italianrepublic.98.d: "Сегодня утром следователи карабинеров задержали нескольких главарей организации ANI. Это серьёзный удар по националистическим террористам, который ещё на шаг приблизил страну к их окончательному уничтожению."
italianrepublic.98.a: "Это лишь вопрос времени."

italianrepublic.99.t: "Anni di Piombo завершились"
italianrepublic.99.d: "Сегодня мы объявили о победе над террористами ANI. Наконец они уничтожены. Эти крайне правые националисты больше не будут терзать нашу страну."
italianrepublic.99.a: "Наконец с ними покончено."

italianrepublic.102.t: "Создание Mille Miglia"
italianrepublic.102.d: "После воссоединения Италии ряд автомобильных компаний и энтузиастов автоспорта предложили создать соревнование, которое, по их мнению, станет главной автомобильной гонкой страны - Mille Miglia. Mille Miglia, или «Тысяча миль», начинается в Брешии, проходит до самого Рима, а затем по другому маршруту возвращается обратно в Брешию."
italianrepublic.102.a: "Пусть мчатся!"

italianrepublic.103.t: "Палаццо Меццанотте"
italianrepublic.103.d: "Сегодня в Милане был открыт Палаццо Меццанотте. Новое здание должно заменить старую фондовую биржу Республики и выполнено в изысканном сочетании неоклассической и современной архитектуры. Теперь, когда последствия Чёрного понедельника постепенно сходят на нет, Палаццо Меццанотте уже считается главной фондовой биржей Италии."
italianrepublic.103.a: "Деньги - это хорошо."

italianrepublic.104.t: "Леньяно"
italianrepublic.104.d: "Сегодня по всей Республике состоялась премьера исторического эпоса «Леньяно», встретившего широкое признание публики. Фильм рассказывает о попытке императора Священной Римской империи Фридриха Барбароссы подчинить Италию, что приводит к созданию Ломбардской лиги и битве при Леньяно. Режиссёром выступил Ромоло Марчеллини, главные роли исполнили Фоско Джакетти, Луиза Ферида и Освальдо Валенти, а финансирование предоставила ANI. Из-за очевидных параллелей с Австрийской империей фильм вызвал критику со стороны австрийцев, хотя итальянская публика, похоже, осталась довольна."
italianrepublic.104.a: "Сегодня мы изгоним Чёрного орла из Ломбардии!"

italianrepublic.105.t: "Землетрясение в Кансильо 1936 года"
italianrepublic.105.d: "В предрассветные часы районы Северо-Восточной Италии в районе Кансильо потрясло сильнейшее землетрясение. Трагически погибли 19 человек, ещё бесчисленное множество получили ранения. Многие небольшие города региона были разрушены или серьёзно повреждены."
italianrepublic.105.a: "Да хранит их Господь."

italianrepublic.106.t: "Годовщина Золотой Амброзианской республики"
italianrepublic.106.d: "Пятьсот лет назад жители Милана изгнали Висконти и провозгласили в городе республику. Хотя впоследствии город был предан и вновь оказался под властью монархии, идеалы той Республики до сих пор находят отклик среди жителей Милана и его окрестностей. В самом городе проходят масштабные торжества и недельный фестиваль в честь пятисотлетия той попытки установить республиканское правление."
italianrepublic.106.a: "Да здравствует Республика!"

italianrepublic.107.t: "Миланская неделя моды"
italianrepublic.107.d: "На фоне крепкой экономики несколько миланских модельеров решили организовать весной недельное мероприятие, чтобы Милан, а вместе с ним и вся Италия, смог стать мировой столицей моды. Уже сейчас различные модные дома работают над тем, чтобы Милан занял почётное место среди главных культурных и модных столиц мира."
italianrepublic.107.a: "Милан станет мировой столицей моды!"

italianrepublic.108.t: "Карина Массон Негроне устанавливает новый рекорд"
italianrepublic.108.d: "Знаменитая итальянская авиатриса Карина Массон Негроне установила новый авиационный рекорд, поднявшись на своём биплане на высоту 12 043 метра (39 402 фута). Будучи личной подругой самого Энрико Коррадини, благодаря новому достижению она приобрела большую популярность в Республике, особенно среди националистических кругов."
italianrepublic.108.a: "Новый рекорд для Италии."

italianrepublic.109.t: "Одиночный перелёт Габриэллы Анджелини"
italianrepublic.109.d: "Габриэлла «Габи» Анджелини только что завершила свой одиночный перелёт из Дели. Уже прославившаяся путешествием через восемь различных стран, молодая авиатриса стала одной из самых популярных фигур в Италии. В свои 25 лет она покорила сердца жителей как внутри Республики, так и за её пределами. В Corriere della Sera написали: «Эта молодая итальянка показала, что женщины способны быть отважными, не утрачивая при этом ни капли своей поистине изысканной женственности»."
italianrepublic.109.a: "Троекратное ура Габи Анджелини!"

italianrepublic.110.t: "Enciclopedia Italiana"
italianrepublic.110.d: "Проект Enciclopedia Italiana наконец завершён. Enciclopedia Italiana di Scienze, Lettere ed Arti, или сокращённо «Enciclopedia Italiana», представляет собой энциклопедию наук, литературы и искусств в 35 томах. Задуманная как демонстрация интеллектуальной мощи ANI, которая финансировала её создание, она оказалась весьма популярной среди научного и культурного сообщества Республики. Даже противники ANI признают эту работу достижением, которым можно гордиться."
italianrepublic.110.a: "Ценный труд, независимо от намерений его создателей."

italianrepublic.120.t: "Война против Италии"
italianrepublic.120.d: "Мы терпим тяжёлые поражения в войне против [ITA.GetNameDef]. Хотя ещё существует вероятность переломить ситуацию, у нас есть другой вариант: предложить им наши земли в Южном Тироле и Приморье в надежде, что они согласятся и оставят нас в покое. Если же нет... вполне возможно, итальянцы дойдут до самой Вены, и тогда наша Империя будет окончательно потеряна."
italianrepublic.120.a: "Покончим с этим, пока ещё можем."
italianrepublic.120.b: "Сдаться итальянцам? Никогда!"

italianrepublic.121.t: "Австрия предлагает мир"
italianrepublic.121.d: "Австрийцы отступают и явно осознали, что у них нет никаких шансов против итальянских войск. В обмен на мир с [Root.GetNameDef] они предложили передать нам земли, на которые мы претендуем в Трентино и Приморье. Стоит ли принять их предложение и закончить войну?"
italianrepublic.121.a: "Да, покончим с этим, пока можем."
italianrepublic.121.b: "Нет - мы уничтожим их здесь и сейчас."

italianrepublic.122.t: "Венеция потеряна"
italianrepublic.122.d: "Война против [ITA.GetNameDef] определённо пошла не по плану. Мы не сумели помешать противнику захватить Венецию, и теперь необходимо решить, продолжать ли войну или полностью отступить, предоставив Италию собственной судьбе. Разумеется, любой мир может оказаться лишь временным - итальянцы вполне способны впоследствии вновь напасть на нас, но, возможно, передышка всё же того стоит?"
italianrepublic.122.a: "Мы должны немедленно отступить."
italianrepublic.122.b: "Сдаться итальянцам? Никогда!"

italianrepublic.123.t: "Австрия уходит из Венеции"
italianrepublic.123.d: "Несмотря на австрийскую интервенцию, мы взяли Венецию под свой контроль, и теперь австрийцы в спешке выводят оттуда войска. Вот вам и их господство над Италией."
italianrepublic.123.a: "Позже мы придём и за ними."

italianrepublic.124.t: "Австрия побеждает в Италии"
italianrepublic.124.d: "Наши союзники в Италии капитулировали перед Австрией, и теперь мы увязли в южной войне, которая может бессмысленно истощить наши силы. Не стоит ли положить ей конец?"

italianrepublic.125.t: "Сицилийцы побеждают в Италии"
italianrepublic.125.d: "Наши союзники в Италии капитулировали перед [SIC.GetNameDef], и теперь мы увязли в южной войне, которая может бессмысленно истощить наши силы. Не стоит ли положить ей конец?"

italianrepublic.126.t: "Венеция пала"
italianrepublic.126.d: "Венеция пала под натиском сил [SRI.GetNameDef], и теперь они угрожают самой [Root.GetNameDef]. Не стоит ли закончить эту войну, пока у нас ещё есть возможность?"

italianrepublic.127.t: "Австрия в беде"
italianrepublic.127.d: "[From.GetNameDefCap] глубоко продвинулась вглубь Австрии и, судя по всему, намерена завоевать её целиком, а не ограничиться заявленными претензиями. Это явно опасно."
italianrepublic.127.a: "Мы должны помочь Австрии!"
italianrepublic.127.b: "Мы ничего не можем сделать."

italianrepublic.128.t: "Германская интервенция"
italianrepublic.128.d: "Похоже, [From.GetNameDef] встревожилась из-за нашего агрессивного вторжения в [AUS.GetNameDef]. Опасаясь, что мы намерены полностью покорить её, немцы пришли на помощь своим бывшим союзникам по Вельткригу."
italianrepublic.128.a: "Проклятье!"

italianrepublic.150.t: "Уход из Итальянской Республики"
italianrepublic.150.d: "Чёрный понедельник тяжело ударил по [AUS.GetNameDef]... настолько тяжело, что многие наши компании были вынуждены покинуть [ITA.GetNameDef]. Наше экономическое влияние на итальянцев ослабло, а содержание оккупационных войск стало нам не по карману. Хорошо это или плохо, но теперь [ITA.GetNameDef] фактически независима. Нам придётся поддерживать с ними рабочие отношения по меньшей мере до тех пор, пока мы не восстановим собственные силы."
italianrepublic.150.a: "Наша сфера влияния сжимается."

italianrepublic.151.t: "Уход австрийцев"
italianrepublic.151.d: "Чёрный понедельник тяжело ударил по [AUS.GetNameDef]. Их рынки рухнули настолько сильно, что многие австрийские держатели акций австро-итальянских компаний в панике продали бесчисленное количество ценных бумаг местным итальянцам, ослабив австрийскую хватку на нашей экономике. Мы не только избавились от иностранного экономического влияния - австро-венгерский рейхскригсминистр также отозвал дивизии, размещённые на нашей территории, поскольку больше не может позволить себе финансовое бремя защиты от того, что многие в Вене по глупости считают пустой социалистической угрозой. Хорошо это или плохо, но [ITA.GetNameDef] теперь фактически свободна от австрийского господства, по крайней мере до тех пор, пока австрийцы не восстановят силы. Многие итальянцы опасаются, что это оставит нас беззащитными перед возможным нападением [SRI.GetNameDef]. Война прямо сейчас стала бы ужасной перспективой."
italianrepublic.151.a: "Неужели это шаг к свободной Италии?"

italianrepublic.152.t: "ANI протестует против выборов"
italianrepublic.152.d: "Сегодня в Милане и других городах [Root.GetNameDef] прошли массовые демонстрации, на которых лидер ANI Энрико Коррадини обвинил правительство в фальсификации выборов при помощи Австрии. Коррадини заявил, что австрийское влияние ощущается повсюду в стране и что итальянцы никогда не обретут настоящей независимости, пока не свергнут своих угнетателей. Хотя Коррадини пока не предъявил никаких реальных доказательств фальсификаций, его слова нашли множество благодарных слушателей... и растёт опасение, что его сторонники могут доставить правительству серьёзные неприятности."
italianrepublic.152.a: "Запретить ANI и покончить с ней."
italianrepublic.152.b: "Внимательно следить за ним - мы всё ещё демократия."

italianrepublic.153.t: "Синерубашечники сеют хаос"
italianrepublic.153.d: "В ответ на недавние репрессии правительства наиболее ярые сторонники Энрико Коррадини в Associazione Nazionalista Italiana, прозванные прессой «синерубашечниками», начали сеять хаос по всей стране. Их уже напрямую связывают с двумя массовыми беспорядками и несколькими взрывами, а столицу заполонили плакаты, обвиняющие итальянское правительство в заговоре и продаже национальных интересов иностранцам. Волна беспорядков продолжает распространяться, и многие обвиняют премьер-министра [Root.GetLeader] в некомпетентности, считая, что слишком жёсткий курс против ANI лишь спровоцировал насилие."
italianrepublic.153.a: "Сколько ещё это будет продолжаться?"

italianrepublic.154.t: "Антиправительственные демонстрации"
italianrepublic.154.d: "Пока террористическая кампания Associazione Nazionalista Italiana продолжается, по всей стране вспыхнули протесты против неспособности правительства справиться с насилием. Крупнейшая демонстрация собрала в Милане более ста тысяч человек и фактически парализовала страну, а протестующие пригрозили начать всеобщую забастовку, если власти в ближайшее время не задержат главарей ANI. Несмотря на протесты, очевидно, что действия полиции против группы Коррадини дают лишь ограниченный результат - похоже, на каждого арестованного сторонника он приобретает нового."
italianrepublic.154.a: "Мы делаем всё, что можем!"

italianrepublic.155.t: "Марш на Милан провалился"
italianrepublic.155.d: "На фоне усилившихся в последние дни репрессий Энрико Коррадини сегодня призвал своих сторонников двинуться маршем на здание парламента в Милане. Огромная демонстрация переросла в настоящее сражение прямо в центре города, когда полиция и армия решительно вмешались. После сотен жертв Коррадини и его сторонники были в конце концов рассеяны. Сам Энрико Коррадини, однако, всё ещё находится на свободе, а несмотря на провал попытки переворота, всё громче звучат требования отставки правительства. Оппозиционные партии заявляют, что Республика погрузилась в хаос, и намерены как можно скорее вынести в итальянском парламенте вопрос о доверии правительству."
italianrepublic.155.a: "По крайней мере, Коррадини выбыл из игры."

italianrepublic.156.t: "Вотум доверия"
italianrepublic.156.d: "Сегодня в итальянском парламенте состоится голосование по вопросу о доверии правительству. На кону стоит само существование Республики: если правительство падёт, это станет очевидным признаком того, что нынешняя система признана неработоспособной, а многие совершенно не желают вновь погружаться в хаос очередной избирательной кампании. Представители знати уже собирают вокруг себя сторонников и предлагают вместо этого расширить полномочия монархического Совета Федерации. Угроза такого развития событий заставила других чиновников призывать голосовать за правительство любой ценой."
italianrepublic.156.a: "Правительство с трудом сохраняет доверие."
italianrepublic.156.b: "Правительство падает."

italianrepublic.157.t: "Возвращение к Федерации?"
italianrepublic.157.d: "После падения правительства и краха доверия к Республике у нас осталось два варианта дальнейшего устройства страны. Первый - восстановить власть Федерации, где представители знати займут административные должности в Signoria Federale, а возглавит её либо габсбургский великий герцог Тосканский Джузеппе Фердинандо, либо ломбардский герцог Марчелло Висконти ди Модроне. В некоторых частях страны выборы будут ограничены, и демократии в её нынешнем виде придёт конец. Многие поддерживают этот путь ради стабильности, однако другие, среди которых особенно заметны венецианские националисты, предлагают полностью распустить Федерацию: Венеция и Ломбардия станут независимыми государствами, хотя такое разделение вполне может лишь предоставить внешним силам удобную возможность для нападения."
italianrepublic.157.a: "Восстановить Федерацию под властью великого герцога Тосканского."
italianrepublic.157.b: "Восстановить Федерацию под властью герцога Висконти ди Модроне."
italianrepublic.157.c: "Полностью распустить Республику. (Играть за Ломбардию)"
italianrepublic.157.e: "Полностью распустить Республику. (Играть за Венецию)"

italianrepublic.158.t: "ANI вербует сторонников в армии"
italianrepublic.158.d: "Популярность Associazione Nazionalista Italiana продолжает бесконтрольно расти, и теперь, похоже, Энрико Коррадини активно агитирует среди генералов Республиканской армии. Неизвестно, согласился ли кто-нибудь из них присоединиться к его делу, однако недовольство правительством усиливается, и многие чиновники опасаются возможного переворота. С другой стороны, выступление против ANI прямо сейчас может спровоцировать насилие, которое подтолкнёт армию к поддержке Коррадини, даже если прежде военные об этом не помышляли. Что нам делать?"
italianrepublic.158.a: "Мы должны действовать сейчас, невзирая на последствия."
italianrepublic.158.b: "Заручиться собственной поддержкой и готовиться к худшему."

italianrepublic.159.t: "Массовые демонстрации ANI"
italianrepublic.159.d: "По мере роста поддержки ANI и превращения насильственных беспорядков в [ITA.GetNameDef] в обыденность по всей стране вспыхнули протесты против неспособности правительства справиться с ситуацией. Крупнейшая демонстрация собрала в Милане более ста тысяч человек и фактически парализовала страну, а протестующие пригрозили начать всеобщую забастовку, если власти вскоре не разберутся с главарями ANI. Участники протестов заявляют, что бездействие правительства равносильно полной некомпетентности."
italianrepublic.159.a: "Мы делаем всё возможное!"

italianrepublic.160.t: "Марш на Милан"
italianrepublic.160.d: "Сегодня Энрико Коррадини, лидер ANI, призвал своих сторонников начать массовый марш на королевский дворец в Милане, заявив, что лишь демонстрация силы способна заставить правительство уйти в отставку и очистить страну от австрийского влияния и коррупции. На центральную площадь стекаются огромные толпы, а по мере приближения итальянской полиции и армии становится очевидно, что грядущее кровопролитие будет ужасным. Ещё до того, как стало ясно, удастся ли переворот Коррадини, представители оппозиции уже потребовали провести голосование о доверии правительству из-за его неспособности справиться с ситуацией. Впрочем, эти требования могут потерять всякий смысл, если численное превосходство сторонников Коррадини обеспечит ему победу..."
italianrepublic.160.a: "Переворот Коррадини увенчался успехом."
italianrepublic.160.b: "Коррадини и его сторонники рассеяны."

italianrepublic.161.t: "Главари ANI наконец пойманы"
italianrepublic.161.d: "Хотя лидер Associazione Nazionalista Italiana Энрико Коррадини всё ещё находится на свободе, сегодня было объявлено, что большинство его сообщников по общенациональной террористической кампании наконец задержаны. Большинство уже ожидают суда, а страна может вздохнуть с облегчением. Многие считают это признаком того, что худшая часть политического кризиса [ITA.GetNameDef] осталась позади."
italianrepublic.161.a: "Давно пора!"

italianrepublic.170.t: "[From.GetNameDefCap] претендует на [claimed_state.GetName]"
italianrepublic.170.d: "На волне возродившегося после воссоединения страны ирредентизма [From.GetNameDef] заявила права на регион [claimed_state.GetName], который в настоящее время принадлежит [Root.GetNameDef]. [Root.GetAdjective]ие граждане региона вполне закономерно встревожены, тогда как местные итальянцы уже вышли на улицы с протестами и требуют воссоединения с Родиной."
italianrepublic.170.a: "Как они смеют!"

italianrepublic.171.t: "[From.GetNameDefCap] покидает [Root.GetFactionName]"
italianrepublic.171.d: "На волне возродившегося после воссоединения страны ирредентизма [From.GetNameDef] заявила права на регион [claimed_state.GetName], который в настоящее время принадлежит [claimed_state.Owner.GetNameDef]. Поскольку эти земли уже принадлежат участнику альянса [Root.GetFactionName], [From.GetAdjective]ое правительство решило, что его цели несовместимы с целями союза, и объявило о выходе. Приведёт ли это в конечном счёте к войне с [From.GetNameDef], ещё предстоит увидеть."
italianrepublic.171.a: "Глупый шаг."

italianrepublic.172.t: "Восстание антисиндикалистских партизан"
italianrepublic.172.d: "Мы давно подозревали о существовании подпольной сети, готовившейся к тому дню, когда между нами и [ITA.GetNameDef] начнётся война. Их численность не слишком велика, однако появление партизан в нашем тылу стало неожиданностью и уже вызвало заметные беспорядки по всей стране."
italianrepublic.172.a: "Это ничего не изменит."

italianrepublic.175.t: "[From.GetNameDefCap] претендует на Ливию"
italianrepublic.175.d: "Сославшись на то, что их ливийская колония была несправедливо отторгнута у Италии лишь из-за поражения в Вельткриге, [From.GetAdjective]ое правительство сегодня объявило всю Триполитанию своей законной территорией. Последует ли за этим официальное требование или даже война, пока неизвестно."
italianrepublic.175.a: "Как они смеют!"

italianrepublic.176.t: "[From.GetNameDefCap] требует Ливию"
italianrepublic.176.d.owns: "[From.GetAdjective]ое правительство предъявило нам ультиматум: немедленно передать все наши территории в Триполитании, которую оно целиком считает своей, или столкнуться со вторжением. [From.GetAdjective]ие корабли уже пересекают Средиземное море, делая намерения своего правительства предельно очевидными."
italianrepublic.176.d.subject: "[From.GetAdjective]ое правительство предъявило нам ультиматум: немедленно передать все наши территории в Триполитании. Это также означает отказ от контроля над [LBA.GetNameDef], после чего [From.GetNameDef], вероятно, просто вторгнется туда. [From.GetAdjective]ие корабли уже пересекают Средиземное море, делая намерения своего правительства предельно очевидными."
italianrepublic.176.a: "Хорошо, отдадим им то, чего они хотят."
italianrepublic.176.b: "Если им нужна война, они её получат!"

italianrepublic.177.t: "[From.GetNameDefCap] бросает нас"
italianrepublic.177.d: "[From.GetNameDefCap] ответила на требования [From.From.GetAdjective]ого правительства, претендующего на Триполитанию, согласием отказаться от нас. [From.GetAdjective]ие чиновники и войска уже спешно покидают [Root.GetNameDef]. Можно предположить, что вскоре [From.From.GetNameDef] объявит нам войну."
italianrepublic.177.a: "Ещё посмотрим!"

italianrepublic.178.t: "[From.GetNameDefCap] уступает"
italianrepublic.178.d.give: "Очевидно, испугавшись перспективы войны с нами из-за этой территории, [From.GetNameDef] уступила нашему ультиматуму и передала все принадлежавшие ей земли в Триполитании. Сегодня победила дипломатия!"
italianrepublic.178.d.abandon: "Очевидно, испугавшись перспективы войны с нами из-за этой территории, [From.GetNameDef] уступила нашему ультиматуму и отказалась от [LBA.GetNameDef]. Теперь она больше не отвечает за [LBA.GetAdjective]ое правительство и не станет его защищать. Если пожелаем, ничто не мешает нам начать вторжение."
italianrepublic.178.a: "Превосходно."

italianrepublic.179.t: "[From.GetNameDefCap] отказывает"
italianrepublic.179.d: "[From.GetAdjective]ое правительство категорически отвергло наш ультиматум. Похоже, нам не остаётся ничего иного, кроме войны."
italianrepublic.179.a: "Да будет так!"

italianrepublic.180.t: "Итальянцы побеждают"
italianrepublic.180.d: "Война складывается плохо. [libya_italy.GetNameDefCap] удалось оккупировать Триполитанию, и пока мы не способны выбить её оттуда. Нам также не удалось захватить ни одной территории на итальянском материке. Многие в [Root.GetAdjective]ом правительстве считают, что настало время просить мира и положить конец войне, прежде чем она затянется ещё сильнее."
italianrepublic.180.a: "Покончить с этим сейчас."
italianrepublic.180.b: "Мы должны продолжать борьбу!"

italianrepublic.181.t: "[From.GetNameDefCap] просит мира"
italianrepublic.181.d: "Похоже, [From.GetAdjective]ое правительство решило, что предпочитает просить мира, а не продолжать защищать Триполитанию. Если мы закончим войну сейчас, они передадут её нам - и на этом всё закончится."
italianrepublic.181.a: "Это всё, чего мы хотим."
italianrepublic.181.b: "Нет, мы доведём дело до конца!"

italianrepublic.182.t: "Мы проигрываем"
italianrepublic.182.d: "Попытка вернуть Ливию обернулась катастрофой, и теперь нам угрожает потеря всей страны. Возможно, если мы полностью откажемся от претензий на Ливию и передадим земли, на которые претендует [peace_country.GetNameDef] или её союзники, они согласятся закончить войну прямо сейчас?"
italianrepublic.182.a: "Мы должны попытаться."
italianrepublic.182.b: "Нет, мы ещё можем победить!"

italianrepublic.183.t: "[From.GetNameDefCap] просит мира"
italianrepublic.183.d: "Похоже, [From.GetAdjective]ое правительство решило, что борьба за Ливию обошлась ему слишком дорого. Оно предлагает полностью отказаться от претензий на Триполитанию и передать любые земли, на которые претендуем мы или наши союзники, если таковые имеются, в обмен на немедленное прекращение войны."
italianrepublic.183.a: "Да, покончим с этим сейчас."
italianrepublic.183.b: "Они начали эту войну, теперь мы доведём её до конца!"

italianrepublic.184.t: "[Root.GetAdjective]ое сопротивление рушится"
italianrepublic.184.d: "С тех пор как [Root.GetAdjective]ое правительство оказалось в изгнании, поддерживать сопротивление нашим соотечественникам-итальянцам становится всё труднее. Они упорно подрывали нашу легитимность, и теперь, похоже, все наши усилия оказались напрасны. Они доказали своё превосходство."
italianrepublic.184.a: "Porca miseria!"

italianrepublic.185.t: "Война затягивается"
italianrepublic.185.d: "Война против [peace_country.GetNameDef] и альянса [peace_country.GetFactionName] продолжается уже несколько месяцев, и поскольку их итальянские союзники нами уже разгромлены, дальнейшая борьба кажется бессмысленной. Возможно, следует предложить простое перемирие: нам останутся уже занятые территории и земли, на которые мы претендуем и которые удерживает [peace_country.GetNameDef] или её союзники. И ничего больше."
italianrepublic.185.a: "Предложим им это."
italianrepublic.185.b: "Нет - мы будем сражаться до самого конца!"

italianrepublic.186.t: "[From.GetAdjective]ое предложение"
italianrepublic.186.d: "[From.GetNameDefCap] предложила нам мир: война заканчивается сейчас, они сохраняют всё уже захваченное и получают территории, на которые имеют претензии и которые всё ещё удерживаются нами или другими участниками [Root.GetFactionName]. После этого конфликт считается исчерпанным. Альтернатива - продолжать войну, в которой мы до сих пор не добились абсолютно никакого прогресса."
italianrepublic.186.a: "Покончим с этим сейчас."
italianrepublic.186.b: "Нет - мы всё ещё можем сражаться!"

italianrepublic.187.t: "[From.GetNameDefCap] претендует на Восточную Африку"
italianrepublic.187.d: "Сославшись на то, что их африканские колонии были несправедливо отторгнуты у Италии лишь из-за поражения в Вельткриге, [From.GetAdjective]ое правительство сегодня объявило всю Восточную Африку своей законной территорией. Последует ли за этим официальное требование или даже война, пока неизвестно."
italianrepublic.187.a: "Как они смеют!"

italianrepublic.200.t: "Самурай из Фиуме"
italianrepublic.200.d: "Харукити Симои, которого его старый друг Д’Аннунцио прозвал Самураем из Фиуме и Товарищем Самураем, вновь прибыл в Италию после недолгого пребывания на родине в японской Фукуоке, где помог токийскому правительству учредить новое итальянское посольство. Искусный воин-поэт и писатель, Симои давно известен своей любовью к итальянской культуре: он годами жил в Неаполе и даже женился на итальянке. Антигерманские и антитурецкие взгляды сформировались у него во время Великой войны, когда он сражался за Италию как лётчик и ардито. Симои давно считает себя почётным итальянцем, и его старые друзья Муссолини, Коррадини и Д’Аннунцио полностью с этим согласны. Вместе они даже помогли организовать в 1920 году перелёт Рим-Токио, совершённый знаменитым авиатором и другом Симои Артуро Феррарином. После Великой войны Симои основал журнал японской литературы «Sakura» и, осев на новом месте, продолжил служить интересам как Италии, так и Японии, распространяя идеи бусидо по итальянским землям и стремясь соединить свои японские представления с итальянскими концепциями социализированного национализма, национал-популизма, тотализма и легионерства. Несмотря на возраст, Симои всё ещё способен принести немалую пользу, и потому мы примем его на службу в качестве военного офицера и советника на обозримое будущее. Будем надеяться, что Самурай из Фиуме оправдает своё прозвище."
italianrepublic.200.a: "Товарищ Самурай Симои станет прекрасным дополнением к нашему военному штабу."

italianrepublic.201.t: "Идеологический раскол в ANI"
italianrepublic.201.d: "После нашего решения открыть для Италии новую эпоху под властью «Унитарной Республики» между господствующими республиканской и монархической фракциями ANI начал углубляться раскол, а более мелкие течения, такие как футуристы Джованни Папини, воспользовались нарастающим хаосом и также вышли на первый план. С самого основания партии её ведущую республиканскую фракцию возглавлял главный сооснователь ANI Энрико Коррадини, однако сын влиятельного партийного руководителя Костанцо Чиано, граф Галеаццо Чиано, постепенно поднимался по иерархии и стал фактическим лидером монархической клики ANI. Опасаясь, что цели нашей националистической революции будут запятнаны вмешательством аристократической элиты, республиканцы предложили молодого и энергичного деятеля ANI Дино Гранди в качестве компромиссного кандидата благодаря его связям и симпатиям по обе стороны раскола. Впрочем, часть республиканцев предпочла бы доверить будущее научному авторитету известного социолога, статистика и евгениста Коррадо Джини, тогда как правые футуристы дерзко выдвинули самого Папини, утверждая, что преодолеть идеологический раскол ANI сможет лишь кандидат, не связанный ни с одной из двух главных сторон. Лишь один человек сможет возглавить Associazione Nazionalista Italiana и всю Италию. Кто же поведёт нас навстречу судьбе?"
italianrepublic.201.a: "Республиканцы Энрико Коррадини одерживают верх."
italianrepublic.201.b: "Пусть органицистское видение вознесёт Коррадо Джини."
italianrepublic.201.c: "Джованни Папини и его фанатики-футуристы пользуются моментом."
italianrepublic.201.e: "Обе фракции достигают компромисса под руководством Дино Гранди."
italianrepublic.201.f: "Граф Галеаццо Чиано и его аристократы захватывают контроль над ANI."

italianrepublic.202.t: "Судьба Савойского дома при ANI"
italianrepublic.202.d: "После решения Associazione Nazionalista Italiana сделать [ITA.GetLeader] новым лицом партии он занял высший политический пост в Италии. Однако теперь внутри ANI, прежде всего в монархической фракции самого [ITA.GetLeader], разгорелся спор о необходимости восстановления парламентской монархии. Если мы пойдём по этому пути, Савойский дом вернётся в качестве законной династии нашего возрождённого королевства. С другой стороны, мы можем просто принять наши аристократические и элитарные традиции, не возрождая полностью институт, который многие в ANI считают устаревшим, при этом сохранив уважение к бывшим монархам и их месту в нашей культуре. Каким станет будущее политической системы Италии, когда [ITA.GetLeader] держит судьбу нации в своих руках?"
italianrepublic.202.a: "Савойский дом будет восстановлен как законная династия Италии!"
italianrepublic.202.b: "Нам незачем возрождать столь устаревшие институты."

italianrepublic.203.t: "Смерть короля"
italianrepublic.203.d: "Небеса проливают нескончаемые слёзы и разражаются громовыми рыданиями: наш любимый король Витторио Эмануэле Фердинандо Мария Дженнаро ди Савойя наконец скончался. Прославленный принц Неаполитанский, любимый Sciaboletta, «Маленькая сабля», или il Re soldato, «Король-солдат», наш национальный отец мирно умер во сне в возрасте 78 лет и теперь предан вечному покою. Пока правительство готовит пышную и достойную церемонию погребения бывшего монарха, а духовенство и аристократия спорят, следует ли похоронить его в традиционной усыпальнице Савойского дома в аббатстве Откомб на юге Франции или в римском Пантеоне, где покоятся его дед Виктор Эммануил II и отец Умберто I, страна и следующий король готовятся к будущему.\n\nТеперь единственный сын покойного Виктора Эммануила, Умберто Никола Томмазо Джованни Мария ди Савойя, восходит на престол как король Умберто II. Подобно большинству наследников Савойского дома, Умберто получил глубокое военное образование и обладает немалым военным опытом, однако его политические знания весьма ограничены, поскольку в Савойском доме традиционно не обучают наследников государственным делам, ожидая, что каждый монарх освоит их уже после восшествия на престол. Поэтому Умберто II предстоит многому научиться, прежде чем он станет настоящим королём и политическим лидером, однако его военный опыт наверняка ещё долгие годы будет помогать Италии в наших империалистических устремлениях. По крайней мере, мы на это надеемся."
italianrepublic.203.a: "Покойся с миром, король Витторио Эмануэле III. Да здравствует король Умберто II!"

italianrepublic.204.t: "Джузеппе Фердинандо I скончался"
italianrepublic.204.d: "Страна скорбит: эрцгерцог Иосиф Фердинанд Австрийский, более известный как Джузеппе Фердинандо I, скончался. Джузеппе Фердинандо пришлось пройти тяжёлый путь, чтобы заслужить доверие итальянского народа, который первоначально считал нового короля не более чем марионеткой Австрийской империи. Со временем он доказал, что является сострадательным, нравственным и достойным монархом, заслуживающим уважения Италии. После смерти короля главенство в доме Габсбургов-Тосканских переходит к брату Фердинанда Петеру Фердинанду, решившему править под именем Пьетро Фердинандо I."
italianrepublic.204.a: "Неожиданный герой в самый тёмный час Италии."

italianrepublic.205.t: "Пьетро Фердинандо I скончался"
italianrepublic.205.d: "Страна вновь погружается в траур: эрцгерцог Петер Фердинанд Австрийский, известный своим подданным как Пьетро Фердинандо I, скончался. Подобно своему брату, Пьетро Фердинандо придерживался невмешательства в повседневное управление, оставляя текущие дела государства Signoria Federale. Хотя его правление прошло в основном спокойно, а личные странности были куда менее известны, чем у брата, Пьетро Фердинандо пользовался уважением итальянского народа. После смерти короля титул великого герцога Тосканского переходит к его сыну Готфриду, решившему править под именем Гоффредо I."
italianrepublic.205.a: "Боже, храни короля!"

italianrepublic.206.t: "Предполагаемая жизнь Христа"
italianrepublic.206.d: "После возвышения Джованни Папини во главе ANI и подконтрольной нам части Италии местные учёные и литературоведы начали заново оценивать труды этого скандального и полемичного автора. Некогда ожесточённо обсуждавшиеся произведения теперь становятся одним из оснований нашего крайне синкретического режима, стремящегося соединить футуризм с итальянскими правыми ради блага нации и нашего вскоре объединённого народа. Хотя в центр внимания вновь вернулись многие старые работы Папини, ни одна из них не вызвала столько интереса, как опубликованная в 1923 году «биография» Иисуса Христа под названием «Жизнь Христа». Книга носит откровенно антисемитский характер и широко считается псевдоисторической, изображая жизнь Иисуса Христа в радикальном и реакционном ключе. Однако ничто в ней не вызвало столько споров, сколько настойчивое утверждение Папини о том, что апостол Иоанн и Иисус Христос состояли в гомосексуальных отношениях, а позднее эта предполагаемая истина была скрыта коррумпированными традиционалистскими руководителями ранней Католической церкви и авторами первых редакций Библии. В период своего воинствующего атеизма Папини утверждал, что это было сделано ради создания более благочестивого образа Иисуса, тогда как теперь, заняв более мягкую, но всё ещё переменчивую позицию по отношению к вере, он заявляет, будто это было необходимо для распространения лжи о греховности гомосексуальности. Подобные взгляды, мягко говоря, вызвали возмущение среди многочисленных врагов Папини в духовенстве, христианских консерваторов и националистов внутри ANI и за её пределами, а также среди значительной части интеллигенции вне его небольшого и замкнутого кружка писателей, художников и философов. Но ни это, ни что-либо иное не остановит Папини и его клику радикальных правых футуристов от навязывания собственного понимания истины итальянскому обществу, пока мы на полной скорости несёмся в безграничное будущее на вершине этих причудливых идей."
italianrepublic.206.a: "Против Церкви или за Церковь - определись уже, Папини."

italianrepublic.207.t: "История короля Амадея"
italianrepublic.207.d: "В 1870 году Испанией правил король Амадео I, который по сей день остаётся единственным монархом в истории этой страны, происходившим из нашего Савойского дома. Амадео, также называемый Амадеем, был вторым сыном Виктора Эммануила II и потому воспитывался как запасной наследник, проведя большую часть жизни в качестве герцога Аостского, как и все вторые сыновья Савойского дома до него. Однако правление Амадео с самого начала было обречено: его испанское королевство стремительно разлагалось под растущим давлением республиканцев, карлистских восстаний на севере и угрозы кубинской независимости. После всего трёх бурных лет на престоле в 1873 году он отрёкся, на прощание знаменито назвав испанский народ «неуправляемым» перед Генеральными кортесами, после чего родилась Первая Испанская республика. Вернувшись в Италию, Амадео основал Аостскую ветвь Савойского дома, младшую по отношению к основной линии потомков короля Умберто I, которая до сих пор правит Северной Италией, но старшую по отношению к генуэзским герцогам. Теперь, когда Италия расколота, Королевство Италия вновь восстановлено под властью принца Луиджи Амедео, сына злополучного испанского короля. Наше правительство принесло верность Савойскому дому, а вместе с ним и наследию Амадео I, поэтому некоторые радикальные ястребы в наших рядах требуют восстановить старое владение любимого Амадея и провести итальянскую «реконкисту» Савойской Испании. Как бы нелепо это ни звучало, многие жаждут отомстить иберийцам за те или иные старые обиды. Стоит ли воспользоваться редкой возможностью исполнить давно забытую «судьбу» или всё же прежде сосредоточиться на итальянских делах, ведь и сам полуостров, и вся итальянская сфера и без того крайне нестабильны..."
italianrepublic.207.a: "Вернём наследие Амадео I и двинемся на Иберию!"
italianrepublic.207.b: "У нас есть более насущные и реалистичные задачи."

italianrepublic.208.t: "За Амадео отомщено!"
italianrepublic.208.d: "Спустя шесть десятилетий король Луиджи отомстил за своего отца и успешно провёл военную кампанию, вновь подчинив непокорные испанские земли Савойскому дому. После того как сторонники Бурбонов, карлистские претенденты и анархистская чернь были загнаны в подполье нашей могучей армией, нам предстоит решить, что делать с бывшими владениями короля Амадея. Предоставим ли испанцам определённую автономию в обмен на провозглашение Луиджи новым королём Испании или положим конец любым мечтам об испанской самостоятельности и создадим новый славный союз наших народов?"
italianrepublic.208.a: "Предоставить испанцам автономию под властью Савойского дома."
italianrepublic.208.b: "Даровать испанцам равное положение. Провозгласить Итало-Испанский союз!"
italianrepublic.208.c: "Мы не можем повторить ошибок прошлого. Объединить короны!"

italianrepublic.209.t: "Выбор для престола"
italianrepublic.209.d: "После того как монархическое крыло ANI под руководством таких людей, как Чиано и Дино Гранди, добилось господства, наиболее очевидным следующим шагом становится коронация нового монарха. Однако столь простой на первый взгляд вопрос вызвал бесконечные споры как публично, так и за закрытыми дверями: восторженные монархисты и их неохотные республиканские союзники спорят о том, кому достанется трон. Все серьёзные участники дискуссии, естественно, поддерживают представителя Савойского дома, который десятилетиями является королевской династией Италии, однако выбор конкретного представителя рода оказался куда сложнее. Бывший король Виктор Эммануил III всё ещё пользуется значительной поддержкой, несмотря на то что он, возможно, связался с сомнительными экстремистскими группами на юге. Большинство других старших представителей Савойского дома сейчас преданно служат Амадео на Сардинии и не желают предавать своих соотечественников, перебегая к нам. Так кто же из тех потомков Савойского дома, которых мы действительно можем склонить на свою сторону, наконец станет новым королём Италии?"
italianrepublic.209.a: "Короновать Луиджи Амедео, герцога Абруцци и знаменитого исследователя Арктики."
italianrepublic.209.b: "Короновать Эудженио, герцога Анконского и наследника герцогства Генуэзского."
italianrepublic.209.c: "Короновать Умберто, принца Пьемонтского и законного наследника прежнего трона своего отца."
italianrepublic.209.e: "Вновь короновать единственного истинного короля Витторио Эмануэле! Да здравствует Виктор Эммануил III!"


