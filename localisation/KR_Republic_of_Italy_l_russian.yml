### Events ###
italianrepublic.7001.t: "Австрийцы унижены"
italianrepublic.7001.d: "Теперь, когда наши храбрые солдаты успешно освободили угнетённое итальянское население Австрийской империи, мы можем начать мирные переговоры в обмен на полное включение законных итальянских земель в состав нашего государства. Хотя предложение перемирия кажется очевидным решением, некоторые представители командования убеждены, что габсбургская аномалия уже доживает последние дни и ещё несколько мощных ударов окончательно повалят этого зверя. Наше решение окажет колоссальное влияние на будущее как Италии, так и Австрии."
italianrepublic.7001.a: "Наконец Трентино вернётся на Родину."
italianrepublic.7001.b: "Мы спасём ещё больше наших братьев!"
italianrepublic.7001.c: "Нет, мы покончим с австрийским орлом."

itaforpol.1.t: "Итальянская сфера"
itaforpol.1.d: "После недавнего решения создать независимую сферу влияния в сознании нации остаётся лишь один вопрос: как будет называться итальянский союз? После нескольких дней обсуждений с ближайшими советниками в Риме [ROOT.getleader] объявляет о рождении..."
itaforpol.1.a: "Итальянского блока."
itaforpol.1.b: "Римского альянса."
itaforpol.1.c: "Средиземноморской оси."

itaforpol.2.t: "Место Святой Италии в мире"
itaforpol.2.d: "После укрепления благожелательной власти неосанфедистов в Италии и наступления эпохи процветания и мира многие всё ещё задаются вопросом: внутри страны мы обрели покой, но что происходит в остальном мире? От возвышения коммунаров до Великой гражданской войны в Америке окружающий нас мир вступает в бурную эпоху, и кровопролитие, кажется, скрывается за каждым углом. Мы должны спросить себя, какое место займёт Италия в эти тяжёлые времена."
itaforpol.2.a: "Мы должны обратиться внутрь себя ради безопасности Италии и Церкви."
itaforpol.2.b: "Наше Святое Государство преобразит мир по образу Господа."
itaforpol.2.c: "Германская сфера станет камнем, на котором Италия построит своё будущее."
itaforpol.2.e: "Мы должны встать рядом с Антантой и сокрушить коммунарскую угрозу."
itaforpol.2.f: "Почитание веры Австрией тесно связывает наши народы."

itaforpol.3.t: "Приглашение из Рима!"
itaforpol.3.d: "После воссоединения Итальянского полуострова [From.GetName] становится всё более могущественной державой и теперь стремится занять собственное место под солнцем, предложив нам вступить в [ROOT.GetFactionName]. Возможно, итальянцы пока не столь грозны, как немцы или французы, однако союз с ними способен определить судьбу нашего народа и всей Европы на многие столетия."
itaforpol.3.a: "Мы встанем рядом с итальянцами!"
itaforpol.3.b: "Мы не станем участвовать в их мании величия."

itaforpol.4.t: "[From.GetName] вступает в [ROOT.GetFactionName]!"
itaforpol.4.d: "Осознали ли они стремительное возвышение Италии и её место в мире или просто испугались оказаться на её пути, [From.GetName] мудро решила занять своё место рядом с нами в грядущем итальянском будущем."
itaforpol.4.a: "Наша мощь растёт!"

itaforpol.5.t: "[From.GetName] отвергает нас!"
itaforpol.5.d: "Наш посланник принёс шокирующие новости: несмотря на все наши усилия, [From.GetName] отвергла предложение о союзе. [ROOT.getleader] надеялся, что они увидят взаимную выгоду в укреплении Итальянского альянса и обеспечении нашего места в Европе, однако, похоже, они решили иначе."
itaforpol.5.a: "Через двадцать лет они об этом пожалеют."

itaforpol.6.t: "Братство с итальянцами?"
itaforpol.6.d: "После воссоединения Итальянского полуострова [From.GetName] становится всё более могущественной державой и теперь стремится занять собственное место под солнцем, предложив Белградскому пакту стать частью её растущей сферы влияния. Сегодня утром в Белград прибыл итальянский посланник с предложением объединить наш союз с [ROOT.GetFactionName]. Хотя итальянские притязания на Далмацию прямо противоречат любым югославским устремлениям, а подобное решение несомненно ограничит независимость нашей внешней политики, итальянцы также являются противниками австрийской угрозы, и этот факт не ускользнул от внимания [ROOT.getleader]. Какое бы решение мы ни приняли, оно определит судьбу Средиземноморья на многие поколения."
itaforpol.6.a: "Мы встанем рядом с итальянцами!"
itaforpol.6.b: "Мы будем стоять одни."

cathitaly.2000.t: "Посвящение Франции?"
cathitaly.2000.d: "В 1917 году в небольшой португальской деревне Фатима Пресвятая Дева Мария на протяжении пяти месяцев являлась трём детям-пастухам. Во время этих явлений Богородица открывала детям многое - от видений Ада до пророчеств о будущем. Одно из пророчеств предсказывало падение Старшей Дочери Церкви, Франции, перед синдикалистской угрозой. В том же видении Матерь Божия предупредила, что если Святой Отец в единении со всеми епископами мира не посвятит Францию её Непорочному Сердцу, заблуждения Коммуны распространятся по всему миру.\n\nТеперь, когда Папа [ROOT.getleader] открыто осудил зло синдикализма и социализма, многие в священных залах Ватикана задаются вопросом, согласится ли Святой Отец совершить это посвящение в надежде заручиться благоволением Богоматери в грядущих войнах против синдикализма. С этой целью группа мирян, священников, епископов и даже нескольких кардиналов официально обратилась к Его Святейшеству с просьбой исполнить желание Богородицы и посвятить Францию её Непорочному Сердцу. В материальном отношении подобное посвящение даст немного, однако само осознание того, что Матерь Божия якобы стоит на стороне борцов против синдикалистской тирании, вполне может убедить Святого Отца. Разумеется, видения в Фатиме являются лишь частными откровениями, и далеко не все готовы считать их неоспоримым фактом. Кроме того, столь грандиозная церемония наверняка обойдётся чрезвычайно дорого, и одна лишь сумма расходов способна отпугнуть Преемника Святого Петра. Как бы то ни было, учитывая огромное число людей, поддержавших петицию, от Святого Отца ожидают скорого ответа."
cathitaly.2000.a: "Исполним желание Богоматери и посвятим Францию."
cathitaly.2000.b: "Одной Франции недостаточно! Посвятить нужно весь мир!"
cathitaly.2000.c: "Сколько там было нулей в счёте? Это слишком дорого!"
