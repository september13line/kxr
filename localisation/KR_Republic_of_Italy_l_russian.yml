ITA_claim_ticino: "Выдвинуть ирредентистские претензии на Тичино"
ITA_claim_ticino_desc: "Тичино - регион Швейцарии, населённый преимущественно итальянцами, и в наших интересах закрепить более прочные претензии на эту территорию."
ITA_claim_nice: "Выдвинуть ирредентистские претензии на Ниццу"
ITA_claim_nice_desc: "Аннексированная Францией в 1860 году Ницца по праву является частью итальянских земель, и в наших интересах закрепить более прочные претензии на этот регион."
