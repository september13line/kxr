### Decisions ###
ITA_foreign_policy: "Внешняя политика"
ITA_foreign_policy_desc: "Крайне важно начать обращать внимание за пределы наших границ, заключать союзы и устанавливать связи с другими государствами, чтобы укрепить своё положение на мировой арене."
ITA_remove_austrian_influence: "Устранить австрийское влияние"
ITA_remove_austrian_influence_desc: "Австрийцы по-прежнему сохраняют сильный контроль над [Root.GetAdjective]ой экономикой - слишком сильный. Хотя это и принесёт краткосрочные трудности, в долгосрочной перспективе нам стоит национализировать принадлежащие австрийцам компании в государстве [Root.GetNameDef] и провозгласить полную экономическую независимость."
ITA_attack_austria: "Атаковать австрийцев"
ITA_attack_austria_desc: "Подобно вампиру из легенд, государство [AUS.GetNameDef] медленно высасывало из нас жизненные силы. Если мы хотим вновь утвердить себя как внутри страны, так и на международной арене, австрийцы должны быть побеждены."
ITA_call_for_help: "Призвать государство [From.GetNameDef] на помощь"
ITA_call_for_help_desc: "Поскольку государство [SRI.GetNameDef] ведёт с нами войну, в государстве [From.GetNameDef] должны понимать, что в случае нашего поражения именно они станут следующей целью. Если они достаточно мудры, то ответят на наш призыв о помощи сейчас, пока ещё не поздно."
ITA_war_with_venice1: "Венеция восстала"
ITA_war_with_venice1_desc: "Венецианцы подняли восстание против [Root.GetAdjective]ого правительства. Мы должны доказать, что способны быстро с ними разобраться, иначе наши соседи могут решить, что мы достаточно слабы для их вмешательства."
ITA_war_with_venice2: "Венеция восстала"
ITA_war_with_venice2_desc: "Мы потеряли контроль над ситуацией в Венеции. Теперь, помимо подавления самого восстания, нам приходится иметь дело и с иностранным вмешательством. Если мы не закончим всё в течение ближайших шести месяцев, правительство ANI, скорее всего, рухнет."
ITA_call_the_austrians_sri: "Призвать австрийцев"
ITA_call_the_austrians_sri_desc: "Мы воюем с синдикалистской республикой. Следует попросить австрийцев вмешаться, оказать нам помощь и гарантировать поражение синдикалистов."
ITA_join_the_austrian_pact: "Заключить союз с австрийцами"
ITA_join_the_austrian_pact_desc: "Австрия создала союз для защиты Южной Европы или, если говорить точнее, своей сферы влияния. Поскольку мы находимся внутри этой сферы, присоединение к их альянсу будет нам выгодно."
ITA_join_belgrade_pact: "Вступить в Белградский пакт"
ITA_join_belgrade_pact_desc: "Хотя союз с Сербией может показаться странным, у нас есть общий враг: государство [AUS.GetNameDef]. Согласятся ли сербы - нам ещё предстоит узнать."
ITA_conference_of_venice: "Подписать договор с государством [From.GetNameDef]"
ITA_conference_of_venice_desc: "Хотя Рим необходимо вернуть, нет никакой необходимости прибегать к насилию против Святого Отца. Следует пригласить его в Венецию для заключения Конкордата о будущем светской власти Папы."
ITA_unite_italy: "Объединить Италию"
ITA_unite_italy_desc: "Италия вновь едина! Теперь нам необходимо заняться реинтеграцией страны."
ITA_attack_italy: "Атаковать государство [From.GetNameDef]"
ITA_attack_italy_desc: "Настало время завершить Рисорджименто - мы должны уничтожить государство [From.GetNameDef] и освободить итальянцев, живущих под его властью."
ITA_invite_into_federation: "Пригласить государство [From.GetNameDef] в [Root.GetNameDef]"
ITA_invite_into_federation_desc: "Теперь, когда угроза социалистической республики устранена, возможно, настало время залечить расколы, оставленные гражданской войной. Поскольку именно мы занимаем явно господствующее положение на Итальянском полуострове, нам и предстоит сделать первый шаг."
ITA_rally_supporters: "Сплотить сторонников внутри SRI"
ITA_rally_supporters_desc: "В государстве [SRI.GetNameDef] существует сеть сопротивления синдикалистам, участники которой готовы подняться по нашему призыву. Они действуют ещё со времён гражданской войны, и хотя их силы, возможно, не смогут окончательно склонить чашу весов в нашу пользу, нам пригодится любая доступная помощь."
ITA_claimed_libya: "Мы заявили претензии на Ливию"
ITA_claim_libya: "Заявить претензии на Ливию"
ITA_claim_libya_desc: "До тех пор, пока поражение Италии в Вельткриге не привело к возвращению нашей ливийской колонии под власть Османской империи, она была нашим важнейшим колониальным владением - скорее продолжением самой Италии, чем далёкой заморской территорией. У нас были большие планы на этот регион. Теперь, когда наша страна восстановлена, пришло время потребовать то, что принадлежит нам по праву."
ITA_war_for_libya: "Объявить войну государству [From.GetNameDef]"
ITA_war_for_libya_desc: "Пришло время вернуть Ливию, а для этого придётся воевать с государством [From.GetNameDef]. Viva l'Italia!"
ITA_claimed_east_africa: "Мы заявили претензии на Восточную Африку"
ITA_claim_east_africa: "Заявить претензии на Восточную Африку"
ITA_claim_east_africa_desc: "Поражение Италии в Вельткриге привело к утрате наших африканских колоний. Эти владения были блистательным символом возвышения Италии на мировой арене, которое оборвалось вместе с нашим поражением. У нас были большие планы на этот регион. Теперь, когда наша страна восстановлена, пришло время потребовать то, что принадлежит нам по праву."
ITA_war_for_east_africa: "Объявить войну государству [From.GetNameDef]"
ITA_war_for_east_africa_desc: "Пришло время вернуть наши утраченные колонии в Восточной Африке, а для этого придётся воевать с государством [From.GetNameDef]. Viva l'Italia!"
ITA_demand_libya: "Потребовать Ливию"
ITA_demand_libya_desc: "Государство [From.GetNameDefCap] в настоящее время господствует над нашей Ливией, и пришло время потребовать её возвращения... иначе будет война, как и в 1912 году."
ITA_unite_spain: "Восстановить владения Амадея"
ITA_war_for_albania: "На Тирану"
ITA_war_for_albania_desc: "Албания долгое время находилась в сфере влияния итальянской нации. Теперь, когда Италия вновь едина, мы снова двинемся на Тирану, чтобы расширить своё влияние на Адриатику и всё Средиземноморье."
ITA_join_reichspakt: "Вступить в Рейхспакт"
ITA_join_reichspakt_desc: "Когда Австрия окончательно сошла со сцены, мы стали сильнейшим возможным южным союзником Германии, а Германия - нашим."
ITA_resorgimento_decisions: "Рисорджименто"
ITA_resorgimento_decisions_desc: "Италия разделена со времён Итальянской гражданской войны 1920 года. Монархисты, социалисты, республиканцы и изгнанники смотрят друг на друга из-за укреплений. На фоне подобного раскола мало кто верит в скорое воссоединение Италии. Однако, даст Бог, вскоре мы вновь объединим всех итальянцев в новом Рисорджименто, подобном тому, что семьдесят лет назад осуществили Кавур и Савойский дом."
