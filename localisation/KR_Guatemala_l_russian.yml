GUA_compensated_illiteracy: "Приемлемая неграмотность"
GUA_compensated_illiteracy_desc: "После многих реформ в области образования, больших инвестиций и даже приглашения иностранной интеллигенции на работу в Гватемалу, мы смогли снизить нашу безграмотность до приемлемого уровня."

GUA_BM: "Чёрный Понедельник"
GUA_BM_desc: "Хотя Чёрный Понедельник не повлиял на нас так глубоко, как на наших соседей, нам всё ещё нужно заполнить дыры в экономике, появившиеся в результате ухода или сокращений американских компаний."

GUA_military_state: "Военизированное Государство"
GUA_military_state_desc: "Все больше и больше школ принимают военизированную учебную программу, проводятся ежемесячные парады, большинство политических должностей занимают военные. Армия Гватемалы стала единственной политической силой в стране, и люди, кажется, начинают принимать эту новую жизнь такой, какая она есть."

