guatemala.1.t: "Введение в Гватемалу"
guatemala.1.d: "Политический хаос в Гватемале начался в 1898 году, когда к власти пришёл Мануэль Эстрада Кабрера. «Либеральная» партия Кабреры имела глубокий контроль над правительством, при этом все выборы вплоть до 1920 года были сфальсифицированы в пользу Либеральной партии под руководством Кабреры. Этот период также значительно усилил влияние United Fruit Company - американского бизнеса, ориентированного на увеличение экспорта в Америку по более низким ценам.\n\nЭто изменилось в 1920 году, когда Либеральная партия столкнулась с крайним сопротивлением после землетрясений 1918 года, разрушивших промышленность, созданную Кабрерой. Его бездействие привело к тому, что консерваторы внутри страны сформировали Юнионистскую партию, в которую вошли Хосе Асмития, Тасито Молина, Эдуардо Камачо, Хулио Бьянки и Эмилио Эскамилья, а также получили поддержку католической церкви в Гватемале.\n\nЮнионистская партия подготовила «Трёхчастный акт» - основополагающую политику партии, и распространила его в городе Гватемала на Новый год 1920 года. Это привело к чрезвычайному росту популярности юнионистов, с протестами за пределами столицы 11 марта 1920 года, когда толпа была обстреляна, и население осталось ещё более разгневанным, чем прежде. Последней каплей стал 1920 год, когда Адриан Видаурре, президент Национальной ассамблеи, объявил Кабреру непригодным к правлению и сместил его, хотя всё ещё сталкивался с ожесточённым сопротивлением со стороны сторонников Кабреры. Затем они сделали Карлоса Эрреру президентом Гватемалы.\n\nЭррера балансировал на очень тонком политическом канате, поскольку имел либеральные взгляды, но представлял Юнионистскую партию. Этот канат лопнул в 1921 году, когда он серьёзно расстроил Либеральную партию, отказавшись предоставлять уступки UFC, что привело к военному перевороту во главе с Хосе Марией Орельяной. Он представлял нужды и требования Либеральной партии, предложив уступки UFC в следующем году.\n\nС тех пор политическая ситуация полностью застопорилась: Орельяна правит своим режимом, балансируя между потребностями левых и правых. Теперь Гватемала замерла..."
guatemala.1.a: "Орельяна вечен."

guatemala.2.t: "Чёрный понедельник поражает нас!"
guatemala.2.d: "Чёрный понедельник ударил по Соединённым Штатам, сделав их экономический спад ещё хуже. Волны ощущаются по всей Центральной Америке, наш урожай остаётся непроданным, а американские компании сокращаются, чтобы избежать банкротства."
guatemala.2.a: "Что это будет означать для Гватемалы?"

guatemala.3.t: "Юридические проблемы"
guatemala.3.d: "Несколько крестьян подали в суд на United Fruit Company и некоторых провинциальных губернаторов по шатким основаниям, таким как продажа их земли другими сторонами без их ведома, захват местными губернаторами их земли для UFC без разумной причины и игнорирование завещаний бездетных людей. Очевидно, что социалисты оказали давление на этих крестьян, инструктируя их отстаивать свои требования и помогая им с судебными издержками."
guatemala.3.a: "Прислушайтесь к их мольбам, верните землю и попытайтесь что-то сделать с коррупцией."
guatemala.3.b: "Это, безусловно, просто придуманные отговорки!"

guatemala.4.t: "Гражданская война в Америке"
guatemala.4.t_nocw: "Америка стабилизируется"
guatemala.4.d: "Гражданская война в Америке началась! Наш крупнейший торговый партнёр исчез почти в одночасье. Официальные лица UFC в спешке спасают всё, что могут, в хаосе, распродавая активы, чтобы стабилизировать своё положение. Их поддержка Орельяны значительно ослабла; тёмное облако теперь нависает над горизонтом Гватемалы."
guatemala.4.d_nocw: "К нашему великому шоку, похоже, ситуация в Соединённых Штатах стабилизируется. К сожалению, похоже, что без призрака войны в США население Гватемалы больше не имеет отвлечения от непопулярности самого Орельяны. В то время как президент США смотрит внутрь страны, похоже, что режим в Гватемале оказался совершенно одинок."
guatemala.4.a: "Гватемала выживет."

guatemala.5.t: "Письмо 311"
guatemala.5.d: "Группа демократов и социалистов, в основном состоящая из студентов университетов, написала письмо президенту Орельяне с просьбой об его отставке и как можно скорее начать свободные выборы. Орельяна знает, что его поддержка уменьшилась, а демократическое движение милитаризировалось и начало переговоры с социалистами об объявлении открытого восстания, чтобы принести «свободу» Гватемале; это письмо - лишь точка кипения напряжённости. Если правительство отклонит это, по-видимому, «искреннее» письмо, исходящее от будущего Гватемалы, гражданская война почти неизбежна."
guatemala.5.a: "Начать подготовку к выборам как можно скорее, чтобы предотвратить катастрофу."
guatemala.5.b: "Это просто социалистический заговор! Гватемала не будет развращена!"

guatemala.6.t: "Переворот Убико"
guatemala.6.d: "Видя слабость Орельяны и неизбежные выборы, которые привели бы социалистов в правительство, популярный генерал-ястреб Хорхе Убико Кастаньеда вошёл в столицу со своей верной армией и сместил Орельяну. Как только новости достигли страны, демократическо-социалистическая коалиция, Партия национального обновления, начала брать под прямой контроль несколько городов и объявила режим Убико нелегитимным, начав гражданскую войну. Некоторые более умеренные люди, возмущённые захватом власти Убико, присоединились к их делу."
guatemala.6.a: "Убико спасёт нас от социализма!"

guatemala.7.t: "Речь Убико к народу"
guatemala.7.d: "Через несколько дней после переворота, когда ему удалось стабилизировать свою власть в столице, Убико произнёс речь перед жителями города Гватемала:\n«Сограждане гватемальцы, я обращаюсь к вам в связи с недавними событиями, чтобы призвать к благоразумию. Пусть ни один гватемалец не отрицает опасности нашего времени. Пока мы сражаемся друг с другом, разделённые мелочными распрями нашей общей истории, прилив большего конфликта поворачивается против нас, угрожая уничтожить всё, чего мы достигли. Пришло время нам, как индивидуумам, отложить наши давние распри и объединиться. Приливы проигрышной войны настигают нас, и мы должны искать убежища на возвышенности, чтобы не быть смытыми потопом.\nСоединённые Штаты Америки больше не существуют! Какое бы подобие единства и защиты они когда-то ни обеспечивали, это фантом, воспоминание. Когда наши враги остаются без контроля, к кому вы обратитесь за защитой? Разрушения, причинённые социалистами, очевидны. Мы видели, как наши города были оккупированы Партией национального обновления. Мы своими глазами видели, как наши друзья и близкие были закованы в цепи ими. Какими бы беспрецедентными и невообразимыми они ни были, это знаки нашего времени.\nНастало время, мои сограждане гватемальцы, сплотиться под новым знаменем. В единстве - сила. Из многих мы создадим неделимое целое, подчиняющееся только единому трону, и с этого трона я буду наблюдать за вами».\nОсвистывание сторонников PRN утонуло в стоячих овациях толпы."
guatemala.7.a: "Мы будем сражаться за Гватемалу! За Убико!"

guatemala.8.t: "Начальные стратегии"
guatemala.8.d: "По мере того как хаос по всей стране утих, обширные районы оказались под контролем Партии национального обновления. Они пытаются агрессивно расширять свои позиции, и в большинстве городов, которые всё ещё номинально лояльны нам, сформировались подпольные ячейки. Какой будет лучший курс действий?"
guatemala.8.a: "Обеспечить временные границы, ни одной мили не будет уступлено!"
guatemala.8.b: "Сосредоточиться на искоренении оппозиции на лоялистских землях."

guatemala.9.t: "Выбор цели"
guatemala.9.d: "[getgua8], военный штаб должен решить свою стратегию на войну. Должны ли они наступать прямо на горную временную столицу повстанцев Кесальтенанго, быстро покончив с восстанием, но ценой очень дорогого штурма, или попытаться уморить повстанцев голодом, продвигаясь к городу Белиз, а затем отрезать их от мексиканской границы, изолировав их?"
guatemala.9.a: "Они падут как мухи, вперёд, на Кесальтенанго!"
guatemala.9.b: "Мы не должны напрасно тратить честные гватемальские жизни, уморим повстанцев голодом до сдачи."

gua_8_d1: "После того как мы обеспечили наши границы"
gua_8_d2: "После того как город Гватемала и другие городские центры были очищены от любого присутствия PRN"

guatemala.10.t: "Осада города Белиз"
guatemala.10.d: "Поскольку оборона повстанцев перенапряжена, концентрированный удар по их главному порту в Белизе прошёл без проблем. Мы зарегистрировали едва ли какие-либо потери и уже начали марш к мексиканской границе, чтобы окружить остатки сил повстанцев, поскольку их ресурсы становятся всё скуднее. Хотя для всех вовлечённых сторон очевидно, что Мексика сильно помогает восстанию, трусливые социалисты, безусловно, не объявят войну, чтобы защитить своих протеже, даже когда их средства поддержки повстанцев исчезнут."
guatemala.10.a: "Повстанцы знают, что их гибель неизбежна."

guatemala.11.t: "Штурм столицы"
guatemala.11.d: "Когда наши войска заканчивали обеспечивать границу с Мексикой, повстанцы двинулись на город Гватемала! На этот раз они вложили все свои ресурсы в финальную атаку, чтобы заставить нас бежать из столицы и сломить нашу волю. Поскольку значительная часть наших сил охраняет западную границу, эта битва будет тяжёлой. Некоторые генералы даже предложили позволить им войти в столицу, сражаться с ними на улицах, выигрывая время для наших сил, чтобы занять теперь практически беззащитные земли повстанцев."
guatemala.11.a: "Мы никогда не позволим им войти в город Гватемала!"
guatemala.11.b: "Для наших долгосрочных целей будет лучше окрасить нашу столицу в красный цвет кровью."

guatemala.12.t: "Конец гражданской войны"
guatemala.12.d: "После недель боёв на улицах города Гватемала наши войска смогли вернуться в столицу, окружив повстанцев и вынудив их сдаться. Наш победоносный президент призвал к параду на следующий же день. По кровавым улицам Гватемалы войска доблестно прошли парадом, высоко держа флаг Гватемалы, под одобрительные крики народа, который наконец может вкусить мир. [getgua12d]"
guatemala.12.a: "[getgua12a]"
gua_12_d2: "Правительство начало работать над тем, чтобы сделать гражданскую войну просто болезненным воспоминанием, и продолжить путь к лучшей Гватемале, как они это делали последние 18 лет, всё под руководящей рукой Орельяны, нашего дорогого президента."
gua_12_d1: "Правительство уже начало работать над планами по оказанию помощи стране в исцелении и восстановлении, готовясь вступить в новую эру, всё под руководящей рукой Убико."
gua_12_a2: "Да здравствует наш президент!"
gua_12_a1: "Мир наконец. Слава Убико!"

guatemala.13.t: "Памятник нашему победителю"
guatemala.13.d: "По мере восстановления города Гватемала народ (в основном высокопоставленная аристократия) выразил искреннее желание установить статую, посвящённую Убико, чтобы увековечить его роль как человека, который остановил социалистов от разрушения Гватемалы. Она будет построена по подобию героев старины, с Убико на прекрасном коне, держащим саблю вперёд."
guatemala.13.a: "Мы искренне благодарны."

guatemala.14.t: "Восстановление города Гватемала"
guatemala.14.d: "Поскольку город Гватемала был сильно повреждён во время последней стычки с повстанцами, начался большой проект по восстановлению. Убико хочет сделать дороги лучше и шире, чтобы подготовить Гватемалу к тому, чтобы стать столицей для большей Центральной Америки. Однако более скептические члены правительства предложили более разумный план - усилить оборону столицы, чтобы никогда больше не допустить такой кровавой бойни в её границах."
guatemala.14.a: "Гватемала никогда больше не будет под угрозой, восстановим её с величием!"
guatemala.14.b: "Лучше быть консервативным и защищать столицу от будущих угроз."

guatemala.15.t: "Гражданская война!"
guatemala.15.d: "Партия национального обновления использовала дни после письма, чтобы подготовиться к объявлению открытого восстания! Им удалось захватить Кесальтенанго и город Белиз, а также большую часть земель между ними и мексиканской границей. Правительство находится в замешательстве, пытаясь разработать план стабилизации ситуации и победить повстанцев."
guatemala.15.a: "Мятежная мразь!"

guatemala.16.t: "Катастрофа!"
guatemala.16.d: "Кесальтенанго оказался грозной крепостью. Лоялистские армии увязли в его оборонительных слоях и несли гораздо большие потери, чем повстанцы. Чувствуя отчаяние, правительство отправляло всё больше и больше войск для помощи в осаде. После того как оборона города Гватемала была достаточно ослаблена, члены PRN, скрывавшиеся в городе, вышли и смогли уничтожить слабо защищённое руководство! Высшие эшелоны впали в анархию, большинство из них бежали, в то время как PRN захватила страну. Услышав эту новость, армия, уставшая после боёв, подняла белый флаг."
guatemala.16.a: "Да здравствует гватемальская свобода!"

guatemala.17.t: "Победа!"
guatemala.17.d: "Бои были жестокими. Повстанцы превратили Кесальтенанго в грозную крепость. Мы понесли тяжёлые потери. Нам пришлось отдать все наши резервы для битвы. Столица была практически беззащитна. Однако мы преуспели. Мы прорвали их линии вчера и захватили их лидеров. Поскольку большинство повстанцев были в этом городе, восстание было фактически сломлено. После краткой передышки армия прошла маршем по остальной части страны и обеспечила поражение всех оставшихся очагов."
guatemala.17.a: "Гватемала наконец обретает мир!"

guatemala.18.t: "Цена гордости"
guatemala.18.d: "Отказываясь позволить повстанцам осквернить столицу, защитники собрались перед городом Гватемала. Битва была кровавой, с большими потерями с обеих сторон, но численное превосходство повстанцев взяло верх над меньшей армией защитников. Когда стало ясно, что повстанцы победят, правительство бежало из столицы, оставив её открытой для освобождения PRN. Услышав эту новость, остальная армия, разбросанная по мексиканской границе, согласилась сложить оружие и присягнуть на верность новому правительству."
guatemala.18.a: "Свобода наконец!"

guatemala.19.t: "Судьба Сальвадора"
guatemala.19.d: "Сальвадор покраснел! Хотя нам удалось подавить восстание на нашей земле, похоже, у них это не получилось. Наше правительство решило подготовиться к войне, чтобы освободить наших братьев!"
guatemala.19.a: "К оружию!"

guatemala.22.t: "Выборы [GetYear] года"
guatemala.22.d: "Выборы - здоровая часть любой демократии. К сожалению, в Гватемале они редко были честными: оппозиция либо отсутствовала, либо была в крайне невыгодном положении, и имело место избирательное насилие. Крупное событие в демократической весне Гватемалы произойдёт с проведением свободных и честных выборов. Революционная коалиция, выполнив свою цель по свержению либеральной диктатуры и восстановлению порядка после гражданской войны, будет распущена, и каждая партия будет участвовать в выборах. Это, вероятно, будет близкое соперничество, поскольку каждая партия имеет отдельную и устоявшуюся базу поддержки: Юнионистская партия обращается к консервативным, религиозным людям, PRN представляет прогрессивную молодёжь, а FLP стремится повлиять на рабочих и крестьян."
guatemala.22.a: "Духовный социализм и PRN приведут Гватемалу в будущее."
guatemala.22.b: "Витализм и центральноамериканская мечта царят."
guatemala.22.c: "Неожиданно FLP выходит победителем."

guatemala.23.t: "Контрреволюция!"
guatemala.23.d: "Убико вернулся с армией наёмников, оплаченной UFC! Он высадился в Белизе и начал марш на столицу, в то время как мы пытаемся подготовить оборону, чтобы встретить его в бою, хотя мы сильно ослаблены из-за предыдущей гражданской войны."
guatemala.23.a: "Убико побеждает правительство!"
guatemala.23.b: "Убико остановлен, революция спасена!"

guatemala.69.t: "Военно-морская катастрофа"
guatemala.69.d: "Когда у гватемальского флота наконец появилось больше одного одинокого корабля, их отправили на тренировки по построению. Однако полная некомпетентность недавно обученных моряков привела к тому, что один из кораблей во время тренировок по стрельбе врезался в другой, вызвав его опрокидывание. Опасаясь негативной реакции народа на то, что столько денег было потрачено впустую, пропагандистская машина Убико попыталась представить это как реконструкцию Трафальгарской битвы."
guatemala.69.a: "Это... интересный поворот событий."

guatemala.100.t: "Никто не осмелился покинуть храм!"
guatemala.100.d: "Наследие экстравагантности и гедонизма, которое олицетворяет президент Кабрера, всё ещё разбросано по всей Гватемале в виде Минерванских храмов. Эти здания использовались для Fiestas Minervalias - праздника, придуманного самим Кабрерой. В те дни можно было увидеть поющих детей, танцы и очень нехристианские аттракционы. Теперь храмы заброшены, и местные священники следят за тем, чтобы никаких празднеств не проводилось. На этом их использование могло бы закончиться, если бы не наше изобретательное правительство. Они предложили превратить эти залы порока в бейсбольные поля для детей или перестроить их в жильё. Правые предпочли бы видеть их как бейсбольные поля, в то время как левые считают нашу жилищную проблему достаточно важной, чтобы застроить их."
guatemala.100.a: "Бейсбольные поля."
guatemala.100.b: "Дома."

guatemala.101.t: "Конфликты в Юнионистской партии"
guatemala.101.d: "Сегодня фракция Юнионистской партии во главе с Хосе Асмитией и другая во главе с Ласаро Чаконом Гонсалесом вступили в открытый конфликт из-за разногласий по поводу власти президента в стране. В то время как Гонсалес защищает более централизованное государство, которое даёт больше власти президенту, Асмития опасается, что это просто превратит Гонсалеса в очередного диктатора для Гватемалы, и их разногласия наконец перекинулись на их последователей, которые открыто столкнулись. Однако оба мужчины встретились и сделали совместное публичное заявление, утверждая, что уладили свои разногласия, чтобы поддерживать страну в рабочем состоянии. Однако неясно, действительно ли они примирились или просто объединяются по необходимости..."
guatemala.101.a: "Будем надеяться, что они действительно примирились."

guatemala.102.t: "Развитие центральноамериканской мысли"
guatemala.102.d: "Одной из главных целей Юнионистской партии с момента её основания было укрепление идеи центральноамериканского образа мышления, а также установление Гватемалы как ключевого игрока в независимости Центральной Америки в целом. Хотя процесс внедрения этих концепций будет медленным, мы начинаем видеть первые признаки улучшения в наших школах, где теперь многие помнят Гватемалу как лидера движения за независимость Центральной Америки."
guatemala.102.a: "Юнионисты достигают своих целей."

guatemala.103.t: "Разбирательство с Аревало"
guatemala.103.d: "Теперь, когда наш союз с FLP разорван, мы должны разобраться с остатками PPN, которые держали нас вместе. Хуан Хосе Аревало, лидер PPN и человек, который пытался удержать PU и FLP вместе против авторитаризма, теперь остаётся под вопросом из-за своих действий во времена таких кризисов. Хотя он, безусловно, помог нам укрепить нашу позицию и захватить власть, он также оказывал помощь PFLP, иногда даже принимая их сторону во внутренних спорах в дни нашей коалиции, и он мог бы переметнуться на их сторону, если бы они захватили власть вместо нас. Именно поэтому многие в нашей партии не доверяют Аревало и требуют выслать его из страны как предателя. Что нам делать?"
guatemala.103.a: "Выслать его, ему здесь не место."
guatemala.103.b: "Все мы совершаем ошибки, он всё ещё союзник."

guatemala.104.t: "Доктор Джон Катлер предлагает эксперименты на гражданах Гватемалы за деньги"
guatemala.104.d: "Сегодня поступил звонок от некоего доктора Джона Катлера с просьбой о встрече с президентом. Не видя вреда, встреча была предоставлена, и последовало одно из самых страшных, но интересных предложений в истории Гватемалы. Доктор Катлер - старший член Службы общественного здравоохранения США, авторитет в области профилактики заболеваний. Он предлагает испытать эффективность пенициллина в предотвращении сифилиса на выбранной группе гватемальцев. Причина, по которой была выбрана Гватемала, как утверждает Катлер, заключается в том, что наш народ живёт в изолированных сообществах, где можно быть уверенным, что венерические заболевания не распространятся далеко. Хотя это предложение и оплата привлекательны, приходится задаться вопросом, почему Катлер так готов импортировать лекарства с такими большими затратами."
guatemala.104.a: "Принять болезнь."
guatemala.104.b: "Возмутительно! Убирайтесь отсюда."

guatemala.105.t: "Представляем мисс Чикиту"
guatemala.105.d: "Бананы как продукт питания больше не являются экзотическим товаром для американских покупателей. Этого и следовало ожидать после нескольких десятилетий бизнеса. Чего не ожидали, так это конкуренции со стороны таких, как Dole на Гавайях, которые мутили воду в свою пользу. Мы поручили Дику Брауну разработать талисман для нашего бананового подразделения, который вновь привлечёт внимание молодёжи. Её зовут мисс Чикита, и её песни и танцы теперь украшают радиопередачи и газеты по всей Америке. Продажи также выросли."
guatemala.105.a: "Даже джингл работает."

guatemala.106.t: "Заговор призрачных убийц против Убико!"
guatemala.106.d: "Заговор с целью убийства нашего любимого Убико был сегодня раскрыт нашей разведывательной службой. Он детализировал чрезвычайно сложный план проникновения в Каса Крема и отравления президента. Однако наша разведывательная служба ещё не смогла установить личность преступников, и поскольку слухи о заговоре удобно просочились в прессу, нам нужно выбрать козла отпущения, которого можно обвинить в этом скандале."
guatemala.106.a: "За этим стоят социалисты."
guatemala.106.b: "За этим стоят либералы."

french_guatemala.1.t: "Будущее Империи"
french_guatemala.1.d: "Император, его армия и его верные подданные смогли защитить Центральную Америку от всех, кто нападал на нашу законную территорию, от социалистических революционеров до националистических повстанцев и либеральных реформаторов - все они объединились в своей ненависти к нашему Императору. Теперь, когда мы победили этих вредителей, мы можем вздохнуть спокойно, однако возникает вопрос о будущем нашей Империи, и наш Император должен сделать выбор, который будет решающим для нации.\n\nУ нас есть два варианта: либо мы решаем создать Империю по образцу той, что построил Наполеон I, кумир нашего Императора, как мы изначально и планировали; однако Убико также восхищается Бонапартами в целом, включая Наполеона III, племянника Наполеона I и лидера Второй Французской империи. Мы могли бы построить наш режим по образцу государства, созданного этим почтенным человеком - империи, которая была бы менее милитаризированной, более социальной и либеральной, но столь же славной.\n\nУбико - единственный, кто может выбирать, и в конце концов он решит, что..."
french_guatemala.1.a: "Я пойду по стопам великого Наполеона!"
french_guatemala.1.b: "Не будем повторять ошибки прошлого, я буду Либеральным императором, как Наполеон III!"

french_guatemala.2.t: "Какие полномочия у законодательной власти?"
french_guatemala.2.d: "Вместе с нашим решением создать Либеральную империю приходит создание законодательного органа, задача которого - помогать императору Убико в управлении его обширным доменом. Этот законодательный орган основан на образце Второй Французской империи и состоит из Верхней палаты - Сената - и Нижней палаты - Законодательного корпуса.\n\nЭти две палаты избираются прямым всеобщим мужским голосованием граждан Империи старше 20 лет. Конечно, несколько партий будут иметь право баллотироваться на должности, но мы также переняли концепцию «официального кандидата» Второй империи, который пользуется преимуществами во время своей кампании, а также большой известностью, обеспечиваемой государством, что гарантирует нам комфортное большинство в палатах.\n\nОднако вопрос, который возникает всё чаще: каковы будут реальные полномочия двух палат? Некоторые советники Императора выразили поддержку Сенату и Законодательному корпусу, которые имели бы только почётные полномочия и, следовательно, были бы только представительными, в то время как другие выражают желание иметь палаты с законодательной властью, но с созданием особого права вето, которым обладает только сам Император и которое он может использовать по своему усмотрению, что будет ограничивать полномочия палат.\n\nУбико рассмотрел оба предложения и теперь готов сделать выбор."
french_guatemala.2.a: "Представительного собрания будет достаточно."
french_guatemala.2.b: "Дать им символические полномочия..."

french_guatemala.3.t: "Наши кровные братья наконец в мирном месте"
french_guatemala.3.d: "Это был мрачный день, когда мы узнали о падении законного французского правительства Алжира, как для императора Убико, так и для его подданных - наши братья снова пали перед красными, жаждущими крови и эксплуатации.\n\nОднако Убико не из тех, кто бросает своих братьев один на один с врагом! Услышав эту новость, Император поспешил декретировать немедленный и безоговорочный приём французских беженцев, спасающихся со своими семьями от хаоса и разрушений, распространяемых красной гидрой. Наш призыв не остался неуслышанным, поскольку французы стекаются в Центральную Америку - Империю, которая напоминает им о доме, и где они теперь будут жить в мире. В дополнение к многочисленным гражданским лицам, многие военные офицеры и почтенные ветераны, такие как Шарль де Голль, Франсуа Дарлан, Максим Вейган и Альфонс Жюэн, также нашли путь в наши земли, представляя себя лидерами французских изгнанников.\n\nУбико пригласил их в Императорский дворец, чтобы обсудить и отпраздновать нашу дружбу; экстравагантная церемония прошла идеально и восхитила Императора. Однако некоторые слухи говорят, что счастье не разделяют изгнанные офицеры, которые планируют захватить власть, свергнув того, кого они называют «ложным императором». Конечно, Убико не верит этим слухам - наши французские друзья-ветераны заслуживают доверия!"
french_guatemala.3.a: "Французы встречают французов!"

french_guatemala.4.t: "Французские изгнанники пытаются совершить переворот!"
french_guatemala.4.d: "Жители имперской столицы проснулись сегодня под звуки солдатских сапог и французских военных маршей - зрелище, нормальное при Убико в Центральной Америке, но скрывающее совершенно иную реальность.\n\nВойска французских изгнанников под руководством Шарля де Голля, Франсуа Дарлана и многих других французских младших офицеров окружили столицу со всех сторон, пока Убико всё ещё мирно спал. В речи перед своей армией генерал де Голль осудил Убико как ложного императора и узурпатора, который воображал себя французом, не будучи им на самом деле; он также провозгласил земли Центральной Америки как принадлежащие новой Французской Республике, объявив себя временным президентом Республики. Он потребовал немедленной сдачи войск Императора и заявил, что не хочет проливать кровь.\n\nУбико был потрясён, услышав эту новость, когда проснулся. Он выступил с радиообращением, призвав имперские войска, верные Империи, и французских изгнанников как можно скорее присоединиться к нему в столице для борьбы с мятежниками.\n\nВерные войска из бывшей Никарагуа, состоящие как из материковых французов, так и из центральноамериканских французов, прибыли некоторое время назад. Теперь начнётся кровавая битва, которая определит выживание Империи..."
french_guatemala.4.a: "Армия и верные изгнанники побеждают ложных французов! Pour l'Empereur!"
french_guatemala.4.b: "Клика изгнанников и де Голль окружает столицу и свергает ложного императора!"

french_guatemala.5.t: "Лидер для хунты?"
french_guatemala.5.d: "Теперь, когда мы провозгласили Французскую Республику, захватили Императора, а его сторонники засели в джунглях Центральной Америки, ведя отчаянную партизанскую войну, мы должны решить будущее нашей новой Франции.\n\nВременная конституция была разработана в последние дни армией под руководством Генерала, создав сильное и авторитарное президентство, как он и задумывал, а также создав Национальную ассамблею, но она была немедленно приостановлена из-за «чрезвычайного положения» до дальнейшего уведомления, при этом армия фактически удерживает всю власть при режиме, известном как «Французское правительство национального спасения» (GFSN), причём временное правительство уже сформировано и состоит из подавляющего большинства военных. Однако хунта должна назначить президента после голосования среди офицеров, чтобы он был по-настоящему легитимным. Доступны три основных кандидата.\n\nПервый и самый очевидный - сам генерал де Голль, протеже Льва Вердена Петена и выдающийся офицер, он также талантливый и компетентный администратор. Второй выбор - адмирал Дарлан, лидер морских офицеров и ветеран войны, он, несомненно, станет отличным президентом. Третий выбор - гражданский политик и юрист Жан-Луи Тиксье-Виньянкур, который привлёк внимание хунты тем, что защищал наши самые противоречивые действия, обозначенные международным сообществом как «военные преступления», как оправданные и справедливые; он, несомненно, станет идеальным номинальным президентом для GFSN, и тот факт, что он политик, даёт нам больше легитимности.\n\nГолосование только что закончилось, и победитель президентской гонки —..."
french_guatemala.5.a: "Де Голль никогда нас не подводил!"
french_guatemala.5.b: "Опыт Дарлана сильно поможет нам!"
french_guatemala.5.c: "Нам нужен гражданский номинальный лидер, Тиксье-Виньянкур идеально подходит на эту роль!"

french_guatemala.6.t: "Новая Франция!"
french_guatemala.6.d: "Продвигаясь с идеями «офранцуживания» нашего нового домена здесь, в Центральной Америке, [root.getleader] решил переименовать наше государство изгнанников. Соответствуя нашему положению в Новом Свете, недалеко от старого колониального сердца павшей Французской империи, он начал называть наше государство «Нувель-Франс», отсылая к колониальным просторам, которые когда-то сделали Францию доминирующей колониальной державой на планете. По мере того как остальная часть правительства и изгнанники начинают сплачиваться вокруг этого патриотического нового прозвища, наш культурный ренессанс и процесс офранцуживания будут только продолжать расти, распространяться и процветать, поскольку мы пытаемся создать второе французское государство изгнанников после восхождения мерзкой Коммуны."
french_guatemala.6.a: "Montjoie Saint Denis!"
french_guatemala.6.b: "Но подождите... разве это не НОВАЯ Новая Франция??"

french_guatemala.7.t: "Наши старые владения в Америке"
french_guatemala.7.d: "Нувель-Франс восстаёт, но мы всё ещё тень нашего прежнего «я». Французская колониальная империя когда-то простиралась от Флориды до Монтаны, от Луизианы до Квебека и далее, но теперь мы существуем как изгнанники из изгнанников, прижатые спиной к стене, но судьба, возможно, наконец снова стучится в дверь. Хотя это и маловероятно, мы могли бы попытаться войти в эти бывшие наши земли и продолжить борьбу наших предков, работая над исправлением их потерь и неудач, чтобы снова принести славу французскому народу. Конечно, многие выступают против этого шага на том основании, что мы не в состоянии бросить вызов гегемонам Нового Света, но что они знают?\n\nДолой унизительный Парижский договор 1763 года! Долой мерзкую Гаитянскую революцию! Долой вероломную продажу Луизианы! Долой каждую последнюю ошибку и глупость старой Империи, ибо она возродится в крещении пламенем и славой. Давайте отменим все эти позоры и не только, когда мы будем маршировать обратно в просторные и прибыльные просторы Северной Америки, чтобы вернуть то, что по праву и истине принадлежит нам! Vive la France!"
french_guatemala.7.a: "Поднимите Орифламму высоко снова!"
french_guatemala.7.b: "Мы поразим Мексику, Америку и спасём наших братьев-квебекцев!"
french_guatemala.7.c: "Забудьте об этих нелепых амбициях и сосредоточьтесь на реалистичных развитиях."

french_guatemala.8.t: "Наша победа над янки"
french_guatemala.8.d: "Вопреки всем трудностям и ожиданиям, Нувель-Франс теперь доминирует над своими старыми землями. Американцы пали, и чёрное пятно наших колониальных потерь наконец-то полностью стёрто. Продажа Луизианы отменена, а остальные наши земли в Северной Америке находятся всего в шаге от нас. Наконец, давайте закончим это и объединим французские земли Северной Америки раз и навсегда, чтобы мы могли наконец построить нашу собственную новую и лучшую Францию прямо здесь, свободную от ошибок Старого порядка и Старого Света."
french_guatemala.8.a: "Liberté, Fraternité, Ordre Public!"
french_guatemala.8.b: "Profitons du bon temps là où nous sommes!"

french_guatemala.9.t: "Воссоединиться с Антантой?"
french_guatemala.9.d: "Теперь мы обеспечили наше новое королевство на земле бывшей Гватемалы, и остаётся один вопрос: должны ли мы снова присоединиться к нашим британским братьям в их войне за освобождение или идти в одиночку? Большинство наших правительственных чиновников и военных деятелей считают, что союз с британцами - наш лучший шанс на выживание, однако небольшая, но громкая клика вокруг де Голля винит Альбион в нашей неудаче с самого начала. Что нам делать?"
french_guatemala.9.a: "Un toast à nos amis anglais!"
french_guatemala.9.b: "Мы проиграли из-за них с самого начала."

