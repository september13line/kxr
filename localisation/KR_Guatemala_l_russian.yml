### Ideas ###
GUA_socialist_compensation: "Компенсация социалистам"
GUA_socialist_compensation_desc: "Во многом благодаря мексиканскому финансированию, в Гватемале начались социалистические забастовки на железных дорогах и верфях. Правительство вынужденно пойти на уступки, выплатить компенсацию рабочим и пообещать провести реформы."

GUA_socialist_compensation_2: "Компенсация социалистам"
GUA_socialist_compensation_2_desc: "Во многом благодаря мексиканскому финансированию, в Гватемале начались социалистические забастовки на железных дорогах и верфях. Правительство вынужденно пойти на уступки, выплатить компенсацию рабочим и пообещать провести реформы."

GUA_united_fruit: "Юнайтед Фрут Компани"
GUA_united_fruit_desc: "Юнайтед Фрут Компани контролировала Гватемальскую экономику и политику со времен диктатуры Кабреры в 1898 году. Благодаря UFC наша экономика смогла обрести равновесие, однако это ставит регионы нашей страны в зависимость от частной американской кампании. В настоящее время она контролирует §Y[?UFC_power]%§! нашей земли.\n§WЭто дает следующие эффекты:§!\n§WПрирост политической власти:§! §R-[?UFC_effect1]§!\n§WСкорость строительства:§! §G+[?UFC_effect2]%§!\n§WФабрики, производящие товары народного потребления:§! §Y-[?UFC_effect3].0%§!\n§WПоддержка войны:§! §R-[?UFC_effect4]%§!"

CEN_united_fruit_land: "Юнайтед Фрут Компани"

GUA_illiteracy: "Неграмотность"
GUA_illiteracy_desc: "Неграмотность глубоко укоренилась в Гватемале. В начале правления Орельяны, уровень неграмотности населения составлял 96%. Но, благодаря начатым реформам, на сегодняшний день уровень безграмотности составляет 75%. Однако это всё ещё огромная проблема, которая будет преследовать нас до тех пор, пока не будут проведены серьезные реформы."

GUA_illiteracy_2: "Неграмотность"
GUA_illiteracy_2_desc: "Неграмотность глубоко укоренилась в Гватемале. В начале правления Орельяны, уровень неграмотности населения составлял 96%. Но, благодаря начатым реформам, на сегодняшний день уровень безграмотности составляет 75%. Однако это всё ещё огромная проблема, которая будет преследовать нас до тех пор, пока не будут проведены серьезные реформы."

