GUA_united_fruit: "United Fruit Company"
GUA_united_fruit_desc: "United Fruit Company прочно удерживает контроль над политикой и экономикой Гватемалы со времён диктатуры Кабреры в 1898 году. Хотя в результате этого Гватемала увидела значительное экономическое развитие, это привело к тому, что United Fruit Company держит судьбу Гватемалы на весах. В настоящее время она контролирует §Y[?UFC_power]%§! наших земель.\n§WЭто даёт нам следующие эффекты:§!\n§WDaily Political Power Gain:§! §R-[?UFC_effect1]§!\n§WConstruction Speed:§! §G+[?UFC_effect2]%§!\n§WConsumer Goods Factories:§! §Y-[?UFC_effect3]%§!\n§WWar Support:§! §R-[?UFC_effect4]%§!"

