RULE_OPTION_RUS_1936_ELECTIONS_NSNP_DEM_DESC: "$RULE_OPTION_RUS_1936_ELECTIONS_NSNP$ Позже они превращаются в §gхристианско-демократическую§! партию.\n§RТребуется:§!\n§C$RULE_OPTION_RUS_POST_ASSASSINATION_ELECTIONS$§! в §Y$RUS_POST_ASSASSINATION$§!"
RULE_OPTION_RUS_1936_ELECTIONS_NSNP_CORP: "£KR_game_rule_flag_RUS   НСНП - корпоративисты"
