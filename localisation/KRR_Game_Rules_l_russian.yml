RULE_OPTION_RUS_1936_ELECTIONS_NSNP: "£KR_game_rule_flag_RUS   Солидаристы"
RULE_OPTION_RUS_1936_ELECTIONS_NSNP_DESC: "Следующие выборы в России выигрывает §kНациональный союз нового поколения§!, широко известный как солидаристы.\n§RТребуется:§!\n§C$RULE_OPTION_RUS_POST_ASSASSINATION_ELECTIONS$§! в §Y$RUS_POST_ASSASSINATION$§!"
