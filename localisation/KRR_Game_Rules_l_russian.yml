RULE_OPTION_UZB_FOREIGN_BHC_DESC: "Хива решает присоединиться к Восточному социалистическому альянсу коммуны Бхаратия.\n§RТребуется:§!\n§C$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_SOCDEM$§! в §Y$UZB_PATH$§!"
RULE_OPTION_UZB_FOREIGN_SKM: "£KR_game_rule_flag_UZB_totalist  £KR_game_rule_flag_SKM_radical_socialist   Гармоничное соглашение народов."
RULE_OPTION_UZB_FOREIGN_SKM_DESC: "Хива решает присоединиться к Соглашению гармоничных народов Сиккима.\n§RТребуется:§!\n§C$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_SOCDEM$§! в §Y$UZB_PATH$§!"
RULE_OPTION_UZB_FOREIGN_CHI: "£KR_game_rule_flag_UZB_totalist  £KR_game_rule_flag_CHI   Интернационал Востока"
RULE_OPTION_UZB_FOREIGN_CHI_DESC: "Хива решает присоединиться к Восточному интернационалу левого Гоминьдана.\n§RТребуется:§!\n§C$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_SOCDEM$§! в §Y$UZB_PATH$§!"
RULE_OPTION_UZB_FOREIGN_RUS: "£KR_game_rule_flag_UZB  £KR_game_rule_flag_RUS   Союз с Россией"
RULE_OPTION_UZB_FOREIGN_RUS_DESC: "Хива решает присоединиться к Русскому альянсу.\n§RТребуется:§!\n§C$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_PROGRESSIVES$§! или §C$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_MODERATES$§! в §Y$UZB_PATH$§! и §CРоссия должна стать либеральной республикой§!;\n§GOR§!\n §C$RULE_OPTION_UZB_PATH_ABS_MON_RUSSOPHILE$§! в §Y$UZB_PATH$§! и §CРоссия должна быть консервативной монархией§!"
RULE_OPTION_UZB_FOREIGN_AFG: "£KR_game_rule_flag_UZB  £KR_game_rule_flag_AFG   Кабульский пакт"
