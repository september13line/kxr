CRM_PATH: "£KR_game_rule_flag_CRM   Последствия восстания татар"
RULE_OPTION_CRM_PATH_RANDOM: "По умолчанию"
RULE_OPTION_CRM_PATH_RANDOM_DESC: "За власть на Крымском полуострове борются различные политические деятели, имеющие равные шансы на приход к власти."
RULE_OPTION_CRM_LENINIST: "£KR_game_rule_flag_CRM_radsoc   Второе пришествие Ленина"
RULE_OPTION_CRM_LENINIST_DESC: "Младший брат Ленина, Дмитрий Ульянов, приплывает в Крым, возглавляет забастовку рабочих против крымских татар, захватывает власть и провозглашает Крымскую Советскую Республику. Впоследствии он возвращает себе наследие брата и пытается завоевать всю Россию."
RULE_OPTION_CRM_LIBSOC_REPUBLIC: "£KR_game_rule_flag_CRM_fed   Социалистическая программа"
RULE_OPTION_CRM_LIBSOC_REPUBLIC_DESC: "После провозглашения независимости Крыма правительство принимает решение о переходе страны к социалистической республике."
RULE_OPTION_CRM_MARLIB_REPUBLIC: "£KR_game_rule_flag_CRM   Народники"
RULE_OPTION_CRM_MARLIB_REPUBLIC_DESC: "После провозглашения независимости Крыма правительство решает следовать своей программе, разработанной под влиянием народничества."
RULE_OPTION_CRM_AUTHDEM_REPUBLIC: "£KR_game_rule_flag_CRM   Кемалистское большинство"
RULE_OPTION_CRM_AUTHDEM_REPUBLIC_DESC: "После провозглашения независимости Крыма правительство принимает решение о новом повороте и превращает Крым в националистическую, кемалистскую республику."
RULE_OPTION_CRM_KHANATE: "£KR_game_rule_flag_CRM_khan   Крымское Ханство"
RULE_OPTION_CRM_KHANATE_DESC: "После провозглашения независимости Крыма правительство восстанавливает Крымское Ханство, новым ханом которого становится султан Кадыр из династии Гиреев."
RULE_OPTION_CRM_GERMAN_PUPPET: "£KR_game_rule_flag_CRM_GER   Кронколония Крим-Тауриен"
RULE_OPTION_CRM_GERMAN_PUPPET_DESC: "Восстание местного населения подавлено, и Германия принимает решение о создании колонии Крым-Таврида, как и планировалось два десятилетия назад."
RULE_OPTION_CRM_KHAZARS: "£KR_game_rule_flag_CRM_khaz   Возрождение Хазарского Каганата"
RULE_OPTION_CRM_KHAZARS_DESC: "После провозглашения независимости Крыма к власти приходят караимы, а караимский гахан Серая Шапшал восстанавливает Хазарский Каганат."

CRM_FOREIGN_PATH: "£KR_game_rule_flag_CRM   Внешняя политика Крыма"
