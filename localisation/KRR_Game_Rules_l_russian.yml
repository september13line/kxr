RULE_OPTION_UZB_FOREIGN_FRA_DESC: "Хива решает присоединиться к Интернационалу.\n§RТребуется:§!\n§C$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_SOCDEM$§! в §Y$UZB_PATH$§!"
