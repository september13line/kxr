RULE_OPTION_TRK_FOREIGN_UKR_DESC: "Туркестан решает присоединиться к Интернационалу.\n§RТребуется:§!\n§C$RULE_OPTION_TRK_PATH_SYNDIE$§! или §C$RULE_OPTION_TRK_PATH_RADSOC$§! в §Y$TRK_PATH$§!"
