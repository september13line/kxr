UZB_PATH: "£KR_game_rule_flag_UZB   Вселенский сад"
RULE_OPTION_UZB_PATH_DEFAULT: "По умолчанию"
RULE_OPTION_UZB_PATH_DEFAULT_DESC: "Бухарский эмират, самое сильное из государств Центральной Азии, управляется централизованным Советом министров, который слишком долго двигал политику в ультраправом направлении. Возможно, страна остро нуждается в реформах, даже самых радикальных."
RULE_OPTION_UZB_PATH_REVOLUTION: "£KR_game_rule_flag_UZB_totalist   Социалистическая революция"
RULE_OPTION_UZB_PATH_REVOLUTION_DESC: "В стране вспыхнуло восстание социалистов. Лидеру протеста Абдулкадыру Мухитдинову удалось захватить власть."
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA: "£KR_game_rule_flag_UZB   Молодая бухарская революция"
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_DESC: "Партия «Молодая Бухара» окончательно свергла правительство Эмира и установила в Бухаре либеральную республику."
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_SOCDEM: "£KR_game_rule_flag_UZB   Молодая Бухара - Пантюркисты"
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_SOCDEM_DESC: "$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_DESC$ Позже фракция Усмана Ходжи §MПан-тюркистов§! приходит к власти"
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_PROGRESSIVES: "£KR_game_rule_flag_UZB   Молодая Бухара - Прогрессисты"
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_PROGRESSIVES_DESC: "$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_DESC$ Позже фракция §lПрогрессивистов§! Абдулвахида Бурхонова избрана."
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_MODERATES: "£KR_game_rule_flag_UZB   Молодая Бухара - Умеренные"
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_MODERATES_DESC: "$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_DESC$ Позже фракция §mУмеренных§! Садриддина Айни избрана."
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_AUTHDEM: "£KR_game_rule_flag_UZB   Молодой Туркестан Вали Каюма"
RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_AUTHDEM_DESC: "$RULE_OPTION_UZB_PATH_YOUNG_BUKHARA_DESC$ На следующих выборах Вали Каюм создаёт §gШокайитскую пантюркистскую§! партию и выигрывает выборы."
RULE_OPTION_UZB_PATH_ABS_MON: "£KR_game_rule_flag_UZB_emirate   Эмир укрепляет свою власть"
RULE_OPTION_UZB_PATH_ABS_MON_DESC: "Эмиру удалось закрепить своё правление в качестве автократической диктатуры."
RULE_OPTION_UZB_PATH_ABS_MON_RUSSOPHILE: "£KR_game_rule_flag_UZB_emirate   Русофил Кушбеги"
RULE_OPTION_UZB_PATH_ABS_MON_RUSSOPHILE_DESC: "$RULE_OPTION_UZB_PATH_ABS_MON_DESC$ Позже он решает оставить на своем посту кушбеги Низомиддина Урганджи."
RULE_OPTION_UZB_PATH_ABS_MON_IBRAHIM: "£KR_game_rule_flag_UZB_emirate   Националистический Кушбеги"
RULE_OPTION_UZB_PATH_ABS_MON_IBRAHIM_DESC: "$RULE_OPTION_UZB_PATH_ABS_MON_DESC$ Позже он решает выбрать Ибрагим-бека новым кушбеги."
RULE_OPTION_UZB_PATH_BASMACHI: "£KR_game_rule_flag_UZB_emirate   Захват власти Ибрагим-беем"
RULE_OPTION_UZB_PATH_BASMACHI_DESC: "После Молодой бухарской революции басмачи успешно взяли власть в свои руки, превратив Бухару в свою вотчину"
RULE_OPTION_UZB_PATH_BASMACHI_RESTORATION: "£KR_game_rule_flag_UZB_emirate   Восстановление Мангуда"
RULE_OPTION_UZB_PATH_BASMACHI_RESTORATION_DESC: "После Молодой Бухарской революции басмачи успешно взяли власть в свои руки, вернув Эмира на трон."
RULE_OPTION_UZB_PATH_BRITISH: "£KR_game_rule_flag_UZB_british   Пробританский переворот Уилфрида Маллесона"
RULE_OPTION_UZB_PATH_BRITISH_DESC: "После того как моджахеды проиграли революционным силам, британская военная миссия под командованием Уилфрида Маллесона восстанавливает контроль и возвращает Бухару под власть Великобритании.\n§RТребуется:§!\n§C$RULE_OPTION_AFG_PATH_DOMINION$§! в §Y$AFG_PATH$§!"


UZB_FOREIGN: "£KR_game_rule_flag_UZB   Внешняя политика Бухары"
RULE_OPTION_UZB_FOREIGN_DEFAULT: "По умолчанию"
RULE_OPTION_UZB_FOREIGN_DEFAULT_DESC: "После того как Бухара объединила всю Среднюю Азию, она стремится присоединиться к любому мировому союзу или остаться нейтральной."
RULE_OPTION_UZB_FOREIGN_SOV: "£KR_game_rule_flag_UZB_totalist  £KR_game_rule_flag_SOV   Четвёртый Интернационал"
RULE_OPTION_UZB_FOREIGN_SOV_DESC: "Хива решает присоединиться к Четвертому Интернационалу России\n§RТребуется:§!\n§C$RULE_OPTION_UZB_PATH_REVOLUTION$§! в §Y$UZB_PATH$§!"
