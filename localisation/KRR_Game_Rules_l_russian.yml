RULE_OPTION_RUS_AFTERMATH_OF_KORNILOV_DENIKIN_DESC: "Во время своего правления §PЛавр Корнилов§! становится Верховным правителем России и назначает §PАнтона Деникина§! своим преемником.\n§RТребуется:§!\n§C$RULE_OPTION_RUS_POST_ASSASSINATION_JUNTA$§! в §Y$RUS_POST_ASSASSINATION$§!"
