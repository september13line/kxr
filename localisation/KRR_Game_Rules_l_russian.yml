RULE_OPTION_ORE_FOREIGN_UCH_DESC: "В связи с революцией в России атаман Дутов решает, что лучшей стратегией обороны будет объединение всех казачьих войск под эгидой Оренбурга для совместного сопротивления.\n§RТребуется:§!\n§CГражданская война в России§!"
