RULE_OPTION_KYR_INDEPENDENCE_NOT_DESC: "Алаш Орда отказался вмешиваться в Гражданскую войну в Туркестане."

KYR_PATH: "£KR_game_rule_flag_KYR  Повстанческое движение в Южном Кыргызстане"
RULE_OPTION_KYR_PATH_RANDOM: "По умолчанию"
RULE_OPTION_KYR_PATH_RANDOM_DESC: "Горная Кыргызская Республика была создана отделением партии «Алаш» в Пишпеке во время гражданской войны в Туркестане. Удастся ли им эффективно справиться с восстанием моджахедов на юге, неизвестно."
RULE_OPTION_KYR_PATH_RADSOC: "£KR_game_rule_flag_KYR_radical_socialist  Переворот Айдарбекова"
RULE_OPTION_KYR_PATH_RADSOC_DESC: "Партия «Алаш» не справляется с восстанием моджахедов, что приводит к социалистической революции. К власти в регионе приходит Иманалы Айдарбеков, лидер §NКыргызской социалистической партии§!"
RULE_OPTION_KYR_PATH_SOCDEM: "£KR_game_rule_flag_KYR  Пишпекский филиал Алаш"
RULE_OPTION_KYR_PATH_SOCDEM_DESC: "Партия «Алаш» успешно справляется с восстанием моджахедов, под руководством Абдыкерима Сыдыкова отделение §Mпартии «Алаш»§! в Пишпеке начинает реформы."
RULE_OPTION_KYR_PATH_PATAUT: "£KR_game_rule_flag_TRK_national_populist  Победа моджахедов"
RULE_OPTION_KYR_PATH_PATAUT_DESC: "И партия «Алаш», и Кыргызская социалистическая партия не справляются с восстанием. Как только к власти в Кыргызстане приходит §Pмухиддин-бей§!, регион немедленно присоединяется к Туркестану."


UKR_FUTURE: "£KR_game_rule_flag_UKR   Последствия Ровенского восстания"
RULE_OPTION_UKR_FUTURE_RANDOM: "По умолчанию"
RULE_OPTION_UKR_FUTURE_RANDOM_DESC: "Экономический кризис едва не привел к распаду и без того нестабильной Украины. Чтобы пережить эту бурю, необходимы серьезные политические изменения."
RULE_OPTION_UKR_FUTURE_KING_UPSS_SOCIALISM: "£KR_game_rule_flag_UKR   Украинский социализм"
RULE_OPTION_UKR_FUTURE_KING_UPSS_SOCIALISM_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Штурм Липки" королю удается свергнуть Гетмана и отправить его в отставку. После этого он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YАлександр Шаповал§! впоследствии побеждает в борьбе за власть и устанавливает §Nсоциал§!-националистическую президентскую республику."
RULE_OPTION_UKR_FUTURE_KING_UPSS_MONSOC: "£KR_game_rule_flag_UKR_kingdom   Монархосоциалистическая Украина"
RULE_OPTION_UKR_FUTURE_KING_UPSS_MONSOC_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Штурм Липки" королю удается свергнуть Гетмана и отправить его в отставку. После этого он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YАлександр Шаповал§! впоследствии побеждает в борьбе за власть и устанавливает §Nсоциал§!-националистическую конституционную монархию."
RULE_OPTION_UKR_FUTURE_KING_UPSS_CONSERVATIVE: "£KR_game_rule_flag_UKR   Консервативная Республика"
RULE_OPTION_UKR_FUTURE_KING_UPSS_CONSERVATIVE_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Штурм Липки" королю удается свергнуть Гетмана и отправить его в отставку. После этого он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YАлександр Шаповал§! впоследствии побеждает в борьбе за власть, устанавливая §gконсервативо§! националистическую президентскую республику."
RULE_OPTION_UKR_FUTURE_KING_UPSS_CONSERVATIVE_MONARCH: "£KR_game_rule_flag_UKR_kingdom   Конституционная монархия"
RULE_OPTION_UKR_FUTURE_KING_UPSS_CONSERVATIVE_MONARCH_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В событии "Штурм Липки" королю удается свергнуть Гетмана и заставить его уйти в отставку. Затем он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YАлександр Шаповал§! впоследствии побеждает в борьбе за власть, устанавливая §gконсервативно§! националистическую конституционную монархию."
RULE_OPTION_UKR_FUTURE_KING_UPSS_BOLBOCHAN: "£KR_game_rule_flag_UKR_kingdom   Атаман-министр Болбочан"
RULE_OPTION_UKR_FUTURE_KING_UPSS_BOLBOCHAN_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В событии "Штурм Липки" королю удается свергнуть Гетмана и заставить его уйти в отставку. Затем он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YПётр Болбочан§! впоследствии побеждает в борьбе за власть, устанавливая §gмилитаристкую§! конституционную монархию."
RULE_OPTION_UKR_FUTURE_KING_UPSS_BOLBOCHAN_DEMOCRACY: "£KR_game_rule_flag_UKR_kingdom   Болбочан восстанавливает демократию"
RULE_OPTION_UKR_FUTURE_KING_UPSS_BOLBOCHAN_DEMOCRACY_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В событии "Штурм Липки" королю удается свергнуть Гетмана и заставить его уйти в отставку. Затем он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YПётр Болбочан§! впоследствии побеждает в борьбе за власть, устанавливая §gмилитаристкую§! конституционной монархии, но решает уйти в отставку с поста премьер-министра страны."
RULE_OPTION_UKR_FUTURE_KING_UPSS_HREKIV_JUNTA: "£KR_game_rule_flag_UKR   Батьковщина"
RULE_OPTION_UKR_FUTURE_KING_UPSS_HREKIV_JUNTA_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В событии "Штурм Липки" королю удается свергнуть Гетмана и заставить его уйти в отставку. Затем он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YАлександр Греков§! впоследствии побеждает в борьбе за власть, устанавливая §gвоенную хунту§!."
RULE_OPTION_UKR_FUTURE_KING_UPSS_HREKIV_OTAMANOVSKYI: "£KR_game_rule_flag_UKR   Греков восстанавливает демократию"
RULE_OPTION_UKR_FUTURE_KING_UPSS_HREKIV_OTAMANOVSKYI_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В событии "Штурм Липки" королю удается свергнуть Гетмана и заставить его уйти в отставку. Затем он принимает ультиматум §cУПСС§! и образуется Триумвират.\n§YАлександр Греков§! впоследствии побеждает в борьбе за власть, восстанавливая демократию с сильной президентской властью."
RULE_OPTION_UKR_FUTURE_KING_UMP: "£KR_game_rule_flag_UKR_kingdom   Королевский заговор - УМП"
RULE_OPTION_UKR_FUTURE_KING_UMP_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Липовый штурм" королю удается свергнуть Гетмана и отправить его в отставку, восстановив в Украине конституционную монархию.\nЗатем он выбирает премьер-министром социал-консерватора §cУМП§!"
RULE_OPTION_UKR_FUTURE_KING_USKHD: "£KR_game_rule_flag_UKR_kingdom   Королевский заговор - УСхД"
RULE_OPTION_UKR_FUTURE_KING_USKHD_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Липовый штурм" королю удается свергнуть Гетмана и отправить его в отставку, восстановив в Украине конституционную монархию.\nЗатем он выбирает авторитарного консерватора §GУСхД§! премьер-министром."
RULE_OPTION_UKR_FUTURE_HETMAN_DEM: "£KR_game_rule_flag_UKR_hetman   Место - Михновского"
RULE_OPTION_UKR_FUTURE_HETMAN_DEM_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Взрыв на Днепре" Гетману удается создать Регентский совет и утвердиться в качестве единоличного монарха. Он не распускает Сойм, спасая выборы на Украине."
RULE_OPTION_UKR_FUTURE_HETMAN_COSSACK: "£KR_game_rule_flag_UKR_hetman   Наследие Первого Гетманата"
RULE_OPTION_UKR_FUTURE_HETMAN_COSSACK_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В ходе события "Взрыв на Днепре" Гетману удается создать Регентский совет и утвердиться в качестве единоличного монарха. Он не распускает Сойм, спасая выборы на Украине."
RULE_OPTION_UKR_FUTURE_HETMAN_AUT: "£KR_game_rule_flag_UKR_hetman   Гетман на своем посту"
RULE_OPTION_UKR_FUTURE_HETMAN_AUT_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. В событии "Взрыв на Днепре" Гетману удается утвердиться в качестве единоличного монарха с персоналистской диктатурой. Он распускает Сойм, устанавливая абсолютистское правление."
RULE_OPTION_UKR_FUTURE_UVO_KON: "£KR_game_rule_flag_UKR_national_populist   Коновалец вступает в должность"
RULE_OPTION_UKR_FUTURE_UVO_KON_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. Вскоре после штурма Липки Украинская военная организация совершает контрпереворот против короля и создает Украинское объединенное суверенное государство под руководством Евгения Коновальца"
RULE_OPTION_UKR_FUTURE_UVO_MELNYK: "£KR_game_rule_flag_UKR_national_populist   Власть Мельника"
RULE_OPTION_UKR_FUTURE_UVO_MELNYK_DESC: "Дуалистическому правлению короля и Гетмана приходит конец. Вскоре после Липкинского штурма Украинская военная организация совершает контрпереворот и создает Украинское объединенное суверенное государство под руководством Андрея Мельника."
RULE_OPTION_UKR_FUTURE_UVO_DONTSOV: "£KR_game_rule_flag_UKR_national_populist   Диктатура Донцова"
RULE_OPTION_UKR_FUTURE_UVO_DONTSOV_DESC: "В результате выборов или контрпереворота Дмитрию Донцову удается прийти к власти и установить единоличную диктатуру."

UKR_RIVNE_UPRISING: "£KR_game_rule_flag_UKR_dyrektoria   Восстание Директории"
RULE_OPTION_UKR_RIVNE_UPRISING_RANDOM: "По умолчанию"
RULE_OPTION_UKR_RIVNE_UPRISING_RANDOM_DESC: "Украинская Народная Республика в изгнании готовится к восстанию против монархического режима. Успех этого восстания не гарантирован."
RULE_OPTION_UKR_RIVNE_UPRISING_DYREKTORIA_DISABLED: "£KR_game_rule_flag_UKR_dyrektoria   Отключено Ровенское восстание"
RULE_OPTION_UKR_RIVNE_UPRISING_DYREKTORIA_DISABLED_DESC: "После Черного Понедельника возглавляемая социалистами Директория не смогла инициировать восстание.\n§RПРИМЕЧАНИЕ:§! Это игровое правило действует §Rтолько§! для AI Украины"
RULE_OPTION_UKR_RIVNE_UPRISING_DYREKTORIA_GUARANTEED: "£KR_game_rule_flag_UKR_dyrektoria   Гарантировано Ровенское восстание"
RULE_OPTION_UKR_RIVNE_UPRISING_DYREKTORIA_GUARANTEED_DESC: "После Черного Понедельника возглавляемая социалистами Директория инициирует восстание в Ровно и успешно побеждает в нем.\n§RПРИМЕЧАНИЕ:§! Это игровое правило действует §Rтолько§! для AI Украины"
RULE_OPTION_UKR_RIVNE_UPRISING_HETMANATE_WINS: "£KR_game_rule_flag_UKR_dyrektoria   Провал Ровенского восстания"
RULE_OPTION_UKR_RIVNE_UPRISING_HETMANATE_WINS_DESC: "После Черного Понедельника возглавляемая социалистами Директория начинает восстание в Ровно, но терпит поражение от Королевских войск.\n§RПРИМЕЧАНИЕ:§! Это игровое правило действует §Rтолько§! для AI Украины"

UKR_PEOPLES_REPUBLIC: "£KR_game_rule_flag_UKR_dyrektoria   Всеукраинский съезд"
RULE_OPTION_UKR_PEOPLES_REPUBLIC_RANDOM: "По умолчанию"
RULE_OPTION_UKR_PEOPLES_REPUBLIC_RANDOM_DESC: "После Ровенского восстания успешно восстанавливается Украинская Народная Республика. Однако будущее молодой республики остаётся неопределенным."
RULE_OPTION_UKR_FUTURE_KHRUSHCHEV_UKR: "£KR_game_rule_flag_UKR_bolshevist   Председатель в Вышиванке"
RULE_OPTION_UKR_FUTURE_KHRUSHCHEV_UKR_DESC: "Неожиданно на Украине происходит большевистский переворот, в результате которого новой правящей партией на Украине становятся российские коммунисты с их региональным лидером Никитой Хрущевым. Впоследствии Хрущев решает принять украинскую культуру.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_KHRUSHCHEV_RUS: "£KR_game_rule_flag_UKR_bolshevist   Люксембуржец Хрущев"
RULE_OPTION_UKR_FUTURE_KHRUSHCHEV_RUS_DESC: "Внезапно на Украине происходит большевистский переворот, в результате которого новой правящей партией на Украине становятся российские коммунисты с их региональным лидером Никитой Хрущевым. Впоследствии Хрущев решает объявить украинскую культуру буржуазно-националистической и подавляет её.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_UKP_R: "£KR_game_rule_flag_UKR_socialist   Антиколониалисты Ричицкого"
RULE_OPTION_UKR_FUTURE_UKP_R_DESC: "На Всеукраинском съезде §NУкаписты§! (Украинская коммунистическая партия) удалось получить большинство мандатов. Позже, на IV(I) съезде УКП, новым премьером становится §VАндрей Ричицкий§! со своей программой антиколониализма и антиимпериализма.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_UKP_S: "£KR_game_rule_flag_UKR_socialist   Большевизм Скрипника"
RULE_OPTION_UKR_FUTURE_UKP_S_DESC: "На Всеукраинском съезде §NУкаписты§! (Украинская коммунистическая партия) удалось получить большинство мандатов. Позднее, на IV(I) съезде УКП, новым премьером становится §VНиколай Скрипник§! со своей большевистской программой.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_UKP_SH: "£KR_game_rule_flag_UKR_socialist   Национал-коммунизм Шахрая"
RULE_OPTION_UKR_FUTURE_UKP_SH_DESC: "На Всеукраинском съезде §NУкаписты§! (Украинская коммунистическая партия) удается получить большинство мандатов. Позднее, на IV(I) съезде УКП, §NВасилий Шахрай§! остаётся премьером со своей национал-коммунистической программой.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_BORBISTS: "£KR_game_rule_flag_UKR_socialist   £KR_game_rule_flag_SOV_psr   ПЖСР(с)У - Боротьбисты"
RULE_OPTION_UKR_FUTURE_BORBISTS_DESC: "После начала Гражданской войны в России местному отделению Левых Эсеров-революционеров на Украине удается свергнуть режим и установить тесные связи с российскими левыми эсерами.\n§RТребуется:§!\n§CРеволюция Левых Эсеров в России§!"
RULE_OPTION_UKR_FUTURE_SHUMSKYI: "£KR_game_rule_flag_UKR_socialist   Боротьбистское восстание - Союз Коммун"
RULE_OPTION_UKR_FUTURE_SHUMSKYI_DESC: "После Всеукраинского съезда земельная реформа проваливается, и §RАлександр Шумский§! возглавляет успешную революцию. В дальнейшем Украина становится федерацией коммун.\n§RТребуется:§!\n§RNOT§! §C$RULE_OPTION_UKR_REVOLUTION_DISABLED$§! iвn §Y$UKR_REVOLUTION$§!"
RULE_OPTION_UKR_FUTURE_SHUMSKYI_2: "£KR_game_rule_flag_UKR_socialist   Боротьбистское восстание - Крестьянско-рабочая советская власть"
RULE_OPTION_UKR_FUTURE_SHUMSKYI_2_DESC: "После Всеукраинского съезда земельная реформа провалилась, и §RАлександр Шумский§! возглавил успешную революцию. Впоследствии Украина становится советской республикой.\n§RТребуется:§!\n§RNOT§! §C$RULE_OPTION_UKR_REVOLUTION_DISABLED$§! в §Y$UKR_REVOLUTION$§!"
RULE_OPTION_UKR_FUTURE_SHUMSKYI_3: "£KR_game_rule_flag_UKR_socialist   Боротьбистское восстание - временная диктатура"
RULE_OPTION_UKR_FUTURE_SHUMSKYI_3_DESC: "После Всеукраинского съезда земельная реформа проваливается, и §RАлександр Шумский§! возглавляет успешную революцию. В дальнейшем сохраняется временная диктатура боротбистов.\n§RТребуется:§!\n§RNOT§! §C$RULE_OPTION_UKR_REVOLUTION_DISABLED$§! в §Y$UKR_REVOLUTION$§!"
RULE_OPTION_UKR_FUTURE_UPSR_R: "£KR_game_rule_flag_UKR_dyrektoria   УПСР - Советская модель"
RULE_OPTION_UKR_FUTURE_UPSR_R_DESC: "На Всеукраинском съезде УПСР (Украинской партии социалистов-революционеров) удается получить большинство мандатов. В дальнейшем она принимает решение следовать §NСоветской модели§!.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_UPSR: "£KR_game_rule_flag_UKR_dyrektoria   УПСР - Дуалистическая модель"
RULE_OPTION_UKR_FUTURE_UPSR_DESC: "На Всеукраинском съезде УПСР (Украинской партии социалистов-революционеров) удается получить большинство мандатов. В дальнейшем она решает остаться в составе §MРада Демократия§!.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_USDRP_R: "£KR_game_rule_flag_UKR_dyrektoria   УСДРП - Советская модель"
RULE_OPTION_UKR_FUTURE_USDRP_R_DESC: "На Всеукраинском съезде §MУСДРП§! (Украинская социал-демократическая рабочая партия) удалось получить большинство мандатов. В дальнейшем она принимает решение следовать §NСоветской модели§!.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_USDRP: "£KR_game_rule_flag_UKR_dyrektoria   УСДРП - Демократическая модель"
RULE_OPTION_UKR_FUTURE_USDRP_DESC: "На Всеукраинском съезде §MУСДРП§! (Украинская социал-демократическая рабочая партия) удалось получить большинство мандатов. В дальнейшем она решает остаться в составе §MРада Демократия§!.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_PETLIURA: "£KR_game_rule_flag_UKR_dyrektoria   Социал-демократический диктатор"
RULE_OPTION_UKR_FUTURE_PETLIURA_DESC: "Всеукраинский съезд проваливается, власть захватывает §MАтаман Петлюра§! и устанавливает §MСоциал-демократическую диктатуру§!.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_PETLIURA_FAILS_USDRP: "£KR_game_rule_flag_UKR_dyrektoria   Левый фланг УНС опрокинул Петлюру"
RULE_OPTION_UKR_FUTURE_PETLIURA_FAILS_USDRP_DESC: "Всеукраинский съезд проваливается, власть захватывает §MАтаман Петлюра§! и создает коалицию демократических сил, которую впоследствии свергает §MИисаак Мазепа§! от левого крыла.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_PETLIURA_FAILS_UPSF: "£KR_game_rule_flag_UKR_dyrektoria   Правое крыло УНС свергает Петлюру"
RULE_OPTION_UKR_FUTURE_PETLIURA_FAILS_UPSF_DESC: "Всеукраинский съезд провалился, и власть захватил §MАтаман Петлюра§!, создав коалицию демократических сил, которая впоследствии была свергнута §IАндреем Никовским§! от правых.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_PETLIURA_SHUMSKYI: "£KR_game_rule_flag_UKR_dyrektoria   Невозможный альянс"
RULE_OPTION_UKR_FUTURE_PETLIURA_SHUMSKYI_DESC: "Всеукраинский съезд проваливается, и §MАтаман Петлюра§! захватывает власть, устанавливая социал-демократическую диктатуру. В дальнейшем для спасения Украины он вынужден образовать дуумвират с §RАлександром Шумским§!\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_PETLIURA_FAILED_STATE: "£KR_game_rule_flag_UKR_dyrektoria   Слом Дуумвирата"
RULE_OPTION_UKR_FUTURE_PETLIURA_FAILED_STATE_DESC: "Всеукраинский съезд проваливается, и §MАтаман Петлюра§! захватывает власть, устанавливая социал-демократическую диктатуру. Позже он вынужден создать дуумвират с §RАлександром Шумским§! для спасения Украины, но союз распадается, что приводит к падению Украины.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_PETLIURA_MELNYK: "£KR_game_rule_flag_UKR_dyrektoria   Диархия Петлюры-Мельника"
RULE_OPTION_UKR_FUTURE_PETLIURA_MELNYK_DESC: "Всеукраинский съезд проваливается, и власть захватывает §MАтаман Петлюра§!, устанавливая социал-демократическую диктатуру. Позже он сближается с §PАндрием Мельником§! и §FСечи Стрильцы§!, устанавливая леворадикальный режим патернализма.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_FUTURE_UPSF_FEDERALIST: "£KR_game_rule_flag_UKR_dyrektoria   ПУЛД(С-Ф) - Федералисты"
RULE_OPTION_UKR_FUTURE_UPSF_FEDERALIST_DESC: "На Всеукраинском съезде партии §UПУЛД(С-Ф)§! (Партия украинских либерал-демократов (социалистов-федералистов)) удается получить большинство мандатов. В дальнейшем они возвращаются к своему федералистскому наследию и пытаются создать или присоединить к себе федеративный союз.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!\n§RНЕТУ§! §C$RULE_OPTION_UKR_FOREIGN_POLICY_AUSTRIA$§!, §C$RULE_OPTION_UKR_FOREIGN_POLICY_NEUTRALITY$§! в §Y$UKR_FOREIGN_POLICY$§!"
RULE_OPTION_UKR_FUTURE_UPSF_LIBERAL: "£KR_game_rule_flag_UKR_dyrektoria   ПУЛД(С-Ф) - Либералы"
RULE_OPTION_UKR_FUTURE_UPSF_LIBERAL_DESC: "На Всеукраинском съезде партии §UПУЛД(С-Ф)§! (Партия украинских либерал-демократов (социалистов-федералистов)) удается получить большинство мандатов. В дальнейшем они выдвигают новую, либеральную, платформу и пытаются построить на Украине Швейцарию Восточной Европы.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!\n§RНЕТУ§! §C$RULE_OPTION_UKR_FOREIGN_POLICY_AUSTRIA$§!, §C$RULE_OPTION_UKR_FOREIGN_POLICY_REICHSPAKT$§! или §C$RULE_OPTION_UKR_FOREIGN_POLICY_FACTION_LEADER$§! в §Y$UKR_FOREIGN_POLICY$§!"

UKR_REVOLUTION: "£KR_game_rule_flag_UKR_socialist   Боротьбистская революция"
RULE_OPTION_UKR_REVOLUTION_RANDOM: "По умолчанию"
RULE_OPTION_UKR_REVOLUTION_RANDOM_DESC: "Если правительству Украины не удастся провести успешную земельную реформу или не удастся разрешить аграрный кризис, это приведет к тому, что §RАлександра Шумского§! и боротбисты организуют всеукраинскую забастовку и захватят власть в результате революции."
RULE_OPTION_UKR_REVOLUTION_GUARANTEED: "£KR_game_rule_flag_UKR_socialist   Гарантировано"
RULE_OPTION_UKR_REVOLUTION_GUARANTEED_DESC: "Правительство Украины либо не успевает провести земельную реформу, либо не может разрешить аграрный кризис, что заставляет §RАлександра Шумского§! и боротбистов организовать всеукраинскую забастовку и захватывает власть в ходе революции"
RULE_OPTION_UKR_REVOLUTION_CIVIL_WAR: "£KR_game_rule_flag_UKR   £KR_game_rule_flag_UKR_socialist   Гражданская война"
RULE_OPTION_UKR_REVOLUTION_CIVIL_WAR_DESC: "Правительство Украины либо не успевает провести земельную реформу, либо не может разрешить аграрный кризис, что заставляет §RАлександра Шумского§! и боротбистов организовать всеукраинскую забастовку и захватить власть в результате революции. Эти действия приводят к полномасштабной Гражданской войне."
RULE_OPTION_UKR_REVOLUTION_COUP: "£KR_game_rule_flag_UKR_socialist   Бескровный переворот"
RULE_OPTION_UKR_REVOLUTION_COUP_DESC: "Правительство Украины либо не успевает провести земельную реформу, либо не может разрешить аграрный кризис, что заставляет §RАлександра Шумского§! и боротбистов организовать всеукраинскую забастовку и захватить власть в результате бескровного переворота.\n§RТребуется:§!\n§CСимон Петлюра §RНЕ§! у власти на Украине§!"
RULE_OPTION_UKR_REVOLUTION_DISABLED: "£KR_game_rule_flag_UKR   Отключено"
RULE_OPTION_UKR_REVOLUTION_DISABLED_DESC: "Правительство Украины либо не проводит успешную земельную реформу, либо не может разрешить аграрный кризис, в результате чего §RАлександру Шумскому§! и боровчане организуют всеукраинскую забастовку и захватывают власть в результате революции. Эти действия приводят к полномасштабной Гражданской войне.\n§RТребуется:§!\n§CСаймон Петлюра §RНЕ§!у власти на Украине§!"

UKR_GERMAN_INTERVENTION: "£KR_game_rule_flag_UKR   £KR_game_rule_flag_GER   Немецкая интервенция на Украину"
RULE_OPTION_UKR_GERMAN_INTERVENTION_RANDOM: "По умолчанию"
RULE_OPTION_UKR_GERMAN_INTERVENTION_RANDOM_DESC: "Изменения в политике Украины заставляют её занять антигерманскую позицию. Потерпит ли это Кайзеррейх, пока неизвестно."
RULE_OPTION_UKR_GERMAN_INTERVENTION_TRUE: "Военная интервенция"
RULE_OPTION_UKR_GERMAN_INTERVENTION_TRUE_DESC: "Изменения в политике Украины заставляют её занять антигерманскую позицию. Германия осуществляет прямое вмешательство с целью восстановления порядка.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_GERMAN_INTERVENTION_NON_AGGRESSION: "Пакт о ненападении"
RULE_OPTION_UKR_GERMAN_INTERVENTION_NON_AGGRESSION_DESC: "Изменения в политике Украины заставляют её занять антигерманскую позицию. Германия закрепляет свои позиции, а вместо этого подписывает с Украиной пакт о ненападении.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_GERMAN_INTERVENTION_GER_UKR_GUARANTEE: "Германия дает гарантии Украине"
RULE_OPTION_UKR_GERMAN_INTERVENTION_GER_UKR_GUARANTEE_DESC: "Изменения в политике Украины заставляют её занять антигерманскую позицию. Германия закрепляет свои позиции, вместо этого предоставляя Украине гарантии независимости.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_UKR_GERMAN_INTERVENTION_FALSE: "Отключено"
RULE_OPTION_UKR_GERMAN_INTERVENTION_FALSE_DESC: "После прихода к власти на Украине антигерманского лидера Германия решает не вмешиваться.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"

UKR_WHR_TREATY: "£KR_game_rule_flag_UKR   £KR_game_rule_flag_WHR   Пинский договор"
RULE_OPTION_UKR_WHR_TREATY_RANDOM: "По умолчанию"
RULE_OPTION_UKR_WHR_TREATY_RANDOM_DESC: "Согласятся ли независимая Украина и независимая Белоруссия подписать договор о ненападении и дружбе - неизвестно."
RULE_OPTION_UKR_WHR_TREATY_GUARANTEED: "Узы братства нерушимы"
RULE_OPTION_UKR_WHR_TREATY_GUARANTEED_DESC: "Независимые Украина и Беларусь согласны подписать договор о дружбе и ненападении без каких-либо уступок."
RULE_OPTION_UKR_WHR_TREATY_HOMEL: "Украина уступает Гомель"
RULE_OPTION_UKR_WHR_TREATY_HOMEL_DESC: "Независимые Украина и Беларусь соглашаются подписать договор о дружбе и ненападении с передачей Украиной Гомеля Беларуси."
RULE_OPTION_UKR_WHR_TREATY_FAIL: "Договор не состоится"
RULE_OPTION_UKR_WHR_TREATY_FAIL_DESC: "Независимые Украина и Белоруссия не смогут подписать договор о дружбе и ненападении."

UKR_FOREIGN_POLICY: "£KR_game_rule_flag_UKR   Украина между Империями"
RULE_OPTION_UKR_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_UKR_FOREIGN_POLICY_RANDOM_DESC: ""
RULE_OPTION_UKR_FOREIGN_POLICY_NEUTRALITY: "£KR_game_rule_flag_UKR   Изоляция"
RULE_OPTION_UKR_FOREIGN_POLICY_NEUTRALITY_DESC: "Не желая участвовать в международной борьбе и кризисах, Украина будет стоять в мире одна."
RULE_OPTION_UKR_FOREIGN_POLICY_REICHSPAKT: "£KR_game_rule_flag_UKR   £KR_game_rule_flag_GER   Рейхспакт"
RULE_OPTION_UKR_FOREIGN_POLICY_REICHSPAKT_DESC: "Украина будет укреплять связи с Германией и Рейхспактом."
RULE_OPTION_UKR_FOREIGN_POLICY_RUSSIA: "£KR_game_rule_flag_UKR   £KR_game_rule_flag_RUS   Встать на сторону России"
RULE_OPTION_UKR_FOREIGN_POLICY_RUSSIA_DESC: "Украина пойдет на союз с русскими, чтобы защитить себя.\n§RТребуется:§!\nЛюбой путь §CСкоропадского§! в §Y$UKR_FUTURE$§! и §CРоссия должна быть монархией, военной диктатурой или правой демократической республикой§!"
RULE_OPTION_UKR_FOREIGN_POLICY_AUSTRIA: "£KR_game_rule_flag_UKR   £KR_game_rule_flag_AUS   По Днепру и Дунаю"
RULE_OPTION_UKR_FOREIGN_POLICY_AUSTRIA_DESC: "Украина вступит в союз с Австрийской империей, чтобы дистанцироваться от более воинственных сфер влияния."
RULE_OPTION_UKR_FOREIGN_POLICY_FACTION: "£KR_game_rule_flag_UKR   Малые альянсы"
RULE_OPTION_UKR_FOREIGN_POLICY_FACTION_DESC: "Уклоняясь от основных сфер влияния, Украина будет охотно оставаться в любой фракции, в которую её пригласят.\n§RЕсли ни одна фракция их не пригласит, это будет функционировать если включено правило §CИзоляция§!§!."
RULE_OPTION_UKR_FOREIGN_POLICY_FACTION_LEADER: "£KR_game_rule_flag_UKR   Лидерство Фракции"
RULE_OPTION_UKR_FOREIGN_POLICY_FACTION_LEADER_DESC: "Стремясь стать самостоятельной державой, Украина возглавит собственную фракцию между Балтийским и Черным морями."
