RULE_OPTION_DKB_PATH_VLASOV: "£KR_game_rule_flag_DKB_vlasov   Дело Власова"
RULE_OPTION_DKB_PATH_VLASOV_DESC: "В хаосе после смерти Краснова генералу Власову и его §MРусской освободительной армии§! удаётся прийти к власти и установить на донских землях новую республику."
RULE_OPTION_DKB_PATH_NOVOROS: "£KR_game_rule_flag_DKB_NOV   Богаевский наследует Краснову"
RULE_OPTION_DKB_PATH_NOVOROS_DESC: "§cАфрикан Богаевский§! избирается преемником Краснова и устанавливает более тесные связи с Россией."
RULE_OPTION_DKB_PATH_KRASNOV: "£KR_game_rule_flag_DKB   Казачия Краснова"
RULE_OPTION_DKB_PATH_KRASNOV_DESC: "§gАтаман Краснов§! принимает закон о дальнейшем сотрудничестве с Германией, всё сильнее попадая в зависимость от Кайзеррейха."
RULE_OPTION_DKB_PATH_GERMANS: "£KR_game_rule_flag_DKB_germans   Германская оккупация"
RULE_OPTION_DKB_PATH_GERMANS_DESC: "В хаосе после смерти Краснова находящейся на Дону §Pгерманской военной миссии§! удаётся прийти к власти и установить на донских землях германское марионеточное государство."
RULE_OPTION_DKB_PATH_GERMANS_KAISER: "£KR_game_rule_flag_DKB_germans   Собственный Кайзеррейх"
RULE_OPTION_DKB_PATH_GERMANS_KAISER_DESC: "В хаосе после смерти Краснова находящейся на Дону §Pгерманской военной миссии§! удаётся прийти к власти и установить на донских землях германское марионеточное государство, со временем создав собственную монархию."
RULE_OPTION_DKB_PATH_GERMANS_PANNWITZ: "£KR_game_rule_flag_DKB_germans   Генерал-губернаторство"
RULE_OPTION_DKB_PATH_GERMANS_PANNWITZ_DESC: "В хаосе после смерти Краснова находящейся на Дону §Pгерманской военной миссии§! удаётся прийти к власти и установить на донских землях германское марионеточное государство, со временем учредив постоянный военный режим."
RULE_OPTION_DKB_PATH_BRP: "£KR_game_rule_flag_DKB_BRP   Южнорусское регентство"
RULE_OPTION_DKB_PATH_BRP_DESC: "После смерти Краснова радикальным монархистам из §FБратства русской правды§! удаётся прийти к власти. Они намерены вернуть Россию и восстановить царство."

DKB_FOREIGN_POLICY: "£KR_game_rule_flag_DKB   Внешняя политика Дона"
RULE_OPTION_DKB_FP_RANDOM: "По умолчанию"
