RULE_OPTION_KAR_JAGERS_DESC: "Финские егеря под руководством финского генерала Пааво Талвела совершают переворот в правительстве и работают над интеграцией Карелии в состав Финляндии."
RULE_OPTION_KAR_NATPOP: "£KR_game_rule_flag_KAR_national_populist   Metsäsissit Nationalists"
RULE_OPTION_KAR_NATPOP_DESC: "После победы над русскими, Лесные партизаны - Метсасиссит под руководством Укки Вяйнямёйнена захватывают власть и заявляют об освобождении всех финно-угорских народов."
RULE_OPTION_KAR_RADSOC: "£KR_game_rule_flag_KAR_radical_socialist   Карельская трудовая Коммуна"
RULE_OPTION_KAR_RADSOC_DESC: "После того, как Эльфвенгрен захватывает Петрозаводск, местные социалисты-революционеры поднимают социалистическое восстание, а красногвардейцы изгоняют сепаратистов из Карелии.\n§RПредлагает:§! Карелия должна контролировать Петрозаводск"

TTR_PATH: "£KR_game_rule_flag_TTR   Будущее Идель-Урала"
RULE_OPTION_TTR_PATH_RANDOM: "По умолчанию"
RULE_OPTION_TTR_PATH_RANDOM_DESC: "После революции и Гражданской войны в России местная Казанская городская дума провозгласила независимость Татарской республики, временного государства, во главе с мэром Ильясом Алкиным. Однако за власть в новой республике борются несколько организаций. Неизвестно, кто возьмет верх."
RULE_OPTION_TTR_PATH_TOTALIST: "£KR_game_rule_flag_TTR_totalist   Булгаристы Вяйси"
RULE_OPTION_TTR_PATH_TOTALIST_DESC: "К власти в Татарии приходят красногвардейцы во главе с §NМирсаид Султан-Галиев§! Позднее его сменяет внезапная победа §VĞaynan Wäisi§! и его булгаристского движения на съезде Татарского Совета."
RULE_OPTION_TTR_PATH_SYNDICALIST: "£KR_game_rule_flag_TTR_radsoc   Революция левых эсеров"
RULE_OPTION_TTR_PATH_SYNDICALIST_DESC: "К власти в Татарии приходят красногвардейцы во главе с §RГалимджан Ибрагимов§! и его татарской левой партией эсеров."
RULE_OPTION_TTR_PATH_RADSOC: "£KR_game_rule_flag_TTR_radsoc   Тюрко-Татарская Федерация"
RULE_OPTION_TTR_PATH_RADSOC_DESC: "К власти в Татарии приходят красногвардейцы во главе с §NМирсаид Султан-Галиев§! Позже он решает бросить вызов российскому империализму и провозгласить независимость всех тюрко-татар."
RULE_OPTION_TTR_PATH_RADSOC_SOV: "£KR_game_rule_flag_TTR_radsoc  £KR_game_rule_flag_SOV   Советский Туран"
RULE_OPTION_TTR_PATH_RADSOC_SOV_DESC: "Красные гвардейцы захватывают власть в Татарии, возглавляемые §NМирсаидом Султан-Галиевым§!. Позднее он возглавляет Советскую Туркестанскую Федеративную Республику, одобренную российскими властями."
RULE_OPTION_TTR_PATH_SOCDEM: "£KR_game_rule_flag_TTR   Советский Идель-Урал"
RULE_OPTION_TTR_PATH_SOCDEM_DESC: "Милли Шура (Национальный совет) приходит к власти в государстве, возглавляемый §MĞалимчаном Шәрәфом§!. Он превращает Идель-Уральскую республику в советскую республику, не обязательно связанную с Советской Россией."
RULE_OPTION_TTR_PATH_SOCDEM_ALKIN: "£KR_game_rule_flag_TTR   Татаристы"
RULE_OPTION_TTR_PATH_SOCDEM_ALKIN_DESC: "К власти в государстве приходит Милли Шура (Национальный совет) во главе с §MИильясом Алкиным§!. Его татаристская фракция провозглашает независимое государство Идель-Урал, которое планируется сделать частью будущей демократической России"
RULE_OPTION_TTR_PATH_MARLIB: "£KR_game_rule_flag_TTR   Либеральные тюркисты"
RULE_OPTION_TTR_PATH_MARLIB_DESC: "К власти в Идель-Урале приходят тюркисты во главе с §mСадри Максуди§! Он пытается проводить в республике либеральную политику, в том числе под влиянием кемализма."
RULE_OPTION_TTR_PATH_SOCCON: "£KR_game_rule_flag_TTR   Авторитарные тюркисты"
RULE_OPTION_TTR_PATH_SOCCON_DESC: "К власти в Идель-Урале приходят тюркисты во главе с §cГаяз Исхаки§! Он пытается проводить в республике консервативную и авторитарную политику."
RULE_OPTION_TTR_PATH_PATAUT: "£KR_game_rule_flag_TTR   Возрождение Золотой Орды"
RULE_OPTION_TTR_PATH_PATAUT_DESC: "К власти в государстве приходит Татарский легион во главе с §PШафи Алмас§! В алкогольном бреду он провозглашает себя казанским ханом и пытается восстановить Золотую Орду."
RULE_OPTION_TTR_PATH_NATPOP: "£KR_game_rule_flag_TTR   Молодые легионеры"
RULE_OPTION_TTR_PATH_NATPOP_DESC: "К власти в государстве приходит Татарский легион во главе с §PШафи Алмас§! Позже его отстраняет от власти Молодая гвардия во главе с §FАхмат Яруллин§!, которая строит корпоративно-легионерское государство."

BKN_PATH: "£KR_game_rule_flag_BKN   Битва за Уфу"
RULE_OPTION_BKN_PATH_RANDOM: "По умолчанию"
RULE_OPTION_BKN_PATH_RANDOM_DESC: "Гражданская война в России привела к образованию независимого Башкурдистана под руководством генерала Тагана. Однако ключевой город Уфа остаётся под контролем местного Совета во главе с Шерифом Манатовым. Исход этого сражения предсказать невозможно"
## TEMPORARY ##
RULE_OPTION_BKN_PATH_FAILED: "£KR_game_rule_flag_BKN_totalist   Поражение в битве за Уфу"
RULE_OPTION_BKN_PATH_FAILED_DESC: "Уфимскому Совету удалось выиграть битву под Уфой, что привело к распаду Башкурдистана"
## 
RULE_OPTION_BKN_PATH_TOTALIST: "£KR_game_rule_flag_BKN_totalist   Башобком берет власть"
RULE_OPTION_BKN_PATH_TOTALIST_DESC: "В результате заговора Красной гвардии, большевик §VShahit Hozaybirzin§! приходит к власти в Башкурдистане, устанавливая власть Башкирского регионального комитета (Башобком) под строгим руководством правящей партии Советской России"
RULE_OPTION_BKN_PATH_RADSOC_SOV: "£KR_game_rule_flag_BKN_SOV   Социалистическая мечта Манатова"
RULE_OPTION_BKN_PATH_RADSOC_SOV_DESC: "Благодаря хорошо спланированным действиям Уфимского совета, его председатель, §NShärif Manatov§!, смог возглавить Башкурдистан. Хотя его лояльность советскому правительству вызывает сомнения, он превращает страну в республику советского типа"
RULE_OPTION_BKN_PATH_RADSOC: "£KR_game_rule_flag_BKN   Революционная демократия Манатова"
RULE_OPTION_BKN_PATH_RADSOC_DESC: "§NShärif Manatov§!, не доверяя заверениям русских, вступил в союз с башкирскими националистами и открыл ворота Уфы. Однако в процессе этого власть в Башкурдистане перешла в руки администрации, лояльной ему. Во время последующих выборов Манатов успешно продвигал создание революционного демократического правительства в Башкурдистане, свободного от российского влияния и большевиков"
RULE_OPTION_BKN_PATH_SYNDIE: "£KR_game_rule_flag_BKN_syndicalist   Триумф Пантюркистов"
RULE_OPTION_BKN_PATH_SYNDIE_DESC: "Успешная осада Уфы привела к сокрушительной победе башкирского военного совета. После съезда Всебашкирского Қоролтай, §RÄhmätzäki Välidi§!, сторонник пан-тюркизма, выиграл выборы. Он стремится возглавить объединённый Туркестан под руководством своей социалистической партии"
RULE_OPTION_BKN_PATH_SOCCON: "£KR_game_rule_flag_BKN_social_conservative   Кадимистский Башкурдистан"
RULE_OPTION_BKN_PATH_SOCCON_DESC: "После успешного захвата Уфы власть в Башкурдистане в конечном итоге переходит в руки консервативно настроенных членов мусульманского духовенства. Через продвижение традиционалистских идей §cMohammat-Ğabdulhay Qorbanğaliyev§! стремится создать оплот для ислама в Поволжье и Урале, свободный от прогрессивных и дегенеративных влияний."
RULE_OPTION_BKN_PATH_AUTHDEM: "£KR_game_rule_flag_BKN   Народный фронт Тагана"
RULE_OPTION_BKN_PATH_AUTHDEM_DESC: "Генерал §PĞalimyän Tağan§! сумел захватить Уфу после осады, освободив большую часть Башкурдистана от Красной гвардии. Затем он организует Всебашкирский Қоролтай, и на выборах блок §gумеренных§!, возглавляемый им, состоящий из беспартийных элементов и ветеранов, одерживает победу. Консолидируя власть в своих руках, Таğan намерен возродить былое величие Башкирии. Однако, возможно, цена этого будет слишком высока."
RULE_OPTION_BKN_PATH_PATAUT: "£KR_game_rule_flag_BKN   Диктатура Тагана"
RULE_OPTION_BKN_PATH_PATAUT_DESC: "Генерал §PĞalimyän Tağan§! сумел захватить Уфу после осады, освободив большую часть Башкурдистана от Красной гвардии. Так или иначе, генерал удерживает значительную власть, значительно расширяя свои полномочия и устанавливая авторитарное государство с помощью военной силы."




