SOV_PATH: "£KR_game_rule_flag_SOV   Российская Социалистическая Республика"
RULE_OPTION_SOV_PATH_RANDOM: "По умолчанию"
RULE_OPTION_SOV_PATH_RANDOM_DESC: "В России происходит революция, приводящая к установлению диктатуры пролетариата, которая исчезла около 15 лет назад."
RULE_OPTION_SOV_PATH_ZHUKOV: "£KR_game_rule_flag_SOV   Жуков правит единолично"
RULE_OPTION_SOV_PATH_ZHUKOV_DESC: "Жуков побеждает в борьбе за власть, устанавливая диктатуру.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия убийства§!"
RULE_OPTION_SOV_PATH_TUKHA: "£KR_game_rule_flag_SOV_tukhachevsky   Диктатура Тухачевского"
RULE_OPTION_SOV_PATH_TUKHA_DESC: "Тухачевский побеждает в борьбе за власть, устанавливая диктатуру.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия убийства§!"
RULE_OPTION_SOV_PATH_FRUNZE: "£KR_game_rule_flag_SOV_tukhachevsky   Фрунзе приходит к власти"
RULE_OPTION_SOV_PATH_FRUNZE_DESC: "Фрунзе побеждает в борьбе за власть, устанавливая диктатуру.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия убийства§!"
RULE_OPTION_SOV_PATH_TSENTROBALT: "£KR_game_rule_flag_SOV_anarchy   Центробалт Анархисты"
RULE_OPTION_SOV_PATH_TSENTROBALT_DESC: "Революционные матросы под руководством Дыбенко устанавливают Свободную территорию России.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия убийства§!"
RULE_OPTION_SOV_PATH_BOLSHEVIKS: "£KR_game_rule_flag_SOV   Большевики берут власть"
RULE_OPTION_SOV_PATH_BOLSHEVIKS_DESC: "Большевики одерживают победу в России, восстанавливая диктатуру пролетариата. Хотя будущее партийного руководства неясно.\n§RТребуется:§!\n§CМирная революция§! или §CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия убийства§!"
RULE_OPTION_SOV_PATH_PLSR: "£KR_game_rule_flag_SOV_syndicalist   Левые эсеры-активисты"
RULE_OPTION_SOV_PATH_PLSR_DESC: "Левые социалисты-революционеры получают большинство голосов на Социалистическом конгрессе."
RULE_OPTION_SOV_PATH_PLSR_CHEKA: "£KR_game_rule_flag_SOV_syndicalist   Переворот Фишмана"
RULE_OPTION_SOV_PATH_PLSR_CHEKA_DESC: "Левые социалисты-революционеры получают большинство голосов на Социалистическом конгрессе. Предоставив слишком много власти органам безопасности, Яков Фишман и его агенты распространяют контроль над государством с помощью теневых средств."
RULE_OPTION_SOV_PATH_PLSR_LEGALIST: "£KR_game_rule_flag_SOV_syndicalist   Легалистский контрпереворот"
RULE_OPTION_SOV_PATH_PLSR_LEGALIST_DESC: "Левые социалисты-революционеры получают большинство голосов на Социалистическом конгрессе. Несмотря на попытки Якова Фишмана и его агентов захватить государство с помощью уловок, силы, верные истинному левоэсеровскому видению, восстанавливают верховенство закона и предотвращают тиранию."
RULE_OPTION_SOV_PATH_NSP: "£KR_game_rule_flag_SOV   Триумф Бухарина"
RULE_OPTION_SOV_PATH_NSP_DESC: "Народная социалистическая партия под руководством Бухарина получает большинство голосов на Социалистическом конгрессе."
RULE_OPTION_SOV_PATH_PSR: "£KR_game_rule_flag_SOV_psr   Левые народники Вольского"
RULE_OPTION_SOV_PATH_PSR_DESC: "Партия социалистов-революционеров получает большинство голосов."
RULE_OPTION_SOV_PATH_MENSHEVIKS: "£KR_game_rule_flag_SOV_psr   Меньшевики-интернационалисты"
RULE_OPTION_SOV_PATH_MENSHEVIKS_DESC: "РСДРП получает большинство голосов на Социалистическом конгрессе, что приводит к победе левых социал-демократов."

SOV_POLITBURO_STRUGGLE: "£KR_game_rule_flag_SOV   Борьба за власть в политбюро"
RULE_OPTION_SOV_POLITBURO_STRUGGLE_RANDOM: "По умолчанию"
RULE_OPTION_SOV_POLITBURO_STRUGGLE_RANDOM_DESC: "Большевики, придя к власти, восстанавливают Политбюро, что вызывает острую борьбу за власть."

RULE_OPTION_SOV_PATH_ZINOVIEV: "£KR_game_rule_flag_SOV   Зиновьевские ортодоксы"
RULE_OPTION_SOV_PATH_ZINOVIEV_DESC: "§VГригорий Зиновьев§! остаётся председателем и выходит победителем из борьбы за власть.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!"
RULE_OPTION_SOV_PATH_MOLOTOV: "£KR_game_rule_flag_SOV_molotov   Молотовские ортодоксы"
RULE_OPTION_SOV_PATH_MOLOTOV_DESC: "§zВячеслав Молотов§! побеждает в борьбе за власть и превращает Россию в централизованное бюрократическое государство, руководствуясь идеологиями «Социалистического Отечества» и «Социализма в одной нации».\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!"
RULE_OPTION_SOV_PATH_KAGANOVICH: "£KR_game_rule_flag_SOV   Железный комиссар"
RULE_OPTION_SOV_PATH_KAGANOVICH_DESC: "§zЛазарь Каганович§! сменяет Молотова и продолжает его курс, придавая ещё большее значение социально-патриотической пропаганде и этатизму.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!"
RULE_OPTION_SOV_PATH_MAYAKOVSKY: "£KR_game_rule_flag_SOV_mayakovsky   Социальные футуристы"
RULE_OPTION_SOV_PATH_MAYAKOVSKY_DESC: "§aГенрих Ягода§! смещает Кагановича, ссылаясь на неконституционные действия. Затем он передаёт власть Центральному Комитету, который выбирает §zВладимира Маяковского§!, известного поэта и социального футуриста, в качестве лидера.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!!"
RULE_OPTION_SOV_PATH_YAGODA: "£KR_game_rule_flag_SOV   Чекистское правительство"
RULE_OPTION_SOV_PATH_YAGODA_DESC: "§aГенрих Ягода§! смещает Кагановича, ссылаясь на неконституционные действия. НКВД становится теневым правительством страны, устраняя наиболее радикальные меры Вячеслава Молотова.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!"
RULE_OPTION_SOV_PATH_YEZHOV: "£KR_game_rule_flag_SOV_yezhov   Государство НКВД Ежова"
RULE_OPTION_SOV_PATH_YEZHOV_DESC: "§aГенрих Ягода§! смещает Кагановича, ссылаясь на неконституционные действия. НКВД становится теневым правительством страны, но вследствие интриг §zНиколая Ежова§! именно он становится новым неоспоримым лидером России.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!"
RULE_OPTION_SOV_PATH_INTERNATIONALISTS: "£KR_game_rule_flag_SOV_yezhov   Интернационалистическое политбюро"
RULE_OPTION_SOV_PATH_INTERNATIONALISTS_DESC: "§aГенрих Ягода§! смещает Кагановича, ссылаясь на неконституционные действия. Затем он передаёт власть Центральному Комитету, который выбирает либо §VКарла Радека§!, либо §VОсипа Пятницкого§! для восстановления зиновьевской интернационалистической линии.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_BOLSHEVIKS$§! в §Y$SOV_PATH$§!"

RULE_OPTION_SOV_PATH_NSP_KUZNETSOV: "£KR_game_rule_flag_SOV   Национальные синдикалисты"
RULE_OPTION_SOV_PATH_NSP_KUZNETSOV_DESC: "$RULE_OPTION_SOV_PATH_NSP_DESC$ После кризиса, вызванного проведением новой экономической политики, Николай Бухарин был вынужден уйти в отставку. На его место чрезвычайный съезд избирает §pАлександра Шляпникова§! и его §pРабочая оппозиция§! берёт власть в свои руки. Позднее его сменил национал-синдикалист §VАлександр Кузнецов§!\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS   Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_NSP$§! в §Y$SOV_PATH$§!"
