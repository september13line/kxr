RULE_OPTION_DKB_PATH_UCH: "£KR_game_rule_flag_DKB_UCH   Союз казачьих войск"
RULE_OPTION_DKB_PATH_UCH_DESC: "Атаман Донской республики начинает новую политику объединения казачьих войск России, Кубани и Средней Азии против петроградского режима."
RULE_OPTION_DKB_PATH_NEUTRALITY: "£KR_game_rule_flag_DKB   Казачий нейтралитет"
RULE_OPTION_DKB_PATH_NEUTRALITY_DESC: "Атаман Краснов решает сохранить приверженность идее казачьего сепаратизма и вооружённого нейтралитета.\n§RТребуется:§!\n§C$RULE_OPTION_DKB_PATH_KRASNOV$§! или §C$RULE_OPTION_DKB_PATH_NOVOROS$§! в §Y$DKB_PATH$§!"
