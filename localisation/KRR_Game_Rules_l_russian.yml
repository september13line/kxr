ORE_PATH: "£KR_game_rule_flag_ORE   Изъяны казачьей демократии"
RULE_OPTION_ORE_PATH_DEFAULT: "По умолчанию"
RULE_OPTION_ORE_PATH_DEFAULT_DESC: "Оренбургское казачье войско сумело отделиться от казахов, подняв восстание под предводительством атамана Дутова. Но сможет ли оно выдержать внутренние противоречия среди самих казаков?"
RULE_OPTION_ORE_PATH_RADSOC: "£KR_game_rule_flag_ORE   Разоружение войска"
RULE_OPTION_ORE_PATH_RADSOC_DESC: "Левое оппозиционное движение против Дутова, возглавляемое Тимофеем Седельниковым и его §NКазачьей демократической партией§!, сумело установить большинство в Казачьем круге. В разгар Второй российской гражданской войны Седельников соглашается разоружить армию и присоединиться к Советам.\n§RТребуется:§!\n§CГражданская война в России§!"
RULE_OPTION_ORE_PATH_SOCDEM: "£KR_game_rule_flag_ORE   Оппозиция берёт верх"
RULE_OPTION_ORE_PATH_SOCDEM_DESC: "Левая оппозиция Дутову, возглавляемая Тимофеем Седельниковым и его §MКазачьей демократической партией§!, сумела установить большинство в Казачьем круге. Седельников выступает за мирную интеграцию с демократической Россией.\n§RТребуется:§!\nЛюбой путь §CДемократической России§!"
RULE_OPTION_ORE_PATH_AUTHDEM: "£KR_game_rule_flag_ORE   Дутовская демократия"
RULE_OPTION_ORE_PATH_AUTHDEM_DESC: "Атаман Дутов без особых усилий подавляет левую оппозицию, получая абсолютное большинство в Казачьем круге. Он решает сохранить §gказачью демократию§!, какой бы она ни была, основываясь на своих личных принципах."
RULE_OPTION_ORE_PATH_PATAUT: "£KR_game_rule_flag_ORE   Править твёрдой булавой"
RULE_OPTION_ORE_PATH_PATAUT_DESC: "Атаман Дутов подавляет левую оппозицию и, установив неограниченную власть над Казачьим кругом, выстраивает §Pперсоналистскую диктатуру§!, управляя войском железной рукой ради победы над социализмом."

