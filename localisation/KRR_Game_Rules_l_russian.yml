RULE_OPTION_DKB_PATH_SOV: "£KR_game_rule_flag_DKB_SOV   Донская Народная Республика"
RULE_OPTION_DKB_PATH_SOV_DESC: "В хаосе Берлинского биржевого кризиса §Nсоциалистам§! удаётся прийти к власти и установить на донских землях социалистическую республику."
RULE_OPTION_DKB_PATH_COSSACKS_SOV: "£KR_game_rule_flag_DKB_SOV   Диктатура красных казаков"
