AZE_PATH: "£KR_game_rule_flag_AZE   Теракт на Новруз"
RULE_OPTION_AZE_PATH_RANDOM: "По умолчанию"
RULE_OPTION_AZE_PATH_RANDOM_DESC: "Убийство Фатали Хан-Хойского, министра иностранных дел Азербайджана, в праздник Новруз ознаменовало и новую войну против армянских повстанцев в Нагорном Карабахе, и политическую борьбу за выборы 1937 года в Меджлис-Мебусан. Сумеет ли §mМусават§! сохранить своё большинство или впервые в истории Азербайджана будет вынужден уступить места в правительстве - остаётся неизвестным."
