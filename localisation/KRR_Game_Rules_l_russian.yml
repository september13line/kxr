RULE_OPTION_TRK_FOREIGN_DEFAULT: "По умолчанию"
RULE_OPTION_TRK_FOREIGN_DEFAULT_DESC: "После того как Туркестан объединил всю Центральную Азию, он стремится присоединиться к любому мировому альянсу или остаться нейтральным."
