RULE_OPTION_CRM_ALONE_DESC: "Крымское правительство приняло решение о создании союза народов Причерноморья, призванного спасти независимость этих государств от иностранных держав.\n§RТребуется:§!\n§RNOT§! §C$RULE_OPTION_CRM_GERMAN_PUPPET$§! в §Y$CRM_PATH$§!"
