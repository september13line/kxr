RULE_OPTION_RUS_1936_ELECTIONS_RKDP: "£KR_game_rule_flag_RUS   КДП - Правые кадеты"
RULE_OPTION_RUS_1936_ELECTIONS_RKDP_DESC: "$RULE_OPTION_RUS_1936_ELECTIONS_KDP_DESC$ Правое крыло партии под руководством §sВладимира Набокова§! формирует кабинет и успешно превращает Россию в конституционную монархию.\n§RТребуется:§!\n§C$RULE_OPTION_RUS_POST_ASSASSINATION_ELECTIONS$§! в §Y$RUS_POST_ASSASSINATION$§!"
