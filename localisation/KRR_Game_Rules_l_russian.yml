RULE_OPTION_DKB_PATH_RUSSIA: "£KR_game_rule_flag_DKB   £KR_game_rule_flag_RUS   Возвращение России"
RULE_OPTION_DKB_PATH_RUSSIA_DESC: "Атаман Донской республики начинает новую политику объединения казачьих войск России, Кубани и Средней Азии против петроградского режима."


KUB_PATH: "£KR_game_rule_flag_KUB   Дебош в региональной Раде"
RULE_OPTION_KUB_PATH_RANDOM: "По умолчанию"
RULE_OPTION_KUB_PATH_RANDOM_DESC: "В этом году Кубанской Народной Республике предстоят ежегодные выборы в Раду. Кто получит большинство голосов в этом году, неизвестно."
RULE_OPTION_KUB_PATH_BOLSH: "£KR_game_rule_flag_KUB_SOV   Большевистская Кубань"
RULE_OPTION_KUB_PATH_BOLSH_DESC: "В ходе волнений в Кубанской области большевикам удается захватить власть на Кубани"
RULE_OPTION_KUB_PATH_RED_COS: "£KR_game_rule_flag_KUB_SOV_radical_socialist   Красные казаки"
RULE_OPTION_KUB_PATH_RED_COS_DESC: "Во время волнений на Кубани большевикам удается захватить власть на Кубани. Позже, в ходе деоккупации, они были свергнуты красным казачьим генералом Автономовым."
RULE_OPTION_KUB_PATH_CHERN: "£KR_game_rule_flag_KUB   Черноморцы остаются у власти"
RULE_OPTION_KUB_PATH_CHERN_DESC: "Проукраинская черноморская фракция Рады сумела получить большинство в Раде, рассчитывая на объединение с Украиной"
RULE_OPTION_KUB_PATH_LIN: "£KR_game_rule_flag_KUB   Линейцы - большинство"
RULE_OPTION_KUB_PATH_LIN_DESC: "Большинство в Раде обеспечила фракция "Линейцы", придерживающаяся пророссийской интеграции."
RULE_OPTION_KUB_PATH_KPA: "£KR_game_rule_flag_KUB   Кубанская повстанческая армия"
RULE_OPTION_KUB_PATH_KPA_DESC: "Во время волнений на Кубани Кубанской повстанческой армии удается захватить власть на Кубани, после чего власть переходит к фракции Черноморца."

KUB_FOREIGN: "£KR_game_rule_flag_KUB   Внешняя политика Кубани"
RULE_OPTION_KUB_FOREIGN_RANDOM: "По умолчанию"
RULE_OPTION_KUB_FOREIGN_RANDOM_DESC: "Кубанской Народной Республике предстоит окончательно отказаться от нейтралитета и определиться со своей внешней политикой."
