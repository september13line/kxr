KYR_INDEPENDENCE: "£KR_game_rule_flag_KYR  £KR_game_rule_flag_ALO  £KR_game_rule_flag_TRK   Интервенция Алаша в Туркестан"
RULE_OPTION_KYR_INDEPENDENCE_DEFAULT: "По умолчанию"
RULE_OPTION_KYR_INDEPENDENCE_DEFAULT_DESC: "Если партия «Алаш» находится у власти в Казахстане, она может попытаться вмешаться в Гражданскую войну в Туркестане, создав независимую Кыргызскую Республику."
RULE_OPTION_KYR_INDEPENDENCE_GUARANTEED: "£KR_game_rule_flag_KYR  £KR_game_rule_flag_ALO   Создание Кыргызской Республики"
RULE_OPTION_KYR_INDEPENDENCE_GUARANTEED_DESC: "Алаш-Орда вмешивается в гражданскую войну в Туркестане и создает независимую Кыргызскую Республику.\n§RТребуется:§!\nЛюбой §CАлашский§! путь в §Y$ALO_PATH$§!"
