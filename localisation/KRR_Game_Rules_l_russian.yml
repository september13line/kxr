RULE_OPTION_RUS_1936_ELECTIONS_NRPR_REFORM: "£KR_game_rule_flag_RUS   НРПР - Реформа"
RULE_OPTION_RUS_1936_ELECTIONS_NRPR_REFORM_DESC: "$RULE_OPTION_RUS_1936_ELECTIONS_NRPR_DESC$ Партия пытается провозгласить Савинкова Вождём демократическими средствами.\n§RТребуется:§!\n§C$RULE_OPTION_RUS_POST_ASSASSINATION_ELECTIONS$§! в §Y$RUS_POST_ASSASSINATION$§!"
