RULE_OPTION_CRM_INDEPENDENCE_RANDOM_DESC: "После Ровенского восстания на Украине Германия может решить, стоит ли ей вторгаться на Крымский полуостров и устанавливать там свою администрацию.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
RULE_OPTION_CRM_INDEPENDENCE_GUARANTEED: "Гарантировано"
RULE_OPTION_CRM_INDEPENDENCE_GUARANTEED_DESC: "После Ровенского восстания на Украине Германия решает вторгнуться на Крымский полуостров и установить там свою администрацию.\n§RТребуется:§!\n§CУспешное Ровенское восстание§!"
