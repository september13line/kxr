RULE_OPTION_SOV_PATH_GASTEV_DESC: "$RULE_OPTION_SOV_PATH_NSP_DESC$ После кризиса, вызванного внедрением новой экономической политики, Николай Бухарин был вынужден уйти в отставку. На его место чрезвычайный съезд избирает §pАлександра Шляпникова§!, и его §pРабочая оппозиция§! приходит к власти. Позднее его сменяет §RАлексей Гастев§! - технократ из Пролеткульта.\n§RТребуется:§!\n§CРеволюция§! в §Y£KR_game_rule_flag_RUS  Последствия покушения§! и §C$RULE_OPTION_SOV_PATH_NSP$§! в §Y$SOV_PATH$§!"
RULE_OPTION_SOV_PATH_NSP_SHLYAPNIKOV: "£KR_game_rule_flag_SOV   Профсоюзные активисты"
