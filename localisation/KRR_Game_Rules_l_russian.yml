RULE_OPTION_CRM_OTTOMANS_DESC: "Крымское правительство становится союзником Османской империи и впоследствии превращается в её марионетку.\n§RТребуется:§!\n§RНЕ§! §C$RULE_OPTION_CRM_GERMAN_PUPPET$§! в §Y$CRM_PATH$§!"
RULE_OPTION_CRM_RUSSIA: "£KR_game_rule_flag_CRM   £KR_game_rule_flag_RUS   Союз с Россией"
RULE_OPTION_CRM_RUSSIA_DESC: "Правительство Крыма становится союзником русских, а затем присоединяется к их сфере.\n§RТребуется:§!\n§RНЕ§! §C$RULE_OPTION_CRM_GERMAN_PUPPET$§! в §Y$CRM_PATH$§!"
RULE_OPTION_CRM_UKRAINE: "£KR_game_rule_flag_CRM   £KR_game_rule_flag_UKR   Сближение с Украиной"
RULE_OPTION_CRM_UKRAINE_DESC: "Крымское правительство становится союзником нового укранского правительства, впоследствии присоединяясь к их сфере влияния с гораздо более широкой автономией, чем прежде.\n§RТребуется:§!\n§RНЕ§! §C$RULE_OPTION_CRM_GERMAN_PUPPET$§! в §Y$CRM_PATH$§!"


