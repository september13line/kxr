RULE_OPTION_RUS_RCW_JOINT_FRONT_RRF_ONLY_DESC: "Из всех сторон Гражданской войны только Российский революционный фронт Савинкова согласится присоединиться к Антисоциалистическому фронту.\n§RТребуется:§!\n§RНе:§! §Y$RUS_RCW_SOV_RRF_PACT$§! не §Cгарантировано§!"

RUS_TREATY_DANZIG: "£KR_game_rule_flag_RUS £KR_game_rule_flag_GER   Договор о Данциге"
RULE_OPTION_RUS_TREATY_DANZIG_RANDOM: "По умолчанию"
RULE_OPTION_RUS_TREATY_DANZIG_RANDOM_DESC: "Поскольку Германия вынуждена покинуть большую часть своих бывших союзных территорий на Востоке, русское правительство готово навязать свои условия разрушающейся империи в Берлине. Более чем вероятно, что Россия подпишет соглашение со своими западными противниками."
RULE_OPTION_RUS_TREATY_DANZIG_DISABLED: "Отключено"
RULE_OPTION_RUS_TREATY_DANZIG_DISABLED_DESC: "Россия никогда не будет пытаться навязать свои условия Германии, предпочитая довести войну до её окончательного завершения."
RULE_OPTION_RUS_TREATY_DANZIG_GUARANTEED: "Гарантировано"
RULE_OPTION_RUS_TREATY_DANZIG_GUARANTEED_DESC: "Россия всегда будет навязывать свои условия Германии, когда представится возможность."

RUS_VILNIUS_ACCORDS: "£KR_game_rule_flag_GER £KR_game_rule_flag_RUS   Вильнюсские соглашения"
RULE_OPTION_RUS_VILNIUS_ACCORDS_RANDOM: "По умолчанию"
RULE_OPTION_RUS_VILNIUS_ACCORDS_RANDOM_DESC: "Поскольку Россия не достигает своих целей в Восточной Европе, военизированно более сильное германское правительство получит шанс навязать свои условия российскому режиму. Скорее всего, они воспользуются этой возможностью."
RULE_OPTION_RUS_VILNIUS_ACCORDS_DISABLED: "Отключено"
RULE_OPTION_RUS_VILNIUS_ACCORDS_DISABLED_DESC: "Германия никогда не будет пытаться навязать свои условия России, предпочитая довести войну до её окончательного исхода."
RULE_OPTION_RUS_VILNIUS_ACCORDS_GUARANTEED: "Гарантировано"
RULE_OPTION_RUS_VILNIUS_ACCORDS_GUARANTEED_DESC: "Германия всегда будет навязывать свои условия России, когда получит такую возможность."

RUS_CONFERENCE: "£KR_game_rule_flag_RUS  £KR_game_rule_flag_CAN  £KR_game_rule_flag_FRA   Эврика-конференция"
RUS_CONFERENCE_REQUIREMENTS: "\n\n§RТребуется:§!\n§CГермания побеждена во Второй Мировой войне§!\n§CАнтанта находится в состоянии войны с Третьим Интернационалом§!\n\n§CВторая Гражданская война в Америке окончена или предотвращена§! или\n§Cни один из американских участников не является членом Антанты или Третьего Интернационала§!\n\n§RНе§! §C$RULE_OPTION_RUS_POST_ASSASSINATION_REVOLUTION$§! или §C$RULE_OPTION_RUS_POST_ASSASSINATION_JUNTA$§! в §Y$RUS_POST_ASSASSINATION$§!"
RULE_OPTION_RUS_CONFERENCE_RANDOM: "По умолчанию"
RULE_OPTION_RUS_CONFERENCE_RANDOM_DESC: "Чтобы обеспечить прочный мир между победившими антигерманскими державами, в Тильзите проводится конференция для обсуждения многочисленных вопросов. Используя своё дипломатическое влияние, Россия требует заключения мирного договора на условиях статус-кво между Третьим Интернационалом и Антантой, что может стать камнем преткновения для Запада..."
RULE_OPTION_RUS_CONFERENCE_SUCCESS: "£KR_game_rule_flag_RUS  £KR_game_rule_flag_CAN  £KR_game_rule_flag_FRA   Конференция успешна"
RULE_OPTION_RUS_CONFERENCE_SUCCESS_DESC: "Третий Интернационал уступает требованиям России, и между Антантой и Интернационалом заключается де-факто мир.$RUS_CONFERENCE_REQUIREMENTS$"
RULE_OPTION_RUS_CONFERENCE_FAILURE: "£KR_game_rule_flag_RUS   Конференция провалилась"
RULE_OPTION_RUS_CONFERENCE_FAILURE_DESC: "Третий Интернационал прерывает переговоры в ответ на требования России, и война между ними и Антантой продолжается.$RUS_CONFERENCE_REQUIREMENTS$"

RUS_EURASIA_PATH: "£KR_game_rule_flag_RUS_EUR   Судьба Евразийского союза"
RULE_OPTION_RUS_EURASIA_PATH_RANDOM: "По умолчанию"
RULE_OPTION_RUS_EURASIA_PATH_RANDOM_DESC: "После создания Евразийского союза левые, православные и младоевразийцы будут соревноваться за главенство над Россией."
RULE_OPTION_RUS_EURASIA_PATH_ORTHODOX: "£KR_game_rule_flag_RUS_EUR   Православные евразийцы - Евразийский Союз"
RULE_OPTION_RUS_EURASIA_PATH_ORTHODOX_DESC: "После создания Евразийского союза православные евразийцы под руководством Николая Трубецкого выйдут победителями над другими фракциями, но не восстановят Царство."
RULE_OPTION_RUS_EURASIA_PATH_ORTHODOX_EMPIRE: "£KR_game_rule_flag_RUS_EUR_EMPIRE   Православные евразийцы - Евразийская Империя"
RULE_OPTION_RUS_EURASIA_PATH_ORTHODOX_EMPIRE_DESC: "После создания Евразийского союза православные евразийцы под руководством Николая Трубецкого одержат победу над другими фракциями и создадут Евразийскую империю."
RULE_OPTION_RUS_EURASIA_PATH_LEFT_BOLSHEVIKS: "£KR_game_rule_flag_RUS_EUR_BOL   Левые евразийцы - ПЛСР"
RULE_OPTION_RUS_EURASIA_PATH_LEFT_BOLSHEVIKS_DESC: "После создания Евразийского союза левые евразийцы под руководством Дмитрия Мирского одержат победу над другими фракциями, а в последующей борьбе за власть победят большевики."
RULE_OPTION_RUS_EURASIA_PATH_LEFT_NAZBOL: "£KR_game_rule_flag_RUS_NAZBOL   Левые евразийцы - Якобсон"
RULE_OPTION_RUS_EURASIA_PATH_LEFT_NAZBOL_DESC: "После создания Евразийского союза левые евразийцы под руководством Дмитрия Мирского одержат победу над другими фракциями, а в последующей борьбе за власть победят национал-максималисты."
RULE_OPTION_RUS_EURASIA_PATH_REVOLUTION: "£KR_game_rule_flag_SOV   Революция"
RULE_OPTION_RUS_EURASIA_PATH_REVOLUTION_DESC: "После создания Евразийского союза левые евразийцы под руководством Дмитрия Мирского одержат победу над другими фракциями, а национал-максималисты выйдут вперёд в последующей борьбе за власть, но будут свергнуты большевиками, которые развалят Евразийский союз."
RULE_OPTION_RUS_EURASIA_PATH_YOUNG_NRPR: "£KR_game_rule_flag_RUS_EUR_YOUNG   Национал-максималисты"
RULE_OPTION_RUS_EURASIA_PATH_YOUNG_NRPR_DESC: "После создания Евразийского союза младоевразийцы под руководством Льва Гумилева одержат победу над другими фракциями и будут сотрудничать с савинковистами."

TRM_PATH: "£KR_game_rule_flag_TRM   Шаткая власть Колчака"
RULE_OPTION_TRM_RANDOM: "По умолчанию"
RULE_OPTION_TRM_RANDOM_DESC: "Александр Колчак возглавляет реваншистское частично признанное государство, и будущее Приамурья неопределённо, в то время как различные политические движения в стране набирают поддержку."
RULE_OPTION_TRM_KOLCHAK_SECURES_POWER: "£KR_game_rule_flag_TRM   Колчак укрепляет свою власть"
RULE_OPTION_TRM_KOLCHAK_SECURES_POWER_DESC: "Адмирал Колчак продолжает своё твёрдое правление Приамурьем."
RULE_OPTION_TRM_CW: "£KR_game_rule_flag_TRM £KR_game_rule_flag_SIB £KR_game_rule_flag_TRM_SEM  Хаос на Дальнем Востоке"
RULE_OPTION_TRM_CW_DESC: "Из-за неудачной политики Колчака в отношении меньшинств якуты восстают против его деспотического правления, вызывая хаос на Дальнем Востоке и Гражданскую войну между различными фракциями."
RULE_OPTION_TRM_NRA_COUP: "£KR_game_rule_flag_TRM_NRA   Народная революция - НРА"
RULE_OPTION_TRM_NRA_COUP_DESC: "Во время социалистических волнений в Чите §NНародно-революционной армии§! удаётся свергнуть Колчака и установить социалистическое правление по всему Приамурью. Возглавляемая §NНиколаем Калашниковым§! социалистическая хунта впоследствии удерживает власть."
RULE_OPTION_TRM_SOCDEM_MLADOROSSI: "£KR_game_rule_flag_TRM_Mlad   Контрпереворот младороссов Угримова"
RULE_OPTION_TRM_SOCDEM_MLADOROSSI_DESC: "§MАлександр Угримов§! захватил власть из рук Казем-Бека, разгневанный его партиями и возросшими расходами на предметы роскоши, и теперь быстро приступает к созданию нового синкретического слияния §Mмонархизма и социализма§! в дальневосточном государстве Приамурье."
RULE_OPTION_TRM_MLADOROSSI: "£KR_game_rule_flag_TRM_Mlad   Младороссы приходят к власти"
RULE_OPTION_TRM_MLADOROSSI_DESC: "Казем-Бек захватил аппарат государственной власти с крахом режима Колчака и теперь быстро приступает к созданию нового синкретического слияния монархизма и социализма под руководством своего движения §Vмладороссов§!."
RULE_OPTION_TRM_NATSI: "£KR_game_rule_flag_TRM_Nats   Националисты приходят к власти"
RULE_OPTION_TRM_NATSI_DESC: "Казем-Бек захватил аппарат государственной власти с крахом режима Колчака. Заключив союз с националистами, он открывает возможность §FАнастасию Вонсяцкому§! стать новым Вождём."
RULE_OPTION_TRM_MONARCHY: "£KR_game_rule_flag_TRM_empire   Земский собор генерала Дитерихса"
RULE_OPTION_TRM_MONARCHY_DESC: "Режим Колчака рушится, и §nМихаил Дитерихс§! становится Воеводой дальневосточного государства. Он созывает Земский собор и приглашает претендента Никиту Александровича править Россией."
RULE_OPTION_TRM_PEPEL: "£KR_game_rule_flag_TRM_pepel   Сибирский Суворов"
RULE_OPTION_TRM_PEPEL_DESC: "Режим Колчака рушится, и генерал §gАнатолий Пепеляев§! становится новым Верховным правителем. Позже он продолжает цель Колчака по объединению России."
RULE_OPTION_TRM_PEPEL_OBL: "£KR_game_rule_flag_TRM_pepel £KR_game_rule_flag_SIB   Сибирский Суворов - Областник"
RULE_OPTION_TRM_PEPEL_OBL_DESC: "Режим Колчака рушится, и генерал §gАнатолий Пепеляев§! становится новым Верховным правителем. Позже он решает провозгласить независимость Сибири, отказываясь от общероссийских амбиций."
RULE_OPTION_TRM_OBLASTNIKI: "£KR_game_rule_flag_SIB   Победа сибирских областников"
RULE_OPTION_TRM_OBLASTNIKI_DESC: "Режим Колчака рушится, и §lсибирские областники§! приходят к власти через выборы."
RULE_OPTION_TRM_MARLIB: "£KR_game_rule_flag_SIB   Победа демократических либералов"
RULE_OPTION_TRM_MARLIB_DESC: "Режим Колчака рушится, и §mлибералы§! Виктора Пепеляева приходят к власти через выборы."
RULE_OPTION_TRM_MERKULOV: "£KR_game_rule_flag_TRM   Торговый дом Меркуловых"
RULE_OPTION_TRM_MERKULOV_DESC: "Режим Колчака рушится, и Народное собрание во главе с братьями Меркуловыми и их §cКонгрессом несоциалистических организаций§! формирует новое правительство."
RULE_OPTION_TRM_SEMYONOV: "£KR_game_rule_flag_TRM  Диктатура атамана Семёнова"
RULE_OPTION_TRM_SEMYONOV_DESC: "Режим Колчака рушится, и §gатаман Семёнов§! берёт власть. Позже он укрепляет свою власть в §Pперсоналистической диктатуре§!."
RULE_OPTION_TRM_SEMYONOV_MONARCHY: "£KR_game_rule_flag_TRM_TSAR  Атаман Семёнов - Регентство"
RULE_OPTION_TRM_SEMYONOV_MONARCHY_DESC: "Режим Колчака рушится, и §gатаман Семёнов§! берёт власть. Позже он либо вынужден обстоятельствами, либо сам решает установить §hРегентство§! для восстановления монархии после освобождения России."
RULE_OPTION_TRM_SEMYONOV_COSSACK: "£KR_game_rule_flag_TRM_TRB  Атаман Семёнов - Казачье войско"
RULE_OPTION_TRM_SEMYONOV_COSSACK_DESC: "Режим Колчака рушится, и §gатаман Семёнов§! берёт власть. Позже он отказывается от общероссийских амбиций, вместо этого пытаясь построить могущественное сепаратистское казачье государство."
RULE_OPTION_TRM_YUI: "£KR_game_rule_flag_TRM_JAP  £KR_game_rule_flag_JAP  Японская прислужница"
RULE_OPTION_TRM_YUI_DESC: "Юи Мицуэ правит этими восточными окраинами, переименовывая землю в Энкайсю, пока ведёт нацию всё глубже в хватку Японии и её амбициозного императора. Приамурье больше не будет российским эксклавом!"
RULE_OPTION_TRM_CZECH_PANSLAVISTS: "£KR_game_rule_flag_TRM_Czech   Панславистский Чешский легион Войцеховского"
RULE_OPTION_TRM_CZECH_PANSLAVISTS_DESC: "§nЧешскому легиону§! удалось захватить власть в дальневосточном хаосе. Под руководством генерала §nВойцеховского§! на Дальнем Востоке поднялось новое панславистское движение."
RULE_OPTION_TRM_CZECH_EXILE: "£KR_game_rule_flag_TRM_Czech   Изгнанная Чехословакия Гайды"
RULE_OPTION_TRM_CZECH_EXILE_DESC: "§nЧешскому легиону§! удалось захватить власть в дальневосточном хаосе. Под руководством генерала §nГайды§! на Дальнем Востоке провозглашается истинная Чехословацкая республика."


TRM_NRA_THIRD_CONGRESS: "£KR_game_rule_flag_TRM_socialist   Третий съезд НРА"
RULE_OPTION_TRM_NRA_THIRD_CONGRESS_RANDOM: "По умолчанию"
RULE_OPTION_TRM_NRA_THIRD_CONGRESS_RANDOM_DESC: "После периода стабилизации партизанского режима §NНародно-революционная армия§! проводит свой Третий съезд, чтобы наконец учредить гражданское правительство."
RULE_OPTION_TRM_NRA_COUP_ATHEISTS: "£KR_game_rule_flag_TRB_totalist   Воинствующие безбожники"
RULE_OPTION_TRM_NRA_COUP_ATHEISTS_DESC: "$RULE_OPTION_TRM_RANDOM_DESC$ §VБольшевистское§! крыло НРА берет верх и избирает §zЕмельяна Ярославского§! - лидера-воинствующего безбожника."
RULE_OPTION_TRM_NRA_COUP_BOLSHEVIKS: "£KR_game_rule_flag_TRM_socialist   Премьер-зиновьевец"
RULE_OPTION_TRM_NRA_COUP_BOLSHEVIKS_DESC: "$RULE_OPTION_TRM_RANDOM_DESC$ §VБольшевистское§! крыло НРА берет верх и избирает §VПетра Никифорова§! - кандидата, ориентированного на Зиновьева."
RULE_OPTION_TRM_NRA_COUP_KRASNOSHYOKOV: "£KR_game_rule_flag_TRM_socialist   Сторонник НЭПа"
RULE_OPTION_TRM_NRA_COUP_KRASNOSHYOKOV_DESC: "$RULE_OPTION_TRM_RANDOM_DESC$ §VБольшевистское§! крыло НРА берет верх и избирает §NАлександра Краснощекова§! - кандидата, ориентированного на Бухарина."
RULE_OPTION_TRM_NRA_COUP_RYUTIN: "£KR_game_rule_flag_TRM_socialist   Премьер-бухаринец"
RULE_OPTION_TRM_NRA_COUP_RYUTIN_DESC: "$RULE_OPTION_TRM_RANDOM_DESC$ §VБольшевистское§! крыло НРА берет верх и избирает §NМартемьяна Рютина§! - стойкого кандидата, ориентированного на Бухарина, из Харбина."
RULE_OPTION_TRM_NRA_COUP_SYNDIE: "£KR_game_rule_flag_TRM_socialist   Центросибирь Шумяцкого"
RULE_OPTION_TRM_NRA_COUP_SYNDIE_DESC: "$RULE_OPTION_TRM_RANDOM_DESC$ §VБольшевистское§! крыло НРА берет верх и избирает умеренного кандидата из Центросибири - §RБориса Шумяцкого§!."
RULE_OPTION_TRM_NRA_COUP_RADSOC: "£KR_game_rule_flag_TRM_NRA   Политический центр"
RULE_OPTION_TRM_NRA_COUP_RADSOC_DESC: "$RULE_OPTION_TRM_RANDOM_DESC$ Коалиция §Mэсеров и меньшевиков§! - Политический центр - берет власть под руководством Флориана Федоровича и Евгения Колосова."


TRM_JAPAN_INTERVENTION: "£KR_game_rule_flag_TRM  £KR_game_rule_flag_JAP  Японская интервенция в Приамуре"
RULE_OPTION_TRM_JAPAN_INTERVENTION_RANDOM: "По умолчанию"
RULE_OPTION_TRM_JAPAN_INTERVENTION_RANDOM_DESC: "Изменения в политике Приамура заставляют его занять антияпонскую позицию. Будет ли Империя терпеть это, пока неизвестно."
RULE_OPTION_TRM_JAPAN_INTERVENTION_TRUE: "£KR_game_rule_flag_TRM  £KR_game_rule_flag_JAP  Гарантировать"
RULE_OPTION_TRM_JAPAN_INTERVENTION_TRUE_DESC: "Изменения в политике Приамура заставляют его занять антияпонскую позицию. Япония осуществляет прямое вмешательство, чтобы восстановить порядок."
RULE_OPTION_TRM_JAPAN_INTERVENTION_FALSE: "£KR_game_rule_flag_TRM  Отключить"
RULE_OPTION_TRM_JAPAN_INTERVENTION_FALSE_DESC: "Изменения в политике Приамура заставляют его занять антияпонскую позицию. Япония решила воздержаться от прямого вмешательства."

TRM_FORPOL: "£KR_game_rule_flag_TRM   Внешняя политика Приамура"
RULE_OPTION_TRM_FORPOL_RANDOM: "По умолчанию"
RULE_OPTION_TRM_FORPOL_RANDOM_DESC: "После освобождения от японского ига и оккупации Сибири Приамуру предстоит выбрать свою внешнюю политику."
