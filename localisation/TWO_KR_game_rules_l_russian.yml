RULE_OPTION_DEN_FUTURE_DEMOCRACY_MARLIB_DESC: "После провала переговоров о восстановлении экономики социал-демократическое правительство падает, и новое правительство формируется рыночно-либеральным Венстре. Страна беспрекословно присоединится к Вельткригу."
