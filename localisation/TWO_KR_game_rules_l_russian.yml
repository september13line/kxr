RULE_OPTION_CAN_REFERENDUM_RANDOM: "По умолчанию"
RULE_OPTION_CAN_REFERENDUM_RANDOM_DESC: "Возможно, Король и вернулся на Родные острова, но из-за тягот недавней войны наше общество очень раздроблено. Все больше и больше людей говорят о том, чтобы покинуть Империю и решить свою собственную судьбу."
RULE_OPTION_CAN_REFERENDUM_MEMBER_OR_THE_EMPIRE: "£KR_game_rule_flag_CAN Остаться в Империи"
RULE_OPTION_CAN_REFERENDUM_MEMBER_OR_THE_EMPIRE_DESC: "Канада останется в составе Империи, считая это своим долгом."
RULE_OPTION_CAN_POLITICAL_REPUBLIC: "£KR_game_rule_flag_CAN_republic Разорвать связи с монархией"
RULE_OPTION_CAN_POLITICAL_REPUBLIC_DESC: "Канада решит порвать с Великобританией и провозгласит республику."

COS_ELECTION: "£KR_game_rule_flag_COS   Выборы 1936 года"
RULE_OPTION_COS_ELECTION_RANDOM: "По умолчанию"
RULE_OPTION_COS_ELECTION_RANDOM_DESC: "В то время как превосходство PRN на предстоящих выборах неоспоримо, в партии существуют разногласия по поводу того, кого выдвигать в качестве кандидата в президенты."
RULE_OPTION_COS_ELECTION_CONSERVATIVE: "£KR_game_rule_flag_COS   Победа консерваторов"
RULE_OPTION_COS_ELECTION_CONSERVATIVE_DESC: "Кортес выдвигается кандидатом в президенты. К всеобщему удивлению, PRN побеждает на выборах, и Кортес становится лидером нации."
RULE_OPTION_COS_ELECTION_CALDERON: "£KR_game_rule_flag_COS   Победа социалистов"
RULE_OPTION_COS_ELECTION_CALDERON_DESC: "Кальдерон выдвигается кандидатом в президенты. К всеобщему удивлению, PRN побеждает на выборах, и Кальдерон становится лидером нации. Однако Кальдерон радикально меняет свою политику и начинает проводить социалистические реформы. Ему удается остаться у власти на второй срок."
RULE_OPTION_COS_ELECTION_WORKERS: "£KR_game_rule_flag_COS   Синдикалистский переворот"
RULE_OPTION_COS_ELECTION_WORKERS_DESC: "Кальдерон выдвигается кандидатом в президенты. К всеобщему удивлению, PRN побеждает на выборах, и Кальдерон становится лидером нации. Однако Кальдерон радикально меняет свою политику и начинает проводить социалистические реформы. После начала его второго срока происходит синдикалистский переворот, и Коста-Рика объединяется с соседней синдикалистской страной. \n§RТребуется:§!\n§CЦентроамерика или Никарагуа должны быть синдикалистскими§!"
RULE_OPTION_COS_ELECTION_PATAUT: "£KR_game_rule_flag_COS   Военный переворот"
RULE_OPTION_COS_ELECTION_PATAUT_DESC: "Кальдерон выдвигается кандидатом в президенты. К всеобщему удивлению, PRN побеждает на выборах, и Кальдерон возглавляет страну. Однако Кальдерон радикально меняет политику и начинает проводить социалистические реформы. После начала его второго срока происходит синдикалистский переворот, но военные быстро организуют контрпереворот и передают власть социал-консерваторам."
RULE_OPTION_COS_ELECTION_LEGION_DUTY: "£KR_game_rule_flag_COS   Феррер берёт управление на себя - Выполнить наш долг"
RULE_OPTION_COS_ELECTION_LEGION_DUTY_DESC: "После начала второго срока Кальдерона переворачивает Легион Карибе. Переворот удается, и социал-демократ Фигерас Феррер провозглашает Хунту. Феррер попытается освободить Центральную Америку от диктаторских режимов."
RULE_OPTION_COS_ELECTION_LEGION_BEACON: "£KR_game_rule_flag_COS   Феррер берёт контроль - Маяк-Прогресс"
RULE_OPTION_COS_ELECTION_LEGION_BEACON_DESC: "После начала второго срока Кальдерона переворачивает Карибский легион. Переворот удается, и социал-демократ Фигерес Феррер провозглашает Хунту. Феррер сосредоточился на стабильности Коста-Рики."
RULE_OPTION_COS_ELECTION_ZKG: "£KR_game_rule_flag_COS   Z.K.G. приходит к власти"
RULE_OPTION_COS_ELECTION_ZKG_DESC: "Когда их власть никем не ограничена, немецкие кофейные бароны подменяют собой правительство Коста-Рики и учреждают новую корпоративную диктатуру."

COS_FOREIGN_POLICY: "£KR_game_rule_flag_COS   Внешняя политика Коста-Рики"
RULE_OPTION_COS_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_COS_FOREIGN_POLICY_RANDOM_DESC: "Такая маленькая страна, как Коста-Рика, должна попытаться найти какого-то покровителя в эти неспокойные времена."
RULE_OPTION_COS_FOREIGN_POLICY_NEUTRAL: "£KR_game_rule_flag_COS   Нейтралитет"
RULE_OPTION_COS_FOREIGN_POLICY_NEUTRAL_DESC: "Страна сохранит нейтралитет, надеясь, что будущие события обойдут её стороной."
RULE_OPTION_COS_FOREIGN_POLICY_GUARANTEE_CANADA: "£KR_game_rule_flag_COS   £KR_game_rule_flag_CAN   Гарантии от Антанты"
RULE_OPTION_COS_FOREIGN_POLICY_GUARANTEE_CANADA_DESC: "Страна обращается за гарантиями к Канаде и получает их. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_COS_FOREIGN_POLICY_GUARANTEE_GERMANY: "£KR_game_rule_flag_COS   £KR_game_rule_flag_GER   Гарантии от Рейхспакта"
RULE_OPTION_COS_FOREIGN_POLICY_GUARANTEE_GERMANY_DESC: "Страна обращается за гарантиями к Германии и получает их. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_COS_FOREIGN_POLICY_ENTENTE: "£KR_game_rule_flag_COS   £KR_game_rule_flag_CAN   Антанта"
RULE_OPTION_COS_FOREIGN_POLICY_ENTENTE_DESC: "Страна обращается за гарантиями к Канаде и получает их. Впоследствии она присоединяется к Антанте. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_COS_FOREIGN_POLICY_REICHSPAKT: "£KR_game_rule_flag_COS   £KR_game_rule_flag_GER   Рейхспакт"
RULE_OPTION_COS_FOREIGN_POLICY_REICHSPAKT_DESC: "Страна подает заявку и получает гарантии от Германии. Впоследствии она вступает в Рейхспакт. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"

RULE_OPTION_CUB_STRIKE_DEMOCRACY_MARLIB: "£KR_game_rule_flag_CUB   Демократия - Республика"
RULE_OPTION_CUB_STRIKE_DEMOCRACY_MARLIB_DESC: "Забастовка разгоняется, а умеренные несогласные умиротворяются. Политическое влияние фракции генерала Диаса ослабевает, и в конце концов она ликвидируется в результате неудачной попытки переворота. На новых выборах побеждает рыночная либеральная партия "Республиканцы"."
RULE_OPTION_CUB_STRIKE_DEMOCRACY_SOCLIB: "£KR_game_rule_flag_CUB   Демократия - Либералы"
RULE_OPTION_CUB_STRIKE_DEMOCRACY_SOCLIB_DESC: "Забастовка прекращена, умеренные несогласные умиротворены. Политическое влияние фракции генерала Диаса ослабевает и, в конце концов, ликвидируется в результате неудачной попытки переворота. На новых выборах побеждает социал-либеральная партия "Нуэво Либерал"."
RULE_OPTION_CUB_STRIKE_DEMOCRACY_SOCDEM: "£KR_game_rule_flag_CUB   Демократия - Консерваторы"
RULE_OPTION_CUB_STRIKE_DEMOCRACY_SOCDEM_DESC: "Забастовка прекращена, умеренные несогласные умиротворены. Политическое влияние фракции генерала Диаса ослабевает и, в конце концов, ликвидируется в результате неудачной попытки переворота. На новых выборах побеждает социал-демократическая Униониста"
RULE_OPTION_CUB_STRIKE_SOCIALIST_RADSOC: "£KR_game_rule_flag_CUB   Социалисты - Радикальные"
RULE_OPTION_CUB_STRIKE_SOCIALIST_RADSOC_DESC: "Гражданское правительство распадается, и к власти приходит свободная коалиция социалистов. Радикальные социалисты Революсьонарио берут власть на новом Всесоциалистическом конгрессе."
RULE_OPTION_CUB_STRIKE_SOCIALIST_SYN: "£KR_game_rule_flag_CUB   Социалисты - Синдикалисты"
RULE_OPTION_CUB_STRIKE_SOCIALIST_SYN_DESC: "Гражданское правительство распадается, и к власти приходит свободная коалиция социалистов. Синдикалисты Trabajadores приходят к власти на новом Всесоциалистическом конгрессе."
RULE_OPTION_CUB_STRIKE_SOCIALIST_TOTAL: "£KR_game_rule_flag_CUB   Социалисты - Тоталисты"
RULE_OPTION_CUB_STRIKE_SOCIALIST_TOTAL_DESC: "Гражданское правительство распадается, и к власти приходит свободная коалиция социалистов. Тоталисты-коммунисты приходят к власти на новом Всесоциалистическом конгрессе."
RULE_OPTION_CUB_STRIKE_LAPDOG: "£KR_game_rule_flag_CUB   £KR_game_rule_flag_USA   Американская вислоухая собака"
RULE_OPTION_CUB_STRIKE_LAPDOG_DESC: "Гражданское правительство рушится, и к власти приходит свободная коалиция социалистов. Этот новый социалистический режим, в свою очередь, свергается с помощью Соединённых Штатов. Генерал Диас отказывается подчиниться требованиям Америки, и в итоге американцы устанавливают в Гаване полностью подчиненный режим."


CUB_FOREIGN_POLICY: "£KR_game_rule_flag_CUB   Внешняя политика Кубы"
RULE_OPTION_CUB_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_CUB_FOREIGN_POLICY_RANDOM_DESC: "Встанет ли Куба на сторону старых друзей, будет ли искать новых союзников или попытается сохранить полный нейтралитет?"
RULE_OPTION_CUB_FOREIGN_POLICY_ALONE: "£KR_game_rule_flag_CUB  Куба в одиночестве"
RULE_OPTION_CUB_FOREIGN_POLICY_ALONE_DESC: "Куба не будет пытаться присоединиться к какой-либо фракции."
RULE_OPTION_CUB_FOREIGN_POLICY_WAIT: "£KR_game_rule_flag_CUB  Старые друзья - Подождать"
RULE_OPTION_CUB_FOREIGN_POLICY_WAIT_DESC: "Куба попытается присоединиться к фракции того, кто победит в Гражданской войне в США. Если они не являются членами какой-либо фракции или Кубе не разрешат присоединиться, Куба вместо этого будет добиваться гарантий."
RULE_OPTION_CUB_FOREIGN_POLICY_USA: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_USA  Старые друзья - США"
RULE_OPTION_CUB_FOREIGN_POLICY_USA_DESC: "Куба попытается присоединиться к фракции США, если они победят в Гражданской войне в США. Если США не являются членами какой-либо фракции или Кубе не разрешат присоединиться, Куба вместо этого будет добиваться гарантий."
RULE_OPTION_CUB_FOREIGN_POLICY_CSA: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_CSA  Старые друзья - КША"
RULE_OPTION_CUB_FOREIGN_POLICY_CSA_DESC: "Куба попытается присоединиться к фракции КША, если они победят в Гражданской войне в США. Если КША не являются членами какой-либо фракции или Кубе не разрешат присоединиться, Куба вместо этого будет добиваться гарантий."
RULE_OPTION_CUB_FOREIGN_POLICY_TEX: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_TEX  Старые друзья - АСШ"
RULE_OPTION_CUB_FOREIGN_POLICY_TEX_DESC: "Куба попытается присоединиться к фракции АСШ, если они победят в Гражданской войне в США. Если АСШ не являются членами какой-либо фракции или Кубе не разрешат присоединиться, Куба вместо этого будет добиваться гарантий."
RULE_OPTION_CUB_FOREIGN_POLICY_PSA: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_CAL  Старые друзья - ТША"
RULE_OPTION_CUB_FOREIGN_POLICY_PSA_DESC: "Куба попытается присоединиться к фракции ТША, если они победят в Гражданской войне в США. Если ТША не являются членами какой-либо фракции или Кубе не разрешат присоединиться, Куба вместо этого будет добиваться гарантий."
RULE_OPTION_CUB_FOREIGN_POLICY_GER: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_GER  Рейхспакт"
RULE_OPTION_CUB_FOREIGN_POLICY_GER_DESC: "Куба попытается присоединиться к Рейхспакту.\n§RТребуется:§!\n§RНе§! §CСоциалистическая революция§! в §Y£KR_game_rule_flag_CUB  Гаванская забастовка§!"
RULE_OPTION_CUB_FOREIGN_POLICY_FRA: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_FRA  Интернационал"
RULE_OPTION_CUB_FOREIGN_POLICY_FRA_DESC: "Куба попытается присоединиться к Интернационалу.\n§RТребуется:§!\n§CСоциалистическая революция§! в §Y£KR_game_rule_flag_CUB  Гаванская забастовка§!"
RULE_OPTION_CUB_FOREIGN_POLICY_CAN: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_CAN  Антанта"
RULE_OPTION_CUB_FOREIGN_POLICY_CAN_DESC: "Если США падут, Куба попытается сформировать коалицию с Канадой против КША. После войны Куба попытается присоединиться к Антанте.\n§RТребуется:§!\n§RНе§! §CСоциалистическая революция§! в §Y£KR_game_rule_flag_CUB  Гаванская забастовка§!"
RULE_OPTION_CUB_FOREIGN_POLICY_COS: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_COS  Коста-Рика"
RULE_OPTION_CUB_FOREIGN_POLICY_COS_DESC: "Куба попытается присоединиться к Демократическому альянсу Карибского бассейна Коста-Рики, если он будет сформирован.\n§RТребуется:§!\n§CДемократия возрождена§! в §Y£KR_game_rule_flag_CUB  Гаванская забастовка§!"
RULE_OPTION_CUB_FOREIGN_POLICY_AUS: "£KR_game_rule_flag_CUB  £KR_game_rule_flag_AUS  Дунайско-Адриатический союз"
RULE_OPTION_CUB_FOREIGN_POLICY_AUS_DESC: "Куба попытается присоединиться к Дунайско-Адриатическому союзу.\n§RТребуется:§!\n§RНе§! §CСоциалистическая революция§! в §Y£KR_game_rule_flag_CUB  Гаванская забастовка§!"

ELS_REVOLUTION: "£KR_game_rule_flag_ELS   Революция 1937 года"
RULE_OPTION_ELS_REVOLUTION_RANDOM: "По умолчанию"
RULE_OPTION_ELS_REVOLUTION_RANDOM_DESC: "Как и в 1932 году, огонь революции вновь охватил Сальвадор. Только время покажет, кто возьмет верх и сумеет захватить власть в Сальвадоре."
RULE_OPTION_ELS_REVOLUTION_NEWGUARD: "£KR_game_rule_flag_ELS   Новая гвардия"
RULE_OPTION_ELS_REVOLUTION_NEWGUARD_DESC: "Тиран Мартинес свергнут, и вместо него новым президентом стал Осмин Агирре-и-Салинас. Салинасу удается подавить повстанцев и обеспечить победу патернализму Новой гвардии. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_ELS_REVOLUTION_PROPATRIA: "£KR_game_rule_flag_ELS   Pro Patria держится"
RULE_OPTION_ELS_REVOLUTION_PROPATRIA_DESC: "Национальная популистская партия Pro Patria во главе с Мартинесом побеждает повстанцев, вновь укрепляя свои позиции. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_ELS_REVOLUTION_SYNDIE: "£KR_game_rule_flag_ELS_syndicalist   Мечта синдикалиста"
RULE_OPTION_ELS_REVOLUTION_SYNDIE_DESC: "Синдикалисты победили в своей революции, и они поведут Сальвадор к лучшему завтрашнему дню. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_ELS_REVOLUTION_SOCDEM: "£KR_game_rule_flag_ELS   Лейбористская Партия"
RULE_OPTION_ELS_REVOLUTION_SOCDEM_DESC: "Демократическая фракция революции добивается успеха в восстановлении президентства. Позже назначаются внеочередные выборы, на которых побеждает социал-демократическая партия Partido Laborista. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_ELS_REVOLUTION_SOCLIB: "£KR_game_rule_flag_ELS   Национальная демократическая партия"
RULE_OPTION_ELS_REVOLUTION_SOCLIB_DESC: "Демократическая фракция революции добивается успеха в восстановлении президентства. Позже назначаются внеочередные выборы, на которых побеждает социал-либеральная партия Partido Nacional Democratico. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"
RULE_OPTION_ELS_REVOLUTION_MILITARY: "£KR_game_rule_flag_ELS   Военный захват"
RULE_OPTION_ELS_REVOLUTION_MILITARY_DESC: "В результате неожиданного поворота событий Сальвадор Кастанеда Кастро заключает президента в тюрьму и объявляет себя временным президентом, чтобы уберечь нацию от экстремизма. \n§RТребуется:§!\nКаждая §CWar§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"

GUA_CIVILWAR: "£KR_game_rule_flag_GUA   Письмо 311"
RULE_OPTION_GUA_CIVILWAR_RANDOM: "По умолчанию"
RULE_OPTION_GUA_CIVILWAR_RANDOM_DESC: "Партия национального прогресса, разочарованная отсутствием демократии в Гватемале, отправляет президенту письмо с требованием реформ. Однако письмо предназначалось лишь для выигрыша времени, поскольку они объявили открытое восстание, приведшее к гражданской войне."
RULE_OPTION_GUA_CIVILWAR_ORELLANA: "£KR_game_rule_flag_GUA   Орельяна побеждает"
RULE_OPTION_GUA_CIVILWAR_ORELLANA_DESC: "Вопреки всему Орельяне удалось остаться президентом после победы над повстанцами и выигрыша гражданской войны."
RULE_OPTION_GUA_CIVILWAR_REDNPP: "£KR_game_rule_flag_GUA_radical_socialist   Партия Народного фронта освобождения"
RULE_OPTION_GUA_CIVILWAR_REDNPP_DESC: "Революция увенчалась успехом, и на последующих выборах радикал-социалистической Партии Народного фронта освобождения удаётся добиться победы."
RULE_OPTION_GUA_CIVILWAR_PINKNPP: "£KR_game_rule_flag_GUA   Партия национального обновления"
RULE_OPTION_GUA_CIVILWAR_PINKNPP_DESC: "Революция увенчалась успехом, и на последующих выборах социал-демократической Партии национального обновления удаётся добиться победы."
RULE_OPTION_GUA_CIVILWAR_BLUENPP: "£KR_game_rule_flag_GUA   Юнионистская партия"
RULE_OPTION_GUA_CIVILWAR_BLUENPP_DESC: "Революция увенчалась успехом, и на последующих выборах социал-консервативной Юнионистской партии удаётся добиться победы."
RULE_OPTION_GUA_CIVILWAR_UBICO: "£KR_game_rule_flag_GUA   Убико побеждает"
RULE_OPTION_GUA_CIVILWAR_UBICO_DESC: "Патерналистский автократ Убико выигрывает гражданскую войну, и тем самым начинается период восстановления страны."
RULE_OPTION_GUA_CIVILWAR_UFCCOUP: "£KR_game_rule_flag_GUA   Контрреволюция UFC"
RULE_OPTION_GUA_CIVILWAR_UFCCOUP_DESC: "Партия национального прогресса выигрывает гражданскую войну, но Убико возвращается с армией наёмников, оплаченных UFC, и совершает переворот против правительства."

HAW_POLITIC: "£KR_game_rule_flag_HAW   Чрезвычайная ситуация на островах"
RULE_OPTION_HAW_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_HAW_POLITIC_RANDOM_DESC: "После начала второй американской Гражданской войны Гавайи решили получить независимость. Кто получит власть после всеобщей забастовки?"
RULE_OPTION_HAW_POLITIC_KINGDOM: "£KR_game_rule_flag_HAW_kingdom   Основание Королевства"
RULE_OPTION_HAW_POLITIC_KINGDOM_DESC: "Всеобщая забастовка потерпела поражение. Чрезвычайный комитет объявил, что конституционная монархия, свергнутая коалицией американских и европейских бизнесменов в результате переворота 1893 года, будет восстановлена."
RULE_OPTION_HAW_POLITIC_REPUBLIC: "£KR_game_rule_flag_HAW   Провозглашение республики"
RULE_OPTION_HAW_POLITIC_REPUBLIC_DESC: "Всеобщая забастовка проиграна. Чрезвычайное собрание приняло решение о создании республики."
RULE_OPTION_HAW_POLITIC_SOCIALIST: "£KR_game_rule_flag_HAW_radical_socialist   Социалистическая революция"
RULE_OPTION_HAW_POLITIC_SOCIALIST_DESC: "Всеобщая забастовка побеждает, и провозглашается Гавайская коммуна."
RULE_OPTION_HAW_POLITIC_USA: "£KR_game_rule_flag_USA   Аннексия США"
RULE_OPTION_HAW_POLITIC_USA_DESC: "Всеобщая забастовка проиграна. Чрезвычайный комитет на Гавайях решил, что они должны оставаться частью Америки и признает федеральное правительство законным правительством."
RULE_OPTION_HAW_POLITIC_PSA: "£KR_game_rule_flag_CAL   Аннексия ТША"
RULE_OPTION_HAW_POLITIC_PSA_DESC: "Всеобщая забастовка проиграна. Комитет по чрезвычайному положению на Гавайях решил, что они должны оставаться частью Америки и признает Тихоокеанские штаты законным правительством."

