RULE_OPTION_MEX_YUCATAN_REVOLT_YES_DESC: "После отмены законов о коренном населении ситуация на Юкатане накаляется, и Юкатан отделяется от Мексики. \n§RТребуется:§!\n§CJunta restores "Democracy"§! или §CJunta Holds on to Power§! в §Y£KR_game_rule_flag_MEX_syndicalist   Assassination attempt on Zapata§!"

