RULE_OPTION_MAF_REFORM_RANDOM_DESC: "Левая Реформгруппа начнёт амбициозный проект по реформированию Федерации в более справедливое общество. \n§RТребуется:§!\n§CReformgruppe у власти§! в §Y£KR_game_rule_flag_MAF  Режим в Миттельафрике§! и §CЛевая Реформгруппа§! в §Y£KR_game_rule_flag_MAF  Выборы Миттельафрики§!"
RULE_OPTION_MAF_REFORM_SUCCESS: "£KR_game_rule_flag_MAF  Успешные реформы"
RULE_OPTION_MAF_REFORM_SUCCESS_DESC: "С установлением настоящей конституции и избирательной системы Миттельафрика прокладывает путь к становлению мощной демократии. \n§RТребуется:§!\n§CReformgruppe у власти§! в §Y£KR_game_rule_flag_MAF  Режим в Миттельафрике§! и §CЛевая Реформгруппа§! в §Y£KR_game_rule_flag_MAF  Выборы Миттельафрики§!"
RULE_OPTION_MAF_REFORM_BELL: "£KR_game_rule_flag_MAF  Успешные реформы, избран Бель"
RULE_OPTION_MAF_REFORM_BELL_DESC: "С установлением настоящей конституции и избирательной системы Миттельафрика прокладывает путь к становлению мощной демократии, что приводит к избранию Александра Дуала Манга Бель. \n§RТребуется:§!\n§CReformgruppe у власти§! в §Y£KR_game_rule_flag_MAF  Режим в Миттельафрике§! и §CЛевая Реформгруппа§! в §Y£KR_game_rule_flag_MAF  Выборы Миттельафрики§!"
RULE_OPTION_MAF_REFORM_KENYATTA: "£KR_game_rule_flag_MAF   Успешные реформы, избран Кениатта"
RULE_OPTION_MAF_REFORM_KENYATTA_DESC: "С установлением настоящей конституции и избирательной системы Миттельафрика прокладывает путь к становлению мощной демократии, что приводит к избранию Джомо Кениатты. \n§RТребуется:§!\n§CReformgruppe у власти§! в §Y£KR_game_rule_flag_MAF  Режим в Миттельафрике§! и §CЛевая Реформгруппа§! в §Y£KR_game_rule_flag_MAF  Выборы Миттельафрики§!"

SAF_POLITIC: "£KR_game_rule_flag_SAF   Южная Африка"
RULE_OPTION_SAF_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_SAF_POLITIC_RANDOM_DESC: "Всеобщие выборы в Южной Африке запланированы на май 1938 года; однако напряжённость уже высока в 1936 году. Какая партия будет контролировать Южную Америку после окончания выборов?"
RULE_OPTION_SAF_POLITIC_HERTZOG_ALONE: "£KR_game_rule_flag_SAF   Национальная партия в 1936 году"
RULE_OPTION_SAF_POLITIC_HERTZOG_ALONE_DESC: "Досрочные выборы состоятся в 1936 году. Национальная партия Дж. Б. М. Герцога одержит победу и сосредоточится на внедрении апартеида."
RULE_OPTION_SAF_POLITIC_HERTZOG_COALITION: "£KR_game_rule_flag_SAF   Объединённая партия"
RULE_OPTION_SAF_POLITIC_HERTZOG_COALITION_DESC: "В неожиданном повороте событий давние заклятые соперники из Национальной партии и Южноафриканской партии объединятся в Объединённую партию, создав умеренное правительство, лояльное британцам."
RULE_OPTION_SAF_POLITIC_MALAN: "£KR_game_rule_flag_SAF_republic_angry_brits_national_populist   Национальная партия в 1938 году"
RULE_OPTION_SAF_POLITIC_MALAN_DESC: "Д. Ф. Малан переиграет Герцога перед выборами и превратит Национальную партию в более экстремистскую организацию. После их победы Малан объявит республику, что вызовет новую войну в Африке."
RULE_OPTION_SAF_POLITIC_SMUTS: "£KR_game_rule_flag_SAF   Южноафриканская партия"
RULE_OPTION_SAF_POLITIC_SMUTS_DESC: "Я. К. Смэтс приведёт антирасистскую и лояльную Антанте Южноафриканскую партию к победе, приняв социал-либерализм."
RULE_OPTION_SAF_POLITIC_KADALIE: "£KR_game_rule_flag_SAF_syndicalist   Синдикалистская революция"
RULE_OPTION_SAF_POLITIC_KADALIE_DESC: "Левые забастовки после Чёрного понедельника не прекратятся мирно. После того, как пыль уляжется, социалистическая ISL согласится слиться с синдикалистским ICU, установив многорасовый режим под руководством К. Кадали."
RULE_OPTION_SAF_POLITIC_LAGUMA: "£KR_game_rule_flag_SAF_totalist   Туземное тоталистское государство"
RULE_OPTION_SAF_POLITIC_LAGUMA_DESC: "Левые забастовки после Чёрного понедельника не прекратятся мирно. После того, как пыль уляжется, социалистическая ISL откажется сливаться с синдикалистским ICU и установит «параллельный юнионизм», спровоцировав переворот. Будет установлен тоталистский режим коренных народов под руководством Ла Гумы."
RULE_OPTION_SAF_POLITIC_RADSOC_GAMER: "£KR_game_rule_flag_SAF_syndicalist   Социализм под руководством белых"
RULE_OPTION_SAF_POLITIC_RADSOC_GAMER_DESC: "Левые забастовки после Чёрного понедельника не прекратятся мирно. После того, как пыль уляжется, социалистическая ISL откажется сливаться с синдикалистским ICU и установит «параллельный юнионизм», спровоцировав попытку переворота, которая провалится. ISL останется у власти."

RULE_OPTION_NFA_GOVERNMENT_PATH_SUS_PRD: "£KR_game_rule_flag_NFA   Второй Священный союз - Радикальная партия"
RULE_OPTION_NFA_GOVERNMENT_PATH_SUS_PRD_DESC: "Огонь Третьей республики продолжает ярко гореть в Алжире! Через некоторое время социал-консерваторы покинут правящую коалицию, и правительство сформирует рыночно-либеральную Радикальную партию."
RULE_OPTION_NFA_GOVERNMENT_PATH_SUS_COALITION: "£KR_game_rule_flag_NFA   Второй Священный союз"
RULE_OPTION_NFA_GOVERNMENT_PATH_SUS_COALITION_DESC: "Огонь Третьей республики продолжает ярко гореть в Алжире! Правящая коалиция сохранит стабильность."
RULE_OPTION_NFA_GOVERNMENT_PATH_SUS_PSF: "£KR_game_rule_flag_NFA   Второй Священный союз - PSF"
RULE_OPTION_NFA_GOVERNMENT_PATH_SUS_PSF_DESC: "Огонь Третьей республики продолжает ярко гореть в Алжире! Через некоторое время рыночные либералы покинут правящую коалицию, и правительство сформирует социал-консервативную PSF."

