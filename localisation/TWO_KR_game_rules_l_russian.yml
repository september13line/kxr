RULE_OPTION_VIN_FUTURE_DIEM_RELIGIOUS_DESC: "После того как Императорский совет принял заметный религиозный уклон, судьба Вьетнама ляжет на плечи Нго Динь Зьема, что в конечном итоге приведёт к установлению персоналистской республики.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
