LIB_SOCIETY: "£KR_game_rule_flag_LIB   Кризис 1936 года"
RULE_OPTION_LIB_SOCIETY_RANDOM: "По умолчанию"
RULE_OPTION_LIB_SOCIETY_RANDOM_DESC: "После того, как американский писатель Скотт Фицджеральд публикует разоблачительную статью о нарушениях прав человека правительством Чарльза Д.Б. Кинга, на Кинга оказывают давление, чтобы он подал в отставку и созвал съезд руководства для определения нового главы партии. Сделает ли он это - никто не знает."
RULE_OPTION_LIB_SOCIETY_FREEMASON: "£KR_game_rule_flag_LIB_national_populist   Масоны избраны"
RULE_OPTION_LIB_SOCIETY_FREEMASON_DESC: "Кинг уходит в отставку, и партия Истинных вигов собралась, чтобы избрать нового главу. Национальная популистская Великая масонская ложа Либерии избирается руководителем страны, положив конец любым надеждам на вновь обретенную демократию."
RULE_OPTION_LIB_SOCIETY_TOTALIST: "£KR_game_rule_flag_LIB_totalist   Тоталисты Либерии"
RULE_OPTION_LIB_SOCIETY_TOTALIST_DESC: "Кинг отказывается уйти в отставку, и в стране происходит переворот. В хаосе тоталистическая банда "Либерийская судьба" успешно переворачивает правительство."
RULE_OPTION_LIB_SOCIETY_SOCCON: "£KR_game_rule_flag_LIB   Партия истинных вигов (Барклай)"
RULE_OPTION_LIB_SOCIETY_SOCCON_DESC: "Кинг уходит в отставку, и партия "Истинные виги" собралась, чтобы избрать нового главу. Новым лидером избирается социал-консерватор Эдвин Джеймс Барклай."
RULE_OPTION_LIB_SOCIETY_MARLIB: "£KR_game_rule_flag_LIB   Партия истинных вигов (Табман)"
RULE_OPTION_LIB_SOCIETY_MARLIB_DESC: "Кинг уходит в отставку, и партия "Истинные виги" собралась, чтобы избрать нового главу. Рыночный либерал Уильям Табман избран новым лидером."
RULE_OPTION_LIB_SOCIETY_SOCLIB: "£KR_game_rule_flag_LIB   Партия истинных вигов (Граймс)"
RULE_OPTION_LIB_SOCIETY_SOCLIB_DESC: "Кинг уходит в отставку, и партия "Истинные виги" собралась для избрания нового главы. Новым лидером избирается социальный либерал Луис Артур Граймс."
RULE_OPTION_LIB_SOCIETY_RADSOC: "£KR_game_rule_flag_LIB_radical_socialist   Переворот Народной партии"
RULE_OPTION_LIB_SOCIETY_RADSOC_DESC: "Кинг отказывается уйти в отставку и подвергается перевороту. В хаосе радикальный социалист Джеймс Дженкинс Доссен из Народной партии в конце концов берёт власть в свои руки."
RULE_OPTION_LIB_SOCIETY_AUTDEM: "£KR_game_rule_flag_LIB_KINGDOM   Возвращение Масакуи"
RULE_OPTION_LIB_SOCIETY_AUTDEM_DESC: "После того, как немецкий посол Массакуи просит Берлин о помощи, Либерия становится более технологически и промышленно развитой страной ценой того, что она становится немецкой марионеткой."
RULE_OPTION_LIB_SOCIETY_SOCDEM: "£KR_game_rule_flag_LIB   Партия истинных вигов (Вильсон)"
RULE_OPTION_LIB_SOCIETY_SOCDEM_DESC: "Кинг уходит в отставку, и партия "Истинные виги" собралась, чтобы избрать нового главу. Новым лидером избирается социал-демократ Энтони Дэш Уилсон."
RULE_OPTION_LIB_SOCIETY_FIRESTONE: "£KR_game_rule_flag_LIB   Огненный переворот"
RULE_OPTION_LIB_SOCIETY_FIRESTONE_DESC: "Кинг отказывается уйти в отставку, и в стране происходит переворот. В хаосе корпорация Firestone в конечном итоге получает прямой контроль над страной."
RULE_OPTION_LIB_SOCIETY_HOOVER: "£KR_game_rule_flag_LIB   Америка продолжает жить в Либерии"
RULE_OPTION_LIB_SOCIETY_HOOVER_DESC: "Кинг отказывается уйти в отставку и подвергается перевороту. В хаосе корпорация Firestone временно берёт на себя прямое управление страной. Герберт Гувер, спасаясь от хаоса американской Гражданской войны, в конечном итоге берёт на себя руководство страной и начинает преобразовывать Либерию в новую Америку."


MAF_POLITIC: "£KR_game_rule_flag_MAF   Режим в Миттельафрике"
