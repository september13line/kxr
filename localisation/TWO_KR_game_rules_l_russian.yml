RULE_OPTION_AST_OLD_GUARD_JAPAN: "£KR_game_rule_flag_AST_monarchist  £KR_game_rule_flag_JAP   Приход «Движения» к власти - японофилы"
RULE_OPTION_AST_OLD_GUARD_JAPAN_DESC: "Старая гвардия, также известная как «Движение», сможет свергнуть новый парламент Лиги. Когда будет поднят вопрос об Австралазийско-японском обществе, оно в конечном итоге одержит верх и провозгласит верность Японии."
