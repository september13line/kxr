RULE_OPTION_WLL_ELECTION_SYNDIE_DESC: "Социал-демократическая POB побеждает на выборах. Впоследствии синдикалистское крыло партии получает большее влияние, и Валлония становится синдикалистской. В ответ Германская империя решает ничего не предпринимать.\n§G(С.С.)§! означает Согласие Германии.\n§RТребуется:§!\n§CПровозглашена республика§! в §Y£KR_game_rule_flag_WLL   Судьба Валлонского петуха§!"
