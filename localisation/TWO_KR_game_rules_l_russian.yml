RULE_OPTION_JAP_START_NSA_YES_REFORM_DEMOCRACY_MARLIB_DESC: "Закон о национальной безопасности принят. Правительство начинает избирательную реформу, и демократия сохраняется. На выборах побеждает рыночный либерал Минсэйто."

RULE_OPTION_TIB_SOCIALIST_SOCDEM: "£KR_game_rule_flag_TIB   Панчен-лама возвращается - Партия совершенствования Тибета"
RULE_OPTION_TIB_SOCIALIST_SOCDEM_DESC: "Панчен-лама вернется, а Партия улучшения Тибета придет к власти и останется у власти после выборов."
RULE_OPTION_TIB_SOCIALIST_SOCLIB: "£KR_game_rule_flag_TIB   Панчен-лама возвращается - Кичо Кунтун"
RULE_OPTION_TIB_SOCIALIST_SOCLIB_DESC: "Панчен-лама вернется, и к власти придет Партия улучшения Тибета. После выборов к власти придет социал-либеральный Кичо Кунтун."
RULE_OPTION_TIB_SOCIALIST_TOTAL: "£KR_game_rule_flag_TIB_totalist   Возвращение Панчен-ламы - Партия Священный Союз"
RULE_OPTION_TIB_SOCIALIST_TOTAL_DESC: "Панчен-лама вернется, и к власти придет Партия улучшения Тибета. Тоталистическая партия "Священный Союз" приходит к власти после выборов."

NEP_CRISIS: "£KR_game_rule_flag_NEP   Длинная ночь фестиваля огней"
RULE_OPTION_NEP_CRISIS_RANDOM: "По умолчанию"
RULE_OPTION_NEP_CRISIS_RANDOM_DESC: "После начала беспорядков в городе Дехрадун и их жестокого подавления подпольный Индийский национальный конгресс призвал Индию к вмешательству. Приведет ли этот призыв к открытой войне или ситуацию удастся разрешить мирным путём, пока неясно."
RULE_OPTION_NEP_CRISIS_PEACE: "£KR_game_rule_flag_NEP   Мир"
RULE_OPTION_NEP_CRISIS_PEACE_DESC: "Ситуация разрешилась миром, в результате которого Непал получил ценные концессии на все бывшие индийские земли."
RULE_OPTION_NEP_CRISIS_WAR: "£KR_game_rule_flag_NEP   £KR_game_rule_flag_DEH   £KR_game_rule_flag_BHC   Война"
RULE_OPTION_NEP_CRISIS_WAR_DESC: "Миром ситуацию разрешить не удалось, и началась война."

IRQ_POLITIC: "£KR_game_rule_flag_IRQ   Будущее Ирака"
RULE_OPTION_IRQ_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_IRQ_POLITIC_RANDOM_DESC: "Возникший во время Каирский пакт войны с османами, Ирак является крайне нестабильным государством. Каким будет его будущее, никто не может предсказать."
RULE_OPTION_IRQ_POLITIC_REPUBLIC_AUTDEM: "£KR_game_rule_flag_IRQ   Таха аль-Хашими берёт управление на себя"
RULE_OPTION_IRQ_POLITIC_REPUBLIC_AUTDEM_DESC: "Вскоре после окончания войны Ясин аль-Хашими установил контроль над странной. После его убийства его старший брат Таха устанавливает авторитарный демократический режим."
RULE_OPTION_IRQ_POLITIC_REPUBLIC_NATPOP: "£KR_game_rule_flag_IRQ   Власть Рашида Али аль-Гайлани"
RULE_OPTION_IRQ_POLITIC_REPUBLIC_NATPOP_DESC: "Ясин аль-Хашими установил контроль над странной вскоре после окончания войны. После его убийства его соратник Рашид Али аль-Гайлани устанавливает национал-популистский режим."
RULE_OPTION_IRQ_POLITIC_REPUBLIC_SOCDEM: "£KR_game_rule_flag_IRQ   Власть Джамаата аль-Ахали"
RULE_OPTION_IRQ_POLITIC_REPUBLIC_SOCDEM_DESC: "Ясин аль-Хашими установил контроль над странной вскоре после окончания войны. После его убийства его старший брат Таха передает власть социал-демократическому "Джамаат аль-Ахали"."
RULE_OPTION_IRQ_POLITIC_REPUBLIC_MARLIB: "£KR_game_rule_flag_IRQ   Власть Аршада аль-Умари"
RULE_OPTION_IRQ_POLITIC_REPUBLIC_MARLIB_DESC: "Ясин аль-Хашими взял под контроль странну вскоре после окончания войны. После его убийства его старший брат Таха передает власть социал-демократической Джамаат аль-Ахали, но вскоре она уступает власть рыночному либералу Аршаду аль-Умари."
RULE_OPTION_IRQ_POLITIC_MONARCHY_SOCDEM: "£KR_game_rule_flag_IRQ   Провозглашение монархии - аль-Ахали"
RULE_OPTION_IRQ_POLITIC_MONARCHY_SOCDEM_DESC: "Юсуф Бег ас-Саадун при поддержке Персии провозглашает себя королем Юсуфом 1. Его премьер-министром становится социал-демократ аль-Ахали."
RULE_OPTION_IRQ_POLITIC_MONARCHY_MARLIB: "£KR_game_rule_flag_IRQ   Провозглашение монархии - Аршад аль-Умари"
RULE_OPTION_IRQ_POLITIC_MONARCHY_MARLIB_DESC: "Юсуф Бег ас-Саадун при поддержке Персии провозглашает себя королем Юсуфом 1. Премьер-министром становится рыночный либерал Аршад аль-Умари."
RULE_OPTION_IRQ_POLITIC_MONARCHY_PATAUT: "£KR_game_rule_flag_IRQ   Провозглашение монархии - Юсуф"
RULE_OPTION_IRQ_POLITIC_MONARCHY_PATAUT_DESC: "Юсуф Бег ас-Саадун при поддержке Персии провозглашает себя царем Юсуфом 1. Премьер-министром становится патерналистом Рашид аль-Гайлани"

SYR_POLITIC: "£KR_game_rule_flag_SYR   Будущее Сирии"
RULE_OPTION_SYR_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_SYR_POLITIC_RANDOM_DESC: "Возникшая во время войны Каирской оси с османами, Сирия является крайне нестабильным государством. Каково её будущее, не может предсказать никто."
