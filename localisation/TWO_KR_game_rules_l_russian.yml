RULE_OPTION_DEN_FUTURE_DEMOCRACY_REPUBLIC_SOCDEM_GERMAN_INTERVENTION: "£KR_game_rule_flag_DEN   £KR_game_rule_flag_GER   Республика - Интервенция"
RULE_OPTION_DEN_FUTURE_DEMOCRACY_REPUBLIC_SOCDEM_GERMAN_INTERVENTION_DESC: "После победы народа в конституционном кризисе, вызванном отказом правительства вступить в Вельткриг и насильственным вступлением в войну по воле короля, Кристиан X отрекается от престола и провозглашается республика. В ответ Германская Империя решает объявить стране войну."
RULE_OPTION_DEN_FUTURE_DEMOCRACY_REPUBLIC_SOCDEM_GERMAN_ACQUIESCENCE: "£KR_game_rule_flag_DEN   Республика - Мир"
RULE_OPTION_DEN_FUTURE_DEMOCRACY_REPUBLIC_SOCDEM_GERMAN_ACQUIESCENCE_DESC: "После победы народа в конституционном кризисе, вызванном отказом правительства вступить в Вельткриг и насильственным вступлением в войну по воле короля, Кристиан X отрекается от престола и провозглашается республика. В ответ на это Германская Империя решает ничего не предпринимать."

