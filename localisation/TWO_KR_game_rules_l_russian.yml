RULE_OPTION_VIN_FUTURE_DIEM_APPOINTED_DESC: "Поскольку Император укрепляет свою позицию правителя Вьетнама, страна будет находиться под управлением «Чудотворца» Нго Динь Зьема.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
