RULE_OPTION_NFA_CONTINENTAL_PATH_COUP_PATAUT_DESC: "Произошел военный переворот и было создано отеческое автократическое правительство."

NFA_CONGRESS_OF_LYON: "£KR_game_rule_flag_NFA   Конгресс в Лионе"
RULE_OPTION_NFA_CONGRESS_OF_LYON_RANDOM: "По умолчанию"
RULE_OPTION_NFA_CONGRESS_OF_LYON_RANDOM_DESC: "После окончания Второго Вельткрига перед Германией встает вопрос: что делать с оккупированными территориями Франции? Возможно, стоит договориться об этом с правительством, расположенным в Африке..."
RULE_OPTION_NFA_CONGRESS_OF_LYON_DOVE_DEMAND: "£KR_game_rule_flag_NFA   £KR_game_rule_flag_GER   Голубь должен победить"
RULE_OPTION_NFA_CONGRESS_OF_LYON_DOVE_DEMAND_DESC: "Национальная Франция соглашается принять у себя конгресс. На нем Германия выдвигает скромные условия, на которые Франция с радостью соглашается."
RULE_OPTION_NFA_CONGRESS_OF_LYON_MODERATE_DEMAND: "£KR_game_rule_flag_NFA   £KR_game_rule_flag_GER   Умеренное соглашение"
RULE_OPTION_NFA_CONGRESS_OF_LYON_MODERATE_DEMAND_DESC: "Национальная Франция соглашается принять у себя конгресс. На нем Германия выдвигает умеренные требования, которые Франция принимает."
RULE_OPTION_NFA_CONGRESS_OF_LYON_HAWK_DEMAND: "£KR_game_rule_flag_NFA   £KR_game_rule_flag_GER   Требование ястреба"
RULE_OPTION_NFA_CONGRESS_OF_LYON_HAWK_DEMAND_DESC: "Национальная Франция соглашается принять у себя конгресс. На нем Германия выдвигает жесткие требования, на которые Франция вынуждена согласиться."
RULE_OPTION_NFA_CONGRESS_OF_LYON_NOT_HAPPEND: "Предложение Конгресса отвергнуто"
RULE_OPTION_NFA_CONGRESS_OF_LYON_NOT_HAPPEND_DESC: "Франция отвергает предложение Германии о конгрессе."

MOR_FOREIGN_POLICY: "£KR_game_rule_flag_MOR   Внешняя политика Марокко"
