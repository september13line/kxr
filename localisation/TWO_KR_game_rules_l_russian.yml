RULE_OPTION_ASY_REVOLT_REVOLT_CAN_WHITE_PEACE: "£KR_game_rule_flag_OTT   £KR_game_rule_flag_ASY   £KR_game_rule_flag_CAN   Восстание - Присоединяется к Антанте"
RULE_OPTION_ASY_REVOLT_REVOLT_CAN_WHITE_PEACE_DESC: "Восстания не избежать. Антанта не вмешивается. Антанта заставляет Османскую империю предоставить независимость Ассирии."
RULE_OPTION_ASY_REVOLT_REVOLT_CAN_AUTONOMY: "£KR_game_rule_flag_OTT   £KR_game_rule_flag_ASY   £KR_game_rule_flag_CAN   Восстание - Автономия"
RULE_OPTION_ASY_REVOLT_REVOLT_CAN_AUTONOMY_DESC: "Восстания не избежать. Антанта не вмешивается. Антанта вынуждает Османскую империю предоставить автономию внутри империи."
RULE_OPTION_ASY_REVOLT_REVOLT_CAN_OTTOMAN_WAR: "£KR_game_rule_flag_OTT   £KR_game_rule_flag_ASY   £KR_game_rule_flag_CAN   Восстание - Война"
RULE_OPTION_ASY_REVOLT_REVOLT_CAN_OTTOMAN_WAR_DESC: "Восстания не удается избежать. Антанта не вмешивается. Антанта пытается повлиять на Османскую империю, но, не найдя согласия, объявляет ей войну."

ASY_POLITIC: "£KR_game_rule_flag_ASY   Будущее Ассирии"
RULE_OPTION_ASY_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_ASY_POLITIC_RANDOM_DESC: "Ассирия обрела независимость, и теперь её судьба должна быть определена. Будет ли создана "Ассирия для ассирийцев", многонациональное государство, или страна станет марионеткой британского влияния?"
RULE_OPTION_ASY_POLITIC_NATPOP: "£KR_game_rule_flag_ASY   'Ассирия для ассирийцев'"
RULE_OPTION_ASY_POLITIC_NATPOP_DESC: "Шимун XXI Эшай коронует себя царем новой Ассирии и направляет свои усилия на создание единой ассирийской нации."
RULE_OPTION_ASY_POLITIC_SOCCON: "£KR_game_rule_flag_ASY   Многонациональное Государство"
RULE_OPTION_ASY_POLITIC_SOCCON_DESC: "Шимун XXI Эшай направляет свои усилия на создание многонациональной страны."
