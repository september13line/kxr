RULE_OPTION_BHC_MEETING_TOTALIST: "£KR_game_rule_flag_BHC   Тоталисты избраны"
RULE_OPTION_BHC_MEETING_TOTALIST_DESC: "Конгресс поддерживает платформу, предложенную Субхасом Чандрой Бозе и его максималистами."
RULE_OPTION_BHC_MEETING_SYNDICALIST: "£KR_game_rule_flag_BHC   Синдикалисты избраны"
RULE_OPTION_BHC_MEETING_SYNDICALIST_DESC: "Конгресс одобряет платформу, предложенную А. К. Фазлул Хуком и его умеренными."
RULE_OPTION_BHC_MEETING_RADSOC: "£KR_game_rule_flag_BHC   Радикальные социалисты избраны"
