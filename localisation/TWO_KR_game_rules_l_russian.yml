RULE_OPTION_HAW_ELECTION_RADSOC_DESC: "Радикальная социалистическая Социалистическая партия Гавайев побеждает на выборах. \n§RТребуется:§!\n§CSocialist Revolution§! в §Y£KR_game_rule_flag_HAW   Emergency On The Islands§!"
RULE_OPTION_HAW_ELECTION_SYNDIE: "£KR_game_rule_flag_HAW_radical_socialist   Гавайская Федерация труда"
RULE_OPTION_HAW_ELECTION_SYNDIE_DESC: "Синдикалисты Гавайской федерации труда побеждают на выборах. \n§RТребуется:§!\n§CSocialist Revolution§! в §Y£KR_game_rule_flag_HAW   Emergency On The Islands§!"
