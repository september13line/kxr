RULE_OPTION_TUR_PATH_PATAUT_DESC: "В отсутствие Кемаля после падения либералов власть в стране захватывает §PФевзи-паша§!. Его видение республики построено на культе личности и культе военных.\n\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\nЛюбой §CСабахаттин Эфенди§! в §Y$OTT_PATHS$§!"

TUR_FORPOL: "£KR_game_rule_flag_TUR_ottoman_empire  Внешняя политика Турции"
