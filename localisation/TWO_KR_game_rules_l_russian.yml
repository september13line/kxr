RULE_OPTION_HAW_FOREIGN_POLICY_INTERNATIONALE_DESC: "Гавайи решают присоединиться к Интернационалу. \n§RТребуется:§!\n§CSocialist Revolution§! в §Y£KR_game_rule_flag_HAW   Emergency On The Islands§!"

HON_COUP: "£KR_game_rule_flag_HON   Чрезвычайная сессия"
RULE_OPTION_HON_COUP_RANDOM: "По умолчанию"
RULE_OPTION_HON_COUP_RANDOM_DESC: "Началась чрезвычайная сессия Гондурасского совета, который должен решить будущее крестьянской республики. Члены совета Каллехас и Кастро почти сцепились из-за различий во взглядах, и с обеих сторон звучат дикие обвинения, в то время как члены совета Моралес и Гальвес сформировали единый фронт, выступая за роспуск совета и его реформирование в выборный орган, но в конечном итоге, похоже, есть только несколько вариантов будущего совета."
RULE_OPTION_HON_COUP_MONZADA: "£KR_game_rule_flag_HON   Генерал Кастро"
RULE_OPTION_HON_COUP_MONZADA_DESC: "Генерал Кастро захватывает кресло председателя совета, берёт власть в свои руки и вводит военное положение."
RULE_OPTION_HON_COUP_GALVEZ: "£KR_game_rule_flag_HON   Председатель Гальвес"
RULE_OPTION_HON_COUP_GALVEZ_DESC: "Совет проводит чрезвычайные выборы. Побеждает Гальвес и социально-консервативная Национальная партия Гондураса."
RULE_OPTION_HON_COUP_MORALES: "£KR_game_rule_flag_HON   Председатель Моралес"
RULE_OPTION_HON_COUP_MORALES_DESC: "Совет проводит чрезвычайные выборы. Победу одерживает Моралес и социал-демократическая Партия инноваций и единства - Социальная демократия."
RULE_OPTION_HON_COUP_TOTALIST: "£KR_game_rule_flag_HON_totalist   Премьер Каллехас"
RULE_OPTION_HON_COUP_TOTALIST_DESC: "Советник Кальехас захватывает кресло председателя совета, берёт власть в свои руки и совершает революцию."
RULE_OPTION_HON_COUP_ZEMURRAY: "£KR_game_rule_flag_HON_banana   Контрпереворот UFC"
RULE_OPTION_HON_COUP_ZEMURRAY_DESC: "Советник Каллехас захватывает кресло в совете, беря власть в свои руки, и устраивает революцию, но в ходе Гражданской войны американскому беженцу и бывшему председателю UFC Сэмюэлю Земуррею удается разгромить социалистические силы и совершить переворот Каллехаса. \n§RТребуется:§! \n§CВойна§! в §Y£KR_game_rule_flag_USA 2-я Американская Гражданская война§!"

NIC_SPLIT: "£KR_game_rule_flag_NIC_radical_socialist   Раскол либералов и социалистов"
RULE_OPTION_NIC_SPLIT_RANDOM: "По умолчанию"
RULE_OPTION_NIC_SPLIT_RANDOM_DESC: "После выборов обе стороны были напряжены друг с другом, шансы на раскол почти определены, но вопрос в том, кто выйдет на первое место?"
RULE_OPTION_NIC_SPLIT_SOCLIB: "£KR_game_rule_flag_NIC   Либеральная партия"
RULE_OPTION_NIC_SPLIT_SOCLIB_DESC: "Социалисты протестуют против найма Абделардо Куадры, что приводит к восстанию. Восстание проваливается, и назначаются новые выборы, на которых избираются социал-либералы. \n§RТребуется:§!\n§CPRL Victory§! в §Y£KR_game_rule_flag_NIC_radical_socialist   Nicaraguan Elections§!"
RULE_OPTION_NIC_SPLIT_SOCCON: "£KR_game_rule_flag_NIC   Консервативная партия"
RULE_OPTION_NIC_SPLIT_SOCCON_DESC: "Социалисты протестуют против найма Абделардо Куадры, что приводит к восстанию. Восстание проваливается, и назначаются новые выборы, на которых избираются социал-консерваторы. \n§RТребуется:§!\n§CPRL Victory§! в §Y£KR_game_rule_flag_NIC_radical_socialist   Nicaraguan Elections§!"
RULE_OPTION_NIC_SPLIT_SOCDEM: "£KR_game_rule_flag_NIC_radical_socialist   Крестьянская партия Никарагуа"
RULE_OPTION_NIC_SPLIT_SOCDEM_DESC: "Сакаса осуждает правительство за отказ от демократии и поднимает восстание. Восстание проваливается, и назначаются новые выборы, на которых избираются социал-демократы. \n§RТребуется:§!\n§CFSN Victory§! или §CPCN Victory§! в §Y£KR_game_rule_flag_NIC_radical_socialist   Nicaraguan Elections§!"
RULE_OPTION_NIC_SPLIT_RADSOC: "£KR_game_rule_flag_NIC_radical_socialist   Фронт национального суверенитета"
RULE_OPTION_NIC_SPLIT_RADSOC_DESC: "Сакаса призывает правительство отбросить демократию и поднимает восстание. Восстание проваливается, и назначаются новые выборы, на которых избираются радикальные социалисты. \n§RТребуется:§!\n§CFSN Victory§! или §CPCN Victory§! в §Y£KR_game_rule_flag_NIC_radical_socialist   Nicaraguan Elections§!"
RULE_OPTION_NIC_SPLIT_NATPOP: "£KR_game_rule_flag_NIC_USA   Американский мандат"
RULE_OPTION_NIC_SPLIT_NATPOP_DESC: "Сакаса осуждает правительство за отказ от демократии и поднимает восстание. Восстание удается при американском вмешательстве, и Никарагуа попадает под власть национал-популистского режима, намеревающегося управлять территорией в качестве номинально независимого союзника США. \n§RТребуется:§!\n§CFSN Victory§! или §CPCN Victory§! в §Y£KR_game_rule_flag_NIC_radical_socialist   Nicaraguan Elections§! и §RNot§! £KR_game_rule_flag_USA   §CCivil War Avoided§! или £KR_game_rule_flag_USA   £KR_game_rule_flag_CSA   §CCompromise Reached with Long§! в §Y£KR_game_rule_flag_USA   Second American Civil War§!"

PAN_ELECTION: "£KR_game_rule_flag_PAN   Всеобщие выборы 1936 года"
RULE_OPTION_PAN_ELECTION_RANDOM: "По умолчанию"
RULE_OPTION_PAN_ELECTION_RANDOM_DESC: "Поскольку экономическое восстановление наконец-то стало возможным, выборы 1936 года могут стать самыми важными выборами в истории Панамы."
RULE_OPTION_PAN_ELECTION_PNR: "£KR_game_rule_flag_PAN   Национально-революционная партия"
RULE_OPTION_PAN_ELECTION_PNR_DESC: "На выборах 1936 года победила Национальная революционная партия, ориентированная на восстановление экономики через сельское хозяйство и инвестиции."
RULE_OPTION_PAN_ELECTION_PNL: "£KR_game_rule_flag_PAN   Национальная либеральная партия"
RULE_OPTION_PAN_ELECTION_PNL_DESC: "Национальная либеральная партия, ориентированная на восстановление экономики через инвестиции в бизнес и защиту рабочих, победила на выборах 1936 года."
RULE_OPTION_PAN_ELECTION_POLICE: "£KR_game_rule_flag_PAN   Национальный полицейский переворот"
RULE_OPTION_PAN_ELECTION_POLICE_DESC: "Национальная полиция до сих пор молча сидела на заднем плане и ждала, когда правительство совершит ошибку. Теперь, когда страна разобщена как никогда, они вмешались, чтобы "восстановить порядок" в Панаме."
RULE_OPTION_PAN_ELECTION_CONSERVATIVE: "£KR_game_rule_flag_PAN   Консервативное правительство"
RULE_OPTION_PAN_ELECTION_CONSERVATIVE_DESC: "Из-за нестабильности в обществе и правительстве, Рикардо Хоакин Альфаро Ховане был вынужден уйти в отставку вместе со своим кабинетом и попросил Хуана Аросему сформировать новый кабинет в качестве президента."

CEN_MIL_CONGRESS: "£KR_game_rule_flag_CEN_CON   Центральноамериканский военный конгресс"
RULE_OPTION_CEN_MIL_CONGRESS_RANDOM: "По умолчанию"
RULE_OPTION_CEN_MIL_CONGRESS_RANDOM_DESC: "Центральная Америка объединена под военным правлением. Какая фракция придет к власти во время первого Центральноамериканского конгресса?"
RULE_OPTION_CEN_MIL_CONGRESS_SOMOZA: "£KR_game_rule_flag_CEN_CON   Умеренные"
RULE_OPTION_CEN_MIL_CONGRESS_SOMOZA_DESC: "Умеренные во главе с Сомосой устанавливают авторитарно-демократическую военную администрацию и даже организуют фальсифицированные выборы для своей легитимации."
RULE_OPTION_CEN_MIL_CONGRESS_UBICO: "£KR_game_rule_flag_CEN_CON   Милитаристы"
RULE_OPTION_CEN_MIL_CONGRESS_UBICO_DESC: "Милитаристы во главе с Убико устанавливают отеческий автократический режим. Центральная Америка быстро превращается в миллитаристскую диктатуру."
RULE_OPTION_CEN_MIL_CONGRESS_MARTINEZ: "£KR_game_rule_flag_CEN_CON   Радикалы"
RULE_OPTION_CEN_MIL_CONGRESS_MARTINEZ_DESC: "Радикалы во главе с Мартинесом устанавливают национал-популистский режим, и Центральная Америка превращается в антилевое тоталитарное государство."

CEN_SOC_CONGRESS: "£KR_game_rule_flag_CEN   Центроамериканский конгресс"
RULE_OPTION_CEN_SOC_CONGRESS_RANDOM: "По умолчанию"
RULE_OPTION_CEN_SOC_CONGRESS_RANDOM_DESC: "Центроамерика объединена под властью левых сил. Какая фракция придет к власти во время первого Центральноамериканского конгресса?"
RULE_OPTION_CEN_SOC_CONGRESS_SINDICALISTAS: "£KR_game_rule_flag_CEN   Синдикалисты"
RULE_OPTION_CEN_SOC_CONGRESS_SINDICALISTAS_DESC: "К власти придут ортодоксальные синдикалисты. Торговля с европейскими революционными режимами идет полным ходом, и молодая страна быстро индустриализируется."
RULE_OPTION_CEN_SOC_CONGRESS_REVOLUTIONARIES: "£KR_game_rule_flag_CEN   Революционеры"
RULE_OPTION_CEN_SOC_CONGRESS_REVOLUTIONARIES_DESC: "Радикальные социалисты всегда были самой популярной революционной фракцией в регионе, и Конгресс принимает решение против любых радикальных изменений. Таким образом, избираются революционеры. Центроамерика становится аграрным бастионом равенства."
RULE_OPTION_CEN_SOC_CONGRESS_MAXIMISTAS: "£KR_game_rule_flag_CEN   Максимисты"
RULE_OPTION_CEN_SOC_CONGRESS_MAXIMISTAS_DESC: "Конгресс решает, что необходима сильная центральная власть, и избирает тоталистов-максималистов. Смогут ли они сотрудничать с менее радикальными фракциями или переворот положит конец их правлению?"
RULE_OPTION_CEN_SOC_CONGRESS_MODERATOS: "£KR_game_rule_flag_CEN   Модератос"
RULE_OPTION_CEN_SOC_CONGRESS_MODERATOS_DESC: "Революция вечна, но люди гораздо важнее. Социал-демократические Модератос избраны руководить страной в бархатной перчатке."

