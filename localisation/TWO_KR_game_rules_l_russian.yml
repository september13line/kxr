BUL_POLITIC: "£KR_game_rule_flag_BUL   Послевоенный переворот в Болгарии"    
RULE_OPTION_BUL_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_BUL_POLITIC_RANDOM_DESC: "Кто получит власть после победы Белградского пакта над Болгарией?"
RULE_OPTION_BUL_POLITIC_SOCDEM: "£KR_game_rule_flag_BUL   Широкие социалисты"
RULE_OPTION_BUL_POLITIC_SOCDEM_DESC: "Царь Фердинанд отрекается от престола после принятия унизительного договора, а социал-демократические Широкие социалисты решают оставить царя Бориса III в качестве номинального правителя."
RULE_OPTION_BUL_POLITIC_MARLIB: "£KR_game_rule_flag_BUL   Радикал-демократы"
RULE_OPTION_BUL_POLITIC_MARLIB_DESC: "Царь Фердинанд отрекается от престола после принятия унизительного договора, а рыночно-либеральные Радикал-демократы решают оставить царя Бориса III в качестве номинального правителя."
RULE_OPTION_BUL_POLITIC_PATAUT: "£KR_game_rule_flag_BUL_paternal_autocrat   Абсолютисты"
RULE_OPTION_BUL_POLITIC_PATAUT_DESC: "Царь Фердинанд отрекается от престола после принятия унизительного договора, а его сын Борис III совершает переворот против «слабого» нового правительства, чтобы установить абсолютную монархию."
RULE_OPTION_BUL_POLITIC_SYNDIE: "£KR_game_rule_flag_BUL_syndicalist   Тесные социалисты"
RULE_OPTION_BUL_POLITIC_SYNDIE_DESC: "Царь Фердинанд отрекается от престола после принятия унизительного договора, а синдикалистские Тесные социалисты совершают переворот против «слабого» нового правительства."
RULE_OPTION_BUL_POLITIC_SOCCON: "£KR_game_rule_flag_BUL   Земледельцы"
RULE_OPTION_BUL_POLITIC_SOCCON_DESC: "Царь Фердинанд отрекается от престола после принятия унизительного договора, и непопулярные социально-консервативные Земледельцы решают создать республику. Происходит чудо - Стамболийскому удаётся удержать власть, заключив союз с Сербией."

GRE_REFERENDUM: "£KR_game_rule_flag_GRE   Референдум о монархии в Греции"
RULE_OPTION_GRE_REFERENDUM_RANDOM: "По умолчанию"
RULE_OPTION_GRE_REFERENDUM_RANDOM_DESC: "Будет проведен плебисцит о возможном восстановлении монархии в Греции."
RULE_OPTION_GRE_REFERENDUM_REPUBLIC: "£KR_game_rule_flag_GRE   Победа республиканцев"
RULE_OPTION_GRE_REFERENDUM_REPUBLIC_DESC: "Республиканцы побеждают на референдуме."
RULE_OPTION_GRE_REFERENDUM_ALEXANDER_DEM: "£KR_game_rule_flag_GRE_kingdom   Король-демократ Александр I"
RULE_OPTION_GRE_REFERENDUM_ALEXANDER_DEM_DESC: "Александр становится королем Греции Александросом I после победы монархистов на референдуме. Позже он становится фигурой, возглавляющей сильное демократическое правительство."
RULE_OPTION_GRE_REFERENDUM_ALEXANDER_AUTDEM: "£KR_game_rule_flag_GRE_kingdom   Авторитарный Король Алехандрос I"
RULE_OPTION_GRE_REFERENDUM_ALEXANDER_AUTDEM_DESC: "Александр становится королем Греции Алехандросом I после победы монархистов на референдуме. Позже он становится авторитарным королем с сильными Королевскими прерогативами."
RULE_OPTION_GRE_REFERENDUM_GEORGE: "£KR_game_rule_flag_GRE_kingdom   Король Георгиос II"
RULE_OPTION_GRE_REFERENDUM_GEORGE_DESC: "Георгий становится королем Греции Георгиосом II после победы монархистов на референдуме. Позже он становится авторитарным королем, обладающим большей властью, чем любое демократическое правительство."
RULE_OPTION_GRE_REFERENDUM_RADSOC: "£KR_game_rule_flag_GRE   У власти радикальные социалисты"
RULE_OPTION_GRE_REFERENDUM_RADSOC_DESC: "Александр становится королём Греции Александром I после победы монархистов на референдуме. Он решает не запрещать радикально-социалистическую АЕК на первых демократических выборах, и они приступают к внедрению аграрного социализма."
RULE_OPTION_GRE_REFERENDUM_SYNDICALIST: "£KR_game_rule_flag_GRE_syndicalist   Синдикалисты у власти"
RULE_OPTION_GRE_REFERENDUM_SYNDICALIST_DESC: "Синдикалистский переворот происходит после обнаружения фальсификаций монархистов. Позже синдикалисты избираются на Первом эллинском конгрессе."
RULE_OPTION_GRE_REFERENDUM_TOTALIST: "£KR_game_rule_flag_GRE_syndicalist   Тоталисты у власти"
RULE_OPTION_GRE_REFERENDUM_TOTALIST_DESC: "Синдикалистский переворот происходит после обнаружения фальсификаций монархистов. Позже на Первом эллинском конгрессе избираются тоталисты."
RULE_OPTION_GRE_REFERENDUM_METAXAS: "£KR_game_rule_flag_GRE_national_populist   Иоаннис Метаксас укрепляет власть"
RULE_OPTION_GRE_REFERENDUM_METAXAS_DESC: "Метаксас совершает переворот в правящем правительстве после обнаружения фальсификаций республиканцев. Позже он решает консолидировать власть."
RULE_OPTION_GRE_REFERENDUM_PAUL: "£KR_game_rule_flag_GRE_national_populist   Монархия восстановлена"
RULE_OPTION_GRE_REFERENDUM_PAUL_DESC: "Метаксас совершает переворот в правящем правительстве после обнаружения фальсификаций республиканцев. Позже он решает восстановить монархию с королем Павлосом I."

GER_MITTELEUROPA: "£KR_game_rule_flag_GER   Миттелевропа"
RULE_OPTION_GER_MITTELEUROPA_RANDOM: "По умолчанию"
RULE_OPTION_GER_MITTELEUROPA_RANDOM_DESC: "Будут ли страны из Рейхспакта активно участвовать в Миттелевропе?"
RULE_OPTION_GER_MITTELEUROPA_STONKS: "£KR_game_rule_flag_GER   Сильная Миттелевропа"
RULE_OPTION_GER_MITTELEUROPA_STONKS_DESC: "Страны будут сотрудничать, тем самым делая экономический союз сильнее."
RULE_OPTION_GER_MITTELEUROPA_NOT_STONKS: "£KR_game_rule_flag_GER   Слабая Миттелевропа"
RULE_OPTION_GER_MITTELEUROPA_NOT_STONKS_DESC: "Страны откажутся вступать или принимать предложения Германии, тем самым делая экономический союз слабее."

HOL_FOREIGN_POLICY: "£KR_game_rule_flag_HOL   Нация, раздираемая нейтралитетом"
RULE_OPTION_HOL_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_HOL_FOREIGN_POLICY_RANDOM_DESC: "Нидерланды смогли сохранить нейтралитет во время Мировой войны, но на горизонте новый конфликт. С кем выступит страна?"
RULE_OPTION_HOL_FOREIGN_POLICY_NEUTRALITY: "£KR_game_rule_flag_HOL   Голландский нейтралитет"
RULE_OPTION_HOL_FOREIGN_POLICY_NEUTRALITY_DESC: "Нидерланды попытаются сохранить нейтралитет и не присоединяться ни к одной иностранной державе."
RULE_OPTION_HOL_FOREIGN_POLICY_REICHSPAKT: "£KR_game_rule_flag_HOL  £KR_game_rule_flag_GER   Присоединиться к Рейхспакту"
RULE_OPTION_HOL_FOREIGN_POLICY_REICHSPAKT_DESC: "Нидерланды присоединятся к Рейхспакту, чтобы помочь Германии бороться с синдикалистской угрозой.\n§RТребуется:§!\n§RНе§! §C£KR_game_rule_flag_HOL_syndicalist  Батавская коммуна (Синдикалист)§! или §C£KR_game_rule_flag_HOL_syndicalist  Батавская коммуна (Тоталист)§! в §Y£KR_game_rule_flag_HOL  Нидерландах§!"
RULE_OPTION_HOL_FOREIGN_POLICY_ENTENTE: "£KR_game_rule_flag_HOL  £KR_game_rule_flag_AST   Присоединиться к Антанте"
RULE_OPTION_HOL_FOREIGN_POLICY_ENTENTE_DESC: "Нидерланды всегда будут готовы присоединиться к Антанте, но только если и когда Австралазия попросит об этом.\n§RТребуется:§!\n§RНе§! §C£KR_game_rule_flag_HOL_syndicalist  Батавская коммуна (Синдикалист)§! или §C£KR_game_rule_flag_HOL_syndicalist  Батавская коммуна (Тоталист)§! в §Y£KR_game_rule_flag_HOL  Нидерландах§! и §Gчтобы Австралазия осталась в Антанте§!"
RULE_OPTION_HOL_FOREIGN_POLICY_INTERNATIONALE: "£KR_game_rule_flag_HOL_syndicalist  £KR_game_rule_flag_FRA   Присоединиться к Интернационалу"
RULE_OPTION_HOL_FOREIGN_POLICY_INTERNATIONALE_DESC: "Нидерланды присоединятся к Интернационалу после того, как крайне левые силы сформируют правительство.\n§RТребуется:§!\n§CБатавская коммуна (Синдикалист)§! или §CБатавская коммуна (Тоталист)§! в §Y£KR_game_rule_flag_HOL_syndicalist  Нидерландах§!"

PLC_FOREIGN_POLICY: "£KR_game_rule_flag_PLC   Внешняя политика Польши-Литвы"
RULE_OPTION_PLC_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_PLC_FOREIGN_POLICY_RANDOM_DESC: "Какой будет внешняя политика новообразованного Содружества после того, как страна отвергнет и национализм, и синдикализм?"
RULE_OPTION_PLC_FOREIGN_POLICY_REICHSPAKT: "£KR_game_rule_flag_PLC  £KR_game_rule_flag_GER   Рейхспакт"
RULE_OPTION_PLC_FOREIGN_POLICY_REICHSPAKT_DESC: "Польша-Литва присоединится к Рейхспакту в знак лояльности немцам."
RULE_OPTION_PLC_FOREIGN_POLICY_UKRAINE: "£KR_game_rule_flag_PLC  £KR_game_rule_flag_UKR   Междуморье"
RULE_OPTION_PLC_FOREIGN_POLICY_UKRAINE_DESC: "Польша-Литва будет избегать любых союзов с Великими державами, предпочитая вместо этого локальное сотрудничество с украинским правительством."
RULE_OPTION_PLC_FOREIGN_POLICY_NEUTRAL: "£KR_game_rule_flag_PLC  Нейтралитет"
RULE_OPTION_PLC_FOREIGN_POLICY_NEUTRAL_DESC: "Польша-Литва решит остаться нейтральной, несмотря на то, что окружена потенциальными врагами."

POR_POLITIC: "£KR_game_rule_flag_POR_national_populist   Дела королевства"
RULE_OPTION_POR_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_POR_POLITIC_RANDOM_DESC: "Определят ли путь Королевства коусиристы или интегралисты?"
RULE_OPTION_POR_POLITIC_ABSOLUTE: "£KR_game_rule_flag_POR_national_populist   Король и его страна"
RULE_OPTION_POR_POLITIC_ABSOLUTE_DESC: "Король больше не будет связан теми, кто желает лишить его божественного права, и станет править так, как сочтёт нужным, опираясь на поддержку кусейристов.\n§RТребуется:§!\n§CМир - в одиночку§! в §Y£KR_game_rule_flag_MAF  £KR_game_rule_flag_POR_national_populist   Войне в буше§! или §RМиттельафрика побеждает в Войне в буше§!"
RULE_OPTION_POR_POLITIC_ORGANIC: "£KR_game_rule_flag_POR_national_populist   Органическое королевство"
RULE_OPTION_POR_POLITIC_ORGANIC_DESC: "Было решено, что Королевство должно иметь децентрализованную монархию, поддерживающую принципы обращения, традиции и муниципализма при поддержке интегралистов."

POR_FOREIGN_POLICY: "£KR_game_rule_flag_POR_national_populist   Внешняя политика Португалии"
RULE_OPTION_POR_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_POR_FOREIGN_POLICY_RANDOM_DESC: "Поскольку территориальная целостность Португалии находится под всё большей угрозой, португальское правительство должно выбрать, присоединяться ли к какому-либо глобальному блоку."
RULE_OPTION_POR_FOREIGN_POLICY_ENTENTE: "£KR_game_rule_flag_POR_national_populist  £KR_game_rule_flag_CAN   Подтвердить связи с Антантой"
RULE_OPTION_POR_FOREIGN_POLICY_ENTENTE_DESC: "Португалия решит подтвердить старейший в мире союз и официально присоединиться к британским изгнанникам в Оттаве."
RULE_OPTION_POR_FOREIGN_POLICY_LATIN_UNION: "£KR_game_rule_flag_POR_national_populist  £KR_game_rule_flag_CAR   Присоединиться к Латинскому союзу"
RULE_OPTION_POR_FOREIGN_POLICY_LATIN_UNION_DESC: "Если представится такая возможность, Португалия присоединится к праведному Латинскому союзу."
RULE_OPTION_POR_FOREIGN_POLICY_NEUTRAL: "£KR_game_rule_flag_POR_national_populist   Сохранить нейтралитет"
RULE_OPTION_POR_FOREIGN_POLICY_NEUTRAL_DESC: "Не желая участвовать в международных конфликтах и кризисах, Португалия будет стоять в мире в одиночестве."

RUS_FOREIGN_POLICY: "£KR_game_rule_flag_RUS   Внешняя политика России"
RULE_OPTION_RUS_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_RUS_FOREIGN_POLICY_RANDOM_DESC: "Вторая Мировая война подошла к концу, и началась новая Холодная война. Будет ли Россия продолжать прокладывать свой собственный путь или объединит усилия со своими историческими союзниками по Антанте?"
RULE_OPTION_RUS_FOREIGN_POLICY_ENTENTE: "£KR_game_rule_flag_RUS  £KR_game_rule_flag_CAN  Вновь присоединиться к Антанте"
RULE_OPTION_RUS_FOREIGN_POLICY_ENTENTE_DESC: "Россия решит воссоединиться со своими старыми друзьями по Антанте."
RULE_OPTION_RUS_FOREIGN_POLICY_JAPAN: "£KR_game_rule_flag_RUS  £KR_game_rule_flag_JAP Сфера Сопроцветания"
RULE_OPTION_RUS_FOREIGN_POLICY_JAPAN_DESC: "Чтобы избежать ещё одной кровопролитной русско-японской войны, Россия предлагает союз с Японией после урегулирования ситуации в Приамурье."
RULE_OPTION_RUS_FOREIGN_POLICY_REICHSPAKT: "£KR_game_rule_flag_RUS  £KR_game_rule_flag_GER  Рейхспакт"
RULE_OPTION_RUS_FOREIGN_POLICY_REICHSPAKT_DESC: "Керенскому удалось убедить немцев пересмотреть Минский договор, и он вознаграждён полноправным членством в военном союзе Германии.\n§RТребуется:§!\n§CВечный президент§! в §Y£KR_game_rule_flag_RUS   Убийство президента Керенского§!"
RULE_OPTION_RUS_FOREIGN_POLICY_INTERNATIONALE_LITE: "£KR_game_rule_flag_RUS  £KR_game_rule_flag_FRA  Разрядка с Интернационалом"
RULE_OPTION_RUS_FOREIGN_POLICY_INTERNATIONALE_LITE_DESC: "Если социалистическая революция добьётся успеха, Россия решит присоединиться к Интернационалу. Если Революция будет неудачной, Россия и её фракция остановятся перед вступлением в Интернационал, но вместо этого решат сохранить с ним дружественные отношения.\n§RТребуется:§!\n§CЛевое правительство в России§!"
RULE_OPTION_RUS_FOREIGN_POLICY_MOSCOW_ACCORD: "£KR_game_rule_flag_RUS  Россия идёт своим путём"
RULE_OPTION_RUS_FOREIGN_POLICY_MOSCOW_ACCORD_DESC: "Россия решит остаться хозяйкой своей собственной судьбы и не присоединяться к какому-либо глобальному блоку, решив вместо этого остаться лидером собственной фракции."

SCA_FORMATION: "£KR_game_rule_flag_SCA   Образование Скандинавии"
RULE_OPTION_SCA_FORMATION_RANDOM: "По умолчанию"
RULE_OPTION_SCA_FORMATION_RANDOM_DESC: "Объединятся ли скандинавские народы, чтобы сохранить нейтралитет Севера?"
RULE_OPTION_SCA_FORMATION_NEVER: "£KR_game_rule_flag_SCA   Никогда"
RULE_OPTION_SCA_FORMATION_NEVER_DESC: "Идея единой Скандинавии забыта после того, как одна из стран отказывается от Северного нейтралитета.\n§RТребуется:§!\n§RНе§! §CСеверная федерация§! в §Y£KR_game_rule_flag_NOR   Внешняя политика Норвегии§! или §RНе§! §CДемократия§! в §Y£KR_game_rule_flag_SWE   Швеция§! или §RНе§! §CДемократия§! в §Y£KR_game_rule_flag_DEN   Дания§!"
RULE_OPTION_SCA_FORMATION_ALWAYS: "£KR_game_rule_flag_SCA   Всегда"
RULE_OPTION_SCA_FORMATION_ALWAYS_DESC: "Сочетание демократии и нейтралитета объединяет северные народы в новое государство - Скандинавию.\n§RТребуется:§!\n§CСеверная федерация§! в §Y£KR_game_rule_flag_NOR   Внешняя политика Норвегии§! и §CДемократия§! в §Y£KR_game_rule_flag_SWE   Швеция§! и §CДемократия§! в §Y£KR_game_rule_flag_DEN   Дания§!"

SIC_ELECTION: "£KR_game_rule_flag_SIC   Выборы в Обеих Сицилиях"
RULE_OPTION_SIC_ELECTION_RANDOM: "По умолчанию"
RULE_OPTION_SIC_ELECTION_RANDOM_DESC: "Исход выборов 1937 года, как и будущее сицилийской нации, остаётся на усмотрение судьбы."
RULE_OPTION_SIC_ELECTION_DEMOCRACY: "£KR_game_rule_flag_SIC   Сохранение демократии"
RULE_OPTION_SIC_ELECTION_DEMOCRACY_DESC: "На выборах может быть избрана любая из демократических партий, выступающих против интегрализма."
RULE_OPTION_SIC_ELECTION_SOC_CON: "£KR_game_rule_flag_SIC   Социал-консерваторы"
RULE_OPTION_SIC_ELECTION_SOC_CON_DESC: "На выборах побеждает социал-консервативная партия"
RULE_OPTION_SIC_ELECTION_SOC_DEM: "£KR_game_rule_flag_SIC   Социал-демократы"
RULE_OPTION_SIC_ELECTION_SOC_DEM_DESC: "На выборах побеждает социал-демократическая Партия труда."
RULE_OPTION_SIC_ELECTION_SOC_LIB: "£KR_game_rule_flag_SIC   Избранные социал-либералы"
RULE_OPTION_SIC_ELECTION_SOC_LIB_DESC: "Победу на выборах одерживает социал-либеральная Партия либеральной демократии Италии."
RULE_OPTION_SIC_ELECTION_MAR_LIB: "£KR_game_rule_flag_SIC   Рыночные либералы Избранные"
RULE_OPTION_SIC_ELECTION_MAR_LIB_DESC: "На выборах побеждает рыночно-либеральная Партия либерального итальянского движения."
RULE_OPTION_SIC_ELECTION_INTEGRALIST: "£KR_game_rule_flag_SIC   Южное действие"
RULE_OPTION_SIC_ELECTION_INTEGRALIST_DESC: "На выборах побеждает национал-популистская Южное действие, которая начинает преобразование Двух Сицилий."
RULE_OPTION_SIC_ELECTION_EVOLA: "£KR_game_rule_flag_SIC_legion   Легион берёт власть"
RULE_OPTION_SIC_ELECTION_EVOLA_DESC: "Барон Юлиус Эвола и его радикальные традиционалисты захватывают власть ещё до проведения выборов."
RULE_OPTION_SIC_ELECTION_NEOSANFEDISTI: "£KR_game_rule_flag_SIC_catholic   Умеренные неосанфедисты"
RULE_OPTION_SIC_ELECTION_NEOSANFEDISTI_DESC: "Барон Юлиус Эвола и его радикальные традиционалисты захватывают власть ещё до проведения выборов. После неудачного вторжения на Сицилию Эвола будет свергнут неосанфедистами, после чего верх одержат умеренные падре Зиггиотти."
RULE_OPTION_SIC_ELECTION_BOURBON_RESTORATION: "£KR_game_rule_flag_SIC_ziggi_two_sicilies   Умеренные неосанфедисты восстанавливают Бурбонов"
RULE_OPTION_SIC_ELECTION_BOURBON_RESTORATION_DESC: "Барон Юлиус Эвола и его радикальные традиционалисты захватывают власть ещё до проведения выборов. После неудачного вторжения на Сицилию Эвола свергнут неосанфедистами, после чего умеренные падре Зиггиотти одержат победу и вернут Бурбонов на трон."
RULE_OPTION_SIC_ELECTION_PIO: "£KR_game_rule_flag_SIC_pio   Неосанфедисты-жестокомысленники"
RULE_OPTION_SIC_ELECTION_PIO_DESC: "Барон Юлиус Эвола и его радикальные традиционалисты захватывают власть ещё до проведения выборов. После неудачного вторжения на Сицилию Эвола свергнут неосанфедистами, после чего победят харлинги Падре Пио."
RULE_OPTION_SIC_ELECTION_FASCI: "£KR_game_rule_flag_SIC_fascists  Фашисты"
RULE_OPTION_SIC_ELECTION_FASCI_DESC: "Барон Юлиус Эвола и его радикальные традиционалисты захватывают власть ещё до проведения выборов. После неудачного вторжения на Сицилию Эвола свергнут Риккардо Ломбарди и Фаши."
RULE_OPTION_SIC_ELECTION_MAFIA: "£KR_game_rule_flag_SIC_mafia   Мафия"
RULE_OPTION_SIC_ELECTION_MAFIA_DESC: "Барон Юлиус Эвола и его радикальные традиционалисты захватывают власть ещё до проведения выборов. После неудачного вторжения на Сицилию Эвола свергнут доном Калоджеро Виццини и мафией."

SPR_FORPOL: "£KR_game_rule_flag_SPR   Внешняя политика Королевства Испания"
RULE_OPTION_SPR_FORPOL_RANDOM: "По умолчанию"
RULE_OPTION_SPR_FORPOL_RANDOM_DESC: "Теперь, когда смута в Королевстве Испания утихла, пришло время определить место Испании в мире."
RULE_OPTION_SPR_FORPOL_ENTENTE: "£KR_game_rule_flag_SPR £KR_game_rule_flag_CAN   Антанта"
RULE_OPTION_SPR_FORPOL_ENTENTE_DESC: "Наше место - рядом с нашими традиционными союзниками, британцами. Мы должны помочь им вернуть их земли и присоединить наши силы к их, чтобы изгнать синдикализм с лица земли. \n§RТребуется:§!\n§CГражданская война предотвращена§! в §Y£KR_game_rule_flag_SPR Испанская гражданская война§! или §CКоролевство Испания побеждает в Испанской гражданской войне§!"
RULE_OPTION_SPR_FORPOL_REICHSPAKT: "£KR_game_rule_flag_SPR £KR_game_rule_flag_GER   Рейхспакт"
RULE_OPTION_SPR_FORPOL_REICHSPAKT_DESC: "Наше место - рядом с Германией. Давайте присоединимся к Рейхспакту, чтобы синдикалисты оказались в окружении. \n§RТребуется:§!\n§CГражданская война предотвращена§! в §Y£KR_game_rule_flag_SPR Испанская гражданская война§! или §CКоролевство Испания побеждает в Испанской гражданской войне§!"
RULE_OPTION_SPR_FORPOL_AUSTRIA: "£KR_game_rule_flag_SPR £KR_game_rule_flag_AUS   Дунай-Адриатический Союз"
RULE_OPTION_SPR_FORPOL_AUSTRIA_DESC: "Наше место - среди наших единоверцев-католиков. Давайте присоединимся к Донау-Адриабунду, чтобы синдикалисты оказались в окружении. \n§RТребуется:§!\n§CГражданская война предотвращена§! в §Y£KR_game_rule_flag_SPR Испанская гражданская война§! или §CКоролевство Испания побеждает в Испанской гражданской войне§!"
RULE_OPTION_SPR_FORPOL_RADICAL_ENTENTE: "£KR_game_rule_flag_SPR   Радикальная Антанта"
RULE_OPTION_SPR_FORPOL_RADICAL_ENTENTE_DESC: "Испания, под руководством либо Izquierda Española, либо Union Española, стремилась восстановить старую Радикальную Антанту как оплот либерализма и радикализма. \n§RТребуется:§!\n§C£KR_game_rule_flag_SPR UR избрана§! или §C£KR_game_rule_flag_SPR IR избрана§! на §Y£KR_game_rule_flag_SPR Испанские выборы§!"
RULE_OPTION_SPR_FORPOL_SOI: "£KR_game_rule_flag_SPR   Интернациональная Рабочая Солидарность"
RULE_OPTION_SPR_FORPOL_SOI_DESC: "Испания, под руководством либо Partido Socialista Obrero Español, либо Partido Sindicalista, стремилась конкурировать с интернационалом, создавая умеренную социалистическую фракцию, решительно настроенную сохранить демократию. \n§RТребуется:§!\n§CГражданская война предотвращена, левый союз§! в §Y£KR_game_rule_flag_SPR Испанская гражданская война§! и §C£KR_game_rule_flag_SPR PSOE избрана§! на §Y£KR_game_rule_flag_SPR Испанские выборы§! и §C£KR_game_rule_flag_SPR PSOE избрана§! или §C£KR_game_rule_flag_SPR PS избрана§! на §Y£KR_game_rule_flag_SPR Вторые Испанские выборы§!"
RULE_OPTION_SPR_FORPOL_HISPANIC: "£KR_game_rule_flag_SPR    Испанский альянс"
RULE_OPTION_SPR_FORPOL_HISPANIC_DESC: "Испания, отказываясь вступать в какие-либо иностранные альянсы, создаст собственную сферу влияния, в которую войдут латиноамериканские державы.\n§RТребования:§!\n§CГражданская война не произошла§! в §Y£KR_game_rule_flag_SPR   Испанской гражданской войне§! или §CКоролевство Испания выиграло Испанскую гражданскую войну§!"
RULE_OPTION_SPR_FORPOL_RUSSIA: "£KR_game_rule_flag_SPR £KR_game_rule_flag_RUS   Московское соглашение"
RULE_OPTION_SPR_FORPOL_RUSSIA_DESC: "Испания, под руководством либо Partido Socialista Obrero Español, либо Partido Sindicalista, стремилась выстраивать отношения с умеренными левыми государствами, выбрав Россию как вероятного союзника.\n§RТребуется:§!\n§CГражданская война предотвращена, левый союз§! в §Y£KR_game_rule_flag_SPR Испанская гражданская война§! и §C£KR_game_rule_flag_SPR PSOE избрана§! на §Y£KR_game_rule_flag_SPR Испанские выборы§! и §C£KR_game_rule_flag_SPR PSOE избрана§! или §C£KR_game_rule_flag_SPR PS избрана§! на §Y£KR_game_rule_flag_SPR Вторые Испанские выборы§! и §CРоссия имеет демократически ориентированное левое правительство§!"
RULE_OPTION_SPR_FORPOL_ARMED_NEUTRALITY: "£KR_game_rule_flag_SPR   Вооружённый нейтралитет"
RULE_OPTION_SPR_FORPOL_ARMED_NEUTRALITY_DESC: "Испания, под руководством либо Partido Socialista Obrero Español, либо Partido Sindicalista, пришла к выводу, что вооружённый нейтралитет - лучший курс для нации. \n§RТребуется:§!\n§CГражданская война предотвращена, левый союз§! в §Y£KR_game_rule_flag_SPR Испанская гражданская война§! и §C£KR_game_rule_flag_SPR PSOE избрана§! на §Y£KR_game_rule_flag_SPR Испанские выборы§! и §C£KR_game_rule_flag_SPR PSOE избрана§! или §C£KR_game_rule_flag_SPR PS избрана§! на §Y£KR_game_rule_flag_SPR Вторые Испанские выборы§!"

CAR_FORPOL: "£KR_game_rule_flag_CAR   Внешняя политика карлистской Испании"
RULE_OPTION_CAR_FORPOL_RANDOM: "По умолчанию"
RULE_OPTION_CAR_FORPOL_RANDOM_DESC: "Теперь, когда карлисты укрепили свою власть в Испании, пришло время определить место Испании в мире."
RULE_OPTION_CAR_FORPOL_ENTENTE: "£KR_game_rule_flag_CAR   £KR_game_rule_flag_CAN   Антанта"
RULE_OPTION_CAR_FORPOL_ENTENTE_DESC: "Португальцы и французы являются союзниками и друзьями, и, поскольку они связаны с Антантой, нам следует стремиться присоединиться к этому военному союзу ради безопасности.\n§RТребуется:§!\n§CКарлисты побеждают на открытых выборах§! в §Y£KR_game_rule_flag_SPR   Гражданская война в Испании§! или §CКарлистская Испания побеждает в Гражданской войне в Испании§!"
RULE_OPTION_CAR_FORPOL_MED_BLOC: "£KR_game_rule_flag_CAR   Ратифицировать Средиземноморский блок"
RULE_OPTION_CAR_FORPOL_MED_BLOC_DESC: "Идеи блока средиземноморских стран обсуждаются годами, по крайней мере, после Мировой войны. С стабилизацией нашего правительства мы можем наконец сформировать собственный союз и восстановить почётное положение Испании в континентальных делах.\n§RТребуется:§!\n§CКарлисты побеждают на открытых выборах§! в §Y£KR_game_rule_flag_SPR   Гражданская война в Испании§! или §CКарлистская Испания побеждает в Гражданской войне в Испании§!"

BEL_FLANDERS_WALLONIA_PATHS: "£KR_game_rule_flag_BEL   Последствия 17 февраля"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_RANDOM: "По умолчанию"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_RANDOM_DESC: "С непопулярным королём и сильными антигерманскими настроениями среди населения Фландрия-Валлония стоит на пороге великих перемен."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_STATUS_QUO: "£KR_game_rule_flag_BEL   Статус-кво"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_STATUS_QUO_DESC: "Адальберт подавляет протесты с помощью армии и не решается проводить какие-либо реформы в королевстве."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_REFORMS_SOCCON: "£KR_game_rule_flag_BEL   Реформы - KB/BC"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_REFORMS_SOCCON_DESC: "Адальберт подавляет протесты с помощью армии. Некоторое время спустя он решается на реформы, превращая королевство в полноценную конституционную монархию. Социал-консервативная KB/BC побеждает на выборах."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_EFORMS_SOCDEM: "£KR_game_rule_flag_BEL   Реформы - BWP/POB"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_EFORMS_SOCDEM_DESC: "Адальберт подавляет протесты с помощью армии. Некоторое время спустя он решается на реформы, превращая королевство в полноценную конституционную монархию. Социал-демократическая BWP/POB побеждает на выборах."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_SOCCON: "£KR_game_rule_flag_BEL   Военный переворот - KB/BC"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_SOCCON_DESC: "Адальберт подавляет протесты с помощью армии. Через некоторое время армия набирает достаточно сил, чтобы свергнуть непопулярное правительство, и превращает Адальберта в номинальную фигуру. Социал-консервативная KB/BC побеждает на следующих выборах."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_MARLIB: "£KR_game_rule_flag_BEL   Военный переворот - LP/PL"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_MARLIB_DESC: "Адальберт подавляет протесты с помощью армии. Через некоторое время армия набирает достаточно сил, чтобы свергнуть непопулярное правительство, и превращает Адальберта в номинальную фигуру. Рыночно-либеральная LP побеждает на следующих выборах."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_SOCDEM: "£KR_game_rule_flag_BEL   Военный переворот - BWP/POB"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_SOCDEM_DESC: "Адальберт подавляет протесты с помощью армии. Через некоторое время армия набирает достаточно сил, чтобы свергнуть непопулярное правительство, и превращает Адальберта в номинальную фигуру. Социал-демократическая BWP/POB побеждает на следующих выборах."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_RETURN_OF_ADELBERT: "£KR_game_rule_flag_BEL   Военный переворот - Реставрация Адальберта"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_RETURN_OF_ADELBERT_DESC: "Адальберт подавляет протесты с помощью армии. Через некоторое время армия набирает достаточно сил, чтобы свергнуть непопулярное правительство, и превращает Адальберта в номинальную фигуру. Социал-демократическая BWP/POB побеждает на следующих выборах, но Германия вмешивается и восстанавливает Адальберта. Бельгия позже восстаёт после того, как Парижская коммуна объявляет войну Германской империи."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_PATAUT: "£KR_game_rule_flag_BEL    Военный переворот - Военное правление"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_ARMY_COUP_ELECTIONS_PATAUT_DESC: "Адальберт подавляет протесты с помощью армии. Через некоторое время армия набирает достаточно сил, чтобы свергнуть непопулярное правительство, и превращает Адальберта в номинальную фигуру. Военные решают не отдавать власть."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_FLANDERS_REVOLT_INTERVENTION: "£KR_game_rule_flag_WLL  £KR_game_rule_flag_FLN   Восстание Фламандского совета - Интервенция"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_FLANDERS_REVOLT_INTERVENTION_DESC: "Адальберт посылает армию для подавления протестов 17 февраля. В последней отчаянной попытке сохранить власть перед роспуском Фламандский совет делает смелый шаг, единогласно провозглашая независимость Фландрии. Адальберт решает подавить это восстание."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_FLANDERS_REVOLT_ACQUIESCENCE: "£KR_game_rule_flag_WLL  £KR_game_rule_flag_FLN   Восстание Фламандского совета - Согласие"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_FLANDERS_REVOLT_ACQUIESCENCE_DESC: "Адальберт посылает армию для подавления протестов 17 февраля. В последней отчаянной попытке сохранить власть перед роспуском Фламандский совет делает смелый шаг, единогласно провозглашая независимость Фландрии. Адальберт колеблется вторгаться во Фландрию."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_REBELLION: "£KR_game_rule_flag_BELG   Восстание - Независимость Бельгии"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_REBELLION_DESC: "Только местная полиция пытается подавить протесты 17 февраля. Ситуация становится критической, кульминацией становится восстание. Фламандские и валлонские повстанцы работают вместе, чтобы обеспечить независимость единой Бельгии, изгоняя германские силы из страны.\n§CПримечание: Бельгия объявляет независимость в§! §Y1936§!§C.§!"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_REFERENDUM: "£KR_game_rule_flag_BELG   Референдум - Независимость Бельгии"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_REFERENDUM_DESC: "Адальберт посылает армию для подавления протестов 17 февраля. Из-за растущей напряжённости проводится тайный референдум, призывающий к независимости Бельгии. Германия принимает результаты этого референдума и предоставляет Бельгии независимость.\n§CПримечание: Бельгия объявляет независимость около§! §Y1937§! §Cили после.§!"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_CRACKDOWN: "£KR_game_rule_flag_WLL   Референдум - Подавление"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_CRACKDOWN_DESC: "Адальберт посылает армию для подавления протестов 17 февраля. Из-за растущей напряжённости проводится тайный референдум, призывающий к независимости Бельгии. Германия отвергает результаты этого референдума и подавляет всех инакомыслящих. Бельгия позже восстаёт после того, как Парижская коммуна объявляет войну Германской империи."
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_ABDICATION: "£KR_game_rule_flag_BELG   Отречение - Независимость Бельгии"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_INDEPENDENCE_ABDICATION_DESC: "Адальберт посылает армию для подавления протестов 17 февраля. Фламандская стража (Vlaamse Wacht) пользуется возможностью консолидировать власть. Позже она совершает успешный переворот и вынуждает Адальберта отречься от престола. Ван Северен пытается консолидировать свою власть, но большая коалиция BWP, KB и LP свергает его, а затем проводит выборы.\n§CПримечание: Бельгия объявляет независимость около§! §Y1938§! §Cили после.§!"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_COLLAPSE: "£KR_game_rule_flag_WLL  £KR_game_rule_flag_FLN   Распад"
RULE_OPTION_BEL_FLANDERS_WALLONIA_PATHS_COLLAPSE_DESC: "Единая Фландрия-Валлония не смогла выжить в огне революции, и теперь на её месте две отдельные страны, судьба которых неясна.\n§CПримечание: Страна распадается в§! §Y1936§!§C.§!"

BEL_ELECTION: "£KR_game_rule_flag_BELG   Выборы в Бельгии"
RULE_OPTION_BEL_ELECTION_RANDOM: "По умолчанию"
RULE_OPTION_BEL_ELECTION_RANDOM_DESC: "После провозглашения независимости новое бельгийское правительство проведёт выборы в своей стране."
RULE_OPTION_BEL_ELECTION_SOCCON: "£KR_game_rule_flag_BELG   Католическая партия"
RULE_OPTION_BEL_ELECTION_SOCCON_DESC: "Социал-консервативная Католическая партия побеждает на выборах.\n§RТребуется:§!\n§CМонархия восстановлена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_ELECTION_SOCDEM: "£KR_game_rule_flag_BELG   Ван Аккер"
RULE_OPTION_BEL_ELECTION_SOCDEM_DESC: "Социал-демократическое крыло Бельгийской рабочей партии под руководством Ван Аккера побеждает на выборах.\n§RТребуется:§!\n§CМонархия восстановлена§! или §CРеспублика провозглашена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_ELECTION_SOCLIB: "£KR_game_rule_flag_BELG   Спаак"
RULE_OPTION_BEL_ELECTION_SOCLIB_DESC: "Социал-либеральное крыло Бельгийской рабочей партии под руководством Спаака побеждает на выборах.\n§RТребуется:§!\n§CРеспублика провозглашена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_ELECTION_TOT: "£KR_game_rule_flag_BELG   Де Ман"
RULE_OPTION_BEL_ELECTION_TOT_DESC: "Неосоциалистическое крыло Бельгийской рабочей партии под руководством Де Мана побеждает на выборах.\n§RТребуется:§!\n§CРеспублика провозглашена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_ELECTION_MARLIB: "£KR_game_rule_flag_BELG   Либеральная партия"
RULE_OPTION_BEL_ELECTION_MARLIB_DESC: "Рыночно-либеральная Либеральная партия побеждает на выборах.\n§RТребуется:§!\n§CРеспублика провозглашена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_ELECTION_PATERNAL_AUTOCRAT: "£KR_game_rule_flag_BELG   Вердинасо"
RULE_OPTION_BEL_ELECTION_PATERNAL_AUTOCRAT_DESC: "Патерналистско-автократическая Вердинасо побеждает на выборах.\n§RТребуется:§!\n§CМонархия восстановлена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_ELECTION_SYNDIE: "£KR_game_rule_flag_BELS   Захват власти синдикалистами"
RULE_OPTION_BEL_ELECTION_SYNDIE_DESC: "Народ Бельгии избирает Рабочую партию. Синдикалист Жакмотт берёт под контроль правительство, возглавляемое лейбористами, и реформирует страну в синдикалистское государство.\n§RТребуется:§!\n§CРеспублика провозглашена§! в §Y£KR_game_rule_flag_BELG   Первый Бельгийский конгресс§!\n§RНе§! §CВозвращение в Рейхспакт§! в §Y£KR_game_rule_flag_BELG  Внешняя политика Бельгии§!"

RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_REICHSPAKT_NO_DEMAND: "£KR_game_rule_flag_BELG  £KR_game_rule_flag_GER   Возвращение в Рейхспакт - Без требований"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_REICHSPAKT_NO_DEMAND_DESC: "Бельгия и Германская империя соглашаются, что в обмен на признание своей независимости Бельгия вернётся в Рейхспакт, не требуя ничего взамен."
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_REICHSPAKT_SMALL_DEMAND: "£KR_game_rule_flag_BELG  £KR_game_rule_flag_GER   Возвращение в Рейхспакт - Малое требование"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_REICHSPAKT_SMALL_DEMAND_DESC: "Бельгия и Германская империя соглашаются, что в обмен на признание своей независимости Бельгия вернётся в Рейхспакт, получив взамен Валлонский Люксембург."
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_REICHSPAKT_BIG_DEMAND: "£KR_game_rule_flag_BELG  £KR_game_rule_flag_GER   Возвращение в Рейхспакт - Большое требование"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_REICHSPAKT_BIG_DEMAND_DESC: "Бельгия и Германская империя соглашаются, что в обмен на признание своей независимости Бельгия вернётся в Рейхспакт, получив взамен весь Люксембург."
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_ENTENTE_DESC1: "Бельгию по-прежнему не убеждают дипломатические попытки Германии добиться её возвращения в Рейхспакт. Позднее Бельгия присоединяется к Антанте.\n§RТребуется:§!\nЛюбая §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! или §CБельгия Лейдера§! в §Y£KR_game_rule_flag_BEL  Первый Бельгийский конгресс§!\n§RНе§! §CСиндикалистский переворот§! в §Y£KR_game_rule_flag_BELG  Бельгийские выборы§!"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_INTERNATIONALE_DESC1:  "Бельгию по-прежнему не убеждают дипломатические попытки Германии добиться её возвращения в Рейхспакт. Позднее, под властью радикальных элементов BWP, Бельгия присоединяется к Интернационалу.\n§RТребуется:§!\nЛюбой вариант §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! и §CЗахват власти синдикалистами§! в §Y£KR_game_rule_flag_BELG  Выборы в Бельгии§!"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_ALIGN_DUTCH_DESC1: "Бельгию по-прежнему не убеждают дипломатические попытки Германии добиться её возвращения в Рейхспакт. Позднее Бельгия заключает союз с Нидерландами.\n§RТребуется:§!\nЛюбая §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! или §CБельгия Лейдера§! в §Y£KR_game_rule_flag_BEL  Первый Бельгийский конгресс§!\n§RНе§! §CСиндикалистский переворот§! в §Y£KR_game_rule_flag_BELG  Бельгийские выборы§!"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_NEUTRALITY_DESC1: "Бельгия остаётся неубеждённой германскими дипломатическими инициативами по обеспечению её возвращения в Рейхспакт. Позже Бельгия объявляет нейтралитет, чтобы дистанцироваться от конфликта. Однако этот нейтралитет во многом зависит от согласия Германии.\n§RТребуется:§!\nЛюбой вариант §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! или §CЛидер Бельгии§! в §Y£KR_game_rule_flag_BEL  Первый Бельгийский конгресс§!"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_GUARANTEE_GERMANY_DESC1: "Бельгию по-прежнему не убеждают дипломатические попытки Германии добиться её возвращения в Рейхспакт. Однако позднее Бельгия получает гарантии от Германской империи в обмен на выплату репараций.\n§RТребуется:§!\nЛюбая §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! или §CБельгия Лейдера§! в §Y£KR_game_rule_flag_BEL  Первый Бельгийский конгресс§!\n§RНе§! §CСиндикалистский переворот§! в §Y£KR_game_rule_flag_BELG  Бельгийские выборы§!"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_GUARANTEE_CANADA_DESC1: "Бельгию по-прежнему не убеждают дипломатические попытки Германии добиться её возвращения в Рейхспакт. Чтобы защитить свою независимость, позднее Бельгия получает гарантии от Антанты.\n§RТребуется:§!\nЛюбая §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! или §CБельгия Лейдера§! в §Y£KR_game_rule_flag_BEL  Первый Бельгийский конгресс§!\n§RНе§! §CСиндикалистский переворот§! в §Y£KR_game_rule_flag_BELG  Бельгийские выборы§!"
RULE_OPTION_BEL_INDEPENDENT_FOREIGN_POLICY_GUARANTEE_FRANCE_DESC1: "Бельгия остаётся неубеждённой германскими дипломатическими инициативами по обеспечению её возвращения в Рейхспакт. Хотя и не решаясь присоединиться к альянсу официально, чтобы защитить свою независимость, новая социалистическая Бельгия позже получает гарантию от Интернационала.\n§RТребуется:§!\nЛюбой вариант §CНезависимость Бельгии§! в §Y£KR_game_rule_flag_BEL  Последствия 17 февраля§! и §CЗахват власти синдикалистами§! в §Y£KR_game_rule_flag_BELG  Выборы в Бельгии§!"

FLN_POLITICAL_PATH: "£KR_game_rule_flag_FLN   Фламандский совет"
RULE_OPTION_FLN_POLITICAL_PATH_RANDOM: "По умолчанию"
RULE_OPTION_FLN_POLITICAL_PATH_RANDOM_DESC: "Фламандский совет, состоящий в основном из знати, был созван для избрания монарха новой отдельной страны. Но сможет ли он удержаться у власти и выполнить своё предназначение или падёт под натиском радикалов и сторонников присоединения к Нидерландам?"
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_ADELBERT: "£KR_game_rule_flag_FLN   Фламандский совет - Возвращение Адальберта"
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_ADELBERT_DESC: "Закрепив свою власть в Совете, знать решила пригласить Адальберта на трон, чтобы иметь возможность свободно править при его номинальном правлении."
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_CONSTITUTIONAL_MONARCHY: "£KR_game_rule_flag_FLN   Фламандский совет - Конституционная монархия"
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_CONSTITUTIONAL_MONARCHY_DESC: "Закрепив свою власть в Совете, знать решила пригласить на трон графа Карела Ван Бельги, который становится Карелом ван Влаандереном. Король становится номинальной фигурой, и назначаются свободные выборы."
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_REPUBLIC: "£KR_game_rule_flag_FLN   Фламандский совет - Провозглашена республика"
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_REPUBLIC_DESC: "Под давлением народа, вызванным раскрытием связей аристократии с Валлонией и Германией с целью восстановления германского правления, Совету пришлось объявить республику и провести свободные выборы."
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_SEVEREN: "£KR_game_rule_flag_FLN   Фламандский совет - Вердинасо"
RULE_OPTION_FLN_POLITICAL_PATH_FLEMISH_COUNCIL_SEVEREN_DESC: "Из-за отставки самых роялистских членов Совета резко возросла популярность фракции сторонников Ван Северена, которые смогли выиграть голосование за продолжение регентства и преобразование Совета в патерналистско-автократическое правительство."
RULE_OPTION_FLN_POLITICAL_PATH_RESISTANCE_REPUBLIC: "£KR_game_rule_flag_FLN   Провозглашена республика"
RULE_OPTION_FLN_POLITICAL_PATH_RESISTANCE_REPUBLIC_DESC: "После провала идеи воссоединения с Нидерландами провозглашается республика."
RULE_OPTION_FLN_POLITICAL_PATH_RESISTANCE_NETHERLANDS: "£KR_game_rule_flag_FLN  £KR_game_rule_flag_HOL   Великие Нидерланды"
RULE_OPTION_FLN_POLITICAL_PATH_RESISTANCE_NETHERLANDS_DESC: "Идея Великих Нидерландов побеждает, и Фландрия становится голландской марионеткой."
RULE_OPTION_FLN_POLITICAL_PATH_PUPPET_NETHERLANDS: "£KR_game_rule_flag_FLN  £KR_game_rule_flag_HOL   Голландская марионетка"
RULE_OPTION_FLN_POLITICAL_PATH_PUPPET_NETHERLANDS_DESC: "Во время революции фламандцы обращаются за помощью к Нидерландам, и Фландрия становится голландской марионеткой.\n§RТребуется:§!\n§CРаспад§! в §Y£KR_game_rule_flag_BEL   Последствия 17 февраля§!\n§RВзаимоисключающее условие:§!\n§CВаллонские повстанцы запрашивают поддержку у Французской коммуны§!"
RULE_OPTION_FLN_POLITICAL_PATH_PUPPET_NETHERLANDS_REICHSPAKT: "£KR_game_rule_flag_FLN  £KR_game_rule_flag_HOL  £KR_game_rule_flag_GER   Голландская марионетка - Рейхспакт"
RULE_OPTION_FLN_POLITICAL_PATH_PUPPET_NETHERLANDS_REICHSPAKT_DESC: "Во время революции фламандцы обращаются за помощью к Нидерландам, и Фландрия становится голландской марионеткой. Германия угрожает войной, и Нидерланды вынуждены присоединиться к Рейхспакту.\n§RТребуется:§!\n§CРаспад§! в §Y£KR_game_rule_flag_BEL   Последствия 17 февраля§!\n§RВзаимоисключающее условие:§!\n§CВаллонские повстанцы запрашивают поддержку у Французской коммуны§!"
RULE_OPTION_FLN_POLITICAL_PATH_PUPPET_NETHERLANDS_GERMAN_INTERVENTION: "£KR_game_rule_flag_FLN  £KR_game_rule_flag_HOL  £KR_game_rule_flag_GER   Голландская марионетка - Война"
RULE_OPTION_FLN_POLITICAL_PATH_PUPPET_NETHERLANDS_GERMAN_INTERVENTION_DESC: "Во время революции фламандцы обращаются за помощью к Нидерландам, и Фландрия становится голландской марионеткой. Германия угрожает войной, но Нидерланды отвергают ультиматум. Начинается вторжение.\n§RТребуется:§!\n§CРаспад§! в §Y£KR_game_rule_flag_BEL   Последствия 17 февраля§!\n§RВзаимоисключающее условие:§!\n§CВаллонские повстанцы запрашивают поддержку у Французской коммуны§!"

