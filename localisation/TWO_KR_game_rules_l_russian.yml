RULE_OPTION_OTT_PATHS_ENDEAVOUR_NATPOP_DESC: "После убийства великого визиря Кемаля и последующего кризиса правящей партии Февзи-паша совершает военный переворот. Впоследствии он объявляет об отмене чрезвычайного положения и создает переходное правительство - Фронт эндеворов, который передает власть национал-популистскому Кадровому движению, подталкивая империю к социал-национализму."

OTT_FOREIGN_POLICY: "£KR_game_rule_flag_OTT   Внешняя политика Османской империи"
