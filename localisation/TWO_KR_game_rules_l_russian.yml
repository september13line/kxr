#Chinese Cliques new desc
RULE_OPTION_SQI_SONG_DESC1: "Сун Чжэюань свергнет Чжан Цзунчана и объединит провинцию с Цин.\n§RФракция:§!\n§CЧжилийская клика§!"
RULE_OPTION_SQI_ZHONGCHANG_DESC1: "Чжан Цзунчан выживет, и его decadent правление продолжится.\n§RФракция:§!\n§CФэнтяньская клика§!"

RULE_OPTION_HNN_BUD_DESC1:  "Чжао Хэнти позволяет провести выборы в Хунани. Общество буддизации Тан Шэнчжи одерживает неожиданную победу.\n§RФракция:§!\n§CФедералисты или Левый Гоминьдан или Альянс национальной защиты§!"
RULE_OPTION_HNN_FED_DESC1:  "Чжао Хэнти позволяет провести выборы в Хунани. Его Федералистская партия побеждает, как и ожидалось.\n§RФракция:§!\n§CФедералисты§!"
RULE_OPTION_HNN_KMT_DESC1:  "Чжао Хэнти позволяет провести выборы в Хунани. Гоминьдан под руководством Чэн Цяня одерживает неожиданную победу.\n§RФракция:§!\n§CЛевый или Правый Гоминьдан§!"
RULE_OPTION_HNN_AUT_DESC1:  "Чжао Хэнти не позволяет провести выборы, направляя Хунань по автократическому пути и сближаясь с Чжилийской кликой в Пекине.\n§RФракция:§!\n§CЧжилийская клика или Федералисты§!"

