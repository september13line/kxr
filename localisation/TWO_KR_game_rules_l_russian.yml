RULE_OPTION_TUR_PATH_SOCCON_DESC: "Бывшие противники Кемаля формируют Партию спасения Османской империи, которая стремится любой ценой сохранить султанат. На последующих выборах побеждает §cКонсервативная коалиция§!.\n\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\n§RНе§! §C$RULE_OPTION_OTT_PATHS_FEVZI$§! или любой §CФронт Endeavour§! в §Y$OTT_PATHS$§!"
RULE_OPTION_TUR_PATH_KEMAL: "£KR_game_rule_flag_TUR  Воля Кемаля"
RULE_OPTION_TUR_PATH_KEMAL_DESC: "После провала либералов §gМустафа Кемаль§! захватывает власть и начинает вести страну к своей мечте: провозглашению Республики.\n\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\nЛюбой §CСабахаттин Эфенди§! в §Y$OTT_PATHS$§!"
