RULE_OPTION_TUR_FORPOL_UKR_DESC: "Турция будет избегать любых союзов с великими державами, предпочитая вместо этого локальное сотрудничество с украинским правительством.\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\n§C$RULE_OPTION_UKR_FUTURE_UPSF_FEDERALIST$§! в §Y$UKR_FUTURE$§! и §C$RULE_OPTION_TUR_PATH_SOCLIB$§! в §Y$TUR_PATH$§!"
RULE_OPTION_TUR_FORPOL_RUS: "£KR_game_rule_flag_TUR_ottoman_empire  £KR_game_rule_flag_RUS  Московский аккорд"
RULE_OPTION_TUR_FORPOL_RUS_DESC: "Совершая поразительный разворот, турки заключают новый союз с одним из своих самых печально известных исторических противников.\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\n§CГермания побеждена во Второй Мировой войне§!\n$RUS_AFTERMATH_NOT_SOC_REQUIREMENTS$"
RULE_OPTION_TUR_FORPOL_NEUTRALITY: "£KR_game_rule_flag_TUR_ottoman_empire  Нейтралитет"
RULE_OPTION_TUR_FORPOL_NEUTRALITY_DESC: "Турция останется нейтральной, не поддерживая ни одну из фракций."


