BHC_LUCKNOW: "£KR_game_rule_flag_BHC   Лакнауский саммит"
RULE_OPTION_BHC_LUCKNOW_RANDOM: "По умолчанию"
RULE_OPTION_BHC_LUCKNOW_RANDOM_DESC: "Tсаммит в Лакхнау может привести к ничтожно малой вероятности мирного воссоединения с Дели, но Махатма верит, что это можно сделать... и, если мир возможен, то он должен быть сделан."
RULE_OPTION_BHC_LUCKNOW_SUCCESS: "£KR_game_rule_flag_BHC   £KR_game_rule_flag_DEH   Успех саммита в Лакхнау"
RULE_OPTION_BHC_LUCKNOW_SUCCESS_DESC: "Саммит в Лакхнау завершён, и сделка заключена: Коммуна станет частью Доминиона, а Ганди станет главой государства. \n§RТребуется:§!\n§RОбе§! партии §MАграрии избраны§! в §Y£KR_game_rule_flag_BHC Специальное собрание МКП§!\n§Rи§! §MЛефтисты победили§! на выборах в §Y£KR_game_rule_flag_DEH Доминион Индии 1936 года§!"
RULE_OPTION_BHC_LUCKNOW_FAILURE: "£KR_game_rule_flag_BHC   Неудача саммита в Лакхнау"
RULE_OPTION_BHC_LUCKNOW_FAILURE_DESC: "Ни одна из сторон не достигает соглашения о воссоединении. Саммит в Лакхнау проваливается, и исчезает последняя надежда на мир на субконтиненте. \n§RВыборы:§!\n§RОбе§! партии §MАграрии избраны§! в §Y£KR_game_rule_flag_BHC Внеочередное собрание§!\n§Rи§! §MЛефтисты победили§! на выборах в §Y£KR_game_rule_flag_DEH Доминион Индии 1936 года§!"

BHU_ZHABDRUNG: "£KR_game_rule_flag_BHU   Встреча с Жабдрунгом"
RULE_OPTION_BHU_ZHABDRUNG_RANDOM: "По умолчанию"
RULE_OPTION_BHU_ZHABDRUNG_RANDOM_DESC: "Монахи предложили организовать встречу между королем и Жабдрунгом, номинально для определения судьбы молодого выскочки. Должен ли Джигме Вангчак рискнуть и пойти на это?"
RULE_OPTION_BHU_ZHABDRUNG_REFORMIST: "£KR_game_rule_flag_BHU   Джигме Вангчак остаётся"
RULE_OPTION_BHU_ZHABDRUNG_REFORMIST_DESC: "Джигме Вангчук остаётся королем после внезапной смерти Жабдрунга, избегая дальнейшего кровопролития."
RULE_OPTION_BHU_ZHABDRUNG_PENJOR: "£KR_game_rule_flag_BHU   Тшеринг Пенджор коронован"
RULE_OPTION_BHU_ZHABDRUNG_PENJOR_DESC: "Джигме Вангчак умирает от ран, попав в засаду во время встречи с Жабдрунгом. Церинг Пенджор коронуется в качестве нового короля при режиме национального популизма."
RULE_OPTION_BHU_ZHABDRUNG_DORJI: "£KR_game_rule_flag_BHU   Джигме Дорджи коронован"
RULE_OPTION_BHU_ZHABDRUNG_DORJI_DESC: "Джигме Вангчак умирает от ран, попав в засаду во время встречи с Жабдрунгом. Джигме Дорджи коронуется как новый Король при авторитарном демократическом режиме."

BUR_STRIKES: "£KR_game_rule_flag_BRM_authoritarian_democrat   Беспорядки и протесты в Бирме"
RULE_OPTION_BUR_STRIKES_RANDOM: "По умолчанию"
RULE_OPTION_BUR_STRIKES_RANDOM_DESC: "Недовольство отсутствием участия населения в управлении государством вызвало ряд крупнейших демонстраций в Бирме. Какая судьба ожидает Бирму?"
RULE_OPTION_BUR_STRIKES_RAD_SOC: "£KR_game_rule_flag_BRM_radical_socialist   Бирманская Республика"
RULE_OPTION_BUR_STRIKES_RAD_SOC_DESC: "Армия объединяется с протестующими после приказа открыть огонь по ним, свергая монархию навсегда, что приводит к провозглашению радикальной социалистической республики."
RULE_OPTION_BUR_STRIKES_AUT_DEM: "£KR_game_rule_flag_BRM_authoritarian_democrat   Монархия остаётся у власти"
RULE_OPTION_BUR_STRIKES_AUT_DEM_DESC: "Династия Конбаунг остаётся у власти после того, как армия открывает огонь по протестующим, навсегда прекращая протесты."

BUR_INDIA: "£KR_game_rule_flag_BRM_radical_socialist   Отношения Бирмы с Индией"
RULE_OPTION_BUR_INDIA_RANDOM: "По умолчанию"
RULE_OPTION_BUR_INDIA_RANDOM_DESC: "Новое правительство Бирмы должно ответить на вопрос, присоединяться к Индии или нет. Национальный совет должен будет принять решение."
RULE_OPTION_BUR_INDIA_FACTION: "£KR_game_rule_flag_BRM_radical_socialist   Рассвет Восточного социалистического союза"
RULE_OPTION_BUR_INDIA_FACTION_DESC: "Бирма заключит союз с Индией, образовав новую фракцию. \n§RТребуется:§!\n§CПровозглашение Бирманской Республики§! в §Y£KR_game_rule_flag_BRM_authoritarian_democrat   Беспорядки и протесты в Бирме"
RULE_OPTION_BUR_INDIA_PUPPET: "£KR_game_rule_flag_BRM_radical_socialist   Марионетка Индии"
RULE_OPTION_BUR_INDIA_PUPPET_DESC: "Бирма подаст заявку на вступление в Индийский союз и станет его марионеткой. \n§RТребуется:§!\n§CПровозглашение Бирманской Республики§! в §Y£KR_game_rule_flag_BRM_authoritarian_democrat   Беспорядки и протесты в Бирме§!"
RULE_OPTION_BUR_INDIA_ISOLATION: "£KR_game_rule_flag_BRM_radical_socialist   Изоляция"
RULE_OPTION_BUR_INDIA_ISOLATION_DESC: "Изоляция хорошо служила Бирме в прошлом, будет служить и в будущем. \n§RТребуется:§!\n§CПровозглашение Бирманской Республики§! в §Y£KR_game_rule_flag_BRM_authoritarian_democrat   Беспорядки и протесты в Бирме§!"

DEH_AFG_FATE: "£KR_game_rule_flag_AFG_paternal_autocrat   Судьба Афганистана"
