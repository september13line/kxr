AFG_PATH: "£KR_game_rule_flag_AFG   Последствия Англо-афганской войны"
RULE_OPTION_AFG_PATH_RANDOM: "По умолчанию"
RULE_OPTION_AFG_PATH_RANDOM_DESC: "В зависимости от того, проиграет или выиграет Афганистан в войне с Индией, страна будет стремительно меняться."
RULE_OPTION_AFG_PATH_NADIR_KHAN: "£KR_game_rule_flag_AFG_nadir_khan   Дикая карта играет свою роль"
RULE_OPTION_AFG_PATH_NADIR_KHAN_DESC: "Воспользовавшись политическим кризисом после смерти эмира Хабибуллы, к власти в эмирате приходит §PМохаммад Надир Хан§!, известный как политическая "дикая карта"."
RULE_OPTION_AFG_PATH_ZAHIR_SHAH: "£KR_game_rule_flag_AFG_nadir_khan   Восхождение молодого эмира"
RULE_OPTION_AFG_PATH_ZAHIR_SHAH_DESC: "$RULE_OPTION_AFG_PATH_NADIR_KHAN$ Позже, после убийства Надир-шаха, Королевское правительство положило конец неудачному военному путчу и обеспечило стабильное продолжение правления Мусахибана в Афганистане. В соответствии с линией престолонаследия, на трон взошел сын бывшего короля, Мухаммад Захир Шах. Позже он установил конституционный режим §gНепартизанского блока§!"
RULE_OPTION_AFG_PATH_DAOUD_KHAN: "£KR_game_rule_flag_AFG_DAOUD   Дауд Хан берет мантию в свои руки"
RULE_OPTION_AFG_PATH_DAOUD_KHAN_DESC: "$RULE_OPTION_AFG_PATH_NADIR_KHAN$ Позже, после убийства Надир-шаха, власть захватывают молодые армейские офицеры во главе с мохаммадом Дауд-ханом."
RULE_OPTION_AFG_PATH_NASRULLAH: "£KR_game_rule_flag_AFG   Наследный принц восходит на престол"
RULE_OPTION_AFG_PATH_NASRULLAH_DESC: "После смерти Хабибуллы к власти приходит Насрулла, назначенный наследником афганского престола, и побеждает всех своих врагов.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_WIN$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_AMANULLAH_ULTRA: "£KR_game_rule_flag_AFG_AMANULLAH_FLAME   Красный эмир"
RULE_OPTION_AFG_PATH_AMANULLAH_ULTRA_DESC: "После смерти Хабибуллы к власти приходит Аманулла, второй сын эмира и амбициозный реформатор, одержавший победу над своими врагами. Позже проводится Дурбар, и Аманулла становится Красным эмиром и правит единолично.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_WIN$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY: "£KR_game_rule_flag_AFG_AMANULLAH   Исламский либерализм в Кабуле"
RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY_DESC: "После смерти Хабибуллы к власти приходит Аманулла, второй сын эмира и амбициозный реформатор, одержавший победу над своими противниками. Позже проводится Дурбар, в результате которого Аманулла устанавливает конституционный режим и проводит выборы, на которых побеждает одна из афганских партий.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_WIN$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_AMANULLAH: "£KR_game_rule_flag_AFG_AMANULLAH_TRAD   Новая афганская аристократия"
RULE_OPTION_AFG_PATH_AMANULLAH_DESC: "После смерти Хабибуллы к власти приходит Аманулла, второй сын эмира и амбициозный реформатор, одержавший победу над своими противниками. Позже проводится Дурбар, в результате которого Аманулла устанавливает реакционный традиционалистский режим.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_WIN$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_SOCIALIST: "£KR_game_rule_flag_AFG_radical_socialist   Бача Хан спасает нацию"
RULE_OPTION_AFG_PATH_SOCIALIST_DESC: "После того как Афганистан проигрывает Дели или решает не вступать с ними в войну, Хабибулла Калакани захватывает Кабул. Затем он побеждает Али Ахмад-хана и Мохаммада Надир-хана. Однако после убийства Шер-хана Нашира в Кабуле возникает неопределенное социалистическое движение сопротивления §NСлуги Божьи§! (Худай Хитматгар) и пуштунские племена, объединённые под предводительством Абдул Гаффар Хана, известного как Бача Хан, свергают тиранию Хабибуллы Калакани.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_RADSOC: "£KR_game_rule_flag_AFG_radical_socialist   Худай Хидматгаран Защит мандат"
RULE_OPTION_AFG_PATH_RADSOC_DESC: "После того как Афганистан проигрывает Дели или решает не вступать с ними в войну, Хабибулла Калакани захватывает Кабул. Затем он побеждает Али Ахмад-хана и Мохаммада Надир-хана. Однако после убийства Шер-хана Нашира в Кабуле возникает неопределенное социалистическое движение сопротивления §NСлуги Божьи§! (Худай Хитматгар) и пуштунские племена, объединённые под предводительством §NНабдул Гаффар Хана§!, известного как Бача Хан, свергают тиранию Хабибуллы Калакани.\nПозднее, во время Первого афганского конгресса, §NХудай Хидматгар§! остаётся у власти.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_SYNDICALIST: "£KR_game_rule_flag_AFG_syndicalist   Пархам несёт знамя"
RULE_OPTION_AFG_PATH_SYNDICALIST_DESC: "После того как Афганистан проигрывает Дели или решает не вступать с ними в войну, Хабибулла Калакани захватывает Кабул. Затем он побеждает Али Ахмад-хана и Мохаммада Надир-хана. Однако после убийства Шер-хана Нашира в Кабуле возникает неопределенное социалистическое движение сопротивления §NСлуги Божьи§! (Худай Хитматгар) и пуштунские племена, объединённые под предводительством Абдул Гаффар Хана, известного как Бача Хан, свергают тиранию Хабибуллы Калакани.\nПозже, во время Первого афганского конгресса, победу одержала исламско-социалистическая фракция §RПархам§!, возглавляемая Нисаром Мухаммадом Юсафзаем.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_TOTALIST: "£KR_game_rule_flag_AFG_totalist   Хальк ведёт за собой народ"
RULE_OPTION_AFG_PATH_TOTALIST_DESC: "После того как Афганистан проигрывает Дели или решает не вступать с ними в войну, Хабибулла Калакани захватывает Кабул. Затем он побеждает Али Ахмад-хана и Мохаммада Надир-хана. Однако после убийства Шер-хана Нашира в Кабуле возникает неопределенное социалистическое движение сопротивления §NСлуги Божьи§! (Худай Хитматгар) и пуштунские племена, объединённые под предводительством §NНабдул Гаффар Хана§!, известного как Бача Хан, свергают тиранию Хабибуллы Калакани.\nПозднее, во время Первого афганского конгресса, ленинская фракция §VХалк§!, возглавляемая Нур Мухаммадом Тараки, одерживает победу.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_AHMAD_KHAN: "£KR_game_rule_flag_AFG_JBD   Эмир Джелалабада спасает Афганистан"
RULE_OPTION_AFG_PATH_AHMAD_KHAN_DESC: "Избранный эмиром джиргой из местных вождей и влиятельных духовных лиц после захвата Кабула саккавистами, §gАли Ахмад Хан§! вновь берёт на себя управление эмиратом.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_INAYATULLAH_KHAN: "£KR_game_rule_flag_AFG_JBD   Неохотный эмир"
RULE_OPTION_AFG_PATH_INAYATULLAH_KHAN_DESC: "Избранный эмиром джиргой местных вождей и влиятельных духовных лиц после захвата Кабула саккавистами, Али Ахмад-хан вновь берёт на себя управление эмиратом. Позже, чтобы обеспечить легитимную передачу власти в соответствии с новой конституцией, Али Ахмад Хан созывает новую Лойя Джиргу для узаконивания правительства и избрания нового эмира. Лойя Джирга выбирает компромиссного кандидата - старшего сына бывшего эмира Хабибуллы, §gИнаятулла-хана§!\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_SHER_KHAN_NASHIR: "£KR_game_rule_flag_AFG_PASHTUN   Великий хан"
RULE_OPTION_AFG_PATH_SHER_KHAN_NASHIR_DESC: "Избранный эмиром джиргой из местных вождей и влиятельных духовных лиц после захвата Кабула саккавистами, Али Ахмад-хан вновь берёт на себя управление эмиратом. Позже, чтобы обеспечить легитимную передачу власти в соответствии с новой конституцией, Али Ахмад Хан созывает новую Лойя Джиргу, чтобы узаконить правительство и избрать нового эмира. Лойя Джирга выбирает кандидата-традиционалиста - влиятельного Лой Хана из племени Хароти, §gШер Хана Нашира§!.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_KALAKANI: "£KR_game_rule_flag_AFG_national_populist   Человек, который станет королем"
RULE_OPTION_AFG_PATH_KALAKANI_DESC: "§FХабибулла Калакани§!, известный многим как Бача Саку, исполнил своё предназначение на всю жизнь и во главе своей армии вошел в Кабул после неудавшегося путча Насруллы.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"
RULE_OPTION_AFG_PATH_DOMINION: "£KR_game_rule_flag_AFG_DEH   Англо над Афганистаном"
RULE_OPTION_AFG_PATH_DOMINION_DESC: "После неудачного путча Насруллы Антанта оккупировала Афганистан и установила там режим Доминиона во главе с Лео Амери.\n§RТребуется:§! §C$RULE_OPTION_AFG_ANGLO_AFGHAN_WAR_LOSE$§! в §Y$AFG_ANGLO_AFGHAN_WAR$§!"

AFG_ELECTIONS: "£KR_game_rule_flag_AFG   Демократия в сердце Азии"
RULE_OPTION_AFG_PATH_DEMOCRACY_DEFAULT: "По умолчанию"
RULE_OPTION_AFG_PATH_DEMOCRACY_DEFAULT_DESC: "Когда в Афганистане устанавливается конституционный режим, на выборах побеждает одна из афганских партий.\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY$§! или §C$RULE_OPTION_AFG_PATH_ZAHIR_SHAH$§! в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_PATH_DEMOCRACY_SOCDEM: "£KR_game_rule_flag_AFG   Хезб-е-Ватан"
RULE_OPTION_AFG_PATH_DEMOCRACY_SOCDEM_DESC: "Когда в Афганистане устанавливается конституционный режим, на выборах побеждает §MХезб-е Ватан§! (Отечественная партия).\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY$§! или §C$RULE_OPTION_AFG_PATH_ZAHIR_SHAH$§! в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_PATH_DEMOCRACY_SOCLIB: "£KR_game_rule_flag_AFG   Веш Дзалмиан"
RULE_OPTION_AFG_PATH_DEMOCRACY_SOCLIB_DESC: "Когда в Афганистане установится конституционный режим, на выборах победит §lВеш Дзалмиан§! (Пробужденная молодёжь).\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY$§! или §C$RULE_OPTION_AFG_PATH_ZAHIR_SHAH$§! в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_PATH_DEMOCRACY_MARLIB: "£KR_game_rule_flag_AFG   Афган-е Джаван"
RULE_OPTION_AFG_PATH_DEMOCRACY_MARLIB_DESC: "Когда в Афганистане установится конституционный режим, на выборах победит §mАфганан-е Джаван§! (Младоафганцы).\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY$§! или §C$RULE_OPTION_AFG_PATH_ZAHIR_SHAH$§! в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_PATH_DEMOCRACY_SOCCON: "£KR_game_rule_flag_AFG   Мусульманская лига"
RULE_OPTION_AFG_PATH_DEMOCRACY_SOCCON_DESC: "Когда в Афганистане устанавливается конституционный режим, на выборах побеждает §cМусульманская лига§!.\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_AMANULLAH_DEMOCRACY$§! или §C$RULE_OPTION_AFG_PATH_ZAHIR_SHAH$§! в §Y$AFG_PATH$§!"


AFG_FORPOL: "£KR_game_rule_flag_AFG   Афганистан на мировой арене"
RULE_OPTION_AFG_FORPOL_RANDOM: "По умолчанию"
RULE_OPTION_AFG_FORPOL_RANDOM_DESC: "После того как политическая ситуация в Афганистане окончательно стабилизировалась, он будет смотреть на запад со своими старыми союзниками в Берлине и Константинополе, создавать союзы со своими исламскими братьями на севере и встречаться с развивающимися странами на востоке."
RULE_OPTION_AFG_FORPOL_INT: "£KR_game_rule_flag_AFG_totalist  £KR_game_rule_flag_FRA   Третий Интернационал"
RULE_OPTION_AFG_FORPOL_INT_DESC: "После окончания Первого афганского конгресса Афганистан присоединяется к Третьему интернационалу.\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_TOTALIST$§! в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_FORPOL_SOV: "£KR_game_rule_flag_AFG_totalist  £KR_game_rule_flag_SOV   Четвёртый Интернационал"
RULE_OPTION_AFG_FORPOL_SOV_DESC: "После окончания Первого афганского конгресса Афганистан присоединяется к возглавляемому Россией Четвертому интернационалу.\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_TOTALIST$§! в §Y$AFG_PATH$§! и §CРеволюция в России§!"
RULE_OPTION_AFG_FORPOL_BHC: "£KR_game_rule_flag_AFG_totalist  £KR_game_rule_flag_BHC   Восточный социалистический Союз"
RULE_OPTION_AFG_FORPOL_BHC_DESC: "После окончания Первого афганского конгресса Афганистан присоединяется к Восточному социалистическому союзу\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_SYNDICALIST$§! или §C$RULE_OPTION_AFG_PATH_RADSOC$§! в §Y$AFG_PATH$§! и §C$BHC_FOREIGN_FACTION$§! в §Y$BHC_FOREIGN$§!"
RULE_OPTION_AFG_FORPOL_SKM: "£KR_game_rule_flag_AFG_totalist  £KR_game_rule_flag_SKM_radical_socialist   Соглашение о гармонии народов"
RULE_OPTION_AFG_FORPOL_SKM_DESC: "После окончания Первого афганского конгресса Афганистан присоединяется к Соглашению гармоничных народов\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_SYNDICALIST$§! или §C$RULE_OPTION_AFG_PATH_RADSOC$§! в §Y$AFG_PATH$§! и §C$SKM_PATH_RADSOC$§! в §Y$SKM_PATH$§!"
RULE_OPTION_AFG_FORPOL_CHI: "£KR_game_rule_flag_AFG_totalist  £KR_game_rule_flag_CHI   Левый Гоминьдан"
RULE_OPTION_AFG_FORPOL_CHI_DESC: "После окончания Первого афганского конгресса Афганистан присоединяется к китайской фракции Гоминьдан.\n§RТребуется:§! §C$RULE_OPTION_AFG_PATH_SYNDICALIST$§! в §Y$AFG_PATH$§! и §CLeft Kuomintang leading a faction§!"
RULE_OPTION_AFG_FORPOL_RUS: "£KR_game_rule_flag_AFG  £KR_game_rule_flag_RUS   Глаза в глаза с орлом"
RULE_OPTION_AFG_FORPOL_RUS_DESC: "Афганистан подписывает Аральские соглашения с Россией, а затем присоединяется к её альянсу.\n§RТребуется:§! Любая несоциалистическая §CРоссия§!"
RULE_OPTION_AFG_FORPOL_ENT: "£KR_game_rule_flag_AFG_nadir_khan  £KR_game_rule_flag_CAN   Антанта"
RULE_OPTION_AFG_FORPOL_ENT_DESC: "Афганистан присоединяется к Антанте.\n§RТребуется:§! $RULE_OPTION_AFG_PATH_NADIR_KHAN$ в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_FORPOL_GER: "£KR_game_rule_flag_AFG  £KR_game_rule_flag_GER   Рейхспакт"
RULE_OPTION_AFG_FORPOL_GER_DESC: "Афганистан сближается с Рейхспактом.\n§RТребуется:§! варианты §GАманулла-хана§! или §GНасрулла-хана§! в §Y$AFG_PATH$§!"
RULE_OPTION_AFG_FORPOL_JAP: "£KR_game_rule_flag_AFG  £KR_game_rule_flag_JAP   Сфера сопроцветания"
RULE_OPTION_AFG_FORPOL_JAP_DESC: "Афганистан сближается со Сферой сопроцветания.\n§RТребуется:§! варианты §GАманулла-хана§! или §GНасрулла-хана§! в §Y$AFG_PATH$§!"

GEO_POLITIC: "£KR_game_rule_flag_GEO   Последний оплот меньшевиков"
RULE_OPTION_GEO_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_GEO_POLITIC_RANDOM_DESC: "Меньшевики, правившие Грузией в течение многих лет, становятся все менее популярными после "черного Понедельника", и объявляются внеочередные выборы. Останется ли Грузия последним бастионом меньшевистской социал-демократии?"
RULE_OPTION_GEO_POLITIC_SSPRP: "£KR_game_rule_flag_GEO   Коалиция меньшевиков и ГС-ФРП"
RULE_OPTION_GEO_POLITIC_SSPRP_DESC: "Меньшевики побеждают на выборах и вступают в союз с социал-либеральной Социалистическо-федералистской революционной партией."
RULE_OPTION_GEO_POLITIC_SR: "£KR_game_rule_flag_GEO   Коалиция меньшевиков и эсеров"
RULE_OPTION_GEO_POLITIC_SR_DESC: "Меньшевики побеждают на выборах и вступают в союз с радикальной социалистической Грузинской социалистической революционной партией."
RULE_OPTION_GEO_POLITIC_CONSERVATIVE: "£KR_game_rule_flag_GEO   Консервативный статус-кво"
RULE_OPTION_GEO_POLITIC_CONSERVATIVE_DESC: "Социальная консервативная Национально-демократическая партия побеждает на выборах в коалиции с рыночной либеральной Национальной партией землевладельцев, но проигрывает референдум о монархии. Грузия остаётся консервативной республикой."
RULE_OPTION_GEO_POLITIC_MONARCHY: "£KR_game_rule_flag_GEO_kingdom   Успех монархистов"
RULE_OPTION_GEO_POLITIC_MONARCHY_DESC: "Социал-консервативная Национально-демократическая партия не только побеждает на выборах в коалиции с рыночно-либеральной Национальной партией землевладельцев, но и выигрывает референдум о монархии и сажает на трон законного монарха."
RULE_OPTION_GEO_POLITIC_ABSOLUTE: "£KR_game_rule_flag_GEO_paternal_autocrat   Самоуправство абсолютистов"
RULE_OPTION_GEO_POLITIC_ABSOLUTE_DESC: "Социал-консервативная Национальная демократическая партия не только побеждает на выборах в коалиции с рыночно-либеральной Национальной партией землевладельцев, но и выигрывает референдум о монархии и сажает на трон законного монарха. Король Георг использует вновь обретенную власть, чтобы укрепить свою власть абсолютного монарха."
RULE_OPTION_GEO_POLITIC_REVOLT: "£KR_game_rule_flag_GEO   Меньшевистское восстание"
RULE_OPTION_GEO_POLITIC_REVOLT_DESC: "Социально-консервативная Национальная демократическая партия не только побеждает на выборах в коалиции с рыночно-либеральной Национальной партией землевладельцев, но и выигрывает референдум о монархии и сажает законного монарха на трон. Королю Георгу не удается укрепить свою власть в качестве абсолютного монарха, что провоцирует восстание, в результате которого контроль над страной возвращается к меньшевикам."
RULE_OPTION_GEO_POLITIC_STALIN: "£KR_game_rule_flag_GEO_totalist   Джугашвили укрепляет свою власть"
RULE_OPTION_GEO_POLITIC_STALIN_DESC: "Председатель Высшего экономического совета Иосиф Джугашвили, долгое время считавшийся фактическим лидером страны, укрепляет свою власть и превращает Грузию в экспансионистскую тоталистическую диктатуру." 

