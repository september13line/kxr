RULE_OPTION_TUR_FORPOL_GER: "£KR_game_rule_flag_TUR_ottoman_empire  £KR_game_rule_flag_GER  Рейхспакт"
RULE_OPTION_TUR_FORPOL_GER_DESC: "Поскольку Великий Медведь нависает над Кавказом, Турция стремится возобновить свой старый союз с Германией.\n\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!"
RULE_OPTION_TUR_FORPOL_ENT: "£KR_game_rule_flag_TUR_ottoman_empire  £KR_game_rule_flag_CAN  Антанта"
RULE_OPTION_TUR_FORPOL_ENT_DESC: "Турция присоединяется к своим бывшим врагам, чтобы помочь очистить Средиземноморье от синдикализма.\n\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\nЛюбая §CПартия спасения Османской империи§! в §Y$TUR_PATH$§!"
RULE_OPTION_TUR_FORPOL_SER: "£KR_game_rule_flag_TUR_ottoman_empire  £KR_game_rule_flag_SER  Белградский пакт"
