HAW_FOREIGN_POLICY: "£KR_game_rule_flag_HAW   Внешняя политика Гавайев"
RULE_OPTION_HAW_FOREIGN_POLICY_RANDOM: "По умолчанию"
RULE_OPTION_HAW_FOREIGN_POLICY_RANDOM_DESC: "Мы - остров в центре Тихого океана, окруженный врагами. Если мы хотим выжить, нам придется вступить в союз с великой державой. Вопрос в том, с кем."
RULE_OPTION_HAW_FOREIGN_POLICY_NEUTRAL: "£KR_game_rule_flag_HAW   Нейтралитет"
RULE_OPTION_HAW_FOREIGN_POLICY_NEUTRAL_DESC: "Страна сохранит нейтралитет, надеясь, что будущие события обойдут их стороной."
RULE_OPTION_HAW_FOREIGN_POLICY_JAPAN: "£KR_game_rule_flag_HAW   £KR_game_rule_flag_JAP   Сфера совместного процветания"
