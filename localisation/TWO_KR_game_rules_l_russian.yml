RULE_OPTION_OTT_FOREIGN_POLICY_AUSTRIA_DESC: "Османы решают заключить союз с Австрией, который усилит их влияние на Балканах. \n§RТребуется:§!\n§CМустафа Кемаль§! в §Y£KR_game_rule_flag_OTT   Османская реформация§!"
RULE_OPTION_OTT_FOREIGN_POLICY_REICHSPAKT: "£KR_game_rule_flag_OTT   £KR_game_rule_flag_GER   Рейхспакт"
