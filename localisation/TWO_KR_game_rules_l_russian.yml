RULE_OPTION_NOR_START_ELECTION_RADSOC: "£KR_game_rule_flag_NOR_radical_socialist   Захват власти радикальными социалистами"
RULE_OPTION_NOR_START_ELECTION_RADSOC_DESC: "Рабочая партия побеждает на выборах в Стортинг 1936 года и начинает реализацию своей радикальной повестки. Попытка Видкуна Квислинга объединить правых и свергнуть революционное правительство проваливается, и начинается переход к социалистической Норвегии. Демократические радикальные социалисты остаются у власти."

