RULE_OPTION_MOR_FOREIGN_POLICY_RANDOM_DESC: "После падения Рейхспакта мы, наконец, добились полной независимости. Но сможем ли мы выжить в одиночку?"
RULE_OPTION_MOR_FOREIGN_POLICY_NEUTRAL: "£KR_game_rule_flag_MOR   Нейтралитет"
RULE_OPTION_MOR_FOREIGN_POLICY_NEUTRAL_DESC: "Страна будет сохранять нейтралитет, надеясь, что будущие события обойдут их стороной."
