RULE_OPTION_VIN_FUTURE_CAO_DAI_REPUBLIC_DESC: "После того как Императорский совет принял заметный религиозный уклон, судьбу Вьетнама решит вера Каодай, принявшая республиканский характер.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
