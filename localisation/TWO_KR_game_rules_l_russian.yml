RULE_OPTION_HAW_ELECTION_SOCLIB_DESC: "На выборах побеждает социал-либеральная Национально-либеральная партия. \n§RТребуется:§!\n§CKingdom Established§! или §CRepublic Declared§! в §Y£KR_game_rule_flag_HAW   Emergency On The Islands§!"
RULE_OPTION_HAW_ELECTION_MARLIB: "£KR_game_rule_flag_HAW   £KR_game_rule_flag_HAW_kingdom   Республиканская партия"
RULE_OPTION_HAW_ELECTION_MARLIB_DESC: "На выборах побеждает рыночная либеральная Республиканская партия. \n§RТребуется:§!\n§CKingdom Established§! или §CRepublic Declared§! в §Y£KR_game_rule_flag_HAW   Emergency On The Islands§!"
