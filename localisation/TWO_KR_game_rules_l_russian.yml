RULE_OPTION_VIN_FUTURE_CAO_DAI_MONARCHY_DESC: "После того как Императорский совет принял заметный религиозный уклон, судьбу Вьетнама решит вера Каодай, принявшая монархический характер.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
