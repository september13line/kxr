RULE_OPTION_HAW_ELECTION_SOCDEM_DESC: "На выборах побеждает социал-демократическая Прогрессивная партия. \n§RТребуется:§!\n§CKingdom Established§! или §CSocialist Revolution§! в §Y£KR_game_rule_flag_HAW   Emergency On The Islands§!"
