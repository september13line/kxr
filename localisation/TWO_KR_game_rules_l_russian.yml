RULE_OPTION_WLL_POLITICAL_PATH_DEGRELLE: "£KR_game_rule_flag_WLL_national_populist   Рексисты приходят к власти"
RULE_OPTION_WLL_POLITICAL_PATH_DEGRELLE_DESC: "После отказа Германии поддержать идею возвращения фламандских земель националистические движения начали стремительно набирать популярность среди народа. Национал-популистские рексисты с небольшим перевесом побеждают на выборах."
RULE_OPTION_WLL_POLITICAL_PATH_DEGRELLE_COUP: "£KR_game_rule_flag_WLL_national_populist   Переворот рексистов"
RULE_OPTION_WLL_POLITICAL_PATH_DEGRELLE_COUP_DESC: "После отказа Германии поддержать идею возвращения фламандских земель националистические движения начали стремительно набирать популярность среди народа. Национал-популистские рексисты свергают правительство."
RULE_OPTION_WLL_POLITICAL_PATH_FRANCH_GUARANTEE: "£KR_game_rule_flag_WLL  £KR_game_rule_flag_FRA   Франция гарантирует Валлонии"
RULE_OPTION_WLL_POLITICAL_PATH_FRANCH_GUARANTEE_DESC: "Во время революции валлонские повстанцы запрашивают поддержку у Французской коммуны и с её помощью провозглашают независимость Валлонии. Из-за продолжающейся французской поддержки валлонов Германия отступает и выводит свои войска из Валлонии.\n§RТребуется:§!\n§CРаспад§! в §Y£KR_game_rule_flag_BEL   Последствия 17 февраля§!\n§RВзаимоисключающее условие:§!\n§CФламандцы обратились за помощью к Нидерландам§!"
RULE_OPTION_WLL_POLITICAL_PATH_FRENCH_ALONE: "£KR_game_rule_flag_WLL   Франция бросает Валлонию"
RULE_OPTION_WLL_POLITICAL_PATH_FRENCH_ALONE_DESC: "Во время революции валлонские повстанцы запрашивают поддержку у Французской коммуны и с её помощью провозглашают независимость Валлонии. Несмотря на сильную заинтересованность в обеспечении независимости Валлонии, Французская коммуна в итоге отступает, чтобы избежать войны с Германией.\n§RТребуется:§!\n§CРаспад§! в §Y£KR_game_rule_flag_BEL   Последствия 17 февраля§!\n§RВзаимоисключающее условие:§!\n§CФламандцы обратились за помощью к Нидерландам§!"
RULE_OPTION_WLL_POLITICAL_PATH_FRENCH_INTERNATIONALE: "£KR_game_rule_flag_WLL  £KR_game_rule_flag_FRA  £KR_game_rule_flag_GER   Мировая война из-за Валлонии"
RULE_OPTION_WLL_POLITICAL_PATH_FRENCH_INTERNATIONALE_DESC: "Во время революции валлонские повстанцы запрашивают поддержку у Французской коммуны и с её помощью провозглашают независимость Валлонии.  Поскольку ни одна из сторон не желает отступать, между Германией и Коммуной вспыхивает война - Второй Вельткриг.\n§RТребуется:§!\n§CРаспад§! в §Y£KR_game_rule_flag_BEL   Последствия 17 февраля§!\n§RВзаимоисключающее условие:§!\n§CФламандцы обратились за помощью к Нидерландам§!"

