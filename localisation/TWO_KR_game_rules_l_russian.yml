RULE_OPTION_VIN_FUTURE_ELECTION_SOCLIB_REPUBLIC_DESC: "Поскольку Вьетнам принимает истинный конституционализм, новую главу его истории напишет Партия народного правления Дайвьета. Одержав убедительную победу на выборах, партия устанавливает подлинную Республику Вьетнам.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
