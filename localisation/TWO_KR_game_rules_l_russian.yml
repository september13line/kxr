RULE_OPTION_TUR_PATH_RANDOM_DESC: "Османская империя распущена, но Турция остаётся. Что ждёт её в будущем?"
RULE_OPTION_TUR_PATH_SOCLIB: "£KR_game_rule_flag_TUR_ottoman_empire  ОСП - Прогрессивная коалиция"
RULE_OPTION_TUR_PATH_SOCLIB_DESC: "Бывшие противники Кемаля формируют Партию спасения Османской империи, которая стремится любой ценой сохранить султанат. На последующих выборах побеждает §lПрогрессивная коалиция§!.\n\n§RТребуется:§!\n§CКаирская ось одерживает победу над османами§!\n§RНе§! §C$RULE_OPTION_OTT_PATHS_FEVZI$§! или любой §CФронт Endeavour§! в §Y$OTT_PATHS$§!"
