RULE_OPTION_NFA_CONTINENTAL_PATH_RANDOM: "По умолчанию"
RULE_OPTION_NFA_CONTINENTAL_PATH_RANDOM_DESC: "Республике удалось вернуться на родину, но никто не знает, что будет с ней дальше... \n§CПримечание: Все для Союза Сакре§!"
RULE_OPTION_NFA_CONTINENTAL_PATH_DEMOCRACY_SOCLIB: "£KR_game_rule_flag_NFA   Демократия - Радикалы"
RULE_OPTION_NFA_CONTINENTAL_PATH_DEMOCRACY_SOCLIB_DESC: "Социал-либералы "Радикалы" побеждают на первых выборах."
RULE_OPTION_NFA_CONTINENTAL_PATH_DEMOCRACY_SOCCON: "£KR_game_rule_flag_NFA   Демократия - Национальный блок"
RULE_OPTION_NFA_CONTINENTAL_PATH_DEMOCRACY_SOCCON_DESC: "Социал-консервативный Блок Национальный побеждает на первых выборах."
RULE_OPTION_NFA_CONTINENTAL_PATH_DEMOCRACY_MARLIB: "£KR_game_rule_flag_NFA   Демократия - Концентрация"
