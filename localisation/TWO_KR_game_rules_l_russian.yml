RULE_OPTION_MEX_YUCATAN_REVOLT_RANDOM_DESC: "На протяжении второй половины XIX века Юкатан был вовлечен в затяжную кастовую войну, но после мексиканской революции ситуацию удалось стабилизировать с помощью Юкатанской социалистической партии. После военного переворота встает вопрос о будущем региона."
