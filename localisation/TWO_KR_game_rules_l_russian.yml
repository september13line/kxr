RULE_OPTION_PRI_FUTURE_STAY_IN_UNION_DESC: "Пуэрто-Рико остаётся в составе Соединённых Штатов с прежним статусом, к негодованию националистов.\n§RТребуется:§!\n§CНе создавать Новую Англию§! в правиле §Y£KR_game_rule_flag_CAN   Новая Англия§!"
