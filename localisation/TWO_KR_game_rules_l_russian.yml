RULE_OPTION_VIN_FUTURE_BAO_DAI_PRUSCON_DESC: "Поскольку Император укрепляет свою позицию правителя Вьетнама, прусское конституционалистское правление Бао Дая будет поддерживаться Роялистской партией.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
