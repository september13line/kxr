RULE_OPTION_MAF_POLITIC_RANDOM_DESC: "Герман фон Геринг обладает почти неограниченной властью в Миттельафрике. Однако напряжённость внутри колонии растёт быстрее, чем может себе представить Штатгальтер. Кто будет править в крупнейшей германской колонии после того, как пыль уляжется, и останется ли колония или полностью распадётся?"
RULE_OPTION_MAF_POLITIC_NKR: "£KR_game_rule_flag_MAF  NKG остаётся"
RULE_OPTION_MAF_POLITIC_NKR_DESC: "Геринг отстранён после коррупционного скандала. Германия решает дать Патерналистско-автократической NKG ещё один шанс."
RULE_OPTION_MAF_POLITIC_DKG: "£KR_game_rule_flag_MAF  DKG у власти"
RULE_OPTION_MAF_POLITIC_DKG_DESC: "Геринг отстранён после коррупционного скандала. Германия выбирает Авторитарно-демократическую «старую гвардию» DKG для управления колонией."
RULE_OPTION_MAF_POLITIC_REFORM: "£KR_game_rule_flag_MAF  Reformgruppe у власти"
RULE_OPTION_MAF_POLITIC_REFORM_DESC: "Геринг отстранён после коррупционного скандала. Опасаясь, что Миттельафрика может попасть под власть очередного тирана, Германия выбирает Социал-консервативную Reformgruppe для реформирования колонии."
RULE_OPTION_MAF_POLITIC_SOVEREIGN: "£KR_game_rule_flag_MAF  Суверенное государство"
RULE_OPTION_MAF_POLITIC_SOVEREIGN_DESC: "Геринг отказывается уходить даже после выдачи ордера на арест. Столкнувшись с возможным распадом колонии, Германия позволяет ему остаться, но никто не знает об амбициях Геринга... пока."
RULE_OPTION_MAF_POLITIC_COLLAPSE: "     Распад"
RULE_OPTION_MAF_POLITIC_COLLAPSE_DESC: "Геринг отказывается уходить даже после выдачи ордера на арест. Столкнувшись с возможной тиранией в колонии, немцы арестовывают его, но Миттельафрика затихает на месяц, только чтобы взорваться десятками независимых государств, постоянно находящихся в состоянии войны. Миттельафрики больше нет."

