RULE_OPTION_SYR_POLITIC_SOCLIB_DESC: "Социал-либеральное крыло Народной партии побеждает на первых выборах."
RULE_OPTION_SYR_POLITIC_MARLIB: "£KR_game_rule_flag_SYR   HS (алеппское крыло)"
RULE_OPTION_SYR_POLITIC_MARLIB_DESC: "Рыночно-либеральное крыло Народной партии побеждает на первых выборах."
RULE_OPTION_SYR_POLITIC_SOCCON: "£KR_game_rule_flag_SYR   KW"
RULE_OPTION_SYR_POLITIC_SOCCON_DESC: "Социал-консервативная KW побеждает на первых выборах."
RULE_OPTION_SYR_POLITIC_PATAUT: "£KR_game_rule_flag_SYR   Военное правительство"
RULE_OPTION_SYR_POLITIC_PATAUT_DESC: "Социал-консервативная KW побеждает на первых выборах. Впоследствии военные свергают правительство."
RULE_OPTION_SYR_POLITIC_NATPOP: "£KR_game_rule_flag_SYR_national_populist   SSNP"
RULE_OPTION_SYR_POLITIC_NATPOP_DESC: "Социал-консервативная KW побеждает на первых выборах. Впоследствии военные свергают правительство и передают власть национал-популистской SSNP."

LEB_POLITIC: "£KR_game_rule_flag_LEB   Будущее Ливана"
RULE_OPTION_LEB_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_LEB_POLITIC_RANDOM_DESC: "Ливан смог получить независимость от Сирии, но ситуация в стране по-прежнему нестабильна."
RULE_OPTION_LEB_POLITIC_AUTDEM: "£KR_game_rule_flag_LEB   Шехаб сохраняет власть"
RULE_OPTION_LEB_POLITIC_AUTDEM_DESC: "Шехаб остаётся у власти и продолжает свой авторитарный демократический режим, формируя единую ливанскую нацию."
RULE_OPTION_LEB_POLITIC_MARLIB: "£KR_game_rule_flag_LEB_republic   Рыночные либералы"
RULE_OPTION_LEB_POLITIC_MARLIB_DESC: "Шехаб покидает власть под давлением Временного парламента. На первых выборах побеждает рыночная либеральная партия, которая реформирует страну в европейское государство."
RULE_OPTION_LEB_POLITIC_SOCLIB: "£KR_game_rule_flag_LEB_republic   Социал-либералы"
RULE_OPTION_LEB_POLITIC_SOCLIB_DESC: "Шехаб покидает власть под давлением Временного парламента. На первых выборах побеждает социал-либералы, который будет добиваться светскости и введения женского избирательного права."
RULE_OPTION_LEB_POLITIC_SOCCON: "£KR_game_rule_flag_LEB_republic   Социал-консерваторы"
RULE_OPTION_LEB_POLITIC_SOCCON_DESC: "Шехаб покидает власть под давлением Временного парламента. На первых выборах побеждает социально-консервативная партия, которая будет стремиться к примирению с арабскими соседями."
RULE_OPTION_LEB_POLITIC_NATPOP: "£KR_game_rule_flag_LEB_national_populist   Движение Марада"
RULE_OPTION_LEB_POLITIC_NATPOP_DESC: "Шехаб покидает власть под давлением Временного парламента. Вскоре Движение Марада совершает государственный переворот и начинает проводить политику "Бог, Отечество, Семья"."

ASY_REVOLT: "£KR_game_rule_flag_ASY   Ассирийское восстание"
RULE_OPTION_ASY_REVOLT_RANDOM: "По умолчанию"
RULE_OPTION_ASY_REVOLT_RANDOM_DESC: "Ассирийцы были изгнаны в регион Басры, и их недовольство начинает расти. Приведет ли это к восстанию или нет, покажет время."
RULE_OPTION_ASY_REVOLT_NO_REVOLT: "£KR_game_rule_flag_OTT   Без восстания"
RULE_OPTION_ASY_REVOLT_NO_REVOLT_DESC: "Бунтарства удается избежать."
RULE_OPTION_ASY_REVOLT_REVOLT: "£KR_game_rule_flag_OTT   £KR_game_rule_flag_ASY   Восстание"
