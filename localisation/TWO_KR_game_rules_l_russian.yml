RULE_OPTION_VIN_FUTURE_COCONUT_VICTORY_DESC: "Императорский совет подвёл Вьетнам, и теперь спасти нацию должен Кокосовый монах.\n§RТребование:§!\n§CВьетнам и революция§! в £KR_game_rule_flag_GEA   Правление Мюке§!"
