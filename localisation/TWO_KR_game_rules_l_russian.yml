NMB_CHAOS_IN_SUDWEST: "£KR_game_rule_flag_NMB_GER   Хаос в Зюдвестафрике"
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_RANDOM: "По умолчанию"
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_RANDOM_DESC: "После распада Миттельафрики небольшое количество немецких войск обосновалось в южной Намибии, пытаясь выиграть войну с местными жителями. Но соседняя Южная Африка смотрит на эти земли как на лакомый кусочек..."
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_SOUTH_AFRICA_OFFER_ACCEPT: "£KR_game_rule_flag_NMB_GER   £KR_game_rule_flag_SAF   Часть Южной Африки"
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_SOUTH_AFRICA_OFFER_ACCEPT_DESC: "В этой ситуации немецкое командование решило принять предложение правительства ЮАР и присоединиться к их стране."
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_SOUTH_AFRICA_WAR: "£KR_game_rule_flag_NMB_GER   £KR_game_rule_flag_SAF   Война с Южной Африкой"
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_SOUTH_AFRICA_WAR_DESC: "Немецкое командование отвергло предложение южноафриканского правительства. В ответ оно объявило войну."
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_ALIVE: "£KR_game_rule_flag_NMB_GER   Остаться в стороне"
RULE_OPTION_NMB_CHAOS_IN_SUDWEST_ALIVE_DESC: "Южная Африка не стала посягать на Намибию."

ZIM_POLITIC: "£KR_game_rule_flag_ZIM   Южная Родезия"
RULE_OPTION_ZIM_POLITIC_RANDOM: "По умолчанию"
RULE_OPTION_ZIM_POLITIC_RANDOM_DESC: "После отделения Южная Родезия стала отдельным независимым государством. Кто победит на следующих выборах?"
RULE_OPTION_ZIM_POLITIC_REFORM_PARTY_SOCLIB: "£KR_game_rule_flag_ZIM   Партия реформ"
RULE_OPTION_ZIM_POLITIC_REFORM_PARTY_SOCLIB_DESC: "На выборах победит социал-либеральная Партия реформ."
RULE_OPTION_ZIM_POLITIC_REFORM_PARTY_LABOUR_REFORM: "£KR_game_rule_flag_ZIM   Лейбористско-реформистская коалиция"
RULE_OPTION_ZIM_POLITIC_REFORM_PARTY_LABOUR_REFORM_DESC: "Социал-либеральная Партия реформ побеждает на выборах. После роспуска парламента, вызванного назначением правого правительства, проводятся досрочные выборы, на которых побеждает коалиция лейбористов и реформистов."
RULE_OPTION_ZIM_POLITIC_REFORM_PARTY_AUTDEM: "£KR_game_rule_flag_ZIM   Хаггинс"
