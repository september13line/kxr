RULE_OPTION_PAN_CANAL_CRISIS_PCZ_CAN: "£KR_game_rule_flag_PAN_ENT_cosmetic   Зона Панамского канала - Антанта"
RULE_OPTION_PAN_CANAL_CRISIS_PCZ_CAN_DESC: "Панама сначала захватывает канал, но американский гарнизон Панамского канала, воспользовавшись нестабильностью, идет на столицу и переворачивает правительство. Гарнизон решает отказаться от Америки и присоединиться к Канаде и Антанте."


