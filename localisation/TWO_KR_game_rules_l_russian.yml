RULE_OPTION_DEH_AFG_FATE_LAND: "£KR_game_rule_flag_AFG_paternal_autocrat   Захваченная земля"
RULE_OPTION_DEH_AFG_FATE_LAND_DESC: "После поражения Афганистана Доминион Индии решает захватить только его ядра. \n§RТребуется:§!\n§MДоминион Индия выходит победителем из 5-й англо-афганской войны§!"
RULE_OPTION_DEH_AFG_FATE_AMANULLAH: "£KR_game_rule_flag_AFG_nadir   Король Амманула Марионетка "
