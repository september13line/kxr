### Focuses ###
ZAM_huttigontourofduty: "Хюттиг в командировке (на службе)!"
ZAM_huttigontourofduty_desc: "Восточноафриканец Ганс Хюттиг правит Северной Родезией, несмотря на предполагаемую независимость региона. Пока судьба региона в его руках, и по мере развития ситуации на севере и юге все взгляды обращены на Хюттига."
ZAM_thehiltonyoungthatneverwas: "Тот самый Хилтон Янг, которого не было"
ZAM_thehiltonyoungthatneverwas_desc: "Мечты об объединении земель Восточной Африки не новы для региона, как и для гауптмана Хюттига. Подобно тому, как комиссия Хилтона Янга пыталась установить более жесткий контроль Британии над Африкой, гауптман Ганс Хюттиг попытается подчинить свою зону контроля большему контролю со стороны Дар-эс-Салама."
ZAM_discussafederalcouncil: "Обсудить Федеральный совет"
ZAM_discussafederalcouncil_desc: "Возможно, мы можем позволить сформировать Федеральный совет, чтобы снять часть бремени с гарнизона Шуцтруппе в регионе. Этот Федеральный совет, конечно, будет бессилен по сравнению с гауптманом Хюттигом."
ZAM_discussunionties: "Обсудить связи с профсоюзами"
ZAM_discussunionties_desc: "Возможно, мы могли бы позволить местным профсоюзам снова действовать в Северной Родезии, это освободило бы некоторое правительственное пространство и позволило бы большей местной автономии от Шуцтруппе."
ZAM_tableintegration: "Внести интеграцию в повестку"
ZAM_tableintegration_desc: "Наше дело не указывать, а подчиняться. Дар-эс-Салам - единственный город, откуда мы получаем приказы, и Ганс Хюттиг не из тех, кто хочет это менять. Северная Родезия будет верна гауптману, кайзеру и Шуцтруппе."
ZAM_tableamalgamation: "Внести автономию в повестку"
ZAM_tableamalgamation_desc: "Возможно, пришло время отступить, местные жители вполне способны управлять своими делами вне досягаемости Дар-эс-Салама. В конце концов, контроль Хюттига и Шуцтруппе - лишь временная мера, не так ли?"
ZAM_troubleattheborder: "Неприятности на границе"
ZAM_troubleattheborder_desc: "Кажется, единственной константой остались бесконечные пограничные стычки с Южной Африкой и сторонниками Бэринга. Мы должны исправить эту ситуацию в ближайшее время, иначе все усилия гауптмана Хюттига по умиротворению региона рухнут."
ZAM_cycleinbritishaskaris: "Ввести в оборот британских аскари"
ZAM_cycleinbritishaskaris_desc: "Хотя их общество нам не по душе, британские аскари могут помочь Шуцтруппе в их миссии по умиротворению региона. Включение их в патрули вместе с Шуцтруппе поможет нам получить столь необходимую рабочую силу."
ZAM_tableliftingmillitaryrestrictions: "Внести снятие военных ограничений в повестку"
ZAM_tableliftingmillitaryrestrictions_desc: "Если последние месяцы что-то и доказали, так это то, что ограничения Шуцтруппе в отношении армии наносят ущерб безопасности региона. Возможно, пришло время внести снятие этих ограничений в повестку."
ZAM_uneasycooperation: "Неустойчивое сотрудничество"
ZAM_uneasycooperation_desc: "Хотя вся эта ситуация, возможно, не совсем идеальна с точки зрения того, что планировали англосы в регионе, они понимают, что это лучше, чем ничего. Их сотрудничество, хоть и не в полной мере, позволило Шуцтруппе управлять регионом более мягкой рукой."
ZAM_thenorthernraillink: "Северная железнодорожная связь"
ZAM_thenorthernraillink_desc: "Поезда управляют современным миром, и мы не можем ожидать сильного правительства без надежных железнодорожных связей. Расширение местных железных дорог и инфраструктуры для лучшего соединения Северной Родезии жизненно важно."
ZAM_weareinthistogether: "Мы в одной лодке"
ZAM_weareinthistogether_desc: "Остатки старых британских сил в Африке и действующая немецкая администрация могут иметь совершенно разные цели, однако у них все еще есть общие интересы. Хотя сотрудничество может показаться сложным, оно отвечает интересам как немцев, так и британцев."
ZAM_tablecollaboration: "Внести сотрудничество в повестку"
ZAM_tablecollaboration_desc: "Статус-кво устраивает нас больше всего, так зачем что-то менять? Британцы довольны ситуацией, как и немцы. На данный момент на повестке дня только расширение сотрудничества с британцами."
ZAM_tableselfdetermination: "Внести самоопределение в повестку"
ZAM_tableselfdetermination_desc: "Возможно, пришло время отпустить ситуацию, гарнизон Шуцтруппе в регионе и так был лишь временной мерой. Наше обещание Северной Родезии будет выполнено, и на повестку дня выходит большая независимость от Дар-эс-Салама."
ZAM_thenewhauptmann: "Новый гауптман"
ZAM_thenewhauptmann_desc: "Командование Хюттига всегда было временным, и с учетом того, что наша страна находится на грани краха, сейчас пришло время серьезной переоценки нашего правительства. Настал час расплаты для Хюттига, с разрешения Дар-эс-Салама будет назначен новый гауптман."
ZAM_fortifyblantyre: "Укрепить Блантайр"
ZAM_fortifyblantyre_desc: "Хотя главным врагом Хюттига был юг, португальцы все еще рассматривают регион как потенциальное расширение своих земель, которые они называют «Розовой картой». Мы - связующее звено для них, и мы должны подготовиться к защите от них."
ZAM_bolstermwinlunga: "Укрепить Мвинилунгу"
ZAM_bolstermwinlunga_desc: "Шуцтруппе все еще непрофессиональна и подвержена поломкам оборудования. Если мы хотим выжить, мы должны собрать инструменты для создания оружия, чтобы вести наши величайшие битвы. Таким образом, наши арсеналы должны быть расширены, а вооружение - усилено."
ZAM_punishmentcamps: "Исправительные лагеря"
ZAM_punishmentcamps_desc: "Цель Хюттига - не просто управлять Северной Родезией, но навести порядок в беззаконных пустошах. К сожалению, некоторые люди не поняли этого послания. Мы преподадим им урок. Настало время наказывать предателей и преступников."
ZAM_elevenyearsisnotforever: "Одиннадцать лет - не вечность"
ZAM_elevenyearsisnotforever_desc: "«Всего лишь временная администрация, пока в регионе не будет восстановлен порядок», - сказали они. Это было давно. Шуцтруппе давно задержались, британцы беспокойны как никогда, и похоже, что простые чрезвычайные меры стали почти постоянными."

ZAM_huttig_here_to_stay: "Хюттиг здесь, чтобы остаться"
ZAM_huttig_here_to_stay_desc: "Хотя изначально правление Хюттига предполагалось как чисто временная мера, ситуация изменилась до такой степени, что Хюттиг необходим для поддержания стабильности в регионе. Власть Хюттига была расширена, а его командировка продлена на неопределенный срок."
ZAM_end_the_anglos: "Уничтожить англосаксонскую угрозу"
ZAM_end_the_anglos_desc: "Проклятые британцы долгое время были единственным бельмом на глазу Отечества. Пришло время устранить их раз и навсегда, Северная Родезия - немецкая земля сейчас и навсегда!"
ZAM_support_from_ostafrika: "Поддержка из Восточной Африки"
ZAM_support_from_ostafrika_desc: "Родина гауптмана Хюттига - не Северная Родезия, а Восточная Африка, которая в настоящее время является центром власти Германии в Африке. Поддержка восточноафриканской элиты жизненно важна для выживания Хюттига в качестве гауптмана. Возможно, визит домой мог бы заручиться некоторой поддержкой."
ZAM_loyal_to_NKR: "Клятва NKG"
ZAM_loyal_to_NKR_desc: "Реформаторы в Дар-эс-Саламе полны решимости избавиться от гауптмана и провести реформы в регионе, которым руководит Хюттиг. К счастью, Neue Kolonialgruppe полностью поддерживает Хюттига против тех, кто хочет, чтобы Африка оставалась во тьме."
ZAM_expand_punishment_camps: "Расширить «Исправительные лагеря»"
ZAM_expand_punishment_camps_desc: "Хотя «Исправительные лагеря» поначалу использовались только для самых жестоких бандитов и преступников, они также могут служить цели «реабилитации» тех, кто проявляет нелояльность гауптману Хюттигу."
ZAM_enforce_racial_laws: "Ввести расовые законы"
ZAM_enforce_racial_laws_desc: "Теперь, когда Хюттиг установил контроль над Северной Родезией, он наконец может начать вводить законы, более благоприятные для белого меньшинства. При Хюттиге сегрегация в регионе станет повсеместной."
ZAM_solidify_our_position: "Северная Родезия умиротворена"
ZAM_solidify_our_position_desc: "Работа, которую Хюттиг намеревался выполнить, когда был назначен губернатором Северной Родезии, наконец завершена. Несмотря на все препятствия, ему удалось удержать власть и умиротворить обширные просторы Замбии, несмотря на всех, кто стоял на его пути. Да здравствует кайзер, слава Хюттигу!"

ZAM_junger_gang: "Гауптман Юнгер"
ZAM_junger_gang_desc: "Стремление Хюттига к контролю едва не вогнало немецкую администрацию в грязь; чтобы Северная Родезия выжила и процветала в будущем, необходимы великие реформы. Только один человек в администрации считается подходящим для проведения этих реформ - Эрнст Юнгер."
ZAM_remove_military_from_politics: "Обуздать Шуцтруппе"
ZAM_remove_military_from_politics_desc: "Бесконтрольная власть Шуцтруппе привела к тому, что правительство региона существует в нерабочем состоянии. После ухода Хюттига Юнгер взял на себя задачу обуздать Шуцтруппе, отстранив их от всех политических и правительственных дел."
ZAM_collaboration_from_the_south: "Обеспечить сотрудничество англосов"
ZAM_collaboration_from_the_south_desc: "Британцы подозрительно относились к немцам с тех пор, как те оккупировали регион после революции, однако оккупация Хюттига разрушила любое доверие, которое британцы питали к немцам, «обеспечивающим безопасность» региона. Чтобы администрация Юнгера выжила, он должен восстановить это доверие."
ZAM_local_level_democracy: "Восстановить местную демократию"
ZAM_local_level_democracy_desc: "Хотя Замбия, возможно, еще не готова к полной демократии, восстановление демократических выборов на местном уровне, несомненно, укрепит доверие людей к администрации Юнгера. Возможно, путь к полной демократии может быть открыт вскоре после этого."
ZAM_intellectual_expansion: "Расширение интеллекта"
ZAM_intellectual_expansion_desc: "Юнгер не новичок в интеллектуальных и высших кругах, которые были так же напуганы безудержным авторитаризмом Хюттига, как и он. После того как Юнгер успешно изгнал одиозного Хюттига из администрации Замбии, он может начать расширять библиотеки, архивы и школы вместо военных казарм."
ZAM_support_for_reforms: "Поддержка реформ"
ZAM_support_for_reforms_desc: "Чтобы немецкое правление выжило в Африке, необходимы масштабные реформы на всех уровнях, включая Замбию. Коррумпированная, непотическая и неэффективная администрация в регионе должна быть полностью перестроена, и для этого нам нужна поддержка армии, администрации и народа."
ZAM_promise_to_the_people: "Обещание народу"
ZAM_promise_to_the_people_desc: "Демократия на национальном уровне была уничтожена, когда Хюттиг и Шуцтруппе пришли к власти в регионе. Теперь Юнгер пообещал, что в скором времени национальная демократия вернется в Замбию. Возможно, не сегодня, возможно, не завтра, но скоро - таково обещание Юнгера."

ZAM_defend_our_fronteir: "Рубеж"
ZAM_defend_our_fronteir_desc: "Земли Северной Родезии в значительной степени не защищены от могущественных врагов как на востоке, так и на юге. Африканеры, Португалия и вечно затаившиеся англосы готовы нанести удар, и мы должны быть готовы."
ZAM_against_portugal: "Защита от португальцев"
ZAM_against_portugal_desc: "Португальцы владеют Мозамбиком и Анголой и стремятся распространить свое правление на Катангу и Замбию в рамках своего плана «Розовой карты». Пока в регионе сохраняется немецкая администрация, мы должны сделать так, чтобы мечты португальцев о Розовой карте остались всего лишь мечтами."
ZAM_against_south_africa: "Противостоять Южной Африке"
ZAM_against_south_africa_desc: "Южная Африка и Родезия годами готовились захватить Замбию и Ньясаленд. Годами они готовились напасть на нас и помогали Бэрингу и его UEL в их цели навсегда изгнать гуннские сапоги из Замбии. Их необходимо остановить."
ZAM_for_the_fatherland: "За Отечество!"
ZAM_for_the_fatherland_desc: "Кайзер призывает нас к оружию! И мы будем здесь, чтобы внять зову Рейха. Мы служим не королю в Лондоне, а императору в Берлине и будем продолжать делать это до тех пор, пока последний верный сын Отечества не умрет, защищая наши земли."
ZAM_secure_the_border: "Укрепить слепую зону Средней Африки"
ZAM_secure_the_border_desc: "Кровью, потом и слезами мы защитили Северную Родезию от нападок англосов и португальцев. Мы можем вздохнуть с облегчением, зная, что слепое пятно немецкого правления в Африке находится в безопасности."

ZAM_barings_coup: "Переворот Бэринга"
ZAM_barings_coup_desc: "Кровью, потом и слезами Лига единой империи Эвелина Бэринга вновь захватила контроль над Северной Родезией и Ньясалендом. С уходом немцев «Юнион Джек» гордо развевается над Лусакой."
ZAM_contact_the_south: "Контакты на юге"
ZAM_contact_the_south_desc: "Южная Африка и Родезия давно поддерживали нашу борьбу против гуннских угнетателей, и теперь, когда мы изгнали иностранного захватчика, мы можем расширить наши связи с нашими союзниками, которые помогли англосам в их самый темный час."
ZAM_bolster_british_control: "Укрепить британский контроль"
ZAM_bolster_british_control_desc: "Хотя UEL может находиться у власти, британский контроль над регионом далеко не прочен, и угроза повторного изгнания британцев из этих земель существует. Мы должны укрепить британскую власть до такой степени, чтобы революция стала невозможной."
ZAM_expel_the_germans: "Изгнать Шуцтруппе"
ZAM_expel_the_germans_desc: "Немецкое влияние все еще таится в тени: остатки правления гуннского автократа все еще присутствуют в виде Шуцтруппе - силы без цели, которая сеет хаос среди англосов Северной Родезии. Их необходимо остановить."
ZAM_barings_hold_secure: "Обеспечить безопасность британской власти"
ZAM_barings_hold_secure_desc: "Власть Бэринга над Северной Родезией и Ньясалендом теперь прочна. Англосы прочно контролируют все уровни правительства, а немцы изгнаны навсегда. Все истинные сыны Империи могут спать спокойно, зная, что угроза со стороны немцев утихла."
ZAM_supress_local_revolts: "Подавить местные восстания"
ZAM_supress_local_revolts_desc: "Некоторые в районах под нашим контролем были не очень довольны нашим правлением и использовали недавний хаос, чтобы создать правительство вне нашего контроля. Это государственная измена, и она не может быть терпима, мы раздавим их любыми необходимыми средствами."
ZAM_fortify_the_northern_border: "Укрепить северную границу"
ZAM_fortify_the_northern_border_desc: "Гунн сидит по ту сторону границы, выжидая, строя планы, планируя тот день, когда они не только растопчут наше правительство, но и навсегда уничтожат британское правление в Африке. Мы должны подготовиться к этому дню и защитить наш оплот англосаксонского правления каждой каплей нашей крови."
ZAM_god_save_the_king: "Боже, храни короля!"
ZAM_god_save_the_king_desc: "С уходом головорезов кайзера мы можем снова служить законному монарху Англии. Мы служим его величеству, и с его помощью мы отбросим гуннов и восстановим британскую гегемонию не только над Африкой, но и над всем миром."
ZAM_the_spearhead: "Острие Антанты в Африке"
ZAM_the_spearhead_desc: "Бэринг ждет того дня, когда Антанта сможет восстановить контроль над законными британскими землями в Африке и раз и навсегда изгнать немецкого угнетателя. Хотя многие в Южной Африке и Родезии более прагматичны, рассматривая немцев как временных союзников перед лицом синдикалистского гнева, мы будем стоять твердо, зная, что кайзер так же плох, как и красные в Париже и Лондоне."
ZAM_begin_the_entente_reclaimation: "Планировать возвращение"
ZAM_begin_the_entente_reclaimation_desc: "День, когда мы изгоним гуннов из Африки, приближается. Коллеги Бэринга на юге видят в синдикалистах большую угрозу, на которой нужно сосредоточиться, но что они знают? Мы скоро вернем Африку, и наши британские собратья поднимутся, чтобы присоединиться к нам, как только прозвучит горн."
ZAM_kindnap_opposition_leaders: "Похищать и отправлять в ссылку лидеров оппозиции"
ZAM_kindnap_opposition_leaders_desc: "Некоторые в наших землях настолько глупы, что осмеливаются противостоять воле Бэринга и Лиги единой империи. Обычно мы могли бы арестовать или казнить этих смутьянов, но простое похищение и высадка их в какой-нибудь Богом забытой земле, несомненно, сработает."
ZAM_final_order_to_MAF: "Последний приказ Средней Африке"
ZAM_final_order_to_MAF_desc: "Громоздкое чудовище, называемое «Средняя Африка», существовало слишком долго. Оно должно быть уничтожено, гуннские сапоги должны быть навсегда изгнаны из Африки, а «Юнион Джек» снова будет гордо развеваться над бескрайними саваннами Африки!"

ZAM_baring_victory: "Победоносное возвращение"
ZAM_baring_victory_desc: "Вопреки всем трудностям, силы лоялистов Антанты под руководством Эвелина Бэринга изгнали гуннов из Африки! Законное правление британской короны над континентом, жестоко прерванное в 1920-х годах, восстановлено, и указом его величества администрация континента была реорганизована в единую коронную колонию Африки, а Бэринг назначен ее первым генерал-губернатором."
ZAM_legitimate_afrikan_borders: "Законные границы Африки"
ZAM_legitimate_afrikan_borders_desc: "Во второй половине XIX века европейские державы смогли мирно разделить Африку, разделив ее богатства и ресурсы между собой для взаимной выгоды. Однако после Великой войны гунны разрушили это благостное соглашение в попытке захватить весь континент для себя. Теперь, когда их тирания окончена, мы можем сотрудничать с нашими союзниками, чтобы восстановить законные границы этого континента."
ZAM_expel_german_settlers: "Изгнать немецких поселенцев"
ZAM_expel_german_settlers_desc: "С тех пор как Рейх захватил большую часть Африки в 1920-х годах, континент наводнили немецкие поселенцы. Пока они существуют в наших границах и наших колониях, нашим собственным поселенцам будет труднее с пространством и ресурсами, а наше правление будет подорвано присутствием многих, кто лоялен вражеской державе. Поэтому Бэринг принял решение депортировать этих поселенцев обратно в Германию."
ZAM_british_rule_secured: "Британское правление обеспечено"
ZAM_british_rule_secured_desc: "При поддержке наших союзников по Антанте и после нейтрализации непосредственных угроз нашему правительству мы можем теперь вздохнуть с некоторым облегчением, поскольку праведное правление англосаксонского народа над Африкой восстановлено и усилено, чтобы продолжать благосклонно направлять этот континент тысячу лет. Генерал-губернатор Бэринг санкционировал проведение фестивалей в английских поселениях по всей коронной колонии."
ZAM_topple_native_leaders: "Свергнуть местных лидеров"
ZAM_topple_native_leaders_desc: "До Великой войны британские администраторы полагались на лояльность местных монархов, которым обычно разрешалось оставаться на своих тронах, если они принимали британское правление. Однако немецкая узурпация континента доказала их истинный оппортунизм: те же самые лидеры, которые когда-то присягали на верность короне, повернулись к Берлину. Теперь же мы поставим этих предателей на место, официально упразднив систему протекторатов и свергнув местных лидеров по всей Африке."
ZAM_supply_the_entente: "Снабжать Антанту"
ZAM_supply_the_entente_desc: "Наша победа в Африке - это победа не только для нас самих, но и для всего Свободного мира, лидером которого является союз Антанты. Теперь, когда мы обладаем единоличной властью над безграничными богатствами и ресурсами Африки, мы можем сосредоточить наши усилия на получении прибыли и производстве продукции для наших союзников по всему миру, чтобы Британия и Франция снова обрели свободу, а гуннская тирания была сломлена во всём мире."
ZAM_the_best_ye_breed: "Лучшее из вашей породы"
ZAM_the_best_ye_breed_desc: "До революции и распада Империи колониальная служба была чрезвычайно желанной работой для многих молодых англичан: могущество их нации позволяло им путешествовать по миру в качестве солдата или администратора или даже навсегда поселиться в колониях. Теперь, когда наш контроль над Африкой обеспечен, мы должны восстановить этот престиж и призвать британских изгнанников селиться на континенте и предоставлять свои навыки в наше распоряжение."
ZAM_royal_tours: "Королевские туры"
ZAM_royal_tours_desc: "Чтобы еще больше укрепить престиж и легитимность нашей администрации и снискать расположение среди британских изгнанников, мы должны приглашать британских королевских особ и аристократов в турне по Африке, давая им возможность насладиться африканскими заповедниками и красивыми пейзажами впервые с начала Великой войны. Этот опыт, несомненно, оставит у них благоприятное впечатление о нашей администрации и руководстве Бэринга."
ZAM_punitive_communal_labour: "Карательный общественный труд"
ZAM_punitive_communal_labour_desc: "Пришло время преподать этим туземцам, достаточно безумным, чтобы встать на пути нашего благожелательного правления, ценный урок. В настоящее время в отдаленных деревнях практически нет организованного полицейского надзора, и при отсутствии стимулов они могут стать очагами сопротивления. Единственное рациональное решение - это коллективная ответственность: целая деревня будет отправлена на работы на благо Короны, если она укрывает террористов."
ZAM_our_place_in_the_liberation: "Место Африки в освобождении"
ZAM_our_place_in_the_liberation_desc: "Бэринг добился успеха в своей миссии по умиротворению Африки и восстановлению благородного правления британской короны, и теперь пришло время смотреть дальше. Наши братья и сестры в самой Великобритании продолжают страдать под тиранией социализма, и миссия Антанты - освободить их как можно скорее. Поэтому Бэринг санкционировал расширение вербовочных усилий по всему континенту, особенно среди английских поселенцев, чтобы Африка ответила на зов освобождения Британии."

ZAM_adress_our_shitty_army: "Заняться нашей армией"
ZAM_adress_our_shitty_army_desc: "Официальный роспуск армии оставил нашу страну практически беззащитной, если не считать гарнизона Шуцтруппе, охраняющего страну. В связи с массовыми потрясениями последних месяцев ситуация изменилась, и теперь у нас есть своя собственная армия."
ZAM_for_the_king: "Сражаться за короля"
ZAM_for_the_king_desc: "С «Юнион Джеком», гордо развевающимся над территориями Северной Родезии и Ньясаленда, мы построим армию, которая сражается за короля."
ZAM_for_the_kaiser: "Сражаться за кайзера"
ZAM_for_the_kaiser_desc: "С восстановлением порядка на территориях Северной Родезии мы построим армию, которая сражается за кайзера и Германский рейх."
ZAM_Heavy_Equipement: "Тяжелое снаряжение"
ZAM_Heavy_Equipement_desc: "Для защиты наших городов и атаки на вражеские опорные пункты нам нужна артиллерия для поддержки наших наступающих войск."
ZAM_Arsenal: "Строить наши арсеналы"
ZAM_Arsenal_desc: "Чтобы уменьшить нашу зависимость от иностранного оружия, нам необходимо обеспечить большой склад и начать собственное примитивное производство."
ZAM_Artillery_Foundry: "Артиллерийская литейная"
ZAM_Artillery_Foundry_desc: "С помощью южноафриканцев мы создадим собственную артиллерийскую литейную, чтобы пополнить наш импортированный запас."
ZAM_expand_the_Schutztruppe: "Реформировать Шуцтруппе"
ZAM_expand_the_Schutztruppe_desc: "Теперь, когда у нас есть постоянная армия для защиты, наша страна действительно станет силой, с которой будут считаться в Африке. Да здравствует кайзер!"
ZAM_Found_Military_Academy: "Основать военную академию"
ZAM_Found_Military_Academy_desc: "Для поддержки нашей программы подготовки офицеров колониальное правительство открыло Военную академию Лусаки."
ZAM_Defense_of_Zambia: "Оборона Замбии"
ZAM_Defense_of_Zambia_desc: "С португальскими стервятниками и военачальниками со всех сторон, все должны встать на защиту Замбии!"
ZAM_kings_african_rifles: "Королевская армия"
ZAM_kings_african_rifles_desc: "Теперь, когда у нас есть постоянная армия для защиты, наша страна действительно станет силой, с которой будут считаться в Африке. Боже, храни короля!"
KTG_Learn_From_The_Past: "Учиться у прошлого"
KTG_Learn_From_The_Past_desc: "После поражений от наших врагов в прошлом пришло время учиться на наших ошибках и адаптироваться."
ZAM_Military_Compact_With_South_Africa: "Военный пакт с Южной Африкой"
ZAM_Military_Compact_With_South_Africa_desc: "Теперь, когда мы восстановили связи с Антантой, мы можем положиться на гораздо более могущественного союзника - Южную Африку, которая возьмет на себя часть нашей обороны."


