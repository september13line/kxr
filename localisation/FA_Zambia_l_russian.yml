### Ideas ###
ZAM_entente_obligations: "Обязательства перед Антантой"
ZAM_entente_obligations_desc: "Теперь, когда Бэринг стоит победителем над Африкой, он удвоил свои обязательства перед альянсом Антанты, снабжая [ENT.GetAdjective]ое правительство деньгами, оружием и людьми. От Дакара до Дар-эс-Салама и от Алжира до Лусаки Африка готова освободить Европу."
ZAM_postwar_instability: "Послевоенная нестабильность"
ZAM_postwar_instability_desc: "Война за восстановление британского правления была самой жестокой и травматичной в истории Африки, и теперь континент лежит в руинах, в то время как Бэринг ещё не создал стабильную администрацию на недавно завоёванных землях."
ZAM_legitimate_administration: "Легитимная администрация"
ZAM_legitimate_administration_desc: "Наше правительство - единственное легитимное правительство Африки, и наша администрация опирается на многовековую английскую практику на колониальных территориях, в то время как наши бюрократы и офицеры имеют самое лучшее происхождение и испытывают только преданность королю и стране."
ZAM_anglo_dominance: "Англосаксонское господство"
ZAM_anglo_dominance_desc: "В своей миссии по умиротворению Африки и восстановлению британского правления Бэринг расширил подчинение неанглийских народов по всему континенту, чтобы их труд помог освободить английский народ."
ZAM_Colonial_Nation: "Колониальное правительство"
ZAM_Colonial_Nation_desc: "После революции 1925 года мы неохотно перешли на сторону нашего бывшего врага - Миттельафрики - и запросили их защиты. Более того, суверенитет Северной Родезии был нарушен немцами, чтобы «защитить» её от агрессии Антанты в Африке против Миттельафрики. Это имеет немедленное последствие: Дар-эс-Салам теперь диктует нашу внешнюю политику."
ZAM_Schutztruppe_Government: "Гарнизон Шуцтруппе"
ZAM_Schutztruppe_Government_desc: "Миттельафриканские Шуцтруппе под руководством восточноафриканца Ганса Хюттига контролируют наш государственный аппарат. Их делегаты отдают приказы нашим государственным служащим и закрыли национальную демократию, что привело к глубоко непопулярному и неэффективному правительству."
ZAM_No_Army: "Военные ограничения"
ZAM_No_Army_desc: "Гарнизон Шуцтруппе распустил северо-родезийскую армию и полицию, чтобы усилить свою власть над нами. Это означает, что мы не можем собрать армию, пока они не решат, что нам снова это разрешено."
ZAM_punishment_camps: "Лагеря для инакомыслящих"
ZAM_punishment_camps_desc: "Хотя «Исправительные лагеря» поначалу использовались только для самых жестоких бандитов и преступников, они также могут служить цели «реабилитации» тех, кто проявляет нелояльность гауптману Хюттигу."
ZAM_segregation: "Повсеместная сегрегация"
ZAM_segregation_desc: "Теперь, когда Хюттиг установил контроль над Северной Родезией, он наконец может начать вводить законы, более благоприятные для белого меньшинства. При Хюттиге сегрегация в регионе станет повсеместной."
ZAM_pacification: "Успешное умиротворение"
ZAM_pacification_desc: "Работа, которую Хюттиг намеревался выполнить, когда был назначен губернатором Северной Родезии, наконец завершена. Несмотря на все препятствия, ему удалось удержать власть и умиротворить обширные просторы Замбии, несмотря на всех, кто стоял на его пути. Да здравствует кайзер, слава Хюттигу!"
ZAM_military_seperated_from_politics: "Шуцтруппе обуздана"
ZAM_military_seperated_from_politics_desc: "Бесконтрольная власть Шуцтруппе привела к тому, что правительство региона существует в нерабочем состоянии. После ухода Хюттига Юнгер взял на себя задачу обуздать Шуцтруппе, отстранив их от всех политических и правительственных дел."
ZAM_libraries: "Интеллектуальное расширение"
ZAM_libraries_desc: "Юнгер не новичок в интеллектуальных и высших кругах, которые были так же напуганы безудержным авторитаризмом Хюттига, как и он. После того как Юнгер успешно изгнал одиозного Хюттига из администрации Замбии, он может начать расширять библиотеки, архивы и школы вместо военных казарм."
ZAM_reformed_administration: "Реформированная администрация"
ZAM_reformed_administration_desc: "Контролируемое немцами правительство Северной Родезии долгое время страдало от неэффективности и коррупции, что вызывало массовую ненависть со стороны населения. К счастью, новый губернатор территории Эрнст Юнгер пообещал масштабные реформы."
ZAM_reformed_administration2: "Реформированная администрация"
ZAM_reformed_administration2_desc: "Контролируемое немцами правительство Северной Родезии долгое время страдало от неэффективности и коррупции, что вызывало массовую ненависть со стороны населения. К счастью, новый губернатор территории Эрнст Юнгер пообещал масштабные реформы."
ZAM_defend_our_fronteir_SAF: "Рубеж"
ZAM_defend_our_fronteir_SAF_desc: "Земли Северной Родезии в значительной степени не защищены от могущественных врагов как на востоке, так и на юге. Африканеры, Португалия и вечно затаившиеся англосы готовы нанести удар, и мы должны быть готовы."
ZAM_defend_our_fronteir_POR: "Рубеж"
ZAM_defend_our_fronteir_POR_desc: "Земли Северной Родезии в значительной степени не защищены от могущественных врагов как на востоке, так и на юге. Африканеры, Португалия и вечно затаившиеся англосы готовы нанести удар, и мы должны быть готовы."
ZAM_defend_our_fronteir2: "Рубеж"
ZAM_defend_our_fronteir2_desc: "Земли Северной Родезии в значительной степени не защищены от могущественных врагов как на востоке, так и на юге. Африканеры, Португалия и вечно затаившиеся англосы готовы нанести удар, и мы должны быть готовы."
ZAM_Weak_British_Hold_1: "Слабая британская власть"
ZAM_Weak_British_Hold_1_desc: "Хотя Лига единой империи теперь может иметь номинальный контроль над Северной Родезией и Ньясалендом, наша власть далеко не прочна, поскольку подрывные элементы мешают нам на каждом шагу."
ZAM_Weak_British_Hold_2: "Слабая британская власть"
ZAM_Weak_British_Hold_2_desc: "Хотя Лига единой империи теперь может иметь номинальный контроль над Северной Родезией и Ньясалендом, наша власть далеко не прочна, поскольку подрывные элементы мешают нам на каждом шагу."
ZAM_Weak_British_Hold_3: "Слабая британская власть"
ZAM_Weak_British_Hold_3_desc: "Хотя Лига единой империи теперь может иметь номинальный контроль над Северной Родезией и Ньясалендом, наша власть далеко не прочна, поскольку подрывные элементы мешают нам на каждом шагу."
ZAM_final_battle: "Финальная битва!"
ZAM_final_battle_desc: "Конец для гуннов близок! Мы двинемся на север и вернём славу Империи, раз и навсегда изгнав немцев из Африки и снова восстановив британское правление не только над Африкой, но и над миром. Некоторые могут умереть, но они умрут верными, зная, что хорошо послужили своему королю и Империи!"
ZAM_British_Army: "Королевские африканские стрелки"
ZAM_British_Army_desc: "С «Юнион Джеком», гордо развевающимся над территориями Северной Родезии и Ньясаленда, мы построим армию, которая сражается за короля."
KTG_German_Army: "Немецкая Шуцтруппе Северной Родезии"
KTG_German_Army_desc: "С восстановлением порядка на территориях Северной Родезии мы построим армию, которая сражается за кайзера и Германский рейх."
KTG_Reformed_Schutztruppe: "Реформированная Шуцтруппе"
KTG_Reformed_Schutztruppe_desc: "Теперь, когда у нас есть постоянная армия для защиты, наша страна действительно станет силой, с которой будут считаться в Африке. Да здравствует кайзер!"
ZAM_Military_Academy: "Военная академия"
ZAM_Military_Academy_desc: "Для поддержки нашей программы подготовки офицеров колониальное правительство открыло Военную академию Лусаки."
ZAM_Royal_Army: "Королевская армия"
ZAM_Royal_Army_desc: "Теперь, когда у нас есть постоянная армия для защиты, наша страна действительно станет силой, с которой будут считаться в Африке. Боже, храни короля!"

### Leader Bios ###
POLITICS_HUTTIG_DESC: "Ганс Хюттиг никогда не должен был руководить Северной Родезией - такой человек не должен находиться в таком месте, но человек не в том месте и не в то время может всё изменить. Родившийся в Дрездене в 1894 году в семье столяра, ставшего торговцем фотографическим оборудованием, Хюттиг не был предназначен для великих дел, но всё изменилось с началом Мировой войны. После того как Хюттиг поступил на службу в Императорскую немецкую армию, он участвовал в особенно жестоких боях во время Восточноафриканской кампании, которая завершилась победой немцев над британцами. За храбрость и отличие, проявленные как в Восточной Африке, так и во время оккупации новых владений, Хюттиг был назначен военным лидером Замбии в 1925 году, после Британской революции и последовавшего краха британского контроля в регионе. С тех пор Хюттиг правит Северной Родезией железной рукой, но в последнее время его внимание приковано не только к его ссорящемуся кабинету, но и к Южной Родезии, а также к внутренним проблемам самой Миттельафрики. Но пока Хюттиг остаётся на рубеже Орла, стоя на страже от угрозы с юга."
POLITICS_JUNGER_DESC: "Эрнст Юнгер - колоритная фигура, возможно, одна из самых колоритных во всей Африке. Родившийся в Гейдельберге на юго-западе Германии в семье преуспевающего химика и бизнесмена, Юнгер был предназначен для более лёгкой жизни, чем большинство. Но будучи всегда бунтарского склада, Юнгер искал приключений в «Вандерфогель», а затем во Французском Иностранном легионе, и хотя его должны были судить за этот незаконный поступок, он избежал преследования благодаря усилиям своего отца. После начала Мировой войны Юнгера сначала отправили на Западный фронт, но затем перевели в Германскую Восточную Африку, поскольку конфликт расширялся и туда. Отслужив в Африке и демобилизовавшись, Юнгер сначала направился на Мадагаскар, но был disgusted промышленной мерзостью, привнесённой Рейнхардом Гейдрихом, поэтому решил отправиться на рубеж Орла - в Северную Родезию. Большую часть своих первых лет в Северной Родезии Юнгер провёл, изучая местную флору и фауну, путешествуя по её обширным горам и долинам, а также активно писал после войны. Юнгер обрёл покой в жизни и решил провести свои дни на рубеже, но жестокое правление Хюттига разъедало его. Он должен был что-то с этим сделать. Декадентские пути Бэринга тоже не были ответом, поскольку они были двумя сторонами одной медали. Он должен был что-то сделать, но не только ради себя, но и ради страданий людей под сапогом Хюттига. Поднявшись по служебной лестнице и захватив власть у Хюттига, Юнгер стал правителем Северной Родезии и теперь командует обширной и чуждой территорией, но люди верят в него. Только время покажет, сохранят ли они свою веру."
POLITICS_BARING_DESC: "Пока Эвелин Бэринг контролирует Северную Родезию, солнце не заходит над Британской империей. Пока он дышит, немецкое господство над Африкой отнюдь не является надёжным. Поработав на разных административных должностях, Бэринг обосновался на посту в оккупированной немцами бывшей британской колонии Северная Родезия. Хотя он усердно работал при администрации Хюттига, Бэринг никогда не уклонялся от того, чтобы высказывать своё отвращение к тому, как немцы незаконно вторглись на законные британские владения, и ужас от того, что его любимая Британская империя, казалось, рассыпалась в прах на его глазах. По мере того как Хюттиг становился всё более oppressive, Бэринг начал организовывать британские остатки в попытке изгнать гуннов из Северной Родезии и обратился за помощью на юг. Однако Бэринг столкнулся с молчанием как со стороны Южной Родезии, так и Южной Африки, которые сочли дело Бэринга безнадёжным. Несмотря на это, Бэринг захватил контроль после опалы Хюттига при минимальной поддержке с юга.\n\nТеперь, будучи бесспорным лидером Северной Родезии, Бэринг надеется использовать эту территорию как плацдарм не только для освобождения бывших британских колоний, но и для того, чтобы навсегда изгнать гуннов из Африки; задача, которая легче сказать, чем сделать. Призывы Бэринга о помощи в основном остались неуслышанными, поскольку большинство англосов согласны с тем, что красные представляют большую угрозу, чем немцы. Даже когда его соотечественники считают его безумцем, Бэринг видит, что кайзер - такая же большая угроза, как и синдикалисты, и он не успокоится, пока «Юнион Джек» гордо не зареет и над Лондоном, и над Берлином."

### Events ###
nrho.1.t: "Крах порядка"
nrho.1.d: "Наши худшие опасения сбылись! Великий проект кайзера «Миттельафрика» полностью провалился. Пожары восстаний и хаоса бушуют и распространяются по Тёмному континенту. Африка скоро увидит масштабную войну впервые со времён Мировой войны, поскольку барабаны войны слышны от Золотого Берега до Намиба. Однако нам не пришлось долго ждать, пока хаос достигнет нашей колонии, ведь туземцы Ньясаленда восстали против нашей власти! Наша храбрая Шуцтруппе марширует на восток, чтобы раздавить этих проклятых дикарей, посмевших сбросить власть кайзера."
nrho.1.a: "Сохранять спокойствие!"

nrho.2.t: "Стычки на границе"
nrho.2.d: "Проклятье их! Вероломные, предательские англосы с юга решили устроить серию пограничных стычек на нашей территории. Атакуя, они прощупывают нашу оборону и осматривают наши земли, получая ценные разведданные, которые используют против нас в неизбежной войне за сердце Тёмного континента. Пока эти атаки удаётся сдерживать благодаря нашим храбрым полкам аскари и Шуцтруппе, но если мы хотим выжить в этой суровой среде, потребуются улучшения во всём. Один просчёт может стоить нам не только нашего будущего, но и будущего всех немцев по всей Миттельафрике."
nrho.2.a: "О боже..."

nrho.3.t: "Федеральный совет?"
nrho.3.d: "Поскольку управление этой большой и густонаселённой колонией становится всё сложнее с каждым новым кризисом, Хюттиг начал размышлять о создании Федерального совета. В теории, это бюрократическое дополнение к колониальному правительству сняло бы большую часть административной нагрузки с гарнизонов Шуцтруппе, чтобы те могли более тщательно сосредоточиться на своих военных обязанностях. Хотя он был бы в значительной степени бессилен по сравнению с Хюттигом, он всё же может оказаться более проблематичным, чем полезным, хотя он также успокоил бы многих наших наиболее активных критиков. В конечном счёте выбор остаётся за Хюттигом."
nrho.3.a: "Разрешить."
nrho.3.b: "Отказать."


nrho.4.t: "Связи с местными профсоюзами?"
nrho.4.d: "Ещё одна набирающая популярность горячая тема для разговоров в коридорах колониальной столицы - вопрос о замбийских профсоюзах. В настоящее время профсоюзы в значительной степени запрещены по всей колонии, и любое классовое сотрудничество быстро подавлялось из-за страхов перед гнилостным влиянием синдикализма. Несмотря на эти страхи, разрешение деятельности государственных профсоюзов могло бы удовлетворить наших критиков, а предоставление большей автономии местным жителям позволило бы профсоюзам снять часть избыточного напряжения, испытываемого нашими гарнизонами Шуцтруппе. Как всегда, такое важное решение лежит на плечах Хюттига."
nrho.4.a: "Разрешить."
nrho.4.b: "Отказать."

nrho.5.t: "Новая администрация?"
nrho.5.d: "Хотя его методы были острыми и эффективными, а жестокость - действенной, жажда власти и прямого контроля над колонией Северная Родезия у Ганса Хюттига нанесла ущерб нашей стабильности, угрожая оплоту кайзера в регионе. Его постоянное пренебрежение любыми попытками децентрализации заставило многих в администрации нервничать, и некоторые начали призывать к смене руководства. Главный кандидат на замену Хюттига - Эрнст Юнгер, ещё один заслуженный ветеран Мировой войны, начинающий писатель и энтузиаст-энтомолог. Человек разнообразных вкусов и острого тактического ума, многие считают Юнгера идеальным кандидатом для управления колонией. Хюттигу придётся положиться на поддержку Коллаборативного правительства Северной Родезии, чтобы сохранить контроль, но многие считают, что его дни у власти сочтены."
nrho.5.a: "Надеяться на поддержку NKG для Хюттига."
nrho.5.c: "Рассчитывать на поддержку NKG и подсунуть взятку."
nrho.5.b: "Отойти в сторону, позволить Юнгеру взять власть."

nrho.6.t: "Хюттиг просит продления"
nrho.6.d: "Сегодня в Дар-эс-Салам пришли новости из кабинета Ганса Хюттига и его администрации в Северной Родезии. Хюттиг попросил нас принять его просьбу остаться гауптманом Северной Родезии, продлив его командировку, несмотря на слухи, циркулирующие вокруг него, и его жёсткие методы управления колонией. В случае его отстранения ветеран Мировой войны Эрнст Юнгер будет править вместо него, и ожидается, что он будет править бархатной перчаткой, а не железным кулаком режима Хюттига. В конечном счёте выбор остаётся за мудрым штатгальтером Миттельафрики."
nrho.6.a: "Приказать ему отойти в сторону."
nrho.6.b: "Предоставить ему продление."

nrho.7.t: "Дар-эс-Салам отклоняет просьбу Хюттига"
nrho.7.d: "Проклятье! Похоже, дураки в Дар-эс-Саламе отклонили нашу простую просьбу и потребовали немедленной отставки Хюттига с поста гауптмана Северной Родезии, иначе они столкнутся со всей мощью африканских владений кайзера. Этот удар по его эго сокрушил его, сделав его, мягко говоря, неразумным. Пуская пену от ярости, Хюттиг требует введения чрезвычайного положения, чтобы получить чрезвычайные полномочия, но более холодные головы могут восторжествовать, если им удастся его успокоить. После часов обсуждений и споров между Хюттигом и его советниками властитель Северной Родезии решил..."
nrho.7.a: "Ввести чрезвычайное положение на время!"
nrho.7.b: "Следовать их приказу."

nrho.8.t: "Ордер на арест Хюттига"
nrho.8.d: "Игнорируя волю штатгальтера, Хюттиг объявил администрацию в Дар-эс-Саламе глупой и близорукой. Пока он и его небольшой отряд верных Шуцтруппе и аскари готовятся к грядущему конфликту, гораздо больше немцев и туземцев начали принимать сторону Юнгера и его покровителей, которые выдали ордер на арест Хюттига. Этот шокирующий поворот событий привёл к почти неминуемой гибели нынешнего гауптмана. По мере того как этот заговор предательства сгущается, вечно интригующие англосы также начали выползать из-под своих камней. С юга нашей колонии, при финансировании и помощи из Южной Родезии и Южной Африки, человек по имени Эвелин Бэринг разжигает старые распри и напряжённость, стремясь захватить власть в грядущей буре с помощью грандиозного марша на столицу нашей колонии и вернуть Северную Родезию этим напыщенным английским псам. Какая группа - гунны или англосы - победит в грядущей борьбе за власть, неизвестно, но независимо от того, кто выйдет победителем, кровь окрасит Замбези в красный цвет."
nrho.8.a: "Шуцтруппе устраняет Хюттига!"
nrho.8.b: "Люди Бэринга маршируют на Лусаку!"

nrho.9.t: "Люди Бэринга вторгаются"
nrho.9.d: "После выдачи ордера на арест Хюттига и недолгого затишья перед бурей Бэринг и его англосские союзники объявили полномасштабную войну немецкой колониальной администрации в Северной Родезии. Воспринимая одну неудачу за другой, британцы колонии сыты по горло гуннским сапогом. Въезжая в Лусаку, Бэринг и его силы надеются нанести быстрый и решительный удар по немецкой администрации, вынудив её к быстрому и раннему отступлению. Чтобы обеспечить свой успех, ходят даже слухи, что он просит помощи у Южной Африки в этой войне. Независимо от слухов, написано на стене, и если Хюттиг и его немногочисленные оставшиеся верные силы не будут действовать быстро, командировка Хюттига закончится навсегда."
nrho.9.a: "Южная Африка присоединяется к вторжению!"
nrho.9.b: "Люди Бэринга маршируют на Лусаку!"
nrho.9.c: "Хюттиг подавляет мятежников!"

nrho.10.t: "Бэринг захватывает контроль"
nrho.10.d: "Вооружённые лишь потом на своих бровях и свинцом в винтовках, англосские силы под командованием Эвелина Бэринга успешно взяли под контроль Лусаку, а вместе с ней и контроль над всей Северной Родезией. Эти земли возвращаются в британские руки впервые со времён Мировой войны, и под руководством Лиги единой империи Бэринг вырежет ещё одно пространство для англоса на Тёмном континенте. Хотя они окружены врагами почти со всех сторон, новосозданная Северная Родезия стоит победителем, поскольку ещё один кусок старой Британской империи восстановлен. Кажется, солнце снова начинает вставать над павшей империей."
nrho.10.a: "Боже, храни короля!"

nrho.11.t: "Хюттиг захватывает контроль"
nrho.11.d: "Пока взрывы и выстрелы пронзали ночной воздух Лусаки, Ганс Хюттиг и его небольшая, но яростно преданная группа Шуцтруппе рыскали по улицам и переулкам города в поисках своей добычи. Недавний разгул беззакония в колонии превратил Лусаку и другие города в жестокие зоны боевых действий, пока в джунглях и диких землях Северной Родезии разразилась ожесточённая партизанская война. Пока Хюттиг и его люди крадутся от квартала к кварталу, они молча казнят своих предательских врагов, одновременно собирая информацию о местонахождении противника. Хотя англосские мятежники и сторонники Юнгера значительно превосходят численностью его людей, силы Хюттига имеют преимущество в тактике и жестокости. После бесчисленных долгих ночей сеяния подрывной деятельности и саботажа группа Хюттига остаётся единственной эффективной и нескомпрометированной боевой силой в колонии. Обретя новую силу и превосходство, многие сторонники Юнгера перешли в лагерь Хюттига, и после последнего штурма оставшихся англосских полков под командованием Бэринга Северная Родезия снова окажется под контролем гауптмана Хюттига."
nrho.11.a: "Да здравствует гауптман!"

nrho.12.t: "Дар-эс-Салам отступает"
nrho.12.d: "После нашей недавней череды побед над мятежными Юнгером и Бэрингом Ганс Хюттиг становится единственным истинным лидером Северной Родезии. Хотя он сильно разгневал главный офис в Дар-эс-Саламе своими интригами и выходками, даже они не могут отрицать его эффективность и блеск в превосходстве над множеством врагов, стремившихся свергнуть его режим. Колониальная администрация Миттельафрики теперь не имеет выбора, кроме как поддерживать Хюттига, даже если через лживые взгляды и фальшивые улыбки, ибо гауптман Хюттиг доказал, что он единственный человек, способный укротить дикие земли Северной Родезии. Командировка Ганса Хюттига продолжается, и только время покажет, что это будет означать для Африки в целом."
nrho.12.a: "Фантастика!"

nrho.14.t: "Юнгер берёт власть"
nrho.14.d: "Эрнст Юнгер, знаменитый ветеран Мировой войны и бывшая правая рука Хюттига, теперь стоит на вершине груды поверженных врагов и разбитых обещаний, созданных его предшественником. После недель борьбы с англосскими стрелками Бэринга, мятежными аскари и даже верным кадром самого Хюттига Юнгер вышел победителем! Теперь наступает монументальная задача - восстановить разрушенную колонию и исправить ошибки предыдущей администрации. Юнгер даже высказывался в поддержку идеи настоящей демократии, но остаётся вопрос, держит ли он слово. Независимо от его планов и амбиций, только Юнгер выберет наше новое направление, и под его стальным оком Северная Родезия движется в будущее."
nrho.14.a: "Да здравствует гауптман!"

nrho.15.t: "Обещания демократии?"
nrho.15.d: "Пока начальные восстановительные процедуры идут, а колония медленно заживает, пришло время Эрнсту Юнгеру наконец решить, как Северная Родезия должна двигаться вперёд. Во время его кампании против Хюттига и последовавшего конфликта Юнгер стал рупором более либерально настроенных и прагматичных чиновников в нашем правительстве, и их самым большим желанием является создание истинной демократической системы Северной Родезии. Хотя сам Юнгер высказывался в поддержку этой идеи, даже заходя так далеко, что обещал многим группам скорое наступление демократии, теперь это решение наконец должно быть принято. Демократия может допустить в администрацию подрывные элементы, такие как вероломные англосы, но также может обеспечить так необходимую стабильность и общественную поддержку немецкому режиму. В конечном счёте, решать Юнгеру. Должен ли он быть человеком слова, или эта отсталая колония ещё не готова к свету и привилегиям демократии?"
nrho.15.a: "Пока нет"
nrho.15.b: "Я человек слова!"

nrho.16.t: "Первые выборы"
nrho.16.d: "Эрнст Юнгер сделал это! Создав одну из первых настоящих демократий на Африканском континенте, Юнгер исполнил мечту, которую многие в колонии считали невозможной. С приближением первых выборов две основные партии показали себя достаточно популярными, чтобы иметь шанс на победу. Собственная партия Юнгера стоит высоко благодаря большой поддержке со стороны Дар-эс-Салама и устоявшихся немцев в колонии, но ориентированная на англосов Партия доминиона также увидела взрыв народной поддержки. Эта первая гонка будет напряжённой и определит душу колонии на будущее. Останется ли Северная Родезия в когтях гуннов и кайзера, или наконец пришло время англосу восстановить эти старые земли в их былой славе времён Британской империи? Только люди и их голоса могут решить сейчас."
nrho.16.a: "Юнгер одерживает сокрушительную победу!"
nrho.16.b: "Партия доминиона побеждает!"

nrho.17.t: "Зов империи"
nrho.17.d.nigeria: "Сегодня в наш офис поступила секретная телеграмма из бывшей колонии Северная Родезия. После недавнего успешного восстания Эвелина Бэринга против безумного тирана Хюттига, рёв англосского льва снова слышен в Лусаке на юге, поскольку Северная Родезия была восстановлена в своём бывшем величии. Бэринг спросил нас о возможности вооружённого восстания против всей Миттельафрики, учитывая, что их предыдущая попытка была такой успешной. Хотя война будет жестокой и тяжёлой, а победа не гарантирована, привлекательность воссоздания былых имперских слав родной страны слишком заманчива, чтобы от неё отказываться. Каким будет наш ответ?"
nrho.17.d.kenya: "Сегодня на стол нашего офиса легло интересное предложение от Эвелина Бэринга из недавно восстановленной колонии Северная Родезия. Недавняя победа Бэринга над гуннами в свержении варварского режима Хюттига придала ему смелости, и теперь он стремится разжечь восстание против чудовища, которым является Миттельафрика в целом. Выступать против мощи Кайзеррейха и его союзников в одиночку кажется глупым, но если мы ударим вместе, как одна большая стая, мы, истинные львы Тёмного континента, снова победно зарычим. Как нам ответить?"
nrho.17.d.westafrika: "Прежде чем Эвелин Бэринг начал свою войну против немцев в Африке, он отчаянно пытался привлечь нас на свою сторону и добиться сотрудничества, ссылаясь на наши общие обязательства перед короной и наш долг сохранять и расширять британское правление в Африке.\nВ то время мы проигнорировали эти призывы о поддержке, считая Бэринга безумцем, а его планируемую войну - обречённой. Теперь, однако, его родезийские силы продвинулись глубоко в Миттельафрику, разгромив немецкие войска в нескольких ключевых битвах и вызвав панику в немецкой администрации, поскольку британские силы отвоёвывают бывшие колонии.\nВ связи с этим многие из более преданных роялистов и колониалистов в администрации теперь хотят, чтобы мы объявили о своей поддержке Бэринга, начали собственное наступление против немцев, чтобы обеспечить законные британские владения, и подтвердили нашу верность альянсу Антанты и законному британскому правительству."
nrho.17.a: "Время пришло, Боже, храни короля!"
nrho.17.b: "Они сами по себе..."

nrho.18.t: "Сафари Хюттига"
nrho.18.d: "Тёплое солнце палило на Ганса Хюттига, пока он медленно и методично поднимался вверх по побережью Замбези. Вооружённый своим верным маузером, он выслеживал добычу, пока впереди мерцал величественный водопад Виктория. Пока одни из крупнейших водопадов в мире гремели вдалеке, звуки Хюттига также маскировались - идеально для его текущего занятия. Охота на великих зверей этого континента делала его времяпрепровождение ещё более приятным, так как Хюттиг почти ничего не любил так сильно, как thrill сафари. Он выслеживал одинокого льва несколько дней и быстро приближался к выбранной добыче, далеко опередив остальную часть своей охотничьей партии. Когда он наконец приблизился к зверю, он мог насладиться его величием. Громадная масса извивающихся сухожилий и когтей с длинной дикой гривой, чёрной и загадочной, как сам Тёмный континент. Его огромные клыки вонзались в свежую добычу - местную антилопу пуку, пока Хюттиг медленно кружил вокруг зверя в нескольких десятках метров, ища идеальное место для выстрела. Когда он установил винтовку на плоский камень, прицеливаясь в зверя, под его ногой хрустнула ветка, предупредив существо о его присутствии. В мгновение ока лев бросился на Хюттига, который находился всего в нескольких шагах. Когда его добыча прыгнула в воздух для смертельного прыжка, Хюттиг выстрелил из маузера. Попав орлиным глазом в грудь летящей кошки, пуля пронзила бьющееся сердце этого короля джунглей за мгновение до того, как лицо Хюттига встретилось с кинжалоподобными клыками высшего хищника. Снова выстрел Хюттига достиг цели, и он начал звать остальную часть охотничьей партии, которая наконец догнала его. Приказав двум слугам начать разделывать зверя для шкуры и трофея, Хюттиг подошёл к ближайшему обрыву на краю этой поляны. Он уставился на водопад Виктория вдалеке, казалось, потерявшись в его захватывающей дух красоте, внутренне благодаря того, кто позволил ему править этой землёй."
nrho.18.a: "Я - единственный истинный король джунглей."

nrho.19.t: "Болезни роста"
nrho.19.d: "Мечты о единой Родезии полностью осуществились: север и юг объединились, образовав неделимый союз. Несмотря на вычурную помпу и чушь, которую столица скармливает народу Родезии, никакая ложь или пропаганда не могут изменить реальность. Реальность такова, что после объединения наше новое государство страдает от неэффективности, нестабильности и откровенной некомпетентности. Хотя никто не ожидал, что слияние двух разных администраций будет лёгким, никто не мог предположить, что оно пойдёт наперекосяк в такой степени. Региональные идентичности укоренились до такой степени, что северяне и южане спорят или дерутся открыто на улицах, а за закрытыми дверями сепаратистские группы уже встречаются, чтобы обсудить роспуск союза. В дополнение к разгневанным родезийцам мы также должны иметь дело с туземцами Ньясаленда и Малави, которые тоже не слишком счастливы быть втянутыми в этот союз. Мы не можем это терпеть! Мы должны немедленно решить наши многочисленные проблемы и вычистить мякину и балласт из нашей администрации, как мясник срезает жир с хорошего жаркого. Родезия должна быть единой, поскольку будущее Тёмного континента становится всё более неопределённым с каждым днём."
nrho.19.a: "Родезия, единая и неделимая?"

nrho.20.t: "Человек многих дисциплин"
nrho.20.d: "Эрнст Юнгер - один из самых интересных людей в великой мозаике мегаколонии Миттельафрика. Храбрый ветеран Мировой войны и страстный любитель природы на протяжении всей жизни, неудивительно, как он оказался в колонии Северная Родезия. В юности он участвовал во многих группах «Вандерфогель» в Кайзеррейхе, путешествуя по диким местам и приобретая непоколебимую любовь к жизни и природе. Некоторое время он служил в Иностранном легионе Франции, что было незаконным и предательским действием в глазах Кайзеррейха, путешествуя по французским колониям в Африке, где влюбился в Тёмный континент. Когда последние орудия Мировой войны замолчали, он стал высоко награждённым солдатом, используя то, что он узнал на войне, чтобы написать свой шедевр «В стальных грозах» - мемуары об ужасах и славе окопов, свидетелем которых он был на Западном фронте. Переехав в колонии после войны героем и учёным, он хорошо вписался в африканский режим. По прибытии он заинтересовался колониальной политикой, где его национально-консервативные взгляды были оценены немецкой администрацией, также находя время для своей любви к писательству и естественнонаучным занятиям. Изучая морскую биологию, охрану природы, зоологию, энтомологию, ботанику и философию - это лишь некоторые из его занятий, - Юнгер гордился своим острым и тактичным умом. Теперь старый одарённый интеллектуал-ветеран поднялся на вершину иерархии Северной Родезии, оказавшись преемником тиранического режима Ганса Хюттига. Под его спокойным и взвешенным руководством Северная Родезия переживёт любую грядущую бурю."
nrho.20.a: "Истинный человек эпохи Возрождения на Африканском континенте."

nrho.21.t: "Без дефицита прерываний"
nrho.21.d: "Эрнст Юнгер сидел, склонившись над столом в своём кабинете, вглядываясь в микроскоп на тот или иной образец, когда два адъютанта из Шуцтруппе ворвались в дверь. Молодой дуэт начал без умолку болтать о недавних бюджетных проблемах и административном жаргоне, который бывалый гауптман не желал слушать. «Да-да, очень хорошо», - прорычал он адъютантам, махнув рукой в воздухе, чтобы выпроводить их за дверь, не отрывая взгляда от окуляра микроскопа. «Спасибо, что привлекли это к моему вниманию, но не беспокойте меня этой ерундой снова», - ровно сказал Юнгер, когда два солдата повернулись, чтобы выйти из тёмной комнаты. Когда эти отвлекающие факторы покинули его, он мог вернуться к своей работе. Вглядываясь в насекомое, которое лежало приколотым к чашке Петри, дотошный мужчина снова погрузился в своё исследование, делая заметки и зарисовки странного маленького жучка, которого он сохранил из своего последнего похода в джунгли, обнимающие Замбези. Когда он заглушил мир вокруг себя, Юнгер снова обрёл покой, отложив маленького жука для сохранения и вытащив другой образец из своего дорожного чемодана, чтобы повторить свой процесс снова. Надеюсь, больше не будет вторжений, подумал он про себя, когда его разум снова погрузился в его естественнонаучные занятия."
nrho.21.a: "Каждому мужчине нужно хобби, а то и три."

nrho.22.t: "Рейд Бэринга на туземцев"
nrho.22.d: "Эвелин Бэринг зарядил очередной патрон в свою старинную Мартини-Генри Mk IV, захлопнув затвор, когда он приготовился прицелиться в спасающегося бегством туземного мятежника. С громовым треском старое ружьё метнуло очередной массивный патрон, поразив туземного «офицера» чуть ниже левого плеча. Медленно подойдя к мятежнику, который теперь лежал на земле, корчась от боли, сжимая свою новую рану, Бэринг сделал долгую затяжку из своей сигары, выдыхая густой дым в жгучий сухой воздух Ньясаленда. Туземцы этого региона оказались особенно раздражающим шипом в боку новой администрации Бэринга, поэтому он и небольшая «охотничья партия» несколько дней были в пути, находя и истребляя каждого последнего сепаратиста и смутьяна, в кого он мог прицелиться из своей винтовки. Теперь, стоя над туземцем, Бэринг посмотрел прямо в его полные страха глаза, вытащил свой револьвер Веблей и нацелился прямо в лоб этому неудавшемуся революционеру. Движением пальца и очередным громовым треском дело было сделано. «Одной проблемой меньше», - подумал про себя Бэринг, заряжая очередной патрон в винтовку, затягиваясь сигарой и продолжая путь с остальными товарищами, стремясь уничтожить каждую последнюю предательскую собаку, на которую мог упасть его взгляд. Его колония будет цивилизованной, и он наведёт порядок в этих диких землях, какой бы ни была цена."
nrho.22.a: "Эти дикари почувствуют либо жгучий свет цивилизации, либо обжигающий жар свинца."

nrho.23.t: "Прогулка Хюттига"
nrho.23.d: "Ганс Хюттиг шёл по периметру лагеря, погромыхивая своей имперской саблей по трёхметровому забору из колючей проволоки. Он совершал свой дважды в месяц объезд многочисленных трудовых лагерей, усеивавших Северную Родезию, и в данный момент инспектировал один из самых прибыльных лагерей в Малави. Пока он бродил по краям забора, продолжая своё жуткое бренчание, он спокойно наблюдал, как туземные работники трудятся над своими разнообразными рутинными задачами. Десятки мужчин находились на залитом грязью центральном дворе, разбивая камни, рубя дрова или копошась над какой-то другой трудоёмкой деятельностью. Внезапно Хюттиг остановился как вкопанный и прищурился на одного из рабочих. Измученный заключённый был пожилым, но благородным на вид мужчиной, возможно, пользовавшимся уважением среди своего народа до его интернирования в лагерь. Он изо всех сил пытался поднять тачку, которую пытался протолкнуть через грязь, и рухнул от изнеможения на глазах у Хюттига, пока другие работники бросились на помощь старейшине. Увидев это, Хюттиг тихо вытащил маленькую чёрную книжку из одного из карманов своей униформы и быстро записал номер, который был выжжен на спине слабеющего рабочего. В книге были сотни перечисленных номеров, и все, кроме нескольких самых последних записей, были вычеркнуты красными чернилами. Пока он записывал серийный номер мужчины, по лицу Хюттига промелькнула ехидная улыбка, в то время как многие рабочие смотрели на него в ответ. Закончив, Хюттиг убрал книгу и снова начал прогулку, снова вытащив саблю, чтобы продолжать тащить её вдоль забора; её непрекращающийся шум громко звенел в неподвижном воздухе. Хюттиг добьётся максимальной эффективности в своих лагерях; альтернативы не было."
nrho.23.a: "Труд приносит цивилизацию."

nrho.24.t: "Одержимость Бэринга"
nrho.24.d: "Эвелин Бэринг с гневом ударил по столу, закончив читать последнюю телеграмму, доставленную в его офис. Сообщение содержало очередной отказ от англосских колоний Миттельафрики, отвергающих призыв Бэринга к войне. Молодой генерал-губернатор Северной Родезии мечтал о возвращении славной Британской империи прошлого и надеялся, что именно он и его Лига единой империи станут теми, кто поведёт возвращение. Однако его «друзья» смотрели на это иначе. Различные англосские администрации и группы, разбросанные по этому обширному континенту, такие как в Кении, Нигерии или Южной Африке, считали, что прямая полномасштабная война против гуннов была бы самоубийственной, и справедливо. Хватка кайзера на Тёмном континенте была сильна, и чтобы вытеснить германскую скверну, потребовалось бы чудо или полный крах немецкой системы. Тем не менее Бэринг настаивал, отправляя письмо за письмом и постоянные телеграммы этим потенциальным братьям по оружию, умоляя их взяться за оружие против сил кайзера. Хотя он не остановится, пока они не согласятся, Бэрингу, возможно, придётся подождать более благоприятного времени, чтобы его потенциальные союзники согласились на его крестовый поход."
nrho.24.a: "Посылайте взятки, трофеи, что угодно! Мы должны убедить наших братьев поднять оружие против гуннов!"

nrho.25.t: "Победа на границе"
nrho.25.d: "После столкновения между [ZIM.GetAdjective]ие силами и [ZAM.GetAdjective] в приграничной зоне, силы [ROOT.GetAdjective], по сообщениям, находятся в полном отступлении. [ROOT.GetAdjective]ие подразделения заняли ряд стратегических высот в этом районе и начали укреплять свои позиции."
nrho.25.a: "Мы - превосходная Родезия!"

nrho.26.t: "Поражение на границе"
nrho.26.d: "После столкновения между [ZIM.GetAdjective]ие силами и в [ZAM.GetAdjective]ой приграничной зоне, наш посол запросил прекращение огня.\n\nНесколько [FROM.GetAdjective]их атак на [ROOT.GetAdjective]ие позиции провалились с тяжёлыми потерями во время битвы, что вызвало обеспокоенность в [ROOT.GetAdjective]ом военном руководстве относительно возможностей наших сил."
nrho.26.a: "По крайней мере, мы получили опыт."

nrho.27.t: "Патовое положение на границе"
nrho.27.d: "Боевые действия между [ZIM.GetAdjective]ие силами и [ZAM.GetAdjective]ой границе прекратились после того, как обе стороны отошли из спорного района для перегруппировки и пополнения запасов. Признавая бесполезность дальнейших наступлений, военное [FROM.GetAdjective]ое руководство запросило прекращение огня и переговоры о фиксации границы."
nrho.27.a: "По крайней мере, мы получили опыт."

nrho.28.t: "Победа в Африке!"
nrho.28.d: "Ужасающая и кровавая кампания по Тёмному континенту, унёсшая тысячи жизней - белых и чёрных, англичан и немцев, - окончена. Силы роялистов Антанты под командованием Эвелина Бэринга теперь стоят победителями над Африкой, и короткий, но жалкий период гуннской тирании над этим континентом подошёл к концу.\nПосовещавшись с британским правительством в [ENT.Capital.GetName], Бэринг объявил, что все завоёванные и освобождённые африканские земли будут объединены в единую Коронную колонию Африки под ответственной и благожелательной администрацией британской короны. Вскоре после этого объявления [ENT.GetLeader] утвердил Бэринга первым генерал-губернатором Африки - объявление, встреченное парадами в английских общинах по всей Африке."
nrho.28.a: "Выносите больше флагов!"

nrho.29.t: "Победа в Африке!"
nrho.29.d: "Война против северо-родезийских роялистов была самой долгой и кровопролитной в истории немецкой колонизации, стоившая тысяч жизней - англичан и немцев, белых и чёрных. Однако теперь этот ад наконец окончен.\nС падением Лусаки и других оплотов Бэринга мы наконец умиротворили Северную Родезию, причём в некоторых районах сообщалось о жёстких репрессиях против английского населения, а немецкое колониальное правление над территорией было оформлено.\nНовости встретили с большим ликованием в Дар-эс-Саламе, а также в Берлине, поскольку мы ясно доказали миру непреходящую силу немецкого колониализма и нашу способность защищать наши законные территории от ирредентистских захватчиков."
nrho.29.a: "Немецкое правление здесь, чтобы остаться!"

nrho.30.t: "Дакарская конференция"
nrho.30.d: "Теперь, когда Антанта стоит победителем над Африкой, мы можем подумать о восстановлении границ, которые континент имел до того, как немецкая мерзость узурпировала наши владения. Хотя это означает, что британская администрация будет восстановлена в бывших британских колониях и недавно аннексированных немецких территориях, это также требует возвращения нашим союзникам земель, которые они потеряли после Великой войны.\nТаким образом, Бэринг пригласил делегатов от Антанты на новую конференцию в Дакаре, Сенегал, где мы начнём новый передел Африки. На практике это, вероятно, будет означать вознаграждение Национальной Франции за поддержку и верность Антанте через возвращение бывших французских земель, включая Камерун и Берег Слоновой Кости."
nrho.30.a: "Приятно иметь с ними дело."

nrho.31.t: "Дакарская конференция"
nrho.31.d: "Теперь, когда силы Антанты под командованием Эвелина Бэринга стоят победителями над Африкой, Бэринг решил восстановить границы, которые континент имел до того, как немецкая мерзость узурпировала наши владения. Поэтому амбициозный молодой лидер созвал конференцию в Дакаре, где представители Антанты наметят новые границы для континента.\nНа практике это означает, что мы сможем использовать своё влияние, чтобы добиться полного возвращения французских колоний, захваченных Германией после Мировой войны, таких как Камерун и Берег Слоновой Кости, которые мы можем реинтегрировать в нашу империю."
nrho.31.a: "Приятно иметь с ними дело."

nrho.32.t: "Дакарская конференция"
nrho.32.d: "Теперь, когда силы Антанты под командованием Эвелина Бэринга стоят победителями над Африкой, Бэринг решил восстановить границы, которые континент имел до того, как немецкая мерзость узурпировала наши владения. Поэтому амбициозный молодой лидер созвал конференцию в Дакаре, где представители Антанты наметят новые границы для континента.\nНа практике это означает, что мы сможем использовать своё влияние, чтобы добиться полного возвращения Бельгийского Конго, которое мы можем реинтегрировать в нашу империю."
nrho.32.a: "Приятно иметь с ними дело."

nrho.33.t: "Африканская помощь"
nrho.33.d: "Поскольку Эвелин Бэринг восстановил британское правление в Африке под эгидой своей Коронной колонии, амбициозный молодой администратор не терял времени даром, полностью посвятив себя Антанте, заявив, что его главный долг - привести Африку в такое состояние, чтобы она могла внести существенный вклад в освобождение Великобритании.\nТаким образом, сегодня на наши берега прибыл первый груз помощи из Африки: деньги, оружие и люди, набранные из английских поселений, - всё направлено на наше благородное дело."
nrho.33.a: "Великий человек, этот Бэринг!"

nrho.34.t: "[ENT.GetLeader] совершает турне по Африке"
nrho.34.d: "Сегодня [ENT.GetLeader] прибыл в Дар-эс-Салам, бывшую столицу немецкой администрации, где сохранился лучший аэропорт континента, чтобы начать своё королевское турне по Африке. Ни один британский монарх не ступал на континент со времён Мировой войны, и поэтому его сегодняшний визит является суровым напоминанием о том, как далеко продвинулись державы Антанты в Африке.\n[ENT.GetLeader] был лично встречен генерал-губернатором Бэрингом, и эти двое мужчин вместе со многими друзьями, дипломатами и приспешниками будут путешествовать по континенту в ближайшие недели, впитывая всю жизнь и страсть африканской природной красоты, её многочисленных заповедников и сафари."
nrho.34.a: "Мы приветствуем его величество."

nrho.35.t: "Судьба немецких коллаборационистов"
nrho.35.d: "Поскольку правительство Бэринга решило депортировать немецких граждан массово, мы должны также рассмотреть судьбу англичан, чьи отношения с Германией во время оккупации наших колоний были слишком сердечными.\nМногие государственные служащие и офицеры, будь то в своих интересах или из желания мира, охотно сотрудничали с немецкими властями, даже если это было во вред их соотечественникам и национальному делу. Теперь, когда эти люди в наших руках, мы должны определить нашу политику по отношению к ним."
nrho.35.a: "Отпустить их, нам нужны их таланты."
nrho.35.b: "Нам не нужны эти предатели."

nrho.36.t: "Африканская вестминстерская система"
nrho.36.d: "По мере дальнейшего укрепления нашего правления над Африкой Коронная колония потребует более когерентного юридического и политического аппарата. С учётом этого Эвелин Бэринг сегодня объявил о создании в Африке Вестминстерской системы - избираемого парламента, обладающего юридической властью.\nКак и в Великобритании, выборы по умолчанию будут проводиться каждые пять лет, но могут быть назначены досрочно, если действующий премьер-министр того пожелает. Однако голосовать могут только белые английские граждане, и как представитель британской короны генерал-губернатор, а именно сам Бэринг, сохранит за собой исполнительную власть."
nrho.36.a: "Я люблю демократию."

nrho.37.t: "Туземные протесты"
nrho.37.d: "Наша отмена туземных титулов по всему континенту не очень хорошо воспринята туземцами: тысячи людей теперь протестуют по всей колонии, требуя восстановления системы протекторатов, формальных титулов и местной автономии.\nВ обычное время Бэринг не колеблясь раздавил бы такие мятежные дела как можно быстрее, но, учитывая нестабильность ситуации и масштабы народного гнева, многие в правительстве призывают к сдержанности."
nrho.37.a: "Со временем они выдохнутся."
nrho.37.b: "Не рисковать с этими мятежниками."

nrho.38.t: "Стимулирование поселения"
nrho.38.d: "Поскольку Бэринг обязался сделать Африку желанным местом для британских офицеров и администраторов, чьи таланты нам крайне необходимы, он должен найти способ сделать наши недавно завоёванные и нестабильные территории привлекательными для британских изгнанников.\nОдно из предложений - предлагать бесплатные участки земли любому британскому гражданину, желающему поселиться, при необходимости удаляя туземцев с этой земли. С другой стороны, некоторые считают, что более простое предложение высокой зарплаты было бы более привлекательным. Между тем есть те, кто утверждает, что лучший способ привлечь поселенцев - пообещать закрывать глаза на коррупцию и злоупотребления, если наше собственное правительство не находится под угрозой."
nrho.38.a: "Дать каждому поселенцу бесплатную землю."
nrho.38.b: "Высокая зарплата привлечёт их."
nrho.38.c: "Относиться к коррупции более снисходительно."

nrho.39.t: "Речь Бэринга"
nrho.39.d: "Когда Африка наконец умиротворена, а британское правление почти не оспаривается, Эвелин Бэринг сегодня обратился к большой толпе поселенцев, собравшихся в Лусаке, чтобы услышать героя африканского отвоевания. Бэринг поздравил их с их неизменной преданностью британской нации и её цивилизаторской миссии в Африке и пообещал, что пока он у руля континента, он никогда не предаст их интересы.\nОднако генерал-губернатор призвал внимание своей аудитории к делам в Европе, в частности на родине, в Великобритании. Напомнив толпе о красной тирании, которой миллионы добрых англичан - включая многих их родственников - подвергаются ежедневно, Бэринг объявил, что миссия Коронной колонии ещё не окончена, и он не успокоится, пока «Юнион Джек» снова гордо не зареет над Лондоном."
nrho.39.a: "Ура!"

nrho.40.t: "Северная Родезия побеждена"
nrho.40.d: "Наша авантюра с восстанием после краха Миттельафрики триумфально окупилась, и немецкие тираны в Лусаке разгромлены. Бэринг теперь стоит победителем над Северной Родезией и теперь сталкивается с задачей умиротворения колонии с помощью Антанты, одновременно готовясь к возвращению остальной части империи."
nrho.40.a: "Ура!"

nrho.41.t: "Победа на границе"
nrho.41.d: "После столкновения между [ZIM.GetAdjective]ие силами и [ZAM.GetAdjective] в приграничной зоне, силы [ROOT.GetAdjective], по сообщениям, находятся в полном отступлении. [ROOT.GetAdjective]ие подразделения заняли ряд стратегических высот в этом районе и начали укреплять свои позиции."
nrho.41.a: "Мы - превосходная Родезия!"

nrho.42.t: "Поражение на границе"
nrho.42.d: "После столкновения между [ZIM.GetAdjective]ие силами и [ZAM.GetAdjective] в приграничной зоне, наш посол запросил прекращение огня.\n\nНесколько [FROM.GetAdjective]их атак на [ROOT.GetAdjective]ие позиции провалились с тяжёлыми потерями во время битвы, что вызвало обеспокоенность в военном руководстве [ROOT.GetAdjective] относительно возможностей наших сил."
nrho.42.a: "По крайней мере, мы получили опыт."

nrho.43.t: "Патовое положение на границе"
nrho.43.d: "Боевые действия между [ZIM.GetAdjective]ие силами и [ZAM.GetAdjective] на границе прекратились после того, как обе стороны отошли из спорного района для перегруппировки и пополнения запасов. Признавая бесполезность дальнейших наступлений, [FROM.GetAdjective]ое военное руководство запросило прекращение огня и переговоры о фиксации границы."
nrho.43.a: "По крайней мере, мы получили опыт."

