ZAM_epic_battle_with_maf_tt: "§RГодами Орёл сидел на севере, замышляя погасить последний свет - британское правление в Африке. Гунны больше не будут строить козни. Мерзость, носящая имя «Миттельафрика», больше не будет угрожать нам.\n\nФинальная битва за душу Африки начинается...§!"
