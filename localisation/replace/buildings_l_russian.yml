l_russian:

landmark_statue_of_liberty: "Статуя Свободы"
landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
landmark_statue_of_liberty_desc: "§LКолоссальная статуя Свободы гордо возвышается в нью-йоркской гавани, которая является основным пунктом въезда в Соединенные Штаты для иммигрантов, желающих начать новую жизнь. Впоследствии она стала олицетворением американского духа жизни, свободы и стремления к счастью.§!"
landmark_big_ben: "Биг-Бен"
landmark_big_ben_plural: "$landmark_big_ben$"
landmark_big_ben_desc: "§LВестминстерская башня с часами, более известная как Биг Бен, является символом британской культуры. Она была построена в 1859 году в стиле неоготики и является третьей по высоте башней на Британских островах.§!"
landmark_colosseum: "Колизей"
landmark_colosseum_plural: "$landmark_colosseum$"
landmark_colosseum_desc: "§LКолизей расположен в центре Рима. Это самый большой древний амфитеатр, когда-либо построенный, который использовался римлянами и жителями города после падения Рима для развлечений с момента его завершения императором Титом.§!"
landmark_cristo_redentor: "Статуя Христа-Искупителя"
landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
landmark_cristo_redentor_desc: "§LХристос-Искупитель возвышается над Рио-де-Жанейро, его строительство было завершено в 1931 году. Он является национальным символом Бразилии и имеет большое значение для католиков этого региона.§!"
landmark_eiffel_tower: "Эйфелева башня"
landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
landmark_eiffel_tower_desc: "§LЭйфелева башня названа в честь её создателя Гюстава Эйфеля и была построена в 1889 году. Расположенная на Марсовом поле в Париже, «Железная леди» стала глобальной культурной иконой Франции и символом национальной гордости.§!"
landmark_kremlin: "Московский Кремль"
landmark_kremlin_plural: "$landmark_kremlin$"
landmark_kremlin_desc: "§LМосковский Кремль - это укреплённый комплекс. Внутри комплекса находится Большой Кремлевский дворец, бывшая императорская резиденция русского императора и нынешняя резиденция российского парламента. Кремль выходит на реку Москву на юге, собор Василия Блаженного и Красную площадь на востоке и Александровский сад на западе.§!"
landmark_berlin_reichstag: "Рейхстаг"
landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
landmark_berlin_reichstag_desc: "§LПленарный зал Рейхстага, также известный как Рейхстаг, - это историческое здание законодательного органа власти, расположенное на площади Кёнигсплац в Берлине. Это символическое здание, которое занимает важное место в сердцах и умах людей.§!"
landmark_hofburg_palace: "Хофбург"
landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
landmark_hofburg_palace_desc: "§LХофбург - главный императорский дворец династии Габсбургов, выходящий на площадь Гельденплац, Фольксгартен, а за ним - на здание парламента и мэрию Вены. Окруженный множеством парков, он является сердцем Габсбургской монархии.§!"
landmark_sadabad_complex: "Саадабадский комплекс"
landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
landmark_sadabad_complex_desc: "§LПостроенный династией Каджар, комплекс Садабад в северной части Тегерана служит Королевской резиденцией и резиденцией власти. Его дворцы и сады отражают меняющийся политический ландшафт Персии, от консерватизма до модернизма.§!"
landmark_taj_mahal: "Тадж-Махал"
landmark_taj_mahal_plural: "$landmark_taj_mahal$"
landmark_taj_mahal_desc: "§LТадж-Махал является шедевром архитектуры эпохи Великих Моголов. Его величественные белые мраморные купола и сложные сады делают его одним из самых знаковых символов Индии, свидетельствуя как о могуществе империи, так и о её непреходящем наследии.§!"
landmark_hagia_sophia: "Айя-София"
landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
landmark_hagia_sophia_desc: "§LРасположенная на перекрестке империй, собор Святой Софии был византийским собором, османской мечетью и символом постоянно меняющихся правителей Константинополя. её массивный купол и величественные залы отражают как её духовное значение, так и амбиции тех, кто считал город своим.§!"
landmark_forbidden_city: "Запретный город"
landmark_forbidden_city_plural: "$landmark_forbidden_city$"
landmark_forbidden_city_desc: "§LКак древняя резиденция власти династии Мин, Запретный город является символом долгой истории Китая, гармонии и процветания. Сегодня сокровища и артефакты внутри спрятаны из страха перед новой японской инвазией...§!"
landmark_nanjing_presidential_palace: "Нанкинский президентский дворец"
landmark_nanjing_presidential_palace_desc: "§LПрезидентский дворец в Нанкине - древний, престижный комплекс, где после падения династии Цин был инаугурирован великий Сунь Ятсен.§!"
landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
landmark_great_wall_section: "Великая китайская стена"
landmark_great_wall_section_desc: "§LВеликая стена, строившаяся сотни лет при десятках правительств, является логистическим шедевром. Сегодня она символизирует храбрость и стойкость китайского народа перед лицом невзгод.§!"
landmark_great_wall_section_plural: "$landmark_great_wall_section$"
landmark_tokyo_imperial_palace: "Императорский дворец"
landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
landmark_tokyo_imperial_palace_desc: "§LТокийский Императорский дворец - основная резиденция Императора с эпохи реставрации Мэйдзи и свержения последнего сёгуна. Символ гордости и почитания для японского народа, вдохновляющий их на труд и преданность.§!"
landmark_hakko_ichiu: "Монумент Хакко итиу"
landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
landmark_hakko_ichiu_desc: "§LМонумент Хакко итиу была возведена в честь 2600-й годовщины основания Японии и как памятник, символизирующий японскую миссию объединить «восемь уголков мира» под одной крышей.§!"
landmark_prague_castle: "Пражский град"
landmark_prague_castle_plural: "$landmark_prague_castle$"
landmark_prague_castle_desc: "§LПражский град является исторической резиденцией королей Богемии и считается крупнейшим целостным замковым комплексом в мире. Его нынешний облик отражает многовековое постепенное расширение. Комплекс включает в себя множество дворцов, внутренних дворов и церковных зданий, главным из которых является собор Святого Вита, крупнейшая церковь Чехии, строительство которой было завершено в 1926 году после длительной и прерывистой истории строительства.§!"
landmark_bojnice_castle: "Бойницкий замок"
landmark_bojnice_castle_plural: "$landmark_bojnice_castle$"
landmark_bojnice_castle_desc: "§LБойницкий замок - историческая резиденция венгерских королей и магнатов, расположенная в высокогорье Карпат. Его нынешний вид во многом является результатом реконструкции 19-го века в романтическом историцистском стиле под руководством графа Яноша Палффи. После его смерти в 1908 году поместье и его коллекции перешли в государственную собственность, а к 1910 году замок был открыт как музей.§!"
landmark_white_house: "Белый дом"
landmark_white_house_plural: "$landmark_white_house$"
landmark_white_house_desc: "§LБелый дом является резиденцией президента США. Расположенный в округе Колумбия, Белый дом стал символом республики с момента своего завершения в 1800 году.§!"
landmark_winter_palace: "Зимний дворец"
landmark_winter_palace_plural: "$landmark_winter_palace$"
landmark_winter_palace_desc: "§LВеликолепный дворец в стиле рококо, который до 1917 года служил официальной резиденцией династии Романовых. Расположенный в самом центре Петрограда, дворец был свидетелем многих ключевых событий революций. Одна часть дворца занимает Эрмитажный музей, а остальная часть - обширный административный комплекс. Зимний дворец остаётся символом гордости для всей России.§!"
landmark_christiansborg_palace: "Дворец Кристиансборг"
landmark_christiansborg_palace_plural: "$landmark_christiansborg_palace$"
landmark_christiansborg_palace_desc: "§LДворец Кристиансборг - монументальное здание в стиле необарокко, расположенное на островке Слотсхольмен в самом сердце Копенгагена. Отстроенный после большого пожара 1884 года и завершенный лишь недавно, дворец теперь служит резиденцией датского государства, вмещая Фолькетинг, Верховный суд и канцелярию премьер-министра. Издавна являясь символом королевской власти и управления в Дании, Кристиансборг олицетворяет преемственность датской монархии и конституционных традиций.§!"
landmark_arc_de_triomphe: "Триумфальная арка"
landmark_arc_de_triomphe_plural: "$landmark_arc_de_triomphe$"
landmark_arc_de_triomphe_desc: "§LТриумфальная арка - величественный триумфальный монумент, возвышающийся в западной части Елисейских Полей в Париже. Заказанная Наполеоном в честь побед и воинов Франции, она служит свидетельством воинской славы и жертвенности нации. Под ее сводами покоится Могила Неизвестного Солдата - суровое напоминание о Великой войне и ее неизгладимом следе во Французской республике. Триумфальная арка остается мощным символом французского единства и национальной гордости.§!"
landmark_notre_dame: "Собор Парижской Богоматери"
landmark_notre_dame_plural: "$landmark_notre_dame$"
landmark_notre_dame_desc: "§LСобор Парижской Богоматери - готический собор, возвышающийся на острове Сите в историческом сердце Парижа. Строившийся на протяжении столетий, он был свидетелем коронаций, революций и духовной жизни Франции. Известный своими устремленными ввысь башнями, огромными окнами-розами и звонкими колоколами, собор переживает потрясения прошлых десятилетий как свидетель веры и истории Франции.§!"
landmark_brandenburg_gate: "Бранденбургские ворота"
landmark_brandenburg_gate_plural: "$landmark_brandenburg_gate$"
landmark_brandenburg_gate_desc: "§LБранденбургские ворота - величественный неоклассический монумент в самом центре Берлина. Возведенные в конце восемнадцатого века как символ мира, они с тех пор стали главной эмблемой Прусского, а затем и Германского государства. Под властью Кайзера ворота наблюдают за парадами, церемониями и гражданской жизнью в столице современной Германии, воплощая как имперские традиции, так и единство немецкой нации.§!"
landmark_cologne_cathedral: "Кёльнский собор"
landmark_cologne_cathedral_plural: "$landmark_cologne_cathedral$"
landmark_cologne_cathedral_desc: "§LКёльнский собор - возвышающийся готический шедевр, доминирующий над горизонтом рейнского города Кёльна. Начатый в Средние века и завершенный в девятнадцатом столетии, его две башни-близнеца и огромный интерьер отражают столетия немецкого мастерства и преданности. Издавна будучи местом паломничества и национальной гордости, собор стоит как символ веры, стойкости и непреходящего культурного наследия Германии.§!"
landmark_leaning_tower_of_pisa: "Пизанская башня"
landmark_leaning_tower_of_pisa_plural: "$landmark_leaning_tower_of_pisa$"
landmark_leaning_tower_of_pisa_desc: "§LПизанская башня - самобытная романская колокольня, возвышающаяся на Площади Чудес. Построенная в Средние века, ее непреднамеренный наклон сделал ее одной из самых узнаваемых достопримечательностей Италии. Стоя рядом с собором, которому она должна была служить, башня является свидетельством итальянской изобретательности, настойчивости и непреходящего наследия исторических городов-государств полуострова.§!"
landmark_saint_basils_cathedral: "Собор Василия Блаженного"
landmark_saint_basils_cathedral_plural: "$landmark_saint_basils_cathedral$"
landmark_saint_basils_cathedral_desc: "§LСобор Василия Блаженного возвышается на Красной площади в Москве, его яркие луковичные купола и узорчатая кирпичная кладка создают внушительный образ рядом с Кремлем. Некогда заказанный Иваном IV в ознаменование завоевания Казани, он теперь находится под бдительной опекой российского государства, являясь реликвией царской власти, которая продолжает быть свидетелем жизни горожан. В его приделах сохраняются отголоски веков богослужений, что делает здание свидетельством истории и духовной традиции России.§!"
landmark_capitol: "Капитолий"
landmark_capitol_plural: "$landmark_capitol$"
landmark_capitol_desc: "§LКапитолий Соединенных Штатов величественно возвышается на Капитолийском холме в Вашингтоне, округ Колумбия, являясь местом заседаний Конгресса страны. Начатый в конце восемнадцатого века и завершенный в ходе последовательных расширений, он был ареной законодательных дебатов и политических перемен. Его купол, залы и величественные лестницы знаменуют его как центр политической жизни и конституционного порядка Соединенных Штатов.§!"
landmark_washington_monument: "Монумент Вашингтону"
landmark_washington_monument_plural: "$landmark_washington_monument$"
landmark_washington_monument_desc: "§LМонумент Вашингтону - возвышающийся обелиск на Национальной аллее в Вашингтоне, округ Колумбия, воздвигнутый в честь Джорджа Вашингтона, первого президента страны. Завершенный в 1888 году после десятилетий прерванного строительства, он был свидетелем роста столицы и гражданской жизни республики. Его строгая высота и внушительное присутствие знаменуют его как непреходящий памятник американскому лидерству и национальной памяти.§!"
landmark_pentagon: "Пентагон"
landmark_pentagon_plural: "$landmark_pentagon$"
landmark_pentagon_desc: "§LПентагон - огромная пятиугольная штаб-квартира Военного министерства США на окраине Вашингтона, округ Колумбия. Спроектированный для централизации военного управления и консолидации оборонных операций страны, это сооружение воплощает современную инженерию и организационную мощь американских вооруженных сил. Он служит свидетельством готовности страны и национальной решимости.§!"
landmark_empire_state_building: "Эмпайр-стейт-билдинг"
landmark_empire_state_building_plural: "$landmark_empire_state_building$"
landmark_empire_state_building_desc: "§LЭмпайр-стейт-билдинг возвышается над Манхэттеном как величественный символ амбиций Нью-Йорка. Завершенный в 1931 году, он является самым высоким рукотворным сооружением в мире. Его фасад в стиле ар-деко и шпиль теперь определяют горизонт города, стоя как памятник американской индустрии, предприимчивости и быстрому росту современного мегаполиса.§!"
landmark_boulder_dam: "Плотина Боулдер"
landmark_boulder_dam_plural: "$landmark_boulder_dam$"
landmark_boulder_dam_desc: "§LПлотина Боулдер перекрывает реку Колорадо на границе Аризоны и Невады, являясь огромным бетонным сооружением, завершенным в начале 1930-х годов. Построенная для контроля наводнений, обеспечения ирригации и выработки электроэнергии, она преобразила окружающий регион. Ее масштаб и инженерная мысль изменили окружающий регион, демонстрируя промышленный потенциал нации и ее способность управлять природной средой.§!"
landmark_golden_gate_bridge: "Мост Золотые Ворота"
landmark_golden_gate_bridge_plural: "$landmark_golden_gate_bridge$"
landmark_golden_gate_bridge_desc: "§LМост Золотые Ворота пересекает вход в залив Сан-Франциско, являясь смелым висячим мостом, соединяющим город с округом Марин. Его башни и плавные тросы создают одно из самых длинных и впечатляющих пересечений в мире. Мост служит свидетельством американского инженерного гения, амбиций и мастерства в современной инфраструктуре.§!"
landmark_hollywood_sign: "Знак Голливудленд"
landmark_hollywood_sign_plural: "$landmark_hollywood_sign$"
landmark_hollywood_sign_desc: "§LЗнак Голливудленд возвышается на холмах над Лос-Анджелесом, его большие белые буквы рекламируют жилой комплекс и отмечают растущий район. Установленный в 1923 году, он стал заметной чертой городского пейзажа. Видимый из окрестностей, знак стал тесно ассоциироваться с киноиндустрией и стремительным расширением Лос-Анджелеса.§!"
landmark_chichen_itza: "Чичен-Ица"
landmark_chichen_itza_plural: "$landmark_chichen_itza$"
landmark_chichen_itza_desc: "§LЧичен-Ица возвышается на полуострове Юкатан как остатки великого города майя, его пирамиды, храмы и площадки для игры в мяч отражают столетия доколумбовой цивилизации. В последние годы американские археологи и ученые предприняли обширные исследования и усилия по сохранению, привлекая к этому месту более широкое внимание. Руины свидетельствуют как об изобретательности цивилизации майя, так и о растущей роли Соединенных Штатов в изучении и сохранении древних культур Америки.§!"
landmark_moai: "Моаи"
landmark_moai_plural: "$landmark_moai$"
landmark_moai_desc: "§LСтатуи моаи острова Пасхи возвышаются вдоль берегов и хребтов острова, их массивные каменные формы были созданы народом Рапа-Нуи много веков назад. Находясь под управлением Чили с конца девятнадцатого века, статуи привлекли внимание ученых и посетителей. Они остаются безмолвными свидетелями изобретательности и культуры исконных жителей острова, отмечая отдаленный уголок Тихого океана, издавна сформированный человеческими руками.§!"
landmark_shwedagon_pagoda: "Пагода Шведагон"
landmark_shwedagon_pagoda_plural: "$landmark_shwedagon_pagoda$"
landmark_shwedagon_pagoda_desc: "§LПагода Шведагон возвышается на склонах холма Шведагон в Янгоне, Бирма, и является одним из самых священных буддийских мест в стране. Ее золотой шпиль и древняя архитектура отражают столетия преданности и культурного наследия. Пагода продолжает привлекать паломников и посетителей со всей Азии, символизируя непреходящее духовное значение бирманских буддийских традиций.§!"
landmark_himeji_castle: "Замок Химэдзи"
landmark_himeji_castle_plural: "$landmark_himeji_castle$"
landmark_himeji_castle_desc: "§LЗамок Химэдзи возвышается над городом Химэдзи и является одной из наиболее хорошо сохранившихся феодальных крепостей Японии. Завершенный в начале семнадцатого века, его оштукатуренные белые стены, многоуровневая оборона и возвышающийся донжон являются образцом военной архитектуры эпохи Токугава. Пережив гражданские войны, реставрацию и модернизацию, замок продолжает отражать воинские традиции и имперское прошлое Японии.§!"
landmark_okayama_castle: "Замок Окаяма"
landmark_okayama_castle_plural: "$landmark_okayama_castle$"
landmark_okayama_castle_desc: "§LЗамок Окаяма стоит на реке Асахи, его темный внешний вид и внушительный донжон отличают его от других японских крепостей. Построенный в конце шестнадцатого века, он служил региональным центром власти в периоды Сэнгоку и раннего Токугава. Сегодня сооружение напоминает о власти местных владений и наследии самурайского сословия.§!"
landmark_wat_arun: "Ват Арун"
landmark_wat_arun_plural: "$landmark_wat_arun$"
landmark_wat_arun_desc: "§LВат Арун расположен на западном берегу реки Чаупхрая в Бангкоке и является одним из самых узнаваемых религиозных мест Сиама. Центром комплекса является его возвышающийся пранг, храмовый комплекс демонстрирует сильное кхмерское влияние и давние буддийские традиции. Тесно связанный с династией Чакри и столицей, Ват Арун продолжает символизировать тесные узы между верой, монархией и сиамским государством.§!"
landmark_kaaba: "Кааба"
landmark_kaaba_plural: "$landmark_kaaba$"
landmark_kaaba_desc: "§LВ центре Заповедной мечети в Мекке возвышается Кааба - главная святыня ислама. Ее структура, покрытая черной тканью, на протяжении веков определяла направление молитвы и паломничества мусульман. Перестраиваемая и поддерживаемая на протяжении многих поколений, Кааба продолжает формировать духовную жизнь исламского мира и утверждает главенство Мекки как священного города.§!"
landmark_pyramids_of_giza: "Пирамиды Гизы"
landmark_pyramids_of_giza_plural: "$landmark_pyramids_of_giza$"
landmark_pyramids_of_giza_desc: "§LНа пустынном плато к западу от Каира пирамиды Гизы доминируют над ландшафтом как монументальные гробницы древних фараонов Египта. Построенные в эпоху Древнего царства, их огромные масштабы и точная работа свидетельствуют об организации и власти ранней египетской цивилизации. Предшествуя современному государству на тысячелетия, пирамиды стоят как непреходящие памятники человеческим амбициям и изобретательности.§!"