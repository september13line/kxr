### Decisions ###
VEN_COL_intervention_decisions: "Интервенция в Колумбию"
VEN_COL_intervention_decisions_desc: ""
VEN_COL_org_exiles: "Организовать колумбийских изгнанников"
VEN_COL_org_exiles_desc: ""
VEN_COL_intervene: "Освободить Колумбию"
VEN_COL_intervene_desc: ""

VEN_essequibo_decisions: "Возвращение Гуаяны-Эссекибо"
VEN_essequibo_decisions_desc: "Со времён кризиса 1895 года Венесуэла и Британская империя (или то, что от неё осталось) спорят о регионе Эссекибо, который в настоящее время является частью Британской Гвианы. Теперь, когда Федерация Вест-Индии отвлечена другой войной, у нас есть возможность отстаивать наши законные претензии на этот регион."
VEN_demand_essequibo: "Потребовать Эссекибо"
VEN_demand_essequibo_desc: "Пока англосы отвлечены, у нас есть шанс всей жизни вернуть наши потерянные земли к западу от реки Эссекибо."
VEN_peace_essequibo_start: "Просить мира с [CAF.GetNameDef]"
VEN_peace_essequibo_start_desc: "Мы контролируем всю Гайану, и наши военные цели достигнуты. Пришло время закончить эту войну, пока вся мощь Вест-Индского альянса не обрушилась на нашу бедную страну."
VEN_peace_essequibo_timer: "Просить мира с [CAF.GetNameDef]"
VEN_peace_essequibo_timer_desc: "Мы контролируем всю Гайану, и наши военные цели достигнуты. Пришло время закончить эту войну, пока вся мощь Вест-Индского альянса не обрушилась на нашу бедную страну."

VEN_GCL_decisions: "Боливарианская мечта"
VEN_GCL_decisions_desc: "Поскольку мы освободили Колумбию от её незаконного режима и наша армия оккупирует её, у нас есть шанс возродить наследие Симона Боливара: Великую Колумбию. Хотя бывшая Республика Колумбия, которая когда-то охватывала современные Колумбию, Венесуэлу, Эквадор и Панаму, потерпела неудачу более века назад, и существует серьёзное сопротивление нашей оккупации, наше руководство готово приложить серьёзные усилия для развития и возрождения великолумбийского единства."
VEN_secure_bogota: "Обеспечение Боготы"
VEN_secure_bogota_desc: "Богота была столицей Великой Колумбии, когда она была объединена в XIX веке. В центре союза крайне важно обеспечить город, чтобы узаконить наше правление."
VEN_secure_caribe: "Обеспечение Карибского региона"
VEN_secure_caribe_desc: "Карибский регион - это область Колумбии, граничащая с атлантическим побережьем страны и северной частью Анд. Он густо населён, что делает его важным местом для обеспечения."
VEN_secure_meta: "Обеспечение Меты"
VEN_secure_meta_desc: "Равнины вокруг реки Мета почти чужды большинству колумбийцев. Тем не менее, это большая, малонаселённая территория, где могут скрываться диссиденты."
VEN_secure_choco: "Обеспечение Чоко"
VEN_secure_choco_desc: "Тихоокеанское побережье Колумбии - очень разнообразный регион, северная половина которого в основном тропическая. Обеспечить его будет сложно, но необходимо."
VEN_secure_cauca: "Обеспечение Кауки"
VEN_secure_cauca_desc: "Южная половина Тихоокеанского региона, в основном департамент Каука, находится под властью Анд, и мы все знаем, как легко в них спрятаться."
VEN_secure_amazonia: "Обеспечение Амазонии"
VEN_secure_amazonia_desc: "Амазония, очевидно, покрыта тропическими лесами. Это чрезвычайно сложная местность, и обеспечение региона проверит наше мастерство в джунглевой войне."
VEN_bolivars_boner: "Провозгласить Великую Колумбию"
VEN_bolivars_boner_desc: "Хотя Республика Колумбия, возможно, и не смогла сохранить мечту Боливара о единой Испанской Америке, мы преуспели в восстановлении его наследия. Мы создаём нечто большее, извлекая уроки из столетия ошибок: Великую Колумбию."

VEN_oil_decisions: "Взаимодействие с иностранными нефтяными компаниями"
VEN_oil_decisions_desc: "Подавляющее большинство нефтяной промышленности Венесуэлы находится в руках иностранных компаний, таких как Shell и преемников Standard Oil. Их влияние в стране огромно и приносит как пользу, так и вред нашей экономике, но мы могли бы ограничить негативные аспекты, приобретая большую долю в этих компаниях... Или мы могли бы просто конфисковать их, если представится возможность."
VEN_oil_USA_buy: "Доли в американских нефтяных компаниях"
VEN_oil_USA_buy_desc: "Янки-компании, такие как различные преемники гигантской Standard Oil и Texaco, контролируют огромные объёмы нефтяных месторождений и производственных центров нашей страны. Приобретение большей доли в этих компаниях будет дорогостоящим предприятием, которое, будем надеяться, принесёт нам прибыль в долгосрочной перспективе и уменьшит их влияние в Венесуэле."
VEN_oil_USA_seize: "Конфисковать активы янки!"
VEN_oil_USA_seize_desc: "Теперь, когда янки заняты перестрелками друг с другом по идиотским причинам, у нас есть прекрасная возможность... приобрести ряд активов, принадлежащих американским нефтяным компаниям, если они откажутся играть по нашим новым правилам. Это, безусловно, разозлит США, но что они могут сделать?"
VEN_oil_HOL_buy: "Доли в местных активах Shell"
VEN_oil_HOL_buy_desc: "Royal Dutch Shell была одной из первых компаний, получивших концессии в Венесуэле. Теперь, когда наша экономика может позволить себе такую операцию, мы можем приобрести большую долю так называемой Shell de Venezuela, уменьшив влияние голландской компании в стране."
VEN_oil_HOL_seize: "Конфисковать активы Shell!"
VEN_oil_HOL_seize_desc: "Поскольку в Нидерландах происходит синдикалистская революция, у нас есть шанс захватить активы Shell в стране и уменьшить их мощь и влияние в Венесуэле. Голландцы сейчас точно не смогут нам помешать."

VEN_alliance_decisions: "На мировую сцену"
VEN_alliance_decisions_desc: "Венесуэла всегда была вынуждена течениями истории оставаться в стороне, быть целью иностранного вмешательства и империализма. Больше нет! Мы будем усиливать себя дипломатически и стремиться вступить в любой союз, необходимый для защиты нашей свободы."
VEN_join_internationale: "Вступить в Интернационал"
VEN_join_internationale_desc: "Поскольку наша мирная революция обеспечена внутри, мы должны обеспечить её и снаружи. Пришло время революционной Венесуэле присоединиться к братству свободных рабочих. Давайте немедленно свяжемся с [INT.GetNameDef]."
VEN_join_entente: "Вступить в Антанту"
VEN_join_entente_desc: "Поскольку наша страна находится в состоянии войны с синдикалистами Третьего интернационала, мы должны объединиться с Антантой. Они могут защитить нас в Карибском бассейне и имеют лучшие шансы победить французскую и британскую угрозу."
VEN_join_USA: "Встать на сторону американцев"
VEN_join_USA_desc: "Теперь, когда наше правительство было спасено от синдикалистской угрозы американской помощью, мы должны отблагодарить их за хлопоты, заключив с ними союз. Вместе мы освободим мир от радикального синдикализма!"

