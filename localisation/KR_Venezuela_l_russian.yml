l_russian:

kleinevenedig_focus: "Venezuela Focus Tree"

### Leaders ###
POLITICS_ROMULO_BETANCOURT_DESC: "Будучи молодым, склонным к громким заявлениям, но умеренным членом широкой коалиции, свергшей диктатора Хуана Висенте Гомеса, избрание Бетанкура привело к расколу в этой коалиции. Бетанкурт предпринимает шаги по укреплению восстановленной демократии в Венесуэле и по отказу от зависимости экономического роста от нефти."

### Ideas ###
VENblackmonday: "Чёрный понедельник бьёт по нефтяным скважинам"
VENblackmonday_desc: "Наша экономика в значительной степени основана на нефти, и многие годы мы пользовались хорошими ценами. Но с крахом Берлинской фондовой биржи спрос резко упал, и наша экономика попала в нисходящую спираль!"
VEN_welfare_expanded1: "Расширенные программы соцобеспечения"
VEN_welfare_expanded1_desc: "Несмотря на экономический спад, правительство расширило свои программы социального обеспечения, чтобы облегчить страдания бедных."
VEN_welfare_expanded2: "Расширенные программы соцобеспечения"
VEN_welfare_expanded2_desc: "Несмотря на экономический спад, правительство расширило свои программы социального обеспечения, чтобы облегчить страдания бедных."
VEN_welfare_expanded3: "Расширенные программы соцобеспечения"
VEN_welfare_expanded3_desc: "Несмотря на экономический спад, правительство расширило свои программы социального обеспечения, чтобы облегчить страдания бедных."
VEN_welfare_cuts_idea: "Сокращение соцобеспечения"
VEN_welfare_cuts_idea_desc: "Меры жёсткой экономии никогда не бывают популярными, но Временное правительство сочло необходимым сократить расходы, включая расточительные программы социального обеспечения страны."
VEN_longter_mplanning: "Долгосрочное экономическое планирование"
VEN_longter_mplanning_desc: "Всегда есть соблазн планировать краткосрочные выгоды, но близорукая политика быстрых достижений может быть катастрофичной. Вместо этого правительство сосредоточилось на создании плана на будущее, который принесёт пользу стране на долгие годы."
VENsafe: "Диверсификация экономики"
VENsafe_desc: "Правительство приложило значительные усилия для диверсификации промышленности страны в надежде создать стабильную и здоровую экономику вместо того, чтобы полагаться на нефтяную промышленность."
VEN_welfare_expanded4: "Расширенные программы соцобеспечения"
VEN_welfare_expanded4_desc: "По мере того как экономика восстанавливалась и снова начинала устойчиво расти, правительство продолжало инвестировать в свои программы социального обеспечения."
VEN_welfare_expanded5: "Расширенные программы соцобеспечения"
VEN_welfare_expanded5_desc: "По мере того как экономика восстанавливалась и снова начинала устойчиво расти, правительство продолжало инвестировать в свои программы социального обеспечения."
VEN_welfare_state: "Государство всеобщего благосостояния"
VEN_welfare_state_desc: "Благодаря усилиям правительства Венесуэла стала государством всеобщего благосостояния на уровне современной развитой нации."
VEN_oil_reforms: "Реформы нефтяной промышленности"
VEN_oil_reforms_desc: "Правительство провело несколько реформ в нефтяной промышленности в надежде сохранить большую часть её богатства внутри Венесуэлы."
VEN_nationalist_fervour1: "Националистический пыл"
VEN_nationalist_fervour1_desc: "Социалистические демагоги пытались посеять недовольство среди нашего населения, делая акцент на классовой борьбе. В ответ правительство сосредотачивается на преодолении социального разрыва и создании атмосферы сотрудничества между социальными классами ради блага Венесуэлы."
VEN_nationalist_fervour2: "Националистический пыл"
VEN_nationalist_fervour2_desc: "За хлеб, Отечество и Свободу! Девиз URD - это сильный символ идеалов и целей правительства, сосредоточенных на процветании нации, патриотизме и гражданских свободах."
VEN_nationalist_fervour3: "Националистический пыл"
VEN_nationalist_fervour3_desc: "Бог и Федерация. Правительство культивирует националистический пыл с момента своего избрания, делая большой упор на патриотизм и национальное процветание."
VEN_booming_economy: "Бурлящая экономика"
VEN_booming_economy_desc: "Благодаря политике URD экономика Венесуэлы бурно растёт как никогда раньше. Правительство явно выполняет свои предвыборные обещания экономического процветания, и сильная экономика страны станет ярким маяком для Латинской Америки."
VENsupersafe: "Диверсифицированная экономика"
VENsupersafe_desc: "Создание диверсифицированной экономики было основной политикой Acción Democrática с момента её основания. Они в значительной степени преуспели в этом начинании, диверсифицировав промышленность страны, чтобы уменьшить её зависимость от нефтяной промышленности и сделать её более безопасной от глобальных колебаний."
VEN_ctv: "Confederación de Trabajadores de Venezuela"
VEN_ctv_desc: "Конфедерация трудящихся Венесуэлы является главной федерацией профсоюзов в стране, и синдикалистское правительство передало ей значительные полномочия и власть в своей цели превратить Венесуэлу в синдикалистское государство."
VEN_ctv2: "Confederación de Trabajadores de Venezuela"
VEN_ctv2_desc: "Получившая власть CTV добилась демократизации промышленности, передав экономику в руки рабочих вместо буржуазии."
VEN_syndieconomy1: "Синдикализация экономики"
VEN_syndieconomy1_desc: "Революционное правительство сделало первый шаг к преобразованию экономики Венесуэлы в синдикалистскую путём национализации ключевых отраслей промышленности."
VENlandform: "Земельная реформа"
VENlandform_desc: "Часть сельской местности находилась в плачевном состоянии до избрания PCV. Были предприняты значительные шаги по проведению земельных реформ, расширяющих права крестьян и ослабляющих угнетающих помещиков."
VENlandform2: "Коллективизация"
VENlandform2_desc: "Фермы в сельской местности Венесуэлы были коллективизированы, что интегрировало крестьян в синдикалистскую экономику, обеспечило местное продовольственное снабжение страны и гарантировало эффективность сельского хозяйства."
VEN_syndieconomy2: "Пятилетний план"
VEN_syndieconomy2_desc: "PCV, под влиянием тоталистской и авангардистской мысли, запустила Пятилетний план для быстрой индустриализации относительно отсталой страны и достижения ключевой цели на пути к социализму: сильного рабочего класса."
VEN_syndieconomy3: "Быстрая индустриализация"
VEN_syndieconomy3_desc: "Пятилетний план был очень успешным, быстро индустриализировав страну и преобразовав её ранее отстававшую экономику."
VEN_syndieconomy4: "Синдикалистская экономика"
VEN_syndieconomy4_desc: "Венесуэла стала образцовой синдикалистской экономикой в регионе, сделав её сияющим маяком надежды для социалистов во всей Латинской Америке. ¡Proletarios de todos los países, uníos!"
VEN_secret_police: "Seguridad Nacional"
VEN_secret_police_desc: "Dirección de Seguridad Nacional, или Управление национальной безопасности, является главным органом безопасности государства, защищающим нацию от опасных элементов."
VEN_secret_police2: "Seguridad Nacional"
VEN_secret_police2_desc: "Dirección de Seguridad Nacional, или Управление национальной безопасности, стало главным инструментом правительства для подавления инакомыслия, распространения страха среди наших внутренних врагов и защиты наших добропорядочных граждан."
VEN_secret_police3: "Seguridad Nacional"
VEN_secret_police3_desc: "Dirección de Seguridad Nacional, или Управление национальной безопасности, стало эффективной тайной полицией, очищающей и заставляющей замолчать диссидентов, защищающей наш народ и образ жизни."
VEN_US_treaty_idea: "Торговый договор США-Венесуэлы"
VEN_US_treaty_idea_desc: "Соединённые Штаты Америки и Венесуэла подписали новый договор, выгодный для венесуэльской экономики и американских компаний."
VEN_foreign_investors_idea: "Иностранные инвесторы"
VEN_foreign_investors_idea_desc: "Хунта поощряет иностранных инвесторов вкладывать средства в Венесуэлу, а не в другие страны региона, обеспечивая развитие конкурентоспособной экономики."
VEN_foreign_investors_idea2: "Инвестирование нефтяных денег"
VEN_foreign_investors_idea2_desc: "Не секрет, что хунта получила огромную прибыль от растущей нефтяной промышленности, реинвестируя деньги в масштабные строительные проекты, демонстрирующие богатство нации."
VEN_strong: "¡Viva Venezuela!"
VEN_strong_desc: "Президент Перес Хименес убеждён, что Венесуэла становится сильной региональной державой и вскоре станет величайшей в Южной Америке. ¡Viva el Presidente!"
VEN_shock_and_awe_idea: "Шок и трепет"
VEN_shock_and_awe_idea_desc: "Венесуэльская армия остаётся современной, мощной силой, доктрина которой сосредоточена на подавляющей огневой мощи."
VEN_mobile_army_idea: "Современная манёвренная война"
VEN_mobile_army_idea_desc: "Венесуэльская армия остаётся современной, мощной силой, доктрина которой сосредоточена на нанесении сильных и быстрых ударов, оставаясь максимально мобильной."
VEN_modern_navy: "Navegare Necesse, Vivere Non Necesse"
VEN_modern_navy_desc: "Венесуэльский флот был расширен и модернизирован до такой степени, что стал одним из сильнейших в регионе. Не только его корабли современны, но и его моряки и офицеры горды и высоко обучены."
VEN_paying_for_guns: "Оплата заказа на вооружение"
VEN_paying_for_guns_desc: "В настоящее время мы выплачиваем счёт за наш последний заказ на вооружение."
VEN_paid_for_guns: "Оплата экспорта вооружений"
VEN_paid_for_guns_desc: "Нам платят за проданное за границу оружие."
VEN_oil_addiction: "Нефтяная зависимость"
VEN_oil_addiction_desc: "Венесуэла безнадёжно зависима от чёрного золота - нефти. Она является центром экономики страны и источником её богатства. У людей мало стимулов инвестировать в другие отрасли, что делает страну уязвимой для так называемой голландской болезни."
VEN_foreign_oil_companies: "Господство иностранных нефтяных компаний"
VEN_foreign_oil_companies_desc: "Подавляющее большинство нефтяных скважин страны находится в руках иностранных компаний - преемников Standard Oil и Royal Dutch Shell. Часть генерируемого ими богатства никогда не попадёт в руки наших людей."
VEN_foreign_oil_companies_50_to_50: "Господство иностранных нефтяных компаний"
VEN_foreign_oil_companies_50_to_50_desc: "Подавляющее большинство нефтяных скважин страны находится в руках иностранных компаний - преемников Standard Oil и Royal Dutch Shell. Часть генерируемого ими богатства никогда не попадёт в руки наших людей."
VEN_foreign_oil_companies2: "Господство иностранных нефтяных компаний"
VEN_foreign_oil_companies2_desc: "Подавляющее большинство нефтяных скважин страны находится в руках иностранных компаний - преемников Standard Oil и Royal Dutch Shell. Часть генерируемого ими богатства никогда не попадёт в руки наших людей."
VEN_foreign_oil_companies3: "Господство иностранных нефтяных компаний"
VEN_foreign_oil_companies3_desc: "Подавляющее большинство нефтяных скважин страны находится в руках иностранных компаний - преемников Standard Oil и Royal Dutch Shell. Часть генерируемого ими богатства никогда не попадёт в руки наших людей."
VEN_army_dominance: "Влияние военных"
VEN_army_dominance_desc: "Венесуэльские военные на протяжении десятилетий оказывают значительное влияние на политику. В конце концов, они были у власти при «Соме» и именно они свергли его и восстановили демократию. Они - стражи нации и не будут колебаться, если посчитают, что она в опасности."
VEN_paying_for_shares: "Покупка нефтяных активов"
VEN_paying_for_shares_desc: "В настоящее время мы выплачиваем стоимость наших долей в иностранных нефтяных компаниях."
VEN_paid_for_shares: "Платежи от проданных долей"
VEN_paid_for_shares_desc: "Венесуэла приобрела доли в наших нефтяных компаниях."
VEN_integrating_COL: "Интеграция Колумбии"
VEN_integrating_COL_desc: "В настоящее время мы интегрируем недавно захваченные колумбийские территории."

