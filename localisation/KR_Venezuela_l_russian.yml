### Focuses ###
VEN_blackmonday: "Чёрный понедельник бьёт по нефтяным скважинам"
VEN_blackmonday_desc: "¡Dios Mio! Поскольку большая часть нашей внешней торговли приходится на Германию, их экономический кризис неизбежно должен был дойти и до нас. Пока мы должны справляться с немедленными последствиями, поскольку паника распространяется среди жителей Каракаса."

VEN_democracy_prevails: "Демократия торжествует"
VEN_democracy_prevails_desc: "В городах Венесуэлы воцарилось спокойствие. Теперь мы можем сосредоточиться на пути к экономическому восстановлению, особенно потому, что рабочие сильно пострадали от текущего кризиса."
VEN_welfare_program: "Программы социального обеспечения"
VEN_welfare_program_desc: "Было бы ошибкой сокращать социальные выплаты, когда люди нуждаются в них больше всего. Наоборот, мы должны обеспечить, чтобы наши программы социального обеспечения охватывали как можно больше венесуэльцев, пока они уязвимы."
VEN_healthcare_education: "Расширение здравоохранения и образования"
VEN_healthcare_education_desc: "Здравоохранение и образование - самые основные и необходимые институты, предоставляемые государством, и мы должны обеспечить их доступность для народа. Забота о здоровье и образовании нашего народа - лучшее, что мы можем сделать для будущих поколений, поскольку долгосрочные выгоды очевидны даже в эти трудные времена."
VEN_expand_pensions: "Расширение пенсий"
VEN_expand_pensions_desc: "Люди, которые не могут работать, такие как пожилые и инвалиды, являются наиболее уязвимыми во время бедствий. Поэтому, чтобы сохранить стабильность и поддерживать удовлетворённость людей, мы должны расширить пенсионную систему, чтобы больше бедных венесуэльцев могли получить к ней доступ."
VEN_indreseach: "Промышленные инвестиции"
VEN_indreseach_desc: "Как ключевой шаг как для выхода из кризиса, так и для снижения нашей зависимости от нефтяной промышленности, государство должно инвестировать в различные промышленные сектора, обеспечивая их рост и способность нанимать больше людей."
VEN_flexibilty: "Экономическая гибкость"
VEN_flexibilty_desc: "Текущий кризис показал, что мы не можем оставаться зависимыми от нефтяной промышленности. Таким образом, мы должны сделать нашу экономику более гибкой и способной адаптироваться к меняющейся глобальной экономике путём её диверсификации. Это, надеюсь, сделает нашу экономику более сильной и устойчивой к экономическим колебаниям."
VEN_diversification2: "Промышленная диверсификация"
VEN_diversification2_desc: "Диверсификация нашей промышленности - дорогостоящий и медленный процесс, но он гарантирует, что венесуэльская экономика сможет продолжать расти здоровыми темпами, защищённая от рыночных колебаний. Несмотря на стоимость и скорость такого процесса, в долгосрочной перспективе это сделает Венесуэлу гораздо сильнее, чем продолжение нашей зависимости от нефти."

VEN_preventive_coup: "Превентивный переворот"
VEN_preventive_coup_desc: "Поскольку правительство AD не может поддерживать порядок, Венесуэльская армия вмешалась, чтобы восстановить порядок и направить экономику к восстановлению. Это временно, конечно, поскольку Временное правительство настаивает на том, что запланированные выборы 1939 года всё же состоятся."
VEN_defensecontracts: "Оборонные контракты"
VEN_defensecontracts_desc: "Как способ помочь экономике, правительство выдаёт больше контрактов на поставку военным товаров. Это поможет нашему испытывающему трудности мелкому производственному сектору восстановиться и расти, тем самым обеспечивая занятость и обогащая больше венесуэльцев, обеспечивая при этом, чтобы Вооружённые силы оставались хорошо оснащёнными и влиятельными."
VEN_diversification1: "Расширение оружейной промышленности"
VEN_diversification1_desc: "Военная промышленность Венесуэлы, откровенно говоря, крошечная. Особенно по сравнению с размером её армии. Спрос на военные товары, такие как оружие и боеприпасы, может быть искусственным, но он заставляет людей работать, получать зарплату и совершать покупки. Кроме того, поддержание армии в хорошем оснащении поможет избежать повторения их плохих показателей в 1925 году."
VEN_diversification3: "Самообеспеченность армейскими товарами"
VEN_diversification3_desc: "Чем меньше мы зависим от импорта оружия, тем лучше. Особенно когда глобальная ситуация продолжает выходить из-под контроля. Поскольку мы, возможно, не сможем продолжать импортировать, мы могли бы также расширить нашу местную военную промышленность и заместить импорт."
VEN_cut_welfare: "Сокращение социальных выплат"
VEN_cut_welfare_desc: "Поскольку экономика в руинах, мы должны затянуть пояса и сократить расходы. Программы социального обеспечения, введённые предыдущим правительством, являются тяжёлым бременем для наших шатких финансов, вводя нас в долги. Программы должны быть прекращены для балансировки бюджета."
VEN_arrest_syndie_troublemakers: "Арест социалистических смутьянов"
VEN_arrest_syndie_troublemakers_desc: "Опасность потенциальной социалистической революции - вот причина, по которой военные вмешались после Чёрного понедельника. После того как Временное правительство укрепилось, мы получили возможность арестовать ключевых членов социалистического движения в Венесуэле и ослабить их влияние в политике."
VEN_propagandaeffort: "Пропагандистские усилия"
VEN_propagandaeffort_desc: "Хотя наш переворот не был беспрецедентным, он заставил политическую оппозицию, особенно тех, кто ранее был в правительстве, насторожиться из-за эрозии демократических институтов. Мы должны обеспечить, чтобы люди понимали временный характер нашего правительства и что запланированные выборы сохраняются."

VEN_inf: "Аварийные инфраструктурные работы"
VEN_inf_desc: "Как временная мера для возвращения людей к работе, правительство начало программу инфраструктурных работ. Это не только даст оплачиваемую работу безработным, но и улучшит инфраструктурную сеть Венесуэлы, сближая страну."
VEN_milinf: "Строительство аэропортов"
VEN_milinf_desc: "Авиатранспорт стал более распространённым после Мировой войны. Однако наша воздушная инфраструктура сильно отстаёт, и её улучшение поможет развитию наших Военно-воздушных сил и улучшит доступ к более изолированным частям нашей страны."
VEN_inf2: "Обновление инфраструктуры"
VEN_inf2_desc: "Хотя экономика определённо восстанавливается, мы можем сделать ещё многое для улучшения транспортной сети нашей страны. В конце концов, хорошая инфраструктура является ключом к здоровому экономическому развитию."

VEN_healthyeco: "Экономическое восстановление"
VEN_healthyeco_desc: "Венесуэла наконец оправилась от экономического кризиса. Хотя предстоит ещё многое сделать, чтобы страна снова стала процветающей, мы определённо прошли худшую часть кризиса. Теперь мы можем сосредоточить наше внимание на росте нашей экономики и создании процветающей Венесуэлы."

VEN_1939_elections: "Выборы 1939 года"
VEN_1939_elections_desc: "Несмотря на экономический кризис, запланированные выборы всё же состоятся. Acción Democrática попытается выиграть новый срок, но Unión Republicana Democrática имеет хорошие шансы взять верх, сосредоточившись на экономическом процветании и националистической риторике. Однако социалистическая PCV растёт со времён Чёрного понедельника и имеет небольшой шанс на неожиданную победу благодаря своей антикапиталистической риторике."

VEN_AD_stays: "Ещё один срок AD"
VEN_AD_stays_desc: "Без особого удивления партия, представляющая Generación del 26, получила ещё один президентский срок. Они намерены продолжать превращать Венесуэлу в государство всеобщего благосостояния, менее зависимое от нефтяной промышленности."
VEN_longtermplanning: "Долгосрочное экономическое планирование"
VEN_longtermplanning_desc: "Если мы хотим иметь успешную, процветающую экономику, мы должны сосредоточиться на долгосрочных экономических целях, а не на краткосрочных. Это создаст здоровую и стабильную экономику, а не пузырь, который неизбежно лопнет."
VEN_thedutchdisease: "Борьба с голландской болезнью"
VEN_thedutchdisease_desc: "Ни для кого не секрет, что, несмотря на наши усилия в течение последнего десятилетия, Венесуэла подсела на чёрное золото. Теперь, когда мы успешно обеспечили наш мандат, мы можем сосредоточиться на дальнейшей диверсификации нашей экономики и максимально возможном снижении нашей зависимости от нефтяной промышленности, чтобы обеспечить устойчивый рост."
VEN_blackmondaysafe: "Защита от рыночных колебаний"
VEN_blackmondaysafe_desc: "Чёрный понедельник показал, что наша экономика уязвима для рыночных колебаний. Благодаря нашему опыту и диверсифицированной экономике мы сможем реагировать быстрее и эффективнее, если нас поразит очередной кризис."
VEN_protecting_workers: "Защита рабочих"
VEN_protecting_workers_desc: "Защита венесуэльских рабочих является главным приоритетом социал-демократического правительства. Через Конгресс продвигается больше законодательства о более строгих нормах безопасности на рабочих местах и улучшении социальной защиты бедных."
VEN_public_investments: "Государственные инвестиции"
VEN_public_investments_desc: "Улучшение государственных учреждений, таких как школы, больницы и парки, является обязательным для правительства, обеспечивая повышение качества жизни по всей стране."
VEN_towards_welfare_state: "К государству всеобщего благосостояния"
VEN_towards_welfare_state_desc: "Стремление к государству всеобщего благосостояния - это амбициозная и высокая цель, но по мере роста нашей экономики и увеличения финансирования наших социальных программ наша страна медленно продвигается к ней, делая нас одной из самых развитых стран Латинской Америки."
VEN_economicalbonanza: "Здоровый экономический рост"
VEN_economicalbonanza_desc: "Экономика Венесуэлы растёт устойчивыми и здоровыми темпами. Хотя наша экономика не бурлит, мы знаем, что это самый разумный способ развивать нашу страну, не ставя под угрозу будущие поколения. Мы можем только надеяться, что у будущих венесуэльцев будут большие возможности независимо от их социального класса и что однажды социализм будет достигнут мирным путём."

VEN_URD_victory: "Президентство URD"
VEN_URD_victory_desc: "Unión Republicana Democrática, состоящая из умеренных прогрессистов, либералов и националистов из Generación del 26, сумела заполучить президентство. Мы на пути к невообразимому экономическому процветанию, ставя венесуэльцев на первое и главное место."
VEN_oil_industry_reforms: "Реформы нефтяной промышленности"
VEN_oil_industry_reforms_desc: "Хотя большая часть нефтяной промышленности находится в руках иностранных компаний, их родные страны сосредоточены на своих собственных проблемах. Сейчас хорошее время для продвижения реформ в отрасли, гарантируя, что венесуэльцы получат свою законную долю прибыли и инвестиций."
VEN_oil_expansion: "Расширение нефтедобычи"
VEN_oil_expansion_desc: "Поскольку мир становится напряжённым, а Венесуэла наблюдает со стороны, мы не можем упустить такую возможность. Нефтяная промышленность должна быть расширена, чтобы удовлетворить растущую потребность мира в нефти."
VEN_oil_profits: "Инвестирование нефтяных прибылей"
VEN_oil_profits_desc: "Мы должны тщательно инвестировать растущие прибыли от нефтяной промышленности, чтобы обеспечить дальнейшее процветание венесуэльцев."
VEN_interclass_unity: "Межклассовое сотрудничество"
VEN_interclass_unity_desc: "Венесуэльцы, независимо от их социального класса, - одна нация. Мы не можем позволить социалистическим демагогам разжигать искусственные разделения в нашем обществе, а вместо этого должны воспитывать чувство национального единства среди людей, независимо от того, богаты они или бедны."
VEN_pan_tierra_libertad: "¡Por Pan, Tierra y Libertad!"
VEN_pan_tierra_libertad_desc: "За хлеб, Родину и Свободу! Воспитание большего единства в Венесуэле необходимо для стабильного и гармоничного общества. Девиз URD символизирует его приверженность процветанию, национализму и свободе, что делает его отличным лозунгом для сплочения."
VEN_dios_y_federacion: "Dios y Federación"
VEN_dios_y_federacion_desc: "«Бог и Федерация» - это традиционный девиз Венесуэлы со времён Федеральной войны 1859–1863 годов, которая оказала большое влияние на институциональное развитие страны и приверженность федерализму и свободе. Воспитание национальной гордости необходимо для создания единого общества."
VEN_lodsofemone: "Экономический бум"
VEN_lodsofemone_desc: "Экономика растёт быстрее, чем когда-либо! Использование нефтяной промышленности и мудрое инвестирование её огромных прибылей привели нас к беспрецедентному росту, который приведёт к процветающей, богатой Венесуэле."

VEN_industrialization: "Индустриализация"
VEN_industrialization_desc: "Промышленность Венесуэлы мала и хрупка. Поскольку промышленность является основой современной экономики, мы должны обеспечить, чтобы наша нация могла индустриализироваться и процветать в надежде создать современное государство, сравнимое с нашими европейскими и североамериканскими аналогами."
VEN_navalindustry: "Инвестиции в судостроение"
VEN_navalindustry_desc: "Судостроительная промышленность в Венесуэле довольно мала. Однако у неё есть потенциал стать чем-то большим, если мы будем больше в неё инвестировать. В конце концов, наш растущий флот нуждается в лучших мощностях, и такая современная промышленность имеет много преимуществ: от найма многих венесуэльцев до улучшения морской торговли и создания большего количества товаров на экспорт."
VEN_education: "Расширение UCV"
VEN_education_desc: "Universidad Central de Venezuela, или Центральный университет Венесуэлы, является ведущим центром высшего образования и исследований в стране и одним из старейших в Западном полушарии. Поскольку всё больше людей могут поступать в него, было бы разумно расширить его, увеличив его ёмкость и возможности."

VEN_revolution_by_ballot: "Революция через урну"
VEN_revolution_by_ballot_desc: "Неожиданная избирательная победа PCV делает её одним из немногих примеров социалистической партии, получившей власть буржуазными средствами. Теперь мы можем начать Венесуэльскую революцию и превратить нашу нацию в образцовое социалистическое государство в Латинской Америке."
VEN_empower_CTV: "Расширение полномочий CTV"
VEN_empower_CTV_desc: "Профсоюзы являются центром любой социалистической страны. Таким образом, мы должны расширить полномочия Confederación de Trabajadores de Venezuela, главной федерации профсоюзов страны, чтобы правительство действительно могло находиться в руках рабочих, постепенно демонтируя буржуазное государство."
VEN_workplace_democratisation: "Демократизация рабочих мест"
VEN_workplace_democratisation_desc: "Промышленность Венесуэлы должна быть полностью перестроена, чтобы средства производства могли оказаться в руках рабочих, которые так усердно трудятся каждый день. Демократия на рабочем месте необходима для истинного освобождения рабочих, делая их ответственными за свою собственную работу."
VEN_socialist_education: "Социалистическое образование"
VEN_socialist_education_desc: "Мы можем многому научиться у наших друзей в Интернационале. Перестройка образования и институтов Венесуэлы создаст новые поколения молодых социалистов, стремящихся работать на благо страны и мира."
VEN_nationalise_industry: "Национализация промышленности"
VEN_nationalise_industry_desc: "Мы не можем позволить бизнес-классу, иностранному и местному, контролировать нашу промышленность и экономику. Их национализация позволит нам проводить нашу политику и гарантировать, что рабочие будут свободны от эксплуатации и буржуазии."
VEN_land_reform: "Земельная реформа"
VEN_land_reform_desc: "Хотя распределение земли в Венесуэле далеко не худшее в Латинской Америке, всё ещё есть много регионов, где помещики контролируют землю и обладают слишком большой властью и влиянием, эксплуатируя бедных фермеров. Поэтому мы должны правильно перераспределить землю среди крестьян и освободить их от угнетения."
VEN_collectivisation: "Коллективизация"
VEN_collectivisation_desc: "Хотя коллективизация не полностью популярна среди крестьян, она гарантирует, что продовольствие будет правильно перераспределено среди народа. Кроме того, мы сможем координировать коллективы и обеспечивать их производительность и эффективность."
VEN_proceedviceroy: "Национализация нефтяной промышленности"
VEN_proceedviceroy_desc: "Нефтяная промышленность является символом буржуазного угнетения и неравенства. Поскольку иностранные компании и местные капиталисты контролируют её, лишь малая часть её невероятного богатства когда-либо достигает рабочих. Поэтому, пока мир отвлечён, мы должны захватить иностранные компании и национализировать отрасль, гарантируя, что её богатство достанется народу."
VEN_five_year_plan: "Пятилетний план"
VEN_five_year_plan_desc: "Создание социалистического государства в менее развитой стране сложно, поскольку сильный рабочий класс является его основой. Принимая во внимание советы тоталистской фракции, мы создали Пятилетний план для индустриализации Венесуэлы до уровня, на котором социализм станет возможен."
VEN_rapid_industrialisation: "Быстрая индустриализация"
VEN_rapid_industrialisation_desc: "В результате нашего Пятилетнего плана Венесуэла индустриализируется с невообразимой скоростью. Скоро у нас будет сильный, свободный рабочий класс и высокоразвитая промышленность, соответствующая нашим братьям в Интернационале, таким как Франция и Британия."
VEN_to_socialism: "К социализму!"
VEN_to_socialism_desc: "¡Proletarios de todos los países, uníos! Социализм - истинная цель PCV. Революция только началась, но скоро рабочие мира будут свободны, и будет создано бесклассовое общество."

VEN_eagle_screech: "Перес Хименес захватывает власть"
VEN_eagle_screech_desc: "Армия вмешалась, чтобы предотвратить социалистическую революцию, сформировав военное правительство под руководством Маркоса Переса Хименеса. Сам сильный человек яростно антисоциалистичен и уже предпринимает шаги, чтобы навсегда очистить Венесуэлу от левых и инакомыслящих элементов."
VEN_seguridad_nacional: "Seguridad Nacional"
VEN_seguridad_nacional_desc: "Dirección de Seguridad Nacional, или Управление национальной безопасности, было создано Пересом Хименесом, превратив предыдущий Cuerpo de Investigación Nacional (Национальный следственный корпус) в настоящую тайную полицию, способную искоренить опасную оппозицию нового правительства."
VEN_threaten_opposition: "Угрожать оппозиции"
VEN_threaten_opposition_desc: "Оппозиционные партии критически относятся к нашему правительству, считая наш переворот незаконным и особенно критикуя DSN как репрессивную. Пришло время заставить замолчать этих диссидентствующих симпатизантов социалистов и... убедить их поддержать нашу хунту или столкнуться с серьёзными последствиями."
VEN_censorship: "Цензура"
VEN_censorship_desc: "Наше правительство, юридически, стоит на шаткой основе. Однако пропаганда - мощный инструмент. Пока люди поддерживают нас, не имеет значения, насколько недемократичными, по мнению наших оппонентов, мы являемся. Конечно, это означает затягивание удавки вокруг прессы и обеспечение невозможности распространения антихунтовской пропаганды."
VEN_new_US_treaty: "Новый договор с США"
VEN_new_US_treaty_desc: "Ни для кого не секрет, что США - наш самый важный союзник и торговый партнёр. Естественно, что мы улучшаем отношения с ними, и мы должны подписать новый взаимовыгодный договор."
VEN_US_oil_companies: "Американские нефтяные компании"
VEN_US_oil_companies_desc: "Американские нефтяные компании обладают гораздо большим капиталом и опытом, чем местные. Они смогут улучшить нефтяную промышленность Венесуэлы гораздо больше, чем мы могли бы сами, и более эффективно."
VEN_oil_money_investment: "Инвестирование нефтяных денег"
VEN_oil_money_investment_desc: "Хунта получает огромную прибыль от улучшенной нефтяной промышленности. Мудрым шагом будет реинвестировать эту прибыль в экономику или общественные проекты, улучшая имидж правительства как успешного."
VEN_foreign_investors: "Иностранные инвесторы"
VEN_foreign_investors_desc: "Поскольку США являются близкими союзниками, мы хорошо осведомлены о преимуществах, которые инвесторы могут принести в страну. Поэтому мы должны поощрять их инвестировать в нашу страну, а не в другие, помогая нам восстановить Венесуэлу по нашему образу."
VEN_infrastructure_development: "Развитие инфраструктуры"
VEN_infrastructure_development_desc: "У нашего президента есть чутьё на роскошь. Он считает, что масштабные инфраструктурные проекты улучшат имидж страны как внутри Венесуэлы, так и за её пределами, как современной и, что более важно, могущественной нации."
VEN_foreign_experts: "Иностранные эксперты"
VEN_foreign_experts_desc: "Чтобы укрепить страну, необходимо улучшить образование. Одна из проблем, с которой мы сталкиваемся, заключается в том, что многие венесуэльские интеллектуалы бежали во время переворота. Однако многие иностранные эксперты стремятся работать с нами и нашими целями, и они нам понадобятся для построения будущего Венесуэлы."
VEN_strong_venezuela: "Сильная Венесуэла"
VEN_strong_venezuela_desc: "Президент Перес Хименес мечтает о сильной Венесуэле. Достаточно сильной, чтобы быть региональной державой в Латинской Америке. Со временем мы всё ближе и ближе подходим к достижению его целей. Скоро Венесуэла станет самой могущественной нацией Южной Америки благодаря нашим великим усилиям."

VEN_maintaining_the_edge: "Сохранение преимущества"
VEN_maintaining_the_edge_desc: "С середины 1920-х годов сменяющие друг друга правительства расширяли Венесуэльскую армию до той мощной силы, которой она является сегодня. Однако мы не можем почивать на лаврах, ибо можем легко потерять своё преимущество. Поддержание армии в современном состоянии гарантирует, что она останется силой, с которой будут считаться в регионе."

VEN_import_new_arms: "Импорт нового оружия"
VEN_import_new_arms_desc: "Венесуэла имеет ограниченные возможности по производству оружия. К счастью, несколько компаний, таких как FN в Валлонии и Steyr в Австрии, стремятся оснастить наши силы по хорошей цене. Мы должны связаться с ними снова, чтобы пополнить наши арсеналы и обеспечить значительный резерв, если придёт время."
VEN_import_heavy_equipment: "Импорт тяжёлого оборудования"
VEN_import_heavy_equipment_desc: "Тяжёлое оборудование, такое как артиллерийские орудия, ещё труднее приобрести в больших количествах, и оно абсолютно необходимо в современной войне. Мы снова зависим от импорта оружия, пока не сможем наладить местное производство."
VEN_local_arms_production: "Местное производство оружия"
VEN_local_arms_production_desc: "Наша зависимость от импорта оружия неизбежно станет проблемой, если мы снова окажемся в состоянии войны, потенциально отрезанные от внешней торговли. Мы должны нанять иностранных экспертов для налаживания местного производства, начиная с инструментов, необходимых для ремонта и обслуживания нашего текущего оружия, а затем, надеюсь, имея достаточно опыта для создания собственного."
VEN_expand_local_production: "Расширение местного производства"
VEN_expand_local_production_desc: "Теперь, когда у нас есть основа отечественной оружейной промышленности, мы должны инвестировать в неё дальше, чтобы максимально заместить импорт. Хотя мы, возможно, никогда не сможем сравниться с великими арсеналами Европы или США, мы определённо можем уменьшить нашу зависимость от них и стать более независимыми."

VEN_doctrine_reevaluation: "Переоценка доктрины"
VEN_doctrine_reevaluation_desc: "Хотя многое было сделано после унижения 1925 года, наша доктрина отстаёт от новейших разработок. Поскольку военные технологии и доктрина кардинально изменились всего за несколько десятилетий, мы должны сосредоточить наши усилия на обеспечении того, чтобы наши офицеры были способны вести современную войну."

VEN_maximum_firepower: "Максимальная огневая мощь"
VEN_maximum_firepower_desc: "Ключ к войне - обеспечение того, чтобы наши силы имели преимущество в огневой мощи над противником. Это истина на протяжении веков, и опыт европейцев в Мировой войне и остального мира с тех пор только подтвердил это."
VEN_modern_fire_support: "Современная огневая поддержка"
VEN_modern_fire_support_desc: "Огневая поддержка является ключом к ограничению наших потерь и максимизации потерь противника. Ключ в том, чтобы наши офицеры и артиллерийские расчёты могли координироваться с пехотой и наоборот, и современная война имеет несколько способов максимизировать это с помощью обучения и улучшенной связи."
VEN_modern_artillery: "Современная артиллерия"
VEN_modern_artillery_desc: "Конечно, огневая поддержка неполна без самих артиллерийских орудий. Наша артиллерия должна быть оснащена современными орудиями и укомплектована обученными экспертами, чтобы максимизировать их огневую мощь и эффективность. В конце концов, современные орудия - возможно, самая смертоносная сила на поле боя."
VEN_shock_and_awe: "Шок и трепет"
VEN_shock_and_awe_desc: "Идея «Шока и трепета» состоит в том, чтобы парализовать врага эффектным использованием подавляющей огневой мощи, давая нашим войскам возможность отразить атаку или создать прорыв. Это потребует высококвалифицированных артиллеристов и высокой координации между поддерживающими элементами и пехотой."

VEN_maximum_speed: "Максимальная скорость"
VEN_maximum_speed_desc: "Ключ к войне - обеспечение преимущества в мобильности над противником, атака там, где его меньше всего ждут или где он слабее. Недавние войны показали, что наши силы должны поддерживать импульс, иначе война вырождается в кровавую позиционную войну."
VEN_mass_motorisation: "Массовая моторизация"
VEN_mass_motorisation_desc: "Лучший способ оставаться мобильным в современной войне - обеспечить армию достаточным количеством грузовиков для перевозки войск и припасов на передовую. Моторизованная армия сможет перехитрить любого врага, который передвигается пешком или снабжается гужевыми повозками."
VEN_armoured_warfare: "Бронетанковая война"
VEN_armoured_warfare_desc: "Танки - относительно новая военная технология с довольно ограниченным полевым опытом. Однако многие считают, что они - будущее войны, новая кавалерия с высокой мобильностью и огневой мощью."
VEN_modern_manoeuvre_warfare: "Современная манёвренная война"
VEN_modern_manoeuvre_warfare_desc: "Мобильная война, безусловно, не новая концепция, поскольку она доминировала в военной мысли до Мировой войны. Новые технологические разработки сделали её снова актуальной, и Венесуэла полностью приняла её, сделав Венесуэльскую армию одной из самых современных сил на континенте."

VEN_expand_AMV: "Расширение AMV"
VEN_expand_AMV_desc: "Academia Militar de Venezuela, или Военная академия Венесуэлы, является главным центром военного образования и исследований страны. Учитывая, как сильно выросла армия за последнее десятилетие, пришло время инвестировать в расширение AMV, обеспечив наличие компетентного офицерского корпуса и квалифицированных экспертов в наших вооружённых силах."
VEN_jungle_warfare: "Обучение ведению войны в джунглях"
VEN_jungle_warfare_desc: "Густые джунгли на юге и востоке Венесуэлы представляют интересную задачу для наших вооружённых сил. Предоставление дополнительной подготовки нашим войскам позволит нам более эффективно сражаться в этих суровых регионах, что может оказаться решающим, если мы собираемся вернуть Гуаяну-Эссекибо."

VEN_air_force_expansion: "Расширение военно-воздушных сил"
VEN_air_force_expansion_desc: "Будучи самым младшим родом войск, военно-воздушные силы получили значительно меньше внимания, чем армия и флот. Поскольку мы серьёзно отстаём в воздушной мощи и теории, мы должны начать расширять военно-воздушные силы, ибо потенциал воздушной мощи слишком велик, чтобы его игнорировать."
VEN_air_superiority: "Превосходство в воздухе"
VEN_air_superiority_desc: "Часть командования ВВС поддерживает более независимые военно-воздушные силы, утверждая, что они могут сделать гораздо больше, чем просто поддерживать сухопутные силы. Они хотят, чтобы ВВС были наступательным инструментом, сосредоточенным на завоевании превосходства в воздухе над нашим небом и небом наших врагов и использовании бомбардировщиков для уничтожения их сил и морального духа."
VEN_army_support: "Поддержка армии"
VEN_army_support_desc: "Более консервативные офицеры в военно-воздушных силах, поддерживаемые армейскими офицерами, считают, что военно-воздушные силы по сути являются продолжением армии и должны сосредоточиться на том, чтобы держать вражеские самолёты подальше от армии и поддерживать наземные операции."
VEN_surplus_fighters: "Избыточные истребители"
VEN_surplus_fighters_desc: "Наши возможности по строительству самолётов практически отсутствуют. Однако мы можем приобрести истребители у более развитых стран, чтобы на время удовлетворить наши потребности в самолётах."
VEN_study_foreign_designs: "Изучение иностранных проектов"
VEN_study_foreign_designs_desc: "Поскольку у нас есть ряд иностранных авиаконструкций, мы должны тщательно их изучить, что поможет нашим собственным инженерам совершенствоваться в области авиастроения. Надеюсь, это поможет нам создать свою собственную авиационную промышленность."
VEN_local_air_production: "Местное производство самолётов"
VEN_local_air_production_desc: "Теперь, когда у нас есть приличное количество иностранных самолётов на вооружении и хороший опыт их использования и обслуживания, мы можем начать производить собственные военные самолёты. Это, надеюсь, рождение великой авиастроительной промышленности."
VEN_domestic_fighter: "Отечественный проект истребителя"
VEN_domestic_fighter_desc: "С наёмом талантливых инженеров местными производителями самолётов мы можем начать амбициозный проект по проектированию собственного истребителя. Эта полностью отечественная разработка должна позволить нам независимо развивать свои военно-воздушные силы, ограничивая импорт."
VEN_domestic_bomber: "Местный проект бомбардировщика"
VEN_domestic_bomber_desc: "Бомбардировщики доказали свою универсальность в современной войне. Их местное производство имеет много преимуществ, даже если это дорогостоящее начинание, снижая нашу зависимость от импорта иностранного оружия и стимулируя военную промышленность."
VEN_domestic_NAV: "Венесуэльский морской бомбардировщик"
VEN_domestic_NAV_desc: "Учитывая протяжённую береговую линию Венесуэлы, морской бомбардировщик необходим для защиты нашей страны. Создание собственного будет интересным начинанием, но, надеюсь, с ним справится наша зарождающаяся авиационная промышленность."

VEN_continue_naval_expansion: "Продолжение расширения флота"
VEN_continue_naval_expansion_desc: "После унижения от рук терпящей крах Британской империи в 1925 году Венесуэла потратила значительные ресурсы на свой флот. Поскольку мир движется к очередному великому кризису, нам, вероятно, потребуется расширить его ещё больше, чтобы защитить нашу независимость и интересы."
VEN_yard: "Венесуэльские доки"
VEN_yard_desc: "Венесуэльская судостроительная промышленность растёт, но всё ещё довольно мала по сравнению с размером нашего флота. Нам нужно будет расширить наши доки, если мы собираемся расширяться дальше, поскольку наши корабли требуют обслуживания, и амбициозные офицеры стремятся продвигать план отечественного судостроения, чтобы помочь его расширению и стимулировать экономику."
VEN_fleet_in_being: "Флот в наличии"
VEN_fleet_in_being_desc: "Наш военно-морской штаб считает, что если у Венесуэлы будет достаточно большой и мощный флот, даже великие державы мира дважды подумают, прежде чем пытаться запугивать нас, а другие страны региона содрогнутся перед нашей мощью."
VEN_flexible_fleet: "Гибкий флот"
VEN_flexible_fleet_desc: "Не будем поддаваться чрезмерно амбициозным, нереалистичным идеям какого-то Гранд-флота. Младшие офицеры флота считают, что флот должен сосредоточиться на гибком флоте, способном бороться с врагами косвенно с помощью подводной войны и рейдеров, одновременно защищая наши судоходные пути."
VEN_coastal_defence_ship: "Корабли береговой обороны"
VEN_coastal_defence_ship_desc: "Венесуэла, даже с её нефтяными деньгами, не может позволить себе крупные капитальные корабли, которые могут себе позволить великие державы. Поэтому идея меньших капитальных кораблей с ограниченным радиусом действия, но высокой броней и огневой мощью, предназначенных для защиты побережья, была полностью принята военно-морским штабом."
VEN_new_light_cruisers: "Современные крейсеры"
VEN_new_light_cruisers_desc: "Крейсеры необходимы для разведки и дальних операций. Учитывая, что наши перевозки нуждаются в защите в военное время, современные крейсеры - это то, без чего наш флот не может обойтись."
VEN_new_destroyers: "Новые эсминцы"
VEN_new_destroyers_desc: "Эсминцы являются основными кораблями, предназначенными для прикрытия более крупных кораблей нашего флота. Их универсальность, необходимая для борьбы с малыми судами, и мощное торпедное вооружение делают малые корабли такими же важными, как и капитальные корабли флота."
VEN_new_submarines: "Современные подводные лодки"
VEN_new_submarines_desc: "Подводные лодки - относительно новое дополнение к военно-морским флотам по всему миру, но их полезность и потенциал уже доказаны в Мировой войне. Благодаря их относительной экономической эффективности, они являются идеальным способом для Венесуэлы усилить свою военно-морскую мощь."
VEN_navegare_necesse_vivere_non_necesse: "Navegare Necesse, Vivere Non Necesse"
VEN_navegare_necesse_vivere_non_necesse_desc: "«Плавать необходимо, жить - не обязательно». Хотя Венесуэла никогда не имела большого флота, у неё есть сильные традиции, уходящие корнями к основанию страны, и теперь это современная боевая сила, с которой следует считаться. Её моряки и офицеры высоко обучены и дисциплинированы, готовы защищать нацию, как и их предшественники."

### Events ###
ven.1.t: "Место Венесуэлы в мире"
ven.1.d: "После отделения Венесуэлы от Великой Колумбии в 1830 году страну сотрясал ряд гражданских войн между консерваторами и либералами, пока в 1864 году страна не была федерализована. Однако Венесуэла всё ещё боролась за поддержание стабильности при чередующихся военных и гражданских правительствах. Всё изменило открытие месторождений нефти и переворот генерала Хуана Висенте «Сома» Гомеса в 1908 году. При Гомесе нефтяная промышленность стала экономическим фундаментом нации и оставалась относительно стабильной на протяжении Мировой войны, сохраняя нейтралитет в конфликте и сокращая государственный долг, хотя и ценой полной зависимости страны от нефти. Однако режим «Сома» не мог продержаться вечно. После того как он не смог продвинуть претензии Венесуэлы на Эссекибо из-за вмешательства Америки на фоне фактического краха Британской империи, он был свергнут военными в 1928 году после скандала с британскими «репарациями», и поколение 1926 года вскоре сформировало демократическое правительство после проведения выборов. Однако к 1936 году «поколение» сильно раскололось на три партии. Acción Democrática в настоящее время удерживает бразды правления, но их бывшие либеральные союзники из Unión Democrática Republicana набирают обороты, а ориентированная на Интернационал Partido Socialista de Venezuela продолжает разжигать антикапиталистическое инакомыслие. Тем не менее, Венесуэла является одним из немногих относительно стабильных и демократических государств в регионе, но эскалация напряжённости во всём мире может легко дестабилизировать молодую демократию."
ven.1.a: "Мы действительно живём в интересные времена."

ven.2.t: "Нестабильность в Каракасе"
ven.2.d: "С новостями о крахе Берлинской фондовой биржи, достигшими Венесуэлы и уже влияющими на экономику, в Каракасе и других городах произошли многочисленные беспорядки, поскольку бегство в банки привело к протестам и бунтам. Многие в военных считают, что Социалистическая партия стоит за многими из этих беспорядков и планирует использовать их для начала революции в Венесуэле. Элеасар Лопес Контрерас, один из генералов, которые помогли восстановить демократию в 1928 году, готов снова вмешаться, если нынешнее правительство не сможет восстановить порядок, но [Root.GetLeader] настаивает на том, что полиция может справиться с эксцессами и всё скоро успокоится."
ven.2.a: "Правительство восстанавливает спокойствие."
ven.2.b: "Временная хунта захватывает власть."

ven.3.t: "Президентские выборы 1939 года"
ven.3.d: "Несмотря на кризисы, вызванные Чёрным понедельником, назначенные на этот год президентские выборы всё ещё проводятся, и в результате предвыборная кампания была ожесточённой. Социал-демократическая Acción Democrática имеет хорошие шансы получить ещё один срок, обещая продолжить свою политику расширения социального обеспечения и диверсификации промышленности. Социал-либеральная Unión Republicana Democrática, другая умеренная партия, рождённая поколением 1926 года, также имеет хорошие шансы занять пост президента, обещая экономическое процветание и используя националистическую риторику. Наконец, хотя их шансы относительно невелики, ориентированная на Интернационал Partido Socialista de Venezuela, как ни удивительно, серьёзно ведёт кампанию, используя Чёрный понедельник для продвижения своей радикальной антикапиталистической и социалистической идеологии."
ven.3.a: "AD получает ещё один срок."
ven.3.b: "URD выигрывает президентство."
ven.3.c: "PCV совершает революцию через урну."
ven.3.e: "Это социалист в избирательном бюллетене? Мы должны положить этому конец!"

ven.4.t: "Распространение синдикализма в Венесуэле"
ven.4.d: "Стало известно, что коалиция ориентированных на Интернационал партий захватила правительство Венесуэлы после выборов. Хотя мы, конечно, не можем допустить, чтобы такая враждебная идеология укреплялась на нашем заднем дворе, к нам обратилась группа венесуэльских офицеров во главе с генералом Маркосом Пересом Хименесом за нашей поддержкой, поскольку они хотят свергнуть своё недавно избранное социалистическое правительство, которое угрожает их и, как они напомнили, нашим интересам."
ven.4.a: "Поддержать их переворот и обеспечить наши интересы."
ven.4.b: "Пустая трата наших ресурсов."

ven.5.t: "Маркос Перес Хименес захватывает власть!"
ven.5.d: "Похоже, у социалистического правительства были не только внутренние, но и внешние враги. Генерал Перес Хименес, при поддержке многих офицеров и армии, захватил власть в ходе кровавого переворота, чтобы остановить революционную политику PCV. После краткой перестрелки с наспех собранным ополчением, верным PCV, армия арестовала ряд политиков PCV и заблокировала доступ к Palacio Legislativo. В течение нескольких дней сторонники Переса Хименеса обеспечили контроль над страной, а лидеры PCV либо бежали, либо скрываются. Похоже, что за этим стоят Соединённые Штаты Америки."
ven.5.a: "Национальная хунта спасёт нас от синдикализма."

ven.6.t: "Импорт стрелкового оружия"
ven.6.d.a: "Из-за ограниченности нашей отечественной оружейной промышленности мы по-прежнему зависим от иностранных производителей. У нас есть два основных поставщика: Fabrique Nationale в [BEL.GetName] и Österreichische Waffenfabriksgesellschaft Steyr в [AUS.GetNameDef], и мы уверены, что любая из этих компаний будет рада заключить контракт на очередную партию стрелкового оружия для нашей растущей армии."
ven.6.d.b: "Похоже, наш первый выбор не может обеспечить нас запрошенным количеством огнестрельного оружия. К счастью, у нас есть второй вариант, который, надеюсь, сможет и захочет продать нам столь необходимые винтовки для Венесуэльской армии."
ven.6.d.c: "Очевидно, этим иностранным компаниям нельзя доверять, как мы и опасались. Нам придётся обходиться местным производством оружия или приобретать его каким-либо другим способом."
ven.6.a: "Спросить FN."
ven.6.b: "Спросить OEWG Steyr."
ven.6.c: "В конце концов, мы не могли им доверять."

ven.7.t: "Экспорт оружия в Венесуэлу?"
ven.7.d: "К нам обратился офицер венесуэльской армии, желающий купить большое количество стрелкового оружия для переоснащения своих войск. Хотя нам, очевидно, придётся попрощаться с частью нашего арсенала, это будет довольно выгодный контракт, который стимулирует нашу оружейную промышленность."
ven.7.a: "Звучит как хорошая сделка!"
ven.7.b: "Мы не можем выделить оружие."

ven.8.t: "Партия стрелкового оружия"
ven.8.d: "Мы успешно приобрели крупную партию стрелкового оружия для оснащения наших войск или для резерва. У наших солдат не будет проблем с его использованием, поскольку оно похоже или идентично тому, к чему они привыкли. Теперь, конечно, мы должны заплатить за оружие."
ven.8.a: "Отлично."

ven.9.t: "Закон «Пятьдесят на пятьдесят»"
ven.9.d: "Президент [VEN.GetLeader] только что подписал закон, который уменьшит прибыль, которую иностранные правительства получают от венесуэльской нефти. Названный законом «пятьдесят на пятьдесят», он позволит правительству забирать половину доходов от иностранного бурения в Венесуэле. Это большой шаг к экономической независимости, и многие хвалят правительство за это действие."
ven.9.a: "Более справедливая сделка."

VEN_fifty_to_fifty_idea_change: "Изменить §HГосподство иностранных нефтяных компаний§! путём\nПрирост политической власти: [?0.05|+=0%]"

ven.10.t: "Нефтяная промышленность Венесуэлы"
ven.10.d: "Нефть всегда была главным экспортным товаром Венесуэлы, насколько мы помним. Было предложено изъять нефтяную промышленность из рук иностранных компаний и продавать нефть им самим. Наша прибыль увеличится, и мы сделаем ещё один шаг к истинной независимости и самостоятельности."
ven.10.a: "Нефть, переработанная здесь, наша - национализировать!"
ven.10.b: "Мы не хотели бы расстраивать иностранные интересы."

ven.11.t: "Чёрный понедельник бьёт по нефтяным скважинам!"
ven.11.d: "Экономика Венесуэлы переживала золотой век после открытия наших богатых нефтяных месторождений. Голодная промышленность Европы, Америки и Японии долгое время покупала всю нефть, которую могла себе позволить. Однако после краха дела пошли наперекосяк тревожно быстро, хотя и неожиданно. Цены на нефть рухнули, и доходы государства тоже. Вскоре пострадают основные услуги, и президенту [Root.GetLeader] придётся действовать, пока не стало слишком поздно."
ven.11.a: "Катастрофично!"

ven.12.t: "Импорт артиллерии"
ven.12.d.a: "Из-за ограниченных размеров нашей оружейной промышленности тяжёлое вооружение и оборудование, такое как артиллерийские орудия, трудно достать. Пока наша военная промышленность не будет обновлена, мы должны импортировать их. На ум приходят два крупных производителя: Krupp в Германии и Škoda в Богемии. Обе компании предлагают необходимое нам количество крупнокалиберных орудий по цене, которую мы можем себе позволить, и имеют лучшую репутацию."
ven.12.d.b: "Похоже, наш первый выбор не может обеспечить нас запрошенным количеством артиллерийских орудий. К счастью, у нас есть второй вариант, который, надеюсь, сможет и захочет продать нам столь необходимые орудия для Венесуэльской армии."
ven.12.d.c: "Очевидно, этим иностранным компаниям нельзя доверять, как мы и опасались. Нам придётся обходиться местным производством оружия или приобретать его каким-либо другим способом."
ven.12.a: "Спросить Krupp."
ven.12.b: "Спросить Škoda."
ven.12.c: "В конце концов, мы не могли им доверять."

ven.13.t: "Экспорт оружия в Венесуэлу?"
ven.13.d: "К нам обратился офицер венесуэльской армии, желающий купить скромное количество артиллерийских орудий для переоснащения своих войск. Хотя нам, очевидно, придётся попрощаться с частью нашего арсенала, это будет довольно выгодный контракт, который стимулирует нашу оружейную промышленность."
ven.13.a: "Звучит как хорошая сделка!"
ven.13.b: "Мы не можем выделить оружие."

ven.14.t: "Партия артиллерии"
ven.14.d: "Мы успешно приобрели крупную партию полевых орудий для оснащения наших войск или для резерва. Это даст нам столь необходимое увеличение огневой мощи. Теперь, конечно, мы должны заплатить за орудия."
ven.14.a: "Отлично."

ven.15.t: "Приобретение избыточных истребителей"
ven.15.d.a: "Авиационная промышленность в Венесуэле практически отсутствует, но самолёты уже доказали свою неотъемлемую часть современной войны. У немцев и Соединённых Штатов, если там восстановилась стабильность, должно быть достаточно избыточных самолётов, чтобы продать их нам по дешёвой цене, что позволит нам оснастить наши зарождающиеся военно-воздушные силы и изучить их конструкции."
ven.15.d.b: "Наш первый выбор избыточных самолётов не может предоставить нам запрошенное оборудование. К счастью, у нас есть альтернатива, на которую мы можем положиться, и мы можем только надеяться, что они окажутся более сговорчивыми, чем первый."
ven.15.d.c: "Похоже, у нас закончились варианты, поскольку основные игроки авиационной промышленности либо недоступны для нас, либо не желают выделять нам избыточные самолёты. Нам придётся найти другой способ получить новые самолёты для наших военно-воздушных сил и запустить нашу собственную промышленность с ограниченной помощью."
ven.15.d.d: "Авиационная промышленность в Венесуэле практически отсутствует, но самолёты уже доказали свою неотъемлемую часть современной войны. Наши французские товарищи, возможно, смогут предоставить нам некоторые самолёты, чтобы помочь нам создать наши военно-воздушные силы."
ven.15.a: "Спросить немецкую компанию."
ven.15.b: "Спросить американскую компанию."
ven.15.c: "В конце концов, мы не могли им доверять."
ven.15.e: "Наши товарищи, безусловно, помогут нам."

ven.16.t: "Экспорт самолётов в Венесуэлу?"
ven.16.d: "К нам обратился офицер венесуэльской армии, желающий купить скромное количество истребителей для использования своими военно-воздушными силами. Хотя нам, очевидно, придётся попрощаться с частью нашего арсенала истребителей, это будет довольно выгодный контракт, который стимулирует нашу оружейную промышленность."
ven.16.a: "Звучит как хорошая сделка!"
ven.16.b: "Мы не можем выделить самолёты."

ven.17.t: "Партия истребителей"
ven.17.d: "Мы успешно приобрели крупную партию истребителей для использования нашими военно-воздушными силами или для резерва. Это даст нам столь необходимое увеличение огневой мощи. Теперь, конечно, мы должны заплатить за самолёты."
ven.17.a: "Отлично."

ven.18.t: "Импорт стрелкового оружия"
ven.18.d.a: "Из-за ограниченности нашей отечественной оружейной промышленности мы по-прежнему зависим от иностранных производителей. Однако наши основные поставщики не хотят продавать нам оружие из-за нашего революционного правительства. К счастью, наши товарищи во Франции и Британии должны быть в состоянии помочь нам с дефицитом стрелкового оружия."
ven.18.d.b: "Похоже, наш первый выбор не может обеспечить нас запрошенным количеством огнестрельного оружия. К счастью, у нас есть второй вариант, который, надеюсь, сможет и захочет обменять столь необходимые винтовки для Венесуэльской армии."
ven.18.d.c: "Очевидно, этим иностранным компаниям нельзя доверять, как мы и опасались. Нам придётся обходиться местным производством оружия или приобретать его каким-либо другим способом."
ven.18.a: "Спросить наших французских товарищей."
ven.18.b: "Спросить революционных британцев."
ven.18.c: "В конце концов, мы не могли им доверять."

ven.19.t: "Импорт артиллерии"
ven.19.d.a: "Из-за ограниченных размеров нашей оружейной промышленности тяжёлое вооружение и оборудование, такое как артиллерийские орудия, трудно достать. Пока наша военная промышленность не будет обновлена, мы должны импортировать их. Наши французские и британские товарищи действительно производят достаточно высококачественных орудий и, надеюсь, смогут выделить некоторые для защиты революции в Венесуэле."
ven.19.d.b: "Похоже, наш первый выбор не может обеспечить нас запрошенным количеством артиллерийских орудий. К счастью, у нас есть второй вариант, который, надеюсь, сможет и захочет продать нам столь необходимые орудия для Венесуэльской армии."
ven.19.d.c: "Очевидно, этим иностранным компаниям нельзя доверять, как мы и опасались. Нам придётся обходиться местным производством оружия или приобретать его каким-либо другим способом."
ven.19.a: "Спросить наших французских товарищей."
ven.19.b: "Спросить революционных британцев."
ven.19.c: "В конце концов, мы не могли им доверять."

ven.20.t: "Приобретение избыточных истребителей"
ven.20.d.a: "Авиационная промышленность в Венесуэле практически отсутствует, но самолёты уже доказали свою неотъемлемую часть современной войны. Наши французские и британские товарищи, или даже революционеры в Америке, возможно, смогут предоставить нам некоторые самолёты, чтобы помочь нам создать наши военно-воздушные силы."
ven.20.d.b: "Наш первый выбор избыточных самолётов не может предоставить нам запрошенное оборудование. К счастью, у нас есть альтернатива, на которую мы можем положиться, и мы можем только надеяться, что они окажутся более сговорчивыми, чем первый."
ven.20.d.c: "Похоже, у нас закончились варианты, поскольку основные игроки авиационной промышленности либо недоступны для нас, либо не желают выделять нам избыточные самолёты. Нам придётся найти другой способ получить новые самолёты для наших военно-воздушных сил и запустить нашу собственную промышленность с ограниченной помощью."
ven.20.a: "Спросить наших французских товарищей."
ven.20.b: "У новых американцев, должно быть, есть избыток, которым можно поделиться!"
ven.20.e: "Спросить революционных британцев."
ven.20.c: "В конце концов, мы не могли им доверять."

ven.21.t: "Союз с США"
ven.21.d: "Ни для кого не секрет, что со времени переворота генерала Переса Хименеса Венесуэла ориентируется на США. Теперь, когда первый официально оформил Лигу американских государств, мы можем присоединиться к этому союзу и официально оформить наши тесные связи с Соединёнными Штатами Америки."
ven.21.a: "США - наш величайший союзник."

ven.22.t: "Оппозиция организуется в Венесуэле"
ven.22.d: "На прошлой неделе был ограблен арсенал, и украдены сотни единиц оружия. Неудивительно, что сегодня мы получили известие о том, что противники нашего правительства организуются под защитой реакционного режима Венесуэлы. Хотя у нас нет доказательств, мы подозреваем, что эти недовольные предатели несут ответственность за кражу винтовок колумбийской армии и контрабанду их в Венесуэлу, готовя восстание."
ven.22.a: "Мы должны оставаться бдительными."

ven.23.t: "Венесуэла готовится к войне"
ven.23.d: "Как мы и подозревали, реакционные венесуэльцы готовятся свергнуть наше правительство. Они не только вооружают колумбийских предателей в своей стране, но мы получили разведданные, что они мобилизуют свои силы и готовятся вторгнуться в нашу страну."
ven.23.a: "Они не отнимут ни дюйма колумбийской земли."

ven.24.t: "Ультиматум из Каракаса"
ven.24.d: "Венесуэльцы претендуют на регион к западу от реки Эссекибо в Гайане со времён обретения независимости от Испании, хотя в 1899 году Соединённые Штаты решили, что территория останется за британцами. Каракас, однако, не сдавался, и теперь Венесуэла, похоже, воспользовалась нашей борьбой против британцев, чтобы выдвинуть территориальные претензии на Гайану. Они объявили, что у нас есть сорок восемь часов, чтобы эвакуировать территорию, прежде чем их войска войдут, и горе любому нашему персоналу, оставшемуся в это время. Это нелепое требование, и ясно, что нам придётся снова защищать Гайану от вероломных венесуэльцев."
ven.24.a: "Мы должны готовиться к войне. Другого выбора нет."

ven.25.t: "[CAF.GetNameDefCap] отклоняет наш ультиматум"
ven.25.d: "Как и следовало ожидать, вероломные, упрямые англосы отказались уступить оккупированную территорию Гайаны-Эссекибо. Похоже, нам придётся отвоевать её силой. Все патриотичные венесуэльцы празднуют сегодня, когда мы движемся, чтобы вернуть то, что принадлежит нам."
ven.25.a: "Мы вернём наши законные земли!"

ven.26.t: "Колумбийские добровольцы возвращаются домой"
ven.26.d: "Поскольку их родина освобождена, добровольцы, которых мы вооружили для свержения угнетательского синдикалистского режима в Колумбии, были расформированы и вернулись домой с почестями и наградами."
ven.26.a: "Их служба будет помниться."

ven.27.t: "Венесуэла покупает акции в нашей нефтяной промышленности"
ven.27.d: "Наша нефтяная промышленность контролирует огромную часть венесуэльской нефти. В попытке получить большую долю прибыли, получаемой от их ресурсов, правительство Венесуэлы купило большую долю наших нефтяных активов в их стране."
ven.27.a: "Такова свободная рыночная экономика."

ven.28.t: "Венесуэла захватывает наши нефтяные активы"
ven.28.d: "Поскольку мы не можем защитить наши активы за рубежом, правительство Венесуэлы воспользовалось нашим шатким положением и захватило наши нефтяные активы в их стране. Хотя это потеря для [Root.GetAdjective]их компаний, мы ничего не можем сделать, чтобы остановить их."
ven.28.a: "Проклятые стервятники!"

ven.29.t: "Президентские выборы 1944 года"
ven.29.d: "Как диктует наша конституция, пять лет прошло с момента последних выборов, и настало время для новых. Acción Democrática и Unión Republicana Democrática по-прежнему являются основными претендентами, в то время как Partido Comunista de Venezuela остаётся преданной уничтожению буржуазной системы через саму систему."
ven.29.a: "AD получает ещё один срок."
ven.29.b: "URD выигрывает президентство."
ven.29.c: "PCV совершает революцию через урну."

ven.30.t: "Президентские выборы 1949 года"
ven.30.d: "Как диктует наша конституция, пять лет прошло с момента последних выборов, и настало время для новых. Acción Democrática и Unión Republicana Democrática по-прежнему являются основными претендентами, в то время как Partido Comunista de Venezuela остаётся преданной уничтожению буржуазной системы через саму систему."
ven.30.a: "AD получает ещё один срок."
ven.30.b: "URD выигрывает президентство."
ven.30.c: "PCV совершает революцию через урну."

ven.31.t: "Президентские выборы 1954 года"
ven.31.d: "Как диктует наша конституция, pięć лет прошло с момента последних выборов, и настало время для новых. Acción Democrática и Unión Republicana Democrática по-прежнему являются основными претендентами, в то время как Partido Comunista de Venezuela остаётся преданной уничтожению буржуазной системы через саму систему. Однако на этот раз в борьбу вступила консервативная партия: Comité de Organización Política Electoral Independiente."
ven.31.a: "AD получает ещё один срок."
ven.31.b: "URD выигрывает президентство."
ven.31.c: "PCV совершает революцию через урну."
ven.31.e: "COPEI, новички, побеждают."

ven.32.t: "Президентские выборы 1959 года"
ven.32.d: "Как диктует наша конституция, pięć лет прошло с момента последних выборов, и настало время для новых. Acción Democrática и Unión Republicana Democrática по-прежнему являются основными претендентами, COPEI на третьем месте, в то время как Partido Comunista de Venezuela остаётся преданной уничтожению буржуазной системы через саму систему."
ven.32.a: "AD получает ещё один срок."
ven.32.b: "URD выигрывает президентство."
ven.32.c: "PCV совершает революцию через урну."
ven.32.e: "COPEI, новички, побеждают."

ven.33.t: "Венесуэла в Интернационале?"
ven.33.d: "Венесуэла, вопреки всем трудностям, недавно избрала синдикалистское правительство и добилась больших успехов в мирной революции. Теперь, когда она стабильна, она хочет помочь нам в нашей войне против реакционеров."
ven.33.a: "Добро пожаловать, товарищи!"
ven.33.b: "Как мы можем им помочь? Вплавь?"

ven.34.t: "Франция принимает нас в Интернационал"
ven.34.d: "Хорошие новости! Франция решила принять нас в революционное братство наций."
ven.34.a: "¡Proletarios de todos los países, uníos!"

ven.35.t: "Франция отказывает"
ven.35.d: "По какой-то причине Коммуна Франции отклонила наше предложение присоединиться к ним в их крестовом походе против реакционеров."
ven.35.a: "¿Qué?"

ven.36.t: "Венесуэла в Антанте?"
ven.36.d: "Похоже, Венесуэла находится в состоянии войны с синдикалистами Третьего интернационала. Хотя у нас были непростые отношения с венесуэльцами со времён кризисов 1895 и затем 1902 годов, они обратились к Британской империи, чтобы защитить их от красной угрозы коммунаров. Каким бы ни был этот странный поворот событий, Венесуэла с её огромными запасами нефти и стратегическим положением может оказаться ценным союзником в борьбе против синдикализма. Однако некоторые члены парламента выступили против вовлечения себя в иностранный конфликт. Другие премьер-министры утверждают, что если мы хотим быть защитником Западного полушария вместо терпящей крах Соединённых Штатов, мы должны вмешаться. Что нам делать?"
ven.36.a: "Добро пожаловать в Антанту, Венесуэла."
ven.36.b: "Нам не нужно это бремя."

ven.37.t: "Канада принимает нас в Антанту"
ven.37.d: "Хорошие новости! Канада решила позволить нам присоединиться к их альянсу. Теперь мы вместе выгоним синдикалистов из Карибского бассейна и за его пределами!"
ven.37.a: "Боже, храни короля, тогда!"

ven.38.t: "Канада отказывает"
ven.38.d: "По какой-то причине Канада отклонила нашу просьбу о союзе. Мы будем сражаться в одиночку."
ven.38.a: "¿Qué?"

ven.39.t: "Мир с Венесуэлой?"
ven.39.d: "Мы были вытеснены из Гайаны, и наши силы не смогли создать плацдарм у их столицы. Нам ясно, что мы проигрываем эту войну, и венесуэльцам это тоже ясно. Они предложили нам мир, требуя только спорные районы Гайаны до реки Эссекибо. Должны ли мы принять их предложение о мире или сражаться до горького конца?"
ven.39.a: "Забирай свои проклятые джунгли, Венесуэла."
ven.39.b: "Мы никогда не сдадимся!"

ven.40.t: "Победа в Гайане!"
ven.40.d: "Вест-индцы согласились на наше мирное предложение. Гайана-Эссекибо снова наша и навсегда останется частью Венесуэлы! По всей стране люди объединены своим патриотизмом - хотя могут быть некоторые проблемы с новыми территориями, где наши администраторы сообщают, что не найти ни одного испаноговорящего. Тем не менее, это великий день для всех венесуэльцев!"
ven.40.a: "¡Dios y Federación!"

ven.41.t: "Вест-индцы отказываются от мира"
ven.41.d: "[CAF.GetNameDefCap] вероломно отклонили наше щедрое мирное предложение. Они снова заявили, что никогда не уступят нам Гайану-Эссекибо, и поэтому война должна продолжаться. Некоторые в нашем правительстве в частном порядке задаются вопросом, сможем ли мы действительно выиграть затяжной конфликт, но народ пока настроен решительно."
ven.41.a: "Проклятые англосы!"

ven.42.t: "Правительство Венесуэлы предлагает союз"
ven.42.d: "В результате нашего мирного вмешательства в проблемную республику Венесуэла под президентом Маркосом Пересом Хименесом наконец была восстановлена стабильность. Чтобы поддержать здоровье и престиж своего режима, он попросил нас заключить с ним формальный договор о союзе и помощи. Поскольку мы являемся частью более крупного альянса, [ROOT.GetFactionName], нам нужно будет спросить у ведущей страны нашего альянса, готовы ли они защищать Венесуэлу. Однако, поскольку основную тяжесть защиты будем нести мы, нет причин отказывать."
ven.42.a: "Передать запрос нашему союзнику."
ven.42.b: "Нам не нужны венесуэльцы."

ven.43.t: "Америка передаёт запрос Венесуэлы о союзе"
ven.43.d: "Наши американские союзники получили от Венесуэлы запрос на присоединение к [ROOT.GetFactionName]. Соединённые Штаты, похоже, заинтересованы в том, чтобы привести своего южного соседа в свою сферу, и призвали нас принять. Хотя Венесуэла обеспечила бы нас стабильными поставками нефти и базой в южной части Карибского бассейна, союз с ней рискует втянуться в южноамериканскую политику. Следует ли нам разрешить им присоединиться?"
ven.43.a: "Естественно, они желанны!"
ven.43.b: "Это было бы слишком большим бременем."

ven.44.t: "[FROM.GetNameDefCap] принимает предложение Венесуэлы"
ven.44.d: "Наши союзники в [FROM.GetName] приняли нашу просьбу о том, чтобы Венесуэле было разрешено присоединиться к [ROOT.GetFactionName]. Наша репутация самой влиятельной страны в Америке укрепилась, и у нас появился новый надёжный союзник в придачу."
ven.44.a: "Отлично!"

ven.45.t: "[FROM.GetNameDefCap] принимает союз"
ven.45.d.america: "[From.GetNameDefCap] принимает нашу просьбу о присоединении к их глобальному альянсу, [FROM.GetFactionName]. Это великий день для международного сотрудничества и день, который знаменует грядущую смерть мирового радикализма и социализма!"
ven.45.d: "Наша просьба о союзе была передана американцами далёкой стране [FROM.GetName], и они приняли нашу просьбу о присоединении к их глобальному альянсу, [FROM.GetFactionName]. Это великий день для международного сотрудничества и день, который знаменует грядущую смерть мирового радикализма и социализма!"
ven.45.a: "За дружбу!"

ven.46.t: "[FROM.GetNameDefCap] отказывает"
ven.46.d: "Хотя американцы явно продемонстрировали свою готовность помочь нам, их альянс оказался менее дружелюбным. Наше предложение о союзе было отклонено на том основании, что мы можем втянуть их в войны с нашими соседями. Это национальное возмущение, и это поколебало нашу популярность среди народа."
ven.46.a: "Мы были глупы, доверившись империалистам."

ven.47.t: "«Гражданское» правительство?"
ven.47.d: "После захвата власти в связи с потенциальной социалистической революцией через урну президент Хименес укрепил военное правление в Венесуэле. Несмотря на наши успехи, наши критики протестовали против приостановки демократии. Чтобы решить эту «проблему», президент Хименес искал партии, готовые поддержать наше правительство. Одной из таких фигур является Херман Боррегалес, лидер маргинального Национального движения действия. Боррегалес откололся от христианских демократов COPEI, чтобы продвигать более пылкое антисоциалистическое, националистическое и католическое движение. Роль Боррегалеса в качестве президента была бы лишь символической, поскольку Хименес всё равно сохранил бы верховную власть над правительством. Однако некоторые офицеры опасаются, что ассоциация с этим безумцем принесёт нам больше вреда, чем пользы."
ven.47.a: "Пригласить MAN быть лицом нашей хунты."
ven.47.b: "Мы спасли нацию, нет необходимости прятаться за партиями."

ven.48.t: "Мир с Вест-Индией?"
ven.48.d: "По мере того как война за наши законные земли в Западной Гайане затягивается, мы явно доказали наше превосходство на поле боя. Правительство Вест-Индии и, по-видимому, весь их альянс готовы подписать мирный договор, отказывающийся от владения Мабарумой в нашу пользу. Мы могли бы закончить эту войну прямо сейчас, или, возможно, наши амбиции ещё больше?"
ven.48.a: "Мы получили то, что хотели."
ven.48.b: "Вест-Индия всё ещё должна заплатить!"