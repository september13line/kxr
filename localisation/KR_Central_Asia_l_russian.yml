# Events #

turkestan_events.1.t: "[FROM.GetName] требует нашего подчинения"
turkestan_events.1.d: "Правительство [FROM.GetNameDef], недавно заявившее, что объединение в единое государство отвечает как его интересам, так и интересам всех народов Туркестана, выдвинуло нашему правительству ряд требований, включая размещение войск, подчинение их указам и, вероятно, введение новых налогов. Уверенные в своей растущей силе, они фактически требуют нашего подчинения. Разумеется, мы всегда можем отвергнуть эти немыслимые требования, хотя, скорее всего, это будет означать войну."
turkestan_events.1.a: "Мы согласимся с их требованиями."
turkestan_events.1.b: "Мы не покоримся!"
turkestan_events.1.c: "Мы - законное правительство Туркестана!"

turkestan_events.2.t: "[FROM.GetName] подчиняется нашей власти"
turkestan_events.2.d: "[FROM.GetAdjective]ое правительство согласилось присоединиться к нашим рядам, хотя пока лишь на условиях определённой автономии. Оно обязалось привести свои законы в соответствие с нашими, предоставлять войска для наших войн и обеспечить дальнейшую координацию в общегосударственных вопросах. Однако взамен на практике оно сохранило большую часть прежнего правительства. Дальнейшую интеграцию придётся обсудить в другой раз, а пока статус-кво сохраняется."
turkestan_events.2.a: "Мы великодушные правители."

turkestan_events.3.t: "[FROM.GetName] отказывается уступать!"
turkestan_events.3.d: "Несмотря на наши попытки разрешить вопрос мирным путём, [FROM.GetLeader] официально отверг наши усилия по достижению национального единства и начал мобилизацию [FROM.GetAdjective]их частей в попытке остановить нас демонстрацией силы. Их отказ от интеграции может означать лишь одно - необходимо немедленно направить войска на их земли и подчинить это правительство, которое уже давно не действует в интересах тюркских народов!"
turkestan_events.3.a: "Начнём сосредоточение войск у границы."
turkestan_events.3.b: "Вторжение начинается сейчас!"

turkestan_events.7.t: "[FROM.GetName] предлагает нам объединить силы"
turkestan_events.7.d: "Несмотря на то, что со времён Чингисхана, Узбек-хана и их преемников Туркестан становился всё более раздробленным, по всей стране всегда находилось множество людей, разделявших общее видение её будущего. Эти родственные по духу силы нередко были разделены горами и реками и вынуждены вести собственную борьбу за господство в своих регионах.\n\n[FROM.GetLeader] из [FROM.GetNameDef] признал нашу [ROOT.GetRulingParty] союзником в борьбе за освобождение тюркских народов. [ROOT.GetLeader] получил предложение объединить силы, ещё на шаг приблизив Туркестан к объединению без единого выстрела."
turkestan_events.7.a: "Мы принимаем от всего сердца."
turkestan_events.7.b: "Нас ничто не связывает."

turkestan_events.8.t: "[FROM.GetName] присоединяется к нашим рядам!"
turkestan_events.8.d: "Отчасти благодаря общим корням [FROM.GetRulingParty] и нашей [ROOT.GetRulingParty] наши цели, по всей видимости, на протяжении многих лет оставались схожими. [FROM.GetLeader] из [FROM.GetNameDef] согласился начать координацию наших усилий по объединению, мирно вводя [FROM.GetNameDef] в [ROOT.GetAdjective]ое лоно.\n\nЕсли удача будет на нашей стороне, объединённых сил хватит для успешного национального освобождения от охвативших страну хаоса и раздоров. Теперь, когда инициатива принадлежит нам, объединённая мощь наших войск продолжит путь к победе!"
turkestan_events.8.a: "Одна нация - одно дело."

turkestan_events.9.t: "[FROM.GetName] отвергает наш союз!"
turkestan_events.9.d: "Несмотря на общие корни [FROM.GetRulingParty] и нашей [ROOT.GetRulingParty], похоже, что за прошедшие годы наши цели разошлись. [FROM.GetLeader] из [FROM.GetNameDef] отверг наши попытки мирно объединиться против общих врагов, решив идти собственным путём.\n\nЭто предательство можно объяснить лишь их эгоизмом и неспособностью смотреть дальше собственных интересов."
turkestan_events.9.a: "Пусть [FROM.GetAdjective]ие предатели хотя бы не встают у нас на пути."

turkestan_events.10.t: "[FROM.GetName] вторгается в [ALO.GetNameDefCap]"
turkestan_events.10.d: "Сегодня [FROM.GetAdjective]ие войска пересекли границу с нашей [ALO.GetAdjective]ой автономией, что фактически означает вторжение на нашу суверенную территорию. У нас нет иного выбора, кроме как немедленно ответить!"
turkestan_events.10.a: "Они будут уничтожены за этот вызов!"

turkestan_events.11.t: "[FROM.GetName] вырывается из-под нашего контроля!"
turkestan_events.11.d: "Вчера прежнее правительство [FROM.GetNameDef] было свергнуто, и теперь власть перешла к [FROM.GetLeader]. В возникшем хаосе мы потеряли контроль над их правительством."
turkestan_events.11.a: "Обратиться к новому правительству."
turkestan_events.11.b: "Атаковать их!"

turkestan_events.50.t: "Новая столица"
turkestan_events.50.d: "После объединения Туркестана наконец пришло время определить постоянную резиденцию нового центрального правительства. Естественным выбором станет Ташкент - древний город, служивший административным центром ещё в царскую эпоху, а ныне быстро развивающийся промышленный и финансовый центр.\n\nДругой вариант - сохранить всю бюрократию в [ROOT.Capital.GetCapitalVictoryPointName] как символ нашей власти."
turkestan_events.50.a: "Ташкент."
turkestan_events.50.b: "Остаться в [ROOT.Capital.GetCapitalVictoryPointName]."

turkestan_events.185.t: "[FROM.GetAdjective]ое предложение"
turkestan_events.185.d: "Мы получили официальный запрос от [FROM.GetAdjective]ого министерства иностранных дел, в котором, выражая симпатию к нашему правительству и признавая общие цели по укреплению мира и сотрудничества между нашими государствами, [FROM.GetAdjective]ое правительство предлагает восстановить свой протекторат над нашей страной ради защиты общих интересов.\n\nРазумеется, это предложение подразумевает отказ от всякого суверенитета во внешней политике и, в некоторой степени, во внутренних делах. Но, быть может, именно такой путь соответствует нашим интересам? Как бы то ни было, хотя делегация и не заявила об этом прямо, альтернативой этому предложению, похоже, станет применение военной силы и угроза войны."
turkestan_events.185.a: "Отвергнуть их нелепое предложение!"
turkestan_events.185.b: "Подчиниться. Нам не сравниться с их военной мощью."

turkestan_events.186.t: "Протекторат над [FROM.GetNonIdeologyName]"
turkestan_events.186.d: "Приветствия из [FROM.Capital.GetName]! Дипломатические усилия нашего уважаемого министра иностранных дел принесли плоды: правительство [FROM.GetName] согласилось добровольно перейти под нашу защиту. Очевидной и куда менее приятной альтернативой стала бы военная интервенция на их территорию с последующим включением страны в наши владения. Похвально, что им хватило здравомыслия признать нашу несокрушимую силу."
turkestan_events.186.a: "Они проявили благоразумие."

turkestan_events.187.t: "Когда дипломатия оказывается бессильна..."
turkestan_events.187.d: "Несмотря на все усилия нашего министра иностранных дел, ему не удалось убедить правительство [FROM.GetName] мирно согласиться на восстановление протектората нашего государства над их жалким полуфеодальным образованием. Похоже, нам всё же придётся силой привести их в наше лоно."
turkestan_events.187.a: "Покажем им наши зубы!"

turkestan_events.199.t: "Итоги подготовки"
turkestan_events.199.d: "Мало кто мог предположить, что именно так народы Центральной Азии погрузятся в пламя войны, но теперь, когда регион охвачен бурей насилия, это уже не имеет значения. Мы годами готовились к конфликту у наших границ, однако даже при всех приложенных усилиях нас сдерживают естественные ограничения нашей казны и укоренившихся порядков. На протяжении поколений вооружённые силы нашего государства отличались прежде всего повальной коррупцией: непотизм и откровенное взяточничество определяли состав командования, а отвратительное обращение с рядовыми солдатами компенсировалось лишь их преданностью соплеменникам. Любые попытки положить конец этому застою встречали невероятное сопротивление, а порой и открытое насилие, поскольку рядовые бойцы, подстрекаемые местными племенными вождями, яростно выступали против любых попыток государства установить контроль над их военным положением.\n\nРазумеется, было бы куда проще отказаться от всех этих усилий и отложить реформы до далёкого будущего, когда у нас, возможно, появилось бы больше ресурсов или политической воли. Но как далеко бы мы ни продвинулись, час расплаты уже настал! Месяцы подготовки привели нас именно к этому моменту - Центральная Азия пылает, охваченная войной, которая испытает на прочность и народ, и государство. Мы долго и упорно готовились к этому часу, и только теперь можем узнать, что наши усилия обернулись..."
turkestan_events.199.a: "...полным провалом!"
turkestan_events.199.b: "...парой успехов среди моря неудач."
turkestan_events.199.c: "...лишь несколькими успешными реформами."
turkestan_events.199.e: "...некоторыми незначительными успехами."
turkestan_events.199.f: "...умеренно успешными реформами!"
turkestan_events.199.g: "...качественными реформами в большинстве областей!"
turkestan_events.199.h: "...масштабными и всеобъемлющими реформами!"

turkestan_events.200.t: "Тупик в Центральноазиатской войне"
turkestan_events.200.d: "Положение в Центральной Азии стало невыносимым. Великая [ROOT.GetAdjective]ая армия увязла в пустынях, степях и нагорьях этой проклятой дыры, со всех сторон подвергаясь нападениям бандитских отрядов. Что ещё хуже, весь мир смеётся над нашими страданиями! Пока отечественные газеты добросовестно сообщали с передовой о наших бесчисленных победах и доблестной борьбе, османские журналисты находились среди наших врагов и рисовали образ героического сопротивления романтической горстки центральноазиатских воинов. Их небылицы о нашей якобы вопиющей некомпетентности и провалах разошлись по всему миру и проникли даже в дома наших собственных граждан, которые всё чаще требуют объяснений и ответственности от военного командования, постоянно проводя параллели с путчем 1925 года.\n\nПоскольку политическая воля решительно обернулась против продолжения нашей интервенции в Центральную Азию, мы были вынуждены сесть за стол переговоров с противостоящими нам бандитскими государствами. Мы не можем позволить себе подрывать внутриполитическое положение и усиливать международное давление на правительство, особенно ради ничтожных выгод, которые принесёт затяжная победа на истощение. Ответ очевиден, хотя принять его нелегко: мы должны полностью уйти из региона, пока бесконечная трясина степной войны не поглотила всё наше правительство."
turkestan_events.200.a: "Печальный день для России."

turkestan_misc.100.t: "Рекордная добыча золота на рудниках!"
turkestan_misc.100.d: "[ROOT.GetNameDefCap] с его засушливыми ландшафтами давно известен огромными природными богатствами, особенно богатыми залежами золота, скрытыми под землёй. Во второй половине XIX века эти ресурсы привлекли внимание России, что вызвало значительный приток иностранных инвестиций в развитие горнодобывающей инфраструктуры.\n\nХотя этот капитал обогатил российские предприятия и государственную казну, местная экономика получила от него мало пользы, если не считать трудоёмких рабочих мест и ущерба окружающей среде. Однако благодаря недавним инвестициям в добывающую отрасль мы теперь столкнулись с настоящим изобилием золота. Как лучше всего воспользоваться этой возможностью?"
turkestan_misc.100.a: "Продать его за границу, а с прибылью разберёмся позже."
turkestan_misc.100.b: "Вложить этот капитал во внутреннюю экономику."
turkestan_misc.100.c: "Новый военный объект укрепит нашу военную мощь."

turkestan_misc.1.t: "Земля кочевников"
turkestan_misc.1.d: ""

turkestan_misc.200.t: "Прибытие курбаши моджахедов"
turkestan_misc.200.d: "После поражения моджахедов на родине один из их кушбеги вместе со своими сторонниками пересёк границу и прибыл к нам, чтобы возглавить наши вооружённые отряды."
turkestan_misc.200.a: "Прекрасно!"
turkestan_misc.200.b: "Прогнать их!"

turkestan_misc.201.t: "Бухарский эмир в изгнании"
turkestan_misc.201.d: "После упразднения монархии в Бухарском эмирате его эмир Мохаммед Алим-хан был вынужден искать убежища в нашей стране. Похоже, пока нам не остаётся ничего иного, кроме как с почестями принять его."
turkestan_misc.201.a: "Последний эмир Бухары?"

turkestan_misc.215.t: "[FROM.GetName] закупает снаряжение"
turkestan_misc.215.d: "Сегодня к нам обратилось [FROM.GetAdjective]ое министерство обороны с просьбой поставить военное снаряжение, которое поможет модернизировать их устаревшие вооружённые силы. Сделка прошла успешно, и мы своевременно получили оплату."
turkestan_misc.215.a: "Прекрасно!"
turkestan_misc.215.b: "Разорвать сделку!"

turkestan_misc.216.t: "[FROM.GetName] отказывается!"
turkestan_misc.216.d: "К сожалению, [FROM.GetAdjective]ое правительство отказалось наладить с нами поставки вооружения!"
turkestan_misc.216.a: "Жаль..."

turkestan_misc.217.t: "[FROM.GetName] соглашается!"
turkestan_misc.217.d: "[FROM.GetAdjective]ое правительство согласилось наладить с нами поставки вооружения!"
turkestan_misc.217.a: "Прекрасно!"

### Ideas ###
central_asia_preparation_level_1: "Провал кампании по подготовке"
central_asia_preparation_level_1_desc: "Подобно экзотическим нелетающим птицам далёких земель, мы решили поглубже зарыть голову в песок, игнорируя острую необходимость реформирования армии. То ли из-за неумелого управления и бездействия правительства, то ли из-за активного сопротивления консервативных и традиционалистских сил страны, но предложенные в последние годы реформы полностью провалились. В итоге наши вооружённые силы представляют собой сборище бандитов и ополченцев, которое едва ли можно назвать армией и которое скорее ограбит собственное население, чем встретит врага в бою."
central_asia_preparation_level_2: "Срыв кампании по подготовке"
central_asia_preparation_level_2_desc: "В древней персидской притче о скорпионе и черепахе, даже когда черепаха усердно трудится ради себя и своего друга скорпиона, тот ничего не может поделать со своей природой и всё равно пытается погубить их обоих. Такова природа скорпиона, и такова же природа племенного вождя и басмаческого полевого командира, который умеет лишь накапливать личную власть и сопротивляться любым попыткам превратить нашу армию в современную боевую силу. Задушив наши попытки провести военную реформу, эти люди сохранили за собой положение вождей, одновременно обрекая и себя, и свои народы на завоевание чужеземцами и поражение."
central_asia_preparation_level_3: "Неэффективная кампания по подготовке"
central_asia_preparation_level_3_desc: "Для реформирования армии были предприняты значительные шаги: мы избавлялись от бесполезных элементов в наших рядах и пытались вырезать прогнившее ядро коррупции среди офицерства. Однако первоначальный оптимизм уступил осознанию того, что сколь бы вдохновляющими ни были наши реформы, их практическое осуществление оказалось далеко от задуманного. Некоторые преобразования сумели ускользнуть от настороженного взгляда традиционалистов, и нам удалось устранить наиболее вопиющие проявления некомпетентности, но коррупция и посредственность по-прежнему безраздельно господствуют в армии."
central_asia_preparation_level_4: "Поспешная кампания по подготовке"
central_asia_preparation_level_4_desc: "Лучше потратить время и с первого раза сделать всё правильно, чем торопиться и потерпеть неудачу. Обычно эту максиму применяют к плотницкому делу или архитектуре, где худшим результатом плохого управления становятся перекошенные хижины или криво собранная мебель. Однако в случае реформы нашей армии последствия куда серьёзнее: неспособность довести начатое до конца поставила под угрозу оборону всей страны. В самом сердце армии продолжают гнить серьёзные недостатки, а коррупция, десятилетиями разъедавшая офицерский корпус, получила удар, но так и не была искоренена."
central_asia_preparation_level_5: "Незавершённая кампания по подготовке"
central_asia_preparation_level_5_desc: "И руководство страны, и армейское командование возлагали большие надежды на кампанию военной подготовки, однако внезапное начало войны в регионе уничтожило всякую возможность провести действительно всеобъемлющую реформу. Продержись мир ещё несколько лет, мы, возможно, смогли бы устранить оставшиеся злоупотребления и недостатки и окончательно завершить преобразования. Тем не менее проделанная работа была поистине титанической, а её результаты можно считать удовлетворительными. Некоторые подразделения вооружённых сил были полностью реформированы, хотя проблемы сохраняются в большинстве частей, а укоренившаяся культура коррупции ослаблена, пусть и не уничтожена окончательно."
central_asia_preparation_level_6: "Плодотворная кампания по подготовке"
central_asia_preparation_level_6_desc: "Каким бы успешным ни было начинание, всегда остаётся место для ещё более великой победы. Мы сделали то, что многие считали невозможным, превратив бесцельные банды нашего государства хотя бы в подобие настоящей армии. Среди офицеров, снабженцев и армейских чиновников всё ещё сохраняются отдельные проявления коррупции и некомпетентности, однако худшие нарушители были изгнаны, а остальных приструнило их падение. Что касается рядовых солдат, их желудки и патронные ящики полны, они знают, каким концом винтовки следует целиться во врага, и готовы встретиться с любым противником."
central_asia_preparation_level_7: "Триумфальная кампания по подготовке"
central_asia_preparation_level_7_desc: "Лихорадочная кампания по подготовке к войне за последний год принесла выдающиеся результаты, и наша армия ушла далеко вперёд от того жалкого состояния, в котором находилась всего несколько месяцев назад. Благодаря решительному курсу на модернизацию и профессионализацию, а также значительным вложениям во все составляющие вооружённых сил мы начали совершенно новую главу. Разумеется, коррупция и неумелое управление всё ещё не исчезли полностью! Лишь глупец способен поверить, что огромный государственный корабль может полностью изменить курс за один год. И всё же времена повального взяточничества, преступности и непотизма остались далеко позади, а наши армии ждёт светлое будущее, если они переживут ближайшие месяцы."

### Shared Focuses ###

UZB_Turkestani_Military: "[ROOT.GetAdjective]ие вооружённые силы"
UZB_Turkestani_Military_desc: "Сильному государству нужна сильная армия, а наши нынешние силы таковой назвать нельзя. Мы должны наконец начать процесс военной модернизации, чтобы наша армия могла сравниться со славными ордами Тамерлана!"

UZB_Recruiting_Effort: "Расширить набор"
UZB_Recruiting_Effort_desc: "Любой армии нужны солдаты, это очевидно. К сожалению, наше правительство давно сталкивается с нехваткой людей, являющихся на военную службу. Пришло время развернуть полноценную кампанию по набору."

UZB_Nomad_Legacy: "Наследие кочевников"
UZB_Nomad_Legacy_desc: "На протяжении многих столетий нашу страну населяли воинственные кочевники. Их подвиги стали легендарными, особенно деяния армий Тимура. Нам следует принять собственное наследие и строить военную тактику по образцу воинов прошлого."

UZB_Train_Our_Officers: "Обучить наших офицеров"
UZB_Train_Our_Officers_desc: "Современной армии необходимы высококвалифицированные командиры, которых нам сейчас отчаянно не хватает. Будет открыта новая офицерская школа, которая подготовит будущих военачальников и принесёт нам множество побед."

UZB_Desert_Logistics: "Логистика в пустыне"
UZB_Desert_Logistics_desc: "Чтобы добиться успеха в пустынях Центральной Азии, необходимо понимать их и стать с ними единым целым. Нашей армии следует привить такое мышление, чтобы солдаты могли выживать среди суровых песков Туркестана."

UZB_Mounitain_Logistics: "Логистика в горах"
UZB_Mounitain_Logistics_desc: "Некоторые районы Центральной Азии покрыты высокими горами и чрезвычайно трудны для манёвра. Нашим войскам необходимы особая подготовка и навыки, чтобы эффективно действовать в подобных условиях."

UZB_Mobilize_The_Tribes: "Мобилизовать племена"
UZB_Mobilize_The_Tribes_desc: "В наших краях живёт больше тюркских племён, чем кто-либо способен сосчитать. По большей части они ведут кочевой образ жизни, но являются хорошими и рвущимися в бой воинами, которых можно без труда привлечь в нашу армию."

UZB_Officer_School: "Офицерские школы"
UZB_Officer_School_desc: "Подготовка офицеров идёт успешно, и всё больше людей желают поступить на обучение. Однако существующих учреждений уже недостаточно, чтобы принять всех желающих. Пора открыть новые школы."

UZB_New_Equipment: "Новое снаряжение"
UZB_New_Equipment_desc: "Изучая более современные иностранные образцы военного снаряжения, мы сможем создать оружие, которое обеспечит наши неизбежные победы в будущих конфликтах."

