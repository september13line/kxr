### Bookmarks ###
ALO_KR_GATHERING_STORM_DESC: "Алашская автономия была создана по итогам Всероссийского учредительного собрания, когда местное мусульманское население проголосовало за автономию в составе России. С тех пор она существует под властью партии «Алаш», проводящей социальную модернизацию среди своего народа. Однако растущая зависимость от России вызывает всё больше опасений: должен ли благородный казахский народ и дальше мириться с российской колониальной политикой?"
UZB_KR_GATHERING_STORM_DESC: "Бухарский эмират остаётся одним из островков стабильности в Центральной Азии, однако глубоко погряз в собственных проблемах и трудностях. Под средневековым по своему характеру правлением эмира Бухара остро нуждается в модернизации бюрократии, армии и государственного строя."
TRK_KR_GATHERING_STORM_DESC: "Туркестанская Республика, созданная белыми после Гражданской войны, расколота между многочисленными оппозиционными фракциями, а отдельные районы страны контролируются полевыми командирами, считающими себя незаслуженно забытыми победителями той войны. Сумеет ли республика выжить или обратится к радикальным идеологиям - пока неизвестно."
KHI_KR_GATHERING_STORM_DESC: "Существование Хивинского ханства в значительной степени обеспечивалось его более сильным соседом - Бухарой. С 1918 года ханством управляет военный диктатор, визирь Джунаид-хан. Однако его здоровье неуклонно ухудшается, и без харизматичного лидера сама страна рискует прекратить существование."
