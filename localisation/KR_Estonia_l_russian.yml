EST_join_scandinavian_defense_union: "Вступить в Скандинавский оборонительный Союз"
EST_join_scandinavian_defense_union_desc: "Скандинавский оборонительный союз был основан демократическими странами Дании, Норвегии и Швеции для сдерживания внешних сил от вторжения в регион. Наши братья в Финляндии уже сочли нужным присоединиться к ним в этом начинании, так что, возможно, будет разумно, если мы сделаем то же самое?"

EST_join_nordic_council: "Вступить в Северную федерацию"
EST_join_nordic_council_desc: "Наши датские, финские, норвежские и шведские товарищи вступили в федерацию друг с другом. Может быть, Эстония и не скандинавская страна, но мы придерживаемся тех же демократических идеалов, что и наши соседи. Мы можем в любой момент подать заявку на вступление в федерацию, хотя это повлечет за собой отказ от части нашего суверенитета."

EST_join_reichspakt: "Вступить в Рейхспакт"
EST_join_reichspakt_desc: "Несмотря на то, что мы совсем недавно получили независимость от немцев, амбиции русских не знают границ. Присоединение к Рейхспакту в качестве независимой нации будет лучшим способом обеспечить нашу дальнейшую независимость."

EST_join_moscow_accord: "Присоединиться к Московскому пакту"
EST_join_moscow_accord_desc: "Рига и немцы могут в любой момент нанести нам ответный удар и попытаться восстановить своё отвратительное герцогство. В наших интересах искать союза с русскими, чтобы у Кайзера не возникло дурных идей."

### Events ###
KREST.1.t: "Возвращение остатка"
KREST.1.d: "И латыши, и эстонцы приветствовали начало Мировой войны и поддержали военные усилия России, полагая, что демонстрация патриотизма предоставит им автономный статус - и для Эстонии, казалось, авантюра окупилась. Россия предоставила Эстонии национальную автономию после Февральской революции, и она избрала своё первое правительство - Маапаэв - однако его время было недолгим, поскольку вспышка Октябрьской революции и немецкое вторжение вынудили его уйти в подполье. Но перед этим, 24 февраля, была провозглашена независимость Эстонской Республики и сформировано Эстонское временное правительство.\n\nКогда немецкая оккупация стала постоянной, эстонское население всё чаще обращалось к сопротивлению, часто при поддержке большевиков по соседству - между немецкими оккупационными силами и добровольцами Омакайтсе вспыхнули партизанская война и даже открытые боестолкновения, пока в конце концов Временное правительство не было вынуждено бежать, оставив Объединённое Балтийское герцогство позади и прибыв на скандинавские берега.\n\nОбветшав за десятилетие, оно обрело новую жизнь в 1930 году, когда в Петрограде был проведён Эстонский национальный конгресс, избравший новое правительство в изгнании - во главе с ветераном Войны за независимость и талантливым оратором Артуром Сирком. Шесть лет спустя Объединённое Балтийское герцогство пало, и эстонские партизаны приветствуют возвращение своего правительства в изгнании - однако не всё спокойно в Таллине, поскольку Сирк становится всё более авторитарным лидером, и демократия в Эстонии может угаснуть и умереть, если он останется у власти..."
KREST.1.a: "Эстония выстоит!"

KREST.5.t: "Балтийские немцы просят школы"
KREST.5.d: "Небольшая группа балтийских немцев попросила представителей правительства Сирка разрешить открыть школы с языком обучения немецким, а не эстонским. Однако они подчёркивают, что в этих школах будет преподаваться эстонский язык, и они более чем счастливы предоставить свою учебную программу для проверки.\n\nЭто рассматривается как вариант для Сирка и его правительства занять моральное превосходство над своими бывшими хозяевами, но есть и те в правительстве, кто не может подставить другую щёку, а скорее предпочтёт выколоть глаз."
KREST.5.a: "Давайте успокоим их."
KREST.5.b: "В Эстонии разрешён только эстонский язык."

KREST.15.t: "Таллинский указ"
KREST.15.d: "В своём заявлении Сирк декретировал, что Омакайтсе будет подчиняться его канцелярии, а не армии. Это вызвало общественное возмущение, поскольку многие видят в этом ещё один шаг Сирка к тому, чтобы стать диктатором Эстонии, и считают, что Сирк стремится лишь сохранить свою власть над Эстонией. И Улуотс, и Тыниссон критиковали Сирка, заявляя, что в то время как большинство эстонцев сражались за свою свободу, Сирк бежал в Финляндию и поэтому лишь едва участвовал в восстановлении национальной государственности. В ответ Сирк разнёс и Улуотса, и Тыниссона за попытки разделить страну и заявил, что оба лишь пытаются продать Эстонию иностранным державам. Так или иначе, требования конституции растут, и Сирк начинает считать свою позицию несостоятельной."
KREST.15.a: "Что ж, прямо в огонь."

KREST.21.t: "Сирк делает ход"
KREST.21.d: "В условиях растущих требований к Сирку и временному правительству позволить провести референдум по конституции, Сирк, в целях консолидации своей власти, сформировал Eesti Vabadussõjalaste Liit, vabadussõjalased (Союз участников Эстонской войны за независимость), или партию Vaps. Теперь, будучи «легитимной» партией, Сирк маневрировал, чтобы оказаться в положении, позволяющем ему диктовать «условия» временному правительству.\n\nУсловия предусматривают создание должности Президента Эстонии с законодательной и исполнительной властью, который будет исполнять роль Главы государства и Путеводителя нации, и утвердить себя Председателем Эстонского национального комитета как первого президента по этому закону. Недавно сформированное военизированное формирование Vaps охраняет Рийгикогу, чтобы гарантировать отсутствие «внешних» помех."
KREST.21.a: "Это во благо нации..."
KREST.21.b: "Никогда, Эстония будет демократической нацией!"

KREST.25.t: "Оппозиция осуждает Сирка"
KREST.25.d: "В результате решения Артура Сирка держать Омакайтсе отдельно от военных, а также предложения провести референдум, который сделал бы его фактически пожизненным диктатором, демократическая оппозиция осудила Сирка и движение Vapsid. Называя их опасную и автократическую политику доказательством того, что они уничтожат Отечество, Юри Улуотс призвал всех истинных эстонцев сопротивляться этому референдуму."
KREST.25.a: "Ничто не даётся легко."

KREST.26.t: "Встреча гигантов"
KREST.26.d: "В ответ на призыв Сирка к референдуму силы, собравшиеся вокруг Юри Улуотса и его Isamaaliit, решили встретиться с силами Яана Тыниссона и его Национального фронта. Хотя Isamaaliit более авторитарны и выступают за сильного президента, они всё же демократическая партия, и Национальный фронт был бы готов сотрудничать с ними в обмен на некоторые уступки. Среди них было бы то, что, хотя Тыниссон позволит президентство Улуотса и корпоративную верхнюю палату законодательного органа, нижняя палата должна быть демократической. Тыниссон также потребовал, чтобы, когда придёт время, им разрешили вести переговоры с Ригой, а не быть вынужденными сражаться с ними. Если Улуотс примет этот компромисс, то Национальный фронт полностью поддержит то, что некоторые называют попыткой переворота против референдума Сирка."
KREST.26.a: "Связаться с генералом Лайдонером, у нас есть сделка."
KREST.26.b: "Эти требования неприемлемы!"

KREST.27.t: "Артур Сирк бежит!"
KREST.27.d: "Неожиданным ходом военные силы под руководством генерала Йохана Лайдонера вошли в столицу с явной целью арестовать Артура Сирка и лидеров движения Vapsid. В то же время делегаты Национального фронта и Патриотической лиги отклонили референдум и вместо этого провели голосование по избранию Юри Улуотса новым президентом Эстонии, в то время как Яан Тыниссон и его Национальный фронт взяли под контроль нижнюю палату. Силы под командованием генерала Лайдонера были эффективны в установлении контроля над городом и аресте лидеров движения Vapsid, но сам Артур Сирк бежал."
KREST.27.a: "Пусть бежит, как трус, которым он и является."

KREST.28.t: "Неудавшийся военный переворот"
KREST.28.d: "Артур Сирк и движение Vapsid обеспечили безопасность и свободу Эстонского Отечества от сил коррумпированных клептократов. Утром в день результатов референдума военные силы под командованием генерала Лайдонера попытались совершить государственный переворот при помощи Патриотической лиги. Однако им не удалось установить контроль над столицей, когда силы и делегаты, верные Национальному фронту, отказались помогать перевороту. Генерал Лайдонер был немедленно арестован вместе со своим сообщником Юри Улуотсом и Патриотической лигой, в то время как Яан Тыниссон и его Национальный фронт также были замешаны в попытке переворота и немедленно арестованы, когда информация о тайных встречах и переговорах между ними просочилась в прессу. Теперь, когда оппозиция в цепях из-за своих незаконных и недемократических действий, референдум прошёл в ускоренном темпе и был принят без проблем, прочно поместив Артура Сирка и Vapsids у власти."
KREST.28.a: "Демократическая форма правления недостаточна для защиты Отечества."

KREST.29.t: "Артур Сирк выброшен из окна"
KREST.29.d: "Новости из Финляндии, похоже, указывают на то, что Артур Сирк, бывший лидер Эстонии и движения Vapsid, найден мёртвым. Сообщения очевидцев указывают на то, что в воскресенье в 11:37 утра Артур Сирк был выброшен из окна 5-го этажа отеля, в котором он проживал. Точная причина, по которой он был выброшен в окно, неизвестна - местная полиция всё ещё расследует, но самоубийство исключено."
KREST.29.a: "Прощайте, мистер Сирк."

KREST.30.t: "Временное правительство голосует против референдума"
KREST.30.d: "Временное правительство под руководством Сирка отказалось поддержать призывы к референдуму, который установил бы Сирка пожизненным диктатором, вместо этого призвав к созданию демократической конституции. Хотя этот шаг не был предусмотрен, Сирк настаивает на создании своего автократического государства, в то время как демократические силы, связанные с PER, Национальным фронтом, возмущены этой вопиющей попыткой подорвать эстонскую демократию."
KREST.30.a: "Возмутительно!"

KREST.31.t: "Патриотическая лига поддерживает Национальный фронт"
KREST.31.d: "В свете недавних событий Улуотс и Патриотическая лига объявили о своей поддержке Национального фронта, ссылаясь на необходимость противостоять Сирку любыми необходимыми средствами. Будучи более воинственными, чем PER, они по крайней мере готовы поддержать протесты, спонсируемые Национальным фронтом. Хотя пока они не выдвигали никаких требований, нельзя ожидать, что это продлится вечно, особенно если Национальный фронт придёт к власти."
KREST.31.a: "Вместе лучше, чем порознь."

KREST.32.t: "Критика из-за рубежа и внутри страны"
KREST.32.d: "Раздор в Эстонии привлёк внимание не только местных СМИ, но и зарубежных трансляций, поскольку комментаторы по всей Европе сообщают о провалившемся референдуме и, казалось бы, надвигающейся диктатуре Сирка. Журналисты из Германии, Финляндии, Швеции и Литвы делают заявления, осуждающие попытку захвата власти Сирком и поддерживающие формирование умеренного и демократического режима при Тыниссоне. Хотя это, безусловно, побудило некоторых эстонцев поддержать Национальный фронт, другие всё ещё осторожны и ждут, что будет дальше."
KREST.32.a: "Никогда не думал, что буду благодарить либеральные СМИ."

KREST.33.t: "Тыниссон требует отставки Сирка"
KREST.33.d: "Когда всё достигло апогея, Яан Тыниссон вместе с Юри Улуотсом и их сторонниками подали открытое письмо с требованием немедленной отставки Артура Сирка. Они требуют, чтобы он распустил движение Vapsid, ушёл в отставку с поста временного президента и передал гражданский контроль PER, чтобы можно было сформулировать демократическую конституцию. Артур Сирк проявил сопротивление, заявив, что Эстонии нужен сильный лидер и ещё более сильная рука, чтобы вести её к процветанию и сохранять независимость от немецкой и русской агрессии. Конечно, Тыниссон сказал, что это глупо, и переговоры с немцами в Риге спасут Эстонию от войны..."
KREST.33.a: "Пришло время покончить с движением Vaps."
KREST.33.b: "Нет, не думаю, что я это сделаю."

KREST.34.t: "Сирк уходит в отставку"
KREST.34.d: "В результате протестов по всей стране, давления со стороны как внутренних, так и зарубежных СМИ и отсутствия поддержки в правительстве Сирк решил уйти в отставку и передать власть коалиции Национального фронта под руководством Яана Тыниссона. С его отставкой Национальный фронт начнёт процесс создания демократической конституции, основанной на парламентаризме, отмене должности президента и создании институтов для защиты и обучения эстонских граждан демократическим процессам управления. Сирк тем временем в опале бежал из страны."
KREST.34.a: "Я люблю демократию."

KREST.35.t: "Сирк объявляет себя пожизненным президентом"
KREST.35.d: "Национальный фронт и его союзники сильно поставили на то, что протесты и огромное давление на Сирка заставят его уйти в отставку, и они всё проиграли. Вместо этого Сирк укрепил свою решимость и решимость своих последователей, заставив многих протестующих задаться вопросом, зачем они вообще там были. Выжидая, протесты потеряли импульс, а внимание СМИ начало ослабевать, что позволило Сирку консолидировать свою власть в правительстве и принять несколько резолюций, подавляющих Национальный фронт, а также арестовать Улуотса и Тыниссона за подстрекательство. С их лидерами в цепях и их боевым духом сломленным, PER больше не существует."
KREST.35.a: "Так умирает свобода - под громовые аплодисменты."

KREST.36.t: "Эстония стремится присоединиться к Миттельевропе"
KREST.36.d: "Новость о том, что Эстония, которая освободилась от власти Объединённого Балтийского герцогства, теперь просит присоединиться к Миттельевропе, стала шоком для большинства в Берлине. Они стремятся возродить связи с Германией и создать барьер против русской угрозы, но должны ли мы принять их просьбу?"
KREST.36.a: "Хорошо."
KREST.36.b: "Мы не можем согласиться на это."

KREST.37.t: "Эстония присоединяется к Миттельевропе"
KREST.37.d: "Ссылаясь на необходимость более тесного сотрудничества и взаимных экономических связей, Германия согласилась включить Эстонию в Миттельевропу. Вхождение в сферу влияния Германии, несомненно, поможет защитить безопасность эстонского народа от русского реваншизма."
KREST.37.a: "Очень хорошо."

KREST.38.t: "Эстонии отказано в членстве в Миттельевропе"
KREST.38.d: "Наше предложение о вступлении в Миттельевропу было отклонено Германией. Немецкий делегат выдвинул несколько невыносимых и оскорбительных требований, которые фактически восстановили бы Эстонию в статусе герцогства, а не сделали бы её по-настоящему независимой. Мы не могли терпеть такие требования, и поэтому Германия отказала нам в доступе на свои рынки."
KREST.38.a: "Что ж, это нехорошо."

KREST.39.t: "Торговля с Эстонией?"
KREST.39.d: "Эстонцы обратились к нам с предложением торговать товарами и услугами, утверждая, что открытие свободной торговли между двумя нашими странами пойдёт нам только на пользу. Их экономика очень мала по сравнению с нашей, но у них также есть обширные запасы сланцевой нефти, которую мы могли бы помочь финансировать и таким образом обеспечить себе более стабильный источник топлива."
KREST.39.a: "Мы были бы более чем рады торговать."
KREST.39.b: "Мы отклоним ваше предложение."

KREST.40.t: "Россия соглашается на торговлю"
KREST.40.d: "Россия согласилась торговать с нами."
KREST.40.a: "Хорошо."

KREST.41.t: "Россия отказывается от торговли"
KREST.41.d: "Россия отказалась торговать с нами."
KREST.41.a: "Плохо."

KREST.42.t: "Вопрос о профсоюзах"
KREST.42.d: "Хотя нам больше не нужно бороться за влияние над профсоюзами с движением Vaps, мы не полностью контролируем подавляющее их большинство. Вместо этого многие из них имеют либеральные или даже откровенно социалистические наклонности, что сделает сотрудничество и кооперацию сложными. Мы могли бы пойти на уступки им, завоевав их расположение и получив большую поддержку, или мы могли бы удалить многих их лидеров скрытными средствами. Хотя это было бы более эффективно для установления прямого контроля над ними, это заставило бы многих их последователей сомневаться в легитимности нашей власти."
KREST.42.a: "Предоставить профсоюзам автономию."
KREST.42.b: "Прямой контроль над профсоюзами был бы лучше."

KREST.43.t: "Борьба с плутократами"
KREST.43.d: "Буржуазия контролирует подавляющее большинство богатств и ресурсов Эстонии, и если мы собираемся проводить наши программы массовой индустриализации и механизации, нам понадобится доступ к ним. Вопрос не в том, должны ли мы иметь с ними дело, а в том, как мы будем с ними иметь дело. Их огромная власть и богатство должны быть нашими, и они будут нашими. Верхняя палата уже состоит из союзных корпоративистов и бизнес-лидеров, связанных с нами, поэтому было бы просто протянуть оливковую ветвь остальной плутократии нации, чтобы они присоединились к нам для особого разрешения. Альтернатива же - использовать обширную власть государства в нашем распоряжении, чтобы угрожать и убеждать этих буржуазных псевдоаристократов поддерживать наши начинания."
KREST.43.a: "Дать им места в Верхней палате."
KREST.43.b: "Всё, что у них есть, должно служить Государству."

KREST.44.t: "Реформа бюрократии"
KREST.44.d: "Чтобы более эффективно проводить наши реформы и выполнять наши программы, нам нужно устранить любые и все барьеры для нашего режима. Поместив новые бюрократические администрации под руководство Нижней палаты, мы можем лучше сосредоточиться на наших задачах и реформах, одновременно располагая к себе оппозицию; однако мы также можем напрямую назначить лояльных нам бюрократов и вовсе обойти Нижнюю палату. Хотя это сделает правительство более эффективным и сэкономит расходы, мы оттолкнём демократическую оппозицию."
KREST.44.a: "Поместить это под Нижнюю палату."
KREST.44.b: "Назначить лояльных администраторов."

KREST.45.t1: "Нижняя палата обеспечивает власть"
KREST.45.t2: "Isamaaliit с трудом обеспечивает власть"
KREST.45.t3: "Isamaaliit обеспечивает верховную власть"
KREST.45.d1: "Поскольку правительство Isamaaliit не смогло эффективно заручиться поддержкой профсоюзов, бизнеса или даже самой бюрократии, народ потерял веру в своё правительство. В связи с этим поворотом событий демократическая Нижняя палата во главе с демократической оппозицией выступила за роспуск Верхнего сената и отстранение Isamaaliit от власти."
KREST.45.d2: "Правительству Isamaaliit удалось заручиться достаточной поддержкой профсоюзов, буржуазии и бюрократии, чтобы убедить народ Эстонии поддержать их платформу реформ и промышленной модернизации. Хотя Нижняя палата сохраняет значительную долю влияния и власти в правительстве, доминирование Isamaaliit было сохранено."
KREST.45.d3: "За последние несколько месяцев правительству Isamaaliit удалось заручиться поддержкой профсоюзов, бизнеса и бюрократии далеко за пределами всех ожиданий. Благодаря смелым политическим манёврам и интригам, причём некоторые даже обвиняют Isamaaliit в откровенно нечестных и, возможно, даже незаконных действиях, Isamaaliit имеет полный контроль над правительством, бизнесом и народным голосованием."
KREST.45.a: "Это конец правительства Isamaaliit."
KREST.45.b: "Это была дорогостоящая победа."
KREST.45.c: "Мы только начали."

KREST.46.t: "Статус исполнительной власти"
KREST.46.d: "Статья V Эстонской конституции:\n\n «Правительство состоит из Государственного старейшины (Riigiwanem) и министров. Количество последних, их должности и детальный порядок ведения дел устанавливаются специальным законом. Государственный старейшина представляет Эстонскую Республику, руководит и объединяет деятельность Республиканского правительства, председательствует на заседаниях Правительства и уполномочен подвергать допросу любого отдельного министра. Глава государства и министры могут быть привлечены к суду за обычные правонарушения только на основании соответствующих решений Государственного собрания. Рассмотрение находится в юрисдикции Государственного суда». По мере того как делегаты утверждают статью, остаётся один вопрос. Как будет избираться Государственный старейшина - через Рийгикогу или через волю народа?"
KREST.46.a: "Государственный старейшина будет избираться Рийгикогу."
KREST.46.b: "Государственный старейшина будет избираться всенародным голосованием."

KREST.47.t: "Статус Верховного суда"
KREST.47.d: "Статья VI Эстонской конституции:\n\n «Правосудие в Эстонии осуществляется судами, которые независимы в своей деятельности. Высшая судебная власть в Эстонии осуществляется Государственным судом, состоящим из государственных судей, избираемых Государственным собранием». По мере того как делегаты выражают одобрение создания Эстонского Верховного суда, остаётся вопрос. Должны ли назначения в Верховный суд определяться волей эстонского народа, или Государственный старейшина должен иметь возможность назначать тех, кому он доверяет?"
KREST.47.a: "Верховный суд будет утверждаться Рийгикогу."
KREST.47.b: "Верховный суд будет утверждаться Государственным старейшиной."

KREST.48.t: "Статус Рийгикогу"
KREST.48.d: "Статья VII Эстонской конституции:\n\n «Рийгикогу состоит из 100 членов, избираемых всеобщим, равным, прямым и тайным голосованием на основе пропорционального представительства. Государственное собрание имеет право увеличивать количество своих членов. Закон, установленный в связи с этим, вступает в силу на следующих выборах Государственного собрания. Избирательный закон Государственного собрания будет принят как специальный закон. Государственное собрание принимает законы, устанавливает бюджет, государственные доходы и расходы и принимает решения о займах и других вопросах на основе Конституции». По мере того как делегаты дорабатывают Конституцию, возник вопрос о представительстве. Как народ может выбирать своих представителей справедливо и так, чтобы они отражали их истинные интересы?"
KREST.48.a: "Представители будут определяться мажоритарной системой относительного большинства."
KREST.48.b: "Представители будут определяться через пропорциональное голосование."

KREST.49.t: "Первые всеобщие выборы"
KREST.49.d1: "Избирательные участки закрыты, и результаты первых свободных выборов в истории Эстонской Республики получены! После дней утомительных дебатов и дискуссий победу одержала Eesti Rahvaerakond (Эстонская народная партия).\n\nПредставляет Eesti Rahvaerakond Яан Тыниссон, ранний борец за эстонское национальное дело и бывший выпускник Тартуского университета. Тыниссон неустанно боролся за независимость Эстонии в русский и немецкий периоды и обязался обеспечить плавный переход эстонской демократии. Поздравляем нового президента!"
KREST.49.d2: "Избирательные участки закрыты, и результаты первых свободных выборов в истории Эстонской Республики получены! После дней утомительных дебатов и дискуссий победу одержала Eesti Rahvaerakond (Эстонская народная партия), хотя несколько центристских независимых кандидатов поддерживают новую администрацию в обмен на некоторые незначительные либеральные уступки.\n\nВозглавляет правительство Яан Тыниссон, ранний борец за эстонское национальное дело и бывший выпускник Тартуского университета. Тыниссон неустанно боролся за независимость Эстонии в русский и немецкий периоды и обязался обеспечить плавный переход эстонской демократии. Поздравляем нового президента!"
KREST.49.d3: "Избирательные участки закрыты, и результаты первых свободных выборов в истории Эстонской Республики получены! После дней утомительных дебатов и дискуссий победу одержала Eesti Tööerakond (Эстонская лейбористская партия).\n\nВозглавляет правительство Отто Страндман, юрист из Тартуского университета, известный своим красноречием. Страндман пообещал радикальную земельную реформу и защиту аграрной экономики Эстонии. Поздравляем нового президента!"
KREST.49.d4: "Избирательные участки закрыты, и результаты первых свободных выборов в истории Эстонской Республики получены! После дней утомительных дебатов и дискуссий победу одержала социал-демократическая партия Eesti Sotsiaaldemokraatlik Tööliste Partei (Эстонская социал-демократическая рабочая партия).\n\nПредставляет партию Август Рей, который участвовал в Русской революции 1905 года и является ветераном Мировой войны и войны за независимость. Рей пообещал провести земельную реформу и защитить права всех эстонских граждан. Поздравляем нового президента!"
KREST.49.a: "Тыниссон одерживает абсолютную победу!"
KREST.49.b: "Тыниссон лидирует из центра!"
KREST.49.c: "Страндман одерживает неожиданную победу!"
KREST.49.d: "Август Рей побеждает!"

KREST.83.t: "Эстония хочет присоединиться к нам"
KREST.83.d: "Недавно созданная Эстонская республика обратилась к нам, стремясь загладить свою вину, несмотря на историю оккупации под нашим правлением - в обмен на признание их независимости и военный союз они передадут свою армию и ресурсы на нашу сторону и даже предложат торговые контракты."
KREST.83.a: "Впустить их."
KREST.83.b: "А что, если нет?"

RUS_will_demand_annexation_after_liberation_of_all_baltics: "У нас будет возможность интегрировать §H[FROM.GetFlag] [FROM.GetName]§! после освобождения всех прибалтийских земель."

KREST.84.t: "[FROM.GetNameDefCap] отказывается"
KREST.84.d: "[FROM.GetNameDefCap] отказывается от нашего предложения присоединиться к их фракции, оставив нас в одиночестве на всё более изменчивой геополитической сцене Европы."
KREST.84.a: "Очень прискорбно."

KREST.87.t: "Выборы [GetYear] года"
KREST.87.d: "После напряжённого избирательного сезона, в котором многие партии лихорадочно доносили свои сообщения до населения, мы подходим к выборам. Кого выберут избиратели в этом году?"
KREST.87.a: "Eesti Rahvaerakond."
KREST.87.b: "Eesti Rahvaerakond при поддержке независимых."
KREST.87.c: "Eesti Tööerakond."
KREST.87.e: "Eesti Sotsialistlik Tööliste Partei."

KREST.88.t: "Эстония хочет присоединиться к Федерации"
KREST.88.d: "Эстонское правительство с большим интересом следило за развитием нашего союза скандинавских наций. Сегодня мы получили их официальное заявление о вступлении в федерацию в качестве государства-учредителя."
KREST.88.a: "Ещё одна скандинавская нация присоединяется к стаду!"
KREST.88.b: "Eesti не может в скандинавы."

KREST.89.t: "Наше заявление было отклонено!"
KREST.89.d: "Мы получили известие из Гётеборга о том, что наше заявление о вступлении в Северную Федерацию было отклонено. Похоже, государства-члены отказались принять нашу нацию на том основании, что мы не принадлежим к германской культуре, как они."
KREST.89.a: "Моя страна мертва! Моя игра окончена!"

KREST.90.t: "Скрытое событие"
KREST.90.d: "Скрытое событие для того, чтобы PatAuts оставались нейтральными в 50% случаев, а все пути оставались нейтральными, если это установлено правилами игры.\n\nФлаги, добавленные опцией нейтралитета, означают, что решения о вступлении во фракции не появляются, и ИИ России
KREST.90.a: "Try to join the MA."
KREST.90.b: "Always stay neutral."