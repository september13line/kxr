### Focuses ###

FRA_amenagement: "Территориальное планирование"
FRA_amenagement_desc: "Наша территория обширна и неравномерно освоена: одни сельские районы бедны, а другие процветают и быстро растут. Мы должны поощрять местные инициативы и рассматривать амбициозные инфраструктурные проекты для решения этой проблемы на местном и национальном уровне."
FRA_hydroelectricity: "Гидроэлектроэнергия"
FRA_hydroelectricity_desc: "Наши горные районы в Альпах и Центральном массиве имеют множество рек с быстрым течением, идеальную среду для установки чистого и длительного источника энергии и оживления отсталых сельских горных регионов Коммуны."
FRA_swiss_hydroelectricity: "Швейцарская гидроэлектроэнергия"
FRA_swiss_hydroelectricity_desc: "Наше недавнее завоевание Романдии открыло несколько идеальных мест для гидроэлектроэнергии в качестве расширения нашей существующей сети в Альпах. Наши ведущие инженеры уверены, что расширение наших плотин в регионе принесет огромную пользу нашей экономике."
FRA_chemins_de_fer: "Железные дороги"
FRA_chemins_de_fer_desc: "Заседание Конгресса, посвященное статусу французской инфраструктуры в ГПС, показало дезорганизацию нашей железнодорожной системы и то, насколько она стала отсталой. Конгресс согласился с необходимостью создания нового офиса, специально занимающегося развитием и обслуживанием наших железных дорог, чтобы соединить вместе все части Франции."
FRA_mining_expansion: "Расширение добычи"
FRA_mining_expansion_desc: "Экономическое и инфраструктурное развитие регионов Альп и Центрального массива позволяет в большей степени использовать имеющиеся там минеральные ресурсы. Наши старатели открыли новые месторождения полезных ископаемых, и теперь мы готовы приступить к их разработке в промышленных масштабах!"
FRA_plan_prost: "План Проста"
FRA_plan_prost_desc: "Инженер и урбанист Анри Прост разработал план строительства автомагистралей вокруг Парижа, чтобы связать отдаленные пригороды. Эта идея получает широкую поддержку, и ГПС решила финансировать новые проекты по расширению автомагистралей через Коммуну. Коммуны Марселя и Лиона также попросили его составить планы шоссе для их городов."
FRA_autoroutes: "Автострады"
FRA_autoroutes_desc: "Автомагистрали оказались огромным благом для экономики и мобильности рабочих в городских районах, теперь же был выдвинут амбициозный план по их расширению на всю страну! Связывание всех уголков нашей страны окажет огромное влияние на наше региональное развитие и принесет пользу революции."

FRA_eco_direction: "Направление экономики"
FRA_eco_direction_desc: "Наша экономика более справедлива по отношению к рабочим и в целом довольно сильна, в то время как реакционные экономики живут и умирают по прихоти капиталистов, но внутренние конфликты не позволяют нам управлять нашей экономикой. Пора созвать собрание ГПС, чтобы эти вопросы раз и навсегда решила одна фракция Коммуны."
FRA_orth_syndicalism: "Ортодоксальный синдикализм"
FRA_orth_syndicalism_desc: "Был подтвержден курс, установленный после революции. Эта ортодоксальность доказала свою эффективность, а после небольшой корректировки может стать ещё больше."
FRA_reduce_unemploy: "Снижение безработицы"
FRA_reduce_unemploy_desc: "За пределами Рейна безработица находится на рекордно высоком уровне, мы должны гарантировать, что у французского рабочего всегда будет работа, чтобы прокормить свою семью. Выполняя эту простую задачу по обеспечению наших людей плодами их существования, мы доказываем своё неотъемлемое превосходство над капиталистическими экономиками и их постоянными кризисами."
FRA_work_design_coop: "Сотрудничество рабочих и конструкторов"
FRA_work_design_coop_desc: "Увеличивая сотрудничество между учеными и инженерами, стоящими за проектами и концепциями, и рабочими, которые их создают, мы быстро улучшим наши производственные технологии. Это также позволяет нам быстро обучать и обучать наших сотрудников новым методам, позволяя дизайнерам напрямую рассказывать о них рабочим."
FRA_improve_manage: "Улучшить управления союзами"
FRA_improve_manage_desc: "Профсоюзы уже давно управляют экономикой, но в их правилах есть некоторые пробелы и лазейки, которые можно использовать, что приведет к катастрофическим результатам для нашей экономики. Однако мы не будем ставить под сомнение место профсоюзов в нашей стране. Вместо этого мы ужесточим руководство и перепишем некоторые рабочие коды."
FRA_dedication: "Чувство преданности"
FRA_dedication_desc: "Рабочий должен понять, что он работает на благо Коммуны и французского народа в целом. Он должен всегда чувствовать себя вовлеченным в свою работу, и именно так мы будем улучшать наш национальный дух и нашу производительность. Не нужны кнуты или деспотичные владельцы бизнеса."
FRA_fac_towns: "Заводские города"
FRA_fac_towns_desc: "Наш план по быстрому расширению производственной базы Коммуны может быть подкреплен созданием новых заводских городков, городов, специально спроектированных для обеспечения их и их семей жильём и современными товарами, обеспечивая при этом их проживание недалеко от места работы."
FRA_Industrialisation: "Коммунитарная индустриализация"
FRA_Industrialisation_desc: "Жан Джером - новый министр экономики Коммуны. Якобинец, он является сторонником коммунальной индустриализации. Хотя наша страна всегда была одной из современных экономик Европы, мы пока не можем сравнивать её с Рурской долиной. Только амбициозным расширением производственной базы мы можем рассчитывать на Германию."
FRA_inter_coop: "Международное сотрудничество"
FRA_inter_coop_desc: "Хотя наш технический опыт является одним из лучших в мире, слишком легко игнорировать любые прорывы, сделанные в дружественных странах под ложным предлогом превосходства. От новых производственных технологий до управленческих теорий мы должны сохранять наблюдательность и брать все, что может принести пользу нашей экономике."
FRA_war_eco_agri: "Военная экономика и сельское хозяйство"
FRA_war_eco_agri_desc: "Жак Дорио - новый министр экономики Коммуны. Сорелианец, он является сторонником своей теории "Война, экономика и сельское хозяйство", призывающей к быстрому переходу к военной экономике наряду с амбициозным развитием сельского хозяйства. Если немецкие реакционеры нападут, нам непременно пригодятся ружья и хлеб."
FRA_modern_farms: "Современные фермы"
FRA_modern_farms_desc: "Земледелие было основным продуктом цивилизации с древних времен, но, тем не менее, всего за одно столетие оно коренным образом изменилось. Последние инструменты, такие как тракторы, позволяют одному фермеру собирать урожай за один день, для чего в прошлом потребовались бы десятки фермеров и неделя. Давайте механизируем наши фермы, чтобы в тарелке и пайке было больше еды."
FRA_war_industry: "Военная промышленность"
FRA_war_industry_desc: "Несмотря на растущую враждебность со стороны Германии, наша экономика по-прежнему в основном ориентирована на производство гражданских товаров и не подходит для большой войны. Нам необходимо развивать производство оружия и оборудования, если мы хотим эффективно защищать Коммуну от внешних угроз."
FRA_mass_production: "Массовое производство"
FRA_mass_production_desc: "У нас много врагов, и в результате наша армия довольно большая. Этой армии нужно много оборудования, и это явно создает нагрузку на наши заводы. Мы должны искать новые пути улучшения нашего производства стрелкового оружия как за счёт проектирования, так и за счёт производства."
FRA_cooperatives: "Кооперативы"
FRA_cooperatives_desc: "Даниэль Герен - новый министр экономики Коммуны. Анархист, он сторонник кооперативов. Правительство Коммуны здесь прежде всего для того, чтобы служить своим рабочим, и оно должно обеспечить им наилучшие условия труда. Позволить им управлять своими компаниями - хороший способ начать."
FRA_decentralized_industry: "Децентрализованная промышленность"
FRA_decentralized_industry_desc: "Наша промышленность в настоящее время сосредоточена вокруг Парижа и крупных коммун, но люди живут не только в Париже, Лилле или Лионе, но и повсюду во Франции. Мы должны приложить все усилия для развития всех регионов Франции, чтобы процветала вся наша страна."
FRA_market_socialism: "Рыночный социализм"
FRA_market_socialism_desc: "Созданные нами кооперативы должны выйти на новый равноправный социалистический рынок. Этот рынок сделает экономику более динамичной и позволит каждому преследовать свои собственные цели и делиться своим промышленным богатством в соответствии с идеалами социализма, без хищнического поведения капиталистической рыночной экономики."
FRA_ruralism: "Рурализм"
FRA_ruralism_desc: "Жизнь крестьянина - лучшая жизнь, известная человеку, но потребность в индустриальной экономике сделала эту жизнь невозможной для большинства французов. Однако мы всё ещё можем поощрять этот образ жизни, перенося их фабрики и рабочие места в сельскую местность, положив конец тирании массовой урбанизации."

FRA_communal_army: "Коммунитарная армия"
FRA_communal_army_desc: "У французской нации есть армия, но у этой армии нет объединяющего направления. Некоторые до сих пор предлагают ту же армию Вельткрига с верховным командованием. Другие хотят большей инициативы у сержантов. Другие по-прежнему стремятся к моторизованной и мобильной армии. Наконец, есть идея массового призыва. Когда мы распускаем военные профсоюзы, мы должны следовать единому видению."
FRA_principe_concentration: "Принцип концентрации"
FRA_principe_concentration_desc: "Нельзя ничего выиграть, если мы равномерно рассредоточим наши войска по всему фронту, взяв лишь несколько метров, которые мы теряем на следующий день из-за артиллерийских обстрелов. Совершая локальные прорывы и вкладывая средства в них, мы можем буквально сокрушить весь фронт врага несколькими хорошими боями."
FRA_tank_research: "Гранты на исследования танков"
FRA_tank_research_desc: "Танки не новость ни для нас, ни для мира, но они всё ещё относительно новый компонент ведения войны. В период между двумя мировыми войнами танкостроение резко улучшилось, и, похоже, истинный потенциал брони начинает проявляться. Давайте щедро инвестируем в будущее войны."
FRA_fast_army: "Культ скорости"
FRA_fast_army_desc: "Моторизация - это больше, чем будущее кавалерии. Хотя средний грузовик не протянет долго под вражеским огнем, он позволяет нам доставить наши войска к самой линии фронта в невероятное время. Мы должны сделать скорость целью всей нашей тактики, всех наших тренировок, всего нашего оборудования. Скорость - это возможность."
FRA_tank_assembly_line: "Линии сборки танков"
FRA_tank_assembly_line_desc: "Танки - это устрашающая машина на поле боя, но их очень сложно построить. Создавая базовые стандарты качества, мы можем ускорить производство брони и снабдить наши танки крупными танковыми дивизиями, которые обрушатся на врага, как кирпич.."
FRA_tank_quality_line: "Качественная продукция"
FRA_tank_quality_line_desc: "Танки - это устрашающая машина на поле боя, но их очень сложно построить. В любом случае, отдавая приоритет качеству, мы гарантируем, что наши резервуары будут лучшими из лучших. Таким образом, каждый производимый нами танк легко раздавит консервные банки, которые наш враг отчаянно выпускает, чтобы противостоять нам."
FRA_centralized_hc: "Централизованное высшее командование"
FRA_centralized_hc_desc: "Мы знаем, что неприятные события 1919 года вызвали у жителей Коммуны глубокое недоверие к высшему военному командованию. В любом случае нам нужно будет реабилитировать концепцию высшего командования. Идея о том, что командир отряда определяет тактику ведения боя, очаровательна, но кого позаботятся о логистике и стратегических манёврах?"
FRA_analysing_wki: "Анализ Вельткрига"
FRA_analysing_wki_desc: "Вельткриг, трагедия для нас и наших британских товарищей, является болезненной темой для изучения, но мы должны изучать её в любом случае. Из успехов и неудач этой войны мы узнаем, как вести следующую. Те, кто думают, что новые тактики и стратегии появятся из ниоткуда по мере приближения конфликта, заблуждаются."
FRA_war_experience: "Военный опыт"
FRA_war_experience_desc: "Французская армия провела много войн и будет сражаться во многих других. Каждый раз мы должны останавливаться и размышлять над этими конфликтами и проводить как можно тщательный анализ, чтобы определить, где наши планы пошли правильно или неправильно. То, что они не сражались под флагом Коммуны, не означает, что они погибли напрасно."
FRA_military_academy: "Военная академия"
FRA_military_academy_desc: "Война - сложная тема, которую необходимо изучить, чтобы полностью понять. Хотя мы обнаружили много талантов во время Гражданской войны 1919 года, мы должны предпринять предварительные шаги для обучения новых офицеров. Таким же образом мы можем изучить всю нашу доктрину и возобновить подготовку нашего офицерского корпуса."
FRA_officers_initiative: "Офицерская инициатива"
FRA_officers_initiative_desc: "Как часто во время Вельткрига прорывы совершались, но не использовались из-за безответных офицеров? Мы должны сделать так, чтобы этого больше не повторилось, каждый полк должен иметь возможность действовать самостоятельно, составляя планы и действуя по ним так, как они считают нужным. Это реальность современной войны, наполеоновские колонны - это история."
FRA_mission_type: "Типаж тактических операций"
FRA_mission_type_desc: "Наши планы не должны быть списками задач, иначе наши войска будут парализованы, когда произойдет непредвиденное. Наши планы всегда должны строиться с одной конкретной целью. Это единственная жесткая часть плана, все остальное предстоит выяснить командам. Таким образом, мы всегда будем готовы адаптировать наши планы по мере развития ситуации на поле."
FRA_flexible_support: "Гибкая поддержка"
FRA_flexible_support_desc: "Для обеспечения эффективности наших отделений мы должны обеспечить их гибкое обслуживание артиллерией и полками поддержки. Это означает, что в любой момент артиллерия должна быть готова к открытию огня по приказу любого связанного с ней отделения, а роты поддержки должны быть готовы вмешаться, когда их попросят о помощи на фронте."
FRA_empower_rifleman: "Расширить возможности стрелка"
FRA_empower_rifleman_desc: "В конце концов, мы можем составить все планы в мире и разместить столько артиллерийских орудий на заднем плане, сколько сочтем нужным, но скромный стрелок - тот, кто выиграет войну. Гарантируя, что даже они могут независимо проявлять инициативу, мы незаметно повышаем эффективность каждого отряда и побеждаем тех врагов, которые руководят ими с помощью ужаса."
FRA_mass_conscription: "Массовый призыв"
FRA_mass_conscription_desc: "Вельткриг без сомнения показал, что современные войны теперь принимают совершенно безумные масштабы, заставляя миллионы сражаться со всех сторон. Каждый француз должен знать, что однажды его могут призвать защищать свою любимую страну от реакционеров. Мы будем побеждены только тогда, когда погибнут последние из нас!"
FRA_improve_manufactures: "Улучшить производства"
FRA_improve_manufactures_desc: "Война действительно приняла массовый характер, и такая современная война потребует такого количества оборудования, которое мы, возможно, ещё даже не можем себе представить. К винтовке и гранате добавлены танк и самолет, скоро, возможно, и больше. Мы должны сделать так, чтобы наша военная промышленность была как можно лучше, у нас никогда не будет слишком много винтовок!"
FRA_global_organization: "Глобальная организация"
FRA_global_organization_desc: "Великой армии нужно великое командование. Однако это не было старым командованием, сидящим в военной комнате в Париже и рисующим стрелки на карте. Это офицеры каждого отделения, каждого полка, каждой армии и каждого фронта. Все вместе они возглавят нашу армию и обеспечат нам в конечном итоге победу в таком крупном конфликте."
FRA_mass_fire_support: "Массовая огневая поддержка"
FRA_mass_fire_support_desc: "С такой большой армией приходит новая идея старой концепции поддерживающего огня. Долгое время считалось, что только артиллерия может поддержать наступление, но мы считаем, что обязанность каждого отделения, которое не атакует, обеспечивать прикрытие огнем тех, кто продвигается вперёд. Таким образом, наши враги всегда будут уклоняться от нашего движения вперёд."
FRA_grand_army_reform: "Большая армейская реформа"
FRA_grand_army_reform_desc: "Наша армия теперь едина в целях и доктрине. Никто больше не смеет называть их ополчением или уличным отребьем. Это возвращает нас к образу Grande Armée, и это действительно наследие, которым мы гордимся. Давайте позаботимся о том, чтобы вся наша армейская организация была ориентирована на работу с таким количеством солдат и офицеров."

FRA_equipment_modern: "Современное оборудование"
FRA_equipment_modern_desc: "Орудия войны становятся все более эффективными, смертоносными. Для некоторых это трагедия, но ясно, что мы не можем избежать их. Война - уродливая реальность, и мы должны признать это. Гарантируя, что наше оборудование всегда самое лучшее, мы, возможно, делаем конфликты более опасными. Но наши враги не пощадят нас, применив это оружие против нас."
FRA_special_forces: "Альпийские силы"
FRA_special_forces_desc: "Горы всегда были совершенно другой средой для сражений, и большая часть наших границ проходит через горы. Мы должны гарантировать, что наша подготовка горных войск будет безупречной, и чтобы каждое новое оборудование, которое мы изобретаем, было адаптировано для горной войны. Горная артиллерия есть, может, скоро появятся горные танки?"
FRA_tank_division: "Танковые дивизии"
FRA_tank_division_desc: "Какое-то время это было очевидно, но танки никуда не денутся. Их броня непробиваема для огня из стрелкового оружия, а их могучая пушка уничтожает все, на что нацелена. С годами их проекты становятся тяжелее и разрушительнее. Мы должны оставаться в авангарде танковых технологий, чтобы доминировать на поле боя."
FRA_road_to_war: "Путь к войне"
FRA_road_to_war_desc: "Война с Германией явно неизбежна, эта нация держит в заложниках наших братьев в Эльзасе и Лотарингии, и со своими многочисленными марионетками в Рейхспакте она выступает в качестве главной контрреволюционной силы в Европе, если не во всем мире, тираном над сотнями миллионов людей. люди. Это прекратится, мы всех отомстим. Первый Вельткриг не был последним."
FRA_renseignements_generaux: "Renseignements Généraux"
FRA_renseignements_generaux_desc: "Стало ясно, что мы не можем защитить нашу страну удовлетворительным образом без современной централизованной разведки. Прежние табу всё ещё держатся против такой централизованной и неподконтрольной власти, но это жертва, которую мы должны принести. Немецкие шпионы тихонько смеются над нашими жалкими "комитетами разведки""
FRA_military_buildup: "Военное строительство"
FRA_military_buildup_desc: "Чтобы подготовиться к предстоящей войне, нам нужно будет быстро и эффективно развивать нашу военную промышленность. Это может нанести ущерб нашему краткосрочному экономическому росту, и, возможно, это не будет популярно среди тех, кто надеется на мир и процветание, но мы, к сожалению, знаем лучше. На карту поставлено выживание революции!"
FRA_military_buildup_two: "Калибровка экономики"
FRA_military_buildup_two_desc: "Капиталистический мир всё ещё борется с разрушительным экономическим кризисом прошлого года, в то время как праведность нашей собственной системы продолжает доказывать себя. Было предложено использовать это промышленное преимущество для преобразования определенных аспектов экономики исключительно в военных целях."
FRA_socialist_education: "Социалистическое образование"
FRA_socialist_education_desc: "Образование Французской Республики было во многих отношениях превосходным, что позволяло среднему гражданину получить обширные знания в области наук и искусств. Мы стремимся продолжить работу над этим наследием, обеспечивая, чтобы французские школы всегда ставили своей основной целью обучение и образование, а не иерархию и дисциплину, как в некоторых реакционных странах."
FRA_Our_time_has_come: "Реваншистская пропаганда"
FRA_Our_time_has_come_desc: "Наше желание отомстить Германии было давно. В 1871 году мы потеряли Эльзас-Лотарингию, и республиканские школы по праву учили своих детей, что это французский регион, который скоро будет снова захвачен. К сожалению, 1919 год стал годом нашего поражения и потери Нэнси. Но мы ещё не закончили, наш законный гнев закончится только тогда, когда Франция снова станет единой!"
FRA_department_revolutionary_ideals: "Отдел революционных идеалов"
FRA_department_revolutionary_ideals_desc: "В то время как эмпирические учения легко подтверждаются, о достоинствах Коммуны труднее донести до нашего населения. Звучит зловещё, но мы должны создать институт, готовый помочь нам напомнить нашему народу о ценности Революции и не допустить нарастания реакционного влияния."
FRA_Blanqui_Research_Institute: "Исследовательский институт Бланки"
FRA_Blanqui_Research_Institute_desc: "В то время как некоторые страны сопротивляются учениям науки, Франция поддерживает их без нюансов. Давайте поддержим создание нового научно-исследовательского института, направленного на укрепление нашего технологического превосходства. Там, где реакционеры сомневаются в каждом открытии и опасаются перемен, мы принимаем их и становимся сильнее с каждым годом!"
FRA_military_buildup_three: "Дальнейшее военное развитие"
FRA_military_buildup_three_desc: "Наша экономика сейчас хорошо развита, и Коммуна готова к войне, но мы всегда можем добиться большего. Поощряя дальнейшие промышленные проекты, Коммуна не только будет готова к войне, но, несомненно, будет превосходить любого из наших врагов во всех отношениях. Мы докажем миру, что Коммуна не будет побеждена!"
FRA_military_science: "Военная наука"
FRA_military_science_desc: "Франция всегда работает над улучшением своих исследовательских сетей, но теоретические науки могут только приблизить нас. Мы откроем новое крыло в исследовательском институте Бланки, посвященное военной науке, что позволит нам финансировать и разрабатывать новые открытия, которые будут немедленно использованы нашей армией."
FRA_synthetic_refineries: "Синтетические ресурсы"
FRA_synthetic_refineries_desc: "Франция велика и изобретательна, но у нее нет всего. Не хватает масла, каучука, вольфрама и хрома, и мы не всегда можем полагаться на иностранных экспортеров, когда возникает конфликт. Мы должны исследовать новостные способы получения этих ресурсов из того, что у нас уже есть. Некоторые учёные даже предполагают, что мы сможем разработать эти ресурсы."
FRA_secret_weaponry: "Электрические машины"
FRA_secret_weaponry_desc: "Хотя вычисления восходят к табулирующей машине, с тех пор мы сделали огромный прорыв в области вычислений. Наши математики уже убедились в том, что эти новые машины очень помогают в быстром и эффективном исчислении. При наличии некоторого покровительства и времени мы можем только представить себе возможности этой новой области."
FRA_damocles: "Проект «Дамокл»"
FRA_damocles_desc: "Вдохновленная Кембриджской конференцией во время Десятого международного конгресса, встреча состоялась сегодня в Кембриджском университете. Группа физиков-теоретиков из Великобритании и Франции просит финансирования для создания «Дамоклова проекта», совместного британско-французского комитета по ядерным исследованиям."
FRA_nuclear_weapons: "Проект Кюри"
FRA_nuclear_weapons_desc: "Хотя Дамоклов проект был многообещающим, отказ Союза Британии от участия подорвал сотрудничество между нашими и их учеными. Как бы то ни было, мы должны проявить настойчивость и попытаться понять, как использовать атом. Мы посвятим этот проект той самой женщине, которая открыла Radium и поставила нас на этот путь."
FRA_German_borders: "Укрепить немецкую границу"
FRA_German_borders_desc: "Мы уже построили довольно внушительную сеть укреплений вдоль реки Маас и на границе с Фландрией-Валлонией. Тем не менее, мы можем улучшить его с помощью новых конструкций и новейших военных объектов, таких как радиостанции и современные артиллерийские орудия. То, что Республика никогда бы не потрудилась сделать."
FRA_extend_line: "Продлить линию"
FRA_extend_line_desc: "Хотя мы в основном сосредоточили наши усилия по укреплению на тех участках линии, которые являются наиболее защищаемыми, совершенно очевидно, что Германия вместо этого нацелится на наши более слабые точки. Решение довольно простое, у нас не будет слабых мест. По крайней мере, они научатся ходить по воде, удачи им, чтобы пересечь эту черту!"
FRA_Demand_Romandy: "Требовать Верхнюю Савойю"
FRA_Demand_Romandy_desc: "Незаконная швейцарская оккупация Верхней Савойи длится слишком долго! Швейцарцы показали себя жестокими тиранами и угнетателями нашего народа на нашей законной земле! Никто не может иметь наглости преследовать и выслеживать французов и думать, что им это может сойти с рук, вероломные швейцарцы совершили свою последнюю ошибку."
FRA_Demand_Alsace_Lorraine: "Требовать Эльзас-Лотарингию"
FRA_Demand_Alsace_Lorraine_desc: "Французский народ не будет больше ждать! Наконец-то пришло время Германии вернуть весь Эльзас-Лотарингию или столкнуться с ужасными последствиями! А если они откажутся, мы принесем им жестокую и жестокую войну, которая отправит их пешки обратно в Берлин! Мы отомстим за наших павших братьев!"
FRA_war_with_spain: "Освободить Иберию"
FRA_war_with_spain_desc: "Прямо на нашей южной границе, прямо через Пиренеи, капитализм и империализм всё ещё сохраняются. Своими усилиями мы добьемся того, чего не смог бы ни один французский империалист - полного контроля над Иберией. Но мы разные. Мы делаем это для простых людей, а не для имперских амбиций. Синдикализм добьётся успеха в Иберии!"
FRA_War_with_germany: "Сокрушить Германию"
FRA_War_with_germany_desc:0 "Much to our surprise, the German reactionaries have ceded Alsace-Lorraine. But we never intended to just stop there! The Revolution shall prevail, our brothers will be avenged for what they have been put through in the Weltkrieg! They will just wish they had lost the first war, for we will stop at nothing until they are utterly destroyed!" # git изменение
FRA_War_with_austria: "Повернуть Красный Дунай"
FRA_War_with_austria_desc: "Австрийские народы доказали свою неспособность начать успешную социалистическую революцию в своей стране и освободиться от тирании Габсбургов. Тогда мы им поможем. Точно так же все народы, всё ещё находящиеся под тиранией этой анахроничной империи, будут освобождены. Европа будет свободна от последних реакционных империй."
FRA_War_with_Netherlands: "Вокруг Людендорфа"
FRA_War_with_Netherlands_desc: "Низины Бенилюкса стратегически важны для наших военных усилий. Немцы не будут ожидать атаки с этой стороны, и, если нам это удастся, мы отключим Германию от её жизненно важных экономических зон в Рейнской области. Германия падёт."
FRA_War_with_Britain: "Удар по контрреволюции"
FRA_War_with_Britain_desc: "Революционное правительство на острове Британия пало и было заменено правительством, которое снова угнетает британских рабочих. Мы должны освободить их от оков реакционного безрассудства и вернуть свободу рабочему классу."
FRA_World_revolution: "Мировая революция"
FRA_World_revolution_desc: "Теперь, когда революция прочно обосновалась в Европе, мы можем начать смотреть вовне и приступить к осуществлению грандиозного плана по освобождению всего мира от реакционеров и империалистов. Наша борьба закончится, когда последний из них предстанет перед народом за свои преступления. Vive la République Socialiste Mondiale!"
FRA_european_revolution: "Европейская революция"
FRA_european_revolution_desc: "Хотя идея мировой революции благородна, мы должны оставаться реалистами. С умным влиянием и без какой-либо другой реакционной силы, способной противостоять нам, мы скоро увидим, как другие континенты обращаются в синдикализм. Однако мы должны сделать так, чтобы в Европе не было реакционеров. Vive la République Socialiste Européene!"
FRA_peaceful_revolution: "Мирная революция"
FRA_peaceful_revolution_desc: "Мы слышим тех, кто утверждает, что революция не может закончиться, и этого не будет. Однако мы не можем позволить себе постоянно вести войны во всех уголках мира без причины. Рабочие найдут свой путь, когда мы будем действовать как маяк желаний. Давайте вместо этого сосредоточимся на себе. Vive la République Socialiste Française!"
FRA_red_union: "Союз солидарности"
FRA_red_union_desc: ""

FRA_Host_the_Internationale: "Международный Конгресс"
FRA_Host_the_Internationale_desc: "Главы социалистических, синдикалистских и тоталистических партий, главы государств и правительств, министры иностранных дел и журналисты прибыли в Париж на открытие IX Конгресса Третьего Интернационала. Мы первые принимаем Конгресс и смиренно надеемся использовать его, чтобы утвердиться в качестве ведущей социалистической страны в мире."
FRA_mission_bhartiya: "Миссия в Коммуну Бхарата"
FRA_mission_bhartiya_desc: "Коммуна Бхаратия просила нас поддержать их в борьбе против своих соседей, империалистов Дели и реакционеров Княжеской Федерации. Они просят нас прислать военных советников для обучения их офицеров и их солдат. Мы обеспечим быстрое поступление этой помощи, чтобы они могли быстрее объединить Индию."
FRA_arab_committee: "Антиколониальный комитет"
FRA_arab_committee_desc: "Предатели французского народа, ублюдок Петен и его друзья, используют местный пролетариат для возвращения на материк. Мы не дадим им такого шанса. Наш товарищ Сэйл Мохамед предложил нам идею поддержки социалистических освободительных движений по всей Африке на благо всех арабов."
FRA_working_women: "Работающие женщины"
FRA_working_women_desc: "Во время Конгресса Хелен Кроуферд вышла на сцену со своей пламенной речью о роли женщин в мировой революции. Мы поддержали её аргументы и теперь готовы проводить здравые реформы в отношении статуса работающих женщин в нашем обществе. Реакционеры могут таращиться, мы, конечно, будем смеяться последними."
FRA_avantgarde: "Международный авангард"
FRA_avantgarde_desc: "Слишком долго традиционное искусство и классическая музыка доминировали в развлечениях масс. В то время как джаз доставляет удовольствие и широко популярен в наших странах, один жанр не может бороться со всеми остальными. Мы должны создавать новые, мы должны показать миру, что такое настоящее развлечение. И это покажет миру, что мы добрая сила этой эпохи!"
FRA_help_cnt: "Поддержать НКТ"
FRA_help_cnt_desc: "Наши товарищи из НКТ борются против реакционеров Карлистов и Бурбонов, чтобы освободить всю Испанию, а возможно, вскоре и весь Пиренейский полуостров, как мы говорим. Мы дали обещание помочь им в их деле, и мы, без сомнения, выполним его. И не позже, чем сейчас."
FRA_second_inter_congress: "X Интернациональный Конгресс"
FRA_second_inter_congress_desc: "В условиях, когда бушует Вторая Гражданская война в США, а также ряд других конфликтов, готовых вспыхнуть в любой момент по всему миру, Интернационал должен рассмотреть свой подход к Глобальной революции. Поскольку первый Международный конгресс проходил во Франции, второй состоится в Великобритании."
FRA_scientific_cooperation: "Международное научное сотрудничество"
FRA_scientific_cooperation_desc: "Понятно, что мы не можем просто держать наши собственные технологические открытия при себе. Во время встречи в старом Кембриджском университете мы решили разработать всемирный план, объединяющий технологические достижения социалистических стран. Некоторые, однако, призывают к более амбициозному плану, включая инвестиции в промышленность."
FRA_third_inter_congress: "Победный съезд"
FRA_third_inter_congress_desc: "Ответственность за проведение Третьего Конгресса снова вернулась к нам, и новым местом, выбранным для этой задачи, стал дворец Populaire, где когда-то стоял Лувр, полный грабежей Французской империи. Соответственно, одна из обсуждаемых тем касается окончательного освобождения африканского континента."
FRA_end_GEX: "Конец Кайзера"
FRA_end_GEX_desc: "Африка долгое время страдала от тирании и угнетения. Угнетение его многочисленных королей, притеснение работорговцев и миссионеров и, наконец, притеснение европейских колонистов и исследователей. Наконец, мы даем свободу Африке и надеемся, что однажды мы сможем исправить причиненные им ошибки."

FRA_armee_de_lair: "Народные ВВС"
FRA_armee_de_lair_desc: "Самолёты - это странный новый аспект войны. Эти машины довольно сложны в обращении, и наказание за неспособность правильно летать очевидно. И все же пилотом может быть любой способный человек. Мы должны открыть ряды военно-воздушных сил для призывников, как это сделали армия и флот. У нашей авиации не будет недостатка в пилотах."
FRA_amateur_pilots: "Пилоты-любители"
FRA_amateur_pilots_desc: "Никто не рождается пилотом, и хотя некоторые учатся преуспевать в управлении воздухом и в бою, и их усилия достойны восхищения, мы не можем ожидать, что каждый пилот станет асом. Мы должны дать гражданским пилотам и пилотам-любителям шанс проявить себя. Это также относится к женщинам, которых обычно не призывают."
FRA_st_exp_doctrine: "Доктрина Сент-Экзюпери"
FRA_st_exp_doctrine_desc: "Антуан де Сент-Экзюпери - блестящий лётчик, и ему есть что рассказать нам об этом новом, странном мире воздушных войн. Хотя его слова не являются евангелием, мы высоко ценим его уникальный опыт и стремимся сделать его учения основой будущей воздушной доктрины. Начало, конечно."
FRA_ecole_air: "Авиационная школа"
FRA_ecole_air_desc: "Поскольку наша воздушная доктрина быстро расширяется, а воздушные бои переходят от неорганизованных драк к тщательно продуманным сражениям, нам отчаянно нужны подготовленные пилоты и обученные офицеры, которые могут планировать воздушные кампании, как они планируют наземные или военно-морские кампании. Только наша смекалка будет работать в этой новой области ведения войны, и, к счастью, она у нас есть."
FRA_air_bases: "Создать больше авиабаз"
FRA_air_bases_desc: "Самолётам нужны авиабазы для приземления, дозаправки, перевооружения, ремонта и взлета, как и военно-морским силам. Но в отличие от флота они не могут оставаться в воздухе месяцами, только часами. Таким образом, мы должны обеспечить превосходное прикрытие нашей авиабазы, и мы должны быть уверены, что у нас всегда недостаточно возможностей, чтобы наши военно-воздушные силы не пострадали из-за отсутствия инфраструктуры."
FRA_fighters: "Фокус на истребитель"
FRA_fighters_desc: "Воздух - это новый, обширный угол атаки для наших врагов, и, как таковой, это новый угол защиты для нас. В отличие от суши, здесь нет ни фортов, ни укрытий, а только рукопашные бои один на один. Если мы инвестируем в производство истребителей, мы гарантируем, что никто не будет свободно перемещаться по нашему воздуху. Наши бойцы всегда будут рядом и готовы вернуть их на землю."
FRA_bombers: "Фокус на бомбардировщик"
FRA_bombers_desc: "Воздух - это новый, обширный угол атаки для нас, и наши враги ещё не могут адекватно защищаться от него. Бомбы представляют собой единый, но элегантный способ транспортировки боеприпасов из ангара к цели. Мы должны вкладывать средства в бомбардировщики, чтобы гарантировать, что наши враги будут атакованы со всех сторон - преимущество, которое мы не можем игнорировать."
FRA_strat_bombers: "Фокус на стратегическое разрушение"
FRA_strat_bombers_desc: "Если одна бомба хорошо работает против врага, то десять бомб должны работать лучше. Дальнейшее развитие моделей бомбардировщиков привело к появлению новых авиационных рам, способных нести огромное количество бомб или несколько разрушительно больших бомб. Как бы то ни было, мы можем вскоре уничтожить целые города или армии несколькими волнами воздушных атак."
FRA_paratroopers: "Развитие десантников"
FRA_paratroopers_desc: "До сих пор мы всегда считали, что единственным способом перевозки войск являются грузовики и десантные суда. Однако недавний прорыв в авиации означает, что теперь у нас есть самолеты, способные нести целые отряды и безопасно сбрасывать их в бой. Надо немедленно обучать полки, способные к этому вертикальному окружению!"
FRA_rocket_development: "Ракетные усилия"
FRA_rocket_development_desc: "Ракетный двигатель - это вершина наших исследований в области новых методов движения для самолетов. Хотя путь к созданию ракетных кораблей всё ещё может быть долгим и трудным, наши учёные предлагают более простое использование ракет. Обвязав заряд взрывчатого вещёства и бросив их во врага, мы можем бомбить их издалека. Просто, разрушительно."

FRA_navy_focus: "Реорганизация военно-морского флота"
FRA_navy_focus_desc: "Хотя в настоящее время у нас есть приемлемый флот, он довольно дезорганизован, что не позволяет нам расширять его дальше. Мы должны снова интегрировать наши военно-морские силы в иерархию общинных сил. То, что у нас ещё нет большого флота, не означает, что у нас нет флота."
FRA_arsenaux_back_on: "Вернуть старый арсенал"
FRA_arsenaux_back_on_desc: "Военно-морские верфи долгое время были безмолвными, заброшенными. Сегодня мы реинвестируем в эти старые арсеналы, снова укомплектуем их кадрами и профинансируем, чтобы снова иметь флот, сопоставимый с флотом Республики."
FRA_old_doctrine: "Старая доктрина"
FRA_old_doctrine_desc: "Наш флот - это единое целое, медленно плывущее по морям и готовое опустошить флот наших врагов. Они защищают наши конвои и отбиваются от мародёров, но готовы противостоять любому большому флоту всей мощью всего французского флота. Зачем менять то, что не сломано?"
FRA_new_doctrine: "Новая доктрина"
FRA_new_doctrine_desc: "Наш флот - это инструмент, который следует применять осторожно, когда того требует ситуация. Вместо того, чтобы попасться на приманку врага и присоединиться к этим огромным свалкам в открытом море, мы должны стремиться нанести удар по их конвоям, их изолированным флотам и держать их в бегах, пока мы быстро уничтожаем всю их экономику."
FRA_muselier_plan: "План Мюзелье"
FRA_muselier_plan_desc: "План Мюзелье направлен на то, чтобы мы продолжали совершенствовать ядро нашего флота. Линкоры и крейсеры станут ударной силой нашего великого флота, позволив нам завершить любой бой разгромом нашего врага с небольшим повреждением для нас, за исключением экранных кораблей, таких как эсминцы."
FRA_home_fleet: "Домашний флот"
FRA_home_fleet_desc: "Наш флот защищает наши побережья, неустанно патрулируя Ла-Манш, Атлантическое побережье и Средиземное море, гарантируя, что ни одна подводная лодка или блуждающее судно не пройдет мимо наших конвоев и не повредит их, не попытается обстреливать наши побережья или наши пришвартованные корабли. Мы не боимся нападения с моря, кого бы то ни было."
FRA_strike_nat_france: "Ударить по режиму в Алжире!"
FRA_strike_nat_france_desc: "Старый режим всё ещё живёт в Алжире, существуя за счёт эксплуатации африканских колоний несуществующей Французской империи, развращая наше наследие своими зверствами. Мы должны обезопасить Средиземное море, а они стоят на нашем пути. Мы положим конец этому маскараду."
FRA_waves_of_syndicalism: "Волны синдикализма"
FRA_waves_of_syndicalism_desc: "Синдикализм достигнет всех морей мира. У нас может не быть портов или колоний старых реакционных империй, но у нас есть воля отправить наш корабль в дальние плавания, возвращая рассказы о победе над империалистами. Наши моряки будут плыть по семи морям во имя синдикализма!"
FRA_colonnes_neptune: "The Colonnes de Neptune"
FRA_colonnes_neptune_desc: "Если мы хотим победить вражеские страны за границей, плацдарм - необходимый шаг, прежде чем мы сможем развернуть основную тяжесть наших сил. Мы должны целенаправленно обучать наши морские пехотинцы и гарантировать, что только лучшие будут участвовать в этих невероятно трудных задачах. Судьба целых вторжений рассчитана только на них."
FRA_submarines: "Подводная война"
FRA_submarines_desc: "Как современная война поднимается в воздух, она также уходит под воду. Субмарины - это новый революционный поворот в военно-морской войне. Их торпеды могут уничтожить даже самые бронированные линкоры, а их профиль незаметен, и только самые передовые технологии могут их найти и атаковать."
FRA_cut_off_capitalists: "Отрезать капиталистов"
FRA_cut_off_capitalists_desc: "Мы не можем просто сидеть и смотреть, как старые империи вымогают у народов мира и приносят свои ошибки обратно в свои колониальные офисы, чтобы сосчитать и насладиться. Мы позаботимся о том, чтобы каждый конвой, перевозящий несправедливо захваченные товары, боялся Коммунальной подводной лодки."
FRA_naval_bombers: "Военно-морские бомбардировщики"
FRA_naval_bombers_desc: "Воздух хорошо сочетается с морем. Самолеты с торпедами позволяют нам мгновенно уничтожать даже самые большие корабли с большой точностью, а торпеды избавляют нас от необходимости попадать бомбой в мертвую точку палубы корабля. Мы должны вкладывать средства в военно-морские бомбардировщики, чтобы получить преимущество над большими и громоздкими военно-морскими силами."
FRA_protect_coastlines: "Защитить наши береговые линии"
FRA_protect_coastlines_desc: "В конце концов, наш флот не может защитить каждый пляж и каждую маленькую гавань в нашей стране. Однако мы можем спланировать заранее и добавить несколько основных укреплений, чтобы нас не застали врасплох. Если они приземлятся на наших пляжах, они будут наслаждаться холодной твердой сталью после долгого пребывания в море."

FRA_Phalanstere_internationale: "Основать Фаланстер"
FRA_Phalanstere_internationale_desc: "Необходимость секретности обуславливает определенную неэффективность военных исследований. Тесно сотрудничая с другими синдикалистскими странами и предоставляя исследователям доступ к наиболее тщательно охраняемым секретам других, можно решить эту фундаментальную проблему. Фаланстер выступает в качестве центрального органа по обмену такими секретами."

FRA_sorelians_rule_supreme: "Сорелианцы правят безраздельно!"
FRA_sorelians_rule_supreme_desc: "Председатель Жорж Валуа захватил власть и заявил, что все патриотические рабочие восстанут и присоединятся к нему в этом новом обществе."
FRA_revolutionary_legion: "Легион революции"
FRA_revolutionary_legion_desc: "L'Armée Populaire de la Commune de France полна анархистов, которым нельзя доверять, мы должны очистить военную иерархию и интегрировать наши собственные верные товарищества легионеров. Командующий Бюкар и фельдмаршал Дорио сообщили нам, что революционные легионеры уже "расправились" с нелояльными генералами, сейчас идеальное время для полного захвата власти."
FRA_centralise_the_state: "Централизовать Государство"
FRA_centralise_the_state_desc: "Бюрократия и автономное принятие решений Коммуны должны уйти. Нация - это государство, и поэтому государство должно полностью контролировать нацию, чтобы полностью реализовать идеалы сорелианцев, государство должно централизовать все правительственные районы вместе с упразднением автономных сообществ."
FRA_sorelian_industry: "Полная индустриализация"
FRA_sorelian_industry_desc: "Ничто, кроме полной индустриализации, не удовлетворит потребностей новой коммуны, и чрезвычайно важно, чтобы фабрики Франции заполнили небо дымом. Новый рассвет ждёт,и горы стали и силы встретят его."
FRA_anti_german_focus: "Антигерманский реваншизм"
FRA_anti_german_focus_desc: "Презренные империалисты по ту сторону границы в последнее время унизили Францию, немецкий народ представляет собой угрозу глобальному миру, и это доказано не больше, чем тираническое правление Эльзас-Лотарингия. Если французам предстоит восстать из пепла несостоявшейся республики, они должны противостоять своему врагу на востоке."
FRA_abolish_anarcho_unions: "Обеспечить лояльность профсоюзов"
FRA_abolish_anarcho_unions_desc: "Профсоюзы составляют основу революции, однако, поскольку многие из них выражают несогласные мнения и порождают политическую оппозицию, новый режим должен обеспечивать полную лояльность. Все профсоюзы должны принести присягу Председателю Валуа!"
FRA_corporate_syndicalism: "Корпоративный синдикализм"
FRA_corporate_syndicalism_desc: "Синдикализм модернизировал нацию, однако представительство рабочих не было полностью удовлетворено, поэтому мы включим элементы корпоративизма в структуру профсоюзов. Рабочие будут представлены в зависимости от их специальности и сильных сторон, а взамен правительство будет иметь прямой контроль над рабочими."
FRA_modern_army: "Современная армия для современного мира"
FRA_modern_army_desc: "Уважаемый генерал и министр экономики Жак Дорио представил Председателю Валуа подробный план реорганизации вооружённых сил в модернизированные объединённые боевые силы, которыми командует иерархическая структура, лояльная Председателю. Под его руководством военная мощь Франции будет задействована в полную силу."
FRA_revolutionary_nationalism: "Революционный национализм"
FRA_revolutionary_nationalism_desc: "Французский национализм возник в результате первой революции, когда крестьянство восстало против элит, обвиненных в предательском преступлении игнорирования потребностей нации. Сорлеанцам был вручен факел национализма, и посредством наших пропагандистских кампаний мы будем продвигать эти идеалы среди населения."
FRA_valois_is_gone: "День позора"
FRA_valois_is_gone_desc: "Наш дорогой лидер, председатель Валуа, произнесёт торжественную речь, которая будет передана всей стране. Его мудрые слова и энергичные действия найдут отклик у рабочих-патриотов Франции и станут чётким сигналом для врагов внутри и за пределами Франции. Всем правят сорелианцы, ничто не может помешать новому режиму достичь своих целей. Что бы ни пошло не так..."
FRA_who_shall_lead: "Кто будет руководить?"
FRA_who_shall_lead_desc: "Франция в хаосе, её дорогой лидер мертв, анархия на улицах и Камрады борются друг с другом. Народ нуждается в новом лидере, сейчас больше, чем когда-либо."
FRA_glory_to_the_chairman: "Слава §RПредседателю!§!"
FRA_glory_to_the_chairman_desc: "Марсель Деа теперь обеспечил существование авангардной фракции на долгое будущее, и те, кто противостоит правлению авангарда, будут очищены, удалены или перевоспитаны. Слава Авангарду, слава председателю."
FRA_woke_gang_win: "Марш истинного пролетариата!"
FRA_woke_gang_win_desc: "После убийства Жоржа Валуа сорелианцы были в хаосе и паранойе по поводу того, кто будет руководить сорелианцами следующим. После продолжительного обсуждения в Сорелианском Совете было решено, хотя и с небольшим отрывом, что Марсель Бюкар возьмет на себя ответственность. Как влиятельная фигура среди рабочих Франции и верность Легиону, как верят сорелианцы, только он может обеспечить стабильность."
FRA_death_to_traitors: "Смерть предателям!"
FRA_death_to_traitors_desc: "В то время как с Чёрной гвардией было покончено, ясно, что предатели Франции ещё живы, новый обретенный контроль Бюкарда дает возможность убрать некоторых из более проблемных министров кабинета, те, кто хотел бы либо убрать Бюкарда, либо заменить его, являются серьёзной проблемой и должны быть решены."
FRA_superior_french_culture: "Превосходная культура французских рабочих"
FRA_superior_french_culture_desc: "Французы всегда были лидерами синдикалистской культуры и идеалов, некоторые могут сказать, что они были лучшими из лучших. По этой же причине, помимо прочего, было бы идеально продвигать дальнейшую интеграцию в направлении более высокой культуры французских рабочих, а не других культур в пределах графства."
FRA_strength_through_joy: "Поворот к авангарду"
FRA_strength_through_joy_desc: "Сорель мертв, Валуа мертв, а значит, мертва и их любовь к классицизму. Кроме того, старая Франция, родившаяся из предполагаемых "божественных" прав королей и буржуазных "революций", которые их сместили, мертва. Их идеи потерпели поражение, окровавленные непрекращающимся движением времени, но их дух по-прежнему жив в художественном сознании нашего народа. Чтобы настоящая революция восторжествовала, мы должны разрушить эти заблуждения и преодолеть потребности устаревших стилей. Мы должны быть авангардом французского будущего, по воле Бюкара классицистическая любовь старых сорелианцев должна быть заменена футуристическим авангардом революционных франкистов."
FRA_crush_factionalism: "Сокрушить Фракционализм"
FRA_crush_factionalism_desc: "Фракции внутри Коммуны Франции привели к тому, что Валуа погиб. За какие мелкие разногласия? Фракционализм положит конец нашей прекрасной стране раньше, чем это сделают какие-либо внешние угрозы, эта борьба за лояльность фракций должна прекратиться сейчас же, мы должны объединиться под одной партией, одной идеологией и одним лидером. Нет никаких ультранациональных синдикалистов или авангардистов, есть только те, кто лоялен Франции, а те, которые нет..."
FRA_inflame_second_affaire: "Разжечь второй роман"
FRA_inflame_second_affaire_desc: "Дело Дрейфуса стало национальным унижением как для социалистов, так и для Франции: французский национализм был опорочен в пользу иностранца. Распространяя стратегические отчёты о том, что убийца, поразивший Валуа, якобы был выходцем из еврейской среды, мы могли раздуть пламя воспоминаний и использовать антисемитские настроения в своих интересах."
FRA_revolutionary_voilence: "Революционное насилие"
FRA_revolutionary_voilence_desc: ""Пролетарское насилие, осуществляемое как чистое и простое проявление чувства классовой борьбы, кажется, таким образом, очень прекрасным и героическим явлением; он служит извечным интересам цивилизации; Возможно, это не самый подходящий метод получения немедленных материальных выгод, но он может спасти мир от варварства" - Жорж Сорель"
FRA_empower_technocrats: "Расширить возможности технократов"
FRA_empower_technocrats_desc: "Нашей страной должны управлять люди, которые знают, что делают. Люди из разных областей знаний были бы лучшим выбором, поскольку они были бы на переднем крае знаний, наиболее известными из них являются технократы, которые хотят использовать современные чудеса технологий для продвижения синдикализма."
FRA_red_colonialism: "Красный колониализм"
FRA_red_colonialism_desc: "Мировые державы всегда считали нашу страну законной Францией, однако реакционные изгнанники в бывших колониях были проблемой с момента восстания. Теперь, когда мы находимся в стабильном положении, было бы идеальное время нанести удар по самозванцам и навести порядок в рабочих Африки."
FRA_every_worker_a_patriot: "Каждый рабочий - патриот"
FRA_every_worker_a_patriot_desc: "Каждый рабочий внутри страны должен быть предан делу страны, её вождю и её войнам. Вот почему мы должны продвигать дальнейший патриотизм внутри страны: те, кто не считает себя гордыми французскими гражданами, будут изгнаны или казнены, в зависимости от того, насколько они непатриотичны."
FRA_establish_the_corporates: "Учредить корпорации"
FRA_establish_the_corporates_desc: "Национальное государство - это тело, и, как и тело, оно состоит из множества различных телесных функций, которые должны работать вместе, чтобы все тело могло жить. Следовательно, для того, чтобы нация функционировала, все области знаний должны работать вместе под руководством государства, которое действует как мозг, управляющий телом. Профсоюзы рухнули, на их месте мы создадим революционные корпорации!"
FRA_france_awake: "§CRévolution nationale!§!"
FRA_france_awake_desc: "Франция снова проснулась, наши французские рабочие гордятся своей страной, а наши враги уничтожены. Францию больше не будут толкать, теперь мы будем толкать других по своему усмотрению. Да благословит Бог нашего лидера Марселя Бюкара за то, что он ведет нас к процветанию и власти."
FRA_direct_rule: "Прямое правление из Парижа"
FRA_direct_rule_desc: "Париж - это центр власти Коммуны, историческая столица французского народа, а в последнее время - столица рабочей революции. Парижская Коммуна 1871 года заложила основы синдикалистского государства, и теперь все снова под контролем настоящих революционеров."
FRA_valois_vision: "Осуществить его видения для Франции"
FRA_valois_vision_desc: "Видение Валуа для Франции состояло в том, чтобы восстановить гордость нации, поскольку Германия слишком долго нас позорила. Наполеон завоевал и расширился во имя Франции, и, как и он, мы тоже будем расширять наши границы. К Рейну!"

FRA_begin_revolution: "Так начинается революция..."
FRA_begin_revolution_desc: "Когда выборы достигли своего апогея, якобинская фракция в CGT получила большинство против всех остальных. Партия ясно заявила о своих намерениях покончить с синдикализмом Коммуны и вместо этого проложить новый путь в рамках более радикальной и централизованной системы. Так начинается революция."
FRA_new_jacobin: "Новый Робеспьер"
FRA_new_jacobin_desc: "Во время Французской революции 1789 года был один человек, который вел за собой факел пролетариата, чтобы Франция смогла сбросить оковы и впервые в своей истории принять реальные перемены. Этого человека звали Максимилиан Робеспьер, якобинец, полностью преданный идее Революции, герой, несправедливо оболганный последующими режимами. Мы не забыли его деяний, и наследие Робеспьера возродится в лице Шаримана Дорио."
FRA_french_marxism: "Французский марксизм"
FRA_french_marxism_desc: "Франция всегда была авангардом революционных деятелей, всегда готовых разрушить цепи, сковывающие мир в рамках старых порядков. Робеспьер, титан Великой революции; Луи Антуан де Сен-Жюст, правая рука Робеспьера, служивший 'архангелом террора'; Луи Огюст Бланки, создатель того, что позже трансформировалось в концепцию Авангардной партии. Без этих людей, этих французских патриотов от и до, социализм в том виде, в котором мы его знаем сегодня, возможно, никогда бы не возник. Хотя Маркс дал нам основы, он один не соответствует характеру нашей нации. Давайте подражать нашим революционным предкам и их уникальным концепциям французского социализма."
FRA_woke_women: "Обучать рабочих"
FRA_woke_women_desc: "Чтобы революция выжила, необходимо радикально перестроить систему образования. Рабочих, долгое время лишенных возможности получить образование, необходимо вернуть в школы и обучить путям социализма и общества, чтобы они тоже могли сформировать авангард против реакционного влияния."
FRA_educate_workers: "Культ разума"
FRA_educate_workers_desc: "Одним из главных достижений Великой революции стала отмена привилегированного статуса церкви, который веками не давал Франции ощутить прогресс. Был создан атеистический Культ Разума, отбросивший все установленные религии и сосредоточившийся на духовной силе самого знания. Мы возродим этот культ по-другому, ведь Разум - это сам Прогресс! Научный социализм - это будущее."
FRA_reign_of_terror: "Царство террора"
FRA_reign_of_terror_desc: "Наша революция всё ещё находится в зачаточном состоянии, и антиреволюционная деятельность находится на пике. Прежде чем мы сможем двигаться вперёд, Франция должна пережить второе Царство террора, чтобы иметь дело с реакционными элементами, которые замышляют наше падение."
FRA_syndie_blood: "Внутренний враг"
FRA_syndie_blood_desc: "Синдикалисты, придерживаясь идей социализма, ничем не лучше самих реакционеров. Многие стремятся воссоздать капиталистическую модель угнетения, но они слишком слабы, чтобы понять, что только партия авангарда может защитить революцию. И поэтому Сена станет красной от их крови."
FRA_behead_everyone: "Гильотина на каждой улице"
FRA_behead_everyone_desc: "По мере того как террор охватывает всю Францию, Гильотина вернулась к своему статусу позора. Чтобы вселить страх в реакционеров повсюду, Гильотина будет сидеть на каждой улице, напоминая им об их неизбежной судьбе."
FRA_commune_virtue: "Коммуна добродетеля"
FRA_commune_virtue_desc: "Республика добродетелей - это теория, разработанная Робеспьером, которая оправдывала использование насилия для защиты нации. Пока мы имеем дело с политическими врагами, мы будем насаждать общество свободы и равенства... для тех, кто лоялен Торезу."
FRA_new_worker: "Новый рабочий"
FRA_new_worker_desc: "Психическое рабство заставляет рабочего подчиняться тирании, мы в нашем крестовом походе за справедливость освободили рабочего. Любовь к деньгам сменилась любовью к труду, долг перед нацией заменил долг перед самим собой, а честный труд заменил ленивые пороки реакционизма."
FRA_communism_reborn: "Коммунизм с французскими чертами"
FRA_communism_reborn_desc: "Когда синдикализм был сметён на свалку истории, коммунизм возродился заново, феникс восстал из пепла и вернул себе место в качестве высшей левой идеологии. Но чтобы по-настоящему принять эту позицию, коммунизм возродился в традициях своих французских революционных предшественников."
FRA_lenin_legacy: "Наследие Ленина"
FRA_lenin_legacy_desc: "Владимир Ленин был отцом социализма в России, руководивший революцией до её горького конца. Провал революции не был неизбежен и не должен запятнать великое наследие Ленина. Следуя его стопам, мы создадим общество его мечты."
FRA_bolshevik_learn: "Уроки большевиков"
FRA_bolshevik_learn_desc: "Большевики сформулировали идеальное коммунистическое общество и ввели Россию в состояние полной революции, когда пролетариат наконец сбросил свои цепи. Учась у большевиков, мы тоже можем мобилизовать общество до таких размеров."
FRA_russian_comrades: "Наши русские товарищи"
FRA_russian_comrades_desc: "Многие из большевиков бежали во Францию, когда русская революция потерпела поражение. Их руководство сыграет важную роль в том, чтобы вести Францию в будущее, и они будут иметь важное значение в перестройке государства по советскому образцу."
FRA_soviet_culture: "Советская культура"
FRA_soviet_culture_desc: "В Советском Союзе произошёл полный переворот старой и упадочной русской культуры, и на смену ей пришла интернациональная и современная советская культура. Мы должны стремиться сделать то же самое во Франции, отказавшись от нашего культурного наследия и приняв будущее."
FRA_eradicate_boys: "Борьба с социал-реакционерами"
FRA_eradicate_boys_desc: "Несмотря на то, что мы пришли к власти, социал-реакционеры всё ещё борются с нашей властью. Запретив реакционную и капиталистическую мысль, мы сможем искоренить этих врагов Революции раз и навсегда!"
FRA_show_trials: "Показательный процесс"
FRA_show_trials_desc: "Вина осужденных решена, но это не значит, что мы не должны транслировать их антисоциалистическую деятельность в мир. Эти судебные процессы покажут реакционерам повсюду конечный результат их инакомыслия."
FRA_commie_dictatorship: "Диктатура пролетариата"
FRA_commie_dictatorship_desc: "Маркс считал идеальным государством диктатуру пролетариата, и Ленин претворил эту мечту в жизнь вместе с авангардной партией. Франция - страна не деспотов, а диктатуры народа!"
FRA_new_economic_plan: "Новая экономическая политика"
FRA_new_economic_plan_desc: "По словам Владимира Ленина, для того, чтобы социалистическое государство могло существовать, вы должны использовать преимущества предыдущей экономической системы, чтобы способствовать переходу. Мы будем поддерживать некоторые синдикалистские структуры, постепенно сокращая анархо-синдикалистские элементы общества, чтобы включить марксистскую и ленинскую политику."
FRA_five_year_plan: "Пятилетний план"
FRA_five_year_plan_desc: "По мере того как мы постепенно сворачиваем оставшиеся структуры синдикалистской коммуны, мы приступим к осуществлению первого из многих будущих экономических планов. В следующие пять лет промышленность будет формировать нацию, фабрики будут вознесены в небо, возвышаясь над нацией."
FRA_true_marxism: "Настоящий марксизм-ленинизм!"
FRA_true_marxism_desc: "Синдикализм извращал социализм во время его подъема, но теперь мы достигли немыслимого и претворили в жизнь истинную марксистско-ленинскую мысль. И под этой идеологической эгидой революция будет идти вперёд!"
FRA_no_nationalism: "Искоренить национализм"
FRA_no_nationalism_desc: "Национализм - это бедствие человечества. Мир должен быть объединён под знаменем социализма, а нации должны быть уничтожены!"
FRA_fourth_faction: "Четвёртый Интернационал"
FRA_fourth_faction_desc: "Третий Интернационал был коррумпированной и декадентской организацией, которая стремилась только продвигать повестку дня синдикалистов и их реакционных союзников. Четвёртый Интернационал станет всемирным знаменосцем социализма."
FRA_export_revolution: "Экспорт революции"
FRA_export_revolution_desc: "Если Франция хочет быть знаменосцем международного социализма, мы не можем сидеть сложа руки и ждать, пока к нам придут реакционеры, вместо этого мы должны в этот самый момент выступить против всего мира!"
FRA_war_with_capitalists: "Объявить войну капитализму"
FRA_war_with_capitalists_desc: "Капитализм существовал в той или иной форме с незапамятных времен и с древних времен был врагом рабочих. Если мир хочет когда-либо двигаться вперёд, капитализм и все его сторонники должны быть уничтожены."

FRA_counter: "Контрреволюция!"
FRA_counter_desc: "Волны перемен снова толкают эту нацию в другом направлении. Лидеры, режимы, армии - все они поднимаются и падают, но дух Франции вечен ... Aux armes, citoyens, Formez vos bataillons, Marchons, marchons! Qu'un sang impur, Abreuve nos sillons!"
FRA_defender: "Protecteur de la France"
FRA_defender_desc: "Морис Гамелен и его военные сторонники успешно свергнули Тореза и его тираническую Клику. Пока лоялистские подразделения отвоевывают остальную часть нации, Гамлен и его союзник Леон Блюм могут начать восстановление Коммуны."
FRA_restore_order: "Восстановить порядок"
FRA_restore_order_desc: "Одним из первых действий нашего нового кабинета будет создание полицейских, военных и ополченцев по всей стране, мы также создадим военно-подготовленную милицию, состоящую из добровольцев. Это будет нам дорого стоить и не будет пользоваться большой популярностью, но, в конце концов, у нас все получится!"
FRA_marshal_law: "Военное положение"
FRA_marshal_law_desc: "Хотя это не будет популярно среди граждан, обстоятельства, к сожалению, вынуждают нас объявить военное положение, чтобы лучше координировать и управлять процессом стабилизации. Иначе якобинцы снова могут стать угрозой и начать восстание!"
FRA_popular_front: "Front populaire"
FRA_popular_front_desc: "Народный фронт был сформирован как объединённая оппозиция якобинцам. Возглавляемые Леоном Блюмом и состоящие из синдикалистов, анархо-синдикалистов, социалистов и социал-демократов, они боролись за восстановление свободы и свободы. Под руководством Гамелена они сформировали правительство национального единства."
FRA_strengthen_military: "Усилить армию Коммуны"
FRA_strengthen_military_desc: "Подобно тому, как ветераны UFAFC, сформировавшие будущую Французскую революционную армию, спасли дело коммунаров от грани уничтожения во время Революции 1920 года, Марешаль Гамелен и его товарищи уберегли Францию от безумия якобинства. Было бы справедливо предоставить военным гораздо больше ресурсов, чтобы они могли лучше защитить нас от подобных опасностей в ближайшие годы."
FRA_pcf_menace: "Положить конец якобинской угрозе!"
FRA_pcf_menace_desc: "Прежде чем мы сможем спасти нацию, мы должны сначала наказать виновных в этом беспорядке! Никто, связанный с якобинцами, не может избежать наказания за преступления, совершенные во имя коммунизма. Пора змее отрубить себе голову!"
FRA_proclamation: "Прокламация Гамелена"
FRA_proclamation_desc: "Маршал Гамелен объявил, что он выступит с речью к нации, в которой он хочет представить свой план о том, как лучше всего вести Коммуну к светлому будущему."
FRA_without_gamelin: "Спаситель Франции"
FRA_without_gamelin_desc: "Наша работа сделана, мы вернули французам их будущее. Леон Блюм объявил, что Народный фронт останется у власти в обозримом будущем. Мы обязаны героизму Марешала Гамелена, что мы все можем стоять здесь сегодня! Можно сказать: "Без маршала Гамелена, il n'y aurait pas de nouvelle France!" или "Без Марешала Гамелена не было бы новой Франции!""
FRA_state_anarchy: "Мать анархия"
FRA_state_anarchy_desc: "Чудом удалось предотвратить гнусные попытки сорелианцев доминировать над жизнями каждого гражданина, угнетать их силой и подавлять их личную свободу. Нестор Махно, спаситель Франции, принёс свободу всем. Теперь анархия - закон, свобода снова в руках народа!"
FRA_true_equality: "Чёрная Гвардия"
FRA_true_equality_desc: "Разве свобода и равенство - это не способность жить так, как вы хотите? Не сдерживаемый такими тираническими творениями, как законы и социальные нормы, жить так, как каждый считает нужным. Чёрная Гвардия считает, что человечество запрограммировано на принятие тиранического порядка, поэтому мы должны предоставить полную неограниченную свободу... даже если это приведет к насилию."
FRA_communes: "Свободные коммуны"
FRA_communes_desc: "Урбанизированные и централизованные города позволяют контролировать массы, убожество и нужды навязываются коррумпированной элитой города. Это несправедливо и неестественно, поэтому мы будем продвигать анархистские коммуны, которые действуют исключительно в зависимости от потребностей их жителей. Массовая децентрализация общества - будущее."
FRA_power: "Царство смерти"
FRA_power_desc: "Сама по себе власть над другими - это естественный образ жизни, однако сконцентрированная сила, используемая для навязывания вашей воли массам, не имеющим возможности сопротивляться, является бесчеловечным злом. Все формы государственной иерархии, которые позволяют это, будут упразднены, никаких правительственных должностей, никакой религии, никаких предприятий и банков, которые злоупотребляют своими работниками и клиентами. Больше никакого паразитического контроля!"
FRA_abolish: "Уничтожить капитализм"
FRA_abolish_desc: "Деньги - корень всякой власти, жадность, порождаемая богатством, вывела человечество за пределы узнаваемого государства. Деньги - великий развратник, отныне все монеты и банкноты нужно переплавлять и сжигать. Валюта будет заменена бартером и торговлей, банкиры больше не будут владеть людьми..."
FRA_smash_shackles: "Кувалда и веник..."
FRA_smash_shackles_desc: "Национальное государство по своей сути направлено против свободы, ограничения на освобождение души, создаваемые границами, гражданством, законом и правительством, вызывают презрение. Все последние остатки Франции должны быть полностью уничтожены! Франция мертва, да здравствует анархия!"
FRA_death: "Тачанка войны"
FRA_death_desc: "Группы сопротивления MLSF и других движений, лояльных колониальному правительству Алжира, считали, что падение сорельцев и старой Коммуны означает, что они могут взять власть, считая нашу анархическую систему неспособной защитить себя. Но Чёрная Гвардия защищает народ, и мы отправим этих капиталистов обратно в Алжир!"
FRA_slaves: "Ни Богов, Ни Хозяев"
FRA_slaves_desc: "Франция превратилась в утопию свободы и анархии. Махновия, как многие теперь называют её, - единственная территория во всем мире, где царит настоящая анархия, здесь не правят ни боги, ни хозяева, ни короли. Народ правит, а Махно представляет народ!"


FRA_Restoring_Socialist_Order: "Восхождение\nнеосоциализма"
FRA_Restoring_Socialist_Order_desc: "После титанической борьбы за будущее Франции и самого социализма стало ясно, что сорелианцы Валуа и Бюкар не принесли нашему народу ничего, кроме гибели. С помощью широкой коалиции правых социалистов и умеренных Марсель Деат, главный идеолог неосоциализма, взял на себя чрезвычайный контроль над Коммуной с целью восстановления доверия к республиканской системе и реализации своего амбициозного конструктивного плана."
FRA_War_Against_Anarchist_Chaos: "Смерть анархии"
FRA_War_Against_Anarchist_Chaos_desc: "Анархисты считают, что неосоциалисты подрывают революцию, а на самом деле мы спасаем её от катастрофы, в которую её завели. Остатки махновцев продолжают вести подрывную деятельность - организованный терроризм и пропаганду. Хватит, мы покажем пример их наиболее активным собратьям и сделаем так, чтобы эта хаотическая аберрация больше никогда не охватила Францию."
FRA_Decapitate_Valois_Crazed_Children: "Стереть нелояльность"
FRA_Decapitate_Valois_Crazed_Children_desc: "Несмотря на то, что некоторые считают, что ранние связи Марселя Деата с Валуа свидетельствовали о его принадлежности к сорелианцам, это не так уж и далеко от истины. Давно умерший председатель был лишь издателем нескольких избранных работ на протяжении всей карьеры Деата. Реальность такова, что наш лидер сумел спасти Францию от сорелианцев и теперь арестовывает их радикальных и жестоких организаторов. Пришло время навсегда покончить с самой большой угрозой нашему республиканству."
FRA_Only_True_Jacobins: "Истинные якобинцы"
FRA_Only_True_Jacobins_desc: "Коммунисты Тореза цепляются за название "якобинство" - какое детское заблуждение! Они следуют не более чем идеологии неудавшегося русского революционера, в то время как Якобинский клуб принес Франции истинное восстановление и гордость во времена наших предков. Мы возьмем эту мантию себе, единственные истинные якобинцы, единственные истинные республиканцы."
FRA_United_Leftist_Bloc_Our_Own: "Объединённый левый блок"
FRA_United_Leftist_Bloc_Our_Own_desc: "Переворот против захвата власти Бюкаром и невежественными сорелианцами не удался бы, если бы не широкая группа союзников, которую наш лидер создал за эти годы. Пока наше сотрудничество с правым крылом SFIO и республиканцами-социалистами носит неофициальный характер, но пришло время создать новый картель левых, который будет доминировать во французской политике и в дальнейшем."
FRA_Popular_Mass_Mandate: "Мандат народных масс"
FRA_Popular_Mass_Mandate_desc: "При той полной преданности, которую проявили к нам голосующие массы, нам ничего не остаётся, как окончательно перевести систему с временной чрезвычайной демократии на народное авторитарное правительство экспертов в рамках одной партии. И хотя народ может голосовать только за фракции одной партии, пусть он будет уверен, что каждый голос в ССР будет учтен, если он приблизит нас к настоящему неосоциалистическому государству."
FRA_Republican_Authority_Cemented: "Укрепление республиканской власти"
FRA_Republican_Authority_Cemented_desc: "Нация была объединена видением Деата о правильно функционирующем Картеле левых, представленном Социалистическим республиканским союзом. Пусть народ Франции знает, что его жизнь в безопасности и что Республика снова служит его нуждам, даже если некоторые сомневаются в наших авторитарных методах."
FRA_Planisme_Modernity: "План в современность"
FRA_Planisme_Modernity_desc: "С помощью плановой экономики мы оставим позади неэффективность нашего недавнего анархистского и капиталистического прошлого и устремимся в будущее, где эксперты нашего министерства совместно с профсоюзными и партийными лидерами обеспечат массовую занятость и рост потребительских товаров. После первого шага мы в полной мере используем наши усилия по централизованному планированию и проведем массовую модернизацию, чтобы Франция и её экономика больше не отставали."
FRA_Technocratic_Government_Restructuring: "Технократическая реструктуризация"
FRA_Technocratic_Government_Restructuring_desc: "Нашей страной должны управлять люди, обладающие высокой квалификацией для занятия той должности, на которую они претендуют. В зависимости от потребностей оптимальным выбором будут эксперты из разных областей, среди которых наиболее заметны технократы, предложившие нам свою поддержку в обмен на возможность помогать управлять новой плановой экономикой."
FRA_Solidarity_Classes: "Солидарность классов"
FRA_Solidarity_Classes_desc: "Несмотря на то, что это может огорчить многих ультрарадикалов, в народе существует значительное единство. Мы будем пропагандировать классовую гармонию в наших изданиях, нанимая на работу в государственные учреждения бывших представителей буржуазии и рабочей аристократии. На смену неудачам классовой борьбы коммунистов придет слава целенаправленного антикапиталистического общеклассового сознания."
FRA_Coop_Cartele_Peasant_Centers: "Картели и крестьянские центры"
FRA_Coop_Cartele_Peasant_Centers_desc: "Различные кооперативы в стране будут объединены под единым зонтиком, их деятельность будет контролироваться чиновниками, которые будут докладывать в министерство как о производстве, так и о запросах. Такая горизонтальная интеграция значительно повысит экономическую эффективность. Мы также создадим несколько Крестьянских центров, работающих по той же схеме, но представляющих региональных аграрных лидеров, которые зарекомендовали себя как очень влиятельные фигуры в своих изолированных сообществах."
FRA_Mobilize_Unions_Nationalize_Militias: "Факел революции"
FRA_Mobilize_Unions_Nationalize_Militias_desc: "Мы должны закрепить лояльность рабочего класса к неосоциализму и расширить наши профсоюзы. К счастью, и то, и другое можно сделать путём массовой мобилизации их членов, что позволит быстро снизить безработицу практически до нуля, а многие из недавно "обратившихся" в нашу веру вступят в ряды национализированного ополчения."
FRA_Nation_Reconstituted: "Восстановление нации"
FRA_Nation_Reconstituted_desc: "Антигосударственная позиция, занятая многими представителями ранее господствовавших фракций Коммуны, нанесла огромный ущерб нашей нации. Только благодаря подлинному гению Марселя Деата Франция смогла вновь встать на ноги и реализовать свой истинный потенциал. Не медленным реформизмом или радикальной и насильственной революцией, а идеально выстроенным конструктивным этапом."
FRA_Pursue_European_Republicanism: "Европейский республиканизм"
FRA_Pursue_European_Republicanism_desc: "С падением внутренних врагов и обеспечением конструктивной революции Деат может наконец осуществить свою мечту о единой социалистической Европе. Такой Союз объединит все народы в мире, стабильности и процветании. Давайте же смело возьмемся за реализацию столь амбициозного политического проекта, который ещё никто не пытался осуществить."

### Events ###

comfrance.1.t:0 "Французская Коммуна"
comfrance.1.d:0 "Третья республика закончила так же, как и началась: поражением от германского оружия и социалистической революцией внутри страны. В ноябре 1919 года CGT призвала к революционной Всеобщей забастовке, парализовавшей страну и приведшей к падению буржуазного правительства. Старый порядок оказался слишком слаб, чтобы положить конец беспорядкам, и в последующие месяцы французский истеблишмент был изгнан с материка коалицией левых сил в ходе короткой, но жестокой гражданской войны.\n\nПоследние пятнадцать лет самопровозглашённая «Французская Коммуна» сохраняла единство на основе общего синдикалистско-социалистического консенсуса во главе с правящей Всеобщей биржей труда. Однако к 1936 году соглашение, достигнутое ради восстановления разрушенной страны и защиты плодов революции от внешней угрозы, всё чаще считается многими критиками устаревшим, а требования более радикального курса становятся громче. Франция всё увереннее чувствует себя в своей безопасности и исторической миссии, однако французская революционная традиция остаётся неоднородной, и пока неясно, какие именно идеологические течения станут господствующими в ближайшие годы..."
comfrance.1.a:0 "К оружию, граждане!"

comfrance.5.t:0 "Падение Марсо Пивера"
comfrance.5.d:0 "Несмотря на успешную организацию Синдикалистского конгресса в мае, администрация Пивера подверглась критике за отсутствие реакции на репрессии против профсоюзов в Германии. Сегодня оппозиция во Всеобщей бирже труда согласилась вынести Пиверу вотум недоверия, после чего он объявил о досрочных выборах нового Комитета. До оглашения окончательных результатов его обязанности временно будет исполнять Комитет общественного спасения."
comfrance.5.a:0 "Прощайте, камрад Пивер."

comfrance.6.t:0 "День выборов 1: Определение будущего Коммунальной армии"
comfrance.6.d:0 "Из-за присутствия профсоюзов в Коммунальной армии она оказалась чрезмерно политизированной, что создаёт напряжённость внутри Гаранта национальной целостности и Вооружённой руки Синдикалистской революции! В результате нынешний начальник штаба, популярный генерал гражданской войны Морис Гамелен, был вынужден уйти в отставку. Французские синдикалистские военные руководители, в большинстве своём сорельянцы, решили спросить у солдат, кого они хотят видеть во главе французской армии, прежде чем окончательно распустить военные профсоюзы."
comfrance.6.a:0 "Поль Ле Жантийомм (синдикалист) - Сторонник танковых войск."
comfrance.6.b:0 "Жак Дюкло (якобинец) - Централизованное верховное командование."
comfrance.6.c:0 "Жак Артюи (сорельянец) - Инициатива бойцов."
comfrance.6.e:0 "Анри Танге (анархист) - Массовый призыв."

comfrance.7.t:0 "День выборов 2: Общая разведка"
comfrance.7.d:0 "Благодаря ключевой роли в вопросах внешней и внутренней безопасности должность директора Комитета общей разведки считается одним из главных рычагов верховной власти во Французской Коммуне и имеет решающее значение для уничтожения политических соперников. В руках одной из экстремистских фракций, якобинцев или сорельянцев, она может превратиться в страшное оружие..."
comfrance.7.a:0 "Роже Саленгро (синдикалист)."
comfrance.7.b:0 "Вальдек Роше (якобинец)."
comfrance.7.c:0 "Гюстав Эрве (сорельянец)."
comfrance.7.e:0 "Передать полномочия ополчениям (анархисты)."

comfrance.8.t:0 "День выборов 3: Внутренняя безопасность"
comfrance.8.d:0 "Синдикалист Шарль Раппопорт оставил должность делегата по внутренней безопасности, чтобы побороться за пост главы внешнеполитического ведомства. Бывший председатель Марсо Пивер, всё ещё надеющийся сохранить своё политическое будущее, сумел заручиться поддержкой синдикалистского крыла и теперь борется за должность с суровым якобинцем Морисом Торезом, сорельянским генералом Марселем Бюкаром и молодым учеником Махно Морисом Жуайё."
comfrance.8.a:0 "Марсо Пивер (синдикалист)."
comfrance.8.b:0 "Морис Торез (якобинец)."
comfrance.8.c:0 "Марсель Бюкар (сорельянец)."
comfrance.8.e:0 "Морис Жуайё (анархист)."

comfrance.9.t:0 "День выборов 4: Экономические вопросы"
comfrance.9.d:0 "Сегодняшние выборы, похоже, превращаются в плебисцит по поводу экономической политики Коммуны последних лет. Между собой соперничают различные представления о будущем синдикалистской экономики, в большей или меньшей степени ориентированные на промышленность или сельское хозяйство. Каждое из них имеет решающее значение для будущей окончательной борьбы против Германии..."
comfrance.9.a:0 "Бенуа Фрашон (синдикалист) - Ортодоксальный синдикализм."
comfrance.9.b:0 "Жан Жером (якобинец) - Индустриализация."
comfrance.9.c:0 "Эдуар Берт (сорельянец) - Революционный синдикализм и корпоративизм."
comfrance.9.e:0 "Даниэль Герен (анархист) - Кооперативы."

comfrance.10.t:0 "День выборов 5: Внешняя политика"
comfrance.10.d:0 "В последний день выборов поднимается один из важнейших вопросов Французской Коммуны: дипломатия, на которую возложена двойная задача распространения Революции по всему миру и подготовки реванша против Германии. Хотя само существование Синдикалистского Интернационала пока не находится под угрозой, именно сегодня будут определены будущие театры Мировой революции..."
comfrance.10.a:0 "Шарль Раппопорт (синдикалист) - Интернационализм."
comfrance.10.b:0 "Марсель Кашен (якобинец) - Мировая революция."
comfrance.10.c:0 "Юбер Буржен (сорельянец) - Антигерманский реваншизм."
comfrance.10.e:0 "Нестор Махно (анархист) - Европейский социализм."

comfrance.12.t:0 "Результаты: Большинство синдикалистов"
comfrance.12.d:0 "Хотя многие видели в этих выборах конец синдикалистского консенсуса, управлявшего Коммуной со времён смерти Эмиля Пуже, синдикалистам удалось завоевать уверенное большинство.\n\nПивера можно было бы вернуть на пост, однако подобный вариант представляется крайне маловероятным. Теперь синдикалисты обращают внимание на русского эмигранта Бориса Суварина, которого, в отличие от Пивера, считают достаточно сильным, чтобы держать радикальные фракции под контролем, и способным привести Коммуну к её окончательной славе!"
comfrance.12.a:0 "Поздравляем, камрад Суварин."
comfrance.12.b:0 "Вернуть Пивера."

comfrance.13.t:0 "Результаты: Большинство якобинцев"
comfrance.13.d:0 "Выборы наконец привели якобинцев к власти, позволив ленинским ценностям вновь направлять Коммуну к Мировой революции! Один из ведущих якобинцев, Морис Торез, выступил с официальным заявлением: «Дорогие камрады, прислушайтесь к моим словам. Синдикалистские структуры разлагаются, сорельянские реакционеры и анархистская мразь выходят на улицы, но теперь, когда будущее Франции оказалось в наших руках, надежда наконец появилась. Улицы окрасятся в красный цвет кровью наших врагов, а рабочие всего мира наконец смогут ликовать. Ленинизм не умер!» Однако прежде чем недавно созданная Французская коммунистическая партия сможет навязать стране свою волю, ей предстоит сформировать кабинет. Выбор главы Франции стоит между генералом Жаком Дюкло и дипломатом Марселем Кашеном!"
comfrance.13.a:0 "Нам нужен дипломат, способный снизить напряжённость. Камрад Кашен - наш человек!"
comfrance.13.b:0 "Франции нужны дисциплина и порядок. Генерал Дюкло возглавит страну."

comfrance.14.t:0 "Морис Торез сменяет Луи Ньеля"
comfrance.14.d:0 "Во время церемонии вступления в должность нового Комитета общественного спасения во Всеобщей бирже труда новый председатель КОС потребовал от своего коллеги, председателя BGT Луи Ньеля, уйти в отставку, заявив, что угасающее руководство CGT больше не соответствует чаяниям Коммуны. Старик неохотно согласился, тем самым окончательно закрепив полное установление власти якобинцев над Коммуной. В итоге убеждённый ленинист Морис Торез был избран при поддержке нового якобинского председателя Комитета общественного спасения."
comfrance.14.a:0 "Да здравствует Революция!"

comfrance.15.t:0 "Результаты: Большинство сорельянцев"
comfrance.15.d:0 "Выборы наконец передали власть национал-синдикалистской фракции Французской Коммуны, убеждённым последователям революционных теорий Жоржа Сореля, попутно окончательно разгромившим своих старых врагов-якобинцев, которые теперь становятся жертвами кровавых чисток по всей стране. Жорж Валуа сменил Ньеля на посту председателя BGT. После слабости синдикалистской эпохи во французской политике началась новая эра... Теперь осталось решить, кто возглавит кабинет Валуа: Жак Артюи или Марсель Бюкар..."
comfrance.15.a:0 "Революционный легион продолжает марш. Командир Бюкар возглавит кабинет!"
comfrance.15.b:0 "Верный камрад и друг Жак Артюи возглавит кабинет!"

comfrance.16.t:0 "Сорельянцы закрепляют свою власть"
comfrance.16.d:0 "Сразу после победы на выборах сорельянцы во главе с председателем Валуа приступили к реализации нового национал-синдикалистского плана для Франции. В последние недели несогласная оппозиция была разгромлена, а видные несорельянцы, отчаянно цеплявшиеся за власть после выборов, оказались изолированы или были найдены мёртвыми при подозрительных обстоятельствах. Валуа распорядился, чтобы все упоминания о председательстве Ньеля подвергались жёсткой критике со стороны нового режима, а сам бывший председатель был помещён под домашний арест из опасений, что он может объединить синдикалистов и анархистов против Валуа. Франция вновь пережила радикальное преобразование..."
comfrance.16.a:0 "Сорельянцы правят безраздельно!"

comfrance.17.t:0 "Результаты: Большинство анархистов"
comfrance.17.d:0 "Выборы наконец привели анархистов к власти, а значит, французский народ понял, что Революция вступила в новую фазу и для руководства страной нужны более молодые умы. Наиболее ограничительные государственные структуры были демонтированы, открывая новую эпоху либертарного социализма по всей Европе. Нынешний председатель Луи Ньель ушёл в отставку, чтобы позволить избрать нового председателя-анархиста. Свою кандидатуру выдвинули несколько человек, среди которых наиболее значимы Даниэль Герен, пожизненный либертарный коммунист, известный и уважаемый как радикалами, так и умеренными, Себастьян Фор, намеренный воплотить идеалы синтетического анархизма, и анархо-синдикалистка и феминистка Мэй Пикерэ, сумевшая сплотить вокруг своей кандидатуры ортодоксальных синдикалистов из CGT."
comfrance.17.a:0 "Камрад Герен использует свои связи с либертарными коммунистами!"
comfrance.17.b:0 "Синтез камрада Фора - именно то, что нам нужно!"
comfrance.17.c:0 "Камрад Пикерэ возглавит единый фронт с синдикалистами!"

comfrance.19.t:0 "Отставка Луи Ньеля"
comfrance.19.d:0 "Во время церемонии вступления в должность нового Комитета общественного спасения во Всеобщей бирже труда председатель BGT Луи Ньель объявил о намерении уйти в отставку, заявив, что после восстановления уверенного большинства CGT он больше не обязан выступать компромиссной фигурой. Казалось бы, естественным решением стало возвращение на этот пост Леона Жуо, одного из отцов-основателей Коммуны и самого первого председателя BGT. Однако Бенуа Фрашон осудил периоды несправедливости в управлении Францией во время председательства Жуо и предложил собственную кандидатуру, напомнив о многочисленных заслугах в годы Революции. Уважаемый профсоюзный деятель Жан Зиромски, один из ведущих сторонников улучшения внутренней демократической системы CGT, также выдвинул себя, утверждая, что способен сохранить внутреннюю стабильность организации, примирив сторонников Жуо и Фрашона."
comfrance.19.a:0 "Леон Жуо вновь становится председателем Всеобщей биржи труда!"
comfrance.19.b:0 "Бенуа Фрашон побеждает своего старого соперника Жуо и становится председателем благодаря союзу с анархистами!"
comfrance.19.c:0 "Жан Зиромски достигает соглашения внутри CGT и обеспечивает внутреннюю стабильность!"

comfrance.20.t:0 "После выборов большинство не определилось"
comfrance.20.d:0 "После трёх дней проверки результаты наконец стали официальными: ни одна фракция не получила устойчивого большинства на последних выборах. Председатель Всеобщей биржи труда Луи Ньель объявил, что он и Собрание самостоятельно изберут нового председателя, который возглавит компромиссный кабинет и поможет избежать ещё более глубокого внутреннего конфликта между якобинцами и сорельянцами. Двумя наиболее заметными кандидатами стали Мисак Манушян, предложивший создать широкое правительство на основе компромисса и уделить больше внимания прямой демократии в коммунах, и Марсель Кашен, ортодоксальный коммунист, состоящий в якобинской фракции, но имеющий множество связей в CGT и желающий создать коммунистическо-профсоюзный компромисс. Социалистическая республиканская партия из CFDT во главе с харизматичным Жозефом Поль-Бонкуром попыталась договориться с CFTC, христианским профсоюзом, представляющим интересы сельского населения, и ветеранами Гастона Видаля."
comfrance.20.a:0 "Мисак Манушян создаёт широкую коалицию ради объединения расколотой Коммуны!"
comfrance.20.b:0 "Марсель Кашен формирует умеренную централистскую коалицию!"
comfrance.20.c:0 "Умеренные во главе с Поль-Бонкуром одерживают неожиданную победу!"

comfrance.22.t:0 "Призыв камрада Блюма к солидарности с Испанией"
comfrance.22.d:0 "Пока Пиренейский полуостров разрывает гражданская война, через Пиренеи приходят ужасающие рассказы о белом терроре, потрясающие наше население. По всей Коммуне стихийно собираются митинги и съезды, чтобы собрать средства и материалы для наших испанских камрадов и продемонстрировать непоколебимую поддержку CNT-FAI.\n\nНа одном из таких мероприятий делегат SFIO Леон Блюм произнёс сильную речь, призвав правительство продолжить поддержку испанских рабочих и крестьян путём создания международного народного фронта против реакционеров и монархистов. Эта речь о «Народном фронте» получила широкую похвалу за красноречие и твёрдую социалистическую убеждённость. Репутация месье Блюма как публичного оратора, несомненно, только укрепилась."
comfrance.22.a:0 "Весьма красноречиво, камрад."

comfrance.23.t:0 "Новый 1871 год"
comfrance.23.d:0 "Немцы вышли к Сене! Нация должна провести полную мобилизацию, чтобы остановить их!"
comfrance.23.a:0 "К оружию, граждане!"

comfrance.24.t:0 "Новый 1814 год"
comfrance.24.d:0 "Русские вышли к Сене! Нация должна провести полную мобилизацию, чтобы остановить их!"
comfrance.24.a:0 "К оружию, граждане!"

comfrance.25.t:0 "Проект «Дамокл»?"
comfrance.25.d:0 "Вдохновлённая Кембриджской конференцией, состоявшейся во время Десятого конгресса Интернационала в мае 1937 года, в последние недели в Кембриджском университете прошла ещё одна, несколько более секретная встреча.\n\nГруппа британских и французских физиков-теоретиков во главе с Норманом Фезером, Фредериком Жолио-Кюри и Франсисом Перреном обсуждает возможности радиоактивности и ядерного деления, а также их применения - от производства электроэнергии и медицинских технологий до мощного стратегического оружия. Участники просят выделить финансирование на создание «Проекта Дамокл», совместного британо-французского комитета по ядерным исследованиям."
comfrance.25.a:0 "Создать проект «Дамокл»!"
comfrance.25.b:0 "Не будем тратить деньги на подобную нелепость!"

comfrance.26.t:0 "Создание проекта «Дамокл»"
comfrance.26.d:0 "Правительство Британского Союза приняло наше предложение о создании совместного проекта «Дамокл». Это грандиозное начинание позволит нам распространить синдикализм по всему миру!"
comfrance.26.a:0 "Превосходно!"

comfrance.27.t:0 "Британия отказалась сотрудничать!"
comfrance.27.d:0 "Правительство Британского Союза отклонило наше предложение о создании совместного проекта «Дамокл». Придётся заниматься этим самостоятельно."
comfrance.27.a:0 "Проклятье!"

comfrance.28.t:0 "Третий Интернационал"
comfrance.28.d:0 "Мы готовимся к Третьему Интернационалу с 1927 года. Теперь мы почти готовы провести Девятый конгресс прямо здесь, на холме Монмартр в Париже, на руинах Сакре-Кёр. В течение трёх дней город будет принимать делегатов почти всех социалистических, синдикалистских и большевистских партий со всего мира. Мы, французы, первыми возьмём слово, разумеется, если всё ещё намерены провести Девятый конгресс и продолжить дело Второго Интернационала."
comfrance.28.a:0 "Конгресс состоится через неделю после Первомая, как и было запланировано!"
comfrance.28.b:0 "Отменить конгресс. Какая нелепая затея!"

comfrance.29.t:0 "Девятый конгресс Третьего Интернационала"
comfrance.29.d:0 "Пришло время пригласить социалистических и синдикалистских лидеров со всего мира на Девятый конгресс Третьего Интернационала."
comfrance.29.a:0 "Разослать приглашения!"

comfrance.30.t:0 "Третий Интернационал"
comfrance.30.d:0 "Франция всё же решила провести Девятый конгресс Третьего Интернационала, и мы, как и ожидалось, получили приглашение. Было бы глупо не отправить делегацию."
comfrance.30.a:0 "Пора собирать чемоданы!"
comfrance.30.b:0 "Скажите французам, что мы не сможем приехать, мы, э-э..."

comfrance.41.t:0 "Все делегаты прибыли"
comfrance.41.d:0 "После месяцев лихорадочной подготовки Девятый конгресс Третьего Интернационала открылся в Версале. Люди со всего мира собрались, чтобы координировать усилия социалистического движения. Партии, связанные с Интернационалом, а также некоторые сочувствующие и наблюдатели получили приглашения направить представителей, и сотни людей проделали порой тяжёлый путь, чтобы оказаться как можно ближе к бьющемуся сердцу пролетарской Революции. Хотя формально Интернационал не связан с французским и британским правительствами, представители этих ведущих социалистических держав, несомненно, будут пользоваться неофициальным старшинством среди товарищей как старейшины мирового освобождения трудящегося класса."
comfrance.41.a:0 "Тёплый приём нашим камрадам!"

comfrance.42.t:0 "Председатель Временного революционного правительства берёт слово"
comfrance.42.d:0 "Первое заседание Девятого конгресса Третьего Интернационала состоялось в Версальском дворце, украшенном к этому случаю багряными знамёнами с социалистической символикой и лозунгами. Удостоенный чести произнести вступительную речь отец Британской революции Джордж Лэнсбери отметил иронию того, что пролетарские силы собрались в бывшем центре самодержавной монархии, что само по себе служит доказательством неудержимого поступательного движения Революции. Затем последовала большая речь с благодарностью делегатам, воспоминаниями о революционных успехах последних лет и призывами к грядущей борьбе. В заключении Лэнсбери предложил делегатам присоединиться к нему в минуте молитвы, на что из французской части зала немедленно раздалось: «Ещё чего!», вызвав несколько минут волнения среди публики. Несмотря на это, старика наградили бурными аплодисментами, после чего представители разошлись по различным дискуссионным группам и комитетам."
comfrance.42.a:0 "Мы должны использовать любые средства для свержения международной буржуазии."

comfrance.43.t:0 "Синдикализм в Испании"
comfrance.43.d:0 "Хоакин Аскасо Будрия вышел на трибуну и изложил Конгрессу позицию CNT-FAI в Испании. CNT-FAI является крупнейшей синдикалистской организацией страны, объединяющей анархо-синдикалистов, умеренных синдикалистов и профсоюзных деятелей. Испанские революционеры собственными глазами столкнулись с Белым террором, жестокими контрреволюционными действиями против рабочих. Они прибыли просить поддержки своего дела, когда наступит решающий момент. Резолюция о поддержке испанских пролетарских сил была принята единогласно под крики «¡Viva la Revolución!», разносившиеся по залам Версаля."
comfrance.43.a:0 "Французы обещают поддержку и призывают остальных сделать то же самое."
comfrance.43.b:0 "CNT-FAI не нуждается в помощи. Перейдём дальше."

comfrance.45.t:0 "Белый террор"
comfrance.45.d:0 "Мы услышали рассказ Хоакина Аскасо Будрии об ужасах Белого террора, приходящих из Мадрида и Барселоны, после чего баварский социалист Курт Эйснер пожелал подробнее остановиться на этой теме и получил слово. Выслушав ещё больше историй из Германии, Австрии, Венгрии, России и Финляндии, участники Конгресса приготовились вынести решение."
comfrance.45.a:0 "Осудить капиталистических убийц и их социал-демократических пособников."
comfrance.45.b:0 "Для нас это ничего не меняет."

comfrance.47.t:0 "Уильям «Большой Билл» Хейвуд и Объединённые Синдикаты"
comfrance.47.d:0 "Американский делегат Уильям «Большой Билл» Хейвуд произнёс страстную речь. Настоящий рабочий на протяжении всей своей жизни и один из первых американцев, сумевших заручиться широкой поддержкой социализма, позднее он и сам вступил в политическую борьбу. Теперь, будучи уважаемым голосом движения, он объявил о намерении участвовать в президентских выборах 1936 года от SPA. Несмотря на критику дома и за рубежом, будто это потянет его к реформизму, перспектива увидеть убеждённого социалиста во главе Соединённых Штатов слишком заманчива, чтобы делегаты выражали серьёзное недовольство, и Конгресс встретил Билла тепло. В своей речи он подробно описал нынешнее положение в Соединённых Штатах: Великая депрессия, продолжающаяся уже много лет, ввергла американских рабочих и фермеров в ужасные условия, что вызвало стремительный рост радикальной политики, ещё сильнее ускоренный германским крахом. Рабочее движение становится всё мощнее, SPA стремительно укрепляется в политических институтах, а пролетарские силы стойко противостоят полицейским репрессиям, лонгистским популистам и реакционным ополчениям. Возможность для решительного действия, кажется, обязательно появится."
comfrance.47.a:0 "Современный Бенджамин Франклин! Они получат нашу поддержку!"
comfrance.47.b:0 "Помните, чем закончилась предыдущая Американская революция?"
comfrance.47.c:0 "Им нельзя доверять, все гринго одинаковы."

comfrance.50.t:0 "Надежды в Латинской Америке"
comfrance.50.d:0 "Следующим мероприятием стало совместное выступление латиноамериканских камрадов. В последние годы Южная и Центральная Америка находятся на переднем крае социалистической борьбы. Будучи главными жертвами американских интересов, непрерывно эксплуатируемые международным Капиталом и задавленные мелкими диктаторами-марионетками того или иного «янки»-лобби, массы Америк наконец сказали: довольно. Каждый день всё больше рабочих вступают в борьбу на этом фронте империализма, и, если верить нашим камрадам, весь континент находится всего в одном рывке от Освобождения. Переполненный зал с воодушевлением слушал героические рассказы патагонских революционеров, последние новости всё ещё свежей Никарагуанской революции и истории ветеранов Мексиканской революции, вдохновившей всю Латинскую Америку. Делегаты из других стран, включая Бразилию и Кубу, подробно рассказали о положении пролетарской борьбы у себя на родине, и многие испытывают большой оптимизм относительно перспектив ближайших лет."
comfrance.50.a:0 "Начать взращивать синдикализм в Латинской Америке."
comfrance.50.b:0 "Синдикализм следует строить в других местах. Нужно расставить приоритеты."

comfrance.51.t:0 "Роль женщин в Мировой революции"
comfrance.51.d:0 "Сегодня британская феминистка Хелен Кроуфорд вышла на трибуну с пламенной речью о роли женщин в Мировой революции. По её словам, без участия женщин в промышленности и вооружённых силах победить многочисленных врагов пролетариата может оказаться невозможно. Однако следование этому призыву, скорее всего, вызовет волнения среди более «консервативных» слоёв общества."
comfrance.51.d.FRA:0 "Сегодня британская феминистка Хелен Кроуфорд вышла на трибуну с пламенной речью о роли женщин в Мировой революции. По её словам, без участия женщин в промышленности и вооружённых силах победить многочисленных врагов пролетариата может оказаться невозможно. Однако следование этому призыву, скорее всего, вызовет волнения среди более «консервативных» слоёв общества."
comfrance.51.d.other:0 "Сегодня британская феминистка Хелен Кроуфорд вышла на трибуну с пламенной речью о роли женщин в Мировой революции. По её словам, без участия женщин в промышленности и вооружённых силах победить многочисленных врагов пролетариата может оказаться невозможно. Хотя наша делегация полностью согласна с её посланием, некоторые опасаются, что ещё слишком рано всерьёз продвигать вопрос женского освобождения, а официальная поддержка речи лишь спровоцирует ненужные внутренние волнения."
comfrance.51.a:0 "Участие трудящихся женщин необходимо для победы Мировой революции."
comfrance.51.b:0 "Смелая женщина, но мы не станем реагировать."

comfrance.52.t:0 "Роль женщин в Мировой революции"
comfrance.52.d:0 "Вчера Хелен Кроуфорд выступила с пламенной речью о роли женщин в Мировой революции. По её словам, без участия женщин в промышленности и вооружённых силах победить многочисленных врагов пролетариата может оказаться невозможно. Как бы заманчиво это ни звучало, политический климат Британии пока не готов к подобному решению. Нам придётся дождаться осеннего Конгресса профсоюзов, чтобы продвинуть этот вопрос."
comfrance.52.a:0 "Да будет так."

comfrance.53.t:0 "Запросить поддержку Французской Коммуны для Рисорджименто"
comfrance.53.d:0 "Сегодня наши представители на Конгрессе Третьего Интернационала получили возможность изложить свои доводы и запросить международную поддержку наших усилий по воссоединению. Министр иностранных дел считает, что поддержка Франции в деле Рисорджименто может оказаться жизненно важной для его успеха из-за возможного вмешательства Австрии."
comfrance.53.a:0 "Попросить поддержки для осуществления Рисорджименто!"
comfrance.53.b:0 "Сейчас есть более важные вопросы."

comfrance.54.t:0 "Политика на Итальянском полуострове"
comfrance.54.d:0 "Министр иностранных дел Социалистической Республики Италия выступил перед Первым синдикалистским конгрессом, призывая поддержать Республику в её стремлении воссоединить Итальянский полуостров перед лицом предателей за Римом, австрийских прислужников и их бывших пособников как в Риме, так и в Неаполе. Вмешательство в итальянские дела может помочь распространению Революции, но также способно привести к конфликту с реакционной Австрийской империей, защищающей режим в Милане."
comfrance.54.a:0 "Гарантировать нашим друзьям в Турине помощь, когда придёт время."
comfrance.54.b:0 "Не будем тратить время на Италию."

comfrance.55.t:0 "Мировой экономический кризис и роль Третьего Интернационала"
comfrance.55.d:0 "После краха Берлинской фондовой биржи массовая безработица охватила Европу и Южную Америку, а профсоюзные движения в обоих регионах начали стремительно расти. Французское и британское правительства провели в строжайшей тайне переговоры, и постепенно, но неизбежно все пришли к одному выводу: возможно, настал час, возможно, настал момент для грандиозного усилия. Однако вопрос о том, в чём именно оно должно заключаться, вызвал ожесточённые споры, и когда Конгресс наконец вновь собрался для голосования, дебаты затянулись глубоко за полночь. Предложения варьировались от простого осуждения до призывов к немедленной вооружённой борьбе.\n\nВ конечном итоге было решено, что вскоре под эгидой Третьего Интернационала и великих социалистических держав будет создана система более глубокого международного сотрудничества. Помощь в развитии социалистических экономик, более тесная экономическая интеграция, научно-исследовательские программы и постоянные международные советы сотрудничества должны помочь свободным народам мира действовать как единое целое при подготовке к окончательной борьбе. Одновременно будут предприняты как открытые, так и тайные меры по более конкретной поддержке социалистических движений в капиталистических странах. Разумеется, детали ещё предстоит определить правительствам, однако предложение было принято почти единогласно. Оставалось решить лишь одно - название инициативы. Французский делегат предложил «Фаланстер» в честь гармоничных и самодостаточных общин, задуманных социалистом-утопистом Шарлем Фурье. Идея мгновенно обрела популярность: построив этот Международный Фаланстер, рабочие всего мира вскоре завоюют утопию, которую заслужили."
comfrance.55.a:0 "Возможность."

comfrance.56.t:0 "Положение индийского социализма"
comfrance.56.d:0 "Когда Конгресс приблизился к завершению, молодой Джавахарлал Неру взял слово, чтобы рассказать о шатком положении нашего революционного правительства. В своей речи он настойчиво призвал к международной поддержке создания народной армии, способной соперничать с нашими врагами в Дели и Хайдарабаде."
comfrance.56.a:0 "Нам нужна международная помощь в организации армии!"
comfrance.56.b:0 "Нет, мы справимся сами."

comfrance.57.t:0 "Бхаратия просит поддержки"
comfrance.57.d:0 "Бхаратия попросила помощи в борьбе против своих соседей, Дели и Княжеской Федерации. Они хотели бы, чтобы мы отправили военных советников для подготовки их командиров и солдат."
comfrance.57.a:0 "Отправить военных советников для подготовки их армии!"
comfrance.57.b:0 "Мы не можем тратить на это ресурсы."

comfrance.58.t:0 "Камрад Мохамед Саиль хочет выступить"
comfrance.58.d:0 "Камраду Мохамеду Саилю, видному алжирскому социалисту, разрешили выступить перед собравшимся Конгрессом. Он произнёс пламенную речь о положении в Марокко и Французской Африке, где арабский труд подвергается эксплуатации ради обогащения состоятельных кругов и колониального истеблишмента. Саиль призвал Конгресс немедленно положить этому конец. Он предложил создать Социалистический антиколониальный комитет, который будет снабжать местных синдикалистских антиколониальных заговорщиков в Северной Африке."
comfrance.58.a:0 "Мы с радостью поддержим создание Комитета."

comfrance.59.t:0 "Завершение Девятого конгресса"
comfrance.59.d:0 "Девятый конгресс Третьего Интернационала наконец подошёл к концу. Насыщенный событиями и эмоциями, вновь укрепивший единство международного социалистического движения и определивший его курс на ближайшее будущее, он мог считаться лишь успехом. Последнее голосование делегатов касалось места проведения следующего конгресса, и хотя было предложено множество городов, в конечном итоге выбор пал на Лондон, другую великую социалистическую столицу. Многие делегаты выступили с заключительными словами и поблагодарили своих камрадов.\n\nПо возвращении домой им предстоит столкнуться с последствиями одного из крупнейших событий со времён революций, несомненно открывающего возможность для решительных действий. Но прежде была организована церемония достойных проводов. На холме Монмартр, родине Парижской коммуны 1871 года, состоялось грандиозное представление для широкой публики, где выступили лучшие французские артисты, были показаны региональные костюмы и традиции, спортивные достижения и технологические новинки. Затем последовал огромный банкет для многочисленных делегатов с блюдами со всех уголков Коммуны, продолжавшийся до глубокой ночи. Разумеется, гости завершили этот праздник радостного социалистического единства единственным подобающим образом - гордо исполнив «Интернационал»."
comfrance.59.a:0 "И завтра Интернационал сплотит весь род людской!"

comfrance.61.t:0 "Первый шаг синдикалистов"
comfrance.61.d:0 "Красные собираются, чтобы координировать свою деятельность, которая определённо направлена против порядка, установленного нами в Европе после победы в Вельткриге. Мы должны внимательно следить за этой встречей и тщательно проанализировать её результаты!"
comfrance.61.a:0 "Следить за ними!"

comfrance.62.t:0 "Военная помощь Французской Коммуны"
comfrance.62.d:0 "После того как наши делегаты на Девятом конгрессе Третьего Интернационала запросили военную помощь для организации Индийской революционной армии, Британский Союз и Французская Коммуна решили направить высокопоставленных военных специалистов и экспертов для подготовки наших лучших офицеров. Будем надеяться, что это сотрудничество даст полезные результаты на поле боя!"
comfrance.62.a:0 "Красная армия найдёт этим камрадам достойное применение!"

comfrance.63.t:0 "Моханд Амезиан бен Амезиан Саиль и Антиколониальный комитет"
comfrance.63.d:0 "Мохамед Саиль, создатель одного из первых освободительных движений в Северной Африке и добрый камрад французских анархистов и синдикалистов, предложил нам оказывать тайную поддержку левым магрибским националистам."
comfrance.63.a:0 "За работу."

comfrance.64.t:0 "Возвышение Социалистического антиколониального комитета"
comfrance.64.d:0 "Наши специалисты контрразведки отметили недавний всплеск синдикалистской активности в нашей стране. Нам известно, что Французская Коммуна совместно с Британским Союзом создала в Интернационале Антиколониальный комитет, который до недавнего времени фактически бездействовал. Этот комитет при помощи Моханда Амезиана бен Амезиана Саиля, предателя алжирского народа, координирует усилия синдикалистов по поддержке антиколониальных настроений в нашей Французской Африке.\n\nСиндикалистские державы отправили значительные партии оружия и снаряжения для поддержки местных повстанцев. Они также открыли несколько тренировочных лагерей в самых южных районах своих стран. Хотя наиболее радикальные политики у нас считают, что из этого ничего не выйдет, генералы предупреждают, что нам следует проявлять осторожность."
comfrance.64.a:0 "Тревожное развитие событий."

comfrance.65.t:0 "Коммунары создают Социалистический антиколониальный комитет"
comfrance.65.d:0 "Слухи распространились повсюду. Французская Коммуна совместно с другими участниками Интернационала создала Социалистический антиколониальный комитет. Его целью является поддержка арабов Северной Африки в борьбе за освобождение своих земель от колониальных держав.\nИ потому наш протекторат Марокко вместе с другими членами Синдикалистского Интернационала возродил Мусульманский комитет, неофициально известный как «Социалистический мусульманский комитет». Этот орган координирует действия синдикалистских держав на Ближнем Востоке. Наша разведка сообщает о небольшом притоке египетских левых радикалов, желающих сражаться за революционное дело. Хотя мы не находимся в состоянии войны с Французской Коммуной или какой-либо синдикалистской державой, нам следует быть крайне осторожными."
comfrance.65.a:0 "Предательство, заговоры, саботаж!"

comfrance.66.t:0 "Возвышение Социалистического мусульманского комитета"
comfrance.66.d:0 "Французская Коммуна совместно с другими членами Синдикалистского Интернационала возродила Мусульманский комитет, неофициально известный как «Социалистический мусульманский комитет». Этот орган координирует действия синдикалистских держав на Ближнем Востоке. Наша разведка сообщает о небольшом притоке марокканских левых радикалов, желающих сражаться за революционное дело. Хотя мы не находимся в состоянии войны с Французской Коммуной или какой-либо синдикалистской страной, нам следует проявлять крайнюю осторожность."
comfrance.66.a:0 "Они что, прячут бомбы в тюрбанах!?"

comfrance.67.t:0 "Возвышение Социалистического антиколониального комитета"
comfrance.67.d:0 "До Испании дошли новости: создан Социалистический антиколониальный комитет, стремящийся освободить арабское население Северной Африки от власти колониальных держав. Остаётся надеяться, что мы не станем одной из его целей, ведь сейчас у нас есть куда более важные проблемы."
comfrance.67.a:0 "Будем надеяться, Риф это не затронет."

comfrance.69.t:0 "Нас саботировали!"
comfrance.69.d:0 "Эти грязные французские крысы недавно организовали диверсию при помощи французских синдикалистов, возродивших Мусульманский комитет в Интернационале и пригласивших нас присоединиться. Новый Комитет будет распространять социалистическую пропаганду в мусульманском мире и координировать помощь региональным левым партиям. Это может стать прекрасной возможностью укрепить наш авторитет в мусульманских кругах как в Центральной Азии, так и за рубежом. Недостатком Комитета остаётся возможность религиозного конфликта."
comfrance.69.a:0 "Соедините нас с Берлином."

comfrance.70.t:0 "По нам нанесли удар!"
comfrance.70.d:0 "Одна из действующих в нашей стране социалистических террористических ячеек только что совершила жестокий акт саботажа! К счастью, никто не погиб, однако несколько объектов были уничтожены."
comfrance.70.a:0 "Это не спасёт вас от краха."

comfrance.71.t:0 "Десятый конгресс Интернационала"
comfrance.71.d:0 "Поскольку по всему миру в любой момент могут вспыхнуть новые конфликты, Интернационалу необходимо переосмыслить подход к мировой революции. Поскольку Девятый конгресс Интернационала прошёл во Франции, многие активисты считают, что второй страной-хозяйкой должна стать Британия."
comfrance.71.a:0 "Для нас будет честью принять Конгресс."

comfrance.72.t:0 "Десятый конгресс Интернационала"
comfrance.72.d:0 "Наши британские камрады подтвердили готовность провести Десятый конгресс Интернационала в Лондоне. Пришло время [ROOT.GetNameDef] подтвердить своё участие."
comfrance.72.a:0 "Мы примем участие."
comfrance.72.b:0 "Нас это не интересует."

comfrance.86.t:0 "Открытие Десятого конгресса Интернационала"
comfrance.86.d:0 "Когда все делегаты собрались в Лондоне, Десятый конгресс Интернационала начался с речи камрада Эрика Блэра. В так называемой «Речи щита и меча» он подчеркнул необходимость удвоить усилия Интернационала по созданию «Дамокла» - оружия, способного раз и навсегда уничтожить реакционеров по всему миру."
comfrance.86.a:0 "Браво, камрад Блэр!"

comfrance.87.t:0 "День 2 - Американский вопрос"
comfrance.87.d:0 "На второй день делегаты обсудили наиболее насущный вопрос - развитие Гражданской войны в Америке. Поскольку Лонг и федеральное правительство вынуждают ОСА перейти к обороне, было решено отправить дополнительную помощь Хейвуду и его последователям."
comfrance.87.a:0 "Предоставить ресурсы, промышленное оборудование и оружие."
comfrance.87.b:0 "Отправить элитную истребительную эскадрилью."
comfrance.87.c:0 "Организовать добровольческую дивизию."
comfrance.87.f:0 "Мы больше ничем не можем поделиться."

comfrance.90.t:0 "Прибывает французская помощь"
comfrance.90.d:0 "Наши французские камрады согласились отправить нам дополнительную помощь. Через Мексику, под постоянной угрозой авиации США и АСШ, в Чикаго прибыли значительные объёмы промышленного оборудования и современных станков, а также промышленные советники."
comfrance.90.a:0 "Спасибо, камрады!"

comfrance.91.t:0 "Прибывает британская помощь"
comfrance.91.d:0 "Наши британские камрады согласились отправить нам дополнительную помощь. Через Мексику, под постоянной угрозой авиации США и АСШ, в Чикаго недавно прибыла элитная эскадрилья британских лётчиков-истребителей, которая теперь ожидает наших приказов."
comfrance.91.a:0 "Спасибо, камрады!"

comfrance.94.t:0 "Прибывает мексиканская помощь"
comfrance.94.d:0 "Наши мексиканские камрады согласились отправить нам дополнительную помощь. Через границу, под постоянной угрозой авиации США и АСШ, в Иллинойс прибыла партия оружия для наших нужд."
comfrance.94.a:0 "Спасибо, камрады!"

comfrance.97.t:0 "День 3 - Речь Хемингуэя"
comfrance.97.d:0 "После урегулирования американского вопроса на трибуну поднялся Эрнест Хемингуэй, делегат Синдикатов на Конгрессе. Он поблагодарил всех, кто поддержал дело ОСА, и призвал социалистический мир непрерывно бороться с реакционерами. Речь была встречена бурными аплодисментами, особенно со стороны французской делегации."
comfrance.97.a:0 "Да, мы можем!"
comfrance.97.b:0 "Да, мы можем!"
comfrance.97.c:0 "Великая речь."

comfrance.98.t:0 "День 3 - Речь Хемингуэя"
comfrance.98.d:0 "Сегодня синдикалистский делегат на Десятом конгрессе Интернационала Эрнест Хемингуэй произнёс речь, осудив наши действия против ОСА и призвав усилить поддержку красных в этой войне. Мы должны удвоить усилия и разгромить Хейвуда до того, как он получит дополнительную помощь."
comfrance.98.a:0 "Вперёд!"

comfrance.99.t:0 "Кембриджская конференция"
comfrance.99.d:0 "Одновременно с политиками в Лондоне в старом Кембриджском университете состоялась отдельная встреча учёных из Франции и Британии. Было решено, что синдикалистские страны должны объединить свои исследования для разработки оружия, способного защитить Революцию от всё более агрессивной империалистической угрозы."
comfrance.99.a:0 "Знание - сила."

comfrance.10100.t:0 "День 5 - Запросить международную поддержку для Чили"
comfrance.10100.d:0 "Социалистический режим в Сантьяго окружён реакционерами, особенно в Аргентине. Похоже, лучшим способом защитить правительство будет запросить международную поддержку через Десятый конгресс Интернационала."
comfrance.10100.a:0 "Мы не останемся одни."
comfrance.10100.b:0 "Мы не должны выпрашивать помощь."

comfrance.10300.t:0 "День 5 - Чили просит поддержки"
comfrance.10300.d:0 "Чилийцы попросили помощи в улучшении своей армии перед лицом враждебных империалистических противников, таких как Аргентина. Окружённое угрозами практически со всех сторон, Чили без нашей поддержки может оказаться во всё более опасном положении. Кроме того, оно может сыграть неоценимую роль в защите революции в Новом Свете."
comfrance.10300.a:0 "Мы не можем позволить Чили пасть."
comfrance.10300.b:0 "Увы, мы не можем помочь всем."

comfrance.10600.t:0 "Британцы отказались помочь!"
comfrance.10600.d:0 "Британский Союз отклонил наши просьбы. Очевидно, Чили не входит в число их главных стратегических приоритетов."
comfrance.10600.a:0 "Мы выдержим."
comfrance.10600.b:0 "Довольно! Чили найдёт собственный путь к коммунизму!"

comfrance.10700.t:0 "Французы отказались помочь!"
comfrance.10700.d:0 "Коммунары не откликнулись на наши просьбы о поддержке, заявив, что Чили вполне способно защитить себя и самостоятельно продвигать Революцию в Южной Америке."
comfrance.10700.a:0 "Проклятые французы."
comfrance.10700.b:0 "Нам не нужна эта бесполезная шайка!"

comfrance.108.t:0 "Британцы согласились помочь!"
comfrance.108.d:0 "Британский Союз согласился протянуть нам руку помощи. Вероятно, груз прибудет через несколько дней, когда его подготовка будет завершена."
comfrance.108.a:0 "Прекрасно!"

comfrance.10800.t:0 "Прибывает британская помощь"
comfrance.10800.d:0 "Обещанная Британией помощь наконец прибыла. Это партия винтовок, не самых современных и эффективных моделей, но и им мы найдём достойное применение."
comfrance.10800.a:0 "Мы найдём им хорошее применение."

comfrance.109.t:0 "Французы согласились помочь!"
comfrance.109.d:0 "Наши коммунарские братья во Франции решили удовлетворить просьбу о поддержке и пообещали вскоре отправить грузы. Осталось недолго до прибытия помощи."
comfrance.109.a:0 "Très bien, действительно!"

comfrance.10900.t:0 "Прибывает французская помощь"
comfrance.10900.d:0 "Обещанная нам Францией помощь наконец прибыла. Это партия винтовок, не самых современных и эффективных моделей, но и им мы найдём достойное применение."
comfrance.10900.a:0 "Эта помощь нам очень нужна."

comfrance.110.t:0 "Заключительный акт Десятого конгресса Интернационала"
comfrance.110.d:0 "После принятия всех важных решений в течение первой недели Конгресс перешёл к менее насущным вопросам. По завершении десяти дней переговоров, дискуссий и политических интриг делегаты подготовили последний акт - декларацию вечного братства и готовности противостоять империалистам, где бы те ни находились."
comfrance.110.a:0 "[FRA_workers_of_the_world_unite]"

FRA_workers_of_the_world_unite_ENG:0 "Пролетарии всех стран, соединяйтесь!"
FRA_workers_of_the_world_unite_FRA:0 "Пролетарии всех стран, соединяйтесь!"
FRA_workers_of_the_world_unite_SPA:0 "Пролетарии всех стран, соединяйтесь!"
FRA_workers_of_the_world_unite_ITA:0 "Пролетарии всех стран, соединяйтесь!"
FRA_workers_of_the_world_unite_POR:0 "Пролетарии всех стран, соединяйтесь!"
FRA_workers_of_the_world_unite_RUS:0 "Пролетарии всех стран, соединяйтесь!"
FRA_workers_of_the_world_unite_IRE:0 "Пролетарии всех стран, соединяйтесь!"

comfrance.111.t:0 "Объявить о наших амбициях"
comfrance.111.d:0 "Пока социалистические силы поднимаются по всему миру, Центральноамериканской Республике пора объявить на Десятом конгрессе Третьего Интернационала о своих целях на ближайшие годы."
comfrance.111.a:0 "Мы объединим Латинскую Америку вплоть до Канала!"
comfrance.111.b:0 "Пока нас устраивает нынешнее положение."

comfrance.112.t:0 "Центральная Америка объявляет о своих амбициях"
comfrance.112.d:0 "Центральноамериканский делегат только что объявил о планах своей страны расшириться в направлении Панамского канала. Если он окажется в наших руках, положение социалистов в мире значительно укрепится."
comfrance.112.a:0 "Удачи, камрады!"

comfrance.113.t:0 "Бразильско-боливийский союз?"
comfrance.113.d:0 "Пока в Лондоне идёт Десятый конгресс Интернационала, наша делегация провела предварительные переговоры с боливийцами о возможном союзе, который помог бы укрепить социализм в Южной Америке. Теперь остаётся решить, стоит ли предложить официальный альянс между нашими странами для борьбы с Аргентиной."
comfrance.113.a:0 "Предложим союз!"
comfrance.113.b:0 "В этом нет необходимости."

comfrance.114.t:0 "Бразильско-боливийский союз?"
comfrance.114.d:0 "Пока в Лондоне идёт Десятый конгресс Интернационала, правительство Бразилии предложило укрепить социалистическое влияние в Южной Америке путём создания военного противовеса Аргентине. Они предлагают заключить с нами официальный союз."
comfrance.114.a:0 "Прекрасное предложение!"
comfrance.114.b:0 "В этом нет необходимости."

comfrance.115.t:0 "Ла-Пасский договор"
comfrance.115.d:0 "Теперь, когда наши общие интересы подтверждены, пришло время подписать официальный договор с боливийцами."
comfrance.115.a:0 "Мы будем вместе бороться за южноамериканский социализм."

comfrance.116.t:0 "Смерть Филипа Сноудена"
comfrance.116.d:0 "Филип Сноуден скончался в возрасте 73 лет в своём доме в Тилфорде, графство Суррей. Хотя он покинул пост председателя почти год назад, его авторитет и влияние в Союзе оставались беспрецедентными. На похоронах председатель TUC заявил: «Камрад Сноуден покинул нас, но его идеи будут жить вечно». Церемония превратилась в одно из крупнейших публичных проявлений патриотизма со времён революции 1925 года."
comfrance.116.a:0 "Sic transit gloria mundi..."

comfrance.117.t:0 "Смерть Филипа Сноудена"
comfrance.117.d:0 "Филип Сноуден скончался в возрасте 73 лет в своём доме в Тилфорде, графство Суррей. Предатель и председатель TUC Британского Союза, Сноуден запомнился роялистам как само воплощение измены. Хотя социалисты в Британии скорбят о его смерти, в Канаде день его похорон стал одним ярким мгновением в этот мрачный период истории."
comfrance.117.a:0 "Дьявол мёртв."

comfrance.118.t:0 "Германия и Десятый конгресс Интернационала"
comfrance.118.d:0 "В Германии Конгресс был встречен с тревогой. Экономический кризис всё ещё не преодолён полностью, поэтому любой рост социалистической активности представляет угрозу Рейхспакту и Германской империи. В своей последней речи кайзер осудил социалистов, однако одних слов недостаточно - необходимы и действия."
comfrance.118.a:0 "Нам придётся как-то отреагировать..."
comfrance.118.b:0 "Обратиться к нашим соседям."
comfrance.118.c:0 "Арестовать нескольких левых агитаторов, чтобы успокоить народ."

comfrance.119.t:0 "Германия предлагает Договор перестраховки"
comfrance.119.d:0 "Поскольку социалистическое возрождение на Западе стало очевидным, кайзер решил предложить нам новый Договор перестраховки, подобный соглашению 1887 года перед Вельткригом, связывавшему наши государства. Согласно документу, мы будем обязаны прийти на помощь кайзеру, если Германия подвергнется нападению Французской Коммуны, и наоборот. Это прекрасная возможность выйти из международной изоляции и одновременно обезопасить западный фланг до завершения восстановления нашей армии."
comfrance.119.a:0 "Хорошая идея!"
comfrance.119.b:0 "С какой стати нам помогать Рейху?"

comfrance.120.t:0 "Второй Договор перестраховки подписан"
comfrance.120.d:0 "Русские приняли наше предложение. В случае войны с Французской Коммуной они обязаны прийти нам на помощь, и мы, соответственно, обязаны сделать то же самое."
comfrance.120.a:0 "Очень хорошо."

comfrance.121.t:0 "Второй Договор перестраховки отклонён"
comfrance.121.d:0 "Русские отклонили наше предложение. Хотя их армия слаба и война между нашими государствами маловероятна, в случае конфликта с Францией наш тыл всё равно остаётся открытым."
comfrance.121.a:0 "Дерьмо!"

comfrance.122.t:0 "Кайзер обещает защиту"
comfrance.122.d:0 "Кайзер пообещал помочь нашей стране, если Интернационал попытается свергнуть наше правительство. Это важный шаг к созданию противовеса всё более враждебному международному социализму."
comfrance.122.a:0 "Очень хорошо, как они говорят."

comfrance.123.t:0 "Германия арестовывает левых активистов"
comfrance.123.d:0 "Кайзер начал очередную кампанию по очищению Германии от сторонников левых идей. Хотя это явный признак паники с его стороны, Интернационал несомненно пострадает от потери столь храбрых людей."
comfrance.123.a:0 "Мы этого не забудем..."

comfrance.124.t:0 "Прибывает французская помощь!"
comfrance.124.d:0 "Наши французские камрады увидели бедственное положение [ROOT.GetAdjective]их рабочих и отправили нам значительные партии припасов! Также прибыли многочисленные добровольцы, готовые сражаться за дело международной пролетарской солидарности!"
comfrance.124.a:0 "Великолепно!"

comfrance.12600.t:0 "Прибывает французская помощь!"
comfrance.12600.d:0 "Обещанная французскими камрадами помощь наконец прибыла сегодня в аэропорт Сантьяго, и теперь тонны оборудования, станков и строительных материалов ожидают нашего решения. Что следует с ними сделать?"
comfrance.12600.a:0 "Использовать для улучшения армии."
comfrance.12600.b:0 "Использовать для развития промышленности."
comfrance.12600.c:0 "Использовать для укрепления границы с Аргентиной."

comfrance.127.t:0 "Международная исследовательская организация «Фаланстер»"
comfrance.127.d:0 "Со временем стало совершенно очевидно, что мировой революции требуется куда больше одной лишь преданности делу. Поскольку Франция и Британия остаются единственными высокоразвитыми социалистическими странами мира, всё шире признаётся необходимость запуска ими долгосрочной программы научной помощи другим государствам. Так появилась так называемая «Международная исследовательская организация Фаланстера», подразделение программы «Международный Фаланстер», призванное оказывать технологическую поддержку социалистическим странам по всему миру. Теперь нам предстоит решить, следует ли присоединиться к этому начинанию."
comfrance.127.a:0 "Участие звучит разумно."

comfrance.128.t:0 "Международная промышленная программа «Фаланстер»"
comfrance.128.d:0 "Для многих в Интернационале стало очевидно, что все достаточно развитые синдикалистские государства обязаны оказывать промышленную поддержку странам, которым сложнее обеспечивать себя самостоятельно. Теперь нам предстоит решить, готовы ли мы проявить солидарность с рабочими всего мира и вместе с нашими французскими братьями по оружию принять участие в масштабной программе промышленной помощи."
comfrance.128.a:0 "Звучит как отличная идея!"

comfrance.129.t:0 "Прибывает помощь «Фаланстера»"
comfrance.129.d:0 "В рамках программы «Международный Фаланстер» наши камрады в Париже и Лондоне только что доставили нам столь необходимую помощь. Промышленные станки, горное оборудование, оружие, боеприпасы и многое другое сейчас разгружается в наших портах и аэропортах, после чего отправляется по всей стране."
comfrance.129.a:0 "Превосходно!"

comfrance.130.t:0 "Якобинская реформация?"
comfrance.130.d:0 "Наконец установив контроль над Коммуной, возглавляемый якобинцами Комитет общественного спасения получил возможность начать полное преобразование государственного строя от неудачного синдикализма к славному ленинизму. Камрады-жёстколинейщики требуют полностью ликвидировать синдикалистские структуры и заменить их Французской коммунистической партией в рамках ленинского государства. Однако, несмотря на поддержку председателя Тореза, подобная инициатива наверняка жестоко расколет Францию, поэтому многие более умеренные партийные функционеры предлагают якобинцам продолжать действовать внутри существующих синдикалистских структур BGT и КОС, постепенно реформируя государство в соответствии с «истинно» марксистскими принципами. Каким бы ни был исход, он наверняка приведёт к новым расколам."
comfrance.130.a:0 "Умеренные - всего лишь социал-реакционеры! Построим новую систему!"

comfrance.131.t:0 "Реорганизация BGT и КОС"
comfrance.131.d:0 "Синдикалистские структуры послереволюционной Франции преобразуются, чтобы лучше соответствовать истинному марксизму, сформулированному Французской коммунистической партией. Всеобщая биржа труда была преобразована в Конгресс народных депутатов, а Комитет общественного спасения заменён Советом народных комиссаров."
comfrance.131.a:0 "Несомненное улучшение."

comfrance.133.t:0 "Сообщения о волнениях в армии"
comfrance.133.d:0 "Наши недавние реформы, хотя и сделали огромный шаг к постановке Франции на истинный путь социализма, вызвали недовольство многих слоёв французского общества. Теперь до Комитета общей разведки доходят сведения, что ропот недовольства появился даже внутри Гаранта национальной целостности..."
comfrance.133.a:0 "Следить особенно внимательно..."

comfrance.134.t:0 "Леон Блюм и Народный фронт"
comfrance.134.d:0 "Один из ведущих деятелей SFIO Леон Блюм вместе с уважаемым героем войны Морисом Гамеленом начали открыто призывать разрозненные политические фракции Франции объединиться против якобинского правительства, которое многие считают исказившим и предавшим Революцию. Несмотря на сопротивление многочисленных государственных механизмов якобинцев, этот Народный фронт уже провёл несколько крупных забастовок и политических митингов в больших городах.\n\nОпасаясь, что открытый вызов власти партии может перерасти в прямую борьбу за руководство Коммуной, Общая разведка рекомендует Совету народных комиссаров арестовать Блюма и других лидеров, связанных с Фронтом, прежде всего, помимо самого Блюма, всё ещё уважаемого генерала Мориса Гамелена."
comfrance.134.a:0 "Отдать их под суд!"
comfrance.134.b:0 "Ленинские ценности переживут этих предателей."

comfrance.135.t:0 "Парижский процесс"
comfrance.135.d:0 "Различные руководители Народного фронта, а также другие видные потенциальные союзники, включая Мориса Гамелена, были арестованы и преданы суду по обвинению в государственной измене. Парижский процесс должен доказать, что Блюм и его сообщники подрывали Революцию и «ослабляли оборону Франции перед германским врагом». Будучи одновременно юристом и блестящим оратором, Блюм использовал зал суда для сокрушительного обвинения якобинского режима. Гамелен же всё время хранил молчание, отказываясь признавать право суда рассматривать его дело.\n\nОднако процесс пошёл не по плану. Несмотря на грубые манипуляции разбирательством, обвиняемые в значительной мере успешно опровергли предъявленные им обвинения и получили сочувственное освещение как в неофициальной отечественной, так и в зарубежной прессе. Всё это превратилось в такой позор для нашего коммунистического режима, что часть руководства уже рассматривает возможность прекратить процесс. Другие же требуют идти до конца и казнить обвиняемых независимо от исхода, поскольку они стали слишком серьёзной угрозой, чтобы позволить им выйти на свободу."
comfrance.135.a:0 "Казнить этих предателей!"
comfrance.135.b:0 "Прекратить весь этот фарс."

comfrance.137.t:0 "Марш Гамелена на Париж"
comfrance.137.d:0 "В Общую разведку поступают сообщения, что части, верные генералу гражданской войны Морису Гамелену, подняли мятеж и объявили о поддержке Народного фронта. Гамелен идёт на Париж!"
comfrance.137.a:0 "Мы дадим отпор этим мятежникам!"
comfrance.137.b:0 "Мятежники захватывают столицу!"

comfrance.138.t:0 "Народный фронт восстанавливает порядок"
comfrance.138.d:0 "Народный фронт захватил Париж и начал чистку города от якобинцев. Коммуны по всей Франции воспользовались моментом, чтобы ликвидировать местные отделения Коммунистической партии. Гамелен и Блюм восстановили ранее упразднённые синдикалистские институты, CGT и BGT, а на чрезвычайных выборах Гамелен был избран председателем Всеобщей биржи труда, тогда как Блюм получил пост председателя Комитета общественного спасения. Теперь, когда этот широкий союз синдикалистов, социал-демократов и социалистов захватил власть, его участники надеются покончить с тоталитарным угнетением, навязанным французским гражданам якобинцами."
comfrance.138.a:0 "Это последняя борьба..."

comfrance.139.t:0 "Переворот Гамелена провалился"
comfrance.139.d:0 "Мы успешно отразили силы предателя Гамелена, который теперь повернул назад и бежит на юг, а Вооружённая рука Коммунистической революции преследует его по пятам! Однако сторонники Народного фронта на севере, несмотря на эту неудачу, всё же начали своё восстание, хотя наши верные части наверняка вскоре их разгромят."
comfrance.139.a:0 "Сокрушить их!"

comfrance.144.t:0 "Коммунальные выборы 1941 года"
comfrance.144.d:0 "Как и было предусмотрено в 1936 году, пятилетний срок полномочий нынешней Всеобщей биржи труда подходит к концу. Пришло время обсудить экономическую и внутреннюю политику, а также внешние вопросы, чтобы BGT могла избрать новых членов исполнительного Комитета общественного спасения."
comfrance.144.a:0 "За работу, камрады!"

comfrance.145.t:0 "Выборы BGT 1941 года - Положение армии"
comfrance.145.d:0 "Прошло пять лет с момента последней крупной реформы вооружённых сил Революции, и французская армия достигла новых высот. Однако различные фракции BGT по-прежнему расходятся во мнениях относительно дальнейшего развития Гаранта национальной целостности."
comfrance.145.a:0 "Синдикалисты: Модернизация и оптимизация!"
comfrance.145.b:0 "Якобинцы: Необходимо более независимое верховное командование!"
comfrance.145.c:0 "Сорельянцы: Армия должна быть полностью подчинена BGT!"
comfrance.145.e:0 "Анархисты: Либерализовать армию и поощрять добровольную службу!"

comfrance.146.t:0 "Выборы BGT 1941 года - Внутренняя безопасность"
comfrance.146.d:0 "Поскольку Франции постоянно угрожают как внешние, так и внутренние враги, вопрос внутренней безопасности стал одной из тем выборов."
comfrance.146.a:0 "Синдикалисты: Народная безопасность и так справляется!"
comfrance.146.b:0 "Якобинцы: Нам нужны военизированные жандармы для поддержания порядка!"
comfrance.146.c:0 "Сорельянцы: Тайная полиция ДОЛЖНА действовать активнее!"
comfrance.146.e:0 "Анархисты: Демократизировать Народную безопасность!"

comfrance.147.t:0 "Выборы BGT 1941 года - Внешняя безопасность"
comfrance.147.d:0 "По мере продвижения революции ведомство Общей разведки продолжало сохранять ключевое влияние в политической структуре федерации и потому стало предметом ожесточённой борьбы."
comfrance.147.a:0 "Синдикалисты: Нынешняя система нас устраивает."
comfrance.147.b:0 "Якобинцы: RG должна сосредоточиться на поддержке революционеров за рубежом!"
comfrance.147.c:0 "Сорельянцы: RG должна принять тоталистскую доктрину!"
comfrance.147.e:0 "Анархисты: BGT должна контролировать Общую разведку!"

comfrance.148.t:0 "Выборы BGT 1941 года - Экономическая политика"
comfrance.148.d:0 "Синдикалистская экономика обеспечила значительное улучшение жизни масс, однако между четырьмя основными фракциями всё ещё сохраняются разногласия относительно дальнейшего направления её развития."
comfrance.148.a:0 "Синдикалисты: Сохранить синдикалистский курс!"
comfrance.148.b:0 "Якобинцы: Необходима централизация!"
comfrance.148.c:0 "Сорельянцы: Нужно сосредоточиться на военной промышленности!"
comfrance.148.e:0 "Анархисты: Больше власти кооперативам!"

comfrance.149.t:0 "Выборы BGT 1941 года - Внешняя политика"
comfrance.149.d:0 "Одним из важнейших вопросов для следующего Комитета, без сомнения, станет реакция на радикально меняющуюся мировую обстановку. Синдикалисты выступают за дальнейшее сотрудничество внутри Интернационала, тогда как анархисты хотят начать волну освобождения, которая сметёт старый порядок повсюду, где он ещё сохраняется. И сорельянцы, и якобинцы придерживаются более воинственной позиции."
comfrance.149.a:0 "Синдикалисты: Интернационал должен гарантировать мир!"
comfrance.149.b:0 "Якобинцы: Красное знамя должно продвигаться повсюду!"
comfrance.149.c:0 "Сорельянцы: Реакционеры должны быть полностью уничтожены!"
comfrance.149.e:0 "Анархисты: Обеспечить европейский социализм!"

comfrance.150.t:0 "Выборы BGT 1941 года: Большинство синдикалистов"
comfrance.150.d:0 "По мере поступления голосов из многочисленных коммун нашей великой Федерации становится ясно, что синдикалистская фракция получила большинство во Всеобщей бирже труда.\n\nОднако сама группировка расколота между умеренными сторонниками Леона Жуо и более воинственными членами, собравшимися вокруг Бенуа Фрашона. Кто бы ни возглавил движение, Французская Коммуна наверняка окажется в надёжных руках."
comfrance.150.a:0 "Поздравляем, камрад Жуо."
comfrance.150.b:0 "Поздравляем, камрад Фрашон."

comfrance.151.t:0 "Выборы BGT 1941 года: Большинство якобинцев"
comfrance.151.d:0 "По мере поступления голосов из многочисленных коммун нашей великой Федерации становится ясно, что якобинцы получили большинство во Всеобщей бирже труда.\n\nДюкло, известный как Красный карлик, сформирует новый Комитет, а новым председателем Всеобщей биржи труда станет Марсель Кашен, многолетний главный редактор газеты «Юманите». Ожидается, что высшее военное руководство сохранит свои должности."
comfrance.151.a:0 "Поздравляем, камрад Кашен."

comfrance.152.t:0 "Выборы BGT 1941 года: Большинство сорельянцев"
comfrance.152.d:0 "По мере поступления голосов из многочисленных коммун нашей великой Федерации становится ясно, что сорельянцы получили большинство во Всеобщей бирже труда.\n\nКамрад Бюкар, наиболее выдающийся лидер ортодоксальных сорельянцев, как ожидается, сформирует новый Комитет, тогда как новым председателем Всеобщей биржи труда станет Жорж Валуа, Дедушка всех синдикалистов."
comfrance.152.a:0 "Поздравляем, камрад Валуа."

comfrance.153.t:0 "Выборы BGT 1941 года: Большинство анархистов"
comfrance.153.d:0 "По мере поступления голосов из многочисленных коммун нашей великой Федерации становится ясно, что анархистская фракция получила большинство во Всеобщей бирже труда.\n\nКамрад Герен, энергичный и популярный лидер анархистской фракции, как ожидается, сформирует новый Комитет, тогда как новым председателем Всеобщей биржи труда станет Нестор Махно, современный Домбровский."
comfrance.153.a:0 "Поздравляем, камрад Махно."

comfrance.154.t:0 "Выборы BGT 1941 года: Большинство не достигнуто"
comfrance.154.d:0 "Поскольку ни одна из фракций внутри CGT не сумела получить большинство, руководители различных группировок начали переговоры о возможности создания нескольких вариантов коалиционного правительства."
comfrance.154.a:0 "Синдикалистско-анархистский блок возвращается к власти!"
comfrance.154.b:0 "Левые синдикалисты и ортодоксальные сорельянцы создают коалицию!"
comfrance.154.c:0 "Жорж Валуа и его тоталистские сорельянцы захватывают BGT!"

comfrance.155.t:0 "Коммунальные выборы 1946 года"
comfrance.155.d:0 "Главным вопросом стала реинтеграция в Коммуну бывших социал-демократов, покинувших её пятнадцать лет назад. Синдикалисты, ныне наиболее реформистская фракция BGT, хотят продолжить процесс демократизации и проводить политику открытых дверей по отношению к социал-демократам. Анархисты, хотя и поддерживают либерализацию, выступают против такого курса, как и находящиеся в упадке сорельянцы. Якобинцы, разумеется, по-прежнему требуют реформ по большевистскому образцу."
comfrance.155.a:0 "Большинство синдикалистов - Нужно освободить место для наших друзей-социал-демократов."
comfrance.155.b:0 "Большинство сорельянцев - Разложения революционных ценностей не допустим."
comfrance.155.c:0 "Большинство анархистов - Пролетарская демократия не нуждается в социал-демократах."
comfrance.155.e:0 "Большинство якобинцев - Коммуна готова к большевизму."

comfrance.156.t:0 "Коммунальные выборы 1951 года"
comfrance.156.d:0 "Прошло тридцать лет с момента создания Французской Коммуны. Наш путь к социализму и процветанию был долгим и тяжёлым. Теперь, когда народ выбирает новое правительство, нашей главной целью становится не только дальнейшее развитие синдикализма, но и защита «прав человека и гражданина», таких как демократия и право на счастье."
comfrance.156.a:0 "Большинство синдикалистов - Демократизация Коммуны должна идти постепенно."
comfrance.156.b:0 "Большинство сорельянцев - Тотализм восторжествует."
comfrance.156.c:0 "Большинство анархистов - Нас ждёт безгосударственное общество!"
comfrance.156.e:0 "Большинство якобинцев - Мы истинные коммунары."

comfrance.157.t:0 "Нестор Махно уходит в отставку"
comfrance.157.d:0 "Одна из величайших фигур французской и европейской революционной политики Нестор Махно наконец решил уйти из общественной жизни. Руководство анархистским движением перешло к Мариусу Жакобу."
comfrance.157.a:0 "Прощай."

#comfrance.158 removed

comfrance.159.t:0 "Париж потерян!"
comfrance.159.d:0 "Париж, город света, колыбель Революции и столица Франции, захвачен врагом! Хотя оккупанты уже сталкиваются с сопротивлением гражданского населения, мы должны немедленно перейти в контрнаступление и вернуть полный контроль над городом."
comfrance.159.a:0 "Рабский люд, вставай, вставай!"

comfrance.160.t:0 "Освобождение Эльзас-Лотарингии"
comfrance.160.d:0 "Наши войска продвинулись в пределы бывшей имперской провинции Эльзас-Лотарингия и установили контроль над всем регионом. Германия не способна устоять перед нашим превосходством, и утраченные провинции вновь возвращаются Франции!"
comfrance.160.a:0 "...Сплотимся, и завтра..."

comfrance.161.t:0 "Празднование Четырнадцатого июля"
comfrance.161.d:0 "Сегодня Франция отмечает годовщину взятия Бастилии, ставшего первым актом Революции 1789 года. По всей стране пройдут грандиозные празднества: каждая деревня готовит собственные памятные мероприятия наряду с привычными народными гуляниями. Несмотря на социалистическую революцию, Четырнадцатое июля остаётся днём всеобщего торжества. Ожидаются парады армии и ополчения, исторические костюмы, выставки, речи, развлечения и уличные пиршества. В преддверии, как кажется, неизбежного конфликта этим празднованиям придаётся особое значение как средству укрепления национального единства: несмотря на все разногласия, каждый истинный француз может возвести свои революционные убеждения к падению Бастилии."
comfrance.161.a:0 "Да здравствует Коммуна!"

comfrance.163.t:0 "День труда"
comfrance.163.d:0 "В 1889 году делегаты Второго Интернационала постановили ежегодно отмечать 1 мая как день всеобщей рабочей мобилизации. По предложению отца французского марксизма Жюля Геда эта дата была выбрана в память о мучениках Хеймаркетской бойни, погибших за то, что осмелились потребовать восьмичасового рабочего дня. Год за годом массовая мобилизация в этот день приводила к новым уличным столкновениям и новым жертвам. В Международный день трудящихся, вскоре получивший в народе название Дня труда, пролетарии отказывались работать и выходили на улицы, требуя своих прав, размахивая красными знамёнами, исполняя «Интернационал» и прикалывая к одежде красный шиповник или ландыш, обёрнутый алой тканью, в память о пролитой крови. Этот памятный и протестный праздник, этот день свободы, вырванный из пасти Капитала, по праву заставлял буржуазию содрогаться.\n\nПосле Революции Первое мая было объявлено государственным праздником и быстро превратилось в день масштабных официальных торжеств и памятных мероприятий, шествий, народных гуляний и танцев. У нас это праздник Революции и освобождённых рабочих, за рубежом же он по-прежнему остаётся днём борьбы, пока однажды ветер революционной свободы не пронесётся по всем уголкам Земли. Наш народ празднует и вспоминает долгий пройденный путь: некогда Революция была лишь заветной мечтой, которую берегли в заводских цехах, а теперь она живёт и процветает, её сердце гордо бьётся во Франции, вдохновляя всех наших товарищей, которые всё ещё остаются в цепях."
comfrance.163.a:0 "Нас ждёт победа в борьбе!"

comfrance.164.t:0 "Первый Международный фестиваль искусств в Бурже"
comfrance.164.d:0 "Сегодня состоялся Первый Международный фестиваль искусств в Бурже. Проведение подобного мероприятия стало возможным лишь благодаря совместным усилиям Британии и Франции по созданию Международного авангарда. На выставке были представлены многие знаменитые полотна синдикалистского реализма, заказанные французским правительством, а также произведения британских, русских и американских художников и фреска Диего Риверы. Фестиваль продлится до конца недели и уже привлёк внимание всего мира. Пока что мы можем насладиться всеобщим вниманием."
comfrance.164.a:0 "Это лишь первый из многих, и правительство об этом позаботится!"

comfrance.165.t:0 "Франция предлагает создать Международный авангард"
comfrance.165.d:0 "Французское правительство выступило с инициативой создания Международного авангарда. Его целью станет развитие новых художественных направлений, отличающихся необычными и неортодоксальными формами представления, каких мир ещё никогда не видел.\n\nФранцузское правительство считает, что эта организация станет полезным инструментом мирного распространения синдикалистских идей. Теперь от нас ожидают присоединения."
comfrance.165.a:0 "Мы участвуем!"

comfrance.166.t:0 "Франция объявила нам войну!"
comfrance.166.d:0 "Эти ублюдки нарушили наш нейтралитет! Мы можем сражаться в одиночку или обратиться за помощью к немцам. Что нам выбрать?"
comfrance.166.a:0 "Соедините нас с Берлином!"
comfrance.166.b:0 "Будем сражаться одни!"

comfrance.167.t:0 "Франция объявила нам войну!"
comfrance.167.d:0 "Эти ублюдки нарушили наш нейтралитет! Мы можем сражаться в одиночку или обратиться за помощью к немцам. Что нам выбрать?"
comfrance.167.a:0 "Соедините нас с Берлином!"
comfrance.167.b:0 "Будем сражаться одни!"

comfrance.168.t:0 "Приглашение"
comfrance.168.d:0 "Теперь, когда так называемый «баланс» в Италии окончательно потерял всякий смысл, [From.GetNameDef] направляет официальное приглашение государству [SRI.GetNameDef] вступить в ряды Третьего Интернационала."
comfrance.168.a:0 "Наконец-то!"
comfrance.168.b:0 "Если подумать, то нет..."

comfrance.169.t:0 "[From.GetAdjective]ая просьба"
comfrance.169.d:0 "Теперь, когда так называемый «баланс» в Италии окончательно потерял всякий смысл, [From.GetNameDef] направляет официальную просьбу о вступлении в ряды Третьего Интернационала."
comfrance.169.a:0 "Наконец-то!"
comfrance.169.b:0 "Если подумать, то нет..."

##ToT France###
comfrance.902.t:0 "Революционный легион берёт армию под контроль"
comfrance.902.d:0 "Революционный легион был создан во время Французской гражданской войны как военизированная сила для защиты революционеров от реакционных толп. С тех пор Легион значительно вырос как в численности, так и во влиянии. Его опорные пункты можно встретить по всей Франции, а над хорошо вооружёнными боевиками, преданными Валуа, развевается красный орёл сорелианцев.\n\nПосле победы сорелианцев всё чаще звучали предложения объединить Легион с Французской революционной армией. Несмотря на сопротивление известных генералов, включая Мориса Гамелена, сегодня Легион официально включается в состав вооружённых сил под командованием генерала Марселя Бюкара."
comfrance.902.a:0 "Вперёд, доблестные товарищи!"

comfrance.903.t:0 "Сорелианское движение"
comfrance.903.d:0 "Сорелианское движение возникло благодаря участию и поддержке Коммунарской революции 1919 года со стороны интеллектуального кружка Cercle Proudhon, возглавляемого Эдуаром Бертом и Жоржем Валуа. Изначально состоявший из множества бывших членов Action Française, этот кружок прежде всего занимался изучением и обсуждением трудов Жоржа Эжена Сореля и Пьера-Жозефа Прудона. В результате была выработана целостная интеллектуальная идеология, отвергающая либеральный яд и предлагающая модель децентрализованного и националистического синдикалистского общества, призванного стать основой для формирования героической и воинственной личности, составляющей органический авангард нового строя и вечно преданной защите родины, товарищей-рабочих и семьи от внешних угроз вроде германской опасности и внутренних врагов вроде порочных евреев. После революции движение стало быстро расти, принимая в свои ряды некоторых «правых социалистов» и членов таких организаций, как SFIO.\n\nСо временем этот интеллектуальный кружок приобрёл значительное влияние внутри CGT. Хотя сам он не являлся профсоюзом и потому не имел собственных делегатов в Bourse Général du Travail, сорелианские идеи завоевали поддержку многих профсоюзных деятелей, заседавших в BGT, среди которых был и Марсель Бюкар. Если Валуа возглавляет организацию и считается её главным мыслителем, то Бюкар является человеком действия, благодаря которому движение обрело заметную народную поддержку. Он сформировал отряд преданных легионеров, готовых защищать Францию от любой угрозы, и хотя многим из них недостаёт идеологической утончённости Валуа и Берта, именно они составили вооружённое крыло сорелианского движения, активно присутствующее на улицах и не исключающее насилия как метода борьбы, вдохновляясь Camelots du Roi из Action Française. Благодаря растущему интеллектуальному влиянию Жоржа Валуа внутри CGT и народной энергии легионеров Бюкара становится ясно, что влияние сорелианцев нельзя недооценивать и с каждым днём оно лишь растёт."
comfrance.903.a:0 "Одобрили бы Сорель и Прудон идеологию этих сорелианцев, будь они среди нас?"

comfrance.930.t:0 "Перемены в PCF"
comfrance.930.d:0 "Только что поступили новости из штаб-квартиры Французской коммунистической партии на улице Лафайет в Париже. Морис Торез внёс вотум недоверия генеральному секретарю партии Пьеру Семару, обвинив его в бездействии и неспособности возглавлять коммунистическое дело. Пьер Семар, ставший генеральным секретарём в 1924 году, проводил курс на интеграцию PCF в коммунарскую синдикалистскую систему. Сам Семар, коммунист-профсоюзник, известный своими анархо-синдикалистскими симпатиями, при помощи группы преданных сторонников сумел превратить партию догматичных бюрократов в настоящую политическую силу Коммуны и важнейшую организацию CGT-FO, представляющую ленинское течение при сохранении уважения к коммунарской демократии.\n\nОднако годы застоя синдикалистской системы ослабили фракцию Семара и дали голос новым радикальным группам. Морис Торез, прозванный Сыном народа, быстро стал главным лицом внутренней оппозиции, призывая к возвращению к «чистому марксизму», демонтажу нынешней коррумпированной политической системы Коммуны и её замене демократическим централизмом вокруг PCF, а также к радикальному переходу к подлинно пролетарской экономике и созданию «Нового социалистического человека». Его идеи вдохновлены Марксом, Энгельсом и Лениным, но также и наследием Французской революции, включая «Заговор равных» Гракха Бабёфа. Жак Дорио, в свою очередь, создал коммунистическое и националистическое движение, быстро завоевавшее поддержку Молодых коммунистов. Он требует радикального реванша против Германии и черпает вдохновение у Луи Огюста Бланки и революционного национализма времён Революции 1789 года.\n\nНесмотря на разногласия, эти двое объединились ради вотума недоверия, который получил поддержку 60% партийных делегатов. Оказавшись в меньшинстве, Семар подал в отставку, а Торез вскоре был избран генеральным секретарём. Однако теперь, когда общий противник исчез, Торез и Дорио всё чаще вступают в открытый конфликт. Как бы то ни было, новое руководство PCF поведёт партию по пути прямой конфронтации с существующей политической системой, увлекая за собой значительную часть делегатов CGT-FO."
comfrance.930.a:0 "Коммунарская демократия должна выстоять перед натиском радикалов!"

comfrance.931.t:0 "Государственные похороны председателя Валуа"
comfrance.931.d:0 "Нация скорбит по председателю Жоржу Валуа. Несмотря на очевидную угрозу, связанную с проведением публичной похоронной церемонии, Сорелианский совет постановил, что страху нельзя уступать. Парижская полиция, резервная пехотная дивизия и бойцы Революционного легиона заполнили улицы, тогда как жители столицы стекались, чтобы отдать последнюю дань уважения. Знамёна с Красным орлом протянулись от здания к зданию, мрачные легионеры несли факелы, а город погрузился в атмосферу глубокой скорби. Тело Валуа было помещено в стеклянный гроб, окружённый огромными золотыми орлами, нависающими над ним зловещими фигурами. Председатель правил недолго, но его влияние на Коммуну останется на целую эпоху..."
comfrance.931.a:0 "Победа даже в смерти!"

comfrance.904.t:0 "Самый мрачный день"
comfrance.904.d:0 "Сегодня вся нация оплакивает трагическую гибель нашего покойного председателя. Когда председатель Валуа произносил пламенную речь перед восторженной публикой у Триумфальной арки, троим анархистам-убийцам удалось пройти охрану и затеряться в толпе. Один из них объявил Валуа предателем революции и выстрелил из пистолета в ошеломлённого председателя, тогда как двое других бросили на сцену самодельные взрывные устройства. Взрыв ранил всех троих находившихся на сцене: самого Валуа, его правую руку Жака Артюи и экономического вдохновителя, революционного синдикалиста-мистика Эдуара Берта. Всех троих немедленно доставили в ближайшую больницу, пока отважные легионеры открыли ответный огонь по террористическим отбросам. Двое нападавших были убиты, последний захвачен живым. К счастью, товарищи Артюи и Берт отделались лёгкими ранениями, однако Валуа не выжил. Несмотря на все усилия врачей, последствия взрыва и случайные пули оказались слишком тяжёлыми для стареющего лидера. Наш дорогой председатель был истинным революционером, и его идеалы не будут забыты, как не окажется напрасной и его смерть.\n\nТеперь тяжёлая задача выбора преемника ложится на Высший совет сорелианцев. Судьба Франции вновь радикально изменилась."
comfrance.904.a:0 "Пламя сорелианства не угаснет, слава председателю и в смерти!"

comfrance.907.t:0 "Генерал Бюкар перестраивает армию"
comfrance.907.d:0 "До сих пор Armée Révolutionnaire Française состояла из идеологически преданных и верных солдат, однако страдала от дезорганизации, самовольных устремлений и ленивых генералов, неспособных эффективно взаимодействовать друг с другом. Согласно официальным докладам сорелианцев, этому пришёл конец. Теперь, когда генерал Марсель Бюкар контролирует военные дела, вооружённые силы наконец получат столь необходимую им модернизацию.\n\nТолько наиболее верные генералы будут получать повышения непосредственно от председателя Валуа, разрозненные ополчения объединят в единую постоянную армию, а усиленный упор государства на промышленность позволит снабжать солдат вооружением и снаряжением высочайшего качества. Именно это пообещал Бюкар, и в ответ Валуа предоставил ему неограниченные полномочия в военной сфере. Отныне генерал подчиняется только самому председателю."
comfrance.907.a:0 "В конце концов, армия - защитница революции."

comfrance.908.t:0 "Контролируемая децентрализация"
comfrance.908.d:0 "Выборы завершены, сорелианцы получили большинство голосов, и председатель Валуа приступает к первому делу - децентрализации правительства. Слишком долго французский пролетариат сковывали бюрократические путы синдикалистов. Сорелианцы больше не намерены мириться с этим. Мы должны добиться того, чтобы распущенные автономные коммуны были преобразованы в подлинные революционные провинции, какими их видел Сорель. Марсель Бюкар от имени Валуа выступил перед BGT, заявив о полной законности этих преобразований во имя защиты Возрождения."
comfrance.908.a:0 "Сильному народу нужна решительная свобода."

comfrance.909.t:0 "Революционные легионеры громят штаб-квартиры профсоюзов"
comfrance.909.d:0 "В Коммуне Франции существует множество профсоюзов, соперничающих за влияние на политику страны. Их приверженности различаются: одни поддерживают анархистов, другие синдикалистов, а некоторые даже остаются верны якобинцам. Подобные идеологические разногласия неприемлемы и мешают подлинному единству Франции. Если мы хотим продолжить децентрализацию правительства, народ должен быть объединён вокруг наших политических убеждений. Командир Революционного легиона Марсель Бюкар организовал скоординированные рейды по важнейшим профсоюзным штаб-квартирам, в результате которых сотни лидеров были арестованы за нелояльные убеждения. В очередной раз Легион успешно защитил революцию."
comfrance.909.a:0 "Мы вернём профсоюзы в строй - переговорами или силой."

comfrance.910.t:0 "Напряжение среди сорелианцев"
comfrance.910.d:0 "После смерти Жоржа Валуа сорелианцы раскололись на несколько внутрипартийных фракций. Крупнейшей и наиболее влиятельной из них стали Революционные франсисты во главе с Марселем Бюкаром. Несмотря на существование множества меньших группировок, люди Бюкара активно стремятся изменить положение и окончательно утвердить своё господство над партией. Между всеми сторонами оказался недавно вступивший в должность председатель Сорелианского совета Жак Артюи, наладивший тесные отношения со многими фракциями в надежде сохранить хотя бы подобие стабильности."
comfrance.910.a:0 "Может ли стать ещё хуже?"

comfrance.911.t:0 "Чёрная гвардия начинает кампанию взрывов"
comfrance.911.d:0 "В ответ на сорелианскую агрессию и преследования анархистов и анархо-синдикалистов Чёрная гвардия начала кампанию взрывов. Под удар попадают предприятия, конторы и административные здания, так или иначе связанные с сорелианцами."
comfrance.911.a:0 "Неужели в этих животных не осталось ни капли цивилизованности?"

comfrance.912.t:0 "Жак Артюи призывает к единству сорелианцев"
comfrance.912.d:0 "Жак Артюи, нынешний председатель Сорелианского совета, исполняющего функции временного правительства, призвал партию к единству перед лицом внутреннего раскола. Он потребовал, чтобы малые фракции и Революционные франсисты заключили перемирие до полного подавления мятежа Чёрной гвардии. В своей последней речи перед Советом Артюи заявил, что бессмысленно бороться за господство над всей страной, если партия не способна установить порядок даже внутри собственных рядов."
comfrance.912.a:0 "Артюи прав, Франции необходимо единство."
comfrance.912.b:0 "Хватит сидеть на двух стульях, выбери сторону!"

comfrance.913.t:0 "Возвышение Чёрной гвардии"
comfrance.913.d:0 "В прямой ответ на репрессивную политику сорелианцев против политической оппозиции анархисты объединились в единое движение. Оно получило название «Чёрная гвардия» и поставило своей целью дестабилизацию Франции при помощи взрывов, убийств и вандализма. Отчасти движение вдохновляется иллегализмом, который приобрёл заметное влияние в рядах повстанцев. Гвардия недвусмысленно заявила, что не остановится ни перед чем ради уничтожения Революционного синдиката. Ходят слухи, что главным лидером Чёрной гвардии является знаменитый украинский анархист Нестор Махно, находившийся в изгнании во Франции. Услышав эти слухи, сорелианцы приказали провести обыск в доме Махно, однако во время рейда его там не оказалось, что лишь подогрело подозрения. До сих пор подпольное движение крайне трудно подавить из-за его конспиративной структуры и кажущейся случайности атак."
comfrance.913.a:0 "Мы должны положить конец этому мятежу!"

comfrance.914.t:0 "Бюкар усмиряет свою фракцию"
comfrance.914.d:0 "После напряжённых словесных столкновений между Марселем Бюкаром и представителями малых фракций, расколовших сорелианцев на несколько лагерей, наш славный защитник стабильности Жак Артюи использовал своё влияние и авторитет, чтобы снизить напряжение. На первой сорелианской конференции после убийства председателя Валуа оба лидера вышли на сцену и заявили о новой решимости сохранить единство ради предотвращения анархии. Однако даже эти хорошие новости омрачаются тем, что социалистические силы, не связанные с махновским движением, начали объединяться вокруг неосоциалиста Марселя Деа. Хуже всего то, что никто не знает, каковы его нынешние намерения."
comfrance.914.a:0 "Все силы должны быть брошены на уничтожение анархистской угрозы!"

comfrance.915.t:0 "Революционные франсисты устраивают беспорядки на улицах"
comfrance.915.d:0 "После смерти Жоржа Валуа сорелианские фракции вышли на улицы и начали драться друг с другом, несмотря на принадлежность к одной партии. Однако для любой из сторон это крайне невыгодное положение: анархисты и анархо-синдикалисты набирают силу, а оставшиеся социалисты сплачиваются вокруг неосоциалистического мыслителя Марселя Деа."
comfrance.915.a:0 "Братья убивают братьев."
comfrance.915.b:0 "Артюи подавит этот хаос!"

comfrance.916.t:0 "Чёрная гвардия пользуется хаосом"
comfrance.916.d:0 "Как и следовало ожидать, Чёрная гвардия воспользовалась продолжающейся смутой, раздирающей Францию. Её бойцы врываются на политические собрания и захватывают политиков в заложники, требуя выполнения своих условий. Сорелианцы пока не ответили на эту агрессию, поскольку погрязли во внутренней борьбе и уличных беспорядках."
comfrance.916.a:0 "Франция стоит на пороге анархии."

comfrance.917.t:0 "Боевики Чёрной гвардии казнят сорелианских политиков!"
comfrance.917.d:0 "После недели без ответа боевики Чёрной гвардии начали казнить сорелианских политиков, удерживаемых в заложниках. Командиры Чёрной гвардии вновь заявили, что не остановятся, пока их требования не будут выполнены. Они требуют заменить нынешнее руководство лидером Чёрной гвардии Нестором Махно, навсегда запретить сорелианцам занимать государственные должности и казнить Бюкара и Артюи. А пока марш на Париж продолжается."
comfrance.917.a:0 "Конец близок..."

comfrance.918.t:0 "Анархо-синдикалистские профсоюзы открыто присягают Чёрной гвардии"
comfrance.918.d:0 "Анархо-синдикалистские профсоюзы объявили о своей верности Чёрной гвардии и её лидеру Нестору Махно. Хотя сотрудничество между анархистами и анархо-синдикалистами отмечалось и прежде, теперь Чёрная гвардия фактически возглавила все анархистские фракции. Для сорелианцев это чрезвычайно опасное развитие событий: силы Гвардии уже остановились у окраин Парижа. На выполнение требований осталось 24 часа..."
comfrance.918.a:0 "Предатели!"

comfrance.919.t:0 "Чёрная гвардия захватывает Париж!"
comfrance.919.d:0 "Время сорелианцев истекло. Чёрная гвардия вошла в Париж, убивая на улицах всех, кто осмеливается сопротивляться. Штаб-квартира Сорелианской партии сейчас подвергается штурму, изнутри доносятся громкие выстрелы и крики. Нет сомнений, что этот день станет одним из самых кровавых в истории французской политики."
comfrance.919.a:0 "Да спасёт нас всех Бог."
comfrance.919.b:0 "Верные легионеры отбивают атаку!"

comfrance.920.t:0 "Приговор убийце"
comfrance.920.d:0 "После временного примирения сорелианских фракций убийце Валуа наконец вынесли приговор по итогам долгого и напряжённого следствия. Как и следовало ожидать, его приговорили к публичному повешению. Хотя Сорелианский совет счёл такой способ казни вполне уместным, никто всерьёз не ожидал, что кто-либо попытается вмешаться. И..."
comfrance.920.a:0 "...верёвка с хрустом ломает убийце шею, а его безжизненное тело оставляют на всеобщее обозрение!"
comfrance.920.b:0 "...боевики Чёрной гвардии появляются из толпы и открывают беспорядочную стрельбу, а в возникшем хаосе убийца сбегает!"

comfrance.921.t:0 "Лидеров Чёрной гвардии массово арестовывают"
comfrance.921.d:0 "После казни лидеры Чёрной гвардии начали действовать всё более отчаянно, появляясь на публике и неизбежно заканчивая либо под арестом, либо под пулями. Сегодняшний день оказался особенно успешным: большое число руководителей Чёрной гвардии было схвачено и казнено. Несомненно, этим мы обязаны как сотрудничеству сорелианских фракций, так и невероятным усилиям отважных командиров Легиона!"
comfrance.921.a:0 "Пора наказать этих безумцев."

comfrance.922.t:0 "Революционный легион подавляет анархистские беспорядки в Париже"
comfrance.922.d:0 "Сегодня, после чрезвычайно кровавого часа, Революционный легион наконец подавил анархистские беспорядки в Париже. По имеющимся данным, это восстание было попыткой переворота, организованной Нестором Махно и остатками его сторонников из Чёрной гвардии. Явно переоценив собственную поддержку, анархисты не смогли собрать ожидаемое количество людей, а благодаря работе нашей контрразведки командиры Легиона сумели организовать успешный контрудар и очистить улицы Парижа от этих отбросов. Похоже, события лишь ухудшили отношение парижан к анархистам: многие жители сами взялись за оружие и помогали задерживать подозреваемых."
comfrance.922.a:0 "Пора забить последний гвоздь в крышку гроба этого мятежа."

comfrance.923.t:0 "Боевики Чёрной гвардии бегут из Франции"
comfrance.923.d:0 "После полного провала парижских беспорядков оставшиеся боевики Чёрной гвардии покинули Францию и при помощи CNT ищут убежища в Испании. Наша разведка сообщает, что испанские анархисты тайно переправляют оружие как во Францию, так и из неё. Мы положим этому конец, увеличив число вооружённых патрулей вдоль границы."
comfrance.923.a:0 "Как крысы с тонущего корабля."

comfrance.924.t:0 "Махно найден мёртвым в убежище Чёрной гвардии"
comfrance.924.d:0 "Сегодня ровно в три часа дня бойцы Легиона обнаружили тело Нестора Махно во время операции по проникновению в заброшенное убежище Чёрной гвардии. По словам следователей, к моменту обнаружения Махно был мёртв уже некоторое время: тело полностью обескровлено и ледяное на ощупь, а единственными заметными повреждениями оказались два пулевых отверстия в затылке. Полицейские следователи исключили возможность насильственной смерти и пришли к выводу, что Махно покончил с собой."
comfrance.924.a:0 "Скатертью дорога!"

comfrance.925.t:0 "Мятеж Чёрной гвардии уничтожен!"
comfrance.925.d:0 "Мятеж уничтожен и полностью раздавлен мощью Революционной армии! Никогда анархисты не будут править Францией! Да здравствуют сорелианцы!"
comfrance.925.a:0 "Франция остаётся сильной и стабильной."

comfrance.926.t:0 "Сорелианский совет избирает нового лидера"
comfrance.926.d:0 "Теперь, когда главная угроза устранена, пришло время вернуться к прежнему курсу и завершить начатое. Единственным серьёзным претендентом остался глава фракции Революционных франсистов Марсель Бюкар, чрезвычайно популярный среди бойцов Революционного легиона. Однако во время подсчёта голосов внезапно взорвалась бомба, несомненно оставленная последними анархистами во Франции. Пока легионеры приходили в себя после взрыва и пытались найти виновника, в зал Совета ворвалась огромная толпа! Во главе её стоял не кто иной, как Марсель Деа со своими умеренными союзниками, уставшими от террора, который сорелианцы принесли Франции!"
comfrance.926.a:0 "Марсель Деа штурмует Совет и арестовывает всех!"
comfrance.926.b:0 "Марсель Бюкар, истинный образец сорелианца, остаётся во главе!"

comfrance.927.t:0 "Французский футуризм"
comfrance.927.d:0 "Футуризм как художественное и общественное движение существует с 1920-х годов, однако лишь недавно превратился в заметную силу во французском обществе. Прославляя скорость, технологии, молодость и насилие, футуристы стремятся уничтожить все пережитки прошлого, а их лидеры, в основном художники и поэты, зовут молодёжь к утопии, где человек окончательно восторжествует над природой. Всё более заметное влияние движения в политике во многом связано с благосклонным отношением к футуризму Марселя Бюкара. Революционный франсистский сорелианизм действительно имеет с ним немало общего, включая прославление насилия, мобилизацию молодёжи и отрицание буржуазного традиционализма.\n\nВ ответ футуристы, сюрреалисты и другие направления растущего авангарда оказали поддержку Бюкару. Многие известные деятели, включая Феликса Дель Марля, встретились с Вождём в Париже, чтобы обсудить, как лучше всего уничтожить реакционное искусство."
comfrance.927.a:0 "Снесём прошлое и впустим будущее!"

comfrance.928.t:0 "Сменить государственный флаг?"
comfrance.928.d:0 "Теперь, когда Революционные франсисты из сорелианского движения находятся у власти, прозвучало предложение изменить государственный флаг, чтобы он лучше соответствовал новому порядку."
comfrance.928.a:0 "Пусть Красный орёл Сореля продолжает парить высоко!"
comfrance.928.b:0 "Поднять шестерню и меч!"

comfrance.929.t:0 "Сменить государственный флаг?"
comfrance.929.d:0 "После победы неосоциалистов старые знамёна сорелианцев должны пасть, а на их месте подняться новый флаг, олицетворяющий возрождённое государство. Было предложено множество вариантов, однако партия рассматривает два основных: сохранить нынешнее временное знамя или принять изображение головы барана, популяризированное бордоскими неосоциалистами, объединив его с трёхцветным пламенем нашего более широкого движения."
comfrance.929.a:0 "Сохраним фригийский колпак!"
comfrance.929.b:0 "Зажечь пламя!"

comfrance.933.t:0 "Создание Социалистического республиканского союза"
comfrance.933.d:0 "Марсель Деа объявил о создании Union Socialiste Républicaine, партии, призванной объединить широкий политический союз, сложившийся вокруг неосоциалистического правительства. Благодаря популярности политики Деа среди избирателей многие его союзники из правого крыла SFIO, республиканские социалисты и бывшие якобинцы оказались вынуждены признать авторитет PSdF. Новая партия отныне поведёт Францию к тому будущему, которое неосоциализм предложил массам, и одновременно обеспечит, чтобы республиканская власть никогда больше не ослабла настолько, чтобы такие безумцы, как Бюкар, вновь приблизились к вершинам государства."
comfrance.933.a:0 "Настоящий Левый картель!"

comfrance.934.t:0 "X-Crise и синархисты"
comfrance.934.d:0 "Groupe X-Crise представляет собой технократическое движение, сформированное группой экономических теоретиков, вышедших из École Polytechnique. Они выступают за экономическое планирование и развитие технологий ради повышения эффективности государства, что делает их естественными союзниками неосоциалистических министерств Деа. Хотя CGT прежде отвергала подобные движения за якобы «антисиндикалистский уклон», внедрение планизма вывело из тени множество талантливых умов, готовых служить нашей Франции. Это также привело к тому, что многие участники синархистского движения, долго считавшегося лишь теорией заговора особенно параноидальных коммунаров, обратились к Марселю Деа и предложили помощь и знания в обмен на официальное место в правительстве. Так появилась новая фракция во главе с Франсуа Леиде."
comfrance.934.a:0 "Новый план для новой Франции."

comfrance.935.t:0 "Нация вновь полна сил!"
comfrance.935.d:0 "Французское общество всегда страдало от слабых, хилых и обделённых телом и разумом. На протяжении веков им правили слабые и немощные, навязывая тиранию бессилия и отсутствия жизненной энергии. Поэтому революционное сорелианское государство должно любой ценой создать французское общество, не похожее ни на одно из существовавших за последнюю тысячу лет: общество силы, жизненности и человеческого совершенства. Француз обязан соперничать с германским человекообразным и превзойти его, ибо тот столь груб, что лишён даже самого элементарного понимания мира, которым обладаем мы. Француз, в отличие от германца, всегда обладал скрытым чувством жизненности и силы, превосходя всех соседей, которые либо засыпали во время своих сиест, либо были столь глупы, что не могли даже заменить масло в лампе. Следовательно, необходимо провести огромную и насильственную чистку слабых, веками разлагавших французское общество, подобно классовой войне, только теперь не между угнетёнными и угнетателями, а между слабыми и сильными. Революционный легион уже развернул масштабные усилия по очищению наших земель от тех, кого сочли женоподобными, слабыми и хилыми, и возвышению тех, кто силён, жизнеспособен и пребывает в непрерывной борьбе против германской обезьяны и прочих реакционеров."
comfrance.935.a:0 "Выживает сильнейший..."

comfrance.936.t:0 "Героические времена"
comfrance.936.d:0 "Молодёжь Франции - наше несомненное будущее, и необходимо сделать так, чтобы её идеалы были неразрывно связаны с неосоциализмом и Деа. Молодым французам следует предоставить возможность заслужить своё место в возрождённой системе трудом на благо созидательной революции. Пусть вступают в недавно национализированные ополчения, пусть помогают французским крестьянам в работе. Благодаря более целенаправленному образованию будущие поколения обеспечат, чтобы наша родина никогда больше не пала в руки радикальных безумцев вроде Легиона Бюкара."
comfrance.936.a:0 "Героическая молодёжь."

comfrance.937.t:0 "Коммунистический союз?"
comfrance.937.d:0 "По мере полного воплощения нашей программы часть старой элиты недавно «упразднённой» Федерации коммун Франции всё чаще обрушивается на правительство с резкой критикой. На этот раз спор касается именно её ликвидации, а именно замены федеративной структуры высокоцентрализованным и организованным государством, соответствующим потребностям пролетарских масс. Некоторые члены CGT дошли до того, что обратились к своему союзнику среди наших ортодоксов Марселю Кашену с предложением возродить идею коммунистическо-юнионистской коалиции и представить её в качестве альтернативы. Если прислушаться к их просьбам, Франция превратится в своего рода «смешанную» систему и примет флаг PCF вместо смелого знамени председателя. Как нам поступить?"
comfrance.937.a:0 "Возможно, они правы."
comfrance.937.b:0 "Нет необходимости, наш путь ясен."

comfrance.938.t:0 "Воспоминания о прошлых революциях"
comfrance.938.d:0 "Неутомимый Дорио вновь прибыл на площадь Революции в Париже и выступил с очередным заявлением, как делал уже много раз. Здесь, на грандиозной площади, прежде известной как площадь Согласия, но возвращённой к названию эпохи Робеспьера в честь славной Революции, сметшей прежний порядок, и ставшей местом казни Людовика XVI, снова решается будущее Франции. Председатель Дорио провозгласил, что победа Рабочей силы доказывает: подлинная Революция так и не была завершена, и ради спасения социализма он должен вновь стать французским.\n\nПо словам Дорио, новая Коммуна обязана покончить с идеями Фора, Сореля и прочих представителей пятой колонны и вновь обратиться к невероятно богатому наследию революций и восстаний. Франция несомненно является Нацией, рождённой Революцией, государством, которое процветало благодаря ей. Следуя примеру великих героев французского левого движения, таких как Робеспьер, Сен-Жюст, Бланки и многие другие, наша нация завершит путь, начатый ещё в 1789 году."
comfrance.938.a:0 "Да здравствует Франция! Да здравствует Революция!"

comfrance.939.t:0 "Наследие героя"
comfrance.939.d:0 "В ходе своего великого крестового похода за идеалы марксизма и верную линию рабочей партии во всём мире и особенно во Франции Торез объявил, что разорванная связь между наследием Маркса и Ленина восстановлена. Отныне Франция станет образцом Коммунистической революции независимо от того, признают это или нет жалкие остатки большевиков, слишком трусливых, чтобы сражаться за новую Коммуну. Она понесёт Революцию по всему миру в соответствии с идеалами Маркса, очищенными от гнили, проникшей в них благодаря деятельности различных ревизионистов. Франция откажется от глупого утопизма синдикалистов и последует научной и творческой линии коммунизма, который спасёт мир от реакционного капитализма."
comfrance.939.a:0 "Призрак коммунизма возвращается!"

comfrance.940.t:0 "Торез формулирует совершенную стадию коммунизма!"
comfrance.940.d:0 "Морис Торез, человек, лишь начинающий свой великий путь на страницы социалистической теории в ряды мыслителей коммунизма, уже успел совершить невероятно многое. Вновь выступив с официальным заявлением на митинге на площади Революции, председатель Торез объявил, что дело, начатое Марксом и Энгельсом и продолженное трагическим героем Владимиром Ильичом Ульяновым, наконец завершено. Коммунистическая революция и её проект были воплощены в Пролетарской коммуне Франции. Теперь нация и народ могут в полной мере пользоваться совершенной формой марксизма, очищенной от скверны ревизионизма. Вооружённый идеями демократического централизма, общественной собственности на средства производства и наследием большевистских борцов, французский пролетариат вступит в новый мир, готовый противостоять реакционным социал-капиталистическим ревизионистским силам так же, как Ленин противостоял врагам во время Гражданской войны в России."
comfrance.940.a:0 "Это последняя борьба!"

comfrance.941.t:0 "Дорио объявляет Великую революцию завершённой!"
comfrance.941.d:0 "Жак Дорио, человек, лишь начинающий свой великий путь на страницы истории в ряды героев французского революционаризма, уже успел совершить невероятно многое. Вновь выступив с официальным заявлением на митинге на площади Революции, председатель Дорио объявил, что дело, начатое Робеспьером и Якобинским клубом, а затем продолженное парижскими коммунарами, наконец завершено. Великая революция и её проект воплощены во Французской революционной республике. Теперь нация и народ могут в полной мере пользоваться очищенной формой социализма, свободной от скверны анти-Франции. Вооружённые идеями свободы, добродетели, разума и бессмертными деяниями революционных предков, французские рабочие войдут в новый мир, готовые противостоять Новой коалиции так же, как Первой республике приходилось бороться с её предшественницами."
comfrance.941.a:0 "Свобода, Равенство, Братство!"

comfrance.942.t:0 "Чилийские товарищи"
comfrance.942.d:0 "Торез приказал армии подготовить крупные партии вооружений для отправки нашим чилийским товарищам. Он надеется, что эти «подарки» убедят их поддержать ленинскую борьбу."
comfrance.942.a:0 "За международную революцию!"

comfrance.943.t:0 "Патагонские товарищи"
comfrance.943.d:0 "Торез приказал армии подготовить крупные партии вооружений для отправки нашим патагонским товарищам. Он надеется, что эти «подарки» убедят их поддержать ленинскую борьбу."
comfrance.943.a:0 "За международную революцию!"

comfrance.944.t:0 "Мексиканские товарищи"
comfrance.944.d:0 "Торез приказал армии подготовить крупные партии вооружений для отправки нашим мексиканским товарищам. Он надеется, что эти «подарки» убедят их поддержать ленинскую борьбу."
comfrance.944.a:0 "За международную революцию!"

comfrance.945.t:0 "Никарагуанские товарищи"
comfrance.945.d:0 "Торез приказал армии подготовить крупные партии вооружений для отправки нашим никарагуанским товарищам. Он надеется, что эти «подарки» убедят их поддержать ленинскую борьбу."
comfrance.945.a:0 "За международную революцию!"

comfrance.946.t:0 "Грузинские товарищи"
comfrance.946.d:0 "Торез приказал армии подготовить крупные партии вооружений для доставки нашим грузинским товарищам. Он надеется, что эти «подарки» убедят их поддержать ленинскую борьбу."
comfrance.946.a:0 "За международную революцию!"

comfrance.947.t:0 "Бхаратские товарищи"
comfrance.947.d:0 "Торез приказал армии подготовить крупные партии вооружений для доставки нашим бхаратским товарищам. Он надеется, что эти «подарки» убедят их поддержать ленинскую борьбу."
comfrance.947.a:0 "За международную революцию!"

comfrance.949.t:0 "Слава Вождю!"
comfrance.949.d:0 "Франция теперь представляет собой глубоко милитаризированное государство, населённое агрессивно националистическим народом, жаждущим войны. Народом, считающим силу важнейшим качеством человека. Народом, убеждённым в собственном превосходстве благодаря французской крови. Нацией, присягнувшей на вечную верность своему Вождю. Когда-то всё это было лишь видением Марселя Бюкара о будущем, теперь же стало реальностью. Сорелианцы крепко держат в руках все стороны жизни, а страна превратилась в отлаженную машину под управлением всесильного директора. И эта машина жаждет войны и завоеваний..."
comfrance.949.a:0 "Настал день славы!"

comfrance.950.t:0 "Раскол во Французской коммунистической партии"
comfrance.950.d:0 "Несмотря на то, что наша организация основана на принципах демократического централизма, сформулированных Лениным, после недавней победы CGT-FO на выборах в BGT внутренние противоречия внутри PCF, похоже, достигли предела. Жак Дорио и его так называемая фракция «Национальных якобинцев» открыто бросили вызов генеральному секретарю Морису Торезу и его линии «Красного якобинизма», которую Дорио назвал «неспособной отвечать на вопросы и решать проблемы, стоящие перед современной Францией». Дорио потребовал смещения генерального секретаря и проведения новых внутрипартийных выборов. Если Торез уйдёт, почти наверняка победит именно Дорио, а фракция нынешнего руководителя окажется дезорганизована и дискредитирована. Большинство кадров PCF по-прежнему поддерживает Мориса Тореза, однако заметная часть энергичных Молодых коммунистов разделяет видение Дорио. Если мы намерены управлять Францией эффективно, этот кризис необходимо разрешить как можно скорее, так или иначе..."
comfrance.950.a:0 "Сын народа не склонится перед столь нелепым давлением!"
comfrance.950.b:0 "Заговор Жака Дорио удаётся, и Национальные якобинцы берут PCF под контроль."

comfrance.951.t:0 "Держи друзей близко, а врагов ещё ближе..."
comfrance.951.d:0 "Теперь, когда Confédération Générale du Travail полностью находится под контролем сорелианцев, перед нами встаёт проблема других политических фракций, оставшихся без руководства и фактически утративших значение. Якобинцы и анархисты уже объявлены врагами государства из-за своих разрушительных убеждений. Однако среди синдикалистов есть те, кого можно склонить на нашу сторону. Товарищ Жак Артюи предложил обратиться к некоторым влиятельным профсоюзным синдикалистам и предоставить им ограниченные полномочия, чтобы укрепить наш образ законного представителя рабочих. Однако товарищ Марсель Бюкар отверг этот план и потребовал устранить всех политических соперников от власти, напомнив об их прежней враждебности к сорелианцам.\n\nК какому товарищу нам следует прислушаться?"
comfrance.951.a:0 "Товарищ Бюкар прав! Эти люди - наши враги."
comfrance.951.b:0 "Возможно, Артюи прав, мы ещё можем обратить их на нашу сторону."

comfrance.952.t:0 "Разум восстановлен"
comfrance.952.d:0 "Неделя в Вандее выдалась тихой, как и почти все предыдущие годы в этом довольно незначительном регионе. Несмотря на, а возможно и благодаря, знаменитой истории католического сопротивления революционным армиям во времена Великой французской революции, деревни и небольшие города Вандеи почти не затронули силы, свергнувшие побеждённую Республику после Вельткрига. Людям пришлось принять реальность жизни в новой Коммуне и вернуться к повседневности, сохраняя религиозные убеждения, как и во многих других сельских регионах Франции. По крайней мере, по их мнению, CGT была не настолько глупа, чтобы попытаться вырвать с корнем веру, господствующую в так называемой «Старшей дочери Церкви». К несчастью для них, недавно руководство Коммуны сменилось.\n\nНа рассвете якобинские боевики окружили весь регион Вандеи, демонстрируя вновь обретённую силу. Среди отрядов распространили тщательно проверенные списки священников, составленные в зависимости от уровня их образования, с приказом захватывать тех служителей Церкви, кто мог оказаться полезен для научной работы. Всех остальных, а также отсталых крестьян, осмелившихся их защищать, надлежало ликвидировать. Эта новая «Вандейская война» завершилась за считанные часы, а число погибших даже близко не приблизилось к масштабам времён Великой революции, поскольку якобинцы стремились создать символ, а не устроить бойню. В новой Революционной республике все устаревшие божества должны быть отброшены, враги председателя сломлены, а полезные люди направлены на великое исследовательское дело, служащее самой Франции, а не какой-то вымышленной сущности. Так начинается новая Эпоха Просвещения, и души французов обретут бессмертие благодаря силе их собственного разума."
comfrance.952.a:0 "Только через Разум мы достигнем победы."

comfrance.956.t:0 "Заговор сорван..."
comfrance.956.d:0 "Пока мы всё ещё оправляемся от последствий мятежа Чёрной гвардии, необходимо решить и проблему неосоциалистов. После провалившегося переворота Марсель Деа вместе со своей трусливой шайкой приспешников уполз зализывать раны, однако нельзя недооценивать их подлость. К счастью, недавние донесения предоставили нам превосходный повод избавиться от них...\n\nВерный товарищ Клод Плансон передал Бюкару подробный доклад об убежище, где эти крысы, возможно, собираются прямо сейчас. Хотя у нас нет неопровержимых доказательств, этого доклада более чем достаточно, чтобы оправдать полное устранение неосоциалистов и гарантировать, что нашей власти больше никогда ничего не будет угрожать!"
comfrance.956.a:0 "Предатели революции! Разберитесь с ними немедленно!"

comfrance.958.t:0 "Факел Ленина освещает экономику"
comfrance.958.d:0 "После прихода к власти якобинцев начался переход от экономики, основанной на мелкобуржуазных представлениях вроде управленческой и зарплатной дифференциации, к системе, полностью ориентированной на коммунистическое будущее и подготовку французского общества к нему. Однако, как и во всём остальном, переход необходимо проводить постепенно, чтобы не подвергать нежный пролетариат чрезмерным потрясениям. Поэтому новая политика предусматривает постепенное сокращение мелкобуржуазного синдикализма через роспуск всех опасных и чрезмерно могущественных профсоюзов, насчитывающих более миллиона членов, при сохранении тех организаций, которые действительно служат Рабочему."
comfrance.958.a:0 "Чтобы разорвать цепи, иногда нужен переходный период..."

comfrance.959.t:0 "Битва за Марсель"
comfrance.959.d:0 "Анархистские ополчения и остатки сорелианцев уже много недель сражаются за контроль над Францией, и, похоже, нам наконец удалось сокрушить этих печально известных реакционеров. Однако они оказались не единственными, кто создаёт проблемы. После краха муниципального правительства Марселя местные анархисты начали создавать свободную коммуну, когда внезапно мафиози под предводительством Поля Карбона, «Императора Марселя», и братьев Герини, обычно враждовавших между собой, но на этот раз объединившихся против нас, открыли жестокую стрельбу по революционным лидерам на Старом порту, а затем объявили город своей собственностью.\n\nПохоже, близкий к Milieu мэр от SFIO Гастон Деффер передал им оружие и секретные планы города в обмен на безопасный проезд на Корсику, что позволило Мафии без особого труда захватить Марсель. Выжившие после резни анархисты отправились в Экс-ан-Прованс к Чёрной гвардии во главе с самим Махно и попросили помощи. Пока мафиозное «правительство» стремительно разваливалось, а Герини и Карбон начали открытую войну друг с другом, Гвардия и марсельские ополчения воспользовались ситуацией и быстро вернули город под контроль. Была провозглашена Свободная коммуна Марселя, а лидеров мафии отдали под суд. Однако, несмотря на все усилия, ни братьев Герини, ни Карбона обнаружить не удалось. Нет сомнений, что Мафия не собирается прекращать свою деятельность..."
comfrance.959.a:0 "Да здравствует Свободный Марсель!"

comfrance.960.t:0 "По-настоящему справедливая экономическая система"
comfrance.960.d:0 "Долгое время деньги являлись символом угнетения капиталом, и не без оснований: их контролировали жирные капиталисты, централистские банки и жадная до прибыли буржуазия. Махно и многие другие анархисты мечтают об обществе без денег, где товары и услуги будут обмениваться напрямую между людьми. Однако приходится признать, что пока полностью отказаться от валюты невозможно, и на нашей Свободной территории уже сложилась система местных денежных единиц, зависящих от коммун и региональных конгрессов. По всей Франции проводятся кампании по перераспределению ранее монополизированных товаров, и, похоже, они уже приносят результаты. Некоторые члены Чёрной гвардии предложили создать единую валюту для всей территории под названием «Махновский франк», однако большинство нашей организации и населения Свободной территории пока считает, что система местного и стихийного обмена является наилучшим путём."
comfrance.960.a:0 "Свободная система для свободного народа."

comfrance.957.t:0 "Самое свободное общество Европы"
comfrance.957.d:0 "Синдикалистские революции, основанные на всеобщей забастовке и стихийном массовом движении, несомненно стали важнейшим шагом на пути к неизбежной мировой революции и освобождению пролетариата в целом. Однако идеал Анархии в таких системах, к сожалению, так и не был достигнут: над ними продолжала нависать тень адской бюрократии и угнетение разрушительного централизованного государства. Когда-то мы верили, что этот строй можно улучшить и направить к лучшему, однако теперь увидели его трагический итог: репрессивную и реакционную диктатуру Жоржа Валуа и его верных головорезов. Теперь пришло время показать новый пример. Здесь, во Франции, на родине Пьера-Жозефа Прудона и Луизы Мишель, будет создано первое в мире по-настоящему либертарное общество. Мы станем примером как для народов, угнетаемых империализмом и капитализмом по всему миру, так и для наших синдикалистских братьев. Интернационал станет родом человеческим!"
comfrance.957.a:0 "Свобода или смерть!"

comfrance.961.t:0 "Последние сорелианцы"
comfrance.961.d:0 "После краха руководства оставшиеся сторонники сорелианцев уже не имели никаких шансов организовать успешную контратаку. Убийство Валуа стало смертельным ударом по самому сердцу сорелианской машины, а последующая операция и точечные ликвидации окончательно решили их судьбу. Пламенные речи Махно вдохновили рабочий класс восстать против своих хозяев, и теперь лишь немногие сорелианские лидеры остаются на свободе. Последних из них захватили и поместили в камеры, где сорелианский режим прежде держал наших братьев-анархистов. Теперь они ожидают народного и демократического суда со стороны ополчений, которые их пленили.\n\nПодавляющее большинство наших братьев уже вынесло один и тот же приговор: смерть. Но теперь товарищам предстоит решить, какую именно участь мы уготовим этим реакционерам..."
comfrance.961.a:0 "...гильотина, которой казнили тиранов ещё с 1789 года."
comfrance.961.b:0 "...публичное повешение, самый традиционный способ."
comfrance.961.c:0 "...расстрельная команда, покончим с этим быстро."

comfrance.962.t:0 "Новое свободное общество"
comfrance.962.d:0 "Уникальное создание, Свободная территория Франции, которую за границей иногда называют «Махновией», вопреки всем ожиданиям продолжает существовать. Она функционирует не как государство, а как совокупность полностью автономных коммун и советов, объединённых сотрудничеством и находящихся под защитой собственных добровольческих ополчений. Единой общенациональной армии больше не существует, однако Чёрная гвардия, сама основанная на принципах партисипативной анархистской демократии, достаточно сильна, чтобы действовать во всех уголках Свободной территории и обеспечивать целостность и безопасность каждого её жителя. Хотя насилие, грабежи и мародёрство со стороны реакционных повстанцев или оставшихся сорелианцев всё ещё временами беспокоят нашу землю, новое общество уже успешно развивается. Различные коммуны сумели самоорганизоваться и наладить сотрудничество, а на месте прежнего ада государственного угнетения - сорелианского режима - расцветает новое анархистское общество. Благодаря Махно и Чёрной гвардии народ получил средства для самостоятельного управления на основе консенсуса и прямой демократии. Похоже, власть больше не принадлежит бездарным королям и продажным бюрократам, а находится в руках самого народа."
comfrance.962.a:0 "Ни Бога, ни господина!"

comfrance.963.t:0 "Чёрная гвардия распускает армию Французского возрождённого революционного синдиката"
comfrance.963.d:0 "После уничтожения сорелианской государственной структуры Чёрная гвардия обратила внимание на вооружённые силы. Французская революционная армия была официально распущена и заменена Чёрной гвардией, а всех фельдмаршалов и генералов либо насильно отстранили от должностей, либо расстреляли. В ответ некоторые верные старому порядку военные попытались закрепиться в укреплённых пунктах и оказать сопротивление, однако это оказалось бессмысленно, когда их собственные солдаты обратили винтовки друг против друга. Всепоглощающий хаос, похоже, охватил даже самых верных бойцов: когда с человека снимают ответственность за поступки, он быстро утрачивает чувство долга и выпускает наружу свою подлинную природу.\n\nТеперь вооружённые силы Франции состоят из бойцов Чёрной гвардии под руководством известных анархистских деятелей, и среди офицеров нет ни одного неизбранного командира. Офицеров выбирают демократически и предоставляют им свободу действовать по своему усмотрению ради блага Анархии. Когда настанет время и Махно призовёт товарищей защитить рабочих Франции, эти воины сплотятся под чёрным знаменем!"
comfrance.963.a:0 "Сапог генерала отсечён."

comfrance.964.t:0 "Идеологический курс Гвардии"
comfrance.964.d:0 "В соответствии с нашими анархистскими принципами мы позволяем коммунам и различным местным организациям самостоятельно управлять собой по собственной воле, основываясь на ценностях партисипативной и народной демократии. Наша организация, Чёрная гвардия, также обладает собственной демократией: как военной, где офицеры избираются и смещаются своими солдатами, так и политической, чтобы анархистская идеология могла приспосабливаться к меняющимся временам и не впадала в догматизм. До сих пор Махно и другие товарищи были полностью сосредоточены на уничтожении сорелианского режима любыми необходимыми средствами, однако теперь, когда главная задача выполнена, пришло время определить основную форму анархизма, которой будет придерживаться Гвардия. В отличие от ленинистов, подлинная свобода всегда останется внутри нашей организации.\n\nМахно и Аршинов считают, что анархо-коммунизм, или либертарный коммунизм, лучше всего подходит Франции, и большинство наших членов разделяет это мнение. При этом они также явно тяготеют к платформизму, которого придерживались анархисты Махновщины. Однако иллегалисты во главе с Дювалем, Жакобом и особенно Бандой Бонно значительно усилились во время революции против сорелианцев и приобрели множество сторонников. В то же время некоторые, включая товарища Волина, предпочли бы вовсе не вводить официальную линию, чтобы укрепить единство организации и сохранить живыми демократический процесс и внутренние дискуссии."
comfrance.964.a:0 "Чистый анархизм, основанный на компромиссе, - вот что нам нужно!"
comfrance.964.b:0 "Видение анархо-коммунизма Махно - наш путь вперёд!"
comfrance.964.c:0 "Нас поведут идеалы иллегализма!"
comfrance.964.e:0 "Украинский опыт платформизма - истинный ответ!"

comfrance.965.t:0 "Возвращение иллегалистов..."
comfrance.965.d:0 "Иллегалисты представляли собой течение анархистов, заметное во Франции и Италии в начале XX века и безусловно преданное полному индивидуализму. Их вдохновляли как идеи Макса Штирнера, так и воинственность таких анархистов, как Альбер Либертад и Равашоль. Движение занималось преступной деятельностью, оправдывая её индивидуальным восстанием против государства. Отвергая мораль и законность, иллегалисты рассматривали преступление как способ следовать собственным желаниям и утверждать индивидуальность.\n\nС установлением тоталитарного сорелианского режима это течение анархизма, которое даже анархо-синдикалисты считают радикальным, вновь распространилось среди рабочих, стремящихся восстать против Революционного синдиката. Сам знаменитый анархист Нестор Махно начал постепенно склоняться к некоторым идеям иллегализма. Наблюдая крах своих анархо-коммунистических товарищей на Украине и неспособность анархо-синдикалистов как среди синдикалистов, так и среди анархистов предотвратить возвышение сорелианцев, Махно стал считать полное уничтожение иерархии и использование преступления необходимыми средствами освобождения Франции. Ходят даже слухи, что некоторые члены печально известной Банды Бонно не только пережили знаменитую перестрелку, но теперь советуют Махно, занимая видные посты среди командиров Чёрной гвардии..."
comfrance.965.a:0 "Стой, преступный отброс!"

comfrance.966.t:0 "Возрождённый революционный синдикат!"
comfrance.966.d:0 "Коммуна Франции сумела свергнуть разлагающуюся Третью французскую республику, и за это мы признаём заслуги синдикалистского режима. Однако в последние годы статус-кво синдикализма привёл страну к слабости. Теперь, когда Валуа у власти, революция может продолжиться! Коммуна возродится как Французский возрождённый революционный синдикат - государство, ценящее силу и труд, государство, способное вернуть величие, утраченное после Вельткрига.\n\nОдной из первых перемен должен стать новый флаг. Поднимем ли мы коммунарское знамя, вдохновлённое Сорелем, или же флаг Революционного легиона..."
comfrance.966.a:0 "...поднять сорелианский флаг Коммуны!"
comfrance.966.b:0 "...поднять знамя Революционного легиона!"

comfrance.1000.t:0 "Вертикальное развитие"
comfrance.1000.d:0 "Используя экономические связи с отечественными компаниями и военными подрядчиками, мы сумели разработать экспериментальные прототипы «вертолётов» для армий Интернационала. Основанные на оригинальном Breguet-Dorand Gyroplane Laboratoire, эти необычные летательные аппараты были созданы при сотрудничестве с нашими давними американскими партнёрами и способны на вертикальные взлёт и посадку, что делает их превосходными для действий на пересечённой местности. Хотя они дороги и хрупки, нам удалось отправить несколько образцов важнейшим союзникам, чтобы наши армии и войска друзей могли использовать эту уникальную технологию во благо Революции. По мере того как растущий воздушный флот начинает применять автожиры, ротабагги и другие необычные транспортные средства, созданные выдающимися учёными и нашими союзными помощниками, мы сможем без проблем и задержек перевозить людей, грузы и войска по всему миру, а при необходимости мгновенно обрушивать на противника сокрушительную боевую нагрузку. Главное - не разбить их, ведь образцов пока крайне мало, они весьма капризны и заменить их чрезвычайно трудно."
comfrance.1000.a:0 "Вперёд и вверх!"

comfrance.1001.t:0 "Экспериментальные технологии Третьего Интернационала"
comfrance.1001.d:0 "Стремясь испытать свои последние технологические достижения, немногочисленные американцы, дружественные нашему делу, трудились не покладая рук вместе с авиационными инженерами Интернационала, создавая новую военную технику для проверки непосредственно на фронтах на окраинах революционной сферы. Главными среди новых поставок стали конструкции на основе Breguet-Dorand Gyroplane Laboratoire. Эти «парящие мухи» представляют собой уникальные летательные аппараты, способные вертикально взлетать и садиться, и первые конструкторы называют их вертолётами или усовершенствованными автожирами. Изначально предназначенные для быстрой перевозки припасов и ценных грузов в труднодоступные районы и обратно, некоторые вертолёты также получили вооружение и могут выполнять роль простейших лёгких воздушных канонерок и бомбардировщиков, одновременно оставаясь пригодными для разведки и снабжения. Они больше похожи на нечто из альбомов Леонардо да Винчи, чем на настоящую боевую машину, однако мы тщательно испытаем эти вертолёты и прочую технику, присланную англосаксами, в боях против самых разных врагов нашего союза."
comfrance.1001.a:0 "Мы найдём им достойное применение."

comfrance.1002.t:0 "Народный шрифт"
comfrance.1002.d:0 "Когда всепоглощающее пламя Четвёртой французской революции охватило Францию в последние часы унизительной катастрофы Великой войны, подлинный французский пролетариат вновь обратился к революционному прошлому своей нации. Мы вспоминали Первую и Вторую Парижские коммуны, три «истинные» Французские революции, предшествовавшие нашей праведной борьбе, и многовековую историю восстаний против тирании, которая всегда поддерживала великий французский народ. Из всего этого родилась новая идентичность, полностью оторванная от порочного и провалившегося прошлого, окончательно умершего во время Вельткрига. Тогда же народ и правительство начали возвращать различные образы и элементы прежних эпох, чтобы укрепить решимость и защитить себя от грядущих ужасов. Одним из таких элементов стал Didot. Названный в честь знаменитой семьи печатников, словолитчиков и издателей, шрифт Didot использовался первыми революционными правительствами на протяжении многих десятилетий и даже применялся для печати таких шедевров Вольтера, как «Генриада» в 1818 году. Теперь он вновь, пусть пока и неофициально, используется большинством учреждений и типографий нашей новой Коммуны, хотя упоминания о его применении прежними французскими режимами вроде Директории или Наполеона уже начинают незаметно исчезать из исторических записей. Стремясь сделать этот выбор официальным и распространить подлинный Народный шрифт по всей Франции и всему Интернационалу, наша администрация решила закрепить Didot в качестве официальной государственной гарнитуры и предпочтительного шрифта для всей нации и окружающих профсоюзов, чтобы создать более единообразную революционную культуру, сохраняющую связь с французскими корнями и ещё крепче объединяющую нас.\n\nПлан сделать Didot официальным шрифтом нации встретил широкий восторг. Даже великий Кассандр, также известный как Адольф Жан-Мари Мурон, отец французского графического дизайна, выдающийся художник, плакатист и шрифтовик, публично поддержал инициативу вместе с целой плеядой французских художников. Среди них представители ориентированной на кубизм и орфизм Section d’Or, модернисты вроде Анри Матисса, хотя многие поклонники Просвещения находят больше возможностей при алжирском правительстве, а также ведущие французские сюрреалисты Андре Робер Бретон, Луи Арагон и Филипп Супо с их друзьями-дадаистами, не говоря уже о множестве менее известных голосов вроде молодого выскочки и протеже Кассандра Пьера Фошё. С возвращением истинного шрифта первоначальной Парижской коммуны и широкой Французской революции в центр нашей культуры и художественного самосознания мы гарантируем, что Революция никогда не выйдет из моды."
comfrance.1002.a:0 "По самому своему облику Didot революционен, словно гильотина!"

comfrance.1003.t:0 "Алжирский вопрос"
comfrance.1003.d:0 "Мы наконец покончили с реакционным правительством в Алжире и утвердились как единственное подлинное правительство новой Франции, отвергающей реакцию и с распростёртыми объятиями принимающей будущее. Мы уже помогаем социалистам африканских народов, угнетавшихся правительством бывшей Третьей республики, создавать собственные государства, свободные от колониализма и капитализма. Однако судьба алжирских территорий остаётся предметом ожесточённых споров внутри BGT. На протяжении долгого времени Алжир считался французским департаментом, подобно Провансу или Бретани, а не классической колонией вроде владений к югу от Сахары.\n\nПоэтому часть социалистов, включая умеренные SFIO и PRS, а также более националистические силы вроде сорелианцев и Национальных якобинцев, выступают за скорейшую реинтеграцию Алжира в нашу Революционную Францию. Анархисты и ортодоксальные коммунисты, напротив, решительно отвергают подобные предложения, называя их «реакционными» и «неоколониальными». Споры уже охватили BGT, поэтому решение необходимо принять как можно скорее."
comfrance.1003.a:0 "Мы освобождаем народы и отвергаем французский шовинизм!"
comfrance.1003.b:0 "Отправить товарища Негелена, чтобы он обеспечил порядок и стабильность."
comfrance.1003.c:0 "У товарища Камю там множество связей, отправить его."
comfrance.1003.e:0 "Алжир - естественная часть французской нации."

comfrance.1004.t:0 "Выборы [GetYear] года в нашей Коммуне"
comfrance.1004.d:0 "Завершив свой пятилетний срок, депутаты Bourse Générale du Travail вновь должны отдать свои места на суд избирателей. По всей Коммуне коммунары будут голосовать за местных представителей многочисленных профсоюзов, которые затем назначат мужчин и женщин, заседавших в BGT, и определят, кто станет председателем. Прямо сейчас идёт подсчёт голосов, и напряжение достигает предела, пока мы ждём, кто получит новое большинство и поведёт нашу демократическую и социальную федерацию к лучшему будущему."
comfrance.1004.a:0 "Нынешняя администрация удерживает власть!"
comfrance.1004.b:0 "Большинство милитантов!"
comfrance.1004.c:0 "Синдикалистское большинство!"
comfrance.1004.e:0 "Анархистское большинство!"
comfrance.1004.f:0 "Умеренное большинство!"

