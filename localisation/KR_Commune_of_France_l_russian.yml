### Leader Bios ###
## Французская Коммуна ##
POLITICS_SEBASTIEN_FAURE_DESC: "Себастьен Фор - первый анархист, занимающий пост председателя Женевской биржи труда. Первоначально он был наделен полномочиями председателя в результате компромисса между "Трудовиками" и анархистами, но за время его пребывания на этом посту фракционность значительно выросла, а государственный аппарат ослаб. Если какой-либо фракции удастся получить явное большинство в Комитете общественного здоровья и Женевской бирже труда, то Фора, скорее всего, сместят."
POLITICS_LEON_JOUHAUX_DESC: "Леон Жуо был избран председателем Женевской биржи труда. Жуо, как революционный профсоюзный деятель, участвовал во всеобщей забастовке 1919 года, которая привела к созданию Коммуны. Он является приверженцем ортодоксального французского синдикализма, настоящим центристом среди фракций Коммуны."
POLITICS_BENOIT_FRACHON_DESC: "Бенуа Фрашон, ветеран Гражданской войны во Франции, стал председателем Женевской биржи труда. Будучи синдикалистом, он симпатизирует противостоящей ему фракции анархистов; с этой целью он объявил главной задачей своего председательства исправление фракционности Коммуны."
POLITICS_MARCEL_CACHIN_DESC: "Марсель Кашин, бывший дипломат и шеф бюро государственной газеты "Юманите", стал председателем Коммуны Франции. Будучи ленинцем, его дипломатическая позиция и общая харизма позволяют ему сохранять определенную степень сердечности с синдикалистами и анархистами."
POLITICS_VINCENT_AURIOL_DESC: "Венсан Ориоль, которого жесткие синдикалисты долгое время обвиняли в симпатиях к буржуазии, стал председателем Женевской биржи труда. Он выступает за постепенный переход к более демократической системе правления в Коммуне."
POLITICS_FELIX_GOUIN_DESC: ""
POLITICS_GEORGES_VALOIS_DESC: "Жорж Грессент родился как Альфред-Жорж Грессент в 1878 году в крестьянской семье, принадлежавшей к рабочему классу, и с ранних лет начал заниматься политикой. Став приверженцем национал-синдикалистского учения Жоржа Сореля, работая его секретарем, он, однако, не всегда был левым человеком. После публикации политической мысли, непосредственно вдохновленной его наставником Сорелем, он стал знакомым писателя-монархиста Шарля Морраса. Присоединившись к движению Морраса "Французское действие", он разработал свою идеологию, в которой политика рабочего класса сочеталась с монархизмом. В 1911 году вместе с товарищами по AF он основал Cercle Proudhon. Эта группа поддерживала национал-синдикализм, интегральный национализм и антисемитизм, отвергая либеральную и консервативную демократию. Со временем, по мере развития синдикалистских движений по всей Франции, Cercle стал откровенно левым, сохраняя при этом агрессивно националистическую позицию в отношении мировой политики. Когда началась Гражданская война во Франции, Валуа воспользовался кризисом и превратил свою группу в полноценное политическое движение. Родились "Сорелианцы" Отказавшись от прежних реакционных взглядов, Валуа и его товарищи вышли на улицы разрушенной Франции с требованием уничтожить Третью французскую республику.\n\nТеперь он стал председателем Женевской биржи труда. Валуа выступает за объединение председательств Женской биржи труда и Комитета общественного здоровья, что, по мнению многих коммунаров, является предвестником тирании. Он также выступал за месть Германии и возвращение утраченных французских территорий."
POLITICS_MARCEL_DEAT_DESC: "Марсель Деат родился в 1894 году в скромной семье, в юности преуспевал в учебе и стал участвовать в левой политике. Будучи учеником радикального политика Эмиля Шартье, он вступил в SFIO, однако эта политическая деятельность закончилась с началом Вельткрига. Будучи убежденным патриотом, он записался во французскую армию и прошел действительную службу, получив орден Почетного легиона и пять наград за храбрость. Вельткриг сформировал его политические взгляды, породив глубокую ненависть к Германии и французской элите, которая, по его мнению, не справилась с задачей нации. В преддверии Гражданской войны во Франции Деат позиционировал себя справа от социалистического движения, выступая за авторитарное антикапиталистическое государство. Его работы были опубликованы Валуа, который заинтересовался Деатом, и они быстро стали союзниками. Когда всеобщая забастовка привела к гражданскому конфликту, Деат объявил о своей лояльности сорельянцам.\n\nПредставляя "авангардистскую" фракцию сорельянцев, Деат показал себя в первую очередь оппортунистом, а во вторую - идеологом. Налаживая связи с бывшими политическими врагами и предпринимая действия против товарищей, Деат пробился на вершину сорелийского руководства. Теперь, контролируя Национальное рабочее государство, председатель Деат может возглавить авторитарный антикапиталистический режим, о котором он всегда мечтал."
POLITICS_MARCEL_BUCARD_DESC: "За эти годы Марселя Бюкара называли по-разному. Синдикалист, антисемит, националист, рабочий. Начав жизнь сыном мясника в Сен-Клер-сюр-Эпте, Марсель Бюкар сначала учился на католического священника. Однако все изменилось с началом Вельткрига, когда он патриотично записался в армию, чтобы сражаться с немецкой ордой в защиту французской нации, поднимаясь по карьерной лестнице и завоевывая восхищение французских патриотов и друзей в окопах. Как бы он ни сражался, ужасы войны укрепили его личную ненависть к Германии и её жестокому обращению с французским народом. Будучи изначально реакционером, Вельткриг породил в нем глубокую ненависть к французскому высшему классу, который он считал трусом, сдавшимся немцам. В революционный период, охвативший Францию, банкиры, либералы, капиталисты, эксплуататоры французской нации покинули её и бежали с богатствами её народа. Противодействие этому имело огромное личное значение для Бюкара, который присоединился к сорелианцам Валуа и в итоге возглавил свою собственную фракцию "ультранационалистов-синдикалистов" Выступая с речами перед толпами лишенных гражданских прав французских патриотов против "безжалостных банковских кланов" и их "либеральных прихлебателей", он легко привлекал на свою сторону ветеранов Вельткрига.\n\nТеперь, став вождем Национального рабочего государства, Бюкар видит своей главной целью уничтожение Германской империи. По его мнению, превосходящий французский пролетариат разбил цепи своих хозяев и больше не может быть побежден никакой силой!"
POLITICS_MAURICE_THOREZ_DESC: "Морис Торез родился в Па-де-Кале, Франция, 28 апреля 1900 года. В возрасте 12 лет он стал шахтером, а в 19 лет вступил во Французскую секцию Рабочего Интернационала. Время, проведенное в SFIO, познакомило его с марксистской мыслью, заставив увлечься идеями коммунизма и с большим энтузиазмом поддержать большевистское восстание в России. Окончательный провал большевиков привел Тореза к выводу, что они не были достаточно чистыми и сильными, что они подвели и Ленина, и Маркса, и Робеспьера своей неспособностью принять все необходимые для революции меры. Торез возьмет в руки оружие во время Второй французской революции, объявив себя синдикалистом, чтобы замаскировать свою истинную коммунистическую сущность. Харизматичный лидер, многие стекались к нему за его смелые речи и преданность революции. Однако после установления Французской коммуны он показал своё истинное лицо, объявив коммуну буржуазной четвертой республикой и обратив своих последователей на путь коммунизма. Называя себя "якобинцами" в честь радикалов Робеспьера, Торез и его последователи стали огромной занозой в боку CGT. Считая себя преемником Робеспьера и Ленина, Торез был признан политическим неудачником за свою неспособность получить место в CGT. Но теперь, когда его власть обеспечена ошеломляющей победой на выборах 1936 года, "политический неудачник" намерен оправдать своих предшественников и сокрушить всех, кто стоит на его пути к созданию настоящей коммунистической французской утопии."
POLITICS_FRENCH_COUNCIL_DESC: "После смерти председателя Валуа власть перешла к Сорельскому совету. Валуа так и не назвал своего преемника на случай своей смерти, поэтому во избежание дальнейших конфликтов был сформирован Комитет общественного спасения. Совет, возглавляемый Пейре Лавалем, не имеет единства, поскольку он расколот на две соперничающие фракции. Секретарь Валуа Марсель Деат возглавляет авангардистов, а командир Революционного легиона Марсель Бюкар - ультранационалистов-синдикалистов. В условиях нависшей угрозы анархии Совет сможет объединиться вокруг единого лидера или распадется..."
POLITICS_BLACK_GUARD_DESC: "Официально "Свободная территория Франции" не имеет лидера, после освобождения городов люди Махно объявили о своем намерении оставить все управление на усмотрение самих рабочих. Законы и власть обеспечиваются полностью автономными коммунами, которыми обычно командует совет рабочих. Однако, несмотря на предполагаемую неограниченную свободу и отмену всех иерархий, самым могущественным человеком в стране, несомненно, является Нестор Махно. Его роль защитника анархии позволяет ему командовать большим количеством солдат Черной гвардии, которые размещаются по всей Свободной территории. Когда его людям требуется отдых и пища, граждане коммун оказывают им помощь. Махно предпочитает не вмешиваться в политику анархистских коммун, однако было бы неразумно оспаривать любое решение, которое он может принять..."
POLITICS_GAMELIN_DESC: "Морис Гюстав Гамелен родился в семье военного 20 сентября 1872 года и всегда был предназначен для военного величия. Поступив в военную академию Сен-Сир, он окончил её первым в своем классе и продолжил службу в Тунисе. Служа в качестве атташе при будущем маршале Франции, генерале Жозефе Жоффре, эта должность дала Гамелену прочные знания стратегической и тактической войны. Во время Вельткрига он отличился тем, что помог спланировать победу в битве на Марне. Быстро дослужившись до звания бригадного генерала, Гамелен был отозван в Париж, однако немецкое наступление 1918 года все дальше продвигалось вглубь Франции. Возглавив отчаянную оборону столицы, он удерживал позиции достаточно долго, чтобы спасти бесчисленные жизни гражданских лиц. После войны он занимал высокий пост в армии, но по мере эскалации гражданского напряжения не позволял политике повлиять на его верность Франции. Когда революционеры-синдикалисты добились успеха, Гамелен предложил свои услуги правительству и был назначен маршалом Коммуны Франции. Этому пришел конец, когда был провозглашен якобинский режим.\n\nПо мере того, как тираническое правление якобинцев раздирало Францию на части, Гамелен понял, что его участие в политике должно закончиться. Создав альянс Леона Блюма, Народный фронт, поддерживаемый военными, сверг диктатуру Тореза, а Гамелен был провозглашен Марешалем. Сейчас многие считают Гамелена защитником демократии коммунаров и спасителем Франции."
POLITICS_NESTOR_MAKHNO_DESC: "Нестор Иванович Махно родился в бедной крестьянской семье на Украине 26 октября 1888 года и был вынужден быстро адаптироваться к суровой жизни. Крайняя бедность заставила его найти работу для себя, и, работая на местном чугунолитейном заводе, он стал свидетелем подъема революционной антицаристской политики. Испытав на себе жестокость царского режима, он присоединился к местным анархистам и участвовал в грабежах, что привело к тюремному заключению. Когда началась война, он остался в заключении и был приговорен к смертной казни через повешение, которая закончилась русской революцией. После освобождения он отправился на Украину, где, наладив связи с анархистами, создал "Черную армию" для борьбы как с украинскими националистами, так и с наступавшими немецкими войсками. Когда Германия установила своё господство над страной, он бежал из родной страны во Францию.\n\nТеперь его яростное осуждение любой и всякой государственной власти обеспечило ему популярность и известность во французской политике. Создал террористическую организацию "Чёрная гвардия", которая свергла сорельский режим. После неудач в Украине и Франции Махно ещё больше радикализировался в рядах иллегалистов. Его радикальное видение нации, а возможно и мира, без какого-либо правительства, скорее всего, не осуществится в обозримом будущем. Однако его усилия по уничтожению любых остатков власти в коммуне с созданием "Свободной территории Франции" до сих пор были успешными. Однако эти успехи могут оказаться напрасными, поскольку его личная армия анархистов - единственное, что может помешать соседям Франции воспользоваться этим хаосом..."
POLITICS_LOUIS_NIEL_DESC: "История жизни Луи Ниеля, изначально простого, скромного мальчика из кафе, продолжает вдохновлять молодых синдикалистов и сегодня. Луи родился на Корсике в 1872 году в скромной семье из Бастии, был самоучкой, самостоятельно научился читать и писать и быстро сформировал политическое сознание, наблюдая за плачевными условиями жизни рабочих на своей родной Корсике, по которой он путешествовал на протяжении всех своих подростковых лет. \n\nОднако вскоре он уехал на материк, чтобы вступить в местное отделение CGT в Монпелье, где его отметили за трудолюбие, образцовые интеллектуальные качества, спокойный, вдумчивый темперамент и неоспоримые административные, организаторские и управленческие способности. Пользуясь всеобщей симпатией и уважением всех левых социалистических, коммунистических и революционных течений, Луи Ниль писал статьи для самых разных газет, от анархистской «Les Temps Nouveaux» до коммунистической «l'Humanité». Эти качества позволили ему шаг за шагом подниматься по карьерной лестнице в CGT, пока в 1909 году он не оказался на посту генерального секретаря и, таким образом, лидера CGT. Несмотря на свои способности, Луи Ниль оказался избранным в атмосфере синдикалистской напряженности, в частности, между реформистским и революционным течениями. Ниэль пытался примирить эти два течения, как мог, но оказался в противостоянии с харизматичным Леоном Жуо. В этих условиях он подал в отставку, знаменито заявив: «Я никогда не думал, что попаду в среду, настолько разложенную политическими страстями и личными ссорами». Он вернулся к своей жизни администратора и организатора в тени и сыграл ключевую роль в координации профсоюзов во время революции против Третьей республики.\n\nНиль, однако, вернулся в центр внимания недавно: после того, как CGT увидел, что его большинство уменьшается, и опасался его потерять, он решил избрать Луи Ниля, объединяющую фигуру, президентом Конгресса профсоюзов, роль, которую он принял без жалоб, но и без энтузиазма, довольствуясь линией CGT. Политический климат в начале 1936 года не самый нестабильный, но некоторые опасаются, что если страну потрясет серьезный кризис, Луи не будет идеальным человеком для его преодоления..."
POLITICS_ALBERT_CAMUS_DESC: "Сын родителей, живших в алжирском городе Мондови, ставший с тех пор любимым лицом алжирского движения поселенцев-синдикалистов, Альбер Камю является живым воплощением борьбы Коммуны между её колониалистским прошлым и гуманистическим будущим. Камю родился в Мондови (Алжир) в 1913 году и был сыном ветерана Великой войны, трагически погибшего во время службы в полку зуавов в октябре 1914 года, и матери из рабочего класса, которая была глухой и неграмотной, в результате чего Камю с ранних лет оставался мужчиной в доме. Всегда испытывавший дискомфорт из-за больших прав, которые ему предоставлялись по сравнению с его сверстниками-арабами и берберами, а также благодаря своему происхождению из рабочего класса, служившему прочной основой, Камю быстро обнаружил, что его с юных лет привлекает левая идеология. В итоге он учился в престижном лицее близ Алжира в годы, последовавшие за Французской революцией и расколом Франции, что вынудило его вывести свои новообретенные социалистические убеждения в подполье, пока он поддерживал тайные контакты с собратьями по левым взглядам по всему Средиземноморью. Философствуя как абсурдист и экзистенциалист, Камю развивал свою собственную литературную форму мышления, а идеологически склонялся к анархо-синдикализму, одновременно выступая за создание «новой средиземноморской культуры», построенной на модернизированной и синкретизированной концепции эллинского гуманизма, в которой эгалитарный конгломерат французского пье-нуара и родной алжирской культуры и социо-экономики превратится в единое гомогенное целое, формирование мультиэтнического и мультикультурного революционного плавильного котла в качестве основной части самой Франции, который поднял бы алжирский пролетариат до уровня равных со своими соотечественниками с европейской кровью в Метрополии. Приверженец Мессали Хаджа и антиколониализма, находясь на грани между алжирской автономией в качестве союзника и алжирской интеграцией в качестве полноправного департамента, Камю, тем не менее, является главным лицом Алжира в деле синдикализма, который будет принимать необходимые решения, чтобы Алжир внес как можно больший вклад в нашу эллинистическую революцию."

### Ideas ###

THINT_exact_vengeance: "Жажда мести"

FRA_home_of_the_international_revolution: "Родина Интернациональной революции"
FRA_home_of_the_international_revolution_desc: "Федерация Коммун Франции - первая страна в мире, где революция социалистического характера увенчалась успехом и было создано рабочее государство. Этот факт придает нашей стране огромный престиж и делает её центром мирового пролетарского революционного движения, где находятся многочисленные организации, представляющие трудящихся всего мира, например, руководство левого Гоминьдана, многие панафриканские интеллектуалы, мыслители движения «Негритюд», боевики ENA и многие другие. \n\nДля всех пролетариев мира Франция - это свет во тьме империалистического мира, и все социалистические боевики мира разделяют мечту о том, чтобы однажды стать делегатами одного из великих конгрессов Третьего Интернационала в Париже."

FRA_home_of_the_international_revolution_2: "Очаг интернациональной революции"
FRA_home_of_the_international_revolution_2_desc: "Федерация коммун Франции - первая страна в мире, где победила революция социалистического характера и было установлено рабочее государство. Этот факт приносит нашей стране огромное престижное значение и превращает её в центр мирового пролетарского революционного движения, где можно встретить множество организаций, представляющих рабочих со всего мира: например, руководство Левого Гоминьдана, многих панафриканских интеллектуалов, мыслителей движения Негритюд, активистов ENA и многих других.\n\nДля всех пролетариев мира Франция - это свет во тьме империалистического мира, и все социалистические борцы мира разделяют мечту однажды стать делегатами одного из великих конгрессов Третьего интернационала в Париже."

FRA_communard_spirit_idea: "Коммунарский дух"
FRA_communard_spirit_idea_desc: "Мы - наследие Парижской Коммуны, первого социалистического государства, когда-либо созданного и затем жестоко подавляемого реакционерами-республиканцами. В 1920 году рабочие наконец отомстили и свергли военную хунту "Партии порядка" Мы, сыновья и дочери коммунаров, должны защищать своё государство и наш дух, тираны нами больше не будут командовать!"

FRA_bad_intel: "Неэффективная разведка"
FRA_bad_intel_desc: "С тех пор, как Партия порядка пыталась подавить восстание рабочих во Франции, идея централизованной разведки многими рассматривается как отличительный признак реакционного угнетения социальных движений после Вельткрига. В результате разведывательные службы Коммуны ограничиваются чрезвычайно тщательно изученными разведывательными комитетами, чтобы предотвратить повторение этой ситуации."

FRA_to_war_idea: "Реваншистское возрождение"
FRA_to_war_idea_desc: "Наша нация должна воскреснуть, если мы хотим победить империалистов!"

#The three following ideas are extremely weird. Are they intended? Especially the third. Travailleurs and Sorelians both share it... I'm picking Travailleurs for now
FRA_economic_reforms_anar: "Экономические реформы"
FRA_economic_reforms_anar_desc: "Решение о широкомасштабных экономических реформах было принято в 1936 году на заседании Генеральная профсоюзная служба. Эти реформы уже оказали заметное влияние на нашу экономику, сделав её более динамичной и крепкой."

FRA_economic_reforms_jaco: "Экономические реформы"
FRA_economic_reforms_jaco_desc: "Решение о широкомасштабных экономических реформах было принято в 1936 году на заседании Генеральная профсоюзная служба. Эти реформы уже оказали заметное влияние на нашу экономику, сделав её более динамичной и крепкой."

FRA_economic_reforms: "Экономические реформы"
FRA_economic_reforms_desc: "Решение о широкомасштабных экономических реформах было принято в 1936 году на заседании Генеральная профсоюзная служба. Эти реформы уже оказали заметное влияние на нашу экономику, сделав её более динамичной и крепкой."

FRA_military_buildup_two_idea: "Калиброванная экономия"
FRA_military_buildup_two_idea_desc: "По мере того, как мир медленно приближается к войне, мы можем быстро капитализировать нашу экономику, чтобы быстро переключить её части и сосредоточиться на наращивании военного потенциала. Все больше заводов посвящены вооружению наших солдат и строительству военных структур без какого-либо серьёзного воздействия на наше население."

FRA_ruralism_idea: "Рурализм"
FRA_ruralism_idea_desc: "Широкомасштабные реформы в нашей промышленности и экономике означают, что у нас больше нет крупных промышленных центров, окружающих густонаселенные города. Это, кстати, делает любую попытку вражеских сил нанести вред или даже разрушить нашу экономику намного успешнее, поскольку крупнейшие сельские промышленные центры намного меньше и намного многочисленнее, чем крупные промышленные центры Европы."

FRA_market_socialism_idea: "Рыночный социализм"
FRA_market_socialism_idea_desc: "Рыночный социализм - это гораздо больше, чем социалистическая интерпретация рыночной экономики. Вводя всё новые рабочие кооперативы в справедливую и равноправную конкурентную экономику, мы можем сделать нашу гражданскую экономику более динамичной и более эффективной без прямого вмешательства или использования медленных, раздутых профсоюзов в большинстве случаев."

FRA_mass_production_idea: "Массовое производство"
FRA_mass_production_idea_desc: "Фабрики всегда имели серьёзное преимущество перед ремесленником. Объединяя производственные задачи, они могут производить за короткий промежуток времени больше продукции без потери качества. Вместо того, чтобы постоянно изобретать этот процесс, давайте улучшим его. Мы стремимся к абсолютной эффективности производства, чтобы победить немецких капиталистов."

FRA_modern_farms_idea: "Современные фермы"
FRA_modern_farms_idea_desc: "Фермы часто воспринимаются как старая, причудливая деталь национальной экономики, но мы знаем лучше. Модернизируя и механизируя сельскохозяйственные угодья Коммуны, мы можем значительно увеличить объём нашей сельскохозяйственной продукции, а также ускорить и оптимизировать сбор урожая, производство, переработку и доставку. Нашим мирным жителям и нашим войскам."

FRA_war_eco_agri_idea: "Война, экономика и сельское хозяйство"
FRA_war_eco_agri_idea_desc: "Идея войны, экономики и сельского хозяйства, предложенная сорелианским министром экономики Жаком Дорио, является интересной. Утверждая, что война с Германией не только неизбежна, но и быстро приближается, сорелианцы требуют быстрого перехода к экономике, промышленность которой может не только выдержать войну, но и сельское хозяйство может поддержать солдат. В общем, своего рода тотальная военная экономика."

FRA_inter_coop_idea: "Международное сотрудничество"
FRA_inter_coop_idea_desc: "Нет ничего постыдного в том, чтобы видеть, что делают другие страны, и заимствовать их новые экономические и промышленные идеи для улучшения наших собственных. Очевидно, есть очень мало идей, которые мы можем серьёзно позаимствовать у капиталистических и реакционных обществ, но наши братья-синдикалисты временами являются прекрасными примерами."

FRA_dedication_idea: "Чувство преданности"
FRA_dedication_idea_desc: "Французские рабочие работают больше, чем им платят, и, конечно же, они не работают под прицелом. Каждая банка, которую они запечатывают, каждый кирпич, который они кладут, каждая винтовка и каждый танк, которые они собирают - это служение стране и духу Коммуны в целом."

FRA_industralization_idea: "Коммунитарная индустриализация"
FRA_industralization_idea_desc: "Идея индустриализации, разработанная министром экономики якобинцем Жаном Жеромом, не является чем-то странным ни для кого в Коммуне или за рубежом. Эта политика направлена на быстрое увеличение промышленных мощностей Франции, чтобы догнать нашего заклятого врага - Германию. Это сопровождается культурой труда и созданием специализированных заводских городков."

FRA_mass_fire_support_idea: "Массовая огневая поддержка"
FRA_mass_fire_support_idea_desc: "У каждого человека есть винтовка и граната, у каждого отряда - пулемёт. Организуя наши подразделения для обеспечения огня друг друга, мы можем создать новый уровень огневой поддержки. Каждый раз, когда одна дивизия продвигается, все остальные дивизии подавляют врага. Делая это волнами, мы можем быстро завоевать позиции. Теперь нужно доставить необходимое оборудование."

FRA_mass_conscription_idea: "Массовый призыв"
FRA_mass_conscription_idea_desc: "В то время как нашим врагам сложно набрать достаточно солдат для ведения реакционных и империалистических войн, каждый готов сражаться за Коммуну. Давайте мобилизуем столько, сколько сможет выдержать наша экономика, мы сокрушим реакционеров своей преданностью Коммуне."

FRA_empower_rifleman_idea: "Возможности стрелков"
FRA_empower_rifleman_idea_desc: "Стрелок больше, чем солдат с ружьем. Слишком долго монархические офицеры считали его неспособным к более высокому мышлению, кроме как стрелять из ружья, глядя на рабочего с презрением. Мы не совершим этой ошибки, Стрелок должен определять локальную тактику, повышая свою эффективность на поле боя."

FRA_military_academy_idea: "Военная академия"
FRA_military_academy_idea_desc: "Мы должны признать суровую реальность того, что Вельткриг привел к падению большинства наших престижных, хотя и реакционных военных академий. Хотя некоторые утверждают, что это приемлемый статус-кво, мы знаем лучше. Давайте инвестируем в новые военные академии для подготовки квалифицированных офицеров для будущего армии Коммуны."

FRA_centralized_hc_idea: "Централизованное высшее командование"
FRA_centralized_hc_idea_desc: "Новая Коммунитарная армия не была построена как старая французская армия, многие коммунары возмущались военной администрацией, которая пыталась задушить Коммуну, но мы не можем оставить наш офицерский корпус разбитым. Давайте снова централизуем наше верховное командование, чтобы лучше организовать вещи, которые некоторые люди любят забывать, например логистику."

FRA_tank_quality_line_idea: "Производство качественных танков"
FRA_tank_quality_line_idea_desc: "Что хорошего в танке, если он не так хорош, как танки противника? Не стоит жертвовать качеством в пользу количества, все это приведет к ещё большему сгоранию шелухи на поле боя. Качественные резервуары, даже если их будет меньше, будут во много раз превышать их количество, что сделает их безопасным окупаемостью."

FRA_tank_assembly_line_idea: "Линия сборки танков"
FRA_tank_assembly_line_idea_desc: "Какой толк в танке, если у врагов есть ещё много чего бросить против нас? Мы не можем позволить перфекционистам саботировать наши сборочные линии ради минимальной выгоды, иначе нас будут превосходить по численности. Количество позволит нам сокрушить наших врагов целыми подразделениями из холодной твёрдой стали и множеством других снарядов, летящих по ним."

FRA_fast_army_idea: "Культ скорости"
FRA_fast_army_idea_desc: "Скорость - это больше, чем небольшое преимущество или способ быстрее добраться до следующей точки. Скорость - неотъемлемая часть войны. Те, кто думают, что следующий Вельткриг будет вестись в окопах, в лучшем случае заблуждаются: мобильная война - это путь будущего. Мы должны использовать быстрые моторизованные дивизии, если не моторизованную армию."

FRA_Red_Army: "Великая Красная Армия"
FRA_Red_Army_desc: "Наша армия сейчас в лучшей форме, чем когда-либо, чтобы противостоять порокам этого капиталистического мира."

Capital_Ship_Primacy: "Главенство крейсера"
Capital_Ship_Primacy_desc: "Большой флот будет иметь решающее значение для победы над Kaiserliche Marine и причинения боли северному побережью Германии. И в этой роли грандиозный линкор по-прежнему сияет. Его военно-морская артиллерия сокрушит реакционеров грядами грома и стали и отправит их лодки на дно моря."

Carrier_Primacy: "Главенство авианосца"
Carrier_Primacy_desc: "Будущее военно-морской войны не за большими, неуклюжими боевыми кораблями, а за комбинированным подходом с другим фронтом войны будущего - воздушной войной. Давайте позаботимся о том, чтобы у каждой военно-морской группы был авианосец. Его истребители обеспечат глобальное господство в воздухе, его военно-морские бомбардировщики будут уничтожать вражеские корабли и гавани."

FRA_working_women_idea: "Женский труд"
FRA_working_women_idea_desc: "Слишком долго женщины подавлялись реакционными мыслителями. Даже во времена Французской республики они самоотверженно поддерживали нацию, пока наших братьев отправили на бойню. Пришло время признать их вклад в общество и официально закрепить права работающих женщин в мирное и военное время."

FRA_bhartiya_support: "Французская военная поддержка"
FRA_bhartiya_support_desc: "Мы получаем военную поддержку от наших французских союзников. Эта бескорыстная помощь окажется критически важной для разгрома реакционной Княжеской Федерации и империалистического доминиона Индии. Со временем мы надеемся отплатить Франции за их помощь, но пока мы должны сосредоточиться на поставленной задаче."

FRA_amenagement_idea: "Управление территорией"
FRA_amenagement_idea_desc: "Франция исторически была очень централизованной страной, а это означает, что большая часть развития ограничивалась промышленными городами и населенными пунктами. Мы финансируем крупные проекты, чтобы гарантировать, что все части нашей территории развиваются удовлетворительным образом."

FRA_plan_prost_idea: "План Проста"
FRA_plan_prost_idea_desc: "Планы Анри Проста относительно шоссе, соединяющего пригороды Парижа, оказались популярными по всей стране. Многие другие муниципалитеты, такие как Лион или Марсель, также присоединились к плану, и уже разрабатываются проекты для крупной сети автомагистралей, соединяющей все крупные города Франции вместе, от Лилля до Тулузы."

FRA_paramilitary_gendarmes: "Военизированные жандармы"
FRA_paramilitary_gendarmes_desc: "Жандармы - прекрасная организация, военизированная полиция, способная вести как гражданскую, так и военную деятельность. Хотя многие настаивали на их полном роспуске, мы вместо этого расширим их деятельность, чтобы сделать их силой, параллельной французской коммунальной полиции."

FRA_secret_police: "Тайная полиция"
FRA_secret_police_desc: "Внутри Коммуны по-прежнему много врагов, иногда даже на руководящих постах или в армии. Это стремление к прозрачности опасно, вместо этого мы должны организовать операции тайной полиции, чтобы обеспечить безопасность французского народа от внутреннего влияния."

FRA_demo_surete: "Sûreté Populaire Démocratique"
FRA_demo_surete_desc: "Мы не можем допустить, чтобы паранойя привела к разрушению того тонкого баланса, которого мы достигли с Sûreté Populaire. Демократизируя организацию, мы гарантируем, что французы будут уважать полицию не из страха, а за счёт понимания своих действий и целей, а также зная, что они служат им в первую очередь."

FRA_hawkish_renseignements: "Revolutionary Renseignements"
FRA_hawkish_renseignements_desc: "Renseignements Généraux должны обеспечить нашу безопасность от реакционных врагов за границей. Простая контрразведка неадекватна, мы должны быть готовы шпионить за вражескими странами и поддерживать синдикалистские движения по всему миру. Хорошее нападение - лучшая защита."

FRA_peace_renseignements: "Protective Renseignements"
FRA_peace_renseignements_desc: "Renseignements Généraux должны прежде всего обеспечивать безопасность нашей страны. Контрразведка - это центральный элемент эффективной национальной обороны, и есть много врагов, которые ждут момента слабости, чтобы повлиять и взбесить наше население."

FRA_peaceful_revolution_idea: "Мирная революция"
FRA_peaceful_revolution_idea_desc: "Грядёт Международная синдикалистская революция, но она будет цивилизованной. Когда основные реакционные силы в Европе окончательно разбиты, а их рабочие освобождены, мы стремимся поощрять дальнейшие восстания, просто доказывая превосходство синдикализма над всем миром."

FRA_amateur_pilots_idea: "Пилоты-любители"
FRA_amateur_pilots_idea_desc: "В нашей стране много людей, которые занялись полетами в качестве хобби или призвания, но не все из них продолжают карьеру в ВВС. Их желательно направить в наши военно-воздушные силы, где их навыки повысят наши шансы найти новых асов Воздуха."

FRA_ecole_air_idea: "Ecole de l'Air"
FRA_ecole_air_idea_desc: "Полёт - это само по себе навык, а хорошо летать в боевых условиях - это то, чему нельзя научиться за одну ночь. Мы не будем повторять ошибок Вельткрига и его палача начинающих пилотов, нам нужен большой состав хорошо обученных пилотов и компетентные офицеры, которые будут их руководить."

FRA_waves_of_syndicalism_idea: "Волны синдикализма"
FRA_waves_of_syndicalism_idea_desc: "Флот Коммуны могущественен, и его досягаемость настолько велика, насколько мы этого желаем. Несмотря на то, что нам может не хватать обильных всемирных портов Французской Империи в былые времена, мы по-прежнему стремимся иметь флот, который может вмешаться в любой уголок мира в любое время."

FRA_cut_off_capitalists_idea: "Отрезать капиталистов"
FRA_cut_off_capitalists_idea_desc: "Капиталисты по-прежнему гордятся своими колониальными территориями. Плоды их грабежей по-прежнему свободно текут в открытом море. Но если мы скажем об этом, мы гарантируем, что украденное имущество африканских, азиатских и американских рабочих не обогатит их."

French_Revanchism_idea: "Французский реваншизм"
French_Revanchism_idea_desc: "Мы давно готовились к этой неизбежной войне. Мы давно отбросили Петена и его кредо, но это не значит, что мы забудем, за что наши братья погибли в Арденнах, в Вердене, в Chemin des Dames. Мы отомстим за них и раз и навсегда вернём себе то, что заслужили за нашу борьбу."

French_Revanchism_idea2: "Социальный патриотизм"
French_Revanchism_idea2_desc: "Патриотом быть не реакционно! Любить прогресс и равенство, предоставленные нацией, и желать защищать этот прогресс от империалистических наций, таких как Германия. Vive la France!!"

Revolutionary_spirit: "Революционный дух"
Revolutionary_spirit_desc: "Выживание и процветание синдикалистского мира будут обеспечены только тогда, когда будет уничтожен последний реакционный бастион. Мы должны быть готовы мобилизовать и сокрушить каждое реакционное правительство во всем мире. Когда-нибудь Интернационал охватит все моря и континенты!"

FRA_socialist_education_idea: "Социалистическое образование"
FRA_socialist_education_idea_desc: "Воспитание молодёжи - одна из величайших целей, стоящих перед такой страной, как Коммуна. К счастью, старая система образования республики была революционной для своего времени, давая нам хорошую основу для новой. Социалистическая система образования, ориентированная на науки и искусство."

FRA_phalanstere_NOR: "Помощь Норвегии"
FRA_phalanstere_NOR_desc: "В настоящее время мы оказываем промышленную помощь нашим норвежским братьям."

COF_prodcsaplanes: "Производство самолётов для О.С.А"
COF_prodcsaplanes_desc: "Мы должны помочь новой нации."

FRA_avantgarde_idea: "Международный авангард"
FRA_avantgarde_idea_desc: "Единый социалистический стиль искусства, от искусства до музыки, мог бы стать мощным инструментом, который поможет массам в несиндикалистском мире заинтересоваться нашими идеалами - через развлечения."
FRA_sorelians_supreme_idea: "Сорелианцы правят безраздельно"
FRA_sorelians_supreme_idea_desc: "Победа Жоржа Валуа обеспечила Сорелиан власть над Францией, легионеры уже размещёны в ключевых правительственных зданиях, а Красный Орёл Сореля наклеен на существующие символы синдикалистов. Призывы Валуа к патриотизму, милитаризму и сильному этатизму были встречены громом аплодисментов французских рабочих, готовившихся к новой Коммуне. Vive la France!, camarades!"
FRA_sorelians_supreme_idea2: "Сорелианцы правят безраздельно"
FRA_sorelians_supreme_idea2_desc: "Победа Жоржа Валуа обеспечила Сорелиан власть над Францией, легионеры уже размещёны в ключевых правительственных зданиях, а Красный Орёл Сореля наклеен на существующие символы синдикалистов. Призывы Валуа к патриотизму, милитаризму и сильному этатизму были встречены громом аплодисментов французских рабочих, готовившихся к новой Коммуне. Vive la France!, camarades!"
FRA_corporate_syndie_idea: "Корпоративный синдикализм"
FRA_corporate_syndie_idea_desc: "Попытки председателя Валуа централизовать экономику путём создания корпораций, имеющих отношение к областям знаний, пока что привели к большему политическому представительству рабочих и увеличению производства. Несомненно, это будущее синдикализма!"
FRA_corporate_syndie_idea2: "Корпоративный синдикализм"
FRA_corporate_syndie_idea2_desc: "Попытки председателя Валуа централизовать экономику путём создания корпораций, имеющих отношение к областям знаний, пока что привели к большему политическому представительству рабочих и увеличению производства. Несомненно, это будущее синдикализма!"
FRA_french_nationalism_idea: "Революционный национализм"
FRA_french_nationalism_idea_desc: "С момента зарождения первой Французской революции национализм был силой, используемой французскими рабочими для утверждения своего господства над нашими врагами. Все трепещут перед мощью нового Национального Французское Государство! Vive la France!"
FRA_french_nationalism_idea2: "Революционный национализм"
FRA_french_nationalism_idea2_desc: "С момента зарождения первой Французской революции национализм был силой, используемой французскими рабочими для утверждения своего господства над нашими врагами. Все трепещут перед мощью нового Национального Французское Государство! Vive la France!"
FRA_valois_dead_idea: "Смерть нашего лидера"
FRA_valois_dead_idea_desc: "Наш дорогой вождь мёртв, Франция стоит на пороге полной анархии!"
FRA_black_guard_insurgency_idea: "Мятеж Чёрной гвардии"
FRA_black_guard_insurgency_idea_desc: "Убийство председателя Валуа, совершенное анархистскими террористами, придало смелости Чёрной гвардии выйти из укрытия и усилить свои атаки. Из-за учащения бомбардировок и общего нарушения повседневной жизни пострадала промышленная продукция страны."
FRA_ultranat: "У власти ультранациональные синдикалисты-сорелианцы"
FRA_ultranat_desc: "Марсель Бюкар и его союзники-ультранационалисты-синдикалисты захватили контроль над Сорелианским советом, изгнав Клику Деа. Многие считают Бюкара реакционером, который перешёл на другую сторону, чтобы спасти свою шкуру, однако, несмотря на это, новый председатель подтвердил свою приверженность сокрушению буржуазных наций. Поддерживаемый как военными, так и Революционным легионом, Бюкар заключил союзы с левыми националистами, стремящимися бороться с немцами, а также с группами, отстраненными CGT, такими как футуристы и технократы. С полным контролем ультранационалистов-синдикалистов Франция может продолжить своё преобразование в сильное национальное государство."
FRA_Sorelian_Division: "Сорельская дивизия"
FRA_Sorelian_Division_desc: "Кажется, что непререкаемый авторитет и уважение Валуа - это то, что скрепило Сореленов вместе, с его уходом движение рухнуло в хаос из-за конфликтующих фракций. Будущее Франции зависит от того, смогут ли эти фракции сотрудничать."
FRA_lenin: "Наследие Ленина"
FRA_lenin2: "Наследие Ленина"
FRA_cpai: "Народный Комиссариат Внутренних Дел"
FRA_cpai2: "Народный Комиссариат Внутренних Дел"
FRA_republican_authority: "Республиканская власть Деата"
FRA_union_loyalty2: "Национальный Народный Союз"
