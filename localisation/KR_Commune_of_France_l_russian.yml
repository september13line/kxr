comfrance.1009.t:0 "Возвращение к демократии?"
comfrance.1009.d:0 "Наш спаситель, маршал Гамелен, сумел искоренить радикализм старой Французской Коммуны и благодаря своему Народному фронту, а также помощи многих товарищей, в том числе достопочтенного Леона Блюма, обеспечил, чтобы французский народ больше никогда не попал в ловушку деспотизма. Однако некоторые советники маршала, включая самого Леона Блюма, теперь призывают его восстановить демократические выборы, поскольку Франция вновь находится в безопасности, разумеется, не допуская к ним тиранических радикалов вроде якобинцев. Другие же считают, что ещё слишком рано и угроза тирании пока не исчезла окончательно. Последнее слово остаётся за Спасителем Франции, самым благородным и человечным из всех, Морисом Гамеленом."
comfrance.1009.a:0 "Наш маршал объявляет, что вскоре состоятся выборы!"
comfrance.1009.b:0 "Социалистическая республика ещё не готова."

comfrance.1010.t:0 "Американские иллегалисты ищут безопасную гавань"
comfrance.1010.d:0 "Крах Объединённых Синдикатов Америки стал тяжелейшим ударом по делу Мировой революции. По всему Среднему Западу и Аппалачам реакционеры и популисты проводят облавы на наших американских товарищей и уничтожают всё, что те пытались построить. Хотя большая часть генерального штаба и политбюро ОСА была либо пленена, либо уничтожена, некоторым нашим союзникам повезло пересечь Атлантику и найти безопасную гавань на нашей Свободной территории. Хотя часть этих беженцев, пожалуй, ближе к сорельянским псам, чем к нам, истинным знаменосцам революции, среди них нашлись и радикальные анархисты, способные оказаться полезными для нашей первоочередной цели - освобождения континента.\n\nРене Бельбенуа, француз и бывший узник наших реакционных предшественников, каким-то образом сумел вернуться на нашу территорию и теперь предстал перед Центральным советом Чёрной гвардии. Находясь в Америке, он сформировал эгоистическое и иллегалистское политическое течение, схожее с тем, которое отстаивают некоторые наши товарищи-анархисты. Бельбенуа утверждает, что его политический и военный опыт, полученный во время Американской гражданской войны, способен существенно помочь нашему делу в Европе. Поэтому он просит передать под его командование отряд Чёрной гвардии и позволить присоединиться к нашей борьбе. Вместе с собой он также привёл печально известных американских преступников Бонни Паркер и Клайда Бэрроу. Бельбенуа ручается за их преданность делу иллегализма и заявляет, что опыт партизанской борьбы против южных реакционеров также принесёт пользу нашей миссии.\n\nДоводы Бельбенуа убедили значительную часть офицеров Чёрной гвардии. Однако другие указывают на его неспособность обеспечить победу иллегалистов в Америке как свидетельство недостаточной компетентности. Кроме того, сотрудничество с лжесоциалистом Аль Капоне заставило некоторых усомниться в его принципиальности. В конечном счёте решение будет принято голосованием в рамках демократического устройства нашей Гвардии."
comfrance.1010.a:0 "Нам не нужны эти неудачники и оппортунисты!"
comfrance.1010.b:0 "С возвращением, товарищ Бельбенуа."
comfrance.1010.c:0 "Товарищи Бонни и Клайд тоже присоединятся к нам!"

comfrance.1011.t:0 "«Жёлтые синдикалисты»"
comfrance.1011.d:0 "Цветом синдикализма традиционно считается красный, унаследованный от красного знамени рабочего движения, однако одна особая группа синдикалистов, похоже, предпочитает жёлтый. Возникшие во время забастовок на заводах Schneider в Ле-Крёзо в 1899 году, «жёлтые синдикалисты» впервые противопоставили себя «красным», выступая за переговоры с классом работодателей ради улучшения условий труда и одновременно отвергая забастовки как средство борьбы. Само название «жёлтых» появилось после встречи профсоюзников в кафе Монсо-ле-Мин, где они обсуждали дальнейшие действия, пока представители красных профсоюзов не забросали окна камнями. Пробоины тогда заклеили жёлтой бумагой. Вскоре подобные союзы появились во многих шахтёрских и промышленных центрах Франции и даже объединились в Union Fédérative des Syndicats et Groupements Ouvriers Professionnels de France et des Colonies, более известный как Fédération Nationale des Jaunes de France, Национальная федерация жёлтых Франции. Изначально её создал левый буланжист Поль Лануар, известный как отец «жёлтого синдикализма», однако позднее руководство перешло к Пьеру Бьетри, который оттеснил Лануара на второстепенную роль. Постепенно движение радикализировалось, приняв ярко выраженный французский национализм, сильный антисемитизм и насильственные методы, способные соперничать даже с Camelots du Roi из Action Française. Они доходили до мечтаний о том, чтобы «живьём прибить падаль Жореса к двери». В отличие от традиционных синдикалистов и марксистов, жёлтые также выступают за классовое сотрудничество, однако при сохранении господствующего положения пролетариата.\n\nКогда началась Революция, амбициозный Бьетри поначалу предпочёл сохранить нейтралитет, но затем примкнул к революционерам, посчитав это единственным способом спасти Францию от германской агрессии и одновременно наиболее быстрым путём к укреплению собственных профсоюзов. С тех пор Национальная федерация жёлтых Франции вошла в демократическую коммунарскую систему. Несмотря на сравнительно малую численность, Федерация всё ещё находит поддержку среди наиболее реваншистских и националистических слоёв коммунарского общества и поддерживает связи с сорельянцами. Внутри организации железной рукой правит Пьер Бьетри, намеренный проводить собственные националистические принципы, но не выступающий против существующей коммунарской демократии. Однако внутри Федерации существует Comité Central Socialiste Révolutionnaire, Центральный социалистический революционный комитет, которым руководит Лануар. Провозглашая левобуланжистскую идеологию, вдохновлённую прежде всего Габриэлем Терраем и Альфредом Наке, комитет отвергает коммунарскую демократию и стремится заменить её централизованной системой, объединённой вокруг харизматической центральной фигуры, подобной генералу Буланже в прошлом, чтобы обеспечить сохранение нации и социальных прав для всех. Пока жёлтые располагают лишь несколькими местами в BGT и потому обладают незначительным влиянием, но кто знает, что ждёт это необычайное движение в будущем..."
comfrance.1011.a:0 "Стоит присмотреть за этими «синдикалистами»..."

comfrance.1012.t:0 "Герой войны и пацифист"
comfrance.1012.d:0 "Сегодня всё труднее игнорировать усиливающуюся воинственную риторику как во Франции, так и в Германии, поскольку вопрос Эльзас-Лотарингии тяжёлой тенью нависает над любыми дипломатическими попытками сближения коммунаров и немцев. Однако в обеих странах всё ещё остаются люди, помнящие ужасы Вельткрига и всеми силами стремящиеся не допустить их повторения. Среди этих смелых сторонников мира мало кто столь же известен, как Рене Кассен, инвалид войны из французской Страны Басков, который неустанно трудился ради людей, подобных ему, физически искалеченных войной. Его организация, Union Fédérale des Associations Françaises d’Anciens Combattants et Victimes de Guerre, тесно связанная с UFAFC, уже долгое время выступает за разрешение международных споров дипломатическими средствами вместо войны.\n\nКассен говорит исходя из собственного опыта. В 1916 году во время Вельткрига, командуя подразделением, он был тяжело ранен в руку, живот и бок. Получив увечья, сделавшие дальнейшую службу невозможной, Кассен был награждён Военным крестом и демобилизован. Желая любой ценой предотвратить повторение подобного конфликта, его организация даже тайно установила связи с единомышленниками среди германских ветеранов, хотя неизвестно, насколько далеко им удалось продвинуться к взаимопониманию. По мере того как Коммуна всё быстрее готовится к войне с Германией, Рене Кассен стал одним из главных критиков подобного курса и призывает вместо этого создать международный орган, способный содействовать мирному разрешению конфликтов между государствами. Хотя его риторики вряд ли хватит, чтобы переломить охвативший Коммуну реваншистский пыл, власти внимательно следят за его деятельностью на всякий случай."
comfrance.1012.a:0 "Он что, пытается получить Нобелевскую премию мира?"

comfrance.1013.t:0 "Вопрос Индокитая"
comfrance.1013.d:0 "После освобождения Индокитая из рук коварных бошей перед BGT встал вопрос о будущем бывшей колонии. Разумеется, некоторые фракции BGT, включая анархистов и ортодоксальных коммунистов, поддерживавших связи с местными социалистическими движениями, решительно выступают против любого вмешательства в местную политику, называя его «лицемерным», «реакционным» и «неоколониальным». С другой стороны, более националистические группы внутри PRS, SFIO и других организаций предлагают возобновить наше «попечительство» над бывшей колонией, направляя её к свету социализма и обеспечивая «вечное французское братство с азиатами». В связи с этим были предложены несколько кандидатов на должность губернатора. Первый - Александр Варенн, политик SFIO, обещающий провести ряд реформ, чтобы дать местным жителям почувствовать преимущества социализма и при этом сохранить поддержку оставшихся в Индокитае французских поселенцев. Второй - Александр Йерсен, пользующийся популярностью среди местного населения благодаря своим полезным исследованиям и помощи народам Индокитая. Наконец, мы можем полностью включить Индокитай в состав нашей Коммуны, поскольку, возможно, лишь прямое руководство позволит индокитайцам увидеть истинный свет социализма. Споры в BGT становятся всё ожесточённее, и решение должно быть принято."
comfrance.1013.a:0 "Мы освободители угнетённых народов, поэтому отвергнем это предложение!"
comfrance.1013.b:0 "Опираясь на мандат оставшегося французского населения Индокитая, отправить Александра Варенна."
comfrance.1013.c:0 "Благодаря популярности среди местных жителей должность займёт Александр Йерсен."
comfrance.1013.e:0 "Индокитай по праву является французским департаментом!"

comfrance.1014.t:0 "Освобождение Армении"
comfrance.1014.d:0 "Недавно мы наконец освободили гордый армянский народ из лап империалистов, прежде всего турок, веками пытавшихся поработить эту стойкую нацию. В Ереване уже создаётся новое, революционное, народное и демократическое правительство, однако армянское революционное движение по-прежнему раздирают внутренние распри, замедляющие создание нового армянского государства. Некоторые армянские революционеры обратились к нам за помощью, и, услышав их призыв, Мелине Манушян подала в BGT прошение отправить её в Ереван. Она сама армянка, родившаяся в 1913 году в семье государственных служащих, убитых турками во время Геноцида армян, когда ей было всего три года. С тех пор Мелине жила без гражданства и вскоре после Революции поселилась во Франции, но никогда не забывала родину, изучая армянский язык и документируя её историю. Хотя сама она близка к коммунистическому течению, Манушян известна умеренными взглядами, способностью к компромиссу и талантом переговорщика, что делает её идеальной кандидатурой для объединения Армении и предотвращения её внутреннего распада в тот самый момент, когда страна только начала познавать свободу."
comfrance.1014.a:0 "Пусть наши армянские братья сохранят нынешнюю форму правления."
comfrance.1014.b:0 "Немедленно отправить Мелине Манушян! Удачи, товарищ!"

comfrance.1015.t:0 "Кулинарная прокламация"
comfrance.1015.d:0 "Сегодня в Париже Mutuelle des Cuisiniers de France, объединение французской кулинарной элиты, выпустило очередной номер «La Revue Culinaire», журнала для французов, интересующихся гастрономией. Однако на этот раз «Culinaire» занял неожиданно резкую и шокирующую позицию, призвав к настоящему восстанию в кулинарном искусстве. Старые блюда, признанные развратными и слишком тесно связанными со старым режимом в Алжире, должны быть устранены, искоренены, уничтожены и оставлены лишь на страницах учебников истории. Главным примером подобного безобразия журнал называет спорное блюдо из маленькой овсянки.\n\nСначала статья лишь описывает способы приготовления блюда, включая ослепление крошечной певчей птицы и её утопление в бренди, однако затем сравнивает весь процесс с разнообразными общественными пороками, изображая бедную беззащитную овсянку молодой девой, над которой надругалась прожорливая толпа священников, капиталистов и милитаристов. Это шокирующее описание, сопровождаемое открытым призывом отказаться и от других подобных извращённых блюд старого режима, вызвало настоящий переполох во французских кулинарных кругах. Уже готовится масштабное соревнование, на котором должны быть представлены новые, более революционные и гуманные блюда."
comfrance.1015.a:0 "Долой буржуазное вырождение!"

comfrance.1016.t:0 "Вечная гонка"
comfrance.1016.d:0 "Несмотря на угрозу плохой погоды, сегодня, 13 июня, в Ле-Мане стартовала грандиозная марафонская гонка, продолжавшаяся до 14 июня. На трассу вышли целых 57 автомобилей из Франции, Британии, Италии, Америки и, что любопытно, Германии.\n\nСамо присутствие германских участников вызвало немало споров, хотя, что удивительно, главным образом с их собственной стороны. Три автомобиля, которые должны были принять участие в гонке, не смогли прибыть из-за забастовок в самой Германии после Чёрного понедельника, а обычно весёлые, энергичные и порой высокомерные немцы на этот раз выглядели подавленными сомнениями и явно мыслями о доме. Тем не менее после изнурительного марафона победу одержала французская команда господина Роже Лабрика, за рулём которой поочерёдно находились Робер Бенуа и Жан-Пьер Вимий. На Berliet Dauphine 21X команда преодолела невероятный 241 круг, что составило около двух тысяч миль! Сразу после блестящей победы германские команды обвинили французов в том, что в их Berliet тайно установлен двигатель Bugatti, утверждая, будто победители скрыли истинную природу своей машины.\n\nВо время победной речи, пока двигатель всё ещё грохотал на заднем плане, победители посвятили свой приз инженерам, Berliet и Франции - именно в таком порядке."
comfrance.1016.a:0 "Поздравляем, парни!"

comfrancegamelin.1.t:0 "Расправа над якобинцами"
comfrancegamelin.1.d:0 "После того как предательский режим PCF и его лидер Морис Торез были свергнуты генералом Гамеленом и товарищем Блюмом, в нашей стране всё ещё остаётся множество врагов, поддерживающих отвратительные идеи тоталитарной ленинской системы! Мы должны показать им, что не потерпим столь опасных взглядов, но каким образом это сделать? Следует ли проявить жёсткость к оставшимся под стражей якобинцам, разыскать остальных с помощью полиции и наказать их со всей суровостью, или же проявить милосердие, позволив осуждённым отбыть положенный срок, а затем попытаться вернуть их в общество?"
comfrancegamelin.1.a:0 "Никакой пощады! Найти предателей и расстрелять!"
comfrancegamelin.1.b:0 "Собрать их всех и отправить отбывать сроки в наших тюрьмах!"

comfrancegamelin.2.t:0 "Подготовка к процессам над якобинцами"
comfrancegamelin.2.d:0 "Теперь, когда новое правительство сделало первые шаги к стабилизации страны, настало время призвать руководство якобинцев к ответу за предательство Коммуны! Народный фронт после консультаций с Верховным судом направил повестки всем видным якобинским политикам, обязав их явиться на масштабный судебный процесс, призванный определить наказание за совершённое предательство. Заранее было решено, что лидер якобинцев Морис Торез предстанет перед отдельным судом, где его судьба будет решаться персонально. Также постановлено начать процесс над остальными руководителями как можно скорее."
comfrancegamelin.2.a:0 "Никто не стоит выше закона!"

comfrancegamelin.3.t:0 "Судебные процессы"
comfrancegamelin.3.d:0 "После непродолжительной подготовки настал день суда. На скамье подсудимых оказались более десятка человек, среди которых были известные политики и офицеры вроде Жака Дюкло и Марселя Кашена, ожидавшие своего приговора. Процесс растянулся на несколько дней и был наполнен драматическими речами обвиняемых и пламенными выступлениями прокуроров. Наконец, когда все подсудимые были выслушаны и исследование доказательств завершилось, суд удалился на совещание ещё на один день. Напряжение стало практически невыносимым, когда настал час оглашения приговора. Председатель Верховного суда начал свою речь, и приговор гласил..."
comfrancegamelin.3.a:0 "...Повесить тех, на ком лежит главная ответственность, остальных приговорить к пожизненному заключению."
comfrancegamelin.3.b:0 "...Пожизненное заключение! Пусть эти предатели навеки останутся в цепях!"

comfrancegamelin.4.t:0 "Суд над Морисом Торезом"
comfrancegamelin.4.d:0 "Неделю назад суд вынес приговор остальным руководителям якобинцев за совершённые ими преступления, а теперь глава этой коррумпированной тиранической клики должен столкнуться с ещё более страшной участью. Морис Торез, председатель PCF и предатель Коммуны, наконец предстал перед судом. Одно только оглашение всех обвинений заняло более двух часов, а последующий процесс продолжался свыше трёх дней, прежде чем суд завершил рассмотрение дела и удалился для вынесения приговора. На следующий день решение было наконец оглашено. Суд отверг пожизненное заключение ввиду тяжести преступлений и вместо этого приговорил Тореза к смерти через расстрел. На протяжении всего процесса он сидел спокойно, не проявляя никаких эмоций и не произнося ни слова, а когда после оглашения приговора ему предоставили последнее слово, Торез лишь молча смотрел прямо перед собой. После этого зал суда и толпа перед зданием разразились громовыми возгласами ликования. По всей Франции граждане праздновали конец предательского диктатора. На следующий день ровно в шесть часов утра смертный приговор был публично приведён в исполнение: Торезу завязали глаза, привязали к столбу, и когда пули вылетели из стволов расстрельной команды, толпа встретила это криками и аплодисментами. Так закончилось неудавшееся якобинское царство террора в нашей стране."
comfrancegamelin.4.a:0 "Смерть предателю! Да здравствует Франция!"

comfrancegamelin.5.t:0 "Объявить военное положение!"
comfrancegamelin.5.d:0 "Если мы хотим восстановить порядок и стабильность в стране, необходимо объявить военное положение и расширить исполнительные полномочия правительства. Народный фронт будет управлять государством и проводить реформы, тогда как вооружённые силы под командованием маршала Гамелена обеспечат контроль над населением. Это даст нам больше свободы действий и позволит проводить преобразования силой закона, однако подобное решение едва ли понравится народу, который опасается, что мы сами можем превратиться в то, что поклялись уничтожить..."
comfrancegamelin.5.a:0 "Сделать это! У нас нет другого выбора!"

comfrancegamelin.6.t:0 "Прокламация Гамелена"
comfrancegamelin.6.d:0 "«Товарищи! Друзья! Сегодня настал день, когда каждый француз сбрасывает цепи, удерживавшие его в плену до сих пор! Предательские козни якобинцев остановлены, а синдикалистско-демократический процесс в нашей стране восстановлен! Герои, добровольно отдавшие жизни за нашу свободу, никогда не будут забыты и навеки войдут в историю как герои Синдикалистской революции! Но одного разгрома PCF недостаточно для защиты нашей страны и революции, впереди ещё много работы! План реформ, подготовленный мной и моим правительством, включает три основных проекта, которые мы осуществим в ближайшие годы! 1. Укрепление демократического процесса в Коммуне посредством масштабной реформы избирательного законодательства, системы образования и проведения широкой антикоррупционной кампании! 2. Укрепление Коммунарского духа, лежащего в основе нашего государства, а также дальнейшее развитие синдикалистского образа жизни! И наконец, 3. Реформа армии и полиции, чтобы в будущем мы могли лучше защищаться как от внутренних угроз вроде PCF, так и от внешних врагов, прежде всего нашего заклятого противника - Германской империи! Когда этот план будет воплощён в жизнь, Коммуна восстанет и засияет с новой силой! Да здравствует революция! Да здравствует Федерация коммун Франции!»"
comfrancegamelin.6.a:0 "Вперёд, к светлому будущему! Да здравствует Франция!"

comfrancegamelin.7.t:0 "Гамелен воссоздаёт Национальную гвардию"
comfrancegamelin.7.d:0 "Хотя вооружённые силы сейчас делают всё возможное для восстановления порядка, солдат попросту недостаточно, чтобы патрулировать всю страну. Поэтому Гамелен решил создать добровольческое ополчение. Garde Nationale, Национальная гвардия, получившая название в честь организации, распущенной Третьей республикой после событий Парижской коммуны, должна стать жандармерией, задачей которой будет борьба с оставшимися очагами якобинского сопротивления, а также с возможной оппозицией со стороны других проблемных групп. Одетые в синие мундиры с узнаваемыми фуражками, гвардейцы будут вооружаться и обучаться непосредственно вооружёнными силами, чтобы действовать как дисциплинированное формирование."
comfrancegamelin.7.a:0 "Весьма символично."

comfrancegamelin.8.t:0 "Леон Блюм назначает свой кабинет"
comfrancegamelin.8.d:0 "До начала якобинского царства террора мало кто воспринимал Леона Блюма как будущего лидера Коммуны. После вступления Луи Ньеля в должность казалось, что BGT наконец обрёл некоторое подобие единства, однако продлилось оно недолго: борьба между Леоном Жуо и Бенуа Фрашоном внутри CGT продолжалась, тогда как Блюм, оставаясь заметной фигурой в SFIO, играл лишь второстепенную роль в соперничестве за пост Председателя BGT. Однако попытка якобинцев провести чистку среди политиков CGT заставила многих синдикалистов скрыться, оказаться в тюрьме или погибнуть, и именно в этот период хаоса Блюм вышел на первый план. Объединив своих товарищей с остатками CGT, республиканцами-социалистами и военными союзниками Гамелена, он создал единый фронт против Тореза.\n\nТеперь, став главой правительства и руководителем Коммуны под защитой маршала Гамелена, Блюм должен сформировать кабинет, способный сохранить единство Народного фронта. Он уже доказал, что является решительным и деятельным политиком, способным выстраивать отношения даже с политическими противниками, однако без общей угрозы со стороны якобинцев удержать весь Фронт единым будет куда сложнее."
comfrancegamelin.8.a:0 "Товарищ Блюм залечит раны нации!"
###  Decisions  ###

FRA_liberate_europe_category: "Освобождение Европы"
FRA_liberate_europe_category_desc: "Победа в Европе за нами! Остающиеся государства буржуазии находятся в нашей власти и готовы к гибели. Давайте воспользуемся этим шансом для продвижения революции и превратим большой европейский континент в нашу крепость социализма."

FRA_invade_liberation_target: "Атаковать [FROM.GetNameDef]"
FRA_invade_liberation_target_desc: "[FROM.GetNameDefCap] - слабый и умирающий режим, готовый к уничтожению, в атаку!"

FRA_internationale_category: "Вопросы Интернационала"
FRA_internationale_category_desc: "Союз всех социалистов в нашем мире действительно прекрасен. Мы будем работать вместе, чтобы сделать мир лучше для всех нас."

#WIP
FRA_phalanstere_category: "Phalanstère International"
FRA_phalanstere_category_desc: "Во время Второго Международного конгресса мы решили приступить к осуществлению амбициозного плана промышленных и экономических инвестиций для всех развивающихся социалистических стран, которые хотят подать заявку. Мы будем работать вместе, чтобы сделать мир лучше для всех нас."

#WIP
FRA_Develop_ENG: "Развивать [ENG.GetNameDef]"
FRA_Develop_ENG_desc: "Британия, уступая только нам, всё ещё нуждается в нашей помощи в восстановлении утраченной и забытой индустрии, которая когда-то была одной из лучших в мире. С нашей помощью Британия поднимется даже выше, чем её прославленное прошлое, посрамляя капиталистов и империалистов."

FRA_Develop_SRI: "Развивать [SRI.GetNameDef]"
FRA_Develop_SRI_desc: "Наши [SRI.GetAdjective]ие товарищи подали заявку на вступление в Phalanstère International. Учитывая, что итальянская республика, поддерживаемая Габсбургами, угрожает границе По, и яростно анти-синдикалистские Две Сицилии на юге, только уместно помогать нашим товарищам в их борьбе."

FRA_Develop_CNT: "Развивать [CNT.GetNameDef]"
FRA_Develop_CNT_desc: "Наши товарищи [CNT.GetNameDef] подали заявку на вступление в Phalanstère International. После тяжелых разрушений, вызванных Гражданской войной в Испании, можно только помочь нашим товарищам в их борьбе."

FRA_Develop_NOR: "Развивать [NOR.GetNameDef]"
FRA_Develop_NOR_desc: "Недавно наши скандинавские товарищи из Норвегии подали заявку на вступление в Phalanstères International. Социализм в Норвегии относительно молод, поэтому лучше его взращивать, пока мы можем."

FRA_Develop_BHC: "Развивать [BHC.GetNameDef]"
FRA_Develop_BHC_desc: "Наши [BHC.GetAdjective]ие товарищи подали заявку на вступление в Phalanstère International. Поскольку социализм в Индии сталкивается с империалистами в Дели и реакционерами в Федерации, только уместно помогать нашим товарищам в их борьбе."

FRA_Develop_MEX: "Развивать Мексику"
FRA_Develop_MEX_desc: "Наши мексиканские товарищи подали заявку на вступление в Phalanstère International. С социализмом сильнее, чем когда-либо, мы были бы дураками, если бы не закрепили этот плацдарм свободы."

FRA_Develop_Central_America: "Развивать [FROM.GetNameDef]"
FRA_Develop_Central_America_desc: "Наши [FROM.GetAdjective]ие товарищи подали заявку на вступление в Phalanstère International. С социализмом сильнее, чем когда-либо, мы были бы дураками, если бы не закрепили этот плацдарм свободы."

FRA_Develop_CEN: "Развивать [FROM.GetNameDef]"
FRA_Develop_CEN_desc: "Наши [FROM.GetAdjective]ие товарищи подали заявку на вступление в Phalanstère International после их недавнего объединёния. С социализмом сильнее, чем когда-либо, мы были бы дураками, если бы не закрепили этот плацдарм свободы."

FRA_Develop_Caribbean: "Развивать [FROM.GetNameDef]"
FRA_Develop_Caribbean_desc: "Наши [FROM.GetAdjective]ие товарищи подали заявку на вступление в Phalanstère International. Поскольку социализм в Карибском бассейне сталкивается с настоящей угрозой возмездия со стороны Канады, мы были бы глупцами, если бы не закрепили этот плацдарм свободы."

FRA_Develop_BRA: "Развивать [FROM.GetNameDef]"
FRA_Develop_BRA_desc: "Наши [FROM.GetAdjective]ие товарищи подали заявку на вступление в Фаланстер. Поскольку социализм в Бразилии сталкивается с упорным внутренним противодействием, следует только помочь им в их борьбе."

FRA_Develop_FOP: "Развивать [FOP.GetNameDef]"
FRA_Develop_FOP_desc: "Наши [FOP.GetAdjective]ие товарищи подали заявку на вступление в Фаланстер. После разрушений, вызванных чилийско-аргентинской войной, они остро нуждаются в нашей помощи, и мы обязаны помочь им в их борьбе."

FRA_Develop_South_America: "Развивать [FROM.GetNameDef]"
FRA_Develop_South_America_desc: "Наши [FROM.GetAdjective]ие товарищи подали заявку на вступление в Фаланстер. Поскольку социализм в Южной Америке сталкивается с упорным сопротивлением, только следует помогать нашим товарищам в их борьбе."

FRA_help_CNT: "Поставки CNT-FAI"
FRA_help_CNT_desc: "НКТ балансирует на грани. Мы должны обезопасить Испанию и нашу южную границу для социализма."

FRA_help_SOV: "Поддержать Советы"
FRA_help_SOV_desc: "Первая великая социалистическая революция в России закончилась неудачей, но вспыхнуло новое восстание. Мы не должны упускать эту возможность, чтобы превратить великого российского медведя реакции в верного союзника. Давайте поддержим Советский Союз."

FRA_help_south_america: "Помочь нашим [FROM.GetAdjective]им братьям"
FRA_help_south_america_desc: "Во время II Конгресса мы обещали помочь нашим южноамериканским товарищам развивать свою страну и победить реакционное государство Аргентину. Мы не пожалеем средств, чтобы обеспечить их победу и свободу всей Америки. Для товарищей нет ничего слишком хорошего!"

FRA_intervene_in_SRI: "Вмешаться в итальянскую войну"
FRA_intervene_in_SRI_desc: "В настоящее время мы не можем присоединиться к [SRI.GetNameDef] в их войне - если мы это сделаем, Германия или Австрия будут вынужденны вмешаться, и тогда начнётся Вельткриг. Однако, может быть, это не такая уж проблема?"
FRA_can_intervene_SRI: "§YТеперь мы сможем присоединиться к войне [SRI.GetNameDef]§!\n"

FRA_Sabotage: "Начать саботаж в [From.GetNameDef]"
FRA_Sabotage_desc: "[FRA_sabotage_decision_desc]"

FRA_sabotage_decision_NFA: "Французские предательские империалисты слишком долго использовали коренное население для собственного благополучия и материальных выгод. Мы этого не потерпим."
FRA_sabotage_decision_MOR: "Марокканское правительство - марионетка немецкой колониальной элиты. Мы сделаем всё возможное, чтобы в Марокко не было ни капиталистов, ни империалистов."

FRA_hydroelectricity_decisions: "Гидроэлектроэнергия"
FRA_Savoy_Hydroelectricity_decision: "Построить дамбы в Савойе"
FRA_Haute_Savoie_Hydroelectricity_decision: "Построить дамбы в Верхней Савойе"
FRA_Romandy_Hydroelectricity_decision: "Построить дамбы в Романди"

FRA_savoie_category: "Кризис Верхней Савойи"
FRA_savoie_category_desc: "Незаконная оккупация Швейцарии Верхней Савойи зашла слишком далеко, и угнетению местного французского народа необходимо положить конец. Швейцария силой воспрепятствовала воле народа, и наш долг - освободить наших французов."

FRA_demand_savoie: "Потребовать Верхнюю Савойю"
FRA_demand_savoie_desc: ""

FRA_invite_SRI_to_intl: "Пригласить [From.GetNameDef] в Третий Интернационал"
FRA_invite_SRI_to_intl_desc: "И Германия, и Австрия с подозрением относятся к созданию формального союза между Третьим Интернационалом и [From.GetNameDef], в соответствии с которым наши силы будут призваны помочь [From.GetNameDef] воссоединить Италию под властью синдикалистов. Однако, если в регион вмешается какая-либо крупная Держава или мы снова окажемся в состоянии войны с [GER.GetNameDef], тогда все ставки сняты."

FRA_join_phalanstere: "Присоединиться к международному Фаланстеру"

