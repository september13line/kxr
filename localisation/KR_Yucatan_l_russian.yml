yucatan.20.t: "Выборы [GetYear] года"
yucatan.20.d: "Первые выборы в новой Республике Юкатан вызывают огромный ажиотаж по всей стране. Разумеется, вопрос в том, кого народ выберет Президентом теперь, когда мы завоевали нашу независимость. При запрете радикальным партиям участвовать в выборах и при множестве демократических партий, борющихся за влияние, кто победит - остаётся лишь гадать."
yucatan.20.a: "Национальная партия общественного спасения."
yucatan.20.b: "Национальная санхуанистская партия."
yucatan.20.c: "Социалистическая рабочая партия."
yucatan.20.e: "Социалистическая партия Юго-Востока."

yucatan.201.t: "Выборы [GetYear] года"
yucatan.201.d: "Первые выборы в новой Республике Юкатан вызывают огромный ажиотаж по всей стране. Разумеется, вопрос в том, кого народ выберет Президентом теперь, когда мы завоевали нашу независимость. При допуске радикальных партий к участию в выборах и при множестве демократических партий, также борющихся за влияние, кто победит - остаётся лишь гадать."
yucatan.201.a: "Юкатекская национальная партия."

yucatan.21.t: "Выборы [GetYear] года"
yucatan.21.d: "В Юкатане вновь настало время очередных президентских выборов. Кого избиратели выберут, чтобы возглавить Республику в этот новый срок?"
yucatan.21.a: "Национальная партия общественного спасения."
yucatan.21.b: "Национальная санхуанистская партия."
yucatan.21.c: "Социалистическая рабочая партия."
yucatan.21.e: "Социалистическая партия Юго-Востока."
yucatan.21.f: "Национальная рабочая синдикалистская партия."
yucatan.21.g: "Юкатекская рутинерская партия."

yucatan.22.t: "Народ майя начинает уставать"
yucatan.22.d: "После десятилетий угнетения со стороны правительства народ майя Юкатана всё сильнее устал от Правительства. Одни опасаются, что народ майя может выдвинуть более решительные требования о представительстве, тогда как другие боятся, что народ майя может начать восстание против Правительства. Война Чан-Санта-Крус всё ещё свежа в памяти многих майя, и некоторые предлагают народу майя Юкатана поднять восстание, чтобы свергнуть угнетающее правительство и вернуть наследие своих могущественных предков. Если они преуспеют, то мечта Крусоб наконец сбудется."
yucatan.22.a: "Их мечта никогда не умирала, и теперь они вновь будут сражаться за неё."

yucatan.23.t: "Второе восстание Чан-Санта-Крус"
yucatan.23.d: "День настал. Народ майя поднял второе восстание против Правительства, во главе с генералом Франсиско Маем Печем. Многие в Юкатане думали, что Кастовая война закончилась, но внезапное восстание разрушило эту надежду. Теперь, без Мексики на нашей стороне, мы одиноки в этом конфликте. Поскольку восстание быстро распространяется из Кинтана-Роо, юкатекское Правительство и верховное командование испытывают вполне обоснованные страхи. Если майя победят, то они наконец исполнят свою мечту о независимом государстве майя впервые почти за 500 лет."
yucatan.23.a: "Майя свергают правительство и восстанавливают независимое государство майя!"
yucatan.23.b: "Мятежники майя отброшены и разгромлены!"

