YUC_defense_of_yucatan: "Юкатанское восстание"
YUC_defense_of_yucatan_desc: "Вырвавшись из-под мексиканской тирании, поскольку они всё больше посягали на наши права и свободы, наш Юкатан теперь свободен, но, стоя спиной к морю и имея у ворот мексиканских варваров, наше будущее как никогда неопределённо. С героем нашего восстания - генералом Сальвадором Альварадо Рубио - у руля нашего временного правительства, возглавляющего ориентированную на синдикалистов хунту, наша нация и наш народ готовы окопаться и держаться против любой угрозы, пока мы пытаемся укрепить наше новое положение и обеспечить независимость Юкатана. Ужасы Войны каст и зверства Мексики после их Революции будут отомщены, и народ Юкатана наконец обретёт свою свободу!"
YUC_division: "Инфантильная разделённая нация"
YUC_division_desc: "Пока генерал Альварадо ведёт нацию, а такие фигуры независимости, как Франсиско Май Печ и Фелипе Каррильо Пуэрто, находятся рядом с ним, наш новый временный режим медленно пытается достичь того, чего не смогло достичь ни одно правительство, правившее Юкатаном, - гармоничного федерализма. Из трёх составляющих его штатов - Кинтана-Роо, (Северный) Юкатан и Кампече - режим Альварадо пытается установить наше новое юкатекское государство как полуфедералистскую республику, которая допускает справедливые и свободные демократические выборы и автономию для её субъектов и различных меньшинств. Однако эта мечта всё ещё далека, ибо различные политические силы внутри нашей нации имеют свои собственные взгляды на то, как должен выглядеть этот союз, и множество других препятствий всё ещё стоят на пути единства Юкатана."
YUC_unclear_identity: "Туманная национальная идентичность"
YUC_unclear_identity_desc: "Со времён государства майя Чан-Санта-Крус, которое возникло в Кинтана-Роо в 1849 году и пало в 1915 году, на Юкатане не существовало независимого государства, и даже эта благородная попытка обрести суверенитет была подавлена до того, как смогла распространиться за пределы нашего южного побережья. На протяжении веков испаноязычные евро-мексиканцы размывали любое чувство национальной идентичности и автономизма, какое только могли, и поэтому разнородные народы нашего полуострова имеют лишь самое смутное представление об объединённой «юкатекской» идентичности. Мы должны укрепить то, что значит быть истинным сыном Юкатана, каким бы это ни стало в будущем, ибо без единой национальной идентичности нас, несомненно, снова поглотят мексиканские орды!"
YUC_unclear_economy: "Неопределённое экономическое будущее"
YUC_unclear_economy_desc: "Различные политические силы внутри нашей нации имеют конкурирующие и противоположные взгляды на то, как должна быть организована новая национальная экономика. Наш полуостров в значительной степени занят сельским хозяйством, лишь самые базовые признаки индустриализации заметны в крупных городах, таких как Мерида и Канкун, хотя у нас есть несколько безопасных портов, идеально подходящих для торговли. В то время как спорящие социалисты, капиталисты, традиционалисты и корпоративисты имеют свои собственные «идеальные» планы того, как поставить нашу экономику на правильный путь, наше экономическое будущее находится на распутье, и направление должно быть выбрано в ближайшее время, иначе наша экономика рухнет, даже не успев по-настоящему построиться."
YUC_radicalism_idea: "Радикальная политическая сцена"
YUC_radicalism_idea_desc: "От Красных рубашек Томаса Гарридо Канабаля до фанатиков майя и религиозных фанатиков Крусооб Франсиско Май Печа - множество радикальных групп со всего спектра борются за контроль над нашим Юкатаном. Поскольку демократические элементы и массы зажаты посередине, а Красный генерал Альварадо пытается сохранить мир под своей популистской, социалистически ориентированной хунтой, наш Юкатан раздирается изнутри внутренним экстремизмом, несмотря на наше опасное и шаткое положение, изолированное на этом полуострове, и пренебрежение к мексиканским волкам, рыщущим у наших границ. Это лишь вопрос времени, когда эта нестабильная ситуация достигнет предела, и то, каким будет Юкатан после этого, остаётся только гадать, но это не остановило каждую партию, парамилитарную организацию и радикальную группу в стране от подготовки к своему моменту для удара."

### Opinions ###

### Leader Bios ###
POLITICS_ALVORADO_DESC: "Красный генерал Юкатана, Сальвадор Альварадо Рубио - защитник юкатеков и главный зачинщик нашего восстания против Мексики. Родившийся в 1880 году в Синалоа, Альварадо не является уроженцем нашего полуострова, но он всё равно стал истинным сыном Юкатана. После детства, проведённого в постоянных переездах по северной Мексике со своей семьёй, и после недолгой карьеры фармацевта он занялся политикой. Он вступил в Либеральную партию Мексики в 1906 году, а затем в Антипереизбирательную партию, чтобы противостоять режиму Порфирио Диаса. Едва не попав в руки сил Диаса после того, как проник в военный лагерь и напал на федеральных солдат с группой молодых смутьянов, Альварадо бежал в штат Аризона (янки). В конце концов он вернулся в Мексику, присоединившись к армии добровольцев-изгнанников в Техасе, которая поклялась помочь Мадеро свергнуть режим Диаса, пересёк Рио-Гранде и помог свергнуть тирана. После изгнания Диаса другие поднялись, чтобы бросить вызов Мадеро, и произошли каскадные события, которые положили начало Мексиканской революции. Постоянно меняя стороны, беспорядочная Революция продолжалась годами, но Альварадо прошёл через всё это, в то время как его новые союзники и пожизненный интерес к социальной справедливости, феминизму и социалистической мысли толкали его всё дальше влево. Когда Революция подходила к концу, Альварадо оказался на стороне победителей, и в знак признания его таланта он был отправлен на полуостров Юкатан в качестве нового губернатора. Именно здесь Красный генерал столкнулся с бедственным положением местных жителей, воочию увидев ужасы, которые мексиканское правительство обрушило на юкатеков. Именно этот опыт изменил его лояльность, ещё глубже толкнув его в объятия социализма, и постепенно он сблизился с различными юкатанскими сепаратистскими группами. Проведя много лет на Юкатане ещё долго после того, как его срок губернатора истёк, Альварадо поддерживал тесные связи с ключевыми фигурами независимости, и после того, как антиюкатекская политика в мексиканском правительстве снова усилилась, Красный генерал и его союзники наконец сорвались. Организовав новое Юкатанское восстание, Альварадо разорвал цепи Мексики и теперь пытается обеспечить суверенитет Юкатана. Управляя нацией как благожелательный сильный лидер во главе своей военной хунты, этот Багровый каудильо готов стать автократом с бархатной рукой, в котором народ Юкатана и нуждается, и которого заслуживает."
POLITICS_ELVIA_PUERTO_DESC: "Сестра убитого президента Фелипе, Эльвия Каррильо Пуэрто теперь ведёт Третью Юкатанскую республику примерно по тому же пути, который её брат планировал пройти до того, как был убит. Будучи убеждённой социалисткой и феминисткой, как и её брат, Эльвия имеет долгую историю в левой политике Юкатана, будучи одной из первых трёх женщин-представителей, избранных в Конгресс Юкатана в 1923 году в качестве члена Социалистической партии Юго-Востока. С тех пор она боролась за то, чтобы принести Революцию на наш полуостров, поддерживая социалистический аграризм, коллективизацию, эгалитаризм и другие стандартные социалистические политики, а также сильно подчёркивая важность роли женщины в Революции. Страдая от смертей, она потеряла и своего брата от рук убийцы из Красных рубашек, и своего мужа от рук повстанцев-кристерос, но независимо от того, какие препятствия возникали перед ней, Эльвия сокрушала их. Будучи ярым юкатекским патриотом и мудрым, рациональным лидером, Эльвия Каррильо Пуэрто принесёт равный и справедливый рай на этот полуостров, ведя Юкатан в качестве своей первой женщины-главы исполнительной власти."
POLITICS_CANABAL_DESC: "Томас Гарридо Канабаль, аутсайдер с асьенд Чьяпаса, родившийся в 1891 году, попал на Юкатан через Революцию. Назначенный временным губернатором Табаско, правление Канабаля отличалось жёстким применением местных законов и вендеттой против церкви. Многие местные священники Табаско были либо убиты, либо вынуждены бежать. Его правление ознаменовалось полным запретом алкоголя, корсетов и надгробий, среди прочего; Канабаль также поддерживал социальное развитие штата через сельское хозяйство и право женщин голосовать. Он быстро стал одним из лиц антиклерикализма в Революции, встав на сторону политики Плутарко Кальеса и кампаний против кристерос, и Красные рубашки Канабаля были основаны на терроризировании римских католиков. Теперь, когда весь полуостров под его контролем, ясно, что Канабаль продолжит свою антиклерикальную вендетту, только в более крупном масштабе."
POLITICS_FELIPE_PUERTO_DESC: "Полноценный уроженец Юкатана, Фелипе Пуэрто, родился в гороте Моталь в 1874 году, расположенном менее чем в 50 километрах от Мериды. Будучи носителем майятана (майянского языка), Пуэрто начал свою взрослую жизнь как писатель для El Heraldo de Motul - газеты, которая под его влиянием перешла на более социалистические взгляды. Он выступал за земельную реформу и права коренных народов, и El Heraldo была ненадолго закрыта за критику государственных чиновников. Пуэрто работал репортёром в Revista de Merida, пока не занял пост губернатора Юкатана в 1922 году. Имея власть правительства Юкатана, Пуэрто конфисковал крупные поместья, чтобы вернуть их майя, и подорвал масштабную образовательную реформу, курируя открытие более 400 школ на Юкатане. С победой Юкатанского восстания Пуэрто больше не должен заискивать перед центром власти на севере - он может принести будущее на Юкатан так, как сочтёт нужным."
POLITICS_FRANSCISO_MAY_DESC: "Франсиско Май Печ, последний генерал Войны каст, отомстил за своих павших товарищей и вернул полуостров Юкатан под власть своих братьев-майя. Гордый воин, Май родился в 1884 году и стал капралом майянских повстанцев, не достигнув восемнадцати лет, а после смерти Фелипе Яма Печ объявил себя Верховным главнокомандующим армий майя. Когда режим Порфирио Диаса подошёл к концу, Сальвадор Альварадо взял под контроль юкатекские армии и приказал своим солдатам покинуть Чан-Санта-Крус и передать командование майя, передав им полный контроль над регионом. После завершения Мексиканской революции Май вернул командование своей территорией; и в обмен получил важные уступки, включая право на эксплуатацию ценных запасов камеденосных деревьев на Юкатане.\n\nВ последующие годы власть Мая начала ослабевать, поскольку многие майянские вожди начали ему не доверять. После избрания Сапаты Май был изгнан из региона Чан-Санта-Крус и вынужден был поселиться в Оксткуцкабе.\n\nВторой шанс Мая пришёл к власти во время военного свержения мексиканского государства, когда в дни, последовавшие за переворотом, Май сплотил своих собратьев-майя против военного режима и Золотых рубашек, присоединившись к Альварадо, когда тот объявил Юкатан независимой территорией; и в конечном итоге сменил Красного генерала после его опалы. Теперь, с этим старым ветераном Войны каст, твёрдо контролирующим полуостров, ожидается возрождение культуры майя, однако точная форма этого возрождения оспаривается. Вернётся ли генерал Май к своим корням - католическо-майянскому восстанию Чан-Санта-Крус, или же он примет истинные, доколониальные корни цивилизации майя?"

### Military Focuses ###
YUC_the_military: "Юкатекские вооружённые силы"
YUC_the_military_desc: "Наша история самообороны пронизывает временную военную структуру. Юкатекские милиции снова призываются на службу для защиты своих домов от тиранического правительства Куидадо."
YUC_high_command: "Юкатекское верховное командование"
YUC_high_command_desc: "В Муниципальном дворце Мериды наши высшие офицеры собрались вместе, чтобы спланировать защиту наших свобод. Эклектичная смесь бывших революционеров, милиционеров, красногвардейцев и местных добровольцев даёт нам разнообразный опыт, на который можно опереться."
YUC_barricades: "Баррикады Мериды"
YUC_barricades_desc: "Первый приказ - забаррикадировать широкие проспекты Мериды и перекрыть главную дорогу. Мы не можем рисковать, позволяя предателям Куидадо проникнуть в наш город в это время национального кризиса."
YUC_national_joint_command: "Национальное объединённое командование"
YUC_national_joint_command_desc: "В городе находятся штаб-квартиры нескольких мексиканских боевых командований, включая Escuela Superior de Guerra. Президент приказал начальнику штаба объединить оставшиеся в новое Национальное объединённое командование для наилучшего использования наших скудных людских ресурсов."
YUC_reform_national_army: "Реформировать национальную армию"
YUC_reform_national_army_desc: "Наша разваленная организация остро нуждается в реформе. Генерал Сальвадор Альварадо предложил комплекс упражнений, который использовался в Colegio Militar для быстрой подготовки солдат к службе, что не слишком далеко от их домов."
YUC_improve_equipment: "Улучшить снаряжение"
YUC_improve_equipment_desc: "Наш арсенал в основном состоит из остатков оружия революции 1910 года и того, что лоялисты привезли с собой на Юкатан. Стоит приобрести более совершенные конструкции винтовок и подготовиться к затяжному конфликту после того, как чрезвычайная ситуация закончится."
YUC_reverse_engeneering: "Обратный инжиниринг"
YUC_reverse_engeneering_desc: "Там, где мы не можем купить, мы должны украсть. Стрелковое оружие, провезённое контрабандой через блокаду, передаётся нашим механикам для попытки обратного инжиниринга всего, что может сработать в нашу пользу."
YUC_army_infrastructure: "Армейская инфраструктура"
YUC_army_infrastructure_desc: "Юкатанской армией нельзя управлять из Муниципального дворца. Мы перенесли наш штаб в Casa de Montejo, где сможем лучше организовать цепочку снабжения армии для помощи нашему суверенитету."
YUC_maya_expertise: "Опыт майя"
YUC_maya_expertise_desc: "Если мы хотим когда-либо перерезать цепочку снабжения врага, нужно задействовать многовековой опыт уклонения от армии Куидадо. Начальник штаба призвал старых майя помогать в передвижении по старым индейским тропам и помогать подразделениям выживать, когда их запасы продовольствия истощаются."
YUC_call_to_arms: "Призыв к оружию"
YUC_call_to_arms_desc: "Хотя население Юкатана полон энтузиазма и благодарности за то, что наконец освободилось от Куидадо, их приверженность войне могла бы быть и лучше. Мы должны использовать культурные достижения многих поэтов Юкатана, призванных на военную службу."
YUC_war_of_resistance: "Война сопротивления"
YUC_war_of_resistance_desc: "Победа в этой самой значительной войне с правительством Куидадо потребует лояльности каждой деревни. Солдаты, которые любят свои дома, будут сопротивляться тирании до последнего вздоха."
YUC_star_war: "Звёздная война"
YUC_star_war_desc: "Для наших предков войны большого значения часто казались, будто звезда излила свою жизненную силу на землю. Поскольку мы сосредотачиваемся на приобретении нового дальнобойного оружия, некоторые думают, что однажды их жестокие путешествия по небу вселят подобное суеверие в наших врагов."
YUC_foreign_legion: "Майянские рейнджеры"
YUC_foreign_legion_desc: "Наши эксперты по майя организовались в специальные дивизии, пригодные для глубоких операций в тылу врага. Эти майянские рейнджеры будут перехитрять более неповоротливых, медленных врагов."
YUC_artillery_brigades: "Артиллерийские бригады"
YUC_artillery_brigades_desc: "Артиллерийские бригады были подарком судьбы, когда мы услышали, как они вкатываются в Мериду. Это позволит нам пережить долгую осаду, если враг доберётся до нашей столицы."
YUC_maya_code: "Майянский кодекс"
YUC_maya_code_desc: "Традиционная система сезонных конфликтов майя была разрушена за последнее столетие вторжениями мексиканского правительства. Уроки, извлечённые из избегания долин летом, были утеряны для армии Куидадо, но мы их всё ещё помним."
YUC_modern_division_structure: "Современная дивизионная структура"
YUC_modern_division_structure_desc: "Дальнейший оптимизм приходит из-за блокады в виде руководств по военной подготовке. Наше Национальное объединённое командование готово реорганизовать наши дивизии для борьбы в будущем против общевойсковых врагов."
YUC_drill_the_natives: "Обучать туземцев"
YUC_drill_the_natives_desc: "В то время как майянские рейнджеры работали превосходно, обычные майянские ополчения, кажется, относятся к конфликту с некоторым безразличием. Мы - республика, и они - граждане, а не свита. Эти солдаты должны получать такую же подготовку, как и житель Мериды."
YUC_production_sites: "Производственные площадки"
YUC_production_sites_desc: "Расчистка новых земель для производственных площадок является необходимостью, так как пригодная для использования земля на Юкатане очень ценится."
YUC_naval_docks: "Военно-морские доки"
YUC_naval_docks_desc: "Наш единственный доступ к внешнему миру, Прогресо, не имеет современные военно-морские сооружения. Для того чтобы вырвать нас из пузыря, была построена верфь, названная в честь отдалённости города, - Terminal Remota."
YUC_protect_coasts: "Защита нашего побережья"
YUC_protect_coasts_desc: "Эта новая верфь является очевидной целью для рейдеров. Мы должны выделить ещё немного промышленного производства для защиты Terminal Remota."
YUC_the_navy: "Флот Юкатана"
YUC_the_navy_desc: "Знамя Юкатана теперь развевается над оборонительным флотом - первым шагом к проецированию нашей мощи за пределы полуострова."
YUC_air_force: "Военно-воздушные силы Юкатана"
YUC_air_force_desc: "Несколько переоборудованных сельскохозяйственных самолётов-опылителей добрались до расчищенного поля за городской чертой. Эти первые шаги к созданию военно-воздушных сил окупятся как независимая нация."
YUC_airplane_aquistions: "Приобретение самолётов"
YUC_airplane_aquistions_desc: "Дальнейшие связи в Гватемале обеспечили нам самолёты с некоторыми оборонительными возможностями. Ничего серьёзного, но символическая победа над окружающей средой и Куидадо."
YUC_aerial_drills: "Лётные учения"
YUC_aerial_drills_desc: "Небольшая группа храбрых мужчин вызвалась добровольцами для полётов с инструктором из США. Эти учения позволят наилучшим образом использовать наши возможности для борьбы с более крупными силами."
YUC_one_final_effort: "Защита Юкатана"
YUC_one_final_effort_desc: "Хотя мы так молоды как нация, коллективные усилия наших вооружённых сил ставят нас на один уровень с другими независимыми республиками, такими как Коста-Рика, которые защищают свою независимость уже столетие."

### Political Focuses ###
YUC_yucatec_democracy: "Независимость Юкатека обеспечена"
YUC_yucatec_democracy_desc: "Последние семьдесят лет юкатеки боролись за демократическое представительство со стороны Куидадо. Навязывание политики Hispanidad и La Raza мексиканским правительством переполнило чашу нашего терпения и вызвало наше пламенное восстание, которое теперь привело к созданию нашего собственного независимого государства. Мы никогда больше не подчинимся иностранным угнетателям и диктаторам любого рода, ибо Юкатан наконец свободен!"

YUC_maya_victory: "Триумф майя"
YUC_maya_victory_desc: "Правление испанских ублюдков подошло к концу! Народ майя сплотился вокруг генерала Франсиско Мая Печа, и с возрождённым нативистским духом они вытеснили мексиканцев с Юкатана и заявили, что цивилизация майя не мертва! Мстя за Войну каст и призывая к новому возрождению культуры, языка, общества майя, Франсиско Май Печ накажет испанских колонизаторов и свершит нашу месть, возрождая нашу подавленную идентичность к былой славе и дальше."

YUC_ode_to_sacrafice: "Антииспанизм"
YUC_ode_to_sacrafice_desc: "Хотя многие люди в этой великой нации имеют законное происхождение майя, другие всё ещё говорят на языке испанцев! Этот факт и дальнейшее существование отчётливой испанской идентичности на нашем Юкатане совершенно неприемлемы! Против испанского языка и культуры будут введены жёсткие законы, ибо мы отразим на них сотни лет угнетения."
YUC_remember_the_castle_war: "Помни Войну каст"
YUC_remember_the_castle_war_desc: "Война каст на Юкатане официально длилась с 1847 по 1901 год, но наши храбрые патриоты и борцы за свободу продолжали борьбу вплоть до 1930-х годов, никогда не сдаваясь и наконец добившись для нашего народа майя заслуженной независимости после десятилетий борьбы и столетий угнетения. Теперь, когда наша свобода обеспечена и наше новое государство консолидируется, пришло время почтить память павших и вспомнить их жертвы, а также жертвы других борцов в нашей истории, таких как Хасинто Канек и Текун Уман, а также подготовиться к неизбежному возвращению войны. По всей стране будут построены военные мемориалы и памятники, будут созданы фонды для компенсации семьям наших воинов и их вдовам, и одновременно наше государство построит новые бункеры на наших границах и склады боеприпасов в глубине территории, чтобы подготовиться к европейцам и их вероятному возмездию."
YUC_death_to_european_mexico: "Смерть «Латинской» Америке"
YUC_death_to_european_mexico_desc: "Регион, в котором мы живём тысячелетиями, стал известен как «Латинская» Америка - пятно на нашей земле, которое одновременно отрицает наше существование и принижает нашу культуру и влияние на эти земли. Мы должны работать над искоренением этого глупого, евроцентричного ярлыка и восстановить величие нашей Мезоамерики. Эпоха управляемого европейцами Юкатана подойдёт к концу, любой ценой!"

YUC_chan_santa_cruz: "Чан-Санта-Крус отомщён"
YUC_chan_santa_cruz_desc: "Старое государство Чан-Санта-Крус было центром синкретического религиозного движения, которое сочеталось культуру майя с католической верой, борясь за независимость майя на Юкатане. Их недолговечное феодальное владение, сосредоточенное на нашем восточном побережье, было последним независимым государством коренных майя, окончательно исчезнувшим после формального окончания Войны каст в 1915 году. С успехом движения Франсиско Мая Печа и с его официальным провозглашением, поддерживающим идеи и принципы государства крусооб, похоже, что падение Чан-Санта-Крус наконец отомщено. Да здравствуют независимые люди майя, да здравствует крусооб!"
YUC_cruzoob_faith: "Вера крусооб"
YUC_cruzoob_faith_desc: "Вера крусооб, также известная как Культ Говорящего Креста, является синкретической религией, сочетающей древнюю веру майя с католическими догматами, образуя синтез европейских и мезоамериканских идей, полностью приспособленный к духовным потребностям современных майя. Признавая несколько древних текстов майя, календарь майя, песнопения майя и традиционную музыку, травники и другие древние аспекты духовности майя, эта вера вращается вокруг космического календаря, христианской морали и пантеона мезоамериканских богов, многие из которых смешаны с христианскими фигурами, а главный бог - К'у - является смесью христианского Бога и древнего бога-творца майя. Сам Май Печ является ярым сторонником этой веры и теперь сделает так, чтобы весь Юкатан также практиковал эту одну, истинную веру."
YUC_mayan_catholicism: "Тотальный майя-католический синкретизм"
YUC_mayan_catholicism_desc: "Поднимая синкретизм религии крусооб на совершенно новый уровень, Май Печ выступил за полное объединение двух вер. Христианская вера сама по себе запрещена, разрешены только крусооб и другие родные веры. Более того, все католические церкви в стране были захвачены и начали превращаться в святилища для наших многочисленных богов. Ещё больше христианских догматов были приняты и адаптированы к потребностям и верованиям нашего народа, и две религии действительно стали едины здесь, на Юкатане. При Май Пече эта новая полностью объединённая вера станет клеем, скрепляющим нашу нацию и народ, и щитом, защищающим нас от колонизаторов."
YUC_state_of_the_cross: "Государство Говорящего Креста"
YUC_state_of_the_cross_desc: "Под руководством Франсиско Мая Печа полуостров Юкатан наконец в безопасности. Народ майя и наша культура защищены нашей новой синкретической верой, а ужасы Войны каст и падение Чан-Санта-Крус отомщены. Мы - государство, всецело посвящённое Культу Говорящего Креста, и наша преданность принесёт нам спасение и процветание. Май Печ - наш пастырь, а вера крусооб - наш проводник. Вперёд, к судьбе!"

YUC_new_ajaw: "Возвышение нового Ахау"
YUC_new_ajaw_desc: "Древняя цивилизация майя просуществовала тысячи лет, никогда не централизуясь, но процветая, пока наконец не рухнула под натиском испанцев в 1697 году после столетий упадка, канув в Лету, поскольку народ майя был вынужден интегрироваться в испано-мексиканское общество. Однако с успехом генерала Франсиско Мая Печа эта поздняя, великая цивилизация может снова вдохнуть жизнь! Новый благородный класс низших ахау - или вождей - был коронован, состоящий из Мая Печа и его ближайших союзников, а также самых видных фигур на Юкатане, которые поклянутся в верности Маю Печу и этому новому государству. Каждый из этих новых ахау возглавит город или поселение, помогая нашему новому отцу нации вести страну по пути полного восстановления майя."
YUC_mayan_pantheon: "Почитание пантеона майя"
YUC_mayan_pantheon_desc: "Древние боги религии майя будут вновь почитаться в нашем государстве, ибо мы должны доказать, что мы истинные дети Кетцалькоатля и других богов. Наш старый пантеон восстанет, традиционные подношения и жертвоприношения вернутся, старый космический календарь будет обновлён, и старое жречество поднимется, чтобы вести наш народ. Многие из наших недавно возвышенных ахау станут этими новыми духовными наставниками, а Франсиско Май Печ станет верховным жрецом нации. Мы возродим веру наших предков и наконец сотрём любое и всякое европейское влияние с наших душ и нашей идентичности."
YUC_revive_mayan_language: "Возродить культуру майя и язык майя"
YUC_revive_mayan_language_desc: "Считалось, что оригинальная культура майя была утеряна сотни лет после нашего падения перед испанцами в 1600-х годах. Веками до нашего возрождения наша культура и язык гнили под испанизмом. Но теперь, когда народ майя поднимается из грязи и возвращает судьбу своего народа и нашего Юкатана в свои руки, наша культура может снова процветать! Испанцы, мексиканцы и глупцы Центральной Америки больше не будут порочить великолепие майя. Наша культура будет восстановлена, наш язык распространён, и наша идентичность будет перекована, когда Май Печ поведёт нас в новый золотой век майя!"
YUC_neo_maya: "Восстановленная цивилизация майя"
YUC_neo_maya_desc: "Поскольку культура и религия майя распространяются по Юкатану, а наш восстановленный язык майя укореняется, цивилизация майя действительно вернулась на эту Землю после того, как была почти уничтожена испанцами. Теперь Франсиско Май Печ наконец объявил о своём главном амбиции. Возвысившись как К'ухуль Ахау - или «Божественный Вождь» - и взяв королевское имя Ки'нич Ханааб Пакаль IV в честь оригинального Пакаля Великого - самого долго правящего монарха Нового Света и величайшего ахау майя и его потомков, Франсиско Май Печ больше не существует. Теперь Пакаль IV будет править как К'ухуль Ахау нашего возрождающегося государства майя, одержимый идеей создать первую Империю майя."

YUC_primitive_land: "Примитивистское земледелие"
YUC_primitive_land_desc: "Следуя принципам, заложенным нашими предками, мы будем обрабатывать землю так же, как и они - хотя и используя современные практики и технологии, смешанные с традиционными методами и знаниями. Подсечно-огневое земледелие, севооборот, расчистка джунглей для освоения земли станут ключевыми инструментами государства для построения нашей новой цивилизации майя. Старая архитектура майя возродится, а старые ремёсла и практики, используемые рабочими и фермерами среди наших предков, будут использованы с максимальной эффективностью. Мы усовершенствуем методы прошлого и построим новое государство майя, не теряя из виду традиции."
YUC_agrarian_economics_natpop: "Аграризм майя"
YUC_agrarian_economics_natpop_desc: "Экономика нашего возрождающегося государства майя будет построена вокруг сельского хозяйства, ибо это то, что мы знаем лучше всего. Посвящая большие участки земли выращиванию товарных культур, мы привлечём наших друзей через Тихий океан и через Новый Свет к покупке наших товаров, а остальная часть наших пахотных земель пойдёт на производство продовольствия и животноводство для пропитания нашего растущего населения. Мы построим новую, самодостаточную и процветающую экономику на спинах наших благородных фермеров, и мы будем компенсировать и обеспечивать этих экономических героев, ибо наши сельскохозяйственные рабочие являются опорой нации."
YUC_anti_european_trade: "Антиевропейская экономика"
YUC_anti_european_trade_desc: "Хотя Запад имеет благоприятные рынки, которые просто умоляют о получении прибыли, мы не можем проглотить свою гордость и торговать с колонизаторами. Вместо этого мы обратим взор на Восток через Тихий океан и сюда, на наш собственный континент, в поисках торговых партнёров и экономических сделок, которые действительно ставят во главу угла наши потребности или, по крайней мере, учитывают их. Обращаясь к таким державам, как Перу, Япония, Гаити и другие, мы построим свою собственную стабильную и самодостаточную экономику, не поворачиваясь спиной и не возвращаясь к испанцам и их империалистическим друзьям."

YUC_march_to_reclaim_our_people: "Марш за возвращение нашего народа"
YUC_march_to_reclaim_our_people_desc: "Теперь, когда цивилизация майя восстановлена и возрождена, пришло время выступить в поход. По всей Мезоамерике различные группы народов майя чахнут под европейским и испанским угнетением. Мы освободим этих собратьев - детей Кетцалькоатля, приближая нашу империю к реальности!"
YUC_reclaim_the_empire: "Объединить народ майя"
YUC_reclaim_the_empire_desc: "В то время как культура майя снова процветает на нашем Юкатане, наши братья на других землях бывшей цивилизации майя всё ещё стонут под сапогом европейского влияния. Мы должны собрать наши силы и в конце концов нанести удар по европейцам и их приспешникам - от Табаско и Чьяпаса до Гватемалы, Белиза и Гондураса, наконец вернув утраченное наследие майя! Однако на первом этапе консолидации народа майя мы приступим к завоеванию второй родины нашего народа - Гватемалы и Белиза! На этих территориях живут киче-майя и какчикель-майя, а также кекчи-майя соответственно; эти давно изолированные осколки основного населения майя должны быть освобождены!"
YUC_reintergrate_the_empire: "Централизовать старые города-государства"
YUC_reintergrate_the_empire_desc: "Теперь, когда старые сердца павшей цивилизации майя на Юкатане возвращены, мы можем начать процесс исправления ущерба, нанесённого европейцами. Города-государства наших предков наконец объединены под одним знаменем впервые в истории, и теперь Франсиско Май Печ стремится централизовать власть этих составляющих городов-государств, отобрав её у местных назначенных ахау и сосредоточив в своих руках, чтобы построить сильное и стабильное государство майя, а возможно, и нечто большее."
YUC_the_empire_breathes_again: "Рождение первой Империи майя"
YUC_the_empire_breathes_again_desc: "Наша праведная и когда-то мёртвая цивилизация восстановлена - старые земли майя от Мексики до Гондураса и далее в наших руках. Впервые в истории народ майя объединён под одним знаменем - их собственным знаменем, а не знаменем какой-то колониальной державы. Мы наконец восстановили наследие Пакаля Великого и первоначальной цивилизации майя, и теперь под властью К'ухуль Ахау Ки'нич Ханааб Пакаля IV первая Империя майя восстанет из пепла колониализма и империалистического угнетения. Да здравствуют майя, да здравствует Пакаль IV!"
YUC_wipe_out_european_mexico: "Уничтожить европейскую Мексику"
YUC_wipe_out_european_mexico_desc: "Мезоамерику поразила и заразила вирулентная болезнь. Центральным элементом этой европейской чумы является гнусная пустошь, которой стала Мексика, где эти мерзкие испанцы властвуют над нашими братьями цоциль и цельталь, живущими в высокогорьях Чьяпаса и Табаско. Со времён Мексики и Империи ацтеков и до наших дней мы воевали с обитателями Мехико. Наконец пришло время положить конец этой многовековой борьбе. Мы идём на Теночтитлан, чтобы восстановить истинно родную Мезоамерику!"
YUC_flower_wars: "Новые Цветочные войны"
YUC_flower_wars_desc: "К югу лежат земли Центральной Америки - старые охотничьи угодья народа майя. Эта кровавая арена была местом наших Цветочных войн - войн между городами-государствами, поселениями и племенами для поддержания баланса сил между цивилизациями Мезоамерики, а также для захвата рабов для использования в ритуальных жертвоприношениях и для труда. Мы возродим эту традицию, выступив в Центральную Америку, чтобы укротить эти дикие земли и принести новую эру внутренних Цветочных войн для расширения нашей империи и омоложения нашей культуры."
YUC_join_co_prosperity_sphere: "Вступить в Сферу сопроцветания"
YUC_join_co_prosperity_sphere_desc: "Далеко на востоке лежит одна из величайших незападных держав на Земле - Империя Япония. Яростно антиевропейская и полная решимости построить своё собственное место под солнцем, свободное от западных связей, она станет идеальным союзником для нашего молодого государства. Мы обратимся к Стране восходящего солнца с дипломатическими предложениями и дарами, чтобы завоевать расположение императора и его правительства и получить право вступить в Сферу сопроцветания. Вместе мы будем бороться с западным и европейским влиянием, где бы оно ни возникало."

YUC_Purge_Red_Shirts: "Уничтожить Красные рубашки"
YUC_Purge_Red_Shirts_desc: "Мерзкие Красные рубашки Канабаля - пятно на нашем Юкатане и бельмо на глазу нашего режима. Это препятствие для нашего полного контроля и этот гнусный источник социалистического влияния должны быть искоренены, чтобы обеспечить наш новый режим. Мы идём в джунгли Юкатана, чтобы раз и навсегда уничтожить этих багровых партизан!"
YUC_Fortify_Yucatan: "Укрепить Юкатан"
YUC_Fortify_Yucatan_desc: "Наш Юкатан находится в легко обороняемой позиции, окружённый естественными барьерами и прижатый к Мексиканскому заливу за густыми джунглями и пересечённой местностью. Мы используем это в своих интересах, превратив Юкатан в живую крепость. Из этого плотного роя бункеров, траншей, туннелей и зарослей мы выстоим и защитим наш Юкатан от любого и всякого врага. Наш режим не падёт от внешних сил, пока они не убьют каждого из нас и не сотрут в пыль наши обширные оборонительные сооружения!"

YUC_authoritarian_democrats: "Альварадо у руля"
YUC_authoritarian_democrats_desc: "Человек, который привёл нашу нацию к независимости и пытался защитить нас от мексиканской агрессии во время своего пребывания на посту губернатора, Сальвадор Альварадо, обеспечил свою власть над Юкатаном. Теперь, когда наша революция увенчалась успехом, этот имеющий красноватый оттенок и популистский генерал поведёт нашу нацию к прогрессивному гуманизму и трудовым принципам под своим железным кулаком в бархатной перчатке."
YUC_Labor_Economics: "Трудовая экономика"
YUC_Labor_Economics_desc: "Стремясь провести свои давно поддерживаемые реформы, теперь, когда ему больше не нужно отчитываться перед Мехико, президент Альварадо начал внедрять эти необходимые изменения в нашем обществе. Организовав Casa del Obrero Mundial (Дом мирового рабочего) для поощрения профсоюзного движения и политического участия, Альварадо также принял ряд новых законов, направленных на создание государства всеобщего благосостояния, включая минимальную заработную плату, максимальную продолжительность рабочего дня, минимальные стандарты работы, компенсацию за несчастные случаи, детские нормы и право на забастовку, а также запретив работодателям навязывать свои религиозные убеждения работникам. С этими и другими трудовыми принципами мы построим сияющую розовую жемчужину здесь, на Юкатане."
YUC_Agrarianism: "Юкатекский аграризм"
YUC_Agrarianism_desc: "Принимая наши сельские реалии и юкатекское наследие аграризма и земледелия в этом райском уголке джунглей, Альварадо добился массового расширения сельскохозяйственного сектора, чтобы сделать его основой нашей модернизированной промышленности и экономики. Крупные поместья будут раздроблены и проданы независимым фермерам по разумным ценам, чтобы передать экономическую власть от элитных землевладельцев народу. С новыми фермами, плантациями и даже несколькими добровольными и экспериментальными трудовыми коллективами мы превратим этот зелёный полуостров в житницу Центральной Америки."
YUC_Education_Reform: "Дать образование массам"
YUC_Education_Reform_desc: "После того как экономика в значительной степени устроена, а ситуация с землевладельцами решена, Альварадо обратил своё внимание на реформу образования. Приняв законы, делающие образование обязательным, светским и бесплатным для всех граждан, Альварадо поднимет массы. Теперь школьные программы будут сосредоточены на грамотности, чтении, письме, арифметике и гражданской ответственности, с дополнительными курсами и школами, строящимися для изучения сельского хозяйства, изящных искусств и других различных ремёсел и навыков. Жемчужиной этих новых школ станет Escuela Libre de Derecho - бесплатное академическое учреждение для преподавания права, экономики и политологии лучшим и умнейшим нашей нации, хотя любимым детищем Альварадо является новая консерватория музыки, построенная в столице. К концу этого плана мы создадим более 1000 новых школ, некоторые из них совместного обучения, а также 300 библиотек - всё это, чтобы принести свет знаний на наш свободный полуостров."
YUC_Control_The_State: "Контролировать Юкатан"
YUC_Control_The_State_desc: "Наш Юкатан всегда был диким и необузданным краем, но теперь, когда у руля Альварадо, всё это, надеюсь, изменится. Стремясь принести порядок, дисциплину, закон и справедливость на наш полуостров, Альварадо начал внедрять свои воинские установки в сердца и умы общественности. Мы закалим это государство и выкуем из него стойкий и упорядоченный край, основанный на принципах истинной справедливости и морали - нацию из стали, поддерживаемую эгалитарной и популистской подушкой, которой являются государство всеобщего благосостояния и либеральные реформы Альварадо."
YUC_SocDem_Junta: "Прогрессивная диктатура"
YUC_SocDem_Junta_desc: "Будучи долгое время учеником как европейской и американской феминистской теории, так и социализма, Альварадо начал создавать истинно прогрессивную диктатуру под своей перчаткой из железа и бархата. Вскоре будет принят ряд законов, направленных на освобождение женщин от их традиционного подчинения, как он это сделал с майя во время своего губернаторства до обретения независимости. Кроме того, защита труда будет распространена на всех домашних работников, чтобы все были защищены государством, в то время как также будут созданы новые пенсии по старости и новое Управление общественных работ."
YUC_Curtail_Fanaticism: "Обуздать религиозный фанатизм"
YUC_Curtail_Fanaticism_desc: "Полагая, что религиозный фанатизм и лояльность церкви, а не государству, вредны и препятствуют развитию современного общества, Альварадо начал закрывать церкви по всему штату. Конфискуя иконы и реликвии, а также удаляя всех членов духовенства с государственных должностей, Альварадо стремится насильственно принести секуляризм на Юкатан."
YUC_Centralized_Yucatan: "Юкатан - безопасный, надёжный и централизованный"
YUC_Centralized_Yucatan_desc: "Под руководством генерала Альварадо мы построили сильное, популистское и прогрессивное государство, централизованное вокруг столицы и национального правительства. Наш Юкатан един и неделим, безопасен под бархатным кулаком Альварадо. Теперь мы будем дальше продвигаться по этому миру, пока мы верно идём к нашему процветающему и вдохновлённому социализмом эгалитарному будущему."

YUC_Prohibition: "Освободиться от пороков"
YUC_Prohibition_desc: "Вдохновляясь старым законом Альварадо о запрете, который когда-то был одним из самых строгих во всей Мексике, мы приняли серию новых законов против пороков, направленных на очищение нашего полуострова. В соответствии с убеждением, распространённым Альварадо, что порок особенно тяжело сказывается на женщинах и семьях, наш президент даже постановил принять ряд актов, объявляющих вне закона бои быков, пьянство, азартные игры, лотереи и raffles, сделав даже пьянство достаточным основанием для развода. Любопытно, однако, а может быть, прогрессивно, [root.getleader] не стал криминализировать проституцию, а вместо этого ввёл регулярные медицинские осмотры для проституток, что сопровождается новым законодательством против пороков, направленным на ликвидацию борделей и сутенёров, а также штрафами для мужчин, пользующихся услугами нелегальных проституток или передающих венерические заболевания. В целом, мы создадим наше собственное представление о моральной и безгрешной нации под несомненной волей и руководством нового президента."
YUC_Exert_Control: "Сильная и моральная судебная система"
YUC_Exert_Control_desc: "Не может быть мира и стабильности без сильной концепции закона. Мы должны реформировать судебную систему нации, сделав её независимой от остального государства и свободной распространять истинное, моральное правосудие, не увязая в политической конкуренции и предвзятости. Только тогда мы сможем быть по-настоящему свободными и защищёнными."

YUC_social_conservatives: "Партия Рутинеро Юкатекано"
YUC_social_conservatives_desc: "Под руководством Темистоклеса Корреа Гутьерреса различные консерваторы в составе Партии Рутинеро Юкатекано теперь поведут наш полуостров прочь от либерализационного течения, проводимого предыдущими администрациями. Мы построим моральный, протекционистский, капиталистический рай здесь, на Юкатане, свободный от опасных идей, которые дорого нам обошлись."
YUC_Economic_Protectionism: "Экономический протекционизм"
YUC_Economic_Protectionism_desc: "Наша младенческая экономика должна быть защищена любой ценой, пока мы пытаемся построить наши собственные независимые финансовые системы и рынки. Мы должны проводить политику торгового протекционизма, повышая пошлины, устанавливая импортные квоты и другими способами, чтобы защитить стоимость наших товаров и процветание наших рабочих."
YUC_Yucatec_Independence: "Укоренить юкатекскую государственность"
YUC_Yucatec_Independence_desc: "Наша новая республика слаба, едва признана большей частью мира и уязвима для разъедающих влияний из-за отсутствия национальной сплочённости. Мы должны построить единую идентичность для нашего народа, чтобы он мог сплотиться ради выживания в грядущих бурях. У нас всегда будут свои разнообразные культуры и происхождение, но они будут поддерживаться и сливаться в более крупную юкатекскую идентичность."
YUC_Defense_Against_Radicals: "Нет места радикалам"
YUC_Defense_Against_Radicals_desc: "Радикализм - это опасный и разъедающий рак, которому нельзя позволять находиться на наших землях, если наша новая республика хочет выжить. Мы должны работать над искоренением экстремизма и радикалов всех форм - от националистов и реакционеров с крайне правых до синдикалистских революционеров с крайне левых, ибо только через принятие центра путём компромисса и сотрудничества с нашими коллегами-республиканцами наша демократия может выжить."
YUC_Shining_Democracy: "Функционирующая демократия"
YUC_Shining_Democracy_desc: "Построение свободной, честной и функционирующей демократической системы должно быть нашим главным приоритетом, ибо наш народ вытерпел достаточно автократии и угнетения со стороны наших старых мексиканских хозяев, чтобы хватило на целую вечность. С помощью избирательных гарантий, устранения любых препятствий, таких как подушные налоги и тесты на грамотность, а также создания большего количества избирательных участков - это лишь некоторые шаги - мы построим сияющий пример консервативной демократии для всей Латинской Америки."
YUC_Reward_Fighters: "Наградить ветеранов Войны каст"
YUC_Reward_Fighters_desc: "Война каст - наше благородное восстание против подлых мексиканцев - оставила после себя множество старых ветеранов в нашем государстве, многие из которых живут в крайней нищете, брошенные гнить, забытые государством, которое они так отчаянно пытались защитить. Мы исправим эту несправедливость и будем работать над тем, чтобы компенсировать этим истинным героям Юкатана. С помощью новых пенсий и пособий, здравоохранения и многого другого мы поднимем этих ветеранов из отбросов общества, в которых они были оставлены барахтаться, и устроим им геройский приём, которого они все действительно заслуживают!"
YUC_Support_Maya: "Поддержка майя"
YUC_Support_Maya_desc: "Народы майя издавна были коренной силой Юкатана, живя здесь тысячи лет и составляя большую часть нашего населения. Однако прошлые режимы обращались с ними как с животными, насильно загоняя их в чуждые им культуры и системы под дулом пистолета. Мы исправим эти ошибки и будем поддерживать народы майя, предоставляя им новые свободы, права и автономию, ибо теперь мы все - братья и сёстры Юкатана."
YUC_Decentralization: "Моральная и децентрализованная республика"
YUC_Decentralization_desc: "Построить децентрализованную республику, защищённую от коррупции и бесхозяйственности, - непростая задача, но PRY удалось совершить такой подвиг. Наша сияющая республика - это маяк латиноамериканского консерватизма и морального антисоциалистического популизма для всеобщего обозрения. Люди свободны жить как хотят, и они радуются, что их голоса наконец услышаны, свободные от давления угнетающего и доминирующего национального правительства. Пусть наш Юкатан будет свободным, моральным и защищённым от тирании навсегда!"

YUC_Staunch_Constitutionalism: "Твёрдый конституционализм"
YUC_Staunch_Constitutionalism_desc: "Мы должны придерживаться Конституции превыше любого другого документа или закона, ибо этот основополагающий документ составляет фундамент нашей демократической системы. Мы сделаем принятие поправок более трудным, чтобы сохранить её святость и первоначальный замысел, не позволяя нам отдаляться от намерений наших отцов-основателей. Конституция, созданная по образцу американских и мексиканских документов, будет нашим руководством и основой для того, как управлять и строить нашу республику в будущем, и мы всегда будем оглядываться на неё для получения руководства."
YUC_Church_Support: "Поддержка католической церкви"
YUC_Church_Support_desc: "Католическая церковь издавна была союзником народа, и поскольку их консервативные взгляды совпадают со многими нашими собственными политиками, они являются очевидным союзником. Мы будем сотрудничать с Церковью, всё ещё поддерживая секуляризм, получая лучшее из обоих миров, стремясь построить моральный и процветающий полуостров."

YUC_market_liberals: "Национальная партия общественного спасения"
YUC_market_liberals_desc: "Последнее десятилетие ознаменовалось ростом демократической мысли на Юкатане благодаря руководству революционера Сальвадора Альварадо и его большой коалиции либералов, прогрессивистов и умеренных социалистов. Эти новые демократические мыслители впечатлили жителей Мериды своей приверженностью свободе и самовыражению, что привело к расцвету новой националистической рыночно-ориентированной Либеральной партии под руководством Бернардино Мены Брито, которая поглотила остатки Либеральной партии Юкатана. Теперь PNSP поведёт нашу новую республику к свету либеральной демократии, поддерживаемой ответственным капитализмом и расширением свобод исключительно для нашего народа!"
YUC_fair_and_free_market: "Справедливый и свободный рынок"
YUC_fair_and_free_market_desc: "Кастовая система и система Компенсарос - это репрессивные институты, которые препятствуют свободному движению товаров и справедливой оценке человеческого опыта, поэтому они должны быть отменены. Либеральная партия расчистила путь к более демократичному и свободному рынку, не прибегая к опасному социализму, как это делал Каудильо. Теперь пусть наш народ ликует, когда поступают новые прибыли!"
YUC_Curtail_Alvarado: "Ограничить влияние Альварадо"
YUC_Curtail_Alvarado_desc: "Хотя генерал Альварадо спас нашу нацию и обеспечил нашу независимость, он сделал это частично путём союза с социалистами и другими экстремистами, присвоив часть их красной риторики. Мы должны бороться с влиянием как Альварадо, так и этих левых, ибо их опасные идеи не могут быть допущены в нашу либеральную и капиталистическую демократию."
YUC_business_grants: "Бизнес-гранты и экономические вливания"
YUC_business_grants_desc: "Программа бизнес-грантов начала исчерпывать средства и находится под угрозой дефолта. Решение, предложенное президентом, - создать вторую администрацию, которая будет служить посредником между инвесторами и владельцами бизнеса. С помощью этого нового бюро мы организуем экономику и предотвратим её крах с помощью тактических выкупов и пакетов стимулов, а также новых возможностей для инвестиций, чтобы наша экономика могла выдерживать удары и продолжать поддерживать наш народ и наши рынки."
YUC_fiscal_reform: "Масштабные фискальные реформы"
YUC_fiscal_reform_desc: "Наши финансы находятся в плачевном состоянии с момента провозглашения республики, поскольку наша денежная масса заморожена, а многие банки закрывают свои двери. Президент санкционировал создание централизованного, унифицированного Национального банка для управления национальной денежной массой и восстановления доверия к рынку. Более того, мы реструктурируем нашу финансовую систему, чтобы она была более ответственной и менее подверженной инфляции и вмешательству, дабы построить стабильный фундамент, на котором наша экономика сможет развиваться."
YUC_responsible_budget: "Ответственный бюджет"
YUC_responsible_budget_desc: "Чтобы обеспечить разрешение национального кризиса в нашу пользу, Национальный банк помог президенту организовать новый национальный бюджет. Этот новый бюджет будет распределять средства по различным программам и услугам, которые действительно нужны нашему населению. Мы сократим лишние расходы и будем инвестировать только в необходимое и то, что мы можем себе позволить, ибо первый шаг к построению сильной и устойчивой экономики - это сбалансированный бюджет."
YUC_foreign_investment: "Превосходство отечественного капитала"
YUC_foreign_investment_desc: "Юкатан не может стать жертвой того, что разрушило экономику всей Мексики, а именно порабощения нашего собственного народа капиталом, принадлежащим чуждым по крови элементам. Мы должны работать над уничтожением монополий, обеспечением доступа наших граждан к советам директоров компаний и expropriation этнически подозрительного богатства. Близкие союзники Бернардино Мены Брито, ранее организованные в Объединяющий центр революции, позаботятся о достижении наших целей."
YUC_Decentralized_State: "Свободная и богатая Юкатекская республика"
YUC_Decentralized_State_desc: "Под руководством Брито и PNSP мы создали на Юкатане капиталистическую утопию, поддерживаемую здравыми экономическими стратегиями и непоколебимой преданностью свободному рынку и либерализму. Теперь мы продолжим движение в будущее на волне золотого капитала и долларового процветания, строя справедливый капиталистический рай для всеобщей зависти."

YUC_press_freedom: "Исчерпывающая свобода прессы"
YUC_press_freedom_desc: "Важно использовать художественный и интеллектуальный потенциал свободной прессы, даже если она укомплектована слишком большим количеством революционеров. Мы не дискриминируем таким образом, поэтому пресса Юкатана будет свободна обсуждать и сообщать новости и факты, если только она не прибегает к распространению откровенной пропаганды и лжи."
YUC_liberty_or_death: "Свобода или смерть"
YUC_liberty_or_death_desc: "Как партия мы стремимся защищать Юкатан и наши с таким трудом завоёванные свободы, готовые отдать свои жизни, чтобы сохранить рай, который мы построили. Мы не откажемся от нашей независимости или свобод, какой бы ни была цена, и будем проводить политику милитаризованного либерализма, чтобы защитить такие взгляды. Свобода или смерть навсегда!"

YUC_social_liberals: "Национальная партия Санхуанистов"
YUC_social_liberals_desc: "Коалиция умеренных социал-демократов, либеральных республиканцев и других единомышленников-либералов на Юкатане объединилась для достижения общей цели самозащиты и экономического либерализма. Реформируясь вокруг ядра движения санхуанистов, боровшегося за нашу независимость от Мексики, эта новая Национальная партия санхуанистов под руководством Мигеля Алонсо Ромеро поведёт Юкатан к истинной и беспрепятственной социал-либеральной демократии."
YUC_build_democracy: "Укрепить демократические процессы Юкатана"
YUC_build_democracy_desc: "Органы управления Юкатана должны оцениваться не по их приверженности традициям, а по их приверженности демократическим идеалам Политической конституции штата Юкатан. Должны быть обеспечены демократические общегосударственные аюнтамьенто, а также местные организации и выборы, чтобы каждый голос был услышан."
YUC_agricultural_aid: "Фонд сельскохозяйственной помощи"
YUC_agricultural_aid_desc: "Наша больная экономика после Чёрного понедельника никогда не воспринималась Куидадо всерьёз. Наша экономика, основанная на товарных культурах, начала рушиться, и фермеры, не сумев своевременно переключиться на более натуральное хозяйство, вынуждены были по умолчанию выращивать те же самые обесценивающиеся культуры, чтобы выжить, что привело к массовому голоду. Должен быть создан сельскохозяйственный фонд, чтобы мы могли выручить фермеров, у которых были неурожаи или другие проблемы, и в то же время стимулировать выращивание продовольственных культур для решения проблемы голода."
YUC_constitutional_review: "Конституционный обзор"
YUC_constitutional_review_desc: "Старая Конституция Юкатана была в последний раз переписана в 1862 году и гарантировала лишь некоторые аспекты либеральной, светской республики, которую мы себе представляем. Второй раунд реформ, переписываний и поправок необходим, чтобы закрепить право на культуру, образование и prerogative, наряду с другими свободами и вольностями, которые мы приняли и исповедуем. Конституция может быть нашим руководством, но это не значит, что она совершенна, и поэтому она должна подлежать изменению в соответствии с нашими меняющимися потребностями."
YUC_Yucatec_Square_Deal: "Собственная честная сделка Юкатана"
YUC_Yucatec_Square_Deal_desc: "По образцу аналогичных программ, практикуемых или теоретически разработанных в Америке и Европе, мы разработаем нашу собственную «Честную сделку», чтобы создать прогрессивную и либеральную систему социального обеспечения в нашей стране. Наше государство будет поддерживать тех, кто нуждается, обеспечивая облегчение, реформы и восстановление Юкатана, поскольку мы стремимся к эгалитарному, справедливому капитализму."
YUC_New_Republicanism: "Новый юкатекский республиканизм"
YUC_New_Republicanism_desc: "Мы должны принять здесь нашу собственную форму республиканизма, соответствующую нашему сельскому и полуцентрализованному характеру. Отдельная и отличная от испано-шовинистических форм республиканской демократии, практикуемой мексиканцами и многими нашими другими соседями, мы построим республиканскую систему, которая уважает разнообразные голоса всех наших людей, включая майя, чтобы все люди могли иметь право голоса в нашем правительстве и гордиться такой свободой. Мы станем оплотом сплочённой и либеральной демократии для всей Центральной Америки, чтобы все видели и пытались подражать."
YUC_Semi_Centralized_State: "Либеральный факел Юкатана"
YUC_Semi_Centralized_State_desc: "Ведя возрождённое движение санхуанистов, новая PSN под руководством президента Ромеро превратила Юкатан в сияющий либеральный маяк для всеобщего обозрения. Теперь мы должны приложить все усилия, чтобы сохранить эти новые права и свободы в безопасности, строя ответственную капиталистическую демократию здесь, на нашем изолированном и нетронутом полуострове."
YUC_maya_tax_breaks: "Налоговые льготы для майя"
YUC_maya_tax_breaks_desc: "Сильно облагаемые налогами деревни майя нуждаются в облегчении от старых феодальных burdens. Их права на социальную prerogative означают, что они также имеют право на налоговый режим, демократически избранный аюнтамьенто. Всем членам общин майя будут предоставлены налоговые льготы и другие экономические послабления, с уважением к реалиям их сельского, а иногда и архаичного образа жизни."

YUC_industralization_import: "Импорт для индустриализации"
YUC_industralization_import_desc: "Внешние связи, установленные нашими людьми и бизнес-партнёрами, живущими за границей, вернулись, чтобы принести нам пользу: новое промышленное производство инструментов и плавильное оборудование отправляются в качестве «подарков» и знаков будущего сотрудничества. С этими начальными частями тяжёлого машиностроения наша партия может обеспечить промышленную базу быстрее и лучше, чем это когда-либо мог сделать Социалиста."
YUC_economic_interventionism: "Экономический интервенционизм"
YUC_economic_interventionism_desc: "К сожалению, наши экономические стимулы не прижились на Юкатане так быстро, как мы надеялись. Аюнтамьенто принял решение создать государственную администрацию для обучения навыкам промышленного литья и управления бизнесом, а также другим необходимым курсам, чтобы лучше подготовить массы к нашей модернизирующейся экономике. Кроме того, мы будем вмешиваться в экономику по мере необходимости и в случае необходимости, чтобы поддерживать равное и справедливое конкурентное поле. Простыми шагами мы будем постоянно держать экономику под контролем."

YUC_social_democrats: "Социалистическая рабочая партия"
YUC_social_democrats_desc: "Компромисс между революцией и эволюцией, Социалистическая рабочая партия вышла победителем. Под руководством видного левого демократа, социального активиста и дипломированного врача Хиркано Аюсо-и-О’Орибе, PSO стремится принести социализм на наш полуостров в умеренной форме, сдержанной справедливой демократией и нехищническим, подверженным влиянию труда капитализмом."
YUC_increase_public_spending: "Увеличить государственные расходы"
YUC_increase_public_spending_desc: "Богатство, которое наша столица Мерида накопила за счёт остальной части полуострова за эти годы, должно быть возвращено в более широкую экономику, чтобы помочь нам оправиться от революционного хаоса. Мы должны увеличить государственные расходы по всем направлениям, стимулируя экономику и создавая рабочие места, пока мы снова не встанем на ноги."
YUC_social_welfare: "Юкатекское государство всеобщего благосостояния"
YUC_social_welfare_desc: "Система социального обеспечения, подобная той, которую Сапата обещал стране до того, как был свергнут, поможет всему Юкатану, но мы не повторим тех же ошибок, что и мексиканцы. Мы построим наше собственное государство всеобщего благосостояния здесь, чтобы дать массам страховочную сеть, которая поймает их, когда наступят трудные времена."
YUC_improve_rural_workers: "Улучшить условия труда в сельской местности"
YUC_improve_rural_workers_desc: "Условия труда в сельской местности были ужасными на протяжении десятилетий: уровень травматизма и смертности среди рабочих оставался пугающе высоким как на фабриках, так и в полях. Мы должны оценить фермы и ткацкие станки с плохими условиями жизни и установить стандарты безопасности на рабочих местах, особенно потому, что мы не можем принять законы, чтобы положить конец глубоко укоренившейся системе детского труда в аюнтамьенто, пока не решим наши политические препятствия."
YUC_rural_peace: "Мир в глубинке"
YUC_rural_peace_desc: "Прекращение феодальных семейных и племенных распрей, которые вызвали много насилия и застоя в глубинке, является главной целью нашего срока. Мы должны обеспечить, чтобы люди работали во имя общего освобождения, а не ради собственной выгоды в peonage. Мы достигнем социальной гармонии в рамках нашей новой эгалитарной и популистской системы, ибо это единственный способ двигаться вперёд всем вместе."
YUC_Seperate_From_Radicalism: "Дистанцировать партию от радикализма"
YUC_Seperate_From_Radicalism_desc: "Из-за огненного характера нашего рождения и угнетающей системы, от которой мы оторвались, радикализм и экстремизм на Юкатане живы и здравствуют. Хотя мы включаем некоторые революционные идеи, мы должны дистанцировать партию от радикализма насколько это возможно, чтобы и наша репутация, и наша реальная политика и риторика не запятнались до неузнаваемости."
YUC_Labour_Economy: "Лейбористская экономика"
YUC_Labour_Economy_desc: "Основываясь на умеренных лейбористских принципах из Америки и Европы, мы построим ориентированную на рабочих экономику, которая танцует с левой мыслью, не впадая полностью в опасный социализм. С сильными защитами и льготами для наших рабочих, фермеров и трудовых ресурсов мы построим более сильную и более равную экономику и промышленный сектор."
YUC_Centralization_Middle_Ground: "Розовый и прогрессивный полуостров"
YUC_Centralization_Middle_Ground_desc: "Проводя политику лейбористской экономики, умеренной социал-демократии и политики централизации на золотой середине с автономией для наших защищённых меньшинств, мы построили по-настоящему прогрессивный и свободный Юкатан. Под руководством PSO и президента О’Орибе мы продолжим сиять и превратим эту розовую жемчужину в прогрессивную икону успешного левого реформизма в Латинской Америке."

YUC_equal_republic: "Сияющая республика для всех"
YUC_equal_republic_desc: "Дебаты о гражданстве, которые бушевали внутри аюнтамьенто, наконец закончились. Все природные граждане получают полные законные и гражданские права, а для иммигрантов, желающих жить свободно на нашем сияющем и свободном полуострове, должен быть установлен лёгкий путь к натурализации, при условии, что они докажут свою лояльность государству, преданность нашим реформам и будут работать на благо всех в нашем Юкатане."
YUC_no_more_caste_war: "Никогда больше Войны каст"
YUC_no_more_caste_war_desc: "Кастовая система, пережившая революцию, не смогла пережить республику. Мы обеспечим, чтобы наш народ никогда больше не брался за оружие против несправедливости на нашей собственной земле, создавая эгалитарное, бескастовое и бесклассовое общество для всеобщего равного наслаждения. Эта новая левая демократия предназначена для того, чтобы все граждане наслаждались ею и находили в ней свой голос, так давайте сделаем это реальностью!"

YUC_radical_socialists: "Социалистическая партия Юго-Востока"
YUC_radical_socialists_desc: "Революция возрождается на Юкатане под знамёнами Социалистической партии Юго-Востока, и свобода от всех каст, включая капиталистическую, теперь провозглашена. Под руководством Фелипе Каррильо Пуэрто - самого близкого соратника и политического современника генерала Альварадо - PSS намерена принести социалистический эгалитаризм и левый аграризм на наш полуостров, поддерживаемые популизмом, коллективизмом и расширением гражданских свобод и вольностей."
YUC_collectivize_mexican_property: "Коллективизация земли"
YUC_collectivize_mexican_property_desc: "Чтобы перевести нацию к социалистической системе, одновременно модернизируя наш сельскохозяйственный сектор, феодальные системы земледелия, существовавшие столетиями, будут искоренены. На месте этих поместий земля будет национализирована и коллективизирована, что, как мы надеемся, решит проблему безработицы, одновременно повышая производительность и эффективность."
YUC_peoples_assemblies: "Народные собрания"
YUC_peoples_assemblies_desc: "Аюнтамьенто Мериды будет заменено полностью демократическим Народным собранием, которое больше не будет подвергать массы нации шампанским социалистам столицы. Это новое собрание будет направлять нацию, в то время как для каждого сообщества и деревни будут сформированы меньшие собрания, принося социалистическую демократию как широким массам, так и отдельным сельским голосам, которые часто заглушаются."
YUC_agricultural_unions: "Сельскохозяйственные профсоюзы"
YUC_agricultural_unions_desc: "Мы создадим новое бюро внутри недавно созданного Народного собрания - новой серии собраний, заменяющих элитарный аюнтамьенто - для торговых и сельскохозяйственных профсоюзов. Эти профсоюзы будут представлять каждое ремесло, необходимое для функционирования Юкатана, и принесут большую переговорную силу, защиту и льготы нашим самым важным работникам."
YUC_Agrarian_Economics: "Социалистический аграризм, подходящий для Юкатана"
YUC_Agrarian_Economics_desc: "Сливая новые социалистические идеи с нашей давней аграрной реальностью, PSS начала создавать новую систему на Юкатане, которая ставит урожайность и заботу о нашем огромном населении сельскохозяйственных рабочих выше всех остальных задач. Наперекор представлению о том, что современный социализм требует тяжёлой промышленности, мы построим социалистическую утопию, поддерживаемую аграрными занятиями и свободной коммуналистской демократией, доказывая миру, что социализм может процветать и преуспевать даже в самых сельских нациях."
YUC_memory_of_cruzoob: "Память о Крузообе"
YUC_memory_of_cruzoob_desc: "Революция Крузооба десятилетиями подвергалась нападкам глупых романтиков и опасных националистов. Мы должны использовать художественные таланты внутри партии, чтобы донести правду об их героизме до общественного сознания. Мы покрасим героев Крузооба в красный цвет, примиряясь с населением майя, внедряя некоторые из их идей и отдавая дань уважения этим титанам нашей истории и борьбе за свободу."
YUC_peoples_revolution: "Народная революция"
YUC_peoples_revolution_desc: "Наша война против синаркистов - это Народная революция, и каждый выигранный нами дюйм - это победа над силами реакции и капитализма."
YUC_central_american_overtures: "Центральноамериканские предложения"
YUC_central_american_overtures_desc: "После встречи с несколькими членами сандинистов и другими центральноамериканскими социалистами мы готовы взять на себя более значительную роль в Центральноамериканской революции в целом. Мы спросим у центральноамериканцев, можем ли мы присоединиться к их новому союзу, чтобы вместе мы могли идти к истинному социализму для всей Латинской Америки."
YUC_Red_Apostle: "Красный апостол"
YUC_Red_Apostle_desc: "Став новым Красным апостолом нашего перекованного Юкатана, президент Пуэрто принёс новую волну учений и морали для всех, кому следовать, как если бы он сам был одним из Двенадцати апостолов, проповедуя благую весть нового бога - «бога» социалистической теории. Отрешённый от христианской риторики, которая угнетала большую часть нашего населения на протяжении столетий, этот новый Красный апостол поведёт наш Юкатан к процветанию, морали, свободе и равенству, не прибегая к ядовитой лжи религии и слепой вере."
YUC_Full_Centralization: "Централизация при демократическом социализме"
YUC_Full_Centralization_desc: "Чтобы лучше управлять этим диким полуостровом, была введена система социалистического централизма, передающая всё больше правительственных и политических обязанностей из отдельных организаций и ветвей власти в руки центральной администрации при президенте и партии. Хотя мы не прибегнем к тирании и авторитаризму, мы сосредоточим всю политическую власть в нации в одном организованном источнике, чтобы мы могли лучше управлять Юкатаном и удовлетворять потребности каждого из наших людей."

YUC_Secularization: "Тотальный секуляризм"
YUC_Secularization_desc: "Хотя многие в нашем движении не желают признавать это, ясно, что в моральных учениях католической церкви есть крупицы добра, которые могли бы принести пользу нашим сообществам в некоторых отношениях. Очевидно, это не означает, что они должны иметь какое-либо место в залах власти, ибо только через тотальную и бескомпромиссную секуляризацию наша социалистическая мечта принесёт плоды. Остаётся решение о том, как установить эту дистанцию: основное течение PSS под руководством братьев Каррильо Пуэрто довольно довольно продвижением социалистических «крестин» и общинных свадеб, у осколков, объединяющихся вокруг Корреа и PSON, другая идея. Находясь под влиянием континентальных PNR и Кальеса, часто политического соавтора в последние годы с их лидером, национал-унионисты готовы сделать гораздо больший акцент на последствиях, которые могут обрушиться на духовенство, если оно не подчинится новому курсу Юкатана."
YUC_Purge_The_Red_Shirts: "Очистить красные рубашки"
YUC_Purge_The_Red_Shirts_desc: "Кампас Рохас Канабаля - опасная группа экстремистов, которые маскируются под «истинных левых», проповедуя авторитаризм и насилие против своих политических врагов и церкви. Мы не можем позволить этим красным рубашкам и дальше порочить имя социалистов на Юкатане, поэтому они должны быть остановлены любой ценой."

YUC_syndicalists: "Национальная синдикалистская рабочая партия"
YUC_syndicalists_desc: "Одержав неожиданную победу, Национальная синдикалистская рабочая партия под руководством Бартоломе Гарсиа Корреа поднялась, чтобы возглавить нашу новую республику. Единственная организованная синдикалистская группа на Юкатане, PSON - это отколовшаяся группа от более крупной PSS, и ожидается, что она будет проводить ортодоксальную синдикалистскую политику, основанную на индустриализации, урбанизации и юнионизме, чтобы освободить пролетариат нашего полуострова."
YUC_Industrialization: "Быстрая индустриализация"
YUC_Industrialization_desc: "Земли Юкатана едва урбанизированы или индустриализированы, при этом столица Мерида и портовый город Прогресо являются нашими единственными центрами тяжёлой промышленности. Чтобы по-настоящему создать синдикалистскую систему на этом сельском и покрытом джунглями полуострове, мы должны проводить политику быстрой индустриализации, основанную на предложениях различных европейских социалистических групп."
YUC_Expand_Urban_Centers: "Расширить городские центры"
YUC_Expand_Urban_Centers_desc: "Имея всего несколько городов, Юкатан - в значительной степени сельская нация деревень и общин - обстановка, неподходящая для питания истинного синдикализма. Мы будем проводить политику массовой урбанизации, заливая акры джунглей бетоном и сталью, чтобы принести современность и урбанизированное процветание нашему народу."
YUC_Yucatec_Unionism: "Юкатекский юнионизм"
YUC_Yucatec_Unionism_desc: "Профсоюзы как концепция в значительной степени чужды нашему народу: единственные профсоюзы существуют в столице и других промышленных центрах или в сельскохозяйственной отрасли. Мы должны медленно знакомить широкую общественность с идеей профсоюзов, показывая им, что они только на их благо."
YUC_Start_Talks: "Начать мирные переговоры с радикалами"
YUC_Start_Talks_desc: "Хотя радикализм может быть опасен, он определённо имеет своё применение, ибо именно радикализм позволил нашей революции добиться успеха, а нашей республике - родиться. Мы должны начать мирные переговоры и сотрудничество с единомышленниками-радикалами по всему левому спектру, чтобы построить сильный и безопасный социалистический Юкатан."
YUC_Socialist_Unity: "Укрепить левое единство"
YUC_Socialist_Unity_desc: "Хотя мы не смогли собрать всех под наше багровое знамя, мы создали единый левый фронт, который будет поддерживать нашу скромную партию и поможет нам реализовать наши синдикалистские мечты. Хотя нам, возможно, придётся идти на компромисс с нашими новыми союзниками и включать некоторые из их собственных идей, особенно более сильные аграрные реформы и защиту майя, мы станем от этого только лучше, ибо мы свободны создавать пролетарский рай здесь, на нашем полуострове."
YUC_Red_Nation: "Наш красный полуостров"
YUC_Red_Nation_desc: "Поддерживаемые синдикалистской экономикой, социалистической политикой и широкой левой демократией, мы превратили Юкатан в утопический рай багрового и красного цветов. Хотя нам предстоит ещё много работы, чтобы полностью принести синдикализм и все его преимущества на эту сельскую землю, мы начали делать большие успехи: новые профсоюзы, коммуны и другие левые организации создаются по всей стране как нашим правительством, так и нашим собственным жаждущим населением. Вместе мы построим пролетарский рай для всей Латинской Америки."
YUC_Centralized_Syndicalist_Yucatan: "Юкатекское синдикалистское чудо"
YUC_Centralized_Syndicalist_Yucatan_desc: "Все под синдикализмом и все под Конгрессом профсоюзов, мы построили сильную социалистическую демократию, которая вращается вокруг нашей растущей сети профсоюзов. Вместе эти децентрализованные профсоюзы назначают представителей для участия в нашем централизованном национальном конгрессе, объединяя политические идеи о государственной организации, чтобы наилучшим образом соответствовать нашим потребностям и дихотомии между нашими растущими городскими центрами и нашими сельскими просторами. При этой системе мы превратим наш полуостров в сияющую багровую жемчужину Центральной Америки!"

YUC_Adapting_Orthodoxies_Charters: "Адаптация ортодоксий и хартий"
YUC_Adapting_Orthodoxies_Charters_desc: "Хотя нас напрямую вдохновляет успех европейских рабочих, их великие восстания против сковывающих цепей, мы не можем забывать, что ортодоксальный синдикализм и его модификация через Тоталистскую хартию относительно новы для нашего полуострова. Только благодаря тщательному учёту того, что сработало в Париже, Лондоне и Турине, что можно применить для надлежащего преобразования наших городских земель, социалистическая миссия на Юкатане станет свершившимся фактом."
YUC_Yucateco_Dream_Sureste_Labor: "Мечта юкатеко для труда Юго-Востока"
YUC_Yucateco_Dream_Sureste_Labor_desc: "Несмотря на то, что рабочее движение объединяет людей сильнее любой силы в мире, оно всё же может стать жертвой разногласий. Это безусловно верно в отношении пропасти, созданной между профсоюзами Юго-Востока, которые поддерживали независимость Юкатана, и теми, кто всё ещё отчаянно цепляется за идею единой Мексики. Пусть они больше не трепещут, ибо каждый трудящийся найдёт место в нашей общей мечте юкатеко, им просто нужно больше убеждений."

YUC_totalists: "Восхождение Камисас Рохас"
YUC_totalists_desc: "Восстав, чтобы воспользоваться хаосом после того, как им позволили сотрудничать с временным правительством, Камисас Рохас - или Красные рубашки - Томаса Гарридо Канабаля в Юкатане укрепили свою силу и теперь контролируют гражданское правительство. При Канабале республика, как ожидается, резко повернёт в новом направлении - к авторитарному юкатекскому тотализму, антитеизму и социалистическому морализму под новым понятием свободы."
YUC_Anti_Catholic_Laws: "Суровые антикатолические законы" 
YUC_Anti_Catholic_Laws_desc: "Католицизм и стоящая вокруг него Церковь были ничем иным, как чумой для нашего населения. Католические идеи вели испаноязычную угрозу к угнетению нашего народа и лишению нас нашей родной культуры, пока их духовенство возвышалось, становясь ещё одной могущественной и коррумпированной группой влиятельных элит. Мы полностью разведём Юкатан с религией, преследуя всех тех, кто извлёк выгоду из этой оппортунистической системы, пока мы сносим Церковь и отделяем её не только от правительства, но и от самой нации."
YUC_Persecute_Preists: "Преследовать священство"
YUC_Persecute_Preists_desc: "Каждому мужчине - винтовка, каждому священнику - пуля. Такова будет наша политика, пока мы работаем над очищением Юкатана от угнетающей и хищнической Церкви. Коррумпированное духовенство, их осведомители и союзники предстанут перед правосудием, либо перед судьёй, либо перед мечом, ибо наш полуостров должен быть освобождён от их гедонистических желаний и едких амбиций раз и навсегда."
YUC_State_Atheism: "Навязать государственный атеизм"
YUC_State_Atheism_desc: "Когда Церковь и духовенство получают своё заслуженное и жестокое правосудие, мы должны работать над полным утверждением не только секуляризма, но и тотального государственного атеизма. Мы будем антитеистами, противниками всех форм религии, пока работаем над окончательным искоренением ужасного опиума для народа. Религии не будет места в нашем новом и современном Юкатане!"
YUC_We_Are_All_Socialists: "Мы все социалисты!"
YUC_We_Are_All_Socialists_desc: "Раз Канабаль является социалистом, а правящая партия и всё национальное правительство являются социалистическими, это должно означать, что и все в нации тоже социалисты! Все верные граждане государства уже должны соглашаться со всей нашей политикой и амбициями, так что нет нужды в таких неэффективностях, как выборы или демократия. Мы все будем работать вместе, к одной цели, под одной Партией, во благо всех в нашем Юкатане."
YUC_Racism_Is_A_Crime: "Жёсткое антирасистское законодательство"
YUC_Racism_Is_A_Crime_desc: "Быть расистом или выступать против таких вещей, как феминизм или гражданские права, значит быть не только невеждой, но и предателем, ибо дискриминация любого из наших сограждан является актом против Партии и Государства. Все расистские или сексистские нарушители, а также виновники преступлений на почве ненависти или предрассудков, получат скорый и простой окончательный приговор, ибо только такое наказание подходит подобным предательским змеям."
YUC_All_Crimes_Have_the_Same_Punishment: "Много преступлений, одно наказание"
YUC_All_Crimes_Have_the_Same_Punishment_desc: "Список возможных преступлений, которые может совершить человек, почти бесконечен, а подлые злодеи с каждым днём выдумывают новые способы извращать закон и порядок. Чтобы ускорить судебный процесс и освободить ресурсы, расходуемые на тюрьмы, мы введём политику ‘Много преступлений, одно наказание.’ При этой системе любые и все проступки против Государства, Партии или нашего народа будут рассматриваться одинаково - нарушитель получит быструю пулю в затылок."
YUC_Purge_Opposition: "Зачистить любую и всякую оппозицию"
YUC_Purge_Opposition_desc: "Любая и всякая оппозиция Государству и нашим планам должна быть признана предателями и обращаться с ней следует соответственно. Такие опасные элементы, как санхуанисты и генерал Альварадо, получат скорые показательные суды, а затем будут отправлены к расстрельным линиям. Мы сохраним нашу новую революцию и это новое Государство, чего бы это ни стоило."
YUC_2_Year_Plan: "Двухлетний план"
YUC_2_Year_Plan_desc: "В серии последовательных Двухлетних планов мы стремительно урбанизируем, индустриализируем и милитаризируем юкатекское Государство, принося народу нашего полуострова модернизированное процветание и славу. Хотя мы установили жёсткие квоты, и хотя многие, вероятно, погибнут в этом начинании, жертвы масс никогда не будут забыты, пока мы прокладываем путь к пролетарскому раю, чего бы это ни стоило нам в золоте, крови, свинце или стали."
YUC_State_Economy: "Тотальная экономическая национализация"
YUC_State_Economy_desc: "Государство и Партия будут господствовать и диктовать каждый аспект национальной экономики, вплоть до мельчайших деталей, чтобы максимизировать эффективность и производительность, пока мы ракетой несёмся к современности и истинному социализму. Все отрасли промышленности, а также земля и всё, что в ней находится, будут национализированы и полностью контролироваться Партией во имя пролетарских масс. Только тогда можно будет достичь истинного тотализма и пикового экономического роста."
YUC_Prohibition_tot: "Освободить общество от порока"
YUC_Prohibition_tot_desc: "Такие пороки, как алкоголь, азартные игры, проституция и многое другое, лишь замутняют умы пролетариата. Взяв одну из немногих вещей, в которых Альварадо был прав - его суровый и строгий закон о запрете - и доведя её до логического предела, государство полностью запретит любые и все пороки. Мы построим доброе, чистое, нравственное общество, свободное от порока и полностью основанное на нашей тоталистской морали."
YUC_completely_destroy_religion: "Антиклерикальная культурная революция"
YUC_completely_destroy_religion_desc: "Продвигая нашу культурную и общественную трансформацию дальше, Канабаль и Красные рубашки начали поощрять новую культурную революцию для полуострова, соединяя испаноязычную и майяскую идентичности, полностью порывая с христианской моралью и заменяя её нашей собственной тоталистской этикой."
YUC_bunker_up: "Бункер на каждый акр джунглей"
YUC_bunker_up_desc: "Наша природная местность идеально подходит для партизанской войны и тактики опорных пунктов. Мы начнём строить траншейные системы, бункеры, доты, редуты и другие различные оборонительные сооружения по всему нашему покрытому джунглями полуострову. Мы сделаем вторжение в наше суверенное государство или удержание здесь территории чертовски почти невозможным, ибо мы хозяева этого полуострова, и мы докажем это каждому из наших врагов."
YUC_Supreme_Leader: "Верховный лидер Юкатана"
YUC_Supreme_Leader_desc: "Каудильо Канабаль возвысился до верховного лидера нашего Юкатана, несравненного Генералиссимуса и неоспоримого Эль Хефе нашего джунглевого Эдема. Держа Юкатан в своей ладони, он повёл нацию к алому раю для всех истинных детей Юкатана, и лишь по его последнему слову что-либо совершается. Под его гениальным, благожелательным и суровым правлением мы достигнем истинного социалистического совершенства, принося славу нашему Юкатану."

YUC_foreign_policy: "Положение Юкатана на мировой арене"
YUC_foreign_policy_desc: "Когда наша революция за независимость увенчалась успехом, а государство было защищено, наконец настало время Юкатану преследовать собственные амбиции. Мы поднимемся на мировую арену - или, быть может, полностью укроемся от неё, - пока пытаемся найти своё место в этом бурном мире."
YUC_socialist_fp: "Багровый рассвет Юкатана"
YUC_socialist_fp_desc: "С победой Революции Юкатан возвысился как багровый маяк, на который должен взирать весь мир. Поистине социалистическая нация, стремящаяся распространять Революцию и находить единомышленников-союзников, наш Юкатан теперь сделает свои первые шаги за пределы наших границ и навстречу нашей красной судьбе."
YUC_take_over_CA: "Обеспечить социалистическую Центральную Америку"
YUC_take_over_CA_desc: "Нет смысла пытаться мирно прийти к соглашению с нашими соседями в Латинской Америке. Они будут уважать наши взгляды и наши амбиции только после демонстрации силы, так позвольте же нам пройти по Перешейку и распространить нашу собственную форму социализма на всеобщее обозрение."
YUC_our_own_socialist_CA: "Наша собственная красная Центроамерика"
YUC_our_own_socialist_CA_desc: "Нашей рукой, посредством дипломатии или войны, мы привели остальную Центральную Америку к покорности. Теперь мы свободны создать собственную форму Центроамерики - полностью согласующуюся с нашей особой формой левой мысли."
YUC_take_out_mexico: "Месть мексиканцам"
YUC_take_out_mexico_desc: "Именно мексиканцы веками угнетали наш народ, и именно мексиканцы украли у нас всякую возможность суверенитета, пока мы наконец не восстали. Мы должны отомстить нашим северным соседям, наконец одним решительным ударом стерев века унижений."
YUC_join_int: "Вступить в Интернационал"
YUC_join_int_desc: "Третий Интернационал является крупнейшей социалистической организацией на Земле, с государствами-членами и партиями по всему миру. Мы должны обратиться к этим мастерам современного социализма с просьбой позволить нам присоединиться к их союзу ради всеобщего блага."

YUC_neutral_fp: "Нейтральный Юкатан"
YUC_neutral_fp_desc: "Наша новорождённая независимая республика не нуждается ни в друзьях, ни в союзниках, ибо мы выживем и будем процветать, как всегда, - своими силами."
YUC_develop_inward: "Внутреннее развитие"
YUC_develop_inward_desc: "Сосредоточившись на собственной нации вместо легкомысленных международных начинаний, мы начали новую программу внутреннего развития, направленную на дальнейшее возрождение и расширение нашей отечественной промышленности. Пока остальной мир возится с международной дипломатией и войной, мы сосредоточимся на строительстве лучшего Юкатана, какой только сможем создать."
YUC_black_spot: "Чёрное пятно Центральной Америки"
YUC_black_spot_desc: "В нашем пути к созданию совершенного юкатекского варианта тотализма мы пришли к простому осознанию: связи с внешним миром должны быть полностью разорваны. Полуостров, некогда жадно эксплуатируемый и колонизированный иностранными державами, теперь освободит себя от этой гнили. Именно католицизм и испанский расизм пришли из-за океана и развратили эту землю, а потому ничему, что могло бы угрожать нашему видению, нельзя позволить вновь вползти сюда. Юкатан не только выживет без внешней помощи, он будет процветать одним лишь нашим трудом."
YUC_indepedence_secured: "Наш суверенитет обеспечен"
YUC_indepedence_secured_desc: "С обеспеченным суверенитетом и с нашим нейтралитетом, признанным миром, мы стали новой Швейцарией Запада, полностью свободной заниматься своими делами и вести дела с широким миром, оставаясь в стороне от всех дипломатических вопросов. Наш Юкатан в безопасности, и нам не пришлось прибегать к полному закрытию нации. Да воцарятся мир и процветание!"
YUC_secure_ca: "Освободить Центральную Америку от самой себя"
YUC_secure_ca_desc: "Глупцы, что ныне господствуют в Центральной Америке, оскверняют потенциал столь богатой и изобильной земли. Мы вырвемся за пределы наших установленных границ и хлынем в заблудшие соседние земли, освобождая этих глупцов от самих себя, пока тащим всю Центральную Америку к процветанию и славе вместе с нами."

### Economy Focuses ###
YUC_plummed_serpeant: "Пернатый Змей вновь восстаёт"
YUC_plummed_serpeant_desc: "Пернатый Змей, или Кукулькан, был одним из главных богов майя. Древние майя верили, что когда он вновь явится, непременно наступят добрые времена. Хотя ныне осталось крайне мало верующих в старых богов, возможно, упоминание его возвращения вновь разожжёт нашу экономику."
YUC_national_constitution: "Национальная конституция"
YUC_national_constitution_desc: "Все политические партии согласны с тем, что юкатекской нации нужна новая конституция. Все дальнейшие споры, несомненно, будут урегулированы на съезде. Созовите ведущих государственных мужей нации в Мериду!"
YUC_womens_rights: "Женское избирательное право"
YUC_womens_rights_desc: "В рамках конституции многие партии согласны, что мы должны намного обогнать реакционную Мексику в нашем стремлении к лучшим правам для женщин Юкатана. Хотя, разумеется, их место прежде всего в доме, предоставление им права голоса может лишь помочь нашей популярности."
YUC_land_issue: "Земельный вопрос"
YUC_land_issue_desc: "Многие фермеры нашей нации слишком ожесточённо соревнуются за свои участки земли, пытаясь вырастить как можно больше товарных культур, чтобы прокормить свои семьи на заработанные деньги. Правительство знает, что нужно этим фермерам, лучше, чем они сами, но что именно?"
YUC_agricultural_wealth: "Сельскохозяйственное богатство"
YUC_agricultural_wealth_desc: "Теперь, когда наше правительство завершило земельную реформу, мы, будем надеяться, сможем удвоить наше сельскохозяйственное производство, стимулируя экономику и помогая нашим гражданам!"
YUC_secularism: "Продвигать секуляризм"
YUC_secularism_desc: "Пусть Мексика теперь и сворачивает свои антикатолические законы при своём авторитарном режиме, но мы в Юкатане настаиваем, что каждый может свободно исповедовать свою веру."
YUC_land_of_the_free: "Земля свободных"
YUC_land_of_the_free_desc: "Любые мексиканцы, желающие приехать в Юкатан, чтобы спастись от авторитаризма, могут сделать это. Добро пожаловать всем!"
YUC_state_policing: "Создать государственную полицию"
YUC_state_policing_desc: "Наши деревни, посёлки и города должны содержаться в должном порядке. Ополчения, служившие в сельской местности, должны быть реорганизованы и вновь развёрнуты."
YUC_mexican_spies: "Искоренить мексиканских шпионов"
YUC_mexican_spies_desc: "Некоторые из беженцев, которых мы впустили в нашу страну, оказались менее желанными, чем мы прежде подразумевали. Всякий, кто приходит сеять беспорядок и смуту, будет наказан."
YUC_army_autonomy: "Оперативная автономия армии"
YUC_army_autonomy_desc: "Чтобы обеспечить нашу независимость от Мексики, наша армия должна быть свободна от политических настроений и междоусобиц. В связи с этим мы назначим каждому генералу и командиру политического атташе, чтобы они могли взаимодействовать с правительством только через посредника."
YUC_building_yucatan: "Строительство Юкатана"
YUC_building_yucatan_desc: "Наша нация пока ещё не так развита промышленно, как могла бы быть. Мы должны строить в городах и посёлках - всё ради большей помощи нашему народу."
YUC_infrastructure_development: "Развитие инфраструктуры"
YUC_infrastructure_development_desc: "Мы должны улучшить дороги между Кампече, Четумалем и Меридой. Эти крупнейшие и важнейшие из наших городов должны быть связаны друг с другом всё теснее."
YUC_port_expansion: "Расширение порта"
YUC_port_expansion_desc: "Порт Мериды должен стать путём в Мексику - по крайней мере, в достойную Мексику. Хотя демократия пала в Мехико, народы мира всё ещё могут найти свободную торговлю в Юкатане."
YUC_agricultural_exportation: "Стимулы для сельскохозяйственного экспорта"
YUC_agricultural_exportation_desc: "Хотя наша нация, возможно, и не производит много ценных ресурсов, теперь, когда земельная реформа завершена, мы можем нарастить производство и начать экспортировать юкатекский текстиль в остальную часть Карибского бассейна."
YUC_bilungalism: "Усилия по двуязычному образованию"
YUC_bilungalism_desc: "Если мы хотим утвердить отдельную национальную идентичность от алчных держав вокруг нас, мы должны восстановить нашу национальную самобытность. Единственной подходящей, кажется, является идентичность майя. В связи с этим мы должны поощрять двуязычное образование в наших школах - как на испанском, так и на майя."
YUC_maya_revival: "Национальное возрождение майя"
YUC_maya_revival_desc: "В разуме [YUC.GetLeader] нет никаких сомнений, что наша страна должна взойти к своему полному величию, восстановив культуру майя по всему Юкатану. Скоро мы вновь станем великой нацией."

### Events ###

yucatan.1.t: "Конституция Юкатана"
yucatan.1.d: "В Мериде была подписана новая Конституция Юкатана. Хотя она была создана по образцу мексиканской Конституции 1917 года, а также американской Конституции, она также включала в себя и немалую часть правового кодекса майя. Более того, она также является компромиссом между различными фракциями внутри юкатекского правительства, призванным создать цельный и всеобъемлющий документ, с которым все могут согласиться, пока мы пытаемся построить собственную независимую республику здесь, на нашем покрытом джунглями полуострове."
yucatan.1.a: "Да здравствует свободный Юкатан!"

yucatan.2.t: "Земельный вопрос"
yucatan.2.d: "Вопрос земельной реформы поднимался снова и снова, но теперь он наконец будет решён. Большинство консерваторов и нелевых либералов предлагают поддержать мелких землевладельцев, тогда как прогрессисты, мягкие либералы и умеренные социалисты считают, что нам следует внедрить георгистскую идею земельного налога. С другой стороны, многие радикальные левые и революционеры верят, что правильным путём будет коллективизация земли. Что нам следует сделать?"
yucatan.2.a: "Коллективизировать землю во благо Пролетариата."
yucatan.2.b: "Внедрить георгистскую политику единого налога, чтобы умиротворить как можно больше сторон."
yucatan.2.c: "Поддержать мелких землевладельцев вместе с консерваторами."

yucatan.3.t: "Борьба с мексиканскими шпионами"
yucatan.3.d: "Недавно мы поймали ряд мексиканских шпионов, пытавшихся проникнуть в наше правительство. Вопрос в том, что нам следует с ними сделать. Большинство умеренных считает, что мы должны их депортировать, тогда как более дерзкие среди нас полагают, что следует просто казнить их всех. Наконец, радикалы в наших рядах думают, что нам стоит попытаться переманить их на нашу сторону, убедив их общей революционной риторикой. Что мы решим?"
yucatan.3.a: "Казнить их."
yucatan.3.b: "Депортировать их."
yucatan.3.c: "Попытаться переманить их."

yucatan.4.t: ""
yucatan.4.d: ""
yucatan.4.a: ""

yucatan.5.t: "Союз с радикалами?"
yucatan.5.d: "Камисас Рохас Томаса Гарридо Канабаля и Движение майя генерала Мая Печа обрели значительное политическое влияние внутри нации, а также контролируют собственные обширные и закалённые военизированные формирования. Хотя мы уже давно работаем с умеренными социалистами ради достижения наших целей, некоторые в нашей администрации начали повторять идею о союзе с одной из этих групп. Однако, поскольку влияние этих радикалов растёт, нам следует быть осторожными, lest они попытаются сделать ход ради осуществления собственных амбиций."
yucatan.5.a: "Красные рубашки кажутся отличными союзниками!"
yucatan.5.b: "Движение майя кажется отличными союзниками!"
yucatan.5.c: "Заключить союз с ними обоими! Что вообще может пойти не так..."
yucatan.5.e: "Продолжить наш союз с социалистами."

yucatan.6.t: "Краснорубашечники пытаются совершить переворот"
yucatan.6.d: "После нашего решения заключить союз с Красными рубашками Канабаля, и когда наше собственное движение начало шататься, поскольку наши умеренные социалистические союзники откалываются к другим движениям или таинственным образом погибают, наша администрация осталась уязвимой. Почувствовав эту слабость, генерал Канабаль и его Камисас Рохас попытались захватить контроль над государством, окружив столицу и объявив всей нации о своём намерении свергнуть правительство. Пока наши лоялистские войска прибывают на место, чтобы сразиться с этими экстремистами, мы не уверены, будет ли этого достаточно, чтобы остановить багровый прилив."
yucatan.6.a: "Канабаль захватывает контроль над Государством!"
yucatan.6.b: "Красные рубашки отброшены!"

yucatan.7.t: "Лик нашей новой нации"
yucatan.7.d: "Когда наша война за независимость наконец выиграна, а опасные радикалы, досаждавшие нашему либеральному движению, наконец упокоены, настало время организовать наше государство и провозгласить наше новое правительство. Широко ожидается, что генерал Альварадо - герой Революции и социалистический активист по собственному праву - будет избран нашим новым Президентом, если он не уйдёт в сторону и не удалится до выборов. Однако ходят слухи, что Альварадо не собирается соблюдать свои демократические обещания, ибо вместо этого он замышляет установить собственную военную хунту с красным оттенком, или так утверждают эти слухи. Какой бы ни была правда, мы скоро узнаем её, когда генерал Альварадо поднимется, чтобы обратиться к нации."
yucatan.7.a: "Альварадо провозглашает республику и приносит присягу как наш первый Президент."
yucatan.7.b: "Альварадо официально закрепляет своё правление в военной хунте, вдохновлённой социализмом."
yucatan.7.c: "Альварадо отходит в сторону как губернатор, позволяя провести демократические выборы."

yucatan.8.t: "Движение майя пытается совершить переворот"
yucatan.8.d: "После нашего решения заключить союз с Движением майя Франсиско Мая Печа, и когда наше собственное движение начало шататься, поскольку наши умеренные социалистические союзники откалываются к другим движениям или таинственным образом погибают, наша администрация осталась уязвимой. Почувствовав эту слабость, генерал Май Печ и его майяские партизаны попытались захватить контроль над государством, окружив столицу и объявив всей нации о своём намерении свергнуть правительство. Пока наши лоялистские войска прибывают на место, чтобы сразиться с этими экстремистами, мы не уверены, будет ли этого достаточно, чтобы остановить нативистский прилив."
yucatan.8.a: "Май Печ захватывает контроль над Государством!"
yucatan.8.b: "Майя отброшены!"

yucatan.9.t: "Нация скатывается в политическую междоусобицу"
yucatan.9.d: "После нашего глупого решения объединиться и с Красными рубашками, и с майяскими нативистами в столице разразился полный хаос: майяские партизаны сражаются с военизированными отрядами Красных рубашек в битве за душу Юкатана. Поскольку наши собственные лоялисты и силы слишком сильно уступают числом, чтобы встать у них на пути, похоже, что республиканская мечта по-настоящему мертва. Теперь всё, что остаётся, - сидеть, ждать и смотреть, какая группа жестоких экстремистов - тоталистские Камисас Рохас Канабаля или националистическое Движение майя генерала Мая Печа - выйдет победителем."
yucatan.9.a: "В хаосе Май Печ захватывает власть!"
yucatan.9.b: "В хаосе Канабаль захватывает власть!"

