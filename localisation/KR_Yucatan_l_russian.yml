yucatan.28.t: "[FROM.GetName] просит присоединиться к [ROOT.GetNameDef]"
yucatan.28.d: "Социалисты в нашей сестринской республике [FROM.GetName] уже давно наблюдают за нашим прогрессом, пока мы превращаем Центральную Америку в социалистический рай. Теперь, похоже, они готовы присоединиться к нашей нации в качестве ещё одной составной республики. Должны ли мы позволить этому долгожданному объединению свершиться?"
yucatan.28.a: "Разумеется!"
yucatan.28.b: "Нам не нужны мексиканские отверженные!"

yucatan.29.t: "Центроамерика соглашается!"
yucatan.29.d: "Наши южные соседи согласились на нашу просьбу о присоединении к их нации. Нас ждёт славное будущее в составе великой Центральной Америки."
yucatan.29.a: "Гип-гип, ура!"

yucatan.30.t: "Присоединение Юкатана"
yucatan.30.d: "[GetDateText] Центроамериканская Республика приняла нового члена в свои ряды. [YUC.GetLeader] передал власть над полуостровом Юкатан и его народом [ROOT.GetLeader], а затем прошёл парадом по Мериде, где народ приветствовал аннексию. Это великий день в нашей истории!"
yucatan.30.a: "Добро пожаловать, братья!"

yuc_flavor.1.t: "Наследие Пакаля Великого"
yuc_flavor.1.d: "Взойдя на престол всего в двенадцать лет, К’инич Ханааб’ Пакаль - более известный как Пакаль I или Пакаль Великий - был величайшим из всех древних ахау майя. Хотя он и не был полноценным императором, каким ныне правит Пакаль IV, Пакаль Великий властвовал над великим городом Паленке в то, что стало не только одним из величайших монархических правлений в истории, но и третьим по длительности достоверно подтверждённым периодом царствования в человеческой истории. Правя Паленке более 68 лет, Пакаль Великий открыл золотой век, подобного которому Юкатан ещё никогда не видел, поддержанный доселе непревзойдёнными научными и культурными достижениями, и именно это наследие Франсиско Май Печ теперь стремится повторить.\n\nВозведённый на трон своей верной кликой майяских экстремистов, Пакаль IV, как он теперь правит, желает подняться до тех же высот, что и его предки, и попытается открыть собственный золотой век во благо своего народа. Руководя культурной и общественной революцией, которая стремится повернуть время вспять на тысячи лет, одновременно используя модернизированные концепции и уроки, усвоенные по пути, Пакаль IV поведёт Юкатан по пути полной культурной революции, общественных потрясений и полной метаморфозы, пока мы пытаемся построить первую истинную Империю майя."
yuc_flavor.1.a: "Да здравствует новый Пакаль, четвёртый этого имени и новый К’ухуль Ахау первой Империи майя!"

yuc_flavor.2.t: "Строительство нового Маайяпаана"
yuc_flavor.2.d: "Маайяпаан, называемый нашими испаноязычными завоевателями Майяпаном, некогда был культурной и политической столицей старой цивилизации майя - развитой метрополией, поддерживаемой хорошей наукой, рациональной мыслью и философией, изящным искусством и высокой культурой. Этот древний город трагически был доведён до руин как бесхозяйственностью старой цивилизации майя, так и испаноязычным вмешательством, а древние каменные стены этого разрушенного города ныне лежат заброшенными и заросшими джунглевыми чащами. Когда первоначальное место этого великого города было открыто нам после экспедиций в Северном Юкатане, Пакаль IV принялся восстанавливать этот давно мёртвый городской рай, причём старые храмовые комплексы, такие как великий Храм К’ук’улькана, перестраиваются и обновляются вместе с остальным городом, а сам Пакаль был назван младшим Ахау - или владыкой - города в дополнение к своему титулу К’ухуль Ахау - или Верховного короля - нашей новой империи. Используя модернизированные формы архитектуры майя, новый Маайяпаан вновь поднимется, чтобы стать жемчужиной в короне нашей возрождённой цивилизации майя."
yuc_flavor.2.a: "Пусть этот новый Маайяпаан станет новым центром нашей восстановленной утопии."

yuc_flavor.3.t: "Великая пирамида возрождена"
yuc_flavor.3.d: "Продолжая усилия по возрождению, начатые при строительстве нового Маайяпаана, Пакаль IV и его верные последователи приступили к восстановлению ещё одного места нашей древней цивилизации - великого города Чичен-Ица. Некогда самый разнообразный город Мезоамерики, украшенный десятками разных архитектурных и художественных стилей, Чичен-Ица служила плавильным котлом цивилизации майя - космополитической метрополией в сердце нашей родины, перекрёстком и крупным узлом для десятков этнических групп и отдельных племён, составлявших старую конфедерацию майя, Лууб Маайяпаан или Лигу Майяпана.\n\nОднако, несмотря на великое наследие города, не его мультикультурализм приносит ему славу, ибо эта честь принадлежит венчающей особенности Чичен-Ицы - Великому пирамидальному храму К’ук’улькана и древнему культу, окружающему его.\n\nХотя многие другие храмы, святилища и пирамиды посвящены майяскому змеиному божеству войны и жизни, родственному ацтекскому Кетцалькоатлю, ни один не достигает великолепия и величия Великого храма в Чичен-Ице. Украшенный змеиными орнаментами, сопровождаемый Большим стадионом для игры в мяч, где некогда для ахау играли в майяскую игру с мячом, и обладающий уникальной архитектурной особенностью, позволяющей звуку хлопков рук отражаться и усиливаться по наклонным лестницам сооружения в призрачный, похожий на птичий звук, Великий храм является чудом древней инженерии, стоящим и по сей день. Также служа центром старого культа К’ук’улькана, этот священный город - один из утраченных Толланов - имеет огромное религиозное и культурное значение для нашего народа, и потому он должен быть сохранён. Великий храм, вместе с остальной частью этого древнего города, Большим стадионом для игры в мяч и культом К’ук’улькана, будет возрождён, обновлён и перестроен, как и Маайяпаан, ещё сильнее восстанавливая нашу былую славу, пока мы стремимся к новым высотам."
yuc_flavor.3.a: "Вся хвала культу К’ук’улькана! Вся хвала Чичен-Ице!"

yuc_flavor.4.t: "Возрождение майя в полной силе"
yuc_flavor.4.d: "Стремясь полностью возродить культуру майя во всех её аспектах, фанатики, возвысившие генерала Мая Печа, также начали возвращать к жизни давно умершие стороны культуры майя. От деиспанизации языка майя до возрождения старого политеистического пантеона майя и его распространения по всему нашему полуострову - почти все аспекты нашей старой культуры и общества будут возрождены, модернизированы и вновь введены в национальную практику. Игра майя с мячом и площадки для неё вновь становятся популярными, а культ К’ук’улькана возвышается до одной из господствующих религий в государстве, пока массы отдают свои души пернатому змеиному богу. Научные достижения и модернизированное подсечно-огневое земледелие вновь укореняются, а древняя практика проведения Цветочных войн также начинает возвращаться.\n\nОднако ещё интереснее стало полное возвращение старых календарных систем майя, включая как космический календарь для обычного отсчёта времени, так и жертвенный календарь, подробно указывающий, когда и что должно быть принесено в жертву каким именно богам пантеона и в какой конкретный день. Как и у наших ацтекских собратьев, жертвоприношения были значительной частью нашей старой религии, хотя человеческие жертвоприношения были куда более редкими и предназначались только для самых важных церемоний. Редкие человеческие жертвы также происходили из высокого социального положения или были могущественными военнопленными, тогда как большинство других пленников и заключённых вместо этого принуждались к труду - ещё один аспект нашего старого общества, также возрождённый. Вместо этого большинство жертв состояло из животных или органов, а также золота и других сокровищ, всё это отдавалось Богам и Шибальбе - подземному миру майя, означающему ‘место страха.’ Эти жертвоприношения, вместе со всеми прочими аспектами нашей старой культуры, описанными в исторических текстах вроде Пополь-Вуха, будут возрождены, оживлены и модернизированы, чтобы соответствовать нашей новой империи, пока мы стремимся вернуть цивилизацию майя с края смерти."
yuc_flavor.4.a: "Давайте веселиться так, словно снова 700 год нашей эры!"

yuc_flavor.5.t: "К вопросу о фанатиках Крусоб"
yuc_flavor.5.d: "Поскольку наша хватка над Юкатаном лишь продолжает крепнуть, пока нация всё дальше консолидируется под нашей властью, возник вопрос о том, что делать с нашими бывшими союзниками из движения Крусоб. ‘Крусобцы’ являются майя, как и мы, но их сбили с пути идеи синкретического католицизма, слитого с майяскими религиозными верованиями; их умы отравлены мерзкими испаноязычными чужаками. Хотя даже сам Май Печ некогда причислял себя к ним, мы с тех пор ушли дальше их половинчатых мер, но это всё равно не меняет того факта, что эти фанатики доказали неизменную верность нашему движению и нашему общему народу, даже если они не полностью согласны с нашим новым направлением. Поскольку даже Пакаль IV испытывает сочувствие к этим еретикам, многие призывают нас помиловать их, позволив им мирно жить в нашей новой империи, пока они держат свои синкретические взгляды при себе. Однако убеждённые возрожденцы майя, которые вынудили Мая Печа принять направление, по которому мы теперь идём, придерживаются иных идей. Эти смутьяны и экстремисты требуют, чтобы последователей веры Крусоб, отказывающихся обратиться к нашим новым, или старым, путям, расстреливали на месте как испаноязычных предателей. Однако окончательный выбор лежит в руках К’ухуль Ахау."
yuc_flavor.5.a: "Искоренить этих опасных фанатиков."
yuc_flavor.5.b: "Помиловать этих заблудших глупцов, ибо мы все дети К’ук’улькана."

yuc_flavor.6.t: "Разжигая новые Цветочные войны"
yuc_flavor.6.d: "Пока мы продолжаем собирать всё больше Красных рубашек Канабаля, некоторые из наших майяских радикалов-милитаристов выдвинули новую идею. Поскольку Цветочные войны - меньшие, заранее спланированные и тщательно организованные ритуальные войны, проводившиеся как майя, так и ацтеками ради жертвенных и дипломатических целей - уже возрождаются, а древняя майяская практика использования в качестве человеческих жертв только почётных воинов хорошо известна, эти радикалы желают использовать наших новых социалистических пленников в этих возрождённых конфликтах. Поскольку иного применения этим опасным ветеранам нет, а они слишком упрямы, чтобы использовать их на тяжёлых работах, как мы поступаем с другими пленниками, использование их в наших Цветочных войнах является очевидным ходом. В соответствии со старыми традициями, этих ветеранов разденут и выпустят сражаться лишь с почётным оружием ближнего боя против нашего обученного избранного круга элитной церемониальной гвардии. В этих запланированных битвах эта тоталистская нечисть будет благородно сражена на поле боя; их кровь и внутренности прольются в почву как плата великим богам нашего пантеона. Только тогда эти животные наконец обретут настоящую пользу и шанс на искупление перед мощью нашего пантеона."
yuc_flavor.6.a: "Они послужат одной последней и благородной цели, когда сердца этих могучих воинов будут отданы богам."

yuc_flavor.7.t: "Майяско-католический синкретизм"
yuc_flavor.7.d: "Пока мы работаем над укреплением веры Крусоб и внедрением полного майяско-католического синкретизма, среди масс начало развиваться уникальное новое культурное течение. Без нашего указания или приказа народ - открыто принимая эту веру, столь долго подавляемую, - начал приспосабливать свой образ жизни, культурные установки и традиции к этим новым синкретическим нормам. Религиозные церемонии и мессы, использующие элементы обеих половин нашей религии, начали распространяться по всему Юкатану, пока люди вплетают новую веру в свою повседневную жизнь. Более того, новая архитектура, искусство и музыка, черпающие вдохновение как из наших влияний Нового Света, так и Старого Света, начали распространяться, создавая новую общую культуру, вокруг которой сможет сплотиться наш недавно освобождённый народ. Соединив прошлое с настоящим, традиции майя и местных католиков будут сохранены, тогда как более варварские стороны обеих культур останутся на страницах истории."
yuc_flavor.7.a: "Богом и К’ук’ульканом мы достигнем рая!"

yuc_flavor.8.t: "Помня Чан-Санта-Крус"
yuc_flavor.8.d: "Мы никогда не должны забывать жертвы тех, кто был до нас и сделал возможным наше независимое государство. От восстания Чан-Санта-Крус до Кастовой войны и нашей собственной пламенной борьбы за независимость, война стала реальностью для нашего народа. Пока мы теперь движемся к мирному времени и тяжёлой работе по строительству нации, которая с ним приходит, генерал Франсиско Май Печ желает отдать почести всем тем, кого мы потеряли. Воздвигнув массивную колонну победы на месте первоначального восстания Чан-Санта-Крус, мы будем содержать прекрасный мемориал, служащий напоминанием будущим поколениям о том, как доблестно и храбро сражались те, кто погиб за нашу независимость. Более того, первоначальная святыня на этом месте также должна быть отремонтирована и обновлена, а рядом будет возведён огромный пирамидальный собор, соединяющий образы и архитектурные решения традиционных католических часовен здесь, в Мексике, с внушительной каменно-тёсаной мощью древних храмовых комплексов майя. С этими памятниками тем, кого мы потеряли, и нашему новому пантеону, возрадуемся же все и построим утопию, ради создания которой умерли наши праотцы."
yuc_flavor.8.a: "Мы никогда не забудем тех, кто отдал свои жизни, чтобы привести нас сюда."

yuc_flavor.9.t: "Отделить возрождение майя от экстремизма"
yuc_flavor.9.d: "Мы дети первоначальной Лиги Майяпана, но мы не можем пасть в ту же дикость, в которую пали наши предки. Даже сейчас экстремисты, преданные нашему делу, применяют насилие против частей нашего населения, пытаясь навязать свои майя-центричные гипернационалистические взгляды, искажённые язычеством и дезинформацией. Мы не можем позволить этим заблудшим сынам Бога и К’ук’улькана довести репутацию нашего движения до гибели. Мы должны полностью отделить наше современное движение от этого жестокого и радикального экстремизма, ибо он противоречит мирным и синкретическим взглядам, которые отстаивают Май Печ и центральная партийная линия."
yuc_flavor.9.a: "Майя всегда будут иметь здесь место. Экстремизм - нет."

yuc_flavor.10.t: "Смерть испаноязычному Юкатану"
yuc_flavor.10.d: "Освободившись от мексиканских угнетателей, которые веками попирали наш народ и наше право на существование, мы наконец оказались в положении, позволяющем свершить нашу месть. Однако наше промайяское движение раскололось в вопросе о том, что делать с большим испаноязычным населением в нашем Юкатане. Наш лидер - храбрый и уважаемый генерал Май Печ - вместе со своей лоялистской кликой выступает за то, чтобы показать этим потерянным и введённым в заблуждение душам ошибочность их пути, принять их в нашу новую веру и оставить старые обиды позади, пока мы движемся к нашему общему раю. Однако майяские радикалы вместо этого продвигают менее прощающий вариант, выступая за то, чтобы каждый чистокровный католический испаноязычный житель Юкатана был изгнан из нации или хуже. Такой шаг быстро очистил бы наше государство и ускорил бы наши промайяские амбиции, но оттолкнул бы от нас большие слои населения, одновременно запятнав нашу репутацию в глазах международного сообщества. Какой должна быть наша политика в отношении испаноязычных?"
yuc_flavor.10.a: "Никогда вновь мерзкие сыны Кортеса не будут искажать нашу культуру. Смерть испаноязычным!"
yuc_flavor.10.b: "Мы направим их к свету нашей веры, показав им ошибочность их пути."

yuc_flavor.11.t: "Майяский аграризм"
yuc_flavor.11.d: "Создать полностью аграрную экономику само по себе, естественно, довольно легко в сельском Юкатане. Однако создать аграрную экономику, которая будет устойчивой, прибыльной и эффективной, - совсем другая история, особенно когда большая часть нации всё ещё живёт полufeодальным образом жизни. Мы приступили к исправлению этих проблем, беря пример с наших предков, которые некогда использовали подсечно-огневое земледелие на обширных пространствах полуострова Юкатан, чтобы поддерживать нашу конфедерацию городов-государств. Однако в прошлом применявшиеся методы приводили к эрозии почвы, дефициту питательных веществ, поскольку минералы вымывались в джунгли, проблемам с паразитами и другим препятствиям на пути к эффективному земледелию. Мы исправим эти старые ошибки, внедряя новые технологии, практики, инструменты и знания, полученные в современную эпоху, чтобы создать аграрный рай, одновременно эффективный и прибыльный, но при этом сохраняющий связь с нашими древними обычаями."
yuc_flavor.11.a: "Мы не повторим тех же губительных для почвы ошибок, что совершали в прошлом."

yuc_flavor.12.t: "Социалистический король Табаско возвращается домой"
yuc_flavor.12.d: "Наконец прибыв в Табаско, где он дважды служил губернатором, внедряя собственную версию тоталитарного, но эгалитарного социализма, Томас Гарридо Канабаль был почти в восторге от мысли расквитаться с теми, кто изгнал его из любимого феода. Продолжая свои чистки против духовенства города, а также против своих политических врагов и потенциальных хулителей, Канабаль очистит Табаско так же, как он очистил весь Юкатан. Социалистический король и тоталистский тиран Табаско наконец вновь вернулся домой, и мы позаботимся, чтобы все это знали."
yuc_flavor.12.a: "Теперь Табаско, а вместе с ним и весь Чьяпас, смогут ощутить блага нашей Революции."

yuc_flavor.13.t: "‘Либерализм’ Канабаля"
yuc_flavor.13.d: "Стремясь принести в Юкатан собственную форму марксистского и большевистски вдохновлённого тотализма, генерал Канабаль начал лично навязывать свои взгляды под дулом оружия. Провозглашая радикальный феминизм, антиклерикализм, антирасизм и гражданские права для всех верных детей Юкатана, он безумно предан защите и распространению этих взглядов, даже если ему приходится прибегать к насилию - что он делает часто. Будь то расстрел очередного виски-священника, пойманного на присвоении пожертвований, или уничтожение потенциального насильника или расистской толпы линчевателей, Канабалю всё равно, кого ему придётся снести, чтобы достичь своей эгалитарной мечты, свободной от пороков и грехов прошлого Юкатана. Все будут равны, свободны от Бога и свободны от капитализма, все будут в безопасности и под защитой мощи генерала Канабаля и его совершенного, кровавого образа чистой Революции."
yuc_flavor.13.a: "Грешникам и любителям порока нет места в нашей Революции."

yuc_flavor.14.t: "Дом Канабаля на ранчо"
yuc_flavor.14.d: "Мексика и её соседи давно были землёй, где господствуют фермы и ранчо, но одно из самых прекрасных ранчо во всей Центральной Америке принадлежит не кому иному, как самому Канабалю. Расположенная в Юкатане близ границы с Мексикой, эта многосотакровая полоса пастбищ является первозданным, идиллическим примером милой ранчерской жизни. Здесь Канабаль живёт со своей женой и двумя детьми, Лениным и Соилой Либертад, названными так, чтобы показать его преданность своим идеалам. У него даже есть собственный зверинец сельскохозяйственных животных при этом ранчо: бык по имени Бог, вол и боров, оба по имени Папа, тёлка по имени Мария и осёл по имени Христос - всё это явная шутка и насмешка над христианским теизмом, который он так ненавидел. Используя это ранчо как своё убежище от стресса правления нацией, а также как учебный центр для местной молодёжи, которую обучают путям истинной марксистско-большевистски вдохновлённой Революции, поместье Канабаля, несомненно, представляет собой любопытное зрелище."
yuc_flavor.14.a: "Милая картина идиллического центральноамериканского образа жизни."

yuc_flavor.15.t: "Новое высокое искусство Юкатана"
yuc_flavor.15.d: "Будучи всегда эксцентриком, Канабаль был известен тем, что пробовал себя в самых разных хобби и занятиях, которые приходились ему по вкусу. Возможно, наиболее известной из этих странных одержимостей является любовь Канабаля к постановке сатирических пьес, высмеивающих идеи и людей, которых он презирает. В одной такой недавней пьесе жеребец расхаживал в роли епископа истории, тогда как осёл играл Папу, в привязанной одежде и шляпах, чтобы полностью продать представление. Эти пьесы были воспроизведены и показаны по всему Юкатану, распространяя юмор и риторику Канабаля в более дружелюбном свете."
yuc_flavor.15.a: "Лучше Бродвея."

yuc_flavor.16.t: "Лаборатория Революции"
yuc_flavor.16.d: "Канабаль давно стремился превратить собственный феод в то, что он называет ‘Лабораторией Революции.’ Сначала пытаясь сделать это в Табаско с некоторым успехом, теперь он попытался сделать то же самое здесь, в Юкатане. Распространяя собственную разновидность марксистской мысли и игнорируя тех, кто называет его правым или реакционером в красной и революционной одежде, Канабаль создаст собственное видение социалистической утопии здесь, на нашем полуострове. Преданный Марксу и тотализму превыше всего, Канабаль принесёт истинную Революцию в наш сельский оазис."
yuc_flavor.16.a: "Вифлеем американского социализма теперь занимается!"

yuc_flavor.17.t: "Юкатан, свободный от порока"
yuc_flavor.17.d: "По приказу Альварадо в Юкатане объявлена война пороку. По всему нашему государству алкоголь и запрещённые наркотики бросают в огромные костры, сжигая их в приступе революционного пыла, пока хищнические притоны греха и злоупотреблений раскрываются публике и сносятся. Азартные игры объявлены незаконными, алкоголь запрещён, а алкоголизм стал основанием для развода, чтобы спасти оказавшихся в ловушке женщин от жестоких браков. Уникальным образом проституция также была легализована, а женщины защищены законом и подлежат регулярным проверкам здоровья и безопасности, чтобы это оставалось честным делом. Социалистический либерализм и гражданские права распространились повсюду для всех, создавая эгалитарное общество и культуру под бархатным кулаком генерала Альварадо. Хотя он может править без равных, он действительно является благожелательным, заботливым и популистским тираном, стремящимся принести процветание и безопасность всем в нашем Юкатане."
yuc_flavor.17.a: "Эгалитарная и скромная утопия, объединённая против греха и порока под властью Альварадо."

yuc_flavor.18.t: "Герой Революции"
yuc_flavor.18.d: "Сегодня нация собралась вместе, чтобы почтить генерала Сальвадора Альварадо, ибо именно он повёл нашу нацию к независимости, свободе и эгалитарному социализму. Под властью этого благожелательного деспота наш Юкатан вступил в новый золотой век социального, культурного и экономического прогресса, создавая по-настоящему прогрессивное и равное общество под бархатным кулаком Альварадо. Статуи этого героя и тех, кто помогал ему в нашей борьбе, таких как Фелипе Каррильо Пуэрто, были воздвигнуты по всей нации, тогда как музеи и художественные галереи выставляют произведения, запечатлевающие величие и героизм Альварадо и его союзников. Один из самых любимых и уважаемых людей во всей Центральной Америке, Альварадо почти без усилий развил вокруг себя культ личности, позволяющий ему легко сгибать Юкатан под свою прогрессивную волю."
yuc_flavor.18.a: "Благожелательный диктатор, если такие вообще бывают."

## radsocs
yuc_flavor.19.t: "Речь Пуэрто"
yuc_flavor.19.d: "В речи, обращённой к городу Мерида со сцены в центре Пласа-Гранде, Фелипе Каррильо Пуэрто говорил с массами Юкатана о своих планах построить аграрный демократический социалистический рай, основанный на сильном центральном правительстве с примыкающими земельными коллективами и коммунами. Заявляя о своей приверженности таким идеям, как гражданские права, феминизм и включение народа майя в Революцию, Пуэрто извергал риторику подобно истинному смутьяну, когда наконец прозвучал выстрел. Пуэрто рухнул на сцену, пока одинокий стрелок пытался скрыться через толпу, прежде чем сам был застрелен местными красными ополченцами. Пока Пуэрто лежал в растущей луже собственной крови, его сестра Эвита - сама преданная социалистка, разделявшая большинство тех же идей, что и её брат, - бросилась к нему, чтобы прижать его рану. Когда прибыли медики, положение выглядело тяжёлым, но всё ещё оставалась надежда, что президент Пуэрто выживет."
yuc_flavor.19.a: "Пуэрто убит, и его сестра Эльвия возвышается, чтобы занять его место на посту Президента."
yuc_flavor.19.b: "Пуэрто переживает покушение на свою жизнь и остаётся Президентом, преданным делу сильнее, чем когда-либо."

yuc_flavor.20.t: "Первая женщина-руководитель Юкатана"
yuc_flavor.20.d: "После убийства президента Фелипе Каррильо Пуэрто его сестра Эльвия Каррильо Пуэрто возвысилась, чтобы занять его место на посту Президента Юкатана. Убеждённая феминистка и социалистка, как и её брат, Эльвия известна своей поэзией и сочинениями, а также заметным уклоном в сторону децентрализованного аграрного социализма и лёгких анархистских принципов. С Эльвией у руля, первой женщиной-руководителем Юкатана, мы продолжим мечту Фелипе об эгалитарной и аграрной социалистической утопии здесь, на нашем полуострове, лишь слегка изменив её, чтобы расчистить путь децентрализующим реформам Эльвии."
yuc_flavor.20.a: "Под видением Эльвии мы достигнем мечты Фелипе."

yuc_flavor.21.t: "Окрасить майя в красный"
yuc_flavor.21.d: "Выросший среди майя, говоривший на майятанском языке всю свою юность и сам имеющий частично майяское происхождение, президент Пуэрто решил в определённом смысле окрасить майя в ‘красный’ цвет, пересказывая их историю и культуру через социалистическую призму, чтобы ещё сильнее интегрировать и включить их в нашу Революцию. Синкретическая вера Крусоб, объединяющая майяскую и католическую догму, а также небольшой, но возрождающийся культ К’ук’улькана, будут поддержаны государством - хотя мы воздержимся от их активного продвижения, чтобы сохранить верность нашим секулярным обещаниям. Тем временем гражданам майя будут предоставлены большая автономия, права, защита, а также стимулы или послабления, чтобы облегчить их жизнь, пока они стараются жить согласно своим традиционным обычаям. Майя станут союзниками нашего революционного дела и полноценной частью нашего нового государства и культуры, пока мы создаём собственную версию майяско-социалистического синкретизма."
yuc_flavor.21.a: "Все истинные дети нашего полуострова, даже майя, являются социалистами."

##syndies

yuc_flavor.22.t: "Пансоциалистический саммит"
yuc_flavor.22.d: "Следуя стратегии президента Корреа начать мирные переговоры с широким спектром радикальных левых, присутствующих в Юкатане, в столице был проведён саммит. Пригласив все основные левые группы, действующие на полуострове, саммит собрал представителей и лидеров всех разновидностей левых - от социал-демократов из ПСО О’Хорибе до тоталитарных марксистов Канабаля и его Камисас Рохас. Как и следовало ожидать, этот саммит быстро скатился в междоусобицу, поскольку радикалы самых разных взглядов спорили и дрались из-за того, какая интерпретация социализма является правильным путём вперёд. Встреча оборвалась внезапно и довольно жестоко, когда один из делегатов Красных рубашек вытащил револьвер и застрелил одного из немногих присутствовавших либералов, объявив его реакционным шпионом. Когда саммит растворился в хаосе, кортеж Корреа быстро покинул место вместе с теми немногими социалистическими лидерами, с которыми ему удалось добиться хоть какого-то прогресса, включая Филипе Пуэрто и генерала Альварадо. Похоже, что мечта объединить всех левых Юкатана под одним багровым знаменем - лишь несбыточная фантазия."
yuc_flavor.22.a: "Вот тебе и левое единство."

yuc_flavor.23.t: "Трудности с индустриализацией"
yuc_flavor.23.d: "Поскольку покрытая джунглями и сельская реальность Юкатана оказалась болезненно очевидной, мы начали сталкиваться с первыми препятствиями на пути к созданию современного, городского и промышленного синдикалистского государства. По всему нашему полуострову новые промышленные инициативы замедлились, борясь с суровой местностью нашей родной земли - проблемой, с которой не сталкивались в зелёных землях Западной Европы, где эта идеология была впервые теоретически разработана. Чтобы справиться с этой реальностью, мы начали применять два разных подхода к нашему продвижению к синдикализму. В районах, которые слишком трудно полноценно развивать, мы изменим наши стратегии, придав им более аграрную и сельскую форму, чтобы работать с природными особенностями местности. Однако на землях, которые возможно развить полностью, мы будем индустриализировать и урбанизировать, используя грубую силу и мощь нашего нового импортного оборудования из Америки и Европы. Мы приспособим синдикализм под наши нужды так же, как подчиним окружающую среду нашим прихотям."
yuc_flavor.23.a: "Мы достигнем современности, шаг за шагом."

##shared
yuc_flavor.24.t: "Обнаружены археологические памятники майя"
yuc_flavor.24.d: "При помощи иностранных археологов из Института Карнеги, включая Татьяну Проскурякову, Эдвина Шука, Карла Рупперта, Дж. Эрика Томпсона и А. Л. Смита, по джунглям Юкатана были обнаружены многочисленные новые археологические памятники доклассических майя. Поскольку эти иностранные учёные и академики работают совместно с местными раскопочными группами и экспертами майя, при щедром финансировании нашего режима, эти места начали стремительно извлекаться из земли, а недавно были обнаружены утраченный город Майяпан и некогда потерянные части Чичен-Ицы. Остаётся лишь надеяться, что со временем будет найдено и восстановлено ещё больше. А до тех пор государство приняло меры, чтобы защитить эти места от дальнейшего вреда."
yuc_flavor.24.a: "Утраченные творения наших предков найдены!"

yuc_flavor.25.t: "Кратер"
yuc_flavor.25.d: "Потрясающие до основания новости достигли столицы: недавние проекты развития вдоль северного побережья Юкатана обнаружили нечто умопомрачительное. Названный кратером Чиксулуб из-за близости к общинам Чиксулуб-Пуэрто и Чиксулуб-Пуэбло, этот огромный частичный кратер, похоже, выступает прямо в океан, покрыт джунглями и настолько велик, что его было почти невозможно обнаружить нынешним оборудованием. При предполагаемом размере примерно 110 миль, или 180 км, в диаметре и глубине 12 миль, или 20 км, этот кратер поистине чудовищен по своим масштабам. Судя по всему, это ударный кратер от чего-то большого, двигавшегося с огромной скоростью, а некоторые из более молодых пород в кратере датируются более чем 66 миллионами лет, намекая, что всё, что это вызвало, произошло в последние мгновения Эпохи динозавров. Что именно стало причиной этого, неизвестно, хотя некоторые безумно воодушевлённые учёные утверждают, что это могло быть только результатом падения некоего астероида на Землю миллионы лет назад, и что это событие, вероятно, должно было вызвать массовое вымирание. Какова бы ни была правда, мы будем изучать это геологическое чудо ещё десятилетиями."
yuc_flavor.25.a: "Интересно, что же это вызвало."

##marlibs
yuc_flavor.26.t: "Предубеждения Брито"
yuc_flavor.26.d: "Хотя президент Брито является стойким защитником рыночной экономики, капитализма и либерального консерватизма, он всегда заигрывал с более радикальными идеями. Ветеран Революции и нашей борьбы за независимость, Брито имеет тесные связи с армией. Более того, во время своего пребывания в Мексике он был известен поддержкой различных националистических организаций, таких как PRUN и PARM, а также некоторых аспектов синархистской мысли, будучи при этом убеждённым сторонником Хуана Альмасана и покойного Каррансы. Не утратив этих предпочтений, президент Брито начал медленно и тихо внедрять некоторые менее крайние политики и идеи своих кумиров Каррансы и Альмасана, создавая новый сплав мексиканского национального консерватизма и юкатекского свободнорыночного капитализма и либерализма. Будем надеяться, что эта новая синкретическая идеология принесёт славу, прибыль и процветание нашей молодой республике."
yuc_flavor.26.a: "Националистический капитализм, подогнанный под Юкатан."

yuc_flavor.27.t: "Антиальварадистская акция"
yuc_flavor.27.d: "Давно имея профессиональное соперничество как в политических, так и в военных делах, президент Брито и генерал Альварадо представляют две полные противоположности юкатекской армии. Теперь, когда Брито и его клика капиталистов и националистов возглавляют нацию, коалиция Альварадо из социалистов, прогрессистов и популистских милитаристов постепенно начала отходить в тень. Брито особенно тщательно занялся подрывом как положения Альварадо в армии, так и культа личности и образа героя, который естественно возник вокруг него среди масс, ведь народ некогда видел в нём несравненного героя, как американцы смотрят на своего любимого Вашингтона. Однако администрация Брито начала срывать маску с этого переодетого тирана, раскрывая его автократические замашки и раздувая его жестокость во время войны за нашу независимость, чтобы запятнать его репутацию. Благодаря этим нападкам Альварадо вскоре станет именем прошлого, забытым и опозоренным, пока президент Брито возвышается как новый герой нашего Юкатана."
yuc_flavor.27.a: "Мы покажем этого социалистического тирана таким, каков он есть на самом деле!"

##soccon deez nuts lmao
yuc_flavor.28.t: "Очищение армии"
yuc_flavor.28.d: "Долгое время служивший в вооружённых силах Юкатана, как до, так и после нашей недавно завоёванной независимости, президент [root.getleader] продолжил это сотрудничество и в свой срок, чрезвычайно сблизив армию с президентской властью. Однако, работая совместно с верховным командованием армии, он предпринял серьёзные шаги для искоренения многих проблем, с которыми сталкиваются наши вооружённые силы. Борясь с коррупцией, кумовством, варварством, азартными играми и прочими грехами, порождёнными нашими солдатами и офицерами, президент Гутьеррес стремится очистить все вооружённые силы целиком и привести их в соответствие с доброй христианской моралью и этикой. Хотя наши вооружённые силы, разумеется, останутся светскими, это не значит, что мы не можем привить нашим солдатам то же базовое уважение к человечности и дисциплину, какие демонстрирует всякий добрый христианин."
yuc_flavor.28.a: "Армия Юкатана ещё никогда не была чище."

yuc_flavor.29.t: "Христианский секуляризм для Юкатана"
yuc_flavor.29.d: "Сотрудничая с Церковью, но по-прежнему оставаясь преданными светскому республиканизму, новые христианские союзы и гуманитарные миссии по заботе о майя и бедняках были созданы по всему Юкатану при поддержке наших католических союзников. Эти программы, вместе с новыми программами по формированию морали и этики, были внедрены, пока президент [root.getleader] пытается отдалить свою PRY и весь Юкатан от радикализма, при этом сохраняя полезные экономические программы Революции. Эти новые инициативы служат компромиссом между полным социализмом и нашими христианскими обязанностями и приверженностью консерватизму, принося полезный популизм в католической обёртке всем нуждающимся."
yuc_flavor.29.a: "Мы построим нравственный и гуманистический полуостров."

##sucdem
yuc_flavor.30.t: "Медицинские корни"
yuc_flavor.30.d: "Долгое время будучи практикующим врачом, некогда проводившим бесплатные операции для бедных во время Революции, президент О’Хорибе решил вновь открыть собственную частную медицинскую практику как первый шаг в своём новом плане реформирования системы здравоохранения Юкатана. Используя собственную практику как испытательную площадку, он внедрит план бесплатного и всеобщего здравоохранения в своём родном городе. Если он окажется успешным, он планирует распространить его на весь Юкатан, одновременно строя новые больницы и бесплатные клиники, чтобы вытащить медицинскую сеть нашей нации из XVIII века. При докторе и президенте О’Хорибе все в Юкатане смогут получать необходимое здравоохранение и лекарства, чтобы жить долгой, счастливой и полноценной жизнью в нашем новом социал-демократическом раю."
yuc_flavor.30.a: "Мы сделаем систему здравоохранения Юкатана предметом зависти всей Центральной Америки."

yuc_flavor.31.t: "Подавление бунтов Красных рубашек"
yuc_flavor.31.d: "В ответ на нашу антирадикальную кампанию Камисас Рохо генерала Канабаля начали бунтовать в столице, распространяя ужас и кровопролитие, прокладывая путь хаоса через Мериду. Быстро двинувшись, чтобы сдержать ситуацию, президент О’Хорибе немедленно приказал армии войти в город, но даже доблести генерала Альварадо оказалось недостаточно, чтобы остановить буйство Канабаля. Однако ход событий наконец начал оборачиваться против Красных рубашек, когда генерал Франсиско Май Печ и его Движение майя вошли в город, чтобы помочь в конфликте. Когда силы О’Хорибе и Мая Печа начали действовать совместно, Красные рубашки были наконец побеждены, а Канабаль и остальное руководство Красных рубашек были приговорены к пожизненному заключению или казни. Однако с исчезновением Канабаля мы лишь оказались в долгу перед Маем Печем и его людьми, которые теперь стали требовать большей автономии и свобод для майя. Похоже, что, что бы мы ни делали, нам не удаётся избежать радикализма."
yuc_flavor.31.a: "Радикализм пришёл в Юкатан надолго."

##soclib 
yuc_flavor.32.t: "Общество креольских деятелей"
yuc_flavor.32.d: "Изначальные санхуанисты были группой юкатекских повстанцев из Мериды, которые отдалились от Испанской короны, одновременно принимая идеи французского Просвещения. Их либеральные и либертарианские идеи не только легли в основу платформы нашей партии, но и стали фундаментом движения за независимость Юкатана в целом. Мы решили почтить этих первых героев нашего полуострова, воздвигая новые статуи и называя новые здания и площади в их честь. Более того, президент Ромеро попытался возродить и вновь популяризировать многие их идеи, распространяя собственные переводы различных просветительских романов знаменитых авторов вроде Вольтера. Будем надеяться, что усилиями Ромеро истинный либерализм, свободный от пятна социалистической мысли, наконец сможет вновь расцвести здесь, в Юкатане."
yuc_flavor.32.a: "Мы чтим этих героев юкатекского либерализма."

yuc_flavor.33.t: "Повестка президента Ромеро"
yuc_flavor.33.d: "Пытаясь открыть собственную форму радикально прогрессивного общественного преобразования в рамках Честного курса, президент Ромеро также начал обращаться ко многим своим старым интересам на благо государства. Вновь открыв торговые и дипломатические связи с Японией, используя связи, заведённые им во время службы в министерстве иностранных дел и за рубежом, Ромеро обеспечил жизненно важные новые и прибыльные торговые соглашения, которые помогают сделать возможными наши крупные расходы. Более того, используя знания, полученные за карьеру педиатра, Ромеро начал внедрять серию реформ здравоохранения и общественного здоровья, направленных на то, чтобы сделать медицину и медицинскую помощь более доступными и лёгкими для получения, одновременно вынуждая большинство рабочих мест предоставлять базовый медицинский план и строя новые клиники по всей нации. Либерал на все руки, Ромеро начал пожинать большие плоды своих многочисленных направлений и интересов для республики."
yuc_flavor.33.a: "Наши либеральные идеалы сияют, словно яркий маяк, на который могут взирать все."

yuc_flavor.34.t: "О статусе компании Wrigley"
yuc_flavor.34.d: "Последние несколько десятилетий американская компания Wrigley действовала на наших землях, собирая дикую камедь чикле, выделяемую деревьями рода Manilkara. Эти янки используют эту камедь - собираемую людьми, которых называют ‘охотниками за чикле’ - для производства своей знаменитой жевательной резинки, и до нашего восстания у них было приемлемое соглашение с мексиканским правительством. Теперь, когда наше восстание увенчалось успехом, а Третья Республика Юкатан провозглашена, мы должны решить, что делать с этой иностранной компанией."
yuc_flavor.34.a: "Запретить компанию и национализировать все активы."
yuc_flavor.34.b: "Запретить компанию и продать её части общественности."
yuc_flavor.34.c: "Позволить компании продолжить деятельность, пока она платит причитающееся."

yuc_flavor.35.t: "Наш собственный валлиец"
yuc_flavor.35.d: "Солдат удачи и ветеран-наёмник, которому мало равных, рождённый в Индии валлиец Кэрил ап Рис Прайс является одним из величайших активов под нашим командованием. Полноценный офицер и генерал в нашем военном штабе, этот всемирно известный ветеран Англо-бурских войн, рейдов Вильи в Америку, Магонистского восстания 1911 года в Нижней Калифорнии, порфирианского режима, восстания матабеле и многого другого решил служить нашему движению за независимость после ухода из Мексиканского иностранного легиона и последующих нескольких десятилетий в бегах. Будучи даже прямым потомком средневекового валлийского борца за свободу Оуайна Глиндура и младшим братом британско-индийского генерала сэра Генри ап Риса Прайса, Кэрил имеет в крови благородный воинский дух и склонность к военному командованию, и он поклялся использовать этот врождённый и закалённый войной опыт в партизанской войне, артиллерийской тактике и саботаже, чтобы привести наше государство к свободе и величию."
yuc_flavor.35.a: "Пусть этот ветеран-наёмник хорошо послужит нам."

yuc_flavor.36.t: "Месть похитителям чикле"
yuc_flavor.36.d: "Джунгли нашего зелёного полуострова давно ценятся за растения рода Manilkara, которые желанны благодаря своей способности производить липкую камедь чикле, жизненно важную для производства жевательной резинки. Почти вся камедь чикле в мире добывается с деревьев здесь, в Юкатане, или в соседних Гватемале и Белизе, силами чиклеро, и потому компании со всего мира ведут добычу в наших джунглях. Когда такие крупные имена, как Wrigley Gum Company, причиняют ущерб нашей земле и лесам, необходимо что-то предпринять. Больше этим чужеземцам не будет позволено терзать нашу экосистему, и больше им не будет позволено порабощать наш народ ради своего грязного, тяжёлого труда.\n\nПоскольку [root.getleader] питает личную ненависть к этим паразитам, ведь именно вторженческие и угнетающие сборщики камеди во многом подтолкнули его к радикализму и восстанию против всех иностранных захватчиков Юкатана в целом, он объявил войну этим насекомым. По всему нашему полуострову их активы и ресурсы будут захвачены, их добывающие предприятия будут разобраны или взяты под контроль государством, а сами паразиты будут истреблены, если не сбегут. Мы очистим наши леса и дадим им исцелиться, пока наконец приступим к обеспечению безопасности нашего Эдема."
yuc_flavor.36.a: "Эти чужеземные воры проклянут день, когда впервые украли у нашего Юкатана."

yuc_flavor.37.t: "Вопрос лидерства"
yuc_flavor.37.d: "Стремясь вернуться к собственной медицинской практике и желая вновь скрыться от общественного внимания, президент О’Хорибе выступил за то, чтобы партией правил его правая рука и союзник Альваро Торре Диас. Дважды бывший губернатором Юкатана до нынешнего момента, Диас является одним из немногих людей, действительно знающих все входы и выходы этого хаотичного полуострова, и был бы идеальной кандидатурой на роль преемника О’Хорибе, особенно учитывая его связи и прежнюю дружбу с национальным героем генералом Альварадо, а также его глубокую связь с социалистическим, прогрессивным и демократическим движениями нашего изолированного джунглевого дома. Хотя многие всё ещё клянутся в верности и преданности президенту О’Хорибе, ещё больше людей поддерживают его желание удалиться к частной и мирной жизни, и теперь выбор лежит на нём самом."
yuc_flavor.37.a: "Остаться с президентом О’Хорибе. Он хорошо послужил нации."
yuc_flavor.37.b: "Выбрать Альваро Торре Диаса. Его новые идеи приведут нас к процветанию."

yuc_flavor.38.t: "Истинный наследник майя?"
yuc_flavor.38.d: "Хотя Франсиско Май Печ доблестно служил как последний из изначальных командиров майя, десятилетиями, если не веками восстававших против испаноязычного господства в Чан-Санта-Крус и за его пределами, он не принадлежит к истинной королевской крови, ибо, несмотря на своё майяское происхождение, Май Печ всего лишь простолюдин, пусть и преданный делу. Однако мы вступили в контакт с господином благородной майяской крови, что открывает возможность воссоздать династическую связь с первоначальными Ахау. Его зовут дон Немесио Шиу Перес, он является прямым потомком королевского рода Шиу - также называемого Тутуль-Шиу/Тутуль Шиу или даже Мани - и через эту семейную линию среди его предков числится царь, или Ахау, Ах Суйток Тутуль Шиу, создавший династию в знаменитом храмовом городе Ушмаль, впервые основанном его ранним предком Хун Уициль Чак Тутуль-Шиу, который вместе с Майяпаном и Чичен-Ицей создал устойчивую коалицию городов-государств на севере Юкатана, известную как Лига Майяпана, а также Ах Шиу Шупан, последний царь Ушмаля, вызвавший массовую междоусобицу внутри Лиги из-за своего соперничества с династией Коком из Тиболона по наущению самих лидеров Майяпана, что в итоге привело к её падению.\n\nМягко говоря, спорная царственная история, однако дон Немесио всё ещё несёт в своих венах пурпурную кровь майяской знати, несмотря на избранный им образ жизни крестьянина-фермера, живущего за пределами города Тикуль. И хотя многие активно сопротивляются идее его коронации и полной эволюции нашего движения в туземный монархизм, ссылаясь на беспокойных предков Немесио, куда больше людей поддерживают наследие Немесио как наследника Ах Суйтока Шиу Основателя и предполагаемое сходство Немесио с католическо-майяским синкретическим народным святым/божеством Максимоном, также известным как Сан-Симон, по крайней мере в глазах крусобистов, что придаёт этой идее большой вес внутри нашего движения. Должен ли командир Май Печ уйти со своей позиции лица нашей администрации, чтобы стать Халач Уиником, или Владыкой, и вновь меньшим Ахау под властью этого нового верховного царя, уступив место монархическому фасаду, пока сам управляет делами из-за кулис и выращивает наследственный и благородный пост фигуры-символа в виде возрождённой династии Шиу, или нам следует подойти к этому развитию более умеренно?"
yuc_flavor.38.a: "Немедленно короновать его как К’ухуль Ахау Ах Суйтока Немесио Тутуль-Шиу Второго!"
yuc_flavor.38.b: "Немедленно короновать его как короля Максимона Первого!"
yuc_flavor.38.c: "Немедленно короновать его как короля Немесио I из дома Шиу!"
yuc_flavor.38.e: "Даровать ему место в совете советников Мая Печа как почётному Ахау."
yuc_flavor.38.f: "Позволить этому голубокровному майяскому царственному потомку мирно жить тихой жизнью фермера, какой он всегда и жил."

yuc_flavor.39.t: "Майяские амбиции в Центральной Америке"
yuc_flavor.39.d: "Хотя мы объединили старые земли майя, Франсиско Май Печ счёл вероятным, что мы столкнёмся с режимами Центральной Америки, включая гватемальцев, которые уже проживают под нашей властью. И потому возникает вопрос, как нам следует смотреть на подчинение их земель, когда придёт время: некоторые в нашем движении выступают за прямое распространение нашего возрождённого государства на их земли, принося им власть нашей новой империи, защищая эти земли от возможных угроз и распространяя наши принципы за пределы традиционных майяских земель."
yuc_flavor.39.a: "Они не из майя, хотя мы можем стать их хозяевами."
yuc_flavor.39.b: "Наша власть освободит Центральную Америку от её испаноязычного правления."

yuc_flavor.40.t: "Центральноамериканские амбиции?"
yuc_flavor.40.d: "Хотя мы сочли нужным привести армии Юкатанской республики в изобильные земли Центральной Америки, мы ещё не прояснили свои намерения в отношении неё. Либо мы просто намерены направить её на путь, который лучше послужит интересам как нашим, так и её народа, либо, как предполагают некоторые, полуостров Юкатан должен стать родиной новой Центральной Америки, объединённой под нашим праведным и благожелательным правлением от Мексиканского залива до Дарьенского разрыва."
yuc_flavor.40.a: "Мы не должны повторять зло оккупации, против которого так упорно боролись."
yuc_flavor.40.b: "Наше благожелательство создаст сияющее будущее для всей Центральной Америки."