POLITICS_XIE_XUEHONG_DESC: "§YРодилась:§! 17 октября 1901 года, уезд Чжанхуа, Японский Тайвань, Японская империя\n§YПолитическая карьера:§! Свобода наконец пришла на Тайвань, и произошло это в немалой степени благодаря иностранной помощи, но также благодаря неустанной революционной деятельности Тайваньской синдикалистской партии. Се Сюэхун, Цзянь Цзи и многие другие присоединились к Тайваньской культурной ассоциации в её борьбе за независимость или автономию Тайваня и демократию. Однако Ассоциация быстро погрязла во внутренних распрях, не говоря уже о японских репрессиях, и вскоре от неё откололось множество различных групп.\n\nСе состояла в Китайской синдикалистской партии и училась за границей в Университете имени Сунь Ятсена во Франции, прежде чем в 1928 году при негласной поддержке как японских, так и китайских социалистов основала Тайваньскую синдикалистскую партию. Хотя она допускает участие буржуазии в движении за независимость, Се остаётся убеждённой социалисткой и с тех пор окончательно разошлась с Тайваньской народной партией Цзян Вэйшуя. TSP заявляет, что именно она представляет более подлинное толкование Трёх народных принципов, обличая «ложь» TPP и регулярно, хотя зачастую безуспешно, соперничая с ней за поддержку крестьян и рабочих.\n\nОднако, в отличие от многих своих китайских товарищей-синдикалистов, Се утверждает, что Тайвань обладает собственной самобытностью и должен управляться тайваньцами, по крайней мере на местном уровне. Эта позиция стоила ей части личной поддержки, но в конечном счёте именно её точка зрения восторжествовала с созданием квазинезависимого правительства. Её партия по-прежнему расколота на радикальное и умеренное крылья, а несмотря на пышную освободительную риторику, реальная власть TSP в основном ограничивается крупнейшими городами. Сохранится ли этот режим после вывода иностранных войск или в итоге вновь объединится с дружественным Китаем либо Японией, ещё только предстоит узнать."

POLITICS_JIANG_WEISHUI_DESC: "§YРодился:§! 6 августа 1890 года, Илань, провинция Фуцзянь-Тайвань, Империя Цин\n§YПолитическая карьера:§! Учёный, врач и антияпонский активист Цзян Вэйшуй был одним из основателей Тайваньской культурной ассоциации. В знаменитом эссе «Свидетельство клинического диагноза» он описал пациента, страдающего от тяжёлого культурного недоедания, - Тайвань. Будучи талантливым оратором, Цзян неоднократно оказывался в тюрьме и в 1931 году едва пережил брюшной тиф.\n\nЕго постепенный дрейф влево вызывал немало удивления внутри Ассоциации, и вскоре после провала Гоминьдана в Северном походе Цзян создал Тайваньскую народную партию как его отколовшуюся фракцию. Сохранив приверженность Трём народным принципам, партия переняла схожую символику, однако во многих других вопросах дистанцировалась от Гоминьдана, что, впрочем, едва ли спасло её от японских репрессий.\n\nРазочаровавшись в неудачах мирного протеста, Цзян сосредоточил власть в собственных руках. Он регулярно вступает в конфликт со своим бывшим подчинённым Цай Пэйхо, который стремится удержать TPP в стороне от классовой борьбы и социализма. Однако после создания новой Республики их разногласия, по крайней мере временно, были улажены, а сам Цзян оказался возведён в статус национального героя.\n\nНекоторые называют его тайваньским Сунь Ятсеном, хотя если это действительно так, впереди его ждёт ещё немало работы. Тайваньская идентичность остаётся раздробленной, а сторонники объединения существуют как с Японией, так и с Китаем. Партийное государство Цзяна вряд ли сможет долго существовать в нынешнем виде, прежде чем попытается добиться автономии в составе одной из этих стран, но до тех пор его сторонники полны решимости преобразить тайваньское общество."

POLITICS_LIAO_WENKUI_DESC: "§YРодился:§! 14 ноября 1905 года, уезд Юньлинь, Японский Тайвань, Японская империя\n§YПолитическая карьера:§! Едва ли кто-то мог ожидать, что новое тайваньское государство примет форму республики под руководством молодых либералов из Товарищества восстановления Тайваня. Однако труды Ляо Вэнькуя и множества других молодых технократов, получивших образование за рубежом, убедили оккупационные власти обещаниями провести на острове глубокие демократические преобразования, и теперь именно им поручено создание временной Республики Тайвань.\n\nСемья Ляо была влиятельным местным родом крупных землевладельцев с сильными конфуцианскими традициями. Однако его отец принял христианство в рамках общего поворота семьи к Западу, а сам Ляо отправился учиться в Японию. Соединяя китайскую философию с западной наукой, он продолжил образование в Китае, в Цзиньлинском университете, а затем в Чикагском университете в Соединённых Штатах. Некоторое время он провёл и в Европе, где встретил будущую жену и одновременно продолжал формировать собственное политическое мировоззрение.\n\nПо мере роста напряжённости после распада Лиги Ляо оказался фигурой-посредником между противоборствующими группировками по обе стороны пролива. Вместе с братом Вэньи он принял управление компанией своего отца, переименовав её в Dacheng Industrial Co., и использовал предприятие для налаживания связей от Тайбэя до Шанхая.\n\nБлагодаря контактам со всеми политическими лагерями и образу человека, благожелательно настроенного к иностранцам, Ассоциация, возможно, действительно оказалась подходящим мостом между зарубежными «освободителями» и местным населением. Однако одного идеализма недостаточно, и зарождающаяся тайваньская демократия уже успела убедиться в этом на собственном опыте."

POLITICS_LIN_XIANTANG_DESC: "§YРодился:§! 22 октября 1881 года, Тайчжун, провинция Фуцзянь-Тайвань, Империя Цин\n§YПолитическая карьера:§! Линь Сяньтан состоял в Тайваньской культурной ассоциации, широком объединении тайваньских интеллектуалов, добивавшихся большей демократии и автономии в условиях японского правления. Происходя из богатой семьи землевладельцев, он участвовал в различных революционных обществах и в 1913 году даже отказался от японского подданства в пользу гражданства Китайской Республики. Японский язык он так и не выучил, предпочитая хоккиен, а в последнее время в частном порядке начал изучать мандаринский китайский.\n\nВ 1930 году Линь и многие другие деятели, недовольные левым поворотом Ассоциации и Тайваньской народной партии Цзян Вэйшуя, создали собственный Тайваньский союз за местное самоуправление. После ожесточённого разрыва их исключили из TPP, и они попытались протянуть японским властям мирную оливковую ветвь. Однако это им не помогло, и вскоре после TPP под запрет попала и их организация.\n\nТем не менее движение продолжило существовать, используя огромные ресурсы Линя и поддержку других тайваньских консерваторов, добивавшихся автономии, а некоторые из них осмеливались мечтать даже о независимости. Наконец их желание исполнилось после гибели Японской империи. При поддержке иностранных покровителей была восстановлена недолговечная Республика Формоза, и тем самым наконец воплотился проект, за который когда-то боролись отец Линя и другие члены его семьи.\n\nОстаётся лишь гадать, сколько просуществует эта новая республика, поскольку пока она фактически остаётся протекторатом внешних держав. Линь и другие представители местной знати решили решать проблемы по мере их появления, одновременно пытаясь сохранять равновесие между реакционным и более умеренным крыльями режима."

POLITICS_LIN_XIONGZHENG_DESC: "§YРодился:§! 5 ноября 1888 года, префектура Тайбэй, провинция Фуцзянь-Тайвань, Империя Цин\n§YПолитическая карьера:§! Линь Сюнчжэна называли одним из немногих толстяков Японской Формозы, что само по себе служило свидетельством его богатства и влияния. После аннексии Тайваня Японией его семья первоначально перебралась в Фучжоу, но вскоре вернулась обратно. В условиях нового японского порядка Линь сумел воспользоваться местными связями и обеспечить себе влиятельное положение в режиме. Он входил в совет генерал-губернатора и принимал у себя множество представителей высшего общества, включая тогдашнего наследного принца Хирохито.\n\nОдновременно Линь поддерживал Тунмэнхой и сохранял хорошие отношения с китайцами. Будучи сахарным магнатом, он неоднократно вступал в конфликты с крестьянами, но при этом успешно поддерживал публичный образ филантропа. Когда на Тайвань пришёл новый завоеватель, Линь быстро оказался среди главных кандидатов на руководство островом. На этом посту он примкнул к клике видных представителей тайваньской знати, финансовых кругов и деловой элиты, среди которых особенно выделяется его новый заместитель Лань Гаочуань, ветеран войны Ивэй против Японии. Некоторые даже полагают, что благодаря своим обширным связям именно Лань является настоящим хозяином правительства, хотя при том, что большинство решений принимается за закрытыми дверями, установить истину непросто.\n\nВо многих отношениях старое генерал-губернаторство никуда не исчезло, лишь уступив место несколько более автономному местному высшему классу. Оставшаяся в состоянии полук колониальной зависимости Формоза движется к новому будущему под президентством Линя, каким бы это будущее ни оказалось."



