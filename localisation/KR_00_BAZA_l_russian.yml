citycapturesmall.1.t: "Вторая битва при Вердене"
citycapturesmall.1.d: "Было неизбежно, что новый конфликт между Францией и другой державой вновь приведёт к осаде укреплений Вердена. Бункеры, составлявшие его оборону, были значительно модернизированы со времён Вельткрига, но столь же сильно развилась и артиллерия, которой располагала наступающая армия и которая могла обратить все эти достижения в дымящиеся руины. Как и прежде, сражение началось с артиллерийской дуэли двух армий, сопровождаемой впечатляющей воздушной схваткой. Артиллерийский огонь атакующих и их упорство при штурме французской системы укреплений в конечном итоге вынудили защитников Вердена отступить к Маасу. Бои из комнаты в комнату охватили старые «замки» в окрестностях, и вскоре стала очевидна горькая истина: несмотря на совершенствование вооружений, печально известная мясорубка Первого Вельткрига вновь становилась реальностью.\n\nНесмотря на это, защитникам было приказано вернуть инициативу, а некоторые полки попытались сделать это самостоятельно, даже вопреки приказам. Национальная гордость, связанная с Верденом, и психологический удар, которым стала бы его возможная потеря, заставили всех, кто обладал командными полномочиями или искренне разделял дело Франции, занять непримиримую, если не сказать «безумную», позицию. Под крики «Ils ne passeront pas!» французские солдаты героически, но яростно бросались на укрепляющиеся позиции противника на территории, ещё недавно принадлежавшей им. Жестокая борьба за изрытую землю и развалины вынудила атакующих вводить в бой всё новые силы, особенно после того как по ним начала бить артиллерия с противоположного берега реки. Потери с обеих сторон продолжали расти, но на этот раз судьба не улыбнулась французам, как прежде.\n\nТеперь в ходе бесчисленных контратак французские защитники сталкивались не только с артиллерией, но и с современной авиацией и автоматическим оружием. Артиллерийский огонь дополнялся ударами пикирующих бомбардировщиков и зажигательными боеприпасами с самолётов, до которых уцелевшие устаревшие средства ПВО просто не могли дотянуться. Земли вокруг фортов Дуомон и Во быстро превратились в массовые кладбища. Изгиб Мааса неподалёку всё сильнее забивался останками войны - человеческой плотью и искорёженной сталью, - а французским войскам в конечном итоге пришлось испить горькую чашу поражения.\n\nВерден был потерян, и теперь над израненным символом того, что некогда олицетворяло французскую стойкость перед лицом подавляющего превосходства врага, развевался [ROOT.GetAdjective]ий флаг."
citycapturesmall.1.a: "Как можно потерять так много и получить так мало?"
citycapturesmall.1.b: "Ils ne passeront pas! Ни шагу назад!"


