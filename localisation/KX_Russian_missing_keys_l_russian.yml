 foreign_politics_desc: "Грамотная внешняя политика жизненно важна для любой страны независимо от её размеров. Одни государства предпочитают создавать союзы, другие, более агрессивные, вступают с соперниками в открытое противостояние. Какой бы путь мы ни выбрали, действовать опрометчиво нельзя. Лишь взвешенная внешняя политика поможет приобрести друзей и сокрушить врагов."

