# Source: localisation/KX_Guides_gui_l_english.yml
guides.93.t:0 "Гайды по Белой Рутении"
guides.93.d:0 "Как привести к власти социал-консервативную БХД или авторитарно-демократических беспартийных?\n\n Обе силы могут победить на выборах после фокуса «Назначить новые выборы».\n\n Как привести к власти социал-демократическую БСДП или радикально-социалистическую БСРГ?\n\n Выполните фокус «Вопрос Грамады» и снимите запрет с социалистов. После фокуса «Назначить новые выборы» их можно будет избрать. Для радикально-социалистического пути обязательно упраздните монархию, иначе произойдёт переворот.\n\n Как открыть социалистические пути коммунистов, анархо-синдикалистов и радикальных социалистов либо социал-либеральной БПС-Ф?\n\n Изберите социал-демократическую БСДП, как описано выше, затем упраздните монархию в фокусе «Судьба монархии». Через несколько дней появится событие с выбором тоталистов, синдикалистов, радикальных социалистов или социал-либералов. Если не хотите германского вмешательства, заранее задайте соответствующее игровое правило.\n\n Как привести к власти Жигимонта?\n\n Выполните фокус «Положение Жигимонта», согласитесь на переговоры и отрекитесь от престола в его пользу.\n\n Как получить Новое народное правительство или национал-популистскую Кривию?\n\n Для Нового народного правительства НЕ передавайте престол Жигимонту. Изберите социал-демократическую БСДП и упраздните монархию. После «Конгресса Грамады» уступите радикально-социалистическому крылу и откажитесь от компенсаций. Островский совершит переворот. Чтобы сохранить его власть, выберите укрепление его позиций в соответствующем событии. Если до истечения срока не обеспечить контроль над всеми регионами с помощью решений, Вернер Кампф и немцы совершат переворот. Другой вариант приведёт к протестам кривичей и возможному перевороту.\n\n Как добиться переворота русофилов или привести к власти анархистов?\n\n Не отрекайтесь в пользу Жигимонта. Разрешите Грамаде участвовать в выборах, изберите её, сохраните монархию и поддержите радикальную фракцию. После переворота Жигимонта ничего не делайте с демилитаризованными регионами, пока немцы не совершат свой переворот. Затем появится возможность ответного переворота. Можно также прийти к власти через Островского, как описано выше, и таким же образом пройти германский переворот и контрпереворот."
guides.93.a:0 "Понятно"
guides.145.t:0 "Гайды по Мексике"
guides.145.d:0 "Культ смерти: дождитесь смерти Сапаты, создайте демократическую коалицию и доведите её до распада. Пусть Гарса сотрудничает с антисоциалистами, а переворот золотых рубашек завершится успехом. Затем дождитесь истечения 75 дней. Начнётся длинная цепочка событий. В каждом из них обеспечивайте победу культистам. Если победит армия, откроется остальной контент золотых рубашек.\n\nФрида Кало: выберите ацтекский путь Карраско и ARM, затем дождитесь событий о Мексикайотль. В первом не казните Кало, а во втором дайте им совершить переворот и создать радикально-социалистическую Ацтекскую империю.\n\nКристерос: провалите решения против кристерос. Они появляются на пути Кальеса, тоталистском пути Толедано (но не при его избрании с сохранением синдикализма) и на путях золотых рубашек. Кристерос смогут выбрать интегралистов с монархией или республикой либо христианско-демократическую PAN. Это откроет соответствующие ветки. Если кристерос пришли к власти через пути ARM, выбрать интегралистов нельзя, поскольку ARM их уничтожает. Вместо этого доступна конституционная монархия PAN.\n\nКампесинос: провалите решения против кампесинос, доступные на большинстве путей несоциалистической демократии, и социалистическая демократия вернётся.\n\nКак вызвать восстание Юкатана?\nДождитесь смерти Сапаты, создайте демократическую коалицию и доведите её до распада. В последующие недели начнутся события, ведущие к независимости Юкатана. Война начнётся не сразу, её начало зависит от Мексики. Юкатан также может восстать, если Кальес или синархисты зайдут слишком далеко. Если восставший Юкатан захватит Мехико, он сможет раздробить Мексику."
guides.145.a:0 "Понятно"

