### Ideas ###
NGR_Colonial_Government: "Колониальный протекторат"
NGR_Colonial_Government_desc: "Система, на которой держалась Нигерия при британском правлении, в значительной степени сохранилась даже после того, как революция, потрясшая метрополию, бросила колонию в объятия германских надзирателей. Обладающая широкой самостоятельностью колониальная администрация прежде всего сталкивается с расколом между мусульманским Севером и христианским Югом, а также с постоянно растущим притоком новых чиновников в бюрократический аппарат."
NGR_Clifford_Legacy: "Конституция Клиффорда"
NGR_Clifford_Legacy_desc: "Наш последний администратор Хью Клиффорд внёс множество изменений в конституцию, обеспечив колониальному населению полноценное представительство и в целом продвигая в Нигерии более косвенную систему управления. До Вестминстера нам далеко, но страна определённо становится стабильнее."
NGR_Clifford_Legacy_Adm: "Конституция Клиффорда"
NGR_Clifford_Legacy_Adm_desc: "Наш последний администратор Хью Клиффорд внёс множество изменений в конституцию, обеспечив колониальному населению полноценное представительство и в целом продвигая в Нигерии более косвенную систему управления. До Вестминстера нам далеко, но страна определённо становится стабильнее."
NGR_Clifford_Legacy_Mil: "Конституция Клиффорда"
NGR_Clifford_Legacy_Mil_desc: "Наш последний администратор Хью Клиффорд внёс множество изменений в конституцию, обеспечив колониальному населению полноценное представительство и в целом продвигая в Нигерии более косвенную систему управления. До Вестминстера нам далеко, но страна определённо становится стабильнее."
NGR_Clifford_Legacy_Dip: "Конституция Клиффорда"
NGR_Clifford_Legacy_Dip_desc: "Наш последний администратор Хью Клиффорд внёс множество изменений в конституцию, обеспечив колониальному населению полноценное представительство и в целом продвигая в Нигерии более косвенную систему управления. До Вестминстера нам далеко, но страна определённо становится стабильнее."
NGR_Northern_Tensions: "Напряжённость на Севере"
NGR_Northern_Tensions_desc: "Германская колонизация серьёзно дестабилизировала север страны. Религиозная напряжённость достигла небывалого уровня, а исламские боевики в Хаусаленде ведут священный джихад против нашего правительства."
NGR_administrative_efficiency: "Административная эффективность"
NGR_administrative_efficiency_descc: "Вернувшись к власти, Твайнинг готов повысить эффективность управления Нигерией при помощи британских администраторов, одновременно двигаясь к большей автономии коренного населения."
NGR_nigerian_identity: "Нигерийская идентичность"
NGR_nigerian_identity_desc: "Азикиве совершил немыслимое и пришёл к власти под националистическими лозунгами. Теперь он намерен избавить Нигерию от иностранной алчности и пробудить в своём народе новое национальное самосознание."
NGR_army_reforms: "Армейские реформы"
NGR_army_reforms_desc: "Стоквелл победил на выборах и теперь надеется полностью перестроить нигерийскую армию, сделав её куда эффективнее и, возможно, даже приблизив её тактику и организацию к германским образцам. Это потребует немалых усилий, однако на новом посту он уверен в своих силах."
NGR_free_trade_idea: "Свободная торговля"
NGR_free_trade_idea_desc: "Нам следует либерализовать экономику, как это делали британцы в лучшие годы своей державы. Поощряя торговлю с соседями и даже государствами других континентов, мы обеспечим процветание рынков и приток денег в наши карманы."
NGR_central_bank_idea: "Центральный банк Нигерии"
NGR_central_bank_idea_desc: "Идея центрального банка далеко не уникальна для Нигерии, и мы внимательно изучили опыт его создания в других странах. Ради более эффективной экономики необходимо учредить Центральный банк Нигерии, и это лишь поспособствует нашему дальнейшему росту."
NGR_home_army: "Новая армия метрополии"
NGR_home_army_desc: "Подобно старой Британской армии, Нигерия должна обладать собственной армией метрополии. Для её создания мы возьмём за основу прежнюю британскую модель, одновременно используя новый свод законов для введения некоторых форм воинской повинности. Вскоре у нас будет лучшая армия во всей Африке!"
NGR_allow_native_volunteers: "Добровольцы из местного населения"
NGR_allow_native_minor: "Ограниченный призыв местного населения"
NGR_allow_native_major: "Массовый призыв местного населения"
NGR_angry_colonials: "Разъярённые колонисты"
NGR_angry_colonials_2: "Недовольные колонисты"
NGR_angry_colonials_3: "Деловые соглашения с колонистами"
NGR_angry_colonials_4: "Расширенные деловые соглашения с колонистами"
NGR_deal_with_rebels: "Борьба с повстанцами"
NGR_deal_with_rebels_desc: "Северные повстанцы слишком долго были занозой в нашем боку. Настало время покончить с ними раз и навсегда!"
NGR_deal_with_rebels_2: "Борьба с повстанцами"
NGR_deal_with_rebels_2_desc: "Наша борьба с северными повстанцами складывается успешно. Совсем скоро они обратятся в бегство!"
NGR_deal_with_rebels_3: "Триумф на Севере"
NGR_deal_with_rebels_3_desc: "Мы разгромили наиболее опасные повстанческие группировки на Севере, открыв путь к стабильной Нигерии на многие поколения вперёд!"
NGR_prussian_example: "Подражать пруссакам"
NGR_prussian_example_desc: "На протяжении десятилетий, если не столетий, пруссаки обладали одной из самых боеспособных армий мира. Теперь, когда они стали нашими сюзеренами и у нас появилась такая возможность, следует брать с них пример."
NGR_german_instructors: "Германские инструкторы"
NGR_curb_british: "Ослабленное британское влияние"
NGR_curb_british_desc: "Британцы давно мешают нашей администрации. Считая себя выше африканцев, а порой даже и немцев, они часто отказываются сотрудничать с нашим правительством, особенно в финансовых вопросах. Пора положить этому конец."
NGR_curb_british_2: "Торговые соглашения с Германией"
NGR_curb_british_2_desc: "Некоторые утверждают, что нашими новыми торговыми соглашениями мы лишь меняем одного хозяина на другого, однако немцы явно куда выгоднее британцев. Они не требуют освобождения от финансовых обязательств и готовы платить честную цену за нашу продукцию. А главное - они здесь не живут."
NGR_french_aid: "Помощь Антанты"
NGR_french_aid_desc: "Мы обратились к Антанте за помощью, и наша просьба была удовлетворена! Это первый шаг на пути к восстановлению тесных отношений с нашими прежними союзниками."
NGR_nigerian_people_aid: "Народное правительство"
NGR_nigerian_people_aid_desc: "Нам не нужны иностранные правители: вместо этого мы обратились за помощью к самому народу Нигерии! С его поддержкой независимость окажется у нас в руках раньше, чем кто-либо ожидает."
NGR_nigerian_assistance: "Нигерийская помощь"
NGR_nigerian_assistance_desc: "Нигерийцы под руководством верного Бернарда Бурдиллона отправили нам столь необходимые припасы, чтобы помочь в этот тяжёлый час. Их немного, но мы всё равно благодарны за этот жест!"
NGR_Class_Divisions: "Раскол между местными и колонистами"
NGR_Class_Divisions_desc: "С самого основания колонии Нигерия между европейскими поселенцами и многочисленными коренными нигерийскими народами сохранялась напряжённость. Она и сегодня определяет политическую жизнь колонии: пока местное население всё активнее требует равных прав, колонисты ещё прочнее закрепляются на позициях сохранения неравенства."
NGR_Class_Divisions_Improved: "Смягчённые классовые противоречия"
NGR_Class_Divisions_Improved_desc: "Мы согласились предоставить коренному населению Нигерии некоторые дополнительные права, включая упрощённый доступ к образованию, но не стали уравнивать его полностью с колонистами. Пока что этого, надеемся, будет достаточно, чтобы успокоить нигерийский народ."
NGR_Class_Divisions_Equal: "Равноправие в Нигерии"
NGR_Class_Divisions_Equal_desc: "Мы решили предоставить народу Нигерии полное равноправие, во всех отношениях уравняв его с колонистами. Это принесло определённые преимущества, включая дополнительные людские ресурсы для исследований болезней и даже повышение морального духа нигерийских рабочих, однако европейские поселенцы останутся крайне недовольны."
NGR_curb_brits: "Сокращённое британское влияние"
NGR_curb_brits_desc: "Британцы слишком долго держали экономику Нигерии мёртвой хваткой! Если мы хотим развивать страну, необходимо сокрушить их влияние: своей алчностью они лишь тянут нас назад. А уменьшив их присутствие, мы одновременно откроем двери для новых германских инвестиций..."
NGR_curb_brits_2: "Новое германское влияние"
NGR_curb_brits_2_desc: "После ослабления британского влияния страна стала идеальным местом для германских инвестиций. Уже сейчас в колонию устремляются германские компании, готовые вести дела, и вскоре экономикой будут распоряжаться немцы, а не британские поселенцы."
NGR_righteous_cause: "Правое дело"
NGR_Spiritual_War_Idea: "Духовная война"
NGR_Spiritual_War_Idea_desc: "В последнее время напряжённость между севером и югом Нигерии лишь усиливается. Правительство дало нам разрешение начать на Севере своего рода «духовную войну», чтобы попытаться восстановить безопасность. На время это сплотит наши войска, однако победить религию в обычной войне невозможно. Подобное открытое противостояние может быть лишь временной мерой, пока мы не найдём более разумного решения..."
NGR_federalism_idea: "Федеративная система"
NGR_federalism_idea_desc: "Система, обеспечивающая представительство и йоруба, и игбо, сделает наше государство значительно устойчивее и позволит эффективнее противостоять как северянам, так и любым внешним угрозам."
NGR_Northern_Tensions_Neighbors: "Обращение к соседям"
NGR_Northern_Tensions_Neighbors_desc: "Германская колонизация серьёзно дестабилизировала север страны. Религиозная напряжённость достигла небывалого уровня, а исламские боевики в Хаусаленде ведут священный джихад против нашего правительства. К счастью, Вестафрика и Кения согласились предоставить ограниченную помощь, хотя полностью решить наш кризис они не смогут."
NGR_Northern_Tensions_Soldiers: "Контракты с наёмниками"
NGR_Northern_Tensions_Soldiers_desc: "Германская колонизация серьёзно дестабилизировала север страны. Религиозная напряжённость достигла небывалого уровня, а исламские боевики в Хаусаленде ведут священный джихад против нашего правительства. К счастью, нам удалось заключить контракты с наёмническими формированиями. Они окажут некоторую помощь, но полностью решить наш кризис не смогут."
NGR_Northern_Tensions_Reich: "Помощь Миттельафрики"
NGR_Northern_Tensions_Reich_desc: "Германская колонизация серьёзно дестабилизировала север страны. Религиозная напряжённость достигла небывалого уровня, а исламские боевики в Хаусаленде ведут священный джихад против нашего правительства. К счастью, Миттельафрика согласилась помочь нам, однако решить кризис вместо нас она не сможет. Необходимы дальнейшие меры."
NGR_at_islam_idea: "Удар по исламу!"
NGR_at_lawlessness_idea: "Борьба с беззаконием!"
NGR_at_dissent_idea: "Работа с недовольными!"
NGR_northern_solution: "Решение северной проблемы"
NGR_northern_solution_desc: "Нам наконец удалось договориться с мусульманами Севера, и теперь Нигерия снова может считаться стабильной. У нас, возможно, немного ресурсов, но страна едина как никогда, а это первый шаг на пути к национальному процветанию."
NGR_northern_solution_peace: "Единая Нигерия"
NGR_northern_solution_peace_desc: "Теперь, когда вся Нигерия находится под нашим контролем, можно обратить взор к лучшему будущему и, возможно, сосредоточиться на соседях..."
NGR_northern_solution_twostates: "Два государства"
NGR_northern_solution_twostates_desc: "Нигерии никогда не было суждено просуществовать в нынешнем виде. Мы разделились на два государства и теперь сможем процветать без северян, больше не тянущих нас назад!"

