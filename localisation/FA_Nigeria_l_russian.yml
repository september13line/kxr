### Focuses ###
NGR_followtheprussianexample: "Последовать прусскому примеру"
NGR_followtheprussianexample_desc: "Прусская армия по праву считается одной из лучших в мире благодаря совершенному владению принципами профессионализма и сплочённости. Нам следует последовать её примеру и добиться того, чтобы нигерийская армия стала лучшей колониальной армией во всей Африке."
NGR_reformthejudicialsystem: "Реформировать судебную систему"
NGR_reformthejudicialsystem_desc: "Наша судебная система безнадёжно устарела. Пока над Миттельафрикой сгущаются тучи, самое время приступить к её реформированию. Мы должны добиться более эффективного применения закона, поскольку совсем скоро, возможно, придётся полагаться лишь на собственные силы."
NGR_anewhomearmy: "Новая армия метрополии"
NGR_anewhomearmy_desc: "«Армией метрополии» до краха назывались британские сухопутные силы на родине. Наша собственная армия всё ещё сохраняет преимущественно колониальный характер, однако давно пора начать её модернизацию, чтобы эффективнее бороться как с внутренними, так и с внешними угрозами. Но прежде всего нам необходимо создать действительно верные вооружённые силы."
NGR_3rdnigerianparliamentelection: "Третьи парламентские выборы в Нигерии"
NGR_3rdnigerianparliamentelection_desc: "С момента создания Нигерийского свободного государства его руководство неизменно избиралось парламентом. Теперь пришло время третьих парламентских выборов, и на передний план вышли три фигуры. Кто из них победит, пока остаётся неизвестным..."
NGR_cliffordslegacy: "Наследие Клиффорда"
NGR_cliffordslegacy_desc: "Во время управления Нигерией Хью Клиффорд провёл множество полезных преобразований, важнейшие из которых затрагивали образование и администрацию. В сфере образования он стремился открыть начальные школы для каждого ребёнка, педагогические училища в каждой провинции и даже королевский колледж в регионе. В административном отношении Клиффорд всеми силами пытался вестернизировать страну, и его усилия принесли плоды. Нам следует продолжить его дело и пойти ещё дальше, расширив представительную демократию и систему косвенного управления в Нигерии."
NGR_spiritualwarfare: "Духовная война"
NGR_spiritualwarfare_desc: "Одним из главных препятствий на пути к единой Нигерии остаётся религиозный раскол. В последние годы напряжённость только росла, и отношения между христианами и мусульманами достигли точки, при которой противостояние приобрело форму настоящей духовной войны. Для стабильности страны это не сулит ничего хорошего..."
NGR_kinginexile: "Король в изгнании"
NGR_kinginexile_desc: "Британский король когда-то был и нашим монархом, и мы решили вновь признать его своим государем. Однако последние десятилетия были для него тяжёлыми: лишённый родины, он живёт в изгнании в Канаде. Мы должны вступить в союз с Антантой и помочь королю вернуть принадлежащее ему по праву место!"
NGR_pathtowestafrika: "Путь к Вестафрике"
NGR_pathtowestafrika_desc: "Вестафрика является одним из наших важнейших соседей, а потому нам неизбежно приходится выстраивать с ней отношения. Следует предложить более тесное сотрудничество, которое может принять множество форм, но обязательно должно быть выгодно обеим сторонам, если мы хотим добиться согласия. Что именно мы предложим?"
NGR_pragmaticprotectionism: "Прагматичный протекционизм"
NGR_pragmaticprotectionism_desc: "Берлин уже однажды был нашим сюзереном и, возможно, способен вновь предоставить нам защиту. Несмотря на крах Миттельафрики, Германия, похоже, всё ещё остаётся сильнейшей державой мира, и сближение с ней может принести определённые преимущества, прежде всего военные. Стоит ли сохранить верность хотя бы из чистого прагматизма?"
NGR_twostates: "Два государства"
NGR_twostates_desc: "Мы решили перейти к системе двух государств. Северная половина страны выйдет из-под нашего контроля, но, возможно, это даже к лучшему, поскольку этот регион всегда доставлял администрации одни неприятности. Лишь время покажет, какое будущее ждёт Нигерию..."
NGR_atrulyfreestate: "По-настоящему свободное государство"
NGR_atrulyfreestate_desc: "Немцы и британцы - стервятники, стремящиеся лишь эксплуатировать нас и почти ничего не дающие взамен за нашу верность. Нам не нужен их контроль. Вместо этого мы сами проложим свой путь на мировой арене. Нигерия наконец станет свободным государством и послужит примером для всей Африки."
NGR_obrittania: "О, Британия"
NGR_obrittania_desc: "Когда-то мы были верны Британской империи, которая всего несколько десятилетий назад простиралась по всему миру. Теперь во главе сильно ослабленной Антанты стоит Канада, однако союз с ней всё ещё способен принести нам пользу. Канадцы пообещали ресурсы и помощь, которых Германия никогда не считала нужным предлагать, и мы склонны им верить: наша поддержка станет важнейшей в любой войне в Африке. Стоит ли обратиться к ним с предложением?"
NGR_thecommander: "Командующий"
NGR_thecommander_desc: "На третьих парламентских выборах победу одержала прогерманская Партия национального фронта. Сэр Бернард Генри Бурдиллон, известный своими лингвистическими способностями и богатым административным опытом, накопленным по всей бывшей Британской империи, теперь поведёт Нигерию к более германскому и милитаристскому будущему."
NGR_splittingattheseams: "Трещит по швам"
NGR_splittingattheseams_desc: "Нигерия охвачена смутой: Север восстал, правовая система разваливается, а хуже всего то, что Берлин почти не оказывает помощи. Если мы хотим выжить как колония и как государство, придётся искать нестандартные решения нынешнего кризиса."
NGR_intensifypacificationcampaign: "Усилить кампанию по умиротворению"
NGR_intensifypacificationcampaign_desc: "Повстанцы уже отступают. Они явно не ожидали столь решительного военного ответа правительства, и теперь нам остаётся лишь усилить кампанию и наконец покончить с ними раз и навсегда."
NGR_anigeriancentralbank: "Центральный банк Нигерии"
NGR_anigeriancentralbank_desc: "По мере развития рыночной экономики становится совершенно ясно, что Нигерии необходим центральный банк. Он позволит нашим капиталистам хранить и при необходимости получать средства. В конце концов, деньги понадобятся им для новых проектов, а нигерийская экономика переживает подъём."
NGR_allownativesintothearmy: "Допустить местное население в армию"
NGR_allownativesintothearmy_desc: "После краха Британской империи нигерийская армия состояла главным образом из белых колонистов и подразделений аскари. Однако с расширением прав коренного населения вполне логично начать принимать его представителей и в вооружённые силы. Это даст нам людские ресурсы, необходимые для подавления нового восстания, если оно когда-либо произойдёт."
NGR_fromlagostosokoto: "От Лагоса до Сокото"
NGR_fromlagostosokoto_desc: "Чужеземцы нередко недооценивают размеры Нигерии, но делают это на свой страх и риск. Наша страна поистине огромна, и мы намерены эффективно управлять всей её территорией. Первым шагом станет развитие инфраструктуры, начиная со строительства новой дороги между Лагосом и Сокото."
NGR_dealwiththenorthernrebel: "Разобраться с восстанием на Севере"
NGR_dealwiththenorthernrebel_desc: "На протяжении многих лет после краха мусульманский Север оставался постоянной головной болью для нигерийского правительства. Но теперь они зашли слишком далеко, и власть наконец покончит с этой угрозой раз и навсегда."
NGR_movetowardsfederalism: "Двигаться к федерализму"
NGR_movetowardsfederalism_desc: "Переход к федеративной системе значительно укрепит стабильность нашего режима. Федеральное устройство с отдельными штатами и несколькими уровнями администрации лучше всего подходит такой разнообразной стране, как Нигерия. Оно также поможет предотвращать восстания ещё до их начала, поскольку все регионы получат собственное представительство."
NGR_theanglo: "Англичанин"
NGR_theanglo_desc: "Ни для кого не стало неожиданностью, что на третьих парламентских выборах вновь победила проанглийская партия, широко известная как Союз тори и вигов. Английский администратор Эдвард Твайнинг вернулся к власти после многолетнего перерыва и теперь вновь возьмёт управление страной в свои руки, продолжив курс TWU."
NGR_callingermaninstructors: "Пригласить германских инструкторов"
NGR_callingermaninstructors_desc: "По мере превращения нашей армии в профессиональную силу всё острее ощущается нехватка способных командиров и офицеров. Поэтому мы обратимся к метрополии с просьбой направить германских инструкторов и офицеров, способных укрепить нашу военную мощь в Западной Африке."
NGR_curbbritisheconomicalinfluence: "Ограничить британское экономическое влияние"
NGR_curbbritisheconomicalinfluence_desc: "Даже после включения Нигерии в состав Миттельафрики британская капиталистическая элита продолжала крепко держать её экономику в своих руках и делает это по сей день. Такое положение недопустимо: если мы хотим в полной мере воспользоваться преимуществами отношений с нашим сюзереном, британское влияние необходимо ограничить."
NGR_unpegthenigerianpoundfromthemark: "Отвязать нигерийский фунт от марки"
NGR_unpegthenigerianpoundfromthemark_desc: "В соответствии с соглашением нигерийский фунт был отвязан от миттельафриканской марки. Более того, правительство надеется полностью разделить валютные системы и наконец позволить нигерийскому фунту свободно плавать."
NGR_thenative: "Уроженец"
NGR_thenative_desc: "На выборах, потрясших всю страну, партия Ннамди Азикиве - Национальный совет Нигерии - совершила то, что считалось почти невозможным, и одержала победу. Государственный деятель из числа коренного населения Ннамди Азикиве намерен по возможности очистить страну от наследия колониализма и одновременно сформировать единую нигерийскую идентичность."
NGR_nigerianvolunteerforce: "Нигерийский добровольческий корпус"
NGR_nigerianvolunteerforce_desc: "Мы пообещали поддержать короля в Канаде, и теперь пришло время подтвердить свои слова делом. Нигерийский добровольческий корпус будет служить интересам Антанты в Африке и за её пределами. С нашей помощью Антанта восторжествует!"
NGR_theyneedus: "Мы им нужны"
NGR_theyneedus_desc: "Сила Вестафрики примерно сопоставима с нашей, а значит, мы нужны им не меньше, чем они нам. Однако само их существование находится под ещё большей угрозой: богатые золотые месторождения делают страну привлекательной целью для любого потенциального колонизатора. Они нуждаются в нас, и это следует использовать в своих интересах."
NGR_thebornuquestion: "Вопрос Борну"
NGR_thebornuquestion_desc: "Борну находится на самой окраине нашей страны и нередко приносит больше проблем, чем пользы. Тем не менее регион служит удобным буфером, и лучше нам контролировать его самим, чем позволить это соседям. С другой стороны, передача Борну тем же соседям могла бы принести немалую выгоду. Нигерия оказалась на перепутье..."
NGR_atlawlessness: "Против беззакония"
NGR_atlawlessness_desc: "В Нигерии воцарилась анархия, хотя так было не всегда. Если мы хотим выжить и процветать, необходимо восстановить хотя бы подобие порядка. Добиться этого можно лишь передав больше полномочий местным администраторам."
NGR_loyaltyquestions: "Вопрос верности"
NGR_loyaltyquestions_desc: "Когда влиянием немцев пало, мы стоим перед выбором: должны ли мы вернуться к немцам; вернуться к старым хозяевам; а может быть, стоит стать полностью независимыми?"
NGR_loyaltyquestions_desc: "Теперь, когда наши сюзерены утратили контроль, мы должны решить, кому будет принадлежать наша верность. Следует ли нам остаться верными немцам, обратиться к нашим прежним хозяевам или пойти собственным путём?"
NGR_atislam: "Против ислама"
NGR_atislam_desc: "Ислам лежит в основе всего недовольства на севере, а потому с ним необходимо разобраться. Борьба против целой религии будет непопулярна не только внутри страны, но и во всём мусульманском мире. Тем не менее столь прямые меры могут оказаться единственным способом решить нашу проблему."
NGR_ourfellowprotectorates: "Наши собратья-протектораты"
NGR_ourfellowprotectorates_desc: "Лучшим способом разрешить наш национальный кризис было бы обратиться к соседним протекторатам. У наших соседей хватает собственных проблем, но если мы сумеем действовать сообща, то, возможно, вместе справимся и с теми, кто нарушает порядок в наших странах. Необходимо немедленно сообщить им о нашем бедственном положении."
NGR_atdissent: "Против недовольства"
NGR_atdissent_desc: "Причина нынешнего хаоса в стране заключается в том, что потребности и стремления наших граждан остаются неудовлетворёнными. Нам следует попытаться решить эти проблемы в надежде окончательно положить конец спорам. Первым вопросом должна стать система управления: северные штаты требуют большей автономии. Мы должны предоставить им её..."
NGR_apermanentsolution: "Окончательное решение?"
NGR_apermanentsolution_desc: "При более внимательном рассмотрении становится ясно, что наша проблема неразрешима без изменения самого устройства государства. Нам предложены два варианта. При сохранении единого государства мы смогли бы обладать большим влиянием в регионе и добиться общего процветания, но лишь в том случае, если найдём удовлетворительный компромисс для выхода из нынешнего кризиса. С другой стороны, разделение на два государства оставит нас разобщёнными, зато кризис будет решён раз и навсегда, и мы наконец сможем вздохнуть спокойно."
NGR_sidelinetheparliament: "Оттеснить парламент"
NGR_sidelinetheparliament_desc: "Ннамди уже продемонстрировал стремление упростить бюрократию, а парламент является очевидным воплощением бюрократической системы. Поэтому Ннамди и его партия будут добиваться отстранения парламента от реальной власти и превращения его в послушный инструмент, чтобы проводить свою волю через правительство без сопротивления. Нигерия принадлежит нигерийцам, и ни колонизаторы, ни бюрократические препоны не должны стоять у нас на пути."
NGR_callinaemergencyparliamentmeeting: "Созвать экстренное заседание парламента"
NGR_callinaemergencyparliamentmeeting_desc: "С течением времени новое правительство провело впечатляющие преобразования в системе управления Нигерией. Теперь, когда большая часть реформ завершена, оно созовёт экстренное заседание парламента, чтобы обсудить Нигерию и её будущее."
NGR_ourfirststrike: "Наш первый удар?"
NGR_ourfirststrike_desc: "Теперь, когда мы заручились внешней поддержкой и собрали собственные ресурсы, настало время решить, как бороться с внутренним недовольством. Мы можем выступить непосредственно против ислама, попытаться восстановить порядок на северных территориях или заняться проблемами, вызывающими недовольство местных групп. Как нам поступить?"
NGR_theneworder: "Новый порядок"
NGR_theneworder_desc: "Для Нигерии наступил новый день: мы сбросили германские цепи и теперь должны определить собственную судьбу. Мы можем обратиться за помощью к британцам или немцам либо полностью принять обретённую свободу. Нам также предстоит решить вопрос Вестафрики и определить, какие отношения следует выстраивать с этим режимом. Наконец, отдельного внимания в новом государстве заслуживает регион Борну."
NGR_neighbor_help:0 "Мы обратились за помощью к нашим соседям"
NGR_soldier_help:0 "Мы заручились помощью наёмников"
NGR_reich_help:0 "Мы запросили помощь у Миттельафрики"
NGR_theafrikanreich:0 "Администрация Миттельафрики"
NGR_theafrikanreich_desc:0 "Обращение к центральным властям Миттельафрики остаётся нашим лучшим шансом получить помощь, поскольку именно они представляют собой наиболее могущественную силу на всём континенте. Их войска могли бы быстро разгромить мусульманских повстанцев, а предоставленных средств с избытком хватило бы на решение наших проблем. Однако такая помощь может сопровождаться нежелательным надзором и усилением контроля со стороны Дар-эс-Салама и его администрации, поэтому прежде чем идти на этот шаг, нам следует тщательно всё обдумать."
NGR_thesoldiermarket: "Рынок солдат"
NGR_thesoldiermarket_desc: "В Африке существует обширный, хотя зачастую предпочитаемый не замечать рынок наёмников. Обращение к ним за помощью станет лучшим решением, если мы хотим напрямую подавить местные беспорядки, однако за это придётся заплатить. Готовы ли мы купить стабильность такой ценой?"
NGR_someoutsidehelp: "Немного помощи извне?"
NGR_someoutsidehelp_desc: "Положение в Нигерии кажется невыносимым, по крайней мере для нашей администрации. Однако если мы обратимся за помощью к внешним силам и объясним им ситуацию, то наверняка сможем получить хоть какую-то поддержку. Осталось лишь решить, от кого именно она должна исходить."
NGR_openbarrierforgermancompanies: "Убрать барьеры для германских компаний"
NGR_openbarrierforgermancompanies_desc: "Теперь, когда влияние нигерийско-британских капиталистов исчезло, мы наконец можем открыть Нигерию для германских компаний и получить ту прибыль, которую британские капиталисты оказались слишком трусливы обеспечить."
NGR_expandthenativerights: "Расширить права коренного населения"
NGR_expandthenativerights_desc: "Совершенно очевидно, что в нынешних условиях коренное население Нигерии в действительности далеко не свободно. Однако теперь, когда выборы завершены, правительство наконец намерено исправить эту проблему и предоставить местным жителям те права, которых они действительно заслуживают."
NGR_liberalizetheeconomy: "Либерализовать экономику"
NGR_liberalizetheeconomy_desc: "В настоящее время большая часть экономики передана государственным компаниям, и так продолжаться не может. Слишком много средств уходит на то, расходы на что можно было бы значительно сократить, позволив рынку самостоятельно определять дальнейший путь. Именно это нам и предстоит сделать."
NGR_onestate: "Одно государство"
NGR_onestate_desc: "Мы раз и навсегда объединим наши территории в единое государство. Северным недовольным будет непросто с этим смириться, но теперь у нас есть всё необходимое, чтобы подавить их в случае новых беспорядков. Вперёд, к светлому будущему Нигерии!"
NGR_butweneedthemmore: "...Но они нужны нам больше"
NGR_butweneedthemmore_desc: "Мы не в том положении, чтобы предъявлять Вестафрике требования. Вместо этого следует сделать предложение, которое покажется ей выгодным, и надеяться, что оно будет принято. Это могут быть льготные торговые условия или передача военного снаряжения, но если мы хотим добиться её согласия, нам придётся чем-то пожертвовать."

###Events ###

nig.2.t: "Третьи парламентские выборы"
nig.2.d: "Настало время третьих парламентских выборов в Нигерии. По совпадению, на победу претендуют три партии. Кандидат Партии Союза Эдвард Твайнинг надеется вернуться к власти, которой он уже когда-то обладал в этом регионе. В народе Твайнинг известен как «Англичанин» за представительство британских интересов в Нигерии и в своей партии, вдохновлённой старыми партиями тори и вигов. Ннамди Азикиве выступает кандидатом от Национального совета Нигерии, также известного как Нигерийский фронт. Азикиве, журналист по профессии, прославился своей борьбой за независимость Нигерии. Единственный коренной нигериец среди троих кандидатов, он надеется раз и навсегда освободить страну от германского и британского ига. Наконец, остаётся Хью Стоквелл, имеющий британские корни, но связавший свою судьбу с немцами. Представляя Партию национального фронта, также известную как Нигерийская национально-демократическая партия, Стоквелл намерен ещё теснее связать Нигерию с германской метрополией и проводить более милитаристскую политику. Кто же победит?"
nig.2.a: "Англичанин."
nig.2.b: "Нигериец."
nig.2.c: "Командир."

nig.3.t: "Единый свод законов для всей страны?"
nig.3.d: "Различные племенные группы Нигерии, особенно на севере, издавна живут по собственным законам и обычаям, однако такая система крайне неэффективна. Во-первых, многие из них попросту не признают за нами права вершить правосудие внутри их племён и деревень. Ещё хуже то, что различия в законах позволяют человеку совершить убийство в одном городе и избежать наказания, перебравшись в другой. Это абсурд. Для решения проблемы предложено два основных подхода. Мы можем реформировать систему и пока распространить её лишь на южные племена, что будет проще осуществить, хотя и менее эффективно. С другой стороны, мы можем навязать наши законы и северу, что наверняка вызовет сопротивление, но в конечном счёте позволит лучше достичь поставленных целей. Следует выбирать с умом..."
nig.3.a: "Общенациональная правовая система."
nig.3.b: "Единая правовая система Юга."

nig.4.t: "Расширение прав коренного населения"
nig.4.d: "Уже подготовлено несколько различных планов по расширению прав коренного населения Нигерии, однако политики ожесточённо спорят о том, какой именно характер должны принять эти преобразования. Юнионисты во главе с Эдвардом Твайнингом выступают за распространение деятельности Нигерийского законодательного совета на север страны, чтобы он лучше отражал её географическое разнообразие. Националисты во главе с Ннамди Азикиве и Гербертом Маколеем, напротив, настаивают на более широком представительстве африканцев в этих советах в целом. Они обвиняют юнионистов в попытке проводить политику «разделяй и властвуй» под видом предоставления прав всем нигерийцам. Юнионисты, в свою очередь, обвиняют националистов в стремлении полностью подорвать британское влияние в стране, что, впрочем, не так уж далеко от истины. Нигерийская НДП, коллаборационисты, в основном держалась в стороне от спора, не поддерживая ни одну из позиций. Нам предстоит решить, как поступить."
nig.4.a: "План Маколея."
nig.4.b: "План Твайнинга."

nig.5.t: "Допустить коренных жителей в армию?"
nig.5.d: "В последние годы мы испытываем нехватку людских ресурсов из-за недостаточного числа европейцев и аскари. Для сторонников более широкого привлечения коренных жителей к военной службе это идеальная возможность, и теперь нам предстоит выбрать между несколькими предложенными ими планами. Мы можем разрешить местным жителям добровольно вступать в армию, что, возможно, даст нам меньше солдат, но несомненно укрепит вооружённые силы в целом. Можно пойти дальше и ввести ограниченный призыв коренного населения - это крайняя мера, на которую ещё готовы согласиться юнионисты. Националисты, однако, требуют куда более масштабной программы призыва, причём не столько ради использования местных солдат, сколько ради превращения армии в преимущественно нигерийскую по своему составу."
nig.5.a: "Разрешить добровольную службу."
nig.5.b: "Ввести ограниченный призыв."
nig.5.c: "Ввести массовый призыв."

nig.6.t: "Азикиве отстраняет парламент!"
nig.6.d: "В последние месяцы Азикиве и его националисты всё сильнее раздражены нежеланием парламента сотрудничать с их правительством. Последней каплей стали попытки Азикиве упростить бюрократический аппарат страны, встреченные угрозами и парламентской обструкцией. Пришло время перемен: Азикиве намерен полностью отстранить парламент от управления. Это позволит партии провести часть желаемых реформ, однако наши советники предупреждают, что такой шаг вызовет ярость среди проживающих в колонии европейцев. Тем не менее Азикиве настаивает на продолжении курса и уверяет, что со временем европейцы смирятся и согласятся на компромисс."
nig.6.a: "Колонисты в ярости!"

nig.7.t: "Привлечь либеральных колонистов"
nig.7.d: "Первым шагом к преодолению раскола между нигерийским правительством и колонистами станет обращение к наиболее либерально настроенной их части. Именно эти поселенцы с наибольшей вероятностью поддержат расширение прав нигерийцев и их участие в управлении страной. Если предложить им новые должности и большее влияние в обмен на сотрудничество, они наверняка согласятся. Приступим к осуществлению этого плана."
nig.7.a: "Они ещё одумаются!"

nig.8.t: "Прагматичные германские колонисты"
nig.8.d: "Хотя большинство европейских колонистов в нашей стране имеют британское происхождение, здесь также проживает некоторое число немцев. Они обладают большим влиянием в метрополии, чем британцы, а потому особенно важны для нас. Кроме того, немцы менее заносчивы, поскольку находятся в регионе не так давно. Мы полагаем, что, предложив им определённые преимущества, прежде всего экономические, сможем вернуть часть поддержки, утраченной после отстранения парламента."
nig.8.a: "Сделать предложение!"

nig.9.t: "Напряжённость спадает"
nig.9.d: "С тех пор как Азикиве отстранил парламент ради осуществления собственных целей, прошло уже несколько месяцев, и время постепенно залечило нанесённые этим решением раны. Однако многие колонисты по-прежнему глубоко недовольны нашим режимом и предпочли покинуть страну, а не оставаться под властью правительства, которое считают деспотичным. Азикиве приветствует их отъезд, и хотя эмиграция несколько навредит стране, нам удалось наладить отношения с достаточным числом колонистов, а также с немцами, чтобы уверенно продолжать выбранный курс."
nig.9.a: "Ещё одна победа нигерийского народа!"

nig.10.t: "Повстанцы ослаблены!"
nig.10.d: "После долгих усилий наши войска, похоже, наконец изгнали или иным образом нейтрализовали наиболее опасные повстанческие группировки на севере. Теперь мы можем продолжить работу над объединением нашей многообразной страны и, возможно, добиться ещё большей автономии..."
nig.10.a: "Прекрасно!"

nig.11.t: "Нигерия просит германских инструкторов!"
nig.11.d: "Сегодня мы получили известие из Нигерии. Похоже, её вооружённые силы успешно развиваются, однако местные власти считают, что для полной модернизации армии им потребуется больше германских инструкторов. Отправка дополнительных инструкторов и офицеров могла бы укрепить стабильность на континенте, но подобный шаг будет непопулярен среди нашего населения. С другой стороны, мы можем отказать им без серьёзных последствий внутри страны. Как нам поступить?"
nig.11.a: "Отправить несколько офицеров!"
nig.11.b: "Пусть сами строят свою армию!"

nig.12.t: "Германия отказывает!"
nig.12.d: "Похоже, наша недавняя просьба о направлении дополнительных германских инструкторов была отклонена. Хотя для наших вооружённых сил это несомненно стало неприятным ударом, советники уверяют, что мы способны обойтись без них и должны самостоятельно создать современную армию. Жаль лишь, что наша предполагаемая «метрополия» отказывается помогать именно тогда, когда мы нуждаемся в этом больше всего..."
nig.12.a: "Проклятье!"

nig.13.t: "Чрезвычайное заседание парламента!"
nig.13.d.brits: "За время правления Твайнинга в Нигерии мы добились многих поставленных целей, однако теперь весь привычный мир находится на пороге радикальных перемен. Германская метрополия балансирует на краю пропасти: её экономика лежит в руинах, Империя растянута до предела, а враги окружают её со всех сторон. Наши повелители в Миттельафрике находятся ненамного в лучшем положении. Они также пострадали от краха Чёрного понедельника, и их влияние в Нигерии с каждым днём слабеет. Именно поэтому мы созвали чрезвычайное заседание, чтобы решить, как реагировать на столь исключительные обстоятельства. Наши юнионисты, среди которых преобладают британские колонисты и сторонники Британии, требуют раз и навсегда сбросить германское иго и воссоединиться со старыми товарищами по Антанте. Однако такой шаг наверняка вызовет ярость как националистов, так и коллаборационистов, поэтому момент необходимо выбрать крайне осторожно. Нам также предстоит решить множество других вопросов, включая права коренного населения, направление будущего экономического развития и отношения с соседями, прежде всего с Вестафрикой и Кенией."
nig.13.d.native: "Сегодня мы собрались на чрезвычайное заседание парламента, чтобы определить будущее Нигерии. Правительство Ннамди Азикиве уже сделало несколько шагов к нигерийской независимости, однако важнейший фактор, способствующий нашей автономии, находится не в самой Нигерии, а в Германии. Наши повелители рушатся, величайшая империя на Земле стоит на коленях. Их прислужники в Миттельафрике находятся не в лучшем положении, а их власть почти утратила всякое значение и представляет меньшую угрозу, чем когда-либо прежде. Это возможность, которой мы ждали, однако Азикиве призывает к осторожности. Слишком раннее провозглашение независимости напугает колонистов, которые могут поднять мятеж или покинуть страну, поэтому действовать необходимо осмотрительно. Не следует также недооценивать армию Миттельафрики и германский флот. Антанта, Третий Интернационал, американцы - никто из них не желает помогать нам, а значит, подлинную независимость придётся завоевать самостоятельно. Впрочем, это можно считать благословением. Нам не нужен новый колониальный угнетатель: когда придёт время, мы сами возьмём судьбу в свои руки. Пока же необходимо разобраться в отношениях между коренными жителями и колонистами, определить направление будущего экономического развития и выстроить отношения с соседями."
nig.13.d.germs: "Германская империя переживает кризис! Наша метрополия столкнулась с худшим экономическим потрясением в своей истории, а власть Миттельафрики стремительно рушится. В связи с этим Бернард Х. Бурдиллон созвал чрезвычайное заседание парламента, чтобы определить будущее нашей колонии. Наша Партия национального фронта управляет Нигерией от имени кайзера, однако если мы пожертвуем интересами собственной страны ради спасения Германии, то столкнёмся с ожесточённым сопротивлением как националистов Азикиве, так и юнионистов. Тем не менее действовать необходимо. Германия страдает от экономической нестабильности и одновременно окружена врагами. Мы должны сделать всё возможное, чтобы облегчить её положение: отправка продовольствия, снаряжения и солдат - меньшее, чем мы можем отплатить. Нам также предстоит решить, как реагировать на усиливающиеся требования коренного населения о равных правах, определить направление экономического развития и разобраться с отношениями с соседями, прежде всего с самой Миттельафрикой."
nig.13.a: "Мы найдём твёрдую почву под ногами!"

nig.14.t: "Дипломатические инициативы"
nig.14.d.brits: "Мы установили контакт с Антантой, прежде всего с Канадой и Францией, в надежде наладить хотя бы ограниченное сотрудничество. Пока что они благосклонно отнеслись к нашим предложениям и даже согласились предоставить небольшую экономическую помощь, которую мы с радостью приняли. Будем надеяться, что это лишь первый из многих шагов к восстановлению старых связей с Британской империей."
nig.14.d.native: "Мы обратились ко всей Нигерии с призывом помочь стране в этот трудный час, и народ откликнулся. Никогда прежде столько людей не записывалось на различные виды военной службы, и теперь мы покажем миру нашу истинную силу!"
nig.14.d.germs: "Мы отправили кайзеру жизненно важную помощь, чтобы помочь ему удержать Империю на плаву. Этот жест ещё долго не будет забыт, и мы надеемся, что он действительно изменит положение. Тем временем мы также стремимся установить более тесные связи с администрацией Миттельафрики и совместно обеспечить стабильность на нашем континенте."
nig.14.a: "Слава королю!"
nig.14.b: "За Нигерию!"
nig.14.c: "За кайзера!"

nig.15.t: "Коренной житель и колонист"
nig.15.d: "На протяжении многих лет между правами коренного населения и европейских поселенцев в нашей колонии существовал глубокий разрыв. Настало время решить эту проблему. На рассмотрении находятся несколько давно известных планов. План Твайнинга предусматривает расширение прав коренного населения, но не полное равенство. Такое решение, вероятно, удовлетворит все стороны, однако лишь отложит окончательное решение вопроса на будущее. План Азикиве, напротив, требует полного равноправия. Последствия будут неоднозначными: с одной стороны, это позволит нам развивать колонию на более справедливой основе, с другой - вызовет гнев поселенцев и может заставить их покинуть Нигерию или даже спровоцировать беспорядки. Наконец, коллаборационисты выступают за сохранение статус-кво, не видя причин менять систему, которую считают эффективной для Нигерии. Несмотря на названия этих планов, внутри каждой партии существуют серьёзные разногласия относительно предпочтительного курса, поэтому возможно практически всё. Как нам поступить?"
nig.15.a: "Улучшить положение коренного населения."
nig.15.b: "Полное равноправие."
nig.15.c: "Сохранить статус-кво."

nig.16.t: "Союзник в Африке"
nig.16.d.brits: "Бывшие британские и французские колонии в Западной Африке и Кения являются нашими естественными союзниками. Их история европейского господства схожа с нашей, и германская власть тяготит их не меньше, чем нас. Следует обратиться к этим странам и попытаться установить ещё более тесные отношения, чтобы, возможно, однажды вновь вернуться под британскую корону."
nig.16.d.native: "Эфиопия - государство, достойно противостоявшее колониальному господству. Если мы сами надеемся однажды обрести независимость, нам следует установить с ней более тесные отношения. Эфиопы обладают гордой историей, возможно даже более славной, чем наша, и прекрасно знают цену свободы. Нам стоит изучить их опыт и понять секрет их успеха!"
nig.16.d.germs: "Если мы хотим пережить эти тяжёлые времена, необходимо стремиться к более тесным отношениям с Миттельафрикой. Её правительство считает наше государство неповоротливым, и в этом есть доля истины. Однако если мы убедим их в своей верности, то сможем наладить ещё более тесное сотрудничество и тем самым обеспечить стране новую стабильность."
nig.16.a: "В Кению!"
nig.16.b: "В Аддис-Абебу!"
nig.16.c: "В Дар-эс-Салам!"

nig.17.t: "Ветер перемен"
nig.17.d.brits: "Наши повелители в Миттельафрике рухнули, и теперь настало время раз и навсегда освободиться от их власти. Однако новая свобода досталась ценой нашей безопасности, и теперь необходимо защитить новые границы как от соседей, так и от угроз из-за океана. Нельзя игнорировать и очевидную проблему: север отделился от основной территории и теперь пытается действовать независимо от нас! Одним из способов справиться со всеми этими вызовами станет союз с Антантой и помощь в её борьбе за освобождение Европы от синдикалистской угрозы. Мы должны сделать всё возможное как на континенте, так и за его пределами, чтобы сражаться за короля. Уже скоро мы вернёмся на своё законное место в Империи!"
nig.17.d.native: "Наши повелители в Миттельафрике рухнули, и теперь настало время раз и навсегда освободиться от их власти. Однако новая свобода досталась ценой нашей безопасности, и теперь необходимо защитить новые границы как от соседей, так и от угроз из-за океана. Нельзя игнорировать и очевидную проблему: север отделился от основной территории и теперь пытается действовать независимо от нас! Одним из способов справиться со всеми этими вызовами станет обращение к собственным силам и другим государствам Африки в надежде создать общий союз. Мы должны сделать всё возможное как на континенте, так и за его пределами, чтобы отстоять нашу свободу."
nig.17.d.germs:0 "Наши сюзерены в Миттельафрике потерпели крах, и наши действия в ближайшие месяцы будут иметь первостепенное значение. Формально мы теперь свободны, однако эта свобода досталась ценой нашей безопасности, и нам необходимо найти способ защитить новые границы как от соседей, так и от угроз из-за океана. Кроме того, нельзя игнорировать очевидную проблему: север отделился от нашей основной территории и теперь пытается действовать независимо от нас! Одним из способов справиться со всеми этими новыми вызовами было бы сохранить верность Германии и помочь ей в борьбе за избавление Европы от синдикалистской угрозы. Мы должны сделать всё возможное как на континенте, так и за его пределами, чтобы сражаться за кайзера. Возможно, уже совсем скоро мы вновь займём своё место в Империи, и на этот раз, быть может, во главе новой Вестафрики..."
nig.17.a: "Новый день!"

nig.18.t: "Определить нашу верность"
nig.18.d: "Теперь, когда германское господство в Африке фактически рухнуло, нам следует раз и навсегда определиться, кому мы верны. Мы уже предпринимали попытки найти союзников, однако одних дипломатических инициатив недостаточно для защиты национальной безопасности. Большинство советников требует заключить тот или иной военный союз. Юнионисты желают присоединиться к Антанте и, возможно, со временем вновь войти в состав Британской империи. Коллаборационисты, напротив, хотят сохранить верность Германии, даже несмотря на крах Миттельафрики и других германских колоний. Националисты презрительно отвергают оба предложения и вместо этого призывают к внутреннему и внешнему единству ради отражения любых угроз. Под внешним единством, судя по всему, подразумевается объединение Нигерии с соседями, причём некоторые националисты надеются тем или иным способом поставить их под наш контроль. Как бы то ни было, нам необходимо определить дальнейший курс."
nig.18.a:0 "Кайзер нуждается в нас!"
nig.18.b: "Нам не нужны эти союзы!"
nig.18.c:0 "Нигерия вновь присоединится к своему королю!"

nig.19.t: "Борьба с северными мятежниками"
nig.19.d: "Население севера Нигерии, преимущественно мусульманское и в значительной степени принадлежащее к народу хауса, уже много лет требует якобы «лучшего обращения». В действительности их цель точнее было бы описать так: заставить всё правительство одновременно закрыть глаза и позволить им незаметно отделиться. Разумеется, этого допустить нельзя, поэтому мы разработали несколько планов действий на случай, если северные повстанцы действительно попытаются отколоться. Наши разведчики сообщают, что влиятельные мятежные организации региона выжидают подходящего момента. По их мнению, северяне не осмелятся на открытое отделение, пока Нигерия не окажется в серьёзном кризисе. Независимо от качества наших планов на такой случай, необходимо сделать всё возможное, чтобы предотвратить восстание ещё до его начала. Первым шагом станет отправка элитных германских и нигерийских частей для уничтожения наиболее опасных повстанцев и, если повезёт, полного обезглавливания движения. Однако даже успех станет лишь началом, и нам следует готовиться к длительной противоповстанческой кампании на севере."
nig.19.a: "Ударить по «Братьям-мусульманам»!"

nig.200.t: "Судьба Борну"
nig.200.d: "Будущее отколовшегося государства Борну волнует всех нигерийских государственных деятелей с самого момента распада страны. Хотя Борну действительно обладает собственной идентичностью, его окончательное отделение нанесёт серьёзный удар нашему режиму и, возможно, приведёт к дальнейшему дроблению страны на ещё более мелкие государства. Мы не можем позволить ему полностью уйти. Впрочем, у нас есть несколько вариантов. Можно предложить торговое соглашение, которое фактически превратит Борну в экономически зависимое государство, либо предъявить ультиматум с требованием вернуться в состав нашей страны под угрозой войны. Что бы мы ни решили, действовать необходимо быстро, пока Борну не нашёл союзников и не выскользнул из наших рук навсегда."
nig.200.a: "Заключить торговое соглашение!"
nig.200.b: "Выдвинуть требование!"

nig.20.t: "Нигерия требует нашего возвращения!"
nig.20.d: "Всего несколько месяцев назад мы отделились от Нигерии и основали собственное государство. Однако наши бывшие союзники с тех пор не сидели сложа руки и искали любой предлог, чтобы вновь силой включить нас в состав страны. Несмотря на все наши надежды, теперь они предъявили ультиматум: либо мы возвращаемся в Нигерию, либо сталкиваемся с вторжением. Самостоятельно отразить нападение нам вряд ли удастся, но, возможно, мы сумеем продержаться достаточно долго, чтобы противник утратил интерес к войне. Или же можно принять их требования и вновь присоединиться к Нигерии. Как нам поступить?"
nig.20.a: "Хорошо, мы вернёмся..."
nig.20.b: "Никогда!"

nig.21.t: "Борну выбирает войну!"
nig.21.d: "Борну ответил на наше требование об аннексии резким отказом, заявив, что его жители скорее погибнут свободным народом, чем вновь войдут в состав страны, угнетающей мусульман. Что ж, это их выбор..."
nig.21.a: "Раздавить их!"
nig.21.b: "Выждем..."

nig.22.t: "Борну соглашается!"
nig.22.d: "Ура! Борну уступил нашему давлению и принял ультиматум - он вновь войдёт в состав нашей страны. Теперь мы можем двигаться вперёд как новая единая Нигерия, став ещё на один шаг ближе к обеспечению нашей долгосрочной независимости."
nig.22.a: "Превосходно!"

nig.23.t: "Истинное наследие Клиффорда"
nig.23.d: "Хотя все согласны с тем, что Хью Клиффорд оставил глубокий след в истории страны, мнения о том, как именно продолжать его дело, сильно расходятся. Клиффорд улучшил сразу несколько сторон жизни Нигерии: эффективность государственного управления, дисциплину и численность армии и даже способность колонии торговать с Германией и соседями. Советники отмечают, что мы можем сосредоточиться на одном из этих направлений, но попытка одновременно развивать два или все три будет значительно менее эффективной и потребует средств, которых у нас попросту нет. Так какое же из этих «наследий» мы продолжим?"
nig.23.a: "Административное наследие."
nig.23.b: "Военное наследие."
nig.23.c: "Дипломатическое наследие."

nig.24.t: "Готовиться к войне?"
nig.24.d: "Одним из крупнейших источников разногласий среди нигерийцев остаётся вера. Христианство и ислам преобладают в разных частях страны, что лишь осложняет национальное единство. В последние годы напряжённость усилилась, поскольку приток германских администраторов нарушил прежнее равновесие и вынудил нас искать ответ. К сожалению, некоторые советники настаивают на том, что этот ответ должен одновременно носить военный и религиозный характер и быть направлен против мусульманского населения севера. Реальных результатов это, скорее всего, не принесёт, однако концепцию духовной войны можно использовать в пропаганде, пока правительство за кулисами разрабатывает настоящие решения."
nig.24.a: "К войне... в некотором роде!"

nig.25.t: "Отпустить Хаусаленд?"
nig.25.d: "Наши старейшие граждане ещё помнят времена, когда Нигерия была разделена на множество государств, а этнические группы пользовались самоуправлением или хотя бы значительно большей автономией, чем сегодня. Теперь, когда германская власть рухнула, настало время вновь задуматься о подобном устройстве. Ситуацию делает ещё острее Северный народный конгресс, партия, созданная для защиты интересов северных нигерийцев, которая привела Хаусаленд к провозглашению независимости от Юга. В Лагосе и других городах многие недавно прониклись нигерийским или панафриканским национализмом, прежде всего участники Национального молодёжного движения, и требуют вернуть север в состав страны. Хаусаленд отказывается от переговоров и настаивает, чтобы мы признали его отделение, ведь подобное устройство существовало ещё в 1914 году. Следует ли объявить войну или позволить им сохранить независимость?"
nig.25.a: "Вернуть их!"
nig.25.b: "Пусть уходят."

nig.26.t: "Будущее Нигерии"
nig.26.d.brits: "Несмотря на все наши попытки объединить страну под своей властью, очевидно, что создание общей национальной идентичности потребует времени и осторожного управления: её невозможно навязать силой. Политика Эдварда Твайнинга по расширению представительства коренного населения несколько снизила напряжённость, однако нам придётся и дальше учитывать многообразие местных народов. Больше всего власти среди коренных жителей получила этническая группа йоруба на юго-западе колонии, чему во многом способствует её географическое положение. Если предоставить аналогичные возможности хауса на севере, возможно, Нигерия вновь обретёт стабильность. Когда нашей колонией управлял король, она была разделена на две области, и хотя возвращение к подобной системе нежелательно, следует понять стремление северян получить определённое влияние на правительство. Стабильная Нигерия с большей вероятностью получит статус доминиона, если мы решим вновь присоединиться к Британской империи. С другой стороны, можно совершить немыслимое и позволить северу отделиться. Он слабо развит и приносил южному правительству лишь неприятности, а единый Юг может оказаться стабильнее единой Нигерии. Как нам поступить?"
nig.26.d.native: "Хотя мы называем себя националистами, различные наши фракции обладают реальной властью преимущественно на юге. Газета Герберта Маколея, сыгравшая столь важную роль в нашем движении, буквально называется «Lagos Daily News». У Ннамди Азикиве есть определённые связи с севером, но куда лучше он знаком с Лагосом, Ганой и даже Америкой. Мы не можем называть себя националистами, если исключаем северных хауса из государственного управления. В конце концов, и йоруба, и игбо представлены в нашем правительстве, несмотря на их соперничество. В то же время мы могли бы позволить региону, где преобладают хауса, отделиться и довольствоваться Югом. Национальное молодёжное движение выступает против такого решения, однако прагматизм может оказаться важнее идеализма. Как нам поступить?"
nig.26.d.germs: "Благодаря нашей помощи власть кайзера в Нигерии остаётся прочной, однако для сохранения колонии необходимо найти долгосрочное соглашение с севером. Их требования представительства ничем принципиально не отличаются от аналогичных требований на юге, поэтому разумно предоставить им определённую долю власти. Впрочем, в значительной степени она останется лишь на бумаге: ключевые административные, военные и финансовые вопросы колонии по-прежнему будут находиться под нашим контролем. С другой стороны, Германской империи мы могли бы принести больше пользы как исключительно южная колония. Этот регион лучше развит, а наши ресурсы можно было бы направлять на помощь метрополии, а не тратить на борьбу с мусульманами на севере. Нам предстоит принять решение."
nig.26.a: "Дать им представительство..."
nig.26.b: "Пусть уходят!"

nig.27.t: "Просьба о помощи"
nig.27.d: "Всем очевидно, что без внешней помощи нам не удастся подавить упорное сопротивление севера. Существует несколько вариантов выхода из кризиса. Мы можем обратиться к Вестафрике, Кении и другим колониям, сталкивающимся с похожими проблемами и способным отправить людей или деньги для завершения операции. Кроме того, существует местный рынок наёмников. Они, разумеется, обойдутся значительно дороже наших собственных войск, но их помощь может оказаться необходимой, учитывая, что они гораздо лучше обучены и вооружены, чем национальные силы. Возможно, Миттельафрика также согласится помочь, особенно поскольку любой конфликт в нашем регионе способен перекинуться на территории, находящиеся под её непосредственным управлением. У каждого варианта есть преимущества и недостатки, но действовать необходимо, пока не стало слишком поздно. Что мы выберем?"
nig.27.a: "Обратиться к Вестафрике и Кении."
nig.27.b: "Нанять этих наёмников."
nig.27.c: "Просить помощи у Миттельафрики."

nig.28.t: "Урегулировать противоречия йоруба и игбо"
nig.28.d: "Сегодня всё внимание сосредоточено на противостоянии севера и юга Нигерии, однако колониальные администраторы часто забывают, что сам Юг также весьма неоднороден. Народ йоруба проживает преимущественно на юго-западе страны и благодаря своему географическому положению обладает, вероятно, большим влиянием, чем любая другая этническая группа Нигерии. Однако игбо оспаривают это положение почти столь же упорно, как хауса, причём добиваются куда больших успехов. Именно из этого соперничества родились первые шаги к федеративной системе в нашей колонии, и дальнейшее её развитие вполне возможно благодаря высокой степени автономии внутри Германской империи. Единственным недостатком может стать то, что хауса также потребуют представительства, и, разрешив один конфликт, мы лишь усугубим другой. Тем не менее, если хауса когда-нибудь действительно станут угрозой, без единого Юга мы не сможем им противостоять. Поэтому федерализация должна продолжаться!"
nig.28.a: "Ещё один шаг к единству!"

nig.29.t: "Положение религии"
nig.29.d: "Уже десятилетиями нас преследует вопрос о положении религии в стране. До колониальной эпохи в Нигерии преобладали ислам и традиционные верования, однако с установлением колониального господства и распространением христианства ситуация лишь усложнилась. Сначала британцы, а затем немцы понимали, что для эффективного управления необходимо защищать как мусульман севера, так и христиан юга, однако, несмотря на все германские усилия, в последние годы напряжённость усилилась. Отчасти её причиной является распределение власти: южные этнические группы обладают куда большим влиянием, чем северные, и мусульманские фульбе и хауса обвиняют правительство в предвзятости в пользу нигерийских христиан. Дополнительное напряжение вызывает стремление северян распространить законы шариата на весь регион. Удовлетворить подобное требование немыслимо, однако, возможно, система, при которой власть среди коренного населения будет поочерёдно переходить между мусульманами и христианами, даст мусульманам желаемое влияние. Это болезненный компромисс, но, возможно, необходимый для сохранения единства Нигерии. Как нам поступить?"
nig.29.a:0 "Предложить перераспределение власти на религиозной основе."
nig.29.b: "Заставить их отказаться от шариата."

nig.30.t: "Совершенствование системы управления"
nig.30.d.colonial:0 "Вопрос о том, как управлять Нигерией, беспокоил колониальную администрацию с самого момента основания колонии. Поначалу британцы решили предоставить местным правителям некоторую власть в рамках «Нигерийского совета», однако со временем система управления разделилась на три отдельных региональных образования: север, юго-запад и юго-восток. На севере британцы старались уважать мусульманскую веру, тогда как на юге их власть обеспечивал Законодательный совет. Эта система оказалась эффективной благодаря косвенному управлению и поддержке местных правителей, и немцы приложили все усилия, чтобы воспроизвести её. Для внешнего наблюдателя Нигерия может казаться единой колонией, однако любой знакомый с регионом знает, что север, юго-запад и юго-восток крайне самостоятельны и значительно отличаются друг от друга. Хотя в последнее время нам предоставили больше автономии, у этого положения есть и обратная сторона: теперь у нас нет той власти и тех ресурсов, которыми мы располагали прежде. Следовательно, нам необходимо прийти к соглашению, которое удовлетворит всё население страны, и лучшим решением представляется федеративная система. В прошлом мы уже предпринимали шаги в этом направлении, но если окончательно закрепить федерализм сейчас, мы сможем узаконить уже существующее региональное устройство и одновременно продолжить работу над объединением страны. Это эффективное решение, однако некоторые колониальные чиновники жалуются, что оно сократит их влияние в соответствующих регионах и лишит их достаточных полномочий для реагирования на кризисы. Похоже, введение официальной федеративной системы станет... прыжком веры, но, возможно, необходимым, если мы хотим сохранить контроль над севером. Как нам поступить?"
nig.30.d.native: "Вопрос федерализма в Нигерии особенно настойчиво поднимают северные хауса, поскольку превращение страны в федеративное государство гарантирует сохранение их традиционной автономии. Разумеется, если создать такую систему на основе старых британских колониальных границ, север получит более половины населения страны и достаточно влияния, чтобы господствовать над Югом. Обе стороны прекрасно это понимают. Однако если несколько изменить границы, дисбаланс сил станет значительно меньше. Хауса, безусловно, выступят против такого требования, но, оказавшись перед выбором между изменённой федерацией и полным отсутствием федерации, они могут пересмотреть свою позицию. Это всё равно рискованный манёвр, но, вероятно, необходимый, если мы хотим сохранить Нигерию единой. Как нам поступить?"
nig.30.a: "Федерализм в старых британских границах."
nig.30.b: "Федерализм с изменёнными границами штатов."

nig.31.t: "Завершение переговоров"
nig.31.d: "К лучшему или к худшему, сегодня решается будущее Нигерии. После сложных переговоров между Севером и Югом вопрос о сохранении единства страны занимает умы абсолютно всех. Делегаты объявляют, что итогом стало..."
nig.31.a: "Решение с единым государством!"
nig.31.b: "Решение с двумя государствами!"

nig.32.t: "Маколей и Азикиве"
nig.32.d: "История рождения единой нигерийской идентичности была бурной. На протяжении долгой истории регион, ныне известный как Нигерийский Свободный Штат, раздирали этнические конфликты и расколы. От древних царств Бенин и хауса до государств Канем-Борну и Эдо-Бенин, павших с возвышением Британской империи, многие пытались объединить эти земли, но каждый раз терпели неудачу. Так продолжалось до тех пор, пока европейцы не сделали последний ход в своих империалистических крестовых походах, безжалостно раскроив наш континент, совершенно не заботясь о народах, живущих на этих землях. Но даже величайшие империи обречены на падение: там, где прежде над нашими землями рычал Лев, теперь кричит имперский Орёл гуннов. Однако их приход и жестокость обернулись против них самих, ведь пламя колониальных амбиций одновременно высекло искру и в нигерийском народе. Издавна разделённые религией, языком, региональной и культурной идентичностью, многие нигерийцы начали сплачиваться перед лицом нового общего врага, создавая чувство родства, которое уже невозможно разрушить. Никто не сыграл более важной роли в формировании этого единого духа, чем Олайинка Хилас Бадмус Маколей, более известный как Герберт Маколей. Никто на наших землях не станет отрицать, что именно он является главным архитектором и отцом нигерийского национализма. Всю свою долгую жизнь Маколей трудился ради блага соотечественников, успев проявить себя в самых разных областях - аналитике, землеустройстве, музыкальной композиции, литературе и государственной деятельности.\n\nТеперь, в преклонном возрасте, ведь Маколей родился ещё в 1864 году, он особенно привязался к Ннамди Азикиве, нынешнему лидеру Партии Нигерийского фронта, которую они совместно основали после германской оккупации, последовавшей за победой Германии в Вельткриге. Маколей стал наставником молодого политика, которого с ним связывают общие национальные взгляды, панафриканские убеждения и мечта о свободной Нигерии. Теперь, когда «Зик» возглавляет партию, Маколей отошёл на второй план колониальной политики, позволив Азикиве выйти на общенациональную сцену и стать одним из главных кандидатов на предстоящих третьих парламентских выборах. Маколей официально поддержал Азикиве на выборах, и теперь, после потрясшей всю страну победы его ученика, может спокойно наслаждаться полупенсионной жизнью, зная, что будущее нигерийского народа находится в надёжных руках."
nig.32.a: "Отец нигерийского национализма передаёт Азикиве факел нашего будущего."

nig.33.t: "Тревожные события в Кении"
nig.33.d: "До нашей администрации дошли сведения, что наши колониальные братья в Кении подверглись нападениям и осквернению со стороны мерзких марксистских мятежников, известных как Мау-Мау. Это всего лишь вооружённый сброд, состоящий преимущественно из недовольных фермеров и рабочих, однако их упорство оказалось серьёзной занозой для местной администрации. Многие парламентарии требуют отправить помощь, а наиболее воинственные депутаты призывают к прямому вмешательству и помощи Кенийским пограничным силам в полном уничтожении Мау-Мау. Примечательно, что это одна из немногих инициатив за последнее время, получивших широкую поддержку одновременно и англичан, желающих помочь своим собратьям в Кении, и немцев, стремящихся сохранить целостность и престиж Миттельафрики. Главную оппозицию составляют лишь отдельные представители Партии Нигерийского фронта Ннамди Азикиве, чьи панафриканские идеалы вызывают у них симпатию к Мау-Мау. Однако даже сам «Зик» и остальные партийные сторонники жёсткой линии решительно поддерживают вмешательство или помощь, поскольку не испытывают никакой любви к марксистской заразе и опасаются её распространения по нашему чистому континенту."
nig.33.a: "Нигерия спешит на помощь своим братьям в Кении!"
nig.33.b: "Парламент ограничится экономической помощью и военным снаряжением для KFF."

nig.34.t: "Братья по панафриканизму"
nig.34.d: "На пути к формированию собственного уникального взгляда на панафриканизм у Ннамди Азикиве было немало наставников, учителей и источников вдохновения. И хотя Герберт Маколей стал его величайшим учителем, Маркус Гарви оказался его ближайшим соратником. Несмотря на сотни миль между Бенином и Монровией, они постоянно обмениваются письмами, приглашают друг друга на различные мероприятия и регулярно встречаются, причём почти каждый разговор неизбежно возвращается к панафриканским идеям. Африканское искусство, музыка, культура, религия, история, политика - этот список можно продолжать бесконечно. Гарви, по общему признанию, куда радикальнее Азикиве, однако небольшие расхождения в деталях борьбы чернокожих меркнут перед сходством их взглядов и глубокой дружбой. Оба титана движения связывают огромные надежды с собой и своими народами, и благодаря их сотрудничеству чёрный человек, возможно, наконец осуществит давнюю мечту о свободе."
nig.34.a: "Два человека, одна борьба."

nig.36.t: "Первая трещина"
nig.36.d: "Нигерийская национальная партия прошла долгий путь со дня своего основания, и теперь, когда её глава Ннамди Азикиве возглавил страну, он наконец способен воплотить мечту о независимой Нигерии. Разумеется, до подлинной и полной независимости ещё годы, если не десятилетия, однако экономические и политические реформы, укрепляющие хозяйство и расширяющие возможности нигерийского народа, могут позволить «Зику» направить страну к самостоятельному будущему. Азикиве намерен привести Нигерию к её законной судьбе посредством авторитаризма и автаркии. Эти меры уже начали тревожить многих членов партии, а дебаты на партийных заседаниях становятся всё более мутными и ядовитыми. Главным критиком «Зика» стал Обафеми Аволово, пламенный панафриканист и громкий защитник наиболее обездоленных и угнетённых жителей Нигерии. Хотя открытым левым его назвать нельзя, Аволово придерживается весьма *сомнительных* взглядов на некоторые вопросы, связанные с левыми движениями, например открыто выражает солидарность с Мау-Мау - не как марксист, а как такой же африканец. В парламенте Нигерийская национальная партия сохраняет видимость полного и непоколебимого единства, но внутри уже начинают проступать первые трещины."
nig.36.a: "Нигерийская национальная партия остаётся неделимой...?"

nig.37.t: "Отец нигерийской нации делает выбор"
nig.37.d: "Потрясший всю страну своим возвышением Ннамди Азикиве, которого народ чаще называет просто Зиком, стал лицом Нигерийского Свободного Штата и его главой. Теперь, когда бразды власти находятся в его руках, а вся колония подчиняется ему благодаря демократически полученному мандату, Зик должен решить, как именно он поведёт - или будет править - своим народом.\n\nАзикиве всегда презирал сепаратистов, регионалистов и монархистов, вместо этого выступая за сотрудничество демократических и националистических сил Нигерии. Ради мечты о свободном и суверенном нигерийском государстве он был готов работать даже с социалистами, включая своего друга и частого соперника Обафеми Аволово. Теперь, получив возможность определять будущее народа и страны, Азикиве оказался перед выбором. Зик может остаться верен демократическим принципам и продолжить строительство справедливой Нигерийской республики, о которой всегда мечтал. Однако стаи бывших колонизаторов и оппортунистических врагов, кружащие вокруг молодой страны, заставляют уважаемого государственного деятеля задуматься, не следует ли пересмотреть прежние убеждения.\n\nЕсли он откажется от демократических принципов, пусть даже временно, то лишь ради того, чтобы закалить нигерийский народ и превратить его в единую силу, готовую любой ценой защищать свою культуру и границы. Цель благородная, но вовсе не обязательно требующая обращения к авторитаризму - к тем самым порядкам, под которыми Зик и его народ страдали десятилетиями. Какой бы выбор он ни сделал, одно несомненно: Нигерия больше не принадлежит колонизаторам, ибо теперь Нигерия принадлежит нигерийцам!"
nig.37.a: "Зик любой ценой продолжит создание единой нигерийской национальной идентичности."
nig.37.b: "Зик останется патерналистским отцом нигерийской нации, отказавшись от демократических обещаний."
nig.37.c: "Зик сохранит верность демократическим идеалам и создаст широкое движение с националистическим уклоном."
nig.37.e: "Зик и Национальный совет Нигерии принесут стране подлинную и справедливую демократию."
