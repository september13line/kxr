SAU_Ikhwan_Rides_Out:0 "Ихваны выступают"
SAU_Ikhwan_Rides_Out_desc:0 "Ихваны, или «Братья», представляют собой племенное ополчение, которое Ибн Сауд использует как один из важнейших элементов нашей армии. Эти ревностные религиозные воины связаны не личной преданностью Ибн Сауду, а верностью строгим нравственным устоям исламского общества. Отвергая все западные новшества, ихваны стремятся очистить исламский мир от упадка и объединить всех мусульман в едином унитарном государстве.\n\nТем не менее они остаются неуправляемой и жестокой силой, перерезающей горло каждому попавшему к ним в плен мужчине и сражающейся мечами и копьями. Однако именно это делает их ценным орудием в руках Ибн Сауда, поскольку их фанатизм и кровожадность находят применение в печально известных набегах на земли наших соседей."

SAU_Ikwhan_Qatar: "Набег на Катар"
