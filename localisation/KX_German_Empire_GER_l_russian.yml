GER_polizei_idea_desc: "Процесс либерализации и демократизации в Рейхе был временно приостановлен из-за угрозы, исходящей от Интернационала, и вместо этого полиции были предоставлены новые полномочия. \nТолько сильная полиция может остановить подрывную деятельность, тайно планирующую уничтожение Германии."

