GER_Goering_Putsch: "§CГерман фон Геринг и его союзники принимают правительство после "трагической" смерти Курта фон Шлейхера и приостанавливают все выборы на неопределенный срок до разрешения этого кризиса.!§! \n\n§RПангерманская ассоциация становится доминирующим крылом НННП!§!"
GER_Goering_Putsch_Fail: "§CПопытка путча Германа фон Геринга провалилась, и канцлер Курт фон Шлейхер приказал немедленно арестовать всех участников. \nНННП также немедленно исключает всех своих членов, имеющих связи с ПА и другими радикальными движениями.§! \n\n§RФракция юнкером остаётся доминирующим крылом НННП!§!"
