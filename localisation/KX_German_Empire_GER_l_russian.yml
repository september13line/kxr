l_russian:

########################################
### Курт фон Шлейхер Localisation ###
########################################

### Focus ###

GER_deutschland_ber_alles: "Германия\nпревыше всего!"
GER_deutschland_ber_alles_desc: "Наша тяжелая работа окупилась! У нас есть абсолютный контроль над Рейхом, и господство нашего правительства и партии останется неизменным ещё долгое время! Теперь остаётся только убедиться, что Курту фон Шлейхеру удастся сохранить баланс интересов юнкеров и других его союзников, иначе ему не избежать нестабильности..."

GER_subsidies_for_junker_companies: "Субсидии для юнкерских компаний"
GER_subsidies_for_junker_companies_desc: "В результате "Черного Понедельника" некоторые поддерживающие нас юнкеры оказались в тяжелом финансовом положении и оказались на грани потери своих земель и компаний. Чтобы мы не потеряли их поддержку, мы должны предоставить субсидии, дабы они быстро встали на ноги, иначе это может вызвать у нас серьезные проблемы. Это вызовет некоторые вопросы о том, почему мы помогаем этим компаниям, но мы точно сможем предоставить какое-нибудь правдоподобное объяснение Рейхстагу!"

#GER_kurt_von_schleichers_chancellorship: "Курт фон Шлейхер's Chancellorship"
#GER_kurt_von_schleichers_chancellorship_desc: "The Kaiser made Курт фон Шлейхер Reichskanzler on the basis of his promise that he would decisively suppress the influence of the liberals and socialists and maintain the status quo in German society. But as it turned out, the new Reichskanzler also has his own plans for the Reich and some very powerful allies who support him..."

GER_kurt_von_schleichers_chancellorship: "Канцлерство Курта фон Шлейхера"
GER_kurt_von_schleichers_chancellorship_desc: "Кайзер сделал фон Шлейхера Рейхсканцлером благодаря его обещанием обезопасить Германию от угроз как со стороны демократов, так и со стороны юнкеров. Однако теперь, когда у него есть свой кабинет, Шлейхер сменил важные места в правительстве и заключает контракты с компаниями юнкеров, и некоторые люди шепчутся о зловещём плане, как все-таки привести юнкеров к власти..."

GER_reassign_key_government_posts: "Переназначение ключевых гос. постов"
GER_reassign_key_government_posts_desc: "Кайзер потребовал, чтобы мы заняли некоторые важные министерские посты в нашем правительстве членами партии, которую он предпочитает - DKP. Это немного затруднило наши планы, но у Франца фон Папена, лидера ДКП, личного друга и союзника Курта фон Шлейхера, есть готовое решение. Он заменит министров, избранных Кайзером, которые не состоят с нами в союзе, на лиц, преданных нашему делу, на основе "внутренней реструктуризации партии"."

GER_influence_the_reichstag: "Влияние на Рейхстаг"
GER_influence_the_reichstag_desc: "Не секрет, что в Рейхстаге есть люди, которые враждебно настроены по отношению к нам и подозревают, что наши амбиции могут быть намного больше, чем есть. Чтобы быстро заткнуть их, мы должны сначала выяснить, кого мы можем принять на свою сторону, а кого мы должны обречь на политическое устранение. Банкет должен стать отличным способом познакомиться с членами Рейхстага."

GER_establish_a_stronger_government: "Сильное правительство"
GER_establish_a_stronger_government_desc: "Чтобы усилить контроль над нашим правительством, мы должны продолжать расширять нашу сеть союзников и сторонников. По логике вещей мы должны попытаться укрепить наши связи с юнкерами и промышленниками, но ходят слухи, что есть ещё один влиятельный круг вокруг известного человека, поддержка которого может быть нам выгодна..."

GER_the_kanzler_and_his_loyal_friends: "Канцлер и его друзья"
GER_the_kanzler_and_his_loyal_friends_desc: "Рейхсканцлер Курт фон Шлейхер известен тем, что у него много влиятельных друзей во всех уголках Рейха, и поскольку никто никогда не может достаточно хорошо ладить, имеет смысл регулярно делать что-то вместе, чтобы поддерживать их лояльность и поддержку. А что может быть лучше вечеринки! Возьмите вино и шампанское, друзья мои едут в гости!"

GER_the_kanzler_and_the_statthalter: "Канцлер и штатгальтер"
GER_the_kanzler_and_the_statthalter_desc: "После успешных переговоров с НПО и её новым председателем штатгальтером Германом фон Герингом он был назначен новым вице-канцлером, что означает, что теперь у нас есть доступ к его обширной сети друзей в армии и колониальных обществах. Мы должны выразить нашу признательность и реализовать несколько его предложений и реформ."

GER_radical_antisyndicalist_propaganda: "Анти-синдикалистские чистки"
GER_radical_antisyndicalist_propaganda_desc: "Чтобы повысить готовность к войне и моральный дух перед предстоящим конфликтом с Интернационалом, вице-канцлер потребовал, чтобы мы начали пропагандистскую кампанию против синдикализма, которая нацелена как на государства-члены альянса, так и на национальные социалистические партии и союзы. Каждый немец должен ненавидеть синдикализм, чтобы мы победили в грядущей войне! Любая слабость может привести к нашему падению!"

GER_use_von_grings_influence: "Влияние Геринга"
GER_use_von_grings_influence_desc: "Теперь, когда мы некоторое время работаем с Герингом, мы провели реформы, которые он требовал. Пришло время углубить это сотрудничество. Геринг согласился оказать нам большую поддержку, если мы предоставим ему дополнительные привилегии. Он потребовал, чтобы его назначили "Рейхсполицмаршалом" и, следовательно, главой полиции. Это кажется приемлемым, мы получаем деньги и информацию, а Геринг может сыграть полицейского. Ну, если ему это нравится, можно ему разрешить. Или нет?"

GER_take_action_against_liberal_and_socialist_threats: "Стереть нелояльность"
GER_take_action_against_liberal_and_socialist_threats_desc: "Оппозиция в Рейхстаге значительно ослабла, но некоторые партии, такие как СДП или ПНП, по-прежнему являются бельмом на нашей стороне. Они используют любую возможность, чтобы разоблачить нас в Рейхстаге и раскрыть нелепые доказательства наших якобы "антидемократических махинаций". Может быть пора, чтобы некоторых из наших критиков проверила Рейхсполицию, не злоупотребляют ли они доверием народа? Тщательное расследование откроет правду!"

GER_empower_the_verdeckte_reichspolizei: "Тайная Рейхсполиция"
GER_empower_the_verdeckte_reichspolizei_desc: "Наша мощная внутренняя секретная служба, Рейхсполиция, является блестящим примером немецкой эффективности и отличной подготовки! Но мы можем сделать её ещё более эффективной, увеличив финансирование и сняв определенные ограничения, которые не позволяли ей доходить до крайности для защиты Рейха! Никому нельзя позволить избежать тисков полиции, когда на карту поставлена судьба всего Рейха!"

GER_solidify_the_position_of_the_kamarilla: "Укрепление Камарильи"
GER_solidify_the_position_of_the_kamarilla_desc: "Теперь, когда у нас есть контроль над силовым аппаратом Рейха, пора проявить своё влияние в Рейхстаге. Мы превратим наше ранее разрозненное объединение в настоящую политическую партию - Немецкую национальную народную партию. Наши сторонники, которые до сих пор были независимыми членами Рейхстага, и некоторые оппозиционные политики, поддерживающие наши цели, сформируют парламентскую группу НННП и тем самым обеспечат легитимность наших политических действий."

GER_restructure_the_oberste_heeresleitung: "Реструктуризация верховного командования армии"
GER_restructure_the_oberste_heeresleitung_desc: "Высшее военное командование состоит из элиты нашего офицерского корпуса и принимает все важные решения, касающиеся нашей армии. К сожалению, некоторые офицеры там не особо желают с нами сотрудничать. Возможно, пора отправить некоторых высокопоставленных генералов на заслуженную пенсию. Мы просто переведем более молодых и амбициозных офицеров в наши самые дальние колонии, где они смогут продолжать служить Рейху, но больше не будут представлять угрозы для наших целей."

GER_use_the_wealth_of_the_junkers: "Применение богатств юнкеров"
GER_use_the_wealth_of_the_junkers_desc: "Наш план работает отлично, оппозиция почти ликвидирована, пресса приведена в соответствие, и наши союзники сплотились за нами. Однако нельзя просто останавливаться на достигнутом. Мы попросим юнкеров реинвестировать часть их недавно приобретенного состояния в проекты, которые предпочитает наше правительство, например, для обеспечения снаряжения наших храбрых солдат или для финансирования бесплатных столовых для бедных. Это, безусловно, повысит нашу популярность среди войск и народа!"

GER_undermine_the_power_of_the_dkp: "Подрыв влияния DKP"
GER_undermine_the_power_of_the_dkp_desc: "ДКП - крупнейшая консервативная партия в Германии. Мы знаем, что многие из их членов поддерживают наши цели, но не готовы отвернуться от своей партии, так как боятся потерять своё влияние. Вот почему мы попросили Франца фон Папена выбрать некоторых важных людей в ДКП, чтобы они присоединились к НННП, дабы уменьшить сомнения других. Если все пойдет по плану, мы отделим пшеницу от плевел и удалим людей из ДКП, которые стоят на нашем пути."

GER_the_kaiser__our_figurehead: "Кайзер-марионетка"
GER_the_kaiser__our_figurehead_desc: "Путем многочисленных тайных интриг и обмена сотрудниками Кайзера нам удалось полностью изолировать его от политики в империи. Теперь он получает только ту информацию, которая непосредственно одобрена нами, и служит только в качестве фигуранта, но не имеет реальной власти. Он сидит, как птица в клетке: Вы всё ещё можете видеть и слышать его, но он больше не может действовать свободно и незаметно для нас."

GER_drinks_with_the_crown_prince: "Встреча с кронпринцем"
GER_drinks_with_the_crown_prince_desc: "В отличие от своего отца, Кронпринц - умный человек, который понял, что только НННП (и, конечно, юнкеры) может привести Германию к лучшему будущему. Чтобы укрепить эту связь, Рейхсканцлер и Кронпринц встретятся на дегустации прекрасных вин, где они смогут обсудить свои общие планы в отношении Рейха."

### Events ###

ger_schleicher.1.t: "Канцлерство Шлейхера"
ger_schleicher.1.d: "После того как Курт фон Шлейхер несколько лет плёл закулисные интриги и намеренно манипулировал доверенными лицами Кайзера, он наконец добился своей цели:\nКайзер окончательно уверился в том, что только фон Шлейхер способен защитить Рейх одновременно от угрозы синдикалистов, демократов и юнкеров и сохранить старый порядок в стране, а потому назначил его Рейхсканцлером.\nОднако Кайзер, к сожалению, не знает, что его новый Рейхсканцлер строит совершенно иные планы.\nХотя Шлейхер объявил, что намерен полностью обновить Рейх в социальном и экономическом отношении посредством своего личного проекта - плана реформы Рейха, - чтобы после разрушительных последствий Чёрного понедельника вновь вывести Германию на вершину, на деле всё это лишь пустые слова.\nВ прошлом Курт фон Шлейхер завязал дружбу с влиятельными юнкерами, которые считают, что их традиционным влиянию и власти угрожают продолжающаяся демократизация Рейха и крайне негативное отношение к ним Вильгельма II.\nПоскольку благодаря своим новым друзьям фон Шлейхер уже сколотил немалое состояние, а его влияние продолжает расти, теперь, заняв пост Рейхсканцлера, он стремится тайно остановить ход времени, чтобы сохранить столь дорогие ему власть и богатство.\nНо удастся ли ему скрыть свои отвратительные махинации от Кайзера и как Его Величество отреагирует, если узнает об этом предательстве, ещё предстоит выяснить..."
ger_schleicher.1.a: "Не волнуйтесь! Мой план сработает без проблем, обещаю!"

ger_schleicher.2.t: "Рейхсканцлер и банкет"
ger_schleicher.2.d: "Сегодня важный день для нашего Рейхсканцлера:\nОн пригласил всех членов Рейхстага, могущественных промышленников, дворян со всего Рейха и влиятельных общественных деятелей на большой банкет в своём поместье.\nОфициально это мероприятие призвано укрепить связи между политикой, бизнесом и гражданским обществом, однако у Рейхсканцлера совсем иная цель.\nОн и его союзники намерены воспользоваться банкетом, чтобы выяснить, как лучше всего манипулировать присутствующими или оказывать на них давление, дабы они либо прониклись симпатией к нашему делу, либо, по крайней мере, не представляли угрозы нашим амбициям. Для этого верных союзников заранее разместили в стратегически важных местах, чтобы собрать как можно больше сведений и установить контакты с потенциальными сторонниками, способными послужить нашему делу.\n\nПосле шумного вечера, наполненного изысканными блюдами, лучшими напитками, приятной музыкой и дружелюбной атмосферой, Курт фон Шлейхер и его союзники на следующее утро подвели итоги:\nОказалось, что среди элиты Рейха их дело пользуется куда большей поддержкой, чем они предполагали. Удалось договориться, что некоторые депутаты Рейхстага от других партий будут тайно парализовывать работу своих фракций процедурными вопросами, позволяя нам ещё больше расширять влияние. Кроме того, несколько промышленников пообещали финансовую поддержку.\nС другой стороны, удалось получить и крайне деликатные сведения о политических противниках, которые можно будет использовать, чтобы отправить их на досрочный покой, если они станут слишком опасны."
ger_schleicher.2.a: "Поздравляем с удачным банкетом и нашими новыми "друзьями"!"

ger_schleicher.3.t: "Запоминающийся вечер"
ger_schleicher.3.d: "Прекрасным вечером где-то в винном погребе одной из самых изысканных виноделен Рейха через несколько минут должна была начаться одна из важнейших встреч года. Присутствовали практически все, кто имел вес и имя:\nИзвестные промышленники, офицеры и дворяне, которых объединяло одно:\nВсе они были союзниками Рейхсканцлера и юнкеров.\nНо почётным гостем вечера стал Кронпринц Рейха Вильгельм, принц Прусский.\nВстречу созвали потому, что и Кронпринц, и фон Шлейхер пришли к выводу: Кайзеру, по всей видимости, уже недостаёт сил или воли понять, что грядущую войну с Интернационалом сможет выиграть лишь сильное правительство при поддержке сильной армии.\nОднако правительство способно добиться этого только в том случае, если ему не приходится постоянно опасаться утраты дееспособности из-за выборов, лишивших его большинства в Рейхстаге.\nНе менее важны и могущественные союзники вроде юнкеров, обладающие обширными связями и способные добывать как сведения, так и деньги.\nНо стареющий Кайзер не желает этого признавать, поскольку боится за собственную личную власть.\nК счастью для нас, Кронпринц оказался мудрым человеком и сегодня вечером заверил своего друга Рейхсканцлера, что поддержит наши усилия по максимальному отстранению его отца от повседневной политической жизни Рейха и благословляет дальнейшую централизацию власти правительства. Взамен он, однако, требует принять его в число руководителей нашего внутреннего круга и предоставить долю во всех наших финансовых прибылях.\nУчитывая, что это обеспечит нам поддержку следующего Кайзера, цена невелика, поэтому все присутствующие единогласно согласились на его требование.\nПосле создания столь могущественного союза остаток вечера прошёл весьма весело. Пили всё более дорогое вино, ведь деньги здесь уже не имели значения, а каждый получил желаемое:\nЮнкеры - почти неограниченное влияние, Кронпринц - могущественную сеть верных союзников, а Рейхсканцлер - доступ к почти абсолютной власти."
ger_schleicher.3.a: "Выпьем за этот союз и за кронпринца! Да здравствует Германия!"

ger_schleicher.4.t: "Предложение, от которого нельзя отказаться?"
ger_schleicher.4.d: "В следующие выходные на вилле семьи фон Шлейхер состоится большая вечеринка, на которую приглашены ближайшие друзья и сторонники Рейхсканцлера. Официально это просто праздник, однако главная цель встречи - обсудить новые планы и обменяться сведениями и новостями со всего Рейха.\nПодготовка уже идёт полным ходом, но сегодня утром на столе Рейхсканцлера появилось странное письмо. В нём штатгальтер Миттельафрики Герман фон Геринг просит о встрече с Куртом фон Шлейхером, чтобы обсудить «будущее всего Рейха».\nПодробности он хотел бы обсудить лично, поэтому с радостью приглашает Рейхсканцлера в следующий субботний вечер в дорогой ресторан, где уже зарезервировал столик, поскольку сейчас находится в Берлине с рабочей поездкой.\nК сожалению, вечеринка в доме фон Шлейхеров уже назначена на тот же день, а Курт не может находиться в двух местах одновременно.\nДа и вообще, стоит ли доверять такому человеку, как Геринг?\nС одной стороны, штатгальтер обладает обширными связями и большим влиянием, но с другой - известен своим вспыльчивым нравом и довольно радикальными политическими взглядами.\n\nТак стоит ли Курту действительно тайно встретиться с ним?"
ger_schleicher.4.a: "Нет, мне некогда уделять время на такую ерунду!"
ger_schleicher.4.b: "Согласиться на встречу с Герингом. Но подготовка к вечеринке должна продолжаться!"

ger_schleicher.5.t: "Встреча с штатгальетром фон Герингом"
ger_schleicher.5.d: "Около 19: Курт фон Шлейхер вошел в ресторан, где должен был встретиться с Германом фон Герингом. \nОфициант проводил его в соседнюю комнату, где его уже ждал штатгальтер. \nПосле того, как эти двое поприветствовали друг друга, они сели и поговорили о возможном сотрудничестве. \nГеринг ясно дал понять, что он убежден, что наше правительство могло бы извлечь большую пользу из его обширных контактов в армии, бизнесе и Рейхсколониаламте, поскольку он мог бы заставить людей поддержать нас. Кроме того, он обещает, что это сотрудничество принесет нам огромные суммы денег, потому что его "друзья" - владельцы крупных компаний в Рейхе, которые хотели бы поддержать нас пожертвованиями. \nВ свою очередь, Геринг требует, чтобы мы назначили его министром объединили ПА, председателем которого он был некоторое время тайно, с НННП, как мы это сделали раньше с DKP. \nНесомненно, наша ассоциация выиграет от этого предложения, и наше влияние будет расти, но оно также несет в себе столько же рисков, поэтому решение следует принимать с осторожностью. \nЕщё есть время, чтобы отвергнуть амбиции Геринга, но Курт должен принять решение здесь и сейчас."
ger_schleicher.5.a: "Принять предложение. Франц фон Папен будет представлять меня на вечеринке!"
ger_schleicher.5.b: "Отклонить это возмутительное предложение! Подготовиться к отъезду в имение сейчас же!"

ger_schleicher.6.t: "Штатгальтер фон Геринг возвращается из Миттельафрики!"
ger_schleicher.6.d: "Теперь, когда все формальности улажены и завершёны последние приготовления, пришло время привести к присяге нового аусминистра. Это должен был быть никто иной, как штатгальтер Миттельафрика Германн фон Геринг. \n\nХотя это кадровое решение поначалу раздражало некоторых в НННП и среди юнкеров, после того, как Рейхсканцлер объяснил партийному руководству новую ситуацию, большинство из них подавило свои сомнения в пригодности штатгальтера на этот пост. \n\nЦеремония прошла почти так, как ожидалось, за исключением того, что Герман фон Геринг после своей присяги вручил Рейхсканцлеру львенка в подарок, чтобы поблагодарить его за его тяжелую работу для Рейха, и сказал, что с нетерпением ждет совместной работы."
ger_schleicher.6.a: "С возвращением из Африки, господин аусминистр!"

ger_schleicher.7.t: "Вечеринка с Рейхсканцлером!"
ger_schleicher.7.d: "После того, как Курт отклонил нелепое предложение жаждущего власти штатгальтера, настали выходные, когда на его вилле проходил вечеринка с его друзьями и союзниками. \nПрисутствовало большое количество гостей, но главное событие вечера прошло за закрытыми дверями.\nКурт оставил свою жену Элизабет заботиться о гостях, пока он был в соседней комнате. Была встреча с потенциальными сторонниками, которые хотели присоединиться к НННП и нашему секретному альянсу, чтобы обеспечить себе место в нашем новом режиме. \nДва генерала и трое бизнесменов, о которых идет речь, сели за стол с фон Шлейхером и фон Папеном и заверили их, что они примут условия, которые им были даны. Таким образом, бизнесмены дают нам доступ к своим связям, а генералы заверили нас, что они воспользуются своим влиянием в армии, чтобы убедить больше офицеров присоединиться к НННП. \nВ свою очередь, пятеро сделают взнос в наш фонд заработной платы, что поможет им в ближайшем будущем заработать небольшое состояние. \n\nПосле того, как все было согласовано, вечеринка продолжалась до поздней ночи, пока, наконец, около 2 часов ночи последние гости не покинули виллу Шлейхеров и не направились домой."
ger_schleicher.7.a: "Какая это была хорошая вечеринка! Рейхсканцлер умеет правильно обращаться со своими гостями!"

ger_schleicher.8.t: "Запрос от DKP"
ger_schleicher.8.d: "Сегодня утром Рейхсканцлер получил «крайне неожиданное» предложение:\nРуководство некогда сильнейшей партии Рейха, DkP, просит DVLP объединить обе партии.\nПосле массового ухода членов в нашу партию DkP, по собственному признанию, больше не способна самостоятельно добиваться крупных политических целей и парламентского большинства, поэтому не видит иного выхода, кроме как присоединиться к нам, чтобы сохранить хотя бы часть прежнего влияния.\nЭтим успехом мы обязаны умелым действиям Франца фон Папена, сумевшего убедить достаточно влиятельных партийцев перейти на нашу сторону и тем самым практически ввергнуть DkP в хаос, поскольку за последние дни огромное число её членов перебралось в DVLP.\nПосле того как важные посты внезапно опустели, а партия оказалась неспособна остановить исход, оставшемуся руководству не осталось ничего другого, кроме как по предложению фон Папена обратиться к DVLP с просьбой об объединении.\nКурт фон Шлейхер тайно поздравил своего друга с отлично проделанной работой, а затем объявил по радио, что все оставшиеся члены DkP при желании могут вступить в DVLP и что он с нетерпением ждёт более тесного сотрудничества."
ger_schleicher.8.a: "Вместе за более сильный Рейх!"

ger_schleicher.9.t: "Новый штатгальтер"
ger_schleicher.9.d: "Поскольку Герман фон Геринг занял свой пост министра иностранных дел в Рейхе, пост штатгальтера Миттельафрики теперь вакантен. \nПеред отъездом фон Геринг порекомендовал Рейхсканцлеру, чтобы его пост занял Рейнхард Гейрдрих. \nПосле тщательного рассмотрения Рейхсканцлер согласился с предложением фон Геринга и настоящим поздравляет нового штатгальтера Гейдриха с назначением.!"
ger_schleicher.9.a: "Удачи, господин Гейдрих!"

### Sonderbarer Sonntag Event Chain ###

# A quiet night? #
ger_schleicher.10.t: "Странное воскресенье"
ger_schleicher.10.d: "Около двух часов ночи тихого воскресенья Курт фон Шлейхер и его жена спали в своей постели, когда Рейхсканцлер внезапно проснулся от странных звуков, словно кто-то пытался проникнуть в дом.\nЕго жена тоже проснулась и спросила, не грабители ли это.\n\n«Оставайся здесь, Элизабет, я посмотрю, что там происходит!» - сказал он.\n\nКурт достал пистолет из прикроватной тумбочки и медленно, стараясь не шуметь, вышел из комнаты и направился к лестнице.\nДобравшись до неё, он выглянул в окно и увидел, что двое его охранников безжизненно лежат во дворе, а несколько мужчин пытаются взломать входную дверь! Теперь Курт был уверен, что это не обычные грабители, а убийцы, пришедшие за ним!\n\nОн задумался, что делать:\nОхранники мертвы. Он вооружён, но один, а эти люди наверняка тоже вооружены. К тому же Элизабет осталась одна в спальне и могла лишь догадываться о происходящем.\nВ сложившейся ситуации у Курта было только два выхода:\nЛибо самому попытаться одолеть убийц с пистолетом в руках и надеяться, что находящийся поблизости полицейский патруль услышит выстрелы, хотя любое попадание может оказаться смертельным, либо вместе с Элизабет выбраться через окно спальни в задний сад и попытаться бежать, рискуя наткнуться там на других убийц.\n\nКакое решение должен принять Курт?"
ger_schleicher.10.a: "Курт решает противостоять убийцам!"
ger_schleicher.10.b: "Курт решает сбежать через задний сад!"

# Fight the murderers! #

ger_schleicher.11.t: "Бой у входной двери!"
ger_schleicher.11.d: "Тщательно обдумав немногочисленные варианты, Курт решил встретить незваных гостей в бою. Немецкий офицер не станет бежать как трус!\n\nОднако он понимал: если потерпит неудачу, то, вероятно, не только погибнет сам - эти ублюдки наверняка убьют и его любимую Элизабет! Теперь, когда на кону стояло так много, он не имел права проиграть!\n\nКурт нашёл защищённую позицию с хорошим сектором обстрела входной двери и стал ждать неизбежного. Наконец злоумышленники взломали дверь и тихо вошли в дом. Их было пятеро, каждый вооружён пистолетом. Они совершенно не подозревали, что Курт уже давно держит их на прицеле!\nКогда двое повернулись к нему спиной, направляясь к лестнице, он воспользовался моментом и открыл огонь!\nОбе пули достигли цели, и мужчины рухнули назад по лестнице. Оставшиеся трое были застигнуты врасплох и сперва запаниковали, что позволило Курту подстрелить ещё одного нападавшего.\nВскоре двое оставшихся пришли в себя и открыли огонь в его сторону. В доме разгорелась беспощадная перестрелка, и Курту с трудом удавалось одновременно сдерживать обоих стрелков. Но затем он сумел вывести из строя ещё одного! После ещё нескольких мучительно долгих минут Курт наконец получил чистый сектор обстрела, однако и противник уже держал его на прицеле. Раздались два выстрела, и один из них достиг цели.\n\nА ранен был..."
ger_schleicher.11.a: "...в убийцу! Элизабет! Немедленно звони в полицию!"
ger_schleicher.11.b: "...в Курта! Его последними словами были: "Прости меня, Элизабет...""

# Escape through the back garden! #

ger_schleicher.12.t: "Побег через задний сад!"
ger_schleicher.12.d: "Тщательно обдумав немногочисленные варианты,Курт решил попытаться выбраться через задний сад - только глупец станет в одиночку сражаться с пятью вооружёнными противниками!\n\nОн тихо вернулся в спальню и рассказал Элизабет, что происходит. Она заплакала и спросила его: «Почему эти люди хотят убить нас, Курт? Почему?»\n«Я и сам не знаю, но нам нужно немедленно убираться отсюда! Эти преступники уже убили Герберта и Густава снаружи, и если мы хотим выжить, надо бежать прямо сейчас! Надевай обувь!»\nОни тихо вышли из спальни и перебрались в кабинет Курта. Тот выглянул из окна в тёмный сад, пытаясь заметить какое-либо движение, однако, похоже, там никого не было.\nВ этот момент снизу донёсся треск взламываемой входной двери, после чего в дом вошли несколько человек.\n\nОни спустились с балкона в сад и побежали к калитке. Но когда вышли на улицу и начали её переходить, то увидели двух вооружённых людей, бегущих в их сторону и открывших огонь. Курт толкнул Элизабет в укрытие за припаркованным грузовым фургоном и начал отстреливаться. Он увидел, как пятеро нападавших, ворвавшихся в дом, выбежали из сада и присоединились к этим двум. Каким-то образом Курту и Элизабет удалось пробиться к главной улице, откуда уже доносились полицейские сирены. Когда до спасения оставалось совсем немного, прогремел последний выстрел. Пуля попала в Курта, и он рухнул на тротуар.\nЧерез несколько мгновений наконец прибыла полиция и открыла огонь по нападавшим.\nПосле нескольких минут боя полицейские взяли верх: пятеро нападавших погибли, а двоим удалось скрыться.\nКогда прибыла скорая помощь, чтобы оказать помощь Рейхсканцлеру, Элизабет опустилась на колени рядом с мужем и взяла его за руку, и вскоре стало ясно, что пуля..."
ger_schleicher.12.a: "...попала правую руку! Его доставили в больницу."
ger_schleicher.12.b: "...попала в сердце! Он умер на месте, и Элизабет горько плакала..."

# Schleicher survives! 1#

ger_schleicher.13.t: "На следующее утро"
ger_schleicher.13.d: "Незадолго до трёх часов дня, всего через несколько часов после того, как его и жену едва не убили, канцлер фон Шлейхер сидел в своём кабинете и слушал последние доклады полиции о причинах покушения.\nГлавный следователь берлинской полиции и глава тайной службы сообщили ему, что один из нападавших пережил перестрелку, хотя и получил тяжёлые ранения, и уже был допрошен в военном госпитале за пределами Берлина. Результаты допроса оказались крайне тревожными.\nПо словам следователей, все нападавшие были обычными рабочими, лишившимися работы и средств к существованию после Чёрного понедельника. Кроме того, все они ранее состояли в Alldeutsche Verband, а затем вступили в подпольное движение, выступавшее за «Чистоту германской расы» и другие эзотерические идеи.\nСогласно последним данным, эту группу через множество тайных посредников финансировали и снабжали нынешние члены DVLP - люди, прежде состоявшие в AV, а после объединения двух партий ставшие депутатами Рейхстага! Самым заметным среди них оказался Эрнст Рём, влиятельный политик и близкий доверенный человек вице-канцлера Германа фон Геринга. Было доказано, что за последние месяцы он и его сообщники неоднократно тайно передавали убийцам деньги и сведения. Но самое шокирующее заключалось в другом:\nСледователи были абсолютно уверены, что заговор такого масштаба не мог возникнуть без личного согласия фон Геринга.\nКурт фон Шлейхер подошёл к окну и задумался. Теперь всё складывалось воедино.\nКогда Кайзер фактически превратился в ничего не подозревающую марионетку юнкеров, потенциальному новому Рейхсканцлеру требовалось лишь одобрение покровителей, чтобы занять должность. Курт знал, что последние месяцы фон Геринг активно добивался расширения своего влияния. Он также понимал, что бывший штатгальтер Миттельафрики никогда не довольствовался постом вице-канцлера - ему хотелось большего. Пока Шлейхер был жив, Геринг не имел шансов стать Рейхсканцлером, поэтому вполне логично, что тот решил устранить его посредством подстроенного «происшествия» и наконец предъявить права на канцлерство.\nКурт невольно улыбнулся: он действительно недооценил жажду власти Геринга. Но теперь эта история закончена!\nОдним росчерком пера он приказал арестовать фон Геринга и его сообщников и немедленно казнить их за государственную измену Германской империи."
ger_schleicher.13.a: "Хорошо сыграно, герр штатгальтер, но вы переоценили себя."

# Schleicher is dead! 1-1#

ger_schleicher.14.t: "Речь Германа фон Геринга"
ger_schleicher.14.d: "Незадолго до трёх часов дня вице-канцлер Герман фон Геринг направлялся на чрезвычайное заседание Рейхстага, где должен был сообщить депутатам и гражданам Рейха о «трагической» гибели Рейхсканцлера Курта фон Шлейхера.\nВойдя в Рейхстаг, он увидел, что зал заседаний и галереи заполнены до последнего места, а присутствующие возбуждённо переговариваются. Все ожидали избрания нового Рейхсканцлера и объяснения обстоятельств смерти Курта фон Шлейхера.\nПосле короткого выступления президента Рейхстага, подчеркнувшего серьёзность положения, состоялось голосование по кандидатуре нового Рейхсканцлера. Благодаря поддержке своей партии фон Геринг почти единогласно победил кандидата от SPD.\nПрезидент Рейхстага предоставил ему слово. Геринг поднялся к трибуне, зал стих, и все взгляды устремились на него. Он так долго ждал этого момента и столько сделал ради него - теперь наконец настал его час.\n«Господин президент Рейхстага и уважаемые депутаты! Сегодня на меня выпала печальная обязанность сообщить вам и гражданам нашего Рейха об обстоятельствах убийства Курта фон Шлейхера!\nНачну с единственной хорошей новости: полиции и сотрудникам тайной службы удалось взять одного из семерых убийц живым, остальные были застрелены при попытке бегства. Задержанного уже допросили, и он признался в этом чудовищном преступлении!\nНападавшие состояли в различных социалистических и синдикалистских организациях и, как удалось доказать, получали деньги и сведения от агентов Французской коммуны для организации покушения на господина фон Шлейхера!\nНасколько нам известно, события развивались следующим образом:\nСегодня около двух часов ночи убийцы силой проникли на территорию Рейхсканцлера, сперва убили двух его телохранителей, а затем ворвались в дом. В это время он и его жена мирно спали, не подозревая о происходящем. Очевидно, фон Шлейхер проснулся лишь тогда, когда убийцы уже стояли у двери спальни: его нашли возле кровати с пистолетом в руке. Его жена Элизабет была застрелена прямо в постели и даже не успела оказать сопротивление. Господину фон Шлейхеру удалось убить одного из нападавших - его тело лежало перед спальней»."
ger_schleicher.14.a: "Шокированный ропот слышался повсюду в зале."

# Schleicher is dead! 1-2#

ger_schleicher.17.t: "Речь Германа фон Геринга"
ger_schleicher.17.d: "«Но этот случай, дорогие коллеги, вновь доказывает, что у этой синдикалистской мрази нет ни чести, ни совести и что мы обязаны уничтожить их всех до последнего! Застрелить мужчину и его беззащитную жену прямо в постели способны лишь безбожные твари! Поэтому как новый Рейхсканцлер я настоящим требую немедленного принятия “Ermächtigungsgesetz” - Закона о чрезвычайных полномочиях!»\nЭтот закон предусматривал резкое ограничение гражданских прав и перенос следующих выборов на неопределённый срок, чтобы дать властям возможность бороться с синдикалистской угрозой. SPD и остальные оппозиционные партии возмутились, заявив, что не получали никакого подобного законопроекта и никогда не согласятся на столь вопиющую меру!\nНо их протест мгновенно утонул в яростных криках с галерей, которые президент Рейхстага пытался успокоить лишь вполсилы.\nПоследовавшее голосование завершилось ожидаемо: оппозиция воздержалась, а правящая партия единогласно поддержала “Ermächtigungsgesetz”, после чего закон был принят.\nНа галереях и среди депутатов DVLP разразилось ликование. Они радостно скандировали имя Геринга, а тот благодарил народ за поддержку. Лишь представители оппозиции сидели на своих местах бледные и оцепеневшие, не в силах поверить в произошедшее.\n\nМожно было услышать, как депутат SPD сказал сидевшему рядом представителю Zentrum: «Вот так умирает свобода - под гром аплодисментов»."
ger_schleicher.17.a: "Германия превыше всего! Да здравствует канцлер Герман фон Геринг!"

# Schleicher survives! 2#

ger_schleicher.15.t: "На следующее утро"
ger_schleicher.15.d: "Незадолго до трёх часов дня, всего через несколько часов после того, как его и жену едва не убили, канцлер фон Шлейхер лежал в палате «Шарите» и слушал последние доклады полиции о причинах покушения.\nГлавный следователь берлинской полиции и глава тайной службы сообщили ему, что один из нападавших пережил перестрелку, хотя и получил тяжёлые ранения, и уже был допрошен в военном госпитале за пределами Берлина. Результаты допроса оказались крайне тревожными.\nПо словам следователей, все нападавшие были обычными рабочими, лишившимися работы и средств к существованию после Чёрного понедельника. Кроме того, все они ранее состояли в Alldeutsche Verband, а затем вступили в подпольное движение, выступавшее за «Чистоту германской расы» и другие эзотерические идеи.\nСогласно последним данным, эту группу через множество тайных посредников финансировали и снабжали нынешние члены DVLP - люди, прежде состоявшие в AV, а после объединения двух партий ставшие депутатами Рейхстага! Самым заметным среди них оказался Эрнст Рём, влиятельный политик и близкий доверенный человек вице-канцлера Германа фон Геринга. Было доказано, что за последние месяцы он и его сообщники неоднократно тайно передавали убийцам деньги и сведения. Но самое шокирующее заключалось в другом:\nСледователи были абсолютно уверены, что заговор такого масштаба не мог возникнуть без личного согласия фон Геринга.\nКурт фон Шлейхер задумался, и теперь всё складывалось воедино.\nКогда Кайзер фактически превратился в ничего не подозревающую марионетку юнкеров, потенциальному новому Рейхсканцлеру требовалось лишь одобрение покровителей, чтобы занять должность. Курт знал, что последние месяцы фон Геринг активно добивался расширения своего влияния. Он также понимал, что бывший штатгальтер Миттельафрики никогда не довольствовался постом вице-канцлера - ему хотелось большего. Пока Шлейхер был жив, Геринг не имел шансов стать Рейхсканцлером, поэтому вполне логично, что тот решил устранить его посредством подстроенного «происшествия» и наконец предъявить права на канцлерство.\nКурт невольно улыбнулся: он действительно недооценил жажду власти Геринга. Но теперь эта история закончена!\nОдним росчерком пера он приказал арестовать фон Геринга и его сообщников и немедленно казнить их за государственную измену Германской империи."
ger_schleicher.15.a: "Хорошо сыграно, герр штатгальтер, но вы переоценили себя."

# Schleicher is dead! 2-1#

ger_schleicher.16.t: "Речь Германа фон Геринга"
ger_schleicher.16.d: "Незадолго до трёх часов дня вице-канцлер Герман фон Геринг направлялся на чрезвычайное заседание Рейхстага, где должен был сообщить депутатам и гражданам Рейха о «трагической» гибели Рейхсканцлера Курта фон Шлейхера.\nВойдя в Рейхстаг, он увидел, что зал заседаний и галереи заполнены до последнего места, а присутствующие возбуждённо переговариваются. Все ожидали избрания нового Рейхсканцлера и объяснения обстоятельств смерти Курта фон Шлейхера.\nПосле короткого выступления президента Рейхстага, подчеркнувшего серьёзность положения, состоялось голосование по кандидатуре нового Рейхсканцлера. Благодаря поддержке своей партии фон Геринг почти единогласно победил кандидата от SPD.\nПрезидент Рейхстага предоставил фон Герингу слово, и тот поднялся к трибуне. Весь зал стих, и все взгляды устремились на него. Он так долго ждал этого момента и столько сделал ради него - теперь наконец настал его час.\n«Господин президент Рейхстага и уважаемые депутаты! Сегодня на меня выпала печальная обязанность сообщить вам и гражданам нашего Рейха об обстоятельствах, приведших к убийству Курта фон Шлейхера!\nНачну с единственной хорошей новости: полиции и сотрудникам тайной службы удалось взять одного из семерых убийц живым, остальные были застрелены при попытке бегства. Задержанного уже допросили, и он признался в этом чудовищном преступлении!\nНападавшие состояли в различных социалистических и синдикалистских организациях и, как удалось доказать, получали деньги и сведения от агентов Французской коммуны для организации покушения на господина фон Шлейхера!\nНасколько нам известно, события развивались следующим образом:\nСегодня около двух часов ночи убийцы силой проникли на территорию Рейхсканцлера, сперва убили двух его телохранителей, а затем ворвались в дом. Канцлер и его жена, по всей видимости, заметили проникновение убийц и сумели через балкон выбраться в задний сад, а оттуда на улицу, где, к сожалению, их перехватили другие нападавшие. Полиция быстро прибыла на место после того, как соседи сообщили о выстрелах, доносившихся с территории дома Шлейхеров. Прибывшие полицейские смогли застрелить шестерых из семерых убийц и задержать одного, однако во время бегства Рейхсканцлер получил пулю в сердце и скончался на месте на руках своей жены Элизабет. Спасти его было невозможно»."
ger_schleicher.16.a: "Шокированный ропот слышался повсюду в зале."

