# GER #

GER_kurt_the_kanzler: "§YНовый Рейхсканцлер Курт фон Шлейхер приступит к реализации своей политики и представит свой личный проект в Рейхе, который он называет§! §C"Рейхреформплан" (Имперский план реформ)§!§Y. \nХотя он утверждает, что этот план пойдет на пользу всем немцам, многие опасаются, что в конечном итоге он может принести пользу только его юнкерским друзья ...§!"
GER_puppet_wilhelm: "§YВильгельм II, несомненно, является нашим любимым Кайзером, но он неоднократно выражал гнев по поводу дружбы Рейхсканцлера Курта фон Шлейхера с юнкерами, которых он крайне презирает. \nЭто не может больше продолжаться. \nМы должны тайно обеспечить, чтобы Кайзера окружали только "заслуживающие доверия" люди и советники, которые передают ему только подготовленную и одобренную нами информацию о событиях в Рейхе. \nТогда он, наконец, не сможет больше навредить нашим амбициям своим враждебным отношением.!§! \n\n§RВильгельм II получает особую черту§!"
GER_Reichsreformplan_Progress: "§CРейхсреформплан прогрессирует§!"
GER_Merge_Ideas: "§YНациональные духи§! §CРейхсреформплан§! §Yи§! §CВлияние юнкеров§! §Yили §CВлияние Геринга§! §Yбудут объединены.§!"
GER_Goering_Influence_Gain: "§RГерман фон Геринг расширяет своё влияние§!"
