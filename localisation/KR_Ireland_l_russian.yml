ire.90.d: "Наша попытка флирта с бизнесом Австрии оказалась успешной. Конструктор автомобилей, 'Австро-Даймлер', объявил об организации своей дочерней компании в Дублине. Дублин продолжает расширяться, и наше население, несомненно, будет радо этому."
ire.90.d1: "Наша попытка флирта с бизнесом Австрии, к сожалению, провалилась. Австрийцы решили сделать более протекционистский подход к своей промышленности и запретили любые инвестиции в Дублин."
ire.90.d2: "Наша попытка флирта с бизнесом Австрии, к сожалению, провалилась. В связи с тем, что они сейчас в состоянии войны, они не могут участвовать в каких-либо инвестициях."
ire.90.a: "Фантастика!"
ire.90.b: "Чёрт."

ire.91.t: "Дублин возрождён"
ire.91.d: "Наши попытки привлечения иностранных инвесторов окончились огромным успехом. В результате, мы имеем огромную долю на мировом рынке. Ирландия больше не будет посмешищем или объектом для насмешек. Теперь она действительно Изумрудный остров."
ire.91.a: "Удачи!"

