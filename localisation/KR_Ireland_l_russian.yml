irelandflavour.362.t: "Смерть французской свободы"
irelandflavour.362.d: "Сегодня утром в Ирландии мы проснулись от серьезных новостей, пришедших из Алжира, столицы остатков того, что многие здесь считают законным правительством Франции, и заставивших многих в нашей молодой республике содрогнуться. Шарль Маврас, получивший контроль над государством после короткого гражданского конфликта, вчера официально выступил в парламенте Франции, объявив о своих намерениях восстановить Орлеанский дом на французском троне и раз и навсегда упразднить Третью республику. Принц Жан, орлеанистский претендент на корону, быстро принял приглашение, и хотя ему ещё предстоит коронация, всем ясно, что французский республиканизм окончательно мёртв.\n\nНе секрет, что большинство республиканских движений в Европе были вдохновлены Францией, и в Ирландии это особенно актуально. Вулф Тоун, отец ирландского республиканизма, был вдохновлён и непосредственно поддерживался французскими республиканцами в своих восстаниях против британской короны. Даже самый главный символ нашего государства, ирландский триколор, был создан французскими республиканками в честь свержения Луи Филиппа I, прадеда нового короля, как символ нашей общей борьбы за свободу и вольность.\n\nЭта новость очень воодушевила экстремистов как слева, так и справа в Ирландии, которые уже начали делать свои обреченные предсказания относительно будущего ирландской демократии. Некоторые крайне правые объявили это окончательным доказательством того, что либерализм и демократия слишком несовершенны для борьбы с угрозой, исходящей от синдикалистских сил, и выступили за создание современной ирландской монархии для защиты нашей нации. В то же время крайне левые интерпретировали эту новость как знак того, что буржуазная демократия не может остановить рост реакционного авторитаризма, и считают социализм единственным способом гарантировать ирландскую свободу. остаётся надеяться, что и те, и другие одинаково заблуждаются."
irelandflavour.362.a: "Ирландия сама определит свою судьбу, будь прокляты французы!"
 
irelandflavour.371.t: "Мэри Лавелл"
irelandflavour.371.d: "Ирландская писательница и драматург Кейт О'Брайен уже была заметным автором в сознании публики в прошлые годы, но её последняя работа «Мэри Лавелл», несомненно, должна стать самой известной.\n\nО'Брайен нашла свою нишу в написании романов о британских и англо-ирландских буржуа, пытающихся найти своё место в мире после английской и ирландской революций. Несмотря на своё увлечение высшим классом, убежденная англофилка О'Брайен провела большую часть последнего десятилетия в Британском Союзе, где она наслаждалась революционной атмосферой. Её образ жизни в Ирландии вызывает много нареканий: сообщается, что она коротко стрижет волосы, носит мужскую одежду и даже ходят слухи о её интимных отношениях с другими женщинами.\n\nЕе новая книга мало что делает, чтобы развеять эти инсинуации, поскольку в «Мэри Лавелл» пожилая ирландская лесбиянка признаётся в любви к главной героине. Эта «сальность» накладывается на основную нить повествования, в которой главная героиня влюбляется в женатого мужчину."
irelandflavour.371.d1: "Ирландская писательница и драматург Кейт О'Брайен уже была заметным автором в сознании публики в прошлые годы, но её последняя работа «Мэри Лавелл», несомненно, должна стать самой известной.\n\nО'Брайен нашла свою нишу в написании романов о британских и англо-ирландских буржуа, пытающихся найти своё место в мире после британской и ирландской революций. Несмотря на своё увлечение высшим классом, убежденная англофилка О'Брайен провела большую часть последнего десятилетия в Британском Союзе, где она наслаждалась революционной атмосферой. Её образ жизни в Ирландии вызывает много нареканий: сообщается, что она коротко стрижет волосы, носит мужскую одежду и даже ходят слухи о её интимных отношениях с другими женщинами.\n\nЕе новая книга мало что делает, чтобы развеять эти инсинуации, поскольку в «Мэри Лавелл» пожилая ирландская лесбиянка признаётся в любви к главной героине. Эта сальность накладывается на основную нить повествования, в которой главная героиня влюбляется в женатого мужчину.\n\nВ связи со скандальным характером как автора, так и самого произведения, в некоторых кругах звучат призывы запретить книгу в этой стране, в то время как другие говорят, что сравнительно более беззаботное отношение общества к Шинн Фейн должно остаться в силе."
irelandflavour.371.d2: "Ирландская писательница и драматург Кейт О'Брайен уже была заметным автором в сознании публики в прошлые годы, но её последняя работа «Мэри Лавелл», несомненно, должна стать самой известной.\n\nО'Брайен нашла свою нишу в написании романов о британских и англо-ирландских буржуа, пытающихся найти своё место в мире после британской и ирландской революций. Несмотря на своё увлечение высшим классом, убежденная англофилка О'Брайен провела большую часть последнего десятилетия в Британском Союзе, где она наслаждалась революционной атмосферой. Её образ жизни в Ирландии вызывает много нареканий: сообщается, что она коротко стрижет волосы, носит мужскую одежду и даже ходят слухи о её интимных отношениях с другими женщинами.\n\nЕе новая книга мало что делает, чтобы развеять эти инсинуации, поскольку в «Мэри Лавелл» пожилая ирландская лесбиянка признаётся в любви к главной героине. Эта сальность накладывается на основную нить повествования, в которой главная героиня влюбляется в женатого мужчину.\n\nНесмотря на растущие политические разногласия, О'Даффи и О Куиннеагайн разделяют взаимное отвращение к скандальной природе как автора, так и самого произведения, хотя и расходятся во мнениях о том, какие меры необходимо предпринять. \n\nО'Даффи считает, что роман нужно просто запретить и забыть, чтобы он не повлиял на других, в то время как О Куиннеагайн полагает, что роман и его автор должны стать яркими примерами коррупции, аморальности и извращений англо-синдикализма, от которых новый режим стремится защитить ирландский народ."
irelandflavour.371.a: "Это слабый ум, который не может пережить легкого возбуждения; пусть ханжи ворчат."
irelandflavour.371.b: "В этой стране есть нечто, называемое моралью; выкиньте эту дрянь."
irelandflavour.371.c: "Эта дрянь должна оставаться невидимой для ирландских глаз."
irelandflavour.371.e: "Пусть вся Ирландия станет свидетелем извращенной натуры саксонского врага!"
 
irelandflavour.372.t: "Игры Таилтеанна"
irelandflavour.372.d: "«Сделайте для галлов то, что вы сделали для греков» - такими лозунгами пестрели брошюры, которые распространялись вокруг Лейнстер-хауса в течение последних нескольких недель. Относительно успешное проведение современных Олимпийских игр в Дублине в прошлом году заставило небольшую, но влиятельную группу ирландских спортивных энтузиастов оказать давление на правительство с целью повторного проведения Игр Таилтеанна.\n\nИгры Таилтеанна в их первоначальном виде проводились в столетия, предшествовавшие норманнским вторжениям 1169-1171 годов, и даже за тысячелетие до рождения Христа, если верить легендам. Традиция гласит, что впервые они были проведены в честь похорон божества урожая Таилтиу, который умер от истощения после того, как расчистил густые, обширные леса провинции Мит, чтобы создать богатые сельскохозяйственные угодья, которыми она известна сейчас. Эти игры были объявлены временем перемирия, в ходе которого проводились испытания на смекалку, ловкость и силу, а также время для празднования и заключения браков.\n\nНезадолго до начала Британской революции в 1924 году администрация Шинн Фейн с большим успехом организовала современный аналог. Проведенные через несколько недель после Олимпийских игр в Берлине, игры собрали сотни людей ирландского происхождения со всего мира, а также несколько приглашенных участников, чтобы добавить зрелищности.\n\nК огорчению тех, кто подал петицию правительству, эти игры не стали регулярными. Соображения безопасности и проблемы с расходами стали слишком серьезными для сменявших друг друга правительств того времени, особенно если учесть, что из-за изолированного характера игр международное сообщество не будет заинтересовано в инвестировании средств в повышение безопасности. Даже проведение самих Олимпийских игр было непростым решением и было принято только на основании международного признания, которое должно было перевесить первоначальные затраты.\n\nНо поскольку мир был охвачен новыми конфликтами, особенно в Америке, где проживает большая часть диаспоры, не говоря уже о ещё более крупном спортивном событии, которое проводилось на местном уровне только в недавнем прошлом, правительство не проявило особого желания прислушиваться к этим петициям."
irelandflavour.372.a: "Это может подождать ещё несколько лет."
 
irelandflavour.373.t: "Старые друзья в Новой Англии"
irelandflavour.373.d: "Когда республика только зарождалась, ища союзников и международного признания, она нашла твердую поддержку в лице жителей Новой Англии, одного из крупнейших мест проживания ирландской диаспоры. Когда Катал Бруга посетил Бостон и произнес свою великую речь в Фенуэй-парке, тысячи людей собрались там и прокричали о независимости Ирландии. В связи с недавним кризисом в Америке, переросшим в Гражданскую войну, в Новой Англии было создано временное правительство после вмешательства канадцев, чтобы укрыть его от войны.\n\nХотя некоторые члены правительства отказываются открыто поддерживать все, что поддерживается британскими изгнанниками, многие призывают Ирландию признать правительство Новой Англии и пригласить [NEE.GetLeader] произнести свою собственную речь, символизирующую ирландско-американскую дружбу и сотрудничество."
irelandflavour.373.a: "Мы никогда не забываем друзей, отправим приглашение."
irelandflavour.373.b: "Мы не можем поддерживать британский империализм, независимо от того, кто возглавляет их государство."
 
irelandflavour.381.t: "Долой джаз"
irelandflavour.381.d: "Священнослужители низкого ранга из наименее населенного графства Ирландии обычно не вызывают интереса ни у СМИ, ни у политиков страны, но отец Питер Конефрей из Лейтрима - исключение. Будучи убежденным националистом, Конефрей выступает за то, чтобы население поддерживало ирландский язык и традиционную ирландскую музыку, а не иностранное влияние.\n\nПодобные взгляды стоят десять копеек, и, более того, они настолько проторены, что либералы Ирландии уже привыкли к их пересказу. Однако Конефрей нашел несколько смелую новую линию нападения, осуждая джаз как «заимствованный из Центральной Африки бандой богатых синдикалистов в США, чтобы нанести удар по христианской цивилизации во всем мире» и клеймя слушателей как откровенных «предателей» Ирландии, причем особый яд выплескивается в адрес англо-ирландцев и жителей Германии за их потворство этому жанру. \n\nКонфрей с его угрюмыми взглядами, которые наносят удар по всему иностранному и столичному, смог собрать «несколько тысяч» сторонников на недавнем антиджазовом протесте в южном Лейтриме. С трибуны были зачитаны письма поддержки от Имона де Валеры и архиепископа Джозефа Макрори, а также прозвучали словесные нападки на политиков, отстаивающих культурные плюралистические взгляды. Трудно было бы представить себе подобную активизацию десять лет назад, но очевидно, что последние экономические и политические события подлили масла в огонь."
irelandflavour.381.a: "Люди понимают, что у нас есть своя культура и нет необходимости вытеснять её другой."
irelandflavour.381.b: "Он должен знать, что без иностранного импорта мы никогда бы не приняли христианство."
irelandflavour.381.c: "Когда экономические ответы не будут получены, массы будут отвлекаться на эту возню."
 
irelandflavour.382.t: "Редмонд в воспоминаниях"
irelandflavour.382.d: "Наступила очередная годовщина со дня смерти Джона Редмонда.\n\nНедавно состоялись памятные мероприятия, посвященные 20-летию со дня смерти Джона Редмонда.\n\nЭто было негромкое событие. Для многих он запомнился как человек, оказавшийся на неправильной стороне истории, чьи действия привели к гибели тысяч молодых ирландцев. Для других - как человека, чья одна главная ошибка определила всю его политическую карьеру. Однако при жизни Редмонд был гораздо больше, чем сейчас.\n\nКак лидер Ирландской парламентской партии, он был фактическим лидером ирландского национализма в начале 1910-х годов. Его цель - Домашнее правление - была на грани воплощения в жизнь Вестминстером, что делало Гражданскую войну в Ирландии между Ольстерскими добровольческими силами и Ирландскими добровольцами того времени неизбежной. Начало Вельткрига положило конец обеим этим уверенностям, и Редмонд принял судьбоносное решение призвать всех трудоспособных добровольцев вступить в ряды британских военных сил, пытаясь обеспечить введение в действие Домашнего Правления после того, что наверняка будет ещё одной короткой войной...\n\nОн был человеком, для которого Домашнее Правление было конечной целью, и он был бы доволен автономной Ирландией в сердце Британской империи. И это в то время, когда большинство других, даже в его партии, видели в этом лишь шаг к большей независимости. К его наследию более благосклонно относятся те, кто поддерживал более тесные личные связи с Британией, и немногие более умеренные республиканцы, симпатизировавшие Антанте.\n\nВ его родном Уэксфорде, где он был похоронен, в семейном мавзолее состоялась скромная и почтительная церемония, на которой присутствовали несколько политиков и партийных функционеров Фианна Файл, а также несколько ирландских ветеранов Вельткрига. Присутствующих призвали переосмыслить его наследие и вспомнить о тех временах, в которые он жил, прежде чем Республика могла стать реальностью. Это послание, конечно же, предназначалось для тех, кто не присутствовал на церемонии, и, по большому счету, осталось без внимания."
irelandflavour.382.a: "Он был человеком своего времени."
 
irelandflavour.385.t: "Сожжение «больших домов»"
irelandflavour.385.d1: "Одним из сохранившихся пережитков британского колониализма в Ирландии являются так называемые «Большие дома» - загородные поместья, разбросанные по всей сельской местности Ирландии. Хотя эти дома в первую очередь являются домами, они имеют двойное назначение - служить связующим звеном сельскохозяйственных комплексов. Как правило, во дворе, примыкающем к дому, работают десятки и десятки фермеров, а хозяин выступает в роли их начальника. Происхождение этой системы относится к средневековью, и, по правде говоря, с тех пор она не сильно продвинулась в своей концепции.\n\nВ Ирландии эти поместья контролировались и контролируются англо-ирландскими семьями, которые появились в XVII и XVIII веках, когда предшествующая католическая знать лишилась власти и влияния. Своим богатством и статусом эти семьи обязаны британскому государству, которое их создало, и были верными слугами империализма, поддерживая статус-кво не только на местном, но и на международном уровне, поскольку ненаследственные сыновья этих семей часто выступали в качестве колониальных бюрократов по всей Британской империи. После революции в Британии большие дома часто становились последним убежищем для этих «слуг империи»\n\nПо мере того как огонь революции распространялся по острову, неизбежно было восстание народа и попытка разрушить эти крепости иностранного капитала. Правительство в целом закрывает на это глаза, поскольку за закрытыми дверями эти действия считаются симптомом революционной активности, а не чем-то, что следует подавлять. Мы так долго разжигали огонь, что сейчас не время пытаться его затушить." # Syndies / Totalists
irelandflavour.385.d2: "Одним из сохранившихся пережитков британского колониализма в Ирландии являются так называемые «Большие дома» - загородные поместья, разбросанные по всей сельской местности Ирландии. Хотя эти дома в первую очередь являются домами, они имеют двойное назначение - служить связующим звеном сельскохозяйственных комплексов. Как правило, во дворе, примыкающем к дому, работают десятки и десятки фермеров, а хозяин выступает в роли их начальника. Происхождение этой системы относится к средневековью, и, по правде говоря, с тех пор она не сильно продвинулась в своей концепции.\n\nВ Ирландии эти поместья контролировались и контролируются англо-ирландскими семьями, которые появились в XVII и XVIII веках, когда предшествующая католическая знать лишилась власти и влияния. Своим богатством и статусом эти семьи обязаны британскому государству, которое их создало, и были верными слугами империализма, поддерживая статус-кво не только на местном, но и на международном уровне, поскольку ненаследственные сыновья этих семей часто выступали в качестве колониальных бюрократов по всей Британской империи. После революции в Британии большие дома часто становились последним убежищем для этих «слуг империи»\n\nПо мере того как огонь революции распространялся по острову, было неизбежно, что народ восстанет и попытается разрушить эти крепости иностранного капитала. правительственные учреждения были заполнены сообщениями о недавних нападениях на «большие дома». Во многих отношениях это можно только приветствовать, но в других - предостеречь. Если мы хотим сохранить верховенство закона, правительству необходимо действовать быстро и взять под контроль эти дома, превратив их в коммунальную собственность, а не позволять разрушать их на эмоциях." # RadSocs
irelandflavour.385.d3: "Одним из сохранившихся пережитков британского контроля над Ирландией являются так называемые «Большие дома» - загородные поместья, разбросанные по всей сельской местности Ирландии. Хотя в первую очередь это дома, они выполняют двойную функцию - служат связующим звеном сельскохозяйственных комплексов. Как правило, во дворе, примыкающем к дому, работают десятки и десятки фермеров, а хозяин выступает в роли их начальника. Происхождение этой системы относится к средневековью, и, по правде говоря, с тех пор она не сильно продвинулась в своей концепции.\n\nВ Ирландии эти поместья контролировались и контролируются англо-ирландскими семьями, которые появились в XVII и XVIII веках, когда предшествующая католическая знать лишилась власти и влияния. Своим богатством и статусом эти семьи обязаны британскому государству, которое их создало, и были верными слугами империализма, поддерживая статус-кво не только на местном, но и на международном уровне, поскольку ненаследственные сыновья этих семей часто выступали в качестве колониальных бюрократов по всей Британской империи. После революции в Британии большие дома часто становились последним убежищем для этих «слуг империи»\n\nПосле недавнего восстановления гэльского характера нации многие сельские районы восстали и напали на эти большие дома, сжигая их, где только возможно. Хотя правительство не может публично поощрять уничтожение частной собственности негосударственными субъектами, оно может и будет закрывать на это глаза, когда это удобно. Если мы хотим восстановить чувство гордости и достоинства нации, то времена, когда бедные фермеры склоняли головы перед владыками британского происхождения, должны закончиться." # NatPops
irelandflavour.385.a: "Мы только обожжем себе руки, если попытаемся задушить пламя революции." # Syndies / Totalists
irelandflavour.385.b: "Пришло время разорвать цепи." # RadSocs Yes
irelandflavour.385.c: "Средства производства должны быть захвачены, а не уничтожены." # RadSocs No
irelandflavour.385.e: "Пусть сорняки будут вырваны с корнем." # NatPops
 
irelandflavour.386.t: "Гэльская атлетическая ассоциация"
irelandflavour.386.d1: "Гэльская атлетическая ассоциация (ГАА) была основана в 1884 году во время так называемого «гэльского возрождения» для защиты и продвижения традиционных ирландских видов спорта. В достижении этой цели ГАА добилась значительных успехов. Если до появления ГАА «гэльские» игры - футбол, херлинг, гандбол и раундер - были в значительной степени неживыми, то после обретения независимости клубы, связанные с ГАА, можно было найти в каждом ирландском приходе. Хотя её влияние было сильнее в сельской местности, после обретения независимости «футбол» означал гэльскую разновидность почти для любого ирландца. ГАА продолжает организовывать и управлять этими видами спорта как в стране, так и за рубежом, а клубы и мероприятия ГАА часто собирают огромные толпы зрителей.\n\nНеобычно для организации, занимающейся культурным возрождением, в политической сфере ГАА была и остаётся тесно связана с ирландским национализмом. В частности, среди её основателей и первых покровителей были видные фениевцы и Хоумрулеры, а местные клубы ГАА были ранними центрами вербовки в Ирландское республиканское братство. Кровавое воскресенье" - резня, учиненная войсками Короны над мирными зрителями во время матча по гэльскому футболу на главном стадионе ГАА «Кроук Парк», - стало мощным символом британской тирании во время Войны за независимость. \n\nГаА ненадолго получила полномочия над ирландской легкой атлетикой в целом, пока в середине 1922 года не была создана Национальная ассоциация атлетов и велосипедистов (НААВ). В то время Ирландия недавно подписала англо-ирландский договор с Великобританией, и поддержка ГАА со стороны новой независимой Ирландии могла подорвать спортивное единство. Это раздвоение сохранилось даже после окончания британского правления на Севере и продолжается до сих пор. Хотя Гэльские игры (и, соответственно, ГАА) получают значительную поддержку от правительства в Дублине, в интересах поддержания социальной гармонии нынешнее правительство республики, похоже, намерено и дальше поддерживать такое положение вещей."
irelandflavour.386.d2: "Гэльская атлетическая ассоциация (ГАА) была основана в 1884 году во время так называемого «гэльского возрождения» для защиты и продвижения традиционных ирландских видов спорта. В достижении этой цели ГАА добилась значительных успехов. Если до появления ГАА «гэльские» игры - футбол, херлинг, гандбол и раундэрс - были в значительной степени неживыми, то после обретения Ирландией независимости клубы, связанные с ГАА, можно было найти в каждом ирландском приходе. Хотя её влияние было сильнее в сельской местности, после обретения независимости «футбол» означал гэльскую разновидность почти для любого ирландца. ГАА продолжает организовывать и управлять этими видами спорта как в стране, так и за рубежом, а клубы и мероприятия ГАА часто собирают огромные толпы зрителей.\n\nНеобычно для организации, занимающейся культурным возрождением, в политической сфере ГАА была и остаётся тесно связана с ирландским национализмом. В частности, среди её основателей и первых покровителей были видные фениевцы и Хоумрулеры, а местные клубы ГАА были ранними центрами вербовки в Ирландское республиканское братство. Кровавое воскресенье" - массовое убийство мирных зрителей во время матча по гэльскому футболу на главном стадионе ГАА «Кроук Парк" - стало мощным символом британской тирании во время Войны за независимость. \n\nНесмотря на то, что Эоин О'Даффи не любил заниматься управлением легкой атлетикой, он в своё время занимался политикой в организационном органе Ольстерской ГАА и всегда был глубоко привержен спорту и ГАА в частности. Хотя некоторые гэлисты до сих пор ворчат по поводу его предполагаемого предательства гэльской легкой атлетики - именно под его руководством в середине 1922 года была создана Национальная ассоциация атлетов и велосипедистов (НААВ), чтобы взять на себя полномочия в отношении негэльских видов спорта. В середине 1922 года была создана Национальная ассоциация атлетов и велосипедистов (НААВ), чтобы взять на себя полномочия по негэльскому спорту, - с момента прихода ГАА к неоспоримому политическому авторитету правительственный патронаж заметно вырос."
irelandflavour.386.d3: "Гэльская атлетическая ассоциация (ГАА) была основана в 1884 году во время так называемого «гэльского возрождения» для защиты и продвижения традиционных ирландских видов спорта. В достижении этой цели ГАА добилась значительных успехов. Если до появления ГАА «гэльские» игры - футбол, херлинг, гандбол и раундэрс - были в значительной степени неживыми, то после обретения Ирландией независимости клубы, связанные с ГАА, можно было найти в каждом ирландском приходе. Хотя её влияние было сильнее в сельской местности, после обретения независимости «футбол» означал гэльскую разновидность почти для любого ирландца. ГАА продолжает организовывать и управлять этими видами спорта как в стране, так и за рубежом, а клубы и мероприятия ГАА часто собирают огромные толпы зрителей.\n\nНеобычно для организации, занимающейся культурным возрождением, в политической сфере ГАА была и остаётся тесно связана с ирландским национализмом. В частности, среди её основателей и первых покровителей были видные фениевцы и Хоумрулеры, а местные клубы ГАА были ранними центрами вербовки в Ирландское республиканское братство. Именно резня, учиненная коронными войсками над мирными зрителями во время матча по гэльскому футболу на главном стадионе ГАА «Кроук Парк», «Кровавое воскресенье», стала ярким символом британской тирании во время Войны за независимость.\n\nХотя борьба за политический суверенитет была выиграна много лет назад, враг продолжает доминировать над Ирландией и её народом: иностранные игры по-прежнему популярны по всей стране и даже занимают более престижное место в сознании многих. Такое печальное положение дел требует принятия мер, и очевидно, что ГАА станет и мечом, и щитом в борьбе за национальное освобождение легкой атлетики. Государство уже начало вести эту борьбу рука об руку с ГАА. Хотя решительных действий пока не предпринимается, восхваление ГАА и Гэльских игр стало обычной чертой митингов AN и публичных заявлений О Куиннеагайна.\n\nОбщей темой стало разочарование состоянием управления ирландским спортом. Хотя ГАА ненадолго получила полномочия над ирландской легкой атлетикой в целом, Национальная ассоциация атлетов и велосипедистов (НААВ) была основана в середине 1922 года и сохраняет полномочия над многими областями легкой атлетики, включая те иностранные игры, которые должны были быть изгнаны из Ирландии с самого начала. Очевидно, что масштабная реорганизация, включая расширение полномочий ГАА, давно назрела."
irelandflavour.386.d4: "Гэльская атлетическая ассоциация (ГАА) была основана в 1884 году во время так называемого «гэльского возрождения» для защиты и продвижения традиционных ирландских видов спорта. В достижении этой цели ГАА добилась значительных успехов. Если до появления ГАА «гэльские» игры - футбол, херлинг, гандбол и раундэрс - были в значительной степени неживыми, то после обретения Ирландией независимости клубы, связанные с ГАА, можно было найти в каждом ирландском приходе. Хотя её влияние было сильнее в сельской местности, после обретения независимости «футбол» означал гэльскую разновидность почти для любого ирландца. ГАА продолжает организовывать и управлять этими видами спорта как в стране, так и за рубежом, а клубы и мероприятия ГАА часто собирают огромные толпы зрителей.\n\nНеобычно для организации, занимающейся культурным возрождением, в политической сфере ГАА была и остаётся тесно связана с ирландским национализмом. В частности, среди её основателей и первых покровителей были видные фениевцы и Хоумрулеры, а местные клубы ГАА были ранними центрами вербовки в Ирландское республиканское братство. Именно резня, учиненная коронными войсками над мирными зрителями матча по гэльскому футболу на флагманском стадионе ГАА «Кроук Парк», «Кровавое воскресенье», стала мощным символом британской тирании во время Войны за независимость.\n\nВ свете националистической родословной и общей популярности ГАА, между организацией и правительством изначально существовала неловкость, поскольку свет социализма озарял ирландское правительство. По сути, между ГАА и Дублином вступило в силу негласное соглашение, согласно которому каждая из сторон оставляла друг друга в покое, насколько это было возможно. Со своей стороны, ирландское правительство продолжало опираться на гэльский спорт в поисках легитимности, вызывая лишь неофициальное недовольство со стороны руководства организации, в то время как ГАА оставалась независимой. Однако в последние месяцы ГАА, похоже, ещё больше примирилась с социалистическим правительством: социалисты были приняты и избраны на различные руководящие должности в ассоциации. Высокопоставленные члены ГАА даже появлялись вместе с правительственными чиновниками на ряде громких мероприятий, что свидетельствует о том, что ГАА постепенно становится немного розовой, если ещё не полностью красной."
irelandflavour.386.a: "За ирландский спорт!"
 
irelandflavour.387.t: "Смерть Кухулайнна"
irelandflavour.387.d1: "Из всех фигур ирландской мифологии ни одна не известна так хорошо, как прославленный чемпион Ольстера Ку Чулейн. Родившись под именем Сетанты, он получил своё более известное прозвище, означающее "Гончая Куланна", ещё в детстве, когда в целях самообороны убил сторожевого пса кузнеца Куланна, предложив ему занять его место из чувства долга. Обучившись искусству боя в Шотландии, он вскоре стал сильнейшим воином Ольстера, наиболее известным защитником Королевства от войск Королевы Медб из Коннахта в мифологическом эпосе "Táin Bó Cúailnge"\n\nПопулярная бронзовая статуя, созданная Оливером Шеппардом, Скульптор, участвовавший в художественных конкурсах во время Олимпийских игр 1924 и 1928 годов, изображает окончательную смерть Ку Чулейна в бою, когда он привязал себя к камню, согласно некоторым рассказам, своими собственными кишками, чтобы умереть на ногах, оставив своих врагов в неведении о своей кончине на три дня, пока ворон не сел ему на плечо. Шеппард - протестант, родившийся в графстве Тайрон, но, тем не менее, ирландский националист, который, по его собственным словам, заявил: "Моя политика проста. Я всегда считал, что эта страна должна быть свободной", и он сам имеет отношение к борьбе за независимость, будучи учителем Вилли Пирса, брата знаменитого Падрейга Пирса.\n\n$irelandflavour.387.d.end$, возрождающего патриотизм по мере роста напряженности в Европе. Однако лоялисты также пытаются объявить мифологического героя своим, поскольку он защищал Ольстер от других провинций Ирландии. Хотя многие относятся к этому скептически, было высказано предположение, что его размещение в мэрии Белфаста может послужить средством преодоления межконфессионального раскола, подчеркнув общую провинциальную идентичность жителей Ольстера."
irelandflavour.387.d2: "Из всех фигур ирландской мифологии ни одна не известна так хорошо, как прославленный чемпион Ольстера Ку Чулейн. Родившись под именем Сетанты, он получил своё более известное прозвище, означающее "Гончая Куланна", ещё в детстве, убив в целях самообороны сторожевого пса кузнеца Куланна и предложив ему занять его место из чувства долга. Обучившись искусству боя в Шотландии, он вскоре стал сильнейшим воином Ольстера, наиболее известным защитником Королевства от войск Королевы Медб из Коннахта в мифологическом эпосе "Táin Bó Cúailnge"\n\nПопулярная бронзовая статуя, созданная Оливером Шеппардом, Скульптор, участвовавший в художественных конкурсах во время Олимпийских игр 1924 и 1928 годов, изображает окончательную смерть Ку Чулейна в бою, когда он привязал себя к камню, согласно некоторым рассказам, своими собственными кишками, чтобы умереть на ногах, оставив врагов в неведении о своей кончине на три дня, пока ворон не сел ему на плечо. Шеппард - протестант, родившийся в графстве Тайрон, но, тем не менее, ирландский националист, который, по его собственным словам, заявил: "Моя политика проста. Я всегда считал, что эта страна должна быть свободной", и он сам имеет отношение к борьбе за независимость, будучи учителем Вилли Пирса, брата знаменитого Падрейга Пирса.\n\nПоскольку скульптура оставалась непроданной в студии Шеппарда, несмотря на восхищение ею, правительство решило приобрести её. После этого было принято решение установить её в самом подходящем месте - на Главном почтамте в Дублине, на родине Пасхального восстания, где статуя будет служить мощным символом безграничного мужества, стойкости и патриотизма ирландского народа. Однако лоялисты также пытались присвоить мифологического героя себе за то, что он защищал Ольстер от других провинций Ирландии, и несколько голосов соответственно предложили перенести статую в Белфаст. Естественно, это требование было встречено с насмешкой, ведь Ку Чулейн был не поселенцем, преданным чужеземному королю и выступавшим против родной культуры ирландцев, а сам гэльским ирландцем."
irelandflavour.387.d3: "Из всех фигур ирландской мифологии ни одна не известна так хорошо, как прославленный чемпион Ольстера Ку Чулейн. Родившись под именем Сетанты, он получил своё более известное прозвище, означающее "Гончая Куланна", ещё в детстве, убив в целях самообороны сторожевого пса кузнеца Куланна и предложив ему занять его место из чувства долга. Обучившись искусству боя в Шотландии, он вскоре стал сильнейшим воином Ольстера, наиболее известным защитником Королевства от войск Королевы Медб из Коннахта в мифологическом эпосе "Táin Bó Cúailnge"\n\nПопулярная бронзовая статуя, созданная Оливером Шеппардом, Скульптор, участвовавший в художественных конкурсах во время Олимпийских игр 1924 и 1928 годов, изображает окончательную смерть Ку Чулейна в бою, когда он привязал себя к камню, согласно некоторым рассказам, своими собственными кишками, чтобы умереть на ногах, оставив врагов в неведении о своей кончине на три дня, пока ворон не сел ему на плечо. Шеппард - протестант, родившийся в графстве Тайрон, но, тем не менее, ирландский националист, который, по его собственным словам, заявил: "Моя политика проста. Я всегда считал, что эта страна должна быть свободной", и он сам имеет отношение к борьбе за независимость, будучи учителем Вилли Пирса, брата знаменитого Падрейга Пирса.\n\n$irelandflavour.387.d.end$ связывая события 1916 года со славным гэльским прошлым Ирландии. Однако лоялисты также пытаются объявить мифологического героя своим, поскольку он защищал Ольстер от других провинций Ирландии, и хотя многие относятся к этому скептически, другие считают, что такой интерес к ирландской мифологии следует поощрять, и что размещение памятника в мэрии Белфаста может устранить местный раскол и способствовать интеграции протестантов Ольстера в Гэлдом."
irelandflavour.387.d4: "Из всех фигур ирландской мифологии ни одна не известна так хорошо, как прославленный чемпион Ольстера Ку Чулейн. Родившись под именем Сетанты, он получил своё более известное прозвище, означающее "Гончая Куланна", ещё в детстве, убив в целях самообороны сторожевого пса кузнеца Куланна и предложив ему занять его место из чувства долга. Обучившись искусству боя в Шотландии, он вскоре стал сильнейшим воином Ольстера, наиболее известным защитником Королевства от войск Королевы Медб из Коннахта в мифологическом эпосе «Táin Bó Cúailnge»\n\nПопулярная бронзовая статуя, созданная Оливером Шеппардом, Скульптор, участвовавший в художественных конкурсах во время Олимпийских игр 1924 и 1928 годов, изображает окончательную смерть Ку Чулейна в бою, когда он привязал себя к камню, согласно некоторым рассказам, своими собственными кишками, чтобы умереть на ногах, оставив врагов в неведении о своей кончине на три дня, пока ворон не сел ему на плечо. Шеппард - протестант, родившийся в графстве Тайрон, но, тем не менее, ирландский националист, который, по его собственным словам, заявил: "Моя политика проста. Я всегда считал, что эта страна должна быть свободной", и он сам имеет отношение к борьбе за независимость, будучи учителем Вилли Пирса, брата знаменитого Падрейга Пирса.\n\n$irelandflavour.387.d.end$ Доказывая патриотические полномочия социалистической республики против реакционных обвинений в западнобританском духе. Однако лоялисты также пытаются присвоить мифологического героя себе, поскольку он защищал Ольстер от других провинций Ирландии, и хотя многие относятся к этому скептически, было высказано предположение, что его размещение в мэрии Белфаста может послужить средством преодоления межконфессионального раскола между местными рабочими, подчеркивая общую провинциальную идентичность жителей Ольстера."
irelandflavour.387.a: "Нет более подходящего места для величайшего воина Ирландии, чем здание Государственного архива."
irelandflavour.387.b: "Наследие Ку Чулейна объединит народ его родного Ольстера."
irelandflavour.387.c: "Как и камень Ку Чулейна, Ирландия по-прежнему сильна."
 
irelandflavour.388.t: "Чёрное золото"
irelandflavour.388.d: "Сегодня Лейнстер-Хаус наполнился звуками одобрительных возгласов и облегченных поздравлений. Благодаря прекрасной работе Министерства иностранных дел Ирландии был обеспечен доступ к жизненно важному источнику энергии. Поскольку это топливо не водится в Ирландии, его можно было получить только путём импорта из стран, расположенных гораздо ближе к экватору, и этот ресурс был настолько важен, что многие удивлялись, как многие промышленные отрасли обходились без него в прошлом, учитывая, насколько они зависят сейчас от богатой темной жидкости, которую он производит.\n\nЧай. «Единственная хорошая вещь, которую оставили нам британцы», - так говорят о любви народа к этому напитку. Он настолько популярен, что в пересчете на душу населения спрос на него в Ирландии сейчас превосходит соседние страны. Введенный в обиход старым британским правящим классом более ста лет назад, он со временем распространился среди остального населения.\n\nТрадиционно британцы получали листья из своих колоний на Индийском субконтиненте, а теперь Союз получает их от своих собственных индийских союзников. И хотя доступ к этому источнику для нас, похоже, стабилен, пока что осторожные перешептывания говорят о том, что было бы неразумно полагаться только на него, если в будущем торговля будет нарушена.\n\nПоэтому небольшая группа ирландских дипломатов провела последние несколько месяцев, путешествуя по миру, посещая плантации и договариваясь о сделках по импорту, и в конце концов решила, что если смешать немного индийского чая Ассам с более темным и крепким чаем, доступным в удерживаемой немцами Кении, то получится отличная крепкая заварка, подходящая для внутреннего рынка. Снизив зависимость страны от потенциально ненадежных исключительно индийских источников и разнообразив используемые купажи, мы получили и более вкусный чай, и более надежный доступ к импорту на ближайшие годы."
irelandflavour.388.a: "Молоко и без сахара, спасибо."
 
irelandflavour.389.t: "Грязная пыль"
irelandflavour.389.d: "От сельских районов западного побережья до улиц города Голуэй, «Cré na Cille», Маиртина у Кадхейна, что буквально означает "Земля церкви", берет штурмом гиберноязычный мир и даже привлекает внимание англоязычных читателей. Вышедшая в серии в газете "Рабочая республика" и написанная почти полностью как серия сплетен и горьких разговоров между мертвецами на кладбище в Коннемаре, книга была названа теми, кто способен понять её, шедевром комического жанра, а её всплеск популярности начал вдохновлять поток ирландскоязычной литературы.\n\nУроженец прибрежного района Гелтахт Коис-Фаррайге в графстве Голуэй, О Кадхейн был возмущен обнищанием своей общины, и его политика привела его к горячей вере в синдикализм и возрождение ирландского языка. Выступая за права ирландцев, говорящих на ирландском языке, вопреки халатности предыдущих правительств, он иногда сотрудничал с легионерским крылом "голубых" из-за их общего почитания родного языка Ирландии, но оставался убежденным социалистом. В рядах Ирландской гражданской армии он получил признание за свой талант вербовщика, членство в которой привело к тому, что его уволили с преподавательской работы. \n\nПосле Второй ирландской революции он стал пионером концепции, известной как «Athghabháil na hÉireann», или Завоевание Ирландии, которая рассматривает английский и растущий лингва-франка немецкий как инструменты капитализма и утверждает, что только через социализм язык ирландского народа будет спасен, а нация полностью деколонизирована. С помощью этой теории он стремится заручиться поддержкой ирландцев, говорящих на языке новой республики, в том числе бывших сторонников Аонтаса Наисюнта, которых, по его мнению, сбили с пути силы реакции, но их культурный национализм в основе своей имеет благие намерения и может быть использован в положительных целях, если они поймут ошибочность своего пути."
irelandflavour.389.a: "Sé dualgas lucht na Gaeilge a bheith ina sóisialaigh."
irelandflavour.389.a.tt: "§YДолг ирландцев - быть социалистами.§!"
 
irelandflavour.3810.t: "Оранжевый и зелёный"
irelandflavour.3810.d1: "К годовщине выхода на пенсию покойного историка и сенатора Элис Стопфорд-Грин была опубликована работа, в которой рассматривается область её интересов - ирландский национализм среди протестантов и англо-ирландцев. Учитывая её собственную биографию, эта тема не стала для нее неожиданностью.\n\nВ книге доказывается неопровержимость того, что с 1798 года англо-ирландцы сыграли решающую роль в развитии ирландского национализма и республиканизма. Англо-ирландцы и протестанты никогда не составляли более 15% населения, и хотя исторически они в подавляющем большинстве были лоялистами, те, кто встал на сторону националистов, оказали непропорционально большое влияние на национализм в целом.\n\nНачиная с основателей ирландского республиканизма Теобальда Вулфа Тоуна и лорда Эдварда Фицджеральда, в руководство движения входили протестанты, чему способствовали более высокий статус и образование, которые были доступны им на протяжении веков. Роберт Эммет возглавил восстание в 1803 году, а Чарльз Стюарт Парнелл был фактическим лидером национализма в 1880-х годах. За пределами политики великие литературные деятели Оскар Уайльд и У. Б. Йитс также известны своими националистическими идеалами. Вовлечение протестантов в национализм, утверждается в книге, стало ключевым фактором в отделении католической идентичности от ирландской в конце 1700-х годов, когда они были переплетены.\n\nКнига доходит до современной Ирландии, уделяя внимание окраинам политики, таким как социалистический академик Бенджамин Фаррингтон или сторонник интегрализма Эрнест Блайт, и комментируя, как британская революция могла повлиять на популярность различных политических групп среди этого населения. \n\nДля достаточно сухого академического текста реакция была довольно теплой, критики утверждали, что отношение государства к меньшинствам должно использоваться как показатель его зрелости. Хотя опыт англо-ирландцев не совсем такой, как у ольстерских шотландцев, правительство стремится донести до жителей севера идею экуменизма, даже если она не найдет отклика." # Dems
irelandflavour.3810.d2: "К годовщине выхода на пенсию покойного историка и сенатора Элис Стопфорд-Грин была опубликована работа, в которой рассматривается область её интересов - ирландский национализм среди протестантов и англо-ирландцев. Учитывая её собственную биографию, эта тема не стала для нее неожиданностью.\n\nВ книге доказывается неопровержимость того, что с 1798 года англо-ирландцы сыграли решающую роль в развитии ирландского национализма и республиканизма. Англо-ирландцы и протестанты никогда не составляли более 15% населения, и хотя исторически они в подавляющем большинстве были лоялистами, те, кто встал на сторону националистов, оказали непропорционально большое влияние на национализм в целом.\n\nНачиная с основателей ирландского республиканизма Теобальда Вулфа Тоуна и лорда Эдварда Фицджеральда, в руководство движения входили протестанты, чему способствовали более высокий статус и образование, которые были доступны им на протяжении веков. Роберт Эммет возглавил восстание в 1803 году, а Чарльз Стюарт Парнелл был фактическим лидером национализма в 1880-х годах. За пределами политики великие литературные деятели Оскар Уайльд и У. Б. Йитс также известны своими националистическими идеалами. Вовлечение протестантов в национализм, утверждается в книге, стало ключевым фактором в отделении католической идентичности от ирландской в конце 1700-х годов, когда они были переплетены. \n\nКнига доходит до современной Ирландии, фокусируясь на периферии политики, такой как социалистический академик Бенджамин Фаррингтон или сторонник интегрализма Эрнест Блайт, и комментируя, как Британская революция могла повлиять на популярность различных политических групп среди этого населения.\n\nЭта публикация привлекла мало внимания со стороны официальных государственных источников, которые были уверены, что не предадут её огласке. По их мнению, многие из исторических протестантских националистов действовали так только в своих собственных интересах, надеясь получить власть в неизбежной свободной Ирландии. Важность католической веры не преуменьшалась, и если протестант, подобно Маркевичу или Кейсменту, желал перейти в вероисповедание большинства нации, это можно было только поощрять." # PatAuts
irelandflavour.3810.d3: "К годовщине выхода на пенсию покойного историка и сенатора Элис Стопфорд-Грин была опубликована работа, в которой рассматривается область её интересов - ирландский национализм среди протестантов и англо-ирландцев. Учитывая её собственную биографию, эта тема не стала для нее неожиданностью.\n\nВ книге доказывается неопровержимость того, что с 1798 года англо-ирландцы сыграли решающую роль в развитии ирландского национализма и республиканизма. Англо-ирландцы и протестанты никогда не составляли более 15% населения, и хотя исторически они в подавляющем большинстве были лоялистами, те, кто встал на сторону националистов, оказали непропорционально большое влияние на национализм в целом.\n\nНачиная с основателей ирландского республиканизма Теобальда Вулфа Тоуна и лорда Эдварда Фицджеральда, в руководство движения входили протестанты, чему способствовали более высокий статус и образование, которые были доступны им на протяжении веков. Роберт Эммет возглавил восстание в 1803 году, а Чарльз Стюарт Парнелл был фактическим лидером национализма в 1880-х годах. За пределами политики великие литературные деятели Оскар Уайльд и У. Б. Йитс также известны своими националистическими идеалами. Вовлечение протестантов в национализм, утверждается в книге, стало ключевым фактором в отделении католической идентичности от ирландской в конце 1700-х годов, когда они были переплетены.\n\nКнига доходит до современной Ирландии, фокусируясь на периферии политики, такой как социалистический академик Бенджамин Фаррингтон или сторонник интегрализма Эрнест Блайт, и комментируя, как британская революция могла повлиять на популярность различных политических групп среди этого населения. \n\nПользуясь возможностью продвинуть свою повестку дня, правительство приветствовало публикацию, подчеркивая работу таких лидеров, как Томас Дэвис, протестант 1800-х годов, который выступал за независимость и использование ирландского языка в качестве единственного языка, противопоставляя его англоязычному лизоблюду Дэниелу О'Коннелу, который был доволен отказом от языка своих предков, преклонением перед католической церковью и сохранением Ирландии под английской короной. Ибо Ирландия должна быть не просто свободной, но и гэльской; не просто гэльской, но и свободной." # NatPops
irelandflavour.3810.d4: "К годовщине выхода на пенсию покойного историка и сенатора Элис Стопфорд-Грин была опубликована работа, в которой рассматривается область её интересов - ирландский национализм среди протестантов и англо-ирландцев. Учитывая её собственную биографию, эта тема не стала для нее неожиданностью.\n\nВ книге доказывается неопровержимость того, что с 1798 года англо-ирландцы сыграли решающую роль в развитии ирландского национализма и республиканизма. Англо-ирландцы и протестанты никогда не составляли более 15% населения, и хотя исторически они в подавляющем большинстве были лоялистами, те, кто встал на сторону националистов, оказали непропорционально большое влияние на национализм в целом.\n\nНачиная с основателей ирландского республиканизма Теобальда Вулфа Тоуна и лорда Эдварда Фицджеральда, в руководство движения входили протестанты, чему способствовали более высокий статус и образование, которые были доступны им на протяжении веков. Роберт Эммет возглавил восстание в 1803 году, а Чарльз Стюарт Парнелл был фактическим лидером национализма в 1880-х годах. За пределами политики великие литературные деятели Оскар Уайльд и У. Б. Йитс также известны своими националистическими идеалами. Вовлечение протестантов в национализм, утверждается в книге, стало ключевым фактором в отделении католической идентичности от ирландской в конце 1700-х годов, когда они были переплетены.\n\nКнига доходит до современной Ирландии, фокусируясь на периферии политики, такой как социалистический академик Бенджамин Фаррингтон или сторонник интегрализма Эрнест Блайт, и комментируя, как британская революция могла повлиять на популярность различных политических групп среди этого населения. \n\nSaor Éire осудили публикацию как попытку использовать религию для разжигания раскола среди ирландцев и выразили недовольство тем, что в книге основное внимание уделяется выходцам из аристократической среды, а не простому народу. Ирландская рабочая лига считает, что из этого текста можно извлечь много уроков, касающихся общей ирландской идентичности, а также общих идеалов, которых придерживаются христиане всех конфессий. Лейбористы ставят под сомнение акцент на национализме и самобытности и считают, что в книге упущена большая работа, проделанная англо-ирландцами в области социальных реформ на благо Ирландии.\n\nТакие дискуссии и комментарии разрешены новым правительством в попытке нормализовать своё всё ещё неустойчивое правление, но предстоит ещё много работы, чтобы заставить народ забыть, что политический дискурс или нормальность уже никогда не будут прежними." # Synday
irelandflavour.3810.a: "«Либерте, эгалите, фратерните» и всё такое..." # dem general take
irelandflavour.3810.b: "Даже если предки не считали себя ирландцами, потомки могут." # dem more pro-loyalist take
irelandflavour.3810.c: "Полезные идиоты, не более того." # PatAut
irelandflavour.3810.e: "Именно от гэлов произошла гэльская Ирландия." # NatPop
irelandflavour.3810.f: "Иногда необходим взгляд со стороны." # NatPop

irelandflavour.3811.t: "Oíche Shamhna"
irelandflavour.3811.d: "Самайн. Ночь в году, когда границы между мирами мертвых и живых становятся наиболее слабыми. Души умерших и Aos Sí, или феи, возвращаются в наш мир, чтобы быть принятыми и умиротворенными. Зажигают свечи, жгут костры, читают молитвы и проводят множество первобытных ритуалов.\n\nПоследняя ночь октября уже много лет известна в английском языке как Hallowe'en, но именно в Ирландии зародились многие из этих традиций. Ночь перед началом зимы, как первое ноября по ирландскому календарю, была концом сезона сбора урожая и началом сгущения дней. Официально День всех святых отмечается 1 ноября и признан католической церковью как Святой день, когда все католики должны посещать мессу, а День всех душ - на следующий день. Но это лишь использование церковью более древних, заумных и местных дохристианских верований населения.\n\nУжасные лица вырезаются на репе, внутри устанавливаются и зажигаются свечи, чтобы придать им потустороннюю ауру. Люди бродят по деревне между отдаленными усадьбами, одетые в костюмы тех самых существ, которые, как считается, должны присутствовать в эту ночь, ожидая, что их задобрят едой и питьем в обмен на песню или стих. Поминают умерших и произносят тосты в их честь.\n\nПодобные обычаи существуют и в других странах, но в особенности гэльские традиции укоренились в Соединённых Штатах после массового исхода, произошедшего за последнее столетие. Там они приобрели многие свои формы, которые сами попали в Ирландию через вернувшихся иммигрантов.\n\nВ этом году празднования приняли ещё более мрачный оборот, поскольку напряженность в мире растёт, а Соединенные Штаты, новый дом многих ирландцев и страна возможностей, пылают. Вместе с вернувшимися эмигрантами и новыми беженцами в Ирландию вернулись некоторые новые традиции, но война не будет приветствоваться."
irelandflavour.3811.a: "У нас и так достаточно мертвых, спасибо."

irelandflavour.3812.t: "Звезда становится красной"
irelandflavour.3812.d1: "Театр в Ирландии долгое время служил гордостью нации, а в последние годы - формой бегства от проблемной ситуации в мире. К сожалению, политическое насилие также является важной частью истории страны, и вчера вечером в театре Abbey эти два мира столкнулись после того, как начались беспорядки на дебюте новой откровенно политической пьесы, известной как «Звезда становится красной»\n\nДраматург, стоящий за постановкой, Шон О'Кейси, всегда открыто заявлял о своих социалистических убеждениях, и эта недавняя пьеса не стала исключением. Одна из предыдущих пьес О'Кейси "Плуг и звезды" часто интерпретировалась как критика чрезмерной оценки ирландского национализма в ущерб рабочему классу, что привело к призывам подвергнуть её цензуре, а в конечном итоге на спектакле вспыхнули беспорядки из-за оскорбления ирландской идентичности. Аналогичным образом, «Звезда становится красной» была истолкована некоторыми как нападение на основы ирландской идентичности, католическую церковь и современную ирландскую политику. Главный герой пьесы, Красный Джим», явно вдохновленный лидером ирландских социалистов Джимом Ларкиным, ведет свой профсоюз к окончательному захвату страны, сражаясь с поддерживаемыми католической церковью «Шафрановыми рубашками», которые интерпретируются как параллель с «Голубыми рубашками» О'Даффи.\n\nХотя полиция всё ещё составляет полную картину событий прошлой ночи, похоже, что несколько членов "синерубашечников" присутствовали на мероприятии, в результате чего возникла драка, быстро переросшая в беспорядки. Как и в случае с последней пьесой О'Кейси, вызвавшей беспорядки такого уровня, звучат призывы запретить её постановку, чтобы сохранить мир, причем те, кто поддерживает О'Даффи, заходят так далеко, что призывают арестовать О'Кейси за создание «кощунственного произведения синдикалистской пропаганды»\n\nХотя причин для такой эскалации нет, запрет спектакля может защитить нас от дальнейших инцидентов и распространения синдикалистских взглядов. Однако такая степень правительственной цензуры может быть воспринята общественностью как шаг к дальнейшему авторитаризму, и, возможно, имеет смысл подойти к этой ситуации более осторожно, официально осудив пьесу лишь несколькими министрами."
irelandflavour.3812.d2: "С тех пор как на трупе старого порядка в Британии осела пыль, Ирландии приходится иметь дело с выскочками-синдикалистами - драматургами и поэтами из-за моря, выпускающими пропаганду в надежде, что однажды она приведет к социалистической революции и у нас. Легко игнорировать все эти пьесы, написанные британскими авторами, но нельзя сказать то же самое о предательстве пьесы, созданной одним из наших авторов.\n\nСеан О'Кейси, известный ирландский драматург, всегда открыто заявлявший о своих социалистических убеждениях, недавно представил свою новую пьесу «Звезда становится красной» в театре Apollo в Лондоне, после того как её справедливо не дали поставить в театре Abbey в Дублине. Центральный конфликт пьесы разворачивается вокруг главного героя «Красного Джима», который является образцом лидера ирландских социалистов Джима Ларкина, ведущего свой профсоюз к захвату власти в своей стране, сражаясь с поддерживаемыми католической церковью «Шафрановыми рубашками» - явной параллелью с «голубыми». Пьеса заканчивается обращением к «храбрым рабочим» Ирландии, которые, по их словам, «скоро освободятся от реакционного гнета»\n\nНесмотря на то, что пьеса была показана только в Лондоне, новости об этом вопиющем нападении предателя-синдикалиста быстро достигли офиса разъяренного [IRE_loc_leader_surname] в Лейнстер-Хаусе. Вскоре после этого было опубликовано официальное заявление, в котором пьеса О'Кейси осуждалась как «непристойный и богохульный кусок синдикалистской пропаганды», сам человек был назван предателем, а все его работы были запрещены для повторного исполнения в Ирландии. Несмотря на то, что до сих пор неясно, поддерживало ли британское правительство О'Кейси, против него все равно был выдан ордер на арест за сговор с британским государством с целью свержения органов ирландского правительства, что фактически привело к его высылке из страны. Учитывая, что [IRE_loc_leader_surname] продолжает гневаться по поводу этого инцидента, О'Кейси следует считать, что ему повезло, что он отделался столь «лёгким испугом»"
irelandflavour.3812.d3: "Театр в Ирландии давно служит гордостью нации, особенно в последние годы, как форма эскапизма от проблемной ситуации в мире. Даже правительству время от времени требуется отдых от всего этого, особенно в связи с его постоянной трудной задачей по изменению политического ландшафта страны. Недавний дебют новой захватывающей пьесы под названием «Звезда становится красной» стал идеальным поводом для такого отдыха: многие видные члены нового правительства посетили спектакль в театре «Abbey».\n\nДраматург Шон О'Кейси всегда открыто заявлял о своих социалистических убеждениях, и недавняя революция в Ирландии явно послужила вдохновением для его последней работы, многие заметили очевидные параллели между её сюжетом и событиями последних месяцев. Центральный конфликт пьесы разворачивается вокруг всеобщей забастовки, организованной главным героем пьесы "Красным Джимом", который ведет свой профсоюз к окончательному захвату своей страны, сражаясь с поддерживаемыми католической церковью «Шафрановыми рубашками», которые интерпретируются как параллель с «Голубыми рубашками» О'Даффи. Пьеса завершается посвящением храбрым рабочим, участвовавшим во Второй ирландской революции, и многие оценивают постановку как яркий пример синдикалистского перформанса.\n\nСреди тех, кто высоко оценил содержание новой пьесы, был некто Джим Ларкин, которого О'Кейси знает уже несколько десятилетий и с гордостью называет своим другом. После спектакля он выразил своё восхищение новой пьесой другим членам правительства, особенно похвалил игру исполнителя главной роли, который, по его словам, «действительно изобразил социалистический дух Ирландии». После столь высокой оценки и положительных отзывов остаётся только надеяться, что это только начало новой захватывающей эры ирландского театра."
irelandflavour.3812.a: "Долой такие вещи!"
irelandflavour.3812.b: "Мы должны быть осторожны..."
irelandflavour.3812.c: "Быть сосланным в Лондон кажется судьбой хуже смерти..."
irelandflavour.3812.e: "Знаешь, этот «Красный Джим» кажется мне ужасно знакомым..."

irelandflavour.392.t: "Amhrán na bhFiann"
irelandflavour.392.d: "Прошло более пятнадцати лет с тех пор, как Amhrán na bhFiann, или «Солдатская песня», была официально принята в качестве национального гимна. Песня со словами, написанными Пидаром Кирни, и музыкой, написанной им и Патриком Хини, впервые появилась в 1910 году, а широко распространенный сейчас текст на ирландском языке был опубликован Лиамом О Ринном в 1923 году. Она следует давней традиции эмоциональных патриотических песен, рассказывающих о давней Ирландии, которая теперь вновь призывает защищаться от своих врагов и угнетателей. Однако ещё большую значимость композиции придала её популярность среди ирландских добровольцев в преддверии 1916 года, а также в тюремном лагере Фронгоч, где многие из них были интернированы после этого, до такой степени, что она стала неофициально известна как «гимн Шинн Фейн».»\n\nТо, что начиналось как веселая маршевая песня, превратилось в волнующий национальный гимн. Этому в немалой степени способствовала переработка песни для полного состава оркестра, а также для маршевого оркестра и хора, что преображает песню и придает ей соответствующую серьезность в зависимости от случая.\n\nОднако, как и в случае с другими вещами в относительно недавно обретшей независимость стране, такой как Ирландия, есть вопросы, которые нависают над ней. Как музыкальное произведение, глубоко и безоговорочно ассоциирующееся с националистической традицией, некоторые сомневаются в его способности служить оливковой ветвью для тех, кто изначально был или остаётся лоялистом. Другие считают, что официальный статус перевода на ирландский язык, несмотря на то, что песня изначально была написана на английском, отталкивает плохо говорящих на этом языке, или что мелодия подходящая, но текст неубедителен. Другие согласны со всеми чувствами песни, но считают, что есть более старые, потенциально более законные гимны, которые можно найти во множестве произведений, составляющих ирландскую музыкальную традицию.\n\nОчевидным ответом было бы оставить её без изменений, но окончательное решение остаётся за правительством."
irelandflavour.392.a: "Она хороша в том виде, в котором есть."
irelandflavour.392.b: "Если переписать текст, то он станет более актуальным."
irelandflavour.392.c: ""Бог хранит Ирландию» всегда был лучшим выбором."
irelandflavour.392.e: "В качестве замены взять «Интернационал», разумеется, на ирландском языке."
irelandflavour.392.f: ""О'Доннелл Абу» больше говорит о нашем народе\nи истории."
 
irelandflavour.393.t: "Футбол в Ирландии"
irelandflavour.393.d1: "На фоне всех политических новостей в этой стране можно подумать, что сектантство распространено как никогда. Однако есть одна область, где сектантство, кажется, уходит на второй план, - это спорт, в частности футбол.\n\nВ начале века футбол значительно отставал по популярности от гэльского футбола, так как Гэльская атлетическая ассоциация привела этот вид спорта к стремительному взлету, по крайней мере, среди католического населения Ирландии. Поскольку гэльский футбол был связан с ирландским национализмом, многие протестанты из Ольстера предпочли играть в футбол, и действительно, когда была основана Лига Ирландии, все команды были из Ольстера, и только одна команда, "Белфаст Селтик", ассоциировалась с католиками. Однако с течением десятилетий это разделение стало стираться, а гламур и престиж Чемпионата мира по футболу помогли привлечь в игру более разнообразные слои населения. Новые команды появились не только в Дублине и Корке, но и в небольших ирландских городах, таких как Дандолк, Лимерик, Уотерфорд и Слайго, причем "Слайго Роверс" стали первой командой за пределами Лейнстера или Ольстера, выигравшей лигу в этом году. \n\nПопулярности лиги также способствовал небольшой приток игроков из Британии, особенно из Шотландии и Ливерпуля, поскольку профессиональные команды в Союзе были ликвидированы и реорганизованы, чтобы отразить номинально более эгалитарный состав с ростом "рабочих команд" и других любительских клубов. Теперь в Лиге Ирландии играют игроки со всех островов и команды со всей Ирландии, и она стала местом общения футбольных болельщиков из разных частей страны. Так, некоторые болельщики из Дублина теперь ездят в Белфаст на некоторые игры, и наоборот." # Dems
irelandflavour.393.d2: "После обретения независимости одной из самых трудных задач для страны стало преодоление привычки, укоренившейся в народе во времена британского правления. В то время как широкие массы могут понять необходимость политического и экономического отделения от англосферы, даже те, кто симпатизирует гэльскому языку, не хотят полностью осознать необходимость утверждения себя в культурном плане. Одним из примеров затянувшегося британского культурного влияния является футбол, или "соккер"\n\nКогда была основана футбольная ассоциация "Лига Ирландии", все команды были из Ольстера, и только одна команда, "Белфаст Селтик", ассоциировалась с католиками. Хотя позже в лигу вошли команды из Дублина и Корка, сторонники "синерубашечников" заявили, что никто не может сказать, что участники футбола не являются англофилами - ведь как ещё можно объяснить их выбор в пользу этого вида спорта, а не нашего родного?\n\nТеперь, когда у нас есть руководство, выступающее за жизнеспособность гэльской культуры, всякая поддержка и финансирование футбола должны быть прекращены. Если энтузиасты настаивают на участии в иностранном виде спорта, это их личная прерогатива, но государство не обязано им помогать." # PatAut
irelandflavour.393.d3: "$irelandflavour.393.d.23$ также отделяют себя в культурном плане. Одним из примеров сопротивления саксонской культуры является футбол, или "соккер"\n\nКогда была создана футбольная ассоциация "Лига Ирландии", все команды были из Ольстера, и только одна команда, "Белфаст Селтик", ассоциировалась с католиками. Хотя позже в лигу вошли команды из Дублина и Корка, её основу составляли и всегда будут составлять те, кто считает себя выше гэльской культуры и отказывается интегрироваться в ирландское общество.\n\nТеперь, когда у руководства есть возможность правильно определить этого культурного паразита, запрет на футбол был неизбежен. Молодые люди должны либо заниматься местными видами спорта, такими как футбол или херлинг, либо, что ещё лучше, добровольно идти на военную службу." # NatPop
irelandflavour.393.d4: "Одно из важнейших учений Маркса заключается в том, что класс важнее культуры или религии - например, у протестантских и католических рабочих гораздо больше общего, чем у бедного католика и богатого католика. Этот феномен проявляется в спорте.\n\nНесмотря на то, что наш остров веками страдал от сектантства, в последние десятилетия и протестанты, и католики из рабочего класса нашли общий язык, играя и смотря футбол Ассоциации, или "соккер", вместе. Несмотря на очевидную пользу, которую несут в себе атлетизм и сплочение общества, капиталисты стремились превратить их в товар. Вместо того чтобы придерживаться здорового любительского подхода, как в гэльских играх, буржуины, поддерживающие Великобританию, поощряли "профессионализм" в ирландском футболе. Хотя игрокам платили зарплату (что было вполне приемлемо), к ним относились как к товару, который можно было покупать и продавать между командами, как скот на ярмарках. Вместо команд местных жителей, за которых с гордостью могли болеть друзья и соседи, в футбольных командах появились чужаки и наёмники.\n\nСейчас, когда у нас в стране есть социалистическое руководство, пришло время последовать примеру Великобритании и Франции и заново организовать футбол. Команды будут основываться на рабочих местах или профессиях, а не на владельцах. При такой организации футбол не только станет инструментом для развития физической культуры, но и поможет уничтожить сектантство." # Socialists
irelandflavour.393.a: "Может быть, однажды мы выйдем в финал Кубка мира..."  # Dems
irelandflavour.393.b: "Наша культура не ущербна, как и наш спорт."  # PatAuts
irelandflavour.393.c: "Только после удаления сорняков сад может расцвести."  # NatPops
irelandflavour.393.e: "Команды должны принадлежать своим сообществам, не капиталистам."  # Socialists
 
irelandflavour.395.t: "Поминки по Финнегану"
irelandflavour.395.d1: "Со звуком «Бабабадалгарагтакамминарроннконнброннтоннер роннтуоннтуоннтуонннтроваррхунавнскавнтуохохохоорденентурнук!» ирландский ходовик «Финнеган» пал ранней смертью. Тот же звук можно услышать в домах по всему англоязычному миру, когда экземпляры «Поминок по Финнегану» падают из сонных рук.\n\nПосле десяти лет, проведенных в изгнании во Франции, ирландский писатель Джеймс Джойс опубликовал свой последний роман, «Поминки по Финнегану», через небольшое парижское предприятие. Разумеется, он был напечатан на английском языке, поскольку роман не поддается переводу. Несмотря на то что "Поминки по Финнегану" ещё не поступили в широкую продажу, их копии попали на книжные полки во всем англоязычном мире. На сегодняшний день отзывы о романе неоднозначны и оживленны. Критики осуждают отсутствие в романе всеобъемлющего сюжета и кажущуюся случайность. Многие обычные читатели считают роман неприступным по своей плотности.\n\nСо своей стороны, ирландское правительство, как ни удивительно, хранит молчание по поводу выхода книги в свете продолжающейся немилости к её автору, и хотя ирландцы обычно проявляют некоторую гордость за бессовестно ирландского Джойса, народный прием книги был неожиданно приглушенным. Тем не менее, громкий релиз вызвал определенную волну народных чувств."
irelandflavour.395.d2: "Со звуком «Бабабадалгарагтакамминарроннконнброннтоннер роннтуоннтуоннтуонннтроваррхунавнскавнтуохохохоорденентурнук!» ирландский ходовик «Финнеган» пал ранней смертью. Тот же звук можно услышать в домах по всему англоязычному миру, когда экземпляры «Поминок по Финнегану» падают из сонных рук.\n\nПосле более чем десяти лет, проведенных в изгнании во Франции, ирландский писатель Джеймс Джойс опубликовал свой последний роман «Поминки по Финнегану», принятый до сих пор неоднозначно и оживленно. Критики, особенно политически реакционные, осуждают отсутствие в романе всеобъемлющего сюжета и кажущуюся случайность. Для многих читателей-непрофессионалов роман кажется неприступным в своей плотности.\n\nСо своей стороны, ирландское правительство поддержало произведение. Отход Джойса от условностей описывается как олицетворение его гениальности. Один из министров правительства даже зашел так далеко, что назвал предполагаемую сложность книги своего рода «фильтром»\n\nПо сути, громкий релиз вызвал определенную волну национальных чувств, но ничего такого, что могло бы вызвать серьезное беспокойство."
irelandflavour.395.d3: "Со звуком «Бабабадалгарагтакамминарроннконнброннтоннер роннтуоннтуоннтуонннтроваррхунавнскавнтуохохохоорденентурнук!» ирландский ходовик «Финнеган» пал ранней смертью. Тот же звук можно услышать в домах по всему англоязычному миру, когда экземпляры «Поминок по Финнегану» падают из сонных рук.\n\nПосле десяти лет, проведенных в изгнании во Франции, ирландский писатель Джеймс Джойс опубликовал свой последний роман, «Поминки по Финнегану», через небольшое парижское предприятие. Разумеется, он был напечатан на английском языке, поскольку роман не поддается переводу. Несмотря на то что «Поминки по Финнегану» ещё не поступили в широкую продажу, их копии попали на книжные полки во всем англоязычном мире. На сегодняшний день отзывы о романе неоднозначны и оживленны. Критики осуждают отсутствие в романе всеобъемлющего сюжета и кажущуюся случайность. Для многих читателей-непрофессионалов роман неприемлем по своей плотности.\n\nВ Ирландии реакция реакционного правительства, получившего соответствующее название, не вызывает никаких сюрпризов. О Куиннеагайн осудил популярность книги, отметив значительный вклад её авторов в развитие английского языка и «культурную развращенность» авторов, которые не написали такое произведение на «родном языке своей страны». Несмотря на эзотерическое содержание книги, несмотря на неизменно ирландский характер автора Джойса, это, увы, был не «правильный» ирландец, и его произведение было предварительно запрещено до выхода."
irelandflavour.395.a: "Путь, одинокий, последний, любимый, долгий"
irelandflavour.395.b: "Uafásach ar fad!"
 
irelandflavour.396.t: "Профессор в Австрии"
irelandflavour.396.d1: "За морем, в Центральной Европе, где, как считается, кельтская раса берет своё начало, известный австрийский лингвист, кельтолог и гибернофил Юлиус Покорны недавно опубликовал свою последнюю книгу, посвященную предыстории кельтов и иллирийцев. В то время как ирландцы вновь обрели гордость за свой долгое время подавляемый язык и культуру во время гэльского возрождения, усилия кельтологов, в основном немецких, таких как Покорный и покойный Куно Мейер, по открытию старой ирландской литературы и пропаганде её значения для европейской цивилизации, были неоценимы в этом процессе, став ещё одним эпизодом в теплых тевто-ирландских отношениях. \n\nИрландские контакты с тевтонским миром восходят к той эпохе, когда Ирландия славилась своими знаниями и христианской верой, а ирландские монахи основывали монастыри на территории современных Германии и Австрии. В последующие века, когда британцы ужесточили контроль над островом, многие ирландцы предпочли изгнание, и хотя ирландцы сыграли свою роль в индустриализации Рура, ни одна немецкая земля не приняла больше эмигрантов, чем Австрия, где ирландцы заняли важное место в военной и политической жизни страны: более ста австрийских генералов, фельдмаршалов или адмиралов в какой-то момент были ирландцами. Наиболее известен случай, когда Максимилиан О'Доннел спас жизнь Кайзера Франца-Иосифа от венгерского убийцы в 1853 году.\n\nХотя расстояние и упадок Вены как державы сделали неизбежным то, что в сознании простых гэлов их затмит Берлин, более близкий и способный защитить от британцев, а теперь и основной пункт назначения ирландских эмигрантов на континент, многие по-прежнему дорожат Королевством Габсбургов, чья двойная монархия когда-то послужила образцом для Шинн Фейн. В то время как критики сравнивают Австрийскую империю с британской, другие противопоставляют благосклонность Габсбургов к своим меньшинствам жестокости и репрессиям англичан по отношению к ирландскому народу и желают им удачи в эти напряженные времена."   # SQ Austria
irelandflavour.396.d2: "За морем, в Центральной Европе, где, как считается, кельтская раса берет своё начало, известный австрийский лингвист, кельтолог и гибернофил Юлиус Покорны недавно опубликовал свою последнюю книгу, посвященную предыстории кельтов и иллирийцев. В то время как ирландцы вновь обрели гордость за свой долгое время подавляемый язык и культуру во время гэльского возрождения, усилия кельтологов, в основном немецких, таких как Покорный и покойный Куно Мейер, по открытию старой ирландской литературы и пропаганде её значения для европейской цивилизации, были неоценимы в этом процессе, став ещё одним эпизодом в теплых тевто-ирландских отношениях. \n\nИрландские контакты с тевтонским миром восходят к той эпохе, когда Ирландия славилась своими знаниями и христианской верой, а ирландские монахи основывали монастыри на территории современных Германии и Австрии. В последующие века, когда британцы ужесточили контроль над островом, многие ирландцы предпочли изгнание, и хотя ирландцы сыграли свою роль в индустриализации Рура, ни одна немецкая земля не приняла больше эмигрантов, чем Австрия, где ирландцы заняли важное место в военной и политической жизни страны: более ста австрийских генералов, фельдмаршалов или адмиралов в какой-то момент были ирландцами. Наиболее известен случай, когда Максимилиан О'Доннел спас жизнь Кайзера Франца-Иосифа от венгерского убийцы в 1853 году.\n\nХотя расстояние и упадок Вены как державы сделали неизбежным то, что в сознании простых гэлов их затмит Берлин, более близкий и способный защитить от британцев, а теперь и основной пункт назначения ирландских эмигрантов на континент, многие по-прежнему дорожат Королевством Габсбургов, чья двойная монархия когда-то послужила образцом для Шинн Фейн. В то время как критики сравнивают Австрийскую империю с британской и подбадривают восставших против них националистов, другие противопоставляют благосклонность Габсбургов к своим меньшинствам жестокости и репрессиям англичан против ирландского народа и молятся за их победу над своими врагами."   # Austria fighting constituents
irelandflavour.396.d3: "За морем, в Центральной Европе, где, как считается, кельтская раса берет своё начало, известный австрийский лингвист, кельтолог и гибернофил Юлиус Покорны недавно опубликовал свою последнюю книгу, посвященную предыстории кельтов и иллирийцев. В то время как ирландцы вновь обрели гордость за свой долгое время подавляемый язык и культуру во время гэльского возрождения, усилия кельтологов, в основном немецких, таких как Покорный и покойный Куно Мейер, по открытию старой ирландской литературы и пропаганде её значения для европейской цивилизации, были неоценимы в этом процессе, став ещё одним эпизодом в теплых тевто-ирландских отношениях. \n\nИрландские контакты с тевтонским миром восходят к той эпохе, когда Ирландия славилась своими знаниями и христианской верой, а ирландские монахи основывали монастыри на территории современных Германии и Австрии. В последующие века, когда британцы ужесточили контроль над островом, многие ирландцы предпочли изгнание, и хотя ирландцы сыграли свою роль в индустриализации Рура, ни одна немецкая земля не приняла больше эмигрантов, чем Австрия, где ирландцы заняли важное место в военной и политической жизни страны: более ста австрийских генералов, фельдмаршалов или адмиралов в какой-то момент были ирландцами. Наиболее известен случай, когда Максимилиан О'Доннел спас жизнь Кайзера Франца-Иосифа от венгерского убийцы в 1853 году.\n\nХотя расстояние и упадок Вены как державы сделали неизбежным то, что в сознании простых гэлов их затмит Берлин, более близкий и способный защитить от британцев, а теперь и основной пункт назначения ирландских эмигрантов на континент, многие по-прежнему дорожат Королевством Габсбургов, чья двойная монархия когда-то послужила образцом для Шинн Фейн. В то время как критики сравнивают Австрийскую империю с британской, другие противопоставляют доброжелательность Габсбургов по отношению к своим меньшинствам жестокости и репрессиям англичан по отношению к ирландскому народу и поздравляют их с недавним изменением конституции как с радостной новостью, которая будет способствовать стабильности в Европе."   # Austria unified
irelandflavour.396.d4: "За морем, в Центральной Европе, где, как считается, кельтская раса берет своё начало, известный австрийский лингвист, кельтолог и гибернофил Юлиус Покорны недавно опубликовал свою последнюю книгу, посвященную предыстории кельтов и иллирийцев. В то время как ирландцы вновь обрели гордость за свой долгое время подавляемый язык и культуру во время гэльского возрождения, усилия кельтологов, в основном немецких, таких как Покорный и покойный Куно Мейер, по открытию старой ирландской литературы и пропаганде её значения для европейской цивилизации, были неоценимы в этом процессе, став ещё одним эпизодом в теплых тевто-ирландских отношениях. \n\nИрландские контакты с тевтонским миром восходят к той эпохе, когда Ирландия славилась своими знаниями и христианской верой, а ирландские монахи основывали монастыри на территории современных Германии и Австрии. В последующие века, когда британцы ужесточили контроль над островом, многие ирландцы предпочли изгнание, и хотя ирландцы сыграли свою роль в индустриализации Рура, ни одна немецкая земля не приняла больше эмигрантов, чем Австрия, где ирландцы заняли важное место в военной и политической жизни страны: более ста австрийских генералов, фельдмаршалов или адмиралов в какой-то момент были ирландцами. Наиболее известен случай, когда Максимилиан О'Доннел спас жизнь Кайзера Франца-Иосифа от венгерского убийцы в 1853 году.\n\nНесмотря на то, что упадок Вены как державы и её развал привели к присоединению к Берлину, который затмил Австрию в сознании простых гэлов как более близкого и способного защитника от британцев и главного места назначения ирландских эмигрантов на континенте, многие по-прежнему дорожат Королевством Габсбургов, чья двойная монархия когда-то послужила образцом для Шинна Фейна. Покорный, будучи немецким националистом, приветствовал объединение, и по мере того как австрийские дворяне ирландского происхождения включаются в состав аристократии Кайзеррайха, а ирландские эмигранты в Германии переселяются в регион, где когда-то искали убежища многочисленные ирландцы, прошлое и настоящее друзей ирландского народа в некотором роде примиряются."    # Anschluss
irelandflavour.396.a: "Мы приветствуем землю, откуда родом наши кельтские предки."
 
irelandflavour.397.t: "Гэльские игры в Великобритании"
irelandflavour.397.d: "Уже много лет Центральный совет Ассоциации гэльской атлетики планирует создать в Британии Провинциальный совет для управления играми ирландской диаспоры, проживающей в Британии, однако бурные отношения между двумя нашими странами не давали такой возможности. \n\nС момента вступления Ирландии в Интернационал прошло уже более года, отношения между Британией и Ирландией значительно улучшились, и за последние несколько месяцев эти планы наконец-то воплотились в жизнь с созданием Британского Совета Гэльской атлетической ассоциации. О создании нового провинциального совета ранее сегодня объявил президент ГАА, дав понять, что планы ГАА по содействию возрождению ирландской культуры в Великобритании только начинаются. \n\nНесмотря на то, что в настоящее время в состав вновь созданной британской ГАА входят только графства Лондона и Ланкашира, уже обсуждается вопрос о том, как правильно включить в состав ГАА более мелкие графства Уорикшир, Йоркшир и Глостершир, а также установить правильные границы графств по всей Британии. В Ирландии уже предприняты шаги, способствующие развитию Игр в Британии: в этом году на ежегодном конгрессе было наконец отменено архаичное Правило 21, запрещавшее всем членам британских сил безопасности присоединяться к ГАА.\n\nХотя Ирландия почти наверняка останется домом и центром Игр, многие надеются, что через несколько десятилетий британская сцена полностью утвердится в качестве ключевой части ГАА, и тефамы из обеих стран будут соревноваться друг с другом."
irelandflavour.397.a: "Через десятилетие у нас будет херлинг на Олимпиаде!"
 
irelandflavour.399.t: "Мой прекрасный Фабиан"
irelandflavour.399.d: "За последние несколько десятилетий литературный мир претерпел множество изменений: романтизм затмил реализм, а затем модернизм. Этот художественный переворот сменил старое на новое, и темпы изменений, похоже, не прекращаются. Разные писатели по-разному вписывались в эту картину, но особый характер произведений Джорджа Бернарда Шоу привел к необходимости ввести одноименный неологизм "шавианский"\n\nРодился в 1856 году в семье англо-ирландских протестантов из Дублина, что обычно ассоциируется с привилегиями, но из-за пьянства отца его семья имела довольно скромный достаток. В 19 лет он переехал в Лондон вслед за матерью после развода родителей и начал жизнь заново. Там он начал писать романы, пьесы, музыкальную критику и газетные колонки, а также стал участником того, что впоследствии станет Фабианским обществом, выступая в качестве политического полемиста.\n\nКак его произведения, так и политические взгляды развивались и прогрессировали в течение последующих десятилетий, причем последние менялись от марксизма к фабианству и к его собственным идиосинкразическим социалистическим взглядам, которые были описаны как откровенные, так и самопротиворечивые. В разное время он порицал вакцинацию, организованную религию и антисемитизм, а также поддерживал вегетарианство, максималистов в Союзе Британии и, в частности, действия Майкла Коллинза.\n\nШоу продолжает активно писать и считается одним из главных проирландских голосов в интеллектуальной сфере Союза Британии, где он прожил почти всю свою профессиональную жизнь. Его более постепенные социалистические взгляды сошли на нет с приходом Британской революции, после того как его умеренные взгляды на Ирландию после Восстания 1916 года изменились. Несмотря на свои редкие визиты, он сохранил взаимное восхищение и тесные рабочие отношения с такими писателями, как У. Б. Йитс и Шон О'Кейси, тесно связанными с ирландским националистическим движением.\n\nВ предыдущие годы его нетрадиционные взгляды, не говоря уже о месте проживания, сделали его одним из самых печально известных эмигрантов в Ирландии для СМИ и политического истеблишмента. Но время и Нобелевская премия смягчили мнение о нем даже его политических противников. Он остаётся сыном Эйре, который остался верен своей стране, как он её видит, и чьи работы, которых с нетерпением ждут, не вызывают недостатка в обсуждениях и интригах."
irelandflavour.399.a: "Странный парень, но он может сплести хорошую пряжу."
irelandflavour.399.b: "Но он все равно западный британец самого худшего сорта..."
irelandflavour.399.c: "Гений и провидец!"

irelandflavour.3910.t1: "Зелёный, белый и оранжевый"
irelandflavour.3910.t2: "Звездный плуг"
irelandflavour.3910.d1: "Он известен как триколор, или «an trídhathach», и является национальным флагом Ирландии, или «bratach na hÉireann». Впервые флаг был поднят в 1848 году Томасом Фрэнсисом Мигером в городе Уотерфорд, ирландским республиканцем и впоследствии губернатором Монтаны. Он был сшит для него группой французских женщин, симпатизировавших делу ирландских националистов, во время революции в самой Франции. \n\nМигрская символика и её вдохновение французским триколором остались неизменными в интерпретации. Зелёный цвет символизирует гэльскую традицию и римских католиков, оранжевый - протестантских последователей Вильгельма Оранского, знаменитого победителя битвы при Бойне в 1690 году, которая привела к установлению протестантского господства. И белый цвет, символизирующий вечную надежду на мир и единство между обеими традициями. Трехцветный узор флага, конечно же, ассоциируется с идеалами республиканизма, свободы и революции.\n\nНесмотря на то, что флаг существует уже почти восемьдесят лет, в течение большей части своего существования он был знаком, но находился на заднем плане общественного сознания, быстро набирая силу только после того, как в 1916 году он был поднят над зданием Генерального штаба. С тех пор он стал олицетворять сначала ирландский республиканизм, а вскоре и саму Ирландию.\n\nИх критиков немного. Некоторые указывают на бесполезность изображения группы людей, то есть лоялистов-протестантов, на флаге республики, в которой они при нормальных обстоятельствах не хотели бы участвовать. Более жесткие националистические критики указывают на то, что лоялисты составляют треть флага, хотя их численность приближается к одной шестой части населения. Однако для подавляющего большинства людей, включая правительство, он является символом Ирландии, какой бы устремленной она ни была, и одним из немногих политических вопросов, по которому почти все могут прийти к согласию."
irelandflavour.3910.d2: "Как когда-то арфа была заменена триколором в качестве символа Ирландии, так и эта старая тряпка с её религиозным подтекстом была снесена в пользу той, которая действительно способна объединить ирландский народ, - звездного плуга. Разработанный Ирландской гражданской армией в месяцы после великого дублинского локаута, первоначальный вариант изображал золотой плуг с мечом в качестве сошника и семь серебряных звезд, образующих Большую Медведицу, также известную как Плуг, несколько ярких звезд созвездия Ursa Major, на зеленом фоне. \n\nВпервые флаг был поднят над отелем «Империал» в Дублине во время Пасхального восстания ИГА, и хотя считалось, что он сгорел вместе со зданием, над которым развевался, когда войска британской короны взяли город, на самом деле он был найден британским солдатом Т.А. Уильямсом, который хранил его как трофей, а после Второй ирландской революции найден и передан в знак возрожденной дружбы между двумя народами. В настоящее время он с гордостью выставлен в Национальном музее. \n\nПосле Британской революции ирландские синдикалисты, получившие удар в спину от буржуазных националистов, представлявших как про-, так и анти-договорное крыло Шинн Фейн, собрались вместе для реорганизации Ирландской Гражданской Армии, чтобы однажды свергнуть лже-наследников ирландского республиканизма и воплотить в жизнь истинные идеалы ирландской революции, был принят новый дизайн, основанный на воспоминаниях ветеранов ИГА, в синих тонах и более минималистичный. Теперь эта цель достигнута, и хотя знамя может отличаться от своего происхождения, вечный смысл, заложенный в него самим Джеймсом Коннолли, остался неизменным: свободная Ирландия будет управлять своей судьбой от плуга до звезд."
irelandflavour.3910.a: "И пусть он летит долго!"
irelandflavour.3910.b: "Сохранить его было мудрым решением."
irelandflavour.3910.c: "Мы позаботимся о том, чтобы «Звездный плуг» и дальше летал высоко среди звезд!"
 
irelandflavour.3911.t: "An Dea-Leabhar"
irelandflavour.3911.d: "В то время как наша страна неустанно трудится над восстановлением естественного языка гэлов, перевод Священного Писания представляет собой загадку для Comhairle Náisiúnta и христианской природы нашего государства, поскольку, несмотря на твердую христианскую веру ирландского народа, переводы библии на ирландский язык исторически были редкостью. На протяжении более века единственным существующим переводом была Библия Беделла-О'Доннела, выполненная протестантской церковью Ирландии, что привело к тому, что с кафедры её называли «An Bíobla Gallda», или иностранная Библия. Несмотря на это тревожное наследие, официальное признание этой Библии послужит жестом религиозного единства, хотя католическая церковь, без сомнения, не одобрит его.\n\nВ качестве альтернативы, чтобы не вызвать гнев церкви и преданных католиков, у нас есть возможность обнародовать неопубликованные рукописи Пеадара Уа Лаогайра, католического священника и ирландца, который в последние годы своей жизни стремился перевести Библию на мюнстерский ирландский. Или, выбрав третий путь, мы можем поручить Эарнану де Сюнте, руководителю Conradh na Gaelige и переводчику, перевести Библию на современный ирландский язык, надеясь, что, представив новый перевод де Сюнты как одобренную правительством Библию, предназначенную для всех христианских конфессий, мы сможем свести к минимуму риск разжигания межрелигиозной напряженности и отторжения тех слоев ирландского народа, которые в противном случае могли бы поддержать наше национальное возрождение."
irelandflavour.3911.a: "Независимо от веры, мы одобряем усилия Беделла и О'Доннела."
irelandflavour.3911.b: "Только католическая Библия подойдет, откопайте рукописи Уа Лаогайра."
irelandflavour.3911.c: "Нам нужен современный перевод, комиссия de Siúnta."
 
irelandflavour.3912.t: "Na Deartháireacha Ó Flaithearta"   ### By Blackleaf
irelandflavour.3912.d1: "Газета Ирландской рабочей лиги, хотя официально запрещена законодательством 20-х годов как радикальный, подстрекательский материал, имеет скромную подпольную аудиторию. На её страницах читатели открывают или заново открывают для себя произведения одних из самых известных ирландских авторов-социалистов, братьев О'Флаэрти, Тома и Лиама.\n\nРодившись на ирландскоязычных островах Аран у западного побережья, Том провел большую часть своих ранних лет дома, а в 1912 году уехал в Америку и устроился на работу журналистом. Его младший брат Лиам стремился стать священником и в 1908 году отправился на материк, где в итоге стал боевым членом Ирландских добровольцев.\n\nКогда наступил Вельткриг, Том начал организовывать ирландских рабочих в доках Бостона и Нью-Йорка, чтобы присоединиться к Международным рабочим мира, вдали от войны. Лиам, напротив, увидел в войне возможность, понимая, что ирландцам понадобится военный опыт, чтобы сбросить британское иго, поэтому он записался в армию угнетателей под чужим именем. Он вернулся домой после войны, израненный и контуженный снарядами, но безмерно гордый тем, что вскоре узнает новости о войне за независимость Ирландии и о Французской пролетарской революции. Ужасы войны сделали его социалистом, так же как страдания американского пролетариата побудили его брата. Поначалу оба были приверженцами Шинн Фейн, но теперь стали основателями Ирландской рабочей лиги Родди Коннолли.\n\nВ 1920 году братья вновь встретились в Бостоне и начали увлекаться писательством. Том уже увлекался пролетарской литературой, в то время как Лиама потянуло к печатной машинке, чтобы хоть как-то помочь ему справиться с войной и записать рассказы о своих путешествиях. Несмотря на то что он был моложе и только начинал работать, Лиам вскоре сделал карьеру. Его рассказы больше касались мира символизма, метафоры и сатиры, в то время как Том продолжал писать, опираясь на грубую политическую риторику и, после его собственного возвращения в Ирландию в 1934 году, на обыденные наблюдения за сельской жизнью. Том успел опубликовать лишь несколько рассказов до своей окончательной смерти в 1936 году, оставив Лиама продолжать борьбу старшего брата, как в писательском мире, так и в мировой революции." # Dems that have not relaxed restrictions
irelandflavour.3912.d2: "Газета Ирландской рабочей лиги «Рабочая республика» пользуется скромным ростом популярности с тех пор, как был снят запрет на её выпуск, и те, кто получает её экземпляр, открывают для себя или заново открывают произведения некоторых из самых выдающихся социалистических авторов Ирландии, братьев О'Флаэрти, Тома и Лиама.\n\nРодившись на ирландскоязычных островах Аран у западного побережья, Том провел большую часть своих ранних лет дома, а в 1912 году уехал в Америку и устроился на работу журналистом. Его младший брат Лиам стремился стать священником и в 1908 году отправился на материк, где в конце концов стал боевым членом Ирландских добровольцев.\n\nКогда наступил Вельткриг, Том начал организовывать ирландских рабочих в доках Бостона и Нью-Йорка, чтобы присоединиться к Международным рабочим мира, вдали от войны. Лиам, напротив, увидел в войне возможность, понимая, что ирландцам понадобится военный опыт, чтобы сбросить британское иго, поэтому он записался в армию угнетателей под чужим именем. Он вернулся домой после войны, израненный и контуженный снарядами, но безмерно гордый тем, что вскоре узнает новости о войне за независимость Ирландии и о Французской пролетарской революции. Ужасы войны сделали его социалистом, так же как страдания американского пролетариата побудили его брата. Поначалу оба были приверженцами Шинн Фейн, но теперь стали основателями Ирландской рабочей лиги Родди Коннолли.\n\nВ 1920 году братья вновь встретились в Бостоне и начали увлекаться писательством. Том уже увлекался пролетарской литературой, в то время как Лиама потянуло к печатной машинке, чтобы хоть как-то помочь ему справиться с войной и записать рассказы о своих путешествиях. Несмотря на то что он был моложе и только начинал работать, Лиам вскоре сделал карьеру. Его рассказы больше касались мира символизма, метафоры и сатиры, в то время как Том продолжал писать, опираясь на грубую политическую риторику и, после его собственного возвращения в Ирландию в 1934 году, на обыденные наблюдения за сельской жизнью. Том успел опубликовать лишь несколько рассказов до своей окончательной смерти в 1936 году, оставив Лиама продолжать борьбу старшего брата, как в писательском мире, так и в мировой революции." # Dems that have relaxed restrictions
irelandflavour.3912.d3: "Газета Ирландской рабочей лиги стала объектом новых официальных заявлений и была признана в высшей степени подрывной. Теперь власти намерены гораздо жестче пресекать её распространение, чем это делали предыдущие администрации. Если кто-то невольно попадет на её страницы, то будет вынужден ознакомиться с произведениями одних из самых отвратительных ирландских авторов-социалистов, братьев О'Флаэрти, Тома и Лиама.\n\nРодившись на ирландских островах Аран у западного побережья, Том провел большую часть своих ранних лет дома, а в 1912 году уехал в Америку и устроился журналистом. Его младший брат Лиам стремился стать священником и в 1908 году отправился на материк, где в конце концов стал боевым членом Ирландских добровольцев.\n\nКогда наступил Вельткриг, Том начал организовывать ирландских рабочих в доках Бостона и Нью-Йорка, чтобы присоединиться к Международным рабочим мира, вдали от войны. Лиам, напротив, увидел в войне возможность, понимая, что ирландцам понадобится военный опыт, чтобы сбросить британское иго, поэтому он записался в армию угнетателей под чужим именем. Он вернулся домой после войны, израненный и контуженный снарядами, но безмерно гордый тем, что вскоре узнает новости о войне за независимость Ирландии и о Французской пролетарской революции. Ужасы войны сделали его социалистом, так же как страдания американского пролетариата побудили его брата. Поначалу оба были приверженцами Шинн Фейн, но теперь стали основателями Ирландской рабочей лиги Родди Коннолли.\n\nВ 1920 году братья вновь встретились в Бостоне и начали увлекаться писательством. Том уже увлекался пролетарской литературой, в то время как Лиама потянуло к печатной машинке, чтобы хоть как-то помочь ему справиться с войной и записать рассказы о своих путешествиях. Несмотря на то что он был моложе и только начинал работать, Лиам вскоре сделал карьеру. Его рассказы больше касались мира символизма, метафоры и сатиры, в то время как Том продолжал писать, опираясь на грубую политическую риторику и, после его собственного возвращения в Ирландию в 1934 году, на обыденные наблюдения за сельской жизнью. Том успел опубликовать лишь несколько рассказов до своей окончательной смерти в 1936 году, оставив Лиама продолжать борьбу старшего брата, как в писательском мире, так и в мировой революции." # Blueshirt paths
irelandflavour.3912.d4: "Сегодняшние читатели могут восхищаться страницами газеты ISP «Рабочая республика», где многие открывают для себя или заново открывают произведения одних из самых выдающихся ирландских авторов-социалистов, братьев О'Флаэрти, Тома и Лиама.\n\nРодившись на ирландских островах Аран у западного побережья, Том провел большую часть своих ранних лет дома, а в 1912 году уехал в Америку и устроился журналистом. Его младший брат Лиам стремился стать священником и в 1908 году отправился на материк, где в конце концов стал боевым членом Ирландских добровольцев.\n\nКогда наступил Вельткриг, Том начал организовывать ирландских рабочих в доках Бостона и Нью-Йорка, чтобы присоединиться к Международным рабочим мира, вдали от войны. Лиам, напротив, увидел в войне возможность, понимая, что ирландцам понадобится военный опыт, чтобы сбросить британское иго, поэтому он записался в армию угнетателей под чужим именем. Он вернулся домой после войны, израненный и контуженный снарядами, но безмерно гордый тем, что вскоре узнает новости о войне за независимость Ирландии и о Французской пролетарской революции. Ужасы войны сделали его социалистом, так же как страдания американского пролетариата побудили его брата. Поначалу оба были приверженцами Шинн Фейн, но теперь стали основателями Ирландской рабочей лиги Родди Коннолли.\n\nВ 1920 году братья вновь встретились в Бостоне и начали увлекаться писательством. Том уже увлекался пролетарской литературой, в то время как Лиама потянуло к печатной машинке, чтобы хоть как-то помочь ему справиться с войной и записать рассказы о своих путешествиях. Несмотря на то что он был моложе и только начинал работать, Лиам вскоре сделал карьеру. Его рассказы больше касались мира символизма, метафоры и сатиры, в то время как Том продолжал писать, опираясь на грубую политическую риторику и, после его собственного возвращения в Ирландию в 1934 году, на обыденные наблюдения за сельской жизнью. Том успел опубликовать лишь несколько рассказов до своей окончательной смерти в 1936 году, оставив Лиама продолжать борьбу старшего брата, как в писательском мире, так и в мировой революции." # Socialists
irelandflavour.3912.a: "Такой растраченный потенциал."
irelandflavour.3912.b: "Не все так плохо, знаете ли."
irelandflavour.3912.c: "Национальное всегда должно быть выше международного или собственного."
irelandflavour.3912.e: "Наша страна - это дикая буря необузданного шторма..."
 
irelandflavour.3913.t: "Жизнь на краю"
irelandflavour.3913.d: "Сегодня правительство получило призыв сделать официальное заявление по поводу предстоящего Панкельтского конгресса, который вскоре состоится на острове Мэн. Панкельтское движение можно охарактеризовать как, в лучшем случае, крайнюю позицию, призывающую к расширению сотрудничества, культурного обмена и взаимопонимания между «кельтскими» народами, а именно народами Ирландии, Шотландии, острова Мэн, Уэльса, Корнуолла и Бретани. Идея о том, что кельты - это отдельная раса, а не разные группы людей, говорящих на родственных языках, укоренилась в 1800-х годах благодаря достижениям в области лингвистики, но остаётся предметом научных дискуссий.\n\nНесмотря на фактическую аполитичность, неудивительно, что многие участники Конгресса выступили бы за независимость или, по крайней мере, автономию своих народов. Они придерживаются мнения, что кельты - древняя раса, и солидарны друг с другом в том, что французы и англичане буквально маргинализировали их, вынудив жить на краю своих земель, прижавшись к дикой Северной Атлантике, а также в том, что их языки подвергались жестокой дискриминации, доведенной в некоторых случаях почти до полного исчезновения. Однако для большинства участников Конгресса это мероприятие проходит в легкой атмосфере, с песнями и историями. На вечере демонстрируются соответствующие музыкальные стили и традиции каждого народа, причем песни часто имеют общее происхождение, объединяясь в различные параллельные аранжировки, как некая форма кельтской симфонии\n\nДаже самые радикальные из ирландских националистов никогда не стремились к созданию единого кельтского государства, тем более под руководством ирландцев, поскольку, несмотря на споры о том, где оно начнется или закончится, или относительное отсутствие общей идентичности, считалось, что одной борьбы за независимость достаточно. Тем не менее, идея кельтского родства, пусть и непрочного, имеет определенную романтизированную привлекательность для всего политического спектра, и официальная делегация государства была хорошо принята, о чем она и заявила участникам конгресса."
irelandflavour.3913.a: "Отличная компания парней."
 
irelandflavour.3914.t: "Сенсация века"
irelandflavour.3914.d1: "В этот день 180 лет назад Артур Гиннес подписал знаменитый договор аренды на 9000 лет на помещение, которое стало пивоварней St. James's Gate в [Root.Capital.GetCapitalVictoryPointName], ныне крупнейшей в мире. Его бренд уже много лет тесно ассоциируется с Ирландией, не в последнюю очередь благодаря сходству логотипа Guinness с гербом Ирландии, но репутация синонима за последнее десятилетие достигла такой степени, что многие писатели стали называть его почти эмблемой Ирландии в современную эпоху.\n\nСемья Гиннес, или первоначально Mac Aonghusa, а затем Magennis, была старым гэльским кланом, и одним из немногих, кто перешел в англиканство во времена Реформации. Они извлекли из этого выгоду, получив богатство и престиж, которые пришли с полной интеграцией в англо-ирландскую когорту, правившую Ирландией почти все последние несколько сотен лет.\n\nНа какое-то время их успех стал символом англо-ирландского процветания и промышленности, а их темное пиво стало популярным не только в Ирландии, но и во всей Британской империи. Извлекая выгоду из этих отношений, в отличие от большинства жителей Ирландии, Гиннессы стали видными юнионистами, стремясь сохранить и расширить свой коммерческий успех в будущем.\n\nХотя британская революция стала шоком для их основной клиентуры, компания как-то незаметно расширила свой рынок в Mitteleuropa, где место Ирландии вдали от старой Британии и ближе к большей сфере влияния Германии позволило пиву стать несколько модным или даже шикарным на континенте. Многие восприняли это изменение как символ места Ирландии в мире как независимой нации, которая заменила старое на новое, но при этом сохранила большую часть себя.\n\nПиво продолжает пользоваться большим успехом, как в стране, так и за рубежом. Несмотря на вновь обретенную популярность на континенте, некоторые англофильские тенденции его владельцев сохранились, хотя и смягчились, поскольку пиво по-прежнему пользуется хорошим спросом при поставках в те страны, которые остались от Британской империи, в некотором смысле связывая прошлое Ирландии с её настоящим и будущим."
irelandflavour.3914.d2: "В этот день 180 лет назад Артур Гиннес подписал знаменитый договор аренды на 9000 лет на помещение, которое стало пивоварней St. James's Gate в [Root.Capital.GetCapitalVictoryPointName], ныне крупнейшей в мире. Его бренд уже много лет тесно ассоциируется с Ирландией, не в последнюю очередь благодаря сходству логотипа Guinness с гербом Ирландии, но репутация синонима за последнее десятилетие достигла такой степени, что многие писатели стали называть его почти эмблемой Ирландии в современную эпоху.\n\nСемья Гиннес, или первоначально Mac Aonghusa, а затем Magennis, была старым гэльским кланом, и одним из немногих, кто перешел в англиканство во времена Реформации. Они извлекли из этого выгоду, получив богатство и престиж, которые пришли с полной интеграцией в англо-ирландскую когорту, правившую Ирландией почти все последние несколько сотен лет.\n\nНа какое-то время их успех стал символом англо-ирландского процветания и промышленности, а их темное пиво стало популярным не только в Ирландии, но и во всей Британской империи. Извлекая выгоду из этих отношений, в отличие от большинства жителей Ирландии, Гиннессы стали видными юнионистами, стремясь сохранить и расширить свой коммерческий успех в будущем.\n\nХотя британская революция стала шоком для их основной клиентуры, компания как-то незаметно расширила свой рынок в Mitteleuropa, где место Ирландии вдали от старой Британии и ближе к большей сфере влияния Германии позволило пиву стать несколько модным или даже шикарным на континенте. Это изменение многие восприняли как символ места Ирландии в мире как независимой нации - той, которая заменила старое новым, но по сути сохранила многое от себя.\n\nПостоянная популярность пива в стране и за рубежом признана настолько, что, несмотря на обвинения в том, что протестантским работникам отдавалось большее предпочтение, чем их католическим коллегам в Сент-Джеймс Гейт, и бывшие связи семьи с лоялизмом, компания терпима со стороны [IRE_loc_leader_surname] и его правительства. Порицание компании или ограничение производства дорого обошлось бы Ирландии в плане её международной репутации, и проявление определенной терпимости по отношению к ней может быть продемонстрировано новым правительством как знак благожелательности и уверенности в преемственности. Любовь, которую, как известно, питает к ней О'Даффи, конечно, не имеет значения."
irelandflavour.3914.d3: "В этот день 180 лет назад Артур Гиннес подписал знаменитый договор аренды на 9000 лет на помещение, которое стало пивоварней St. James's Gate в [Root.Capital.GetCapitalVictoryPointName], ныне крупнейшей в мире. Его бренд уже много лет тесно ассоциируется с Ирландией, не в последнюю очередь благодаря сходству логотипа Guinness с гербом Ирландии, но репутация синонима за последнее десятилетие достигла такой степени, что многие писатели стали называть его почти эмблемой Ирландии в современную эпоху.\n\nСемья Гиннес, или первоначально Mac Aonghusa, а затем Magennis, была старым гэльским кланом, и одним из немногих, кто перешел в англиканство во времена Реформации. Они извлекли из этого выгоду, получив богатство и престиж, которые пришли с полной интеграцией в англо-ирландскую когорту, правившую Ирландией почти все последние несколько сотен лет.\n\nНа какое-то время их успех стал символом англо-ирландского процветания и промышленности, а их темное пиво стало популярным не только в Ирландии, но и во всей Британской империи. Извлекая выгоду из этих отношений, в отличие от большинства жителей Ирландии, Гиннессы стали видными юнионистами, стремясь сохранить и расширить свой коммерческий успех в будущем.\n\nХотя британская революция стала шоком для их основной клиентуры, компания как-то незаметно расширила свой рынок в Mitteleuropa, где место Ирландии вдали от старой Британии и ближе к большей сфере влияния Германии позволило пиву стать несколько модным или даже шикарным на континенте. Это изменение было воспринято многими как символ места Ирландии в мире как независимой нации - той, которая заменила старое новым, но сохранила многое от себя.\n\nБренд известен во всем мире, но вызывает противоречивые мысли у правительства. Семья Гиннесс действительно изначально имеет гэльские корни, и даже если их переход в англиканство можно терпеть, их прежняя лояльность к Британии и сохраняющиеся англофильские симпатии считаются в лучшем случае неприятностью, если не столь очевидной, как само название бренда. Поступок предков владельцев компании, принявших англизированный вариант своей фамилии, лично беспокоит О Куиннегайна, который публично заявил, что рассматривает возможность заставить компанию переименоваться или подвергнуться национализации. На данный момент они вольны называть себя так, как им хочется, но через несколько лет это может стать вполне реальной возможностью."
irelandflavour.3914.d4: "В этот день 180 лет назад Артур Гиннес подписал знаменитый договор аренды на 9000 лет на помещение, которое стало пивоварней St. James's Gate в [Root.Capital.GetCapitalVictoryPointName], ныне крупнейшей в мире. Его бренд уже много лет тесно ассоциируется с Ирландией, не в последнюю очередь благодаря сходству логотипа Guinness с гербом Ирландии, но репутация синонима за последнее десятилетие достигла такой степени, что многие писатели стали называть его почти эмблемой Ирландии в современную эпоху.\n\nСемья Гиннес, или первоначально Mac Aonghusa, а затем Magennis, была старым гэльским кланом, и одним из немногих, кто перешел в англиканство во времена Реформации. Они извлекли из этого выгоду, получив богатство и престиж, которые пришли с полной интеграцией в англо-ирландскую когорту, правившую Ирландией почти все последние несколько сотен лет.\n\nНа какое-то время их успех стал символом англо-ирландского процветания и промышленности, а их темное пиво стало популярным не только в Ирландии, но и во всей Британской империи. Извлекая выгоду из этих отношений, в отличие от большинства жителей Ирландии, Гиннессы стали видными юнионистами, стремясь сохранить и расширить свой коммерческий успех в будущем.\n\nХотя британская революция стала шоком для их основной клиентуры, компания как-то незаметно расширила свой рынок в Mitteleuropa, где место Ирландии вдали от старой Британии и ближе к большей сфере влияния Германии позволило пиву стать несколько модным или даже шикарным на континенте. Многие восприняли это изменение как символ места Ирландии в мире как независимой нации, которая заменила старое на новое, но при этом сохранила многое от себя.\n\nПопулярность напитка среди рабочих Британии никогда не угасала, а вступление Ирландии в Интернационал вызвало возрождение интереса к пиву на соседнем острове. Получившая широкую огласку и довольно успешная передача прав собственности на компанию от семьи Гиннесс к её рабочим - это событие, которое широко используется правительством в качестве доказательства не только организационной компетентности, но и недискриминационного подхода, учитывая, что рабочие в Сент-Джеймс Гейт в большинстве своем протестанты, несмотря на то, что этой конфессии придерживается меньшинство жителей Дублина. Однако независимо от владельца, название бренда остается, и как оно путешествовало по Британской империи, так и будет путешествовать к рабочим во всех уголках земного шара."
irelandflavour.3914.a: "Пинта простого - ваш единственный мужчина."
irelandflavour.3914.b: "Сам я больше люблю «Мерфис»..."
irelandflavour.3914.c: "Мак Аонгусы не должны забывать о своих корнях."
irelandflavour.3914.e: "Если присмотреться, пиво явно окрашено в красный цвет."
 
irelandflavour.411.t: "Смерть Джойса"
irelandflavour.411.d1: "Сегодня утром офис [IRE.GetLeader] опубликовал краткое заявление о кончине знаменитого ирландского писателя Джеймса Джойса. Согласно сообщению, Джойс скончался вчера поздно вечером в своем доме в Париже. Джойс опубликовал свой последний роман «Поминки по Финнегану» совсем недавно.\n\nПри жизни Джойс был признан одним из самых значительных авторов своей эпохи и считался послом ирландской культуры. Кажется, что после смерти его звезда будет только расти. Однако позиция ирландского правительства по отношению к автору остаётся неоднозначной.\n\nХотя Джойса поначалу открыто причисляли к великим литераторам Ирландии, впоследствии он стал объектом споров и, как следствие, вызвал недовольство официальных кругов. Во время Вельткрига Джойс жил в Швейцарии, где активно работал над «Улиссом», романом, действие которого происходит в Дублине, параллельно с эпосом Гомера. Однако Джойс не смог опубликовать свой роман в течение нескольких лет после его завершения и переехал в Австро-Венгрию. Раз за разом «Улисс» отклонялся для публикации по всему миру.\n\nДжойс наконец смог опубликовать роман в родной Ирландии в период либерализации, последовавшей за Британской революцией, и, соответственно, поселился в Дублине под громкие крики. Однако, несмотря на немедленное признание «Улисса», он был в конце концов снят с публикации. После этого Джойсу пришлось столкнуться с рядом судебных исков по поводу содержания книги и его личного поведения, и, чтобы избежать их, автор бежал из Ирландии в Коммуну Франции.\n\nХотя Джойс считал себя социалистом, он редко выражал свои политические взгляды публично, даже после того, как поселился в синдикалистской Франции. Тем не менее, само его присутствие там доставляло неудобства Дублину, и Париж знал об этом. Не раз автор становился объектом не слишком удачных комментариев со стороны того или иного политика-коммунара."
irelandflavour.411.d2: "Сегодня утром офис [IRE.GetLeader] опубликовал заявление о кончине знаменитого ирландского писателя Джеймса Джойса. Согласно заявлению, Джойс скончался вчера поздно вечером в своем доме в Дублине. Джойс опубликовал свой последний роман «Поминки по Финнегану» совсем недавно.\n\nПри жизни Джойс был признан одним из самых значительных авторов своей эпохи и считался послом ирландской культуры. Кажется, что после смерти его звезда будет только расти. Однако позиция ирландского правительства по отношению к автору была неоднозначной вплоть до победы социализма в Ирландии.\n\nХотя Джойса поначалу открыто причисляли к великим литераторам Ирландии, позже он стал объектом споров и, как следствие, вызвал недовольство официальных кругов. Во время Вельткрига Джойс жил в Швейцарии, где активно работал над «Улиссом», романом, действие которого происходит в Дублине, параллельно с эпосом Гомера. Однако Джойс не смог опубликовать свой роман в течение нескольких лет после его завершения и переехал в Австро-Венгрию. Раз за разом «Улисс» отклонялся для публикации по всему миру.\n\nДжойс наконец смог опубликовать роман в родной Ирландии в период либерализации, последовавшей за Британской революцией, и, соответственно, поселился в Дублине под громкие аплодисменты. Однако, несмотря на немедленное признание «Улисса», он был в конце концов снят с публикации. После этого Джойсу пришлось столкнуться с рядом судебных исков по поводу содержания книги и его личного поведения, и, чтобы избежать их, автор бежал из Ирландии в Коммуну Франции.\n\nХотя Джойс считал себя социалистом, он редко выражал свои политические взгляды публично, даже после того, как поселился в синдикалистской Франции. Тем не менее, само его присутствие там доставляло неудобства Дублину, и Париж знал об этом. Не раз автор становился объектом не слишком удачных комментариев со стороны того или иного политика-коммунара.\n\nПосле того, как над Лейнстер-Хаусом взвился красный флаг, положение ирландского правительства изменилось на противоположное. Джойс был широко почитаем и в последние годы своей жизни вернулся на родину по приглашению Дублина."
irelandflavour.411.a: "Был ли Дублин действительно написан на его сердце?"

irelandflavour.421.t: "Cáca Lá Breithe"
irelandflavour.421.d1: "14 октября отмечается важный день - конечно, не тот, который можно считать знаменательным для большинства, но для [IRE_loc_leader_title] последних лет, Эмона де Валеры.\n\nВ рамках довольно легкомысленного празднования его 60-летия де Валере был преподнесен большой свежеиспеченный праздничный торт, испеченный в форме не кого иного, как острова Ирландия - форма, подходящая для любого лидера нации. \n\nПосле вручения этого торта де Валера вежливо отказался от ножа, чтобы разрезать пирог. «Было бы неправильно снова разделять остров», - с язвительной улыбкой сказал он, что можно считать тонким намеком на его несогласие с англо-ирландским договором по окончании Войны за независимость и последовавшим за ним разделением.\n\nТеперь, когда он уверенно стоит во главе страны ещё один срок, имениннику есть чему радоваться."
irelandflavour.421.d2: "14 октября отмечается важный день - конечно, не тот, который можно считать знаменательным для большинства, но для нынешнего Приом Айре, Эамона де Валеры.\n\nВ рамках довольно легкомысленного празднования его 60-летия де Валера получил большой свежеиспеченный праздничный торт, испеченный в форме не кого иного, как острова Ирландия - форма, подходящая для любого лидера нации. \n\nПосле вручения этого торта де Валера вежливо отказался от ножа, чтобы разрезать пирог. «Было бы неправильно снова разделить остров», - сказал он с язвительной улыбкой, что можно считать тонким намеком на его несогласие с англо-ирландским договором по окончании Войны за независимость и последовавшим за ним разделом. \n\nСобытия того дня немного отвлекли население от продолжающейся ужасной войны, но де Валера знает, что даже если действия Коллинза сделали его электоральную популярность непреодолимой, то, по крайней мере, действия самого де Валеры, который помог сохранить страну во время чрезвычайной ситуации, позволят истории более благосклонно отнестись к нему. А для этого имениннику есть чему порадоваться."
irelandflavour.421.d3: "14 октября отмечается важный день - конечно, не тот, который можно считать знаменательным для большинства, но для нынешнего Приом Айре, Эамона де Валеры.\n\nВ рамках довольно легкомысленного празднования его 60-летия де Валера получил большой свежеиспеченный праздничный торт, испеченный в форме не кого иного, как острова Ирландия - форма, подходящая для любого лидера нации. \n\nПосле вручения этого торта де Валера вежливо отказался от ножа, чтобы разрезать пирог. «Было бы неправильно снова разделить остров», - с язвительной улыбкой сказал он, что можно считать тонким намеком на его несогласие с англо-ирландским договором, заключенным по окончании Войны за независимость, и последовавшим за ним разделением.\n\nНесмотря на потерю президентского поста на последних выборах, де Валера по-прежнему имеет значительное влияние в правительстве, и, поскольку на следующих выборах он может вернуться на место своего босса, имениннику есть чему радоваться."
irelandflavour.421.d4: "14 октября отмечается важный день - конечно, не тот, который можно считать знаменательным для большинства, но для лидера младшей партии правящей коалиции Эамона де Валеры.\n\nВ рамках довольно легкомысленного празднования его 60-летия де Валера получил в подарок большой свежеиспеченный праздничный торт, испеченный в форме не кого иного, как острова Ирландия - форма, подходящая для любого лидера нации. \n\nПосле вручения этого торта де Валера вежливо отказался от ножа, чтобы разрезать пирог. «Было бы неправильно снова разделить остров», - с язвительной улыбкой сказал он, что можно считать тонким напоминанием о его несогласии с англо-ирландским договором по окончании Войны за независимость и последовавшим за ним разделением.\n\nБудучи Тишеком, или заместителем главы правительства, де Валера по-прежнему имеет значительное влияние в правительстве, и, поскольку на следующих выборах он может вернуться на место своего босса, имениннику есть чему радоваться."
irelandflavour.421.a: "Трижды ура Вождю!"

irelandflavour.422.t: "Вера и красное знамя"
irelandflavour.422.d: "Джим Ларкин долгое время был защитником ирландского рабочего, выступая против несправедливости с трибун профсоюзных залов и на улицах Дублина. Его идея централизованного профсоюзного государства определяла его политику со времён Локаута 1913 года, когда он показал дублинской бедноте, что они могут противостоять мощи как империи, так и денег. В пламенной риторике Ларкина верховная власть принадлежала бы Конгрессу тред-юнионов, объединяя нацию под единым могучим знаменем синдикалистского единства.\n\nОднако за радикальной риторикой всегда скрывалась иная правда: Ларкин - продукт ирландского рабочего католического наследия. Он был крещён в бедных приходах Ливерпуля, маршировал мимо дублинских церквей и никогда не терял утешения веры в самые трудные времена. Годами он нёс это молча, возможно, с чувством вины, поскольку Интернационал становился всё более враждебным к религии.\n\nОднако речи дружественных священников и воинственных христианских тред-юнионистов нашли глубокий отклик. Они утверждают, что синдикализм и христианство не враги, а скорее союзники, оба стремящиеся поднять обездоленных и объединить общество в солидарности и доброте. Вдохновлённый их замечаниями, Ларкин подхватил это знамя с рвением проповедника. На своём последнем митинге он заявил, что сам Христос был первым другом бедных и первым врагом эксплуататоров.\n\nТеперь перед ним стоит выбор: он может объявить, что синдикализм - это не только дело рабочего, но и дело Божье, обратившись тем самым к большинству ирландских католиков, или остаться на секулярной позиции, которая так долго характеризовала синдикализм и ирландский республиканизм."
irelandflavour.422.a: "Царство Божье принадлежит трудящимся."
irelandflavour.422.b: "Вера - дело личное, борьба - всеобщая."

irelandflavour.1.t: "День независимости"
irelandflavour.1.d: "В Понедельник, 24 апреля 1916 года, члены Ирландских добровольцев, Ирландской гражданской армии и Cumann na mBan захватили ключевые пункты в Дублине и провозгласили свободную Ирландскую республику. Сыны Ирландии, значительно уступавшие в численности и вооружении британской армии, сражались в течение шести дней, пока почти все не были взяты в плен или убиты. Казнь без суда и следствия большинства оставшихся лидеров оказала огромное влияние на ирландскую политику, а уровень народной поддержки независимости Ирландии был огромен.\n\nХотя изначально свободная Ирландия не отмечала Восстание на государственном уровне, это изменилось после британской революции и её последующего влияния на некоторые аспекты англо-ирландского договора. Теперь ирландское правительство признает Пасхальное восстание как первое сражение в вооруженной борьбе за независимость, которая привела к окончанию семисотлетнего британского правления.\n\nПомимо этого, 24 апреля в городах и поселках Ирландии проходят праздничные мероприятия в честь Дня независимости, а президент выступает с официальной речью у здания Главного почтамта в Дублине, где Падрейг Пирс впервые провозгласил Ирландскую Республику."
irelandflavour.1.a: "За рабство бежал, о славный мертвец, Когда ты пал в туманной росе."
 
irelandflavour.2.t: "Приветствие старым друзьям"
irelandflavour.2.d1: "Поскольку теплые дружеские отношения между Ирландией и Германией, зародившиеся ещё во времена Вельткрига, усилились с вступлением страны в Рейхспакт, было решено с приближением Пасхи вновь использовать памятную дату, чтобы отметить связи между двумя странами.\n\nВ преддверии Пасхального восстания немецкий корабль SS Libau, замаскированный под норвежское судно Aud, попытался высадить оружие в Ирландии, но в итоге был уничтожен, будучи загнанным в угол британцами в Трали. Несмотря на неудачу, которую затмят более значительные поставки оружия во время Войны за независимость, роковые события 1916 года до сих пор занимают ключевое место в сердцах ирландской общественности.\n\nПосле присутствия немецких дипломатических и военных представителей капитан судна Libau Карл Шпиндлер и оставшиеся в живых члены его команды были встречены восторженными толпами. Капитан вышел на подиум в Дублине и произнес речь, в которой выразил гордость за свою роль в борьбе за свободу Ирландии и похвалил растущие отношения между [IRE_loc_country_name] и его родиной. После церемонии Шпиндлер был награжден медалью из чистого золота, а его товарищи по экипажу - бронзовыми медалями за их героический поступок.\n\nХотя некоторые продолжают ворчать по поводу потери нейтралитета, праздник, похоже, достиг своей цели в усилении прогерманских настроений и объединении ирландского народа с нашими доблестными союзниками в общей борьбе против синдикалистской тирании."
irelandflavour.2.d2: "Поскольку новая администрация, поддерживаемая военными, пыталась укрепить свою легитимность на фоне обвинений в превращении страны в марионеточное государство от имени Кайзера, было решено с приближением Пасхи снова использовать этот праздник для празднования связей между двумя странами.\n\nВ преддверии Пасхального восстания немецкий корабль SS Libau, под видом норвежского судна, известного как Aud, попытался высадить оружие в Ирландии, однако в итоге он был уничтожен, будучи загнанным в угол британцами в Трали. Несмотря на неудачу, которую затмят более значительные поставки оружия во время Войны за независимость, роковые события 1916 года до сих пор занимают ключевое место в сердцах ирландской общественности.\n\nПосле присутствия немецких дипломатических и военных представителей капитан судна Libau Карл Шпиндлер и оставшиеся в живых члены его команды были встречены восторженными толпами. Капитан вышел на подиум в Дублине и произнес речь, в которой выразил гордость за свою роль в борьбе за свободу Ирландии и похвалил растущие отношения между [IRE_loc_country_name] и его родиной. После церемонии Шпиндлеру была вручена медаль из чистого золота, а его товарищам по экипажу - бронзовые медали за их подвиг.\n\nХотя оппозиция бойкотировала это событие, утверждая, что мученики 1916 года были бы отвращены тем, что их наследие используется для продвижения германского вассалитета, праздник, похоже, достиг своей цели - ослабить недовольство народа германофильскими пристрастиями правительства."
irelandflavour.2.a: "Gott mit uns, как мы все едины!"
 
irelandflavour.3.t: "Ещё раз вместе"
irelandflavour.3.d: "Несмотря на то что Ирландия теперь является заклятым союзником держав Антанты, она никогда не должна забывать о своем прошлом или уклоняться от того, что сделало её независимой страной. Она не видит противоречий между памятью о погибших и нынешним геополитическим положением, ведь главное, что Ирландия сама выбрала себе союзников и теперь выступает с ними как равная, а не как подданная.\n\nСегодня состоялся военный парад в память о Пасхальном восстании 1916 года, когда храбрые ирландцы выступили за независимость и право Ирландии выбрать свой собственный путь в мире. И хотя сейчас Ирландия стоит на стороне тех, с кем когда-то сражалась, она не считает себя хуже от этого."
irelandflavour.3.a: "Пусть прошлое останется в прошлом."
 
irelandflavour.4.t: "Революция в памяти"
irelandflavour.4.d1: "Сегодня Ирландия отмечает катализатор своей независимости, Пасхальное восстание 1916 года, в котором ирландские республиканцы и социалисты сражались бок о бок, надеясь поднять ирландский народ против империалистических сил. \n\nКак бы реакционеры ни пытались обелить это событие, неизгладимым фактом всегда останется то, что ирландский синдикалист и лидер Ирландской Гражданской Армии Джеймс Коннолли стоял в авангарде восстания и тем самым заложил основу пути, который приведет Ирландию к независимости и социализму.\n\nЕго вклад никогда не будет забыт, а его жертва будет чтиться его преемниками, пока Ирландия продолжает идти по пути, который он проложил." # independent
irelandflavour.4.d2: "Сегодня Ирландия отмечает катализатор своей независимости, Пасхальное восстание 1916 года, в котором ирландские республиканцы и социалисты сражались бок о бок, надеясь поднять ирландский народ против империалистических сил.\n\nСреди хаоса той недели стоял высокий шотландско-ирландский синдикалист Джеймс Коннолли, возглавляя силы Ирландской Гражданской Армии. Коннолли боролся за освобождение ирландского народа от капитализма и империализма, и эту борьбу слишком часто смешивают с идеей, что он боролся против британского народа. Коннолли боролся против системы, а не против какого-то народа, поскольку для него было важно не то, какой флаг развевается над Дублинским замком, а то, существует ли под ним социализм.\n\nСегодня и ирландский, и британский народы сражаются бок о бок в борьбе против капитализма и империализма, оба они были очищены революцией. Если бы Коннолли мог увидеть Британию и Ирландию сейчас, участвующих вместе в Интернационале, он бы, несомненно, гордился ими." # puppet
irelandflavour.4.a: "Мы будем управлять своей судьбой от плуга до звезд." # independent
irelandflavour.4.b: "Вместе мы создадим новое будущее!" # puppet

irelandflavour.5.t: "Наш самый священный день"
irelandflavour.5.d1: "Сегодня Ирландия отмечает катализатор своей независимости - Пасхальное восстание 1916 года, когда ирландские националисты заявили, что хватит, и разожгли огонь, который охватил британцев и изгнал их из Ирландии.\n\nМужчины, сражавшиеся в Пасхальном восстании, представляли собой солянку из различных взглядов и убеждений, но всех их объединяло убеждение, что Ирландия должна быть свободной, и что ирландский народ отличается от любого другого. Дух 1916 года никогда не должен быть забыт, хотя о нем много раз забывали, в том числе и те, кто там был.\n\n1916 год продемонстрировал, что сила в единстве и ценность в ирландской идентичности. Сегодня Ирландия должна быть уверена, что никакие синдикалисты, британские или любые другие, не смогут разделить её народ или отнять у него его самобытность. Независимо от того, маршируют ли они под красным или британским знаменем, все синдикалисты хотят, чтобы 1916 год был отменен, а Ирландия вновь оказалась под властью Великобритании. Против этого Ирландия должна всегда оставаться бдительной и готовой защитить себя в любой момент."
irelandflavour.5.d2: "Сегодня Ирландия отмечает катализатор своей независимости - Пасхальное восстание 1916 года, когда ирландские националисты заявили, что хватит, и разожгли огонь, который охватил британцев и изгнал их из Ирландии.\n\nМужчины, сражавшиеся в Пасхальном восстании, представляли собой солянку из различных взглядов и убеждений, но всех их объединяло убеждение, что Ирландия должна быть свободной, и что ирландский народ отличается от любого другого. Дух 1916 года никогда не должен быть забыт, хотя о нем много раз забывали, в том числе и те, кто там был.\n\n1916 год продемонстрировал, что сила в единстве и ценность в ирландской идентичности. Сегодня Ирландия должна быть уверена, что никакие синдикалисты, британские или любые другие, не смогут разделить её народ или отнять у него его самобытность. Независимо от того, маршируют ли они под красным или британским знаменем, все синдикалисты хотят, чтобы 1916 год был отменен, а Ирландия вновь оказалась под властью Великобритании. Против этого Ирландия должна всегда оставаться бдительной и готовой защитить себя в любой момент. А восстановление древнего Ирландского Королевства станет доказательством того, что Ирландия, восставшая на Пасху, может воскреснуть, как Христос.\n\nМужчины, сражавшиеся в Пасхальном восстании, представляли собой солянку из различных взглядов и убеждений, но всех их объединяла убежденность в том, что Ирландия должна быть свободной, и что ирландский народ отличается от любого другого. Дух 1916 года никогда не должен быть забыт, хотя о нем много раз забывали даже те, кто там был.\n\n1916 год продемонстрировал, что сила в единстве и ценность в ирландской идентичности. Сегодня Ирландия должна быть уверена, что никакие синдикалисты, британского или любого другого оттенка, не смогут разделить её народ или отнять у него его самобытность. Независимо от того, маршируют ли они под красным или британским знаменем, все синдикалисты хотят, чтобы 1916 год был отменен, а Ирландия вновь оказалась под властью Великобритании. Против этого Ирландия должна всегда оставаться бдительной и готовой защитить себя в любой момент."
irelandflavour.5.a: "Слова улетают с ветром, но удары пробирают до костей."

irelandflavour.200.t: "Смерть короля Георга"
irelandflavour.200.d: "Георг V, Король Соединённого Королевства, его доминионов и Император Индии, скончался от продолжительной болезни и, наконец, покинул этот смертный одр. Пока остатки Британской империи пребывают в состоянии траура, Ирландия оказалась в более сложной ситуации. Неудивительно, что Северная Ирландия и Ольстерская юнионистская партия объявили официальный траур по своему королю, но в других странах чувства смешанные.\n\nКороля Георга часто называют чем-то вроде гибернофила, а его выступления в поддержку Ирландии вызывают тихое уважение даже среди республиканцев: критика реакции Великобритании на Пасхальное восстание, попытка остановить казни во время Войны за независимость и яростное противостояние печально известным британским военизированным формированиям, «Черным и танам». Но, пожалуй, самым ярким его подвигом стало убеждение кабинета Тори одобрить его знаменитую речь на открытии североирландского парламента, призывающую к миру, прощению и примирению между всеми ирландцами, что, по крайней мере, в какой-то мере и произошло...\n\nДля большей части Ирландии память о её некогда короле всё ещё запятнана всем, что он представлял, но в личном плане он был широко признан как справедливый человек. Хотя нет сомнений в том, что даже за пределами севера многие ирландцы с уважением отмечают это событие, президента Коллинза предупредили, что любые открытые проявления скорби или поддержки могут разжечь напряженную политическую борьбу, которая разгорается в эти трудные дни."
irelandflavour.200.a: "Нас это не касается."
irelandflavour.200.b: "Отправьте канадцам личное сообщение с нашими соболезнованиями."
irelandflavour.200.c: "К черту политику, Коллинз должен высказаться!"

irelandflavour.300.t: "Ирландия о смерти короля"
irelandflavour.300.d1: "Отношения с Ирландской Республикой остаются весьма холодными, если не сказать отсутствующими, с момента распада Империи в 1925 году, из-за юридически подложной аннексии Северной Ирландии и договорных портов; но некоторые теплые обмены происходят.\n\nСегодня правительству была доставлена частная телеграмма от самого президента Коллинза, выражающая его самые искренние соболезнования по поводу смерти Георга и обещающая, что память о последнем короле никогда не будет забыта или запятнана."
irelandflavour.300.d2: "Отношения с Ирландской Республикой остаются весьма холодными, если не сказать отсутствующими, с момента распада Империи в 1925 году, из-за юридически подложной аннексии Северной Ирландии и договорных портов; но некоторые более теплые обмены происходят.\n\nСегодня в кабинет из Дублина поступило сообщение, что президент Коллинз произнес почтительную и торжественную речь в знак признания кончины последнего короля Ирландии. Даже будучи ирландским националистом и республиканцем, Коллинз ссылался на наследие Георга, способствующее прощению и примирению, что, несомненно, было направлено на его собственную политически разделенную страну. Тем не менее, для многих стало неожиданностью, что Ирландия так публично отреагировала на кончину короля."
irelandflavour.300.a: "Как неожиданно."
irelandflavour.300.b: "Даже в Ирландии его наследие продолжает жить."

irelandflavour.400.t: "Ответ Канады"
irelandflavour.400.d: "Сегодня мы получили ответ от канадского правительства.\n\nОни поблагодарили нас за пожелания в связи со смертью короля и выразили надежду, что наши страны смогут оставить многое из нашего прошлого позади."
irelandflavour.400.a: "Это очень мило с их стороны."

irelandflavour.500.t: "Речь Коллинза в связи со смертью короля Георга"
irelandflavour.500.d: "Сегодня в центре Дублина президент Коллинз в окружении членов своего кабинета произнес торжественную речь в связи с кончиной последнего короля Ирландии Георга V. Коллинз сослался на его наследие, способствующее прощению и примирению, и призвал всех ирландцев сосредоточиться на единстве и мире, а не на раздорах и разделениях. \n\nНесмотря на то, что некоторые сторонники жёсткой линии не согласны с тем, что Коллинз «присвоил» себе смерть короля Георга, это, похоже, прошло вполне успешно: фактический глава Северной Ирландии Джеймс Крейг высказался в поддержку Коллинза. \n\nЕстественно, что в других странах речь вызвала споры: левые и правые обвинили Коллинза в «подыгрывании британскому тирану» и «восхвалении дела лоялистов», но, несмотря на это, она получила молчаливое одобрение большинства ирландцев всех национальностей."
irelandflavour.500.a: "Это был правильный поступок."
 
irelandflavour.1006.t: "Тело Кейсмента"
irelandflavour.1006.d: "На заседании кабинета министров, состоявшемся на этой неделе, министр иностранных дел сообщил правительству о необычном предложении от Британского Союза: вернуть нам труп сэра Роджера Кейсмента, англо-ирландского антиимпериалистического борца и героя эпохи независимости. Вопреки собственному желанию Кейсмент был похоронен в английской тюрьме после казни в 1916 году за государственную измену, после того как он переправил оружие из Германии в Ирландию для Пасхального восстания.\n\nВ кабинете министров сразу же начались бурные дебаты о том, является ли это какой-то уловкой со стороны британцев или искренней попыткой смягчить отношения. Британцы, со своей стороны, представили это как оливковую ветвь, которая будет приурочена к 21-й годовщине Пасхального восстания. \n\nНесмотря на то, что возможность достойно похоронить Кейсмента чрезвычайно привлекательна, некоторые члены кабинета отмечают, что эта сделка потребует если не открытого публичного признания Британского Союза в качестве «коллеги-республики"\n\n\nДля правительства будет сложно публично воспевать Британский Союз в обмен на Кейсмента, но с другой стороны, отказ от этого предложения может быть равносилен политическому самоубийству, поскольку оппозиция и общественность никогда не заявят, что понимают его."
irelandflavour.1006.a: "Пусть он вернется домой и будет похоронен как подобает!"
irelandflavour.1006.b: "Они запятнали его наследие своими затеями!"
irelandflavour.1006.c: "Разве не немецкое оружие он получил\nв первый раз?"

irelandflavour.1007.t: "Правила дорожного движения"
irelandflavour.1007.d: "По мере того как накаляется вражда между Рейхспактом и синдикалистскими Державами, Ирландия оказывается на переднем крае борьбы за влияние между двумя великими военно-морскими силами Европы. Когда сонный статус-кво предыдущих лет нарушен, желание обновить некоторые стороны ирландской жизни до стандартов материка начинает охватывать как космополитов, так и националистов: первые стремятся привязать Ирландию ближе к своим европейским партнерам, а вторые выступают за отмену архаичных пережитков, унаследованных от британского правления. \n\nНа фоне растущей популярности подобных модернизационных предложений, Ирландии было предложено перейти от старой британской системы левостороннего движения к континентальной системе правостороннего движения, приведя правила дорожного движения страны в соответствие с другими странами Европы и Америки. \n\nСторонники подчеркивают долгосрочные преимущества такого перехода для иностранного туризма, а также для импорта и экспорта автомобилей на международном уровне, но противники отвечают, что это предложение может привести к хаосу на ирландских дорогах и легкомысленной трате ценного времени и ресурсов, которые лучше потратить на ликвидацию последствий Чёрного Понедельника."
irelandflavour.1007.a: "Мы больше не колония, переключите систему дорожного движения."
irelandflavour.1007.b: "Бессмысленная трата времени, бессмысленная идея."

irelandflavour.1008.t: "Перевод часов вперёд"
irelandflavour.1008.d: "В связи с постоянным требованием общественности пересмотреть практику, доставшуюся Ирландии от британского правления, предыдущее предложение об изменении правил дорожного движения государства, чтобы они соответствовали основным системам дорожного движения на континенте, похоже, не последнее, поскольку появилось гораздо более радикальное предложение. Странная реформаторская коалиция космополитов и антисиндикалистов предлагает перевести часы на час вперёд, чтобы они соответствовали центрально-европейскому времени в Германии. \n\nСинхронизация часового пояса Ирландской Республики с Центральной Европой, по мнению реформаторов, уменьшит влияние синдикалистов и окажется полезной для торговли с её миттельевропейскими партнерами, куда поступает большая часть ирландского экспорта со времен распада Британской империи, что поможет стране возобновить жизненно важную экспортную торговлю и исправить ущерб, нанесенный финансовым кризисом предыдущего года. \n\nНедоброжелатели, напротив, осуждают эту идею как акт полного безумия, предупреждая о её влиянии на время восхода и захода солнца, а также о пагубных последствиях, которые она может иметь для экономического суверенитета Ирландии, привязывая национальную судьбу Ирландии к судьбе Германии, несмотря на то, что Чёрный Понедельник, по их мнению, резко обнажил недостатки такой стратегии."
irelandflavour.1008.a: "Темное утро - небольшая цена за светлое национальное будущее."
irelandflavour.1008.b: "Может быть, вместо этого нам стоит реформировать преподавание географии?"
 
irelandflavour.1009.t1: "Жаркий июль"
irelandflavour.1009.t2: "Опустить ногу"
irelandflavour.1009.d1: "12 июля 1690 года католический Король Англии Яков II потерпел поражение от Вильгельма Оранского в битве при Бойне. Для ирландских католиков поражение Якова привело к их порабощению суровыми Уголовными законами, но для протестантов Ольстера победоносный Вильгельм стал спасителем, избавившим их от призрака католического господства, и подтвердил их законное право поселиться в Ирландии, прибыв из Великобритании всего за несколько десятилетий до этого.\n\nЭта дата стала ключевым праздником лоялистов, отмечаемым маршами братского Оранжевого ордена и кострами накануне вечером. Хотя большинство лоялистов нехотя согласились присоединиться к ненавистной Ирландской Республике в качестве альтернативы синдикализму, сжигание ирландских, британских и немецких флагов на кострах получило распространение в межвоенный период как способ выражения пассивного сопротивления. \n\nХотя этот месяц всегда был нервным событием из-за постоянно присутствующей этнорелигиозной вражды, подъем партий сделал подготовку к Двенадцатому числу этого года особенно напряженной, так как июнь и начало июля были отмечены ростом сообщений о сектантском насилии, совершенном «голубыми рубашками» и сторонниками UPL. Нарастающая напряженность вылилась в само Двенадцатое, когда во время прохождения марша Оранжевого ордена через католический район произошла стычка, переросшая в беспорядки. Гардаи неэффективно подавляли беспорядки, распространялись обвинения в том, что местные гардаи поддерживают бунтовщиков из своих собственных общин, и к концу дня несколько человек погибли, а многие дома были разрушены.\n\n"
irelandflavour.1009.d1.otherdem: "Хуже того, по мере распространения новостей из Ольстера поступили сообщения о ряде инцидентов, когда разъяренные «голубые рубашки» в отместку нападали на южных протестантов и запугивали их. Гардаи были быстро мобилизованы для восстановления порядка, а те, кому угрожали, получили помощь от синдикалистской Ирландской гражданской армии, выступающей против сектантства и не упускающей случая подраться со своими «легионерами"-врагами. Теперь, когда все внимание приковано к северу, правительство оказалось в ещё более затруднительном положении, поскольку давление общественности на реформы стало ещё более интенсивным."
irelandflavour.1009.d2: "12 июля 1690 года католический Король Англии Яков II потерпел поражение от Вильгельма Оранского в битве при Бойне. Для ирландских католиков поражение Якова привело к их порабощению суровыми Уголовными законами, но для протестантов Ольстера победивший Вильгельм стал спасителем, избавившим их от призрака католического господства, и подтвердил их право на поселение в Ирландии, поскольку они прибыли из Великобритании всего за несколько десятилетий до этого.\n\nДата стала ключевым праздником лоялистов, отмечаемым маршами братского Оранжевого ордена и кострами накануне вечером. Хотя подготовка к Двенадцатому числу всегда была напряженной, в этом году это было особенно актуально, поскольку переворот «голубых рубашек» был встречен лоялистами Ольстера с большой тревогой. Сегодня эта напряженность выплеснулась в Белфасте: лоялисты не только взорвали несколько бомб, но и несколько парадов переросли в беспорядки, поскольку «голубые» блокировали шествие в католических районах. Хотя беспорядки были подавлены железным кулаком, примененная жестокость лишь усилила отчуждение ольстерских протестантов от правительства.\n\nВ связи с растущим сопротивлением не только со стороны лоялистов, но и на юге, со стороны синдикалистской Ирландской гражданской армии и продемократических элементов, О'Даффи и О Куиннеагайн встретились с членами кабинета министров, чтобы обсудить, как действовать в сложившейся ситуации. С точки зрения бывшего генерала, проблема носит внутренний характер, является результатом недостатка дисциплины среди ирландского народа и требует увеличения численности Гардаи для поддержания порядка, причем протестанты должны находиться под пристальным наблюдением, учитывая их врожденную нелояльность. \n\nПо мнению О Куиннеагайна, источник проблем режима лежит за границей, где зловещие силы «Англо-синдикализма» замышляют подрыв ирландской нации, и для борьбы с красной угрозой необходимо создать тайную полицию, наделенную широкими полномочиями по выявлению любыми средствами, включая пытки, предателей, готовых принять саксонский шиллинг. Однако такая организация быстро пополнилась бы «голубыми рубашками», ищущими более легитимную форму карьеры, чем членство в Национальной гвардии, что расширило бы внутреннее влияние легионеров."
irelandflavour.1009.a: "Бойн всё ещё ощущается, спустя столетия."
irelandflavour.1009.b: "Старый добрый закон и порядок решит эту проблему."
irelandflavour.1009.c: "Враги гэлов должны быть уничтожены!"
 
irelandflavour.1010.t: "По другой метрике"
irelandflavour.1010.d: "Поскольку затишье, наступившее после обретения независимости, продолжает вызывать желание перемен, было предложено дополнительное предложение, цель которого - привести Ирландию в соответствие с континентом, на этот раз в отношении единиц измерения. Как ещё одно следствие того, что ранее Ирландия находилась под властью Британской империи, в настоящее время в Ирландской Республике используется британская система измерения в имперских единицах. В отличие от нее, многие страны континентальной Европы, в первую очередь Германия, используют метрическую систему. Хотя призывы к метрической системе существуют с тех пор, как Ирландия обрела свободу, поддержка реформы в этой области начала набирать обороты, в соответствии с другими недавними инициативами по следованию европейским тенденциям.\n\nВ глазах космополитов это послужит дальнейшей модернизации страны, а с точки зрения националистов это будет означать дальнейший отказ от британского влияния. Однако противники этого последнего предложения указывают на то, что имперские измерения глубоко укоренились в сознании ирландского народа, широко используются в повседневной жизни, например, в пабах, на скачках и на дорогах, а также на сложность перехода страны на метрическую систему, процесс которого может занять много лет. По мнению противников предложения, имперская система, хотя и контрастирует с материковой, не сломана и поэтому не нуждается в исправлении."
irelandflavour.1010.a: "Пока я ещё могу заказать пинту пива."
irelandflavour.1010.b: "Дай еврофилам дюйм, и они возьмут милю."

irelandflavour.1011.t: "Радио Свободная Шотландия"
irelandflavour.1011.d: "Одним из самых значительных технологических достижений последних лет стало развитие радио. Хотя радиовещание в Ирландии ведется с середины 1920-х годов, первоначальный радиус действия каналов был ограничен и требовал ретрансляционных станций для передачи сигнала из Дублина в Корк. Однако технологии быстро развивались, и появились новые, более мощные передатчики, способные нести сигнал на огромные расстояния.\n\nПодстегнутая успехом радиостанций дальнего действия в низких странах, группа шотландских активистов в Белфасте собирает средства на создание собственной станции: «Радио Свободная Шотландия» Планируя приобрести передатчик с радиусом действия более 150 миль, станция сможет связаться с Глазго и Эдинбургом, а также с Ливерпулем в Англии. Цель группы проста: \n\nПредставить альтернативный источник новостей и шотландской культуры по сравнению с жестко контролируемыми СМИ Британского Союза.\n\nХотя британское радио уже «просачивается» в Ирландию, эта новая станция, которая явно планирует вести подрывную деятельность, вполне может быть расценена британцами как провокация."
irelandflavour.1011.a: "Это свободное предпринимательство в свободной стране."
irelandflavour.1011.b: "Вдохновляющая идея. Возможно, можно сделать небольшой вклад в это предприятие..."
irelandflavour.1011.c: "Мы не можем позволить им затевать драку,\nв которую мы будем втянуты."

irelandflavour.1012.t: "Радио Свободная Шотландия"
irelandflavour.1012.d: "До сведения правительства дошло, что радиоприемники в Шотландии, на северо-западе Англии и на острове Мэн принимают сигнал из Белфаста, вещающего как «Радио Свободная Шотландия»\n\nХотя музыкальное содержание станции не вызывает особого беспокойства, в основном это традиционные шотландские песни, подборка новостей и политических дискуссий явно направлена против британского правительства.\n\nПохоже, что на станции работают шотландские националисты, уехавшие в Ирландию, большая часть их материалов - это тонко завуалированная антисоциалистическая пропаганда.  Поддерживает ли ирландское правительство эту затею или просто закрывает на нее глаза, неизвестно, но факт остаётся фактом: эта станция работает прямо у них под носом."
irelandflavour.1012.a: "Провокация? Конечно, но мы не будем вестись на нее"
irelandflavour.1012.b: "Внутренние дела Союза не подлежат вмешательству. Опубликуйте официальное заявление."

irelandflavour.1013.t: "Британцы осуждают RFS"
irelandflavour.1013.d: "Представитель Британского союза опубликовал сегодня официальное заявление, в котором осудил ирландское правительство за «потворство политическим агитаторам», терпимо относящееся к работе «Радио Свободная Шотландия» в Белфасте. \n\nВ заявлении говорится, что «ответственное правительство» не позволило бы такой станции работать без надзора.\n\nЭто заявление уже заставило большую часть прессы в Ирландии сплотиться вокруг радиостанции, которая, похоже, наслаждается своей дурной славой."
irelandflavour.1013.a: "Мы не будем; нет необходимости идти на поводу у британцев."
irelandflavour.1013.b: "Это была ошибка, сделайте все возможное, чтобы закрыть станцию."
irelandflavour.1013.c: "Мы не потерпим издевательств - ответьте собственным заявлением!"

irelandflavour.1014.t: "Ирландцы закрыли RFS"
irelandflavour.1014.d: "Сегодня в Британию пришли новости из Ирландии о том, что «Радио Свободная Шотландия» было тихо ликвидировано.\n\nНовые законы были введены для регулирования радиостанций на острове, и впоследствии «Радио Свободная Шотландия» было отказано в лицензии на работу. Похоже, как только стало известно о недовольстве британского правительства, оно поспешило разрядить обстановку."
irelandflavour.1014.a: "Правильный ответ."

irelandflavour.1015.t: "Ирландцы поддерживают RFS"
irelandflavour.1015.d: "Похоже, ирландцам недостаточно просто принимать у себя агитаторов, они должны ещё и защищать их.\n\nСегодня ирландский «министр почт и телеграфов» отстреливался от Союза, утверждая, что британские радиослужбы «вторгались» в Ирландию в течение многих лет без каких-либо жалоб, а затем перешел к банальностям о свободе слова. Подобное двуличие между пропагандой и серьезной журналистикой постыдно и свидетельствует о потрясающем (или, возможно, намеренном) отсутствии критического анализа. Теперь мы ясно видим, как в Дублине относятся к британцам."
irelandflavour.1015.a: "Остров негодяев."

######################
## Monarchy Stuff   ##
######################

ire_monarch.1.t: "Судьба Ирландской республики"
ire_monarch.1.d: "Президент де Валера долгое время выступал за независимость, национализм и единство Ирландии, но испытывал внутренний конфликт относительно одной вещи: Выбор между республикой и монархией. Являясь в большей мере сторонником республиканской демократии, де Валера был известен за свои симпатии к парламентарной монархии, основанной на современной форме бывшей Верховной Королевской власти, которая бы служила объединяющей силой для демократического правительства, обладающего большей частью власти. Теперь, когда де Валера и Фианна Файл находятся у руля Ирландии, ему необходимо решить, нужна ли его стране монархия или нет."
ire_monarch.1.a: "Хватит с нас республики. Готовьтесь к восстановлению монархии!"
ire_monarch.1.b: "Ирландская монархия? Сумасшествие... Мы остаемся верны республике."

ire_monarch.2.t: "Кандидат на престол"
ire_monarch.2.d: "Теперь, когда дебаты о монархии окончились, пришло время решить откуда будет наш монарх. Пусть и большинство голосов в правительстве Фианны Файл призвали избрать ирландского короля для Ирландского Королевства, некоторые несогласные, вдохновленные Пирсом, предложили альтернативу, предупреждая о том, что Ирландии могут быть не по плечу синдикалисты из Франции и Британии, не говоря уже о Виндзорском монархе в Канаде, строящим свои планы. В этом случае Фианна Файл выбрала принца Иоакима Прусского, шестого сына Кайзера Вильгельма II, как возможного претендента на престол. Он не говорит на английском, и некоторые надеются, что его абсолютное отсутствие связей с англичанами позволит нам повлиять на правительство в целях деанглизации Ирландии, а возможно и целых Британских островов. Это слияние ирландской монархии с прусским конституционализмом позволит Ирландии получить защиту под бдительным оком Кайзера. Но само собой разумеющееся, это заставит нас отказаться от местного претендента, что является более популярным выбором. Некоторые высказали опасения насчет того, что выбрав Иоакима, мы продадим Ирландию немцам, и немецкая оккупация будет ничем не лучше английской; конечно же на деле это просто нагнетание страха, и на монархию будут возложены определенные ограничения, гарантирующие, что Король Ирландии в основном будет являться лишь её представителем на мировой арене. Стоит ли нам короновать немецкого претендента, или же Ирландии в самом деле необходим лишь родной Верховный Король?"
ire_monarch.2.a: "Пирс был прав, нам необходима защита Германии, выбираем принца Иоакима."
ire_monarch.2.b: "Нам не нужен фриц на троне, выбираем ирландского кандидата."

ire_monarch.3.t: "Ирландский король"
ire_monarch.3.d: "Теперь, когда мы решили выбрать исконно ирландского Верховного короля, мы должны выбрать конкретного монарха. У многих великих кланов всё ещё сохранились родословные среди неанглийской знати, поэтому мы должны выбрать одну из этих прекрасных душ, чтобы она вела нас в качестве нового Верховного короля Ирландии. Сам Де Валера лично предпочитает отца старого друга, Леопольдо О’Доннелл-и-Варгаса, который происходит из клана О’Доннелл, родился в Испании и с тех пор примкнул к карлистскому движению. Его назначение, вероятно, свяжет нас с внешней политикой испанцев, но даст нам сильного католического союзника. В противовес ему, громогласно поддерживаемый своими сторонниками, выступает Уго Хосе Хорхе О’Нилл из клана О’Нилл. Рождённый и выросший в Португалии, этот ирландско-португальский дворянин имеет тесные связи с лиссабонским «Новым государством» и католическим лузо-интегралистским движением, будучи главным сторонником интегралистской идеологии в Ирландии и познакомив Де Валеру и остальных ирландских монархистов с этой концепцией.\n\nШироко рассматриваемый как самый легитимный кандидат, Донах О’Брайен стоит между этими двумя ссорящимися иностранцами, которые, как утверждают некоторые, имеют лишь полуирландскую кровь. О’Брайен из клана О’Брайен является прямым потомком Бриана Бору, величайшего из старых Верховных королей, который сверг династию О’Ниллов, положил конец вторжению викингов в Ирландию и основал свою собственную династию, просуществовавшую более пяти веков, закрепив за собой статус одного из величайших ирландских лидеров в истории. Как и его прародитель, Донах О’Брайен любим ирландскими националистами по всему Изумрудному острову. Тёмной лошадкой гонки является Уильям Фрэнсис Бринсли Ле Поэр Тренч, 8-й граф Кланкарти, 7-й маркиз Хьюсдема. Член нидерландской знати и клана Маккарти, он имеет полное право быть королём, но его мало интересует правление. Вместо этого Тренч обожает оккультизм и странности, увлекаясь уфологией и другими эзотерическими псевдонауками.\n\nПоследним среди различных кандидатов является 8-й граф Антрима, Рэндал Макдоннелл. Уроженец Ольстера, Макдоннелл происходит от Сорли Боя Макдоннелла, который отстоял для своей семьи право остаться в Ирландии, к большому неудовольствию англичан. Во время якобитских войн Макдоннеллы храбро сражались за Стюартов, как и их клан-прародитель в Шотландии - клан Дональд, хотя поражение в войне сильно уменьшило влияние Макдоннеллов из Антрима. Наряду с этой легендарной историей, королевская кровь Стюартов течёт в жилах Макдоннелла. Будучи потомком Якова VI и I через его дочь Елизавету Стюарт, Макдоннелл, таким образом, является претендентом на троны Ирландии, Шотландии, Уэльса и Англии, каким бы отдалённым ни было это родство. У Ирландии есть давняя традиция избирать своего короля из числа великих кланов, так что пусть начнутся эти выборы!"
ire_monarch.3.a: "Предпочтительный кандидат Де Валеры - ирландско-испанский Леопольдо О’Доннелл-и-Варгас."
ire_monarch.3.b: "Ирландско-португальский интегралист Уго Хосе Хорхе О’Нилл."
ire_monarch.3.c: "Конспиролог 8-й граф Кланкарти, Уильям Бринсли Ле Поэр Тренч."
ire_monarch.3.e: "Донах О’Брайен, самый сильный претендент и потомок Бриана Бору, величайшего из старых Верховных королей."
ire_monarch.3.f: "Рэндал Макдоннелл, потомок Якова I и наследник Сорли Боя."

ire_monarch.4.t: "Небольшая проблема"
ire_monarch.4.d: "В отношении Иоакима Прусского возник вопрос, который никто не принял во внимание. Будучи правящим королем Грузии, были изъявлены предупреждения о том, что для него будет слишком большой нагрузкой принять сразу два Королевских титула; учитывая огромное расстояние между Ирландией и Грузией, было бы неразумно ожидать от него эффективного управления двумя разными странами одновременно. Вместо его кандидатуры, правительство предложило пригласить Оскара Прусского, старшего брата Иоакима, который мог бы принять корону с более легкой душой. Разумеется, мы не обязаны отворачиваться от Иоакима лишь по причине того что он уже является королем иной страны; так или иначе, его повседневное присутствие не будет необходимым. В любом случае, есть и третий вариант - формирование личной унии между Грузией и Ирландией; хоть и у этих двух монархий практически ничего общего и нет, это объединение позволит Иоакиму управлять обеими странами вне зависимости от того, в какой из них он будет находиться."
ire_monarch.4.a: "Мы не хотим обременять короля, давайте выберем Оскара."
ire_monarch.4.b: "Кого волнует то, что он уже является королем?"
ire_monarch.4.c: "Объединить Грузию и Ирландию в личную унию!"

ire_monarch.5.t: "Реставрация"
ire_monarch.5.d: "Дебаты наконец окончились, и Верховный Король Ирландского Королевства был выбран! Коронованный у Камня судьбы, на холме королей, [root.getleader] стал новым королем Ирландии, который будет вести нас как символ защиты и единства, в которой так нуждалась наша демократия. Наша независимость гарантирована, покуда мы остаемся сильными, решительными и преданными нашей Ирландии и свободе. Слава прошлого восстановлена, и Ирландское Королевство восстало из пепла. Боже, храни короля!"
ire_monarch.5.a: "Да здравствует Король!"

ire_monarch.500.t: "Коронация"
ire_monarch.500.d: "Как и много веков назад, коронация нового Верховного короля Ирландии была проведена на холме королей, у Инагурационного кургана. На вершине этого священного холма стоит Камень судьбы, или же Лиа Файл, который является большим каменным столбом, вырастающим из земли и тянущегося к небу, покрытый религиозно-культурной резьбой и давно забытыми рунами. Здесь, на этом священном и древнем месте, которым пользовались давние поколения наших предков, новый Верховный Король [root.getleader] был коронован в ходе церемонии, ознаменовавшей единение ирландского католицизма с гэльскими, друидическими мотивами, создавая тем самым слияние уникальной культуры Ирландии, которая будет оберегаться нашим новым правителем. Да здравствует Король!"
ire_monarch.500.a: "Наш новый Король будет оберегать независимость Ирландии."

ire_monarch.6.t: "Судьба конституции"
ire_monarch.6.d: "Учитывая текущее восхождение монархии, мы должны решить что нам делать с конституцией. Должны ли мы продолжать пользоваться республиканской конституцией, выкованной кровью в борьбе за независимость, или же её стоит переписать соответствуя идеям интегрализма?"
ire_monarch.6.a: "Принять идеалы интегрализма."
ire_monarch.6.b: "Следовать демократическескому наследию и республиканским идеалам Ирландии."

ire_monarch.7.t: "Судьба конституции"
ire_monarch.7.d: "Учитывая текущее восхождение монархии, мы должны решить что нам делать с конституцией. Должны ли мы продолжать пользоваться республиканской конституцией, выкованной кровью в борьбе за независимость, или же её стоит переписать на манер прусского конституционализма Германской империи, в том числе и подражая их методу управления государством?"
ire_monarch.7.a: "Принять идеалы прусского конституционализма."
ire_monarch.7.b: "Следовать демократическескому наследию и республиканским идеалам Ирландии."

ire_monarch.8.t: "Выборы в Королевский парламент"
ire_monarch.8.d: "Придерживаясь правил конституции и демократии, мы провели выборы в целях сформировать новый кабинет правительства Его Величества, с тех пор как срок де Валеры и Фианны Файл подошел к концу. В выборах участвуют все демократические партии, за исключением левых революционеров, что несут в себе угрозу нашей демократии. Кто же победит и поможет Верховному королю вести Ирландию вперед?"
ire_monarch.8.a: "Кахал Бру и его партия Шинн Фейн!"
ire_monarch.8.b: "МакДермот и Партия национального центра!"
ire_monarch.8.c: "Фине Гэл вновь одерживает победу."
ire_monarch.8.e: "Де Валера и Фианна Файл!"
ire_monarch.8.f: "О'Брайен и дерадикализированные Лейбористы!"

ire_monarch.9.t: "Ирландско-Валлийская уния?"
ire_monarch.9.d: "По чистой случайности оказалось, что принц Оскар Прусский был выбран двумя кельтскими странами как претендент на престол. Поскольку и Ирландия, и Уэльс выбрали в качестве монарха пятого сына Кайзера Вильгельма II, законодательные органы обоих государств были осведомлены о желании короля объединить два Королевства в одно, в целях более эффективного управления. Это несомненно обрадует определенных пан-кельтийцев в обоих правительствах, и, разумеется, позволит создать более успешное и процветающее государство, чем если бы они были порознь. Но при этом есть и сомневающиеся в правильности унификации - у многих жителей обоих государств закрались сомнения относительно того, что Король рано или поздно может склониться в пользу одного из двух Королевств, и потому лучшим решением было бы сохранить независимость друг от друга, но поддерживать стабильно хорошие отношения. «
ire_monarch.9.a: "Конечно! Королевство Ирландии и Уэльса, почему бы и нет?"
ire_monarch.9.b: "Ни в коем случае! Мы ни за что не откажемся от нашей независимости."

ire_monarch.10.t: "Новый флаг для Королевства"
ire_monarch.10.d: "Какой флаг нашему Королевству следует использовать?"
ire_monarch.10.a: "Флаг Королевства Ирландии, но зелёный"
ire_monarch.10.b: "Арфа на провинциальных флагах"
ire_monarch.10.c: "Триколор с арфой"
ire_monarch.10.e: "Триколор с провинциальными флагами в центре"
ire_monarch.10.f: "Немецкая вариация флага"
ire_monarch.10.g: "Ирландский Рейхскригсфлаг с арфой на зеленом фоне"
ire_monarch.10.h: "Ирландский Рейхскригсфлаг с арфой на синем фоне"
ire_monarch.10.i: "Использовать сальтир святого Патрика"
ire_monarch.10.j: "Использовать смесь салтира Святого Патрика и арфы."
ire_monarch.10.k: "Использовать триколор с гербом Томонда."

ire_monarch.11.t: "Интеграция Ирландского монархического общества"
ire_monarch.11.d: "Ирландское монархическое общество, возглавляемое Фрэнсисом Стюартом, сэром Осмондом Эсмондом, 12 баронетом, Балмером Хобсоном и другими значимыми монархистами связанных с де Валерой, и в прошлом поддерживаемые героями Ирландской независимости, таких как Патриком Пирсом, Артуром Гриффитом и другими, до того как они умерли, является широкой коалицией, состоящей из писателей, художников, политиков, журналистов, философов и других личностей, объединённых идеей возвращения монархии в современную Ирландию. Однажды, при одном из заговоров в целях свержения республиканского правительства и установления монархии, одна из групп предложила список кандидатов на престол, таких как Иоахим Гогенцоллерн и Хуан О'Доннелл, но в итоге выбор остановился на династии О'Нил. Однако, с восхождением монархистского движения де Валеры, ИМО значительно потеряла свою значимость, разваливаясь на группы с разными идеями. Эта организация вполне могла бы влиться в наше движение, но их связи с ультраправыми идеологиями и радикализмом могут навредить нашему общественному мнению. Что нам стоит сделать?"
ire_monarch.11.a: "Позволить им присоединиться к нашему движению, но сдержать пыл их радикальных идей."
ire_monarch.11.b: "Пригласить их!"

ire_monarch.12.t: "Наследие Гриффита"
ire_monarch.12.d: "После недавно выигранных выборов, оригинальная задача Шинн Фейн была достигнута. Будучи основанной в 1905 году при помощи Артура Гриффита и других левых революционеров, она изначально несла в себе цель создать монархистско-республиканскую гибридную систему, вдохновленную политиками и организацией Австро-Венгрии. Пытаясь создать англо-ирландскую дуалистическую монархию, что поставила бы Ирландию в равную позицию с англичанами, Шинн Фейн продвигала эту идею как наилучший вариант ирландского самоуправления. Этот план, разумеется, провалился - народные массы были согласны на это только в случае того, если Шинн Фейн никогда не коронует Виндзорского монарха. Но даже с этим обещанием, движение вскоре затухло и погибло, и Шинн Фейн начало раскалываться на фракции растущих республиканцев и терявших популярность монархистов, угасавших, в частности, после возвышения де Валеры и Коллинза на политической сцене Ирландии. Однако, благодаря нашей победе под властью короны, мы воплотили в жизнь желания Гриффита и оригинальной Шинн Фейн, без преклонения перед англичанами. Теперь же мы можем вести Ирландию к великому и светлому будущему."
ire_monarch.12.a: "Мы чтим мечты наших основателей."

ire_monarch.13.t: "Король Гленса"
ire_monarch.13.d: "Рэндал Макдоннелл, 8-й граф Антрим, родом из графства Антрим в Ольстере. Будучи родственником некогда могущественного шотландского клана Макдональдов, Макдоннелл по отцовской линии происходит от Елизаветы Стюарт, дочери Якова I и VI, таким образом, он является наследником линии Стюартов, какой бы отдаленной и далекой она ни была. Поскольку Его Высочество находится в якобитской линии наследования, было почти неизбежно, что люди начнут сравнивать его правление с правлением Стюартов. Хотя он предпочитает держать руку на пульсе, чем его предки, его правление не лишено сходства. Действительно, Макдоннелл открыто выступает в поддержку демократии, Король начал активно продвигать католицизм в государстве, и фактически начал тихо наказывать те семьи и кланы, которые поддерживали Вильгельмитов все эти годы назад, тихо отнимая богатство или поместья, и отказываясь признавать их титулы в новой ирландской системе Peerage. В связи с этими действиями, а может быть, просто из-за восстановления на Британских островах своего рода монархии, различные якобиты из Шотландии и со всего мира прибыли в Ирландию и начали отстаивать короля как законного наследника Якова II, законного короля Англии, Шотландии и Уэльса. Хотя эти голоса пока остаются за пределами правительства, их влияние уже ощущается на некоторых слабых волей членов Королевского двора, членов, которые полны мечтаний о Реставрации и возвращении былой славы."
ire_monarch.13.a: "Да здравствует наследник Якова, Король Ирландии!"

ire_monarch.14.t: "Судьба Конституции"
ire_monarch.14.d: "Хотя в Ирландии все чаще звучат призывы принять португальский стиль интегрализма, за который ратует глава клана О'Нил, Его Величество не желает этого. Действительно, Рандел I является строгим конституционалистом, рассматривая право народа на голосование почти так же страшно, как и его собственное положение. Как бы то ни было, Король отмахнулся от этих призывов, призвав своего Тайсеаха сделать все возможное для защиты демократии. Несмотря на это, вопросы относительно Конституции всё ещё остаются, хотя и гораздо более эзотерического характера. Было несколько предложений, как внутри, так и вне правительства, о том, чтобы сделать ребрендинг нации как законной и легальной преемственности Соединённого Королевства. Хотя для среднего ирландца такая идея едва ли не равносильна измене, в ней есть элемент рациональности. Благодаря своему статусу слабого якобитского претендента, Король действительно претендует на эти троны. С падением Великобритании в результате синдикализма и бегства Королевской семьи, с юридической точки зрения, Соединённое Королевство прекратило своё существование, несмотря на заявления канадских изгнанников. Поскольку Ирландское Королевство было неотъемлемой частью старого Соединённого Королевства, а в настоящее время Ирландское Королевство восстановлено, не так уж и далеко тянуться, чтобы заявить о юридической преемственности. Чтобы фактически претендовать на мантию Соединённого Королевства, Ирландия навсегда отрезала бы себя от Антанты и получила бы любого врага на всю жизнь. Несмотря на очевидное безумие идеи, из-за прибытия якобитских изгнанников и голоса якобитизма, проникающего в правительство, королю был представлен план по изменению Конституции, чтобы объявить Ирландию наследницей Соединённого Королевства и, таким образом, законным правительством всех Британских островов.   Хотя ожидается, что он отвергнет этот план, призыв якобитизма, возможно, только что достиг ушей короля."
ire_monarch.14.a: "Ирландия есть Ирландия, осудите это безумное предложение!"
ire_monarch.14.b: "Мы - наследники Соединённого Королевства, одобряйте это предложение!"

ire_monarch.15.t: "Ирландия провозглашает себя наследницей Соединённого Королевства"
ire_monarch.15.d: "Потрясая весь мир, недавно восстановленное Королевство Ирландия объявило о внесении изменений в свою конституцию. Хотя обычно это довольно стандартная процедура, среди изменений, которые значительно укрепили ирландскую демократию, было объявление о том, что страна является правопреемницей Соединённого Королевства. Заявив, что Соединённое Королевство прекратило своё существование после успеха Британской революции, Ирландская монархия утверждает, что поскольку Ирландия является неотъемлемой частью Соединённого Королевства, а Ирландия - ещё одна монархия, они юридически являются единственным остатком Соединённого Королевства. Отбросив изгнанников в Канаде как претендентов, Ирландия заявила о своих правах на Британские острова, что вызвало всеобщее осуждение. Какое влияние окажет это решение на судьбу Британских островов, ещё предстоит выяснить."
ire_monarch.15.a: "Эрин гоу браг!"
ire_monarch.15.b: "Они же не могут быть серьезными?"

ire_monarch.16.t: "Возвращение родового замка"
ire_monarch.16.d: "Построенный в XIII веке, замок Данлюс служил резиденцией графов Антрим, пока Макдоннеллы не обеднели в результате битвы при Бойне. На протяжении столетий замок лежал в руинах, его посещали только любопытные туристы или он был разграблен. Наряду с этим, город Данлюс, который когда-то считался одним из самых современных городов Европы, был снесен с лица земли, что ещё больше способствовало упадку замка. Однако с приходом Макдоннела на ирландский трон пришло время изменить ситуацию. Под Королевским патронажем были наняты различные строительные компании для восстановления Данлюса до его былой славы. Несмотря на то, что сроки работ варьируются от нескольких лет до десятилетия, Его Величество непреклонен в том, что замок должен быть восстановлен.  Несмотря на то, что он принадлежит ему по праву, Его Величество также заявил, что после завершения работ замок будет служить своего рода музеем. Посвятив себя истории Ирландии и борьбе ирландцев за свободу, Король начал собирать различные исторические артефакты, которые будут выставлены в восстановленном замке. Несмотря ни на что, замок Данлюс спустя почти четыреста лет снова будет гордо и непоколебимо стоять на берегах Антрима."
ire_monarch.16.a: "Замок Данлус пал ни перед кем!"

ire_monarch.17.t: "Возрождение по-Королевски"
ire_monarch.17.d: "Хотя Её Высочество, Анжела Макдоннелл, предпочитает держаться подальше от политических заголовков, она не является бездействующей силой в жизни Ирландии. Художник по профессии, Королева Ирландии начала использовать своё высокое положение, чтобы выступать в качестве покровителя ирландского искусства. Будь то выделение денег на обучение молодых художников в художественной школе, пожертвования различным художественным институтам или просто создание собственных работ, Королева вдохнула новую жизнь в ирландское искусство. Наряду с этим, она взяла под своё крыло многих молодых художников, лично обучая их ваянию. Хотя её усилия всё ещё находятся в зачаточном состоянии, ирландская культура, несомненно, будет процветать под пристальным вниманием Анжелы Антрим."
ire_monarch.17.a: "Тост за Королеву!"

ire_monarch.18.t: "Вторая славная революция"
ire_monarch.18.d: "После долгой и упорной борьбы мы сделали это. Англия пала, и Ирландия должна отплатить нам за десятилетия угнетения. Хотя англичане и их «Армия свободной Англии» борются с нашим справедливым правлением, они не смогут остановить нас. С Англией покончено, и никогда больше она не будет угрожать миру». Учитывая это, а также то, что законное правительство Соединённого Королевства возвращает себе свои земли, пришло время должным образом короновать законного короля Англии. Вестминстер должен быть подготовлен, а Король коронован как Король Шотландии, Уэльса и Англии. Английский народ узнает, каково это - иметь иностранного короля, как они заставили нас. Хотя до настоящей коронации ещё несколько месяцев, в ходе подготовки Король потребовал от парламента отменить Акты о верховенстве и восстановить католическую церковь в Англии. Несмотря на это, возник последний вопрос о судьбе Британских островов. Хотя ирландское отделение Англии - дело решенное, встал вопрос о том, где именно будет находиться наша столица. Хотя большинство ожидает, что столица Соединённого Королевства останется в Дублине, где она и была, звучат призывы вернуть столицу в Лондон. Очевидно, что это не самая популярная идея, но Лондон уже давно является столицей Британии, и что может быть лучше для англичан, чем то, что ирландский Король будет сидеть в их некогда гордой столице? Как бы то ни было, ожидается, что Король прояснит этот вопрос о столице, тем более что коронация уже не за горами."
ire_monarch.18.a: "Дублин останется столицей, англичане могут гнить."
ire_monarch.18.b: "Лондон в качестве столицы будет прекрасным способом напомнить англичанам об их месте." 

ire_monarch.19.t: "Заминка в плане"
ire_monarch.19.d: "Хотя президент де Валера и его союзники в парламенте начали процесс восстановления ирландской монархии, дойдя до провозглашения так называемого «ирландского регентства», похоже, что не все в стране одобряют этот план. Действительно, члены Даиля, которые ранее принадлежали к Шинн Фейн, лояльной к антииракской ИРА, но баллотировались на выборах после Белфастского соглашения, а также многие члены бывшего Совета армии выступили с совместным заявлением, осуждающим этот шаг. В заявлении протестующие назвали да Валера тираном, обвинили его в том, что он пригласил британцев вернуться, и заявили, что они будут бороться за восстановление, если понадобится, до смерти, чтобы сохранить Ирландию свободной. В связи с этими протестами многие союзники де Валера и, предположительно, сам президент начинают сомневаться в реставрации. В связи с этим многие задаются вопросом, не следует ли просто отказаться от всего проекта реставрации и сохранить республику. В качестве альтернативы, некоторые настаивают на том, чтобы президент обратился к этим людям. В конце концов, разве не Пирс хотел, чтобы Ирландия была гэльской монархией? Кроме того, Ирландия должна сохранить свою демократическую систему, просто под присмотром короля. Конечно, этих людей можно просто игнорировать. Они составляют лишь меньшинство в парламенте, а реставрация поддерживается основной партией. В любом случае, решение остаётся за де Валерой."
ire_monarch.19.a: "Прислушаться к протестам и тихо прекратить Реставрацию."
ire_monarch.19.b: "Ирландский монархизм не является чем-то новым, и мы напомним им об этом."
ire_monarch.19.c: "БАХ! Я буду делать все, что захочу, я презитент!"

ire_monarch.20.t: "Возрождение Ирландской республиканской армии"
ire_monarch.20.d: "После того, как президент де Валера внял озабоченности и протестам республиканских секций парламента и старого Совета армии, выяснилось, что их угрозы насилия в борьбе с монархизмом были не праздными. В таком же совместном заявлении, как и раньше, Совет армии отменил свой собственный роспуск и реформировался, а около трети действующих членов Даиля вышли из парламента в знак протеста. В отличие от ИРА, которая образовалась в результате раскола из-за англо-ирландского договора, эта новая ИРА не претендует на легитимность. Действительно, в своем учредительном манифесте ИРА ясно дает понять, что Ирландская Республика восстановлена, но действия президента де Валера в попытке восстановить монархию перешли черту. Чтобы сохранить свободу и демократию Ирландии, они должны снова взять в руки оружие, и они не сложат его, пока де Валера и его лже-Король не будут сброшены.\n\n\nВвиду предполагаемой народной поддержки реформированной ИРА, многие в правительстве опасаются, что в отличие от той балаганной группы, с которой имел дело Коллинз, де Валера может прибегнуть к беспрецедентным мерам, чтобы действительно подавить этих террористов. Если мы этого не сделаем, предупреждает группа, существует очень большая вероятность того, что ИРА сможет успешно свергнуть наше правительство. В то время как группа вполне уверена в себе, президент, похоже, не так уверен. В конце концов, их не более 2000 тысяч человек, и большинство уже служит в самой армии. Зачем рисковать непопулярностью и затратами ради простого крестьянского бунта?"
ire_monarch.20.a: "Используйте все, что у нас есть, чтобы защитить возрожденное Королевство!"
ire_monarch.20.b: "ИРА никогда не была большой угрозой, просто присмотрите за ними."

ire_monarch.21.t: "Триумф Ирландской республиканской армии"
ire_monarch.21.d: "В момент, который история будет называть одним из самых просчитанных моментов в ирландской политике, президент де Валера вместе с большей частью парламента был задержан в результате бескровного переворота ИРА. Прибыв в Дублин глубокой ночью, как раз когда де Валера заканчивал речь о славе монархии на совместном заседании Даиля и Сеанада, ИРА смогла окружить весь город. Когда они начали окапываться, часть Республиканской армии окружила Лейнстер Хаус и успешно арестовала де Валера и многих членов обеих палат. Теперь, когда истинная Ирландская Республика снова свободна от попирания, возник вопрос, что дальше? nВ то время как в дни, предшествовавшие Белфастскому соглашению, ИРА ставила перед собой цель восстановить Республику 16, эта цель была достигнута. Теперь, когда де Валера отстранен от власти, ИРА стоит на перепутье, как никогда раньше. Обладая властью над всей нацией, Совет Армии имеет возможность изменить Ирландию по своему усмотрению, и поэтому созвал экстренное совещание.\n\nВскоре становится ясно, что среди небольшого Совета, 4 позиции имеют реальные шансы быть принятыми. Первый вариант, который многие считают наиболее логичным, - это назначение к власти Шинн Фейн под руководством Катала Бруги. Шинн Фейн уже давно тесно связана с ИРА, и большинство членов ИРА принадлежат к этой партии, поэтому назначение их во многом было бы логичным. В качестве альтернативы также рассматривалась кандидатура Пидара О'Доннелла и Саор Эйре, социалистической националистической партии, созданной членами ИРА. Будучи далекими от популярности Шинн Фейн, многие члены Саор Эйре начинали свою карьеру в ИРА, и они были полезным союзником в борьбе против Свободного государства. Также на тапл выносится предложение просто править самим. Ирландия освобождалась ИРА бесчисленное количество раз, и если де Валера что-то и доказывает, так это то, что ирландский народ не готов к полной демократии. Основываясь на КМТ, основанной доктором Суном, эта позиция предполагает, что Совет Армии будет руководить Ирландией, пока народ не будет готов к республиканству. Наряду с этим, мы должны были бы преобразовать Шинн Фейн в Куманн на Поблачта, чтобы действовать как партия для всего народа. И наконец, что многие считают наименее вероятным, это просто повторное назначение де Валера на пост президента. Несмотря на то, что де Валера действительно радикален и именно благодаря ему ИРА была вынуждена реформироваться, в этом есть своя логика. Де Валера - первый всеирландский избранный президент в истории Республики, и хотя да, он пытался восстановить монархию, он всё ещё является законным президентом, и поэтому ему следует позволить, по крайней мере, доработать свой срок, если народ не хочет, чтобы он остался. Если он не будет назначен, было решено, что судьбой де Валера будет изгнание, судьба, достойная такого предателя.\n\nПосле того, как дебаты на собрании закончились, в рядах Совета Армии были проведены голосования. После подсчета голосов стало ясно, что Совет проголосовал за..."          
ire_monarch.21.a: "...назначен Кахал Бру и Шинн Фейн."
ire_monarch.21.b: "...назначен Падар О'Доннелл и Саор Эйре."
ire_monarch.21.c: "...назначен себя и Куманн-на-Поблахта."
ire_monarch.21.e: "...назначен Имон де Валера, позволяя ему досидеть до конца срока."

ire_monarch.22.t: "Ирландские смуты"
ire_monarch.22.d: "Президент-регент Ирландии де Валера подтвердил, что в его стране группа республиканцев, известная как Ирландская республиканская армия, вступает в столкновения с правительственными войсками. Наряду с этим были подтверждены случаи взрывов в городах Ирландии. В связи с угрозой, исходящей от ИРА, ирландское правительство издало несколько жестких законопроектов о безопасности, направленных на подавление ИРА и устранение любой народной поддержки. Из-за огромных масштабов попыток правительства подавить ИРА, ожидается, что эти так называемые «смутные времена» не продлятся дольше нескольких рот. В любом случае, похоже, что эра борьбы в Ирландии ещё не закончилась."
ire_monarch.22.a: "Мы сокрушим этих террористов!"
ire_monarch.22.b: "Республиканцы говорят голосом народа!"
ire_monarch.22.c: "Многовато насилия для такого маленького острова."

ire_monarch.23.t: "Возрождение Ирландского Королевства"
ire_monarch.23.d: "Сегодня президент Ирландской Республики Эймон де Валера объявил, что в ближайшие недели и уста Ирландия будет преобразована из республики в монархию. По сути, должность президента будет заменена на должность монарха, при этом демократические институты Ирландии останутся в полной силе и власти. Интересно, что президент не указал, кто займет ирландский трон. Действительно, похоже, что даже президент не знает, хотя было подтверждено, что список действительно существует. Чтобы отразить это, Ирландия объявила себя регентством, хотя ожидается, что этот период продлится недолго. В любом случае, Ирландия вступает в ряды различных монархий мира, к лучшему или худшему."
ire_monarch.23.a: "Вперёд, мэр an Rí!"
ire_monarch.23.b: "Реакционеры все дальше погружаются в безумие."  
ire_monarch.23.c: "Хорошо для них."

ire_monarch.24.t: "Конец Ирландского Королевства"
ire_monarch.24.d: "Королевству Ирландия пришел конец так же быстро, как оно было создано. После переворота, совершенного республиканскими элементами, была восстановлена Республика и создано временное правительство. Местонахождение президента Эмона де Валера в настоящее время неизвестно, хотя подтверждено, что он находится под стражей. В то время как многие в Ирландии опечалены потерей шанса на монархию, многие другие рады возвращению республиканства. Однако большинство населения Ирландии, похоже, просто хочет стабильности, будь то Король или не Король. Сможет ли недавно восстановленное республиканское правительство действительно принести стабильность в Ирландию, или это просто следующая кровавая глава в ирландской истории, ещё предстоит увидеть."
ire_monarch.24.a: "Erin go Bragh"
ire_monarch.24.b: "Славная победа над режимом!"
ire_monarch.24.c: "Похоже, в Ирландии есть вращающаяся дверь."

ire_monarch.25.t: "Панкельтское будущее Королевства"
ire_monarch.25.d: "Земли кельтов Британских островов прочно объединены в единое государство, и Королевство теперь принимает идеалы пан-кельтизма в качестве официальной политики, однако точная природа и масштабы этой политики остаются неясными. Чтобы внести ясность в нашу вновь обретенную идентичность, Его Величество, Яков III, созвал экстренное заседание кабинета министров для решения этой назревающей проблемы. По большому счету, большинство просто хочет, чтобы мы оставались кельтским государством на Британских островах, чтобы принести превосходство культуры кельтов над вероломными саксами. Другие, желая более мирного сосуществования, хотят, чтобы новое кельтское государство действовало как союз кельтов и саксов, которые называют эту землю домом, объединённых под властью Его Величества Короля. Немногочисленные избранные настаивают на том, чтобы мы полностью приняли пан-кельтизм и работали над полным объединением всех ныне живущих кельтских народов. Меньшая часть этой группы желает, чтобы мы пошли дальше, чем просто пан-кельтизм, и приняли претензии нашего короля на французский трон. Так же, как Яков III претендует на троны Ирландии, Англии, Шотландии и Уэльса, он также претендует на троны Франции, как и его предки. Свои панкельтские взгляды они обосновывают как возвращение земель Галлии. Ещё меньшая часть, в основном состоящая из тех, кто в первую очередь принял призыв якобитизма, желает, чтобы мы тихо свернули пан-кельтизм и вновь обрели свою идентичность как истинное правительство Соединённого Королевства. Очень небольшая часть этой и без того крошечной группы желает, чтобы мы пошли дальше, отбросив пан-кельтизм, но продвигая претензии Якова на Францию, реформируя Анжуйскую империю. Поскольку кабинет министров зашел в тупик, задача определения панкельтизма ложится на плечи одного лишь короля."  
ire_monarch.25.a: "Королевство кельтов должно стоять на все времена!"
ire_monarch.25.b: "Союз двух бриттских народов должен восстать!"
ire_monarch.25.c: "Все кельты должны быть объединены!"
ire_monarch.25.e: "Все кельты и земли Галлии должны быть освобождены!"
ire_monarch.25.f: "Пан-кельтизм был ошибкой, мы должны восстановить Великобританию!"
ire_monarch.25.g: "Пан-кельтизм - это слишком далеко, вместо этого мы работаем над возрождением Анжуйской империи!"

ire_monarch.26.t: "ИМС протестует против результатов выборов"
ire_monarch.26.d: "Поскольку Раймонд Моултон О'Брайен занял заметное положение в Ирландском монархическом обществе и в партийной структуре FF благодаря своему назначению Эймоном Де Валерой, у Фанна Фаил, находящейся под влиянием интегралистов, может появиться шанс исправить своё поражение на выборах, если им удастся склонить на свою сторону Ардри на Хейреанн. Безумные бредни О'Брайена, бурные протесты и способность харизматично сбивать с толку и убеждать начали работать на их пользу, поскольку ИМС взывает к «Божьей правде», которая должна служить здесь, в Ирландии, под короной, а не переменчивым капризам масс. О'Брайен и его буйные союзники и собратья по Интегралистскому движению призывают самого Короля отменить действительность недавних демократических выборов, чтобы «защитить» нацию от идеологий, которые они считают коррозийными и несправедливыми, вместо этого призывая Ард-Ри полностью принять своё абсолютное божественное право Верховного Короля Ирландии при поддержке возрожденной Фианна Файл Валера, подпитываемой ирландской интегралистской философией О'Брайена. Однако, склонится ли Верховный Король к такому антидемократическому и неконституционному предложению, чтобы создать интегралистскую Ирландию, ещё предстоит увидеть..."
ire_monarch.26.a: "Король служит Конституции и народу, а не Фианна Файл!"
ire_monarch.26.b: "Мы не можем доверить ирландскую монархию никому, кроме Валеры!"

ire_monarch.27.t: "ИМС пытается захватить трон"
ire_monarch.27.d: "Набрав слишком много власти под Эмоном де Валерой и Фианна Файл, интегралистская группа, известная как Ирландское монархическое общество, попыталась захватить контроль над Ирландией изнутри, поскольку её не в себе лидер Раймонд Моултон О'Брайен работает со своими новыми союзниками - бывшими членами таких групп, как Голубые рубашки, собственный Чёрный легион О'Брайена - с целью создания интегралистской Ирландии, поддерживаемой католическим корпоративизмом, модернизированным неофеодализмом, децентрализованным мутуализмом, гильдиями и меркантильной местной экономикой, гэльским национализмом и традиционалистским абсолютизмом под управлением кланов, верховного короля и партии, наряду с другими политиками, вдохновленными маврами Франции и лузитанскими интегралистами Португалии. Стремясь короновать своего кандидата в качестве нового Ардри на Хейреанн, считая нынешнего короля незаконным и слабым предателем традиционного Эйре, эта широкая коалиция консервативных и реакционных групп, объединённых под интегрализмом О'Брайена и Короной Ирландии, имеет один шанс достичь своей цели, и теперь нация ждет с затаенным дыханием, чтобы увидеть, какая фракция выйдет на первое место."
ire_monarch.27.a: "Переворот эффектно проваливается, полностью дискредитируя О'Брайена и интегралистов."
ire_monarch.27.b: "Переворот удается, и О'Брайен приходит к власти как глашатай ирландского интегрализма!"

ire_monarch.28.t: "Благородная кровь О'Брайена"
ire_monarch.28.d: "В попытке успокоить общественные волнения и заверить массы в том, что Раймонд О'Брайен действительно законно претендует на пост Ард-Ри Ирландии, правительство IMS выпустило публичное заявление, в котором подробно описывается предполагаемая родословная короля. Согласно документам, Раймонд является родственником знатного пэрского рода О'Брайенов из Тумонда, который ведет своё начало от Мерроу О'Брайенов как отколовшийся дом от первоначального Дома О'Брайенов, прославленного самым известным и великим королем Ирландии Брианом Бору. Однако, как именно он связан с этой престижной линией, не совсем ясно: известные члены графства Тумонд умерли, а основные члены более широкого клана О'Брайенов не знают ни о Раймонде, ни о каких-либо доказательствах в своих обширных записях, подтверждающих его притязания, но при этом судебная система Мексики поддерживает его притязания как настоящего графа Тумонда после краткого пребывания там несколько лет назад. Тем не менее, О'Брайен заявил, что большинство коронованных особ и республик по всему миру признали его претензии, несмотря на то, что ни одна из них не предложила своей официальной поддержки, и несмотря на то, что некоторые из государств, названных О'Брайеном, больше не существуют. Несмотря на эти мелкие неудачи, Раймонд и правительство убеждены, что он действительно Королевского происхождения. Уклоняясь от любых вопросов и сомнений по этому поводу, Верховный Король даже недавно убегал от репортеров, чтобы избежать их вопросов о своей родословной, показывая якобы поддельные документы, в которых говорится, что Раймонд - всего лишь нищий, выживший из ума, и играет в притворство. Какой бы ни была правда, невозможно изменить реальность, что этот человек, кем бы он ни был и независимо от того, с кем он на самом деле связан, теперь является Верховным королем Ирландии и вестником нашей новой интегралистской реальности."
ire_monarch.28.a: "Источники? Просто поверьте мне."

ire_monarch.29.t: "Природа ирландского интегрализма"
ire_monarch.29.d: "По мере того, как Ирландское монархическое общество продвигает интегралистскую реформацию под руководством Раймонда О'Брайена, необходимо сделать выбор, на какой форме интегрализма следует сосредоточиться больше всего, между мавританской мыслью французского происхождения и лузитанским интегрализмом Португалии. Хотя оба они содержат аспекты национального синдикализма, децентрализованного авторитаризма, христианского доминирования и католического социального учения, национализма, традиционализма без консерватизма, классового сотрудничества, корпоративистской экономики и многого другого, они отличаются в некоторых мелочах, которые в значительной степени определят, будем ли мы в ближайшие годы приближаться к Лиссабону или Алжиру. В качестве альтернативы, мы можем пойти на компромисс и решить идти своим собственным средним путём к истинной интегралистской утопии, построенной на клановой системе, нашей собственной изолированной католической церкви и концепции гэльского национализма, не полагаясь на усталые писания и бредни иностранцев, чуждых ирландскому опыту. Каким должен быть наш путь?"
ire_monarch.29.a: "Склониться к португальскому лузитанскому интегрализму."
ire_monarch.29.b: "Склоняться к французскому мавританскому интегрализму."
ire_monarch.29.c: "Поддерживать баланс между этими двумя направлениями с помощью компромисса, ориентированного на традиции."

ire_monarch.30.t: "Судьба гражданского правительства ИРА"
ire_monarch.30.d: "Ещё до нашего прихода к власти ИРА имела глубокие связи с демократическими социалистами в Шинн Фейн. Однако ни для кого не секрет, что наша стратократическая и популистская хунта, несмотря на нашу прогрессивную политику, является, мягко говоря, менее чем достаточно демократичной, а поскольку в наших рядах вновь усиливаются националистические и радикальные тенденции, многие считают, что нам пора найти нового союзника в гражданском правительстве - и большинство в основном кивает на Сан-Эйре. Многие из новобранцев ИРА больше симпатизируют этим огнепоклонникам, чем старой гвардии SF, поддерживавшей ИРА на протяжении десятилетий, что открывает путь к новым союзникам и освежающему революционному взгляду на идеологию социалистической хунты, если мы готовы отбросить старых союзников и тонкую оболочку справедливого демократического процесса. Так что теперь мы стоим перед выбором: останемся ли мы с «демократическим» социалистическим фасадом наших старых союзников в Шинн Фейн или полностью перейдем к левому национализму и антибританскому социалистическому радикализму Сао-Эйре?"
ire_monarch.30.a: "Мы стоим на стороне Шинн Фейн, сейчас и навсегда"
ire_monarch.30.b: "Мы дрейфуем к нашим новым радикальным союзникам в Сао-Эйре"

# Ideas
IRE_black_monday_1:0 "Чёрный понедельник"
IRE_black_monday_1_desc:0 "Кризис Чёрного понедельника особенно тяжело ударил по Ирландии из-за её зависимости от торговли с Германией после Британской революции, когда страна разорвала связи с Антантой на фоне падения Британии под власть синдикалистов."
IRE_black_monday_2:0 "Чёрный понедельник"
IRE_black_monday_2_desc:0 "Хотя кризис Чёрного понедельника всё ещё оказывает серьёзное влияние на Ирландию, худшее уже позади, а ирландская экономика вступила на путь восстановления."
IRE_black_monday_3:0 "Чёрный понедельник"
IRE_black_monday_3_desc:0 "По мере восстановления Ирландии последствия Чёрного понедельника начинают ослабевать, хотя до полного преодоления кризиса ещё далеко."
IRE_black_monday_4:0 "Чёрный понедельник"
IRE_black_monday_4_desc:0 "Ирландская экономика начинает восстанавливаться, и хотя впереди ещё немало работы, конец этого долгого пути уже виден."
IRE_black_monday_5:0 "Чёрный понедельник"
IRE_black_monday_5_desc:0 "Хотя кризис Чёрного понедельника стал тяжёлым временем для Ирландии, его последствия почти сошли на нет, и свет в конце туннеля уже виден."
IRE_BRTISHARMY:0 "Армия Свободной Англии"
IRE_BRTISHARMY_desc:0 "Из-за продолжающихся трудностей с интеграцией английских земель англичане подняли восстание против нашей власти. Хотя они не представляют достаточно серьёзной угрозы, чтобы вытеснить нас из страны, их постоянные нападения остаются занозой для нашей администрации. Армия Свободной Англии, а точнее целый ряд подобных армий, состоит как из синдикалистских республиканцев, так и из немногочисленных сторонников Виндзоров и не остановится ни перед чем, пока ирландскому господству над Англией не будет положен конец."

IRE_s_plan:0 "«План S»"
IRE_s_plan_eng:0 "Взрывы на британской земле"
IRE_s_plan_eng_desc:0 "Неизвестная сила финансирует серию взрывов по всему архипелагу. Считается, что за ними при поддержке наиболее радикальных членов правительства стоит Ирландия. Взрывы происходят в случайное время и без предупреждения, а мы практически бессильны их остановить."
# Aodh XI death
ire.241.t:0 "Смерть Хьюго О'Нила"
ire.241.d:0 "Аод XI, наш новый верховный король, сегодня скончался. Его сын Жорже Мария О'Нил будет коронован под тронным именем Шорше I."
ire.241.a:0 "Верховный король мёртв, да здравствует верховный король!"

