### Ideas ###
IRISH_PROFITS: "Ирландская прибыль"
IRISH_PROFITS_desc: "Наши предприятия в Дублине процветают, и мы получаем доход."
IRE_DUBLIN_SUCCESS: "Дублин возрождён"
IRE_DUBLIN_SUCCESS_desc: "Дублин стал одним из крупнейших финансовых центров в мире, что позволило нам утяжелить наш экономический вес и заключать более выгодные торговые сделки."

### Individual Events ###
ire.71.t: "Ирландский флирт с немецким бизнесом"
ire.71.d: "Сегодня до нас дошли вести о том, что ирландцы делают всё возможное ради продвижения недавно модернизированного Дублина в качестве перспективного центра торговли и финансов. С нами связались из Ирландии и попросили предложить нашим крупнейшим промышленным компаниям открыть свои филиалы в их столице. Естественно, мы воспользуемся некоторыми преимуществами этой договорённости, которые могут быть весьма прибыльными в долгосрочной перспективе. И, само собой, это будет также выгодно для ирландцев."
ire.71.a: "Немецкий бизнес должен оставаться немецким."
ire.71.b: "Ирландцы - наши друзья. Разумеется мы это поддерживаем."
ire.71.c: "Мы оба заработаем денег. Это не может повредить, не так ли?"
ire.71.e: "Мы воюем, нам сейчас не до инвестиций."
ire.72.t: "Германский ответ"
ire.72.d: "Наша попытка флирта с немецким бизнесом оказалась успешной. Известный производитель вооружений, концерн 'Крупп', объявил об организации своей дочерней компании в Дублине. Дублин продолжает расширяться, и наше население, несомненно, будет радо этому."
ire.72.d1: "Наша попытка флирта с немецким бизнесом, к сожалению, провалилась. Немцы решили сделать более протекционистский подход к своей промышленности и запретили любые инвестиции в Дублин."
ire.72.d2: "Наша попытка флирта с немецким бизнесом, к сожалению, провалилась. В связи с тем, что они сейчас в состоянии войны, они не могут участвовать в каких-либо инвестициях."
