### Ideas ###
IRE_DEFENCE:0 "Защита Республики"
IRE_DEFENCE_desc:0 "После 700 лет британского владычества ирландский народ наконец обрёл независимость. Однако Британия и Канада по-прежнему угрожают Ирландии, и если дело дойдёт до войны, ирландцы должны быть готовы сражаться, используя превосходное знание местности и решимость защитить свою свободу."
IRE_IEAA_INDUSTRY:0 "Ежегодный приоритет IEAA: Индустриализация"
IRE_IEAA_RND:0 "Ежегодный приоритет IEAA: Исследования и разработки"
IRE_IEAA_WR:0 "Ежегодный приоритет IEAA: Права рабочих"
IRE_IEAA_ELEC:0 "Ежегодный приоритет IEAA: Электроника"

IRE_Ulster_Issue: "Ольстерский вопрос"
IRE_Ulster_Issue_desc: "Территория Ольстера находится под контролем Ирландской Республики с тех пор, как Британия пала в результате революции. И хотя мы пытались полноценно включить её в состав Ирландии, местное население не приняло это без сопротивления. Статус Ольстера остаётся одним из самых спорных вопросов ирландской политики, и если Изумрудный остров хочет избежать вооружённого внутреннего конфликта, ольстерской проблеме необходимо найти окончательное решение."
IRE_Unraveling_Political_Scene: "Распадающаяся политическая система"
IRE_Unraveling_Political_Scene_desc: "С момента основания свободной республики «Фине Гэл» почти безраздельно господствовала в демократической политической системе Ирландии, однако в последние годы это начало меняться. Старый противник Коллинза Имон де Валера постепенно усиливает своё влияние по мере ухудшения экономического положения при правлении Коллинза. С ослаблением «Фине Гэл» насильственные столкновения между сторонниками «Фине Гэл» и «Фианна Файл» становятся всё более частыми. Рост политического насилия привёл к заметному увеличению популярности «Шинн Фейн», поскольку идеи Катала Бру становятся всё привлекательнее для масс, а сама партия представляет себя мирным третьим путём между де Валерой и Коллинзом. Кроме того, социалисты самых разных направлений постепенно пробивают себе путь к политической значимости, во многом благодаря поддержке Британского Союза и американской SPA. С учётом всего этого выборы 1937 года обещают стать самыми напряжёнными за последние годы, и если «Фине Гэл» хочет сохранить своё бесконтрольное господство, ей придётся доказать народу Ирландии готовность преобразовать застывшую экономическую и политическую систему страны, чтобы раз и навсегда положить конец Смуте."
IRE_Threat_Across_Isle: "Угроза по ту сторону моря"
IRE_Threat_Across_Isle_desc: "Многие надеялись, что Британская революция положит конец британскому империализму в Ирландии. Однако новое синдикалистское правительство в Лондоне в своём стремлении контролировать ирландские дела оказалось почти ничем не лучше прежних роялистов. Когда-то мы считали империализм лишь следствием монархического устройства Британии, но синдикалисты продолжают использовать всё те же старые роялистские приёмы, и теперь нам приходится признать неизбежный вывод: стремление подчинить наш Изумрудный остров заложено в самой крови англичан. Всё больше людей убеждены, что наше соперничество с Лондоном закончится лишь тогда, когда Британия будет окончательно стёрта с лица земли."

IRE_10_point_plan: "«Десятипунктная программа»"
IRE_10_point_plan_desc: "«Шинн Фейн» решила поддержать Лиама Меллоуза и приступить к осуществлению его «Десятипунктной программы». Она предусматривает передачу государству контроля над важнейшими отраслями промышленности и транспортными системами, конфискацию крупных ранчо и поместий, установление контроля над условиями труда на предприятиях, расширение муниципальных общественных услуг, отмену любой арендной платы и введение нормирования жилищного фонда, а также выплат безработным. Помимо этого, было предложено всеобщее вооружение рабочих."

IRE_Post_Collins_Assasination: "Хаос после убийства Коллинза"
IRE_Post_Collins_Assasination_desc: "Ирландию постигла трагедия: герой ирландской независимости и человек, проведший нашу страну через самые тяжёлые испытания, был жестоко убит. Хаос, последовавший за его смертью, буквально разрывает остров по швам и может погубить новое правительство, если ситуацию не удастся взять под контроль."

IRE_anti_socialist_resistance: "Сопротивление новому режиму"
IRE_anti_socialist_resistance_desc: "У нового социалистического правительства Ирландии немало противников, а слепые сторонники старого порядка устраивают беспорядки на каждом шагу. Если с этими реакционерами не разобраться организованно, они могут задушить ирландскую революцию ещё до того, как она успеет начаться."

IRE_new_ireland: "Новая, Красная Ирландия"
IRE_new_ireland_desc: "Реакционные мятежники стремительно ликвидируются, и мы окончательно закрепили власть над Изумрудным островом. Вскоре наша страна станет красным раем для рабочего, свободным от оков капиталистического и империалистического угнетения."

IRE_Secret_Police_idea: "Coimisiún an Phobail um Ghnóthaí Inmheánacha"
IRE_Secret_Police_idea_desc: "Хотя товарищ Гралтон усердно трудился над превращением Ирландии в пролетарский рай, многие в стране по-прежнему цепляются за прошлое и готовы любой ценой сопротивляться новому порядку Гралтона. Чтобы ослабить давление, создаваемое этими предателями, Ceannasaí санкционировал создание Coimisiún an Phobail um Ghnóthaí Inmheánacha - ведомства, полномочия которого выходят далеко за рамки обычной правовой системы."

IRE_SF_Coalition: "Коалиция «Фине Гэл» и «Шинн Фейн»"
IRE_SF_Coalition_desc: "«Фине Гэл» сформировала коалицию с «Шинн Фейн» и в обмен согласилась провести часть её политики в поддержку рабочих."

IRE_NCP_Coalition: "Коалиция «Фине Гэл» и Партии национального центра"
IRE_NCP_Coalition_desc: "«Фине Гэл» сформировала коалицию с Партией национального центра и в обмен согласилась провести часть её политики в поддержку фермеров."

IRE_Minority_Govt: "Правительство меньшинства «Фине Гэл»"
IRE_Minority_Govt_desc: "«Фине Гэл» не получила большинства в Дойле, что значительно затрудняет проведение её политики."

IRE_Republican_Legal_System: "Республиканская правовая система"
IRE_Republican_Legal_System_desc: "С момента своего создания ирландская правовая система строилась на республиканских принципах. Теперь нам предстоит перестроить её так, чтобы она должным образом соответствовала монархическому устройству."

IRE_False_King_Resistance: "Сопротивление сторонников ложного короля"
IRE_False_King_Resistance_desc: "Сторонники свергнутого [IREGetFormerKing] подняли шум вокруг «незаконной узурпации престола» Рэймондом Моултоном О'Брайеном. С этими предателями необходимо разобраться как можно скорее, пока они не превратились в куда более серьёзную проблему."

IRE_Organic_Ireland_Idea: "Органическая Ирландия"
IRE_Organic_Ireland_Idea_desc: "Несмотря на глубоко католическую природу нашего общества, интегралистская философия никогда не получала в Ирландии такого распространения, как в Иберии или Франции - по крайней мере до сегодняшнего дня. Под руководством IMS и Рэймонда О'Брайена новой органической монархией правит исключительно католическая Ирландия, объединяющая маurrассианскую и лузитанскую интегралистские философии с американскими представлениями о христианском национализме и ирландскими идеями гэльского возрождения, создавая децентрализованную и абсолютистскую систему, ранее невиданную в Ирландии. Опираясь на возрождённую клановую систему, корпоративную экономику и растущую систему гильдий, ирландский национализм, антисоциализм, антикапитализм и крайние учения наиболее радикальных приверженцев Католической церкви, наша новая монархия принесёт благочестивое процветание всем истинным сынам и дочерям Ирландии под властью Короны."

IRE_New_Constitution_idea: "Новая конституция"
IRE_New_Constitution_idea_desc: "Решив отойти от первоначальной Конституции Ирландского Свободного государства, принятой в 1922 году, правящее правительство постановило разработать новую Конституцию Ирландии, или Bunreacht na hÉireann. Провозглашая национальный суверенитет ирландского народа, этот документ станет основой нашей реформированной демократической системы, закрепляя традиции нашей демократии и одновременно гарантируя основные права, существование и полномочия двухпалатного парламента Oireachtas, разделение властей между ветвями правительства с системой сдержек и противовесов, а также независимость судебной власти и судебный надзор. На основе этого документа мы построим более сильную и единую ирландскую демократию."

IRE_landlordism_decay: "Упадок лендлордизма"
IRE_landlordism_decay_desc: "Благодаря постепенному ужесточению регулирования аренды недвижимости и расширению прав арендаторов многие бывшие лендлорды оказались вынуждены покинуть этот рынок. Однако практика частной сдачи собственности в аренду полностью не исчезла, и значительное число владельцев продолжает заниматься ею, несмотря на возможную нестабильность, которую могут вызвать дальнейшие ограничения."
IRE_road_modernisation: "Модернизация дорог"
IRE_road_modernisation_desc: "Исторически многие дороги Ирландии представляли собой не более чем простое макадамовое покрытие, что серьёзно ограничивало возможности развития страны. Пытаясь решить эту проблему, ирландское государство начало масштабную модернизацию основных дорог и городских улиц. Переводя многие из них на гудронированный макадам и асфальт, правительство надеется лучше удовлетворить потребности современной страны и её работников."
IRE_rural_infrastructure: "Развитие сельской инфраструктуры"
IRE_rural_infrastructure_desc: "Бесчисленные сельские дороги Ирландии на протяжении веков оставались единственными связями между многочисленными деревнями и фермами, поддерживавшими жизнь страны. Однако большинство этих дорог всегда представляло собой не более чем хорошо протоптанные грунтовые пути, поэтому ирландское правительство начало масштабный проект по развитию сельской инфраструктуры, от которой зависит столь значительная часть населения."
IRE_reinforce_the_gaeltachtai: "Укрепление Гэлтахтов"
IRE_reinforce_the_gaeltachtai_desc: "Ирландское правительство ввело широкий комплекс мер, направленных на поддержку развития преимущественно ирландоязычных районов страны. Руководители этой программы надеются, что дальнейшие инвестиции в экономический рост помогут распространению ирландского языка по всей стране, поскольку экономический вклад Гэлтахтов будет всё теснее переплетаться с остальной национальной экономикой."

### Leader Traits ###
IRE_Big_Fellow: "Большой парень"
IRE_Waining_Personality: "Угасающий образ героя\n§gХотя с момента своего стремительного прихода к власти в 1921 году Коллинз довольно долго держался на волне собственной популярности, его влияние на ирландский народ постепенно ослабевает. Спустя более десяти лет многие устали от Коллинза, считая его лишь пережитком прошлого, который удерживается у власти исключительно благодаря статусу героя, а не каким-либо конкретным политическим достижениям. В условиях ухудшения экономики Ирландии Коллинзу придётся доказать народу, что ему всё ещё есть что предложить стране.§!"
IRE_True_Hero: "Истинный герой независимости"
benevolent_dictator: "Благожелательный диктатор"
IRE_Irish_King: "Истинный король Ирландии"
IRE_Ilegitimate_King: "Незаконный король"
IRE_UFOlogist: "Уфолог\n§gБринсли Ле Поэр Тренч, помимо принадлежности к нидерландскому дворянству и положения нынешнего короля Ирландии, является страстным уфологом и сторонником других «эзотерических» направлений исследований. Правительству время от времени приходится «сдерживать» увлечение короля подобными темами, чтобы он не выставил государство на посмешище.§!"
IRE_ceremonial_president: "Церемониальный президент"

### Focus Tree - IEAA ###
IRE_IEAA: "Закон об ирландском экономическом развитии"
IRE_IEAA_desc: "Несмотря на то, что мы теперь независимы, экономика нашего прекрасного острова застопорилась довольно давно, и в некоторых местах она даже разлагается. С принятием Закона об ирландском экономическом развитии (ЗИЭР), Палата представителей может решить этот жизненно важный вопрос. Пусть Ирландия мала, но люди её трудолюбивы, а городам достаточно места для расширения."
ire.ieaa.tt: "\nПримите ЗИЭР и начните рассматривать экономическое направление государства."
ire.debtscheme.tt: "\nСократит государственный долг на §Oзначительную сумму§! каждый год в дополнение к обычному."

# IEAA event - Collins in charge
ire.9.t: "Палата представителей обсуждает дальнейшие действия"
ire.9.d: "С принятием Закона об ирландском экономическом развитии (ЗИЭР), ирландское правительство обязывалось быстро провести полную реконструкцию экономики. Как и было предусмотрено в законе, правительство должно было выбрать ежегодный акцент на развитие какой-то из отраслей экономики. Майкл Коллинз, президент Республики и лидер партии 'Фине Гэл', а также Фрэнк МакДермот из Партии национального центра (NCP) считают, что Ирландия должна сосредоточиться на наращивании своей промышленности в краткие сроки. Синдикалистская коалиция во главе с Джимом Ларкиным утверждает, что лучший способ повысить продуктивность - дать больше власти профсоюзам. И, наконец, 'Шинн Фейн' предлагает сосредоточиться на промышленных исследованиях и разработках."
ire.9.a: "У Коллинза правильная идея."
ire.9.b: "Встаньте на сторону консерваторов и либералов."
ire.9.c: "Социалисты что-то замышляют."

# IEAA repeat event - Collins still in charge
ire.10.t: "Палата представителей обсуждает дальнейшие действия"
ire.10.d: "Как и год назад, Палата представителей собирается, чтобы выбрать ежегодную экономическую направленность для нации. Основные игроки на политической арене своих позиций не поменяли. Президент Коллинз всё также выступает за быструю индустриализацию и NCP его поддерживают, синдикалисты требуют лучшего отношения к рабочим, тогда как либерально-демократическая коалиция считает, что будущее Ирландии - в новых исследованиях и разработках в области индустрии."
ire.10.a: "Коллинз, как всегда, прав."
ire.10.b: "Выберем предложение 'Шинн Фейн' и 'Фианна Файл'."
ire.10.c: "Красные иногда предлагают хорошие идеи."

# IEAA event - Collins ousted
ire.11.t: "Палата представителей обсуждает дальнейшие действия"
ire.11.d: "С принятием Закона об ирландском экономическом развитии (ЗИЭР), ирландское правительство обязывалось быстро провести полную реконструкцию экономики. Как и было предусмотрено в законе, правительство должно было выбрать ежегодный акцент на развитие какой-то из отраслей экономики. Майкл Коллинз, лидер партии 'Фине Гэл', а также Фрэнк МакДермот из Партии национального центра (NCP) считают, что Ирландия должна сосредоточиться на наращивании своей промышленности в краткие сроки. Синдикалистская коалиция во главе с Джимом Ларкиным утверждает, что лучший способ повысить продуктивность - дать больше власти профсоюзам. И, наконец, 'Шинн Фейн' предлагает сосредоточиться на промышленных исследованиях и разработках."
ire.11.a: "Согласимся с демократами и либералами."
ire.11.b: "У 'Фине Гэл' и NCP правильный взгляд на ситуацию."
ire.11.c: "Синдикалисты правы."

# IEAA repeat event - Collins ousted
ire.12.t: "Палата представителей обсуждает дальнейшие действия"
ire.12.d: "Как и год назад, Палата представителей собирается, чтобы выбрать ежегодную экономическую направленность для нации. Основные игроки на политической арене своих позиций не поменяли. Коллинз всё также выступает за быструю индустриализацию и NCP его поддерживают, синдикалисты требуют лучшего отношения к рабочим, тогда как либерально-демократическая коалиция считает, что будущее Ирландии - в новых исследованиях и разработках в области индустрии."
ire.12.a: "Выберем предложение 'Шинн Фейн' и 'Фианна Файл'."
ire.12.b: "У 'Фине Гэл' и NCP правильный взгляд на ситуацию."
ire.12.c: "Красные иногда предлагают хорошие идеи."

# IEAA event - Collins ousted (syndicalist)
ire.13.t: "Палата представителей обсуждает дальнейшие действия"
ire.13.d: "С принятием Закона об ирландском экономическом развитии (ЗИЭР), ирландское правительство обязывалось быстро провести полную реконструкцию экономики. Как и было предусмотрено в законе, правительство должно было выбрать ежегодный акцент на развитие какой-то из отраслей экономики. Революционная рабочая группа считает, что Ирландия должна сосредоточиться на быстром наращивании промышленности. Ирландская рабочая лига говорит, что поощрение профсоюзов - залог роста темпов производства. И, наконец, Свободная Ирландия предлагает сосредоточиться на промышленных исследованиях и разработках."
ire.13.a: "Согласимся с 'Свободной Ирландией'."
ire.13.b: "Революционная рабочая группа предлагает хорошую идею."
ire.13.c: "Ирландская рабочая лига права."

# IEAA repeat event - Collins ousted (syndicalist)
ire.242.t: "Палата представителей обсуждает дальнейшие действия"
ire.242.d: "Как и год назад, Палата представителей собирается, чтобы выбрать ежегодную экономическую направленность для нации. Основные игроки на политической арене своих позиций не поменяли. Революционная рабочая группа выступает за быструю индустриализацию, Ирландская рабочая лига выступает за права рабочих, а 'Свободная Ирландия' - за новые исследования и разработки в области индустрии."
ire.242.a: "'Свободная Ирландия' права."
ire.242.b: "Революционная рабочая группа предлагает хорошую идею."
ire.242.c: "Согласимся с Ирландской рабочей лигой."

# Agri/Infra Wing
IRE_ARD: "Сельскохозяйственная реформа"
IRE_ARD_desc: "Сельские районы Ирландии на сегодняшний день игнорируются правительством и могут стать стартовой точкой для радикальных экономических преобразований. Наши методы ведения сельского хозяйства сильно устарели по сравнению с сельскохозяйственными революциями, происходящими в материковой части Европы, а инфраструктура ужасно отстала."
ire.ard.tt: "\nНачните процесс реформ по модернизации §Yсельского хозяйства§! и §Yинфраструктуры.§!\n\n"

ire.ard.no.tt: "\n§GДержите стандартный уровень этого экономического бонуса.§!\n\n"

ire.59.t: "Исполнение сельскохозяйственной реформы"
ire.59.d: "Мы настолько запустили наши сельскохозяйственные районы, что сейчас на них больно смотреть. Пора что-то сделать. Ирландия движется вперёд, и её сельские общины вместе с ней. Большая часть нашей промышленности традиционно приходилась на сельское хозяйство, но времена уже не те. Если мы хотим сохранить сельское хозяйство как жизненно важную часть нашей экономики, фермерские хозяйства нужно немедленно модернизировать. Аналогично и дорожные системы Ирландии находятся в состоянии полной неэффективности, и в настоящее время ответственность за ремонтные работы любого рода лежит на частных предприятиях. Наша транспортная система в целом может быть значительно улучшена, что позволит нам быстрее перемещать людей и товары по стране. Это требует немалых экономических затрат и мы должны помнить о нашем государственном долге. Однако радикальные изменения приведут к тому, что и население станет серьёзнее относиться к этой проблеме."
ire.59.a: "Давайте не будем торопиться."
ire.59.b: "Мы можем сделать значительные инвестиции."
ire.59.c: "Это должно стать приоритетом. Потратьте столько, сколько возможно."

IRE_MFR: "Механизированная реформа сельского хозяйства"
IRE_MFR_desc: "Нет сомнений, что сельское хозяйство является одной из крупнейших отраслей экономики в нашем государстве. Однако применяемые в нынешнее время методы ведения сельского хозяйства оставляют желать лучшего. Приняв методы механизации, которые уже показали себя в Соединённых Штатах и Европе, мы можем ускорить деятельность наших сельскохозяйственных предприятий. Фермы кормят народ и потому являются залогом экономического роста."
ire.60.t: "Инвестиции в механизированное сельское хозяйство"
ire.60.d: "Ввиду нашей экспансионной инвестиционной политики, мы сочли целесообразным продолжить инвестирование в сельское хозяйство. Механизация наших ферм, наконец, поможет Ирландии избавиться от тени Великого голода и поспособствует росту населения."
ire.60.a: "Что посеешь, то и пожнёшь."
ire.60.b: "На самом деле, это слишком затратно."
IRE_MFR1: "Механизированная реформа сельского хозяйства"
IRE_MFR1_desc: "Началась закупка техники для нашего сельского хозяйства. Вся техника уже начала работу, что позволило нам улучшить производство продуктов питания."
IRE_MFR2: "Региональные механизированные реформы сельского хозяйства"
IRE_MFR2_desc: "Мы успешно распространили механизированное сельскохозяйственное оборудование на большинство районов нашей страны, что позволило значительно улучшить производство продуктов питания."
IRE_MFR3: "Национальные механизированные реформы сельского хозяйства"
IRE_MFR3_desc: "Мы внедрили механизированное сельское хозяйство по всему государству, что позволило нашим фермам производить гораздо больше продовольствия. Люди Ирландии больше никогда не будут голодны."

IRE_RRMB: "Совет по ремонту и обслуживанию сельских районов"
IRE_RRMB_desc: "Сельские районы Ирландии нуждаются в серьёзных ремонтных работах. В настоящее время нет какого-либо государственного органа, отвечающего за ремонтные работы, в результате чего сельские общины полагаются на ненадёжный частный бизнес, в обязанности которого входит ремонтировать дороги, но он этого не делает. Взяв эту проблему в руки правительства, мы сохраним наши дороги в нормальном состоянии. Национальная ремонтная компания также получит выгоду, если начнётся война."
ire.61.t: "Технический совет"
ire.61.d: "Правительство решило значительно инвестировать в проект СРОСР, позволяя новой ремонтной компании набрать больше персонала и эффективно вести бизнес."
ire.61.a: "Вперёд на полной скорости!."
ire.61.b: "Несколько выбоин никому не помешают."
IRE_RRMB1: "Технический совет"
IRE_RRMB1_desc: "Совет по ремонту и обслуживанию сельских районов (СРОСР) работает, чтобы быстро ремонтировать повреждённую инфаструктуру. Во время войны её также можно использовать для ремонта заводов и других важных объектов."
IRE_RRMB2: "Региональный технический совет"
IRE_RRMB2_desc: "Совет по ремонту и обслуживанию сельских районов (СРОСР) работает, чтобы быстро ремонтировать повреждённую инфаструктуру. Во время войны её также можно использовать для ремонта заводов и других важных объектов. Благодаря увеличению расходов, плата за ремонт увеличилась."
IRE_RRMB3: "Национальный технический совет"
IRE_RRMB3_desc: "Совет по ремонту и обслуживанию сельских районов (СРОСР) работает, чтобы быстро ремонтировать повреждённую инфаструктуру. Во время войны её также можно использовать для ремонта заводов и других важных объектов. Благодаря крупным инвестициям со стороны правительства, Технический совет чрезвычайно эффективно выполняет свою работу."

IRE_TNTN: "Трансирландская национальная магистраль"
IRE_TNTN_desc: "Железнодорожная инфраструктура, оставленная британцами, функционирует, но в сравнении с высокоскоростной железнодорожной инфраструктурой в Европе - не существует практически. Мы должны учиться у наших континентальных соседей и приложить усилия для модернизации наших железных дорог. Это также окажет значительное влияние на нашу промышленность, так как позволит нам быстрее получать сырьё для предприятий."
ire.62.t: "Инвестиции в инфраструктуру"
ire.62.d: "Мы предприняли успешные шаги для модернизации нашей железнодорожной сети, что, безусловно, поможет в перемещении людей и товаров по всей нашей стране. Наш бюджет позволяет сделать ещё один шаг и внести более радикальные изменения, но они будут стоить недёшево."
ire.62.a: "Мы не остановим поезд, в котором находимся."
ire.62.b: "По тормозам."
IRE_TNTN1: "Трансирландская национальная магистраль"
IRE_TNTN1_desc: "Наша новая железнодорожная система быстро транспортирует товары по всему государству, что позволяет нашим заводам работать эффективнее."
IRE_TNTN2: "Расширение Трансирландской национальной магистрали «
IRE_TNTN2_desc: "Наша новая железнодорожная система быстро транспортирует товары по всему государству, что позволяет нашим заводам работать эффективнее. Крупные инвестиции дали возможность открыть ещё несколько эффективных промышленных железнодорожных путей."
IRE_TNTN3: "Огромная Трансирландская национальная магистраль"
IRE_TNTN3_desc: "Наша новая железнодорожная система быстро транспортирует товары по всему государству, что позволяет нашим заводам работать эффективнее. Активные правительственные инвестиции в проект превратили нашу некогда отсталую инфраструктуру в одну из величайших магистралей Европы."

# Industry Wing
IRE_IFI: "Промышленность для Ирландии"
IRE_IFI_desc: "Наша гражданская промышленность имеет огромный потенциал для роста. В нашей стране колом стоит проблема безработицы - многие семьи слишком бедны, чтобы прокормить себя. Благодаря оживлению нашей экономики, мы в состоянии создать как новые рабочие места, так и улучшить экономическую мощь нации."
ire.IFI.tt: "\nНачните §Yиндустриализацию§! Ирландии.\n\n"
ire.64.t: "Инициатива ПДИ"
ire.64.d: "Правительство распорядилось предоставить крупные средства для быстрой индустриализации государства. Слишком много женщин и мужчин без работы. Многие британские фабрики были закрыты после обретения нами независимости, и с тех пор наша промышленность упала на дно. Промышленности Ирландии не уделяется нормального внимания, несмотря на то, что наше население готово трудиться и работать. Правительство должно решить, какие инвестиции оно готово предоставить."
ire.64.a: "Нормальная сумма. Поставьте страну на ноги."
ire.64.b: "Значительная сумма. Нам нужно быть конкурентоспособными."
ire.64.c: "Крупная сумма. Ирландия может стать великой."
ifi.industry.tt: "\nУ нас будет возможность начать несколько §Yиндустриальных проектов§! в Ирландии.\n\n"

# IFI Event Chains
ire.65.t: "Алкогольные фабрики Свободного государства"
ire.65.d: "После начала инициативы ПДИ, Ирландский департамент промышленности и торговли сделал, возможно, довольно очевидный выбор по поводу наших первых вложений в индустрию - алкоголь. Производство ирландского виски - очень древняя и гордая традиция, но производится оно, в основном, в подпольных семейных ликёроводочных заводах, в сельской местности. Предлагаемое развитие алкогольной индустрии Свободного государства откроет несколько фабрик алкоголя и сделает столь необходимую работу для нашей страны, но место для открытия фабрик ещё предстоит выбрать, и лучше чтоб оно было в одном из наших менее индустриально развитых регионов."
ire.65.a: "Ольстер. Бог знает - им всегда нужно выпить."
ire.65.b: "Коннахт. Им нужна работа."
ire.65.c: "Манстер. От прибыли с этих фабрик они выиграют."

ire.66.t: "Кружки звенят"
ire.66.d: "Строительство алкогольных фабрик в нашем Свободном государстве завершилось, и теперь нация может пользоваться их преимуществами. Конечно же, заводы требуют расходов, но нет сомнений, что они будут хороши для поднятия общественного морального духа, а также экономики в долгосрочной перспективе."
ire.66.a: "Ваше здоровье!"
ire.66.b: "Мы действительно можем себе это позволить?"

# End Chain #

### FIC Chain ###
IRE_FIC: "Создание финансовой и промышленной столицы"
IRE_FIC_desc: "Восстание синдикализма в Великобритании создало пустоту на Британских островах, которую Ирландия могла бы заполнить. Страны, не являющиеся синдикалистами, могли бы смотреть на Ирландию как на ведущее торговое государство, расположенное в Атлантике между Европой и Америкой. С некоторыми усилиями и иностранными инвестициями, Дублин мог бы стать вторым Лондоном."
ire.fic.tt: "Создайте международный бизнес-центр в Дублине.\n\n"
ire.70.t: "Продвинуть Дублин"
ire.70.d: "Наши быстрая индустриализация и экономические реформы создали привлекательную среду для иностранного бизнеса. Если мы правильно сыграем в карты и предложим существенные субсидии, мы сможем привлечь иностранные государства для созданий в Дублине своих предприятий, превратив его в новый торговый центр, расположенный в выгодной Атлантике. Лондон упал синдикалистам, и у нас появился шанс подобрать слабину и заставить её работать на нас. Нам нужно решить, сколько средств мы готовы выделить проекту. Чем крупнее инвестиции - тем больше международный охват, но не стоит забывать - призрак долга всё ещё за нами."
ire.70.a: "Ограничьте наш охват до очевидных клиентов в Европе"
ire.70.b: "Атлантика - наш предел"
ire.70.c: "Распространяйте новости далеко и громко - Дублин открыт для иностранных вложений!"

