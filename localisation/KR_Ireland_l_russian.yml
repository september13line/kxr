ire.75.t: "Ирландский флирт с английским бизнесом"
ire.75.d: "Поразительно, но ирландцы отправили своих торговых представителей в Лондон, дабы предложить английским компаниям открыть свои филиалы в Дублине. Дублин в последнее время продвигается как центр торговли и финансов. Ирландцы, должно быть, в отчаянии, раз они пришли с таким предложением к НАМ. Если мы согласимся, мы, конечно, получим от этого выгоду, но наш потенциальный враг за Ирландским морем тоже."
ire.75.a: "Ирландцы - НЕ друзья пролетариата."
ire.75.b: "Мы хотим дружбы с ирландцами. Давайте их сюда."
ire.75.c: "Возможно, это наш шанс повлиять на них. Сделаем это."
ire.75.e: "Мы же воюем, нам сейчас не до этого!"
ire.76.t: "Ответ Союза"
ire.76.d: "Наша попытка флирта с бизнесом Британского Союза оказалась успешной. Конструктор автомобилей, 'Воксхолл Моторс', объявил об организации своей дочерней компании в Дублине. Инвестиции синдикалистов в нашу экономику, несомненно, укрепят её и обеспечат рабочие места для наших людей. К тому же, возможно, это может быть полезно в долгосрочной перспективе."
ire.76.d1: "Наша попытка флирта с бизнесом Британского Союза, к сожалению, провалилась. Англичане решили сделать более протекционистский подход к своей промышленности и запретили любые инвестиции в Дублин."
ire.76.d2: "Наша попытка флирта с бизнесом Британского Союза, к сожалению, провалилась. В связи с тем, что они сейчас в состоянии войны, они не могут участвовать в каких-либо инвестициях."
ire.76.d3: "Наша попытка флирта с бизнесом Британского Союза оказалась успешной. Конструктор автомобилей - 'Воксхолл Моторс' - объявил об организации своей дочерней компании в Дублине."
ire.76.a: "Преимущества перевешивают возможные риски."
ire.76.b: "В любом случае, они нам не нужны."
ire.76.c: "С другой стороны, нам не нужно синдикалистское влияние в Дублине."
ire.76.e: "Фантастика!"

ire.77.t: "Ирландский флирт с французским бизнесом"
ire.77.d: "Как ни удивительно, ирландцы отправили торгового представителя в Париж с предложением французским компаниям открыть свои предприятия в Дублине в обмен на щедрые правительственные стимулы. Дублин продвигается как центр торговли и коммерции. Ирландцы, должно быть, отчаялись, если обратились с таким предложением именно к нам. Если мы позволим это, то, вероятно, сами извлечём выгоду, но и наш потенциальный враг по ту сторону Ла-Манша - тоже."
ire.77.a: "Ирландия не друг трудящимся."
ire.77.b: "Мы прилагали усилия, чтобы установить дружественные отношения с ирландцами. Давайте сохраним их."
ire.77.c: "Возможно, это шанс влиять на них изнутри. Давайте сделаем это."
ire.77.e: "Мы в состоянии войны, сейчас мы не можем инвестировать."
ire.78.t: "Ответ Коммуны"
ire.78.d: "Наша попытка флирта с предприятиями Французской Коммуны увенчалась успехом. Lorraine-Dietrich, производитель автомобилей, объявил о строительстве нового дублинского филиала. Хотя синдикалистские инвестиции укрепят нашу гражданскую экономику и предоставят жизненно важные рабочие места для нашего народа, в долгосрочной перспективе это может иметь последствия."
ire.78.d1: "Наша попытка флирта с предприятиями Французской Коммуны, к сожалению, провалилась. Французы решили применить более протекционистский подход к своей внутренней промышленности и запретили любые иностранные инвестиции в Дублине."
ire.78.d2: "Наша попытка флирта с предприятиями Французской Коммуны, к сожалению, провалилась. Из-за того, что в настоящее время они находятся в состоянии войны, они чувствуют, что не могут участвовать в каких-либо новых иностранных инвестициях в данный момент."
ire.78.d3: "Наша попытка флирта с предприятиями Французской Коммуны увенчалась успехом. Lorraine-Dietrich, производитель автомобилей, объявил о строительстве нового дублинского филиала."
ire.78.a: "Преимущества перевешивают возможные риски."
ire.78.b: "Они нам всё равно были не нужны."
ire.78.c: "С другой стороны, нам не нужно синдикалистское влияние в Дублине."
ire.78.e: "Фантастика!"

