#Easter Rising Anniversary
ire.55.t:0 "Двадцатая годовщина Пасхального восстания 1916 года!"
ire.55.d:0 "Сегодня, 24 апреля 1936 года, исполнилось двадцать лет со дня начала Пасхального восстания 1916 года. Многие сомневались, состоятся ли запланированные торжества, однако распоряжения из Канцелярии президента развеяли все опасения.\n\nПразднование началось с масштабного военного парада по улицам Дублина, завершившегося торжественным шествием по О'Коннелл-стрит перед Главпочтамтом, где в Пасхальный понедельник впервые была зачитана Прокламация Ирландской Республики. Военные оркестры с медными духовыми инструментами и волынками сопровождали солдат, исполняя старинные гэльские мелодии на военный лад. Улицы были переполнены людьми настолько, что некоторые наблюдали за происходящим с палуб лодок, покачивавшихся на Лиффи.\n\nАтмосфера была ликующей, и ни один наблюдатель не поверил бы, что всё это происходит в стране, экономика которой в тот самый момент разваливается на части.\n\nКогда парад остановился, а солдаты выстроились лицом к Главпочтамту, один военный офицер вышел вперёд и направился к фасаду здания, чтобы зачитать Прокламацию, как двадцать лет назад сделал Патрик Пирс. Но, к удивлению собравшейся толпы и присутствовавших чиновников, это оказался не простой офицер.\n\nПеред страной стоял президент Коллинз в генеральском мундире времён Войны за независимость. Человек, который, возможно, сделал для свободы Ирландии больше, чем кто-либо другой. Он начал с единственных слов, с которых мог начать..."
ire.55.a:0 "«Ирландцы и ирландки...»"

ire.56.t:0 "Коллинз обращается к нации"
ire.56.d:0 "«Ирландцы и ирландки: во имя Бога и ушедших поколений, от которых она наследует древнюю традицию государственности, Ирландия через нас призывает своих детей под своё знамя и выступает за свою свободу...»\n\nЗакончив чтение Прокламации, Коллинз сперва встретил короткое ошеломлённое молчание, а затем бурные овации. Когда они утихли, он начал решительное обращение к нации. Говоря с твёрдой убеждённостью, президент признал трудности, с которыми столкнулась страна, и призвал всех встретить их вместе. Он продолжил, отметив, что в военном отношении Пасхальное восстание изначально почти не имело шансов на успех, однако было основано на надежде перед лицом крайнего отчаяния - подобно нынешней Ирландии, столкнувшейся с собственными тяжелейшими проблемами.\n\nЗавершая речь, Коллинз объявил, что 24 апреля отныне официально станет Днём независимости Ирландии и будет отмечаться ежегодно. Эта дата должна ознаменовать новое начало как в отношениях Ирландии с самой собой, произнёс он, обращая внимание на немногочисленных присутствовавших лоялистов, так и в её отношениях со всем миром.\n\nВ худшем случае его слова встретили молчаливым уважением представители всего политического спектра. Независимо от нынешних позиций практически все политические движения Ирландии, кроме лоялистов, так или иначе восходили к Пасхальному восстанию, и потому оно оставалось одним из немногих событий, способных объединить страну. Означало ли провозглашённое новое начало подтверждение существующего порядка или более радикальные перемены, в этот момент не имело значения.\n\nХотя бы в этот день все вновь вспомнили, что несмотря на охватившие страну потрясения, у них по-прежнему есть свобода и независимость, которых они так долго добивались. И на короткое время только это имело значение."
ire.56.a:0 "Несвободная Ирландия никогда не познает покоя."

ire.57.t:0 "Плавание в Византию"
ire.57.d1:0 "Сегодня Ирландия скорбит, узнав о смерти Уильяма Батлера Йейтса, на протяжении нескольких десятилетий остававшегося одним из титанов современной ирландской культуры.\n\nС 1890-х годов Йейтс стоял у истоков Ирландского литературного возрождения, а в 1904 году помог основать один из главных центров национального театра - Театр Аббатства. На протяжении всей творческой жизни он продвигал ирландскую культуру и мифологию, подчёркивая существование совершенно самостоятельной ирландской идентичности, отдельной от британской. Главным личным достижением Йейтса стало получение Нобелевской премии по литературе в 1923 году за поэтическое творчество. Это произошло в особенно волнующий период его жизни, вскоре после рождения независимой Ирландии, которую он давно поддерживал. В 1922 году Йейтс стал членом Сената и в последующие годы непосредственно познакомился с политической жизнью нового государства. Хотя в качестве сенатора он не состоял ни в одной партии, даже в Шинн Фейн, Йейтс не боялся открыто выражать политические взгляды и твёрдо отстаивал в Сенате своё мнение по вопросам культуры и образования. Его позиция была уникальной, поскольку он говорил не только как художник, но и как человек, одновременно являвшийся протестантом и националистом.\n\nВ последние годы жизни Йейтс стал неофициальным сторонником Синерубашечников, привлечённый как жёстким патернализмом Оуэна О'Даффи, так и мистическим национализмом Героид О Куинягайна. Йейтс всегда относился с неприязнью к индивидуализму и либерализму, и усиление обоих течений в Шинн Фейн глубоко его разочаровало. Синерубашечники были чрезвычайно рады получить сторонника подобного масштаба, хотя и сожалели, что так и не смогли по-настоящему использовать его известность, помимо трёх маршевых песен, написанных Йейтсом для организации.\n\nХотя Йейтса больше нет, его наследие останется надолго, и независимо от политических взглядов мало кто способен отрицать его огромный вклад в культурную жизнь Ирландии."
ire.57.d2:0 "Сегодня Ирландия скорбит, узнав о смерти Уильяма Батлера Йейтса, на протяжении нескольких десятилетий остававшегося одним из титанов современной ирландской культуры.\n\nС 1890-х годов Йейтс стоял у истоков Ирландского литературного возрождения, а в 1904 году помог основать один из главных центров национального театра - Театр Аббатства. На протяжении всей творческой жизни он продвигал ирландскую культуру и мифологию, подчёркивая существование совершенно самостоятельной ирландской идентичности, отдельной от британской. Главным личным достижением Йейтса стало получение Нобелевской премии по литературе в 1923 году за поэтическое творчество. Это произошло в особенно волнующий период его жизни, вскоре после рождения независимой Ирландии, которую он давно поддерживал. В 1922 году Йейтс стал членом Сената и в последующие годы непосредственно познакомился с политической жизнью нового государства. Хотя в качестве сенатора он не состоял ни в одной партии, даже в Шинн Фейн, Йейтс не боялся открыто выражать политические взгляды и твёрдо отстаивал в Сенате своё мнение по вопросам культуры и образования. Его позиция была уникальной, поскольку он говорил не только как художник, но и как человек, одновременно являвшийся протестантом и националистом.\n\nВ последние годы жизни Йейтс стал неофициальным сторонником Синерубашечников, привлечённый как жёстким патернализмом Оуэна О'Даффи, так и мистическим национализмом Героид О Куинягайна. Йейтс всегда относился с неприязнью к индивидуализму и либерализму, и усиление обоих течений в Шинн Фейн глубоко его разочаровало. После его смерти должность, предоставленная ему нашим правительством, должна перейти к новому кандидату. Некоторые предлагали известных политиков из наших рядов, однако наиболее популярным вариантом стало назначение Мод Гонн. Эта весьма колоритная фигура и давняя возлюбленная Йейтса продолжит его дело, опираясь на опыт убеждённой ирландской националистки англо-ирландского происхождения, революционерки, суфражистки и сторонницы теорий К. Х. Дугласа, которая даже организовала Ирландскую партию социального кредита."
ire.57.a:0 "Ar dheis Dé go raibh a anam."

# Black Monday
ire.228.t:0 "Чёрный понедельник обрушивается на Ирландию!"
ire.228.d:0 "3 февраля германский фондовый рынок рухнул, ввергнув мир в экономическую депрессию. После Британской революции, когда мы провозгласили республику и разорвали связи с Британской империей, Ирландия во многом зависела от торговли с Германией и её сферой влияния. Кризис нанёс тяжёлый удар по ирландской экономике, поскольку сама Германия и другие наши европейские торговые партнёры также оказались поражены последствиями краха. Многие спешно ищут решение проблемы, причём большинство партий предлагают либо развивать собственную ирландскую экономику, либо поддерживать стабильность до восстановления Германии. Национальная центристская партия занимает более радикальную англофильскую позицию, призывая отказаться от торговли с континентальной Европой и восстановить связи с Антантой, нередко сопровождая свои выступления антигерманской риторикой. Синдикалисты, в свою очередь, начали призывать к революции, заявляя, что кризис служит окончательным доказательством несостоятельности капитализма."
ire.228.a:0 "Это может плохо кончиться..."
ire.229.t:0 "Германская экономика улучшается"
ire.229.d:0 "Германское правительство приступило к реформированию экономики, чтобы справиться с последствиями Чёрного понедельника. По мере улучшения положения в Германии торговля между нашими странами начинает восстанавливаться, помогая ирландской экономике вернуться к нормальному состоянию."
ire.229.a:0 "Хотя бы что-то хорошее..."
ire.230.t:0 "Германская экономика восстановилась"
ire.230.d:0 "Экономика Германии наконец оправилась от Чёрного понедельника, благодаря чему торговля между Ирландией и Германией может полностью возобновиться."
ire.230.a:0 "Отлично!"
ire.231.t:0 "Война оживляет экономику"
ire.231.d:0 "Начало войны в Ирландии помогло нашей экономике оправиться от последствий Чёрного понедельника."
ire.231.a:0 "По крайней мере, есть хоть один плюс..."
ire.232.t:0 "Торговля с Антантой"
ire.232.d:0 "Теперь, когда мы наладили отношения с Антантой, наша экономика значительно укрепилась благодаря торговле с Британской империей. Возможно, Национальная центристская партия всё это время была права."
ire.232.a:0 "Отлично!"
ire.233.t:0 "Торговля с британцами"
ire.233.d:0 "Теперь, когда мы открыли торговые отношения с Британским Союзом, наша экономика начала восстанавливаться благодаря торговле с нашим некогда крупнейшим торговым партнёром."
ire.233.a:0 "Отлично!"
ire.234.t:0 "Конец Чёрного понедельника!"
ire.234.d:0 "Теперь, когда Ирландия наконец освободилась от капиталистического угнетения, перестройка нашей экономики устранила последствия Чёрного понедельника, ставшего окончательным доказательством провала капитализма."
ire.234.a:0 "Отлично!"
ire.235.t:0 "Конец Чёрного понедельника!"
ire.235.d:0 "Теперь, когда мечта о самодостаточной Ирландии стала реальностью, наша экономика больше не зависит от внешней торговли, и последствия Чёрного понедельника остались в прошлом!"
ire.235.a:0 "Отлично!"
ire.236.t:0 "Торговля с США"
ire.236.d:0 "Несмотря на нестабильное положение в Америке, открытие торговли с ней помогло улучшить состояние нашей экономики."
ire.236.a:0 "Отлично!"
ire.237.t:0 "Америка и экономика"
ire.237.d:0 "Теперь, когда Америка стабилизировалась, а Ирландия поддерживает с ней тесную дружбу, наши торговые связи значительно укрепились, что благоприятно сказалось на экономике."
ire.237.a:0 "Отлично!"
ire.238.t:0 "Ирландия и Рейхспакт"
ire.238.d:0 "Хотя после обретения Ирландией независимости торговые отношения между ней и Германией оставались прочными, страна всё же находилась несколько в стороне от экономики Рейхспакта, предпочитая сохранять нейтралитет. Теперь, когда Ирландия установила более тесные связи с Рейхспактом, её экономика получила значительную выгоду."
ire.238.a:0 "Отлично!"
ire.239.t:0 "Чёрный понедельник завершён!"
ire.239.d:0 "После долгого кризиса благодаря экономическим и дипломатическим мерам нашего правительства ирландская экономика наконец оправилась от Чёрного понедельника!"
ire.239.a:0 "Наконец-то!"
ire.240.t:0 "Чёрный понедельник завершён!"
ire.240.d:0 "Хотя восстановление заняло много времени и некоторые считают, что ирландское правительство могло сделать больше, последствия кризиса Чёрного понедельника для Ирландии наконец полностью преодолены."
ire.240.a:0 "Наконец-то!"

