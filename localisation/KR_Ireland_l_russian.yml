#Collins Policy Towards Ulster
ire.2422.t:0 "Политика Коллинза в отношении Ольстера"
ire.2422.d:0 "Выборы 1937 года стали катализатором перемен по всей Ирландии, и особенно сильно они затронули Ольстер, который по-прежнему ожесточённо сопротивляется нашей власти. Политика Коллинза в отношении региона заключалась в жёстком подавлении юнионистов, а порой и в отправке армии на север для восстановления порядка. Многие называют подобную стратегию авторитарной, и она крайне непопулярна среди либералов в нашей администрации. Однако когда на кону стоят национальное единство и безопасность, некоторые считают, что цель оправдывает средства."
ire.2422.a:0 "Продолжить репрессии Коллинза!"
ire.2422.b:0 "Пришло время предложить Северу мир."

