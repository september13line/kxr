ire.72.b: "Чёрт."

ire.73.t: "Ирландский флирт с испанским бизнесом"
ire.73.d: "Сегодня до нас дошли вести о том, что ирландцы делают всё возможное ради продвижения недавно модернизированного Дублина в качестве перспективного центра торговли и финансов. С нами связались из Ирландии и попросили предложить нашим крупнейшим промышленным компаниям открыть свои филиалы в их столице. Естественно, мы воспользуемся некоторыми преимуществами этой договорённости, которые могут быть весьма прибыльными в долгосрочной перспективе. И, само собой, это будет также выгодно для ирландцев."
