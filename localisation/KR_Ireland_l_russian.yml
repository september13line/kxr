IRE_american_civil_war:0 "Реакция на Гражданскую войну в Америке"
IRE_american_civil_war_desc:0 "Политическая напряжённость, вызванная экономическим крахом Америки после окончания Вельткрига, наконец достигла предела, и в стране разразилась гражданская война. Из-за наших тесных связей с Америкой последствия конфликта могут затронуть и Ирландию, поэтому мы должны быть готовы к любому развитию событий."
IRE_SENDIRA:0 "Отправить добровольцев ИРА"
IRE_SENDIRA_desc:0 "[IRE_SENDIRA_desc_loc]"
IRE_send_ira_desc:0 "Америка погрузилась в хаос, а синдикалисты и фанатики пытаются захватить власть. Хотя наши отношения с США далеки от идеальных, возможно, нам всё же стоит поддержать их как оплот стабильности в борьбе против радикализма."
IRE_send_ira_syndie_desc:0 "Америка охвачена собственной революцией. Мы должны помочь нашим товарищам за океаном в их борьбе. Несколько добровольческих отрядов ИРА готовы отправиться туда и поддержать их."
IRE_SANCTUARY:0 "Убежище"
IRE_SANCTUARY_desc:0 "С началом боевых действий в Соединённых Штатах многие американцы ирландского происхождения решили вернуться на землю своих предков, спасаясь от охватившего Америку хаоса. Наш долг - помочь нашим ирландским братьям!"
IRE_REFUGEEWORK:0 "Программа трудоустройства беженцев"
IRE_REFUGEEWORK_desc:0 "После прибытия в Ирландию многие беженцы столкнулись с трудностями при поиске работы, что вызвало определённую напряжённость в нашем обществе. Одним из решений может стать привлечение этих людей к общественным работам, которые одновременно помогут развитию Ирландии."
IRE_REFUGEEFIGHT:0 "Вербовать способных сражаться"
IRE_REFUGEEFIGHT_desc:0 "После прибытия в Ирландию многие беженцы столкнулись с трудностями при поиске работы, что вызвало определённую напряжённость в нашем обществе. Одним из решений может стать их призыв в армию для службы своей новой родине."
