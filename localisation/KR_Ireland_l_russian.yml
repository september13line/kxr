ire.103.d2: "В 1941 году в мире была кровавая война и большинство людей искали убежища за границей, в безопасных гаванях. Состояние мира и ирландские законы об иммиграции в целом способствовали увеличению численности населения страны."
ire.103.d3: "В 1941 году Ирландия была в состоянии войны, из-за чего было значительно меньше желающих иммигрировать и поселиться в нашей стране."
ire.103.a: "Ладно."
