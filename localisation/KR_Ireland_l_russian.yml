#Other Dictator Policy Towards Ulster
ire.2423.t:0 "Политика [IRE.GetLeader] в отношении Ольстера"
ire.2423.d:0 "Выборы 1937 года и конец ирландской демократии стали катализатором перемен по всей стране, и особенно сильно они затронули Ольстер, который по-прежнему ожесточённо сопротивляется нашей власти. Политика Коллинза в отношении региона заключалась в жёстком подавлении юнионистов, а порой и в отправке армии на север для восстановления порядка. Многие называли подобную стратегию авторитарной, и она крайне непопулярна среди либералов в нашей администрации. Однако когда на кону стоят национальное единство и безопасность, цель оправдывает средства."
ire.2423.a:0 "Продолжить репрессии!"

#Socialist Policy Towards Ulster
ire.2424.t:0 "Социалистическая политика в отношении Ольстера"
ire.2424.d:0 "Выборы 1937 года и конец ирландской демократии стали катализатором перемен по всей стране, и особенно сильно они затронули Ольстер, который по-прежнему ожесточённо сопротивляется нашей власти. Политика Коллинза в отношении региона заключалась в жёстком подавлении юнионистов, а порой и в отправке армии на север для восстановления порядка. Хотя Коллинз был реакционером, социалисты разделяют его стремление подавить ольстерский сепаратизм. Они расширили репрессии против ольстерских юнионистов, при этом оставив в покое тех, кто поддерживает Британский Союз."
ire.2424.a:0 "Продолжить репрессии!"

#Bruga's Polcicy
ire.243.t:0 "Политика Бру в отношении Ольстера"
ire.243.d:0 "Теперь, когда выборы 1937 года завершились, статус неспокойного Ольстера вновь стал предметом обсуждения. Победу на выборах одержала Шинн Фейн, а президентом Ирландии стал Катал Бру. Подобно Фине Гэл, Шинн Фейн отличается ярко выраженным патриотизмом и обещает подавить ольстерский юнионизм. Такой подход непопулярен среди пацифистов и, на первый взгляд, противоречит акценту партии на ненасилии. Тем не менее политика в отношении Ольстера, по всей видимости, останется практически такой же, какой она была при президенте Коллинзе."
ire.243.a:0 "Похоже, всё останется по-прежнему."
ire.243.b:0 "Пришло время мира на Севере."

#MacDermot's Polcicy
ire.244.t:0 "Политика Макдермота в отношении Ольстера"
ire.244.d:0 "Теперь, когда выборы 1937 года завершились, статус неспокойного Ольстера вновь стал предметом обсуждения. Победу на выборах одержала Национальная центристская партия, а президентом стал Фрэнк Макдермот. Его политика в отношении Ольстера заключается в поиске компромисса, при котором регион получит значительную автономию без дальнейшей децентрализации всей Ирландии. Остаётся надеяться, что это позволит избежать кровопролития и нового конфликта в регионе в ближайшем будущем."
ire.244.a:0 "Найдём компромисс."

#De Valera's Polcicy
ire.245.t:0 "Политика де Валеры в отношении Ольстера"
ire.245.d:0 "Теперь, когда выборы 1937 года завершились, статус неспокойного Ольстера вновь стал предметом обсуждения. Победу на выборах одержала Фианна Файл, а президентом стал Имон де Валера. Политика де Валеры в отношении региона заключается в поиске компромисса с юнионистами посредством децентрализации Ирландии и предоставления её регионам, включая Ольстер, высокой степени автономии. Остаётся надеяться, что это позволит избежать кровопролития и нового конфликта в ближайшем будущем."
ire.245.a:0 "Тогда усилим децентрализацию."


###############
## Flavour   ##
###############

ire.246.t:0 "Окончательное падение Фианна Фойл"
ire.246.d:0 "Имон де Валера уже давно остаётся болезненной занозой в боку Коллинза: сперва он изгнал его из Шинн Фейн, а затем при каждом удобном случае выступал против правительства Коллинза. Коллинз заявил, что с ним необходимо разобраться, и теперь, когда государство находится в его железной хватке, он наконец способен раз и навсегда покончить с этим предателем. Поэтому Кеннайре Коллинз приказал распустить и запретить политическую партию де Валеры, Фианна Фойл, а самого де Валеру арестовать.\nК сожалению, де Валера, похоже, оказался на шаг впереди Коллинза и бежал в Америку всего за несколько дней до того, как полиция должна была отправить его в тюрьму. Конечно, потерять де Валеру где-то за океаном не лучший исход, однако хаотичная обстановка в Америке едва ли сулит опальному мятежнику спокойную жизнь. Хотя сам де Валера ускользнул, с ним всё же разобрались подобающим образом, а крупнейшая демократическая сила, противостоявшая Коллинзу, теперь окончательно устранена. Впрочем, демократия в новой Ирландии Коллинза уже мало что значит..."
ire.246.a:0 "Прощай, Дев."

ire.247.t:0 "Заговор раскрыт"
ire.247.d:0 "В результате потрясающего поворота событий президент Коллинз раскрыл грандиозный заговор, проникший практически на все уровни ирландского правительства. Синдикалистские фальсификаторы выборов, действовавшие по приказу Британского Союза, сумели радикально исказить результаты голосования, причём настолько, чтобы обеспечить синдикалистам небольшую победу на выборах 1937 года. К счастью, президент Коллинз распознал ложь синдикалистских выборов и вмешался, защитив Ирландию от британцев и красных. Теперь, когда подлинные результаты голосования восстановлены, выяснилось, что настоящим победителем был именно Коллинз, получивший подавляющее большинство голосов населения.\n\nКоллинз создал специальную комиссию по обеспечению безопасности выборов, которая должна гарантировать, что впредь голосование будет защищено от влияния подрывных сил и любых угроз независимости Ирландии."
ire.247.a:0 "Слава Богу за Коллинза."

ire.248.t:0 "Де Валера возвращается"
ire.248.d:0 "Во время Великого картофельного голода в Ирландии несколько индейских народов, прежде всего чокто, оджибве и наши собственные навахо, наряду с другими, отправили ирландцам денежную помощь, чтобы поддержать их в столь мрачное и тяжёлое время. Несколько десятилетий спустя, в 1919 году, Имон де Валера, консервативный политик и один из отцов Ирландской Республики, прибыл в Соединённые Штаты и совершил поездку по землям тех самых коренных народов, которые когда-то помогли его соотечественникам. Теперь, когда Ирландия вновь погружается в радикализм и авторитаризм, наш старый друг де Валера вернулся уже в наше недавно обретшее независимость государство, ища убежища и покоя, подобно тому как мы когда-то протянули руку помощи его предкам. Приветствуем же этого старого и уставшего друга, чтобы он смог провести остаток своих дней в мире и спокойствии, пока его родина горит у него за спиной. Мы, Первые народы, слишком хорошо знаем, что это значит."
ire.248.a:0 "Пусть поселится на наших землях и обретёт покой."
ire.248.b:0 "Предоставим ему место в Племенном совете!"

# Valera Authdem Event Chain

ire.249.t:0 "Имон де Валера распускает Сенат"
ire.249.d:0 "Имон де Валера решил распустить Сенад Эрен, Ирландский сенат, чтобы защитить ирландский консерватизм и господствующее положение Фианна Фойл, поскольку де Валера искренне убеждён, что лишь он знает, какой путь лучше всего подходит Ирландии и её народу. Вполне ожидаемо это решение вызвало ярость у тысяч граждан по всей стране, а в большинстве крупных городов вспыхнули беспорядки. Нам предстоит определить общую линию поведения в отношении протестующих и несогласных, ведь на кону стоит наше будущее."
ire.249.a:0 "Пусть кричат. Рано или поздно успокоятся."
ire.249.b:0 "Приказать полиции подавить беспорядки."

ire.2501.t:0 "Чрезвычайное положение"
ire.2501.d:0 "Поскольку война погрузила Ирландию в хаос и, по всей видимости, не оставила иного выхода, президент Имон де Валера объявил то, что он называет «Чрезвычайным положением» - общенациональный режим военного положения, предоставляющий ему практически абсолютную власть, включая право подвергать прессу цензуре, интернировать граждан и устанавливать государственный контроль над экономикой, в то время как Фианна Фойл полностью господствует в правительстве. Всё это якобы необходимо ради возвращения Ирландии мира, безопасности и стабильности. Официально меры носят исключительно временный характер и введены лишь по самым серьёзным и законным причинам, однако многие уже начинают подозревать, что перед нами всего лишь попытка Фианна Фойл захватить всю власть ради амбиций де Валеры. Только время покажет истину."
ire.2501.a:0 "Всё ради защиты Ирландии."

ire.2511.t:0 "Продлить чрезвычайное положение?"
ire.2511.d:0 "Фианна Фойл и её лидер, президент Имон де Валера, лишь продолжают наращивать власть, амбиции и паранойю перед лицом внешних угроз, всё глубже погружаясь в авторитаризм по мере того, как его хватка вокруг Ирландии становится всё крепче. Хотя де Валера оправдывает свои действия защитой Ирландии и её народа, большинство граждан всё сильнее ненавидит жизнь при военном положении и ограниченных свободах, а тысячи людей уже открыто возмущаются правлением президента. Следует ли нам и дальше бесконечно продлевать чрезвычайное положение или наконец вновь уступить дорогу демократии?"
ire.2511.a:0 "Де Валере нужно ещё больше власти, чтобы разобраться с врагами Ирландии!"
ire.2511.b:0 "С другой стороны..."

ire.300.t:0 "План «Кэтлин»"
ire.300.d:0 "Куманн на Саорсе, или Лига свободы, Ирландские друзья Германии и Куманн Наисиунта представляют собой ирландские республиканские организации, тесно связанные с Германией. О'Даффи, Коллинз и другие видные деятели руководят подобными объединениями, стремясь одновременно укреплять ирландский республиканизм и дружбу с германским гегемоном. Теперь эти организации совместно разработали новый замысел, получивший название «План Кэтлин», который предусматривает дальнейшее сближение Ирландии с Германским Кайзеррейхом ради сохранения нашей свободы и независимости от англоидной угрозы. С появлением на острове германских баз и военных специалистов, а также с расширением деятельности германских компаний по всему Изумрудному острову мы сможем воспользоваться успехами Германии и одновременно надёжно защитить ирландскую независимость."
ire.300.a:0 "На благо всех ирландцев."

#ANH

ire.301.t:0 "Принц Томонда"
ire.301.d:0 "Реймонд Моултон О'Брайен, отдалившийся сторонник Синих рубашек О'Даффи и Ailtirí na hAiséirghe О'Куиннегайна, в определённых кругах Ирландии давно известен как совершенно безумная фигура. Стремясь стать верховным королём несуществующей монархии, О'Брайен претендует на титул графа Томонда и называет себя принцем вымышленного Княжества Томонд. Неясно, создал ли он это фальшивое микрогосударство ради мошенничества, чтобы придать своим притязаниям аристократическую легитимность, или же просто в припадке безумия и нестабильности. Ясно одно: его так называемый титул принца Томонда представляет собой обузу для любого движения, к которому он примыкает. Нам следует решить, что делать с этим чудаком, пока он окончательно не превратил нашу политическую программу в посмешище."
ire.301.a:0 "Пусть это посмешище над мёртвой аристократией спокойно проповедует своё безумие."
ire.301.b:0 "Хочет вести себя как дворянин - будем обращаться с ним как с дворянином. В тюрьму его."
ire.301.c:0 "Голову с плеч!"
ire.301.e:0 "Дадим ему символическую должность в нашей партии."

ire.302.t:0 "Гэльско-даосский синкретизм"
ire.302.d:0 "Теренс Джеймс Стэннус Грей, более известный как Вэй У Вэй, - ирландский националистический поэт, драматург, даосский монах и философ, уже много лет друживший с Кеннайре. Известный своими «танцевальными драмами» и работой в Кембриджском фестивальном театре, Вэй У Вэй также является убеждённым натуралистом, спиритуалистом, практикующим друидом и неошаманом, а кроме того сторонником идеологии ANH и экорадикализма. Его необычная одежда и идеи могут оттолкнуть многих, однако Кеннайре предоставил своему старому другу всю необходимую поддержку для распространения его учения по Ирландии. Это лишь немного увеличило число даосов на Изумрудном острове, зато значительно повысило популярность самого Кеннайре, который вновь доказал свою приверженность свободе веры и религии, если только человек остаётся преданным ирландцем."
ire.302.a:0 "Его идеи могут и не прижиться, но Кеннайре его поддерживает."

ire.303.t:0 "Очищение Ирландии"
ire.303.d:0 "Кеннайре О'Куиннегайн уже давно презирает ирландскую систему пэрства, дворянства и титулов, поскольку от неё всегда разило английскими корнями и влиянием. Чтобы действительно осуществить Возрождение гэльской культуры, мы должны исполнить волю Кеннайре и воплотить его замысел в жизнь. Мы уничтожим все королевские титулы и саму систему пэрства, очистив классовое устройство страны от аристократической и английской скверны ради создания свободного и равного, но целиком и исключительно ирландского общества, равного только для ирландских мужчин и женщин. Однако мы можем собрать обломки старой системы и, воздавая истинную дань предкам, восстановить древний клановый строй, разделив общество на кланы, которые будут управлять закреплёнными за ними землями, сотрудничать друг с другом посредством торговли и услуг, выплачивать дань и предоставлять военную помощь Кеннайре О'Куиннегайну, когда тот потребует её как глава общенационального правительства и собственного верховного Великого клана. Наконец, можно обратиться ещё дальше в прошлое и восстановить в модернизированном виде древнее Брехонское право, служившее нашей правовой системой до появления норманнов, скандинавов и англичан. При нём значительная часть власти в Ирландии находилась в руках объединения судей: первоначально это были друидические судьи V века до нашей эры, впоследствии заменённые островными христианскими и светскими судьями, пока начиная с V века нашей эры эта система постепенно не уступила место английскому праву и более современным формам управления. Если Брехонское право будет возрождено и модернизировано, Кеннайре О'Куиннегайн всё равно уничтожит систему пэрства, но сам станет Верховным друидом Ирландии, главой судебной власти, возглавляя децентрализованную систему судебных юрисдикций, чьи собственные судьи будут определять порядок жизни остальных графств и кланов по образцу времён, предшествовавших английскому и норманнскому вторжениям. Как нам поступить?"
ire.303.a:0 "Никакие титулы и классовые иерархии больше никогда не будут сковывать Ирландию!"
ire.303.b:0 "Восстановим на их месте древний клановый строй."
ire.303.c:0 "Модернизируем древнюю критархию Брехонского права."

ire.304.t:0 "Пан-кельтская мечта"
ire.304.d:0 "Кеннайре О'Куиннегайн привёл Ирландию к новому рассвету, окутанному тёплыми объятиями нашего гордого и благородного прошлого. Свободные и верные своим гэльским и кельтским истокам, мы жаждем пронести войну по всем землям древней Кельтики, чтобы освободить наших братьев от империалистического гнёта чужеземных шавок и зверей. Освобождение ждёт кельтов Британских островов - бриттов, ирландцев, корнцев, шотландцев, мэнцев и других островных народов, - но также бретонцев, кельтиберов, галлов и многих иных потомков кельтов по всей Европе и Анатолии. Однако сперва нам необходимо решить, насколько далеко распространятся наши цели и наши армии."
ire.304.a:0 "Ради блага всех ирландцев мы останемся изоляционистами, ведь лишь мы по-настоящему кельты."
ire.304.b:0 "Мы спасём традиционные кельтские земли Островов, Бретани, Кельтской Иберии и Исландии."
ire.304.c:0 "Кеннайре О'Куиннегайн требует спасти всю Кельтику - от Исландии и Ирландии до Турции и Испании!"

ire.305.t:0 "Судьба новой Шинн Фейн"
ire.305.d:0 "После уничтожения общенациональной ирландской демократии крупнейшие партии старого республиканского строя начали меняться и раскалываться, формируя новые союзы и пересматривая прежнюю политику. Особый интерес для ANH представляет судьба левых националистов Шинн Фейн. Хотя SF в значительной степени распалась из-за споров о секуляризме и экономике, новое ядро ветеранов IRA и радикальных националистов сумело взять руководство партией в свои руки. Во главе с «Тремя Маками» - Тони Маганом, Пэдди Маклоганом и Томасом Ог Мак Кёртеном - обновлённая SF резко сместилась вправо, приняв сочетание вдохновлённого ANH корпоративизма, основанного на папских энцикликах Пия XI и интегралистских идеях португальского движения Estado Novo, с радикальным христианским национализмом и собственными децентрализованными левыми социально-экономическими взглядами. Это далеко не первый случай, когда ANH заимствует идеи у левых: сам основатель движения О'Куиннегайн уже вдохновлялся американскими прогрессистами вроде Фьорелло Ла Гуардии и Рузвельтов. Поэтому многие предлагают заключить союз с этими преобразившимися «правыми левыми», тогда как другие продолжают презрительно плевать в их сторону из-за якобы «криптосиндикалистских» идей. Следует ли нам включить новую Шинн Фейн в нашу систему или же идти в одиночку, создавая новую и процветающую Эйре?"
ire.305.a:0 "Распустить их партию и прекратить всю её деятельность."
ire.305.b:0 "Вместе с «Тремя Маками» построим новую корпоративистскую SF."

ire.306.t:0 "О'Куиннегайн осуждает интегрализм"
ire.306.d:0 "Хотя ANH является наиболее заметной национал-популистской организацией Ирландии, некоторые другие группы, вдохновлённые «интегралистскими» движениями вроде португальской IL, мексиканской PIN и Action Française, безуспешно пытались склонить О'Куиннегайна к своим заблуждениям. Хьюго О'Нил остаётся видной фигурой в интегралистских кругах, и хотя сам он проживает в Португалии, сторонники обречённой идеи Реставрации всё ещё мечтают посадить его на трон теоретически восстановленной Ирландской монархии. О'Куиннегайн со всей яростью обрушился на заблуждения этих групп, объявив монархизм безумной и устаревшей идеей и провозгласив намерение уничтожить все оставшиеся в Ирландии формы аристократии. Хотя монархисты проводят параллели между ANH, его стремлением к ирландскому возрождению и восстановлением древних ирландских кланов-королей, О'Куиннегайн быстро пресёк любые попытки связать реставраторов с самим ANH, окончательно закрепив за движением республиканский характер. Лузо-интегралистская клика О'Нила далеко не первая пыталась склонить ANH к анахроничным идеалам монархизма: Реймонд Моултон О'Брайен также предпринимал жалкие попытки заручиться поддержкой ANH и заявить собственные права на ирландский престол... но в ответ получил лишь насмешки и презрение как со стороны ирландской общественности, так и от самого Кеннайре."
ire.306.a:0 "Интегрализм... какая глупость."

ire.307.t:0 "Здравствуйте, сэр, вы говорите по-ирландски?"
ire.307.d:0 "Поскольку проект ANH по гэльскому возрождению набрал полную силу, по всей стране появились новые «Briogáidí Fáinne». Эти группы получили название от «Fáinne» - булавок или значков, которыми отмечали людей, свободно владевших ирландским языком и готовых говорить на нём. Хотя большинство этих бригад официально не признано, состоят они преимущественно из разгневанных граждан с небольшим числом преподавателей ирландского языка, а Кеннайре разрешил им вершить правосудие по собственному усмотрению. Отряды патрулируют улицы и внезапно проверяют случайных граждан на знание ирландского языка. Успешно прошедшие проверку получают похлопывание по плечу, а иногда и выпивку. Провалившим же предлагается выбор: отречься от своей английскости и посещать обязательные уроки ирландского либо столкнуться с гневом бригад. Обычно наказанием становится крупный штраф или небольшой тюремный срок, однако наиболее вопиющих защитников английского варварства ждёт пожизненное заключение, а в крайних случаях - смерть."
ire.307.a:0 "LIMISTÉAR GAEILGE AMHÁIN: NÍL BÉARLA!"

ire.3070.t:0 "Через Кельтское море"
ire.3070.d:0 "Похоже, гэлы не единственный кельтский народ, благородно сражающийся против красной угрозы. По другую сторону моря, в Бретани, бретонский националистический лидер, скрывающийся от французских коммунаров за сопротивление их режиму, Неван Энафф, урождённый Селестен Лене, решил продолжить военную карьеру в Ирландии. Образцом для независимой Бретани он считает революционный пыл ирландцев и дисциплину прусского милитаризма, поэтому администрация О'Куиннегайна, сумевшая, по его мнению, соединить оба начала, пользуется у него огромным уважением.\n\nНекоторые относятся к этому предложению с определённой осторожностью из-за возможных последствий для отношений с французским правительством в изгнании и долгой истории дружественных франко-ирландских связей, несмотря на то что во время Вельткрига две страны оказались по разные стороны фронта. Однако большинство более чем радо приветствовать помощь товарища-кельтского патриота."
ire.3070.a:0 "Fáilte ar bord, Ginearálta Henaff."

#Tots

ire.308.t:0 "Зал Джимми восстановлен"
ire.308.d:0 "До восхождения к высшей власти в Ирландии Кеннаси Гролтон управлял сравнительно небольшим мемориальным залом Пирса-Коннолли в Эффринахе, где распространял социалистические идеи посредством различных бесплатных мероприятий. Зал также использовался как импровизированный суд Дойла, подобные учреждения часто создавались по всей Ирландии в противовес британской судебной системе и занимались, среди прочего, земельными спорами. Трагически, в 1932 году зал был сожжён, а меньше чем через год Гролтона депортировали, так что восстановить его он уже не успел. Однако после того, как Ирландия озарилась красным светом социализма и изгнание Гролтона закончилось, перед ним открылась прекрасная возможность вернуть любимый зал. Прежде обязанности главы государства не оставляли ему времени на реконструкцию, но сегодня Кеннаси наконец направил строительную бригаду в Эффринах, где зал будет восстановлен в прежнем виде. Республиканцы, фермеры и профсоюзные активисты встретили новость ликованием, однако несколько местных священников назвали здание «логовом проституции и синдикализма» и собрали жителей на протест, который быстро перерос в насилие. После беспорядков Гролтон приказал местной Красной гвардии задержать всех участников столкновений, а священников, ответственных за подстрекательство, разыскать и немедленно заключить в тюрьму."
ire.308.a:0 "Может, с третьего раза повезёт?"

ire.309.t:0 "Уроки изгнания Гролтона"
ire.309.d:0 "Комради Гролтон в 1933 году был несправедливо изгнан незаконным германским марионеточным режимом Коллинза и следующие четыре года провёл вдали от родины, в Нью-Йорке. Там Гролтон посвятил себя знакомству ирландской диаспоры Америки с идеями Джеймса Коннолли, а также баллотировался представителем 13-го округа Манхэттена под знаменем SPA. Теперь Гролтон вновь в безопасности на Изумрудном острове, однако годы в Соединённых Штатах глубоко изменили его. Ещё во время первого пребывания в Америке, когда он работал таксистом и барменом, Гролтон глубоко погрузился в американскую культуру и со временем пришёл к убеждению, что Ирландия никогда не примет социализм, если её по своей природе консервативная культура не будет полностью заменена американской моделью. Теперь, оказавшись у власти, он наконец способен воплотить свой радикальный замысел. Хотя «Ирландская социальная революция» Гролтона столкнулась с серьёзным сопротивлением даже внутри традиционно революционной IRA, одно не вызывает сомнений: пока Кеннаси стоит во главе страны, Ирландия уже никогда не будет прежней."
ire.309.a:0 "Ar son Gralton, Éire agus an Sóisialachas!"

ire.310.t:0 "Браудеристская Ирландия?"
ire.310.d:0 "Пока председатель [root.getleader] продолжает вести Ирландию к её конечной судьбе - подлинно бесклассовому, безденежному и безгосударственному обществу, - вопрос о том, каким именно путём мы достигнем этого идеала, возникает вновь и вновь. Хотя председатель до сих пор оставался верен партийной линии, внутри движения всё чаще появляются фракции с собственными ответами на вопрос о построении совершенного общества. Новейшая из них находится под сильным влиянием теории «Народного коммунизма», разработанной Эрлом Браудером из Социалистической партии Америки. Оставаясь в основном верным ортодоксальному марксизму, Народный коммунизм стремится объединить всех левых в единый фронт, одновременно повышая популярность самой партии, прекращая междоусобицу внутри левого движения и сосредотачивая всю энергию пролетариата на борьбе с угнетателями. Благодаря этому, а также нашим собственным связям с SPA, новая фракция приобрела значительную популярность. Учитывая широкую поддержку, председатель при желании легко сможет присвоить это движение и превратить Народный коммунизм в нашу собственную доктрину. Либо же мы можем просто очистить партию от них, как уже поступали со всеми прочими, кто осмеливался противостоять её линии."
ire.310.a:0 "Очистить партию от этой фракции, пока у них не появились новые идеи."
ire.310.b:0 "Примем их. Ирландия единым строем пойдёт к коммунизму!"

ire.3101.t:0 "Наши союзники в CPI"
ire.3101.d:0 "Видная ирландская марксистка и коммунистическая организаторша Элизабет «Бетти» Синклер входила в параллельные Революционные рабочие группы, которые loosely сотрудничали друг с другом ради свершения Революции. Во время учёбы в Париже она начала постепенно соединять марксистские и прудонистские принципы, формируя собственную синкретическую разновидность синдико-коммунизма, ставшую основой её фракции внутри ирландских крайне левых. Способная левая руководительница и революционерка, Бетти Синклер вместе со своей Коммунистической партией Ирландии согласилась полностью влиться в более крупную RWP, обеспечив создание большого и единого блока убеждённых коммунистов, готовых защищать наш Рубиновый остров. Однако многие в её рядах требуют не ограничиваться назначением Синклер на важный министерский пост, а передать ей саму исполнительную власть в стране. Подобный шаг значительно укрепил бы единство левых, не говоря уже о правах женщин, но одновременно стал бы оскорблением для сторонников Гролтона и всей их работы по построению коммунистической Ирландии. Как нам поступить?"
ire.3101.a:0 "Используем CPI в нашей Революции, объединим партии и дадим Синклер место в кабинете."
ire.3101.b:0 "Объединим партии и назначим Синклер новым Красным Тишехом Ирландии."
ire.3101.c:0 "Не будем публично выражать CPI дальнейшую поддержку."

ire.3102.t:0 "Смерть Комради Гролтона"
ire.3102.d:0 "Джеймс Гролтон, глава Революционной рабочей партии и человек, руководивший нашим Социалистическим государством с самого его рождения, сегодня трагически скончался. Единственный гражданин Ирландии, когда-либо подвергнутый депортации, Гролтон после превращения Ирландии в Социалистическое государство был избран Революционным Дойлом на должность Кахирлеаха, превратив нашу страну в подлинный Пролетарский рай и принеся на Изумрудный остров истинно гэльскую форму коммунизма.\n\nПосле смерти Гролтона члены Революционного Дойла выдвинули двух основных кандидатов на его место. Безусловно наиболее популярным является Джеймс Ларкин-младший, сын самого знаменитого ирландского революционера Джеймса Ларкина и одновременно заметный участник RWG, что уже давно вызывает серьёзную напряжённость между ним и отцом. Если младший Ларкин займёт высшую должность, едва ли многое изменится, поскольку он намерен продолжить путь, проложенный для Ирландии Гролтоном.\n\nДругим возможным кандидатом стал Фрэнк Райан, известный ирландский националист и сторонник максимистского дела. Если Райан займёт пост Кахирлеаха, большинство ожидает превращения страны в подлинно максимистское государство по образцу режимов Муссолини и Мосли. Хотя перспектива максимистской Ирландии ужасает многих, сторонники Райана утверждают, что следование линии Мосли является лишь небольшим шагом, необходимым для обеспечения свободы и безопасности Ирландии под взглядом Звёздного Плуга."
ire.3102.a:0 "Фрэнк Райан сменит Гролтона на посту Кахирлеаха."
ire.3102.b:0 "Революционный Дойл поддержит Джеймса Ларкина-младшего."

#Syndie

ire.311.t:0 "Встреча единомышленников"
ire.311.d:0 "Сегодня председатель Ирландии Ларкин и председатель Объединённых Синдикатов Америки Уильям Дадли «Большой Билл» Хейвуд завершили недельную встречу. Даже несмотря на то, что Америка всё ещё охвачена кризисом и, казалось бы, находится в шаге от окончательной победы рабочего класса, Хейвуд всё же сумел найти время для встречи со своим ирландским товарищем. Обсуждая всё на свете - от исторических революций и продолжающегося кризиса в Америке до обычных личных разговоров, - эти два прославленных синдикалистских революционера быстро возродили свою старую дружбу. Однако визит Хейвуда в Ирландию не мог длиться вечно, и потому он уже тайно покинул страну и вернулся в Америку, чтобы избежать захвата, ареста или чего похуже. Даже после его отъезда эти два гиганта, некогда бывшие просто товарищами, сошлись в новом духе социалистического единства. Связи Ларкина с IWW и SPA уходят глубоко в прошлое, и теперь, когда «Большой Джим» твёрдо удерживает исполнительную власть в Ирландии, он сделает всё возможное, чтобы помочь «Большому Биллу» одержать победу в борьбе за американского рабочего."
ire.311.a:0 "Ирландию и Америку вновь объединяет общая борьба против угнетения."

ire.312.t:0 "Проблемы в тылу"
ire.312.d:0 "Теперь, когда рабочие Ирландии наконец свободны и объединились вокруг [root.getleader], кажется, что мы действительно уверенно движемся к подлинному социализму. Однако, несмотря на весь этот идеализм, даже в руководстве нашего революционного государства не всё безоблачно. Джеймс Ларкин, лидер IWL, и его сын вступили в открытый конфликт. Джеймс Ларкин-младший во многом похож на своего отца и также является революционером, однако, в отличие от него, он убеждён, что только авангардная партия, а не профсоюзы, способна привести Ирландию к истинному социализму. Из-за этого отец и сын неоднократно публично спорили по вопросам теории. Отец, несомненно, любит сына, как и сын отца, однако столь открытые ссоры вызвали немалый скандал среди народа. Несмотря на увещевания руководства, оба продолжают спорить, и хотя предпринимались попытки примирить их, похоже, что даже родственные узы не помешают им остаться непримиримыми идейными соперниками."
ire.312.a:0 "Ну а кто не любит хорошую семейную драму?"

ire.313.t:0 "Ларкин на волосок от смерти"
ire.313.d:0 "Сегодня наш Cathaoirleach Джеймс «Большой Джим» Ларкин чудом избежал смерти, сорвавшись почти с трёхметровой высоты во время надзора за ремонтом зала имени Томаса Эша Союза рабочих Ирландии в Дублине, повреждённого в результате реакционного взрыва. Падение через незаконченный пол не убило Ларкина, однако нанесло ему тяжёлые травмы. И хотя он всё ещё жив и продолжает бороться за рабочих Ирландии, некоторые опасаются, что полностью оправиться после этого происшествия он уже не сможет: некогда неутомимый пламенный трибун, вероятно, будет прикован к инвалидному креслу до конца своих дней."
ire.313.a:0 "Ларкин сможет бороться за ирландского рабочего хоть из президентского кресла, хоть из инвалидного!"

ire.3130.t:0 "Младший Коннолли"
ire.3130.d:0 "Сын погибшего социалистического революционера Джеймса Коннолли, Родди Коннолли несёт на своих плечах тяжёлое наследие. Сформированный политическими взглядами отца, Коннолли неизменно придерживается его идеи «тройного единства»: Один Большой Профсоюз, Одно Большое Ополчение, Одна Большая Партия. После знакомства с самим Лениным, которому его представил Джек Рид, путешествия Коннолли во время злополучной Русской революции окончательно закрепили его статус в левых кругах как Ирландии, так и всего мира. Историю встречи Родди Коннолли с Лениным часто пересказывают по всей стране, особенно вспоминая его утверждение, будто Ленин говорил по-английски с ратмайнским акцентом, который приобрёл благодаря своему ирландскому учителю. Первый председатель ныне распущенной Коммунистической партии Ирландии, Коннолли со временем стал верным союзником IWL Ларкина и, похоже, сумел сделать себе имя независимо от гигантского наследия своего отца. Благодаря как высокому революционному статусу своей семьи, так и собственному авторитету его влияние невозможно отрицать, и всё больше сторонников требуют повысить положение Коннолли в Революционном правительстве - либо назначив его министром, либо сделав публичным лицом всей страны."
ire.3130.a:0 "Кому ещё возглавить Ирландию, если не сыну самого Джеймса Коннолли!"
ire.3130.b:0 "Такому славному парню явно стоит что-нибудь поручить."
ire.3130.c:0 "Власть не получают лишь потому, что твоим отцом был великий человек. Мы вообще-то воевали с Англией именно из-за такого!"

#Syndie SocDem

ire.314.t:0 "Смерть Джеймса Ларкина"
ire.314.d:0 "Человек, принёсший социализм в Ирландию, и один из самых непримиримых соперников Уильяма X. О'Брайена, Джеймс «Большой Джим» Ларкин трагически погиб, сорвавшись почти с трёхметровой высоты во время надзора за ремонтом зала имени Томаса Эша Союза рабочих Ирландии в Дублине, повреждённого реакционным взрывом. Падение через незаконченный пол стало не первой встречей Ларкина со смертью, но совершенно точно последней: рабочей бригаде пришлось отмывать мозги Большого Джима с пола пятого этажа зала Томаса Эша. Смерть Ларкина положила конец долгой и ожесточённой вражде между ним и О'Брайеном, начавшейся ещё тогда, когда Ларкин покинул Лейбористскую партию и основал IWL. Исчезновение Лейбористской партии и победа IWL на выборах 1937 года, казалось, стали последним триумфом Ларкина, однако Революционный Дойл встал на сторону О'Брайена и лейбористов, вознеся их к высшей власти и превратив Ларкина в озлобленного и утратившего влияние бывшего председателя, который при каждом удобном случае выступал против реформистской программы О'Брайена. Теперь, после смерти Ларкина, одно из самых серьёзных препятствий на пути лейбористов устранено. О'Брайен, несмотря на многолетнюю непримиримую вражду, тепло отозвался о Ларкине и вместе с тысячами других ирландцев посетил его похоронную мессу, пока улицы Дублина были заполнены провожающими."
ire.314.a:0 "Прощай, великий друг и великий враг."

ire.315.t:0 "Что делать с радикалами и умеренными?"
ire.315.d:0 "Уильям X. О'Брайен поднялся на вершину ирландской власти, и если какие-нибудь отъявленные радикалы на его месте использовали бы своё положение для нанесения неисчислимого вреда демократической системе страны, то О'Брайен и Лейбористская партия, напротив, направили свои полномочия на расширение ирландской демократии. Хотя Ирландия по-прежнему остаётся демократическим государством, большинство партий старого порядка были распущены после победы Красной революции, однако некоторые члены кабинета О'Брайена предлагают наладить сотрудничество с отдельными деятелями и силами прежней системы. Сам О'Брайен всеми силами стремится сохранить Лейбористскую партию подчёркнуто умеренной, свободной от любого радикального или антидемократического влияния. Однако крестовый поход против радикализма дорого обошёлся ему среди более левых социалистических сторонников, и если он хочет удержаться у власти, придётся пойти на уступки некоторым представителям старого порядка. В частности, сторонники Sinn Féin предложили сотрудничество. Несмотря на строгую антирадикальную позицию обеих партий, нельзя отрицать наличие общих интересов и значительного числа пересекающихся сторонников, особенно учитывая, что после краха Лейбористской партии Sinn Féin приняла немало её бывших членов."
ire.315.a:0 "Пусть Sinn Féin гниёт."
ire.315.b:0 "Отплатим Sinn Féin добром. Они всё же лучше радикалов."

ire.3150.t:0 "Гралтон снова депортирован"
ire.3150.d:0 "В 1933 году Джеймс Гралтон был депортирован с нашего прекрасного Изумрудного острова и почти четыре года вынужден был провести в изгнании. После избрания Ларкина президентом ссылка Гралтона была немедленно прекращена исполнительным указом. Хотя он надеялся стать новым Cathaoirleach на первой сессии Революционного Дойла, Гралтон потерпел сокрушительное поражение от [IRE.GetLeader], который решительно выступает против его особой формы социалистического радикализма. Поражение стало для Гралтона тяжёлым ударом, с которым он так и не смог смириться: знаменитый революционер начал кампанию протеста против нового правительства, называя [IRE.GetLeader] и его партию не более чем «криптокапиталистическими империалистическими марионетками».\nКонфликт между Гралтоном и центральным правительством достиг кульминации, когда восстановленный мемориальный зал Пирса-Коннолли был во второй раз сожжён. Центральное правительство возложило ответственность на шайку мятежных священников, однако сам Гралтон обвинил местное подразделение IRA, члены которого считали его «слишком радикальным». Беспочвенные обвинения Гралтона в адрес местной IRA привели к столкновению между группой солдат и несколькими вооружёнными вангардистскими боевиками, в результате которого пять человек погибли и ещё несколько военнослужащих были ранены.\nЭтот инцидент стал последней каплей для центрального правительства, которое объявило Гралтона иностранцем и вновь распорядилось его депортировать. Хотя это лишь ещё сильнее разозлило его и сторонников, утверждающих, что действия [IRE.GetLeader] окончательно доказывают сходство нынешнего правительства с предшествовавшими ему реакционными угнетателями, всё, что им остаётся, - кричать."
ire.3150.a:0 "Рад, что теперь это не наша проблема."

ire.3151.t:0 "Восстановление должности Taoiseach"
ire.3151.d:0 "Провозглашение Ирландской Социалистической Республики привело к централизации президентской власти и упразднению должности Taoiseach. Хотя до революции этот пост в основном подчинялся Uachtarán, Taoiseach всё же играл важную роль в управлении Ирландией. Централисты вроде Ларкина с радостью продолжили бы укреплять президентскую власть, однако возрождённая Лейбористская партия под руководством Уильяма X. О'Брайена твёрдо выступает против чрезмерно сильной исполнительной власти и провела через Дойл множество резолюций, ограничивающих полномочия президента. Следуя собственной позиции, О'Брайен официально предложил восстановить должность Taoiseach, несправедливо упразднённую после социалистической революции в Ирландии.\n\nСам факт восстановления должности практически не вызывает сомнений, однако внутри партии продолжаются споры о том, какую именно роль она должна играть. Некоторые лейбористы предлагают превратить Uachtarán в сугубо церемониальную фигуру, передав основную долю исполнительной власти Taoiseach, чтобы О'Брайен занял должность главы правительства, а другой кандидат получил практически бесполезный пост главы государства. Другие считают, что достаточно просто восстановить Taoiseach в прежней роли младшего партнёра в ирландском правительстве.\n\nНезависимо от окончательного распределения полномочий, в отношении самого кандидата существует почти полное согласие: должность займёт Томас Джонсон, человек, сменивший Джеймса Коннолли на посту лидера Лейбористской партии. Джонсон является убеждённым сторонником лейбористов, и хотя после краха партии он перешёл в Sinn Féin, О'Брайен и его товарищи согласны, что на новом посту тот будет добросовестно служить Ирландии."
ire.3151.a:0 "Настоящая власть будет принадлежать Taoiseach."
ire.3151.b:0 "Taoiseach останется заместителем Uachtarán."

ire.3152.t:0 "Конец временной диктатуры"
ire.3152.d:0 "Победа IWL на выборах 1937 года дала синдикалистам мандат на полную замену прежней политической системы Ирландии. Создание Революционного Дойла и упразднение Республики были закреплены законом президентом Ларкином, который воспользовался чрезвычайными полномочиями, чтобы обойти стандартные процедуры ирландской политики. Теперь, когда Ларкин и его приспешники устранены, О'Брайен отменил введённое IWL чрезвычайное положение и восстановил Сенат и Дойл в их довоенном и дореволюционном значении. В связи с этим президент О'Брайен объявил о проведении новых выборов в восстановленный Дойл. Услышав новости, лидеры многих ирландских политических партий вернулись из добровольного изгнания. Возрождённые политические силы Ирландии объединились, пытаясь ограничить влияние лейбористов, и сформировали так называемую «Демократическую оппозицию». После бегства де Валеры фактическим лидером этого блока стала Fine Gael, последняя партия, формировавшая правительство до прихода IWL к власти. Ричард Малкахи возглавил эту разношёрстную коалицию, которая по-прежнему глубоко недоверчиво относится к Лейбористской партии из-за её участия в революции 1937 года.\n\nПосле подсчёта голосов стало ясно, что новый состав законодательного органа отразит..."
ire.3152.a:0 "Серьёзные потери лейбористов, вынуждающие их опереться на умеренных членов Saor Éire и IWL."
ire.3152.b:0 "Серьёзные потери лейбористов, вынуждающие их опереться на остатки Sinn Féin и Национальную партию Центра."
ire.3152.c:0 "Сокрушительную победу Лейбористской партии, позволяющую ей проводить свою программу самостоятельно."

ire.3153.t:0 "Выборы [GetYear] года"
ire.3153.d:0 "Согласно конституции выборы в Дойл Эренн должны проводиться каждые пять лет. Ровно пять лет назад Дойл был восстановлен Лейбористской партией президента О'Брайена, что положило конец так называемой «Революции через бюллетень». Временная диктатура, созданная Джеймсом Ларкином и Революционным Дойлом, уступила место прежней ирландской демократии, позволив оппозиционным партиям вновь занять свои места. Против левой коалиции лейбористов выступает так называемая «Демократическая оппозиция» - объединение правоцентристских партий, недоверчиво относящихся к Лейбористской партии из-за её роли в революции 1937 года. Возглавляемая Fine Gael, Демократическая оппозиция выдвинула Ричарда Малкахи единым кандидатом и надеется раз и навсегда отстранить лейбористов от власти. Сохранится ли эта коалиция, если ей действительно удастся победить, - не знает никто."
ire.3153.a:0 "Лейбористы вновь становятся правящей партией."
ire.3153.b:0 "«Демократическая оппозиция» наносит смертельный удар по левой коалиции лейбористов."

#RadSoc

ire.316.t:0 "Психиатрическая больница Монахана превращена в музей"
ire.316.d:0 "Исторический момент наступил, когда Пидар О'Доннелл и персонал психиатрической больницы Монахана официально «заняли» учреждение, подняли над ним Красный флаг, уволили старшую надзирательницу и объявили 48-часовую рабочую неделю. Это был первый «Совет», созданный в Ирландии, и один из первых «Советов» за пределами России. И хотя Красная революция в России потерпела поражение, в Ирландии революционное пламя продолжает гореть ярко. Поэтому Cathaoirleach О'Доннелл распорядился превратить больницу в музей, а её пациентов перевести в Блэкуотер-Хаус. Новый музей будет посвящён борьбе ирландского пролетариата против капиталистического угнетения и одновременно подробно расскажет народу Ирландии о жизни его нынешнего лидера до Красной революции. Это историческое место ещё долгие годы будет вдохновлять граждан страны, знакомя их с историей революционной борьбы на Изумрудном острове."
ire.316.a:0 "А дети проходят бесплатно!"

ire.317.t:0 "Красный Ard-Rí?"
ire.317.d:0 "Многие жители нашего прекрасного Изумрудного острова имеют родственные связи с одной или несколькими ныне исчезнувшими ирландскими знатными династиями - О'Доннеллами, О'Брайенами, О'Нилами и множеством других старых кланов. Однако наиболее примечательным примером является нынешний Cathaoirleach Пидар О'Доннелл. Впервые он познакомился с социализмом, работая учителем на острове Арранмор, который нередко называют Árainn Uí Dhomhnaill, или «Араном О'Доннеллов». Именно годы, проведённые там, вдохновили его на литературные произведения, включая высоко оценённую критиками книгу «Островитяне». Хотя Пидар О'Доннелл далёк от того, чтобы считаться главным претендентом на возможное восстановление титула Ard-Rí, да и вообще едва ли является претендентом, некоторые предлагают использовать его династическое происхождение для дополнительного укрепления легитимности в качестве верховного правителя и лидера Ирландии. Более республикански настроенные круги, напротив, считают это предательством идеалов Saor Éire и требуют, чтобы О'Доннелл публично отказался от любых притязаний и титулов, связанных с древними ирландскими клановыми династиями."
ire.317.a:0 "Верховные короли занимают важнейшее место в истории Ирландии, и О'Доннелл гордится родством с ними!"
ire.317.b:0 "Отказаться от всех клановых титулов и приступить к полному упразднению этой системы!"
ire.317.c:0 "Не давать никаких комментариев."

ire.3170.t:0 "Перекрасить IRA в красный"
ire.3170.d:0 "Верный максималист Фрэнк Райан и ветеран Saor Éire Мосс Туоми стали двумя из ведущих офицеров обновлённой IRA в рамках очередного шага национального правительства по устранению всего реакционного влияния из государственной военизированной структуры. Сменив сторонников О'Даффи и радикалов, связанных с Коллинзом и Архитекторами Воскресения, Туоми и Райан вместе с целым новым поколением офицеров поведут IRA в новую, полностью Красную эпоху, свободную от реакционного и католически-правого национализма, который погубил старую IRA. Шаг за шагом, солдат за солдатом мы создадим сплочённую социалистическую вооружённую силу, полностью способную защитить Ирландию и её Революцию от любой угрозы - внешней или внутренней."
ire.3170.a:0 "Запевай песню IRA!"

ire.3171.t:0 "Не такой, как все"
ire.3171.d:0 "Джеймс Роберт Уайт, сооснователь Ирландской гражданской армии, для большинства людей выглядит ходячим противоречием или, как он сам себя называет, «не таким, как все». После Второй Ирландской революции он стал одной из ключевых фигур и человеком, который на протяжении многих лет играл важнейшую роль в подпольной деятельности ICA.\n\nУайт происходит из привилегированной военной среды, типичной для высших слоёв ольстерских протестантов. Он обучался в престижной военной академии Сандхерст, которую позднее описывал как место, где узнал больше всего о «фортификации и блуде». Вторую англо-бурскую войну он прошёл как настоящее боевое крещение, участвовал во многих сражениях, упоминался в донесениях и был награждён орденом «За выдающиеся заслуги». Именно там, однако, у него сформировалась глубокая ненависть к британскому истеблишменту.\n\nПосле войны Уайт служил адъютантом своего отца, губернатора Гибралтара, и в этот период успел встретиться как с королём, так и с кайзером. Но в конечном счёте служить ему было суждено Ирландии: после возвращения домой Уайт постепенно отказался от типичных убеждений своей среды, пройдя путь от юниониста к стороннику самоуправления, затем к республиканцу и наконец к социалисту.\n\nНезадолго до Восстания Уайт покинул ICA из-за разногласий по поводу её организации и провёл Войну за независимость в политическом забвении. Однако революции, прокатившиеся по миру после Вельткрига, вдохновили его вновь взяться за оружие во имя Ирландии. Аристократическое происхождение, безупречный внешний вид и яркая манера поведения сочетаются в нём с антиавторитарными, антиклерикальными, полу-анархистскими и христианско-социалистическими убеждениями. Именно поэтому этот человек столь важен для укрепления и продолжения существования социалистической республики."
ire.3171.a:0 "Лучший человек для этой работы."

ire.3172.t: "Снести их!"
ire.3172.d1: "Теперь, когда Ирландия является частью Интернационала и партнёром Британии, возникла необычная политическая проблема: Оливер Кромвель. К счастью, печально известный генерал не восстал из могилы, однако ирландские политики указывают на лицемерие Британии, которая на мировой арене обещает поддержку Ирландии, но у себя дома прославляет человека, устроившего резню ирландского народа. После революции 1925 года новая Британская республика проводит многочисленные параллели между собой и старым Содружеством, а Кромвель занял почётное место, прежде принадлежавшее королям и королевам. Естественно, это вызывает заметное негодование в Ирландии и ставит в крайне неудобное положение Джона Мэффи, многолетнего британского посла в стране.\n\nПо мере разрастания скандала особое возмущение вызвали так называемые «Пять Великих Статуй» Кромвеля, разбросанные по стране и давно превратившиеся в места публичного выражения почитания бывшего лорд-протектора. Общественные требования всё громче призывают британцев наконец снести их и прекратить прославлять военного диктатора, убивавшего невинных во имя завоевания. Когда проблема стала слишком серьёзной, чтобы её можно было игнорировать, Мэффи заверил правительство, что поднимет этот вопрос в Лондоне, хотя предупредил о вероятном серьёзном сопротивлении британских властей, которым будет непросто объяснить такое решение собственному обществу. И всё же, возможно, они смогут оценить международную пропагандистскую выгоду этого шага."
ire.3172.d2: "Из Ирландии в Уайтхолл поступила необычная просьба от нашего посла Джона Мэффи: снести Пять статуй Оливера Кромвеля, установленных по всей стране. Витеншоу в Манчестере, Уоррингтон в Чешире, ратуша Брэдфорда, Сент-Айвс в Кембриджшире и Вестминстерский дворец - все эти места украшены статуями бывшего лорд-протектора, занимающего значительное место в современной британской мифологии и пропаганде. Его рассматривают как духовного предшественника современной республики, а Лейбористская партия издавна прославляет Кромвеля за цареубийство и «очищение» Палаты лордов. Многие британские политики с уважением ссылаются на него, а среди народа он приобрёл почти статус национального фольклорного героя. Однако если в самой Британии принято сосредотачиваться на славном Содружестве, созданном благодаря его трудам, то действия Кромвеля в Ирландии нередко обходятся молчанием, хотя иначе как убийственными их назвать невозможно.\n\nТакое почитание и очевидное лицемерие, при котором дома мы возвеличиваем Кромвеля, а за рубежом обещаем Ирландии поддержку и солидарность, наконец стало для ирландского правительства невыносимым. Оно официально попросило нас убрать его статуи и выбрать другого героя для поклонения. Хотя недостатка в радикальных британских деятелях, способных занять место Кромвеля на постаменте у Зала Конгресса, определённо нет, предложение вызвало тревогу среди политического класса. Некоторые министры категорически отвергли его, заявляя, что не собираются чувствовать «вину» за британское прошлое. Однако в конце концов верх взяли более рассудительные головы, и вместо полного уничтожения всех памятников было предложено снять лишь некоторые. Вестминстерская статуя признана неприкосновенной из-за своего архитектурного и политического значения, но остальные вызывают меньше опасений. Конечно, это наверняка удовлетворит ирландцев и улучшит наш образ в их глазах, однако самим британцам вряд ли понравится видеть, как их лорд-протектор лишается пьедесталов."
ire.3172.a: "Долой убийцу!"
ire.3172.b: "К сожалению, прошлое уже не изменить..."
ire.3172.c: "Подготовить демонтаж лишних статуй. В музее им самое место."

#SocDem

ire.318.t:0 "Будущее Sinn Féin"
ire.318.d:0 "Sinn Féin, обычно представляющая собой относительно сплочённую силу, начала раскалываться из-за вопроса национализма. Крах Лейбористской партии фактически спас движение от утраты значения: ядро бывших лейбористов либо примкнуло к IWL Ларкина, либо перешло в Sinn Féin. Несмотря на то, что значительная часть правительства SF теперь состоит из бывших членов Лейбористской партии, целые группы начинают отходить от этой новой опоры и требуют вернуть партии её изначальную роль фронта ирландского национализма, пусть теперь и с более выраженным левым оттенком. Ещё один крупный раскол возник вокруг отношения к Католической церкви и религии: «Старая» SF выступает за секуляризм, тогда как «Новая» SF считает, что будущее принадлежит христианскому социализму. Второстепенный, но всё же заметный спор связан с экономикой. Молодые радикалы Тони Мэган, Пэдди Маклоган и Томас Ог Мак Кёртан, прозванные Тремя Маками, выступают за социальный корпоративизм и социалистическую версию португальского Estado Novo, поддерживая христианско-социалистическую фракцию SF и отвергая традиционную левую экономическую программу её светского крыла. Кто же победит в этой борьбе за будущее Sinn Féin?"
ire.318.a:0 "Побеждают светская Sinn Féin и бывшие лейбористы."
ire.318.b:0 "Побеждает христианско-социалистическая Sinn Féin."
ire.318.c:0 "При поддержке Новой Sinn Féin Три Мака приносят Ирландии национальную социал-демократию."
ire.318.e:0 "Партия возвращается к своим корням левого ирландского национализма."

ire.3180.t:0 "Объявлен официальный запрет военизированных организаций"
ire.3180.d:0 "Экономический спад, охвативший Ирландию в последние годы, вызвал резкий рост политического насилия по всему Изумрудному острову, а усиливающийся раскол между Fine Gael и Fianna Fáil подпитывает уличные драки по всей стране. Бывший Taoiseach Эоин О'Даффи командовал жестокой военизированной бригадой, известной как Армейская ассоциация товарищей, или, куда чаще, Синерубашечники. Её члены активно нападали на бойцов Ирландской республиканской армии прямо на улицах, подпитывая нескончаемый обмен насилием между двумя сторонами, продолжающийся и поныне. Хотя Коллинз ни в коем случае не одобрял это насилие, Fine Gael практически ничего не предпринимала против Синерубашечников, а те немногочисленные меры, которые всё же принимались, оставались тайными и избавляли Taoiseach от какой-либо реальной ответственности. Всё более жестокая политическая обстановка стала одной из причин прихода Sinn Féin к власти, и теперь, когда Коллинза больше нет, у О'Даффи не осталось простого пути избежать последствий. Сегодня его организация была официально объявлена незаконной вместе с несколькими другими «радикальными группами». Сам О'Даффи арестован наряду с рядом командиров ACA и других организаций, попавших под запрет. Хотя ACA стала главной целью указа, ею дело не ограничилось: несколько радикальных отколовшихся фракций IRA, включая Saor Éire, также были запрещены.\n\nНекоторые уже осудили этот шаг как бессмысленный авторитарный политический трюк, однако Sinn Féin и Катал Бру ясно дали понять свою позицию в отношении любых организаций, угрожающих миру и безопасности ирландских граждан."
ire.3180.a:0 "Sinn Féin выполняет обещания о мире."

ire.3181.t:0 "Пацифистский милитаризм Катала Бру"
ire.3181.d:0 "Независимость Ирландии была завоёвана тяжёлой борьбой и высокой ценой, однако в мире по-прежнему существуют силы, желающие подчинить и захватить наш прекрасный Изумрудный остров. Катал Бру помнил об этих коварных угрозах при формировании внешней политики Ирландии и объявил, что две силы, требующие нашего подчинения, по сути ничем друг от друга не отличаются. Ни роялисты в Канаде, ни синдикалисты в Британии не желают Ирландии добра, и, разумеется, ни те ни другие не примут своё грядущее поражение с достоинством. Нет никаких сомнений, что и Антанта, и Третий Интернационал хотят видеть Ирландию под своим сапогом. Поэтому Катал Бру начал масштабную кампанию фортификации и милитаризации, чтобы защитить нашу прекрасную Эйре от любой оккупационной силы. Теперь, когда внутренние угрозы подавлены, мы можем сосредоточить всю энергию на опасностях за пределами наших берегов. Разумеется, сама природа подарила Ирландии немало естественных укреплений, и нет сомнений, что мы способны дать отпор даже превосходящему противнику. Но просто дать отпор недостаточно. Ирландский народ должен не только защищаться от любого врага, но и наносить первый удар, перенося бой на его территорию и уничтожая угрозу до того, как она успеет причинить вред нам."
ire.3181.a:0 "Мир для меня, но не для тебя."

ire.3182.t:0 "Первая леди Sinn Féin"
ire.3182.d:0 "Каталу Бру и всей Sinn Féin уже давно помогает ведущая женщина ирландской демократической левой Маргарет Бакли, урождённая Голдинг, также известная по-гэльски как Майред Уи Бхуахалла. Первая женщина-лидер Sinn Féin и первая женщина в истории Ирландии, возглавившая политическую партию вообще, уроженка Корка едва не была казнена за участие в Пасхальном восстании, однако сумела добиться помилования и продолжила борьбу за развитие женского движения и ирландского социализма в целом. Будучи одной из немногих политиков Sinn Féin, сохранивших хорошие отношения с консервативной старой гвардией IRA, и известная практически по всей Ирландии как истинная патриотка и героиня борьбы за независимость, Бакли является одной из самых уважаемых женщин страны. Протесты, голодовки, профсоюзная организация и другие революционные действия сделали её незаменимой фигурой в возвышении Sinn Féin. Несмотря на всю известность, после прихода партии к власти именно она не была выбрана руководителем Ирландии, поскольку заслуги Бру в борьбе за независимость невозможно было игнорировать. Однако она превосходно служит рядом с ним в качестве второго человека в SF, и под их совместным руководством Ирландия действительно станет гордой, равноправной и свободной."
ire.3182.a:0 "Под её надзором борьба за равенство продолжится."
ire.3182.b:0 "Такой ветеран Sinn Féin заслуживает должности Taoiseach."

ire.3183.t:0 "Десять пунктов Меллоуза"
ire.3183.d:0 "Высокопоставленный член Sinn Féin и Teachta Dála Лиам Меллоуз предложил Дойлу программу из десяти пунктов. По его словам, она поможет вовлечь ирландских рабочих в республиканскую борьбу и одновременно окончательно закрепить Sinn Féin как левую партию. Программа предусматривает передачу государству контроля над основными отраслями промышленности и транспортной системой, конфискацию крупных ранчо и поместий, установление контроля над условиями труда в мастерских, расширение общественных услуг, отмену всей арендной платы, нормирование жилищного фонда и введение выплат безработным. Кроме того, предложено всеобщее вооружение рабочих.\n\nЭти идеи пользуются широкой поддержкой левого крыла Sinn Féin, однако многие депутаты Дойла заявляют, что программа Меллоуза практически равнозначна синдикализму, и категорически отказываются её принимать. Сам Меллоуз и его сторонники отвергают подобные обвинения, подчёркивая, что он не марксист и не синдикалист, а всего лишь ирландский националист. Судьба спорного проекта остаётся неопределённой, и теперь окончательное решение лежит на Príomh Aire. Стоит ли воплотить идеи Меллоуза, или его программа слишком похожа на синдикализм, чтобы общество смогло её принять?"
ire.3183.a:0 "По мне так это чистый синдикализм..."
ire.3183.b:0 "Блестящее предложение! Немедленно воплотить."
ire.3183.c:0 "В знак нашей приверженности делу передать Меллоузу кресло Taoiseach!"

ire.3184.t:0 "Священник Sinn Féin"
ire.3184.d:0 "Гигантская фигура на пути Ирландии к независимости и человек, несомненно оставивший след в истории Sinn Féin и самой страны, преподобный Майкл О'Фланаган вновь оказался в центре внимания. На протяжении всей жизни он помогал формировать современную Ирландию множеством способов: от содействия развитию сельской местности и руководства делегацией Гэльской лиги до начала борьбы за болота Клунерко. На этом пути он приобрёл множество как друзей, так и врагов. Его громкий активизм привёл к отстранению от священнического служения и ещё сильнее втянул в конфликт с ирландским духовенством, которое в целом придерживается правых взглядов и нередко открыто поддерживает такие движения, как Синерубашечники О'Даффи.\n\nПри поддержке союзников из бывшей Лейбористской партии и к немалому раздражению некоторых партийных пуристов вроде Мэри Максуини отец О'Фланаган пытался мобилизовать поддержку различных республиканских и социалистических движений - будь то в Испании, Америке или даже Австралазии, где он когда-то жил. Убеждённый левый, он неоднократно сглаживал споры между представителями «Старой Sinn Féin» и теми, кто присоединился к партии после краха лейбористов.\n\nПомимо огромного политического вклада, О'Фланаган использует глубокие знания сельской жизни, помогая правительству разрабатывать программы освоения земель. Кроме того, он проявляет определённый изобретательский талант, зарегистрировав патенты на такие устройства, как новая конструкция очков для плавания под названием «Глаз тюленя» и собственная гироскопическая кровать для длительных морских путешествий.\n\nБудучи личным другом многих погибших в Пасхальном восстании, отец О'Фланаган открыто восхищается жертвой участников Пасхальной недели и получил признание за вклад в реорганизацию Sinn Féin в полноценную партию после восстания. Даже во времена её упадка после ухода де Валеры и Коллинза он оставался постоянным партийным оратором. Президент Бру и вся партия высоко оценили его преданность Sinn Féin и бесценный вклад в ту Ирландию, которой она является сегодня."
ire.3184.a:0 "Ценный союзник дела Sinn Féin."
ire.3184.b:0 "Славный человек - назначить его Taoiseach!"

#SocLib

ire.319.t:0 "Реабилитировать О'Даффи?"
ire.319.d:0 "Хотя Fine Gael потерпела сокрушительное и унизительное поражение на выборах 1937 года, бывший Taoiseach Эоин О'Даффи предложил Национальной партии Центра свои услуги. О'Даффи по-прежнему остаётся убеждённым сторонником Коллинза, однако его приверженность аграризму невозможно отрицать, и ввиду близости его взглядов к NCP некоторые предложили принять его предложение и превратить Синерубашечников в официальное крыло партии. Более «либеральные» члены движения осуждают О'Даффи как не более чем ирландского Кодряну, однако нельзя отрицать, что поддержка столь мощной силы, как Синерубашечники, дала бы значительный импульс сравнительно небольшому и разрозненному движению Национальной партии Центра."
ire.319.a:0 "Любой друг аграризма - друг NCP!"
ire.319.b:0 "О'Даффи немного слишком радикален для нашего вкуса..."

ire.320.t:0 "Национальная партия Центра оказывается в центре внимания"
ire.320.d:0 "Победа Национальной партии Центра в 1937 году была не иначе как чудом - чудом, потрясшим основы всей ирландской политики. Главные партии страны, Fine Gael, Fianna Fáil и Sinn Féin, потерпели поражение от прежде малозначительной Национальной лиги фермеров и налогоплательщиков, позднее ставшей известной как Национальная партия Центра. После столь неожиданной победы партия вышла на передний план умеренной ирландской политики, поглощая многих бывших членов Fine Gael, Sinn Féin и Fianna Fáil, с которыми у неё немало общего, несмотря даже на ярко выраженную антивалеровскую позицию. По мере продолжения президентского срока Фрэнка Макдермота Национальная партия Центра постепенно закрепляется в авангарде политической жизни страны. Без ошеломляющей победы 1937 года она наверняка увяла бы и исчезла или была поглощена другой политической силой, однако теперь успешное будущее партии больше не вызывает сомнений, и NCP ещё долгие годы будет влиять на судьбу Ирландии."
ire.320.a:0 "К подлинному аграрному раю!"

ire.321.t:0 "Степень аграризма"
ire.321.d:0 "Несмотря на наши аграрные убеждения, прежде мы в основном придерживались центристской позиции, чтобы привлечь как можно больше избирателей, ведь изначально были самой маленькой партией. Однако теперь, когда мы победили и уже некоторое время правим страной, стоит ли перейти к полноценному аграризму? Это позволит полностью сосредоточиться на интересах фермеров и наших сельских сторонников, но может стоить части поддержки в городах. Что же нам делать?"
ire.321.a:0 "Сохранить центристский курс ради единства Ирландии, но всё же проводить умеренный аграризм."
ire.321.b:0 "Завести тракторы и наточить плуги. Полный вперёд к пасторальному аграризму."

#Collins

ire.3220.t:0 "Ларкин отвергает результаты выборов и погибает"
ire.3220.d:0 "После сокрушительного поражения IWL на всеобщих выборах 1937 года её лидер Джеймс «Большой Джим» Ларкин начал кампанию по отрицанию итогов голосования, объявляя их незаконными, называя Коллинза диктатором и отказываясь признавать его «германский марионеточный» режим. В своих речах Ларкин утверждал, будто Коллинз массово прибегал к вбросам бюллетеней и запугиванию избирателей. Эти обвинения не содержат ни крупицы правды и служат лишь клеветнической попыткой оправдать поражение IWL. Коллинз ответил на эти заявления, заявив, что Ларкин всего лишь не способен смириться с проигрышем и что даже если бы он действительно был неким «диктатором», как утверждает Ларкин, ему всё равно не пришлось бы фальсифицировать выборы, поскольку он способен победить и честно.\nЗатем Ларкин организовал митинг в Лимерике с призывом к всеобщему локауту до тех пор, пока не будут раскрыты «истинные» результаты выборов. Трагически митинг закончился раньше времени: сцена, с которой выступал Ларкин, обрушилась из-за некачественной конструкции, убив его и ещё десять человек. Смерть Ларкина вместе с несколькими другими высокопоставленными членами IWL практически лишила движение всякого импульса, а различные фракции начали разрывать партию на части в борьбе за руководство. Услышав новости, Коллинз заявил, что, несмотря на все разногласия, Ларкин оставался великим лидером и товарищем по борьбе за независимость Ирландии, и пообещал лично присутствовать на его похоронах."
ire.3220.a:0 "Великодушный жест со стороны Коллинза."

ire.3221.t:0 "О'Даффи покидает Fine Gael"
ire.3221.d:0 "Эоин О'Даффи, занимавший пост Taoiseach при Fine Gael, уже давно доставляет партии немало головной боли, поскольку митинги его военизированных «Синерубашечников» нередко перерастают в насилие. Хотя Коллинз до определённой степени терпел их существование, недавнее крупное столкновение между IRA и Армейской ассоциацией товарищей на митинге Fine Gael в Трали стало последней каплей. Коллинз официально снял Эоина О'Даффи с должности Taoiseach, назначив вместо него Ричарда Малкахи, а также приказал полностью распустить Армейскую ассоциацию товарищей.\nРадикальная политика О'Даффи давно отталкивала более либеральных членов Fine Gael, а некоторые даже обвиняли его в связях с такими движениями, как Железная гвардия. Хотя сам О'Даффи отрицал подобное влияние и даже открыто осуждал их антисемитизм, нет никаких сомнений, что он значительно радикальнее основной массы Fine Gael, а преданность Коллинзу, похоже, была едва ли не единственным, что удерживало его в партии.\n\nПоложение О'Даффи в Fine Gael и дружба с Коллинзом уберегли его от официального исключения или ареста, однако теперь ему разрешено лишь «произносить тщательно подготовленные и краткие речи строго по рукописи», а интервью давать «только после согласования и исключительно в письменной форме», что фактически означает введение запрета на свободные публичные выступления бывшего военного лидера.\n\nХотя это далеко не худшая участь, которая могла выпасть О'Даффи, подобное решение стало для него последней каплей. Он официально покинул Fine Gael, заявив, что уходит, «потому что не намерен возглавлять Лигу молодёжи с привязанным к шее Рейхсфлагом», и приступил к созданию собственной «Национальной корпоративной партии». Вместе с ним ушла часть наиболее радикальных членов Fine Gael, однако у нового движения практически нет шансов на серьёзную электоральную победу, поскольку сам О'Даффи довольно лишён харизмы и куда лучше знаком с солдатской службой, чем с политикой."
ire.3221.a:0 "Плохой прессы О'Даффи нам не будет не хватать."

ire.322.t:0 "Найдена «Хай Нелли» Коллинза"
ire.322.d:0 "До того как подняться на вершину ирландского государства, президент Коллинз передвигался по улицам Дублина на своём знаменитом велосипеде «Хай Нелли», совершенно открыто разъезжая среди бела дня даже тогда, когда британцы активно его разыскивали. К сожалению, после избрания Коллинза президентом и переезда в Áras an Uachtaráin любимый велосипед Большого Парня был утерян, однако специальной группе удалось обнаружить его спустя годы. Президент был в восторге от возвращения давно потерянной «Хай Нелли» и приказал полностью восстановить изготовленный на заказ велосипед Rudge-Whitworth до идеального состояния, после чего даже начал использовать его для поездок по городу. Отказ президента от кортежа в пользу велосипеда привлёк огромное внимание жителей Дублина, а некоторые проколлинзовские газеты заявили, что такое поведение доказывает: президент действительно является бесстрашным человеком из народа.\nОбнаружение президентского велосипеда вновь разожгло старый спор внутри IRA, где некоторые офицеры повторно выдвинули предложение создать специальные велосипедные подразделения. Сторонники идеи утверждают, что такие части позволят сравнительно дёшево повысить скорость и манёвренность IRA, тогда как противники указывают на сложность обслуживания и маскировки велосипедов в условиях партизанской войны, а также на проблемы их транспортировки в горной местности."
ire.322.a:0 "Разрешить создание специальных велосипедных частей и назвать их в честь «Хай Нелли» Коллинза!"
ire.322.b:0 "Велосипеды на поле боя - риск, который мы не можем себе позволить."

ire.323.t:0 "Современная форма Ard-Rí для нашей Эйре"
ire.323.d:0 "Príomh Aire Михал О Коилань связан родством с О Коиланями из Уи Хонайлл Габра, знатным кланом древнего и давно исчезнувшего королевства Уи-Фидгенте в Манстере. Несмотря на его убеждённый республиканизм, близкие друзья и союзники в шутку называют Коллинза королём Манстера или Верховным королём Ирландии, к его немалому раздражению. Однако некоторые фанатичные и откровенно помешанные сторонники Príomh Aire начали воспринимать эту шутку и отдалённое благородное происхождение как доказательство чего-то большего и всё чаще почитают О Коиланя как нового неофициального Верховного короля, Ard-Rí, или короля Манстера, доводя республиканского героя войны до бешенства. Чтобы публично поставить точку в зарождающемся культе личности, Коллинз приказал посадить одного из таких чрезмерно рьяных фанатиков на сутки в колодки на главной площади Дублина, выставив псевдомонархиста на всеобщее посмешище и надеясь пресечь подобные настроения до того, как они успеют распространиться."
ire.323.a:0 "Príomh Aire не будут поклоняться!"

ire.3230.t:0 "Конец «Большого Джима»"
ire.3230.d:0 "Джеймс Ларкин, глава IWL, которая благодаря незаконным синдикалистским махинациям на выборах едва не захватила высшую власть в Ирландии, с тех пор как исчез из своей дублинской квартиры и стал подпольным мятежным лидером, превратился в неуловимую занозу для Коллинза. Ордер на его арест действует с момента раскрытия истинных результатов выборов 1937 года, а вскоре после роспуска Коллинзом Oireachtas организация Ларкина была объявлена незаконной. Некоторые члены IWL и IRA пытались сопротивляться, однако идти против «Большого Парня» и его сторонников практически равносильно самоубийству. Сам Ларкин скрывался, перемещаясь между небольшими городками в глубине страны в сопровождении небольшой группы телохранителей и фанатичных последователей, пытаясь обращать местных жителей в свою веру и промывать им мозги, чтобы поднять против Коллинза. Но по мере усиления антисоциалистической кампании Ларкин больше не может рассчитывать на помощь обычных граждан и начал собирать имущество для безрассудной попытки бежать в Америку.\n\nИменно это бегство стало его гибелью: храбрый информатор неподалёку от Голуэя сообщил властям, что Ларкин со своими людьми должен пройти через порт.\n\nНочью Stiúrthóireacht na Faisnéise нанесло удар, застав Ларкина врасплох, когда тот ожидал корабль в Новый Свет. Его люди оказали ожесточённое сопротивление, но были уничтожены превосходящими силами правительства. Сам Ларкин бежал в складское помещение и спрятался на верхних этажах, пока солдаты прочёсывали здание, но так и не нашли следов самого разыскиваемого человека Ирландии. Однако в тот момент, когда Ларкин уже решил, что ускользнул от длинной руки закона, пол прямо под его укрытием провалился, и мятежник рухнул почти с девятиметровой высоты, встретив там окончательную смерть.\n\nХотя находившиеся в здании солдаты решили, что падение наверняка убило Ларкина, они всё же всадили в тело несколько пуль, просто чтобы наверняка удостовериться, что ублюдок мёртв."
ire.3230.a:0 "Не говорите публике, что Ларкина погубила плохая плотницкая работа."

ire.324.t:0 "Объединить должности?"
ire.324.d:0 "Чтобы лучше контролировать политическую обстановку и исполнительную власть, многие сторонники Михала О Коиланя требуют объединить должность Príomh Aire, или президента, с должностью Taoiseach, или премьер-министра. Это даст Михалу О Коиланю беспрецедентную власть, которой прежде не существовало в ирландском республиканизме, однако одновременно создаст риск прямого скатывания к авторитаризму. Позиционируя себя как диктатора лишь на один срок и не желая создавать династию, Михал О Коилань заверил население, что подобная мера будет временной и прекратится после его смерти или окончания срока правления, после чего стране вновь позволят перейти к демократии. Что же следует сделать?"
ire.324.a:0 "Сохранить должности раздельными."
ire.324.b:0 "Объединить должности и предоставить Коллинзу неограниченную исполнительную власть."

ire.325.t:0 "Судьба режима Коллинза"
ire.325.d:0 "Майкл Коллинз, которого теперь всё чаще называют его гэльским именем Михал О Коилань, уже много лет является бесспорным главой исполнительной власти Ирландии, приостановив демократический процесс ради защиты страны от радикализма и синдикализма. Многие утверждают, что теперь Ирландия находится в безопасности, и ещё больше людей требуют, чтобы Коллинз выполнил обещание однажды восстановить демократию. Когда положение страны в основном стабилизировалось, что нам следует делать дальше?"
ire.325.a:0 "Продолжить «временную» диктатуру на неопределённый срок."
ire.325.b:0 "Как и обещано, уступить дорогу демократии, пока общественный порядок не рухнул."
ire.325.c:0 "Коллинз отказывается уходить, и в возникшей панике социалистическая угроза наносит контрпереворот."

ire.326.t:0 "Выборы после Коллинза"
ire.326.d:0 "После падения диктатуры Коллинза, когда тот сдержал обещание защитить Ирландию и затем уйти ради восстановления подлинной демократии, в стране вновь могут состояться демократические выборы. Республика сильна, независима и находится в безопасности, а теперь именно народу предстоит определить наше будущее. Кто же победит на грядущих выборах?"
ire.326.a:0 "Fianna Fáil."
ire.326.b:0 "Fine Gael."
ire.326.c:0 "Национальная партия Центра."
ire.326.e:0 "Sinn Féin."

#SocCon

ire.3260.t:0 "Смешанные корни де Валеры"
ire.3260.d:0 "История того, как Эймон де Валера, родившийся в американском Нью-Йорке у отца-испанского художника и ирландской матери из графства Лимерик, поднялся до руководителя Ирландии, весьма необычна. При рождении он получил имя Джордж де Валера, затем ещё младенцем был переименован в Эдварда де Валеру, а имя Эймон принял позднее, уже живя на Изумрудном острове. После смерти отца, когда мальчику было всего три или четыре года, он приехал в Ирландию жить у дяди и с каждым годом всё глубже погружался в местную жизнь. В школьные годы у него сформировалась пожизненная любовь к учёбе, родному ирландскому языку, политике и регби - интересы, которые сохранялись с ним всю жизнь. В юности он включился в Гэльское возрождение, а позднее использовал это движение как путь в политику. С тех пор де Валера стал героем борьбы за независимость и борцом за свободу, едва избежал британской казни, затем возглавил крупнейшую консервативно-республиканскую партию Ирландии Fianna Fáil, а теперь и всю страну. При этом он никогда не забывал и о двух других своих родинах - Америке и Испании, сохраняя тесные связи с оставшимися там родственниками, друзьями и новыми союзниками. Он даже продолжает поддерживать контакты с католической церковью Святого Патрика в Джерси-Сити, штат Нью-Джерси, где обвенчались его родители и где крестили его самого. Эти связи оказали влияние даже на политические взгляды де Валеры: он заимствовал идеи у ирландских организаций вроде Таммани-холла и нью-йоркских демократов, а также поддерживал испано-ирландскую линию О'Доннеллов как возможную династию ирландских королей. Такова необычная и синкретическая история де Валеры, и его странной, но уверенной рукой Ирландия движется к процветанию, благочестию и гордости."
ire.3260.a:0 "Никогда не забывай своё наследие."

ire.3261.t:0 "Ирландский фискальный консерватизм"
ire.3261.d:0 "Шон Лемасс, молодой Teachta Dála, которого всё чаще называют отцом современной ирландской экономики, является главным экономическим министром де Валеры, занимая должность министра снабжения, а формально также министра промышленности и торговли. Его карьера стремительно развивается по мере продвижения по иерархии Fianna Fáil. Лемасс выступает за бесплатное образование, расширение среднего образования для молодёжи, фискальный консерватизм, промышленный рост, увеличение иностранных инвестиций в ирландский бизнес и более тесные связи с Континентом. Он амбициозен, а его хитрая и изобретательная политика пользуется широкой поддержкой, благодаря чему Лемасс оказался прямо под крылом де Валеры. Пока де Валера держит штурвал, а Лемасс питает двигатели, Ирландия будет уверенно идти вперёд к консервативному, прибыльному и процветающему будущему."
ire.3261.a:0 "Пусть Лемасс поднимается на мачту, и Ирландия поплывёт к славе."

#O'Duffy

ire.327.t:0 "От синего к зелёному"
ire.327.d:0 "Армейская ассоциация товарищей, также известная как Молодая Ирландия, Национальная гвардия, Лига молодёжи и чаще всего просто Синерубашечники, получила своё имя благодаря синей эмблеме и синей форме. Однако этот цвет связан с англосаксонской угрозой и остаётся пережитком тех времён, когда мы ещё поддерживали некое подобие примирения с английскими псами в обмен на самоуправление. Разумеется, они предали Ирландию, и мы в ответ отвернулись от них. Но хотя с тех пор страна сильно изменилась, наша форма и всё движение по-прежнему несут это напоминание. Поэтому многие требуют провести ребрендинг в цвет нашей нации и веры и превратить Синерубашечников в Зеленорубашечников. Что мы решим?"
ire.327.a:0 "Мы Синерубашечники - отныне и навсегда."
ire.327.b:0 "Мы станем Зеленорубашечниками и разорвём последнюю связь с англосаксами."

ire.328.t:0 "Будущее правительства Mharascail"
ire.328.d:0 "Mharascail О'Даффи уже довольно долго правит Ирландией посредством собственного военного правительства, где хунта Армейской ассоциации товарищей и IRA прекрасно взаимодействуют, позволяя Mharascail сосредоточить всю власть в руках военных и лично своих ради безопасности и блага всей страны. Однако О'Даффи всегда вдохновлялся легионерскими движениями Италии и Румынии, а вместе с рядом союзников выражал интерес к переходу Ирландии в сторону патерналистского легионеризма, по-прежнему опирающегося на армию и ACA. Каким должно быть будущее ирландское правительство?"
ire.328.a:0 "Сохранить хунту Армейской ассоциации товарищей."
ire.328.b:0 "Перейти к патерналистскому легионеризму, опираясь на военный опыт ACA."

ire.329.t:0 "Гэльское спортивное возрождение"
ire.329.d:0 "Сооснователь и руководитель Гэльской атлетической ассоциации О'Даффи приступил к возрождению множества древних гэльских игр и занятий, а также созданию собственного аналога Олимпийских или Горских игр, где будут представлены традиционные кельтские испытания силы, мастерства и ловкости. В программу войдут турнир по конному поло и чемпионат по борьбе, а также метание бревна, копья и топора, рубка дров, метание колод и множество других легкоатлетических дисциплин. Мы покажем всему миру, на что способен настоящий мужчина."
ire.329.a:0 "О'Даффи сделает из вас настоящих мужчин!"

#Monarchy

ire.330.t:0 "Ирландские драгоценности"
ire.330.d:0 "Восстановление монархии в Ирландии дало прекрасную возможность исправить несправедливость тридцатилетней давности, когда неизвестные похитили Ирландские коронные драгоценности. В то время мы ещё находились под британским сапогом, однако даже все их усилия не помогли вернуть регалии. После обретения свободы молодая Республика имела куда более насущные проблемы, чем поиски блестящих украшений и дорогих звёзд. Однако отсутствие драгоценностей теперь стало определённым источником неудобства для нового монарха, который выразил сильное желание отыскать их и вернуть на законное место как новый символ ирландского единства под Короной. Разумеется, мы можем вложить огромное количество времени и сил в поиски подлинных регалий, бросив на это всю полицию страны, но неизвестно, сколько это займёт и не были ли они давно вывезены из Ирландии. Другой вариант - создать совершенно новые Коронные драгоценности, свободные от британского наследия и по-настоящему ирландские. Хотя... мы всегда можем изготовить точную копию оригиналов и просто «объявить», что нашли их. Так мы восстановим старые регалии без колоссальных затрат, которые потребовались бы для поиска настоящих."
ire.330.a:0 "Нет, нас устроят только подлинные драгоценности."
ire.330.b:0 "Народ никогда не узнает, что мы не смогли их найти."
ire.330.c:0 "Нам не нужны старые драгоценности. Создадим новые, достойные нашей славы!"

ire.331.t:0 "Странный король"
ire.331.d:0 "Его Величество король Уильям Фрэнсис Бринсли Ле Поэр Тренч, Верховный король Ирландии, 8-й граф Кланкарти, 7-й маркиз Хойсден, или, как его чаще называют, король Уильям, Странный король, полностью оправдывает своё прозвище. Практически не имея никакого желания заниматься управлением, Уильям проводит дни за бесконечным чтением книг на различные псевдонаучные темы и возится с собственными сомнительными исследованиями НЛО и прочих загадочных явлений. Главный вопрос, стоящий сейчас перед правительством, заключается в том, насколько сильно королю следует позволить влиять на управление страной. Независимо от решения, демократические выборы в Дойл и органы местной власти графств будут проводиться всегда. Однако если мы позволим эксцентричным увлечениям Уильяма проникнуть в государственную политику, монархия сможет открыто отражать собственную эзотерическую природу. Что же следует сделать?"
ire.331.a:0 "Пусть странности короля остаются за закрытыми дверями и касаются только его самого."
ire.331.b:0 "Сохранить демократию, но позволить эзотерическим взглядам короля влиять на государство."

ire.332.t:0 "Испанский король"
ire.332.d:0 "Ard-Rí Луйтбальд I родом из Испании и принадлежит к клану О'Доннеллов. Будучи союзником карлистов и глубоко верующим католиком, Верховный король Луйтбальд куда сильнее большинства возможных ирландских монархов выступает против конституционализма. Он тесно связан с союзниками на Иберийском полуострове и с рождения воспитан как аристократ. Хотя в его жилах течёт ирландская кровь и он обладает благородной легитимностью, назвать Луйтбальда настоящим ирландцем всё же трудно. Несмотря на иностранное происхождение, де Валера и Fianna Fáil поддерживают испанского аристократа, поскольку сам де Валера находится в хороших отношениях с его семьёй, а присутствие такого короля улучшает отношения Ирландии с относительно сильной и нейтральной Испанией. Оттеснённый демократией от реальной власти и увлечённый карлизмом и интегрализмом, король Луйтбальд наверняка будет править вполне достойно, если сумеет приспособиться к жизни на Изумрудном острове."
ire.332.a:0 "Да здравствует король."

ire.333.t:0 "Местный король"
ire.333.d:0 "Ard-Rí Бриан II, новый Верховный король клана О'Брайен, является потомком Бриана Бору, величайшего Верховного короля в истории Ирландии, который сверг коррумпированную династию О'Нилов, изгнал норвежских захватчиков после битвы при Клонтарфе в 1014 году и ещё в 1005 году был почтён своим народом титулом «Imperator Scotorum» - Император ирландцев. Благодаря столь славному происхождению многие считают Бриана II законным Верховным королём или даже законным императором, и сам он не раз пытался испытать силу Короны. Хотя конституционные ограничения всё ещё связывают ему руки, король Бриан раз за разом стремится двигаться в сторону всё более абсолютной монархии, желая самостоятельно направлять народ тем путём, который считает наилучшим. Несмотря на подобные амбиции, он остаётся благородным правителем, заботится о подданных и сотрудничает с демократическим правительством в Дойле ради создания лучшей Ирландии, одновременно поддерживая Гэльское возрождение и независимость куда активнее большинства. Этот «единственный истинный» Верховный король и второй Imperator Scotorum может вызывать споры из-за своих притязаний на власть, однако, несомненно, способен стать достойным монархом и настоящим героем Изумрудного острова на долгие годы."
ire.333.a:0 "Да здравствует истинный король."

ire.334.t:0 "Португальский король"
ire.334.d:0 "Ard-Rí Аод XI, или Уго О'Нил из клана О'Нилов, считается Отцом ирландского интегрализма, привезя эту идеологию на Изумрудный остров из родной Португалии. Сторонник лузо-интегрализма и движения Estado Novo, ставшего популярным в Лиссабоне, король Аод ответственен за укоренение этой иностранной, но христианской идеологии в Ирландии, хотя при этом остаётся открытым конституционализму и воле ирландского народа - своих новых подданных. Измученный болезнями Верховный король Аод XI уже готовит сына Хорхе Уго Марию О'Нила, или Шорше I, к тяжестям правления после своей неизбежной смерти. И отец, и сын твёрдо намерены построить сильную, независимую и гэльскую Ирландию, будь то на основе конституционной демократии или лузо-интегрализма. Какой путь станет судьбой страны, покажет лишь время."
ire.334.a:0 "Да здравствует Отец ирландского интегрализма."

ire.335.t:0 "Народный король Ирландии"
ire.335.d:0 "С момента восшествия Его Королевского Высочества [root.getleader] на ирландский престол большинство ожидало, что он останется в основном чужой и иностранной фигурой, пусть время от времени и будет на словах выражать уважение к ирландской культуре. Однако действительность оказалась совершенно иной. Проявив искренний интерес к культуре новой родины, этот принц Гогенцоллернов начал активно принимать участие в ирландской жизни. Его нередко можно встретить в одном из многочисленных дублинских пабов или играющим в футбол со своими верными подданными. Его Королевское Высочество также начал изучать гэльский язык, хотя до свободного владения ему ещё далеко. Более того, Его Величество оказался чрезвычайно популярным монархом. Вдобавок он последовал примеру своего брата Адальберта и добровольно принял католичество. Хотя главной причиной обращения было стремление ещё сильнее сблизиться с народом, его жена восприняла поступок совершенно иначе. Отказываясь пасть перед «варварством Рима», Её Королевское Величество официально подала на развод, и королю практически не оставалось ничего, кроме как согласиться. Решив использовать ситуацию для дальнейшего сближения с народом Эйре, монарх объявил, что намерен искать руку ирландской дворянки, хотя никаких дополнительных подробностей пока не раскрыто. Как бы то ни было, под руководством [root.getleader] Ирландия наверняка останется бастионом истинной свободы и культуры под властью своего германского, но уже почти ирландского короля."
ire.335.a:0 "Irland thar aon rud eile!"

ire.336.t:0 "Новая система наград?"
ire.336.d:0 "Независимое Королевство Ирландия, словно феникс, восставшее со страниц истории, сильно изменило и само ирландское общество. Хотя перемены и не столь драматичны, как если бы монархию внезапно навязали, например, Америке, переход к новой форме правления всё равно оказал значительное влияние на население. В условиях столь стремительных изменений многие начали цепляться за знакомые элементы прошлого в надежде вернуть хотя бы ощущение нормальности. Одним из таких институтов является прежняя ирландская система наград и орден Святого Патрика. Официальные почётные звания были упразднены после провозглашения Республики, а сам орден Святого Патрика находится в неопределённом состоянии с тех пор, как британцы бежали в Канаду. Теперь, с возвращением монархического порядка, многие ожидают и восстановления этого элемента старой системы. Поскольку пэрство уже возвращается, всё чаще раздаются требования возродить и систему наград, чтобы отмечать тех, кто особо отличился на службе королю и Ирландии. Однако различные республиканские партии, которые сами в той или иной форме уже присягнули новому монарху, выразили серьёзное недовольство подобной перспективой. Они согласны, что заслуги следует отмечать, однако считают существующей системы медалей более чем достаточной и опасаются, что восстановление старых почестей станет ещё одним шагом к тирании. Более того, восстановив орден Святого Патрика, мы фактически создадим конкурирующую организацию, поскольку номинально этот же орден продолжает существовать среди изгнанников в Канаде. Как бы то ни было, окончательное решение о восстановлении системы принадлежит Его Величеству."
ire.336.a:0 "Хорошо, восстановить систему почестей и реформировать орден Святого Патрика!"
ire.336.b:0 "Нам не нужна эта архаичная система!"

ire.337.t:0 "Новый кандидат в Верховные короли?"
ire.337.d:0 "Реймонд Моултон О'Брайен хорошо известен в ирландских монархических кругах, но далеко не с лучшей стороны. Родившийся в Британии американец и основатель крайне правой Ирландской объединённой христианско-националистической партии, О'Брайен больше всего знаменит притязаниями на давно исчезнувшие титулы графа Томонда и барона Ибракен, а также тем, что именует себя принцем княжества Томонд - вымышленного микрогосударства, созданного самим О'Брайеном как мошеннический способ придать своим дворянским притязаниям видимость законности.\n\nБудучи совершенно невменяемым человеком, О'Брайен уже неоднократно сталкивался с законом в Мексике, Нью-Йорке и Дублине и считается маргинальным участником кельтской национал-корпоративистской партии ANH, хотя её руководство старательно это отрицает. На этот раз он попал в новости из-за возмущения тем, что правительство не выдвинуло его кандидатом на титул Верховного короля, ссылаясь на собственную «благородную» кровь. Как обычно, в ответ он получил лишь смех и насмешки и был вынужден спешно удалиться, пока разъярённая толпа не начала забрасывать его мусором. Лжепринц Томонда вновь публично унижен."
ire.337.a:0 "Уберите отсюда этого психа!"
ire.337.b:0 "Дать ему символическую должность в Ирландском монархическом обществе."

#Shared

ire.338.t: "Флаг Мэри Шеннон"
ire.338.d: "Во время нашего конфликта с англичанами при Восстании 1916 года, оригинальный флаг Ирландской республики, разработанный и созданный Мэри Шеннон, был украден и вывезен британскими псами в Англию, где он сейчас и находится. Мы должны послать на их остров тайный отряд, замаскировавшийся под англичан с поддельными синдикалистскими документами, чтобы вернуть настоящий флаг!"
ire.338.a: "Вернуть оригинал и повесить его в музее."
ire.338.b: "Украсть флаг и сделать его официальным флагом Ирландии!"

ire.339.t: "Всеобщий пан-кельтский конгресс"
ire.339.d: "С возрождением пан-кельтийских настроений в Ирландии, нам представилась уникальная возможность восстановить пан-кельтийский конгресс. Первый пан-кельтийский конгресс был проведен в 1839 году и продолжался до начала 1900-х годов, но с началом Вельткрига движение потеряло большинство своих последователей из-за политических распрей. Теперь, когда Ирландия вновь стабильна и едина, призывы собрать 4 пан-кельтийскую конференцию, такими ораторами как Руараид Эрскин и Венди Вуд, возобновились. На нем будет обсуждено, кому будет позволено присоединиться к 'Кельтскому союзу'. И хотя Эрскин объявил что он поддерживает союз лишь между Ирландией и Шотландией, другие видные деятели, такие как бретонский поэт Камиль ле Мерсье Д'Эрм и бретонский друид Талдир, призвали принять в союз всех кельтов, независимо от их местонахождения. Однако, это, конечно же, вовлечет зарождающийся союз в конфликт с европейскими Державами."
ire.339.a: "Конгресс объявляет о закрытии союза для тех, кто находится дальше Британских островов."
ire.339.b: "Конгресс слышит о бедственном положении бретонцев, и приходит к ним на помощь."
ire.339.c: "Конгресс не станет сдерживаться в защите кельтских братьев. Кельты Португалии нуждаются в нашей помощи, а на исконных землях Исландии когда-то господствовали кельтские монахи. Мы освободим эти земли."

ire.340.t: "Жужжащее развитие"
ire.340.d: "Федерация пчеловодных ассоциаций Ирландии отмечает 1500-летие старой пчеловодной традиции и ирландской истории пчеловодства, поддерживая пчеловодство на местном уровне. Здешний климат идеально подходит для пчеловодства, а в сочетании с природными полями и прериями, полные разнообразных полевых цветов, у вас появляется возможность приготовить самый лучший мед на Земле. От традиционных глиняных, соломенных или глинобитных пасек до современных деревянных или металлических конструкций, пасеки и пасечников можно найти от Дублина до Корка и повсеместно между этими местами, что говорит о том, как пчеловодство является неотъемлемой частью ирландской культуры. Финансируя группы на международном уровне с помощью наших пчел, например, Лермонда и Ловелла в Новой Англии, или аграрников в Исландии и Чехии, наши пчелы помогли нам даже в улучшении международных отношений. Воистину нет ничего, что не могли бы решить мед и пчелы."
ire.340.a: "Слава богу, что пчелы существуют."

ire.341.t: "Простить или не простить"
ire.341.d: "Как только Лондон признал своё поражение; по всем Британским островам начались празднования, демонстрации в Кардиффе и Глазго вышли на улицы чтобы выразить свою поддержку нашей армии и правительству за освобождение от английского гнета. Англичане были поставлены в суровые условия до тех пор, пока мы не решим что с ними делать; хотя мы и приложили особые усилия для того, чтобы поместить Корнуолл и Остров Мэн в особые условия оккупации, делая их невосприимчивыми к суровому комендантскому часу и нормированию питания. Некоторые представители правительства призывают к 'уничтожению' англосаксов, утверждая, что они ответственны за смерть кельтской идентичности и должны быть наказаны за падение бриттов. Хотя, скорее всего, более умеренные призывы все же победят?"
ire.341.a: "'Разве я не уничтожаю своих врагов, когда делаю их своими друзьями?' Мы должны вознести англичан, чтобы помочь им принять их бриттское прошлое."
ire.341.b: "'Блажен тот, кто возьмет и разобьет младенцев твоих о камень!' Начать очищение острова от английской скверны."

ire.342.t: "Родовой вопрос"
ire.342.d: "По мере того, как военные единицы затихают по всей Шотландии, последние отряды вдоль Клайда и Троссахса, наконец, сдались, опасаясь длительной осады и её последствий. Условия нашей оккупации относительно мягкие, и в порты Саллом-Во и Инверкитинг уже направляются конвои с продовольствием, в надежде помочь избавиться от продовольственного кризиса, который сейчас испытывают наши северные братья. Однако, пан-кельтские члены правительства требуют ответа на вопрос, как нам следует относиться к местным пиктским традициям. Пикты были группой, занимавшей Шотландию и северную Англию до распространения гэльских идей из Ирландии. В начале 11 века, местные пикты слились с ирландскими иммигрантами и захватчиками, после чего сформировали тем самым гэльскую идентичность. Наша оккупация дала нам возможность принять пиктов как своих кельтских братьев, возможно, давая нам возможность завоевать тем самым некоторую симпатию со стороны шотландцев, которые всё ещё могут чувствовать связь со своими пиктскими предками. В другом случае, мы можем отвергнуть пиктов как слабых и неспособных сопротивляться превосходящей гэльской культуре, и сосредоточиться исключительно на достижениях гэльских шотландцев."
ire.342.a: "Пикты наши братья, и мы будем относиться к ним подобающе."
ire.342.b: "Пикты вымерли не просто так. Отправим их на свалку истории и начнем избавляться от их традиций. Шотландцы всегда были гэльцами."

ire.343.t: "Ирландские поля смерти"
ire.343.d: "Солдаты продолжали патрулирование, маршируя по болотистой трясине, пока ведущий пехотинец не сделал ещё один шаг вперёд. Через несколько мгновений, из ниоткуда появилась небольшая канистра, что поднялась из грязи до уровня бедер и взорвалась, разбросав осколки и плоть стрелка во все стороны. Большая часть его тела превратилась в розовый туман, в то время как уцелевшие куски упали, как мясные отходы на перерабатывающем заводе. Среди отряда началась паника, и вскоре двое солдат разбежались кто куда, вследствие чего их постигла та же взрывоопасная, кровавая участь. Похоже, что правящий режим стал использовать осколочные мины 'прыгающая Бетти' против своих врагов, минируя критические области бомбами, предназначенными для прыжка до уровня пояса прежде чем взорваться. Ходили слухи о том, что предателей казнили, привязывая к минам перед взрывом, но минировать свою родину настолько казалось чем-то немыслимым. Тем не менее, вот они, предатели, взорванные на мелкие кусочки. Если какие-либо повстанцы и прочие недоброжелатели собираются предпринять что-то против правительства, им лучше делать это смотря под ноги, ведь в Ирландии [root.getleader] ни один путь более не будет для них безопасен."
ire.343.a: "Отвратительная, но необходимая жестокость для свободной и безопасной Ирландии..."

ire.344.t: "Ячменный сок"
ire.344.d: "С созданием Атлантической торговой комиссии, торговые отношения с нашими друзьями в США лучше чем когда-либо. Отчасти это связано с одним из самых известных экспортных товаров Ирландии - виски. Будь то плавный Джеймсон, сладкий Бушмилс или любой другой из самых известных ирландских виски, американцы покупают его быстрее, чем мы успеваем его произвести. Чтобы наши винокуры не сбавили в качестве и не разрушили то, что имеет шанс стать поистине уникальной национальной отраслью промышленности, разные фракции в правительстве предложили предоставить виноделам небольшую единовременную сумму. Надеясь, что эти деньги могут быть использованы для расширения производства без ущерба технологическим процессам, эти фракции считают, что и хотя вряд ли можно ожидать больших результатов в краткосрочной перспективе, в долгосрочной же они могут значительно превзойти все затраты. Меньшая часть этих групп желает, чтобы мы также субсидировали и фермеров, выращивающих рожь, пшеницу и другие виды зерна, используемого для производства виски. В любом случае, ирландский виски стремится к тому, чтобы стать постоянным продуктом американцев."
ire.344.a: "Дать винокурам спасательный круг, они это заслужили."
ire.344.b: "Поддержать винокуров и фермеров, мы должны защитить эту славнейшую отрасль промышленности."  
ire.344.c: "Они несомненно могут справиться и с теми деньгами, что извлекли из американцев."

ire.345.t: "Судьба тирана"
ire.345.d: "После долгой и упорной борьбы Лондон, наконец, пал. По мере того, как ирландские войска заменяют английскую полицию и начинают восстанавливать порядок, пришло время найти ответ на английский вопрос. Большинство согласны с тем, что простого сохранения оккупации недостаточно, и англичанам должна быть предоставлена автономия. Наиболее распространенное предложение - просто позволить англичанам сформировать своё собственное правительство, хоть и под нашим контролем, ведь мы лучше них, не так ли? Другие же, однако, настаивают на том, чтобы мы поступили как англичане и создали 'Английское Свободное государство'. По образцу нашего собственного Свободного государства, этот план призывает к созданию государства, которое технически является частью Ирландии, только с беспрецедентным уровнем автономии. И наконец, последнее, самое радикальное решение этой ситуации предлагает нам дать англичанам возможность побывать в шкуре Ирландии. Их язык, религия, пища и образ жизни в целом должны быть уничтожены и заменены ирландской культурой. Хотя такой исход даст свои плоды не раньше чем одно поколение спустя, со временем английская культура останется лишь воспоминанием, а Лондон будет таким же ирландским городом, как и Дублин. Также мы могли бы и просто сохранить оккупацию, что хоть и потребует больших затрат, но всё ещё остаётся самым простым вариантом. В любом случае, нам необходимо принять решение как можно скорее."
ire.345.a: "Позволить англичанам сформировать правительство."
ire.345.b: "Создать Английское Свободное государство!"
ire.345.c: "Англия должна быть уничтожена."
ire.345.e: "Продолжить оккупацию."

ire.346.t: "Национальный флаг Ирландии"
ire.346.d: "Вовремя правления Коллинза, оппозиция использовала солнечный флаг, который корнями уходит в ирландскую мифологию, принятую в 19 веке националистами как символ движения, борящегося за новую Ирландскую республику. Сейчас, когда Ирландия стоит на перепутье, мы должны решить, следует ли нам использовать солнечный флаг как национальный, или же сохранить ирландский триколор, использующийся со времен Пасхального восстания."
ire.346.a: "Заменить триколор? Ни за что!"
ire.346.b: "Почему бы не использовать флаг Мэри Шеннон?"
ire.346.c: "Использовать солнечный флаг."
ire.346.e: "Использовать солнечный флаг, но добавить алебарду и Звездный плуг."
ire.346.f: "Использовать солнечный флаг, но освеженный."
ire.346.g: "Оставить текущий флаг."

ire.347.t: "Солдат Царства Божьего"
ire.347.d: "После того как Ирландия, к ужасу многих жителей Ольстера, приняла католицизм как неотъемлемый аспект своей государственности, произошло то, что можно назвать 'взлетом' католической жизни в стране. Люди начали ежедневно посещать cвятую Мессу, праздничные дни раньше бывшие в основном светскими, стали приобретать все большую религиозную атмосферу. Наряду с этим, влияние католицизма стало распространяться и на политику, поскольку различные католические группы, что раньше были безвестны, теперь же переживают огромный рост популярности. Одной из таких групп была Мария Дуче, возглавляемая святым отцом Дэнисом Фейи. В то время как сама группа относительно мала, это не касается их лидера. Отец Фэйи стал чем-то вроде местной легенды, когда речь заходит о  его богословных трудах. И хотя это сложно реализовать, социальное Царствование Христа призывает признать божье Царство на мирском уровне. Требуя ото всех правительств соответствия учению Христа, они призывают к тому, чтобы Католическая церковь и её учение стали высшим законом страны, независимо от того факта, является ли страна католической или нет. На личностном уровне, отец Фэйи известен как ярый антисемит, часто заявляющий, что 'мы должны бороться с еврейским влиянием натурализма на наш мир. В этом случае, поскольку божественный план для мира существует только один, каждый человек должен быть антисемитом.'\n\nНесмотря на это, в правительстве прозвучали призывы принять учения Фэйи, которые действительно являются важными с точки зрения Царствования Христа. Поскольку мы на основании указа являемся католической нацией, мы должны довести это до логического завершения. Одни, в основном люди левых и секулярных взглядов, верят что Фэйи опасен, и за свой антисемитизм с радикальным католицизмом должен быть подвержен порицанию и цензуре, а его Мария Дуче должна быть запрещёна. Вторые просто хотят чтобы мы оставили этого старика с его радикальными тенденциями в покое и игнорировали. В любом случае, отец Фэйи, возможно, самый бравый солдат Христа и он будет им оставаться, несмотря на наши действия."
ire.347.a: "Vivat Christus Rex! Внять Фэйи и его учениям!"
ire.347.b: "Фэйи опасен. Зацензурить его и запретить его организацию."
ire.347.c: "Просто игнорировать Фэйи. Он всего лишь небольшая рыба в целом океане."

##name picker my beloved

ire.338.t:0 "Флаг Мэри Шеннон"
ire.338.d:0 "Во время нашего конфликта с англичанами в ходе восстания 1916 года первоначальный флаг Ирландской Республики, разработанный и созданный Мэри Шеннон, был похищен британскими псами и увезён в Англию, где находится и по сей день. Поскольку становится всё очевиднее, что столкновение между нами и Англией неизбежно, часть правительства выступила с предложением разработать план возвращения флага на случай, если мы или кто-либо из наших союзников оккупируем земли Вероломного Альбиона. Война, по всей видимости, уже на горизонте, а желание заранее определить порядок действий в отношении британцев только усиливается, поэтому предложение было принято с намерением впоследствии расширить его до общего плана возвращения различных сокровищ, находящихся у британцев. Когда проект уже был одобрен, другая небольшая группа предложила пойти ещё дальше и официально принять флаг 1916 года в качестве государственного. Хотя он менее узнаваем, чем триколор, флаг с Прокламацией остаётся исключительно мощным символом, а для некоторых борцов за Ирландию даже более значимым. Его принятие стало бы недвусмысленным сигналом британцам и им подобным, что мы не остановимся, пока наша свобода не будет окончательно обеспечена. Так или иначе, если и когда Англия падёт под сапогами ирландских солдат, у нас уже будет чёткий план возвращения национальных реликвий."
ire.338.a:0 "Мы вернём себе нашу историю, но менять флаг - это уже слишком."
ire.338.b:0 "Вернуть оригинальный флаг и сделать его официальным флагом Ирландии!"

ire.339.t:0 "Всеобщий панкельтский конгресс"
ire.339.d:0 "Возрождение панкельтских настроений в Ирландии предоставляет нам уникальную возможность восстановить Панкельтский конгресс. Первый Панкельтский конгресс состоялся в 1839 году, а его деятельность продолжалась вплоть до начала XX века, однако с началом Вельткрига движение растеряло большую часть сторонников из-за политических раздоров. Теперь, когда Ирландия вновь стабильна и едина, видные панкельтские деятели, такие как Руарайд Эрскин и Венди Вуд, призывают созвать четвёртую Панкельтскую конференцию, на которую будут приглашены представители всего кельтоязычного мира для обсуждения того, кому следует предоставить право вступить в предполагаемый «Кельтский союз». Сам Эрскин заявляет, что поддерживает союз лишь между Ирландией и Шотландией, однако другие заметные голоса, включая бретонского писателя Камиля Ле Мерсье д’Эрма и бретонского друида Тальдира, требуют принять в Союз всех кельтов независимо от места их проживания, хотя это, несомненно, втянет молодое объединение в конфликты с европейскими державами."
ire.339.a:0 "Конгресс постановляет: Кельтский союз останется закрытым для тех, кто находится за пределами Британских островов."
ire.339.b:0 "Конгресс услышит бедствия бретонцев и придёт им на помощь."
ire.339.c:0 "Защитим также наших кельтских братьев в Португалии и Исландии, некогда освоенной монахами-папарами."

ire.340.t:0 "Жужжащее развитие"
ire.340.d:0 "Федерация ассоциаций ирландских пчеловодов чтит полуторатысячелетнюю историю пчеловодства Ирландии, поддерживая это ремесло живым и процветающим по всему Изумрудному острову. Наш климат идеально подходит для содержания пчёл, а в сочетании с бескрайними полями и лугами, покрытыми разнообразными дикими цветами, он создаёт все условия для производства одного из лучших медов на Земле. От традиционных ульев из глины, соломы или грязи до современных деревянных и металлических конструкций - пасеки и пчеловоды встречаются от Дублина до Корка и повсюду между ними, благодаря чему пчеловодство остаётся живой и продуктивной частью ирландской культуры. Поддерживая нашими пчёлами зарубежные организации, включая Лермонда и Ловелла в Новой Англии, а также аграриев в Исландии и Чехии, мы даже сумели улучшить международные отношения. Пожалуй, действительно нет ничего, чего нельзя было бы решить с помощью мёда и пчёл."
ire.340.a:0 "Слава Богу за пчёл."

ire.341.t:0 "Простить или не простить"
ire.341.d:0 "Когда лондонское правительство признало окончательное поражение, по всем островам начались празднования. В Каэрдиде и Глазго демонстрации выплеснулись на улицы в знак поддержки армии и нашего правительства, освободившего Британские острова от англосаксонской угрозы. Англичане помещены под суровый оккупационный режим, пока мы не решим, что с ними делать. Впрочем, для Корнуолла и острова Мэн были установлены особые условия, избавляющие их от жёсткого комендантского часа и продовольственного нормирования, от которых страдают англичане. Некоторые представители правительства призывают к «истреблению» англосаксонской угрозы, утверждая, что именно англичане виновны в уничтожении кельтской идентичности по всей Англии и должны ответить за падение бриттов. Однако, вероятно, более спокойные голоса и умеренная позиция всё же возобладают?"
ire.341.a:0 "Мы должны возвысить англичан, чтобы они вновь приняли своё бриттское прошлое."
ire.341.b:0 "Начать очищение островов от англосаксонской скверны."

ire.342.t:0 "Вопрос предков"
ire.342.d:0 "Когда оружие по всей Шотландии умолкло, последние очаги сопротивления вдоль Клайда и в Троссахе наконец капитулировали, опасаясь затяжной осады своей родины и последствий подобного сопротивления. Условия нашей оккупации сравнительно мягки, а в такие порты, как Саллом-Во и Инверкитинг, уже прибывают продовольственные конвои, призванные смягчить кризис, охвативший наших северных братьев. Однако пангэльские круги в правительстве требуют определить, как следует относиться к местным пиктским традициям. Пикты были народом, населявшим Шотландию и север Англии до распространения гэльской культуры из Ирландии. Однако к началу XI века местные пикты смешались с ирландскими переселенцами и завоевателями, в результате чего сформировалась полноценная гэльская идентичность. Наша оккупация даёт возможность признать давно исчезнувших пиктов кельтскими братьями и, возможно, тем самым заслужить симпатии жителей отдалённых районов Шотландии, некоторые из которых до сих пор ощущают странную связь со своими пиктскими предками. С другой стороны, мы можем отвергнуть пиктов как слабый народ, неспособный сохранить себя перед превосходящей гэльской традицией, и сосредоточиться исключительно на достижениях гэльских шотландцев."
ire.342.a:0 "Пиктам будут оказаны почести как истинным кельтским братьям, и такими их будут помнить."
ire.342.b:0 "Пикты вымерли не просто так. Отправить их на свалку истории. Шотландцы всегда были гэлами."

ire.343.t:0 "Поля смерти Ирландии"
ire.343.d:0 "Солдаты продолжали патрулирование, пробираясь через вязкую болотную жижу, пока шедший впереди пехотинец не сделал один роковой шаг. Через мгновение из грязи вылетел небольшой цилиндр, подпрыгнув примерно до уровня пояса, а затем взорвался, разбрасывая во все стороны осколки и куски плоти ведущего. Взрыв пришёлся почти точно на середину тела, превратив большую его часть в кровавый туман, а уцелевшие фрагменты рухнули на землю, словно отходы на бойне. Среди бойцов началась паника, и вскоре ещё двое солдат бросились в разные стороны, где их постигла столь же взрывная и кровавая участь. Похоже, правящий режим использует против своих врагов осколочные выпрыгивающие мины типа «Прыгающая Бетти», минируя важнейшие участки боеприпасами, которые перед детонацией подпрыгивают примерно до уровня пояса, чтобы нанести максимально тяжёлые увечья. Ходят слухи, что предателей режима казнят, привязывая к наземным минам перед взрывом, однако мысль о столь масштабном минировании собственной страны прежде казалась немыслимой. И всё же теперь эти изменники разлетаются на куски прямо у нас на глазах. Если какой-либо мятежник или иная враждебная сила решит выступить против правящего режима, ему лучше не отрывать глаз от земли, ведь в Ирландии [root.getleader] ни один шаг врага государства не может считаться безопасным."
ire.343.a:0 "Ужасный способ умереть, но необходимый ради свободной и безопасной Ирландии."

ire.344.t:0 "Сок ячменя"
ire.344.d:0 "С созданием Атлантической торговой комиссии наши торговые отношения с братьями по крови в Америке стали крепче, чем когда-либо. Одной из главных причин этого является один из самых знаменитых экспортных товаров Ирландии - виски. Будь то мягкость Jameson, сладость Bushmills или продукция любой другой известной ирландской винокурни, американцы скупают виски быстрее, чем мы успеваем его производить. Чтобы наши производители не начали экономить на качестве и не погубили то, что способно превратиться в по-настоящему уникальную национальную отрасль, некоторые правительственные круги предлагают выделить винокурням небольшую единовременную субсидию. Предполагается, что эти деньги позволят расширить производство без ущерба традиционным процессам. В краткосрочной перспективе отдача будет невелика, но в будущем выгоды могут многократно превзойти затраты. Более узкая часть сторонников этой меры предлагает также субсидировать фермеров, выращивающих рожь, пшеницу и другие зерновые, необходимые для производства виски, чтобы расширившиеся винокурни не остались без сырья для затора. Так или иначе, ирландский виски, похоже, уже уверенно становится столь же неотъемлемой частью жизни американцев, как и нашей здесь, на старой родине."
ire.344.a:0 "Дать винокурам спасательный круг, они его заслужили."
ire.344.b:0 "Поддержать и винокуров, и фермеров. Мы обязаны защитить эту славную отрасль."
ire.344.c:0 "Им наверняка хватит и тех денег, которые они уже вытянули из американцев."

ire.345.t:0 "Судьба угнетателей"
ire.345.d:0 "После долгой и тяжёлой кампании Лондон наконец пал. Ирландские солдаты сменяют англосаксонскую полицию и начинают восстанавливать порядок на земле, давно его лишённой, а значит пришло время окончательно решить Английский вопрос. Большинство сходится во мнении, что одной лишь оккупации недостаточно и англичанам следует предоставить какую-либо форму автономии. Наиболее распространённое предложение заключается в том, чтобы просто позволить британцам сформировать собственное правительство, пусть и под нашим надзором - в конце концов, мы ведь лучше них, не так ли? Другие предлагают обратить против англичан их же собственную политику и создать «Английское Свободное Государство». По образцу нашего прежнего Свободного Государства оно формально станет частью самой Ирландии, но получит беспрецедентно широкую автономию. Наконец, наиболее радикальный вариант предлагает заставить англичан вкусить собственного лекарства. Их язык, религия, пища и весь образ жизни будут уничтожены и заменены превосходящей ирландской культурой. Реализация такой программы займёт поколения, но со временем английская культура останется лишь воспоминанием, а Лондон станет таким же ирландским, как Дублин. Мы также можем просто сохранить нынешнюю оккупацию, что будет дорого, но зато проще всего. Так или иначе, решение необходимо принять вскоре, пока англичане снова не обрушили бедствия на наш народ."
ire.345.a:0 "Позволить англичанам сформировать собственное правительство."
ire.345.b:0 "Создать Английское Свободное Государство!"
ire.345.c:0 "Англия должна быть уничтожена!"
ire.345.e:0 "Сохранить нынешнюю оккупацию."

ire.346.t:0 "Государственный флаг Ирландии"
ire.346.d:0 "Во время правления Коллинза оппозиция использовала Солнечный флаг, уходящий корнями в ирландскую мифологию и принятый ирландскими националистами ещё в XIX веке, как символ своего движения за новую Ирландскую Республику. Теперь, когда Ирландия вновь стоит на распутье, нам следует решить, принять ли Солнечный флаг в качестве нового государственного знамени или сохранить ирландский триколор, используемый со времён Пасхального восстания."
ire.346.a:0 "Заменить триколор? Конечно же нет!"
ire.346.b:0 "Почему бы не использовать флаг Мэри Шеннон?"
ire.346.c:0 "Пусть Солнечный флаг взовьётся высоко!"
ire.346.e:0 "Использовать Солнечный флаг, но добавить пику и Звёздный плуг!"
ire.346.f:0 "Использовать современную версию Солнечного флага!"
ire.346.g:0 "Я просто сохраню нынешний флаг."

ire.347.t:0 "Пехотинец Христа-Царя"
ire.347.d:0 "С тех пор как Ирландия, к немалому неудовольствию многих в Ольстере, признала католицизм неотъемлемой частью своей национальной идентичности, по всей стране произошло то, что иначе как взрывом католической жизни назвать трудно. Люди начали ежедневно посещать Святую Жертву Мессы, праздники, прежде носившие преимущественно светский характер, вновь обрели религиозную атмосферу, и это лишь часть происходящих перемен. Одновременно значительно усилилось влияние католицизма на политику, а маргинальные католические группы, прежде пребывавшие в безвестности, испытали резкий рост популярности. Одной из таких организаций является Maria Duce, или «С Марией как нашей предводительницей», во главе которой стоит отец Денис Фэйхи. Сама организация остаётся небольшой, даже несмотря на рост поддержки, однако её лидер пользуется куда большей известностью. Отец Фэйхи стал почти местной легендой благодаря своим трудам о Христе-Царе, прежде всего о социальном царствовании Христа. Хотя это сложная доктрина, по существу она требует признания царской власти Христа и в земной политической жизни. Согласно этому учению, все правительства должны подчиняться учению Христа, а Католическая церковь и её доктрина должны стать высшим законом государства независимо от того, является ли само население католическим. На личном уровне отец Фэйхи известен как убеждённый антисемит и нередко заявляет: «Мы должны противостоять попыткам евреев пропитать мир натурализмом. В этом смысле, поскольку существует лишь один божественный замысел мирового порядка, каждый здравомыслящий человек должен быть антисемитом».\n\nНесмотря на это, внутри правительства звучат призывы принять учение Фэйхи, действительно занимающее заметное место среди доктрин о царствовании Христа. Раз уж мы декретом стали католической нацией, разве не следует довести это до логического завершения? Другие, как правило более левые или светские круги, считают, что Фэйхи следует осудить как за радикальное толкование католицизма, так и за антисемитизм, а саму Maria Duce запретить. Третьи предпочитают просто оставить этого замкнутого священника в покое и не обращать внимания на наиболее радикальные течения католицизма. Как бы мы ни поступили, отец Денис Фэйхи, возможно, останется самым преданным солдатом Христа-Царя."
ire.347.a:0 "Vivat Christus Rex! Поддержать Фэйхи и его учение!"
ire.347.b:0 "Фэйхи опасен. Осудить его и запретить его организацию."
ire.347.c:0 "Просто не обращать внимания на Фэйхи, он лишь одна рыба в огромном океане."

##name picker my beloved

ire.348.t:0 "Название нашего родного острова"
ire.348.d:0 "Ирландия, также известная в разные эпохи как Éire, Éiru, Lerne, Hibernia и под множеством других имён, в английской речи называлась Ireland ещё до начала нашего порабощения англоидными псами. За века она получила бесчисленные прозвища, среди которых Рошин Дув, Кэтлин Ни Хулихан, Мать Эйре, Шон Ван Вохт, Изумрудный остров, Старая земля и многие другие. Теперь, когда мы освободились от их власти и всё дальше отходим от английского языка, возрождая собственную исконную гэльскую речь, многие ирландцы призывают официально переименовать наш Изумрудный остров, изменив его идентичность как внутри страны, так и за её пределами, чтобы весь мир увидел возрождённое кельтское великолепие. Однако многие модернисты и патриоты нынешнего свободного государства уже привязались к имени, за которое сами сражались и ради которого погибли их товарищи, поэтому ветераны требуют сохранить название страны без изменений. Какое решение нам следует принять?"
ire.348.a:0 "Сохранить нынешнее название Изумрудного острова. Ирландия навеки!"
ire.348.b:0 "Éire, классическое гэльское название нашего острова."
ire.348.c:0 "Éiru, древнее гэльское название нашего острова в честь кельтской богини."
ire.348.e:0 "Éirinn, ещё одно имя этой кельтской богини, прославленное боевым кличем Éirinn Go Brách."
ire.348.f:0 "Erin, современный вариант более традиционного Éirinn."
ire.348.g:0 "Ivernia, название нашего острова, использовавшееся великим Птолемеем."
ire.348.h:0 "Показать другие возможные названия."

ire.349.a:0 "Ierne, название из греческого сказания об аргонавтах."
ire.349.b:0 "Ogygia, имя нашего острова в «Одиссее» Гомера и легендарная прародина Атлантиды."
ire.349.c:0 "Fiodh-Inis, гэльский перевод латинского «Insula Nemorosa», то есть «Лесистый остров»."
ire.349.d:0 "Críoch Fuinidh, гэльский перевод латинского названия нашего острова Terra Finalia."
ire.349.e:0 "Muicinis, старое название острова, данное ему испано-ирландскими Сынами Миля."
ire.349.f:0 "Scotia, названная в честь скоттов-ирландцев, чьи набеги наводили ужас на Рим и Англию."
ire.349.g:0 "Hibernia, знаменитое римское название нашего острова, любимое ирландскими поэтами."
ire.349.h:0 "Показать другие возможные названия."

ire.350.a:0 "Inis Ealga, гэльский перевод латинского названия Ирландии Insula Nobilis, то есть «Благородный остров»."
ire.350.b:0 "Inis Fáil, древнее кельтское название, означающее «Остров судьбы» и любимое монархистами за связь с Туата Де Дананн."
ire.350.c:0 "Вернуться к другим названиям."

ire.351.t:0 "Жидкое сердце Дублина"
ire.351.d:0 "Основанная Артуром Гиннессом у ворот Сент-Джеймс в Дублине в 1759 году, Guinness является национальным напитком Ирландии - ирландским сухим стаутом чёрного или очень тёмного рубинового цвета, который многие называют «жидким хлебом». Почти половина жителей Дублина либо работает на пивоварню, либо так или иначе связана с ней, поэтому компания является одной из крупнейших в Ирландии и важнейшим промышленным и финансовым центром как столицы, так и всей страны. Субсидируя предприятие и тесно сотрудничая с брендом, мы сможем направить часть его огромной прибыли на благо государства. С Guinness на нашей стороне ирландская экономика слишком велика и слишком вкусна, чтобы потерпеть крах!"
ire.351.a:0 "С их помощью Ирландия будет процветать."

ire.352.t:0 "Мир с союзниками Англии?"
ire.352.d:0 "Англия горит, а Лондонский мост наконец пал. Столетия унижений и мучений, угнетения и ненависти наконец перечёркнуты и отомщены, когда мы вдавливаем каблуки наших сапог в глотки этих псов. Однако Англия сражалась против нас не в одиночку, и за морями её жалкие союзники всё ещё атакуют наши корабли и внешние силы, готовясь к продолжению войны. У нас самих мало союзников, а вторжение на Континент пока кажется несбыточной мечтой. Следует ли нам признать действительность и попытаться добиться разрядки с оставшимися союзниками Англии или же двинуться вперёд и продолжить поход прямо в пламя ада?"
ire.352.a:0 "Просить о неохотном, но почётном мире."
ire.352.b:0 "Мы сожжём Париж дотла!"

ire.353.t:0 "Ирландия просит мира"
ire.353.d:0 "Потрясая весь мир, и, пожалуй, сильнее всего наших глупых английских союзников, ирландцы поднялись со своего Изумрудного острова и подчинили себе всю Англию, превратив значительную часть страны в руины в безумном порыве мести, когда веками угнетаемый народ наконец получил долгожданное возмездие. Мы могли бы начать контрнаступление ради спасения англичан, однако оно обойдётся невероятно дорого, а впереди нас ждут куда более крупные и опасные враги. Ирландцы, вероятно понимая это, направили в нашу столицу предложение о почётном мире: все британские земли на Островах отходят им, тогда как остальные владения Англии по всему миру остаются за нами, а боевые действия полностью прекращаются. Следует ли бросить англичан в час нужды и сосредоточиться на более важных противниках или же снова пересечь Ла-Манш, словно на дворе 1066 год, чтобы в очередной раз спасти британцев?"
ire.353.a:0 "Эти условия приемлемы. Подписать мир."
ire.353.b:0 "Мы не бросим старых союзников и двинемся на Лондон, чтобы спасти британцев."

ire.354.t:0 "Франция согласилась!"
ire.354.d:0 "К изумлению нашей делегации, французы приняли условия и полностью откажутся от вмешательства на Британских островах в обмен на британские владения за пределами нашей сферы влияния и полный мир. Мы наконец победили: разгромили британцев, отомстили им и ещё сумели выйти сухими из воды. Англоидные псы окончательно повержены, а их союзники разворачиваются и бегут. Пора поставить в этой истории последнюю точку."
ire.354.a:0 "Теперь перестроим Англию по нашему образу."

ire.355.t:0 "Французы отказались!"
ire.355.d:0 "Будь они прокляты! Вонючие лягушатники по ту сторону Ла-Манша отвергли наше предложение мира в обмен на британские земли и теперь намерены раздавить нас своей военной машиной. Глупцы! Именно мы сожжём Париж дотла, именно наши гусеницы раздавят врагов. Мы отплываем на Континент! Erin go bragh!"
ire.355.a:0 "Париж сгорит за их дерзость."

ire.356.t:0 "Те, кто всё ещё сражается"
ire.356.d:0 "Как и каждый год 24 апреля, ирландский народ собрался воедино, чтобы отметить и почтить память восстания 1916 года. Хотя формально оно завершилось поражением, именно восстание породило Свободную Ирландию, и почти вся страна за исключением Ольстера относится к этой дате с глубоким почтением. В этом году, когда исполнилось двадцать лет со дня восстания, торжества были куда грандиознее обычного. Именно поэтому почти никто не обратил внимания на прокламацию, развешанную по всей Ирландии некой группой, называющей себя «Исполнительным советом Второго Дойла». Возглавляемая Шоном О’Келли, который сам был избранным членом Второго Дойла, эта группа передала свою «законную власть» так называемому «Армейскому совету Ирландской республиканской армии», якобы имея на это право согласно резолюции Первого Дойла. Разумеется, после окончания празднований люди всё же заметили столь странное заявление. Никто не ожидал, что из этого что-либо выйдет. Однако всего через несколько недель после публикации «Армейский совет» предъявил ультиматум нашему правительству, которое он до сих пор считает Свободным Государством.\nДокумент, отправленный в безымянном письме, скорее напоминает манифест, чем ультиматум. В нём кратко излагается «легитимность» Армейского совета, описываются его цели и наконец приводятся требования. Совет утверждает, что является последним остатком Ирландской Республики, провозглашённой в 1916 году. По их словам, преемственность восходит к расколу ИРА после подписания Англо-ирландского договора, когда противники соглашения продолжили борьбу даже после того, как Коллинз объявил о конце Свободного Государства вследствие Британской революции. Что касается так называемого «Исполнительного совета», он состоит из членов Второго Дойла, который никогда официально не самораспускался, а значит, по их утверждению, продолжает исполнять прежнюю миссию. Цели Армейского совета просты: полная отмена Англо-ирландского договора и всего, что с ним связано, а также восстановление «истинной» Республики 1916 года.\nНесмотря на столь громкие заявления, ИРА даже при поддержке «Исполнительного совета» остаётся крайне маргинальной силой. Когда-то эта позиция пользовалась определённой популярностью, прежде всего среди членов Шинн Фейн, но после освобождения всей Ирландии в пределах 32 графств почти вся массовая поддержка исчезла. Даже Шинн Фейн на последнем Ардфейше отказалась от этой позиции, хотя это вызвало раскол в партии, после которого её президент Шон О’Келли вместе с небольшой группой сторонников ушёл в знак протеста.\n\nИз-за практически отсутствующей общественной поддержки большинство членов правительства считают, что ультиматум ни к чему не приведёт и нынешних мер более чем достаточно. Однако некоторые предлагают усилить антитеррористические меры, пока не пострадало ещё больше мирных жителей. Совсем небольшое меньшинство полагает, что следует сесть за стол переговоров и попытаться заключить соглашение. В конце концов, если мы сами станем «истинной» Республикой, сражаться им будет уже не за что. Так или иначе, ожидается, что Коллинз вскоре примет решение, пока и без того напряжённая ситуация не стала ещё хуже."
ire.356.a:0 "Эти глупцы нам не угрожают. Продолжить нынешние меры."
ire.356.b:0 "ИРА давно пережила своё время. Покончить с этим нелепым мятежом!"
ire.356.c:0 "Возможно, мир всё же принесёт пользу. Организовать встречу с этим «Армейским советом»."

ire.357.t:0 "Сделка ради Республики?"
ire.357.d:0 "После долгой и напряжённой серии встреч между Армейским советом ИРА и правительством президента Коллинза обе стороны опубликовали совместное заявление, официально объявив о достижении соглашения. Документ получил название Белфастского соглашения, поскольку переговоры проходили в столице Ольстера, и по существу отвечает на все претензии Армейского совета к республиканскому правительству. Прежде всего Республика Ирландия, провозглашённая президентом Коллинзом при помощи институтов Свободного Государства и потому по-прежнему считающаяся ИРА по своей сути тем же Свободным Государством, будет полностью распущена. На её месте власть над Ирландией получит Ирландская Республика, провозглашённая в 1916 году и якобы сохранённая ИРА. Во-вторых, Англо-ирландский договор, фактически уже давно отброшенный Республикой, будет официально признан недействительным. В-третьих, до выборов 1937 года страной будет управлять временное правительство во главе с Коллинзом в знак доброй воли, но включающее представителей Армейского совета и необходимый кворум Дойла. В-четвёртых, Шонад Эрен будет временно распущен, однако восстановится после предстоящих выборов 1937 года. В-пятых, все законы, принятые различными Дойлами «Свободного Государства», будут признаны Ирландской Республикой, хотя после выборов 1937 года новый Дойл станет Третьим, поскольку Второй наконец официально завершит работу. Наконец, ИРА и наши собственные Силы обороны будут объединены, равно как и их командование.\n\nНа практике изменится совсем немного, однако в глазах этих «легитимистов» Ирландия наконец окажется под властью законного правительства. Несмотря на это, соглашение ещё не ратифицировано Дойлом, поскольку многие считают его бессмысленной и ненужной уступкой ради поддержки крошечной части населения. Когда дебаты в ирландском парламенте подходят к завершению, становится ясно, что..."
ire.357.a:0 "...соглашение ратифицировано, ведь, возможно, это единственный путь к прочному миру."
ire.357.b:0 "...соглашение не прошло ратификацию, и антитеррористические операции возобновлены."

ire.358.t:0 "Воссоединение Шинн Фейн"
ire.358.d:0 "После ратификации Белфастского соглашения и восстановления Ирландской Республики во всех 32 графствах расколотая партия Шинн Фейн официально воссоединилась. В рамках объединения отколовшаяся группа под руководством Шона О’Келли официально отказалась от политики абсентеизма. Сам процесс прошёл преимущественно безболезненно, хотя детали воссоединения выглядят несколько странно. Обе половины партии в своих заявлениях приветствовали возвращение другой стороны в собственные ряды. Такая необычная формулировка объясняется тем, что каждая группа считала именно себя настоящей Шинн Фейн. Как бы то ни было, после объединения двух половин Шинн Фейн стала больше и сильнее, чем когда-либо."
ire.358.a:0 "Похоже, наследие Гриффита продолжает жить."

ire.359.t:0 "Конец Республики Ирландия"
ire.359.d:0 "Сегодня с высоты Арас-ан-Уахтаран президент Майкл Коллинз объявил об официальном роспуске Республики Ирландия. Это не переворот и не революция: роспуск Республики стал следствием Белфастского соглашения, заключённого между правительством Коллинза и остатками Ирландской республиканской армии. Согласно договору Республика Ирландия должна быть официально распущена, а её место займёт первоначальная Ирландская Республика, провозглашённая в 1916 году во время Пасхального восстания, законными наследниками которой считает себя ИРА. Во главе восстановленной Ирландской Республики поставлено временное правительство, состоящее из членов Армейского совета ИРА, которые решили позволить Коллинзу сохранить пост президента по крайней мере до ирландских выборов 1937 года. Какие именно перемены Белфастское соглашение принесёт Ирландии, ещё предстоит увидеть."
ire.359.a:0 "Erin go Braugh!"
ire.359.b:0 "Какая странная маленькая страна."

# News Events
ire.360.t:0 "Коллинз удерживает власть"
ire.360.d:0 "Майкл Коллинз остаётся президентом Ирландии, одержав очередную убедительную победу на всеобщих выборах. Коллинз руководит страной с момента обретения независимости в 1921 году, и ему приписывают важнейшую роль как в освобождении Ирландии от британского господства, так и в возвращении Северной Ирландии во время Британской революции.\n\nХотя после Чёрного понедельника популярность Коллинза заметно снизилась, а «Фине Гэл» во многом держится лишь на его личном авторитете, теперь он уверенно вступает в четвёртый президентский срок, одержав сокрушительную победу над своим давним соперником Имоном де Валерой и возродившейся «Шинн Фейн». С началом четвёртого срока президент намерен провести серию либеральных экономических реформ, чтобы окончательно оживить всё ещё вялую ирландскую экономику."
ire.360.a:0 "Значит, всё останется по-прежнему."

ire.361.t:0 "Коллинз отстранён от власти"
ire.361.d:0 "Время Майкла Коллинза на посту президента Ирландии наконец подошло к концу.\nКоллинзу приписывали важнейшую роль в обретении Ирландией независимости от Британии и возвращении Северной Ирландии во время Британской революции. С тех пор он сохранял исполнительную власть благодаря огромной народной поддержке, которая после Чёрного понедельника, похоже, окончательно иссякла.\nКоллинз потерпел поражение от своих противников и решил вернуться к жизни в вооружённых силах. Даже лишившись своего основателя, его партия «Фине Гэл» продолжает существовать и уже готовится к следующим выборам.\n\nБольшой парень покинул сцену, и теперь его место занимает [IRE.getleader]."
ire.361.a:0 "Для Ирландии закончилась целая эпоха."
ire.361.b:0 "Может, стоило больше платить своим агитаторам."

ire.362.t:0 "Коллинз распускает Эрахтас"
ire.362.d:0 "Из Ирландии поступают сообщения о беспрецедентных событиях: действующий президент Майкл Коллинз отменил результаты последних всеобщих выборов после победы синдикалистов. Столкнувшись с возможностью того, что Ирландия окажется в руках красных, Коллинз предпочёл распустить Эрахтас и отныне править посредством личных указов. Официально это преподносится как временная мера, вызванная нестабильной обстановкой, складывающейся внутри страны.\n\nТак это или нет, международная пресса уже называет случившееся закономерным итогом уязвимого положения Ирландии рядом с Британским Союзом. Куда теперь приведёт страну твёрдая рука Коллинза, ещё предстоит увидеть."
ire.362.a:0 "Разве он не должен был быть демократом?"

ire.363.t:0 "Вторая Ирландская революция"
ire.363.d:0 "Ирландия стала ещё одной европейской страной, павшей перед синдикализмом.\n\nПосле свободных выборов широкая социалистическая коалиция совершила невозможное и одержала победу у избирательных урн. Ирландские социалисты, не сделав ни единого выстрела, заняли Ленстер-хаус, а вместе с ним получили в свои руки весь государственный аппарат.\n\nТеперь ожидается, что Ирландия смягчит прежнюю враждебность к своим старым противникам в Британии и начнёт сближаться с Французской Коммуной ради дальнейшего распространения синдикализма по всему миру."
ire.363.a:0 "Похоже, дух Коннолли всё ещё жив."

ire.364.t:0 "Новый флаг Республики"
ire.364.d:0 "Какой флаг следует использовать восстановленной Законной Республике?"
ire.364.a:0 "Пусть триколор реет высоко!"
ire.364.b:0 "Используем флаг Прокламации!"
ire.364.c:0 "Поднимем флаг ИРА противников Договора!"
ire.364.e:0 "Поднимем арфу ИРА!"
ire.364.f:0 "Используем флаг с орлом, впервые поднятый во время Пасхального восстания!"
ire.364.g:0 "Выберите это, чтобы вновь использовать кельтское название. (После этого потребуется заново выбрать вариант в меню флагов)"

ire.365.t:0 "Шаг к национальной справедливости"
ire.365.d:0 "Свершилось. Лондон горит, а Англия, подобно тому как некогда поступила с нами, просыпается в цепях. Какой бы ни была наша оккупационная политика, Великий угнетатель наконец повержен. Однако смерть врага вовсе не означает, что наша работа окончена - отнюдь. Многочисленные сокровища и богатства Ирландии, долгие годы похищавшиеся и присваивавшиеся англичанами, будут одно за другим возвращены на законную родину. Первой вернётся домой знамя Мэри Шэннон, сорванное и увезённое в качестве трофея после подавления Англией Пасхального восстания. После возвращения оно займёт почётное место в величайшем музее Ирландии. Пусть это лишь небольшой жест, но он вернёт нашей нации немалую долю утраченной чести, а сама Англия станет на шаг ближе к выплате долга, который задолжала всему миру."
ire.365.a:0 "Англия заплатит за свои преступления."

ire.366.t:0 "Судьба Британского музея"
ire.366.d:0 "Одним из любимейших занятий британцев, помимо уничтожения исконной культуры своих колониальных подданных, похоже, было похищение у этих же народов артефактов и сокровищ. Объявляя их обладающими исторической или материальной ценностью, британские власти вывозили культурные реликвии и помещали их в Британский музей. Розеттский камень, части греческого Парфенона и даже табличка с фрагментами «Эпоса о Гильгамеше» - всё это было отнято у народов, с которыми сталкивались британцы. Британская революция не оставила коллекцию нетронутой, а некоторые из наиболее ценных артефактов были вывезены изгнанниками в Канаду, но музей всё равно остаётся одним из крупнейших собраний исторических ценностей в мире. Теперь, когда он оказался в ирландских руках, судьба этого хранилища истории стала предметом жарких споров. Значительная часть правительства считает, что артефакты следует вернуть их законным владельцам, а сам музей превратить в учреждение, рассказывающее историю британского империализма. Такой проект, безусловно, обойдётся чрезвычайно дорого, но народы мира смогут отпраздновать не только возвращение утраченных реликвий, но и уничтожение одного из последних символов старой Империи. Другие, к ужасу ирландских левых, предлагают не просто сохранить музей, но перевезти его сокровища в Дублин. В конце концов, кем бы ни были их прежние владельцы, теперь они принадлежат нам по праву завоевания, не говоря уже о престиже, который принесёт обладание подобной коллекцией. Наконец, некоторые считают, что музей лучше вообще не трогать. Зачем нам заниматься делами мёртвой страны? Если настоящие владельцы захотят вернуть свои реликвии, пусть просто попросят. Так или иначе, судьба Британского музея стала ещё одним вопросом о наследии Англии, и нам предстоит дать на него ответ."
ire.366.a:0 "Вернуть артефакты и преобразовать музей!"
ire.366.b:0 "Отправить артефакты в Дублин!"
ire.366.c:0 "Оставить всё как есть, у нас есть дела поважнее."

ire.367.t:0 "Рост американского туризма"
ire.367.d:0 "По мере расширения торговли и укрепления отношений между Ирландской Республикой и Соединёнными Штатами Америки поток американских туристов на наш прекрасный Изумрудный остров с прошлого года вырос в несколько раз. Паломники посещают святилище Богоматери Нокской, путешественники исследуют древние руины замка Дангвайр и аббатства Коркомро, другие осматривают достопримечательности Дублина - кажется, в стране почти не осталось места, где нельзя было бы встретить хотя бы одного американца. Туризм из США оказал великолепное влияние на экономику и практически возродил хозяйство некоторых районов, но не обошлось и без недостатков. Гарде всё чаще приходится разбираться с буйными туристами, а многие представители старых и консервативных политических кругов считают их приток первым шагом к разрушению ирландского народа. Несмотря на подобные опасения, американский туризм, вопреки протестам немногих, похоже, становится для Ирландии новой нормой. Туристы временами могут раздражать, но количество денег, которое они оставляют в стране, трудно переоценить."
ire.367.a:0 "Пока они платят, в Ирландии рады каждому!"

ire.368.t:0 "План S"
ire.368.d:0 "Сегодня во время очередного заседания президента Коллинза и его кабинета, состоящего из бывших членов Армейского совета ИРА, среди прочих, куда более обыденных вопросов министр внутренних дел Шон Рассел представил новый план. Некогда занимавший должность генерал-квартирмейстера ИРА, Рассел считается одним из наиболее радикальных её руководителей, и предложенная им идея это только подтверждает. Получивший название «Диверсионная кампания», или сокращённо «План S», проект предусматривает тайную переброску ирландских агентов и различных взрывных устройств на территорию Британского Союза для атак на экономические, военные и гражданские объекты. Разработанный Шеймусом О'Донованом и Расселом план в случае одобрения должен посеять хаос внутри Британии, одновременно отбив у неё желание вторгаться в Ирландию и ослабив перед возможным ответным вторжением с нашей стороны. Ирландские агенты при негласной поддержке правительства должны будут внедряться в британское общество, выявлять наиболее подходящие цели для подрывов и проводить атаки.\n\nНесомненно, этот план чрезвычайно радикален и почти наверняка уничтожит любые надежды на примирение с Союзом, если правительство вообще желает такого исхода. Более того, потенциальное число погибших, как среди мирных жителей, так и среди военных, может оказаться весьма значительным. И всё же определённая логика в этой кампании имеется. Если Британии придётся бороться с хаосом у себя дома, ей будет значительно сложнее вести операции против нас, поскольку часть ресурсов потребуется направить на поддержание порядка. Так или иначе, Дойл распущен до выборов 1937 года, а значит, окончательное решение принадлежит одному лишь президенту Коллинзу."
ire.368.a:0 "Одобрить план. Мы унизим Коварный Альбион!"
ire.368.b:0 "Мы не опустимся до уровня Британии. Отвергнуть этот «план»."

ire.369.t:0 "Взрывы в Британии!"
ire.369.d:0 "За последние несколько дней Англию потрясли не менее двадцати подтверждённых взрывов. Атаки были направлены против военных, гражданских и экономических объектов по всей Британии, однако их точное происхождение и конечная цель остаются неизвестными. Пока британское правительство пытается удержать ситуацию под контролем, подозрения всё чаще обращаются к Ирландской Республике. Хотя прямых доказательств обнаружено не было, британские чиновники утверждают, что нашли документ с описанием так называемого «Плана S». В нём содержится призыв к бомбовым атакам на ключевые объекты Англии, а под самим документом якобы стоит подпись многолетнего президента Ирландии Майкла Коллинза. Ирландия осудила как сами теракты, так и утверждения Британии о своей причастности, однако отказалась выполнить британское требование на ограниченный срок прекратить все поставки с острова. Пока истинные виновники остаются неизвестны, ожидается, что взрывы будут продолжаться ещё некоторое время."
ire.369.a:0 "Вот вам, британские ублюдки!"
ire.369.b:0 "Это ирландцы! Кто же ещё!"
ire.369.c:0 "Да смилуется Господь над Британией..."

ire.370.t:0 "Союзники среди ирландских правых"
ire.370.d:0 "Для столь небольшой и тесной страны политическая жизнь Ирландии удивительно разнообразна, а новые идеи продолжают бесконечно прорастать словно сорняки. Среди правых всё большее влияние под сенью нашей господствующей партии приобретают две организации - «Лиа Файл» и Ирландская ассоциация денежной реформы. Название «Лиа Файл» переводится как «Камень судьбы». Эта небольшая крайне правая популистская аграрная партия, основанная католическим священником отцом Джоном Фэем, проповедует радикальный популизм и аграризм, ксенофобию, ирландский ирредентизм и джингоизм, антисемитизм, ирландский национализм и этническую исключительность, антисиндикализм и классовое сотрудничество. Рядом с ней стоит Ирландская ассоциация денежной реформы Шеймуса Леннона и Оливера Фланагана, разделяющая схожие идеи ирландского национализма, антисемитизма и антисиндикализма, но дополняющая их антикапитализмом, христианским корпоративизмом и теорией социального кредита. Вместе эти партии представляют растущую периферию ирландской правой идеологии, и нам необходимо прямо сейчас решить, как поступить с этими радикалами. Мы можем вступить с ними в союз, включив некоторые их идеи в нашу государственную программу и избавив себя от назойливых противников, либо раз и навсегда объяснить этим никчёмным неудачникам, что пора прекратить играть в политику, пока истинные хозяева ирландских правых ведут страну к величию."
ire.370.a:0 "Сотрудничать с близкими нам группами ради единства правых."
ire.370.b:0 "Только мы являемся истинными наследниками ирландских правых. Немедленно запретить эти группы."

ire.371.t:0 "Революционные мастера пера"
ire.371.d:0 "Ветераны революции, отцы современной ирландской поэзии и возрождённой гэльской культуры, бывшие политики Свободного государства и бывшие члены ИРА Джеймс Джойс и Уильям Батлер Йейтс являются близкими союзниками нашей партии и движения. Благодаря прочным связям с нашей революционной деятельностью и более широкой борьбой за свободу Ирландии эти титаны гэльской литературы начали тесно сотрудничать с нашим режимом, распространяя наши идеи и возрождённую традиционную культуру среди народных масс своими любимыми и широко известными голосами. Их волшебные слова овладевают воображением и сердцами самого ирландского народа. Более того, оба согласились поделиться своим революционным опытом с нашими вооружёнными силами и полицией, ведь каждый имеет опыт борьбы против англичан в качестве партизана и революционного лидера. Будем надеяться, что с этими истинными героями Ирландии и мастерами пера на нашей стороне мы сумеем завоевать сердца и умы народа без кровопролития и болезненных потрясений."
ire.371.a:0 "Не жди, пока железо станет горячим, - куй его, чтобы оно раскалилось."

ire.372.t:0 "Новый тишех с культурным весом?"
ire.372.d:0 "Уильям Батлер Йейтс - один из величайших поэтов и культурных деятелей Ирландии, герой раннего движения за независимость и символ ирландских националистических правых. Бывший член Ирландского республиканского братства, лауреат Нобелевской премии, преданный и уважаемый наставник других правых деятелей искусства, включая американо-английского поэта Эзру Паунда, автор ряда маршевых песен для военизированных «синерубашечников» и открытый поклонник авторитарных, недемократических и националистических движений и режимов по всему миру - Йейтс, несомненно, полностью предан нашему режиму. Особенно близко ему правое движение социального кредита К. Х. Дугласа, которое он поддерживает уже много лет и которому также симпатизирует его давняя возлюбленная, муза и соратница по революции Мод Гонн, хотя и с более левых позиций, особенно применительно к Ирландии. Его произведения, такие как «Пасха 1916 года» и «Второе пришествие», любимы по всей стране, а сам Йейтс является деятельным и влиятельным участником нашего движения, поэтому многие считают, что его способности следует использовать ещё шире. Нет никаких сомнений, что этот мастер пера будет удостоен звания поэта-лауреата Ирландии, однако с учётом его огромной популярности, влияния на народные массы и доказанной верности партии и нашему пониманию ирландского национализма, возможно, он принесёт ещё больше пользы непосредственно в правительстве."
ire.372.a:0 "Дать ему награду и пост тишеха."
ire.372.b:0 "Дать ему награду и место в правительстве."
ire.372.c:0 "Он станет нашим поэтом-лауреатом, и не более."

ire.373.t:0 "Новый тишех с культурным весом?"
ire.373.d:0 "Джеймс Джойс - один из величайших поэтов и культурных деятелей Ирландии, герой раннего движения за независимость и символ ирландских националистических левых. Убеждённый гэльский националист, анархист, аграрный социалист, авангардный художник и философ, Джойс, несомненно, полностью предан нашему режиму. Его литературные произведения, такие как «Улисс» и «Поминки по Финнегану», любимы по всей стране, а сам он является деятельным и влиятельным участником нашего движения, поэтому многие считают, что его способности следует использовать ещё шире. Нет никаких сомнений, что этот мастер пера будет удостоен звания поэта-лауреата Ирландии, однако с учётом его огромной популярности, влияния на народные массы и доказанной верности партии и нашему пониманию ирландского национализма, возможно, он принесёт ещё больше пользы непосредственно в правительстве."
ire.373.a:0 "Дать ему награду и пост тишеха."
ire.373.b:0 "Дать ему награду и место в правительстве."
ire.373.c:0 "Он станет нашим поэтом-лауреатом, и не более."

ire.374.t:0 "Волки Ирландии"
ire.374.d:0 "До того как Ирландия превратилась в огромную сеть пахотных земель и пастбищ под влиянием английских и континентальных представлений о цивилизации, наш гэльский рай был домом для одной из крупнейших сохранившихся в Европе популяций диких волков. Однако эти дикие, величественные и благородные звери были практически полностью истреблены фермерами, защищавшими свои поля и стада, а британская колонизация и законы довершили дело: последний дикий ирландский волк был застрелен в Карлоу в 1786 году. Так на нашу землю пришло их представление о «цивилизованном» обществе, но ценой стала гибель древней дикой природы острова. Не задумываясь об экологических последствиях, ирландцы продолжали жить дальше, пока в отсутствие волков под поверхностью не вызрел новый кризис - оленья угроза! Хотя наша проблема пока не настолько серьёзна, как в соседней Шотландии, чрезмерная численность оленей уже угрожает нарушить равновесие нашей зелёной экосистемы и подтолкнуть её к коллапсу. Чтобы исправить положение, многие экологи и ведущие естествоиспытатели при поддержке влиятельных покровителей из ИРА и других националистических организаций, включая «Саор Эйре», «Шинн Фейн» и «Айлтири на хАшэйрге», выступили за возвращение на остров дикой популяции волков, которая естественным образом будет контролировать численность оленей. План предусматривает не только реинтродукцию хищников, но и создание дополнительных кормовых станций, искусственных нор для логов, использование сторожевых собак по границам сельскохозяйственных угодий, а также защитных систем для скота вроде фладри и электрических ограждений. В целом программа основана на схожих американских проектах по восстановлению и возвращению природного равновесия в Йеллоустонском национальном парке.\n\nВ случае успеха потери домашнего скота должны остаться значительно ниже исторического уровня, тогда как экосистема сможет восстановиться и прийти в равновесие благодаря сокращению чрезмерно разросшейся популяции оленей. Численность волков будет находиться под строгим контролем, и в целом программа имеет хорошие шансы на успех, однако предложение вызвало ярость среди ирландских фермеров. Они предпочитают решать проблему собственными винтовками и всё ещё помнят истории о стадах, погибавших от волчьих нападений в далёком прошлом. Ситуацию дополнительно разжигают консервативные аграрные силы вроде Национальной партии Центра, «Фианна Файл» и «синерубашечников», вставшие на сторону фермеров в надежде получить дополнительные голоса. Так простой экологический вопрос буквально за одну ночь превратился в очередное противостояние левых и правых. Положение быстро выходит из-под контроля, поэтому именно нашему правительству предстоит поставить в споре последнюю точку. Что же мы решим?"
ire.374.a:0 "Вы с ума сошли? С перенаселением мы разберёмся сами."
ire.374.b:0 "Спустить волков! Леса Ирландии вновь станут дикими и свободными."

ire.375.t:0 "Судьба колонны Нельсона"
ire.375.d:0 "Теперь, когда экономические бедствия Чёрного понедельника благополучно остались позади, вопрос об одном из самых спорных памятников Ирландии вновь оказался в центре общественной дискуссии. Колонна Нельсона - гигантский монумент высотой 134 фута, увенчанный статуей Горацио Нельсона, - одновременно является популярной туристической достопримечательностью и историческим памятником с богатым прошлым. Столь же спорная, сколь и огромная, она подвергается критике как по политическим, так и по эстетическим причинам: одни называют её «громоздкой», пьедестал - «уродливым», а саму колонну - «неуклюжей». Сооружение на Саквилл-стрит часто рассматривается как пережиток британского империализма и вызывает немало раздражения как среди ирландского народа, так и в правительстве, где многие выступают за замену памятника или его полный снос. Хотя для жителей Дублина он в определённой степени стал привычной частью городской жизни, фигура на его вершине остаётся постоянным источником споров. В качестве компромисса предлагается заменить Горацио Нельсона другим человеком - Робертом Эмметом, Патриком Пирсом или даже более современным деятелем ирландской истории. Для некоторых это стало бы приемлемым решением, хотя другие по-прежнему требуют снести эту «ошибку», указывая в том числе на то, что колонна «мешает современному дорожному движению». Среди известных защитников памятника находятся Уильям Батлер Йейтс и Оливер Сент-Джон Гогарти, высоко ценящие его историческое и культурное значение. Пока споры продолжаются, заметные представители ирландских правых, включая «синерубашечников», заявляют, что бездействие правительства свидетельствует о слабости национального духа: «Завоеватель ушёл, но оставленные им шрамы остались, а жертва даже не пытается их убрать». Ранее вопрос был отложен из-за нехватки средств, однако теперь, когда экономическое положение Ирландии стало куда увереннее, судьба колонны снова оказалась в центре внимания. Давление на [ROOT.GetLeader] растёт, и если правительство не примет окончательного решения, какая-нибудь сомнительная группа вполне может попытаться уничтожить памятник самостоятельно."
ire.375.a:0 "Заменить Нельсона Робертом Эмметом!"
ire.375.b:0 "Заменить Нельсона Патриком Пирсом!"
ire.375.c:0 "Заменить Нельсона Майклом Коллинзом!"
ire.375.e:0 "Заменить Нельсона королём [IRE.GetLeader]!"
ire.375.f:0 "Снести эту чёртову колонну!"
ire.375.g:0 "У нас нет денег на решение этого вопроса..."

ire.376.t:0 "Колонна Нельсона уничтожена!"
ire.376.d:0 "В предрассветные часы великий город Дублин охватили паника и хаос, невиданные со времён Пасхального восстания: неизвестные террористы взяли на себя решение окончательной судьбы печально известной «Колонны Нельсона», уничтожив её мощным взрывным устройством. Бомба была заложена в верхней части монумента, разрушила середину колонны и обрушила статую Нельсона на землю вместе с сотнями тонн обломков.\n\nХотя общественная реакция на происшествие в целом оказалась довольно легкомысленной, многие выразили сожаление по поводу утраты одного из самых узнаваемых памятников Дублина. Ирландцы, как всегда не теряющие чувства юмора, уже включили уничтожение колонны в национальную массовую культуру: стихи, сувениры и песни о случившемся почти мгновенно стали частью культурного духа страны.\n\nПосле официального признания остатков сооружения аварийными уцелевший обрубок колонны было решено снести, несмотря на протесты отдельных ностальгирующих граждан. Всего через несколько дней после первого взрыва армия уничтожила остатки контролируемым подрывом. За происходящим с безопасного расстояния наблюдала толпа, которая, по сообщениям прессы, «разразилась оглушительными криками одобрения». Согласно некоторым рассказам, президент Ирландии [ROOT.GetLeader] лично позвонил в The Irish Press и предложил заголовок: «Британский адмирал покинул Дублин по воздуху»."
ire.376.a:0 "Нельсон проиграл свою последнюю битву."

ire.377.t:0 "Флаг Кельтского союза"
ire.377.d:0 "Исконные кельтские земли объединены под нашей властью, и теперь необходимо выбрать флаг, который будет представлять новый союз. Было предложено множество вариантов, однако правительство всерьёз рассматривает лишь три. Первый представляет собой объединённый флаг, соединяющий символику всех кельтских народов в единое знамя. Второй - панкельтский флаг Робера Бертелье, состоящий из двух переплетённых трискелионов. Последний вариант также выполнен в зелёном цвете, но окружён кельтскими узлами."
ire.377.a:0 "Просто сохраним нынешний флаг."
ire.377.b:0 "Кельтские узлы вокруг флага выглядят великолепно!"
ire.377.c:0 "Используем объединённый флаг, почему бы и нет?"
ire.377.e:0 "Панкельтский флаг выглядит превосходно!"

ire.380.t:0 "Пан или пропал"
ire.380.d:0 "В Военное министерство поступила довольно необычная просьба от действующего генерала Эрика Дормана-Смита, более известного среди товарищей под прозвищем «Чинк», который выразил желание временно отправиться на службу за границу. Теперь, когда положение в Ирландии стабилизировалось, а в Дублине находится дружественное социалистическое правительство, Дорман-Смит предложил направить его в Ирландскую армию в качестве командующего офицера и «советника» по военной стратегии, чтобы помочь ей освоить современные методы ведения войны, применяемые нашими собственными силами. Однако почти сразу возникли подозрения, что Дорман-Смит руководствуется вовсе не международной солидарностью, а желанием вернуться на родину своих предков в графство Каван, Ольстер, Ирландия. К тому же, по слухам, Дорман-Смит успел нажить врагов в армии из-за своего «греха» быть попросту слишком умным и совершенно не терпеть людей, не соответствующих его интеллектуальному уровню, причём он не склонен скрывать подобное отношение. Такая манера не принесла ему большого числа друзей, и, возможно, свежий старт за границей представляется ему моментом, когда придётся либо выплыть, либо пойти ко дну.\n\nПредложение вызвало неоднозначную реакцию среди военных. Некоторые офицеры подозрительно охотно поддержали его отъезд, однако появились и противники. Эдмунд Айронсайд, командующий RTC, и ведущий военный теоретик Бэзил Лиддел Гарт заявили, что отправлять Дормана-Смита служить в армию, располагающую значительно меньшими ресурсами и вряд ли способную в полной мере воспользоваться его знаниями, было бы «расточительством». Тем не менее вопрос приобрёл и политическое значение: согласие на командировку можно представить как проявление доверия к Ирландии и долгожданное признание её партнёром, а не подчинённой стороной. Разумеется, мы можем заблокировать предложение, если считаем, что Дорман-Смит принесёт больше пользы на нынешнем посту в Британской армии. Перспектива повышения, вероятно, поможет ему смириться."
ire.380.a:0 "Отличная идея. Собирай вещи!"
ire.380.b:0 "Отказать. В RTC он принесёт куда больше пользы."

ire.381.t:0 "Блудный сын"
ire.381.d:0 "За недели и месяцы, прошедшие после окончательного укрепления социалистической республики под руководством председателя [IRE.GetLeader], Ирландия стала получать всё больше дипломатических посланий от новых зарубежных союзников, которые, похоже, наконец осознали, что революция на острове пришла всерьёз и надолго. Учитывая, что всё это едва ли было бы возможно без помощи [ENG.GetNameDef], неудивительно, что переписка с ними особенно интенсивна. Сегодня пришла хорошая новость - Британская армия решила временно направить в распоряжение Ирландской армии одного из своих выдающихся генералов, уроженца графства Каван Эрика Дормана-Смита.\n\nДорман-Смит, заявивший о намерении принять ирландскую форму своего имени, считается одной из восходящих звёзд Британской армии. Его англо-ирландское происхождение делало выбор военной карьеры вполне предсказуемым, чего нельзя сказать о его чрезвычайно современных и нестандартных взглядах на будущее военного дела. До Британской революции откровенная критика тактики старого истеблишмента настроила против него значительную часть высшего командования, однако за последние несколько лет его теории приобрели куда больше признания и известности.\n\nТеперь, когда Британия и Ирландия связаны прочным союзом, он может совместить поддержку ирландского республиканизма со службой в Британской армии и лично попросил о временной командировке на родину. Дорман О'Гоуэн прекрасно понимает, что его идеи о более широком использовании технологий и мобилизации в войне проще воплотить в вооружённых силах большего масштаба, однако вновь пробудившаяся революционная атмосфера Ирландии оказалась для него слишком притягательной, чтобы отказаться."
ire.381.a:0 "Можно вывезти человека из Кавана, но Каван из человека не вывезешь."

ire.398.t:0 "Упадок Партии национального центра"
ire.398.d:0 "Партия национального центра, главное аграрное движение Ирландии, переживает тяжёлые времена после поражения на выборах 1937 года. Возникшая при поддержке других аграрных движений, таких как Фермерская партия Дениса Гори, Патрика Бакстера и Майкла Хеффернана, каждый из которых опасался за своё политическое будущее без объединения в общей организации, ПНЦ постепенно начала распадаться, поскольку многие из бывших союзников теперь покидают её ради спасения самих себя и собственных интересов. После столь невыразительного результата в 1937 году существование ПНЦ как самостоятельной партии, похоже, подходит к концу. Несмотря на отказ Макдермота объединиться с остальной «Фине Гэл», многим внутри партии стало ясно, что их лучший шанс повлиять на будущее Ирландии заключается в присоединении к более крупной политической силе.\n\nПока ПНЦ угасает, на её месте возникает новое движение, представляющее фермеров и крестьян сельской Ирландии, - «Кланн на Талван», то есть «Дети земли», прежде известная как Национальная сельскохозяйственная партия. Во главе её стоит противоречивый Майкл Доннеллан, фермер из Голуэя, бывший член FF, а затем SF, превратившийся в левого популиста и антисистемного активиста, сосредоточенного на проблемах мелких фермеров и известного частым использованием антисемитской и антиэлитарной риторики в поисках виновных в бедах ирландского крестьянства. Рядом с ним находится Джозеф Блоуик, успешный и влиятельный фермер-собственник из графства Мейо, трое братьев которого тесно связаны с Церковью. Эта новая партия с расплывчато социал-демократической направленностью сформировалась из оставшихся депутатов ПНЦ, отказавшихся переходить в «Фине Гэл», бывших членов Фермерской партии и множества мелких землевладельцев, отколовшихся из-за вопроса о снижении земельных налогов, поскольку оно повлекло бы рост косвенного налогообложения и без того ослабленных хозяйств. Восстав из пепла Партии национального центра, движение синкретически смещает аграрную политику из центра и правоцентристского лагеря, где она задыхалась при ПНЦ, в левоцентристский, где при странном сочетании социал-демократических, популистских и традиционных аграрных идей Доннеллана она, возможно, сумеет расцвести. Многие отчаявшиеся фермеры уже видят в партии последний шанс возродить аграрную политику в Ирландии. Поначалу сосредоточившись на таких вопросах, как снижение земельных налогов, лесонасаждение и частичное перераспределение земель ради более эффективного использования крупных и неэффективных хозяйств, движение ещё должно доказать, сможет ли оно действительно вернуть ирландскому аграризму былую силу. Пока же за Доннелланом и его сторонниками стоит внимательно наблюдать."
ire.398.a:0 "Такова жизнь."

ire.399.t:0 "Окончательная судьба Фианна Файл"
ire.399.d:0 "Выборы 1937 года должны были стать звёздным часом Фианна Файл, возможностью воспользоваться почти десятилетием накопившегося недовольства правительством «Фине Гэл». Вместо этого можно с уверенностью сказать, что Имон де Валера растратил этот шанс. Сосредоточившись на ожесточённых личных нападках против Коллинза, который спустя столько лет всё ещё сохранял популярность, де Валера почти ничего не добился в попытках представить себя тем лидером, который нужен Ирландии. От изгнания Коллинза, когда де Валера возглавлял Шинн Фейн, до продолжающейся вражды между двумя титанами ирландской политики - всё указывает на то, что нескончаемая вендетта де Валеры против «Большого Парня» напрямую вредит электоральным перспективам Фианна Файл. В связи с этим многие начали задумываться о том, чтобы убрать де Валеру с поста главного лица партии и заменить его Шоном Лемассом, более «либеральным» кандидатом, главной заботой которого является жизнеспособность ирландской экономики. Сам Дев решительно отвергает любые попытки сместить его, заявляя, что «1942 год станет годом Фианна Файл». Однако опросы предрекают FF почти неизбежное поражение, и даже самые преданные сторонники Дева уже не могут отрицать возможность его замены."
ire.399.a:0 "Дев ещё может победить, вот увидите!"
ire.399.b:0 "Пришло время указать де Валере на дверь."

ire.400.t:0 "Раскол в Шинн Фейн"
ire.400.d:0 "Современная Шинн Фейн возникла лишь благодаря краху другой партии - Ирландской лейбористской партии. Падение лейбористов вдохнуло новую жизнь в угасавшее движение, некогда носившее звание самой влиятельной политической партии Ирландии. После ухода Коллинза и де Валеры немногочисленные сторонники, сохранившие верность Шинн Фейн, отчаянно пытались перехватить избирателей распадающейся Лейбористской партии, в процессе значительно сдвинув собственную организацию влево. Хотя большинство современной Шинн Фейн составляют бывшие сторонники лейбористов, в партии по-прежнему остаётся немало людей, верных ей с самого основания. Эти старые шиннфейнеры заняли верхние эшелоны руководства SF, что вызвало серьёзное недовольство в лейбористских крыльях партии. Этот раскол наконец вылился в «возрождение» Лейбористской партии под руководством Оуэна Шихи-Скеффингтона, известного университетского преподавателя и сенатора. Его «Воссозданная лейбористская партия» возникла из недовольства слишком открытым союзом Шинн Фейн с Католической церковью. Хотя мятеж левых лейбористов не сумел вновь искалечить Шинн Фейн, он дал ирландским социалистам более умеренную силу, вокруг которой они могут объединиться. Между откровенными синдикалистами Ларкина и новой Шинн Фейн теперь располагается RLP - движение, приверженное гражданским свободам, демократии, отделению церкви от государства, свободе слова, правам женщин, правам меньшинств и множеству других либеральных ценностей. Смогут ли они добиться поставленных целей, решат избиратели."
ire.400.a:0 "Шинн Фейн словно преследуют одни несчастья."

ire.401.t:0 "Дело и мечта"
ire.401.d:0 "Тем, кто ограничивает своё мировоззрение упрощённой мыслью о том, что насилие всегда порождает лишь новое насилие, прежде наверняка показалось бы совершенно нелепым предположение, будто такая страна, как Ирландия, вышедшая на мировую арену благодаря вооружённой революции, способна добиться значимых перемен для собственного народа мирными средствами. И всё же теперь под руководством [IRE.GetLeader] левая коалиция не только пришла к власти посредством избирательных урн, но и сумела прочно укорениться в сердцах ирландского народа. Ирландская нация идёт к красному будущему, однако несёт она не винтовку, а оливковую ветвь.\n\nДаже людям с более широкими взглядами многие события последних лет показались бы некогда столь же невероятными. Когда разногласия между О'Брайеном и Шихи-Скеффингтоном впервые раскололи Лейбористскую партию надвое, мало кто мог представить будущее, в котором эти двое сумеют забыть о противоречиях и работать вместе хоть над чем-нибудь, не говоря уже о совместном руководстве Ирландией на пути к такому будущему. Однако после стольких насыщенных лет пребывания красной коалиции у власти почти не осталось тех, кто ещё способен всерьёз сомневаться в успехе реформистского подхода обоих крыльев лейбористского движения.\n\nРазумеется, критики никуда не исчезли. Справа по-прежнему уверяют, что «радикальный режим» рухнет при первом серьёзном испытании, тогда как многие слева отвергают саму мысль о том, что к социалистическому строю можно прийти посредством реформ без поддержки революции. Но несмотря на все возражения, голос ирландского народа звучит ясно: он желает не насильственной революции и не консервативного застоя, а постепенного и мирного движения вперёд. Будущее Ирландии не заключается в бесконечных попытках вернуться к идеализированному прошлому - оно наполнено свободой и прогрессом. И если будущее Ирландии действительно станет красным, его создаст народ, вооружённый не мечом, а лемехом и мечтой."
ire.401.a:0 "Дело труда - дело Ирландии."

ire.402.t:0 "Жизнь и земля"
ire.402.d:0 "В суете повседневной жизни человеку зачастую трудно просто остановиться и взглянуть на окружающий мир. Даже получив такую возможность, многие могут лишь усмехнуться над обыденностью подобного занятия, предпочитая сосредоточиться на вещах, которые кажутся им куда более серьёзными. Однако для [IRE.GetLeader] и значительной части правительства сердце Ирландии заключено в самой земле, а неспособность остановиться и задуматься о ней означает пренебрежение основами ирландской жизни.\n\nИменно эту великую землю бесчисленные поколения с гордостью называли своим домом - от самых скромных деревушек Литрима до шумного и кипящего жизнью сердца самого Дублина. Будь то фермер, собирающий ежегодный урожай, бухгалтер, наслаждающийся природой по пути на работу, или молодая пара, наблюдающая закат над заливом Голуэй, жизнь каждого из них сформирована теми дарами, которыми Ирландия наделяет свой народ. И именно эти дары, а также минуты радости и удовлетворения, которые они приносят, в конечном счёте и создают те мгновения, ради которых стоит жить.\n\nИменно стремление обеспечить эти простые основы человеческой жизни и легло в основу правительственного видения. Ирландскому рабочему больше не приходится бояться труда от рассвета до глубокой ночи, а теперь он даже может проводить значительное время вне работы вместе со своей семьёй, как и должен иметь право каждый человек. Фермеру больше не нужно опасаться проснуться однажды в стране, где привычный сельский уклад перестал быть возможным, поскольку он может рассчитывать на поддержку правительства ирландской глубинки. Даже самые уязвимые члены общества, прежде рисковавшие оказаться в бездне нищеты, теперь могут спать спокойно, зная, что система социальной помощи готова вытащить их обратно.\n\nИ прежде всего, когда каждый человек, независимо от положения, может жить, не позволяя повседневным тревогам заслонять всё остальное, разве есть что-то лучше, чем просто наслаждаться красотой этого острова, который делает нас единым целым?"
ire.402.a:0 "Нет ничего лучше хорошей жизни на земле, которую мы зовём домом."

ire.403.t:0 "Сражаясь сегодня ради завтра"
ire.403.d:0 "В жизни бывают моменты, заставляющие даже самого невозмутимого человека остановиться и всерьёз задуматься над представшей перед ним ситуацией. Для Майкла Коллинза одним из таких моментов стал вопрос, заданный одним из многочисленных журналистов страны: «Господин президент, бесчисленные люди по всей стране смотрят на вас и уже оставленное вами наследие как на источник вдохновения, и хорошего, и дурного. Принимая жизненно важные для страны решения, задумываетесь ли вы о том, какое влияние они окажут на будущие поколения?»\n\nДля человека, проведшего большую часть жизни одним днём, мысль о том, что его будут помнить прежде всего как президента, а не как героического солдата или революционного мученика, лишь недавно начала по-настоящему доходить до Коллинза. Ещё до двадцатилетия он вступил в борьбу за ирландское дело и продолжал её даже после обретения независимости и воссоединения. Когда-то он перебирался из дома в дом, скрываясь от «чёрно-пегих», а позднее точно так же ездил между домами во время избирательных кампаний, стремясь победить политических соперников. Едва удержав страну на плаву во время Чёрного понедельника и пройдя через Северный кризис, он всё это время оставался движим тем же боевым духом.\n\nИ всё же впервые во взрослой жизни Коллинз пережил всё, что было брошено против него, и обнаружил, что больше сражаться почти не с чем. Оппозиция едва способна угрожать его положению, рейтинги стабильно держатся на комфортном уровне, а экстремистские элементы ирландского общества были основательно выкорчеваны. Осознание того, что эта глава действительно закончилась, наконец начинает доходить до Коллинза. Но если сегодняшняя борьба завершена, то новая битва предстоит за мир завтрашнего дня. Коллинзу пришлось стать бойцом, однако он надеется, что следующему поколению ирландских лидеров это уже не понадобится. Если они действительно смотрят на него снизу вверх, он хотел бы, чтобы примером для них был политик, а не солдат войны.\n\nПоэтому после короткого молчания и раздумий Коллинз просто улыбнулся и ответил: «Безусловно»."
ire.403.a:0 "Похоже, история действительно запомнит величие Майкла Коллинза."

ire.404.t:0 "Наша зелёная форма"
ire.404.d:0 "Для большинства жителей Дублина тихое утро [?global.date.GetDateStringNoHourLong] ничем не отличалось от любого другого дня года, если не считать небольшой толпы, собравшейся у казарм на Арбор-Хилл. Именно здесь перед сравнительно скромной аудиторией, состоявшей преимущественно из местного гарнизона, выступал сам президент Малкахи, одетый в армейскую форму, которую мгновенно узнает почти каждый, кто когда-либо встречался с ним. Многие лидеры мечтают о громадных толпах приветствующих, однако Малкахи едва ли мог пожелать чего-то большего, чем небольшое собрание своих «товарищей по оружию» в тех самых казармах, которыми он когда-то руководил.\n\n«Многим в нашей стране армия зачастую казалась чем-то отдельным и отличным от народа. Однако на всём протяжении свободной истории нашей нации армия была народом, остаётся народом и будет народом. Наша зелёная форма не делает нас менее народом. Она - мантия служения, сдерживающая наши слабости и усиливающая наши достоинства. Когда триколор впервые гордо взвился над Дублином, свободные люди Ирландии не делились на солдат и граждан - мы были единым целым. На этом фундаменте была построена наша великая республика, и благодаря ему наша нация продолжает процветать.\n\nКогда Патрик Пирс впервые провозгласил национальную независимость, Прокламация не только утвердила права ирландского народа, но и ясно обозначила жизненно важную роль его военных организаций в защите этих прав. Когда я сам сражался в тот судьбоносный день, я не был ни только солдатом, ни только гражданином - как ирландец, я был и тем и другим. И потому, чтобы сохранить живое наследие, оставленное предками многих из присутствующих здесь и современниками тех, кто, подобно мне, уже вступил в преклонные годы, для меня большая честь объявить, что отныне это судьбоносное здание будет именоваться казармами Пирса - Dún an Phiarsaigh».\n\nНа этом речь завершилась под сдержанные, но уважительные аплодисменты - именно такая скромная реакция и является всем, чего человек вроде Малкахи по-настоящему желает от жизни."
ire.404.a:0 "Малкахи действительно служит в твёрдом духе Пирса."

ire.405.t:0 "Изумрудный остров возможностей"
ire.405.d:0 "Если спросить большинство членов FF, составляющих значительную часть правительства, включая даже самого президента Лемасса, каким одним словом они описали бы своё видение Ирландии, этим словом станет «Возможность». Именно оно служило неофициальным лозунгом партии, а теперь и самого правительства с тех пор, как Фианна Файл добилась первых успехов и заняла первоначальное место в коалиции.\n\nДля столь простого слова точное значение «Возможности» заметно меняется в зависимости от того, кого и когда спросить. Иногда оно означало возможность для каждого мужчины и каждой женщины Ирландии осуществить свои мечты, если только они готовы достаточно усердно трудиться ради их воплощения. В другое время, особенно когда речь шла об ограничениях старого правительства «Фине Гэл», оно означало возможность для любого жителя страны оставить свой след в истории нации независимо от происхождения или наследия. А в последнее время, когда Ирландия приобрела всё больший вес на мировой финансовой арене, некоторые начали говорить уже о возможности оставить след во всём мире.\n\nОднако если спросить [IRE.GetLeader], он с готовностью ответит, что это понятие охватывает всё перечисленное и даже больше. Для него «Возможность» лежит в самом сердце ирландской культуры и истории. Это может быть столь великое свершение, как возможность ирландского народа самому определить собственную судьбу, или же нечто простое и личное, вроде хорошего образования, дающего студенту шанс поступить в Тринити-колледж. Возможности пронизывают все стороны ирландской жизни. По мнению президента, социальный и экономический прогресс государства идут рука об руку: возможности, возникающие в одной области, открывают новые пути в другой, и целью Фианна Файл всегда было содействовать росту обеих.\n\nВ конечном счёте, насколько это касается [IRE.GetLeader], именно все стороны этого понятия «Возможности» по-настоящему отражают, что значит быть ирландцем."
ire.405.a:0 "Прилив поднимает все лодки."

ire.406.t:0 "О языке и ирландской нации"
ire.406.d:0 "На протяжении всего своего правления Имон де Валера регулярно обращался к ирландскому народу по радио. Многие из этих речей быстро исчезали из общественной памяти, однако сегодняшняя, похоже, оказалась иной. Причиной тому может быть укрепившееся политическое господство Фианна Файл, манера де Валеры или просто качество самой речи, но немногие сомневаются, что эти бессмертные слова останутся в памяти надолго:\n\n«Идеальная Ирландия, которую мы хотели бы видеть, Ирландия нашей мечты, была бы домом народа, ценящего материальное богатство лишь как основу достойной жизни, народа, который, довольствуясь скромным достатком, посвящал бы свободное время духовному. Это была бы земля, где сельская местность сияла бы уютными домами, поля и деревни были бы наполнены радостными звуками труда, играми крепких детей, состязаниями спортивной молодёжи и смехом счастливых девушек, а домашний очаг становился бы местом, где звучит мудрость безмятежной старости. Одним словом, дом народа, живущего той жизнью, которой, по воле Божьей, должны жить люди.\n\nС вестью, способной сделать такую Ирландию возможной, святой Патрик пришёл к нашим предкам пятнадцать столетий назад, обещая счастье здесь не меньшее, чем счастье в мире ином. Именно стремление к такой Ирландии позднее сделало нашу страну достойной именоваться островом святых и учёных. Именно образ такой Ирландии - счастливой, сильной и духовной - воспламенял воображение наших поэтов, заставлял одно поколение патриотов за другим отдавать жизнь ради религиозной и политической свободы и будет побуждать людей нашего и будущих поколений, если потребуется, умереть, чтобы эти свободы были сохранены.\n\nСто лет назад младоирландцы, поставив перед народом образ такой Ирландии, вдохновили и духовно пробудили его так, как он едва ли пробуждался со времён золотого века ирландской цивилизации. Пятьдесят лет спустя основатели Гэльской лиги подобным образом вдохновили людей своего поколения. Затем то же сделали лидеры Ирландских добровольцев и те, кто продолжал их благородную борьбу, пока вся наша нация не обрела свободу. Мы, люди нынешнего времени, если обладаем волей и деятельным энтузиазмом, также имеем возможность вдохновить и пробудить своё поколение. Мы можем сделать это, постоянно держа перед глазами образ благородного будущего нашей страны, неустанно стремясь своими действиями приблизить его и всегда помня, что искать это будущее необходимо для всей нашей нации»."
ire.406.a:0 "Прилив поднимает все лодки."

ire.407.t:0 "Дойл деспота"
ire.407.d:0 "Ещё несколько лет назад сама мысль о правительстве An Cumann Corpruiteac Náisiúnta казалась большинству совершенно невероятной, однако страх перед тем, что однажды ирландская демократия может быть уничтожена в одно мгновение, всё равно занимал место во многих умах. Почти никто, включая [IRE.GetLeader], не мог предположить, что теперь, после окончательного укрепления власти CCN над страной, ирландская демократия не только всё ещё продолжит дышать, но и вновь начнёт стабилизироваться уже под новым руководством.\n\nНесмотря на все попытки оппозиции запугать общество разговорами о так называемом «отступлении от демократии», когда [IRE.GetLeader] определяет политику страны, он не выступает в роли какого-либо верховного Ceannaire, надзирающего за Национальным советом верных подчинённых. Он остаётся президентом страны, обращающимся к Дойлу, в котором по-прежнему заседает немало настоящих представителей оппозиции и ведутся оживлённые дебаты. Законы не принимаются простым диктатом сверху: когда правительство вносит законопроект, тот всё ещё проходит те же надлежащие процедуры и проверки, которые всегда существовали в рамках ирландской демократической системы. Хотя, по слухам, некоторые члены Cumann Corpruiteac Náisiúnta по-прежнему втайне презирают необходимость считаться с этими институтами, значительная часть партии постепенно начала чувствовать себя вполне удобно в условиях нового статус-кво.\n\nОднако не следует принимать сегодняшний Дойл за тот же парламент, каким он был прежде. Социалисты, наиболее подрывные демократы и даже некоторые из самых радикальных бывших союзников правительства были справедливо изгнаны из органов власти. Ирландскому народу больше не приходится терпеть страну, где его политику определяют иностранцы и масоны вместо коренного народа этой земли. Ему больше не нужно опасаться подрывной угрозы интернационализма и синдикализма, стремящихся разделить или разрушить семью. И великой Ирландской республике больше не нужно бояться хаоса, который способны принести эти разрушительные элементы."
ire.407.a:0 "Порядок - душа государства."

ire.6003.t:0 "Памяти Гриффита"
ire.6003.d.mc:0 "При обсуждении великих героев ирландского дела одно имя зачастую оказывается странным образом забыто - имя основателя Шинн Фейн Артура Гриффита. Подобно Парнеллу нового времени, Гриффит некогда фактически возглавлял ирландский национализм и внёс огромный вклад в продвижение дела свободы. И, как Парнелл, он оказался оттеснён на обочину ещё при жизни, которая трагически оборвалась слишком рано. Если Парнелл потерял влияние из-за своего скандального поведения, то Гриффит просто обнаружил, что развитие ирландского движения ушло далеко вперёд от его первоначальных идей. Его призывы отменить Акт об унии и создать Дуалистическую монархию по образцу Австро-Венгрии утратили популярность после событий 1916 года. Однако, увидев подъём республиканизма и его широкую поддержку, вечный прагматик Гриффит без колебаний позволил использовать собственную партию как инструмент достижения независимости. Всегда остававшийся скорее агитатором, чем руководителем, он куда ярче проявил себя в переговорах по Договору, чем за короткое время пребывания на посту президента до своей преждевременной смерти.\n\nС годами Парнелл стал считаться одним из величайших ирландцев в истории, и [IRE.GetLeader] поставил перед собой задачу добиться того же признания для Гриффита. Сегодня утром, пригласив множество гостей к зданию Ленстер-хауса, где прежде стояла статуя королевы Виктории, [IRE.GetLeader] открыл на её месте величественный памятник Гриффиту. Его создал Лео Броу, известный памятником Ирландским добровольцам на Нортсайде и бюстом Патрика Пирса, поэтому намерение поставить память Гриффита в один ряд с этими фигурами очевидно для большинства присутствующих. После открытия [IRE.GetLeader] поднялся на трибуну, и его речь не оставила сомнений:\n\n«Когда я был всего лишь молодым человеком, пытавшимся найти своё место в мире, один человек возвышался над всеми остальными как источник вдохновения для меня и бесчисленного множества других. Артур Гриффит был могучей силой в Ирландии. В нём не было той необузданности, которую я мог бы припомнить у некоторых других. Напротив, он обладал огромной мудростью и глубоким пониманием всего, что есть Ирландия. Когда я достаточно повзрослел, чтобы начать служить нашему народу, Гриффит стал для меня и важным наставником, и другом, человеком, чью партию я с гордостью продолжаю возглавлять по сей день. Без лидерства и дальновидности Гриффита само существование нашей великой нации оказалось бы под вопросом, и потому мы всегда будем стремиться хранить наследие, оставленное нам отцом нашей республики»."
ire.6003.d.rm:0 "При обсуждении великих героев ирландского дела одно имя зачастую оказывается странным образом забыто - имя основателя Шинн Фейн Артура Гриффита. Подобно Парнеллу нового времени, Гриффит некогда фактически возглавлял ирландский национализм и внёс огромный вклад в продвижение дела свободы. И, как Парнелл, он оказался оттеснён на обочину ещё при жизни, которая трагически оборвалась слишком рано. Если Парнелл потерял влияние из-за своего скандального поведения, то Гриффит просто обнаружил, что развитие ирландского движения ушло далеко вперёд от его первоначальных идей. Его призывы отменить Акт об унии и создать Дуалистическую монархию по образцу Австро-Венгрии утратили популярность после событий 1916 года. Однако, увидев подъём республиканизма и его широкую поддержку, вечный прагматик Гриффит без колебаний позволил использовать собственную партию как инструмент достижения независимости. Всегда остававшийся скорее агитатором, чем руководителем, он куда ярче проявил себя в переговорах по Договору, чем за короткое время пребывания на посту президента до своей преждевременной смерти.\n\nС годами Парнелл стал считаться одним из величайших ирландцев в истории, и [IRE.GetLeader] поставил перед собой задачу добиться того же признания для Гриффита. Сегодня утром, пригласив множество гостей к зданию Ленстер-хауса, где прежде стояла статуя королевы Виктории, [IRE.GetLeader] открыл на её месте величественный памятник Гриффиту. Его создал Лео Броу, известный памятником Ирландским добровольцам на Нортсайде и бюстом Патрика Пирса, поэтому намерение поставить память Гриффита в один ряд с этими фигурами очевидно для большинства присутствующих. После открытия [IRE.GetLeader] поднялся на трибуну, и его речь не оставила сомнений:\n\n«Когда наша храбрая нация боролась за независимость, один человек служил нам путеводным светом - великий Артур Гриффит. Именно Гриффит наиболее полно раскрывал в своих еженедельных статьях традиции и богатства Ирландии, описывал её предназначение и давал нам практическое воплощение нашей мечты, нашего чувства долга. Когда я сражался за свободу нашей нации, Гриффит всегда был рядом и помогал всем, чем только мог. Когда «чёрно-пегие» охотились на меня и моих людей, мы всегда могли рассчитывать, что Гриффит найдёт нам убежище. Без лидерства и дальновидности Гриффита само существование нашей великой нации оказалось бы под вопросом, и потому мы всегда будем стремиться хранить наследие, оставленное нам отцом нашей республики»."
ire.6003.a:0 "Самое яркое пламя сгорает быстрее всего, и мало кто горел ярче Гриффита."

ire.2600.t:0 "An Bunreacht Nua"
ire.2600.d:0 "Пережив экономическую депрессию, иностранное вмешательство и крах правопорядка на севере, Ирландия вышла из этих испытаний по-прежнему сильным и независимым государством, к тому же более единым, чем прежде. Теперь, когда страна начинает восстанавливать себя, народ согласился с тем, что для сохранения мира и процветания необходимы перемены. Политики и граждане самых разных убеждений пришли к выводу, что именно совершенно новая конституция, созданная в духе сотрудничества и тщательного обсуждения, необходима стране для обеспечения её политического будущего.\n\nНовая Конституция, или Bunreacht, будет совместно составлена на ирландском и английском языках при содействии писателя и учителя Михала О Гриофы, а также Риштерда О Фоглуды, известного писателя, редактора и основателя Craobh an Chéitinnigh, отделения Гэльской лиги. Многие статьи действующей Конституции будут сохранены, поскольку хорошо работают и не вызывают споров, однако немало других разделов остаются предметом ожесточённых дискуссий.\n\nКаждая партия стремится повлиять на содержание документа, и все они ясно обозначили свои позиции по спорным вопросам. Теперь, когда пришло время окончательно утвердить эти статьи, необходимо решить, в каком направлении пойдёт страна и как это отразится на обществе в будущем."
ire.2600.a:0 "Ar aghaidh linn!"

ire.2601.t:0 "Устройство Республики"
ire.2601.d:0 "Первый вопрос, стоящий перед составителями Конституции, касается устройства Республики и принципов её управления.\n\nПервый вариант, поддерживаемый «Фине Гэл», сохраняет систему, близкую к нынешним «Ольстерским привилегиям»: советы северо-восточных графств сохраняют расширенную автономию, в Государственном совете при президенте гарантировано представительство лоялистов, а сами лоялисты получают постоянное место в кабинете в виде новой официальной должности «Министра по делам Ольстера». Этот вариант вызывает недовольство среди националистов, желающих увидеть в новой Конституции реальные перемены, а не сохранение статус-кво.\n\nОднако ольстерские юнионисты и FF идут ещё дальше, требуя закрепить в Конституции полную автономию для шести северо-восточных графств.\n          - \"Шесть северо-восточных графств Ольстера имеют право учредить собственный автономный парламент с полномочиями, определёнными законом.\"\nФактически это превратит данные графства в автономный регион, где будут господствовать лоялисты. Националисты яростно сопротивляются этому предложению, воспринимая его как фактическое возвращение к разделу страны, несмотря на письменные гарантии против открытой дискриминации.\n\nС другой стороны, ACA и, что любопытно, Шинн Фейн выступают за унитарную Республику, управляемую непосредственно из Дублина.\n          - \"Единственная и исключительная власть принимать законы государства принадлежит Эрахтасу: никакой иной законодательный орган не имеет права издавать законы государства.\"\nВместе с положениями, подчёркивающими первенство Дойл Эрен в Дублине, это значительно укрепило бы единство страны и ликвидировало исключительную автономию советов на севере. «Фине Гэл» предпочла бы предоставить лоялистам больше уступок, однако в качестве компромисса обе партии согласились сохранить положение Брука и ограниченную гарантию представительства в Дойле.\n\nЕщё один новый подход, поддерживаемый FF, предполагает создание собственной региональной ассамблеи в каждой провинции.\n          - \"Каждая из четырёх провинций имеет право учредить федеральную ассамблею с полномочиями, установленными законом.\"\nЭтот вдохновлённый американским опытом вариант прежде никогда всерьёз не рассматривался, однако он способен позволить каждой провинции эффективнее решать местные проблемы, особенно напряжённость между проживающими там националистами и лоялистами."
ire.2601.a:0 "Сохраним статус-кво."
ire.2601.b:0 "Автономия для севера."
ire.2601.c:0 "Единое унитарное государство."
ire.2601.e:0 "Федерация провинций."
IRE_brooke_becomes_sec_always:0 "После следующих выборов §YБэзил Брук§! будет назначен §Yминистром внутренних дел§!."

ire.2602.t:0 "Устройство президентской власти"
ire.2602.d1:0 "Устройство президентской власти вызывает ожесточённые споры. Срок полномочий, порядок выборов и требования к кандидатам уже определены, однако вопрос о полномочиях президента остаётся открытым. В настоящее время Uachtarán na hÉireann обладает широкими исполнительными полномочиями, определяемыми разрозненной системой законов, подзаконных актов и судебных прецедентов, тогда как сама должность лишь кратко упомянута в действующей Конституции. Место и власть президента необходимо ясно определить, чтобы должность постепенно не скатилась к авторитаризму.\n\nПервый вариант, поддерживаемый «Фине Гэл» и ACA, предполагает президентскую систему, похожую на ту, что уже неофициально существует сегодня:\n          - \"Исполнительная власть государства в соответствии с положениями настоящей Конституции осуществляется президентом либо от его имени.\"\nЭта система, созданная по образцу Соединённых Штатов Америки, предоставит президенту чётко определённые Конституцией исполнительные полномочия. Президент будет формировать и возглавлять правительство и станет главным руководителем страны.\n\nПротивоположный вариант, поддерживаемый FF, ольстерскими юнионистами и Шинн Фейн, предполагает парламентскую систему, при которой исполнительную власть государства осуществляет правительство, избранное Дойлом.\n          - \"Президент по представлению Дойл Эрен назначает тишеха и правительство.\"\nЭта система во многом напоминает старую британскую модель управления, где премьер-министр формирует правительство из членов парламента, а глава государства, если таковой существует, располагает крайне ограниченными, преимущественно церемониальными полномочиями и действует только по совету правительства. Кроме того, после принятия Конституции будет избран новый президент как церемониальный глава государства, а нынешняя должность Príomh Aire будет переименована в Taoiseach, буквально «вождь», чтобы лучше отразить её новые исполнительные полномочия.\n\nНеобычный вариант, предложенный некоторыми членами Шинн Фейн и FF, представляет собой смешанную систему, при которой президент сохраняет часть исполнительной власти, но формирует правительство из членов Дойл Эрен и разделяет исполнительные полномочия с избираемым Дойлом Príomh Aire. Подобная система уже применялась в России и может стать компромиссом между парламентской и президентской моделями."
ire.2602.d2:0 "Устройство президентской власти вызывает ожесточённые споры. Срок полномочий, порядок выборов и требования к кандидатам уже определены, однако вопрос о полномочиях президента остаётся открытым. В настоящее время Uachtarán na hÉireann обладает широкими исполнительными полномочиями, определяемыми разрозненной системой законов, подзаконных актов и судебных прецедентов, а с началом войны получил ещё более широкие чрезвычайные полномочия. После окончания войны положение президента необходимо ясно определить, чтобы должность постепенно не скатилась к авторитаризму."
ire.2602.a:0 "Президентская система."
ire.2602.b:0 "Парламентская система."
ire.2602.c:0 "Смешанная система."

ire.2603.t:0 "Порядок избрания Дойла"
ire.2603.d1:0 "Следующий вопрос касается Дойл Эрен и порядка его избрания. Хотя избирательные округа Ирландии основаны на исторических внутренних границах, метод избрания представителей от этих территорий остаётся предметом споров.\n\nПервый вариант, поддерживаемый SF и лейбористами, предполагает сохранение действующей системы пропорционального представительства:\n          - \"Члены Дойл Эрен избираются по системе пропорционального представительства посредством единого передаваемого голоса.\"\nЭта система используется со времён первых всеобщих выборов независимой Ирландии и обеспечивает разнообразный и представительный состав Дойла. Избиратели ранжируют кандидатов в порядке предпочтения, после чего посредством подсчёта и перераспределения голосов от каждого округа избираются от трёх до пяти депутатов, которые теоретически пользуются поддержкой наибольшей доли населения.\n\nДругой вариант, поддерживаемый FF, ACA, либеральными членами FF и, что является редким случаем согласия между ними, ольстерскими юнионистами, предполагает систему относительного большинства.\n          - \"Члены Дойл Эрен избираются в одномандатных округах по системе относительного большинства.\"\nТакая система часто создаёт сильные правительства парламентского большинства, однако её критикуют за недостаточное представительство мнений электората и так называемый эффект спойлера. Тем не менее именно эта система позволила SF получить почти все ирландские места на всеобщих выборах 1918 года, и сторонники считают её более благоприятной для стабильности правительства."
ire.2603.d2:0 "Следующий вопрос касается Дойл Эрен и порядка его избрания. Хотя избирательные округа Ирландии основаны на исторических внутренних границах, метод избрания представителей от этих территорий остаётся предметом споров.\n\nПервый вариант, поддерживаемый SF и лейбористами, предполагает сохранение действующей системы пропорционального представительства:\n          - \"Члены Дойл Эрен избираются по системе пропорционального представительства посредством единого передаваемого голоса.\"\nЭта система используется со времён первых всеобщих выборов независимой Ирландии и обеспечивает разнообразный и представительный состав Дойла. Избиратели ранжируют кандидатов в порядке предпочтения, после чего посредством подсчёта и перераспределения голосов от каждого округа избираются от трёх до пяти депутатов, которые теоретически пользуются поддержкой наибольшей доли населения.\n\nВторой вариант, поддерживаемый ольстерскими юнионистами и либеральными членами FF, предполагает систему относительного большинства.\n          - \"Члены Дойл Эрен избираются в одномандатных округах по системе относительного большинства.\"\nТакая система часто создаёт сильные правительства парламентского большинства, однако её критикуют за недостаточное представительство мнений электората и так называемый эффект спойлера. Тем не менее именно эта система позволила де Валере получить почти все ирландские места на всеобщих выборах 1918 года, и сторонники считают её более благоприятной для стабильности правительства.\n\nТретий вариант, поддерживаемый FF и ACA, также основан на системе относительного большинства, но дополняется «множественным избирательным правом».\n          - \"Глава каждого домохозяйства имеет право на один дополнительный голос за первого ребёнка и ещё по одному за каждых последующих двух детей.\"\nЭтот вариант предлагается как стимул для повышения рождаемости, а поскольку ирландские католики в целом имеют более высокую рождаемость, он обеспечит большее представительство наиболее значимой части электората."
ire.2603.a:0 "Пропорциональное представительство."
ire.2603.b:0 "Система относительного большинства."
ire.2603.c:0 "Множественное избирательное право."

ire.2604.t:0 "Статус религии"
ire.2604.d1:0 "Ирландия, «земля святых и учёных», как и следует из этого прозвания, обладает многовековой религиозной традицией, влияющей на жизнь каждого гражданина независимо от того, является он верующим или нет. На протяжении столетий Церковь находилась в центре ирландского общества, и потому её положение необходимо определить в новой Конституции.\n\nПервый вариант, поддерживаемый лейбористами и либеральными членами FF, звучит следующим образом:\n          - \"Каждому гражданину гарантируются свобода совести, свободное исповедание и отправление религии, а государство не предоставляет особого признания или материальной поддержки какой-либо отдельной религии или вере.\"\nЭто исключит вмешательство государства в дела церкви и обеспечит полную свободу вероисповедания, однако в глубоко христианской стране подобное решение радует далеко не многих. Тем не менее оно может стать неохотно принятым компромиссом между националистами и лоялистами.\n\nНеудивительно, что FF вместе с ACA вместо этого требуют закрепить в Конституции особый статус Католической церкви:\n          - \"Государство признаёт особое положение Святой Католической Апостольской Римской церкви как хранительницы веры, исповедуемой подавляющим большинством граждан.\"\nХотя это довольно точно отражает религиозные убеждения населения, такое положение намеренно исключает различные протестантские церкви, преобладающие на севере, и наверняка вызовет там серьёзное недовольство.\n\nРешение этой проблемы предлагают ольстерские юнионисты при поддержке части лейбористов и SF, добавляя следующий раздел:\n          - \"Государство также признаёт Церковь Ирландии, Пресвитерианскую церковь Ирландии, Методистскую церковь Ирландии, Религиозное общество Друзей в Ирландии, а также иудейские общины и другие религиозные конфессии, существующие в Ирландии на момент вступления настоящей Конституции в силу.\"\nЭто успокоит протестантов севера и одновременно обеспечит признание другим заметным религиозным общинам Ирландии. FF, и особенно ACA, могут утверждать, что подобное уточнение излишне, однако в конечном счёте FF готова смириться с его включением."
ire.2604.d2:0 "Ирландия, «земля святых и учёных», как и следует из этого прозвания, является глубоко религиозной страной. На протяжении столетий Церковь находилась в самом сердце ирландского общества, и потому её положение необходимо определить в новой Конституции.\n\nFF и некоторые более набожные представители таких партий, как SF, прежде всего требуют закрепить особый статус Католической церкви:\n          - \"Государство признаёт особое положение Святой Католической Апостольской Римской церкви как хранительницы веры, исповедуемой подавляющим большинством граждан.\"\nХотя это довольно точно отражает религиозные убеждения населения, такое положение намеренно исключает другие церкви, преобладающие на севере, и наверняка вызовет там серьёзное недовольство.\n\nОппозиция объединилась вокруг предложения дополнить эту статью следующим разделом:\n          - \"Государство также признаёт Церковь Ирландии, Пресвитерианскую церковь Ирландии, Методистскую церковь Ирландии, Религиозное общество Друзей в Ирландии, а также иудейские общины и другие религиозные конфессии, существующие в Ирландии на момент вступления настоящей Конституции в силу.\"\nЭто успокоит протестантов севера и одновременно обеспечит признание другим заметным религиозным общинам Ирландии. FF, и особенно ACA, будут утверждать, что подобное уточнение излишне, однако в конечном счёте FF готова смириться с ним, если его придётся включить.\n\nТем временем ACA и более консервативные депутаты FF предлагают ещё один вариант, прямо утверждающий истину о том, что Ирландия является католическим государством:\n          - \"Государство признаёт Святую Католическую Апостольскую Римскую церковь государственной Церковью и хранительницей веры, исповедуемой его гражданами, и обязуется поддерживать её статус и положение в этом качестве.\"\nЭтот консервативный католический вариант лишь юридически закрепит то, что большинство граждан уже считает естественным и правильным. Лоялисты будут яростно протестовать, поскольку именно религиозный вопрос когда-то стал одной из главных причин первоначального отделения Севера от Ирландии."
ire.2604.a:0 "Никакого особого признания религии."
ire.2604.c:0 "Особый статус Католической церкви."
ire.2604.e:0 "Признаем и другие религии Ирландии."
ire.2604.f:0 "Ирландия - католическое государство!"

ire.2605.t:0 "Официальные языки"
ire.2605.d:0 "Вопрос о статусе языков Ирландии по большей части символический, однако он способен серьёзно повлиять на сам характер страны. Никто не хочет дальнейшего упадка ирландского языка, поэтому главный спор касается положения английского. Как бы ни желали обратного наиболее непримиримые националисты, английскому всё равно придётся сохранить определённое место в ирландском обществе.\n\nПервый вариант, решительно поддерживаемый FF и ACA, предоставляет ирландскому статус первого официального языка, признавая английский там, где его использование необходимо:\n          - \"1. Ирландский язык как национальный язык признаётся первым официальным языком.\"\n          - \"2. Английский язык признаётся другим официальным языком.\"\nЭто означает, что ирландский всегда будет иметь приоритет в законодательстве, а каждый гражданин получит право вести официальные дела на ирландском. Ещё важнее то, что это посылает ясный сигнал: Ирландия была и всегда останется ирландской, а ирландскому языку не позволят исчезнуть.\n\nВторой вариант, продвигаемый SF и ольстерскими юнионистами, добавляет к этой статье третий пункт:\n          - \"3. Учитывая особое положение и историю шести северо-восточных графств Ольстера, закон может предусмотреть исключительное использование английского языка в качестве официального языка на территории этих графств.\"\nЭто позволит северным графствам отказаться от использования ирландского языка в официальных делах, если они того пожелают. Лоялисты особенно опасаются принуждения к использованию ирландского и стремятся защищать собственное наследие не меньше, чем остальная Ирландия защищает своё.\n\nТретий вариант, поддерживаемый преимущественно лейбористами и либеральными членами FF, состоит всего из одного положения:\n          - \"Ирландский и английский языки признаются двумя равноправными официальными языками.\"\nЭто обеспечит ирландскому и английскому совершенно равный статус. На практике тексты законов на обоих языках будут иметь одинаковую юридическую силу, а вопросы толкования станут решаться с учётом обеих языковых версий. Широкой поддержки у этого варианта нет, и даже лоялисты принимают его лишь с неохотой. Многие считают подобный шаг признанием того, что идея «ирландской Ирландии» умерла."
ire.2605.a:0 "Ирландский всегда должен иметь приоритет!"
ire.2605.b:0 "Допустим исключение для севера."
ire.2605.c:0 "Оба языка будут равноправными."

ire.2606.t:0 "Дворянские титулы"
ire.2606.d1:0 "Хотя пэрские титулы в Ирландии никогда не были особенно распространены, многие граждане Республики всё ещё обладают ими или должны унаследовать их в будущем. Некоторые лоялисты и богатые землевладельцы подняли шум вокруг своих титулов, опасаясь, что те находятся под угрозой, и эти опасения нельзя назвать беспочвенными. Значительная часть политиков желает окончательно избавиться от последних пережитков Британской империи и закрепить образ Ирландии как современной республики. Каким бы ни было решение, лишь самые непримиримые лоялисты хотят видеть систему, при которой обладатели титулов получат особые привилегии и политическое представительство.\n\nПервый вариант прост - никаких титулов вообще, а гражданам запрещается принимать их. FF поддерживает такое решение, однако оно неизбежно вызовет недовольство среди пэров:\n          - \"1. Государство не присваивает дворянские титулы.\"\n          - \"2. Ни один гражданин не может принять дворянский или почётный титул без предварительного одобрения правительства.\"\n\nВторой вариант, поддерживаемый ольстерскими юнионистами, предполагает признание уже существующих титулов граждан:\n          - \"Государство признаёт все установленные титулы, принадлежащие его гражданам.\"\n\nЕщё один вариант заключается в отказе признавать титулы, дарованные Британской короной, при одновременном предоставлении самому государству права вручать собственные титулы. Для лоялистов это станет настоящим оскорблением, однако ACA, похоже, твёрдо намерена добиться именно этого:\n          - \"Государство имеет право присваивать особые знаки отличия заслуженным гражданам.\"\n\nКомпромисс SF предполагает включение обеих статей, то есть признание существующих титулов и возможность создания новых."
ire.2606.d2:0 "Хотя пэрские титулы в Ирландии никогда не были особенно распространены, многие граждане Республики всё ещё обладают ими или должны унаследовать их в будущем. Некоторые лоялисты и богатые землевладельцы подняли шум вокруг своих титулов, опасаясь, что те находятся под угрозой, и эти опасения нельзя назвать беспочвенными. Значительная часть политиков желает окончательно избавиться от последних пережитков Британской империи и закрепить образ Ирландии как современной республики. Каким бы ни было решение, лишь самые непримиримые лоялисты хотят видеть систему, при которой обладатели титулов получат особые привилегии и политическое представительство.\n\nПервый вариант прост - никаких титулов вообще, а гражданам запрещается принимать их. FF поддерживает такое решение, однако оно неизбежно вызовет недовольство среди пэров:\n          - \"1. Государство не присваивает дворянские титулы.\"\n          - \"2. Ни один гражданин не может принять дворянский или почётный титул без предварительного одобрения правительства.\"\n\nВторой вариант, поддерживаемый ольстерскими юнионистами, предполагает признание уже существующих титулов граждан:\n          - \"Государство признаёт все установленные титулы, принадлежащие его гражданам.\"\n\nЕщё один вариант заключается в отказе признавать титулы, дарованные Британской короной, при одновременном предоставлении самому государству права вручать собственные титулы. Для лоялистов это станет настоящим оскорблением, однако ACA, похоже, твёрдо намерена добиться именно этого:\n          - \"Государство имеет право присваивать особые знаки отличия заслуженным гражданам.\"\n\nКомпромисс SF предполагает включение обеих статей, то есть признание существующих титулов и возможность создания новых.\n\nКроме того, в связи с ограниченным сближением с Британской короной некоторые политики и пэры предложили возродить «Достославнейший орден Святого Патрика». Орден был учреждён в 1783 году по просьбе тогдашнего лорда-лейтенанта Ирландии по образцу Ордена Подвязки. Некоторые его рыцари и должностные лица всё ещё живы, например Энтони Эшли-Купер, 9-й граф Шефтсбери, однако со времён обретения независимости деятельность ордена была фактически прекращена."
ire.2606.a:0 "Никаких титулов!"
ire.2606.b:0 "Существующие титулы будут признаны."
ire.2606.c:0 "Мы будем присваивать собственные ненаследственные титулы."
ire.2606.e:0 "Признаем существующие титулы и будем присваивать собственные ненаследственные."
ire.2606.f:0 "Возродим Орден Святого Патрика!"

ire.2607.t:0 "Конституция завершена"
ire.2607.d:0 "Работа над проектом Конституции завершена, и теперь остаётся лишь вынести её на референдум, который почти наверняка закончится одобрением благодаря всеобщему стремлению к новой Ирландии.\n\nТеперь, когда многие из наиболее спорных вопросов национальной политики наконец урегулированы, может начаться настоящее восстановление и примирение."
ire.2607.a:0 "Go n-éirí an bóthar linn!"

ire.2505.t:0 "An tUachtarán Nua"
ire.2505.d.start:0 "Президент должен избираться непосредственно гражданами каждые семь лет. Любой гражданин Ирландии старше 35 лет может выдвинуться на президентский пост при условии, что его кандидатуру поддержит достаточное число членов Дойла или местных органов власти."
ire.2505.d.body:0 "совместно выдвинуть единого кандидата на этот пост, отказавшись от проведения выборов для первого обладателя новой должности. Такой шаг потребует кандидата, пользующегося исключительно широкой поддержкой среди представителей всех политических взглядов, даже большей, чем обычно требуется при системе преференциального голосования.\n\nРоль президента преимущественно церемониальная и неполитическая. Как глава государства, президент выступает первым гражданином страны, представляет её за рубежом и принимает иностранных сановников. Однако президент также распускает Дойл по окончании срока его полномочий и назначает депутатов на министерские должности по представлению тишеха - пост, который вскоре займёт [ROOT.GetLeader].\n\nВсе партии сходятся во мнении, что президентом должен стать человек с глубоким пониманием культуры, способный представлять взгляды и ценности населения в целом. Человек, добившийся значительных успехов в жизни и обладающий личным опытом, соответствующим этой роли.\n\nКого бы ни выбрали, он едва ли откажется от предложения, поэтому остаётся лишь выдвинуть кандидата."
ire.2505.d1:0 "Согласно новой Конституции, $ire.2505.d.start$\n\nСтремясь укрепить поддержку новой Конституции, все партии согласились $ire.2505.d.body$"
ire.2505.d2:0 "Согласно действующей Конституции, $ire.2505.d.start$\n\nПосле поражения Интернационала в Европе Коллинз стремится укрепить поддержку конституционной роли президента и создать новый демократический послевоенный консенсус. Он предлагает всем партиям согласиться $ire.2505.d.body$"
ire.2505.a:0 "Эрни О'Мэлли."
ire.2505.a.tt.base:0 "§YЭрни О'Мэлли§!, революционер времён Войны за независимость и известный писатель."
ire.2505.a.tt:0 "Выдвинуть $ire.2505.a.tt.base$"
ire.2505.b:0 "Кэтлин Кларк."
ire.2505.b.tt.base:0 "§YКэтлин Кларк§!, вдова одного из лидеров восстания 1916 года и символ республиканизма."
ire.2505.b.tt:0 "Выдвинуть $ire.2505.b.tt.base$"
ire.2505.c:0 "Дуглас Хайд."
ire.2505.c.tt.base:0 "§YДуглас Хайд§!, выдающийся исследователь ирландского языка и основатель Гэльской лиги."
ire.2505.c.tt:0 "Выдвинуть $ire.2505.c.tt.base$"
ire.2505.e:0 "Эрскин Чайлдерс."
ire.2505.e.tt.base:0 "§YЭрскин Чайлдерс§!, выдающийся англо-ирландский писатель, участник переговоров по Договору и военно-морской советник."
ire.2505.e.tt:0 "Выдвинуть $ire.2505.e.tt.base$"

ire.2506.t:0 "Президентские выборы [GetYear] года"
ire.2506.d1:0 "Сегодня ирландский народ свободно избирает главу государства на следующие семь лет. Роль президента в основном неполитическая и церемониальная, а сам он избирается гражданами напрямую посредством преференциального голосования с последовательным исключением кандидатов.\n\nТакая избирательная система, равно как и сама роль президента, благоприятствует кандидатам, способным привлечь широкие слои населения, а не тем, кто обладает более преданной, но потенциально гораздо более узкой базой сторонников.\n\nНа должность претендуют несколько кандидатов, получивших необходимое число выдвижений от депутатов и советов графств, однако окончательное решение остаётся за избирателями."
ire.2506.d2:0 "Сегодня, при обычных обстоятельствах, должны были состояться президентские выборы. Однако из-за чрезвычайных условий военной коалиции Коллинза голосование будет отложено до поражения Интернационала.\n\nНовая должность президента должна восприниматься как объединяющий символ нации, однако в условиях войны изменение нынешнего беспрецедентного порядка сочли бы слишком раскалывающим общество и противоречащим самой цели новой должности. Коллинз останется главой государства до окончания войны, после чего будет избран новый президент с церемониальными полномочиями, как и предполагалось изначально."
ire.2506.a:0 "Эрни О'Мэлли."
ire.2506.a.tt:0 "Избрать $ire.2505.a.tt.base$"
ire.2506.b:0 "Кэтлин Кларк."
ire.2506.b.tt:0 "Избрать $ire.2505.b.tt.base$"
ire.2506.c:0 "Дуглас Хайд."
ire.2506.c.tt:0 "Избрать $ire.2505.c.tt.base$"
ire.2506.e:0 "Эрскин Чайлдерс."
ire.2506.e.tt:0 "Избрать $ire.2505.f.tt.base$"
ire.2506.f:0 "Так тому и быть."

ire.2507.t:0 "Ответ президента"
ire.2507.d:0 "Согласно Конституции президент официально остаётся вне политики и не имеет права делать публичные заявления по поводу конкретного исхода каких-либо выборов. Несмотря на беспрецедентный поворот событий, приведший к победе Воссозданной лейбористской партии, [IRE.GetLeader] благоразумно решил придерживаться официального протокола.\n\nХотя помощники президента в частном порядке отмечают его потрясение подобным развитием событий, публично [IRE.GetLeader] говорил лишь о приверженности правительства сохранению парламентского процесса и верховенства закона.\n\nРоль президента как объединяющей фигуры наконец проявила себя в полной мере. Сторонники нового режима видят в президентской должности дополнительное подтверждение легитимности своего правительства, тогда как те, кто не голосовал бы за Воссозданную лейбористскую партию, воспринимают президента как фигуру, в большей степени отражающую их собственные взгляды."
ire.2507.a:0 "Система работает."


