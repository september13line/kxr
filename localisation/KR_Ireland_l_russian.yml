### Leaders ###
POLITICS_MICHAEL_COLLINS_DESC:0 "Майкл Коллинз - спаситель и национальный герой Ирландии, чья огромная популярность позволяет ему прочно удерживать власть. Родившийся в Корке, Коллинз участвовал в Пасхальном восстании 1916 года, а впоследствии стал президентом Ирландского республиканского братства. Во время Войны за независимость он превратил ИРА в эффективную партизанскую силу, стремясь избежать ошибок 1916 года. В 1921 году Коллинз был отправлен на переговоры по Англо-ирландскому договору. Угрожая продолжить войну при поддержке Германии, он сумел добиться включения в договор всех тридцати двух графств, однако не смог добиться признания республики, поскольку британцы опасались, что независимая Ирландская республика немедленно превратится в германскую базу. После того как Имон де Валера исключил его из Шинн Фейн, Коллинз сумел основать собственную партию, Фине Гэл, которая быстро обошла Шинн Фейн по популярности. После Британской революции он провозгласил независимую Ирландскую республику и разгромил юнионистское восстание в Ольстере. Теперь, когда приближается новая война, Коллинз выступает за возрождение ирландской экономики и вооружённых сил, чтобы окончательно утвердить независимость Ирландии."
POLITICS_CATHAL_BRUGHA_DESC:0 "Родившийся под именем Чарльз Уильям Сент-Джон Бёрджесс в семье смешанного католическо-протестантского происхождения и позднее сменивший имя после вступления в Гэльскую лигу, Катал Бру является героем Пасхального восстания и лидером остатков Шинн Фейн после заключения Англо-ирландского договора. Ещё во время Войны за независимость он был непримиримым соперником Коллинза, а позднее возглавил демократическую оппозицию - коалицию демократических партий, выступавших против его правительства. Однако с возрастом Бру всё больше превращается в символическую фигуру, вокруг которой сплачиваются сторонники, пока в республиканском движении поднимается новое поколение. Он и его партия, значительно усилившиеся благодаря множеству бывших лейбористов после распада Лейбористской партии, выступают за социал-демократическую Ирландию в духе Демократической программы 1919 года и за прогерманскую внешнеполитическую ориентацию как средство противодействия врагам Ирландии в Британии и Канаде."
POLITICS_FRANK_MACDERMOT_DESC:0 "Фрэнк Макдермот - младший сын Хью О'Рорка Макдермота, принца Кулавина. Во время Вельткрига он служил в Королевском армейском корпусе снабжения. После войны Макдермот эмигрировал в Америку, однако после американского экономического краха вернулся в Ирландию и вступил в англофильскую Партию национального центра, которую со временем возглавил благодаря выдающимся ораторским способностям. Последовательно критикуя как правительство Коллинза, так и склонность демократической оппозиции к изоляционизму или германофилии, Макдермот является убеждённым сторонником проантантовского курса и примирения с юнионистским сообществом."
POLITICS_JIM_LARKIN_DESC:0 "Джеймс Ларкин родился в Англии, а затем вместе с семьёй переехал в Ирландию. Выросший в бедности, он стал профсоюзным организатором и вместе с Джеймсом Коннолли основал Лейбористскую партию, получив особую известность благодаря участию в провальной Дублинской забастовке 1913 года. После её поражения Ларкин переехал в Америку и вступил в Социалистическую партию Америки. Вернувшись в Ирландию в 1923 году, он был встречен ирландскими синдикалистами как герой и со временем возглавил IWL, надеясь поднять синдикалистское восстание по примеру Франции на волне разочарования Англо-ирландским договором. Однако восстание провалилось после того, как осведомители заранее раскрыли планы мятежников ICA. Лейбористская партия в конце концов распалась, а Ларкин отделился и сформировал IWL, которая впоследствии победила на выборах 1937 года. Ирландская гражданская армия дорого заплатила за свою верность: её роль в Пасхальном восстании была вычеркнута из официальной истории, а заслуги её основателя Джеймса Коннолли намеренно преуменьшались."
POLITICS_GEAROID_O_CUINNEAGAIN_DESC:0 "Героид О Куинягайн - радикальный исследователь ирландского языка, родившийся в Белфасте в католической семье среднего класса. Он вступил в Ассоциацию армейских товарищей и благодаря харизме, лидерским качествам и радикальным идеям, привлёкшим внимание главы ACA Оуэна О'Даффи, сумел подняться до должности министра юстиции Ирландии. На этом посту он провёл законы, направленные на подавление синдикализма, а также ограничения на расселение пэйви, одновременно используя своё влияние для поощрения ирландского языка. О Куинягайн также поддерживал связи с румынской Железной гвардией и открыто симпатизировал идее создания в Ирландии сходного режима. Ради этой цели он основал собственную партию Ailtirí na hAiséirghe, намеренную возродить ирландский язык, запретить английский после пятилетнего переходного периода и установить жёсткий антисиндикалистский курс."
POLITICS_PADRAIC_O_MAILLE_DESC:0 "Падрик О Малье был одним из основателей Шинн Фейн и членом Ирландских добровольцев, а позднее возглавил радикально католический и антисиндикалистский Ирландский христианский фронт, выступающий за католический корпоративизм и союз с испанскими карлистами. Из-за своих антисиндикалистских взглядов в 1932 году он едва не стал жертвой покушения со стороны ICA, однако сумел выжить, несмотря на тяжёлые ранения."
POLITICS_SEAN_LEMASS_DESC:0 "Шон Лемасс был добровольцем во время Пасхального восстания и Войны за независимость, а позднее стал влиятельным лидером партии Фианна Файл, ещё одной отколовшейся организации, возникшей после упадка Шинн Фейн вслед за заключением Англо-ирландского договора. Лемасс выступает за индустриализацию и, оставаясь сторонником капитализма, считает, что нормализация отношений с Британским Союзом способна благоприятно сказаться на ирландской торговле и экономике. Он поддерживает гибкую внешнюю политику, меняющуюся в зависимости от потребностей страны, чем его крыло Фианна Файл отличается от других демократических партий, каждая из которых имеет собственные устойчивые предпочтения во внешней политике Ирландии."
POLITICS_DE_VALERA_DESC:0 "Имон де Валера родился в Нью-Йорке в семье испанского отца и ирландской матери, а в возрасте двух лет был увезён в Ирландию. Он командовал во время Пасхального восстания и был одним из политических лидеров Войны за независимость, однако после Англо-ирландского договора постепенно скатился к политической незначительности из-за череды неудачных решений и неблагоприятных обстоятельств. Несмотря на невероятную популярность Майкла Коллинза, де Валера исключил его из Шинн Фейн, а позднее и сам покинул партию после притока бывших лейбористов вслед за распадом Лейбористской партии, а также из-за разногласий с националистами, предпочитавшими прогерманский курс, противоречивший убеждённости де Валеры в изоляционизме и нейтралитете. Его отколовшаяся партия, Фианна Файл, в конечном счёте так и не добилась значительного успеха и превратилась в малую партию демократической оппозиции..."


POLITICS_ERNIE_O_MALLEY_DESC:0 "§YОписание лидера\nРодился:§! 26 мая 1897 года, Каслбар, графство Мейо, Ирландия\n§YТакже известен как:§! Эрнан О Малье\n§YПолитическая карьера:§! Теперь, когда должность президента Ирландии стала преимущественно церемониальной, было почти неизбежно, что занимающих её людей будут выбирать скорее за способность служить символом государства, чем за талант к принятию исполнительных решений. Эрни О'Мэлли прекрасно соответствует этим требованиям.\n\nБудучи заметной фигурой Войны за независимость, в последующие годы уроженец графства Мейо покинул вооружённые силы и стал одним из самых известных и читаемых писателей Ирландии, создав ряд любимых публикой романов о революционном периоде и последовавших за ним годах. Пользующийся широким уважением в ирландском обществе, О'Мэлли обладает редкой способностью одинаково легко разговаривать с богатыми и бедными, горожанами и сельскими жителями, а также со всеми, кто находится между ними.\n\nСложная и многогранная фигура, для одних он является много путешествовавшим богемным любителем искусства и интеллектуалом, сочувствующим рабочему движению, а для других - сторонником ирландского языка, гэльской культуры и образа жизни «джентльмена-фермера», столь дорогого аграриям и традиционалистам.\n\nШирокая привлекательность О'Мэлли позволила ему успешно избраться президентом, однако это вовсе не означает отсутствия противоречивых черт. Время от времени он напоминает истеблишменту о своей привычке делать резкие и безапелляционные заявления, которые неизменно вызывают бурные обсуждения и анализ в ирландской прессе."
POLITICS_KATHLEEN_CLARKE_DESC:0 "§YОписание лидера\nРодилась:§! 11 апреля 1878 года, Лимерик, графство Лимерик, Ирландия\n§YТакже известна как:§! Кэтлин Бин Уи Хлейриг\n§YПолитическая карьера:§! Жизнь Кэтлин Кларк, урождённой Дейли, была с самого начала неразрывно связана с ирландским республиканизмом.\nОна родилась в графстве Лимерик в убеждённо республиканской семье, а её дядя Джон Дейли был одним из видных деятелей Ирландского республиканского братства. Именно через него она познакомилась со своим будущим мужем Томом, незадолго до того освобождённым после пятнадцати лет заключения в английской тюрьме. В то время Кэтлин управляла процветавшим швейным предприятием в городе Лимерик, а вскоре вышла замуж за Тома, который был старше её на двадцать один год.\n\nНекоторое время супруги жили в Нью-Йорке, работая и собирая поддержку фениев среди недавно эмигрировавших ирландских американцев, после чего вернулись в Ирландию и поселились в Дублине. Там они открыли несколько табачных лавок, которыми Кэтлин управляла вместе с мужем, одновременно вступив в Гэльскую лигу и самостоятельно включившись в республиканскую деятельность. Особенно важным стало её участие в основании в 1914 году Cumann na mBan, женской военизированной организации, сыгравшей важнейшую роль в борьбе за независимость в революционные годы. Том впоследствии навсегда вошёл в историю как главный инициатор Пасхального восстания и первый подписавший Прокламацию Республики. Для самой Кэтлин восстание, однако, означало потерю мужа, брата, дяди и ещё не родившегося ребёнка. Сразу после его подавления она занялась организацией помощи семьям всех погибших и заключённых участников мятежа.\n\nНесмотря на тяжелейшие личные утраты, Кларк продолжила участвовать в республиканском движении, вступив в Шинн Фейн в 1917 году и войдя в его исполнительный комитет. Во время Войны за независимость она была избрана депутатом Дойла и исполняла обязанности окружного судьи в республиканских судах, созданных Дойлом. В последующие годы Кларк избиралась депутатом, сенатором и лорд-мэром Дублина. Особое внимание она уделяла закреплению прав женщин в законодательстве как в первоначальной Конституции 1922 года, так и во всех последующих законах. В поддержку этих требований Кларк неизменно ссылалась на Прокламацию 1916 года с её обещанием одинаково заботиться обо всех детях нации.\n\nЕдва ли в Ирландии найдётся другой человек, столь же достойный считаться живым символом жертвы, принесённой мучениками 1916 года. Поэтому вполне уместно, что теперь именно она занимает пост президента, где, будучи выше повседневной банальности исполнительной власти, Кларк выступает первым гражданином Республики и, среди прочих обязанностей, хранит память обо всех мужчинах и женщинах, отдавших жизни за свободу Ирландии."
POLITICS_DOUGLAS_HYDE_DESC:0 "§YОписание лидера\nРодился:§! 17 января 1860 года, Каслри, графство Роскоммон, Ирландия\n§YТакже известен как:§! Дуглас де Хайд\n§YПолитическая карьера:§! Лингвист и учёный Дуглас Хайд родился в графстве Роскоммон в семье настоятеля Церкви Ирландии. Уже в раннем возрасте его увлекла местная разновидность ирландского языка, и, несмотря на происхождение из протестантской элиты, Хайд проникся глубоким стремлением сохранить и распространить язык в целом, особенно после катастрофического сокращения числа его носителей вследствие Великого голода.\n\nПервоначально Хайд писал стихи и эссе на ирландском языке под псевдонимом «An Craoibhín Aoibhinn», или «Приятная маленькая ветвь», совмещая литературную работу с академической карьерой. В конечном счёте это привело его к основанию в 1893 году Гэльской лиги, или Conradh na Gaeilge, общества, посвящённого продвижению ирландского языка и культуры. Первоначальный манифест организации, написанный самим Хайдом, носил название «Необходимость деанглизации ирландской нации».\n\nНесмотря на изначально беспартийный характер, Гэльская лига стала колыбелью целого поколения ирландских националистов и республиканцев. Сам Хайд, будучи националистом, хотел, чтобы организация оставалась открытой для людей любых политических убеждений, и позднее ушёл с поста в пользу Оуэна Макнейла, когда движение стало всё сильнее политизироваться. Впоследствии он стал первым профессором современного ирландского языка в Университетском колледже Дублина и занимал должность сенатора.\n\nДаже с учётом многочисленных заслуг выбор некатолика на пост президента служит посланием всему миру о том, что ирландская идентичность основана прежде всего на культуре и наследии нации, а не на принадлежности к одной определённой религии. Новый президент вполне доволен своей преимущественно аполитичной ролью, в которой он выполняет в основном церемониальные функции национального представителя и культурного посла. Хайд привносит в должность сдержанное достоинство и продолжает пользоваться почти всеобщим уважением народа."
POLITICS_ERSKINE_CHILDERS_DESC:0 "§YОписание лидера\nРодился:§! 25 июня 1870 года, Мейфэр, Лондон, Англия\n§YТакже известен как:§! Р. Араскейн Мак ан Хойре\n§YПолитическая карьера:§! Роберт Эрскин Чайлдерс прошёл долгий и извилистый путь, прежде чем занять пост президента.\n\nРодившись в Лондоне в семье англичанина и англо-ирландки, после ранней смерти родителей он воспитывался родственниками матери в графстве Уиклоу. Образование Чайлдерс получил в Британии, и с учётом заметного положения его семьи в британских политических кругах неудивительно, что он стал государственным служащим в Палате общин, оказавшись в самом сердце истеблишмента. Отчасти под влиянием британских консервативных ценностей, на которых он вырос, Чайлдерс добровольно отправился на Англо-бурскую войну. Именно там он впервые разочаровался в империалистическом проекте и проникся идеей гомруля для Ирландии. Военный опыт также пробудил в нём тягу к писательству: он завершил две книги по военной теории, а также влиятельный шпионский роман.\n\nЧайлдерс был страстным яхтсменом и, устав от бесконечных задержек с гомрулем, проявил свою непокорность ещё сильнее, отправившись накануне Вельткрига в Германию и переправив на своей яхте «Асгард» сотни винтовок для Ирландских добровольцев. Британское правительство наградило его Крестом «За выдающиеся заслуги» за работу офицером разведки и рекогносцировки во время Вельткрига, однако жестокое подавление Пасхального восстания и попытка ввести воинскую повинность в Ирландии вызвали у него ярость.\n\nОкончательно порвав с умеренным национализмом, Чайлдерс вернулся в Ирландию на постоянное жительство и вступил в Шинн Фейн, используя литературный талант в должности директора по пропаганде первого Дойла. Его появление встретили с подозрением: многие считали его в лучшем случае перебежчиком и предателем Британии, а в худшем - британским шпионом. Однако сомнения быстро утихли благодаря бескомпромиссным республиканским взглядам, которые Чайлдерс продемонстрировал в составе делегации на успешных договорных переговорах.\n\nС тех пор Чайлдерс преимущественно жил вдали от внимания публики, посвящая время писательству, плаванию с женой Молли и периодической работе правительственным советником по морским вопросам. В качестве президента он оставляет повседневное управление государством тишоку, а сам наряду с официальными мероприятиями регулярно публикует статьи и эссе о международных отношениях Ирландии. Чайлдерс олицетворяет Ирландскую республику, примирившуюся со своим прошлым и признающую вклад англо-ирландцев в ирландский национализм и республиканизм - от Тона и Эммета до Парнелла и Кейсмента."

ARMY_LIAM_LYNCH_DESC:0 "§YОписание генерала\nРодился:§! §g20 ноября 1892 года, Баурнагуррахи, графство Лимерик, Ирландия§!\n§YТакже известен как:§! §gЛиам О Лойнши§!\n§YВоенная карьера:§! §gКрещённый под именем Уильям Фэнаган Линч, Лиам родился в политически активной фермерской семье у подножия гор Галти на границе Корка и Лимерика. Его дядя по отцовской линии участвовал в восстании 1867 года, а мать была сопредседателем местного женского отделения Земельной лиги, добивавшейся раздела крупных поместий англо-ирландского дворянства.\nКак и многие юноши его поколения, в 1913 году Линч вступил в Ирландские добровольцы, стремясь добиться гомруля, одновременно заканчивая обучение торговле хозяйственными товарами и состоя в Гэльской лиге. Подобно большинству своих товарищей, он не присоединился к более радикальному крылу Добровольцев и потому не участвовал в Пасхальном восстании, но при этом и не поступил на службу в Британскую армию. Этот умеренный подход исчез после восстания, особенно после того, как Линч стал свидетелем того, как британские солдаты расстреляли и захватили членов известной семьи Кент из Бонарда. Четверых братьев и их восьмидесятилетнюю мать провели в наручниках через мост в Фермое, один из братьев умер от полученных при задержании ран, а другой был казнён на следующей неделе. Именно тогда Линч решил посвятить всю свою жизнь делу освобождения Ирландии.\nВо время Войны за независимость он быстро прославился как командир 2-й бригады Северного Корка ИРА, руководя многочисленными успешными стычками, налётами и засадами. Линч неоднократно чудом избегал плена и смерти, а его известность была настолько велика, что британские силы по ошибке убили двух других мужчин с фамилией Линч, приняв их за свою цель.\nПережитое во время Войны за независимость до сих пор определяет Линча, занимающего влиятельное положение в армии. Он терпеть не может политиков, а в годы войны ему приписывали слова: «Армия должна прорубить путь к свободе, а политика последует за ней». Известный вниманием к деталям, Линч ещё в молодости проявил природную склонность к военной жизни. Его преданность делу была столь велика, что во время войны его нередко сравнивали со священником. Та война закончилась, но для Линча армия по-прежнему остаётся его призванием.§!"
ARMY_WJ_BRENNAN_WHITMORE_DESC:0 "§YОписание генерала\nРодился:§! §g21 октября 1886 года, Уэксфорд, графство Уэксфорд, Ирландия§!\n§YТакже известен как:§! §gЛ. С. Браонайн-Мойнван§!\n§YВоенная карьера:§! §gПосле захвата власти в Ирландии крайне правыми радикалами и последовавших потрясений в вооружённых силах Уильям Джеймс Бреннан-Уитмор оказался одним из тех, кто готов содействовать новому правительству в его военных начинаниях.\nУильям Джеймс Бреннан родился в семье журналиста и печатника из графства Уэксфорд. После неожиданной смерти обоих родителей его воспитали дядя и тётя по материнской линии, чью фамилию он добавил к своей. В юности Бреннан вступил в Королевский ирландский полк и благодаря службе в Индии дослужился до сержанта. Однако годы в Британской армии вовсе не примирили его с существующим политическим порядком: в 1907 году он вышел в отставку, уже будучи убеждённым сторонником подчёркнуто католического ирландского национализма.\nВернувшись в Ирландию и работая журналистом, он также стал одним из ранних членов Шинн Фейн и заметным местным деятелем Гэльской лиги. Неудивительно, что после основания Ирландских добровольцев в 1913 году Бреннан вступил в их ряды, а его прежний военный опыт оказался крайне полезен. Во время Пасхального восстания он служил комендантом в Главпочтамте под командованием Джеймса Коннолли, где был ранен и взят в плен.\nБреннан-Уитмор активно участвовал в работе, проводившейся заключёнными в лагере Фронгох в Уэльсе, где ветераны восстания разрабатывали военную тактику, позднее применённую в Войне за независимость. Во время самой войны он состоял в ИРА Северного Уэксфорда, но главным образом помогал Коллинзу создавать разведывательные сети.\nПосле обретения независимости Бреннан-Уитмор разочаровался в более либеральной Ирландии, которая возникла на её месте. Он покинул армию и вернулся к журналистике, преимущественно предупреждая о неминуемой угрозе синдикализма. Несмотря на преданность католической вере, он призывает всех христиан исполнить свой долг и противостоять общему синдикалистскому врагу так же, как когда-то они сопротивлялись британскому влиянию в Ирландии.\nРадикальность его публикаций достигла такой степени, что ранее Бреннан-Уитмора расследовали те самые разведывательные сети, которые он сам помог создать. Но теперь, когда нация оказалась под властью нового сильного руководства, он добровольно предложил свои услуги как человек, готовый сделать всё возможное ради спасения Ирландии и Европы в целом.§!"
ARMY_JACK_WHITE_DESC:0 "§YОписание генерала\nРодился:§! §g22 мая 1879 года, Брошейн, графство Антрим, Ирландия§!\n§YТакже известен как:§! §gШеймус де Фаойте§!\n§YВоенная карьера:§! §gДжеймс Роберт Уайт родился в семье ольстерских протестантских аристократов. Он учился в Винчестере, где постоянно подвергался наказаниям за вызывающее поведение, включая случай, когда открыто мочился на поле во время игры в крикет. Благодаря статусу отца, героя войны и фельдмаршала, Уайт поступил в Королевскую военную академию в Сандхерсте и успел закончить обучение как раз к началу Второй англо-бурской войны.\nИменно в Южной Африке Уайт впервые осознал глубину разногласий с мировоззрением британской аристократии. Однажды он пригрозил застрелить вышестоящего офицера, приказавшего без суда казнить молодого безоружного бурского пленного. Тем не менее войну Уайт завершил награждённым офицером, получив орден «За выдающиеся заслуги».\nПрослужив ещё несколько лет в мирное время, он понял, что армейская жизнь ему не подходит, после чего преподавал английский язык в Богемии, жил в толстовской коммуне в Англии и работал лесорубом в Канаде. Вернувшись в Ирландию, Уайт застал в разгаре спор о гомруле и первоначально собирался поддержать юнионистов. Однако знакомство с тогдашним ольстерским лоялизмом, чьи «фанатизм и застой» вызвали у него отвращение, подтолкнуло Уайта к поддержке гомруля. После случайной встречи с Роджером Кейсментом, а затем и с Джеймсом Коннолли он прошёл путь от сторонника самоуправления к республиканцу и наконец к убеждённому социалисту.\nУайт стал одним из основателей Ирландской гражданской армии и сыграл ключевую роль в её подготовке и организации, используя обширный опыт, полученный в самом сердце британского военного истеблишмента. Когда ICA начала переговоры с Ирландскими добровольцами, он не согласился со степенью предполагаемого сотрудничества и объединения двух организаций и покинул ополчение. Однако убеждения Уайта никуда не исчезли, и позднее он стал одним из основателей как Ирландской рабочей лиги, так и Ирландской синдикалистской партии. После заключения договора он из подполья координировал восстановленную ICA и руководил всеми, кто добровольно вступал в борьбу за настоящую социалистическую республику.\nУайт считает себя христианским социалистом и отвергает чрезмерное влияние клерикализма или любой отдельной религии в Ирландии, предпочитая стремиться к мечте Тона об объединении католика, протестанта и диссентера.§!"
ARMY_EOIN_O_DUFFY_DESC:0 "§YОписание генерала\nРодился:§! §g28 января 1890 года, близ Каслблейни, графство Монахан, Ирландия§!\n§YТакже известен как:§! §gОуэн О Дуффи§!\n§YВоенная карьера:§! §gПосле успешного захвата политической власти Оуэн О'Даффи вновь занял своё прежнее место в вооружённых силах.\nОн вырос младшим из семи детей в небогатой сельской семье графства Монахан. Прославившись в округе как страстный сторонник гэльских игр и вступив в Гэльскую лигу, после Пасхального восстания О'Даффи присоединился к Ирландским добровольцам.\nСамая дерзкая операция О'Даффи произошла в начале Войны за независимость, когда он захватил местные казармы RIC, получив оружие и взрывчатку и вдохновив соседние бригады успешно повторить этот манёвр. После похвалы начальства и последующего повышения он участвовал в защите католиков во время погромов, происходивших в районах Белфаста с националистическим большинством. Это, а также изъятие оружия из множества лоялистских домов в сельском Ольстере, создало ему репутацию человека, крайне нетерпимого к тем жителям Ирландии, которые не разделяли его стремления к независимой Ирландской республике.\nПосле войны О'Даффи был назначен комиссаром национальной полиции An Garda Síochána. Будучи близким союзником Майкла Коллинза, он в конечном счёте занял должность тишока от Фине Гэл - пост, носивший преимущественно церемониальный характер. Оставаясь важной фигурой в правительстве Коллинза, О'Даффи регулярно конфликтует с высшим руководством FG, представители которого резко не согласны со многими его правыми убеждениями.\nПоследний раз О'Даффи непосредственно участвовал в военных действиях ещё во время Войны за независимость, и прошедшие с тех пор годы не были к нему добры. Тем не менее он остаётся таким же безрассудным и пылким, как прежде.§!"
ARMY_RICHARD_MULCAHY_DESC:0 "§YОписание генерала\nРодился:§! §g10 мая 1886 года, Уотерфорд, графство Уотерфорд, Ирландия§!\n§YТакже известен как:§! §gРишард О Маолхата§!\n§YВоенная карьера:§! §gРичард Малкахи считается идеальным воплощением политика-солдата и живым примером тесной связи армии и государства, сложившейся ещё во времена Войны за независимость.\nРодившись в семье нижней части среднего класса в Уотерфорде, в шестнадцать лет он поступил на работу в почтовую службу, где позднее был переведён в инженерный отдел. В юности Малкахи впервые заинтересовался ирландским национализмом благодаря газете «The United Irishman», основанной Артуром Гриффитом, создателем Шинн Фейн. Прочитанное вдохновило его вступить в Гэльскую лигу, а ко времени назначения на работу в Дублин он уже свободно говорил по-ирландски и был убеждённым республиканцем.\nВступив в Ирландские добровольцы и отказавшись присоединиться к той их части, которая поступила на службу в Британскую армию во время Вельткрига, Малкахи благодаря работе в инженерном отделе почты обладал ценнейшими внутренними знаниями, позволившими добровольцам нарушить британские линии связи во время Пасхального восстания. Сам Малкахи провёл восстание в Ашборне, графство Мит, одном из немногих мест за пределами Дублина, где происходили боевые действия, и успешно применил партизанские методы, позднее получившие дальнейшее развитие в Войне за независимость.\nИзбранный депутатом Дойла, во время Войны за независимость он занимал пост помощника министра обороны и часто выступал посредником в постоянных личных столкновениях между Майклом Коллинзом и Каталом Бру. Малкахи сумел тесно сотрудничать и сохранять уважение к обоим, однако в конечном счёте поддержал Коллинза, когда Бру покинул Шинн Фейн и основал собственную партию. При этом с Бру он и по сей день поддерживает профессиональные отношения, оставаясь правой рукой Коллинза.\nМалкахи - осторожный, расчётливый и выдержанный руководитель и государственный деятель, каким-то образом умудряющийся совмещать политические и военные должности и обязанности. Он считает вооружённые силы неотъемлемой основой государственной власти и готов сделать всё возможное для защиты Ирландии.§!"
ARMY_HUGO_MACNEILL_DESC:0 "§YОписание генерала\nРодился:§! §g16 апреля 1900 года, Хоут, графство Дублин, Ирландия§!\n§YТакже известен как:§! §gАод Мак Нейл§!\n§YВоенная карьера:§! §gХьюго Гиацинт Макнейл считается восходящей звездой ирландской армии. Он поступил на военную службу вскоре после завершения Войны за независимость и быстро продвигался по званиям. Многие наверняка скажут, что этому помог статус племянника бывшего президента Оуэна Макнейла, однако независимо от семейных связей Макнейл доказал, что является способным, своевольным и амбициозным офицером.\nСтремясь расширить кругозор армии, ранее он проходил дополнительную подготовку при командовании Армии США, однако в последнее время считает, что наилучшей возможностью для дальнейшего развития ирландских вооружённых сил станет укрепление связей с Германской империей. Макнейл хочет окончательно отойти от разрозненных остатков структур времён Войны за независимость и создать более современную армию.\nУчитывая происхождение из политической династии, многих удивило, что Макнейл сам не пошёл в политику, однако на прямой вопрос он отвечает, что предпочитает оставить её другим. При этом государство, которое поддерживает собственную армию, естественным образом вызывает у него куда больше симпатий, чем государство, которое этого не делает.§!"
ARMY_TOM_BARRY_DESC:0 "§YОписание генерала\nРодился:§! §g1 июля 1897 года, Киллорглин, графство Керри, Ирландия§!\n§YТакже известен как:§! §gТомас де Барра§!\n§YВоенная карьера:§! §gЕсли в Ирландии и есть командир, которого повсюду опережает собственная репутация, то это Томас Бернадин Барри. Выросший в графстве Корк, он был вторым из одиннадцати детей офицера Королевской ирландской полиции и, в отличие от большинства будущих революционных товарищей, не состоял в Гэльской лиге и не происходил из республиканской или убеждённо националистической среды.\nВ семнадцать лет Барри сделал то, что в годы Вельткрига делали многие молодые европейцы, - завербовался. Он не собирался сражаться ни за Ирландию, ни даже за Британию: Барри вступил в Королевскую полевую артиллерию, потому что хотел увидеть войну, получить оружие и попутешествовать.\nСлужба привела его в Месопотамию и Египет, принесла повышение и похвалы. Несмотря на упоминание в донесениях, когда до него дошли известия о Пасхальном восстании, Барри начал сомневаться в своём положении в Британской армии и отказался от предложенного офицерского назначения в Мюнстерские фузилёры, предпочтя искать работу в другом месте.\nВ первые годы Войны за независимость Барри оставался в стороне, пока британские солдаты не закололи штыками в Корке другого бывшего военнослужащего, называя его и его товарища «ирландскими свиньями». После участия в почётном карауле на похоронах Барри окончательно утратил всякую симпатию к существующему порядку и вступил в ИРА, чтобы сражаться за независимую Ирландскую республику.\nС самого начала его высоко ценили за военный опыт, способность обучать и вдохновлять новых добровольцев, а также умение успешно приспосабливать прежние знания к совершенно иной форме войны. Это особенно проявилось в легендарной засаде при Килмайкле и в битве при Кроссбарри, где Барри во главе 104 добровольцев Западнокоркской бригады сумел вырваться из окружения британских сил, превосходивших их численностью в тринадцать раз, понеся минимальные потери.\nСам Барри приобрёл репутацию безжалостного и внушающего страх противника, настолько опасного для британцев, что одним из их первоначальных требований для заключения перемирия стало его временное заключение - требование, которое Коллинз, разумеется, отверг.\nБарри и его люди получили множество наград и похвал за храбрость, дисциплину и эффективность. Однако он не намерен почивать на лаврах и стремится оставаться «в поле», выходя за рамки своей военной славы мастера засад и летучих колонн. Барри продолжает совершенствовать методы на случай, если независимость Ирландии вновь придётся защищать «в следующей войне».§!"
ARMY_JJ_O_CONNELL_DESC:0 "§YОписание генерала\nРодился:§! §g21 декабря 1887 года, Баллина, графство Мейо, Ирландия§!\n§YТакже известен как:§! §gД. С. О Конал§!\n§YВоенная карьера:§! §gДжеремайя Джозеф «Джинджер» О'Коннелл является одним из ключевых и наиболее узнаваемых деятелей Ирландской республиканской армии.\nСын инспектора национальных школ, он учился в Университетском колледже Дублина, который окончил со степенью магистра первого класса, одновременно занимаясь подготовкой университетской команды по боксу. После учёбы О'Коннелл отправился в Соединённые Штаты и два года прослужил в Армии США в составе 69-го Нью-Йоркского полка. В 1915 году он вернулся в Ирландию и вступил в Ирландские добровольцы в качестве главного инспектора, читая лекции по военной тактике и знаменитым ирландским сражениям. В самом Пасхальном восстании О'Коннелл участия не принимал: в предшествующие дни он находился в Корке, куда был направлен в рамках печально известного контрприказа Оуэна Макнейла, едва не сорвавшего восстание целиком.\nНесмотря на непричастность к мятежу, британские власти всё равно подвергли О'Коннелла репрессиям и заключили в тюрьму. Когда Ирландские добровольцы преобразовались в Ирландскую республиканскую армию, он сохранил прежнюю должность и со временем стал директором по подготовке ИРА, пост, который занимает и по сей день. О'Коннелл является главным преподавателем на всех курсах подготовки офицеров, причём учеников нередко удивляет, насколько практичен и располагающ его подход, несмотря на впечатляющий теоретический багаж. Как военный историк он опубликовал множество статей по ирландской и зарубежной военной истории и тактике.\nО'Коннелл сыграл важную роль в роспуске старого Ирландского республиканского братства после Войны за независимость, неоднократно заявляя, что солдатам не место в тайных обществах. Майкл Коллинз, последний президент IRB, достаточно доверял мнению своего товарища, чтобы согласиться с этим.\nБудучи солдатом до мозга костей, О'Коннелл сторонится политиков и правительств, ставя превыше всего Ирландию и её армию.§!"
ARMY_DANIEL_MCKENNA_DESC:0 "§YОписание генерала\nРодился:§! §g1 декабря 1892 года, Дрейперстаун, графство Дерри, Ирландия§!\n§YТакже известен как:§! §gДомналл Мак Кионаойт§!\n§YВоенная карьера:§! §gПодобно многим представителям высшего командования, Дэниел Маккенна впервые получил военный опыт в революционные годы Ирландии. Сын ольстерского фермера, он вступил в Ирландские добровольцы в 1915 году, активно участвовал в Войне за независимость и к её завершению стал заместителем командира 2-й Северной дивизии.\nСреди коллег, а временами и в правительстве, Маккенна известен энергичностью и инициативностью как командир и организатор обороны Ирландии. После обретения независимости он особенно тщательно изучал военные аспекты Пасхального восстания в Дублине и немногочисленных городских столкновений Войны за независимость. В результате у него сформировался особый интерес к оборонительным боям в плотной городской застройке.\nМаккенна убеждён, что нападение на остров может последовать с любого направления - как географического, так и политического. Ирландия, по его мнению, обязана быть готова использовать для защиты всё доступное независимо от личности противника, а определение политической стороны вопроса является заботой правительства, а не армии. Для Маккенны при планировании будущих войн ни один потенциальный союзник или враг не должен восприниматься как нечто само собой разумеющееся, особенно учитывая периферийное положение Ирландии в Европе.\nНесмотря на германофильские настроения значительной части армии, взгляды Маккенны получают должное внимание, а сам он остаётся всецело предан подготовке страны к любой ситуации, в которую может оказаться втянута Ирландия.§!"
ARMY_DANIEL_HOGAN_DESC:0 "§YОписание генерала\nРодился:§! §g14 июля 1895 года, Клонмел, графство Типперэри, Ирландия§!\n§YТакже известен как:§! §gДомналл О Хогайн§!\n§YВоенная карьера:§! §gДэниел Хоган родился в графстве Типперэри в известной и достаточно обеспеченной фермерской семье. После окончания школы он переехал в графство Монахан и устроился клерком в Great Northern Railway Company. Именно там Хоган позднее приобрёл известность во время Войны за независимость. Первые годы в Монахане ознаменовались вступлением в GAA и Ирландские добровольцы, причём примерно тогда же он познакомился ни с кем иным, как с Оуэном О'Даффи.\nХоган приобрёл репутацию безжалостного и уверенного руководителя Монаханской ИРА, проводя многочисленные засады и нападения и одновременно служа правой рукой О'Даффи. Война принесла ему и тяжёлую личную утрату: его брат Майкл был капитаном команды Типперэри, игравшей на Кроук-Парк во время трагических событий Кровавого воскресенья, и оказался единственным игроком, застреленным британскими силами, тогда как остальные жертвы были зрителями. Хоган воспринял это крайне тяжело, и горе лишь подтолкнуло его к ещё более активной революционной деятельности в Ольстере, особенно к похищениям богатых лоялистов и поджогам нескольких их «больших домов». После окончания войны именно ему выпала честь первым поднять Триколор над Дублинским замком на церемонии передачи власти, когда британские силы официально отказались от контроля над значительной частью государственного аппарата.\nДружба Хогана с О'Даффи отошла на второй план после того, как последний начал терять благосклонность правительства: Хоган не желал, чтобы личные отношения с бывшим начальником поставили под угрозу его собственное положение в армии. Тем не менее нет сомнений, что он в определённой степени сочувствует делу О'Даффи, вероятно, отчасти из-за глубокой религиозности. Прошлые связи и колючий характер делают Хогана непопулярным среди ряда политиков, однако солдаты продолжают уважать его и полностью уверены в его способностях командира и лидера.§!"
ARMY_SEAN_MAC_EOIN_DESC:0 "§YОписание генерала\nРодился:§! §g30 сентября 1893 года, Гранард, графство Лонгфорд, Ирландия§!\n§YТакже известен как:§! §gДжон Маккеон§!\n§YВоенная карьера:§! §gШон Мак Ион родился в семье лонгфордского кузнеца и женщины, чьи республиканские предки сражались в округе во время восстания 1798 года. Юный Шон рано заинтересовался национальным вопросом и уже в одиннадцать лет принял ирландскую форму собственного имени. После окончания начальной школы он начал работать в семейной кузнице под началом отца. Как старший сын, в 1913 году Мак Ион был вынужден взять на себя огромную ответственность, когда после неожиданной смерти отца ему пришлось полностью обеспечивать кузницу и благополучие семьи. Однако это не помешало ему уже в следующем году вступить в Ирландские добровольцы и Ирландское республиканское братство.\nВо время Войны за независимость Мак Ион прославился как командир единственной действительно эффективной летучей колонны в центральных графствах, возглавляя 1-й батальон Лонгфордской бригады. Первым из двух крупных эпизодов его военной карьеры стала битва при Баллинали, где базировался Мак Ион и где он сумел удержать родную деревню против значительно превосходивших британских сил. Вторым стала засада при Клонфине, в которой он искусно атаковал несколько грузовиков с британскими солдатами, а затем проявил рыцарское отношение к раненым противникам, пожертвовав ради этого возможностью захватить столь необходимое оружие и снаряжение. Оба события стали местными легендами и принесли ему прозвище «Кузнец из Баллинали».\nЕго участие в войне завершилось пленением, во время которого Мак Ион получил пулю в грудь. После выздоровления его приговорили к смерти за участие в конфликте, однако до исполнения приговора он был освобождён в рамках договорных переговоров. Свидетельства британских солдат о гуманном обращении Мак Иона с ними также помогли отсрочить казнь.\nНаходясь в заключении, Мак Ион был избран депутатом от Лонгфорда-Уэстмита, однако после двух сроков в Дойле не стал вновь баллотироваться, предпочтя сосредоточиться на армии, особенно после того, как Британская революция создала непосредственную угрозу недавно завоёванной независимости Ирландии. «Кузнец из Баллинали», как его до сих пор называют, также известен глубокой религиозностью и тесными связями с Ричардом Малкахи и Майклом Коллинзом, хотя прежде всего он остаётся предан самой армии.§!"
ARMY_RORY_O_CONNOR_DESC:0 "§YОписание генерала\nРодился:§! §g28 ноября 1883 года, Дублин, графство Дублин, Ирландия§!\n§YТакже известен как:§! §gРуари О Конхубайр§!\n§YВоенная карьера:§! §gРодерик Игнатиус Патрик О'Коннор был третьим сыном в состоятельной дублинской семье. В юности он получил привилегированное образование, стал инженером и несколько лет провёл в Канаде, где отвечал за строительство более 1500 миль железной дороги.\nВернувшись в Ирландию в начале 1915 года, О'Коннор размышлял о вступлении в британскую армию, но вскоре вновь оказался в кругу ирландского среднего класса, который покинул перед эмиграцией. К тому времени многие его ровесники глубоко погрузились в радикальный национализм, и именно через них О'Коннор постепенно пришёл к республиканству.\nЕго инженерное образование считалось ценнейшим преимуществом. О'Коннор также участвовал в попытке создать химическое предприятие, которое вместо производства аспирина должно было заниматься изготовлением взрывчатки для будущего Пасхального восстания. Он лично участвовал в мятеже и был ранен, когда пуля снайпера срикошетила и задела череп, а другая случайная пуля повредила лодыжку. После восстания О'Коннор избежал ареста, используя вымышленное имя во время восстановления после ранений.\nПозднее он был назначен директором инженерной службы ИРА и стал практически синонимом организации диверсий, подготовки добровольцев к применению взрывчатки в бою, а также нескольких громких побегов и попыток побега из тюрем. После обретения независимости О'Коннор продолжил выполнять те же обязанности уже в составе армии.\nЭрудированный и культурный О'Коннор известен храбростью и спокойной принципиальностью. Парламентская политика его совершенно не интересует: он предан идее Республики, а в свободное время увлекается классической музыкой, бриджем и шахматами.§!"
ARMY_JAMES_STEELE_DESC:0 "§YОписание генерала\nРодился:§! §g26 октября 1894 года, Балликарри, графство Антрим, Ирландия§!\n§YТакже известен как:§! §gШеймус Мак Круах§!\n§YВоенная карьера:§! §gДжеймс Стюарт Стил, пожалуй, является одной из самых необычных фигур среди офицеров ирландской армии.\nПроисходя из среды ольстерских протестантов, во время учёбы в Королевском университете Белфаста он вступил в Офицерский учебный корпус и, как подобало верному сыну Ольстера, с энтузиазмом отправился на войну с началом Вельткрига. Стил получил чин второго лейтенанта в Королевских ирландских стрелках и был направлен на Западный фронт, где участвовал в боях при Мессине, на Сомме и под Пашендейлем, получил Военный крест и ближе к концу войны был повышен в звании.\nБритания проиграла Вельткриг, однако Стил, казалось, имел блестящее будущее в Британской армии. Итог Ирландской войны за независимость глубоко его разочаровал, поскольку собственную ирландскую идентичность он считал неразрывно связанной с британской и тяжело воспринимал расставание со многими старыми товарищами по Королевским ирландским стрелкам.\nБританская революция, разумеется, оказала огромное влияние на его мировоззрение. Стил был глубоко разочарован решением правительства в канадском изгнании фактически бросить Северную Ирландию в момент, когда вторжение недавно созданного Британского Союза казалось неизбежным. Он оказался среди военных представителей на напряжённых переговорах с южным правительством, которые в итоге привели к объединению Ирландии.\nХотя Стил никогда открыто не выражал неприязни к республиканскому строю, внимательный слушатель заметит, что он неизменно говорит просто «Ирландская армия», избегая полного официального названия, а Северную Ирландию упорно называет «Ольстером».\nСтил верен Ирландии во вторую очередь, а Ольстеру - в первую. Решение продолжить военную карьеру в новых условиях далось ему нелегко, однако он считает своим долгом представлять лоялистскую военную традицию в армии объединённого острова, чтобы её голос не оказался полностью заглушён.\nНесмотря на разногласия со многими коллегами, между ними сохраняется взаимное уважение, и, оправдывая собственную фамилию, Стил со стальной решимостью готовится к возможному новому столкновению Ирландии с синдикалистами."
ARMY_SEAMUS_O_DONNOVAN_DESC:0 "§YОписание генерала\nРодился:§! §g3 ноября 1896 года, Каслвью, графство Роскоммон, Ирландия§!\n§YТакже известен как:§! §gШеймус О Доннавайн§!\n§YВоенная карьера:§! §gЗа годы службы в ИРА О'Донован зарекомендовал себя преданным офицером, хотя некоторые могут усомниться в необходимости тех крайностей, на которые он готов пойти ради достижения поставленных целей.\nВ 1919 году О'Донован окончил Университетский колледж Дублина со степенью магистра химии, и именно профессор химии впервые свёл его с ИРА, которая без промедления назначила молодого специалиста начальником химической службы. Однако вскоре этого ему оказалось недостаточно, и в годы работы в организации О'Донован всё сильнее интересовался иными подходами, способными дополнить его увлечение взрывчатыми веществами.\nБудучи одним из меньшинства офицеров ИРА, выступивших против Англо-ирландского договора, он до сих пор твёрдо убеждён, что подобный компромисс был ошибкой, из-за чего оказался в некоторой степени изолирован от остального офицерского корпуса. О'Донован является убеждённым, хотя пока не имеющим практического опыта сторонником сочетания пехоты со взрывчаткой, авиацией и наземной техникой - безусловно амбициозной доктрины с учётом промышленных возможностей Ирландии. Даже среди наиболее радикальной офицерской клики, сохранившейся в армии, он готов заходить ещё дальше ради доказательства собственных убеждений.§!"
ARMY_SEAN_RUSSELL_DESC:0 "§YОписание генерала\nРодился:§! §g13 октября 1893 года, Дублин, графство Дублин, Ирландия§!\n§YТакже известен как:§! §gШон Руишел§!\n§YВоенная карьера:§! §gДжон Анджело Рассел был младшим из семи детей, родившихся в небогатой семье в центре Дублина. После окончания средней школы он работал помощником торговца тканями, а в 1913 году вступил в Ирландские добровольцы. Во время Пасхального восстания Рассел командовал отделением и после прекращения боёв был интернирован в Великобритании до конца года.\nВернувшись в Ирландию, он продолжил службу уже в формировавшейся Дублинской ИРА и участвовал в Войне за независимость. По мере развития конфликта Рассел стал командиром 2-го батальона Дублинской бригады, а позднее главным квартирмейстером всей Дублинской ИРА. Благодаря прекрасному знанию состава и структуры организации в столице он сыграл важнейшую роль в помощи Майклу Коллинзу при отборе людей для одновременного убийства британских разведчиков в день, позднее получивший название «Кровавое воскресенье». Через осведомителя Рассел также узнал о готовившейся британской расправе над гражданскими лицами на Кроук-Парк в тот же день, однако предотвратить её ему не удалось.\nПосле Англо-ирландского договора Рассел покинул вооружённые силы и вернулся к гражданской жизни. Отчасти это было связано с разочарованием из-за позднейших событий Кровавого воскресенья, а отчасти с ощущением, что «дело сделано».\nОднако постепенное нарастание напряжённости на континенте изменило его мнение. Устав от однообразия жизни вне армии, Рассел недавно вышел из отставки. Хотя в последние годы он не обладал большим опытом полевого командования, служба во время Войны за независимость привела к его назначению ответственным за изучение вопросов закупки и производства вооружения и снаряжения. Рассел взялся за эту задачу с энтузиазмом и, почти не обращая внимания на политические соображения, удивил многих разнообразием потенциальных источников помощи, которые готов рассматривать.§!"
ARMY_NEVEN_HENAFF_DESC:0 "§YОписание генерала\nРодился:§! §g25 октября 1908 года, Нант, Нижняя Луара, Французская республика§!\n§YТакже известен как:§! §gСелестен Лене§!\n§YВоенная карьера:§! §gВ знак поддержки тех, кого он считает своими кельтскими братьями, Невен Энафф стал одним из немногих новых офицеров, добровольно согласившихся служить режиму О Куинягайна.\nМолодой радикал бретонского националистического подполья, к которому присоединился ещё подростком, Энафф черпает вдохновение для своего представления о свободной Бретани из двух разных образцов: милитаристской дисциплины пруссаков и патриотического революционного пыла ИРА. Несмотря на то что региональная автономия во Франции при коммунарах лишь укреплялась и положение Бретани несравнимо лучше, чем при старой Республике, Энафф раздражён даже теми изменениями, которые большинство бретонских националистов считают огромным шагом вперёд. Для него этого недостаточно и никогда не будет достаточно, пока Бретань остаётся в одном государстве, как бы оно ни было устроено, с людьми, сделавшими всё возможное для уничтожения его наследия.\nПолучив образование инженера-химика, Энафф организовал подрыв исторической статуи, посвящённой объединению Бретани и Франции в XV веке. Этот символический акт лишь укрепил его радикализм. Теперь он прибыл в Ирландию, чтобы на собственном опыте познакомиться не только с работой ИРА, но и с новым могущественным режимом, захватившим власть в стране и разделяющим его ненависть к синдикализму.\nЕго родной бретонский язык мало похож на ирландский, однако Энафф с энтузиазмом старается совершенствовать владение языком новой родины и воспринимается как желанное подкрепление в период, когда число лояльных режиму офицеров неуклонно сокращается.§!"
NAVY_SEAMUS_O_MURIS_DESC:0 "§YОписание адмирала\nРодился:§! §g29 января 1889 года, Литлхэмптон, Западный Суссекс, Англия§!\n§YТакже известен как:§! §gДжеймс Моррис§!\n§YВоенно-морская карьера:§! §gШеймус О Муириш родился в семье из графства Голуэй с давними морскими традициями. Его прапрадед стал первым католиком, которому в 1796 году разрешили получить офицерский чин в Королевском флоте, причём служить ему позволялось исключительно на «Ирландской станции».\nИз-за проживания отца в Англии на момент рождения О Муириш первоначально получил образование там, однако дома с детства свободно говорил по-ирландски. Вернувшись затем в Ирландию, в 1904 году он поступил в Королевский флот как мичман Джеймс Фрэнсис Моррис. За годы службы он побывал на множестве кораблей, особенно на H.M.S. Vincent, на борту которого участвовал в Ютландском сражении 1916 года, где погиб его брат Чарльз.\nОднако всякая семейная связь с Королевским флотом оборвалась во время Войны за независимость, когда О Муириш узнал, что британские силы сожгли родной город его семьи Клифден. В то время он служил заместителем командира H.M.S. Castor и, кроме того, получил приказ перевозить ирландских политических заключённых в Англию для интернирования. Этого оказалось слишком много. О Муириш досрочно ушёл из Королевского флота и вернулся домой.\nПосле обретения независимости и окончательного перехода последних старых британских военно-морских баз под ирландский контроль в 1925 году он принял ирландскую форму своего имени и получил от правительства неблагодарную задачу развивать только зарождающуюся морскую службу Ирландии.§!"
NAVY_HENRY_HG_STOKER_DESC:0 "§YОписание адмирала\nРодился:§! §g2 февраля 1885 года, Дублин, графство Дублин, Ирландия§!\n§YТакже известен как:§! §gАнри А. Г. Мак ан Стокайре§!\n§YВоенно-морская карьера:§! §gРодившийся в известной протестантской семье Дублина, Генри Хью Гордон Стокер вступил в Королевский флот в 1900 году и с самого начала проявлял огромный интерес к развивающейся области подводного флота. В рамках перевода в Королевский австралийский флот он совершил переход на подводной лодке из Плимута в Сидней, став первым подводником, преодолевшим столь огромное расстояние. Его репутация ещё больше укрепилась во время Вельткрига, когда подлодка под его командованием первой прорвалась через Дарданеллы, избежав турецких минных полей, береговых батарей и патрульных кораблей. В Мраморном море Стокер начал нарушать перевозки турецких припасов и подкреплений, однако позднее его лодка была атакована османской канонеркой, и остаток войны он провёл в лагере военнопленных.\nНесмотря на награждение орденом «За выдающиеся заслуги», Стокер покинул Королевский флот ещё до Британской революции и вернулся в Ирландию. С тех пор, ссылаясь на всё более нестабильную политическую обстановку, он вновь посвятил себя военно-морским вопросам. Будучи племянником знаменитого писателя Брэма Стокера, Генри не унаследовал убеждений дяди в пользу гомруля и теперь именно ради Ирландии продвигает дальнейшее развитие подводной войны, будучи уверенным, что господство субмарин является ключом к защите побережья острова."

