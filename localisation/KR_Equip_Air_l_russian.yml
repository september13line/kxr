FRA_cv_CAS_equipment_3_desc: "Фоккер Тhe development of the Nord 1500 Noréclair was riddled with controversy and design flaws - yet, due to the pressing need of air supremacy over the seas due to threats abroad, the development of the Noréclair was pushed through regardless. The aircraft still has a few kinks to it, but new versions intend to perfect the flying armory."
