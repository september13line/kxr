 RUS_iw_small_airframe: "Биплан"
 RUS_iw_small_airframe_desc: "Бипланы считаются стабильными и маневренными самолётами с ограниченной скоростью. Среди различных военных бипланов, произведенных в России, самым успешным и легендарным является И-15. И-15 и его модификации быстры и устойчивы и предназначены для совместных действий с более совершенным И-16 в качестве ведомого. Хотя к 1936 году большинство бипланов начинают устаревать, поскольку авиационные инновации стремительно развиваются, они все ещё составляют достойный костяк российского воздушного флота."
 RUS_basic_small_airframe: "Моноплан"
 RUS_basic_small_airframe_desc: "Считаясь будущим авиации, монопланы произвели революцию в скоростных стандартах. Среди первых полноценных монопланов наиболее примечательной моделью является И-16, который быстро стал легендарным самолётом среди пилотов благодаря своей маневренности, связанной с высоким риском и высокой отдачей: асы использовали И-16 как самое смертоносное оружие, но для необученного пилота единственная ошибка могла превратить самолёт в летающий гроб.\n\nПока Воздушный флот концентрирует усилия на истребителях, по требованиям армии разрабатываются первые полноценные ближние бомбардировщики поддержки - многоцелевой ББ является первым экспериментом ВВС России по созданию самолёта, стремящегося преуспеть во всех ролях - истребителя, бомбардировщика и разведчика."
 RUS_improved_small_airframe: "Скоростной самолёт"
 RUS_improved_small_airframe_desc: "С приближением войны ВВС открыли программу по созданию скоростных самолётов. Программа закрепила за 'Скоростью', 'Соколом' и 'Дуксом' статус основных производителей истребителей, каждый из которых имел свой подход: 'Скорость' пытается сочетать гражданское качество и военные стандарты, 'Дукс' проектирует свои самолёты, делая упор на скорость и тяжелое вооружение, а 'Сокол' выпускает серийные самолёты.\n\nВ то же время армия сосредоточила свои требования на бронированной ближней авиационной поддержке, благодаря чему родились такие легендарные бронированные штурмовики, как БШ-2 и БШ-6."
 RUS_advanced_small_airframe: "Цельнометаллический самолёт"
 RUS_advanced_small_airframe_desc: "Основываясь на фронтовом опыте борьбы с различными конструкциями вражеских самолётов, российские авиаразработчики, такие как 'Скорость' и Северский, сосредоточили свои усилия на стандартизации, балансировке и устранении недостатков существующих самолётов вместо разработки непроверенных новых конструкций. Деревянные самолёты ушли в прошлое, а вес и каждая деталь были протестированы и облегчены. Каждый из новых самолётов должен быть не просто улучшенной версией предыдущего, а на практике совершенно другим самолётом, практически все аспекты которого были доведены до совершенства."
 RUS_modern_small_airframe: "Реактивный истребитель"
 RUS_modern_small_airframe_desc: "Первые российские реактивные самолёты были созданы 'Скоростью', которой удалось обогнать в разработке 'Сокол' - в основном благодаря успешной конверсии истребителя И-30 в реактивный самолёт. Хотя и 'Сокол', и 'Скорость' являются основными производителями реактивных самолётов для российского Воздушного флота, самолёты 'Скорости', как правило, более надежны благодаря более медленному процессу разработки и заимствованию идей у других компаний, в то время как 'Сокол' часто совершает неожиданные прорывы благодаря своим революционным разработкам."

 RUS_iw_medium_airframe: "Многоцелевой самолёт"
 RUS_medium_plane_airframe_0_desc: "Созданный в ЦАГИ в начале 1930-х годов российский разведчик Р-6 - это самолёт-разведчик с функциями истребителя, который может служить легким бомбардировщиком с полезной нагрузкой 500 кг. Концептуально это 'летающий крейсер', летающий аналог многоцелевого боевого корабля - большой и неповоротливый, но не мастер ни в чем. По мере запуска в производство более специализированных самолётов многоцелевые разведчики стали переводиться на транспортные роли."
 RUS_basic_medium_airframe: "Целевой сред. бомб."
 RUS_medium_plane_airframe_1_desc: "По мере стремительного развития авиационных технологий стало очевидно, что необходимы специализированные самолёты. В 1934 году Воздушный флот России заказал разработку двух специализированных бомбардировщиков: СБ - боевой самолёт ЦАГИ, предназначенный для действий на ближних дистанциях - и дальний бомбардировщик ДБ-3 от ОСОАВИАХИМа. Эти самолёты обеспечивают основную часть потенциала авиационной поддержки России. Роль средних бомбардировщиков становится все более важной, особенно в России с её огромными оперативными расстояниями."
 RUS_improved_medium_airframe: "Разработка ОТО"
 RUS_medium_plane_airframe_2_desc: "Специальный технический отдел (ОТО) был организован военным командованием на короткий период для разработки идеального фронтового самолёта поддержки. Результатом этой программы стал многоцелевой самолёт '100' от 'Гамаюна', ответвлениями которого стали фронтовой бомбардировщик ФБ-2 и тяжелый истребитель ТИС-3. Все разработки ОТО получили высокую оценку военного командования и пилотов, в то же время как продолжение специализированных проектов разрабатывались новые ДБ-3Ф от ОСОАВИАХИМа и СБ-2 от ЦАГИ."
 RUS_advanced_medium_airframe: "Тяжелый тактич. бомб."
 RUS_medium_plane_airframe_3_desc: "По мере развития войны средние бомбардировщики становились все более разрушительными, часто вооружаясь как ракетами, так и бомбовой нагрузкой, соперничавшей с нагрузкой ранних стратегических бомбардировщиков. Однако опыт на поле боя показал, что всем предыдущим конструкциям недостает некоторых аспектов. ДБ неудобны в использовании, ПБ требуют большей нагрузки и улучшенной обороны, ФБ нуждаются в лучших двигателях, а ТИС страдают от множества проблем. Все эти самолёты имеют потенциал преуспеть при тщательной доработке."
 RUS_modern_medium_airframe: "'Реактивный бомбардировщик'"
 RUS_medium_plane_airframe_4_desc: "Российские 'реактивные бомбардировщики' - это бесконечная конкуренция между 'Гамаюном' и ЦАГИ. Первоначально проиграв RFB-2 от 'Гамаюна', ЦАГИ сумел вернуть себе позиции основного разработчика российских тактических бомбардировщиков со своим RFB-4. У обоих разработчиков есть свои плюсы и минусы, и их самолёты следуют довоенным схемам - ЦАГИ развивают духовных преемников серии ФБ, в то время как 'Гамаюн' продолжает использовать схему своей серии ДБ."
 
 RUS_iw_large_airframe: "Летающий крейсер"
 RUS_large_plane_airframe_0_desc: "В начале 1930-х годов наблюдалась настоящая одержимость более крупными 'летающими крейсерами', вершиной которой стал 8-моторный бомбардировщик ТК с полезной нагрузкой 12 000 кг, произведенный непосредственно при поддержке Савинкова в 1935 году. Однако самым массовым самолётом типа 'летающий крейсер' на российской службе является бомбардировщик ТБ-3 - основа российской стратегической авиации. Хотя эти самолёты устарели уже к 1936 году и в целом были довольно плохи, они стали первыми российскими тяжелыми бомбардировщиками, применявшимися массово."
 RUS_basic_large_airframe: "Дальний самолёт"
 RUS_large_plane_airframe_1_desc: "Разработка дальних бомбардировщиков привела к появлению бомбардировщика ТБ-7, который пришел на смену устаревшим летающим крейсерам. Это первый по-настоящему современный стратегический бомбардировщик на российской службе, обладающий довольно большой полезной нагрузкой и высокой дальностью действия."
 RUS_improved_large_airframe: "Улучшенная серия ТБ"
 RUS_large_plane_airframe_2_desc: "Поскольку стратегические бомбардировщики сложны в производстве, простого наличия высокой бомбовой нагрузки недостаточно. Они должны быть достаточно вооружены для защиты от гораздо более дешевых истребителей. С этой целью была разработана серия ТБ-8 как попытка исправить основные проблемы более ранней серии ТБ-7. самолёт получил переработанные носовую и хвостовую части вместе с современными двигателями. Хотя он и является худшим стратегическим бомбардировщиком по сравнению с предложенным Сикорским ДВБ, он гораздо проще в производстве и поэтому получил одобрение военного командования."
 RUS_advanced_large_airframe: "Серия ДВБ"
 RUS_large_plane_airframe_3_desc: "Конец войны показал, что стандартные тяжелые бомбардировщики не справляются со своей основной задачей по уничтожению вражеских производственных мощностей из-за ограниченной дальности и легкой уязвимости для огня. Серия ДВБ стала результатом этого открытия: здесь нет попыток предаваться точному прицеливанию по 'военным целям'. Эти самолёты спроектированы как дальние высотные бомбардировщики, способные уничтожить город одним ударом силами небольшого флота."
 RUS_modern_large_airframe: "Серия РТБ"
 RUS_large_plane_airframe_4_desc: "ЦАГИ стал единственным российским авиаразработчиком, специализирующимся на стратегических бомбардировщиках, особенно после того, как Сикорский переключился на специализацию в области вертолетов. Серия РТБ от ЦАГИ - это 3-моторный самолёт с хорошими летными характеристиками и полезной нагрузкой, предназначенный для операций на континентальном уровне, но ему не хватает дальности для эффективных межконтинентальных бомбардировок. Несмотря на это, летные характеристики серии РТБ непревзойденны в своем классе, и самолёт имеет большой потенциал для дальнейшей модернизации."

