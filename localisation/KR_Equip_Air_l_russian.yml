GER_jet_strat_bomber_equipment_1_desc: "Видя потребность Германии в реактивном межконтинентальном бомбардировщике, компания Арадо Афиационворкс приступила к разработке увеличенной версии своего экспериментального реактивного тактического бомбардировщика Ар 234. Ар 576 имеет уникальную конструкцию двигателя, в которой все четыре реактивных двигателя встроены в крыло самолёта; именно за дрожащий звук, издаваемый этими двигателями при раскрутке, звук, похожий на удар молотка по фюзеляжу, Ар 576 получил прозвище "молот" среди немецких лётчиков-испытателей."
