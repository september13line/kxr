MAF_nav_bomber_equipment_3_desc: "Фоккер Т. Передовой самолёт Хайнкель Хе 115 часто страдал от проблем на немецкой службе. Более поздняя модель E переработала самолёт с нуля, решив эти проблемы и сохранив уникальную роль 115-го между обычным морским самолётом и морским патрульным самолётом."
