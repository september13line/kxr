###
### Kingdom of Finland ###
###

FIN_heavy_fighter_equipment_1: "VL Tähti"
FIN_heavy_fighter_equipment_1_short: "Фоккер Тähti"
FIN_heavy_fighter_equipment_1_desc: "Developed from the Canadian Beaufort medium bomber in line with Canada's own Beaufighter design, the VL Tähti has been signifcantly lightened and its armaments and engine retrofitted for its new role. Though, unlike the Canadian Beaufighter, the bombardier's compartment has not been removed. Instead, the Tähti features a rotating front turret."
FIN_heavy_fighter_equipment_2: "Petlyakov Pe-3"
FIN_heavy_fighter_equipment_2_short: "Pe-3"
FIN_heavy_fighter_equipment_2_desc: "Noting the success of Communard and British heavy fighter designs, in 1941 famed aircraft designer Vladimir Petlyakov and his eponymous aerospace firm began work on a fighter variant of the earlier Pe-2 medium bomber. As with many Russian designs, despite hostility between Russia and Finland, the Finnish government contracted the Petlyakov for a substantial number of the new aircraft."
FIN_heavy_fighter_equipment_3: "VL Vihuri"
FIN_heavy_fighter_equipment_3_short: "Vihuri"
FIN_heavy_fighter_equipment_3_desc: "While some accuse the Finnish of copying the design of the Union of Britain's 'Mosquito', the Finnish 'Vihuri' is indeed a Finnish design taking cues from German, Russian, Entente, and Syndicalist models."

FIN_fighter_equipment_0: "C.VI.25"
FIN_fighter_equipment_0_short: "C.VI.25"
FIN_fighter_equipment_0_desc: "Фоккер Тhe C.VI.25 has had a troubled development history - its first operational model crashed due to an underpowered engine. The Siemens engine was replaced with a more modern German one, and outfitted with dual machine guns - and thus Finland's standard fighter was born."
FIN_fighter_equipment_1: "VL Myrsky"
FIN_fighter_equipment_1_short: "Myrsky"
FIN_fighter_equipment_1_desc: "In the 1930s, Finland realized that it was rapidly falling behind its allies and enemies alike in fighter designs, lacking a steel-framed monoplane entirely. The Myrsky was designed by the Finnish state aircraft factory on the basis of German designs and featuring a Canadian engine."
FIN_fighter_equipment_2: "VL Humu"
FIN_fighter_equipment_2_short: "Humu"
FIN_fighter_equipment_2_desc: "While the Brewster Buffalo carrier fighter was initially rejected for US service and redesigned, the Finnish were immediately interested in the Brewster company's initial model. Before any prototype had ever been produced, Finland placed an order for several Buffalos. Upon arrival in Finland, the planes were retrofitted in their entirity."
FIN_fighter_equipment_3: "VL Pyörremyrsky"
FIN_fighter_equipment_3_short: "Pyörremyrsky"
FIN_fighter_equipment_3_desc: "Фоккер Тhe Pyörremyrsky was designed around later models of the Хайнкель Хе 100 with substantial changes made to improve the craft's agility, range, and armaments. The Pyörremyrsky is a remarkably quick and manoeuvrable fighter."
FIN_jet_fighter_equipment_1: "SAAB J 21R"
FIN_jet_fighter_equipment_1_short: "J 21R"
FIN_jet_fighter_equipment_2: "SAAB 29 Tunnan"
FIN_jet_fighter_equipment_2_short: "SAAB 29"

FIN_nav_bomber_equipment_1: "VL Kotka"
FIN_nav_bomber_equipment_1_short: "Kotka"
FIN_nav_bomber_equipment_1_desc: "Based on German torpedo bombers of the era, the VL Kotka dutifully serves Finland as their vanguard in the Baltic Sea. More recent models take much inspiration from the German Арадо Ар 195. Other variations of the aircraft have had it equipped with different manners of bombs, torpedoes, and machine guns."
FIN_nav_bomber_equipment_2: "Фоккер Т.VIII"
FIN_nav_bomber_equipment_2_short: "Фоккер Т.VIII"
FIN_nav_bomber_equipment_2_desc: "As the VL Kotka became more and more outdated, it became necessary for Finland to modernize its maritime aircraft: thus, striking a deal with the Black Monday-ravaged Netherlands, Finland paid a hefty sum for a licence to the new Фоккер Т.VIII torpedo bomber. There were only a few on initial arrival, but testing has proven it instrumental in the new Finnish air ranks."
FIN_nav_bomber_equipment_3: "Хейнкель 115"
FIN_nav_bomber_equipment_3_short: "Хейнкель 115"

FIN_CAS_equipment_1: "Fokker-VL C.X III"
FIN_CAS_equipment_1_short: "C.X III"
FIN_CAS_equipment_1_desc: "Adopted by the Dutch in 1933, the Fokker C.X was designed fly low to the ground to avoid anti-aircraft fire and as such had a low stall speed. The Finnish-built series III variant had a slightly modified chassis and redesigned wings as well as a new engine."
FIN_CAS_equipment_2: "Fokker C.XIII"
FIN_CAS_equipment_2_short: "C.XIII"
FIN_CAS_equipment_3: "SAAB A 21"
FIN_CAS_equipment_3_short: "A 21"
FIN_CAS_equipment_3_desc: "Фоккер Тhe Saab A-21 was first a fighter named J 21, but because it shown an inadequate performance for its fighter role. Despite this, the Saab design bureau realized its cell would be an excellent platform for an attacker. Its unique push-pull configuration, its powerful engine and the choice of loadout make it a powerful CAS."

FIN_tac_bomber_equipment_0: "Avro VL Anson"
FIN_tac_bomber_equipment_0_short: "Anson"
FIN_tac_bomber_equipment_0_desc: "Фоккер Тhe Avro Anson is a medium bomber built from the Canadian airliner, the Avro 652. Unable to afford modern German designs, in 1935, the Finnish opted to adopt the Anson as a stopgap solution to their lack of bomber craft."
FIN_tac_bomber_equipment_1: "Bristol-VL Blenheim"
FIN_tac_bomber_equipment_1_short: "Blenheim"
FIN_tac_bomber_equipment_1_desc: "Фоккер Тhe Blenheim medium bomber is Canada's first all-metal bomber. It was adopted by the Finish Air Force following the suprising success of the Anson, which impressed the country's leadership with Canadian aircraft."
FIN_tac_bomber_equipment_2: "Фоккер Тupelov SB 2M-103"
FIN_tac_bomber_equipment_2_short: "SB 2M-103"
FIN_tac_bomber_equipment_2_desc: "Before the development of the Tupelov SB, Russian firms lagged behind their western counterparts in modern medium-bomber designs. The trials and tribulations of the SB, however, injected much needed innovation into the country. The 103 features several improvements over older production models. While the Finnish adopted variant is not, strictly speaking, a true 103, Finnish SBs have been similarly retrofitted."
FIN_tac_bomber_equipment_3: "Arkhangelsky SBB-2"
FIN_tac_bomber_equipment_3_short: "SBB-2"
FIN_tac_bomber_equipment_3_desc: "Based on a late model Tupelov SB, the Arkhangelsky designed the new SB-RK in late 1940 as a replacement for the SB adapted to dive-bombing rather than low level-high speed attacks. The SB-RK was later renamed to SBB and with the prototype's rejection by the Russian military, the SBB was redisgned, with the new craft designated SBB-2. The SBB-2 was offered to several foreign governments, with the Finnish securing a license to produce the aircraft."
FIN_jet_tac_bomber_equipment_1: "Арадо Ар 234"
FIN_jet_tac_bomber_equipment_1_short: "Арадо Ар 234"

