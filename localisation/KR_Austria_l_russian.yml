### Events ###
austria.1.t:0 "Положение Австрии в 1936 году"
austria.1.d:0 "Несмотря на то что Австрия оказалась среди победителей Вельткрига, война как никогда ясно обнажила культурные, классовые и идеологические противоречия внутри Империи, а внутренние волнения не прекратились и после окончания боевых действий.\n\nКайзер Карл, следуя примеру убитого Франца Фердинанда и пытаясь преобразовать многонациональную Австро-Венгерскую империю в государство, способное пережить XX век, начал серию масштабных реформ. Однако его усилия в значительной степени блокировались знатью венгерской половины Империи, из-за чего планы федерализации продвигались лишь медленно и только в Цислейтании.\n\nТем не менее многие считают, что у Австрии ещё есть надежда. Последние десятилетия были тяжёлыми для Империи, но приложенные усилия наконец начинают приносить плоды. Цислейтанская Австрия, ныне представляющая собой федеративное государство, успокоилась, однако того же нельзя сказать о Транслейтании. Впрочем, маловероятно, что Карпатский бассейн и дальше останется полностью в руках мадьяр: народы Венгрии уже давно смотрят на свободы по другую сторону Лейты и желают такой же автономии для себя. Сумеют ли реформы найти дорогу и в Венгрию, наверняка знает лишь кайзер."
austria.1.a:0 "Austria erit in orbe ultima."

austria.3.t:0 "Смерть кайзера Карла"
austria.3.d:0 "Карл Франц Иосиф Людвиг Губерт Георг Отто Мария фон Габсбург, родившийся 17 августа 1887 года и правивший как кайзер Австрии Карл I с 21 ноября 1916 года, сегодня скончался. Унаследовав престол после одного из самых долго правивших и значимых монархов в истории Австрийской империи, Франца Иосифа I, Карлу пришлось провести двойную монархию через ужасы Вельткрига и в конечном итоге увидеть её победительницей. Хотя послевоенные годы оказались тяжёлыми как для Империи, так и для самого правителя, кайзеру удалось провести ряд необходимых реформ и сохранить за Австрией важную роль на европейской арене. Его преемником станет сын, Франц Иосиф Отто Роберт Мария Антон Карл Макс Генрих Сикст Ксавер Феликс Ренатус Людвиг Гаэтан Пий Игнатий фон Габсбург, который в честь своего двоюродного прадеда примет имя Франца Иосифа II."
austria.3.a:0 "Да здравствует кайзер Франц Иосиф II!"

aus.elections.1.t:0 "Австрийские выборы 1936 года"
aus.elections.1.d:0 "С началом федерализации, когда «австрийские выборы» фактически стали проводиться преимущественно в немецкоязычной части Империи, в австрийской политике господствуют две крупные партии: CS и SDAPÖ.\n\nВыборы этого года также проходят в ожесточённой борьбе: SDAPÖ и CS предлагают совершенно разные способы преодоления продолжающегося экономического кризиса. Программа SDAPÖ сосредоточена на облегчении положения рабочих, прежде всего посредством пособий по безработице и государственного вмешательства. CS, напротив, придерживается курса жёсткой экономии."
aus.elections.1.a:0 "Пусть решает народ."

aus.elections.2.t:0 "Открытие школы и митинг SDAPÖ"
aus.elections.2.d:0 "Хотя экономическое положение Австрии уже некоторое время остаётся тяжёлым, в первые годы после Вельткрига, когда CS и SDAPÖ ещё совместно участвовали в управлении, в [Root.GetNameDef] были проведены масштабные реформы образования и социального обеспечения. Началось строительство училищ для подготовки квалифицированных рабочих, были введены рабочие пенсии, а детский труд был окончательно искоренён. В социалистических кругах Вена стала считаться одним из передовых городов мира.\n\nСегодня в девятом округе Вены открылась новая академия, которую SDAPÖ представляет как крупный успех. На церемонии выступили многие политики, а Карл Реннер всё время скромно оставался на заднем плане.\n\nФактически Реннер возглавляет партию с тех пор, как во время Вельткрига заслужил расположение императора своей политикой Бургфридена и сотрудничества с Короной."
aus.elections.2.a:0 "Их усилия заслуживают похвалы."
aus.elections.2.b:0 "Лучше бы они не присваивали себе достижения совместного правительства."

aus.elections.3.t:0 "Адлер осуждает SDAPÖ"
aus.elections.3.d:0 "Фридрих Адлер, сын бывшего главы SDAPÖ и радикальный социалист, наиболее известный убийством графа Штюргка в знак протеста против Вельткрига, выступил с осуждением SDAPÖ, назвав её «таким социализмом, который всего лишь служит истеблишменту»."
aus.elections.3.a:0 "Радикалы остаются радикалами."

aus.elections.4.t:0 "CS приглашает принца Отто на охоту"
aus.elections.4.d:0 "CS, партия мелкой буржуазии, Католической церкви и консервативной сельской местности, обычно воздерживается от проведения крупных публичных мероприятий. В Вене она предпочитает сосредотачиваться на небольших закрытых встречах. Одно из таких мероприятий планируется провести в форме охоты в Венском лесу.\n\nПринц Отто получил официальное приглашение принять в ней участие. Благодаря аристократическому воспитанию наследник Габсбургов уже давно привык к подобным светским мероприятиям."
aus.elections.4.a:0 "Если он хочет..."
aus.elections.4.b:0 "Императорская семья выше подобных мелочей."

aus.elections.5.t:0 "Удачная охота для CS"
aus.elections.5.d:0 "После охоты состоялся пир, во время которого было записано радиоинтервью с несколькими видными деятелями CS, а также с принцем Отто. Похоже, всё было устроено намеренно: теперь принца Отто всё чаще связывают с партией, а поддержка CS среди наиболее преданных подданных заметно возросла."
aus.elections.5.a:0 "Так вот на что они охотились?"

aus.elections.6.t:0 "Несчастный случай на охоте: принц Отто ранен?"
aus.elections.6.d:0 "Во время происшествия, которое все свидетели единогласно признали несчастным случаем, охотничье ружьё сына одного из видных политиков CS случайно выстрелило, и пуля задела правую ногу принца Отто. Хотя наследник престола не получил серьёзных ранений, пресса уже вовсю раздувает всевозможные теории заговора."
aus.elections.6.a:0 "Они пытаются убить моего наследника?"

aus.elections.7.t:0 "Тени в лесу"
aus.elections.7.d:0 "То, что должно было стать обычным началом обычной охоты, организованной CS при участии принца Отто, с первых минут оказалось окутано зловещей атмосферой. Многие участники сообщали о странных тёмных фигурах, скрывавшихся среди деревьев и двигавшихся параллельно веренице экипажей. Ещё более странными выглядят исчезновения пороха и даже нескольких ружей. Некоторые представители CS пытались убедить принца отменить мероприятие ещё до его полноценного начала, однако партийные руководители пока пресекли подобные попытки."
aus.elections.7.a:0 "Наверное, воздух в это время года такой!"
aus.elections.7.b:0 "Это ружьё идеально подходит для небольшой доработки..."

aus.elections.10.t:0 "CS побеждает на выборах"
aus.elections.10.d:0 "Окончательные результаты выборов подведены. Борьба была напряжённой, однако подавляющая поддержка сельских избирателей вывела CS на первое место."
aus.elections.10.a:0 "Австрия - христианско-социальная."

aus.elections.11.t:0 "SDAPÖ побеждает на выборах"
aus.elections.11.d:0 "Окончательные результаты выборов подведены. Борьба была напряжённой, однако голоса жителей Вены обеспечили SDAPÖ уверенную победу."
aus.elections.11.a:0 "Австрия - социал-демократическая."

aus.elections.100.t:0 "Выборы"
aus.elections.100.d:0 "Окончательный подсчёт голосов завершён. После этой ожесточённой избирательной кампании мы наконец узнаем победителя."
aus.elections.100.a:0 "Разве это не захватывающе?!"

aus.elections.101.t:0 "Правая коалиция побеждает на выборах"
aus.elections.101.d:0 "Окончательные результаты выборов подведены. Борьба была напряжённой, однако подавляющая поддержка сельских избирателей вывела CS и VF на первое место."
aus.elections.101.a:0 "Австрия - христианско-социальная."
aus.elections.101.b:0 "Дольфус и VF берут коалицию под контроль."

aus.elections.102.t:0 "SDAPÖ побеждает на выборах"
aus.elections.102.d:0 "Окончательные результаты выборов подведены. Борьба была напряжённой, однако голоса жителей Вены обеспечили SDAPÖ уверенную победу."
aus.elections.102.a:0 "Австрия - социал-демократическая."
aus.elections.102.b:0 "Калерги и Партия Дунайского союза берут коалицию под контроль."

### Italian Question ###
austria.100.t:0 "Наши отношения с Неаполем"
austria.100.d:0 "Хотя наша Итальянская федерация и планы по установлению австрийского господства над Италией потерпели крах, сегодня мы значительно сильнее, чем в 1926 году. Не стоит ли отправить посланника ко двору короля Фердинанда III, предложив восстановить разорванные отношения и помочь вернуть порядок в Италию?"
austria.100.a:0 "Возобновим наши южные связи!"
austria.100.b:0 "Милан - более надёжная ставка."

austria.101.t:0 "Послание дружбы из Австрии"
austria.101.d:0 "Сегодня в столицу прибыл высокопоставленный австрийский посол. Он говорил о великой дружбе, которой всегда были связаны наши народы. Посол также сообщил, что Императорское и Королевское правительство с тревогой наблюдает за угрозой на нашем западе и что кайзер Карл призывает как можно скорее воссоединить Италию."
austria.101.a:0 "Звучит как прекрасная идея."
austria.101.b:0 "Австрийцы - наши естественные враги."

austria.102.t:0 "Австро-итальянская дружба"
austria.102.d:0 "Сегодня наш посол вернулся из Италии. Он сообщил, что итальянцы согласились на наше предложение о дружбе. Наши страны ждёт великое будущее."
austria.102.a:0 "Хорошо."

austria.103.t:0 "Австро-итальянское соперничество"
austria.103.d:0 "Сегодня наш посол вернулся из Италии. Он сообщил, что итальянцы отклонили наше предложение о дружбе. Это оскорбление всего, за что стоит наша страна. Возможно, нам следует вновь направить против них армии, как мы уже делали во время Вельткрига."
austria.103.a:0 "Мы отомстим."

### Austria Suggests War ###
austria.104.t:0 "Австрия предлагает начать войну"
austria.104.d:0 "Сегодня австрийский посол предложил нам подготовить войска к нападению на социалистов. По его словам, настало время нанести удар и объединить Италию."
austria.104.a:0 "Мы сокрушим их!"
austria.104.b:0 "Мы не можем этого сделать."

austria.105.t:0 "Война в Италии"
austria.105.d:0 "В ответ на наше предложение Италия объявила войну СРИ. Хотя они, несомненно, давно готовились к этому дню, мы могли бы пополнить их запасы вооружения собственной техникой и даже сформировать несколько добровольческих полков из наших италоязычных земель. Следует ли отправить им эту помощь?"
austria.105.a:0 "Отправить помощь."
austria.105.b:0 "Пусть справляются сами."

austria.106.t:0 "Прибыла австрийская помощь"
austria.106.d:0 "Сегодня в нашу страну прибыла помощь из Австрии. Нам направили войска и оружие для борьбы с врагом."
austria.106.a:0 "Слава Богу."

austria.107.t:0 "Неаполь соглашается"
austria.107.d:0 "Королевство Обеих Сицилий, к нашему удивлению, приняло предложение о дружбе, несмотря на то что мы бросили его в 1926 году. Теперь, когда они вновь проявили готовность принять своего законного защитника и союзника, мы уж точно больше никогда их не подведём!"
austria.107.a:0 "Больше мы вас не подведём."

austria.108.t:0 "Бурбоны отказываются"
austria.108.d:0 "Разгневанный нашим прошлым предательством и открыто сомневающийся в пользе дружбы с нами сицилийский посол сообщил правительству, что никакого соглашения между Неаполем и Веной не будет. В поисках итальянского союзника нам придётся полагаться на Милан и Венецию."
austria.108.a:0 "Проклятье."

austria.109.t:0 "Железный фельдмаршал и фрайхерр сдаёт позиции...?"
austria.109.d:0 "Один из самых высокопоставленных военных К.u.К., человек, сыгравший ключевую роль в победе Австрии во Вельткриге, военный, возведённый императором в дворянство, и, пожалуй, величайший из ныне живущих истребителей сербов, Франц Ксавер Йозеф Конрад фон Хётцендорф является одним из самых уважаемых людей Империи. Его блистательная военная карьера длится дольше, чем живут многие его современники, а сам этот 84-летний старый пёс войны пережил разрушительное действие старости и выдержал натиск времени исключительно благодаря любви к Империи и пылающей, вечной и яростной ненависти к сербам. Считая южных славян не более чем оппортунистическими и предательскими паразитами, фон Хётцендорф построил карьеру на том, чтобы раз за разом втаптывать их в землю в каждом новом конфликте. Однако исход Вельткрига и последовавшие события позволили этому неуправляемому рассаднику мерзости и злодейства вновь выскользнуть из наших рук. Хотя это в значительной мере улучшило этническую стабильность всей Империи, оно также вдохнуло новую жизнь в упрямую старую душу фон Хётцендорфа. Несмотря на болезни, ранения и преклонный возраст, он продолжал жить надеждой однажды собственными руками вновь увидеть горящий Сараево.\n\nОднако старому ветерану может уже не представиться возможность насладиться столь прекрасным зрелищем. Недавно его здоровье резко ухудшилось после зарубежной поездки в Константинополь, куда его отправили на очередное неблагодарное поручение - заставить османов выплатить свои долги. Хотя прежде он справлялся и с куда более тяжёлыми испытаниями, преклонный возраст в сочетании с недавним переутомлением может оказаться смертельно опасным. Пока страна молится о выздоровлении национального героя, фон Хётцендорф беспокойно лежит в больничной палате, мечтая как можно скорее вернуться в строй и постепенно набираясь сил. Первоначальный прогноз был мрачным, однако фон Хётцендорф преодолевал и не такие препятствия, и, быть может, прежний пыл и отточенная десятилетиями ненависть вновь выведут его из чащи."
austria.109.a:0 "Старый герой войны наконец испускает дух и удостаивается государственных похорон."
austria.109.b:0 "Хётцендорф скорее будет проклят, чем упокоится на Небесах, пока существует свободная Сербия!"

austria.110.t:0 "Кригсмарине без побережья"
austria.110.d:0 "После потери любого выхода к морю через наши адриатические порты или территории других составных частей Австрийской империи остатки К.u.К. Кригсмарине оказались обречены на медленное угасание. Хотя флот ещё не уничтожен полностью, пополнение и содержание наших многочисленных военных кораблей теперь станет, мягко говоря, крайне затруднительным. Поэтому вопрос о том, как поступить в условиях окончательного превращения страны в государство без выхода к морю, выходит на первый план. Следует ли продать некогда гордый и могучий флот и вложить полученные средства в те земли, которые ещё остаются у прекрасной Австрии, или сохранить корабли в надежде, что однажды некогда великий Кригсмарине вновь бросит якорь у австрийских берегов?"
austria.110.a:0 "Наши прежние друзья в Берлине найдут им достойное применение."
austria.110.b:0 "Султан в Константинополе будет рад такому пополнению."
austria.110.c:0 "С этими кораблями Алжир доставит коммунарам немало боли."
austria.110.e:0 "Нашим болгарским друзьям это понравится."
austria.110.f:0 "Испанцам как раз предстоит восстанавливать свою армаду."
austria.110.g:0 "Король в Киеве будет нам весьма благодарен!"
austria.110.h:0 "Это наш флот. Пусть лучше сгниёт и затонет, чем достанется кому-то ещё."

austria.111.t:0 "Кригсмарине без побережья"
austria.111.d:0 "После потери любого доступа к морю через адриатические порты и территории составных частей Австрийской империи остатки К.u.К. Кригсмарине, казалось, были обречены бесцельно скитаться по морям. Однако Вена решила найти своему флоту иное применение, продав его по явно заниженной цене. Счастливыми новыми владельцами австрийского флота стали мы: за сравнительно ничтожную сумму все уцелевшие австрийские военные корабли были переданы под наше управление, и теперь мы вправе распоряжаться ими по собственному усмотрению."
austria.111.a:0 "За Вену!"

#############################
### THEAUSGLEICH OF 1937 ###
#############################

ausgleich.new.100.t:0 "Подготовка к Аусглейху"
ausgleich.new.100.d:0 "Каждые десять лет начиная с 1867 года австрийская и венгерская делегации собираются, чтобы определить, какой вклад каждая половина Империи должна вносить в содержание общих министерств: иностранных дел, военного и финансового.\n\nОднако из-за утраты хорватских территорий и требований Венгрии о компенсации переговоры 1927 года зашли в тупик, в результате чего на протяжении последнего десятилетия Венгрия вообще ничего не перечисляла в общую казну.\n\nПоложение Венгрии как фактически непокорной Короны под властью кайзера уже давно остаётся занозой для Австрии, и необходимо предпринять хотя бы какие-то усилия, чтобы вернуть её в общее стадо."
ausgleich.new.100.a:0 "Официально пригласить их."

ausgleich.new.101.t:0 "Приглашение на Аусглейх"
ausgleich.new.101.d:0 "Венское правительство пригласило нас на новые переговоры по Аусглейху. Хотя подобные встречи проводятся каждые десять лет с 1867 года, когда Венгрия получила равный с Веной статус, отношения между нами остаются испорченными с предыдущих переговоров 1927 года, когда человек в Вене попытался заставить нас смириться с потерей Хорватии."
ausgleich.new.101.a:0 "Посмотрим, к чему это приведёт."

ausgleich.new.102.t:0 "Венгрия участвует в пересмотре Аусглейха"
ausgleich.new.102.d:0 "Существовали сомнения в том, захочет ли Венгрия урегулировать дипломатические разногласия между двумя половинами Империи, однако она согласилась принять участие в переговорах."
ausgleich.new.102.a:0 "Разумеется."

ausgleich.new.200.t:0 "Пригласить других участников на Аусглейх?"
ausgleich.new.200.d:0 "Аусглейх всегда проводился как встреча австрийской и венгерской элиты. Однако в этом году политики из Богемии, Галиции и Иллирии обратились с просьбой сделать переговоры более открытыми и многонациональными, пригласив делегации от всех составных государств Империи.\n\nКроме того, собрание представителей со всех уголков Австро-Венгрии может помочь смягчить некоторые внутренние противоречия, сохраняющиеся с окончания Вельткрига."
ausgleich.new.200.a:0 "Ни в коем случае. Это дело между нами и мадьярами."
ausgleich.new.200.b:0 "Они правы. Пригласить богемцев, галичан и иллирийцев."
ausgleich.new.200.c:0 "Нужно мыслить масштабнее. Пригласить все народы Двойной монархии."

ausgleich.new.201.t_kingdoms:0 "Другие народы на Аусглейхе"
ausgleich.new.201.d_kingdoms:0 "По сообщениям, Австрия направила приглашения делегациям из других частей Империи для участия в пересмотре Аусглейха 1937 года. Многие видные политики уже выступили против подобного формата, называя его политическим манёвром, призванным обеспечить Австрии преимущество на переговорах."
ausgleich.new.201.t_peoples:0 "Словаки и румыны приглашены на Аусглейх"
ausgleich.new.201.d_peoples:0 "Как будто венскому правительству было мало пригласить за стол переговоров чехов, поляков и все остальные народы австрийской половины Империи, так теперь, по сообщениям, оно сделало то же самое с националистическими группами внутри наших собственных границ!\n\nСловаки и румыны Карпатского бассейна столетиями успешно удерживались под контролем, но поддержка Вены пробудила подпольные националистические движения от долгого сна."
ausgleich.new.201.a:0 "Это возмутительно. Официально заявить протест."
ausgleich.new.201.b:0 "Одного протеста недостаточно. Мы не станем участвовать в таком Аусглейхе."
ausgleich.new.201.c:0 "Нужно идти в ногу со временем."

ausgleich.new.202.t:0 "Приглашение на Аусглейх"
ausgleich.new.202.d:0 "Слухи, уже некоторое время ходившие среди членов нашего местного правительства, оказались правдой. В [Root.Capital.GetName] прибыл курьер с приглашением на переговоры по Аусглейху. Нам предстоит направить на переговоры [AUS_ausgleich_delegation]. Похоже, кайзер воспользовался готовностью Венгрии обсудить разногласия с Цислейтанской империей и решил позволить нам также представить свою позицию за столом переговоров."
ausgleich.new.202.a:0 "Какая честь."
ausgleich.new.202.b:0 "Какая честь. Мы поступим так, как велено."
ausgleich.new.202.c:0 "[AUS_ausgleich_dominated_delegation]"

AUS_ausgleich_delegation_kingdom:0 "[Root.GetAdjective]ая делегация"
AUS_ausgleich_delegation_CZE:0 "делегация богемских немцев и чехов"
AUS_ausgleich_delegation_GAL:0 "делегация поляков и русинов"
AUS_ausgleich_delegation_CRO:0 "делегация всех иллирийских народов"

AUS_ausgleich_dominated_delegation_CZE:0 "Но богемских немцев можно представить немного шире, не так ли?"
AUS_ausgleich_dominated_delegation_GAL:0 "Мы польское государство. Отправим нашу элиту, а не русинских крестьян."
AUS_ausgleich_dominated_delegation_CRO:0 "Иллирийский народ один. Отправить эту группу."

ausgleich.new.203.t_HUN:0 "Венгрия протестует против других делегаций"
ausgleich.new.203.d_HUN:0 "Из Венгрии поступило сообщение с осуждением нашего решения пригласить на переговоры другие делегации помимо венгерской. Подкреплено ли это осуждение чем-либо серьёзным, ещё предстоит выяснить."
ausgleich.new.203.t_other:0 "[From.GetName] соглашается участвовать"
ausgleich.new.203.d_other:0 "Наш курьер вернулся из [From.Capital.GetName] с ответом правительства [From.GetNameDef]. Там очень рады возможности принять участие в переговорах и передают нам наилучшие пожелания."
ausgleich.new.203.a:0 "Таков путь вперёд."
ausgleich.new.203.b:0 "Превосходно."

ausgleich.new.300.t_hungary:0 "Прибытие венгерской делегации"
ausgleich.new.300.d_hungary:0 "Вчера в Вену прибыла венгерская делегация, готовая обсудить будущее Двойной монархии. Торжества продолжались далеко за полночь."
ausgleich.new.300.t_delegations_no_boycott:0 "Прибытие делегаций"
ausgleich.new.300.d_delegations_no_boycott:0 "Несмотря на опасения, что Венгрия крайне отрицательно воспримет приглашение других делегаций на переговоры, вчера венгры всё же прибыли в Вену вместе с представителями Богемии, Галиции и Иллирии.\n\nХотя в пересмотре Аусглейха этого года участвуют политики и мыслители со всей Империи, венгры остаются в центре внимания, поскольку именно их вопрос важнее всего урегулировать. Торжества продолжались далеко за полночь."
ausgleich.new.300.t_delegations_boycott:0 "Делегации прибывают - Венгрии нет"
ausgleich.new.300.d_delegations_boycott:0 "Опасения, что Венгрия крайне отрицательно воспримет приглашение других делегаций на переговоры, оказались небеспочвенными. Критики этого решения с самого начала предупреждали, что венгры могут бойкотировать встречу именно по этой причине.\n\nТем не менее остальные делегации прибыли и готовы обсудить способы решения проблемы непокорной Венгрии. Торжества продолжались далеко за полночь."
ausgleich.new.300.a:0 "Что за ночь."
ausgleich.new.300.b:0 "А что вообще обсуждать без Венгрии?"

ausgleich.new.310.t:0 "Речь венгерского делегата"
ausgleich.new.310.d:0 "В первый день переговоров прозвучало множество речей. Один из венгерских политиков выступил со следующими словами:\n\n«Разве нам не следует гордиться Австро-Венгерской империей? Уже десятилетиями человек в Вене пытается реформировать то, что и без того было совершенным. Я убеждён, что и Австрии, и Венгрии вместе предстоит сыграть свою роль в будущем мира. Вместе мы вновь сделаем Австро-Венгрию великой».\n\nЕго соотечественники были явно обеспокоены намёком на то, что федерализационная политика кайзера Карла являлась ошибкой, однако сам оратор, несмотря на полное отсутствие аплодисментов, выглядел вполне довольным."
ausgleich.new.310.a:0 "Какая наглость."
ausgleich.new.310.b:0 "Удалить его с переговоров."
ausgleich.new.310.c:0 "Но ведь он прав, разве нет?"

ausgleich.new.311.t:0 "Венгрия требует репараций"
ausgleich.new.311.d:0 "Как и ожидалось, венгерская делегация вновь требует компенсации за потерю Хорватии-Славонии, находившейся в вассальной зависимости от Венгерской короны до 1925 года, когда эти земли были захвачены в ходе революции южных славян, завершившейся их передачей в 1926 году новообразованному Королевству Иллирия.\n\nВенгерская делегация по-прежнему считает эти территории своими, однако признаёт, что вернуть их под непосредственный венгерский контроль невозможно. Поэтому, как и в 1927 году, она требует перечислить в венгерскую казну значительную денежную компенсацию."
ausgleich.new.311.a:0 "Предложить выплатить из нашей собственной казны."
ausgleich.new.311.b:0 "Этот долг должны выплатить иллирийцы."
ausgleich.new.311.c:0 "Этот долг должны выплатить иллирийцы. Попробуем договориться."
ausgleich.new.311.e:0 "Именно поэтому теперь вы платите меньше налогов."
ausgleich.new.311.f:0 "Если им так не хватает Хорватии-Славонии, пусть получают её обратно."

ausgleich.new.312.t:0 "Богемия предлагает создать Словацкое государство"
ausgleich.new.312.d:0 "Продолжая вчерашнее обсуждение, богемская делегация поднимает вопрос о словацком народе, живущем под прямой властью Венгерской короны. Не обладая особыми правами или автономией, словаки уже долгое время подвергаются политике мадьяризации.\n\nБогемская делегация предлагает создать для словаков автономное государство, чтобы, по их словам, «освободить братьев от мадьярского ярма»."
ausgleich.new.312.a:0 "Венгрии определённо следует это рассмотреть."
ausgleich.new.312.b:0 "Это следует сделать. Но потребуется дальнейшее планирование."
ausgleich.new.312.c:0 "Это следует сделать, причём государство должно включать все словацкие земли."

ausgleich.new.313.t:0 "Галиция требует Закарпатье"
ausgleich.new.313.d:0 "Присоединяясь к нынешней моде требовать венгерские земли, русинская делегация напоминает нам, что их братья за Карпатами даже не признаются венгерским правительством отдельным народом."
ausgleich.new.313.a:0 "Переговоры по Аусглейху - не место для территориальных требований."
ausgleich.new.313.b:0 "Это следует сделать. Начнём работать в этом направлении."

ausgleich.new.314.t:0 "Иллирия требует Бачку"
ausgleich.new.314.d:0 "Присоединяясь к нынешней моде требовать венгерские земли, Иллирия теперь также требует передачи Бачки. Хотя там проживает немало иллирийцев, претензия на эту полосу земли на самом юге Венгрии является весьма дерзким шагом со стороны иллирийской делегации, особенно учитывая, что Венгрия до сих пор официально не признаёт Южнославянское государство."
ausgleich.new.314.a:0 "Переговоры по Аусглейху - не место для территориальных требований."
ausgleich.new.314.b:0 "Это следует сделать. Начнём работать в этом направлении."
ausgleich.new.314.c:0 "Иллирия должна контролировать весь бассейн."

ausgleich.new.315.t:0 "Поляки предлагают создать польский протекторат"
ausgleich.new.315.d:0 "Несколько видных членов польской делегации выступили за более активную политику в отношениях с Польшей. Хотя после войны Польша осталась в германской сфере влияния, галичане по-прежнему считают её своей родиной, ныне подавленной прусским господством. Они хотят, чтобы мы освободили их соотечественников.\n\nПольша ещё не потеряна."
ausgleich.new.315.a:0 "Мы это рассмотрим."

ausgleich.new.316.t:0 "Румыны: автономная Трансильвания?"
ausgleich.new.316.d:0 "Хотя Венгрия признаёт определённую особость Трансильвании, её положение и близко не соответствует уровню автономии цислейтанских государств. Румынская делегация просит предоставить ей такой же статус, каким обладают земли австрийской половины."
ausgleich.new.316.a:0 "Венгерской делегации следует это рассмотреть."
ausgleich.new.316.b:0 "Да, так и будет..."
ausgleich.new.316.c:0 "...и в неё войдут также Партиум и Банат."

ausgleich.new.317.t:0 "Венгрия покидает Аусглейх"
ausgleich.new.317.d:0 "Венгерская делегация, которой окончательно надоело то, что она называет «издевательством над старыми традициями», покинула переговоры."
ausgleich.new.317.a:0 "Это плохо, правда?"

#WIP
ausgleich.new.318.t:0 "Делегация досрочно возвращается домой"
ausgleich.new.318.d:0 "Недовольные ходом переговоров, наши делегаты досрочно вернулись домой. Пока что никаких компенсаций мы не получим."
ausgleich.new.318.a:0 "Не лучший исход."

ausgleich.new.320.t:0 "Завершение Аусглейха"
ausgleich.new.320.d_hungary_success:0 "Сегодня на рассвете венгерская делегация отправилась обратно в Будапешт, чтобы сообщить правительству о событиях последних дней, о радушном приёме в Вене и об обещанных уступках. Пересмотр Аусглейха 1937 года завершился успехом, и будущее Двойной монархии выглядит значительно светлее."
ausgleich.new.320.d_hungary_failure:0 "Вчера Аусглейх завершился - после того как Венгрия преждевременно покинула переговоры."
ausgleich.new.320.d_other_success:0 "Вчера Аусглейх завершился. Сегодня все делегации отправились домой."
ausgleich.new.320.d_other_failure:0 "Несмотря на более ранний уход Венгрии, вчера Аусглейх завершился, а сегодня остальные делегации разъехались по домам."
ausgleich.new.320.a:0 "Будем надеяться, это сохранит мир внутри Империи."
ausgleich.new.320.b:0 "Могло быть и лучше, но могло быть и хуже."

#WIP
ausgleich.new.321.t:0 "Переговоры по Аусглейху завершены"
ausgleich.new.321.d:0 "Нашей делегации удалось договориться с Веной об урегулировании разногласий."
ausgleich.new.321.a:0 "Хорошо."

#WIP
ausgleich.new.322.t:0 "Австрия соглашается выплатить репарации"
ausgleich.new.322.d:0 "Нам удалось добиться выплаты репараций за потерю Иллирии."
ausgleich.new.322.a:0 "Отправить требование."

#WIP
ausgleich.new.323.t:0 "Венгрия предъявляет свои требования"
ausgleich.new.323.d:0 "Венгрия решила воспользоваться нашим предложением о репарациях."
ausgleich.new.323.a:0 "Если это необходимо."

#WIP
ausgleich.new.324.t:0 "[From.GetName] соглашается заплатить"
ausgleich.new.324.d:0 "[From.GetName] соглашается заплатить."
ausgleich.new.324.a:0 "Хорошо знать."

#WIP
ausgleich.new.325.t:0 "Венгрия требует репараций"
ausgleich.new.325.d:0 "Венгрия требует репараций."
ausgleich.new.325.a:0 "Стоп, что?"
ausgleich.new.325.b:0 "Если так было решено..."

#WIP
ausgleich.new.326.t:0 "Иллирия отказывается платить"
ausgleich.new.326.d:0 "Иллирия отказывается платить."
ausgleich.new.326.a:0 "Что ж, начнём войну на Балканах. Что вообще может пойти не так?"
ausgleich.new.326.b:0 "Тогда мы мало что можем сделать."

#WIP
ausgleich.new.327.t:0 "Венгрия объявляет нам войну"
ausgleich.new.327.d:0 "Венгрия объявляет нам войну."
ausgleich.new.327.a:0 "Это плохо."

ausgleich.new.328.t:0 "Иллирийский кризис"
ausgleich.new.328.d:0 "После того как иллирийское правительство отказалось платить то, что оно назвало «возмутительным требованием репараций за законные иллирийские земли», Венгрия объявила войну Иллирийской короне. Хонведшег уже начал наступление в Славонию, и, похоже, время для сколько-нибудь содержательного вмешательства почти упущено."
ausgleich.new.328.a:0 "Это возмутительно."
ausgleich.new.328.b:0 "Пусть разбираются сами."
ausgleich.new.328.c:0 "Началось."

#WIP
ausgleich.new.329.t:0 "Австрия объявляет войну Иллирии"
ausgleich.new.329.d:0 "Вероломный кайзер решил не уважать права меньшинств."
ausgleich.new.329.a:0 "Как они смеют!"

#WIP
ausgleich.new.330.t:0 "Австро-венгерский раздел бывшей Иллирии"
ausgleich.new.330.d:0 "Мы должны решить, что делать с оккупированными иллирийскими землями."
ausgleich.new.330.a:0 "Восстановить границы 1921 года."
ausgleich.new.330.b:0 "Передать Хорватию-Славонию Венгрии, а на остальных землях восстановить Иллирию."
ausgleich.new.330.c:0 "Пока оккупировать всё."

annexation_CRO_AUS_CONQ:0 "Австро-венгерский раздел бывшей Иллирии"
annexation_CRO_AUS_CONQ_desc:0 "Мы должны решить, что делать с оккупированными иллирийскими землями."

#WIP
ausgleich.new.331.t:0 "Австрия оккупирует всю Иллирию"
ausgleich.new.331.d:0 "Австрия решила не выполнять своё обещание. Как нам следует ответить?"
ausgleich.new.331.a:0 "Они за это заплатят."
ausgleich.new.331.b:0 "Мы ничего не можем сделать."

#WIP
ausgleich.new.332.t:0 "Делегация возвращается с Аусглейха"
ausgleich.new.332.d_no_claims:0 "Сегодня наша делегация с переговоров по пересмотру Аусглейха вернулась домой. Хотя крупных дипломатических прорывов добиться не удалось, по крайней мере мы смогли укрепить связи с Веной."
ausgleich.new.332.d_claims:0 "Сегодня наша делегация с переговоров по пересмотру Аусглейха вернулась домой. Помимо укрепления связей с Веной, нам даже удалось добиться определённого прогресса в вопросе наших территориальных претензий."
ausgleich.new.332.a:0 "Для них это наверняка был ценный урок."
ausgleich.new.332.b:0 "Хорошо."

ausgleich.new.333.t:0 "[FROM.GetNameDefCap] восстаёт!"
ausgleich.new.333.d:0 "Возмущённая нашим предательством более слабых государств Империи, [FROM.GetName] подняла против нас восстание! Однако министр войны К.u.К. заверяет, что объединённые силы Австрии и Венгрии должны без труда одержать победу."
ausgleich.new.333.a:0 "Как они смеют!"

ausgleich.new.340.t:0 "[AUS_ausgleich_demonstrations] национализм"
ausgleich.new.340.d:0 "Несомненно вдохновлённые поддержкой, оказанной им королём и его правительством в Вене во время переговоров по Аусглейху, [AUS_ausgleich_demonstrations] протестующие вышли на улицы с проавстрийскими, но антивенгерскими лозунгами."
ausgleich.new.340.a:0 "Подавить их."

AUS_ausgleich_demonstrations_SVK_ROM:0 "Словацко-румынский"
AUS_ausgleich_demonstrations_SVK:0 "Словацкий"
AUS_ausgleich_demonstrations_ROM:0 "Румынский"

AUS_ausgleich_demonstrations_cities_SVK_ROM:0 "Словакии и Трансильвании"
AUS_ausgleich_demonstrations_cities_SVK:0 "Словакии"
AUS_ausgleich_demonstrations_cities_ROM:0 "Трансильвании"
ausgleich.new.341.t:0 "[AUS_ausgleich_demonstrations] демонстрации подавлены в Венгрии"
ausgleich.new.341.d:0 "В начале недели мирные демонстрации в поддержку Вены в нескольких городах [AUS_ausgleich_demonstrations_cities] завершились тем, что венгерская полиция жестоко разогнала собравшихся. Однако это лишь сыграло на руку пропаганде сопротивления, и теперь [AUS_ausgleich_demonstrations] лидеры просят наше правительство выступить посредником в конфликте."
ausgleich.new.341.a:0 "Согласны. Венгрия должна вывести войска со спорных территорий."
ausgleich.new.341.b:0 "Мы не можем вмешиваться во внутренние дела Венгрии."

#WIP
ausgleich.new.342.t:0 "Австрия требует вывести наши власти из [AUS_ausgleich_demonstrations_cities]"
ausgleich.new.342.d:0 "Австрия потребовала, чтобы наша администрация и вооружённые силы покинули [AUS_ausgleich_demonstrations_cities]."
ausgleich.new.342.a:0 "Придётся подчиниться."
ausgleich.new.342.b:0 "Никогда!"

ausgleich.new.343.t:0 "Венгрия принимает наш ультиматум"
ausgleich.new.343.d:0 "Венгрия покинула спорные территории, и теперь наши войска могут беспрепятственно войти туда и восстановить порядок - разумеется, именно тот порядок, который нужен нам."
ausgleich.new.343.a:0 "Прекрасно."

ausgleich.new.344.t:0 "Венгрия отвергает наш ультиматум"
ausgleich.new.344.d:0 "Венгрия отвергла наш ультиматум и отказывается покидать спорные территории."
ausgleich.new.344.a:0 "Вы ведь понимаете, что это значит?"
ausgleich.new.344.b:0 "Ну и ладно."

ausgleich.new.345.t:0 "Провозглашение Словацкого государства"
ausgleich.new.345.d:0 "Словакия наконец освобождена от венгерской власти, однако ситуация там всё ещё нестабильна. Немедленное создание государства было бы встречено с большим одобрением, но военные советники утверждают, что разумнее немного подождать."
ausgleich.new.345.a:0 "Мы освободители. Словацкое государство будет провозглашено."
ausgleich.new.345.b:0 "Пока территория останется под оккупацией."

annexation_SVK_AUS_CONQ:0 "Провозглашение Словацкого государства"
annexation_SVK_AUS_CONQ_desc:0 "Словакия наконец освобождена от венгерской власти, однако ситуация там всё ещё нестабильна. Немедленное создание государства было бы встречено с большим одобрением, но военные советники утверждают, что разумнее немного подождать."

ausgleich.new.346.t:0 "Провозглашение Трансильванского государства"
ausgleich.new.346.d:0 "Трансильвания наконец освобождена от венгерской власти, однако ситуация там всё ещё нестабильна. Немедленное создание государства было бы встречено с большим одобрением, но военные советники утверждают, что разумнее немного подождать."
ausgleich.new.346.a:0 "Мы освободители. Трансильванское государство будет провозглашено."
ausgleich.new.346.b:0 "Трансильвания останется под оккупацией."

annexation_TRS_AUS_CONQ:0 "Провозглашение Трансильванского государства"
annexation_TRS_AUS_CONQ_desc:0 "Трансильвания наконец освобождена от венгерской власти, однако ситуация там всё ещё нестабильна. Немедленное создание государства было бы встречено с большим одобрением, но военные советники утверждают, что разумнее немного подождать."

ausgleich.new.347.t:0 "Восстановить Венгерское государство?"
ausgleich.new.347.d:0 "Стоит ли нам восстановить Венгрию, но на этот раз предоставить ей равный статус с остальными коронами Империи вместо положения квазинезависимой псевдосоставной части?"
ausgleich.new.347.a:0 "Венгрия будет восстановлена."
ausgleich.new.347.b:0 "Зачем освобождать тех, кто всегда боролся против нас?"

annexation_HUN_AUS_CONQ:0 "Восстановление Венгерского государства"
annexation_HUN_AUS_CONQ_desc:0 "Стоит ли нам восстановить Венгрию, но на этот раз предоставить ей равный статус с остальными коронами Империи вместо положения квазинезависимой псевдосоставной части?"

ausgleich.new.350.t:0 "Австрийская тирания"
ausgleich.new.350.d:0 "Австрия отказалась освободить народы Венгрии, вместо этого сама заняв положение их нового господина."
ausgleich.new.350.a:0 "Мы должны что-то предпринять."
ausgleich.new.350.b:0 "Что мы можем сделать против Вены?"

ausgleich.new.351.t:0 "Австрийская тирания"
ausgleich.new.351.d:0 "Австрия отказалась освободить народы Венгрии, вместо этого сама заняв положение их нового господина. Богемия предложила нам присоединиться к импровизированному союзу, чтобы свергнуть мерзавца в Вене."
ausgleich.new.351.a:0 "Мы должны что-то предпринять."
ausgleich.new.351.b:0 "Что мы можем сделать против Вены?"

ausgleich.new.352.t:0 "Война с Австрией"
ausgleich.new.352.d:0 "Подчинение Австрии несправедливым требованиям Венгрии не оставило нам иного выбора, кроме как объединиться с другими противниками итогов Аусглейха. Теперь, похоже, война с Австрией неизбежна."
ausgleich.new.352.a:0 "Все народы Империи будут свободны."

ausgleich.new.353.t:0 "Война с Богемией"
ausgleich.new.353.d:0 "Недовольная итогами Аусглейха коалиция сепаратистов во главе с Богемией ведёт себя всё более вызывающе. Теперь, похоже, противоречия, десятилетиями терзавшие нашу Империю, будут разрешены кровью."
ausgleich.new.353.a:0 "Мы сокрушим этих предателей!"

ausgleich.new.666.t:0 "Возвращение в Империю"
ausgleich.new.666.d:0 "Долгий период словенской автономии достаточно успокоил народ, и теперь пора задуматься о будущем. Чьи интересы нам ближе - Австрии или Иллирии?"
ausgleich.new.666.a:0 "Вернуться к Вене!"
ausgleich.new.666.b:0 "Воссоединиться с нашими южнославянскими братьями!"
ausgleich.new.666.c:0 "Оставим всё как есть."

ausgleich.new.700.t:0 "Австрия требует реинтеграции"
ausgleich.new.700.d:0 "Они заявляют, что нами снова должны управлять непосредственно из Вены."
ausgleich.new.700.a:0 "Что мы можем сделать против Вены?"
ausgleich.new.700.b:0 "А если мы скажем нет?"
ausgleich.new.700.c:0 "Разве не в таких случаях восстают?"

ausgleich.new.701.t:0 "[From.GetNameDefCap] принимает реинтеграцию"
ausgleich.new.701.d:0 "Правительство [From.GetNameDef] согласилось с нашим предложением о создании более централизованного государства."
ausgleich.new.701.a:0 "Превосходно."

ausgleich.new.702.t:0 "[From.GetNameDefCap] вторгается в Венгрию!"
ausgleich.new.702.d:0 "Стервятники из [FROM.GetNameDef] решили воспользоваться нашими внутренними трудностями и вторглись в Королевство Венгрия. Несмотря на мятежное состояние, вся Венгрия является одной из исконных земель Габсбургов и должна быть защищена от кровожадных соседей. Хотя мы уже заняты подавлением мадьярского восстания, это вторжение в любом случае следует считать нападением на Монархию в целом."
ausgleich.new.702.a:0 "Мы должны защитить нашу территориальную целостность!"
ausgleich.new.702.b:0 "Мы ничего не можем сделать..."

ausgleich.new.800.t:0 "Падение Австрии"
ausgleich.new.800.d:0 "И Армейское верховное командование, Armee-Oberkommando, и Министерство иностранных дел охвачены паникой: становится всё очевиднее, что война с нашими дерзкими соседями принимает катастрофический оборот. Сердце Монархии оказалось под угрозой, и даже прежде уверенное в себе AOK теперь опасается худшего: территориальную целостность Империи уже, возможно, невозможно сохранить, а полный крах может стоять прямо у нашего порога. Чтобы сохранить хотя бы лицо и предотвратить возможное уничтожение государства, императору-королю предложено запросить мира, иначе Габсбургская монархия может быть окончательно расчленена."
ausgleich.new.800.d.germany:0 "И Армейское верховное командование, Armee-Oberkommando, и Министерство иностранных дел охвачены паникой: становится всё очевиднее, что война с нашими дерзкими соседями принимает катастрофический оборот. Сердце Монархии оказалось под угрозой, и даже прежде уверенное в себе AOK теперь опасается, что полный крах уже стоит у нашего порога. Императору-королю предложено запросить мира... хотя мы ещё можем обратиться к Германии с просьбой вмешаться и обеспечить сохранность основных австрийских земель. Если мы это сделаем, немцы наверняка потребуют принять их постоянный союз и покровительство. Единственная альтернатива - отдать себя на милость [AUS_belgrade_pact_leader.GetNameDef]."
ausgleich.new.800.a:0 "Мы побеждены. Просить мира."
ausgleich.new.800.b:0 "Мы не сдадимся!"
ausgleich.new.800.c:0 "Нам придётся обратиться за помощью к [GER.GetNameDef]."
ausgleich.new.800.e:0 "Никаких немцев - просто отдадим врагам всё, чего они хотят."
ausgleich.new.800.f:0 "Германия нам не нужна - будем сражаться дальше!"

ausgleich.new.801.t:0 "Австрия просит мира"
ausgleich.new.801.t.germany:0 "Австрия и Германия просят мира"
ausgleich.new.801.d.main:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами. Даже дряхлая голова прогнившей Империи видит неизбежность своего конца и запросила мира. Австрийцы готовы удовлетворить все наши территориальные требования, лишь бы сохранить то немногое, что у них осталось. Поскольку наши цели достигнуты, причин отвергать столь щедрое предложение почти нет, хотя перспектива пройти маршем по венской Хельденплац и добить умирающий труп Империи, безусловно, весьма соблазнительна."
augleich.new.801.d.main.faction1:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами. Даже дряхлая голова прогнившей Империи видит неизбежность своего конца и запросила мира. Австрийцы готовы удовлетворить все наши территориальные требования, лишь бы сохранить то немногое, что у них осталось. Поскольку наши цели достигнуты, а [From.GetNameDef] уже согласилась на предложение, причин отказываться почти нет, хотя перспектива пройти маршем по венской Хельденплац и добить умирающий труп Империи, безусловно, весьма соблазнительна."
augleich.new.801.d.main.faction2:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами. Даже дряхлая голова прогнившей Империи видит неизбежность своего конца и запросила мира. Австрийцы готовы удовлетворить все наши территориальные требования, лишь бы сохранить то немногое, что у них осталось. Поскольку наши цели достигнуты, причин отвергать предложение почти нет, однако [From.GetNameDef] сообщила, что продолжит войну. Очевидно, перспектива пройти маршем по венской Хельденплац и добить умирающий труп Империи оказалась слишком соблазнительной."
ausgleich.new.801.d.germany.main1:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами настолько сокрушительно, что австрийцы не только запросили мира, но и побежали к немцам за защитой. [GER.GetNameDefCap] согласилась признать все наши требования, не затрагивающие территории, которые Германия считает исконно австрийскими, при условии заключения мира. Отказ будет означать войну со всем Рейхспактом."
ausgleich.new.801.d.germany.main2:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами настолько сокрушительно, что австрийцы не только запросили мира, но и побежали к немцам за защитой. [GER.GetNameDefCap] потребовала, чтобы ни одна исконная австрийская территория не была аннексирована... а значит, по договору мы не получим *ничего*. Уже одно это возмутительно, однако отказ будет означать войну со всем Рейхспактом."
ausgleich.new.801.d.germany.main.faction1:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами настолько сокрушительно, что австрийцы не только запросили мира, но и побежали к немцам за защитой. [GER.GetNameDefCap] согласилась признать все наши требования, не затрагивающие территории, которые Германия считает исконно австрийскими, при условии, что мы присоединимся к [From.GetNameDef], уже принявшей это соглашение. Отказ будет означать войну со всем Рейхспактом."
ausgleich.new.801.d.germany.main.faction2:0 "Войска тиранической Габсбургской монархии были разбиты на поле боя нашими славными армиями-освободительницами настолько сокрушительно, что австрийцы не только запросили мира, но и побежали к немцам за защитой. [GER.GetNameDefCap] согласилась признать все наши требования, не затрагивающие территории, которые Германия считает исконно австрийскими, однако [From.GetNameDef] уже яростно отвергла это предложение. Присоединимся ли мы к [From.GetNameDef] и вступим в войну с самим Рейхспактом или порвём с союзниками и примем продиктованный Германией мир?"
ausgleich.new.801.a:0 "Мы согласны на их условия."
ausgleich.new.801.b:0 "Нет, мы покончим с Габсбургами раз и навсегда!"

ausgleich.new.802.t:0 "Будапештский договор"
ausgleich.new.802.d.germany:0 "Делегации Габсбургской монархии и [GER.GetNameDef] встретились в Будапеште с представителями вражеских государств, чтобы выработать условия мира. Австрия согласилась уступить все земли Императорской и Королевской монархии, на которые претендуют её противники, в обмен на прекращение войны. Это унизительное поражение открывает новую главу в истории Габсбургов: Австрия больше не может считать себя великой державой. Однако под германской защитой она, возможно, сумеет сохранить то немногое, что осталось, и избежать окончательного уничтожения Монархии."
ausgleich.new.802.d:0 "Делегации Габсбургской монархии встретились в Будапеште с представителями вражеских государств, чтобы выработать условия мира. Мы согласились уступить все земли Императорской и Королевской монархии, на которые претендуют наши противники, в обмен на прекращение войны. Это унизительное поражение открывает новую главу в истории Габсбургов: мы больше не можем считать себя великой державой. Однако, возможно, нам удастся сохранить то немногое, что осталось, и избежать окончательного уничтожения Монархии."
ausgleich.new.802.a:0 "Наконец-то мир."
ausgleich.new.802.b:0 "Хорошо, значит, всё закончено."

ausgleich.new.803.t:0 "Будапештский договор"
ausgleich.new.803.d.balkan:0 "Делегация [Root.GetNameDef] встретилась в Будапеште с представителями Габсбургов, чтобы выработать условия мира. По итогам заключённого договора австрийцы уступили все территории, на которые мы предъявляли права, в обмен на мир. Это поистине славный день: Балканы наконец освобождены от иностранного вмешательства, а наши этнические братья воссоединились с родиной."
ausgleich.new.803.d.germany.balkan:0 "Делегация [Root.GetNameDef] встретилась в Будапеште с германскими и габсбургскими представителями, чтобы выработать условия мира. По итогам заключённого договора австрийцы уступили все территории, на которые мы предъявляли права, за исключением земель, считающихся исконно австрийскими. Это поистине славный день: Балканы наконец освобождены от иностранного вмешательства, а наши этнические братья воссоединились с родиной."
ausgleich.new.803.d.italy:0 "Делегация [Root.GetNameDef] встретилась в Будапеште с представителями Габсбургов, чтобы выработать условия мира. По итогам заключённого договора австрийцы уступили все территории, на которые мы предъявляли права, в обмен на мир. Это поистине славный день: Италия наконец избавилась от позора поражения во Вельткриге, а наши итальянские братья воссоединились с родиной."
ausgleich.new.803.d.germany.italy:0 "Делегация [Root.GetNameDef] встретилась в Будапеште с германскими и габсбургскими представителями, чтобы выработать условия мира. Наши приобретения по итогам договора будут ограничены, поскольку Германия намерена защищать «исконные» австрийские земли в Приморье и Альто-Адидже, которые при этом преимущественно населены итальянцами. И всё же пока это означает мир и отсутствие войны с Рейхспактом."
ausgleich.new.803.d.poland:0 "Делегация [Root.GetNameDef] встретилась в Будапеште с представителями Габсбургов, чтобы выработать условия мира. По итогам заключённого договора австрийцы уступили все территории, на которые мы предъявляли права, в обмен на мир. Это поистине славный день: наши польские братья наконец воссоединились со своей могучей родиной!"
ausgleich.new.803.d.germany.poland:0 "Делегация [Root.GetNameDef] встретилась в Будапеште с германскими и габсбургскими представителями, чтобы выработать условия мира. По итогам заключённого договора австрийцы уступили все территории, на которые мы предъявляли права, за исключением тех, которые считаются исконно австрийскими. Это поистине славный день: наши польские братья наконец воссоединились со своей могучей родиной!"
ausgleich.new.803.a:0 "Великолепная победа!"
ausgleich.new.803.b:0 "Ещё один шаг к окончательной победе."

ausgleich.new.804.t:0 "[FROM.GetNameDefCap] отвергает мир"
ausgleich.new.804.d:0 "Наше мирное предложение [FROM.GetNameDef] было бесцеремонно отвергнуто. Война продолжится до тех пор, пока одна из сторон не согласится на безоговорочную капитуляцию. Чтобы завершить эту беспощадную бойню, придётся пролить ещё больше крови."
ausgleich.new.804.a:0 "Значит, будем сражаться до самого конца."

ausgleich.new.805.t:0 "[FROM.GetNameDefCap] отвергает мир"
ausgleich.new.805.d:0 "Наше решение принять австрийское мирное предложение, похоже, сильно разгневало наших прежних союзников из [FROM.GetNameDef]. Их посол назвал наше согласие «предательством» самого raison d'être Пакта и заявил, что они продолжат войну до самого конца. Похоже, наш союз с [FROM.GetNameDef] подошёл к концу."
ausgleich.new.805.a:0 "Они пожалеют об этом, когда австрийцы повернут против них."

ausgleich.new.806.t:0 "Будапештский договор"
ausgleich.new.806.d:0 "Для Габсбургской монархии начинается новая глава: её войска потерпели поражение от [AUS_belgrade_pact_leader.GetNameDef] и её союзников. Некогда одна из доминирующих сил на Балканах, Австрия на протяжении десятилетий неуклонно слабела, и хотя пустая победа во Вельткриге дала ей краткую передышку, нынешняя война, возможно, окончательно сокрушила некогда гордую Империю. Карта Балкан и Центральной Европы вновь была перекроена. Австрия больше не может считать себя великой державой, тогда как её соседи воссоединились со своими национальными братьями, прежде прочно находившимися под властью Габсбургов."
ausgleich.new.806.d.germany:0 "Для Габсбургской монархии начинается новая глава: её войска потерпели поражение от [AUS_belgrade_pact_leader.GetNameDef] и её союзников. Некогда одна из доминирующих сил на Балканах, Австрия на протяжении десятилетий неуклонно слабела, и хотя пустая победа во Вельткриге дала ей краткую передышку, нынешняя война, возможно, окончательно сокрушила некогда гордую Империю. Карты Балкан и Центральной Европы вновь были перекроены, а Австрия обратилась за защитой к [GER.GetNameDef]. Она больше не может считаться великой державой и может считать себя счастливой, если после этого унижения её монархия вообще сохранится."
ausgleich.new.806.a:0 "Как же низко пала Австрия..."

ausgleich.new.807.t:0 "Условия Будапештского договора"
ausgleich.new.807.d:0 "Согласно условиям Будапештского договора, одной из сторон которого были и мы, теперь необходимо вернуть контроль над всеми австрийскими землями, не переданными по условиям соглашения."
ausgleich.new.807.a:0 "Хорошо."

ausgleich.new.808.t:0 "Условия Будапештского договора"
ausgleich.new.808.d:0 "Согласно условиям Будапештского договора, одной из сторон которого были и мы, теперь необходимо вывести войска со всех земель, переданных нашим противникам из Белградского пакта."
ausgleich.new.808.a:0 "Хорошо."

ausgleich.new.820.t:0 "Австрийцы близки к краху"
ausgleich.new.820.d:0 "Война Австрии против [AUS_belgrade_pact_leader.GetNameDef] развивается для неё всё хуже, и теперь страна находится на грани краха. Проглотив гордость, австрийцы обратились к [Root.GetNameDef] с просьбой о вмешательстве и защите. Наше участие в мирных переговорах позволит не допустить полного расчленения Австрии, а взамен она и оставшиеся у неё подданные присоединятся к Рейхспакту. Это может втянуть нас в балканскую войну, однако если мы проигнорируем ситуацию, балканские государства могут продолжить агрессивную экспансию... и кто знает, чью сторону они выберут в будущем?"
ausgleich.new.820.a:0 "Мы вмешаемся."
ausgleich.new.820.b:0 "Пусть австрийцы разбираются сами."

ausgleich.new.821.t:0 "Германия вмешается"
ausgleich.new.821.d:0 "Правительство [From.GetNameDef] согласилось вмешаться в наши мирные переговоры. Если [AUS_belgrade_pact_leader.GetNameDef] откажется заключить мир, Германия вступит в войну, а в противном случае её присутствие должно гарантировать, что у нас не отнимут исконные территории. В обмен после завершения переговоров мы распустим [Root.GetFactionName] и вступим в [GER.GetFactionName]."
ausgleich.new.821.a:0 "Какое облегчение! Начать мирные переговоры!"

ausgleich.new.822.t:0 "Германия не станет вмешиваться"
ausgleich.new.822.d:0 "Не желая втягиваться в возможный балканский конфликт, правительство [From.GetNameDef] отказалось участвовать в наших мирных переговорах с [AUS_belgrade_pact_leader.GetNameDef]. Мы остались одни."
ausgleich.new.822.a:0 "Тогда выбора нет - отдадим им всё, чего они хотят."
ausgleich.new.822.b:0 "Тогда будем сражаться до самого конца!"

ausgleich.new.823.t:0 "[FROM.GetNameDefCap] соглашается на мир"
ausgleich.new.823.d:0 "Наш отказ от австрийского мирного предложения, похоже, сильно разгневал наших прежних союзников из [FROM.GetNameDef]. Их посол назвал наш отказ «предательством» самого raison d'être Пакта, заявив, что продолжать войну после достижения поставленных целей бессмысленно. Похоже, наш союз с [FROM.GetNameDef] подошёл к концу."
ausgleich.new.823.a:0 "Они ещё пожалеют."

ausgleich.new.824.t:0 "Австрия вступает в Рейхспакт"
ausgleich.new.824.d:0 "Из-за неудачного хода войны австрийцы обратились к [GER.GetNameDef] за защитой. Они полностью вступят в Рейхспакт и предложили нам последовать за ними. Если мы откажемся, то останемся одни."
ausgleich.new.824.a:0 "Разумеется, мы присоединимся!"
ausgleich.new.824.b:0 "Лучше останемся сами по себе."

ausgleich.new.825.t:0 "Вступление в Рейхспакт"
ausgleich.new.825.d:0 "Теперь, когда наша Империя в значительной степени расчленена, мы должны обратиться к немцам за обещанным союзом и защитой."
ausgleich.new.825.a:0 "Пусть будет так!"

ausgleich.new.751.t:0 "Кризис в Словении!"
ausgleich.new.751.d:0 "Хотя Австро-Венгерская империя уже десятилетиями балансирует на острие ножа, теперь её положение всё ближе к окончательному краху. Словения, долгое время являвшаяся неотъемлемой частью собственно Австрии, с момента создания Иллирии в ходе Аусглейха 1927 года постоянно добивается присоединения к ней. Отношения между австрийцами и словенцами наконец достигли критической точки: словенцы угрожают отделением и восстанием, если Австрия не прислушается к их требованиям. Отношения между Территорией особого статуса Иллирия и Австрией также обострились, поскольку иллирийское правительство поддерживает словенцев. В Загребе всё чаще говорят о возможном восстании. Тем временем три остальные короны Империи наблюдают со стороны, размышляя, стоит ли им также отделиться или остаться с Монархией до самого конца."
ausgleich.new.751.a:0 "Передать её Иллирии."
ausgleich.new.751.b:0 "Предоставить ей статус цислейтанского герцогства."
ausgleich.new.751.c:0 "Она наша!"

ausgleich.new.752.t:0 "Венеция требует самоуправления"
ausgleich.new.752.d:0 "Область Венеции остаётся оккупированной нашими войсками с момента вмешательства в Италию в прошлом десятилетии. Однако теперь, когда положение Империи балансирует на острие ножа, статус Венеции вновь оказался неопределённым. На фоне приближающегося Аусглейха и стремительно растущих требований самоуправления следует ли предоставить народу Венеции особый независимый статус?"
ausgleich.new.752.a:0 "Разрешить."
ausgleich.new.752.b:0 "Ещё не время."

ausgleich.new.753.t:0 "Италия входит в Венецию"
ausgleich.new.753.d:0 "После наших недавних унизительных поражений итальянское правительство решило самостоятельно «освободить» своих братьев в Венеции. Итальянские войска вошли в регион, а наши части почти ничего не смогли им противопоставить. Венское правительство, обессиленное войной, не способно остановить их, и возможностей предпринять хоть что-нибудь практически нет. Венеция вновь оказалась в итальянских руках."
ausgleich.new.753.a:0 "Мы мало что можем сделать."

