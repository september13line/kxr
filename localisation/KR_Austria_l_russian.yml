AUS_kaiser_faith_desc: "Народ стал доверять курсу. Gott erhalte unseren Kaiser!"

AUS_k_u_k_armee_bonus: "Императорская и Королевская(K.u.K.) воинская повинность"
AUS_k_u_k_armee_bonus_desc: "Основанная 15 марта 1867 года, единая армия Австрии и Венгрии представляет собой основу вооружённых сил дуалистичной монархии."
AUS_k_u_k_armee_bonus_2: "Императорская и Королевская(K.u.K.) воинская повинность"
AUS_k_u_k_armee_bonus_2_desc: "Основанная 15 марта 1867 года, единая армия Австрии и Венгрии представляет собой основу вооружённых сил дуалистичной монархии."

AUS_DNF_political_instability: "Политическая нестабильность"
AUS_DNF_political_instability_desc: "На местах действует принцип личной национальной автономии. Многие этнические группы Австрии в настоящее время реорганизуются в национальные партии, оставляя за собой хаос на политическом ландшафте. Такой радикальный сдвиг безусловно пришёл с большой нестабильностью, но даже скептики не ожидали, что всё так плохо."
AUS_DNF_political_instability-1: "Политическая нестабильность"
AUS_DNF_political_instability-1_desc: "На местах действует принцип личной национальной автономии. Многие этнические группы Австрии в настоящее время реорганизуются в национальные партии, оставляя за собой хаос на политическом ландшафте. Такой радикальный сдвиг безусловно пришёл с большой нестабильностью, но даже скептики не ожидали, что всё так плохо."
AUS_DNF_political_instability-2: "Политическая нестабильность"
AUS_DNF_political_instability-2_desc: "На местах действует принцип личной национальной автономии. Многие этнические группы Австрии в настоящее время реорганизуются в национальные партии, оставляя за собой хаос на политическом ландшафте. Такой радикальный сдвиг безусловно пришёл с большой нестабильностью, но даже скептики не ожидали, что всё так плохо."

AUS_modern_army: "Современная армия."

AUS_SLOintegration: "Реинтеграция Словении"
AUS_SLOintegration_desc: "Хотя значительное меньшинство Словении составляют этнические немцы, а долгое наследие правления Габсбургов позволило быстро восстановить австрийскую администрацию над словенскими землями, словенский народ воспринял это нелегко, поскольку многие из них считают это не чем иным, как возобновлённым порабощением."

### Decisions ###
AUS_syndie_threat: "Синдикалистская угроза"
AUS_syndie_threat_desc: "Наши соседи и старые союзники воюют с Францией, и этот факт трудно не заметить. То, что ожидали немецкие военные умы предвосхищали закончить за несколько недель, превратилось в повторение Вельткрига. Если победителями в этой войне станут коммунары, то под угрозой окажутся не только наши интересы в Италии, но и целостность Империи. Возможно, лучше отложить в сторону наши разногласия и новь сражаться бок о бок с немцами."
AUS_russian_threat: "Русская угроза"
AUS_russian_threat_desc: "Великий Русский Медведь снова поднял голову на востоке и угрожает не только вернуть себе все земли, потерянные во время Вельткрига, но и вторгнуться в саму Германию. Нет сомнений в том, что если Россия преуспеет в достижении своих целей, то в конце концов она обратит своё внимание и на нас. Похоже, что мы вновь должны образовать Восточный фронт, нравится нам это или нет."
AUS_reform_faction: "Реформировать Дунай-Адриатический Союз"
AUS_reform_faction_desc: "Теперь, когда война закончилась, пришло время возобновить руководство на наших собственных условиях: в качестве главы Дунай-Адриатического альянса."
AUS_germany_on_the_ropes: "[FRA.GetNameDef] проникла слишком далеко в южную Германию"
AUS_syndicalism_winning_Italy: "Союзники Франции получили контроль над большей частью Италии"
AUS_russia_penetrated_germany: "[RUS.GetNameDef] или его союзники взяли под контроль [5.GetName]"
