### TREE EVENTS
#########################################################################################################################

aus.tree.4011.t:0 "Австрия желает вступить в войну"
aus.tree.4011.d:0 "Сегодня из Вены пришла факсимильная телеграмма, в которой наши соседи выражают желание «помочь» нам в продолжающейся войне против врагов. Австрийская армия больше не является тем крушением на рельсах, каким была во время Вельткрига, и её помощь действительно могла бы оказаться полезной, однако это также откроет второй фронт против Италии, а Габсбурги, безусловно, имеют собственные интересы на Апеннинском полуострове."
aus.tree.4011.a:0 "Снова братья по оружию!"
aus.tree.4011.b:0 "Мы и сами неплохо справляемся!"

aus.tree.4012.t:0 "Германия отклоняет наше предложение"
aus.tree.4012.d:0 "Берлин ответил на нашу факсимильную телеграмму, заявив, что наша помощь им не нужна и нежелательна, а потому нам следует держаться подальше от продолжающегося конфликта."
aus.tree.4012.a:0 "Какая грубость!"
aus.tree.4012.b:0 "[From.GetLeader] думает, что может решать это в одиночку?"

aus.tree.4013.t:0 "Германия принимает нашу поддержку"
aus.tree.4013.d:0 "Берлин приветствует предложенную нами помощь в борьбе с синдикалистской угрозой. С сегодняшнего дня мы находимся в состоянии войны с Интернационалом."
aus.tree.4013.a:0 "Снова братья по оружию!"

aus.tree.4020.t:0 "Приглашение от [From.GetNameDef]"
aus.tree.4020.d:0 "[From.GetNameDefCap] возродила свою политику «Защитника Балкан» и в рамках этого курса официально пригласила нас присоединиться к её союзу. Это обяжет наши войска участвовать в любых войнах [From.GetNameDef], однако взамен мы также получим её защиту."
aus.tree.4020.a:0 "Мы согласны принять их защиту."
aus.tree.4020.b:0 "Сначала верните земли, на которые мы претендуем!"
aus.tree.4020.c:0 "Нет, мы прекрасно справляемся сами."

aus.tree.4021.t:0 "[From.GetNameDefCap] соглашается"
aus.tree.4021.d:0 "Правительство [From.GetNameDef] сообщило, что с нетерпением ожидает более тесного сотрудничества с [Root.GetNameDef]. Отношения между нашими странами начинаются весьма удачно."
aus.tree.4021.a:0 "Великолепно."

aus.tree.4022.t:0 "Условие [From.GetNameDef]"
aus.tree.4022.d.onlysubjects:0 "После переговоров между нашими правительствами выяснилось, что главным препятствием для вступления [From.GetNameDef] в наш союз является тот факт, что некоторые земли, например [state_example.GetName], на которые они претендуют, сейчас находятся во владении наших подданных. Поскольку подданные едва ли смогут отказаться выполнить наш приказ о передаче территории, стоит ли заплатить эту цену ради присоединения [From.GetNameDef] к союзу?"
aus.tree.4022.d.onlycoresubjects:0 "После переговоров между нашими правительствами выяснилось, что главным препятствием для вступления [From.GetNameDef] в наш союз является тот факт, что некоторые земли, например [state_example.GetName], на которые они претендуют, сейчас находятся во владении наших подданных. Однако эти территории считаются неотъемлемой частью Империи. Передача их независимому от нас государству даже ради союза вызовет большое недовольство в [Root.GetNameDef]. Действительно ли их присоединение стоит таких проблем?"
aus.tree.4022.d.onlyAUSnotcore:0 "После переговоров между нашими правительствами выяснилось, что главным препятствием для вступления [From.GetNameDef] в наш союз является тот факт, что некоторые земли, например [state_example.GetName], на которые они претендуют, сейчас находятся непосредственно под нашим контролем. Однако эти территории не считаются неотъемлемой частью Империи. Стоит ли отказаться от них, чтобы убедить правительство [From.GetNameDef] вступить в наш союз?"
aus.tree.4022.d.onlyAUScore:0 "После переговоров между нашими правительствами выяснилось, что главным препятствием для вступления [From.GetNameDef] в наш союз является тот факт, что некоторые земли, например [state_example.GetName], на которые они претендуют, сейчас находятся непосредственно под нашим контролем. Однако эти территории являются неотъемлемой частью нашей Империи, и передавать их государству, которое мы не контролируем, даже ради союза кажется немыслимым. Неужели мы действительно готовы пойти на такое?"
aus.tree.4022.d.onlyallies:0 "После переговоров между нашими правительствами выяснилось, что главным препятствием для вступления [From.GetNameDef] в наш союз является тот факт, что некоторые земли, например [state_example.GetName], на которые они претендуют, сейчас принадлежат нашим союзникам. Мы едва ли можем приказать союзникам отказаться от своих земель ради них, поэтому, похоже, нам придётся отклонить это требование."
aus.tree.4022.a:0 "Нам нужен этот союз любой ценой."
aus.tree.4022.b:0 "Нет, они требуют слишком многого."
aus.tree.4022.c:0 "По крайней мере стоило спросить."

aus.tree.4023.t:0 "Приказ [From.GetNameDef]"
aus.tree.4023.d:0 "Чтобы добиться вступления [receiver.GetNameDef] в их союз, правительство [From.GetNameDef] согласилось передать им наши земли, даже не спросив нашего мнения. К сожалению, учитывая наше подчинённое положение, мы можем лишь решительно возражать, но это ничего не изменит - дело уже сделано."
aus.tree.4023.a:0 "Возмутительно!"

aus.tree.4024.t:0 "[From.GetNameDefCap] соглашается с нашим требованием"
aus.tree.4024.d:0 "Многие были потрясены, когда посланник [From.GetNameDef] вернулся с известием, что нам действительно немедленно возвратят территории, на которые мы предъявляем права. Похоже, наши новые отношения с [From.GetNameDef] начинаются весьма удачно."
aus.tree.4024.a:0 "Великолепно."

aus.tree.4025.t:0 "[From.GetNameDefCap] отвергает наше требование"
aus.tree.4025.d:0 "В правительстве [Root.GetNameDef] мало кто удивился, когда посланник [From.GetNameDef] вернулся и сообщил, что [From.GetNameDef] не собирается возвращать нам какие-либо территории в обмен на союз, независимо от обоснованности наших претензий."
aus.tree.4025.a:0 "Вот и всё их предложение."

aus.tree.4026.t:0 "[From.GetNameDefCap] отказывается"
aus.tree.4026.d:0 "Даже не удосужившись сделать встречное предложение, правительство [From.GetNameDef] отвергло наше приглашение... более того, оно высмеяло наши претензии на титул «Защитника Балкан». Похоже, нашему союзу придётся обойтись без них."
aus.tree.4026.a:0 "Что ж."

