 POLITICS_XIE_XUEHONG_DESC: "§YРодилась:§! 17 октября 1901 года, уезд Чжанхуа, Японский Тайвань, Японская империя\n§YПолитическая карьера:§! Наконец Тайвань обрёл свободу, и произошло это не только благодаря иностранной помощи, но и благодаря неустанной революционной борьбе Тайваньской синдикалистской партии. Се Сюэхун, Цзянь Цзи и многие другие присоединились к Тайваньской культурной ассоциации, выступавшей за независимость или автономию Тайваня и демократию. Однако вскоре Ассоциация погрязла во внутренних распрях, усугублённых японскими репрессиями, и распалась на несколько отдельных движений.\n\nСе состояла в Китайской синдикалистской партии, училась за границей в Университете Сунь Ятсена во Франции, а в 1928 году при негласной поддержке японских и китайских социалистов основала Тайваньскую синдикалистскую партию. Хотя она допускает участие буржуазии в движении за независимость, сама Се остаётся убеждённой социалисткой и с тех пор окончательно разошлась с Тайваньской народной партией Цзян Вэйшуя. TSP утверждает, что именно она предлагает наиболее верное толкование Трёх народных принципов, осуждает «ложь» TPP и регулярно, хотя зачастую безуспешно, соперничает с ней за поддержку крестьян и рабочих.\n\nВ отличие от многих других китайских синдикалистов, Се настаивает, что Тайвань обладает собственной самобытностью и должен управляться тайваньцами, по крайней мере на местном уровне. Это стоило ей части личной поддержки, однако в конечном счёте её позиция восторжествовала с созданием квазинезависимого правительства. Её партия по-прежнему разделена на радикальное и умеренное крылья, а несмотря на пышную освободительную риторику, её реальное влияние в основном ограничивается крупнейшими городами. Сохранится ли этот режим после вывода иностранных войск или же в конечном счёте вновь объединится с дружественным Китаем или Японией, ещё предстоит увидеть."

 POLITICS_JIANG_WEISHUI_DESC: "§YРодился:§! 6 августа 1890 года, Илань, провинция Фуцзянь-Тайвань, Империя Цин\n§YПолитическая карьера:§! Учёный, врач и антияпонский активист Цзян Вэйшуй был одним из основателей Тайваньской культурной ассоциации. В своём знаменитом эссе «Свидетельство клинического диагноза» он описал пациента, страдающего тяжёлым культурным истощением, - Тайвань. Будучи выдающимся оратором, Цзян неоднократно попадал в тюрьму и лишь чудом пережил брюшной тиф в 1931 году.\n\nЕго постепенный дрейф влево вызвал немало недоумения внутри Ассоциации, а вскоре после провала Гоминьдана в Северном походе Цзян создал Тайваньскую народную партию как отколовшуюся от него организацию. Сохранив приверженность Трём народным принципам, партия переняла схожую символику, но по другим вопросам старалась дистанцироваться от Гоминьдана, что, впрочем, почти не спасло её от японских репрессий.\n\nРазочаровавшись в безрезультатности мирного протеста, Цзян сосредоточил власть в собственных руках. Он часто конфликтует со своим бывшим подчинённым Цай Пэйхо, стремящимся удержать TPP вдали от классовой борьбы и социализма. Однако с созданием новой Республики их разногласия, по крайней мере временно, отошли на второй план, а сам Цзян был возведён в ранг национального героя.\n\nНекоторые называют его тайваньским Сунь Ятсеном, однако если это действительно так, впереди у него ещё огромная работа. Тайваньская идентичность остаётся раздробленной, а сторонники объединения существуют как с Японией, так и с Китаем. Партийное государство Цзяна вряд ли сможет долго существовать в нынешнем виде и, скорее всего, со временем будет вынуждено искать автономию в составе одной из этих держав. Но до тех пор его сторонники намерены коренным образом преобразовать тайваньское общество."

 POLITICS_LIAO_WENKUI_DESC: "§YРодился:§! 14 ноября 1905 года, уезд Юньлинь, Японский Тайвань, Японская империя\n§YПолитическая карьера:§! Едва ли кто-либо мог ожидать, что новое тайваньское государство примет форму республики под руководством молодых либералов из Товарищества за восстановление Тайваня. Однако труды Ляо Вэнькуя и многих других молодых технократов, получивших образование за рубежом, убедили оккупационные власти своими обещаниями глубоких демократических преобразований острова, и теперь именно им поручено создание временной Республики Тайвань.\n\nСемья Ляо принадлежала к заметной местной элите, владела крупными земельными угодьями и придерживалась строгих конфуцианских ценностей. Однако его отец в ходе поворота семьи к Западу принял христианство, а сам Ляо отправился учиться в Японию. Сочетая китайскую философию с западной наукой, он продолжил образование в Китае, в Цзиньлинском университете, а затем в Чикагском университете в Соединённых Штатах. Некоторое время Ляо также провёл в Европе, где познакомился со своей будущей женой и окончательно сформировал собственное политическое мировоззрение.\n\nПо мере роста напряжённости после краха Лиги Ляо оказался посредником между противоборствующими силами по обе стороны пролива. Вместе со своим братом Вэньи он принял управление отцовской компанией, переименовал её в Dacheng Industrial Co. и использовал предприятие для развития связей от Тайбэя до Шанхая.\n\nБлагодаря контактам во всём политическом спектре и располагающему к иностранцам облику Товарищество, возможно, действительно оказалось подходящим мостом между зарубежными «освободителями» и местным населением. Однако одного идеализма недостаточно, и молодая тайваньская демократия уже успела в этом убедиться."

 POLITICS_LIN_XIANTANG_DESC: "§YРодился:§! 22 октября 1881 года, Тайчжун, провинция Фуцзянь-Тайвань, Империя Цин\n§YПолитическая карьера:§! Линь Сяньтан был членом Тайваньской культурной ассоциации, широкого объединения тайваньской интеллигенции, добивавшегося большей демократии и автономии в условиях японского правления. Происходя из богатой землевладельческой семьи, он вступал в различные революционные общества и даже отказался от японского гражданства в пользу гражданства Китайской Республики в 1913 году. Японский язык Линь так и не выучил, предпочитая хоккиен, а в частном порядке в последнее время начал осваивать и мандаринский китайский.\n\nНедовольные левым поворотом Ассоциации и Тайваньской народной партии Цзян Вэйшуя, Линь и многие его единомышленники в 1930 году создали собственный Тайваньский союз за местное самоуправление. После ожесточённого раскола с TPP их исключили из прежнего движения, и они попытались протянуть японским властям мирную оливковую ветвь. Впрочем, это им не помогло, и вскоре после запрета TPP их организация также оказалась вне закона.\n\nТем не менее движение продолжило существовать, опираясь на огромные ресурсы Линя и поддержку других тайваньских консерваторов, стремившихся к автономии, а некоторые даже осмеливались мечтать о полной независимости. Это желание наконец осуществилось после гибели Японской империи. При поддержке иностранных покровителей была восстановлена недолговечная Республика Формоза, воплотившая проект, за который когда-то боролись отец Линя и другие члены его семьи.\n\nОстаётся лишь гадать, сколько продержится новая республика, поскольку пока она фактически остаётся протекторатом внешних держав. Линь и другие представители местной знати предпочитают решать проблемы по мере их появления, одновременно пытаясь удерживать равновесие между реакционным и более умеренным крыльями."

 POLITICS_LIN_XIONGZHENG_DESC: "§YРодился:§! 5 ноября 1888 года, префектура Тайбэй, провинция Фуцзянь-Тайвань, Империя Цин\n§YПолитическая карьера:§! Линь Сюнчжэн считается одним из немногих тучных людей японской Формозы, что само по себе служит свидетельством его богатства и влияния. После аннексии Тайваня Японией его семья первоначально переехала в Фучжоу, однако вскоре вернулась обратно. В условиях нового японского порядка Линь сумел использовать местные связи, чтобы обеспечить себе влиятельное положение в режиме. Он входил в совет генерал-губернатора и устраивал множество приёмов для высшего общества, включая визит тогда ещё наследного принца Хирохито.\n\nЛинь также поддерживал Тунмэнхой и сохранял хорошие связи с китайцами. Будучи сахарным бароном, он неоднократно вступал в споры с крестьянами, одновременно поддерживая публичный образ щедрого благотворителя. Когда на Тайвань пришёл новый завоеватель, Линь одним из первых стал рассматриваться в качестве возможного руководителя острова. На этом посту он возглавил клику влиятельной тайваньской знати, финансовых кругов и деловой элиты, а главным среди его новых соратников стал заместитель Лань Гаочуань, ветеран войны Ивэй против Японии. Некоторые даже полагают, что именно Лань благодаря своим обширным связям является настоящим хозяином правительства, хотя при том, что большинство решений принимается за закрытыми дверями, установить истину непросто.\n\nВо многих отношениях старое генерал-губернаторство никуда не исчезло, лишь уступив место несколько более автономной местной верхушке. Оставшаяся в положении фактически полуколониальной зависимости Формоза движется к новому будущему под президентством Линя, каким бы это будущее ни оказалось."
 