 wlandevent.20.d:0 "Когда орудия наконец умолкают, мёртвых предают земле, а потерянных вновь находят, мы можем наконец отдохнуть - хотя бы ненадолго. Ничего, кроме Страны чудес, больше не осталось, в какой бы форме мы её ни воплотили. Понадобятся годы, а возможно и десятилетия, чтобы пережить трагедию Американской гражданской войны, но сдаваться нельзя. Наш союз восстановлен и теперь останется с нами навсегда - в той или иной форме."
