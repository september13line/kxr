 WLD_lacey_businesses_category:0 "Бизнес настоящих девочек"
 WLD_lacey_businesses_category_desc:0 "Положение нашего штата, по крайней мере в том, что касается экономики, уже довольно долго остаётся весьма плачевным. Но беспокоиться не о чем, ведь мы способны открыть множество новых и замечательных заведений, лишённых всех недостатков тех, что существовали раньше. В конце концов, это настоящий бизнес, которым занимаются настоящие девочки."
 WLD_lacey_diner:0 "Закусочная Лейси"
 WLD_lacey_diner_desc:0 "Лейси вот-вот откроет свою совершенно новую закусочную! Однако ей понадобится ваша помощь, чтобы успевать обслуживать столько голодных посетителей!"
 WLD_lacey_makeup_parlor:0 "Салон макияжа Лейси"
 WLD_lacey_makeup_parlor_desc:0 "Все о-о-очень любят чувствовать себя красивыми, и Лейси готова помочь своими суперскими навыками визажиста! Используйте воображение и творческий подход, чтобы создавать для клиентов образы, за которые можно умереть!"
 WLD_lacey_petshop:0 "Зоомагазин Лейси"
 WLD_lacey_petshop_desc:0 "У Лейси один из самых известных зоомагазинов в городе! Люди приезжают отовсюду, чтобы найти себе идеального маленького пушистого друга, и сегодня именно вам предстоит ей помогать!"
 WLD_lacey_house_makeover:0 "Преображение домов с Лейси"
 WLD_lacey_house_makeover_desc:0 "Люди не могут вечно жить в своих старых домах, и тут на помощь приходит наша предприимчивая Лейси! Помогите этой экономной предпринимательнице отремонтировать дома всех нуждающихся по всему городу!"
 WLD_lacey_backrooms_civilian:0 "Экспедиция Джея и Мейзи в мастерские"
 WLD_lacey_backrooms_civilian_desc:0 "Было бы жаль, если бы вся полезная техника затерялась среди бежевых стен, и именно поэтому Джей и Мейзи должны искать ценные предметы, куда бы ни завели их странствия!"
 WLD_lacey_backrooms_military:0 "Материальная экспедиция Джея и Мейзи"
 WLD_lacey_backrooms_military_desc:0 "На этот раз Джей и Мейзи могут почувствовать себя несколько не в своей тарелке, но чего только не сделаешь ради друга! Лейси попросила их исследовать Закулисье в поисках определённых опасных материалов!"
 WLD_lacey_backrooms_navy:0 "Водная экспедиция Джея и Мейзи"
 WLD_lacey_backrooms_navy_desc:0 "Джею и Мейзи пора отправиться в Пулрумы! Возможно, им даже удастся найти легендарную миндальную воду или научиться навигации у самого капитана Кларка!"

 WLD_wonderland_military_category:0 "Защитить наш шедевр"
 WLD_wonderland_military_category_desc:0 "Эта наша «Страна чудес» - настоящий шедевр. Новый дом для всех, кого бросил отвернувшийся от них мир. Мы обязаны сделать всё возможное, какой бы высокой ни оказалась цена, чтобы сохранить этот рай. К счастью, существует множество умелых мужчин и женщин, готовых пожертвовать своим временем и ресурсами ради общего блага."
 WLD_peterson_trenches:0 "Высадить Congregentur Carnis"
 WLD_peterson_trenches_desc:0 "Недавно мы обнаружили похожую на растение «мясистую» луковицу, способную покрывать значительную площадь острыми крючковатыми усиками. Хотя эти «сборщики» безвредны для мелких организмов, было замечено, что они целенаправленно нападают на более крупные цели вроде медведей, волков и даже людей. Стоит рассмотреть возможность использования их сочетания токсичных свойств и способности вызывать свёртывание крови на наших оборонительных рубежах."
 WLD_peterson_mass_armaments:0 "Массовое вооружение от Murray Co."
 WLD_peterson_mass_armaments_desc:0 "Основанная человеком, некогда имевшим дела с мистером Афтоном, а теперь управляемая его сыном Эдвином Мюрреем, компания Murray приобрела широкую известность благодаря разнообразной умной бытовой технике. Поскольку её предприятия уже ориентированы на массовый потребительский рынок, убедить Эдвина и его жену Фиону заключить партнёрство с нашим правительством и наладить производство дешёвого и эффективного оружия для массовой раздачи будет сравнительно просто."
 WLD_peterson_cannons:0 "«Добрососедское приветствие»"
 WLD_peterson_cannons_desc:0 "Если Теодор Питерсон и разбирается в чём-то по-настоящему хорошо, так это в том, как прибегать даже к самым радикальным мерам, чтобы не подпускать незваных гостей к своему дому. Последуем же его предложению организовать для наших врагов особое «приветствие», используя артиллерийские орудия, извлечённые из различных музеев и частных коллекций."
 WLD_film_propagation:0 "Распространять аналоговый ужас"
 WLD_film_propagation_desc:0 "Чудеса новых технологий неисчислимы, а потому широко понимаемый аналоговый формат способен оказаться весьма полезным для наших военных целей. Мы будем распространять различные фильмы, записи и иные способы запечатлеть неизвестное, чтобы одновременно вдохновлять наших людей и деморализовать их противников."
 WLD_bump_in_the_night:0 "Шорохи в ночи"
 WLD_bump_in_the_night_desc:0 "Подражая поведению различных призраков, упырей и всевозможных ночных тварей, мы можем превратить наши войска в настоящее орудие ужаса. С наступлением темноты врагу придётся терпеть непрерывные налёты, которые превратят целые его позиции в толпы обезумевших от бессонницы людей."
 WLD_charting_the_beyond:0 "Расширить программу Ктонавтов"
 WLD_charting_the_beyond_desc:0 "Становится всё очевиднее, что на территории нашего государства существует множество мест, которые вполне можно назвать «сверхъестественными». Многие из них в конечном счёте безвредны, но мы не можем быть в этом уверены, пока эти зоны не будут тщательно исследованы. Поэтому нам следует обратиться к зарождающемуся корпусу Ктонавтов, исследователей «подземного мира», и предоставить им больше ресурсов для нанесения на карту земель по ту сторону завесы."

 WLD_danganronpa_category:0 "Опровергая пули"
 WLD_danganronpa_category_desc:0 "Может показаться настоящей загадкой, как вообще выжить в мире, полном недоверия, однако две силы сумели найти свой ответ. Ещё предстоит выяснить, чей подход окажется лучше, но пока любители палить без раздумий обрушивают на нас всё новые испытания, мы обязаны сделать всё возможное ради восстановления внутренней гармонии."
 WLD_dangan_hope:0 "Положиться на помощь Фонда Будущего"
 WLD_dangan_hope_desc:0 "Верность Фонда Будущего нашему правительству позволяет нам свободно обращаться к нему за помощью государству, если мы способны обеспечить необходимое финансирование. Его стремление приблизить светлое будущее и искоренить отчаяние в самой его основе прекрасно согласуется с нашими собственными целями и наверняка сделает наших граждан ещё счастливее."
 WLD_dangan_despair:0 "Использовать методы Абсолютного Отчаяния"
 WLD_dangan_despair_desc:0 "Наше тайное соглашение с Абсолютным Отчаянием позволяет при желании привлечь его представителей к управлению государством. Хотя предоставление Дзюнко Эносиме некоторой свободы действий несомненно доведёт многих граждан до предела, возможно, именно это и необходимо, чтобы в конечном счёте сделать наше государство сильнее."

 WLD_portraits_category:0 "Соответствовать образу"
 WLD_portraits_category_desc:0 "Вполне естественно, что любой человек, возглавляющий столь грандиозное начинание, должен выглядеть подобающе, если надеется вдохновить массы последовать за собой. Возможно, это довольно незначительная деталь, но всё же весьма любопытная."
 WLD_jack_portrait:0 "Фотография Джека"
 WLD_jack_portrait_desc:0 "Поскольку именно он является главным владельцем Bunny Smiles Incorporated, мистеру Уолтену было бы разумно уделять особое внимание тому, как он выглядит на фотографиях."
 WLD_bon_portrait:0 "Полотно Бона"
 WLD_bon_portrait_desc:0 "Когда прежнего тебя больше не существует, можно создать себя заново в любом желаемом облике. Именно так и становятся по-настоящему прекрасными."

 WLD_little_bons_america_category:0 "Америка Маленького Бона"
 WLD_little_bons_america_category_desc:0 "Подобно детскому шоу, созданному Розой Уолтенов, теперь и мы должны научить потерянных людей Соединённых Штатов тому, что грустить больше незачем. Возможно, они лишились своего старого дома, но по пути обрели множество новых друзей, и теперь все могут быть счастливы вместе."
 WLD_Core_America:0 "Принести радость в [FROM.GetName]"
 WLD_Core_America_desc:0 "Теперь, когда мы установили контроль над [FROM.GetName], пришло время познакомить наших собратьев с тем, над чем мы всё это время трудились. Больше им не угрожают ни война, ни тирания, и теперь они смогут познать радость, льющуюся из «Страны чудес»."


 WLD_Wonderland_Intro:0 "Добро пожаловать в «Бургеры Бона»"
 WLD_Wonderland_Intro_desc:0 "Не секрет, что наше положение иначе как шатким не назовёшь: каждое из постамериканских государств обладает куда большим экономическим потенциалом и гораздо более развитой военной системой. Отделение Мичигана от Объединённых Синдикатов Америки также доставило местным администрациям огромную головную боль, поскольку прежде они зависели от тесно связанных между собой систем региона Великих озёр. Тем не менее благодаря новому руководству Джека Уолтена боевой дух остаётся удивительно высоким.\n\nЕсли он, скромный мигрант из Чили, сумел создать счастливую семью и построить успешный бизнес, значит, и для других людей, последовавших его примеру, нет ничего невозможного. Давайте же с гордостью и в согласии трудиться ради лучшей жизни для каждого, начиная с родины «Бургеров Бона» - округа Ливингстон - и заканчивая обоими сияющими побережьями Америки."

 WLD_WR1:0 "Те добрые времена"
 WLD_WR1_desc:0 "В такие времена, как наши, легко потерять надежду, ведь каждый новый день приносит всё новые ужасы, а порой возвращает те, что, казалось, навсегда остались в самых мрачных днях прошлого. Будь то постоянные сообщения о потерях на фронте и невинных людях, оставшихся ни с чем, или причины куда более личного характера. Даже наш собственный лидер пережил немало дней, когда почти поддавался тени, уже давно подтачивающей его компанию, но всё же продолжал держаться, вспоминая добрые времена, когда Bunny Smiles Company только создавалась накануне выставки «Технологии будущего».\n\nНам следует сосредоточиться на том, что способно помочь людям выдержать подобные испытания: даже из самой плохой ситуации всегда можно извлечь что-то хорошее. Направим творческую энергию художников, артистов и прочих необычных личностей на создание островков радости и доброты посреди окружающего хаоса. Настоящей «Страны чудес» как для детей, так и для взрослых."

 WLD_Umi:0 "Легенда о Золотой Ведьме"
 WLD_Umi_desc:0 "Недавно к нам обратилась прекрасная женщина, называющая себя лишь Беатриче, хотя, судя по немногочисленным сведениям, которые удалось собрать, среди местных жителей она также известна как «Золотая Ведьма». В Америке всегда хватало собственных фокусников и обманщиков, однако эта женщина явно не является ни обычной иллюзионисткой, ни даже простой колдуньей, поскольку, судя по всему, обладает способностями, которые невозможно объяснить иначе как смутными упоминаниями неких оккультных ритуалов с далёкого острова.\n\nПодобные эзотерические представления не только повергнут наших врагов в смятение, но и постепенно пробудят в нашем народе веру в существование магического мира, что ещё сильнее поможет нам в создании «Страны чудес». То, что сама Беатриче называет «проведением людей в Золотую Землю», уже приносит плоды: газеты всё чаще пишут о странных явлениях, а не о болезненной реальности настоящего."

 WLD_IB:0 "Раскрашивая вымышленный мир"
 WLD_IB_desc:0 "Недавно талантливая юная девушка стала протеже супруги мистера Уолтена, Розмари, которая и сама является одарённой художницей и одним из добрейших людей, которых только можно встретить. Иб, как зовут маленького гения, редко общается словами, предпочитая позволять своим картинам выражать то, чего речь передать не способна. Было замечено, что её произведения вызывают у зрителей ощущение, будто их «переносит» в совершенно иную, куда более яркую и живую реальность.\n\nДаже если все последствия подобного состояния, напоминающего сон, пока неизвестны, использование такой возможности принесёт огромную пользу «Стране чудес» и позволит нам создать настоящий альтернативный мир. Если мы не собьёмся с пути и не перестанем следить за происходящим вокруг, эта новая галерея станет вратами в лучшее завтра."

 WLD_WR2:0 "Красота требует боли"
 WLD_WR2_desc:0 "Джек никогда не был сильным человеком, что бы он ни говорил собственной дочери и жене. Каждый день он жил с тайной виной за прошлое, а теперь к ней добавилась ещё и бойня Гражданской войны, которую ему пришлось наблюдать собственными глазами. Рано или поздно что-то должно было сломаться. Господь действительно испытывал семью Уолтенов, и они не выдержали. Но тень, неотступно следовавшая за ними, знает, что нужно сделать, чтобы все стали прекрасными.\n\nЧто такое несовершенные люди, если не заготовки, которые следует разбить и исправить? «Бон» не остановится ни перед чем, чтобы все непригодные возродились в Стране чудес, словно бабочка, вырывающаяся из кокона. Многие будут сопротивляться, но первоначальная боль необходима. В конце концов, какой смысл жить, если ты уже мёртв."

 WLD_SH:0 "Сквозь Иной мир"
 WLD_SH_desc:0 "На побережьях озёр существует множество затянутых туманом мест, скрывающих тайный проход, ведущий в удивительное пространство очищения. Этот «Иной мир» открывается как отдельным людям, так и целым сообществам, неспособным справиться с пережитыми ими кошмарами. Благодаря знакам, оставленным древним орденом, «Ореол Солнца» способен служить проводником на эту обратную сторону бытия.\n\nИспользуя существ, рождённых в этом измерении, мы будем переносить туда всех, чьи души пока не способны обрести покой, чтобы они прошли очищение. Какую именно форму примет этот процесс, никто не может сказать наверняка, но на пути в Страну чудес нет причин бояться."

 WLD_MC:0 "Это не настоящий ты"
 WLD_MC_desc:0 "Похоже, наше вмешательство в саму природу человечества привлекло внимание некой силы с небес, по крайней мере, если верить его собственным словам. Наблюдатель, как он скромно себя назвал, предстал перед нами в облике величественного архангела, приняв на себя роль высшего призрака. Насколько известно тем, кто осведомлён о существах его рода, «Альтернативы», находящиеся под его властью, существуют среди нас гораздо дольше, чем большинство способно представить.\n\nЛюди по своей природе несовершенны, а потому тех, кто не внемлет нашим словам и сопротивляется попыткам быть «обманутыми», можно попросту заменить, ведь в Стране чудес есть место лишь для одного из нас. И когда они проснутся, все они будут танцевать на приготовленной для них сцене, преображённые посредством собственных величайших страхов."

 WLD_DGR:0 "Между надеждой и отчаянием"
 WLD_DGR_desc:0 "Надежда и Отчаяние - миром правят эти две вечные эмоции. Именно к такому выводу мы пришли, возводя наш новый рай. Естественно, жители Америки разделились между двумя лагерями: одни продолжают верить, что после окончания всех бед наступит нечто лучшее, другие же сдаются и отдают себя во власть ужасов, лежащих за пределами человеческого понимания.\n\nНам стало известно о двух организациях, знания которых в этих областях значительно превосходят наши собственные: Фонд Будущего и Абсолютное Отчаяние. Ни одна из них не горит желанием сотрудничать с другой. Тем не менее мы всё ещё можем наладить связи с обеими сторонами и обращаться к каждой из них в зависимости от текущих обстоятельств, даже если применяемые ими методы вызывают немало вопросов."
 WLD_DGR_tt:0 "§uНам станут доступны инструменты либо Светлого Будущего, либо Абсолютной Трагедии.§!"

 WLD_MM:0 "Разработать воздушные корабли «Каньонггалан»"
 WLD_MM_desc:0 "Недавно наши лесные службы наткнулись на нечто, способное переломить ход воздушной войны в нашу пользу. Так называемое «стекло Гизы», впервые обнаруженное в далёком Египте, а позднее найденное и в нашем собственном Большом каньоне, по-прежнему остаётся малоизученным, за исключением того факта, что его образование связано с ударами молний.\n\nТем не менее утверждается, что оружие из этого материала способно разрезать практически что угодно, а невероятные истории гласят, будто отсечённые им человеческие головы раздуваются до размеров огромных воздушных шаров и обретают способность летать. Нам следует использовать это стекло, поскольку сейчас мы явно не в том положении, чтобы долго размышлять, правильно это или нет."

 WLD_HN:0 "Соседство мистера Питерсона"
 WLD_HN_desc:0 "Из-за численности Национальной гвардии нашего штата, наскоро превращённой в полноценную армию, мы не можем рассчитывать на то, что сумеем одинаково защитить всех наших граждан. Именно поэтому их необходимо обучить самостоятельно противостоять любым силам, пытающимся оккупировать Мичиган, в духе наших предков, защищавших собственные дома.\n\nК счастью, нам известен человек, уже обладающий немалым опытом в подобных делах, - Теодор Питерсон, которому годами приходилось отражать незваных гостей. Если нам удастся распространить его идеи об укреплении домов и использовании самых обычных предметов для защиты от вторжения, любой враг наверняка предпочтёт держаться подальше."

 WLD_WA:0 "Плоть, сталь, радость, созидание"
 WLD_WA_desc:0 "Среди многочисленных компаний, предложивших переориентировать производство на военные нужды, оказалась Afton Robotics, прежде занимавшаяся созданием различных простых аниматроников для развлечения публики. Её основатель Уильям Афтон заверил нас, что находящиеся в его распоряжении фабрики и инженеры готовы выполнить любой заказ нашей армии.\n\nОднако его амбиции уже вышли далеко за рамки роли простого помощника, хотя план отправки на фронт «роботов» для поднятия боевого духа уже был одобрен. Лишь время покажет, что именно этот дальновидный человек в пурпурном намерен представить миру."
 WLD_WA_tt:0 "§hКлассика пиццерии будет готова к началу представления!\nК нашим силам присоединятся различные новые «генералы».§!"

 WLD_RE:0 "Наши собственные звёзды"
 WLD_RE_desc:0 "Специальная служба тактики и спасения, наше специализированное разведывательное ведомство, до сих пор прекрасно справлялась со своими обязанностями. Однако её работа никогда не заканчивается: новые странные происшествия, связанные с явлениями, которые многие считают сверхъестественными, а также деятельность иностранных агентов требуют новых усилий по борьбе с любой враждебной угрозой, где бы она ни проявилась.\n\nМы должны расширить ресурсы, доступные S.T.A.R.S., чтобы ничто не ускользнуло от агентов нашего государства. Заодно можно заслуженно повысить одного из ключевых сотрудников службы и привлечь иностранных специалистов, ничуть не уступающих нашим нынешним кадрам."

 WLD_RNG:0 "Потоп разгневанных духов"
 WLD_RNG_desc:0 "Мир радиоэлектронной борьбы пока изучен далеко не полностью. Возможно, именно поэтому наши враги испытывают с ней столько проблем всякий раз, когда действуют на нашей территории. Конечно, всегда найдутся люди, которые вновь перескажут старые сказки о духах скорби и гнева, теперь цепляющихся за аналоговые средства связи, но ведь всё это наверняка не более чем выдумки.\n\nОднако психологический эффект подобных поверий вполне реален, а значит, наши войска могут обратить его себе на пользу. Настало время самим стать теми чудовищами, которыми пугают по ночам. Те, кто решится выступить против нас, будут бояться, а затем им останется лишь бежать или прятаться, становясь совершенно беззащитными."

 WLD_ROD:0 "Наследие капитана Уиттерела"
 WLD_ROD_desc:0 "С нашим выходом к Восточному побережью прежде ничтожные и крайне временные военно-морские силы Великих озёр столкнулись с куда более серьёзной задачей. Вопрос о том, как защитить огромную береговую линию Америки без заранее подготовленной инфраструктуры, с самого начала вызывал бесконечные споры среди наших адмиралов.\n\nВ конечном итоге было предложено блестящее решение, основанное на историях о различных кораблях-призраках, которые бесследно исчезали, а затем возвращались, чтобы преследовать тех, кто оказался к этому не готов. Будь то знаменитая «Мэри Селест» или куда менее известное торговое судно «Обра Динн» под командованием англичанина Роберта Уиттерела, эти корабли послужат образцом для наших современных левиафанов."
 WLD_ROD_tt:0 "§7К нашему флоту присоединятся новые корабли, построенные по особым спецификациям.§!"

 WLD_SFD:0 "Обезопасить-Удержать-Сохранить"
 WLD_SFD_desc:0 "Тайны невозможно хранить вечно; именно поэтому в этом мире должны существовать люди, сохраняющие бдительность, чтобы остальные могли жить, ни о чём не беспокоясь. Именно так обстоят дела с бывшими союзниками федерального правительства, которые теперь постучались в наши двери после резкого роста числа сообщений о необычных явлениях по всему Мичигану.\n\nФонд Особых Условий Содержания будет служить во тьме, чтобы защищать наш свет, используя общие средства и возможности для каталогизации и содержания любых существ или объектов, признанных чрезмерно аномальными, что также принесёт пользу нашей научной базе."

 WLD_GHE:0 "Взгляд на искусственный разум"
 WLD_GHE_desc:0 "Вычислительная техника, хотя ей уже уделяли некоторое внимание CyberFun Tech и другие подобные компании вроде Fazbear Entertainment или Murray Co., всё ещё остаётся относительно новой и плохо изученной областью. К счастью, появилась новая группа, предложившая свои услуги после того, как наше правительство, судя по всему, привлекло её внимание.\n\nREGNAD Computing утверждает, что благодаря щедрому финансированию от своего загадочного клиента сможет ускорить наше технологическое развитие далеко за пределы всего, что прежде видел человеческий глаз. Взамен они просят лишь доверия; мы же получим поистине неземные возможности связи в области искусственно созданного разума."

 WLD_LG:0 "Небольшие стартапы Лейси"
 WLD_LG_desc:0 "После бегства и краха крупнейших отраслей финансовая жизнь Мичигана сосредоточилась вокруг малого и среднего бизнеса. Немногие оставшиеся крупные корпорации полностью поглощены нынешней войной, тогда как переживающие упадок закусочные, семейные магазинчики и прочие предприятия требуют немедленного внимания.\n\nНекоторые, возможно, видят смысл в сохранении контроля господина Кранкена над этой частью экономики, однако перемены явно необходимы. Мы поставим во главе настоящего вундеркинда, весёлую девушку, готовую к любым приключениям. И пусть кого-то беспокоит, что Лейси временами слишком легко отвлекается, когда того требует ситуация, она способна проявить невероятную решимость."
 WLD_LG_tt:0 "§MМы сможем и дальше улучшать нашу экономику при помощи различных инвестиционных схем Лейси.§!"

 WLD_BR:0 "Все эти комнаты"
 WLD_BR_desc:0 "После того как различные профсоюзы и реакционные предприятия покинули свои объекты в Мичигане, не оставив никого, кто мог бы заявить на них права, здания пришли в запустение и стали лёгкой добычей для вандалов. Однако местные силы, направленные для восстановления порядка, с удивлением обнаружили, что многие из тех же хулиганов держались от этих мест подальше, боясь заходить в то, что они называли бесконечными глубинами.\n\nИ действительно, дальнейшее расследование показало, что эти пространства куда больше, чем можно предположить по чертежам. После некоторых уговоров со стороны их дорогой подруги Лейси Джей и Мейзи организуют экспедиции в эти комплексы, чтобы выяснить, являются ли они всего лишь мебельными магазинами, до отказа забитыми пуфами, или скрывают нечто куда более ценное."
 WLD_BR_tt:0 "§8Станут доступны дополнительные способы добычи материалов из этих странных лабиринтов.§!"

 WLD_MW:0 "На крыльях Тулпара"
 WLD_MW_desc:0 "Несмотря на значительные успехи в улучшении нашей экономики, существует одна область, которой в Америке всегда угрожало забвение. Инфраструктура, как городская, так и особенно междугородняя, до сих пор практически не затрагивалась нашими усилиями. Так продолжаться не может, ведь перевозка как гражданских, так и военных грузов жизненно необходима.\n\nМногие компании, включая Pony Express, добровольно вызвались обслуживать железные дороги, автомагистрали и всё, что находится между ними, причём за удивительно низкую цену. Скоро наши люди будут передвигаться столь же стремительно, словно скачут на небесном коне Тулпаре, в честь которого назван один из грузовых составов Express."

 WLD_FF:0 "Высшее предназначение ремнанта"
 WLD_FF_desc:0 "Хотя исследователи Фонда SCP, без сомнения, чрезвычайно искусны в обращении с аномалиями, которые они годами удерживали под контролем, им недостаёт определённого понимания «духовного». Уильям Афтон, один из наших ближайших подрядчиков, собрал достаточно записей на эту тему, дополненных экспериментами доктора Финеаса Таггарта и доктора Талберта, чтобы указать им дальнейший путь.\n\nТак называемый «одержимый металл», предположительно способный удерживать остаточные воспоминания людей, перешедших на ту сторону, может быть использован и введён как в плоть, так и в механические существа, позволяя им заглянуть за завесу, не говоря уже о значительном увеличении их силы."

 WLD_FP1:0 "Дом куда лучше"
 WLD_FP1_desc:0 "Давным-давно существовала страна, которая потеряла нечто, даже не зная, где именно оно было утрачено. Люди снова и снова ходили по кругу, шли и сражались день за днём, и так ещё много дней. Пока однажды, в один совершенно особенный день, потерянное не было найдено вновь и наконец возвращено на своё место.\n\nЛюди этой страны прежде были измотаны, но они желали изо всех сил и потому им указали путь домой, в дом куда лучше прежнего. В место, свободное от боли и страданий, печали и стыда.\n\nОстальной мир должен понять, что добраться туда будет непросто, но если они согласятся, то присоединятся к своим американским кузенам в собственной Стране чудес."
 WLD_FP1_tt:0 "§4Мы пригласим весь остальной мир в нашу Страну чудес.§!"

 WLD_FP2:0 "Сокрушить механитов"
 WLD_FP2_desc:0 "За время нашего сотрудничества с Фондом SCP мы узнали о множестве враждебных группировок, стремящихся разрушить завесу, защищающую человечество от мира аномалий. От остатков режима OBSKURA до разрозненных боевиков Длани Змея - у наших партнёров хватает врагов, однако ни один из них не столь необычен, как Церковь Разбитого Бога.\n\nЭти люди поклоняются древнему божеству, известному как Механ, презирают любую плоть и верят, что механическое спасение наступит, когда части их бога вновь будут собраны воедино. Поскольку сообщения об их успехах по всей Мексике множатся, мы должны действовать сейчас, пока предполагаемый «благосклонный бог» не обрёк на гибель и наш собственный проект."
 WLD_FPCon_tt:0 "§4Наши новые гости будут полностью приняты и станут неотъемлемой частью нашей страны.§!"
 WLD_controls_mexico:0 "§3Мексика, Карибы и Центральная Америка§! были приведены в Страну чудес."

 WLD_FP3:0 "Возвращение в Зелёную долину"
 WLD_FP3_desc:0 "Поскольку основатель предприятия, с которого всё началось, происходит с Южного континента, было бы разумно направить наши усилия на то, чтобы привести жителей Чили и других далёких стран Латинской Америки под защиту созданного нами убежища.\n\nКак оказалось, некоторые утверждают, что нашли иной вход в наши земли, о чём свидетельствуют отчёты, обнаруженные в Экологическом парке Ла-Платы. Однако этот на первый взгляд мирный остров Валье-Верде совсем не таков, каким кажется, и мы должны спасти тех, кто оказался заперт в том мире, от ненасытного голода."
 WLD_controls_south_america:0 "§3Южная Америка§! была приведена в Страну чудес."

 WLD_FP4:0 "Сотрудничество с NAMAD"
 WLD_FP4_desc:0 "Вокруг деятельности блестящих умов REGNAD возникло множество различных групп, хотя большинство из них ограничены пределами Соединённых Штатов. К счастью для нас, существует одна корпорация, способная помочь нашей миссии на Севере, используя новые технологии так же, как ранее это делала Computing.\n\nNorthern Alberta Mining and Development, сокращённо NAMAD, обладает опытом работы с такими устройствами, как дистанционно управляемый компактный проходческий комплекс и система «обнаружения сейсмических колебаний», которые окажутся бесценными при освоении промёрзших просторов канадской глуши."
 WLD_controls_canada:0 "§3Канада§! была приведена в Страну чудес."

 WLD_FP5:0 "Вызвать агента Аломар"
 WLD_FP5_desc:0 "Наши люди действительно плохо подготовлены к действиям в Африке, ведь для подавляющего большинства населения сам континент всё ещё остаётся «тёмной землёй». Тем не менее коренные народы слишком долго находились под тираническим гнётом, не говоря уже о тревожных рассказах о биотеррористической активности и вновь появляющихся доисторических чудовищах, несущих разрушение.\n\nК счастью, мы знаем женщину, идеально подходящую для того, чтобы провести нас через Западную Африку и дальше, - Шеву Аломар, уроженку этих земель и недавнего новобранца S.T.A.R.S., рекомендованную агентом Редфилдом."
 WLD_controls_africa:0 "§3Африка§! была приведена в Страну чудес."

 WLD_FP6:0 "Изучить отчёты Лебедева"
 WLD_FP6_desc:0 "Помимо руководства исследованиями загадочных событий в городке Олд-Окберн, доктор-профессор Фёдор Петров Лебедев составил один из наиболее подробных отчётов о кровавом пакте, превратившем реку Везер в Нижней Саксонии в место скорби.\n\nТеперь, когда наше внимание обращается к Европе, великой прародительнице всевозможных древних ужасов и проклятий, терзающих весь остальной мир, было бы разумно прислушаться к предупреждениям учёного и воспользоваться его трудами, чтобы спасти всех, кто может оказаться уязвим перед зловещими космическими силами."
 WLD_controls_europe:0 "§3Европа§! была приведена в Страну чудес."

 WLD_FP7:0 "Бесконечное блаженство"
 WLD_FP7_desc:0 "Должно быть, это ужасное чувство - терять контроль над собственными мыслями, разумом и самим собой, но теперь человечеству за пределами Америки становится лучше. Раньше люди искали бесконечного блаженства, и именно его мы им предложили.\n\nВсё может стать реальностью, когда они с нами, когда больше всего нуждаются в нашей помощи. Взамен люди примут свою новую жизнь в Стране чудес, волшебном месте, где каждый сможет найти способ продолжать свой путь даже за пределами собственного конца."
 WLD_controls_world:0 "§3Остальной мир§! был приведён в Страну чудес."


 WLD_Pol_Start:0 "Просто продержаться... ещё немного"
 WLD_Pol_Start_desc:0 "Последние месяцы были тяжёлыми для всех жителей нашего государства. Полный крах федеральной власти, за которым последовало стремительное разрушение всех прежних норм при зарождающемся синдикалистском режиме, лишил многих веры в будущее. Но однажды всё это пройдёт."

 WLD_Pol_Route1A:0 "Горе - это болезнь"
 WLD_Pol_Route1A_desc:0 "Мы должны быть достаточно сильны, чтобы справиться со всем, что уготовила нам судьба, и достаточно способны, чтобы защитить то, чем дорожим больше всего. Господин Уолтен не позволит недавнему горю сломить себя, каким бы тяжёлым оно ни оказалось."

 WLD_Pol_Route1B:0 "К золотой земле"
 WLD_Pol_Route1B_desc:0 "Благодаря настоящему мастерству и толике волшебства наш путь к «Стране чудес» становится всё яснее. Наша страна будет постепенно превращена в настоящий рай, золотую землю, где никто не останется нуждающимся или обездоленным."

 WLD_Pol_Route1C:0 "Обещание воссоединения"
 WLD_Pol_Route1C_desc:0 "Благодаря искусству и любви эксперимент «Страна чудес» предоставил безопасное убежище бесчисленным душам, оказавшимся на распутье. Пусть нам ещё не удалось воссоединиться со всеми, кто нам дорог, мы можем быть уверены, что однажды вновь встретимся в какой-нибудь солнечный день."

 WLD_Pol_Route2A:0 "Холсты с чистого листа"
 WLD_Pol_Route2A_desc:0 "Все мы оказались сломлены, разорваны на части и сожжены до последней нити. Но тревожиться незачем: «Бон» исправил самого себя, а значит, и всех остальных можно восстановить с чистого холста, заново превратив во что-то прекрасное."

 WLD_Pol_Route2B:0 "Очищение от кошмара прошлого"
 WLD_Pol_Route2B_desc:0 "Путь к примирению с кошмаром, в котором оказались многие, будет нелёгким, но существует нечто, способное значительно им помочь. Стоит им лишь пройти через мир, который не до конца принадлежит нам и предназначен для очищения их самых глубоких демонических желаний, как врата в Страну чудес непременно откроются."

 WLD_Pol_Route2C:0 "Грехи человечества повержены"
 WLD_Pol_Route2C_desc:0 "Мы поведём массы к их окончательному спасению, к состоянию блаженства, которого лжемессии прошлого никогда не могли им даровать. Всякий, кто откажется слушать и изменить свой путь, будет отброшен прочь, чтобы влачить существование вдали от радостей нашей Страны чудес."

 WLD_Pol_DGR1:0 "Абсолютная надежда"
 WLD_Pol_DGR1_desc:0 "Мы не сможем сохранить здравомыслие нашего народа, если не дадим ему образцы для подражания, истинные воплощения добродетели, за которыми можно следовать. Разумеется, ради этого нам, возможно, придётся пойти на некоторые сомнительные меры, например насаждать людям оптимизм вопреки их, казалось бы, более разумным желаниям, однако эта цена ничтожна, если надежда вновь должна воцариться."

 WLD_Pol_DGR2:0 "Абсолютное отчаяние"
 WLD_Pol_DGR2_desc:0 "В нынешнем положении нашего государства нет ничего ценнее, чем слышать плач врагов и знать, что они больше не способны причинить вред самым уязвимым членам нашего общества. Именно поэтому мы обязаны использовать все доступные средства, чтобы положить конец враждебным режимам: когда отчаяние пустит среди них корни, они останутся беззащитными и не смогут устоять перед нашим маршем."

 WLD_Mil_Idea1A:0 "Держитесь подальше"
 WLD_Mil_Idea1A_desc:0 "Господин Петерсон не любит шумных и никчёмных соседей, пытающихся вмешиваться не в своё дело, и мы полностью разделяем его позицию. Необходимо сделать так, чтобы его тактические знания и наши ресурсы совместно принесли пользу нашим войскам."

 WLD_Mil_Idea1B:0 "Не приближайтесь"
 WLD_Mil_Idea1B_desc:0 "Господин Петерсон не любит шумных и никчёмных соседей, пытающихся вмешиваться не в своё дело, и мы полностью разделяем его позицию. Необходимо сделать так, чтобы его тактические знания и наши ресурсы совместно принесли пользу нашим войскам."

 WLD_Mil_Idea1C:0 "Держитесь подальше, не приближайтесь"
 WLD_Mil_Idea1C_desc:0 "Господин Петерсон не любит шумных и никчёмных соседей, пытающихся вмешиваться не в своё дело, и мы полностью разделяем его позицию. Необходимо сделать так, чтобы его тактические знания и наши ресурсы совместно принесли пользу нашим войскам."

 WLD_Mil_Idea2A:0 "Призвать бурю ярости"
 WLD_Mil_Idea2A_desc:0 "Многие, кажется, взывают к мести из-за завесы. Пусть они и не обязательно осязаемы или даже связаны с реальностью, их психологическое воздействие очевидно для всех. Так воспользуемся этой силой и обратим её против наших врагов в поистине потопной волне злобы."

 WLD_Mil_Idea2B:0 "Призвать бурю ярости"
 WLD_Mil_Idea2B_desc:0 "Многие, кажется, взывают к мести из-за завесы. Пусть они и не обязательно осязаемы или даже связаны с реальностью, их психологическое воздействие очевидно для всех. Так воспользуемся этой силой и обратим её против наших врагов в поистине потопной волне злобы."

 WLD_Mil_Idea2C:0 "Призвать бурю ярости"
 WLD_Mil_Idea2C_desc:0 "Многие, кажется, взывают к мести из-за завесы. Пусть они и не обязательно осязаемы или даже связаны с реальностью, их психологическое воздействие очевидно для всех. Так воспользуемся этой силой и обратим её против наших врагов в поистине потопной волне злобы."

 WLD_FF_Mil1:0 "Аниматронное направление: Стичрэйт"
 WLD_FF_Mil1_desc:0 "Нам удалось убедить, а вернее, позволить убедить себя, Уильяму Афтону сотрудничать с доктором Финеасом Таггартом над внедрением настоящих военных роботов в наши войска. Получившие криптоним «Стичрэйт», эти создания должны значительно повысить боевые возможности наших армий."

 WLD_FF_Mil2:0 "Аниматронное направление: Хелпи"
 WLD_FF_Mil2_desc:0 "Благодаря огромной помощи со стороны совета Fazbear Entertainment Уильяма Афтона удалось убедить умерить свои амбиции и продолжить работу над ранее согласованным планом «Хелпи». Его опыт в робототехнике будет ограничен исключительно вспомогательными функциями в нашей армии."

 WLD_Mil_Air:0 "Проект «Страж свободы»"
 WLD_Mil_Air_desc:0 "Благодаря применению определённых «инструментов», предоставленных нам посредством использования Стекла Гизы, возможности по защите государства значительно расширились. Теперь мы можем призывать этих «Стражей», чтобы обеспечить безопасность любой далёкой земли, находящейся под нашим контролем."

 WLD_Mil_Navy:0 "Под парусами «Обра Динн»"
 WLD_Mil_Navy_desc:0 "По мере формирования нового курса нашего флота многие напуганные моряки начали говорить о возвращении легендарной «Обра Динн», а вместе с ней и множества других призрачных кораблей. Воспользуемся этим ошибочным восприятием, чтобы переиграть наших врагов на бескрайних океанах."

 WLD_Mil_RE:0 "Специальная тактическая и спасательная служба"
 WLD_Mil_RE_desc:0 "Объединив лучших из лучших как из военной, так и из академической среды, мы сделаем наши полицейские и коммандосские подразделения неудержимыми при действиях в нестабильной городской обстановке и в борьбе с терроризмом - и всё это благодаря дальнейшему расширению S.T.A.R.S."

 WLD_ResearchA:0 "Анализ аномалий"
 WLD_ResearchA_desc:0 "Мир полон аномалий, больших и малых, и было бы непростительно оставить тех, кто придёт после нас, в неведении об этих явлениях. Благодаря сотрудничеству с Фондом мы используем накопленные знания, чтобы вывести научные исследования далеко за пределы всего, чего прежде удавалось достичь в Америке."

 WLD_ResearchB:0 "Власть над материальным посредством нематериального"
 WLD_ResearchB_desc:0 "И Ремнант, и его разновидность Агония, силы, способные, судя по всему, вновь делать утраченное реальным, некогда были тайнами, неизвестными ни одному учёному. Однако мы добились значительных прорывов в их изучении и теперь можем заявить, что даже нематериальное удалось заковать в цепи человеческого понимания."

 WLD_MWIdea:0 "Простор для грузоперевозчиков"
 WLD_MWIdea_desc:0 "Нашим обширным землям необходим надёжный способ как перевозить товары, так и давать пассажирам возможность добраться до любого города, где они пожелают оказаться. К счастью, Pony Express и другие подобные компании готовы предоставлять такие услуги за сравнительно небольшую плату."

 WLD_EcoStart:0 "Недостаток качества"
 WLD_EcoStart_desc:0 "Качество, качественная еда, качественные развлечения, качественный досуг. Всего этого не хватает в экономике нашего государства, причём не только в забытом центральном секторе Мичигана, но и в Америке в целом. Хотя Феликс Кранкен относительно неплохо справляется с обязанностями управляющего, определённые «черты характера» не позволяют ему самостоятельно восстановить нашу экономику. Придётся найти кого-то, кто одновременно захочет и сможет спасти наши предприятия от разорения."

 WLD_EcoA:0 "Предпринимательство Лейси - медленное завтра"
 WLD_EcoA_desc:0 "Потребителям нет конца: они требуют всё больше и больше, независимо от того, насколько трудно удовлетворять их желания. Пусть улучшение нашего положения по-прежнему идёт медленно, Лейси наверняка сумеет выполнить поставленные перед ней задачи. Она обязана это сделать, ведь теперь на неё полагаются все, а иного выбора у неё попросту нет."

 WLD_EcoB:0 "Предпринимательство Лейси - Изо всех сил"
 WLD_EcoB_desc:0 "Лейси больше не позволит себя сломить; она докажет всем, что способна добиться успеха во всём, за что бы ни взялась. Благодаря её усилиям наша экономика продолжает улучшаться темпами, невиданными при руководстве господина Кранкена."

 WLD_EcoC:0 "Предпринимательство Лейси - Изо всех сил"
 WLD_EcoC_desc:0 "Лейси больше не позволит себя сломить; она докажет всем, что способна добиться успеха во всём, за что бы ни взялась. Благодаря её усилиям наша экономика продолжает улучшаться темпами, невиданными при руководстве господина Кранкена."

 WLD_EcoD:0 "Предпринимательство Лейси - Изо всех сил"
 WLD_EcoD_desc:0 "Лейси больше не позволит себя сломить; она докажет всем, что способна добиться успеха во всём, за что бы ни взялась. Благодаря её усилиям наша экономика продолжает улучшаться темпами, невиданными при руководстве господина Кранкена."

 WLD_EcoE:0 "Предпринимательство Лейси - Лучшая в мире"
 WLD_EcoE_desc:0 "Долгий кошмар, в котором наше государство не могло обеспечить всех необходимым, наконец подошёл к концу, и немалая заслуга в этом принадлежит нашей главной девчонке Лейси. Теперь она наконец может отдохнуть, зная, что все довольны достигнутым."

 WLD_ForPol_Idea:0 "Мы все вместе в Стране чудес!"
 WLD_ForPol_Idea_desc:0 "Остальной мир, возможно, пока этого не осознаёт, но дух не может существовать без сосуда, к которому он привязан. Что такое жизнь в столь разрушенном мире, если не преждевременная смерть? Наша же Страна чудес служит якорем для всех тех, кто иначе оказался бы потерян. Самое трудное уже позади, и теперь каждый получит чудесный подарок!"


