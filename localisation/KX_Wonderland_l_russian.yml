 wlandevent.1.t:0 "Недавняя «ржавчина» Мичигана"
 wlandevent.1.d:0 "Несомненно, Мичиган является важнейшим штатом Великих озёр в США, крупным центром промышленного производства и одновременно очагом профсоюзной активности. Его вполне можно назвать второй «жемчужиной» зарождающихся Объединённых Синдикатов после столичной зоны Чикаголенда. Хотя район самого Детройта был быстро взят под контроль после провозглашения Второй американской революции, относительная удалённость различных городов и посёлков как на «Варежке», так и на Верхнем полуострове серьёзно осложнила распространение нашей власти.\n\nБолее того, этот процесс столкнулся со значительным сопротивлением как внутренних, так и внешних врагов. К первым относятся силы капиталистического порядка и реакции: фордисты Дирборна или отделения Клана, расплодившиеся по всему югу штата. Кроме того, мерзкие прихвостни британской короны, засевшие в Канаде после того, как десять лет назад наши британские товарищи вышвырнули их с родины, уже начали проводить мелкие операции по нарушению судоходства на Великих озёрах посредством диверсий и трансграничного проникновения.\n\nВ результате особенно сильно пострадали многочисленные малые предприятия Стального пояса, в отношении которых у нас до сих пор отсутствует чёткая политика. Мелкая преступность и общий распад общественного порядка достигли масштабов, превосходящих даже времена Гувера. Банкротства, разорванные цепочки поставок, взломы, вандализм, вымогательство - все те явления, которым нет места при социализме, - постепенно подрывают доверие жителей Мичигана, в том числе обитателей расположенного неподалёку от Детройта Брайтона, к новому Синдикалистскому конгрессу и его представителям. Рано или поздно нам придётся укрепить власть закона - справедливого закона, служащего народу, - если мы действительно намерены защищать трудящихся всех профессий и оберегать их от старых угроз, всё ещё таящихся в тени."
 wlandevent.1.a:0 "Всё это просто... один долгий подъём, который нам придётся преодолеть."
 wlandevent.1.b:0 "§3Я уже не понимаю, что вообще происходит.§!"

 wlandevent.2.t:0 "Центр города"
 wlandevent.2.d:0 "Похоже, наша растерянность и последовавшее за ней бездействие заставили предпринимателей Мичигана открыто выступить против новой администрации. Устав от бесконечной череды унижений и предполагаемого фаворитизма по отношению к фабрично-промышленным секторам, контролируемым профсоюзами и кормящимися за их счёт политиками, владельцы семейных лавок и управляющие начали искать человека, способного привести их к безопасному и стабильному будущему.\n\nНе желая просто заменить одного социалистического вождя другим, вернуть Синдикаты под федеральную тиранию или отдать власть демоническим диксикратам в капюшонах, жители крупнейшего подконтрольного нам штата Великих озёр предпочли обратиться к одному из своих.\n\nДжек Уолтен, иммигрант из Чили, поселившийся в забытом городе Брайтон, был вознесён на высшую должность нуждающимися жителями любимого им округа Ливингстон и всего Большого Детройта. Семьянин и уважаемый член местного сообщества, активно участвующий в различных благотворительных начинаниях, господин Уолтен является совладельцем закусочной Bon's Burgers вместе со своим партнёром Феликсом Кранкеном. Лишь время покажет, хватит ли ему сил справиться с новым и крайне шатким положением, в котором оказался Мичиган."
 wlandevent.2.a:0 "Давайте воссоединим вашу семью как следует."
 wlandevent.2.b:0 "Не думаю, что мы действительно помогаем друг другу."

 wlandevent.3.t:0 "Построено Афтоном"
 wlandevent.3.d:0 "Сотрудничество между нашим промышленным сектором, особенно его военной частью, и Afton Robotics уже принесло множество положительных результатов, и теперь нас всё настойчивее подталкивают пересмотреть первоначальные рамки соглашения с дочерней компанией Fazbear Entertainment. Некоторые наши солдаты, по крайней мере те, чьи дети в восторге от новых аниматронных товарищей своих отцов, возможно, и ценят вклад Уильяма, однако старые капитаны промышленности остаются совершенно не впечатлены.\n\nТем не менее господин Афтон направил официальный запрос на расширение программы военной робототехники, ссылаясь на острую необходимость в эффективных подразделениях, способных действовать без остановки независимо от условий. В этом его поддерживает другой гений данной области, Финеас Таггарт, однако подобная позиция остаётся редкостью среди тех, кого беспокоит будущее Afton Robotics. Совет директоров Fazbear настоятельно рекомендует сдерживать амбиции Уильяма и ограничить его разработки исключительно вспомогательной ролью, упоминая некоторые странные конструктивные решения, смысл которых трудно понять и которые их создатель так ни разу и не объяснил."
 wlandevent.3.a:0 "Хорошо, развяжем ему руки."
 wlandevent.3.b:0 "Ограничить его амбиции."

 wlandevent.4.t:0 "В ожидании Синдикатов"
 wlandevent.4.d:0 "Хотя силы Объединённых Синдикатов объявили о временном отступлении со всей территории Мичигана, к нашему удивлению включая даже Верхний полуостров, совершенно ясно, что подобное положение не продержится дольше короткого «льготного периода». Синдикалисты попытаются вернуться и отвоевать то, что считают своим, не говоря уже о других силах, которые могут воспользоваться изменившимся балансом сил вокруг Великих озёр. Мы должны подготовиться и защитить будущее, в которое все мы сможем поверить."
 wlandevent.4.a:0 "Время пришло."
 wlandevent.4_tooltip:0 "§RЧерез 75 дней начнётся война с ОСА.§!"

 wlandevent.5.t:0 "Война за Мичиган"
 wlandevent.5.d:0 "Случилось именно то, чего мы опасались: Вторая континентальная армия начала полномасштабное наступление с целью вернуть под контроль весь Мичиган, ныне находящийся в наших руках. Федерация прижата к стене, и нам остаётся лишь сражаться до тех пор, пока мы не завоюем свободу воплотить обещанное нами будущее."
 wlandevent.5.a:0 "Время вышло."

 wlandevent.6.t:0 "Моя душа"
 wlandevent.6.d:0 "Пока американская междоусобица продолжается, каждому из нас приходится переживать трудности - глобальные или сугубо личные. Жизнь в Мичигане была полна боли, и это тяжким грузом лежало на душе Джека Уолтена. Как он может защитить не только собственную семью, но и все семьи, доверившие ему своё будущее, если тени прошлого постоянно застилают ему взгляд? Но окончательно пересмотреть свои взгляды совладельца Bon's Burgers заставило ужасное состояние его жены Розмари.\n\nРози, обладающая особенно чувствительной душой, давно тревожится о будущем, в котором предстоит расти Эдду, Молли и Софи Уолтен. Смогут ли они когда-нибудь найти счастье в мире, настолько же сломанном, как тот, в котором сейчас оказалась вся семья Bunny Smiles? Происходящее сегодня может пугать, но в конце концов мы обязательно справимся.\n\nНачав с обеспечения безопасности собственной семьи, включая работников, которые оставались с BSI и в хорошие, и в тяжёлые времена, Джек Уолтен теперь обращает внимание на создание убежища для всех, кто находится под его защитой. Проект «Страна чудес» должен собрать лучших людей со всего штата ради создания мест, наполненных чудесами, где и дети, и взрослые смогут хотя бы ненадолго забыть о боли реальности. Задача может показаться непомерной, но господин Уолтен более чем способен справиться со всем самостоятельно, по крайней мере до тех пор, пока Феликс Кранкен не сможет помочь после завершения обязательной реабилитации от алкоголизма."
 wlandevent.6.a:0 "Пора снова начать жить."

 wlandevent.7.t:0 "Где Джек Уолтен?"
 wlandevent.7.d:0 "Похоже, в эти тёмные времена никто не способен избежать испытаний. Пока ужасы распада Америки неизменно преследуют мысли каждого жителя Мичигана, легко забыть об обычных трагедиях, о маленьких порезах, которые никогда не заживут до конца. Джек Уолтен верил, что сумеет избежать их и одолеть своё горе, но в конечном счёте не выдержал каскада трагедий, обрушившихся на его семью.\n\nЕщё до основания Свободной Федерации произошёл инцидент на охоте, окончательно подтолкнувший Феликса Кранкена к бутылке и последующему разводу с Линдой. Оба события привели к величайшей трагедии из всех: человек, которого некогда считали другом семьи, по собственной беспечности отправил маленьких Эдда и Молли Уолтен на смерть, после чего скрыл следы случившегося. Затем бесследно исчезли двое лучших сотрудников Джека, Сьюзан и Чарльз, а психическое состояние Розмари, любимой жены Уолтена, начало стремительно ухудшаться.\n\nГосподин Уолтен покинул свой пост, оставил всё, что успел построить, и больше его никто не видел. Последнее, что нам сообщила находившаяся в состоянии полного шока Рози, сводилось к тому, что «Бог испытывает их обоих» и всем следует забыть о Джеке. Вскоре госпожа Уолтен тоже погибла и присоединилась к кому-то другому в его Стране чудес. Теперь, когда Джека нет, будущее нашего Мичигана, штата, который должен стать прекрасным, переходит в руки «Бона» - Кролика Бона."
 wlandevent.7.a:0 "Я всё контролирую."

 wlandevent.8.t:0 "Технологические врата"
 wlandevent.8.d:0 "Похоже, несмотря на то что их работа, казалось бы, только началась, REGNAD Computing и многочисленные партнёры компании уже достаточно уверены в себе, чтобы продемонстрировать достижения, полученные благодаря новым методам исследований. В рамках серии ежемесячных отчётов о ходе работ, которые организация обязалась продолжать до тех пор, пока «клиент не будет удовлетворён», команда в составе управляющего Дункана Парнелла, организатора Кеннеди Силвы и руководителя направления искусственного компьютерного обучения Алексис Мур представила конкретные результаты своей деятельности.\n\nИ действительно, заявленная цель «предсказывать и предотвращать будущие технологические сбои» и «продвигать технологические открытия, особенно в области компьютерных вычислений и памяти» привела к такому росту исследовательских возможностей, какого прежде не видел ни один из наших учёных. От простых запросов и ответов до решения базовых задач и даже создания целых иных миров, воплощённых в форме «игр» и фильмов, команда Computing выполнила всё обещанное и даже больше. Однако к нам поступили тревожные сообщения о том, что один из объектов «ACL» оказался захвачен каким-то неизвестным разрастанием и вскоре был полностью покинут. Что именно там произошло, остаётся загадкой, и сама REGNAD до сих пор не дала никаких объяснений."
 wlandevent.8.a:0 "За этим определённо стоит присматривать."

 wlandevent.9.t:0 "С иголочки"
 wlandevent.9.d:0 "Взрослым нужно работать, надо лишь разобраться с одной мелочью."
 wlandevent.9.a:0 "Просто костюм."
