 continuous_naval_production: "Морское производство"
 continuous_naval_production_desc: "Сосредоточив ресурсы на наших верфях и освободив квалифицированных кораблестроителей от военной службы, мы можем значительно сократить время производства кораблей."
 continuous_air_production: "Авиационное производство"
 continuous_air_production_desc: "Мы можем реорганизовать нашу авиационную промышленность, чтобы устранить потери и упорядочить производство."
 continuous_non_factory_construct: "Строительная инженерия"
 continuous_non_factory_construct_desc: "В нашей строительной отрасли всё ещё остаётся немало неиспользованных резервов. Сосредоточив на ней внимание, мы сможем значительно повысить скорость строительства. К сожалению, производство станков оказалось главным узким местом в расширении нашей тяжёлой промышленности, поэтому усилия в этой области не принесут ему пользы."
 continuous_reduce_training_time: "Армейская подготовка"
 continuous_reduce_training_time_desc: "Создавая специализированные части углублённой подготовки в составе каждой дивизии, мы сможем отправлять на фронт даже те дивизии, которые прежде задерживались бы для завершения обучения."
 continuous_suppression: "Подавление сопротивления"
 continuous_suppression_desc: "Внедряясь в крупные группы сопротивления на оккупированной территории и перевербовывая их лидеров, мы можем значительно сократить ущерб, который они способны нанести."
 continuous_repair: "Восстановительное строительство"
 continuous_repair_desc: "Мы сформируем специализированные ремонтные бригады из фабричных и строительных рабочих и централизованно будем управлять их развёртыванием, чтобы ускорить восстановление повреждённой инфраструктуры."
 continuous_tech_share: "Обмен технологиями"
 continuous_tech_share_desc: "Мы будем поощрять наши исследовательские институты и университеты к сотрудничеству с их коллегами в союзных странах. Это даст нам бонус к обмену технологиями."
