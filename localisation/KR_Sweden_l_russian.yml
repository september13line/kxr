## Linderot ideas ##

SWE_linderot1: "Проявление шведского коммунизма"
SWE_linderot1_desc: "§RДавайте не упадём, как многие до нас.§!\n\nНевообразимое становится реальностью в Швеции: политические перемены, невиданные со времен революций, последовавших за Первой мировой войной, превращают Швецию в образцовое коммунистическое государство. Государство, которое готовит великого предвестника международного освобождения всех трудящихся, возникающего на улицах Стокгольма, где когда-то правили короли и аристократы. На их месте возникает не просто новое правительство, а маяк для угнетенных всего мира, призыв подняться и вернуть себе историю во имя коммунизма."

SWE_linderot2: "Рождение шведской революции"
SWE_linderot2_desc: "§RПробуждая свободу, восстает коммунизм.§!\n\nНевообразимое становится реальностью в Швеции: политические перемены, невиданные со времен революций, последовавших за Первой мировой войной, превращают Швецию в образцовое коммунистическое государство. Оно готовит великого предвестника международного освобождения всех трудящихся, возникающего на улицах Стокгольма, где когда-то правили короли и дворяне. На их месте возникает не просто новое правительство, а маяк для угнетенных всего мира, призыв подняться и вернуть себе историю во имя коммунизма."

SWE_linderot3: "Багровая Швеция"
SWE_linderot3_desc: ""§RОкрашенный в багровый цвет.§!\n\nНевообразимое обретает форму в Швеции: политический сдвиг, невиданный со времен революций, последовавших за Первой мировой войной, - превращение Швеции в образцовое коммунистическое государство. Оно готовит великого предвестника международного освобождения всех трудящихся, возникающего на улицах Стокгольма, где когда-то правили короли и дворяне. На их месте возникает не просто новое правительство, а маяк для угнетенных всего мира, призыв подняться и вернуть себе историю во имя коммунизма."

SWE_linderot_communism: "Партия без трений"
SWE_linderot_communism_desc: "Фракционность - это то, что положило конец многим величайшим революциям в мире, убив их ссорами и старыми политическими обидами, дав реакционерам время организоваться и действовать. Но не здесь, наша партия будет иметь одно видение, служить одной цели, чтобы не повторить судьбу многих других."

SWE_linderot_socialism: "Широкая революция"
SWE_linderot_socialism_desc: "Мы добьемся успеха не отвергая наших союзников, а принимая их различия. Благодаря нашим общим идеям и объединению наших других идей мы сможем открыть новую эру в Швеции."

SWE_linderots_nordic_revolution: "За красную Скандинавию!"
SWE_linderots_nordic_revolution_desc: "Мы хотим освободить не только себя, но и наших угнетенных братьев. Другие страны Скандинавии долгое время трудились под гнетом автократов и монархов, и только когда свобода прозвучит в Осло и Копенгагене, наша цель будет действительно достигнута."

SWE_linderots_forgiveness: "Маяк революции"

SWE_linderots_no_mercy: "Politbyrån"
SWE_linderots_no_mercy_desc: "Политбюро Центрального комитета Коммунистической партии Швеции, часто сокращенно называемое Политбюро (Politbyrån), является нервным центром революционного управления. Оно наделено полной властью и отвечает за обеспечение идеологической чистоты, соблюдение партийной дисциплины и руководство всеми аспектами политической жизни. Через Политбюро воля партии становится законом, а инакомыслие встречает быструю и бескомпромиссную реакцию."

SWE_linderots_renewed_reaction: "Конечная участь реакционеров"
SWE_linderots_renewed_reaction_desc: "Наша идеология, идеология почти забытого коммунизма, не является той, за которую изначально велась революция. Однако теперь, когда мы у руля, оставшиеся в Швеции умеренные и консерваторы воспользовались нашей нынешней нестабильностью как шансом для того, чтобы сеять хаос."

SWE_linderots_flyg_resistance: "Фанатичный хаос Флига"
SWE_linderots_flyg_resistance_desc: "Не довольствуясь своим поражением, Нильс Флюг и его оставшиеся синдикалистские пешки начали открыто бросать нам вызов, поджигая магазины и устраивая беспорядки в тех немногих местах, где они имеют влияние. Необходимо что-то предпринять."

SWE_hugo_international: "Коммунизм в отдельно взятой стране"
SWE_hugo_international_desc: "Идея Уго Силлена «Коммунизм в одной стране» основана на убеждении, что перед тем, как начать международную революцию, необходимо стабилизировать Швецию. Создав самодостаточную экономику внутри страны, Швеция легко станет маяком для всего капиталистического мира, открыв возможность постепенной международной революции вместо революции, вызванной немедленным конфликтом."

SWE_linderot_international: "Ограниченная международная поддержка"
SWE_linderot_international_desc: "Хотя международная миссия остается в центре внимания партии, с нашей позиции такое предприятие остается опасным. Поддерживая другие социалистические и коммунистические страны за рубежом, мы можем надеяться в конечном итоге осуществить международную революцию."

SWE_linderot_international_heavy: "Приоритет международной революции"
SWE_linderot_international_heavy_desc: "Миллионы людей остаются в клетке капитализма, и только нашей волей мы сможем их освободить. Никакая цена не будет слишком высокой, никакая жертва не будет слишком велика, ведь на карту поставлена свобода всего мира."


## Флюг ideas ##

SWE_flygs_FNS_idea: "Folkets Nationella Säkerhetspolis"
SWE_flygs_FNS_idea_desc: "§RПод бдительным оком единство - это все, что остаётся.§!\n\nFolkets Nationella Säkerhetspolis (FNS) - это грозная тайная полиция, посвятившая свою жизнь защите революции. Их задача - искоренять контрреволюционные элементы по всей Швеции, и они безжалостно и эффективно подавляют оппозицию, обеспечивая полное единство и силу под руководством правительства Флига."

SWE_flyg_industrialisation_idea1: "Смелое продвижение Флюга"
SWE_flyg_industrialisation_idea1_desc: "План «Смелое продвижение», разработанный Нильсом Флюгом, воплощает его амбициозное видение превращения Швеции в промышленную державу в течение нескольких лет. Планируется мобилизовать рабочую силу посредством коллективных трудовых инициатив, быстрого строительства и агрессивной добычи ресурсов."

SWE_flyg_industrialisation_idea2: "Смелое продвижение Флюга"
SWE_flyg_industrialisation_idea2_desc: "После полного успеха начальных этапов плана «Смелое продвижение», план был переработан с целью дальнейшего расширения производства стали и массовой механизации сельского хозяйства. Несмотря на обещания беспрецедентного роста Швеции, нынешнее неустанное стремление к увеличению производства нанесло некоторый ущерб стабильности правительства."

SWE_flygs_totalism_1: "Национальный синдикализм под руководством Флюга"

SWE_flygs_newspaper_idea: "Folkets Dagblad Politiken"

SWE_flygs_church_idea: "Освобождение от опиума"



## Lindholm Tot ideas ## 

SWE_lindholm1: "Начало национальной революции"
SWE_lindholm1_desc: "Швеции нужно возрождение. Владыки предавали шведских рабочих и шведскую душу, и теперь эта душа разбита, сломана, беспомощна. Но душа будет жить снова. Выделяя исторические успехи и сравнивая их с национальной революцией, которая разворачивается в настоящее время, Линдхольм стремится показать, что действия по национализации промышленности и политический фанатизм следуют по стопам великих и непорочных."

SWE_lindholm2: "Развитие национальной революции"
SWE_lindholm2_desc: "Что влечет за собой национальная революция? Линдхольм знает, его партия знает, и вскоре узнает и нация. Необходимо не что иное, как полное омоложение всего национального духа и менталитета, и не что иное, как полная государственная власть. В городах национальная революция наконец-то достигла своей полной силы, в то время как в сельской местности остаются очаги сопротивления, сгруппированные вокруг мятежных солдат, мошеннических священников и крестьян, обманутых обещаниями реакции."

SWE_lindholm3: "Истинная национальная революция"
SWE_lindholm3_desc: "Линдхольм победил, а это значит, что победила партия, а это значит, что победил народ. Национальная революция теперь охватила всю страну, от самого маленького острова до самой высокой вершины, в поместьях, когда-то принадлежавших безумным толстосумам, воспитывается новое поколение членов партии, а в школах по всей стране висит большой портрет Линдхольма. Государство является абсолютным не только в промышленности и финансах, но и в сердце каждого здравомыслящего шведа."

SWE_red_resistance_lind: "Синдикалистское сопротивление"
SWE_red_resistance_lind_desc: "Синдикализм имеет свои преимущества... Но основной синдикализм парижского типа перестал нравиться Линдхольму. Хотя раньше его терпели как неприятность, как клеща на теле страны, в последнее время синдикалисты подняли мощную волну в сельской промышленности, борясь против новых планов шведского государства. Хотя эти агитаторы и бандиты могут думать, что они могут свергнуть правительство, Линдхольм знает, что они остаются только благодаря доброте движения Линдхольма. Один приказ уничтожит их всех."

SWE_red_new_guard: "Усовершенствованная красная гвардия"
SWE_red_new_guard_desc: "Красная гвардия когда-то была пограничным мятежным элементом в новом шведском обществе, но теперь она была усовершенствована и превратилась в настоящую сплоченную и лояльную силу партии. Красная гвардия больше не выбирает своих лидеров, как в период расцвета революции, у нее есть хорошо образованные офицеры и каролианская железная вера в своего лидера. Члены Красной гвардии, называющие себя Rödgardister, горды и преданны целям национальной революции."

SWE_false_reds: "Ложные социалисты"
SWE_false_reds_desc: "Партия должна признать неприятный факт: среди нас есть самозванцы. Социал-демократы и псевдокапиталистические профсоюзные деятели проникли в движение и в нацию в целом, и их необходимо искоренить любыми средствами. Красная гвардия уже мчится по улицам на грузовиках и самодельных бронемашинах, преследуя людей из списков, в надежде очистить правительство от этой гнили, пока она не распространилась."

SWE_new_statare_red: "Красноокрашенные статари"
SWE_new_statare_red_desc: "Старых Статаре больше нет, и нация ликует. После проведения земельной реформы и запрета на выплату рабочим и крестьянам заработной платы в любой валюте, кроме государственной, старые Статаре фактически исчезли. Вместо них на фермах и полях трудятся бывшие контрреволюционеры, вынужденные работать в сельской местности в течение всего срока своего наказания. Хотя критики могут назвать это просто системой Статаре с социалистическими лозунгами, даже эти заключенные получают лучшее обращение и лучшее жилье, чем Статаре прошлых лет."

SWE_nat_pop_allies: "Альянс «Кросс-Айл»"
SWE_nat_pop_allies_desc: "Линдхольм может быть революционным лидером, но он также является прагматиком. По другую сторону прохода, в секретных клубах и ассоциациях, находятся остатки старого движения, которое не так уж отличается от движения Линхольма. Хотя некоторые из этих элементов до смешного ксенофобны и граничат с государственной изменой, Линхольм решил по крайней мере пригласить их в союз по удобству. В конце концов, даже такой мошенник, как Биргер Фуругорд, может согласиться с тем, что Линхольм ценит нацию превыше всего."

SWE_lindholm_police_tot: "Всезнающая партия"
SWE_lindholm_police_tot_desc: "Партия знает то, что ей нужно знать. Информация, которой партия не располагает, не является информацией, которая ей нужна. Подобно Хугину и Мунину из древней мифологии, сегодняшний партийный аппарат собирает всю информацию, которую может найти, хранит её для сохранности и делает все возможное, чтобы знать и понимать как можно больше как о самой партии, так и о недобросовестных элементах в обществе в целом. В каждом городе и поселке скрываются осведомители, часто используются прослушивающие устройства, а подрывные элементы сводятся к минимуму."

SWE_lindholm_church_destroyed: "Нация без веры"
SWE_lindholm_church_destroyed_desc: "Свен Олов Линдхольм не соглашался с Марксом во многих вопросах, но с идеей Маркса о том, что религия является реакционным элементом, Линдхольм полностью согласен. Благодаря согласованной кампании запугивания и принуждения Швеция станет атеистическим государством не только по названию. Пусть социалисты на континенте спорят о том, как решать вопрос религии, ведь Швеция уже нашла ответ. Любая церковь, имеющая достаточный возраст и эстетическую ценность, будет преобразована в общественный центр, а простые деревянные церкви и храмы меньших конфессий будут разрушены."

SWE_lindholm_church_transformed: "Крисмонские проповеди"
SWE_lindholm_church_transformed_desc: "Линдхольм не является религиозным человеком, но он прагматичен. Поскольку шведская церковь так тесно связана со шведским государственным аппаратом в целом, Линдхольм решил не уничтожать её полностью, а подвергнуть её подрывной деятельности. Реакционные священники были изгнаны, а на их место пришли новые, идеологически преданные священники, и в церквях по всей стране верующие слушают проповеди о Линдхольме, Боге и Иисусе... В таком порядке."

## Military coup ideas ##

SWE_red_resistance_mil: "Левое сопротивление"
SWE_red_resistance_mil_desc: "Когда армия вмешалась, чтобы спасти страну от катастрофы, она действовала с пониманием того, что левые, давно вышедшие из-под контроля, будут усмирены. Сначала армия нацелилась только на наиболее радикальные левые силы, но вскоре переключила свое внимание на левые профсоюзы и ассоциации, пытаясь полностью уничтожить красных. Социалисты всех мастей и цветов, от синдикалистов до тоталитаристов, по-прежнему активны в отдельных районах по всей стране, борясь с новым режимом."

SWE_starting_martial_law: "Военное положение"
SWE_starting_martial_law_desc: ""

SWE_unending_martial_law_idea: "Бессрочное военное положение"
SWE_unending_martial_law_idea_desc: "Армия находится у власти и будет оставаться там в обозримом будущем. Солдаты вместе с полицией охраняют улицы, газеты, враждебно настроенные по отношению к новому положению дел, были закрыты, а их редакторы арестованы, а забастовки рассматриваются как мятежные действия."

SWE_army_symbol: "Военная символика"
SWE_army_symbol_desc: "Армия предпринимает активные усилия, чтобы завоевать расположение населения в целом. С помощью плакатов, радиопередач, фильмов и брошюр армия стремится стать неотъемлемой частью шведской души, стать такой же шведской, как и само понятие флага. Сравнивая отважных лидеров переворота с такими героями, как Энгельбрект Энгельбректссон и Густав Васа, армия явно хочет, чтобы народ принял новое правительство и переворот как необходимое для нации."

SWE_radical_paramilitary_support: "Поддержка радикальных националистов"
SWE_radical_paramilitary_support_desc: "Хотя армия твердо держит страну под контролем, она получает помощь от белой гвардии Svea Rikes Nationella Samlingsparti. Возглавляемая Арчибальдом Дугласом и преданным антикоммунистом Мартином Экстрёмом, эта небольшая, но фанатичная партия и её боевое подразделение заявляют о своем наследии от финской гражданской войны, где Экстрём командовал батальоном, а затем полком против красных. Дисциплинированное, но склонное к насильственным излишествам, боевое подразделение в основном развернуто в сельской местности против изолированных групп социалистических агитаторов."

SWE_general_security_agency_idea: "Объединённые службы безопасности"


## Jung Ideas ##

SWE_pataut1: "Основание военной концепции"
SWE_pataut1_desc: "Хотя Юнг организовал переворот против правительства, у него никогда не было четкого плана по построению правительства после переворота. В настоящее время различные правительственные учреждения с трудом функционируют, поскольку бывшие члены гражданской службы, лояльные прежнему правительству, либо бежали за границу, либо ушли в подполье, и поэтому армия вынуждена заполнять пробелы. Должности, которые ранее занимали министры правительства, в основном заняты идеологически лояльными политиками или офицерами, и хотя нет какого-то грандиозного плана, армейская рутина и дисциплина означают, что, как только Юнг и его соратники по заговору определятся с курсом действий, изменения будут реализованы быстро."

SWE_pataut2: "Развитие военной концепции"
SWE_pataut2_desc: "По мере того как армия продолжает распространять свое влияние на шведское общество, Юнг и его соратники укрепились в своем видении того, какой должна стать их Швеция. Сильная, независимая и не склоняющаяся ни перед кем, Юнг видит страну, где армия и народ едины, где молодежь считает призыв в армию и службу в ней своим долгом. Промышленность будет работать на шведское государство, прибыль будет вторична по отношению к здоровью нации, а семья будет защищена от нешведских идей."

SWE_pataut3: "Армейская сила патриотизма"
SWE_pataut3_desc: "Как и в эпоху великой державы, шведская армия является неотъемлемой частью государства, а на данный момент практически и есть государство. Гражданские политики по-прежнему существуют, но перед вступлением на любую должность в правительстве они проходят проверку, гражданская служба перестраивается с явно более патриотическим уклоном, чем раньше, а полиция по сути является подразделением армии. Если бы Карл XII смотрел на нас с небес, он наверняка был бы горд."

SWE_jungs_vision: "Оборонительная стратегия Юнга"
SWE_jungs_vision_desc: "Союз хорош только до тех пор, пока он гарантирует независимость входящих в него сторон, по крайней мере, так считает Юнг. Отвергая идею сложных вторжений за рубежом или колониальных предприятий, Юнг считает, что Швеция должна найти или непосредственно создать альянс государств-единомышленников, стремящихся сохранить независимость в эпоху конфликтов. Пока немцы, французы и русские строят коварные планы по уничтожению друг друга, шведскому льву предстоит каким-то образом маневрировать в метафорической саванне международной дипломатии."

SWE_alllied_companies: "Военизированные компании"
SWE_alllied_companies_desc: "AB Landsverk, Volvo, SAAB, Götaverken и многие другие компании пришли к соглашению с новым правительством. После принуждения и рукопожатий, выпивки и угроз шведская промышленность встала за правительство и армию. Подобно соглашению, заключенному между правительством в Берлине и Круппом, шведское государство наконец-то обрело поставщиков, на которых оно может положиться."

SWE_pataut_natpop: "Националистическая военная диктатура"
SWE_pataut_natpop_desc: "Армия - это больше, чем просто сила для ведения войн или защиты страны, она фактически является духовным агентом в жизни своего народа. Шведская армия предназначена для шведов и других братских народов, и именно благодаря этой связи шведские правые испытывают особую любовь к своим вооруженным силам. Как и Георг Карл фон Дёбельн, который сражался в Финляндии вопреки всем прогнозам, лидеры страны считаются героическими националистами, достойными уважения."

