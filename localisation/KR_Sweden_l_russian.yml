swedem.0.t: "Общая избирательная лига обеспечивает победу"
swedem.0.d: "Являясь оплотом консерватизма в Швеции, Общая избирательная лига под руководством Йёста Багге одержала победу на выборах. Эта победа была несколько неожиданной из-за растущей популярности Пер Альбина Ханссона, но, по-видимому, реакция Багге на кризис «Черного понедельника» завоевала достаточное доверие, чтобы его партия смогла одержать победу. Наряду с этим, поддержка со стороны их либертарианских союзников из Народной партии под руководством Густафа Андерссона позволила Багге обеспечить большинство мест в Риксдаге, что, как можно надеяться, позволит им принимать законопроекты и законы без особого сопротивления со стороны левых.\n\nВпереди ещё многое предстоит сделать. Несмотря на успех в первоначальной реакции на Чёрный понедельник, его экономические последствия по-прежнему наносят ущерб Швеции, и их устранение стало главной задачей правительства на будущее."
swedem.0.a: "Стабильность в рамках традиций."

swedem.1.t: "Общая избирательная лига определяет свои цели"
swedem.1.d: "Общая избирательная лига является основной консервативной партией в шведской политике, возглавляемой бывшим адмиралом, а впоследствии премьер-министром Линдманом. Она определяет себя как партию, придерживающуюся умеренного корпоративистского подхода к экономике с позиций протекционизма, при этом поддерживая социальную сплоченность и традиции. Партия пользуется поддержкой многих избирателей, которые поддерживают нынешнюю монархию, позиционируя себя как единственную партию, которая полностью поддерживает позицию короны. Йёста Багге и его партия теперь намерены решить проблемы, которые, по их мнению, мешают развитию Швеции, и позиционировать Швецию на мировой арене либо как нейтральный фактор, сосредоточенный на своей собственной обороне, либо как часть одной из основных фракций, играющих свою роль в международном сотрудничестве, либо как страну, изолированную от своих северных соседей в стремлении к северному единству. В связи с этим партия вновь сформировала официальную коалицию с Народной партией, стойкой классической либеральной партией, которая в значительной степени совместима с Избирательной лигой. Такие отношения дают Багге необходимые места для доминирования в Риксдаге и ставят его партию в выгодное положение по отношению к оппозиции."
swedem.1.a: "Мы сделаем «Адмирала» гордым!"

swedem.2.t: "Победа на выборах одобрена армией"
swedem.2.d: "Многим в Швеции хорошо известно, что некоторые генералы шведских вооруженных сил придерживаются правых взглядов. Существуют отдельные клики, такие как те, которые поддерживают генерала Арчибальда Дугласа, придерживающегося ультранационалистических взглядов, или те, которые поддерживают Хельге Юнга, придерживающегося более традиционалистских взглядов, что укрепляет консервативную базу поддержки.\n\nУчитывая наличие этих групп, правительство предприняло явные попытки заручиться поддержкой, финансируя военный аппарат в очевидной попытке ещё больше привлечь армию на сторону нынешнего правительства. Хотя сближение с ультранационалистами вызовет массовый политический протест со стороны оппозиции и социалистов, более умеренные силы в армии обеспечат столь необходимую стабильность в эти неспокойные времена."
swedem.2.a: "Генералы, тост?"

swedem.3.t: "Северный бастион"
swedem.3.d: "Наконец, неустанные усилия Избирательной лиги принесли свои плоды, и экономическая катастрофа «Черного понедельника» теперь осталась в далеком прошлом. Укрепленная непоколебимой поддержкой вооруженных сил и продолжающимся успехом сильного протекционистского рынка, Лига наконец-то может наслаждаться своим заслуженным триумфом. То, что когда-то казалось непреодолимой задачей - конкуренция с социал-демократами Ханссона на выборах - было решительно преодолено. Решающим поворотным моментом стало стратегическое союз между Избирательной лигой Багге и Народной партией Густава Андерссона, ориентированной на рыночный либерализм. Это партнерство обеспечило важные места в Риксдаге, превысив порог общего большинства и фактически предоставив коалиции возможность с легкостью принимать законы. Благодаря этой новой власти были начаты радикальные экономические и политические реформы. Одним из наиболее значительных изменений стало введение корпоративной экономической модели, призванной ещё больше расширить промышленную базу Швеции. Благодаря укреплению сотрудничества между правительством, бизнесом и профсоюзами эта система позволяет более разумно распределять ресурсы, эффективнее планировать городское строительство и развивать новые отрасли промышленности. В результате ускорился экономический рост и начало улучшаться общее качество жизни всех шведов.\n\nВопреки всем прогнозам, Багге и его партия не только укрепили свое доминирующее положение в шведской политике, но и заложили основу для новой эры процветания и стабильности."
swedem.3.a: "Традиции и благочестие обеспечены."

###Market Liberal events###
swedem.4.t: "Первая победа такого рода"
swedem.4.d: "Никто не может отрицать, что такая победа казалась практически невозможной, что небольшая партия могла бы занять такое положение, при котором в коалиции, в которой она была меньшим партнером, оказалась бы на вершине. Вопреки всем прогнозам, Народная партия теперь занимает доминирующее положение в Риксдаге, и с этим пришла возможность реализовать свои амбиции, конечно, с одобрения Всеобщей избирательной лиги."
swedem.4.a: "Классический либерализм на крайнем Севере? Возможно..."

swedem.5.t: "Народная партия"
swedem.5.d: "Народная партия (Folkpartiet) занимает место в центре политического спектра, заявляя о своей приверженности принципам классического либерализма, выступая за более свободный рынок и расширение гражданских свобод. В настоящее время партия возглавляется сторонником изоляционизма Густафом Андерссоном, тесно сотрудничает с Избирательной лигой и остается в тесной коалиции с ней. Однако некоторые высказывания Андерссона содержали резкую критику правительств Третьего Интернационала, что привело к напряженности в отношениях с Лондоном и Парижем. Используя связи в коалиции, партия смогла выйти вперед на выборах, поскольку её места стали жизненно важными для обеспечения большинства в Риксдаге для консерваторов Багге.\n\nБлагодаря этой победе Андерссон и его некогда незначительная партия теперь имеют шанс принести в Швецию истинный либерализм, равенство среди населения и стабильность на мировой арене."
swedem.5.a: "Настоящая свобода и независимость!"

swedem.6.t: "Переезд в сельскую местность"
swedem.6.d: "Хотя большая часть нашей поддержки исходит от тех, кто работает в зданиях наших городов, а наши консервативные союзники привлекают свою собственную группу поддержки, в Швеции существует в значительной степени игнорируемая часть общества - мелкие фермеры. В то время как многие крупные фермы в Швеции, принадлежащие богатым людям, обычно голосуют за консерваторов, многие мелкие фермеры склонны голосовать либо за социал-демократическую партию Ханссона, либо за меньшую по размеру Фермерскую лигу. Фермерская лига занимает политическую позицию, близкую к нашей, представляя более аграрную избирательную базу. её члены придерживаются либеральных экономических взглядов и прогрессивных взглядов в области социальной политики. Хотя мы время от времени расходимся с ними по социальным вопросам, мы находим много общего в отношении экономики. Мы можем предложить им место в нашей коалиции, уступив часть нашей власти в обмен на расширение и укрепление нашей базы поддержки, а также увеличение числа наших мест в Риксдаге. Такой шаг будет сопровождаться компромиссом: мы позволим им сосредоточиться на улучшении положения фермеров в Швеции, однако наши союзники из Общей избирательной лиги вряд ли одобрят такой шаг, и в свою очередь нам придется дать им некоторые гарантии для сохранения коалиции. Или мы могли бы просто игнорировать эту небольшую партию, ведь у нас уже есть поддержка консерваторов, так зачем нам нужна партия мелких фермеров и аграриев? Выбор за нами."
swedem.6.a: "Отправьте предложение, вместе мы сильнее."
swedem.6.b: "Такая группа дестабилизирует нашу нынешнюю коалицию."

swedem.7.t: "Первый в своем роде"
swedem.7.d: "Шведский либерализм долгое время был движущей силой прогресса в Швеции, но после испытаний и невзгод, расколов и преобразований казалось, что либеральное движение в холодном севере вот-вот исчезнет. Однако после впечатляющей победы на последних выборах, когда избиратели мудро поддержали широкую политику капитализма с социальными ценностями, Folkpartiet остается сильным как никогда. Следуя за такими дальновидными либералами, как Карл Стаафф в 2005 году, который помогал бороться за избирательные права, а также за преданной политике компромисса последнего либерального премьер-министра Нильса Эдена в 1920 году, Швеция сегодня стоит сильной и верной, гордясь своими либеральными ценностями, с народом, довольным своим заботливым государством."
swedem.7.a: "Карл Стаафф был бы горд!"

swedem.8.t: "Оттенки корпоративизма"
swedem.8.d: "Корпоративизм, идея о том, что само тело, корпус нации, является интегрированной и жизненно важной частью благосостояния нации, уже довольно долгое время привлекает шведских правых. Утверждая, что классовые различия - это всего лишь социалистические споры, а либерализм только усугубил раскол в обществе, более радикальные представители AV теперь открыто выступают за переход к шведскому корпоративизму или, по крайней мере, за обсуждение этого вопроса и того, как он будет выглядеть. Удивительно, но социал-демократ Таге Эрландер положительно относится к этому, утверждая, что благодаря продолжающемуся сотрудничеству с LO и экономическому консенсусу между правыми и SAP шведская промышленность будет процветать, что приведет к повышению уровня жизни и социальной гармонии. Хотя Швеция вряд ли в ближайшее время станет корпоративным государством, базовое понимание этого явления и появление социального договора, по которому промышленность заботится о своих работниках, а работники в свою очередь заботятся о промышленности, означает, что это лишь вопрос времени... По крайней мере, до тех пор, пока либералы не добьются своего."
swedem.8.a: "С этим социальным договором Швеция будет процветать!"

swedem.9.t: "Укоренившийся консерватизм"
swedem.9.d: "Швеция долгое время была консервативной страной, несмотря на либеральные и социальные тенденции, кипевшие под поверхностью, но шведский консерватизм никогда не был столь консервативным, как предполагает этот термин. Под руководством Арвида Линдмана в 2007 году шведы наконец получили право голоса, и при Арвиде Линдмане социализм был сдержан благодаря победе над Хьялмаром Брантингом, а затем и над протеже Брантинга Пер Альбином Ханссоном на последующих выборах. Швеция долгое время была в долгу перед Линдманом, и теперь, после того как избиратели проголосовали за правых на последних выборах, этот долг был погашен. Сегодня Швеция является оплотом современного консерватизма, умеренного и стойкого в любви к стране, королю и Богу."
swedem.9.a: "Gud bevare Sverige!"


###Socdem events###
swedem.10.t: "Ожидаемая победа"
swedem.10.d: "В том, что многие считали вероятной убедительной победой, Ханссон и его соратники одержали победу на выборах, получив большинство мест в парламенте, занятых членами Sveriges socialdemokratiska arbetareparti. Партия выступает за увеличение государственного социального обеспечения, равные права и относительно нейтральную внешнюю политику. Их «золотое яйцо» - Фолькхеммет, придуманный самим Ханссоном, представляет собой «Дом народа». Экономическая система, использующая капитализм в своих интересах для помощи и поддержки народа Швеции. Благодаря значительным инвестициям в сектор здравоохранения, а также в улучшение инфраструктуры, Фолькхеммет стремится полностью преобразовать Швецию в социал-демократический бастион, подобного которому ещё не было нигде. Поскольку страна все ещё не оправилась от экономических потрясений Черного понедельника, а население требует результатов, Ханссону предстоит нелегкая работа."
swedem.10.a: "Впереди много дел!"

swedem.11.t: "Фолькхеммет"
swedem.11.d: "Фолькхеммет, известный как «Дом народа», является основной платформой Ханссона. Это видение лучшего шведского общества, в котором нация является домом для всех своих граждан, где все получают равную заботу. Независимо от класса или происхождения, оно поддерживает идею коллективной заботы обо всех в Швеции, подчеркивая солидарность. Отходя от обычных идеалов отмены капитализма, как многие другие более социалистические правительства, Фолькхеммет Ханссона стремится гуманизировать и улучшить капитализм через государственное вмешательство и сотрудничество между профсоюзами, предприятиями и центральным правительством.\n\nНаиболее важным аспектом этого является план социального обеспечения, национальная государственная система социального обеспечения, открытая для всех граждан. Обеспечение легкого доступа к здравоохранению, образованию и возможностям трудоустройства. Хотя противники Ханссона считают это идеалистическим, он и его партия надеются, что такой план может быть и будет реализован."
swedem.11.a: "Сама основа нашей миссии."

swedem.12.t: "Смеяться над радикалами"
swedem.12.d: "До выборов Ханссон не исключал возможности сотрудничества с радикалами из SSV, учитывая вероятность того, что партия не наберет достаточное количество мест для обеспечения большинства в Риксдаге. Однако теперь, учитывая наше предположение о национальном лидерстве и победе на выборах, мы можем вновь изгнать этих радикалов. Позволяя нам привлечь к нашей cause непокорных социальных либералов и центристов, отказ от таких незначительных, но громких радикальных элементов в Швеции будет иметь большое значение для улучшения стабильности.\n\nПрочь таких радикалов, шведская корона будет дарить надежду и богатство всем под её властью!"
swedem.12.a: "Демократия не просто важна, она жизненно необходима!"

swedem.13.t: "Воплощение мечты Фолькхеммета"
swedem.13.d: "После долгих месяцев упорного труда партия SAP Ханссона достигла того, что многие считали невозможным. Используя основы капитализма, Ханссон сформировал в Швеции новую гуманистическую модель, не основанную на эксплуатации. Обеспечивая социальную защиту даже самым бедным слоям населения страны, строго защищая права работников и профсоюзов, трудно представить, что страна по-прежнему остается в сфере капитала. Тем не менее, SAP каким-то образом достигла своей цели, создав уникальную шведскую «Folkhemmet», или «Народный дом». Наряду с этим экономическим чудом, в Риксдаг вновь вернулась политическая стабильность, были разрешены конструктивные дебаты и дискуссии, что вселило в шведское население новую надежду. Неизвестно, сможет ли такой рынок, ориентированный на интересы народа, продолжать существовать в долгосрочной перспективе в окружении эксплуататорских капиталистов, но известно, что шведский народ готов вновь встать на защиту своих прав."
swedem.13.a: "Здесь никто не стремится получить выгоду за счет других!"

swedem.14.t: "Статус статаре"
swedem.14.d: "Статаре, остатки демографического бума 19 века в Швеции, по-прежнему являются ярким напоминанием о неравенстве, которое все ещё существует в современной Швеции. Несмотря на свою жизненную важность для сельскохозяйственной экономики, этот класс рабочих страдает от суровых условий, бедности и эксплуатации, что противоречит прогрессу, которого мы достигли как нация.\n\nХотя полная отмена системы Статаре может повлечь за собой риск экономической нестабильности в краткосрочной перспективе, крайне важно, чтобы мы начали избавлять их от их бедственного положения. Улучшая их доступ к здравоохранению, образованию и социальной поддержке, мы можем начать устранять глубокие различия, которые сохраняются в нашем обществе. Это ещё один большой шаг к осуществлению мечты о социал-демократической Швеции, гарантирующей всем шведам достойную и равную жизнь."
swedem.14.a: "Больше никакого угнетения."

swedem.15.t: "Выравнивание позиций Фермерской лиги"
swedem.15.d: "На политической арене Швеции, помимо общей консервативной правой и социал-демократической левой, существуют две партии. Это Народная партия и Фермерская лига, причем Народная партия представляет небольшую группу сторонников классического либерализма, которые в начале 20-х годов оставались нашими второстепенными союзниками в борьбе за социальные реформы. Однако в последние годы она быстро сместилась вправо, поскольку прямо противостоит нашей политике национализации некоторых частных предприятий. Хотя на данный момент она по-прежнему решительно выступает против любой официальной формы коалиции, Фермерская лига представляет собой ещё одну умеренную и более близкую нам по политическим взглядам партию. Являясь своего рода неофициальным членом нашей коалиции, не соглашаясь с некоторыми из наших политических мер, которые считаются слишком «социалистическими», они в целом остаются с нами на одной волне. Официально оформив коалицию с ними, мы сможем расширить наше правительство и увеличить количество мест в Риксдаге, а также лучше услышать потребности мелких фермерских хозяйств и фермеров по всей Швеции."
swedem.15.a: "Да, они наши соперники, но тем не менее наши друзья!"


###Radsoc events###
swedem.16.t: "Шокирующий результат"
swedem.16.d: "Хотя идея коалиции между SAP и SSV казалась маловероятной из-за очевидной популярности одной только SAP, похоже, что из-за меньшего количества голосов, чем необходимо для большинства, SAP объединилась с SSV в отчаянной попытке стабилизировать Риксдаг. Такая коалиция дает Ханссону достаточно мест для получения большинства, но ставит его в трудное положение, поскольку он вынужден отдавать такие места радикалам в парламенте."
swedem.16.a: "Как долго продлится это беспокойство?"

swedem.17.t: "Расширение коалиции"
swedem.17.d: "Чтобы действительно закрепить настоящую революцию в Швеции, чтобы бороться с реакционными врагами, которые стоят перед нами, мы должны объединиться с нашими идеологическими братьями. Отбросив в сторону мелкие споры по поводу незначительных политических решений, наши различия между социализмом и синдикализмом, потому что реакционеры не пощадят нас. Они будут изо всех сил пытаться разделить нас, уничтожить любую возможность обрести истинную свободу от угнетения капитализма, но объединившись, они не имеют никаких шансов. Мы должны протянуть руку и создать единый фронт социал-демократов, социалистов, синдикалистов, а также гораздо более маргинальных групп, таких как национальные синдикалисты и коммунисты, чтобы вместе защищать Швецию."
swedem.17.a: "Настоящая левая коалиция."

swedem.18.t: "Телеграмма в Париж"
swedem.18.d: "Как новорожденная социалистическая нация, мы должны протянуть руку тем, кто придерживается схожих идеологий. Никто не подходит для этого лучше, чем Третий Интернационал. Сегодня вечером мы отправим телеграмму в Париж, сердце мировых революций, с просьбой о поддержке и помощи в наших предстоящих борьбах против реакционных сил. Интернационал не скрывает, что любая страна, желающая обратиться к ним, может рассчитывать на их поддержку, и такая помощь будет неоценимой в предстоящих сражениях."
swedem.18.a: "Они посылают свои наилучшие пожелания и оружие!"

swedem.19.t: "Свержение короны"
swedem.19.d: "Настал день, когда наша величайшая цель может наконец быть достигнута: упразднение традиционной монархии и свобода для шведских рабочих. После того, как законопроект был внесен в Риксдаг, растущая коалиция SSV-SAP вместе со своими радикальными союзниками проголосовала за него. Консервативные AV и Народная партия выразили резкое несогласие, однако из-за меньшинства мест в парламенте они не смогли легально противостоять законопроекту. Многие из их членов в знак протеста покинули зал, отказываясь верить в идеалы шведской республики, но их поддержка не была нужна. Сегодня Пер Альбин Ханссон обращается к нации, объявляя об отречении бывшей монархии и введении республиканской системы."
swedem.19.a: "Да здравствует Республика!"

swedem.20.t: "Закон о национальном медицинском страховании"
swedem.20.d: "Доступ к медицинскому обслуживанию является практически необходимостью в современном мире, и такие услуги не должны быть недоступны для тех, кто не может себе их позволить. Таким образом, созданы основы для медицинского обслуживания по всей стране. Это позволит всем законным жителям Швеции получить доступ к базовым медицинским услугам. Оппозиция утверждает, что это создаст слишком большую нагрузку на нашу экономику, а некоторые больницы осуждают вопросы национализации и приватизации. Несмотря на эти проблемы, мы будем реализовывать наш план на благо всех шведов, как сейчас, так и в будущем."
swedem.20.a: "Это естественная обязанность."

swedem.21.t: "Создание Национальных сил безопасности"
swedem.21.d: "Война окружает нас, или скоро окружит, и в случае конфликта, который достигнет нашей территории, нация должна быть готова. Национальные силы безопасности (Nationella skyddsstyrkorna) будут сформированы из бывших подразделений ополчения и профессиональных солдат, которые будут размещены на частных и государственных заводах, ключевых транспортных узлах и в правительственных зданиях. Эти храбрые люди будут защищать страну в случае нападения, если такое будущее наступит. Их лидер, Густав Петри, полон решимости защищать Швецию с помощью этих людей, делая все возможное."
swedem.21.a: "В случае войны, а не когда."

swedem.22.t: "Национальная автомагистраль"
swedem.22.d: "С приходом к власти Народной партии Швеция смело вступает в современную эру развития инфраструктуры. Правительство обнародовало свой амбициозный план по строительству первой в стране национальной автомагистрали, магистральной трассы, проходящей от портового города Мальмё на юге до столицы Стокгольма. Сторонники этой инициативы в правительстве утверждают, что она повысит экономическую эффективность, облегчит перемещение войск в случае необходимости и сблизит регионы Швеции. Критики обеспокоены стоимостью проекта, но пока что асфальт будет укладываться."
swedem.22.a: "Пусть Швеция движется вперед!"

swedem.23.t: "Замалчивание синдикалистов"
swedem.23.d: "На фоне роста политической напряженности в Европе и слухов о революции, доносящихся из-за рубежа, Генеральная избирательная лига заняла жесткую позицию по отношению к тем, кого она называет «подрывными социалистическими и синдикалистскими агитаторами». Заявив, что крайне левые представляют явную и непосредственную угрозу шведскому демократическому порядку, правительство ввело полный запрет на деятельность партий, от революционных социалистов до коммунистов. В то время как защитники гражданских свобод осуждают этот шаг как авторитарное превышение полномочий, консерваторы хвалят его как необходимую меру для сохранения мира и стабильности в королевстве. От Интернационала пока не поступило никакого ответа, однако вполне вероятно, что он не одобрит эту меру."
swedem.23.a: "Твердая рука обеспечивает безопасность нации."

swedem.24.t: "Военные уходят из политики"
swedem.24.d: "После того как SSV не смогла войти в основной политический поток Швеции, а также после заверений со стороны SAP, что они ненавидят синдикалистов не меньше, чем они, «Хунта» Юнга распалась. Поскольку правительство сосредоточилось на увеличении военных расходов и дальнейшей экспансии, все, о чем просили Юнг и его соратники, постепенно становится реальностью. Разрабатываются новые истребители, планируются новые корабли, военная промышленность строится повсюду, а правительство достаточно агрессивно, чтобы удовлетворить аппетиты более радикальных членов «хунты». Таким образом, после встречи с коллегами-офицерами и членами высшего общества Юнг заявляет о своей полной поддержке усилий правительства.\n\nЗа его усердную работу правительство уже назначило Юнга на должность будущего верховного главнокомандующего, и раскол в армии теперь остался лишь воспоминанием."
swedem.24.a: "Все хорошо, что хорошо кончается."

swedem.25.t: "Национальная лига Швеции растёт"
swedem.25.d: "Сегодня, когда страх перед левой революцией постепенно угасает, а вооруженные силы становятся все более умеренными, на смену радикальным правым пришла новая партия. Эльмо Линдхольм, бывший лидер молодежного крыла Избирательной лиги, объявил о создании собственной партии, независимой от нынешних консерваторов. Назвав себя Шведской национальной федерацией (Sveriges Nationella Förbund), они выступают за полное возвращение к традициям, осуждая провалы нынешних консерваторов в области социал-демократической политики. Окружая себя яростным национализмом и даже, по слухам, привлекая к своей деятельности этнонационалистов, все другие партии считают их явными авторитаристами, выжидающими своего часа. Хотя их число пока относительно невелико, они представляют угрозу для консерваторов, привлекая членов своими непредсказуемыми и харизматичными речами. Таким образом, у нас есть шанс запретить их включение в Риксдаг, закрепив их в качестве аутсайдеров демократической системы. Однако такой шаг сам по себе может показаться авторитарным, поэтому необходимо принимать осторожные решения."
swedem.25.a: "Чёртовы отступники!"
swedem.25.b: "Подавить их пропаганду!"

swedem.26.t: "Единый кабинет"
swedem.26.d: "Поскольку огонь второго по величине конфликта в мире не охватил континентальную Европу, наша нынешняя политика нейтралитета, надеемся, поможет нам пережить эту бурю. Однако в Риксдаге было выдвинуто предложение, возглавляемое Ханссоном и его социал-демократами, о создании большой коалиции между социал-демократами, Лигой фермеров, Народной партией и консерваторами для стабилизации и защиты Швеции во время этого кризиса. Хотя некоторые считают, что такой шаг просто укрепит контроль Ханссона над партиями, он утверждает, что это делается исключительно для защиты Швеции. Члены Риксдага сейчас рассматривают этот вариант, пока над Европой разгорается пожар."
swedem.26.a: "Отбросим наши разногласия, мы должны работать вместе!"
swedem.26.b: "Такая коалиция поставит под угрозу демократическую систему!"

swedem.27.t: "Килбом отказывается от серпа и молота"
swedem.27.d: "Сегодня произошел самый неожиданный поворот событий: бывший лидер SSV Карл Чильбум объявил о своей отставке и желании присоединиться к SAP. Таким шагом Килбом реформирует себя, отходя от политических крайностей социализма и синдикализма к более приемлемым социал-демократическим принципам. Неясно, планирует ли он бороться за лидерство в SAP, однако если такого человека можно вернуть с грани радикализма, то это возможно для любого!"
swedem.27.a: "Реформа даже самых радикальных должна быть отмечена!"

swedem.28.t: "Флаг, который мы возносим"
swedem.28.d: "После распада Шведско-Норвежского союза в 1905 году флаг Швеции был изменен, чтобы удалить норвежскую символику. Затем, в 1906 году, на флаге был принят светло-голубой цвет, чтобы обозначить переход Швеции от имперской державы к образцовому демократическому государству. Однако, поскольку ветер истории постоянно меняется, некоторые члены Риксдага и общественности хотели бы увидеть возрождение более темного оттенка синего, который использовался ранее. Хотя эта группа является незначительной и такое изменение не принесет стране никакой выгоды, оно остается новой идеей."
swedem.28.a: "Возвращение к 1905 году!"
swedem.28.b: "Мы принимаем наш нынешний флаг."

swedem.29.t: "Решение об экономическом курсе партии"
swedem.29.d: "В то время как двигатели прогресса работают на полную мощность, а министры правительства и их подчиненные пытаются сформулировать экономическую политику на будущее, возник неудобный вопрос. Поскольку большая часть нашего текущего экономического планирования основана на современной кейнсианской экономике, но большинство наших старых членов партии по-прежнему привержены - пусть и с некоторыми противоречиями - основной марксистской экономической политике, некоторые предлагают сделать шаг назад, отказаться от капиталистической притворности кейнсианской экономики в пользу более активного регулирования экономики, основанного на марксистских принципах, а не на капиталистической эксплуатации. Вместо того, чтобы просто сохранить за собой несколько национализированных предприятий, сторонники марксистской позиции хотят, чтобы мы пошли ещё дальше и национализировали все основные отрасли промышленности, чтобы максимально повысить производительность, эффективность и рост. В прямой оппозиции к этому сторонники кейнсианской позиции полагают, что массовая национализация просто убьет шведскую изобретательность и промышленность, ссылаясь на многочисленных шведских изобретателей и промышленников, которые, хотя и часто становились при этом богатыми, помогли Швеции достичь уровня современности, сопоставимого, а иногда и превосходящего уровень Центральной Европы. Кроме того, они утверждают, что шведская экономика работает лучше всего, когда никто не качает лодку, и если кейнсианская экономика привела нас так далеко, зачем менять курс сейчас?"
swedem.29.a: "Мы должны вновь принять марксизм!"
swedem.29.b: "Держимся того, что работает, кейнсианская экономика!"

swedem.30.t: "Обращение с оппозицией"
swedem.30.d: "Оппозиция всегда была неотъемлемой частью политики, об этом знали даже викинги. Хотя правительство прошло долгий путь от старых способов решения проблем, будь то дуэли, проявления военной силы или арбитраж, правда заключается в том, что оппозиция, и действительно оппозиционность, является бичом Риксдага. Более левые депутаты отказываются сотрудничать с более правыми, радикалы отказываются работать с центристами, и после хаоса 36-го года шведская политика вернулась к цивилизованности, хотя и остается глубоко фракционной. Поскольку шведское правительство пытается выбрать новый курс на будущее, необходимо сформулировать политику, чтобы провести реформы в токсичном Риксдаге. Одно из предложений от более умеренных крыльев правительства заключается в том, чтобы открыть переговоры и дискуссии, и вместо того, чтобы отказываться от взаимодействия с оппозицией, правительство должно проактивно пытаться наладить связи, идти на компромиссы, чтобы переманить умеренных с другой стороны, изолируя при этом радикалов. Это ускорило бы законодательный процесс и, надеюсь, со временем снизило бы политическую напряженность. Соответственно, те, кто выступает против этого предложения о том, как обращаться с оппозицией в Риксдаге, предлагают совершенно иной курс. Аргументируя это тем, что партия и правительство разорвут свои связи с избирателями, заняв компромиссную позицию, эти радикалы хотят, чтобы правительство по крайней мере осталось на прежнем курсе, продвигало законодательство любыми необходимыми средствами, надеясь привлечь избирателей с помощью твердой независимой политики, чтобы в конечном итоге уничтожить любую значимую оппозицию в Риксдаге."
swedem.30.a: "Протянуть руку помощи!"
swedem.30.b: "Быть безжалостными, не уступать ни на йоту!"

swedem.31.t: "К «свободным» выборам?"
swedem.31.d: "По мере того как Швеция оправляется от хаоса 36-го года, возникают вопросы о том, что правительство будет делать дальше, в частности, о его позиции в отношении будущих выборов и о том, как поступить с повстанческой левой. В заявлении для прессы собравшееся правительство изложило свою политику на будущее. «Чтобы сохранить шведские ценности и поддерживать шведскую демократию, правительство и вновь собранный Риксдаг решили провести новые выборы в дату, которая будет определена позже путем голосования. На этих новых выборах избиратели смогут голосовать за...»"
swedem.31.a: "«...все партии в обществе»."
swedem.31.b: "«...все несоциалистические партии»."

swedem.32.t: "Возвращение к выборам"
swedem.32.d: "После «переворота, спасшего страну», как его называют СМИ, в Швеции наконец-то состоятся обещанные новые выборы. Хотя радикализм был сдержан с помощью вооруженных сил и довольно суровой судебной системы, средний швед теперь снова возлагает надежды на избирательные урны, которые определят дальнейший курс его страны. Левые радикалы отказываются участвовать в избирательном процессе, который они называют «фальшивкой», остатки SAP с трудом собираются с силами, чтобы дать бой под руководством своего нового лидера Таге Эрландера, Bondeförbundet поднимается в рейтингах благодаря притоку политически сознательных фермеров, Folkpartiet приняла в свои ряды нескольких недовольных умеренных членов SAP и с нетерпением ждет возможности занять пост премьер-министра, а консерваторы из AV по праву считают эту должность своей. Появился и темный конь, обещающий сдержать социализм - Национальная лига, состоящая из офицеров и солдат, которые считают, что эти выборы вновь подвергают страну риску социалистического подрыва."
swedem.32.a: "Социал-демократы Эрландера."
swedem.32.b: "Лига фермеров."
swedem.32.c: "Folkpartiet."
swedem.32.e: "Консерваторы."
swedem.32.f: "Национальная лига."





#### Working on elections ####

sweelect.1.t: "Дебаты о лидерстве в Социал-демократической партии"
sweelect.1.d: "В связи с приближающимися выборами социал-демократы должны принять решение о том, кто будет возглавлять партию. Ханссон остается наиболее очевидным кандидатом, он опытен в дебатах в Риксдаге и является талантливым государственным деятелем; его нынешнее руководство партией оказалось плодотворным. Однако есть ещё один кандидат - Таге Эрландер. Эрландер, который на пятнадцать лет моложе Ханссона, представляет собой более молодое лицо в партии, но по-прежнему является ярым сторонником модели социального обеспечения Фолькхеммет. Есть ещё и третий, более неортодоксальный кандидат - Эрнст Вигфорс, который долгое время работал за кулисами на благо партии и теперь считает, что может взять на себя руководство."
sweelect.1.a: "Ханссон сохраняет лидерство!"
sweelect.1.b: "Эрландер занимает эту должность!"
sweelect.1.c: "Эрнст Вигфорс Гильдия побеждает!"

sweelect.2.t: "Консерваторы собираются"
sweelect.2.d: "Консервативная партия недавно сменила название: ранее она называлась «Избирательная лига», а теперь переименована в «Национальную организацию правых». Несмотря на это, основа партии практически не изменилась, и в настоящее время её возглавляет Йёста Багге. Сегодня партия собралась, чтобы проголосовать за того, кто будет возглавлять её на предстоящих выборах. Йёста Багге, ранее поддержанный известным Арвидом Линдманом, кажется наиболее вероятным кандидатом. Он поддерживает корпоративные идеалы партии и традиционный консерватизм. Единственный другой кандидат, который выдвинулся, - менее известный Фритиоф Доме, всего на несколько лет моложе Багге, он представляет более молодое, но относительно такое же лицо партии. Единственный другой кандидат, Мартин Скоглунд, отказался баллотироваться на пост премьер-министра, и теперь остается только дождаться, кого из двух кандидатов выберет партия: Багге или Доме."
sweelect.2.a: "Багге держит курс и сохраняет лидерство!"
sweelect.2.b: "Доме разгромил оппонентов в дебатах и ведет партию к аграризму!"

sweelect.3.t: "Дебаты по вопросу лидерства в Народной партии"
sweelect.3.d: "В связи с приближением выборов 1940 года вновь разгорелись дебаты о том, кто должен возглавить Народную партию. Густав хорошо служил партии, уверенно сохраняя и контролируя свою роль, но некоторые члены партии настаивают на том, чтобы Бертил Олин взял на себя руководство партией. И снова предстоит выбор между более старшим и опытным Андерссоном и более молодым и энергичным Олином."
sweelect.3.a: "Густав Андерссон сохраняет доверие народа!"
sweelect.3.b: "Бертил поднимается на лидерскую роль!"

sweelect.4.t: "Дебаты о лидерстве в Бондефёрбундет (1940)"
sweelect.4.d: "В то время как многие другие партии быстро решают, кто будет представлять их и возглавит нацию в случае успеха, Перссон-Брамсторп комфортно сидит в своем кресле лидера Фермерского союза. Преимущества коалиции позволяют им избежать прямого руководства, при этом обеспечивая реализацию многих своих политических курсов. Следующие выборы вряд ли изменят эту тенденцию, ведь такая партия вряд ли сможет самостоятельно набрать почти большинство голосов. Не так ли?"
sweelect.4.a: "Перссон-Брамсторп возглавляет Фермерскую лигу!"

sweelect.5.t: "Шведские выборы 1940 года"
sweelect.5.d: "Снова в бой! Лето подходит к концу, и с каждым днем все ближе становится холодная весна, а шведы вновь спешат к избирательным урнам. После того как были определены основные кандидаты от каждой партии, в каждой из них царит явное волнение и надежда на победу на выборах. Многие считают социал-демократов практически гарантированными победителями, в то время как консерваторы цепляются за надежду на победу даже с минимальным перевесом. Партия «Народная партия» наслаждается свободой, зная, что если будет избрана любая из двух основных партий, у них будет шанс на коалицию вместе с Лигой фермеров. Хотя считается, что такие выборы пройдут гладко, другая небольшая партия новичков, Национальная лига Швеции, возглавляемая националистом Элмо Линдхольмом, также надеется на победу. Проповедуя глубокий патриотизм по отношению к стране, публично выражая антисемитизм и общее презрение к политической левой, их победа маловероятна."
sweelect.5.a: "Социал-демократы побеждают!"
sweelect.5.b: "Консерваторы одерживают победу!"
sweelect.5.c: "Народная партия избрана!"
sweelect.5.e: "К удивлению даже самих себя, Фермерская лига получает большинство!"
sweelect.5.f: "Безумие! Национальная лига Швеции победила!"

sweelect.6.t: "Получено большинство в Риксдаге"
sweelect.6.d: "Обеспечив себе победу в Риксдаге, мы должны теперь заняться укреплением наших альянсов и коалиционных партнеров. Наиболее очевидным является левоцентристская Фермерская лига, несмотря на некоторую незначительную rivalry между их лидерами и нашими, вместе мы сможем помочь Швеции в меру своих возможностей. Другой вариант - предложить коалицию обеим центристским партиям, не только Фермерской лиге, но и Народной партии. Хотя такой союз обеспечил бы нам практически неограниченное большинство в Риксдаге, он потребовал бы больших уступок и компромиссов со стороны наших союзников."
sweelect.6.a: "Фермерская лига - наш ближайший союзник!"
sweelect.6.b: "Центристско-левый альянс поможет Швеции!"

sweelect.7.t: "Консервативная коалиция"
sweelect.7.d: "Теперь, когда победа уже за нами, нам предстоит решить, с кем мы будем работать, чтобы сохранить большинство в Риксдаге. Наиболее очевидный выбор - привлечь наших естественных союзников, Народную партию, однако некоторые считают, что, предложив сотрудничество даже Фермерской лиге, мы сможем укрепить свои позиции в Риксдаге. Однако некоторые из наших более радикальных членов отвергают оба варианта, желая, чтобы мы снова сотрудничали с гораздо более радикальными консерваторами из Национальной лиги под руководством Элмо Линдхольма. С кем мы будем сотрудничать, теперь решать нам."
sweelect.7.a: "Народная партия снова присоединится к нам!"
sweelect.7.b: "Центристско-правый альянс возглавит Швецию!"
sweelect.7.c: "Недавно созданная Национальная лига Швеции станет нашим союзником!"

sweelect.8.t: "Риксдаг, в котором доминирует Народная партия"
sweelect.8.d: "Добившись нашей необычной победы, мы должны постараться получить как можно большее большинство. Наиболее очевидным союзником были бы консерваторы, которые разделяют многие наши ценности и уже занимают много мест в парламенте. Однако другие члены партии считают, что мы должны создать первую по-настоящему центристскую коалицию Швеции, в которой мы и Лига фермеров будем доминировать в Риксдаге."
sweelect.8.a: "Консерваторы должны присоединиться к нам!"
sweelect.8.b: "Настоящий центристский альянс с Лигой фермеров!"

sweelect.9.t: "Ошеломляющая победа"
sweelect.9.d: "К нашему удивлению, мы сумели набрать больше всего голосов среди всех партий в Риксдаге. Теперь, оправившись от ошеломления, мы должны найти способ добиться большинства в Риксдаге. Самым простым выбором было бы объединиться с нашими естественными союзниками слева, социал-демократами, что дало бы нам огромное количество мест, но стоило бы нам большой свободы действий и компенсаций. Другой вариант - объединиться с Folkpartiet, правоцентристской партией, которая имеет гораздо меньше мест, чем социал-демократы, и коалиция с ней обошлась бы нам гораздо дешевле."
sweelect.9.a: "Социал-демократы - наши естественные союзники!"
sweelect.9.b: "Настоящий центристский альянс с Folkpartiet!"

sweelect.10.t: "Дебаты о лидерстве социал-демократов"
sweelect.10.d: "В связи с приближением выборов социал-демократы должны принять решение: кто будет возглавлять партию? Ханссон остается наиболее очевидным кандидатом, он опытен в дебатах в Риксдаге и талантлив как государственный деятель; его нынешнее руководство партией оказалось плодотворным. Однако есть ещё один кандидат, Таге Эрландер. Эрландер, который на пятнадцать лет моложе Ханссона, представляет собой более молодое лицо в партии, но по-прежнему является решительным сторонником модели социального обеспечения Фолькхеммет. Однако появился третий, более неортодоксальный кандидат - бывший лидер SSV на выборах 1936 года Карл Чильбум. Присоединившись к социал-демократам в 1938 году после провала SSV, он был предложен в качестве третьего, хотя и радикального, кандидата от Швеции. По крайней мере, он пообещал сохранить монархию. Проводится голосование, и определяется явный победитель."
sweelect.10.a: "Ханссон сохраняет лидерство!"
sweelect.10.b: "Эрландер занимает эту должность!"

sweelect.11.t: "Консерваторы собираются"
sweelect.11.d: "Консервативная партия недавно сменила название: ранее она называлась «Избирательная лига», а теперь переименована в «Национальную организацию правых». Несмотря на это, основа партии практически не изменилась, и в настоящее время её возглавляет Йёста Багге. Сегодня партия собралась, чтобы проголосовать за того, кто будет возглавлять её на предстоящих выборах. Йёста Багге, ранее поддержанный знаменитым Арвидом Линдманом, кажется наиболее вероятным кандидатом. Он поддерживает корпоративные идеалы партии и традиционный консерватизм. Единственный другой кандидат, который выдвинулся, - менее известный Фритиоф Доме, всего на несколько лет моложе Багге, он представляет более молодое, но относительно такое же лицо партии. Единственный другой кандидат, Мартин Скоглунд, отказался баллотироваться на пост премьер-министра, и теперь остается только дождаться, кого из двух кандидатов выберет партия: Багге или Доме."
sweelect.11.a: "Багге держит курс!"
sweelect.11.b: "Доме ведет дебаты, возглавляя партию!"

sweelect.12.t: "Народная партия представляет своих кандидатов"
sweelect.12.d: "В связи с приближающимися выборами 1940 года вновь разгорелась дискуссия о том, кто должен возглавить Народная партия. Густаф хорошо служил партии, уверенно сохраняя и контролируя свою роль, но некоторые члены партии настаивают на том, чтобы Бертил Олин взял на себя руководство партией. И снова предстоит выбор между более старшим и опытным Андерссоном и более молодым и энергичным Олином."
sweelect.12.a: "Густаф Андерссон сохраняет доверие народа!"
sweelect.12.b: "Бертил поднимается на лидерскую роль!"

sweelect.13.t: "Дебаты лидеров Bondeförbundet"
sweelect.13.d: "В то время как многие другие партии быстро решают, кто будет представлять их и возглавит страну в случае успеха, Перссон-Брамсторп спокойно сидит в своем кресле лидера Фермерской лиги. Преимущества коалиции позволяют им избежать прямого лидерства, при этом обеспечивая реализацию многих своих политических курсов. Следующие выборы вряд ли изменят эту тенденцию, ведь такая партия вряд ли сможет самостоятельно набрать большинство голосов. Не так ли?"
sweelect.13.a: "Перссон-Брамсторп возглавляет Фермерскую лигу!"

sweelect.14.t: "Национальная лига укрепляет свои позиции"
sweelect.14.d: ""
sweelect.14.a: "Мир Элмо становится все больше!"

sweelect.15.t: "Шведские выборы 1944 года"
sweelect.15.d: "Снова в бой! Лето подходит к концу, и с каждым днем все ближе становится холодная весна, а шведы вновь спешат к избирательным урнам. После того как были определены основные кандидаты от каждой партии, в каждой из них царит явное волнение и надежда на победу на выборах. Многие считают социал-демократов практически гарантированными победителями, в то время как консерваторы цепляются за надежду на победу даже с минимальным перевесом. Партия Folkpartiet наслаждается свободой, зная, что если будет избрана любая из двух основных партий, у них будет шанс на коалицию, наряду с Лигой фермеров. Хотя считается, что такие выборы пройдут гладко, другая небольшая партия новичков, Национальная лига Швеции, возглавляемая националистом Элмо Линдхольмом, также надеется на победу. Проповедуя глубокий патриотизм по отношению к стране, публично выражая антисемитизм и общее презрение к политической левой, победа для них маловероятна."
sweelect.15.a: "Социал-демократы победили!"
sweelect.15.b: "Консерваторы одержали победу!"
sweelect.15.c: "Народная партия избран!"
sweelect.15.e: "К своему собственному удивлению, фермерская лига получила большинство голосов!"
sweelect.15.f: "Безумие! Национальная лига Швеции победила!"

sweelect.16.t: "Получение большинства в Риксдаге"
sweelect.16.d: "Обеспечив себе победу в Риксдаге, мы должны теперь заняться укреплением наших альянсов и коалиционных партнеров. Наиболее очевидным из них является левоцентристская Лига фермеров, несмотря на некоторую соперничество между их лидерами и нашими. Вместе мы сможем помочь Швеции в меру своих возможностей. Другой вариант - предложить вступить в коалицию обеим центристским партиям, не только Фермерской лиге, но и Народной партии. Хотя такой союз обеспечил бы нам практически неограниченное большинство в Риксдаге, он потребовал бы от нас значительной гибкости и уступок по отношению к нашим союзникам."
sweelect.16.a: "Фермерская лига - наш ближайший союзник!"
sweelect.16.b: "Центристско-левый союз поможет Швеции!"

sweelect.17.t: "Консервативная коалиция"
sweelect.17.d: "Теперь, когда победа уже за нами, нам предстоит решить, с кем мы будем сотрудничать, чтобы сохранить большинство в Риксдаге. Наиболее очевидный выбор - привлечь наших естественных союзников, Народную партию, однако некоторые считают, что, распространив предложение даже на Лигу фермеров, мы сможем укрепить свои позиции в Риксдаге. Однако некоторые из наших более радикальных членов отвергают оба варианта, желая, чтобы мы снова сотрудничали с гораздо более радикальными консерваторами из Национальной лиги под руководством Элмо Линдхольма. С кем мы будем сотрудничать, теперь решать нам."
sweelect.17.a: "Народная партия снова присоединится к нам!"
sweelect.17.b: "Центристско-правый альянс будет руководить Швецией!"
sweelect.17.c: "Недавно созданная Национальная лига Швеции станет нашим союзником!"

sweelect.18.t: "Риксдаг под доминированием Народной партии"
sweelect.18.d: "Добившись нашей необычной победы, мы должны постараться получить как можно большее большинство. Наиболее очевидным союзником были бы консерваторы, которые разделяют многие наши ценности и уже занимают много мест в парламенте. Однако другие члены партии считают, что мы должны создать первую по-настоящему центристскую коалицию Швеции, в которой мы и Фермерская лига будем доминировать в Риксдаге."
sweelect.18.a: "Консерваторы должны присоединиться к нам!"
sweelect.18.b: "Настоящий центристский альянс с Фермерской лигой!"

sweelect.19.t: "По-настоящему равная победа"
sweelect.19.d: "К нашему удивлению, нам удалось получить больше голосов, чем любой другой партии в Риксдаге. Теперь, оправившись от шока, мы должны найти способ добиться большинства в Риксдаге. Самым простым выбором было бы объединиться с нашими естественными союзниками слева, социал-демократами, что дало бы нам огромное количество мест, но стоило бы нам большой свободы действий и компенсаций. Другой вариант - объединиться с FOlkpartiet, правоцентристской партией, которая имеет гораздо меньше мест, чем социал-демократы, и коалиция с ней обошлась бы нам гораздо дешевле."
sweelect.19.a: "Социал-демократы - наши естественные союзники!"
sweelect.19.b: "Настоящий центристский альянс с Народная партия!"

sweelect.20.t: "Правая радикализация"
sweelect.20.d: "Самым неожиданным результатом стало то, что Национальная лига Швеции вышла в лидеры, набрав большинство голосов по всей стране. Теперь, когда правительство укрепилось и король дал свое благословение, мы должны укрепить свои позиции в парламенте. Самым очевидным выбором было бы отказаться от коалиций, чтобы не обременять себя умеренными и ложными идеологиями. Однако без коалиции принятие законов в Риксдаге будет затруднительным. Некоторые рекомендуют обратиться к умеренным консерваторам в надежде сформировать первую в Швеции коалицию, состоящую исключительно из правых партий. Другие считают, что, обратившись к небольшим ультраправым лигам, мы получим дополнительную поддержку, не ставя под угрозу свои убеждения. Выбор за нами."
sweelect.20.a: "Любыми средствами, мы правим одни!"
sweelect.20.b: "Пригласите своенравных консерваторов!"
sweelect.20.c: "Обратитесь к самым радикальным в Швеции!"




###revolution events###

swerev.9999.t: "Red Terror Scourge"
swerev.9999.d: "По мере того как шведская революция набирает обороты, начинает проявляться печальная реальность. Боевики, не имеющие отношения к каким-либо партиям в рамках революции, воспользовались нынешним хаосом, чтобы отомстить своим старым соперникам. Массовые грабежи и крупные беспорядки теперь не редкость во всех городах и поселках, поскольку рабочие и боевики берут в руки оружие против своих предполагаемых врагов.\n\nНекоторые случаи дошли до сведения президента, когда такие группы совершают гнусные акты насилия как против невинных гражданских лиц, так и против реакционных врагов. Эти новости получили международную огласку, получив название «шведский красный террор», и были подчеркнуты реакционными странами как провал революции, а участниками Третьего Интернационала были преуменьшены.\n\nС учетом этого президенту предстоит принять трудное решение. Принять жесткие меры в отношении таких действий, что может оттолкнуть более радикальные и фанатичные элементы революции. Или ограничить виновных в более серьезных действиях, закрывая глаза на менее серьезные правонарушения, или, что самое радикальное, просто игнорировать международный резонанс и позволить продолжиться таким массовым актам насилия."
swerev.9999.a: "Наша революция не будет пропитана кровью."
swerev.9999.b: "Управляя их властью, мы сохраним наш контроль."
swerev.9999.c: "Красный цвет реакционеров посеет семена нашего будущего."

swerev.9998.t: "Первый день революции (RRN)"
swerev.9998.d: "Ровно год назад жестокая капиталистическая тирания была смыта кровью пролетариата. Поскольку для народа Швеции важно помнить, что свобода Швеции не дается даром, мы решили объявить день революции национальным праздником. В этот день все работники будут иметь выходной, а государство организует мероприятия для следующего поколения, в то время как взрослые будут иметь возможность пообщаться!"
swerev.9998.a: "Это станет ежегодным событием!"

swerev.9997.t: "День революции (RRN)"
swerev.9997.d: "Снова наступил день рождения революции. Государство организовало мероприятия для детей Швеции в честь революции, а взрослые, которые не выходят на работу, используют свой свободный день, пока дети на мероприятиях, для общения!"
swerev.9997.a: "Leve vår Revolution!"

swerev.0.t: "Ханссон мёртв!"
swerev.0.d: "Нацию поразила трагедия: умер человек, который считается отцом современной нации и её первым президентом. Застреленный агентами военных во время попытки государственного переворота, Пер Альбин Ханссон оставил после себя наследие социальной справедливости и борьбы рабочих. Хотя он был достаточно прагматичен, чтобы довольствоваться монархией, он никогда не был сторонником угнетательной системы, и, следуя требованиям SSV на последних выборах, Пер Альбин Ханссон пошел на риск, сформировал коалицию, и заплатил за это своей жизнью. После его смерти социал-демократы как сила фактически радикализировались в одночасье, и на чрезвычайном заседании Риксдага, в котором партии, считавшиеся враждебными республике, были лишены права участия, Карл Чильбум из Парижской клики был избран новым президентом.\n\nПосле избрания Килбома Риксдаг был переименован, а запрет на партии, враждебные нынешней революции, был закреплен законом. Сам Килбом понимает, что его должность является лишь временной, поскольку среди левых сил созван чрезвычайный съезд для выбора нового лидера, кандидатами на эту должность являются как сам Килбом, так и более радикальные альтернативы, такие как его бывший товарищ Нильс Флюг. Действительно, после смерти Ханссона и назначения Килбома президентом Флюг разразился яростью в прессе и на массовых демонстрациях, призывая не только к казни контрреволюционеров, но и к принудительному удалению так называемых «ложных» социалистов из Риксдага, нацелившись на своего другого бывшего товарища Зета «Zäta» Хёглунда как на явного иностранного агента. В настоящее время, опасаясь, что его бывший товарищ может вскоре прийти и за ним, Кильбом тихонько сообщил в Париж, что, если его не выберут лидером на следующем чрезвычайном съезде, он с радостью вернется на свою должность лидера шведской делегации в Интернационале."
swerev.0.a: "Да живет дух Ханссона, да живет Республика!"

swerev.1.t: "Заявление военных"
swerev.1.d: "Мы всегда знали, что реакционеры держат в своих руках вооруженные силы, и после нашей победы и распада традиционалистской короны военные, по-видимому, испытывают недовольство нашим правительством. В правительстве ходят слухи о возможном государственном перевороте со стороны ведущих генералов, таких как Хельге Юнг. Хотя ничего не известно наверняка, мы должны подготовиться к такому событию."
swerev.1.a: "Они должны уважать демократический процесс"

swerev.2.t: "Формирование рабочих ополчений"
swerev.2.d: "Хотя ещё несколько лет назад идея столкновения между шведами казалась практически невозможной, нынешняя политическая обстановка может потребовать этого. Растущее недоверие армии к социалистическому правительству близится к кипению, и теперь, когда возможность переворота стала почти определенной, рабочие мобилизуются с тем небольшим количеством оружия, которое у них есть, чтобы помочь правительству бороться с армией. Если или когда произойдет такое столкновение, будет пролита кровь, и судьба шведского правительства будет решена, поскольку красные и реакционеры вновь столкнутся друг с другом."
swerev.2.a: "Шведские рабочие, объединяйтесь!"

swerev.3.t: "Идеологическая война" 
swerev.3.d: "Худшее свершилось. Рано утром большой отряд солдат собрался перед зданием Риксдага, их сапоги зловеще эхом разносились по мощеным улицам Стокгольма. Во главе отряда стоял генерал Хельге Юнг, по бокам от него - его верные союзники Карл Август Эренсверд и Арчибальд Дуглас. Время завуалированных угроз и напряженных переговоров закончилось. Они пришли, чтобы захватить власть.\n\nКогда солдаты выстроились в шеренги, поблизости внезапно поднялась суматоха. Появились колонны рабочих ополченцев, некоторые из них были вооружены украденными винтовками, другие - охотничьим оружием или инструментами, переделанными в импровизированное оружие. Это были не солдаты, а граждане, готовые защищать то, что они считали своей революцией.\n\nНа мгновение воцарилась напряженная тишина. Военные предъявили правительству свои требования: немедленный роспуск социалистической администрации, признание армии временной правящей властью и полное разоружение всех рабочих ополчений. Ответ коалиции Пер Альбина Ханссона был быстрым и вызывающим. Его более радикальные союзники категорически отвергли требования, назвав их изменой.\n\nТишину нарушила стрельба. В самом центре столицы начались жестокие столкновения. Площадь заполнилась дымом и криками, когда мечты обеих сторон столкнулись в насилии. Когда бои прекратились и последние отголоски стрельбы затихли в утреннем тумане, тишину пронзил единственный крик. Он сигнализировал не только о победе или поражении, но и о начале новой главы в бурной истории Швеции."
swerev.3.a: "Встаньте, рабочие! Ваш упорный труд окупился!"
swerev.3.b: "Прекратите огонь, входите и арестуйте остальных!"

swerev.4.t: "Красный рассвет"
swerev.4.d: "Попытка военного переворота закончилась провалом, его организаторы либо были разгромлены в бою, либо предстали перед народным судом. В результате оставшиеся генералы либо присягнули на верность революции, либо были свергнуты вместе со своими товарищами. С устранением старой гвардии Швеция стоит на пороге новой эры. Мечты о правах рабочих, освобождении классов и человеческом достоинстве больше не являются далекими надеждами, они стали руководящими принципами нового общества, которое только формируется. По городам и сельской местности развевается красный флаг революции, несомый ветрами перемен."
swerev.4.a: "Вперед, наш труд только начался!"

swerev.5.t: "Восстаньте, красногвардейцы!"
swerev.5.d: "Хотя угроза полного переворота со стороны реакционных сил исчезла, многие в Швеции по-прежнему придерживаются старых взглядов. Они атакуют политические станции и препятствуют нашим усилиям по созданию настоящего рабочего рая. В связи с этим необходимо принять радикальные меры и создать «Красную гвардию» по образцу той, что сражалась в Гражданской войне в России. Эти новые гвардейцы будут помогать в борьбе с реакционными террористами и врагами революции, поскольку их лояльность революции не вызывает сомнений."
swerev.5.a: "Красный цвет покрывает Швецию сейчас и навсегда!"

swerev.6.t: "Красный Риксдаг"
swerev.6.d: "После того как враги революции были либо заключены в тюрьмы, либо уничтожены, либо изгнаны за пределы наших границ, внимание теперь обращается внутрь страны - к формирующемуся политическому ландшафту возрожденной Швеции. Некогда единый революционный фронт, объединенный общей борьбой, начал раскалываться по мере появления идеологических разногласий в отсутствие общего врага.\n\nНачинают формироваться новые фракции. Социалисты SSV, уходящие корнями в прежнюю избирательную систему, выступают за структурированную социалистическую республику с народным представительством. Им противостоят основные синдикалистские анархисты, набирающие силу благодаря поддержке Третьего Интернационала как в военном, так и в идеологическом плане, которые стремятся к безгосударственному, децентрализованному рабочему порядку. ещё дальше идут жесткие национальные синдикалисты и авторитарные коммунисты, объединенные только своим стремлением к более воинственному, централизованному революционному государству.\n\nПока эти группы организуются и укрепляют свои позиции, объявлены новые выборы. Вскоре одна из них поднимется, чтобы взять на себя руководство и определить будущее шведской революции."
swerev.6.a: "Пусть народ решает наш путь!"

swerev.7.t: "Свергесская социал-демократическая левая партия реорганизуется"
swerev.7.d: "Образованная в результате раскола с SAP несколько десятилетий назад, SSV столкнулась со многими проблемами. Когда разразилась русская революция, SSV заняла твердую позицию в поддержку её дела, а когда революция закончилась трагически, партия впала в идеологическую пустыню. Карл Чильбум, восходящая звезда партии, столкнулся с другим высокопоставленным членом партии Свеном Линдеррутом, и каждый из них взял под свой контроль разные крылья партии: Кильбом был очарован синдикализмом Запада, а Линдеррут стремился остаться верным делу социализма по-петроградски. В конечном итоге этот раскол привел партию к гражданской войне, в результате которой Линдерут и его ленинисты были исключены из партии и создали SKP, ставшую прямой оппозицией. После этого раскола партия стала более позитивно относиться к парламенту и избирательному пути к социализму, хотя и осталась дружественной по отношению к Третьему Интернационалу.\n\nПоскольку Килбом последние несколько лет провел за границей, в Париже, руководство SSV перешло к Хёглунду и известной писательнице Карин Бойе, хотя партия по-прежнему контролировалась в основном шведской делегацией в Париже. Однако сейчас партия сталкивается с ещё одним испытанием в своей короткой и странной истории. Она не только переживает кризис лидерства, поскольку Килбом и Бойе оба претендуют на эту должность, но и бывшие союзы прекратили свое существование. Согласившись на коалицию с SAP только для достижения победы на выборах, партия вновь разорвала все связи со старой материнской партией, стремясь пойти по новому, действительно независимому пути в деле шведского социализма, свободному от буржуазного влияния. Несмотря на намерение сохранить парламентскую систему и занять позицию массовой партии, объединяющей различные политические течения, SSV имеет несколько четко определенных целей. Они стремятся к пролетаризации среднего класса, одновременно повышая статус рабочего класса, улучшая условия труда и заработную плату для всех в Швеции и искореняя пороки азартных игр.\n\nВеря в тесное сотрудничество между мелкими фермерами, земледельцами, арендаторами и рабочими, партия стремится освободить сельских жителей от капиталистической эксплуатации и угнетения. Помимо этого, она также выступает за введение законодательного запрета на употребление алкоголя.\n\nПартия остается крупнейшей по числу активных членов, что дает ей хорошие шансы на очередную победу на выборах, хотя и в значительно изменившемся Риксдаге."
swerev.7.a: "За интересы рабочих и мелких фермеров!"

swerev.8.t: "Герои шведских профсоюзов"
swerev.8.d: "Центральная организация шведских рабочих, возглавляемая Франсом Северином и Элизой Оттесен-Йенсен. Связанная с Третьим Интернационалом и Парижской кликой, она объединяет различные профсоюзы, в которых преобладают лесорубы, каменщики и строители; в последнее время она распространилась почти на все рабочие места по всей Швеции. На данный момент партия имеет двух лидеров: один из них - Северин, который выступает за централизованную синдикалистскую модель, отходя от традиционных анархистских взглядов, и считает, что сильное государство, поддерживаемое профсоюзами, - единственный путь к процветанию шведских рабочих.\n\nДругой лидер - Элиза Оттесен-Йенсен, считающаяся более умеренной из двух, её группа наиболее известна организацией крупнейших забастовок по всей стране и является наиболее влиятельной группой в деле осуществления революции. Она поддерживает анархистскую историю синдикализма, где призыв рабочих к действию является приоритетом партии, чтобы свергнуть и осудить тиранов и деспотов. Поддерживая связи с норвежскими и датскими профсоюзами и придерживаясь мнения об ограниченном вмешательстве государства, она считает, что цель такого органа заключается лишь в защите прав рабочих и продвижении международной революции. Видя в объединенной международной революции свою конечную цель, они питают большие мечты о распространении своих идеалов.\n\nВ ходе жарких дебатов Северин и Оттесен-Йенсен выступили с требованием лидерства в Союзе, и теперь судьба лидерства находится в руках членов профсоюза."
swerev.8.a: "Анархисты Оттесена-Йенсена выигрывают дебаты!"
swerev.8.b: "Северин убеждает профсоюз централизоваться!"

swerev.9.t: "Беды Килбома"
swerev.9.d: "Авторитарные левые представляют собой разнородную коалицию из трех соперничающих партий, каждая из которых имеет свои собственные амбиции и планы и объединенных лишь обстоятельствами. Нильс Флюг, несмотря на свой радикализм, тем не менее является харизматичным и дружелюбным человеком, хотя в его глазах всегда горит огонь. Смогший сформировать блок вместе с коммунистической SKP под руководством Линдерота, а также крипто-легионером SSS под руководством Свена Олова Линдхольма, Нильс Флюг имеет большие шансы на победу в ближайшем будущем. Хотя несомненно, что его блок распадется, если он когда-нибудь придет к власти, Флюгу нужно лишь закрепиться у власти, после чего он сможет легко расправиться с любым непокорным соперником. Кильбом, испытывающий страх перед Нильсом Флюгом, в частном порядке посоветовал Риксдагу не допускать радикалов во власть, сославшись на опыт Ленина, свергшего Петроградское правительство."
swerev.9.a: "То, в чем мы можем договориться, важнее наших взаимных претензий."
swerev.9.b: "Мы не допустим этих радикалов в наши ряды!"

swerev.10.t: "Красные выборы"
swerev.10.d: "Сегодня в воздухе витает атмосфера спокойствия, поскольку многие жители Швеции собираются вместе, чтобы выбрать единственное истинное правительство, которое поведет Швецию к революции в будущем.\n\nSSV надеется, что благодаря самому большому количеству членов и прошлым победам на выборах им удастся одержать ещё одну победу, которая приведет Швецию к свободному рабочему раю завтрашнего дня! SAC верит, что их большая база поддержки среди рабочих и профсоюзов принесет им победу, и надеется приблизиться к Третьей Интернационале и создать настоящий рабочий рай! Отстраненная коалиция национальных синдикалистов Флига и бывших коммунистов Линдерота надеется, что их совместные силы и фанатичная преданность революции привлекут рабочих страны, давая им власть руководить Швецией.\n\nПо мере того как день и голосование подходят к концу, лицо шведской революции теперь будет..."
swerev.10.a: "SSV приведет шведских рабочих и крестьян к утопии!"
swerev.10.b: "SAC с помощью международной помощи спасет шведских рабочих!"
swerev.10.c: "Шокирующим образом, тройная коалиция SP-SNSP-SSS доминирует в Риксдаге!"


### Radical Socialist Events ###

swerev.11.t: "Продолжение SSV"
swerev.11.d: "После революции и последовавших за ней «красных выборов» предыдущие победители выборов в SSV вновь одержали победу и, опираясь на свою широкую базу поддержки, получили контроль над будущим Швеции. Благодаря политике свободы трудящихся, повышения заработной платы и общего улучшения положения рабочего класса, они теперь обладают властью, необходимой для реализации этих идеалов. Наряду с этим, партия также надеется ввести в Швеции некую форму запрета, напоминающую референдум по алкоголю 1922 года."
swerev.11.a: "Радуйтесь!"

swerev.12.t: "Вопрос о руководстве партии"
swerev.12.d: "Родившаяся в Гётеборге, Карин Бойе изначально планировала стать школьной учительницей, писала стихи и переводила произведения Т. Элиота на шведский язык. Во время пребывания в Упсале она вступила в социалистическую студенческую организацию, известную как Шведская лига Clarté. В это время она получила Северную Нобелевскую премию за свою книгу «Астарта», в которой критиковала буржуазную культуру и общество. В начале 1930-х годов, страдая от приступов депрессии, она в конце концов встретила свою партнершу, которую она называла своей женой, Маргот Ханель. После этого Бойе стала более активно участвовать в политической жизни, продолжая работать школьной учительницей. После нескольких лет политической деятельности в SSV, в последние несколько лет она готовилась к лидерству под руководством покойного Зета Хёглунда, считая, что движению нужен более женский подход. В то время как Килбом занимался политикой за рубежом, Бойе и её псевдо-наставник Хёглунд усердно работали над расширением партии, используя связи Бойе в семье, а также её культурное влияние, что позволило партии проникнуть в городскую буржуазию. Бойе представляет более умеренное крыло партии, отказываясь от любой тирании и авторитаризма, где бы они ни проявлялись, и одновременно заручившись широкой поддержкой женщин и левоориентированного городского среднего класса Швеции.\n\nКарл Чильбум родился и вырос в семье рабочего класса в Швеции. В 15 лет он посетил мероприятие, организованное социалистическим агитатором, после чего помог в создании социалистического клуба. Однако, под угрозой со стороны шпионов компании, Кильбом временно отказался от социалистического клуба и его идеалов, чтобы спасти рабочие места своей семьи. В 1907 году он был призван в шведский флот, где продолжал присоединяться и участвовать в социалистических и социал-демократических клубах, где только было возможно. В конце концов он вступил в Социал-демократическую левую партию Швеции, которая поддерживала большевиков на протяжении всей гражданской войны в России. Хотя изначально он поддерживал коммунизм, после их поражения он отвернулся от этой идеологии и стал колебаться между такими группами, как синдикалисты и социал-демократы. После судьбоносного визита в Париж в разгар революции Килбом и его соотечественники и товарищи-социалисты Нильс Флюг и Зеф Хёглунд образовали неформальное объединение, которое впоследствии стало известно как «Парижская клика» из-за их увлечения делами в Париже и связи с ними. Входя в состав шведской делегации в Интернационале, Килбом несколько лет посвятил международной революционной борьбе, участвуя в работе нескольких комитетов по продвижению социализма в Скандинавии. Хотя Хёглунд и Флюг уже довольно долгое время ведут активную деятельность в самой Швеции, возвращение Килбома из Парижа для того, чтобы взять на себя управление SSV, сделало его гигантом левого движения, но не бесспорным. Несмотря на свою дружественность к синдикализму и откровенную симпатию к синдикалистам во всем мире, Килбом не считает, что Швеция достаточно индустриализирована для синдикализации в масштабах всей страны. Более радикальный, чем Бойе, но более прагматичный и реформистский, чем SAC или все более нестабильный Флюг, Килбом, как и Бойе, хочет социализма в Швеции, но в идеале без дальнейшего кровопролития. Отказываясь присоединиться к умеренным остаткам SAP, Карл Чильбум сохранил более революционные идеалы партии, чтобы сохранить её независимость от более умеренной SAP. Придерживаясь твердых революционных и социалистических идеалов, партия по-прежнему решительно избегает любой формы авторитаризма."
swerev.12.a: "Карин Бойе должна вести нашу страну вперед!"
swerev.12.b: "Карл Чильбум - идеолог, который нам нужен!"

swerev.13.t: "Рабочие без оков"
swerev.13.d: "Благодаря новым планам и субсидиям правительства, рабочие постепенно получают все больше и больше льгот. Теперь всем рабочим в течение года предоставляется время для обязательного отпуска и отдыха от работы, что позволяет им наслаждаться досугом. Благодаря этому рабочие получают справедливое вознаграждение в виде более высокой заработной платы и улучшенных условий труда на многих предприятиях Швеции. Поистине, Швеция быстро становится оплотом свободы рабочих, а также образцом для подражания для других стран!"
swerev.13.a: "Поистине, рай на Земле!"

swerev.14.t: "Социалистическая учебная программа"
swerev.14.d: "В рамках SSV началась почти полная реорганизация сектора образования. Расширение области математики и естественных наук для подготовки будущих поколений к более светлому будущему, а также создание студенческих клубов и организаций, чтобы студенты могли самовыражаться и ценить новую систему, в которой они живут. Вместо полной чистки всей несоциалистической литературы, студентов поощряют читать и критиковать такие произведения, чтобы улучшить их понимание и расширить их представление о мире в целом. Такие инициативы уже приносят плоды, и многие студенты наслаждаются свободой в своих политических клубах."
swerev.14.a: "Молодежь нужно беречь и воспитывать, ведь она - наше будущее!"

swerev.15.t: "Рукопожатие с нашими старыми союзниками"
swerev.15.d: "Наша победа на первых выборах 1936 года, а затем и последовавшая за ней революция были бы невозможны без помощи Шведской социал-демократической рабочей партии. Преимущество, которое дало нам победу над реакционным Риксдагом, стало последней каплей, помогшей нам осуществить революцию в Швеции и наконец освободить рабочий класс. В связи с этим мы вернем их в наше правительство, протянув им руку, которую они когда-то протянули нам, освободившись от оков монархизма."
swerev.15.a: "Правительство братьев и сестер."

swerev.16.t: "Провал монархизма"
swerev.16.d: "Хотя SAP помогла нам выиграть выборы 1936 года, нельзя игнорировать их веру в монархическую систему и удовлетворение ею. Кажущаяся неготовность разорвать оковы угнетательной и традиционалистской системы показывает их недостойность служить революции. Такая слабость и реакционное видение не должны формироваться в нашем правительстве, все последние следы монархизма должны быть и будут искоренены для блага народа."
swerev.16.a: "Правительство рабочего класса и для рабочего класса."

swerev.17.t: "Красный Север расцветает"
swerev.17.d: "Сейчас, когда революционная политика полностью вступила в силу, Швеция объединена под руководством правительства, которое служит народу. Рабочие и фермеры пожинают плоды своих тяжелых побед, потребление алкоголя снизилось, а влияние монархии практически исчезло. Самые сложные испытания остались позади. Шведский народ силен, его поддержка непоколебима. Наша нация, когда-то скованная роялизмом и капиталистической жадностью, стала маяком социалистического успеха. Швеция больше не просто страна, она - доказательство того, что социалистическое правительство может процветать.\n\nС подъемом Красного Севера Швеция станет символом для всего мира - процветающей, независимой нацией, где на первом месте стоит народ, и где социализм больше не мечта, а реальность."
swerev.17.a: "Спокойно отдыхайте, рабочие, ваши жертвы принесли плоды!"

swerev.18.t: "Красные фермеры"
swerev.18.d: "В наших первых попытках выиграть выборы мы получили широкую поддержку мелких фермеров по всей стране, большинство из которых проживает в Лапландии. Этим фермерам были обещаны лучшие условия, дополнительная помощь от правительства Стокгольма и большая свобода от крупных традиционных фермерских хозяйств. После нашей победы мы, безусловно, должны начать реализовывать такую политику в отношении одной из наших основных баз поддержки."
swerev.18.a: "Arbetare och småbrukare!"

swerev.19.t: "Обещания запрета"
swerev.19.d: "В последнее время в Швеции вновь разгорелась дискуссия о запрете алкоголя. Изначально, в 1921 году, партия SSV выступала за введение государственного запрета на алкоголь в случае своего избрания в правительство. Партия никогда не отказывалась от этих принципов, однако с окончанием хаоса революции этот вопрос вновь встал на повестку дня. Хотя референдум о запрете алкоголя в 1922 году закончился небольшим поражением, что привело к сохранению статус-кво в отношении продажи и лицензирования алкоголя в Швеции, с отменой монархии и радикальными реформами SSV, находящейся у власти, появилась возможность повторного введения запрета.\n\nВ случае проведения нового референдума партия будет придерживаться любого решения, принятого общественностью, будь то сохранение статус-кво или принятие на себя трудной задачи введения запрета, если будет решено, что общенациональный запрет будет введен при SSV."
swerev.19.a: "Народ явно хочет сохранить свой алкоголь."
swerev.19.b: "Свобода от пороков, свобода от тиранов!"

swerev.20.t: "Принятие шведской лиги Clarté"
swerev.20.d: "Шведская лига Clarté, обычно называемая Clarté, была основана в 1921 году. Эта небольшая группа, изначально созданная студентами, занимается пропагандой левых идей и стремится к лучшему пониманию сути современного социализма. Имея широкий круг членов и явно левые взгляды, но не связанная с какой-либо партией, Clarté является ассоциацией, которую стоит принять, поддержать и помочь.\n\nАналогично этому, наше внимание заслуживает ещё одна группа под названием Nya Idun, основанная в 1885 году. Являясь женским аналогом мужского клуба Sällskapet Idun, она отстаивает девиз, противоположный девизу мужчин: «мужчины, живущие в Стокгольме, которые имеют свои собственные интересы и занимаются наукой, литературой и искусством в различных областях». Являясь феминистской прогрессивной группой, обсуждающей различные темы литературы, искусства и политических взглядов, она, безусловно, является хорошей организацией, с которой стоит поддерживать дружеские отношения. Обратившись к ним и объединив их идеалы с нашим политическим аппаратом, мы могли бы продвинуть дело левых в Швеции."
swerev.20.a: "Социализм, феминизм, равенство!"
swerev.20.b: "Примите их, но ограничьте их влияние."
swerev.20.c: "Синдикализм, феминизм, равенство!"

swerev.21.t: "Возрождение гильдейского социализма"
swerev.21.d: "Благодаря тому, что мы приняли более радикальные элементы в SAP, что значительно усилило нашу поддержку и дало нам почти полный контроль над Рабочим Риксдагом, некоторые из их наиболее харизматичных членов выступили с предложением оказать прямую помощь нашему делу. Никто не был так популярен, как бывший член SAP Эрнст Вигфорс. Первоначально представляя социал-демократов в Гётеборге в 1919 году, он позже был назначен членом третьего кабинета Хьялмара Брантинга, что ещё больше укрепило его популярность в социал-демократической партии. В эти годы он написал множество статей и работ об идеях рабочей промышленной демократии и, что наиболее важно, гильдейского социализма. Эта идеология, зародившаяся в Великобритании, выступает за контроль рабочих над промышленностью через «гильдии». Идеология, которую Вигфорс продвигал в Швеции на протяжении большей части десятилетия. Таким образом, он предложил свои услуги, желая внедрить этот новый гильдийский социализм в Швеции в надежде по-настоящему связать рабочих с их трудом в окончательном слиянии социализма. Хотя некоторые в нашей собственной партии по-прежнему с осторожностью относятся к этим бывшим умеренным политикам, осуждая их как лояльных сторонников старой монархии.\n\nХотя мы протянули оливковую ветвь многим из наших бывших союзников по коалиции, следует ли нам протянуть её Вигфорсу или не допускать его в правительство?"
swerev.21.a: "Пусть Эрнст Вигфорс руководит страной!"
swerev.21.b: "Тривиальные идеи, оставьте их в покое."

swerev.22.t: "Судьба финна"
swerev.22.d: "Несмотря на появление финской нации на Севере, неуловимый Карл Маннергейм до сих пор неохотно оставался здесь, в пределах наших границ. Будь то из-за колебаний финского правительства или из-за их отказа принять его, он остается в Швеции. Однако Карл Маннергейм теперь представляет прямую угрозу для нашего нового правительства, поскольку во время финской гражданской войны он сражался на стороне финских белых против красных и является не только врагом, но и фигурой, вокруг которой могут объединиться против нас! Мы не можем допустить такого поворота событий. Хотя ходят слухи о его скором бегстве из страны, у нас есть небольшая возможность арестовать его, прежде чем он сбежит. Что делать?"
swerev.22.a: "Арестовать его немедленно!"
swerev.22.b: "Позволить ему бежать."

swerev.23.t: "Маннергейм ищет убежища в России"
swerev.23.d: "Крах старого шведского порядка заставил многих противников нового режима уйти в изгнание. Среди них Карл Густав Эмиль Маннергейм, который теперь просит разрешения поселиться в пределах наших границ. Хотя он не может занимать здесь никакой официальной должности, его просьба ставит нас в деликатное положение. Предоставление ему убежища сделает Россию пристанищем для изгнанных антисоциалистических деятелей, но это также может быть расценено как вмешательство в дела Швеции."
swerev.23.a: "Разрешить ему проживать в России в качестве политического изгнанника."
swerev.23.b: "Отказать ему во въезде, мы не будем вмешиваться в беспорядки в Швеции."

swerev.24.t: "Маннергейм ищет убежища в Канаде"
swerev.24.d: "Революция в Швеции вынудила многих представителей старой гвардии искать убежища за границей. Карл Густав Эмиль Маннергейм, некогда известный генерал, обратился к британскому правительству в изгнании в Канаде. Он просит разрешения жить под их защитой. Хотя он не может занимать здесь никакой должности, предоставление ему убежища приведет Канаду в один ряд с теми, кто сопротивляется социализму в Европе, но это также может быть расценено как ненужное вмешательство в дела Швеции."
swerev.24.a: "Предоставить ему убежище в Канаде в качестве политического изгнанника."
swerev.24.b: "Отказать в его просьбе, проблемы Швеции не являются нашими проблемами."

swerev.25.t: "Шёпот из Центральной Азии"
swerev.25.d: "С момента его поспешного бегства из Швеции местонахождение предательского генерала Карла Маннергейма остается одной из величайших загадок нашего времени. Некоторые полагают, что он укрылся на родине своих предков в Финляндии, другие шепчут, что он бежал в Россию, где когда-то служил, а некоторые даже утверждают, что он исчез в бескрайних просторах Канады. Однако ни одно правительство никогда не подтверждало его прибытие, оставляя его судьбу в неясной неизвестности.\n\nОднако сейчас по Швеции и Финляндии начали распространяться новые слухи. Эти слухи не говорят о безопасных убежищах в Хельсинки, Москве или Оттаве, а скорее о дальних краях Азии. Они рассказывают о том, что Маннергейм повторяет путь своей молодости, когда он служил офицером царской империи и странствовал по отдаленным границам мира. Во время этой легендарной экспедиции он пересек пустыни и горы, достиг высот Тибета и стал одним из первых европейцев, встретившихся с самим Далай-ламой.\n\nЕсли верить этим рассказам, Маннергейм вновь вернулся к тому далекому прошлому. Некоторые утверждают, что он теперь путешествует с кочевниками по бесконечным монгольским степям, другие - что он скрывается в монастырях Тибета или что он пробрался в раздробленную китайскую провинцию Шаньси, где тихо живет под вымышленным именем. Являются ли эти рассказы пустыми выдумками пьяниц или содержат зерно правды, никто не может сказать.\n\nНесомненно только то, что Маннергейм исчез из Европы, возможно, навсегда. Его тень будет оставаться в памяти шведов и финнов на протяжении многих поколений, будь то как солдат, странник или призрак давно умерших империй."
swerev.25.a: "Возможно, он наконец обрел покой."

###Central Syndicalists###

swerev.26.t: "Установление стабильности"
swerev.26.d: "Наша решительная победа в Рабочем Риксдаге позволила нам прочно удержать бразды правления революцией в своих руках, однако путь впереди далеко не спокоен. Анархистские фракции, хотя и лишенные лидерства, по-прежнему имеют глубокие корни во многих профсоюзах, мастерских и районных комитетах. Их знамена по-прежнему развеваются над некоторыми районами Стокгольма и Гётеборга, а их призывы к децентрализованной революции без лидеров продолжают привлекать толпы людей. Хотя им не хватает единства и силы, чтобы полностью захватить власть, их численность и влияние делают их более чем временной помехой. Если их не контролировать, они могут затормозить или разрушить прогресс, за который мы боролись. Теперь перед нами стоит выбор: искать общие точки соприкосновения или действовать решительно, чтобы их препятствия не стали постоянной чертой новой Швеции."
swerev.26.a: "Наверняка мы можем решить эту проблему мирным путем?"

swerev.27.t: "Решение анархистского вопроса"
swerev.27.d: "После месяцев политических маневров, тщательной законодательной работы и настойчивых усилий по установлению контактов, присутствие анархистов в Швеции сократилось до тени прежнего. Многие из их синдикатов были поглощены поддерживаемыми государством профсоюзами, а их более бескомпромиссные лидеры утратили свое значение или ушли в подполье. Улицы, которые когда-то оглашались нескоординированными протестами, теперь гудят в устойчивом ритме централизованной организации. Хотя некоторые ячейки все ещё могут скрываться в тени, революционное правительство укрепило свою власть и обеспечила, что анархистская угроза больше никогда не будет ставить под угрозу единство государства."
swerev.27.a: "Революция остается единой."

swerev.28.t: "Неожиданное рукопожатие"
swerev.28.d: "С ослаблением анархистской угрозы руководство Центрального синдикалистского союза теперь обращает внимание на другие силы, которые могут дестабилизировать революцию. Среди них - Нильс Флюг и его Национальный синдикалистский блок, группа, известная своими буйными уличными милициями и бандитскими исполнителями. Хотя их дисциплина на поле боя неоспорима, их методы на улицах часто граничат с запугиванием и откровенным насилием.\n\nИх идеология далека от нашей, но их враждебность по отношению к анархистам и иностранному влиянию делает их временными, хотя и неудобными, партнерами. Благодаря осторожным переговорам и тщательно продуманным обещаниям Флюга удается убедить направить свое движение на стабилизацию страны, а не на противодействие правительству. Он и его последователи не получат реальных властных позиций, но им будет предоставлено ограниченное право голоса в некоторых промышленных комитетах и по вопросам безопасности. На данный момент это неустойчивое перемирие удерживает другого потенциального врага от открытия нового фронта против революции."
swerev.28.a: "Иногда единство рождается в самых неожиданных местах."

swerev.29.t: "Создание Стражей Революции"
swerev.29.d: "Даже после роспуска анархистского крыла и присоединения к нам Флюга с его национальными синдикалистами стабильность по-прежнему остается очень хрупкой. SSV по-прежнему протестует против наших действующих законов и нашего правления над Рабочим Риксдагом, побуждая своих сторонников массово выражать свое недовольство. Однако с наступлением хаоса многие преступники и отбросы общества начали проявлять свое агрессивное поведение. Они грабят, ограбляют и причиняют вред нашим невинным гражданам, которые хотят только жить своей обычной жизнью в мире. В связи с этим будет создана новая сила, предназначенная для служения только Риксдагу, чтобы поддерживать мир и приносить справедливость непокорным. Однако с созданием такой силы остается много спекуляций относительно её национального финансирования: должно ли правительство выделить ей достаточно средств для организации защиты нации или же она должна получить значительное повышение заработной платы, чтобы максимально поддерживать мир. Есть и третий вариант: Нильс Флюг предложил нам дополнительную помощь, поставив своих людей на должности в этой новой силе, чтобы они применили свою безжалостную и жестокую риторику к нашим врагам. Остается вопрос, что мы выберем."
swerev.29.a: "Предоставить ей достаточное финансирование, нам не нужно господствовать над нашими гражданами."
swerev.29.b: "В каждой ратуше должны быть офицеры!"
swerev.29.c: "Пусть Флюг бесчинствует."

swerev.30.t: "Доминирование профсоюзов"
swerev.30.d: "Решение создать более сильную исполнительную власть и централизовать государственный аппарат вокруг профсоюзов, возможно, уязвило некоторых из наших первоначальных сторонников, которые с самого начала рассматривали это как почти предательство революции. Однако те, кто присоединился к нам недавно, приветствовали наш выбор, считая его единственно верным шагом вперед. Чтобы шведская синдикалистская революция действительно увенчалась успехом, она должна сначала обеспечить себе безопасность."
swerev.30.a: "Порядок необходим для рабочих."

swerev.31.t: "Скандинавский синдикализм"
swerev.31.d: "В соответствии с нашими интернационалистскими идеалами синдикализма, мы понимаем ограничения нашей нации. Хотя мы можем рассчитывать на помощь и поддержку наших синдикалистских союзников, в одиночку мы не сможем спасти мировой рабочий класс, но вместе мы освободим всех. Первым делом мы обратимся к региону, в котором проживаем, - Скандинавии. На востоке - Финляндия, на северо-западе - Норвегия, на юге - Дания - все эти страны жаждут свободы, их рабочие взывают к нам, и мы ответим на их призыв!"
swerev.31.a: "Вперед, время никого не ждет!"


###Syndicalist Anarchist ###

swerev.32.t: "Анархическая мечта"
swerev.32.d: "Благодаря решению партии сохранить свои анархические идеалы, внутренние трения в партии начинают сглаживаться. Рабочие скоро перестанут страдать от низкой заработной платы, ведущей к бедности, жители городов больше не будут испытывать трудности с оплатой аренды, а обширные участки земли перестанут принадлежать немногим. С помощью этой анархо-синдикалистской идеологии мы будем стремиться к созданию подлинно безгосударственного, эгалитарного рая на Земле."
swerev.32.a: "Черный и красный флаги развеваются высоко."

swerev.33.t: "Освобождение саами" 
swerev.33.d: "В Скандинавском регионе саами живут с незапамятных времен и считаются самыми коренными жителями этого края. Они обычно держатся особняком и избегают слишком прямого взаимодействия с правительством Стокгольма, особенно из-за своей истории преследований. Однако в условиях нашей по-настоящему свободной революции, которая идет полным ходом, мы не можем оставить этих людей в стороне. Мы протянем им оливковую ветвь, возместив им ужасы прошлого и пообещав вместе построить лучшее будущее!"
swerev.33.a: "Революция для всех или ни для кого."

swerev.34.t: "Международный рабочий"
swerev.34.d: "С победой синдикалистской революции шведские рабочие стали глобальным символом достоинства, силы и радости. Освободившись от оков капиталистической эксплуатации и аристократического упадка, рабочие теперь трудятся не в нищете, а с гордостью за законы, которые гарантируют им жилье, здравоохранение и досуг как основные права. Рабочие места стали демократичными, рабочий день сократился, а жизнь стала полнее. Гул промышленности теперь - это мелодия целеустремленности, а не угнетения. За рубежом мир наблюдает за этим с беспокойством. От Берлина до Токио реакционные режимы начали цензурировать шведские публикации, опасаясь, что их собственные рабочие могут пробудиться, следуя нашему примеру.\n\nПусть они боятся, ведь шведский рабочий больше не является винтиком в машине, а строителем будущего!"
swerev.34.a: "Тяжкий труд, хороший отдых."

swerev.35.t: "Шведская синдикалистская хартия"
swerev.35.d: "С победой революции и свержением старого порядка Швеция теперь является гордым оплотом синдикализма на севере. Вдохновленные декларациями Британского союза и Французской коммуны, мы пришли к тому, что настало время запечатлеть наше собственное видение мира. n\nЭта новая Шведская синдикалистская хартия закрепляет триумф рабочих, ликвидацию буржуазного угнетения и необратимое отвержение монархии, капитала и клерикализма. Хартия говорит о профсоюзах в каждой сфере и на каждом заводе, о сельских коммунах, объединенных в солидарности, и о народе, который больше не управляется, а управляет собой сам. Она осуждает империалистическую агрессию и буржуазные демократии, подтверждая нашу поддержку глобальной революции рабочего класса. От Мальмё до Кируны каждый швед должен знать, что он больше не подданный, а свободный мужчина или женщина. Для наших товарищей за рубежом эта хартия является маяком солидарности. Для наших врагов она является предупреждением: Север поднялся, красный и решительный."
swerev.35.a: "Синдикализм - идеология XX века и далее!"

swerev.36.t: "Фермерские синдикаты"
swerev.36.d: "В городах наши профсоюзы стали голосом рабочего класса, решая вопросы заработной платы, рабочего времени и условий труда с помощью коллективной силы и контроля со стороны работников. Однако революция должна выйти за пределы фабрик и охватить сельские районы. Сельское сердце Швеции, долгое время игнорируемое как монархами, так и капиталистами, теперь должно быть организовано.\n\nДля этого мы создадим сельскохозяйственные синдикаты, профсоюзы, созданные фермерами и для фермеров, руководствующиеся теми же демократическими принципами, которые движут нашими городскими движениями. Эти синдикаты дадут сельским рабочим возможность выразить свои проблемы и получить реальную, оперативную поддержку от нашего правительства. Земля, труд и средства к существованию больше не будут диктоваться сверху, а будут определяться теми, кто возделывает землю. Объединяя фермы и фабрики, мы связываем Швецию синдикалистской солидарностью, гарантируя, что ни один рабочий, ни в городе, ни в сельской местности, не останется без внимания."
swerev.36.a: "Нация не может жить, если она голодает."

swerev.37.t: "Северное сияние свободы"
swerev.37.d: "То, что началось как шепот недовольства, превратилось в хор освобождения. От дыма фабрик до тихих холмов сельской местности шведский народ переделал свой мир по образу свободы. Хозяева больше не отдают приказы, священники и политики больше не диктуют волю рабочим. Земля принадлежит тем, кто её возделывает, мельницы - тем, кто их обслуживает, а города - тем, кто называет их своим домом.\n\nКрасно-черное знамя развевается над возрожденной нацией, не благодаря завоеваниям или жадности, а благодаря единству тех, кто отказался преклонить колени. В каждой коммуне и профсоюзе, в каждой мастерской и на каждом поле дух солидарности вдыхает новую жизнь в народ, когда-то скованный цепями. Старый мир привилегий и угнетения молчит, уступив место гармонии свободных мужчин и женщин, работающих на равных.\n\nЭто не конец борьбы, а начало нового рассвета. Анархическая мечта пустила корни на Севере, и из её почвы начинает расти новое человечество."
swerev.37.a: "Народ наконец-то свободен."

swerev.38.t: "Скандинавские социалисты в Америке" #occurs if ACW - https://depts.washington.edu/moves/SP_map-scandinavian.shtml
swerev.38.d: "В 1910 году была образована Скандинавская социалистическая федерация, группа действий, которая оказывала общую поддержку Социалистической партии Америки, объединявшей шведских, датских и норвежских социалистов, проживавших в Соединенных Штатах. Однако из этих трех групп шведы составляли подавляющее большинство, в первую очередь из-за более многочисленного населения этой страны. С ростом радикализма в Соединенных Штатах группе удалось пережить период после Первой мировой войны, сохранив некоторую поддержку Социалистической партии Америки, а также оказывая некоторую помощь небольшим синдикалистским движениям в Америке.\n\nС началом второй американской гражданской войны и восстаниями рабочих в Стальном поясе Америки движение получило шанс засиять ещё ярче. Таким образом, у нас теперь есть возможность оказать помощь нашим скандинавским братьям в Северной Америке в борьбе с тираническими реакционерами в Америке."
swerev.38.a: "Отправить нашу помощь!" #cool beans
swerev.38.b: "Это оружие нужно нам самим." #revive the movement, aid CSA

swerev.39.t: "Помощь Скандинавской социалистической федерации" #Event CSA gets after previous sends aid
swerev.39.d: "В связи с тем, что революция, охватившая Швецию, предположительно достигла стабильной стадии, шведское правительство приняло решение оказать значительную поддержку Скандинавской социалистической федерации. Это партия действий, состоящая из скандинавских иммигрантов из Норвегии, Дании и Швеции, преимущественно шведов. До сих пор они оказывали нам незначительную поддержку, однако с новыми винтовками, пистолетами, советниками и продовольствием ССФ станет ярким примером подлинной интернациональной помощи."
swerev.39.a: "Ура шведам!"

swerev.40.t: "Бессмертный человек"
swerev.40.d: "Родившийся в июне 1897 года в семье Статаре в Уппланде, Ян Фридегорд провел детство в бедности и постоянном труде. Его отец работал бригадиром в амбарах поместья Катринедал, и семья часто переезжала с места на место в поисках работы. С семи лет он пас скот, а в четырнадцать лет взял на себя обязанности доярки. В восемнадцать лет он вступил в кавалерийский полк Life Regiment, прослужив три тяжелых года, прежде чем вернуться к гражданским трудностям. Его первые стихи появились в местных газетах в середине 1920-х годов, а его дебютный сборник Den svarta lutan был опубликован в 1931 году. В 1933 году последовал его первый роман En natt i juli. В 1930 году он взял псевдоним Ян Фридегорд, отмежевавшись от более ранних псевдонимов, таких как Фриде Йоханссон и Йохан Магерман, поскольку начал завоевывать признание за свои произведения, в которых открыто говорил о социальной несправедливости и жизни обездоленных.\n\nОднако с наступлением революции его склонность к синдикализму усилилась, поскольку он активно участвовал в синдикалистских демонстрациях и беспорядках во время неудавшейся контрреволюции армии. Теперь он прибыл в Рабочий Риксдаг не только как писатель, но и как человек, готовый помочь администрации как можно лучше. Уже пользуясь популярностью у многих благодаря своим предыдущим произведениям, мы можем просто предоставить ему средства для продолжения творчества, поддержав талантливого синдикалистского писателя, или пойти по более радикальному пути и пригласить его непосредственно в правительство. Это позволит ему воплотить в жизнь свои более утопические идеалы синдикализма.\n\nЧто нам делать с таким человеком?"
swerev.40.a: "Дать ему финансирование, такой талант нужно поддерживать!"
swerev.40.b: "Он станет прекрасным государственным деятелем!"

swerev.41.t: "Arbetaren - Рабочий!"
swerev.41.d: "Если забастовка является физическим проявлением силы рабочих, то Arbetaren - это литературная форма этой силы. Печатаемый большим тиражом в Эребру и написанный в Стокгольме под руководством как SAC, так и его ярого главного редактора Франса Северина, Arbetaren за последнее десятилетие пережил стремительный рост. Первоначально называвшаяся «Syndikalisten», газета была переименована в «Arbetaren», чтобы привлечь более широкую аудиторию, при этом продолжая отстаивать права рабочих, ценность объединения в профсоюзы, а также защищая взгляды от более ортодоксальных до более анархистских. Будучи твердо независимой, газета публиковала статьи о всех, от правых до левых. Нильс Флюг называл себя социалистом, но Arbetaren обвиняет его в предательстве дела в пользу тоталитарной догмы. Линдхольм описывается как грубый волк в овечьей шкуре, и даже Пер Альбин Ханссон с его альянсом SAP и LO представляется как агент капиталистической реакции. Однако, несмотря на свои критические статьи, Arbetaren прилагает все усилия, чтобы донести до остального шведского общества информацию о тяжелом положении рабочих. Газета Arbetaren, которую можно найти везде, где проходит забастовка, на баррикадах и в студенческих объединениях, имеет широкую популярность среди тех, кто ненавидит современный капиталистический мир и жаждет чего-то другого, свободного от угнетения, от всесильной государственной власти, от эксплуатации."
swerev.41.a: "Газета на вашей стороне."

swerev.42.t: "Искупление LO?"
swerev.42.d: "После восстания рабочих и полного краха SAP как партии, Landsorganisationen, блок профсоюзов, до сих пор связанный с несуществующей партией, оказался в плачевном положении. Поскольку большинство организаций, ранее связанных с SAP, начали превращаться в лояльных последователей SSV, многие полагали, что LO вскоре последует их примеру. Однако после собрания лидеров LO в «LO-Castle» в центре Стокгольма эта крупная организация раскололась, и многие профсоюзы перешли к различным благодетелям, в результате чего LO теперь объединяет лишь около половины своих первоначальных профсоюзов. Причиной этого раскола стало спорное голосование, в ходе которого LO должна была решить, присоединиться ли ей к SAC - своим бывшим противникам - или к SSV. После голосования, в результате которого победу одержали сторонники SAC, профсоюзы, отказавшиеся сотрудничать с синдикалистами, откололись и присоединились к растущему блоку небольших профсоюзов, связанных с SSV.\n\nПосле взрыва в руководстве LO централистское крыло SAC с радостью пригласило своих бывших противников в свои ряды, стремясь начать преобразование LO в синдикалистский блок-побратим. Однако это было воспринято с подозрением более радикальным анархистским крылом SAC, которое считает, что LO по-прежнему является лишь силой желтых профсоюзов, едва окрашенных в красный цвет. Враждебно настроенные по отношению к своим бывшим соперникам, анархисты утверждают, что этот новый приток псевдосиндикалистов только навредит движению и чистоте SAC, опасаясь, что SAC станет дегенеративным капиталистическим инструментом, если не будет поддерживаться в чистоте. Несмотря на это, централисты под руководством Франса Северина приступили к тяжелой работе по социализации и синдикализации профсоюзов под эгидой LO."
swerev.42.a: "Победа или начало раскола?"

swerev.43.t: "Свободный человек" #nils latt leader switcher
swerev.43.d: "Неприятная правда в нынешней анархо-синдикалистской Швеции заключается в том, что сама Оттосен-Йенсен, хотя и поддерживает свободолюбивые взгляды в большинстве вопросов, обвиняется многими в движении в том, что не обладает необходимыми для этой работы качествами. Мало того, что она уже является одним из основных движущих сил RFSU и уделяет много времени работе по достижению гендерного равенства, она также подвергается резкой критике за свою позицию по вопросу стерилизации, считая, что некоторые люди либо непригодны, либо нездоровы и им следует запретить иметь детей. Хотя эта позиция является общепринятой в Риксдаге с момента введения закона о стерилизации в 1934 году, она крайне непопулярна в обществе в целом, не говоря уже о городском пролетариате, где семьи опасаются, что правительство произвольно или иным образом признает их непригодными и впоследствии подвергнет мать или отца стерилизации. Таким образом, из-за вопроса стерилизации и того факта, что Оттосен-Йенсен обвиняется в двойной лояльности к анархистскому делу, в более широком движении появился соперник в лице Нильса Летта. \n\nНильс Летт, известный друзьям просто как «Ниссе», является анархистом, профсоюзным деятелем и моряком, который более десяти лет путешествовал по океанам, общался почти со всеми народами Атлантики и долгое время боролся против угнетения и тирании. Первоначально воодушевленный перспективой русской революции, Летт был отпугнут гражданской войной и последующей большевистской кровавой бойней и вместо этого увлекся синдикализмом, в частности синдикализмом, исповедуемым в Каталонии и Стране Басков. Приняв близко к сердцу идеалы хорошо образованного рабочего, Летт много читает и говорит на разных языках, даже балуется эсперанто в качестве увлечения. Во время восстания в Стокгольме Нильс Летт был избран лидером Красной гвардии и успешно боролся с агентами реакции, став видной фигурой в теперь более воинственной шведской левой партии. Хотя критики обвиняют Летта в том, что он является революционным бандитом, в отличие от более дипломатичной и склонной к классовому сотрудничеству Оттосен-Йенсен, он тем не менее был выдвинут в качестве претендента на её должность, что должно быть поставлено на голосование."
swerev.43.a: "Сохраните Оттосен-Йенсен!"
swerev.43.b: "Приведите Нильса Летта!"

swerev.44.t: "Неудобный закон"
swerev.44.d: "Впервые представленный в качестве закона в 1920-х годах SAP, а затем уточненный и доработанный в качестве закона AV в 1934 году, закон о стерилизации вызывает серьезные разногласия в шведском обществе. Первоначально созданный как способ разрешить и обязать стерилизацию инвалидов, умственно отсталых и других лиц с ограниченными возможностями, в 1934 году закон был расширен, чтобы также учитывать тех, кто считался антисоциальным, а также тех, кто считался «непригодным» для рождения детей. Мужчины и женщины, даже несовершеннолетние, подвергались и по-прежнему подвергаются стерилизации часто без их ведома или воли, и действительно, различные социальные системы в быстро развивающемся государстве всеобщего благосостояния вызывают большое недоверие. Мать-одиночка рискует быть обвиненной в «непригодности» к воспитанию собственных детей и может быть стерилизована, если когда-либо решит сделать аборт. Лицо, помещенное в психиатрическую лечебницу, будь то на временный или длительный срок, или ребенок, помещенный в детский дом, также подвергаются риску стерилизации, причем решение всегда принимает врач, а не семья или законный опекун. «Таттаре», сленговое название цыган или просто кочевых семей в целом, уже подвергаются риску лишиться своих детей, а их дети могут быть стерилизованы против их воли, что, когда об этом просочилась информация в прессу, вызвало массовое возмущение.\n\nЭтот евгенический закон, принятый Риксдагом с целью очистить шведское «племя» от дефектов и предотвратить воспитание детей с плохой моралью, вызывает всеобщее недовольство. Хотя консенсус в Риксдаге между всеми сторонами, левыми, правыми и центристами, означал, что закон никогда не будет отменен в ближайшее время, правда заключается в том, что пролетариат и бедные в целом абсолютно его презирают, рассказывая ужасающие истории о том, как появляются случайные правительственные агенты, считающие их дома «непригодными для детей», и в результате у них забирают детей, а родителей стерилизуют. Теперь, после революции, протесты пролетариата и различных анархистских групп привели к требованию проведения референдума об отмене закона, мотивируя это не только тем, что он является расистским, евгеническим и откровенно злым, поскольку действительно имели место злоупотребления, но и тем, что закон был злым с самого начала. Теперь, в духе революции, закон будет вынесен на суд народа."
swerev.44.a: "Соблюдать закон ради морального и национального блага!"
swerev.44.b: "Отменить этот отвратительный извращенный закон!"

swerev.45.t: "Мечты о новом союзе?" 
swerev.45.d: "Трагический провал советского эксперимента доказывает одно, по крайней мере для Линдрота и его партии. Все народы мира должны быть объединены под знаменем социализма, все народы должны быть освобождены, и это должно быть сделано путем дружеского сотрудничества, а не полного принуждения. Хотя большинство мыслителей в партии считают, что лучший способ достичь этого - через Коминтерн, через сотрудничество с различными коммунистическими партиями по всему миру, новое течение, пропагандируемое Линдротом, предлагает, что, возможно, вместо простого сотрудничества все коммунистические партии в самой Европе могли бы объединиться в одну, чтобы сформировать один огромный Европейский союз социалистических республик, EUSR. Хотя для большинства это остается несбыточной мечтой, основа для такого сотрудничества уже заложена в работах Интернационала и вышеупомянутого Коминтерна, не говоря уже о попытках до Первой мировой войны объединить пролетариат на позициях пацифизма, мира между людьми и равенства. Возможно, если дела пойдут дальше, если революция будет обеспечена и появится возможность её распространения, идея объединенной Европы станет возможной. В отличие от Линдерота, который хочет объединения всей Европы, его заместитель Уго Силлен выступает за совершенно другое. Пролетариат в Европе потерян, вместо этого SKP вместе с РКП должны продвигаться на восток, чтобы сформировать союз к западу от Урала. Хотя это и абсурдная идея, но разве она настолько нелепа? Силлен считает свою идею обоснованной, но Линдерот обвинил его в оппозиционизме и обструкционизме."
swerev.45.a: "Линдерот и Уго уже ссорятся?"

swerev.46.t: "Грёзы о единой социалистической Европе" 
swerev.46.d: "Идея единой Европы, предложенная такими мыслителями, как Пер Энгдаль, в последний раз была реализована Карлом Великим, но так и не распространилась дальше, чем на половину Европы. Тем не менее, вдохновленный трудами Калерги и заявлениями тоталитариста Освальда Мосли, Пер Энгдал вновь предложил объединить различные нации Европы в одно чисто европейское государство без таких враждебных элементов, как евреи, цыгане, реакционеры, капиталисты, потребительство и целый ряд других вещей и народов. Хотя Пер Энгдал не имеет политических связей со Свеном Оловом Линдхольмом, кроме общего чувства национализма и дружеских отношений, которые до сих пор удерживали Энгдала от столкновения со стеной, его идеи, тем не менее, в определенной степени повлияли на Свена Олова Линдхольма. Если бы Европа объединилась, чтобы стать тоталитарным союзом народов и культур, основанным на общих ценностях и убеждениях, кто мог бы это остановить? Американцы являются рабами потребительства и англосаксонской капиталистической гнили, славяне впали в состояние глубокой реакции, а народы Африки и Азии прикованы к капиталистическим и феодальным империалистам. Возможно, если осмелиться мечтать, тоталитарная Европа могла бы объединить весь мир."
swerev.46.a: "Мечта или кошмар?"

swerev.47.t: "Готический императив"
swerev.47.d: "Все нации имеют свой путь в истории, путь к социализму. Следуя материальной диалектике, Нильс Флюг предложил то, что его последователи назвали «готическим императивом», а именно, что германские страны имеют исторический долг стать социалистическими, чтобы привести мир к красному светлому будущему. Указывая на провал большевиков в России, а также на растущие псевдокапиталистические тенденции того, что Нильс Флюг называет «буржуазной интернационалой», Флюг выдвигает любопытную, хотя и немного нелепую тезу: поскольку германский мир в подавляющем большинстве индустриализирован, имеет большой городской пролетариат, его историческим долгом, обязательством и целью является стать социалистическим и таким образом распространиться за рубеж. Германский мир должен объединиться под одним знаменем, одним общим идеалом пролетарского освобождения, чтобы уничтожить англо-славянский капиталистический Гог и Маггог. По мнению Нильса Флюга, все германские народы должны объединиться, чтобы спасти мир, и что если сама Германия станет красной, а её император будет свергнут, она станет таким сильным социалистическим оплотом, что ни одна нация не сможет противостоять ей."
swerev.47.a: "Нильс, о чем ты говоришь?"

swerev.48.t: "Дело Хёглунда"
swerev.48.d: "По мере того как революция продолжается и перерастает в красный террор, она начинает пожирать своих же. Зет Хёглунд, важный социалист и лидер партии SSV, был судим, признан виновным и казнен в тот же день так называемым «Революционным трибуналом», сформированным с согласия Нильса Флюга и его соратников.\n\nРано утром, выходя из своей квартиры, чтобы встретиться с немецким эмигрантом, Зета Хёглунд был арестован группой мятежных солдат, называвших себя «Рёдгардистер», или Красная гвардия. Зета Хёглунд был доставлен через Стокгольм в заброшенную баню Стрёмбадет, снос которой был отложен из-за революции. Оказавшись внутри, он был принудительно доставлен перед так называемый трибунал, состоящий из Нильса Флюга, Агатона Блома, Арвида Олссона и Антона Нильсона. Перед трибуналом Нильс Флюг обвинил своего бывшего друга и товарища по партии Зета Хёглунда в сговоре с иностранными агентами, сославшись на попытку Хёглунда встретиться с немецким изгнанником, которого Флюг назвал немецким шпионом. Сославшись также на неспособность трибунала арестовать этого немецкого контакта, Флюг использовал это в качестве дополнительного аргумента, доказывающего подрывной и тайный характер связей Хёглунда с Германией.\n\nСсылаясь на чрезвычайные обстоятельства, в которых находился Стокгольм, такие как активные боевые действия армейских подразделений в казармах против рабочих ополченцев, Флюг предположил, что Хёглунд на самом деле был просто марионеткой империалистов, белой овцой, просто окрашенной в красный цвет, и потребовал расстрелять Хёглунда или, по крайней мере, арестовать его. То, что трибунал был организован Флюгом, было очевидно и явно. Не только Агатон Блом и Арвид Олссон были членами партии Флюга, но и Арвид Нильсон, известный революционер, был там только для того, чтобы узаконить иначе крошечный трибунал, и чувствовал себя некомфортно на протяжении всего заседания. Несмотря на мольбы и утверждения Хёглунда об обратном, трибунал проголосовал за его смерть, а Нильсон, протестуя, был вынужден покинуть заседание, когда было совершено это судебное преступление.\n\nНемец, с которым Хёглунд намеревался встретиться, Карл фон Оссиетцкий, на самом деле был журналистом, который ушел в подполье, как только заметил, что Хёглунд не явился на встречу. Когда красногвардейцы постучали в дверь и ворвались в его комнату, фон Оссиетцкий уже был на другом конце города, пытаясь найти убежище у членов SSV. Не желая или не имея возможности арестовать Флюга и его приспешников, несмотря на убийство истинного социалиста, Флюг провел день, утверждая, что Хёглунд был предателем социалистического дела, которого просто нужно было убить, и пока правительство занимается последствиями убийства Ханссона и полным крахом государственного аппарата, вряд ли Флюг скоро увидит справедливость."
swerev.48.a: "Кто санкционировал это!?"


#Totalist start

swerev.49.t: "Флюг объявляет о победе в Рабочем риксдаге"
swerev.49.d: "Вопреки всем прогнозам, Нильс Флюг и его национальные синдикалисты одержали победу в Рабочем Риксдаге. Хотя многие по-прежнему считают партию Флюга маргинальным и неуправляемым движением, она завоевала признание благодаря строгой дисциплине, боевой организации и обещанию восстановить порядок в хаосе революции. Его последователи, которых часто описывают скорее как бандитов, чем как государственных деятелей, считают себя авангардом новой Швеции, решительно настроенным искоренять декаданс и разобщенность везде, где они появляются.\n\nСам Флюг, пламенный оратор и неутомимый агитатор, теперь стоит перед сложной задачей превратить радикальные обещания в прочное правление. Хотя его движение остается небольшим по сравнению с более крупными синдикалистскими течениями, он не стоит в полном одиночестве. Коммунисты Свена Линдерута, все ещё придерживающиеся доктрин старого большевизма, предложили свою поддержку, полагая, что Флюг - лучший шанс для обеспечения сильной центральной власти. Даже фанатичное Шведское социалистическое собрание Свена Олова Линдхольма, несмотря на свою репутацию крайних и часто противоречивых радикалов, поддержало Флюга.\n\nИмея союзников из всех фракций раздробленного революционного спектра, Нильс Флюг теперь стоит во главе хрупкой, но грозной коалиции. Сохранится ли эта коалиция или рухнет под тяжестью собственных разногласий, пока неизвестно."
swerev.49.a: "Новая Швеция под руководством Флюга."

swerev.50.t: "Трещины в коалиции Флюга"
swerev.50.d: "Хотя Нильс Флюг только что встал у руля Рабочего Риксдага, широкая коалиция, приведшая его к власти, уже демонстрирует признаки напряженности. Свен Линдерут и его коммунисты, жестко приверженные доктринам централизованного большевизма, возмущаются синдикалистскими компромиссами и риторикой рабочих советов, которые по-прежнему присутствуют в программе Флюга. Они требуют более строгого государственного контроля, более жесткого надзора и ликвидации любых следов федерализма в революционном государстве.\n\nС другой стороны, Свен Олов Линдхольм и его фанатичное Шведское социалистическое собрание жалуются, что Флюг слишком снисходителен к умеренным и реформистам. По их мнению, революция должна быть очищена посредством безжалостных действий против «слабодушных» элементов, а любая терпимость к инакомыслию рассматривается как предательство. Их полувоенные последователи открыто бормочут, что Флюг рискует упустить шанс создать по-настоящему радикальный новый порядок.\n\nОказавшись между двумя бескомпромиссными союзниками, Флюг должен идти по опасной грани. Его коалиция пока ещё функционирует, но с каждым днем напряженность нарастает. Вопрос теперь не в том, усугубятся ли трещины, а в том, сможет ли Флюг контролировать бурю, когда она разразится."
swerev.50.a: "Коалиция держится... пока."

swerev.51.t: "Понятия идеологии"
swerev.51.d: "После разгрома оппозиции и укрепления своего влияния в Раде рабочих Нильс Флюг и SNSP стоят на перепутье. Внутренние борьбы закончились, соперничающие фракции коммунистов и социалистов устранены, и теперь вопрос сводится к идеологическому курсу нового порядка. Некоторые утверждают, что национальный синдикализм остается естественной основой, уравновешивающей радикальную организацию труда и национальную силу. Другие смотрят за границу, видя в аргументах британских максимистов модель централизованной власти и массовой мобилизации. Небольшая фракция считает, что левый национализм, основанный на единстве и гордости, может лучше послужить для сплочения народа, сохранив при этом революционный дух. Пришло время Флюгу решить, каким путем пойдет Швеция в будущем и под каким знаменем она пройдет через бурю новой эпохи."
swerev.51.a: "Сохранить национальный синдикализм."
swerev.51.b: "Принять линию британского максимизма."
swerev.51.c: "Повернуть в сторону левого национализма."
swerev.51.e: "Сохранить бухаринизм."

swerev.52.t: "Чистка Риксдага"
swerev.52.d: "Хрупкая коалиция, приведшая Нильса Флюга к победе в Рабочем Риксдаге, начинает давать трещины. Свен Линдерут требует более жёсткой коммунистической линии, а Свен Олов Линдхольм теряет терпение и призывает к безжалостным действиям против умеренных. Флюг, оказавшийся между двух огней, решил нанести решительный удар по своим оппонентам в палате.\n\nFolkets Nationella Säkerhetspolis было поручено провести тихую кампанию запугивания и устранения. Бывшие представители SAP, которые все ещё придерживаются своих старых, более мягких представлений о социализме, лишаются влияния и постепенно вытесняются из политической жизни. Между тем, Sveriges Arbetares Centralorganisation, долгое время бывшая оплотом анархистской мысли, была разбита. её самые бескомпромиссные анархисты исчезают из поля зрения общественности, в то время как её более центристские члены привлекаются и вливаются в Sveriges Nationalsyndikalistiska Parti, придавая SNSP новую силу.\n\nС каждой неделей в палате становится все тише, все меньше голосов осмеливаются бросить вызов направлению, заданному Флюгом. То, что когда-то было форумом для дебатов, становится дисциплинированным органом движения. Однако даже несмотря на то, что чистки укрепляют контроль, внутри самой коалиции растёт напряженность. Линдрот беспокоится, что он будет следующим, кого заставили замолчать, а Линдхольм шепчет, что снисходительность Флюга по отношению к избранным новобранцам свидетельствует о слабости. Пока что коалиция держится, но Рабочий Риксдаг все больше подчиняется только воле Нильса Флюга."
swerev.52.a: "Палата должна быть очищена от всех слабостей."

swerev.53.t: "Судьба SKP"
swerev.53.d: "Доминирование Шведской национал-синдикалистской партии в Рабочем риксдаге все больше загоняет Шведскую коммунистическую партию в угол. Свен Линдерут и его сторонники в SKP продолжают проповедовать жесткую линию большевизма, призывая к бескомпромиссному централизованному планированию и осуждая синдикалистскую и коалиционную политику Нильса Флюга. Их голоса становятся все громче с каждой сессией, их брошюры - все более радикальными, а их последователи шепчут о грядущем расплате.\n\nСоюзники Флига утверждают, что SKP стала невыносимой угрозой для SNSP и стабильности в Риксдаге. Folkets Nationella Säkerhetspolis уже начала собирать досье на ведущих коммунистов, готоясь приступить к их арестам и судебным разбирательствам. Чистка уничтожит последний бастион открытого большевизма в Швеции и обеспечит Флигу бесспорную власть.\n\nУсложняет дело то, что ряд разочарованных членов старой Sveriges Socialdemokratiska Vänsterparti начали переходить в фракцию Линдрота, надеясь, что коммунисты могут предложить им защиту и восстановление влияния. Их присоединение только укрепляет потенциальную базу власти SKP. Если их оставить в покое, коммунисты могут собрать в своем лагере остатки разгромленных фракций, превратив терпимую оппозицию в настоящую соперничающую силу.\n\nВыбор очевиден: либо избавиться от коммунистов сейчас, либо позволить им остаться, рискуя тем, что их терпение однажды может закончиться открытым восстанием."
swerev.53.a: "Очистить SKP, прежде чем они начнут действовать первыми."
swerev.53.b: "Терпеть их... пока."

swerev.54.t: "Падение SSS"
swerev.54.d: "После чистки и разгрома коммунистов из Sveriges Kommunistiska Parti Рабочий риксдаг стал более спокойным, но не полностью покорным. Одна фракция по-прежнему отказывается подчиняться руководству Нильса Флюга - Свен Олов Линдхольм и его Svensk Socialistisk Samling. SSS разделяет некоторые идеологические позиции SNSP Флюга, однако Линдхольм давно критикует Флюга за слишком мягкое отношение к умеренным и нерешительность в вопросах национальной дисциплины. Его риторика становится все более резкой на закрытых заседаниях, его агитация ощущается в зале, и его связи с воинствующими уличными кадрами нельзя игнорировать.\n\nСообщения от Folkets Nationella Säkerhetspolis указывают на нечто более мрачное: появились доказательства тайных встреч Линдхольма с бывшими монархическими генералами, такими как Арчибальд Дуглас. Если это правда, то Линдхольм больше не является просто соперником в революционном лагере, а заговорщиком, готовым рискнуть контрреволюцией.\n\nФлиг теперь стоит перед выбором: нанести удар по Линдхольму и SSS, как он сделал с коммунистами, или позволить этому неудобному партнерству продолжаться, рискуя тем, что SSS станет ядром националистической оппозиции, которая однажды может превратить внутренние трещины коалиции в открытый раскол."
swerev.54.a: "Устранить Линдхольма и расформировать SSS."
swerev.54.b: "Линдхольм не представляет реальной угрозы, лучше оставить его в покое."

swerev.55.t: "Флюг победоносный" #flyg wins
swerev.55.d: "«Революцию нельзя проводить в чистых перчатках!» - так заявляет Флюг в прессе. Победив фракционность в своей партии и более широком альянсе, Флюг упрочил свою власть на долгие годы, хотя это стоило ему дорого. Его чистки, хотя и часто воспринимались как благо для общества, заставили бывших союзников с осторожностью относиться к нему. Дело Хёглунда лишило его более умеренных союзников, затем чистки в SKP устранили товарищей по его старой борьбе, а последующее уничтожение SSS, хотя и оправданное, сделало его более изолированным, чем когда-либо. Его секретари больше не участвуют в светских беседах, внутренний партийный комитет больше не так дружелюбен и не так энтузиастичен, и гигант современного шведского общества больше не получает столько оваций от Рабочего Риксдага."
swerev.55.a: "На вершине одиноко."

swerev.56.t: "Флюг, потерпевший поражение" #lindholm wins
swerev.56.d: "Суть жизни - это борьба, борьба за победу, воля к завоеванию. Флюг, не сумев справиться со своими бывшими союзниками по интересам, в конечном итоге был отвергнут историей и самой жизнью. Агенты и сторонники SSS проникли в его собственное движение, и Флюг был застигнут врасплох, когда вооруженные люди ворвались в его офис и вручили ему письмо об отставке. Требуя от него подписать заявление об отставке, а также письмо с признанием в ложном обвинении и неправомерном расследовании дела Хёглунда, Нильс Флюг был арестован и помещен под домашний арест. В то время как Линдхольм и его люди спешат в Рабочий Риксдаг, чтобы провозгласить себя новым правительством, сам Флюг оказался в стороне, его собственное движение было подвергнуто подрывной деятельности, его дело было скомпрометировано, он стал человеком, потерпевшим поражение."
swerev.56.a: "Живым... Но не надолго."

swerev.57.t: "Флюг изгнанный" #linderot wins
swerev.57.d: "Нильс Флюг и Линдеррот ненавидели друг друга. Они всегда ненавидели друг друга. Флюг ненавидел то, как Линдеррот, номинальный союзник, оставался приверженцем системы, преданной Свердловым и Зиновьевым, а Линдеррот никогда не мог принять то, что Флюг, искусный оратор и истинный революционер, предал дело шведского социализма в пользу догматического мослиевского тоталитаризма. Тем не менее, когда дело дошло до критической точки, два соперника отложили в сторону свои разногласия во имя революции и объединились, чтобы укрепить сильное централизованное социалистическое государство... Но этот союз не был долговечным. На тайных встречах по всей стране Линдерот и Силлен смогли собрать силы умеренных и радикалов, объединившихся против Флюга, что дало SKP необходимую рабочую силу и влияние, чтобы вынудить Флюга уйти в отставку. Во время заседания в Рабочем Риксдаге Нильс Флюг был внезапно загнан в угол представителями, которых когда-то считали лояльными, во главе с Линдротом. Не имея возможности защитить себя от разъярённой толпы политиков, Флюг был вынужден объявить себя непригодным для роли лидера и был немедленно арестован революционным трибуналом, состоящим из членов SKP, не совсем отличающимся от того, который он сам когда-то контролировал против Хёглунда. Его телохранители снаружи были арестованы офицерами, а люди, разочарованные Флюгом, бывший лидер революции был предан суду, исключен из своей партии и Рабочего Риксдага и помещен под домашний арест. После отстранения Флюга Линдерот был избран на высший пост, наконец-то дав SKP бразды правления."
swerev.57.a: "Бескровный переворот."

swerev.58.t: "Расширение партии"
swerev.58.d: "Хотя Нильс Флюг и его национальные синдикалисты захватили контроль над Рабочим риксдагом, их движение остается небольшим по сравнению с более широкими синдикалистскими и анархистскими фракциями. На данный момент их сила заключается в дисциплине и безжалостной организации, а не в численности. Флюг понимает, что эта слабость не может сохраняться, если он хочет, чтобы его революция выжила.\n\nНекоторые из его советников призывают его начать широкую кампанию по привлечению рабочих и молодежи в ряды партии с помощью пропаганды, митингов и обещаний стабильности. Другие, однако, утверждают, что только бескомпромиссное принуждение может обеспечить истинную лояльность, и требуют, чтобы членство в партии было обязательным для всех, кто занимает ключевые посты в промышленности и правительстве. Каждый из этих путей будет определять будущее движения, решая, будет ли партия расти за счет убеждения или страха."
swerev.58.a: "Поощрять членство с помощью митингов и пропаганды."
swerev.58.b: "Ввести обязательное членство по всему штату."

swerev.59.t: "Маркетинг от старых друзей" #flyg buhkarin ties
swerev.59.d: "После окончания мировой войны Нильс Флюг сначала примкнул к идеалам русских революционеров и основал Коммунистическую партию в Швеции. Однако, поскольку гражданская война закончилась поражением русских социалистов и появлением синдикализма во Франции и Великобритании, Флюг слегка изменил идеологию партии, чтобы привлечь больше избирателей, поддерживающих синдикализм.\n\nТеперь, когда его мечта о революции в Швеции осуществилась, Нильс Флюг вновь оказался в контакте со знаменитым русским революционером Николаем Бухариным, который связался с ним, услышав о приходе Флюга к власти. После нескольких недель общения между двумя мужчинами завязалась дружба по переписке: оба верили в грядущую международную революцию и обсуждали свои общие идеалы.\n\nОднако Бухарин отличается в деталях идеологии: в то время как Флюг склоняется к синдикализму, сохраняя при этом некоторые черты коммунизма, Бухарин предлагает свою собственную форму социализма. Эта идеология, получившая название «бухаринизм» или «социализм в городе, капитализм в деревне», нашла поддержку в России среди сторонников Бухарина. Несмотря на новизну этой идеи, большинство членов кабинета Флюга считают, что такие экономические предложения нереалистичны и нежизнеспособны для Швеции и её революции. Однако небольшая часть, в том числе некоторые члены SSV, считают, что внедрение экономических планов Бухарина в Швеции может дать отличные результаты.\n\nТеперь выбор остается за председателем: сохранить текущую линию партии национального синдикализма для Швеции или отклониться в сторону видения Бухарина в скандинавском регионе?"
swerev.59.a: "Новые идеи, но революция в Швеции уже обеспечена."
swerev.59.b: "Идеалы Бухарина должны воплотиться в Швеции!"

swerev.60.t: "Культ Флюга?"
swerev.60.d: "С победой Нильса Флюга и его национальных синдикалистов в Рабочем Риксдаге его имя и присутствие начали доминировать в политической жизни. Его пламенные речи повторяют в мастерских и профсоюзных залах, его изображение нарисовано на транспарантах, которые несут рабочие бригады, а его произведения цитируют самые преданные активисты. Среди рядовых членов движения растёт убеждение, что Флюг - это не просто политический лидер, а воплощение самой революции и живое доказательство её будущего успеха.\n\nНе все в движении приветствуют такое развитие событий. Некоторые опасаются, что придание такого большого значения одной личности может свести революцию к воле одного человека. Другие утверждают, что такая преданность может привести к единству часто раздробленной коалиции и стать достаточно сильным объединяющим фактором, чтобы заглушить несогласие. Сейчас дискуссия сводится к тому, как Флюг и его ближайшее окружение должны реагировать: позволить этому культу развиваться самостоятельно, поощрять его с помощью тонкой пропаганды или выделить ресурсы для создания настоящего мифа вокруг его лидерства."
swerev.60.a: "Пусть все идет своим чередом, народ сам решит, герой он или нет."
swerev.60.b: "Поддержать его имидж с помощью плакатов, речей и лояльной прессы."
swerev.60.c: "Принять это полностью, Флюг - это сама революция."

swerev.61.t: "Судьба промышленников" #flyg fate of former industrialists
swerev.61.d: "После того как фракция Нильса Флюга обеспечила себе доминирующее положение в Рабочем риксдаге, внимание переключилось на остатки старого порядка. Промышленники, которые когда-то поддерживали монархию и обогатились за счет труда шведских рабочих, теперь предстают перед судом. Некоторые члены Риксдага полагают, что, несмотря на вину в эксплуатации, они все ещё могут приносить пользу, если будут находиться под строгим контролем правительства, которое будет использовать их опыт, но никогда не доверять им. Другие требуют, чтобы эти люди, символы жадности и вероломства, были полностью уничтожены, а их активы конфискованы, чтобы не осталось и следа от старого режима.\n\nФлюг должен решить, будут ли фабрики Швеции работать под бдительным надзором нового государства или старый промышленный класс будет полностью уничтожен."
swerev.61.a: "Они должны находиться под государственным контролем. Их работа теперь принадлежит революции."
swerev.61.b: "Их нужно очистить. Не должно остаться ни следа от старых паразитов."

swerev.62.t: "Тень чистки"
swerev.62.d: "По всей Швеции распространяются слухи о мужчинах, исчезающих ночью, о дверях, выбитых офицерами в масках, и о документах, сжигаемых до прибытия следователей. Внутри движения ходят слухи, что некоторые так называемые союзники никогда не были по-настоящему лояльны революции. Свен Линдхольм, которого когда-то терпели за его рвение, был уличен в поддержании тайных контактов с бывшими монархическими генералами, в том числе с самим Арчибальдом Дугласом. Биргер Фуругорд, тем временем, все больше склоняется к опасным расовым теориям и яростному национализму, открыто враждебному синдикалистскому порядку. Конрад Халлгрен, когда-то скрывавшийся от посторонних глаз, подозревается в воссоздании собственной сети боевиков.\n\nЧтобы противостоять этим угрозам, Флюг незаметно задействовал Folkets Nationella Säkerhetspolis, FNS. Их работа тиха, их методы невидимы, а результаты неоспоримы: расследования исчезают в темноте, судебные процессы никогда не появляются на поверхности, а имена, когда-то произнесенные в парламенте, исчезают в ничто. Даже лояльные товарищи теперь оглядываются через плечо, боясь стука в дверь. Чистка началась, и она не прекратится, пока не будет уничтожен каждый скрытый враг."
swerev.62.a: "Сäkerhetspolis завершит то, что было начато."

swerev.63.t: "Опиум для народа" #flyg removing church
swerev.63.d: "Нет силы, более разрушительной для разума, нет оков, более удушающих дух прогресса, чем древние и разлагающие учения религии. Слишком долго умы шведов были скованны суевериями, сначала через окровавленные обряды норвежского язычества, а затем через долгую, мрачную тень, отброшенную христианством. С того момента, как крест был поднят над нашими храмами и алтарями, на Швецию обрушилась тьма - тьма покорности, вины и слепого повиновения невидимым хозяевам.\n\nНо теперь все кончено. Эпоха божественных лжи подходит к концу.\n\nХотя многие все ещё отчаянно цепляются за эти иррациональные верования, взращенные поколениями индоктринации и страха, пришло время начать великую терапию правды. Религия - это опиум умирающего мира, костыль для слабых, инструмент для эксплуататоров, и мы увидим, как она будет свергнута, разбита и дискредитирована. В революции нет места сказкам и призракам; её алтарь - разум, а её писание - сила.\n\nЭто будет нелегкая борьба. Паразит веры имеет глубокие корни. Но мы знаем, что путь праведен, и мы не колеблемся. Через образование, через волю, через неугасаемое пламя идеологической ясности мы избавим наш народ от последних остатков религиозного заблуждения. В конце концов, ни один швед не будет преклоняться ни перед небом, ни перед пророками, ни перед богами. Они будут преклоняться только перед Революцией - и перед Председателем, живым воплощением судьбы Швеции!"
swerev.63.a: "Опиоидная заместительная терапия начинается с замещающего вещества..."

swerev.64.t: "Свобода от восстаний" #flyg FNS have rooted out final enemies
swerev.64.d: "За последние несколько месяцев недавно сформированные Флюгом FNS не теряли ни секунды, защищая Швецию. От подавления профсоюзных активистов и бунтовщиков ещё до того, как они вышли на улицы, до выкуривания самых хорошо спрятанных террористов, укрывающихся среди холмов Лапландии, ни одна часть Швеции не осталась без обыска. Добившись такого успеха, Флюг смог объявить шведскому народу, что безопасность вновь восстановлена, что успех FNS и его политика излечили Швецию от многих недугов. Но за таким успехом следует усталость, ведь даже сейчас нация не может расслабиться. Хотя внутренние угрозы, возможно, исчезли благодаря огромным усилиям, иностранные угрозы по-прежнему остаются: от шпионов и магнатов из Рейхспакта до далеких реакционеров в Антанте и огромного титана, которым является русский медведь на востоке, Швеция должна оставаться бдительной. В связи с этим ФНС теперь обращает свой взор вовне, готовясь и подготавливаясь скрываться среди наших врагов, чтобы Флюг и Швеция всегда могли быть на шаг впереди."
swerev.64.a: "Вступить в FNS сегодня, дабы защитить нашу родину!"

swerev.65.t: "Швеция, синдикализм, социализм" #flyg tree ending event
swerev.65.d: "Социализм потерпел крах в России. Он был уничтожен из-за некомпетентности большевиков и интриг меньшевиков. Социализм потерпел крах во Франции. Он был извращен и развращен криптокапиталистическими профсоюзами и анархическим безумием. Социализм потерпел крах в Великобритании. Он был убит, ударен в спину, псевдокапиталистическими бывшими депутатами от лейбористской партии и бюрократической некомпетентностью.\n\nСоциализм преуспел в Швеции. Под дальновидным руководством Нильса Флюга Швеция была очищена от капиталистической гнили, искоренила бюрократическую бездеятельность и анархистский обструкционизм, даже похоронив при этом притворных большевиков. Как солнце, восходящее над землей, социализм торжествовал, а паразиты оппозиции разбежались, чтобы спрятаться в темноте. Для своих последователей Флюг является провидцем, героической революционной фигурой, подобной Робеспьеру или Марату, преданной делу превыше всего, пожертвовавшей своим здоровьем, семьей, самой жизнью ради дела. Для своих противников Флюг погрузил Швецию в мрак на многие поколения вперед, которые готовы на все, чтобы достичь социализма, настолько извращенного, что он имеет мало общего с каким-либо марксистским течением."
swerev.65.a: "Флюг победил, Швеция победила."

#Linderot 

swerev.66.t: "Линдеррот, шведский Ленин?"
swerev.66.d: "Свен Линдерут посвятил свою жизнь борьбе за социализм, подобно своему бывшему сопернику Нильсу Флюгу. На протяжении десятилетий Линдерут работал как в Риксдаге, так и за рубежом, на партийных собраниях и в редакциях газет, исключительно ради дела социализма, социализма, о котором к сожалению большинство уже забыло. Линдерут - истинный борец за социализм. В 1919 году он прорвал блокаду Советской России, протащив корабль Eskilstuna III, служа вторым помощником на мостике во время акта братской международной любви. Сказать, что Линдерот, или «Свен-Лассе», как его дружелюбно называют в прессе, имеет большие планы на Швецию, было бы преуменьшением. Несмотря на стремление сотрудничать с другими социалистами по всем вопросам для достижения шведской революции, вдохновленной большевиками, Линдерот сталкивается с оппозицией внутри своей собственной партии, не говоря уже о реакционерах, скрывающихся в лесах и замышляющих его падение. Линдеррот верит, что Швеция может стать маяком интернационализма и социализма на крайнем севере, а в случае необходимости распространить его за границу. С Лениным в качестве своего проводника Линдеррот достигнет истинного социализма или умрет, пытаясь это сделать."
swerev.66.a: "Fred, frihet, återuppbyggnad."

swerev.67.t: "Меньшинство в Рабочем Риксдаге" #giving sillen powers
swerev.67.d: "Не секрет, что в многочисленных фракциях Рабочего Риксдага Линдеррот и его коммунисты составляют небольшое меньшинство. Поскольку многие члены по-прежнему остаются верными SSV, SAC и оставшимся фанатикам Флюга, поиск способа контролировать оппозицию имеет первостепенное значение для восстановления стабильности в условиях коммунизма. В связи с этим опытный и ярый коммунист Уго Силлен, в настоящее время правая рука Линдрота по вопросам внутренней безопасности, запросил расширение полномочий в Риксдаге. Ему будет предоставлена власть «убеждать» членов других партий присоединиться к SKP и ассимилироваться в ней. С обещаниями тихих и менее публичных встреч с такими министрами, эта идея представляется эффективной, но довольно диктаторской. Оставление Уго Силлена на его нынешней должности приведет к более медленной интеграции других партий и ограничению полномочий радикалов в Риксдаге. Это также даст ему больше времени для выполнения других обязанностей по охране Нильса Флюга, который в настоящее время находится под домашним арестом. Теперь необходимо принять решение: повысить Силлена, чтобы гарантировать соблюдение правил, или ограничить свободу действий «привязанной собаки» в рамках его нынешних полномочий?"
swerev.67.a: "Наши нынешние методы вполне устраивают."
swerev.67.b: "Повысить его, нам нужно большинство сейчас, а не позже."

swerev.68.t: "Широкий или узкий фронт?"
swerev.68.d: "Линдеррот и Силлен не ладят друг с другом, и так уже давно. Линдеррот, стремящийся работать вместе с другими социалистами разных направлений над созданием социалистического оплота для достижения социализма в своей стране, давно выступает против рабского отношения Силлена, который по-прежнему тесно связан с РКП. Силлен, либо из-за собственных убеждений, либо под влиянием извне, считает, что широкий фронт нанесет ущерб делу социализма, убьет революционную энергию партии и превратит Швецию в криптокапиталистическую синдикалистскую клоаку, подобную той, что существует в Париже. Силлен, который часто сталкивался с Линдротом из-за обвинений в медлительности и отсутствии революционной ярости, в ходе этой новой дискуссии внезапно стал другим человеком, обвинив своего бывшего товарища в предательстве революции из-за его умеренных взглядов. По мере обострения соперничества партия решила провести внутреннее голосование, чтобы окончательно решить этот вопрос. Следуя принципу демократического централизма, проигравший будет вынужден подчиниться результатам голосования, а победитель торжествовать. Линдерот представляет «широкую» фракцию, утверждая, что социализм может быть достигнут только при поддержке большего числа социалистов, чем только коммунистическая партия. Силлен представляет «узкую» фракцию, желая, чтобы партия и нация оставались незапятнанными внешними влияниями, коррумпированными капиталистическими интригами."
swerev.68.a: "Партия голосует за «широкую» фракцию!"
swerev.68.b: "Партия голосует за «узкую» фракцию!"

swerev.69.t: "Падение первого председателя" #Hugo coups lind
swerev.69.d: "В залах недавно отремонтированного Рабочего Риксдага, теперь украшенного серпами и молотами, где когда-то сидели бывшие правители, Линдерот тащится двумя красногвардейцами. Своей решимостью расширить революционный круг в Риксдаге, неудачной попыткой расширить и без того небольшое коммунистическое движение, Линдерот лишь открыл себя для захвата власти Уго Силленом.\n\nТеперь, имея длинный список преступлений, начиная от тайных встреч с контрреволюционерами и заканчивая сговором с бывшими социал-демократами, Уго не пощадил Линдерота в ходе показательного суда. Теперь ему грозит казнь, убийство за стенами того самого здания, которое он помог построить из руин, руками того самого человека, который стоял рядом с ним.\n\nХьюго Силлен, теперь с железной рукой управляющий Рабочим Риксдагом, использовал Свена Линдеррута как пример реформизма и тех, кто ему следует, и их конечной судьбы. Теперь он намеревается осуществить революцию Ленина в шведском бастионе, свободном от декаданса социальных капиталистов и монархистов, революцию, которая позволит каждому шведскому рабочему по-настоящему процветать."
swerev.69.a: "Коммунизм, здесь и сейчас!"

swerev.70.t: "Против террора" #If broad, aid to worst affected by red terror
swerev.70.d: "В первые дни революции, когда армия потерпела поражение в контрреволюции, хаос охватил всю Швецию. Верные революции мужчины и женщины поднялись на борьбу и защищали её от реакционных тиранов, однако в такие времена не все идет по плану. В городах и деревнях невинные гражданские лица и семьи пострадали или были несправедливо лишены своего имущества.\n\nКогда красный террор достиг своего пика, когда революционеры по праву вершили правосудие над монархистами и капиталистами, многие невинные свидетели оказались втянуты в конфликт. В связи с этим возникла проблема, как поступить с теми, кто больше всего пострадал от красного террора. Многие в партии считают, что финансовой помощи и официальных извинений со стороны партии будет достаточно, чтобы вернуть этих лишенных гражданских прав людей на нашу сторону. Другие считают, что такой шаг будет воспринят как минимальный, что ещё больше подтолкнет уже лишенных гражданских прав граждан к оппозиции нашему правительству. Только полная приверженность восстановлению того, что они потеряли, с помощью значительной финансовой компенсации за то, что было у них отобрано, наряду с официальными публичными извинениями от правительства, позволит нам вернуть этих пострадавших членов общества. Хотя некоторые сторонники жёсткой линии внутри партии считают этот шаг актом трусости, уступив самым незначительным требованиям народа, мы будем восприниматься скорее как благотворительная организация, чем как правительство.\n\nРешение теперь находится в руках высшего руководства Шведского социалистического государства, Свена Линдерута."
swerev.70.a: "Мы будем помогать тем, кто находится в наихудшем положении."
swerev.70.b: "Полная компенсация, в нашей новой Швеции никто не останется без внимания!"

swerev.71.t: "Создание Политбюро" #if narrow
swerev.71.d: "После принятия решения о сохранении чистоты революции и отказе от более умеренных групп, [SWE.GetLeader] приступил к реализации грандиозного проекта по очищению партии, пытаясь придать ей более выраженный стиль большевиков в РКП. Чтобы предотвратить внутрипартийные раздоры, которые проявились во время кризиса «широких» и «узких», [SWE.GetLeader] считает, что партия должна управляться из центра, буквально, путем создания политбюро, естественным главой которого станет он сам. Собрав вместе различных руководителей правительства в одной комнате и заставив всех вместе голосовать по вопросам политики, они надеются, что, оставаясь верными принципу демократического централизма, социализм одержит победу."
swerev.71.a: "За партию, за народ."

swerev.72.t: "Начало коллективизации" #collectivization intensity choice
swerev.72.d: "Настало время преобразовать шведскую деревню в основу подлинного рабочего государства. Правительство объявило о переходе от частного землевладения к полностью коллективизированной системе сельского хозяйства, в которой фермы будут объединены в крупные, управляемые государством единицы, которыми будут руководить избранные комитеты под надзором партии.\n\nСторонники приветствуют это как окончательный удар по сельской буржуазии и сохранившимся феодальным обычаям в деревне. Они представляют себе будущее, в котором тракторы заменят волов, механизация и научное планирование навсегда покончат с голодом, а зерно и молочные продукты Швеции будут свободно поступать на питание как рабочим на фабриках, так и солдатам на границе.\n\nОднако масштабы этой трансформации огромны, а риски реальны. Жесткая и быстрая программа позволила бы сразу захватить все сельскохозяйственные угодья, решительно сломив сопротивление, но создала бы риск нарушения циклов посева и сбора урожая. Такое нарушение может привести к тому, что сельские общины столкнутся с голодом до того, как система стабилизируется. Даже при умеренных темпах, хотя и более взвешенных, все равно могут возникнуть местные дефициты, поскольку старые методы будут отменены. Только самый мягкий подход, поощряющий добровольные кооперативы, дает почти гарантию стабильных поставок продовольствия, хотя он рискует оставить большую часть сельской местности вне полного контроля партии.\n\nЦентральный комитет должен теперь решить, как далеко и как быстро пойдет революция в сельском хозяйстве."
swerev.72.a: "Захватить их земли любой ценой."
swerev.72.b: "Отдать приоритет наиболее ценным сельскохозяйственным угодьям."
swerev.72.c: "Поощрять добровольную коллективизацию, где это возможно."

swerev.73.t: "Возрождение коммунизма" #communism is popular again
swerev.73.d: "Крах, последовавший за «Красным октябрем», нанес ущерб делу шведского коммунизма. Хотя сначала дело красных получило поддержку революционеров по всей Швеции, сопровождавшуюся забастовками и ранними попытками прорвать блокаду Петрограда с помощью грубой силы, переход к кровопролитной гражданской войне нанес делу непоправимый ущерб. Капиталистическая пресса распространяла ложь о зверствах большевиков, печатая ложные сообщения о голоде и ужасах, и шведский пролетариат был сбит с пути истинного социализма, который был реализован при молчаливой поддержке капиталистов из SAP. Однако сейчас, после многих лет упорного труда внутри страны и за рубежом, а также после относительно бескровного захвата власти, дело шведского коммунизма вновь набирает обороты. Школьники учатся с полными желудками, строятся больницы, укомплектованные компетентными и увлеченными работниками, а система социального обеспечения, когда-то служившая инструментом буржуазного подавления сознания пролетариата, превратилась в систему для народа, созданную народом и партией. Приглашая в партию людей, рабочих, студентов и оставшуюся бывшую буржуазную интеллигенцию, шведская коммунистическая партия наконец-то добилась успеха в возрождении духа коммунизма, очищенного от синдикализма и капиталистических извращений."
swerev.73.a: "Partiet är Folket!"

swerev.74.t: "Наши истоки в Петрограде"
swerev.74.d: "Определяющий момент шведского коммунизма был найден за рубежом, в огне большевистской революции. Свергнув коррумпированный режим Керенского и заставив меньшевиков уйти в подполье, Ленин и его революционные кадрицы приступили к преобразованию общества не путем выборов, а путем оружия, создав советы, в которых рабочие и крестьяне могли быть по-настоящему представлены. Вдохновленная этим, шведская коммунистическая партия долгое время шла рука об руку с РКП, даже когда большевики были вынуждены бежать из России в Париж. Линдерот, который смело штурмовал блокаду Петрограда, с самого начала установил связи с РКП, встретившись почти со всеми представителями российской большевистской среды, подобно Уго Силлену. Силлен впервые вступил в контакт с РКП, писая социалистические статьи и участвуя в уличных протестах, формируя при этом коммунистическое молодежное движение в Швеции. Именно благодаря этой деятельности Силлен впервые встретил Ленина, что оставило неизгладимое впечатление на молодого революционера, а после трагического убийства Ленина подтолкнуло Силлена к ещё более яростной революционной деятельности. Хотя Швеция имеет свою собственную революционную историю, такую как голодовки 1917 года и, более позднее, революция 1936 года, партия ведет свою историю от Красного октября, от Ленина, от социализма."
swerev.74.a: "Ленин Левер!"

swerev.75.t: "Роль международной революции" #linderot internationale question
swerev.75.d: "Наконец-то Швеция вновь обретает стабильность, беды коллективизации начинают уходить в прошлое, и большинство граждан Швеции считают Коммунистическую партию единственной правящей силой в стране. Теперь можно наконец задаться вопросом о международной политике: должна ли Швеция посвятить себя такой грандиозной задаче? В то время как некоторые фракции внутри партии считают восстановление полной приверженности интернационализму единственно возможным вариантом, многие в окружении Линдерота по-прежнему с осторожностью относятся к такой задаче.\n\nПо всем меркам Швеция является небольшой страной по сравнению с такими титанами, как Франция или бывшие революционеры, охватившие всю Россию. В связи с этим окружение Линдерота считает, что наиболее реалистичным способом достижения этой цели является сосредоточение усилий на освобождении ближайших стран от их капиталистических хозяев и союз с любыми иностранными группами, разделяющими схожую идеологию и готовыми помочь в распространении революции. Третье крыло, основанное на сторонниках жёсткой линии Уго Силлена, считает, что стремление к любой международной миссии в ближайшем будущем гарантированно обречет Швецию на гибель, вновь подвергнув её рабочих и граждан иноземному гнету. Уго утверждает, что только после того, как Швеция достигнет такого высокого уровня развития и силы, она сможет даже осмелиться претендовать на роль международной революции. В связи с этим он приветствовал внешнюю политику «коммунизма в одной стране», основываясь на том факте, что коммунизм должен быть зародился и развился в одной стране, прежде чем он сможет начать распространяться. При этом он подчеркнул, что другие скандинавские страны принимаются в эту сферу, поскольку они считаются жизненно важными для шведской революции.\n\nПолитбюро вновь стоит перед сложным выбором: поддержать радикалов и их интернационалистскую миссию? Оказать некоторую поддержку международной миссии, сохранив при этом некоторую национальную самостоятельность, или следовать линии Хьюго, сохраняя революцию в первую очередь внутри страны?"
swerev.75.a: "Коммунизм здесь и сейчас, мы его сохраним!"
swerev.75.b: "Мы должны начать подготовку к международной революции!"
swerev.75.c: "Пусть рабочие вздохнут с облегчением! Мы освободим весь мир!"

swerev.76.t: "Безмолвное окончание" #killing flyg
swerev.76.d: "Устранение Флюга от власти было быстрым, хотя и несколько безжалостным. Исключенный из собственной партии, исключенный из правящей коалиции и помещенный под домашний арест, Нильс Флюг, бывший лидер страны, давно смирился с жизнью, полной беспокойства и тревог, хотя по-прежнему остается преданным своей вере в социалистический мир. Читая новости и отправляя письма своим оставшимся друзьям и знакомым, находясь под постоянным наблюдением, Флюг пытался оставаться в курсе того, что происходит с его страной и её народом, по-прежнему твердо убежденный, что он не сделал ничего плохого для шведского социализма. Однако сегодня Флюг встретил свою смерть. Во время написания статьи, критикующей новый режим, Флюг перенес катастрофический сердечный приступ. Охранники, оповестив о чрезвычайной ситуации, быстро вызвали своего начальника, человека, которому было поручено осуществлять специальный надзор за Флюгом в интересах партии: Уго Силлена. Силлен, неспособный или не желающий дать достаточно быстрый ответ о том, отправлять ли Флюга в больницу или дать какие-либо указания, вскоре был проинформирован о том, что Флюг просто скончался. В коридорах власти бездействие Силлена теперь подвергается жёсткой критике, а Линдеррот обвиняет Силлена в грубой халатности, позволившей Флюгу умереть. Он утверждает, что Флюг не представлял угрозы для режима, поскольку все его письма и корреспонденция контролировались и подвергались цензуре, и что его смерть делает режим ещё более мстительным. В ответ на эту атаку Силлен заявляет, что Флюг должен был умереть, чтобы спасти страну, и что он не заслуживал медицинской помощи от народа, который он когда-то пытался угнетать. Кроме того, Силлен утверждает, что он сам страдал от «революционного истощения» и был просто физически неспособен и психически не готов быстро и оперативно отреагировать на бедственное положение Флюга.\n\nНильс Флюг похоронен на небольшом участке местного кладбища, в окружении друзей и родственников, под наблюдением государственного аппарата."
swerev.76.a: "Линдеррот прав, Силлен не сумел защитить Флюга!"
swerev.76.b: "Силлен не сделал ничего плохого, Флюг просто заслужил это!"

swerev.77.t: "Сгусток упадка" 
swerev.77.d: "Ранним утром тишина в доме Флюга была нарушена его криками боли. Его помощники нашли его в агонии, сжимающим грудь и задыхающимся, просящим как можно скорее отвезти его в больницу. По прибытии в больницу были вызваны лучшие врачи Швеции, чтобы оценить его состояние и выяснить, что с ним не так. Было быстро установлено, что на протяжении многих лет Флюг страдал от случайных приступов боли в груди и общего недомогания, которые возникали в области сердца и часто происходили без предупреждения или естественной причины. После этого было быстро установлено, что у него был небольшой тромб, который образовался в области сердца и вызвал сильную боль.\n\nВрачи теперь считают, что Флюг страдает не только проблемами со свертываемостью крови, но и каким-то хроническим заболеванием сердца, которое, по их мнению, может быть фибрилляцией предсердий. Это заболевание сердца, при котором сердце бьется нерегулярно и спорадически, что приводит к приступам боли, одышке и образованию тромбов. Считается, что такое заболевание возникает с рождения, а его причины до сих пор остаются полностью неизвестными, хотя некоторые британские исследования утверждают, что алкоголь может ухудшить состояние.\n\nОднако в далекой Австралазии патологоанатом недавно сделал открытие, которое считается прорывом в лечении фибрилляции предсердий. Сэр Сидней Смит, патологоанатом из Новой Зеландии, обнаружил, что, получая то, что он теперь называет «дигоксином», из растения наперстянка, которое ранее использовалось для лечения «одышки» и недиагностированной боли в груди. Другие ученые в области Смита также продемонстрировали предпочтение этому лекарству, например, сэр Томас Льюис, который добился большого успеха в использовании дигоксина вместе с хинидином для комбинированного лечения фибрилляции и трепетания предсердий. Таким образом, дигоксин продемонстрировал некоторые многообещающие результаты в области фибрилляции предсердий и сердечной недостаточности, возвращая сердцу стабильный ритм. Хотя точные механизмы действия такого препарата ещё далеки от полного понимания, результаты быстро говорят сами за себя, поскольку пациенты, принимающие этот препарат, демонстрируют быстрое восстановление дыхания, стабильный сердечный ритм и общее улучшение функций. Однако дигоксин не лишен рисков: некоторые пациенты страдают от сильной тошноты, рвоты, психоза и полной сердечной недостаточности.\n\nВрачи теперь обращаются к Агатону Блому, правой руке Флюга и второму лидеру партии, с вопросом о том, следует ли лечить Флюга дигоксином, зная, что это может спасти ему жизнь или убить его за считанные дни, или же пока воздержаться от лечения, давая Флюгу только хинидин, который имеет меньше побочных эффектов, для поддержания его основного сердечного ритма."
swerev.77.a: "Дайте ему двойную терапию дигоксином, Швеция нуждается в нем!"
swerev.77.b: "Думаю, одного хинидина будет достаточно."

swerev.78.t: "Конец шведского рулевого"
swerev.78.d: "Поздним вечером, всего через несколько дней после выписки из больницы, великий рулевой Швеции Нильс Флюг посетил торжественный банкет в свою честь. Многие видные деятели SNSP, а также иностранные союзники и высокопоставленные лица собрались, чтобы отпраздновать его лидерство и обсудить предстоящие вызовы. В зале кипели разговоры на самые разные темы: от растущей гегемонии Германии в Европе до неопределенной угрозы со стороны России на востоке.\n\nПо свидетельствам очевидцев, по мере приближения вечера Флюг выглядел бледным и замкнутым, хотя и отмахивался от беспокойства с обычной для него уверенностью. Когда он встал, чтобы выступить, его слова были резкими и решительными, пока не оборвались внезапно. На середине речи он схватился за грудь и рухнул на пол. По залу пронеслась паника, помощники и врачи бросились к нему, но, несмотря на их усилия, было уже слишком поздно. Нильс Флюг, архитектор шведской революции и рулевой нации, был мертв.\n\nСлухи быстро распространились по Стокгольму. Некоторые шептались, что его сердце не выдержало нагрузки лидерства, а другие задавались вопросом об обстоятельствах его кратковременной госпитализации несколькими днями ранее. Какова бы ни была правда, Швеция теперь стоит перед неопределенным будущим без своего руководящего руководства."
swerev.78.a: "Агатон Блом возьмет на себя роль национального синдикалиста от Флюга."
swerev.78.b: "Агатон Блом обеспечит безопасность нации, независимо от цены!"

swerev.79.t: "Флюг жив!"
swerev.79.d: "Вопреки рекомендациям некоторых врачей, Агатон Блом и медицинская бригада решили начать двойную терапию дигоксином и хинидином, лечение, которое обещало как большие результаты, так и большой риск. В течение нескольких напряженных дней Нильс Флюг оставался под пристальным наблюдением в больнице, его состояние колебалось между слабым выздоровлением и внезапным ухудшением. По Стокгольму начали распространяться слухи об ухудшении его здоровья, а в правительственных кругах ходили шепотки о том, что время Рулевого может скоро подойти к концу.\n\nОднако на пятый день произошло чудо. Флюг проснулся с новыми силами, его дыхание было ровным, а цвет лица вернулся к привычной бодрости. Нерегулярное сердцебиение наконец стабилизировалось. Вопреки всем прогнозам, новая терапия подействовала. Врачи объявили, что он вне опасности, хотя и предупредили, что ему по-прежнему необходим покой и тщательное наблюдение.\n\nКогда Флюг наконец снова появился перед руководством партии, его возвращение было встречено бурными аплодисментами. Многим в SNSP казалось, что сама судьба вмешалась, чтобы сохранить архитектора шведской революции. Его выздоровление стало символом настойчивости и божественного провидения, знаком того, что миссия Рулевого для Швеции ещё далека от завершения."
swerev.79.a: "Рулевой выдерживает ещё раз."

##Lindholm

swerev.80.t: "Национальная революция Линдхольма"
swerev.80.d: "Линдхольм, после своего внезапного захвата власти, теперь управляет Швецией с помощью своей небольшой группы фанатиков, и в глазах некоторых он предаёт идеалы, завоеванные недавней революцией. Такие скептики не могут все молчать, чтобы наше хрупкое правительство не пало снова. В связи с этим Линдхольм объявил, что Швеция переживает свою вторую революцию, настоящую социалистическую революцию. Революцию, не запятнанную синдикалистской угрозой во Франции, Великобритании или других странах.\n\nОн заявил, что истинный «социалист - это тот, кто ставит солидарность со своим народом, Швецией, превыше всего». Хотя последствия такой речи ещё предстоит ощутить, многие бывшие члены реакционных ультранационалистов прониклись симпатией к новой революции Линдхольма и заявили о своей поддержке его дела. Наряду с этим, члены бывшей партии Флюга быстро влились в партию, укрепив связи с непокорными социалистами.\n\nХотя предстоит ещё многое сделать, а поддержка по-прежнему низкая, первый шаг сделан, и с ним - наша победа!"
swerev.80.a: "Истинный национализм не может существовать без участия рабочего класса."

swerev.81.t: "Напряженность дома" #about Lindholm's worsening relationship with his radical wife
swerev.81.d: "Не вызывает сомнений, что великий Рикследаре Свен Линдхольм управляет Швецией железной рукой, двигая и влияя на нее своими требованиями. Армия приветствует его имя, граждане работают, чтобы производить в его имя, и никто не может отрицать его способность укрепить свое положение в шведском обществе. Однако за воодушевляющими речами и радиопередачами жизнь Линдхольма дома угасает в собственной борьбе.\n\nТолько его верные охранники слышат споры и крики между Линдхольмом и его недавно вышедшей замуж за него немкой Верой Оредссон, искренней национальной фанатичкой, которая была очарована Линдхольмом, когда он впервые пришел к власти. Однако дисциплинированный железный фасад мужчины, которого она видела на плакатах и слышала его громкий голос по радио, - это лишь одна сторона медали Линдхольма. Его другая половина была более тихой и менее разговорчивой, она изменила некоторые из первоначальных целей своей партии, такие как остановка индустриализации в некоторых районах, считая их природными чудесами, которые не должны быть испорчены сталью и железом. В других районах политические соперники получили меньшие сроки тюремного заключения, что позволило им в конечном итоге снова обрести свободу и вернуться в шведское общество. Для Веры это было почти полным предательством того, что она думала о мужчине, за которого вышла замуж.\n\nТеперь их ссоры и споры наполняют залы дома: она требует крови, обвиняя Линдхольма в том, что он не может по-настоящему очистить Швецию, а Линдхольм тихо возражает, считая более важным заботиться о природе и, возможно, даже о политическом примирении."
swerev.81.a: "Надеемся, что это не станет известно..."

swerev.82.t: "Новая красная гвардия"
swerev.82.d: "В первые дни революции Красная гвардия и небольшие рабочие отряды были сформированы для борьбы с военным переворотом против законного правительства. Со временем некоторые из этих гвардейцев сбились с пути и блуждали, растрачивая свой потенциал бывшим правительством. Теперь, под руководством Линдхольма, эти отряды и гвардейцы будут реорганизованы в новую официальную Красную гвардию, подчиняющуюся непосредственно Линдхольму и его ближайшим соратникам. Находясь вне юрисдикции полиции и военных, они будут действовать как праведный кулак нашего великого лидера. Они будут разгромить и заставить замолчать как реакционных монархистов, так и мятежные социалистические группы."
swerev.82.a: "Гордые и смелые, они служат."

swerev.83.t: "Распад оппозиции"
swerev.83.d: "Неудивительно, что наш новый режим по-прежнему довольно непопулярен среди большинства населения, и не только среди традиционных монархистов, которые остались в стране, и наших бывших союзников из левого лагеря. Члены анархо-синдикалистов уже начали беспорядки и открыто выступают против нашего режима, а вместе с ними и их союзники из SSV, которые осуждают наш социализм как не более чем реакционную чепуху!\n\nОднако благодаря контролю над военным аппаратом и солдатами Швеции, а также реорганизации нашей Красной гвардии, такая оппозиция продлится недолго. Многие оплоты синдикалистов преследуются и ликвидируются. Такие беды, такие провокации против нас не останутся безнаказанными!"
swerev.83.a: "Требуйте преданности, всегда."

swerev.84.t: "Рукопожатие с генералом Дугласом"
swerev.84.d: "После революции, охватившей нашу страну, многие генералы, особенно те, кто был причастен к неудавшемуся перевороту, либо бежали из страны, либо были схвачены и заключены в тюрьму до дальнейшего распоряжения. Одним из таких генералов, которому не удалось избежать плена, был известный националист и сторонник партизанской войны Арчибальд Дуглас. Виденный рядом с Юнгом, когда их солдаты пытались штурмовать Риксдаг, он вскоре был захвачен группой рабочих ополченцев после интенсивной перестрелки, в результате которой он и его немногие оставшиеся солдаты сдались. После сдачи и последующего заключения он оставался во временном заключении в тюрьме Лангхольмен, однако, узнав о приходе к власти Свена Линдхольма, он направил предложение новому председателю.\n\nДуглас, всегда бывший ультранационалистом, предложил Линдхольму свои услуги в обмен на возможность вновь возглавить шведские вооруженные силы, заявив, что его участие в прежнем перевороте было лишь неудачной попыткой спасти Швецию от беззаконных анархистов. Придерживаясь тех же националистических идеалов и идеалов командной экономики, что и Линдхольм, председатель нашел поддержку у этой бывшей радикальной националистической клики. Под строгим надзором самых лояльных гвардейцев Линдхольма генералы Арчибальд Дуглас и его бывший соратник Мартин Экстрём получили новые звания генералов в реформированной шведской армии и шанс искупить свои прошлые грехи.\n\nХотя многие левые считают такой шаг безумным, фанатики Линдхольма видят в этом национальную победу: если можно реформировать таких людей, то, безусловно, можно реформировать и всю нацию. В любом случае, шведская армия теперь укреплена более компетентным и опытным руководством."
swerev.84.a: "Если монархист может реформироваться, то любая душа может!"

swerev.85.t: "Обращение к нации"
swerev.85.d: "Сегодня, в рамках грандиозного и тщательно спланированного проявления национальной мощи, Рикследаре Линдхольм обратился к народу Швеции с непоколебимой властью, обнародовав основы новой эры — эры, закаленной в огне, дисциплине и судьбе. Стоя перед морем флагов и ревущей толпой, он объявил о разработке новой национальной хартии, не похожей ни на одну из тех, что когда-либо видел мир. В отличие от рушащихся конституций Великобритании или пустых принципов Франции, новая хартия Швеции станет свидетельством её уникального духа, сформированного не заимствованными идеалами, а кровью, трудом и волей шведского народа.\n\nВ своей речи Линдхольм резко осудил Третий Интернационал и его жалкую доктрину слепого интернационализма, назвав её не видением единства, а гротескным отрицанием национальной идентичности. Он провозгласил, что их одержимость братством без границ привела к их моральному и структурному упадку. И когда их карточный домик неизбежно рухнет, именно Швеция — дисциплинированная, единая и возрожденная — поднимется, чтобы собрать разбитые обломки Европы. Не из милосердия, а из чувства долга. Не из слабости, а из силы.\n\nВыступая с смелым видением, сочетающим радикальные националистические цели с переосмысленной формой шведского социализма, слова Линдхольма поразили как молния — вызвав бурные аплодисменты, пробудив страсти и всколыхнув саму душу нации. Когда его речь подошла к концу, раздалась громогласная овация — тысячи голосов объединились в один, разнеся его видение по всей столице и за её пределами.\n\nТеперь мир смотрит на Швецию с трепетом, страхом и восхищением. Наша страна больше не является спокойным, демократическим оплотом монархии, как в прошлом, — она возродилась как яркий столп социально-националистической решимости. Под бдительным оком Рикследаре Швеция стоит гордая, неуступчивая, суверенная и готовая определять судьбу рушащегося континента."
swerev.85.a: "Останемся такими, какие мы есть, нам не нужны новые перемены!"
swerev.85.b: "Видение Флига будет лучше всего реализовано нашими руками!"
swerev.85.c: "Идеалы русского идеолога Савинкова лучше всего подойдут Швеции!"

swerev.86.t: "Судьба королевской семьи" #Deciding fate of the former king and family
swerev.86.d: "С незапамятных времен Швеция всегда была монархией. ещё до появления термина «Швеция», когда Швеция представляла собой смесь небольших племенных вождеств и различных региональных мелких королевств, монарх существовал на равнинах и в лесах, на море и на суше. Но теперь это в прошлом. После решения об упразднении монархии и изгнании Бернадотов из страны в коридорах власти разгорелась дискуссия о том, что делать с аристократами, лишившимися короны. Хотя в прошлом несколько шведских королей действительно оказывали положительное влияние на пролетариат, нельзя отрицать, что сама институция монархии является злом, основанным на концепции угнетения, и её восстановление недопустимо. Таким образом, необходимо принять решение о том, что новая Швеция должна делать с бывшими членами королевской семьи. Некоторые выступают за принудительное изгнание, выдворение королевской семьи из страны, подобно тому, что было сделано с несколькими другими семьями высшего общества. Им будет запрещено когда-либо возвращаться, и они будут существовать как просто остатки отвергнутой угнетательной системы. Другие считают, что королевская семья должна послужить примером. В конце концов, как показывает пример изгнанной британской монархии в Канаде, изгнанные члены королевской семьи все ещё могут строить планы по возвращению своей короны, и поэтому необходимо найти более постоянное решение..."
swerev.86.a: "Изгоним их и пусть они станут примером нашей доброты."
swerev.86.b: "Виселица, гильотина или винтовка?"

swerev.87.t: "Последний удар по Синоду" #
swerev.87.d: "Шведская церковь существует со времен Лютера, когда освободитель король Густав Васа, не довольствуясь освобождением нации от оков Кальмарской унии, решил освободить Швецию и от оков Рима. С момента своего основания церковь всегда шла рука об руку с интересами государства и короны и, как таковая, была угнетателем пролетариата. В шведском обществе до недавнего времени местный священник был так же важен, как судебный пристав или полицейский, вынося суждение о том, был ли ты развратным или грешным, человеком, которого следует презирать и наказывать просто за то, что он не следовал строгому церковному догмату. Действительно, иногда столкнуться с священником было страшнее, чем с представителем правительства, потому что священник мог не только разрушить вашу семью, но и рассказать об этом всем. Именно в этом контексте шведская церковь вызывает наибольшее презрение у любого здравомыслящего социалиста, и многие представители левых в целом хотят, чтобы эта институция была полностью упразднена. Тем не менее, хотя многие священники действовали и иногда даже действуют в пользу реакции, церковь не лишена достоинств. Церковь управляет несколькими благотворительными организациями, которые помогают бедным, исторически способствовала тому, что Швеция стала одной из самых грамотных стран на земле благодаря изучению Библии, и всегда стремилась укреплять национальное единство и мир между людьми. Действительно, несколько политиков и членов нашего более широкого движения не только происходят из религиозных семей, но и имеют родственников, которые являются священниками или иным образом связаны с церковью. Таким образом, возможно, вместо того, чтобы разрушать церковь, её можно перестроить, чтобы она служила потребностям новой Швеции и нового общества, в конце концов, Иисус был плотником."
swerev.87.a: "Покончить с этим гнездом реакции!" #destroy the church
swerev.87.b: "Взять церковь под жесткий контроль и удалить реакционных священников." #Occupy the and transform the church into pro-state
swerev.87.c: "Да ну! Пусть церковь существует, но за ней нужно внимательно следить." #leave church alone, its too weak

swerev.88.t: "Возникающая северная держава" #basically lindholm has asserted position as ruler
swerev.88.d: "Успех. После многих лет упорной борьбы, личных проблем и движения, которое порой пытается разорвать себя на части, Линдхольм преуспел в своем стремлении спасти и нацию, и народ. Фабрики производят материалы как для военных нужд, так и для процветания народа, верфи кипят работой, поскольку все больше и больше судов спускаются на воду, а парки создаются для того, чтобы вместить в себя как веселье и радость народа, так и безграничную природу. Это была кровавая борьба. Многие были принесены в жертву во имя национального революционного обновления, изгнанные массы юмруются за границей, мечтая о возвращении на родину, а противники Линдхольма часто подвергаются угрозам или просто исчезают. Однако все это Линдхольм считает как минимум необходимым, а как максимум - абсолютно необходимым, но Рикследаре также знает, что для укрепления борьбы на будущие поколения необходимо принести ещё больше жертв, пролить ещё больше крови и приложить ещё больше усилий. Внутри движения разгорается дискуссия о том, куда двигаться дальше: просто довольствоваться тем, где находится Швеция сейчас, или выполнить миссию Густава II Адольфа и спасти Европу от самой себя. В конце концов, Европа горит, умирает и разлагается, но её ещё можно спасти."
swerev.88.a: "Возможно, однажды Линдхольм станет Львом Севера."

swerev.89.t: "Судьба Флюга" #more lindholm flavour
swerev.89.d: "После ареста Линхольмом и его головорезами бывший лидер шведского пролетариата Нильс Флюг стоит перед неприятным концом. Находясь под наблюдением красногвардейцев даже когда он гуляет по своему газону, Флюг не имеет права общаться или узнавать что-либо о внешнем мире, а новый режим не определился с его судьбой... До сегодняшнего дня. Рано утром Нильс Флюг был доставлен из своего дома в Стокгольм, в центральную тюрьму Лангхольмен. Здесь, после оглашения его преступлений и меры наказания, Нильс Флюг перенес катастрофический сердечный приступ. В акте последнего неповиновения режиму, который так жестоко предал его, Нильс Флюг пытался сопротивляться любым попыткам спасти ему жизнь, не давая своим врагам удовольствия убить его."
swerev.89.a: "Сбросить его прах в океан."

