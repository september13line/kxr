SWE_union_activity: "Промышленный саботаж"
SWE_union_activity_desc: "Синдикалисты в Норвегии пытаются дестабилизировать шведское правительство, финансируя воинствующие профсоюзы по всей стране."
SWE_kompani_linge_idea: "Kompani Linge"
SWE_kompani_linge_idea_desc: "Kompani Linge - это группа коммандос под руководством бывшего актера Мартина Линге. В настоящее время они занимаются различными формами саботажа в Швеции."

SWE_kompani_linge_weak_idea: "Ослабленная Kompani Linge"
SWE_kompani_linge_weak_idea_desc: "Kompani Linge - это группа коммандос под руководством бывшего актера Мартина Линге. В настоящее время они занимаются различными формами саботажа в Швеции, однако в связи с недавними событиями их возможности были ослаблены."


SWE_integrate_scandinavia_idea: "Интеграция Скандинавии"

SWE_elmo_europe_idea: "Единая Европа"

####Focuses####

SWE_rikstag_restructuring: "Растущая стагнация Риксдага"
SWE_rikstag_restructuring_desc: "Арвид Линдман, консервативный титан, который, по мнению AV и шведских правых в целом, спас Швецию от безбожного марксизма, ушел в отставку два года назад, назначив своим преемником Йёсту Багге. Стремясь выйти из тени Арвида Линдмана и справиться с последствиями американского кризиса, Йёста Багге пользуется широкой непопулярностью, поскольку не смог донести свою позицию до шведского народа. По мере приближения следующих выборов в Швеции Багге и AV приступили к предвыборной кампании, делая все возможное, чтобы профессор экономики Багге выглядел как человек из народа."

SWE_further_military_spending: "Приоритет перевооружения"
SWE_further_military_spending_desc: "Немцы перевооружаются. Синдикалисты перевооружаются. Русские, скорее всего, тоже перевооружаются. Даже дружественные соседи - Финляндия, Норвегия и Дания - в той или иной степени перевооружаются. В связи с этим правительство приняло решение о перевооружении, не желая быть застигнутым врасплох, как правительство Карла Стаафа в 1914 году."

SWE_eyes_on_the_left: "Вскрыть рану альянса SAP-SSV"
SWE_eyes_on_the_left_desc: "AV, как и их бывший лидер Арвид Линдман, никогда не доверяли SAP. Хьялмар Брантинг, первый социалистический премьер-министр, никогда публично не опровергал ни республиканизм, ни социализацию, не говоря уже о том, что нынешний лидер, Ханссон, сам является убежденным республиканцем. Извлекая уроки из выборов 1924 и 1932 годов, AV будет пытаться очернить своих оппонентов как полезных идиотов, действующих от имени социализма, синдикализма и безбожного тоталитаризма."

SWE_farmer_reachout: "Потакая потребностям Народной партии"
SWE_farmer_reachout_desc: "Коалиция AV с Folkpartiet в целом остается стабильной. Все ещё придерживаясь наследия Карла Стаафа, либералы возлагают надежды на сотрудничество с правыми, чтобы сохранить свое влияние. Хотя либералов в Риксдаге сегодня немного, они по-прежнему играют важную роль в поддержании контроля AV над правительством, и поэтому Багге намерен пойти им навстречу. Смягчив ограничения на иностранные СМИ и начав дискуссии о разрешении производства Coca Cola в стране, которое в настоящее время запрещено из-за использования фосфорной кислоты, правительство надеется укрепить связи со своими либеральными союзниками."

SWE_budget_debates: "Созвать Риксдаг по вопросу военных расходов"
SWE_budget_debates_desc: "Каждый год правительство должно представлять свой бюджет в Риксдаге, что делает это событие одним из самых важных политических событий в стране. Если Риксдаг проголосует против предложения, он может представить альтернативный вариант, который правительство должно будет принять, даже если оно его абсолютно не одобряет. Поскольку AV занимает сильные позиции в обеих палатах Риксдага, Йёста Багге считает, что бюджет на этот год будет просто утвержден и вступит в силу... Если только не произойдет что-то катастрофическое."

SWE_german_business_linger: "Неудобная правда о влиянии Берлина"
SWE_german_business_linger_desc: "Немецкая экономика, подобно левиафану, сотворила чудеса для Швеции, помогая в реализации масштабных проектов индустриализации по всей стране, однако это не обошлось без последствий. Многие отрасли промышленности в Швеции подчиняются Берлину, учитывая мнение Германии о правительстве Швеции. Наряду с этим, многие в Швеции боятся сближения с Германией, полагая, что такой шаг гарантирует участие Швеции в любых будущих войнах, в которые может вступить Германия. Вскоре правительство столкнется с трудным выбором в отношении этого гиганта."

SWE_neutrality_maintained_for_now: "Сохранение политики нейтралитета"
SWE_neutrality_maintained_for_now_desc: "Швеция сохраняет нейтралитет в международных делах с момента окончания наполеоновских войн, когда Жан Батист Бернадот, Карл XIV Йохан, сражался против своего бывшего начальника, чтобы спасти Европу от Армагеддона. Однако после этой великой войны Швеция часто оставалась нейтральной скорее из-за обстоятельств, чем из-за чистой политики правительства, но в 1914 году ситуация изменилась. Шведские политики, не говоря уже о Густаве V, рано поняли, что разрастающаяся мировая война приведет к ужасной катастрофе, и мудро выступили с заявлением о нейтралитете Швеции, вскоре после чего три совместных монарха Скандинавии объявили о нем вместе. Аналогичным образом, в шведском политическом климате либералы Карла Стаафа, консерваторы Арвида Линдмана и социалисты Хьялмара Брантинга все трое согласились с тем, что нейтралитет Швеции имеет первостепенное значение, и Риксдаг стал единым. По мере приближения выборов Йёста Багге будет пытаться обеспечить нейтралитет шведской внешней политики, встречаясь с королем, оппозицией и СМИ для этой цели."

SWE_dark_monday_cloud: "Чёрный понедельник обрушивает крону"
SWE_dark_monday_cloud_desc: "После краха немецкой экономики последствия её проблем наконец-то дошли до Швеции, полностью парализовав экономику. В одно мгновение экономическая политика Линдмана и Багге обернулась ничем, поскольку предприятия закрываются, а профсоюзы протестуют на улицах. Если Allmänna Valmansförbundet хочет выстоять в предстоящих выборах, ей нужно действовать быстро. Вдохновленный попытками в Америке и даже окунувшись в кейнсианскую экономику, Йёста Багге должен спасти страну, чтобы спасти себя."

SWE_devalue_the_krona: "Девальвация кроны"
SWE_devalue_the_krona_desc: "Ключ к экономическому росту Швеции заключается в двух факторах, а именно в том, что шведские товары должны быть дешевле и лучше, чем все, что продается за рубежом. Девальвируя валюту, чтобы стимулировать инвестиции, и в результате продавая продукцию и товары за рубежом по более низким ценам, правительство надеется спасти экономику, пожертвовав валютой."

SWE_protecting_agriculture: "Житница Скандинавии"
SWE_protecting_agriculture_desc: "Швеция - одна из немногих стран современной Европы, которая может прокормить большую часть своего населения за счет собственной продукции, но это не является непреложным фактом. Создавая стимулы и предоставляя государственную поддержку фермерам по всей стране, Швеция надеется пережить «чёрный понедельник» с неповрежденной сельскохозяйственной продукцией. Bondeförbundet положительно оценивает эти идеи и будет помогать правительству в их реализации через Риксдаг."

SWE_minor_welfare_imp: "Умеренные социальные реформы"
SWE_minor_welfare_imp_desc: "Шведские консерваторы не так боятся социальной политики, как их коллеги в других западных странах, и чтобы победить SAP на выборах, правительство решило провести ряд скромных и умеренных социальных реформ. Правительство выделит местным советам субсидии на бесплатное питание школьников, одинокие матери получат больше поддержки, а безработные будут зарегистрированы и получат временную работу в государственных учреждениях."
SWE_companies_crisis: "Незначительные субсидии для бизнеса"
SWE_companies_crisis_desc: "Йёста Багге критически относится к политике социального обеспечения и считает, что, поддерживая некоторые из наших основных отраслей, такие как рыболовство и производство, мы можем надеяться на создание большего количества рабочих мест. Это, в свою очередь, должно снизить безработицу и увеличить поддержку Избирательной лиги."
SWE_cutting_armed_forces: "Ограничить военные расходы"
SWE_cutting_armed_forces_desc: "В Риксдаге был принят новый закон, поддержанный SAP и Bondeförbundet, сокращающий государственные расходы на несущественное военное оборудование. Сокращение расходов на армию вызвало недовольство генерального штаба и «Jungjunta», однако при уровне безработицы, достигающем 25 %, мы не можем себе позволить пощады."
SWE_more_austerity_measures: "Повышение налогов, снижение затрат"
SWE_more_austerity_measures_desc: "AV предложила и приняла законопроект, согласно которому многие виды налогов по всей Швеции будут увеличены, что в краткосрочной перспективе вызовет недовольство населения, но, как полагают, позволит сократить расходы и через некоторое время снова снизить налоги."
SWE_final_hurdle: "Последнее препятствие?"
SWE_final_hurdle_desc: "Кабинету Багге пришлось нелегко. Сначала ему пришлось справляться с последствиями отставки Арвида Линдмана в 34-м году, затем бороться за формулирование экономической политики в условиях «черного понедельника», и последние два года Йёста Багге практически не делал ничего, кроме как реагировал на события, вместо того чтобы действовать проактивно, как он изначально хотел. По мере приближения выборов, когда в Риксдаге разгораются дебаты между левыми, центристами и правыми, Багге наконец узнает, какую политику предпочитают избиратели: его или его оппонентов. Будет ли реакции AV на «Чёрный понедельник» достаточно, чтобы завоевать поддержку населения? Или победу одержит СЭП под руководством Ханссона и его идея Фолькхеммет? Или, что ещё более тревожно, что если SSV каким-то образом воспользуется социальными волнениями и придет к власти?"

SWE_black_monday_woes: "Беды чёрной недели"
SWE_black_monday_woes_desc: "Хотя предыдущее консервативное правительство довольно успешно справилось с первоначальными последствиями «Черного понедельника», экономическая депрессия по-прежнему широко распространена в стране. В связи с этим необходимо удвоить наши усилия по снижению её воздействия на экономику и население в целом."
SWE_keep_private_property: "Защита частной собственности"
SWE_keep_private_property_desc: "Частная собственность является краеугольным камнем нашего движения, позволяющим людям обладать тем, что они заработали своим трудом и упорством. Поддерживая наши ценности в этом вопросе, мы можем ещё больше сблизить бизнесменов и домовладельцев."
SWE_domestic_industries: "Шведские отрасли для Шведов"
SWE_domestic_industries_desc: "Отдавая приоритет отечественной промышленности перед иностранной, мы сможем защитить наши промышленные возможности, не становясь жертвами вражеского шпионажа."
SWE_fund_swedish_business: "Гарантия шведского производства"
SWE_fund_swedish_business_desc: "Мы должны удвоить усилия по повышению качества, особенно с учетом нашего нынешнего промышленного потенциала. Сделав «Сделано в Швеции» международным брендом, мы сможем гарантировать продажи и надежность."

SWE_people_party_front: "Folkpartiet возглавлит коалицию"
SWE_people_party_front_desc: "Хотя победа AV на выборах была несколько неожиданной, ещё более любопытно то, что новое правительство будет возглавляться либералами из Folkpartiet в составе правой коалиции. Впервые за более чем десятилетие либералы вернулись к власти!"
SWE_classical_liberalism: "Внедрить классический либерализм"
SWE_classical_liberalism_desc: "Основой партии Народный фронт является экономический и политический консервативный либерализм, основанный на сокращении государственного вмешательства и ориентации на свободный рынок. Мы начнем позволять свободному рынку процветать в Швеции, и вместе с этим будет процветать и экономика страны."
SWE_independent_industry: "Инвестиции в Швецию"
SWE_independent_industry_desc: "Наша промышленность имеет жизненно важное значение для нашего успеха, и поэтому ее дальнейшее развитие имеет первостепенное значение. Удвоив внутренние инвестиции, мы сможем обеспечить Швеции процветание в будущем."
SWE_freeing_the_market: "По-настоящему свободный рынок"
SWE_freeing_the_market_desc: "Чрезмерная зависимость от государственного вмешательства приведет только к упадку процветания всех шведов. Поэтому мы должны полностью согласовать нашу экономическую политику с верой в превосходство модели свободного рынка."
SWE_sailing_the_market: "Плывя на волнах рынка"
SWE_sailing_the_market_desc: "Рынок можно представить как безграничное море возможностей, по которому бизнесмены преодолевают трудности на своих кораблях возможностей. По мере того как приливы и отливы становятся более свободными, граждане Швеции также становятся более смелыми в своих инвестиционных решениях и возможностях."

SWE_small_business_centred: "Приоритет малого бизнеса"
SWE_small_business_centred_desc: "Чтобы рынок действительно процветал, на нем должны развиваться предприятия, поэтому мы будем и дальше поддерживать и финансировать тех, кто начинает свой собственный бизнес. Таким образом, мы не только увеличим количество рабочих мест, но и расширим объем отечественной шведской промышленности."
SWE_privatise_railroads: "Массовая приватизация ж/д"
SWE_privatise_railroads_desc: "Предоставление государству права регулировать работу железных дорог обернулось полной катастрофой, приведшей к массовой неэффективности и низкому качеству обслуживания. Хотя некоторые могут утверждать, что транспорт — это право, его все же могут предоставлять частные компании. Предоставив им исключительные права на управление национальными железными дорогами Швеции, мы можем позволить компаниям повысить свою эффективность без вмешательства со стороны государства."
SWE_building_bridges_and_roads: "Первая национальная автомагистраль"
SWE_building_bridges_and_roads_desc: "Мы начнем работу над национальной автомагистралью, чтобы еще больше соединить отдаленные части нашей страны с основными центрами власти. Хотя существует много предложений, наиболее популярным является проект, основанный на немецком проекте Reichsautobahn."
SWE_trams_and_people: "Расширение городского транспорта"
SWE_trams_and_people_desc: "По мере роста наших городов становится все более очевидным, что существующая инфраструктура не сможет справиться с постоянно растущими потребностями в перевозках. Расширяя трамвайное сообщение и другие виды общественного транспорта, мы обеспечим нашим гражданам более удобное сообщение с местами работы и отдыха."


SWE_reaching_out_to_soc_lib: "Урожай с Bondeförbundet?"
SWE_reaching_out_to_soc_lib_desc: "Хотя наш союз с AV позволил нам выиграть выборы, их жесткий подход к рыночному протекционизму и корпоративизму помешал нам продвинуться в деле либерализации экономики. В центре-левом спектре находится Фермерская лига, партия, посвятившая себя улучшению положения фермеров в Швеции, а также подходу к экономике с социально-либеральной позиции. Многие из их экономических взглядов хорошо совпадают с нашими, единственным спорным моментом являются национальные ценности. Теперь у нас есть шанс заручиться их поддержкой или остаться с нашими консервативными союзниками."
SWE_rule_of_law: "Обеспечить верховенство закона"
SWE_rule_of_law_desc: "Среди радикальных левых и крайне правых, которые поднимают народ на бунт, проявилось прямое пренебрежение к верховенству закона. Мы применим всю мощь правовой системы против этих диссидентов."
SWE_ban_syndicalism: "Заставить заткнуться синди-пропаганду"
SWE_ban_syndicalism_desc: "Синдикалистские газеты и издательства - не более чем пешки Парижа и Лондона, промывающие мозги нашему населению ложными дистопическими идеями синдикализма."
SWE_political_paradise: "Свободная политическая утопия"
SWE_political_paradise_desc: "Времена цензуры любых взглядов, не соответствующих воле всемогущего повелителя, к счастью, прошли. Продолжая стремиться к более светлому будущему, Швеция должна оставаться оплотом свободной, хотя и умеренной, политической мысли и самовыражения."

SWE_kingly_liberalism: "Королевский либерализм"
SWE_kingly_liberalism_desc: "По мере модернизации мира должны меняться и некоторые из наших традиций. Протянув руку нашему королю, чтобы он мог наблюдать и знакомиться с работой нашего правительства, мы можем надеяться на то, что наша монархия будет существовать и в будущем."
SWE_bastion_of_liberalism: "Швеция, либеральная и гордая"
SWE_bastion_of_liberalism_desc: "Народная партия достигла действительно поразительных результатов: Швеция теперь занимает лидирующие позиции на мировом рынке. Счастливое и гордое население Швеции обеспечивает ей надежное будущее в духе классического либерализма!"
SWE_fruits_of_capitalism: "Плоды капитализма"
SWE_fruits_of_capitalism_desc: "Время за временем показывает, что капитализм - единственная успешная экономическая модель, и, следуя его принципам, мы получили огромную выгоду. Те, кто действительно достаточно усердно работает в этой системе, могут получить выгоду, а успехи тех, кто добился успеха, могут быть ощущены и использованы другими благодаря эффекту «просачивания»."
SWE_rural_education_investment: "Инвестиции в сельское образование"
SWE_rural_education_investment_desc: "Образованное население — лучшая гарантия успеха любой страны в будущем. К сожалению, текущее состояние сельского образования в Швеции оставляет желать лучшего. Мы должны исправить эту ситуацию путем увеличения финансирования школ и учителей в небольших городах и некоторых деревнях."

SWE_GEL_leads: "Триумф Allmänna Valmansförbundet"
SWE_GEL_leads_desc: "В том, что считалось тяжелой битвой, AV одержала победу над социал-демократами Ханссона. Теперь, с новым энтузиазмом, охватившим всю страну, они приступят к обеспечению стабильности и традиций в эти бурные времена."
SWE_united_morals_under_crown: "Корона как символ консерватизма"
SWE_united_morals_under_crown_desc: "Король Швеции, символ наших предков и рода, является объединяющим символом для всех жителей Швеции. Только самые ярые радикалы осмеливаются противостоять его величию и благодеяниям, которые он принес нации, и как главная консервативная партия Швеции мы должны напоминать населению об этом факте."
SWE_support_from_army: "Правые лоялисты из армии"
SWE_support_from_army_desc: "Не секрет, что Армия Швеции придерживается значительно более правых взглядов, а некоторые её члены даже примыкают к ярым националистам. В этом мы можем обрести потенциальных союзников, заверив их в том, что традиционное и консервативное правительство будет продолжать действовать в их интересах."
SWE_red_scary: "Синдикалистский страх"
SWE_red_scary_desc: "Синдикализм — это бич Земли, дьявольская идеология, которая стремится только к разрушению, проникая даже в умеренные группы, такие как социал-демократы Ханссона. Мы должны провести общественную кампанию против этих групп."
SWE_monarchist_bulwark: "Вечные традиции монархии"
SWE_monarchist_bulwark_desc: "Монархия, объединяющая традиция Швеции, существует с момента основания нации. Мы должны выражать нашу неизменную поддержку короне, одновременно унижая политических оппонентов как врагов того, что действительно нас объединяет."

SWE_funding_the_farmers: "Расширить базу поддержки сельских районов"
SWE_funding_the_farmers_desc: "В течение долгого времени Партия фермеров и другие левые силы пользовались поддержкой мелких сельских фермеров, обещая им увеличение льгот и государственной помощи. Чтобы смягчить будущую проблему потери их поддержки, мы будем проводить аналогичную политику поддержки наших сельских фермеров в попытке увеличить государственную помощь."
SWE_enforce_protection: "Защита с помощью протекционизма"
SWE_enforce_protection_desc: "Протекционизм является основной экономической идеей нашей партии, и теперь, когда у нас появилась возможность это сделать, мы начнем работу по приоритезации шведской промышленности для нужд Швеции."
SWE_imagine_corporatism: "Построение национального корпоративизма"
SWE_imagine_corporatism_desc: "Создав по-настоящему шведскую корпоративную экономическую модель, мы сможем оживить нашу экономику. Признание изобретательности и мастерства нынешних предприятий и торговых ассоциаций в Швеции позволит создать экономику для Швеции и Швецией."
SWE_fighting_fit_sweden: "В ожидании великого потрясения"
SWE_fighting_fit_sweden_desc: "Мы должны быть готовы к возможности войны, независимо от того, останемся ли мы нейтральными или окажемся втянутыми в сеть альянсов, солдаты должны быть готовы к любому конфликту."

SWE_middle_class_priority: "Предпочтения среднего класса"
SWE_middle_class_priority_desc: "Средний класс представляет собой нашу наиболее значимую базу поддержки, от рабочих до владельцев малого бизнеса, его часто считают «молчаливым большинством» в стране. Расширяя их льготы и политику, которая им помогает, мы будем и впредь пользоваться их благосклонной поддержкой."
SWE_deregulation_key: "Необходимое дерегулирование"
SWE_deregulation_key_desc: "Устранив излишние нормативные ограничения, мы сможем открыть возможности для многих новых предпринимателей, способствуя инновациям в промышленности."
SWE_expand_education_sector: "Расширение национального образования"
SWE_expand_education_sector_desc: "Очень важно, чтобы все молодые люди имели доступ к образованию. Расширяя нынешнюю государственную систему образования, мы сможем обеспечить, чтобы молодежь Швеции получала хорошие нравственные ценности, математические и научные знания." 
SWE_spotless_welfare: "Ограниченное социальное обеспечение"
SWE_spotless_welfare_desc: "Социальное обеспечение несет в себе страх создания класса людей, которые бездельничают, получая компенсацию, поэтому наша политика социального обеспечения должна быть строго регулирована. Необходимо заставлять тех, кто находится на социальном обеспечении, соблюдать стандарты, такие как активный поиск работы или даже служба в армии, чтобы избежать чрезмерных государственных расходов."
SWE_fund_the_scouts: "Мотивация к участию в скаутском движении"
SWE_fund_the_scouts_desc: "Скауты служат прекрасным примером руководства растущими умами в Швеции, помогая им в наборе, мы можем создать новое поколение здоровых и естественно способных мужчин!"

SWE_northern_light_of_conservatism: "Северное сияние консерватизма"
SWE_northern_light_of_conservatism_desc: "Шведская корона теперь олицетворяет нечто гораздо большее, чем просто её традиции, а именно её успехи. Швеция теперь является титаном как в промышленности, так и в дипломатии, вызывая уважение как со стороны Рейха, так и со стороны Антанты."

SWE_anti_syndies: "Безусловная непримиримость к красным"
SWE_anti_syndies_desc: "Интернационал имеет агентов повсюду, скрывающихся среди многих наций и ожидающих подходящего момента, когда нестабильность достигнет своего пика, чтобы осуществить революции. Это недопустимо, мы не станем очередной жертвой красной угрозы, такие партии и группы должны быть подвергнуты расследованию и, в случае признания их виновными, навсегда изгнаны из Швеции!"
SWE_family_focus: "Приоритизация шведской семьи"
SWE_family_focus_desc: "Семья является основой хорошей и здоровой цивилизации, и именно поэтому установление моральных ценностей и решительная приверженность всего общества имеют первостепенное значение для поддержания стабильности в нашем обществе."

SWE_elections_over: "Через финишную черту"
SWE_elections_over_desc: "Наконец-то долгожданные выборы 1936 года дошли до Швеции, и, к лучшему или к худшему, этот момент определит будущее Швеции!"
SWE_social_dem_stab: "Только SAP"
SWE_social_dem_stab_desc: "Как и многие предполагали, харизматичный Ханссон и его социал-демократическая партия одержали победу! Добившись убедительной победы в Риксдаге, что позволило им избежать создания коалиции с радикальными группами, Ханссон и его партия теперь наконец-то получили возможность воплотить в жизнь свою мечту о настоящем Доме народа."

SWE_scourge_black_monday: "Исправление ошибки Германии"
SWE_scourge_black_monday_desc: "Экономическое бедствие, вызванное «черным понедельником», имеет только одного главного виновника - Германию и её кайзера. Эта страна, победившая в мировой войне и завоевавшая плодородные земли, безрассудно тратила средства. Допуск её продуктов на шведский рынок оказался скорее проклятием, чем благом, и теперь мы должны исправить эту ошибку и устранить экономические проблемы, которые нас мучают."
SWE_unemployment_no_more: "Ликвидация безработицы"
SWE_unemployment_no_more_desc: "Безработица процветает из-за катастрофы Черного понедельника, поэтому необходимо найти решение. Представленный Ханссоном план инвестиций в государственные общественные работы создаст рабочие места для жителей страны, а также будет способствовать развитию инфраструктуры по всей стране."
SWE_homes_for_home: "Жилищное строительство для нации"
SWE_homes_for_home_desc: "Ключевым моментом для любой страны является возможность каждого гражданина иметь крышу над головой. Мы направим государственные ресурсы на строительство общественного жилья для многих бездомных, пострадавших от катастрофы Черного понедельника."
SWE_social_saviour: "Спаситель Швеции"
SWE_social_saviour_desc: "Ханссон сделал то, что многие критики считали невозможным, справившись с кризисом Черного понедельника. Многие из бывших бездомных теперь имеют жилье, а благодаря инициативе по общественным работам по всей стране ведутся масштабные строительные работы. Хотя в Риксдаге по-прежнему есть противники, никто не может отрицать, что социал-демократы действительно спасли Швецию от катастрофы."

SWE_distance_from_radicalism: "Всмеять радикалов"
SWE_distance_from_radicalism_desc: "Хотя до выборов сотрудничество с SSV не исключалось, наша победа доказала, что нам не нужны их радикальные методы. Осуждая их революционные действия и антимонархическую позицию, мы можем сохранить стабильную социальную демократию."
SWE_align_farmer_league: "Задействовать фермеров"
SWE_align_farmer_league_desc: "Партия, известная как Лига фермеров, является голосом мелких фермеров и рабочих сельских районов, и, обращаясь к ним, мы можем создать более однородное правительство, которое сможет удовлетворить потребности нашего населения."
SWE_social_patriots: "Партия патриотов"
SWE_social_patriots_desc: "Что может быть более патриотичным, чем любовь к своей стране? Что может быть более патриотичным, чем служение нации в мирное время и во время кризиса? Эта дискуссия бурно ведется во всем шведском обществе после раскола между SAP и их оппонентами справа. Утверждая, что социал-демократы недостаточно патриотичны, а может быть, даже презирают свою страну, правые ввергли нацию в медийную истерию, основанную исключительно на обвинениях и риторике. Однако Пер Альбин Ханссон не намерен поддаваться на эти обвинения. В бурной речи в Риксдаге Ханссон указал, что истинный патриотизм заключается в помощи своим соотечественникам, работе на общее благо всего общества и строительстве страны, а не в её продаже тому, кто больше заплатит. Рассказывая о своей жизни, Ханссон сравнивает себя со своими оппонентами, утверждая, что он живет как настоящий швед. Он пьет с друзьями, играет в карты, занимается спортом и водит Plymoth Deluxe D6. В противовес этому он указывает, что лидер оппозиции водит Mercedes, одевает свою жену в горностаевые меха из Вены и проводит слишком много времени в Швейцарии. Ханссон утверждает, что SAP является единственной патриотической альтернативой на любых выборах, поскольку только голосование за него и его партию может уберечь нацию от хищников иностранного капитала." 
SWE_social_king_trust: "Благословение короны"
SWE_social_king_trust_desc: "В то время как вопрос о коалиции SSV оставался открытым перед последними выборами, теперь мы уверены, что Швеция без монарха - это не Швеция. Мы подтвердим нашу позицию по отношению к монарху, организовав частную встречу между Ханссоном и Густавом V, чтобы гарантировать стабильность и не допустить повторения 1914 года."


SWE_welfare_done_right: "Путь к Фолькхеммету"
SWE_welfare_done_right_desc: "Folkhemmet, также известный как «Дом народа», является краеугольным камнем партийной политики Ханссона. Опираясь на сильную систему социального обеспечения населения, он надеется создать систему, в которой каждый житель Швеции будет иметь равные шансы на успех, воплотив в жизнь мечту об эгалитаризме."
SWE_get_employed: "От Стокгольма к другим городам"
SWE_get_employed_desc: "Хотя большая часть наших избирателей - это городские рабочие, мы не можем игнорировать тех, кто поддерживает нас в сельской местности. Мы должны расширить наши усилия в сельских регионах, не забывая о тех, кто кормит нашу нацию."
SWE_helping_poor: "Помощь обездоленным"
SWE_helping_poor_desc: "В результате полного экономического коллапса, вызванного Германией, многие в нашей стране быстро лишились надежной работы. Усилив наши усилия по ликвидации безработицы и расширению общественных работ, мы сможем пережить эту бурю."
SWE_worker_protection_law: "Развитие Фолькхеммета"
SWE_worker_protection_law_desc: "Мы будем увеличивать наши инвестиции в Фолькхеммет, расширяя его охват в сельских районах и улучшая предоставляемые льготы."
SWE_healthy_living: "Расширение здравоохранения"
SWE_healthy_living_desc: "Здравоохранение остается неотъемлемой частью нашей программы Фолькхеммет, направленной на обеспечение доступа к медицинскому обслуживанию для всех шведов по всей стране. Дальнейшие инвестиции и расширение медицинских учебных заведений при одновременном увеличении стимулов позволят нам только надеяться на улучшение ситуации."


SWE_trade_union_rep: "Улыбки и напитки с профсоюзами"
SWE_trade_union_rep_desc: "Профсоюзы представляют интересы работников в стране, поддерживая позитивные отношения с действующими профсоюзами и оказывая им больше помощи, одновременно договариваясь о их поддержке в сокращении числа забастовок в будущем."
SWE_urbanisation_efforts: "Урбанизация в городах"
SWE_urbanisation_efforts_desc: "Наше внимание в промышленной сфере требуют не только крупные города, такие как Стокгольм, но и небольшие города и деревни. Обеспечение лучшего доступа к таким услугам, как электроснабжение и образование, укрепит нашу поддержку в сельских районах и одновременно повысит уровень жизни их жителей."
SWE_improving_statare_bros: "Воздать жизнь Статаре"
SWE_improving_statare_bros_desc: "Полная отмена Статаре на данный момент ещё далека, однако благодаря сотрудничеству между правительством и Шведским профсоюзом сельскохозяйственных рабочих можно достичь определенного уровня жизни. Землевладелец больше не сможет выселять бывшего работника без предоставления ему льготного периода, и землевладелец больше не сможет сдавать в аренду животных фермерскому рабочему, которые затем будут возвращены по истечении годового контракта."
SWE_worker_protections: "Создание домашней гвардии"
SWE_worker_protections_desc: "Домашняя гвардия будет действовать в качестве сил чрезвычайной обороны в случае вторжения любого врага. Первоначально неорганизованные ополчения, объединившись в дисциплинированные силы, расположенные почти в каждом городе и деревне, мы можем надеяться противостоять любому захватчику."

SWE_northern_bastion_of_socdem: "Северный Фолькхеммет"
SWE_northern_bastion_of_socdem_desc: "Folkhemmet, или «Дом народа» - настоящая шведская мечта, которая теперь стала реальностью. Благодаря обеспечению почти всех граждан медицинским обслуживанием и жильем, Швеция теперь является по-настоящему однородной нацией, где народ и правительство работают друг для друга."
SWE_nationalise_time: "Ключевая национализация"
SWE_nationalise_time_desc: "Национализировав ключевые отрасли промышленности, в частности транспортную и железнодорожную, мы можем надеяться на создание обширной и эффективной транспортной сети, связывающей одну часть Швеции с другой. Это поможет не только общественному транспорту, но и в случае войны - быстрому и решительному развертыванию войск."
SWE_finance_healthcare: "Всеобщее медицинское страхование"
SWE_finance_healthcare_desc: "Внедрив всеобщее медицинское страхование, мы можем обеспечить большинству наших граждан не только доступ к медицинскому обслуживанию, но и возможность его оплатить. Доступ - это только один шаг, который позволит многим, кто раньше не мог позволить себе посещение врача или другие неотложные услуги, теперь делать это без финансовых забот."

SWE_radical_united_front: "Радикальная коалиция"
SWE_radical_united_front_desc: "Хотя победа партии Ханссона на выборах была в некоторой степени ожидаема, она не обошлась без недостатков. Не сумев получить большинство в Риксдаге, Ханссон объявил о создании официальной коалиции с SSV, в рамках которой они будут иметь большой контроль над политикой, определяемой коалицией. В то время как многие с болью на лице наблюдают за тем, как умеренные социал-демократы вынуждены поддерживать таких радикалов, SSV и их синдикалистские союзники видят в этом первый огромный шаг на пути к революции в Швеции."
SWE_initial_nationalisation: "Поддержка индустриализации"
SWE_initial_nationalisation_desc: "Чтобы по-настоящему конкурировать и выровнять нашу страну с соседними, необходимо начать крупномасштабную кампанию по индустриализации. Это поможет нам как в производстве товаров, так и в улучшении качества жизни в Швеции."
SWE_strengthen_ties_to_internationale: "Соглашение с Парижем"
SWE_strengthen_ties_to_internationale_desc: "Уже существует яркий маяк для нашего дела: Третья Интернационал является одной из немногих фракций на мировой арене, которая поддерживает наше дело. Обратившись к ним и встретившись с их делегатами, мы сможем укрепить наши связи и увеличить возможные выгоды."
SWE_enlarge_the_front: "Обширный коалиционизм"
SWE_enlarge_the_front_desc: "Нашей нынешней поддержки все ещё недостаточно, чтобы воплотить в жизнь нашу мечту о шведской республике, мы должны обратиться к другим группам с похожими идеалами. Те, кто присоединился к синдикалистам, анархистам и даже мелким радикалам под руководством Флюга и Линдерота. Такая поддержка расширит наш охват и усилит нашу поддержку."
SWE_cracking_the_crown: "Разрушить корону"
SWE_cracking_the_crown_desc: "После месяцев подготовки и создания основы для величайших перемен, которые когда-либо происходили в Швеции, наконец-то настал памятный момент. Давайте наконец возьмем судьбу в свои руки и разбиваем остатки старого мира, в котором корона угнетает трудящиеся массы нации. Северная монархия должна быть упразднена!"

SWE_finish_off_black_monday: "Покончить с чёрным понедельником"
SWE_finish_off_black_monday_desc: "Наконец, благодаря стабилизации политической ситуации, мы можем завершить решение проблемы Черного понедельника. Вскоре шведская экономика восстановится, и в будущем мы будем процветать!"
SWE_boats_to_trawlers: "От рыбацких лодок до траулеров"
SWE_boats_to_trawlers_desc: "Расширение финансирования рыбной промышленности значительно увеличит как возможности трудоустройства, так и доходы правительства. Такие меры, как улучшение рыболовецких судов путем стандартизации траулеров, позволят увеличить улов, а значит, и прибыль."
SWE_fishing_vessel_reg: "Контроль над рыболовными судами"
SWE_fishing_vessel_reg_desc: "Пересмотрев правила и требования безопасности для рыболовецких судов, мы сможем получить больше знаний и понимания о военно-морских судах. Помимо помощи гражданам с неисправных судов, это также станет ценным обучением для новых инженеров военно-морского флота."
SWE_eel_economy: "Экономика на основе угрей"
SWE_eel_economy_desc: "Скромный угорь считается одним из наших важнейших рыбных ресурсов. Он легко доступен в шведских водных зонах и относительно редко встречается в других странах Европы, что позволяет нам занять относительно незанятый рынок. Использование этой ниши позволит нам получить большие доходы, расширить наши нынешние верфи и рыболовецкие возможности."
SWE_sail_seas_of_trade: "Пересечение торговых морей"
SWE_sail_seas_of_trade_desc: "В двадцатом веке невозможно отрицать важность торговли: от товаров первой необходимости до потребительских товаров и военных активов, международная торговля стала краеугольным камнем этого столетия. Таким образом, укрепление наших отношений и развитие новых торговых путей имеет решающее значение для сохранения нашего положения как нации."
SWE_industrial_investments: "Инвестиции в промышленность"
SWE_industrial_investments_desc: "Мы будем содействовать инвестициям нашего правительства в индустриализацию наций."
SWE_farming_mechanization: "Дальнейшая механизация сельского хозяйства"
SWE_farming_mechanization_desc: "Наши нынешние методы ведения сельского хозяйства почти так же стары и древние, как и сама страна. Чтобы освободиться от зависимости от восточноевропейского зерна и повысить уровень жизни в Швеции, мы должны модернизировать наш сельскохозяйственный сектор, что позволит нам улучшить положение страны."
SWE_stabilize_the_krona: "Стабилизация кроны"
SWE_stabilize_the_krona_desc: "Шведская крона относительно слаба по сравнению с большинством европейских валют, особенно по сравнению с валютой Центральной Европы. Уравнивание кроны по отношению к этим валютам ещё больше уменьшит последствия «черного понедельника»."
SWE_unemployment_aid: "Помощь и поддержка безработным"
SWE_unemployment_aid_desc: "Оказывая помощь тем, кто больше всего пострадал от экономического коллапса, мы можем помочь восстановить страну. Вернуть рабочих на фабрики и фермы, улучшить трудовые ресурсы, чтобы улучшить страну."
SWE_further_lumber_export: "Расширить лесопромышленность"
SWE_further_lumber_export_desc: "Древесина является основным активом для экономического роста, как на национальном, так и на международном уровне. Улучшение нашей торговли древесиной с соседними странами, такими как Норвегия, улучшит как их, так и, что более важно, нашу экономику."
SWE_riksbank_empowered: "Наделить полномочиями Риксбанк"
SWE_riksbank_empowered_desc: "Риксбанк является основой шведской экономики, усилив его, мы можем только извлечь выгоду."
SWE_dannemora_mine_expansion: "Расширить шахты Даннемора"
SWE_dannemora_mine_expansion_desc: "Шахта Даннемор является нашей крупнейшей шахтой по добыче железной руды, и её расширение позволит увеличить объемы добычи."
SWE_zinkgruvan_subsidies: "Субсидии для шахты Зинкгруван"
SWE_zinkgruvan_subsidies_desc: "Зинкгруван - одна из крупнейших в стране шахт по добыче цинка и меди, и предоставление ей субсидий, как мы надеемся, позволит увеличить объемы добычи."
SWE_defense_rearmament_investment: "Оборонное перевооружение"
SWE_defense_rearmament_investment_desc: "Хотя мы остались нейтральными в мировой войне, враги и союзники могут появиться со всех сторон, поэтому подготовка к оборонной программе перевооружения принесет определенную пользу."
SWE_northern_mining_giant: "Горнодобывающий гигант Севера"
SWE_northern_mining_giant_desc: "Увеличив финансирование горнодобывающего сектора наряду с субсидиями, мы сможем компенсировать наш дефицит в размерах."
SWE_funding_research: "Вклад в научно-исследовательский сектор"
SWE_funding_research_desc: "В эту эпоху исследования имеют жизненно важное значение для страны, чтобы не отставать от других стран мира. Создав национальный исследовательский сектор, мы можем надеяться не отставать в гонке технологического прогресса."
SWE_lunds_universitet_donation: "Пожертвования Лундского университета"
SWE_lunds_universitet_donation_desc: "Лундский университет - это элитный вуз, который готовит одних из лучших врачей страны. Увеличив его бюджет и сделав несколько благотворительных пожертвований, мы можем надеяться на увеличение этого показателя."
SWE_chalmers_uni: "Профессионализм университета Чалмерса"
SWE_chalmers_uni_desc: "Университет Члемера является одним из наших лучших центров инженерных исследований. Увеличив его финансирование, мы расширим будущее поколение инженеров!"
SWE_research_grants_and_schemes: "Гранты на исследования и программы льгот"
SWE_research_grants_and_schemes_desc: "В хаосе мировой политики все больше внимания привлекает новая область исследований - атом. Создав Национальный институт оборонных исследований, мы можем надеяться на использование потенциальных преимуществ атома как в гражданских целях, так и в целях национальной обороны, если это потребуется."
SWE_synthetic_research: "Эксперименты с синтетическим маслом"
SWE_synthetic_research_desc: "Наши текущие запасы нефти не смогут обеспечить потребности нашей растущей страны, как в гражданском, так и в военном секторе. Синтетическая нефть - это новый способ для стран, не обладающих значительными запасами природной нефти, начать конкурировать с другими странами. Мы должны финансировать исследования в области синтетической нефти, чтобы максимально увеличить наши шансы на независимость в будущем."
SWE_roads_bridges: "Дороги и мосты"
SWE_roads_bridges_desc: "Мы должны модернизировать нашу текущую инфраструктуру по всей стране, прокладывая дороги от города к городу и мосты, чтобы сделать путешествия через реки и озера более быстрыми и эффективными."

SWE_socialist_paradise: "Наш рабочий рай"
SWE_socialist_paradise_desc: "Благодаря упорному труду и самоотверженности на крайнем севере был создан настоящий рай для рабочих, свободный от империализма, реакции и других пороков, присущих капитализму. Да здравствует рабочий, да здравствует этот рай, который он создал для себя!"
SWE_free_nation_north: "Бастион свободы"
SWE_free_nation_north_desc: "Свобода не дается даром, она требует упорного труда и самоотверженности, бдительности и лояльности, мужества и преданности. Шведские избиратели, шведская политическая элита, шведские солдаты - все они доказали, что способны выполнить задачу по сохранению свободы на холодном севере."

SWE_militarized_sweden: "Железная экономика"
SWE_militarized_sweden_desc: "Да здравствует армия, да здравствует Бог, да здравствует Швеция! Благодаря бдительности, твердой решимости и железной воле шведские солдаты обеспечили идеальное функционирование даже самой экономики."


SWE_revolution_wins: "Торжество революции"
SWE_revolution_wins_desc: "Мы сделали это, отразив первоначальный удар реакционеров, и теперь у нас есть средства для стабилизации нации. Корона исчезла, многие дворяне бегут, революция достигла своего пика."

SWE_finish_nationalisation: "Национализация ключевых отраслей"
SWE_finish_nationalisation_desc: "Предприятия и отрасли, имеющие ключевое значение для поддержания революции, будут национализированы, чтобы обеспечить большое приобретение ресурсов. Это вызовет недовольство, однако это необходимо для нашего выживания."

SWE_raise_red_guard: "Мобилизация Красной гвардии"
SWE_raise_red_guard_desc: "По аналогии с российской гражданской войной, будут созданы отряды красногвардейцев. Сформированные из рабочих и солдат, их лояльность и преданность революции обеспечат нам лучших гвардейцев. Это позволит нам установить контроль над районами, где доминируют монархисты и сторонники военных."

SWE_control_black_monday: "Ответ на чёрный понедельник"
SWE_control_black_monday_desc: "С постепенным восстановлением стабильности в Швеции проблема «Черного понедельника» по-прежнему стоит перед нацией. Поскольку многие люди по-прежнему остаются безработными и голодают на улицах, мы должны предпринять масштабные гуманитарные усилия, чтобы помочь тем, кто пострадал от этой ситуации больше всего, и найти постоянное решение на будущее."

SWE_more_internationale_aid: "Международная деятельность"
SWE_more_internationale_aid_desc: "Многие реакционеры служили в армии и, как таковые, контролируют большую часть вооружения и оружия страны. Хотя нам удалось остановить их наступление, нам нужно больше оружия. К счастью, наши доблестные союзники из Третьего Интернационала пообещали предоставить нам ещё больше подкрепления."

SWE_military_confrontation: "Последнее проявление реакции"
SWE_military_confrontation_desc: "Остатки реакционных сил невелики и разрозненны, но никому не будет позволено разрушить нашу революцию. Мы должны найти и уничтожить самых злостных преступников, чтобы показать пример другим монархистам, все ещё скрывающимся в Швеции, однако способы, которыми мы должны это сделать, являются предметом ожесточенных споров."

SWE_sweden_industrial_congress: "Созыв Всерабочего риксдага"
SWE_sweden_industrial_congress_desc: "Наконец, когда революция обеспечена и большая часть реакционной угрозы устранена, мы можем перейти к более внутренним вопросам. Старое здание Риксдага, поврежденное некоторыми монархическими ополченцами, которые пытались бросить вызов нашей победе на выборах, теперь снова будет служить своему назначению. Однако следующие выборы теперь будут проходить между социалистами SSV, синдикалистами SAC и фанатиками из разношёрстной компании SNSP и SKP."


###Central Syndicalism Focuses###
SWE_central_syndicalist_victory: "Победа централистского крыла SAC"
SWE_central_syndicalist_victory_desc: "По завершении промышленного риксдага явным победителем стали синдикалисты SAC, отколовшиеся от своих анархистских собратьев и предложившие синдикалистское государство, свободное от анархистских идеологических испытаний на чистоту, а также от правого безумия. В тесном сотрудничестве с остатками некогда великой Landsorganisationen анархисты обвиняют основную линию SAC в предательстве революции, что руководство более чем готово опровергнуть."

SWE_remove_anarchists: "Сначала синдикализм, а не анархизм"
SWE_remove_anarchists_desc: "Анархистское крыло движения не совсем довольно тем, что проиграло битву за душу страны. Профсоюзы, связанные с анархистскими тенденциями, уже начали забастовки или агитацию на улицах, что наносит ущерб сплоченности как синдикалистского движения, так и народа в целом. Их арест или нанесение им вреда стало бы смертным приговором для SAC и революции в целом, поскольку в любой момент армия может проявить свои реакционные наклонности, и поэтому необходимо протянуть руку примирения, чтобы успокоить анархистов и добиться единства левых сил."

SWE_collaborate_with_radicals: "Прежде всего национальное, а интернациональное"
SWE_collaborate_with_radicals_desc: "Хотя синдикализм сам по себе является международным движением, стабилизация Швеции является текущей целью. С учетом того, что революция ещё свежа, а на улицах по-прежнему царит хаос, стремиться к международной революции в данный момент было бы самоубийством. Несмотря на открытость к помощи из-за рубежа и готовность сотрудничать в рамках международных соглашений, в первую очередь необходимо сшить ткань нации, от рабочих до фермеров, от торнедалийцев до сканцев."

SWE_labor_led_union: "Центральная организация шведских рабочих"
SWE_labor_led_union_desc: "Основанная в 1898 году, SAC наконец-то достигла того, что ещё тридцать лет назад казалось немыслимым: она взяла на себя реальную власть. После революции SAC усердно работала над сотрудничеством и объединением различных профсоюзов по всей стране, приглашая и вытесняя профсоюзы, которые когда-то считались слишком большими, чтобы потерпеть крах, и которые когда-то были враждебны синдикалистской концепции самой SAC. В ходе серии грандиозных съездов с полным представительством рабочих и уровнем народных действий, невиданным до сих пор в шведской политике, народ и рабочие Швеции проголосовали за реформы, за новые законы и меры защиты. Одинокие матери теперь будут получать дополнительную поддержку, чтобы оставаться на работе, будет построена обширная система социального обеспечения, и люди, искалеченные тяжелым трудом, больше не будут брошены на улицу, чтобы там гнить. Трудовые правила, и через труд будет принят закон."

SWE_destroy_monarchist_dudes: "Ликвидация реакционизма"
SWE_destroy_monarchist_dudes_desc: "Консерваторы и их либеральные союзники являются рабами капитала, рабами шовинизма, рабами традиций, и поэтому SAC решила раз и навсегда сокрушить их власть. Освобождение женщин, освобождение бедных, освобождение рабочих может быть достигнуто только путем прямых действий и участия рабочих, и именно на основе этой практики была разработана кампания по распространению революции за пределы городов, в сельские районы, где скрываются реакционеры. Учитывая опыт Франции, Великобритании и Испании, SAC сформировала колонны грузовиков, обклеенных революционными лозунгами, заполненных книгами и информацией, охраняемых вооруженными стражниками. Мы верим и надеемся, что благодаря практическим материальным действиям идеи и цели революции смогут проникнуть в сердца каждого мужчины, женщины и ребенка без тоталитарного принуждения."

SWE_federalize_the_provinces: "Постоянное представительство профсоюзов"
SWE_federalize_the_provinces_desc: "Больше мелкие политики не будут управлять страной в союзе с капиталом, больше странные аристократы не будут строить заговоры из своих загородных поместий, чтобы нанести ущерб демократии, и больше реакционеры не будут препятствовать прогрессу. Хотя анархисты хотели бы разрушить общество, чтобы построить что-то новое, SAC понимает, что лучший путь вперед - это преобразование, а не разрушение. Путем введения представительства профсоюзов на всех уровнях политики SAC надеется достичь синтеза демократии и надлежащего представительства работников. Местные советы останутся, но вместе с представителями местных профсоюзов. Аналогичным образом, Landsting также будет иметь профсоюзное представительство от своего региона, а на национальном уровне большой совет профсоюзов будет сотрудничать с Riksdag в целях продвижения прав рабочих."

SWE_party_syndicates: "Нация, основанная на профсоюзах"
SWE_party_syndicates_desc: "Целью SAC всегда было представительство рабочих и преобразование общества в такое, где рабочие, освобожденные от капиталистического произвола и государственного насилия, могут по-настоящему жить в свободе. Активная политика SAC заключается в приглашении профсоюзов в зонтичную организацию, ознакомлении их с сутью синдикализма, а также в руководстве и получении информации от этих новых профсоюзов-членов. Победа SAC на последних выборах значительно ускорит этот процесс. Профсоюзы, ранее входившие в LO, были переведены под крышу SAC, и в настоящее время принимаются меры для обеспечения того, чтобы все работники, независимо от профессии и прежнего классового положения, были представлены в своих профсоюзах."

SWE_history_of_action: "Синдикализм - это действие"
SWE_history_of_action_desc: "Синдикализм динамичен. Синдикализм жив. Синдикализм - это действие. Благодаря упорному труду и решимости синдикализм распространился по всей стране и проник в сердца всех здравомыслящих рабочих, и именно благодаря упорному труду и решимости будет построена новая нация, нация действия. Мужчины и женщины, работающие вместе на благо семьи и общества, воплощают это чувство действия как в уме, так и в теле."

SWE_syndicate_industrialization: "Шведский трёхлетний план"
SWE_syndicate_industrialization_desc: "Благодаря планированию и сотрудничеству будет построена новая нация. После консультаций с авторитетными экономистами и профсоюзами был запущен трехлетний план, направленный на преобразование шведской промышленности в новый мировой стандарт. Благодаря усилиям, направленным на повышение эффективности и безопасности, считается, что шведские рабочие станут более квалифицированными и способными, чем когда-либо прежде, вооруженными хорошими инструментами, работающими в чистых и безопасных фабриках и мастерских, жаждущими насладиться плодами своего труда в выходные и частые праздники. Будут построены не только новые фабрики, чтобы сделать Швецию более самодостаточной страной, но и будет реализована ещё одна амбициозная цель - полностью искоренить безработицу, воплотить мечту о обществе, в котором каждый мужчина, каждая женщина и каждый ребенок могут работать и освободиться от тяжелого труда и товарищества своих коллег."

SWE_new_red_worker: "Новый шведский рабочий"
SWE_new_red_worker_desc: "Шведский рабочий старых времен был умиротворенным и запуганным человеком, подвергавшимся насилию со стороны правительства и издевательствам, порабощенным капитализмом и жестокими начальниками. Этот человек был слаб и едва осмеливался мечтать... Но теперь все изменилось. Сегодняшний шведский рабочий свободен, свободен в мыслях и действиях, он обучается как машиностроению, так и философии, когда не работает в освобожденном рабочем пространстве. Являясь совладельцем завода, на котором он работает, он трудится не только для своей семьи, не только для страны в целом, но и для себя самого, поскольку излишняя прибыль в промышленности реинвестируется в завод, а не крадется жестоким психопатом в цилиндре, живущим на частном острове. С ясной целью новый шведский рабочий выходит в мир как освобожденный человек."

SWE_agrarian_unions: "Интеграция сельских профсоюзов"
SWE_agrarian_unions_desc: "Сельские профсоюзы служат важным каналом для передачи информации о бедах сельских рабочих, которые часто остаются незамеченными и забытыми членами общества. Хотя SAC исторически был ближе к городскому пролетариату, чем к сельским фермерам или лесорубам, это должно закончиться, и закончится в ближайшее время. Благодаря более тесному сотрудничеству и дальнейшей интеграции различных ассоциаций и сообществ, рабочих мест и сельских профессий, SAC может по праву называться голосом всего народа Швеции."

SWE_against_foreign_reaction: "Основать SBP"
SWE_against_foreign_reaction_desc: "Иностранные реакционеры и национальные агитаторы по-прежнему работают над дестабилизацией и свержением рабочего правительства, поэтому будет создана Statens Beväpnade Polis, или Государственная вооруженная полиция (SBP). Это агентство безопасности, работающее круглосуточно для защиты Швеции и её народа от вторжения и клеветы, будет, тем не менее, тщательно контролироваться Риксдагом, чтобы не допустить его превращения в тоталитарную тиранию или полицейское государство. С самого начала демократизированная, для поступления на службу в SBP необходимо сначала быть полицейским и активно участвовать в соответствующих профсоюзных мероприятиях. Более того, SAC не только создала SBP, но и воспользовалась возможностью интегрировать Polisförbundet, профсоюз, представляющий интересы полиции."

SWE_command_union_loyalty: "Интернациональный шведо-синдикализм"
SWE_command_union_loyalty_desc: "Шведский хлеб должен в первую очередь поступать в шведские желудки, точно так же шведская промышленность должна удовлетворять шведские потребности, но это не означает, что Швеция отказывается от своих международных обязательств. Профсоюзы со всей Скандинавии поддерживают связь друг с другом в Стокгольме, почти на регулярной основе проводятся встречи и съезды мыслителей со всего мира, и Швеция стала более международной, чем когда-либо прежде. Благодаря относительно бескровной революции Швеция сыграла очень важную роль в том, чтобы сделать синдикализм более приемлемым для людей, живущих в угнетенных странах, и шведские ассоциации помощи финансируются для распространения помощи, а также синдикализма за рубежом."

SWE_central_planning: "Необходимый бюрократизм"
SWE_central_planning_desc: "Бюрократия часто вызывает ненависть у анархистов и всех, кто имеет элементарное представление о жизни, но она необходима для эффективного управления любой страной, не говоря уже о любом государстве. В то время как анархисты протестуют, SAC решил принять бюрократию шведского правительства, поскольку её уничтожение просто внесло бы серьезные помехи в работу шведской промышленности. Необходимо попытаться превратить серую массу бюрократии в более энергичную и активную часть революционного правительства, но в настоящее время, несмотря на синдикалистские цели революции, в обозримом будущем Риксдаг и различные министерства правительства должны оставаться у руля. Если исполнительная власть будет передана слишком быстро, синдикалистский эксперимент просто окажется недостижимым, поскольку власть захватят оппортунисты и реакционеры."

SWE_education_expansion: "Всеобщее университетское образование"
SWE_education_expansion_desc: "Университеты всегда были для самых богатых в обществе, как для дворян, так и для бизнесменов. Но теперь все изменилось, поскольку SAC и Риксдаг в целом решили сделать образование бесплатным для всех, предоставив льготы тем, кто желает получить образование инженера или медицинского работника. Это не общество грубиянов и слабоумных, идеальный шведский рабочий - это образованный человек, и поэтому правительство и профсоюзы должны сделать все возможное, чтобы шведы получили максимально возможное образование."

SWE_union_of_sweden: "Мать Свеа, гордо идёт вперёд!"
SWE_union_of_sweden_desc: "Швеция переродилась, она больше не является древней деспотической монархией, контролируемой богатыми. Теперь Швецией правят её рабочие, готовые защищать её в соответствии с идеалами синдикализма и современным чувством шведской пролетарской гордости. Мать Свеа освободилась от оков средневековой сентиментальности и капиталистического излишества, вооружилась винтовкой, оделась в красное и готова сразиться со всем миром."


###Anarcho_syndicalism###
SWE_syndicalist_victory: "Триумф воли свободных людей"
SWE_syndicalist_victory_desc: "Анархистская фракция SAC вышла вперед, возглавив группу на выборах в Рабочий Риксдаг. Теперь, когда Швеция находится у руля, может начаться по-настоящему свободная и справедливая революция."

SWE_self_governing_regions: "Синдкаты провинций"
SWE_self_governing_regions_desc: "Несмотря на огромные размеры Швеции и некоторые нерешительные попытки капиталистов децентрализовать страну в последние годы, правда заключается в том, что Швеция - это, по сути, две разные страны: Стокгольм и все остальные регионы. Слишком много решений принимается неизбранными и незаинтересованными бюрократами в Стокгольме, и это просто недопустимо. Передав больше власти Ландстингу и обеспечив его основу в профсоюзах и синдикатах, Швеция может стать гораздо более равным обществом без изнурительной бюрократии. Потребности сельскохозяйственного рабочего часто не совпадают с потребностями заводского рабочего, и, принимая региональные различия как в законодательстве, так и в организации, Швеция может достичь чего-то, более близкого к анархистскому идеалу."

SWE_unchaotic_anarchism: "Разрушая цепи капитала"
SWE_unchaotic_anarchism_desc: "Капитализм создает купеческое дворянство, тех, кто попирает других ради прибыли. Этот паразитирующий класс должен быть удален из общества вместе с их предприятиями, и все станут равными, поскольку все будут вместе участвовать в плодах промышленности на равных условиях. Агитаторы и сторонники из всей Интернационала пришли на помощь шведскому народу, обучая и просвещая вновь созданные профсоюзы и кооперативы, синдикаты и мастерские тому, как лучше всего использовать вновь освобожденные отрасли промышленности."

SWE_retribution_against_reaction: "Справедливость против тирании"
SWE_retribution_against_reaction_desc: "Нильс Летт, молодой революционер с большим опытом работы в профсоюзах судоходства и с друзьями в Стране Басков и Каталонии, опубликовал брошюру, в которой он аргументирует и прямо требует абсолютного уничтожения реакционных элементов в сельской местности. Летт, избранный командиром милиции, рассматривается многими в движении в целом как анархист-подрывник, а благодаря своей стальной риторике и склонности к агитации на передовой он стал центральной фигурой в марше новой Швеции против реакции. Захватив грузовики у капиталистов, призвав на службу здоровых рабочих и вооружив каждого из них, революция будет упрочена и защищена, а реакция искоренена."

SWE_land_reform: "Земли для народа"
SWE_land_reform_desc: "Нынешнее состояние земель в Швеции является ужасным, несправедливым и, прежде всего, неэффективным. В консультации с профсоюзами и представителями сельских ассоциаций был разработан грандиозный план земельной реформы, предусматривающий надлежащие меры по равномерному перераспределению богатства от старых поместий к новому поколению фермеров. Хотя анархистские коллективы, естественно, будут пользоваться привилегиями, в идеале как способ продвижения цели создания поколения рабочих, которые будут трудиться на полях, небольшие фермы будут разрешены, хотя время эксплуатации подошло к концу."

SWE_total_liberation: "Свобода без границ"
SWE_total_liberation_desc: "«Я мечтаю о дне, когда все рожденные дети будут желанными, все мужчины и женщины равными, а сексуальность будет выражением близости, удовольствия и комфорта», - и, следуя этим словам, шведское руководство приняло политику полного и абсолютного равенства мужчин и женщин в законодательстве, на работе и в социальной сфере, а также отменило прежние законы о морали и другие возмутительные проявления патриархального господства. Шведские мужчины и женщины больше не будут бояться каких-то странных законов, которые заставляют их вести себя определенным образом, местный священник больше не сможет доносить на людей за непристойное поведение, а дети, рожденные вне брака, больше не будут вынуждены вести преступную и насильственную жизнь. Одинокие матери будут защищены, детям будет предоставлена защита, и будет достигнуто полное освобождение обоих полов."

SWE_international_worker: "Северный маяк"
SWE_international_worker_desc: "«Анархизм - единственная неподкупная сила», - как цитирует Нильс Летт в недавней публикации, и именно с этой верой, этим идеалом, этой абсолютной убежденностью страна может очиститься от капиталистической гнили, освободиться от тирании и стать свободной для каждого мужчины, женщины и ребенка. Не поддавшись большевистскому безумию Петербурга или бредовым иллюзиям тоталитаризма, шведские анархисты доказали, что революцию можно осуществить без чрезмерного кровопролития и насилия, революционного террора или жестокости. Хотя это был тернистый путь, анархизм не ждет никого и может быть достигнут только теми, кто борется за него самым упорным образом."

SWE_true_international_rev: "Протянуть руки свободы во весь мир"
SWE_true_international_rev_desc: "Элиз Оттосен-Йенсен и восходящая звезда Нильс Летт являются доказательством успеха интернационализма. Оттосен-Йенсен родом из Норвегии, но полностью и безоговорочно приняла эту страну как свою родину, особенно после революции. Летт бороздил семь морей, встречаясь с американцами, русскими, англичанами, французами, иберийцами всех региональных разновидностей, и даже немного занимается эсперанто. Поэтому сейчас, когда шведская революция набирает обороты и возникает анархистское общество, было бы грубо и прямо-таки невежливо со стороны шведских анархистов отказаться от своих интернационалистских принципов."

SWE_unions_unchained: "Власть синдикатам"
SWE_unions_unchained_desc: "Профсоюзы с самого начала поддерживали революцию, поддержали победу анархистов на выборах и сейчас активно работают на благо анархистского общества. Очевидно, что профсоюзы должны быть вознаграждены за свой упорный труд, лояльность и непоколебимую веру в идеалы анархо-синдикализма. Освободив профсоюзы под эгидой SAC, позволив больше региональных разновидностей, шведское профсоюзное движение станет по-настоящему свободным, верховным и маяком пролетарских достижений. Всем известно, что профсоюзы являются самой истинной формой представительства рабочих, и как таковое, это просто естественный шаг."

SWE_working_week_plan: "Досуг освобождённого рабочего"
SWE_working_week_plan_desc: "Капиталист заставляет своих работников трудиться до седьмого пота, не оставляя им времени наслаждаться плодами своего труда. Но не здесь, в Швеции работнику будет предоставлено достаточно времени, чтобы насладиться тем, для чего он трудился. Благодаря увеличению количества праздничных дней, сокращению рабочей недели, введению более эффективных смен, поощрению образования и интеллектуализации шведские рабочие станут верховными. Хотя маловероятно, что заводские рабочие будут цитировать Бакунина или Кропоткина на рабочем месте, SAC и его анархистское течение в целом твердо убеждены, что все мужчины и женщины должны получать образование, чтобы защитить их от угнетения в будущем."

SWE_anti_capitalist_realm: "Общество без хозяев"
SWE_anti_capitalist_realm_desc: "Что составляет истинную свободу, остается предметом споров, и различные анархистские течения бесконечно спорят о том, что является свободой, а что нет, но одно конкретное проявление свободы можно найти в анархистской Швеции. Здесь рабочие могут позволить себе роскошь, которая в других условиях была бы для них недоступна, могут работать на постоянной работе без капиталистического угнетения и могут строить страну с утешительной мыслью, что их дети унаследуют все, что будет построено, и что это не будет продано куда-то еще. Свобода заключается в создании чего-то для будущих поколений, в образовании себя и своих детей, в возможности жить без голода и угнетения, издевательств и принуждения."

SWE_empowering_rural_syndicalists: "Союз почвы и стали"
SWE_empowering_rural_syndicalists_desc: "Кульминацией ранее проведенной земельной реформы станет создание фермерских синдикатов, что ещё больше продвинет Швецию в современность, превратив кооперативы в нечто новое и особенное. Небольшие фермы наконец будут объединены в более крупные структуры, управляемые фермерами и свободные от внешнего давления, все объединенные в синдикаты, региональные и местные, для улучшения общества."

SWE_mild_industrialisation: "Промышленность в гармонии с природой"
SWE_mild_industrialisation_desc: "Индустриализация необходима, однако планирование и консультации с профсоюзами имеют жизненно важное значение для того, чтобы она не стала жестокой и расточительной. Промышленность, доведенная до самой жестокой и гнусной формы, без учета местной среды или культуры, потребностей или необходимости, в Европе, пожалуй, лучше всего иллюстрируется примером Бирмингема в Соединенном Королевстве, который породил жестокие теории тоталитаризма. Под руководством рабочих и фермеров, профсоюзов и местных советов ни один город или поселок в Швеции никогда не будет таким мрачным и угрюмым, как Бирмингем, поскольку вместо этого будет проводиться политика поощрения достойного человеческого труда."

SWE_federal_system: "Границы исчезают, люди остаются"
SWE_federal_system_desc: "Несмотря на то, что международная ориентация по-прежнему остается основной целью, движение не должно забывать, что революция - это революция для народа. Ведь именно люди, а не нации или идеалы, вносят изменения. Нации просто нанесены на карту, а общество действительно составляют люди, культура и сообщество. Как только шведский народ станет свободным, все другие народы мира смогут освободиться, одна пуля, одна книга, одно движение за раз."

SWE_realm_of_syndicalism: "Северная коммуна"
SWE_realm_of_syndicalism_desc: "Впервые за более чем тысячу лет швед был освобожден. Ему больше не нужно бояться местного сеньора или жестокого военачальника, капиталистического торговца раздором или психопатического священника, потому что он пробудился, встал, избавился от вшей и других паразитов и стоит твердо, бдительно, в свободном и анархистском доме. Другие анархисты могут спорить и дискутировать о самой природе анархо-синдикалистского общества, о том, применима ли сама концепция нации к анархистской мысли, но эти вопросы - роскошь, которую наконец-то можно себе позволить, и все благодаря революционному анархистскому пылу, искреннему в сердце и уме."


###Radical Socialists Focuses###
SWE_radical_socialist_victory: "SSV снова побеждает!"
SWE_radical_socialist_victory_desc: "Народ вновь доверился SSV! Сначала, чтобы свергнуть ужасных реакционных тиранов, а теперь, чтобы перестроить страну в северную утопию! Svenska Socialdemokratiska Vänsterpartiet прошла долгий путь с момента своего основания, когда ей грозил распад, а теперь она правит страной. Стремясь принести истинную социальную демократию массам, SSV видит будущее страны, в которой каждый человек, независимо от своего происхождения, может построить для себя, своего сообщества, своей страны и семьи хорошее, чистое будущее."

SWE_connections_to_russian_socialists: "Больше никакого рабства!"
SWE_connections_to_russian_socialists_desc: "Амбициозный план был продвинут через Риксдаг, одним махом отменив оплату чем-либо, кроме твердой валюты, закрепив представительство профсоюзов во всех отраслях промышленности и обеспечив, что ни один работник, получивший увечье на производстве, никогда не останется без еды, благодаря созданию и последующему расширению государственной пенсии для всех. Хотя в краткосрочной перспективе это нанесет ущерб экономике, экономика должна существовать только для людей, к черту стимулы для получения прибыли. Валленберг и ему подобные могут протестовать из своего изгнания за границей, но SSV непоколебим."

SWE_dissolve_noble_estates: "Конец аристократии!"
SWE_dissolve_noble_estates_desc: "SSV не намерен превращать революцию в кровавую баню, но для создания более равного общества необходимо немедленно упразднить дворянство и его вычурные титулы. Риддархусет, учреждение, финансируемое и поддерживаемое дворянством для продвижения интересов дворянства, должно быть уничтожено. Какое общество может процветать, если существует какая-то странная группа дворян, которые сговариваются между собой, чтобы остаться у власти? Меритократия требует физических действий, и после того, как правительство дало зеленый свет, красные милиции и полиция штурмовали Риддархусет. Хотя арестов не будет, эта акция, а также принудительное распределение земель из раздутых поместий, в долгосрочной перспективе непременно уничтожит власть дворянства."

SWE_internationale_aid: "Помощь от Интернационала"
SWE_internationale_aid_desc: "Карл Чильбум долгое время был частым контактным лицом в Париже между шведскими левыми и Интернационалом в целом, и после упорного труда и самоотверженности, после тяжелого труда и пота, шведские рабочие наконец присоединились к общему делу с континентальными левыми. В честь шведской революции и с наилучшими пожеланиями из Парижа Швеция получит помощь от Интернационала, чтобы закрепить и сохранить достижения революции."

SWE_marxism_maintained: "Марксизм сохранён!"
SWE_marxism_maintained_desc: "SSV всегда придерживалась идеологии Карла Маркса, полностью внедряя марксизм. Это оставалось одним из самых больших разногласий между ней и SAP, поскольку SAP постепенно переходила от марксизма к кейнсианству и капитализму. Чтобы отделиться от своего предшественника SAP, SSV запустит кампанию, чтобы напомнить людям, что эта революция по своей сути является истинно марксистской и что социалистическая демократия всегда была и будет основной целью марксизма."

SWE_female_emancipation: "Полная эмансипация женщин"
SWE_female_emancipation_desc: "Освобождение рабочего класса касается всех, как мужчин, так и женщин. На протяжении всей истории женщины всегда рассматривались как люди второго сорта, но теперь это в прошлом! Приняв во внимание мнение Карин Бойе и признав неотъемлемую феминистскую природу освобождения рабочих, Швеция станет самым равноправным обществом в мире!"

SWE_bring_farmers_forward: "Фонд сельских рабочих"
SWE_bring_farmers_forward_desc: "Поскольку крупные поместья быстро уходят в прошлое, Швеция сталкивается с любопытной проблемой: в стране слишком много неэффективных ферм. Благодаря созданию специального фонда и механизации сельскохозяйственного сектора эффективность будет повышена, фермеры будут освобождены, как и их братья-рабочие, и, надеемся, Швеция сможет достичь продовольственной безопасности, независимой от Европы."

SWE_mass_education_reform: "Массовая реформа образования"
SWE_mass_education_reform_desc: "После революции сектор образования не претерпел значительных реформ из-за того, что правительство сосредоточилось на стабильности в стране и других реформах. Это изменится. Молодежь является фундаментом любой революции или, по сути, любой партии, как хорошо знает сама SSV. Без молодой энергии, без участия молодых кадров в шведской левой партии SSV никогда бы не пришла к власти, не говоря уже о том, чтобы довести революцию до конца. Благодаря созданию дополнительных школ, повышению заработной платы учителей и поощрению молодежи к пониманию социализма, Швеция пойдет в будущее с революционным авангардом хорошо образованных взрослых, воспитанных на принципах Маркса, уроках революции и разуме."

SWE_bring_soc_dem_back: "Оливковая ветвь умеренных социалистов"
SWE_bring_soc_dem_back_desc: "Сломать прежнюю корону удалось только благодаря коалиции с социал-демократами Ханссона. Хотя в душе они капиталисты, их вера в общество, основанное на демократических ценностях и заботливом государстве, не противоречит целям SSV, и поэтому их членам и руководству следует предложить интеграцию в SSV, поскольку их собственная партия быстро теряет всякую значимость."

SWE_no_trust_monarchists: "Всеобщее осуждение монархистов"
SWE_no_trust_monarchists_desc: "Хотя партия Ханссона действительно помогла революции, свергнув монархию вместе с SSV, на фундаментальном уровне это был не очень легкий шаг. SAP, несмотря на то, что она заявляет о своей социал-демократической или, по крайней мере, номинально социалистической ориентации, и, по-видимому, является республиканской, содержит в себе целую кучу монархистов или, по крайней мере, тех, кто их принимает. Этого нельзя допускать. С помощью брошюр, встреч и съездов эту криптомонархическую гниль можно раз и навсегда искоренить из шведской левой. Ханссон - революционный мученик, но, несмотря на свои республиканские убеждения, он был слишком дружелюбен по отношению к старому королю."

SWE_commune_development: "Создание народных коммун"
SWE_commune_development_desc: "С ликвидацией старой аристократии и буржуазного государства настало время перестроить саму структуру общества. Руководствуясь принципами радикального социализма, SSV приступает к амбициозной задаче организации сельских и городских районов в демократические, самоуправляемые коммуны. Это не просто административные единицы, а основа новой Швеции, управляемой рабочими и для рабочих."

SWE_people_council: "Формирование народного совета"
SWE_people_council_desc: "Чтобы по-настоящему представлять волю трудящихся масс, необходимо создать централизованный Народный совет, состоящий из делегатов от коммун, профсоюзов и революционных комитетов по всей Швеции. Этот орган будет служить нервным центром новой социалистической республики, координируя национальную политику, контролируя производство и обеспечивая, чтобы ни один голос пролетариата не остался неуслышанным."

SWE_land_to_people: "Воздать землю народу"
SWE_land_to_people_desc: "Эпоха частной собственности и феодальной эксплуатации закончилась. Земля принадлежит не немногим, а многим. Ключом к продолжению перераспределения земли является создание аграрных коллективов, чтобы каждый человек имел возможность возделывать землю своих предков. Передавая право собственности государству и перераспределяя его через коммунальное управление, государство гарантирует, что каждый гектар служит общему благу народа и революции."

SWE_no_masters_no_kings: "Разорвать цепи владычества"
SWE_no_masters_no_kings_desc: "Монархия была не только символом угнетения, но и опорой старого режима. её титулы, традиции и наследие должны быть брошены в огонь истории. Швеция не будет оглядываться на королей или господ, а будет смотреть в будущее, сформированное исключительно волей народа."

SWE_new_history_party: "Социалистический демократизм"
SWE_new_history_party_desc: "Революция не может выжить, если она раздроблена. Демократия является ключом к новому шведскому обществу, а реакционные настроения - нет. Хотя SSV терпимо относится к тем, кто не обязательно любит новую систему, и не преследует тех, кто присоединяется к другим левым партиям, чтобы участвовать в новой чистой демократической системе, между всеми партиями должно быть заключено соглашение о запрете, даже запрете, реакционных и капиталистических партий."

SWE_nordic_people_revolution: "Северная народная революция"
SWE_nordic_people_revolution_desc: "Вопреки всему, красный флаг теперь развевается над Скандинавией. На бывших землях королей и дворян укоренилась настоящая революция равенства. Швеция стоит не как одинокий маяк, а как первая искра освобождения для народов Северной Европы. Путь к справедливости, равенству и свободе начался."


###Нильс Флюг###

SWE_nils_flyg_in_power: "Восстание чёрной овцы"
SWE_nils_flyg_in_power_desc: "Долгое время подвергавшийся насмешкам как со стороны левых, так и правых, Нильс Флюг теперь управляет государством. Идеологический изгой возвращается, но не с компромиссом, а с новым порядком. Не будучи ни марксистом, ни монархистом, он объединяет в своем видении национальный долг и силу синдикализма в одно непреклонное дело. Неся на своих плечах наследие Ленина и Мосли, Нильс Флюг надеется создать подлинно социалистическое государство, лишенное недостатков обоих политических гигантов."

SWE_national_syndicalism_empower: "Определяя национал-синдикализм"
SWE_national_syndicalism_empower_desc: "По мнению Нильса Флюга, причина, по которой русская революция провалилась, а французская и английская революции увенчались успехом, заключается как в более многочисленном городском пролетариате по отношению к населению в целом, так и в том, что революция была национальной, а не международной. Ленин, хотя и был героем, не справился со своей исторической задачей по продвижению красного знамени на восток, поскольку был введен в заблуждение интернационалистами-марионетками, криптоменшевистской внутрипартийной оппозицией и заговорщиками из числа меньшинств, и поэтому, по мнению Нильса Флюга, было вполне естественно, что большевистское восстание потерпело неудачу. Действительно, в оживленном промышленном центре Великобритании, Бирмингеме, строится истинный социализм. Под руководством тоталитарного мыслителя Освальда Мосли Великобритания шагает в будущее хорошо вооруженная и хорошо накормленная, и все это без всепроникающего «другого» на высших постах власти. Точно так же шведская революция должна быть национальной, а не международной, и для этого была развернута кампания, чтобы массы поняли этот факт. С единым народом, поддерживающим партию и движение в целом, Швеция будет сильной и независимой. Это не международный социализм. Это не либеральная демократия. Это национальный синдикализм. Класс и нация объединены. Рабочий класс служит государству. Народ идет к одной цели: силе."

SWE_remove_pink_parasites: "Конец паразитам"
SWE_remove_pink_parasites_desc: "Линдерот, Линдхольм Килбом и Флюг когда-то имели общую цель: социализм. Однако со временем Нильсу Флюгу и партии стало совершенно ясно, что Линдерот, Линдхольм и Килбом сбились с пути, не говоря уже о том, что они уже находились в прямой оппозиции. Линдерот считает, что Флюг ведет страну по темному пути, Линдхольм думает, что Нильс Флюг не идет достаточно далеко, Килбом озабочен демонтажем избирательной системы, и поэтому со всеми тремя нужно разобраться по-своему. Такие люди, как Килбом, Линдхольм и Линдрот, не имеют места в новом порядке. Килбом, мудро поняв, что Флюг в конечном итоге выступит против него, вернулся в Париж, отчаянно пытаясь создать шведскую социалистическую партию за рубежом. Линдрот, однако, все ещё находится в стране и, хотя он регулярно появляется в Риксдаге, в остальном он ушел в тень. Кроме того, Линдхольм больше не переписывается с Флюгом так часто, как раньше, и хотя он ссылается на службу в армии, скорее всего, он также готовится свергнуть Флюга, как только представится возможность. Чтобы спасти страну, спасти революцию, необходимо уничтожить враждебных партии паразитов, и в первую очередь внутри страны."

SWE_real_syndicalism: "Революционизм над дем. централизмом"
SWE_real_syndicalism_desc: "Возможно, лучшим аспектом красного эксперимента в России был принцип демократического централизма, хотя в тяжелой ситуации, в которой находится страна в настоящее время, партия была вынуждена отложить такие принципы. Вместо этого, пока реакционеры бегают по лесам и играют в левых протестующих, страна будет управляться в соответствии с тем, что Флюг называет «революционной сплоченностью» - запутывающим термином, означающим, что все политические указы должны исходить от него и только от него, без фракционных споров. Истинный синдикализм основан на единстве и силе, а не на бесконечных дебатах. Революция требует дисциплины, ясности и веры в руководство. Флюг говорит от имени нации."

SWE_draft_penal_servitude: "Праведный реабилитационный труд"
SWE_draft_penal_servitude_desc: "Революция требует жертв. Так же, как рабочие, которые боролись на фабриках во время мировой войны, и те, кто боролся во время бесчисленных европейских революций, все шведы должны быть готовы сделать все возможное для нации и революции. Хотя партия планирует ввести широкие права для рабочих, права заключенных, контрреволюционных агентов и других паразитов в стране будут ограничены, и они будут вынуждены работать на благо нации. С двойной целью увеличения производства и предотвращения поднятия восстания реакционерами в тюрьмах, враги революции будут освобождены потом и трудом."

SWE_competitive_industrialisation: "Промреформа и эмансипация женщин в производстве"
SWE_competitive_industrialisation_desc: "Промышленность - это сила. Чтобы выжить, мы должны построить экономику, способную конкурировать с великими державами. Если бы Ленин смог использовать всю промышленную мощь России без оппозиции меньшевиков, то революция увенчалась бы успехом, и, извлекая уроки из этого, Флюг хочет усилить промышленное производство. Благодаря введению производственных квот и вознаграждений за их превышение, внедрению новых технологий и эмансипации женщин производство непременно взлетит до небес. С введением шестичасового рабочего дня и детских садов для детей рабочих можно будет ввести двойные или даже тройные смены, и звук промышленности никогда не умолкнет."

SWE_establish_secret_security: "Формирование FNS"
SWE_establish_secret_security_desc: "Хотя старая капиталистическая полиция имела своих информаторов, а армия - собственное агентство безопасности, с началом революции стало совершенно ясно, что партия и народ нуждаются в новом разведывательном агентстве. В соответствии с директивой Нильса Флюга и партии, член партии Агатон Блом был поручен создать новую единую тайную полицию под названием FNS, Народная национальная полиция безопасности. Folkets Nationella Säkerhetspolis будет действовать как глаза и уши режима, прослушивая и контролируя оппозицию в стране. Уже разработаны планы по размещению информаторов по всей стране и стимулы, позволяющие реакционерам шпионить за своими товарищами, вместо того чтобы отбывать срок в исправительных работах. Под непосредственным командованием партии они будут выявлять подрывную деятельность, нелояльность и проникновение. Стабильность начинается с бдительности."

SWE_cult_of_personality_flyg: "Персона Флюга"
SWE_cult_of_personality_flyg_desc: "Ленин, Муссолини, Мосли. Три гиганта, объединенные одной целью - социализмом, и все трое посвятившие себя делу национального освобождения, по крайней мере, по мнению Флюга. Однако помимо веры в социализм всех троих объединяет то, что они все имеют или создают культ личности. Хотя иногда культ личности формируется искусственно, он как раз и нужен Швеции, как указано в недавнем коммюнике партии. К счастью, Нильс Флюг имеет довольно яркую историю, которую легко распространить среди масс. Нильс Флюг собственными глазами видел, как социал-демократия предала дело социализма, был в Париже, когда красные знамена завоевали все улицы, и участвовал в великих достижениях Бирмингема, где тоталитаризм был впервые должным образом реализован в меньших масштабах. Как и Ленин, Нильс путешествовал по всей Европе, встречался с самыми важными революционными мыслителями своего времени и сам пострадал на службе социализму. Его дочь Сольвейг умерла от туберкулеза в двадцатые годы, заразившись непосредственно от немецкого социалиста, которому Флюг предоставил убежище, и он поставил на карту свое здоровье на службе нации. Нильс Флюг - не просто политик. Он - голос революции. Его изображение будет присутствовать в каждом государственном учреждении и школе, его наставления будут печататься в каждой газете, его слова будут определять будущее. Народ должен верить и никогда не сомневаться."

SWE_ideological_borderlands: "Серое государство"
SWE_ideological_borderlands_desc: "Нильс Флюг и его партия не связаны традиционными категориями и ярлыками. Следуя по стопам Гегеля и Маркса, учиться на опыте настоящего, чтобы предвидеть будущее, идеология Нильса Флюга не может быть обозначена как полностью социалистическая, полностью национальная или полностью воинственная. Партия представляет собой национальный синдикалистский эксперимент, тоталитарный авангард в эпоху реакции и аристократического либерализма, маяк красного света в эпоху капиталистического упадка. её нельзя определить просто как социалистическую, синдикалистскую или националистическую. Партия есть партия, идеология есть идеология, и, пожалуй, единственное, что лучше всего характеризует движение, созданное Нильсом Флюгом, - это его смелость адаптироваться. Пусть коммунисты и интернационалистские паразиты протестуют из Парижа, ведь история оставит их позади. Сегодняшняя партия сформирована трудом, лояльностью и национальной целью. Идеология - это не теория. Это действие."

SWE_blow_up_reaction: "Чистка реакционных остатков"
SWE_blow_up_reaction_desc: "Проблемы, с которыми когда-то столкнулся Ленин, стоят перед Флюгом. Хотя городские центры находятся под строгим контролем, сельская местность остается источником раздражения, а белый террор является реальностью в виде террористических актов со стороны бывших армейских подразделений. В то время как ФНС пытается подавить реакцию в городах, восстановленная армия также должна быть задействована на практике, а бывшие реакционные офицеры должны быть привлечены к обучению новой, окрашенной в красный цвет армии. С опытными офицерами и политически мотивированными новобранцами начинается второй этап революции, когда грузовики с солдатами отправляются в очаги реакционного сопротивления, спасая страну одним арестом за другим. Их время истекло. Они будут уничтожены, прежде чем смогут снова закова"

SWE_newspaper_for_the_nation: "Голос нового государства"
SWE_newspaper_for_the_nation_desc: "Нильс Флюг - не только революционер, но и журналист. Когда он не работает и должен отдыхать в национальные праздники, Флюг проводит свободное время, писая статьи и читая статьи других начинающих журналистов. Хотя Флюг и не является сторонником капиталистических СМИ прошлого, он знает о силе прессы не понаслышке и понимает, как она может влиять на людей как положительно, так и отрицательно. Любимая газета Флюга, «Folkets Dagblad Politiken», была выбрана в качестве предпочтительной постреволюционной газеты Флюга и стала газетой нового правительства. Распространяемая бесплатно и с статьями, печатаемыми в других газетах по всей стране, она будет формировать сознание нации и доносить идеи партии до каждого гражданина. Некоторые могут обидеться на идею размещения в спортивном журнале, казалось бы, случайной статьи о превышении плана по производству зерна, но со временем они поймут, что даже развлечения можно сочетать с информацией."

SWE_to_rule_as_king: "Из руин восстанет новый мир"
SWE_to_rule_as_king_desc: "После революции шведская промышленность полностью рухнула. Рабочие препятствовали производству, владельцы фабрик покидали страну, а инженеры, архитекторы и другие специалисты уезжали из Швеции, что привело к серьезной утечке мозгов. Естественно, эту ситуацию необходимо исправить. В новой директиве партии Флюг изложил ряд целей, которые должна достичь страна, начиная от попытки вернуть часть уехавших специалистов, повышения заработной платы квалифицированной рабочей силе и полной реконструкции шведской промышленности. Старое оборудование должно быть продано, а новое - введено в эксплуатацию, опасные инструменты и токарные станки должны быть сделаны более безопасными, а пролетариат должен понять политическую политику. С пролетариатом, объединенным под флагом нации и партии, страна обязательно восстанет из пепла, и сформируется новое поколение хорошо образованных шведов, лояльных партии."

SWE_subdue_sami_natives: "Одна нация, без исключений"
SWE_subdue_sami_natives_desc: "Худшей политической попыткой Ленина и его преемников была идея о том, что все группы общества должны быть представлены в равной степени, что, по мнению Флюга, является абсурдным представлением. Для Флюга абсурдно, что татары и башкиры имеют такое же право на представительство, как и большинство, поскольку это только разжигает мятеж и антинациональное мышление. У Швеции есть свои меньшинства. Наиболее известными за рубежом являются саамы, но самыми многочисленными являются шведские финны, не говоря уже о нескольких рома, разбросанных по всей стране, а также о еврейской диаспоре. Флюг считает нелепым, что все эти народы должны быть представлены в равной степени или даже иметь какой-то независимый совет, тем более что, по мнению Флюга и, в частности, Агатона Блома, шведские евреи, например, предрасположены к либеральной политике. В новой директиве партии было решено, что с этого момента все меньшинства в Швеции должны рассматриваться как шведы и иметь только те же права и законы, что и любой другой швед, с исключением определенных разрешений и особых условий. Хотя и либеральная оппозиция, и реакционеры протестуют против этого решения по разным причинам, партия остается единой. Эпоха региональной идентичности и этнических различий закончилась. Все, кто живет в Швеции, являются шведами. Саамы и другие периферийные группы должны быть полностью включены в национальную идентичность, без компромиссов."

SWE_nation_of_patriots: "Разжечь патриотический пыл"
SWE_nation_of_patriots_desc: "По мнению Флюга и Блома, проблема большинства социалистических течений заключается в том, что они слишком привязаны к интернационалистским позициям. Хотя партия верит в мир между людьми и демилитаризацию в периоды спокойствия, слишком многие партии по всему миру пренебрегают интересами собственного населения в угоду каким-то более важным международным целям, не понимая, что единственной реалистичной целью является достижение социализма внутри страны, и что глобальная революция может быть построена только на этой основе. Таким образом, партия долгое время занимала уникальную позицию в шведской политике и будет продолжать это делать. Будучи социалистической, но верящей в независимость Швеции и отказывающейся подчиняться любой иностранной державе, Швеция принимала помощь от Интернационала только по необходимости, и хотя партия верит в равенство всех европейских народов, шведы занимают естественную позицию более высокой важности. Агатон Блом, в частности, считает, что, укрепив партию патриотизмом, можно преодолеть разрыв в обществе, убедить реакционеров и нерешительных членов пролетариата в том, что партия является прежде всего национальной партией и стремится к достижению социализма только в контексте шведских настроений и культуры. В то время как Париж протестует против того, что Швеция идет по темному пути, а Килбом по-прежнему хочет собрать социалистические освободительные силы, чтобы остановить партию, партия быстро становится душой нации. Работать на благо страны - это хорошо, но работать на благо и страны, и революции - ещё лучше."

SWE_one_nation_one_party: "Конец буржуйской демагогии"
SWE_one_nation_one_party_desc: "Одними из величайших преступлений, совершенных против шведского народа, были идея плюралистической политики, либерально-капиталистическо-демократическая демагогия и идея «Folkhemmet», основанная на сотрудничестве классов. Слишком много рабочих были отвлечены пустыми словами, паразитическим чувством умеренности, проникшим в саму ткань порядочного общества. Это должно закончиться. В новом партийном указе было решено, что все партии, противостоящие нынешней национальной революции, должны быть упразднены и запрещены, а их члены должны быть насильно или иным образом втянуты в национальный партийный аппарат. В Швеции есть место только для одной партии, ей нужна только одна партия, и она получит только одну партию."

SWE_nordic_engine_roar: "Разжечь северный двигатель"
SWE_nordic_engine_roar_desc: "Партия стала подарком для страны, и страна занята тем, что отплачивает ей тем же. Фабрики работают круглосуточно, школьники читают статьи партийного руководства и обсуждают их между собой, женщины освободились, чтобы работать столько же часов, сколько и мужчины, а объем производства вырос до невиданных ранее высот. По мере того как новое поколение шведов вступает в промышленность, новые машины и инструменты строят лучшее, более чистое и более равное общество, казармы становятся центрами революционной бдительности и пролетарской боевитости, Швеция наконец пробудилась. Хотя некоторые опасаются, что возрожденный дух выплеснется за границу, другие просто довольны, видя повышение уровня жизни, конец политических раздоров и конец реакционного террора. Партия сильна. Нация сильна. Народ силен."


###Linderot###

SWE_linderot_seizes_control: "Коммунисты Линдрота вступают в новую веху"
SWE_linderot_seizes_control_desc: "Дело Ленина не умерло, и благодаря Свену Линдеруту и SKP Ленин действительно снова оживает. После жарких дебатов и политических маневров в Красном Риксдаге фракция во главе со Свеном Линдерутом заняла доминирующее положение, обещая быструю корректировку курса в более коммунистическом направлении, вдохновленную идеализмом первых дней красного Петрограда, но с бюрократическим ядром опытной партии. С советниками из РКП, поддерживающими коммунистическое дело, и с поддержкой более умеренных социалистов по всей стране и за рубежом, Линдерут уверен в успехе. Его коммунисты теперь берут бразды правления революцией в свои руки, обещая дисциплину, идеологическую ясность и твердую руку, которая будет вести новую Швецию, без излишеств Флюга."

SWE_skewer_remainding_sympathizers: "Прикончить оставшихся сочувствующих"
SWE_skewer_remainding_sympathizers_desc: "Флюг был слишком поглощен собой и своими ближайшими последователями, что позволило более мятежным реакционным элементам остаться на свободе в Швеции. Больше этого не будет, мы обрушим на них молот социалистического правосудия, чтобы их влияние не разрасталось и не усугублялось."

SWE_radical_opposition_removed: "Воодушевить участие рабочих"
SWE_radical_opposition_removed_desc: "Одним из преступлений Флюга было то, что, несмотря на свое якобы синдикалистское обращение, он никогда по-настоящему не доверял ни рабочим, ни профсоюзам. Хотя SKP не полностью верит в идею синдикатов и кооперативов, верно то, что партия завоевала бы большую популярность среди недовольных бывших членов SAC, если бы хотя бы рассматривала эту идею. Поддерживая объединение всех оставшихся профсоюзов, бывших флюгистов или нет, в более крупную зонтичную организацию, связанную со SKP в целом, партия станет маяком истинного красного освобождения. Революция не должна ограничиваться залами власти. Партия протянет руку рабочим фабрик, полей и профсоюзных залов, обеспечив не только представительство рабочих, но и их активное участие в формировании промышленного будущего Швеции."

SWE_restructure_the_party: "Наши белые, наши красные"
SWE_restructure_the_party_desc: "Нильс Флюг был коммунистом, был социалистом, но попал в ловушку муссолини-мослиевского безумия. После принудительного отстранения Флюга от должности большая часть членов его партии перешла в SKP, хотя более радикальные элементы его движения перешли к активному вооруженному сопротивлению. После противостояния в бывших офисах Folkets Dagblad Politiken партии стало болезненно ясно, что сторонники Флюга все ещё скрываются в тени и на них должно падать красное сияние революции. На внеочередном заседании SKP члены партии подавляющим большинством голосов вместе с Линдротом проголосовали за абсолютное и решительное уничтожение флюгистов, обструкционистов и реакционных элементов в обществе. С очищенной Красной гвардией наготове SKP спасет нацию и революцию, арестовывая одного за другим."

SWE_pluralism: "Народная плюралистическая политика"
SWE_pluralism_desc: "Единство не означает однородность. Приглашая в свои ряды другие левые фракции и радикальных социалистов, SKP укрепляет фундамент рабочей республики. Продолжая политику интеграции профсоюзов, а также сохраняя открытость партии для здоровых дебатов, но при этом следуя практике демократического централизма, SKP вскоре станет рассматриваться как освободительная сила в шведской политике. Линдеррот убежден, что разнообразие в революционном лагере может служить источником силы, а не раскола. Однако с другой стороны, Уго Силлен в частном порядке предупреждал о том, что не следует слишком открывать партию, полагая, что движение с каждым днем становится все более «розовым»."

SWE_central_authority: "Диалог, а не фракционность"
SWE_central_authority_desc: "Партия трещит по швам, поскольку растущая тенденция к фракционности начала бурлить в её рядах, но не по тем причинам, которые можно было бы предположить на первый взгляд. В то время как бывшие члены SAP и SAC работают в партии, не отклоняясь идеологически от основных ценностей SKP, фракционность возникла внутри самой партии. Линдерот, по-прежнему намеревающийся продолжать путь социалистического плюрализма, столкнулся с сопротивлением внутри самой партии со стороны Уго Силлена, своего заместителя. При поддержке RPK Силлен пытается полностью вытеснить Линдрота из политики, утверждая, что лидер шведской революции фактически предает ее. Несмотря на это, Линдрот все ещё помнит, как посылал помощь в Петроград, все ещё помнит, как сражался на баррикадах, и если Силлен хочет борьбы за душу партии, он её получит."

SWE_discredit_moderates: "Осудить SSV"
SWE_discredit_moderates_desc: "SSV, вытеснившая Линдерота Силлена и других коммунистов из своего движения, наверняка уже сожалеет об этом шаге. Карл Чильбум, находящийся сейчас в Париже, сообщил, что он полностью поддерживает нынешний курс SKP и шведскую революцию, а умеренные политики, поддерживающие его, после захвата власти стали полноправными членами партии. Тем не менее, несмотря на то, что бывший лидер SSV преклонил колено, а Хёглунд мертв, SSV по-прежнему возглавляет разношёрстная группа удивительно ярых соперников SKP. Партия должна осудить оставшийся партийный аппарат, должным образом описать обструкционистский и оппозиционный характер их политики и поставить партию на место, сделав её неактуальной."

SWE_against_red_terror: "Красное освобождение, а не террор"
SWE_against_red_terror_desc: "Учась у Ленина, SKP может двигаться вперед, в частности, изучая, как РКП провалила революцию на востоке. По мнению партии, одной из причин провала русской революции было то, что она поглотила саму себя, нанесла себе вред, слишком увязнув во внутренних партийных интригах и ненужной революционной воинственности. Революция не должна поглощать саму себя. Чрезмерная паранойя и бесконтрольное насилие рискуют настроить народ против своих освободителей. Флюг был обезврежен, реакционных террористов в сельской местности с каждым днем становится все меньше, и поэтому чрезвычайное положение должно быть отменено."

SWE_controlling_the_economy: "Положить конец синдикатам"
SWE_controlling_the_economy_desc: "Еще одним преступлением Нильса Флюга и его синдикалистских союзников была идея, что рабочие одной фабрики чувствовали привязанность к своей фабрике, а не к революции в целом. Нельзя допустить такого раскола общества. Если фабрики и промышленность по всей стране будут соперничать друг с другом за производственные квоты и мнимую уникальность, то революция, несомненно, погрузится в анархию и хаос в течение полувека. Этого нельзя допустить. В соответствии со специальным постановлением партии все фабрики и предприятия по всей стране будут национализированы в одночасье, акции, принадлежащие отдельным рабочим, будут аннулированы, а вместо этого будут введены более высокие зарплаты, чтобы смягчить часть гнева. Пришло время пролетариату понять, что все рабочие владеют всей промышленностью и что в подлинно социалистической системе под руководством SKP акции бесполезны. Это шведская промышленность, а не промышленность какого-то синдиката или профсоюза. Благодаря централизованному планированию и контролю со стороны партии вся экономическая деятельность будет направлена на удовлетворение потребностей народа, обеспечение роста, справедливости и промышленной мощи. Профсоюзы останутся, будут продолжать озвучивать проблемы рабочих, и, поскольку все рабочие владеют всей промышленностью, SKP утверждает, что это полностью демократический и революционный акт."

SWE_prepare_against_imperialism: "Против реакционного мира"
SWE_prepare_against_imperialism_desc: "Как и Ленин, партия выступает против международной реакции. За границей рабочие слышат, как затачивают ножи, заряжают винтовки и готовят оружие к бою. Немцы, возвышенные над облаками благодаря своей всемирно известной arrogancy, хотят убить шведскую революцию в зародыше, уничтожить то, чего Швеция достигла до сих пор, пойти против истории. На чрезвычайном заседании партии было решено, что страна должна быстро перевооружиться в преддверии грядущих бедствий, при необходимости прибегнув к чрезвычайным мерам по полной мобилизации пролетариата. Старые державы не потерпят социалистической Швеции. Оборонительные меры, военная готовность и идеологическая бдительность гарантируют, что наша революция никогда не будет задушена иностранными руками, как они задушили Ленина и его проект."

SWE_worker_plight: "Права, хлеб, жильё"
SWE_worker_plight_desc: "Революция не может отдыхать, она не может бороться без поддержки. Посредством внедрения новых законов, закрепляющих права пролетариата, а также принятия определенных мер, которые принесут пользу рабочим, SKP вознаградит народ за его революционную преданность. С шестичасовым рабочим днем, введением дополнительных праздников и государственных отпусков, регулированием цен, снижающим расходы и одновременно повышающим качество жизни во всех сферах, удивительно, как много можно достичь, если капитализм не будет красть прибыль и труд. Кроме того, несмотря на надвигающиеся бури, партия решила увеличить строительство новых домов в надежде однажды обеспечить жильем каждого мужчину, женщину и ребенка, чтобы навсегда покончить с бездомностью. Этими достижениями партия надеется завоевать души народа."

SWE_into_the_countryside: "Фермеры, крестьяне и коллективизация"
SWE_into_the_countryside_desc: "Сельская местность не может оставаться прибежищем старых привычек и феодального мышления. Коллективизация приведет сельское хозяйство в соответствие с социалистическими принципами, расширит права сельскохозяйственных рабочих и обеспечит справедливое питание нации. Благодаря изъятию земель у крупных владельцев можно создать здоровую динамику в сельском хозяйстве, без эксплуатации Статаре или кого-либо еще. Крупные фермы будут разбиты на части, небольшие фермы будут финансироваться, а фермы, которые слишком нерентабельны для индивидуальных фермеров, будут коллективизированы и финансироваться министерством сельского хозяйства. Учитывая уникальное положение Швеции, фермеры в основном будут предоставлены сами себе, получая поддержку в виде политики механизации и политики, направленной на перемещение избыточного сельского населения в города."

SWE_against_conmen: "Индустриализация без коррупции"
SWE_against_conmen_desc: "Нельзя позволять бюрократам и оппортунистам паразитировать на национальной промышленности. Надзор, аудит и быстрое правосудие искоренят коррупцию и обеспечат направление всех ресурсов на коллективное процветание, по крайней мере, так считает SKP. Благодаря сохранившимся профсоюзам должно быть легче, чем когда-либо, сохранить чистоту революции, опираясь как на аудиты сверху, так и на осведомленность рабочих, что обеспечит быстрое искоренение бюрократической некомпетентности и оппортунистического воровства. Поскольку новые отрасли промышленности создаются и запускаются практически ежедневно, эти меры не просто необходимы, но и абсолютно обязательны для сохранения чистоты революции."

SWE_light_of_communism: "Красный маяк и Ленин"
SWE_light_of_communism_desc: "Там, где другие потерпели неудачу, Швеция поднимется. Когда умер Ленин, а Свердлов и Зиновьев не смогли спасти революцию, многие коммунисты вышли из рядов партии, став синдикалистами под впечатлением от революций в Великобритании и Франции. Однако теперь, благодаря усилиям шведов и международной поддержке в духе истинного социализма, северное сияние окрасилось в красный цвет, зажгшись новым маяком истинного социализма. В ходе специального мероприятия площадь Норра Банторгет была переименована в Ленинторгет, а на месте предполагаемой фрески, посвященной Хьялмару Брантингу, была установлена большая статуя погибшего русского революционера. В речи перед левыми СМИ как зарубежными, так и отечественными, партия заявила о своем намерении следовать по стопам Ленина, сейчас и навсегда."

SWE_socialist_rule_of_law: "Крепкая социалистическая справедливость"
SWE_socialist_rule_of_law_desc: "Справедливость при социализме должна служить народу, а не защищать привилегии. Правовая система должна быть построена на революционных принципах, гарантируя, что законы отражают потребности масс и защищают достижения революции. Пролетариат больше не будет наказан за непонимание или незнание эзотерических законов давно ушедшей либеральной интеллигенции, поскольку все законы будут рационализированы и легко понятны. Законы, считающиеся ненужными для страны, будут отменены, а законы, которые когда-то были явно не записаны, будут созданы. Люди больше не будут арестовываться только за то, что пьют в общественных местах, и больше нельзя будет оказаться в вытрезвительнице, даже не будучи пьяным. Кроме того, наконец-то будет незаконно пытаться сбежать из тюрьмы."

SWE_lenin_nordic_rule: "Северный бастион ленинизма"
SWE_lenin_nordic_rule_desc: "Благодаря ясности целей и дисциплине в руководстве Швеция стала северной крепостью марксистско-ленинской мысли. Республика является стражем революции на Севере, готовым продолжать борьбу. С наследием Ленина, Маркса, Энгельса и - к небольшому неудовольствию SKP - Брантинга за спиной, партия и народ идут в прекрасное будущее, вооруженные и образованные, прилежные и благоразумные."

SWE_international_question: "Международный вопрос"
SWE_international_question_desc: "Должна ли революция оставаться в пределах Швеции или ей следует смотреть дальше, в сторону глобальной солидарности? Пришло время обсудить международную роль и будущее социализма за рубежом."

SWE_workers_at_the_ready: "Милитаризация труда"
SWE_workers_at_the_ready_desc: "Защита и распространение социализма требуют жертв. Рабочие должны быть готовы не только трудиться и работать на благо революции, но и защищать её достижения на фабрике, на улице или, при необходимости, на поле боя. На специальном заседании партии было решено, что в случае войны рабочий должен быть классифицирован как потенциальный боец на службе у нации и не может покидать свою работу или задачу без специального разрешения."

##Lindholm##
SWE_national_revolution: "Народная революция"
SWE_national_revolution_desc: "Самым большим преступлением социализма является то, что он уделяет большое внимание интернационализму, поддержке иностранных дел, разрушению естественного и национального целостности в погоне за равенством, по крайней мере, по мнению Свена Олова Линдхольма, лидера партии SSS. Долгое время скрываясь на периферии шведской политики, Линдхольм и его крипто-тоталитарные последователи намерены перестроить страну, кирпич за кирпичом и пуля за пулей. Заявляя, что он продвигает социализм, более ориентированный на шведов, в отличие от международного социализма своих оппонентов, Линдхольм называет себя народным социалистом."

SWE_organize_paramilitaries: "Создать новую Красную гвардию"
SWE_organize_paramilitaries_desc: "Милиции, созданные правительством для защиты революции, были, мягко говоря, глубоко некомпетентны. Часто возглавляемые некомпетентными, но харизматичными профсоюзными деятелями или анархистами, избранными политически ориентированными льстецами, эти предполагаемые красногвардейцы едва не привели к провалу революции и были склонны к случайным актам террора. Но это в прошлом. Линдхольм, сам бывший солдатом армии до революции, использовал свои связи и опыт командования небольшими подразделениями, чтобы сформировать ядро того, что наконец-то можно по-настоящему назвать Красной гвардией. Называя себя Rödgardister и обладая полным пониманием как политических, так и соответствующих военных вопросов, эти новые солдаты революции будут искоренять реакцию под руководством компетентных офицеров, часто имеющих военное прошлое."

SWE_party_land: "Вернуться на землю"
SWE_party_land_desc: "Одной из величайших страстей Линдхольма является природа и судьба человечества, которое может использовать её в своих интересах. В новом указе Линдхольм и его партия сделали allemansrätten настоящим правом всех шведов, но не правом для подрывных элементов. Кроме того, крупные поместья должны быть разбиты на части и переданы фермерам, как новым, так и опытным, а самые крупные поместья должны быть превращены в учебные центры для нового поколения фермеров, жаждущих вернуться к земле после капиталистической жизни в городах. Кроме того, в рамках этого великого плана по возвращению Швеции к сельскому великолепию, преступления против природы, такие как жестокое обращение с животными, нанесение вреда растительному миру и иное осквернение самой красивой страны на земле, будут соответствующим образом наказываться. Капиталисты больше не смогут сбрасывать яд в прекрасные озера по всей стране, если только они не хотят получить пулю в спину от Красной гвардии."

SWE_vast_industrialisation: "Промышленность как судьба"
SWE_vast_industrialisation_desc: "Нильс Флюг, которого члены SSS называли «den förbannade idioten» (проклятый идиот), тем не менее имел несколько хороших идей в своей извращенной марксистской голове. Промышленность, как в духовно-интеллектуальном, так и в материальном смысле, всегда была фундаментальным аспектом шведского характера, и как таковая должна быть выдвинута на первый план. Однако, в отличие от интернационалистов-социалистов, настаивающих на нанесении вреда миру, Линдхольм знает, что чрезмерная промышленность - это плохо, что городское общество само по себе оказывает развращающее влияние на душу, и поэтому хочет распространить промышленность по всей сельской местности, а не позволять серым залам промышленности разрастаться как чума в городах."

SWE_dissolve_socialst_democracy: "Конец изнеженной демократии"
SWE_dissolve_socialst_democracy_desc: "Демократия - это дегенерация. Впервые примененная на Западе женоподобными греческими ростовщиками, она является по сути своей антиевропейской концепцией, поскольку не практиковалась воинственными племенами Германии. Демократия, право каждого деревенщины вмешиваться в дела государства, всегда была глупой сделкой и просто не может оставаться концепцией в шведском сознании. Вдохновленные старыми традициями, Линдхольм и SSS решили ещё больше вовлечь шведский народ в борьбу за новую страну, без иллюзий массового участия. В залах по всей стране, в сараях, на складах и в роскошных офисах будут представлены люди из местных районов, которые смогут поговорить с лидерами партии и обсудить вопросы, имеющие отношение к их местности. По мнению SSS, это гораздо лучше, чем подчиняться произвольному демократическому мандату, при котором даже самые низшие слои общества имеют такое же право голоса, как и люди высокого расового происхождения и высокой грамотности. Пролетарское воинственное общество не нуждается в системе, которая когда-то практиковалась средиземноморскими священниками и купцами."

SWE_courting_remaining_reaction: "Арийское единство"
SWE_courting_remaining_reaction_desc: "Свен Олов Линдхольм создал SSS после того, как Эрик фон Розен не смог создать единое радикальное националистическое движение. Впервые вступив в контакт с фон Розеном и Фуругардом через ныне несуществующую Svenska Antisemitiska Föreningen, фон Розен несколько раз пытался создать единый фронт, но эти попытки регулярно заканчивались неудачей, поскольку шведские правые были слишком раздроблены по вопросам различной степени важности. Однако теперь, когда Швеция находится в руках Линдхольма и его группы красномаренных националистов, Линдхольм протягивает руку своим бывшим друзьям и союзникам, предлагая альянс для спасения нации. Хотя сам он не столь нелепо яростно антисемит, как Фуругард, и не столь увлечен мистическим прошлым, как фон Розен, ему все же необходимо привлечь на свою сторону людей, будь то офицеры, такие как Арчибальд Дуглас и Мартин Экстрём, или панарийские философы, такие как Пер Энгдал."

SWE_militaristic_buildup: "Истинная шведская мораль"
SWE_militaristic_buildup_desc: "Армия нуждается в людях так же, как люди нуждаются в воде, и благодаря новой революционной политике SSS армия получит все, что хочет, и даже больше. Срок призыва продлен на несколько месяцев, а те, кто отказывается от службы, будут направлены на обязательные работы в промышленности до окончания срока призыва. Швеция и Скандинавия в целом издавна твердо верят в службу и служение обществу, и хотя ССБ не стремится вернуться к мрачной традиции ättestupa, другие добродетельные принципы из прошлого следует поощрять. Тот, кто может работать, будет работать, тот, кто может служить, будет служить, тот, кто может учить, будет учить, и пока эта линия мышления будет распространяться на протяжении следующих столетий, Швеция будет счастливо следовать своему древнему прошлому. Так же как от свободных крестьян в старину ожидалось, что они будут предоставлять оружие своему королю в кризисные времена, так и освобожденный пролетариат сегодня будет делать то же самое."

SWE_devotion_to_leader: "Принимая Викингабалк"
SWE_devotion_to_leader_desc: "Древние отряды и щитовые стены действовали на основе одного простого принципа: если один человек дрогнул, он подвергал риску остальных членов своего отряда и был исключен из него. Эти принципы провозглашены в «Саге о Фиртиофе» и подробно описаны в «Викингбалке». Если один щит не поднимался во время битвы, если один человек спотыкался при выходе из длинной лодки, если кто-либо сдался под давлением в Лютцене или Нарве, он подвергался суровому наказанию, поскольку подверг риску всех своих товарищей. Точно так же в трудные времена шведский, скандинавский и германский характер заключается в том, чтобы сплотиться вокруг лидера, если только этот лидер является твердым и сильным человеком. Все это является новой принципиальной позицией SSS и тем, что должно быть укоренилось в шведском характере, чтобы быть таким же истинным и реальным, как и сам флаг. Объединяясь вокруг Линдхольма, Швеция объединяется вокруг исторической фигуры в период кризиса, как это уже неоднократно происходило на протяжении истории."

SWE_socialist_imperialism: "Национальная хартия Линдхольма"
SWE_socialist_imperialism_desc: "Линдхольм, недавно получивший юридический титул Riksledare, наконец опубликовал новую национальную хартию, в которой изложены намерения правительства, законы, которые будут соблюдаться, и принципы, на которых будет построено новое государство. Заявляя о прямой преемственности со времен распада Кальмарской унии, Линдхольм прилагает все усилия, чтобы узаконить государство, несмотря на то, что большая часть мира считает его изгоем. С закрепленной в законе системой социального обеспечения, гарантированной защитой окружающей среды и добавлением некоторых специфических партийных политик, новая хартия является весьма особенным документом. С момента рождения хартия провозглашает, что шведские мужчины и женщины будут иметь равные права на жизнь и процветание, смогут работать в промышленности и будут в равной степени представлены в системе управления. Кроме того, новый устав уточняет, что получение пенсии является правом, что пособие по безработице является правом и что хорошая моральная и расовая гигиена будет обеспечиваться повсеместно. Критики из-за рубежа отмечают, что в уставе ни разу не упоминается «социализм», за исключением упоминания о том, что единственным легитимным органом управления является сама SSS."

SWE_statare_reborn: "Перековывать Статаре"
SWE_statare_reborn_desc: "Отличным примером капитализма и его излишеств является отношение к статаре. Бродяги и крестьяне, батраки и рабочие, вынужденные мигрировать с фермы на ферму, живя в бараках и ночуя в канавах вдоль дорог, статаре считаются трагическими фигурами. Одним махом Линдхольм и SSS ввели оплату наличными, а не товарами, и путем обширных конфискаций земель могут распределять как землю, так и жилье среди бездомных. Молодым людям, которые когда-то работали на фермах, выполняя почти рабский труд за кусок хлеба, Линдхольм также предлагает возможность служить в армии, стимулируя их быстрый путь к более достойному обществу."

SWE_peripheral_organs_party: "Око революции"
SWE_peripheral_organs_party_desc: "Хугин и Мунин давали советы и шпионили от имени Одина, всезнающего бога. Сегодня сам Линдхольм благословлен тем, что несколько агентов и агентств работают от его имени, пытаясь очистить революцию, а также страну от подрывных элементов. Согласно новой политике правительства, сообщение о неправомерном поведении будет вознаграждаться, разоблачение коррупции будет считаться достойным признания, а помощь в раскрытии тайных заговоров иностранных граждан должна считаться достойной медали. Была введена новая медаль под названием Silvernålen, «серебряная игла», - значок из серебра и синей эмали, который вручается тем, кто служит стране, искореняя угрозы для нее, и началась кампания по внедрению его в общественную жизнь."

SWE_religious_question: "Синод должен подчиниться"
SWE_religious_question_desc: "Svenska Kyrkan, долгое время бывшая орудием монархии и консерватизма, по-прежнему представляет угрозу для революционного единства. её нынешний архиепископ Эрлинг Эйдем абсолютно ненавидит расистскую политику правительства, и в частности антисемитские настроения Линдхольма, не так давно обвинившего Линдхольма в том, что он дьявол. В связи с этим Эрлинг был помещен под домашний арест, а Линдхольм вынужден решать, что делать дальше с непокорным священником и церковью в целом. Хотя Швеция быстро секуляризируется, сельская база власти, которую Линдхольм пытается привлечь на свою сторону, очень лояльна церкви, и поэтому он не может в ближайшее время её упразднить или уничтожить. её власть необходимо сломить или подчинить. Вера может остаться, но она должна служить государству, а не противостоять ему."

SWE_to_embolden_a_man: "Этт Рётт Свэа Рике"
SWE_to_embolden_a_man_desc: "Швеция была благословлена компетентными королями, но немалое количество из них были абсолютными ничтожествами. Истинная эгалитарная нация не может иметь монархию, она должна руководствоваться истинными германскими меритократическими традициями, и поэтому нация должна быть готова существовать без монарха в будущем. Несмотря на то, что некоторые, даже в его собственной партии, тщетно надеялись, что Линдхольм вернет монархию, сам Линдхольм в лучшем случае амбивалентен, а в худшем - враждебен по отношению к таким предложениям. До того, как в Швеции появился монарх, у нее были вожди и ярлы, и партия усердно работает над тем, чтобы связать должность Riksledare с древними традициями. Действительно, этимология этой должности и само название Sverige прямо упоминают королевство. Королевство будет жить, просто без монарха на троне, что является вполне приемлемым компромиссом."

SWE_command_the_landstormen: "Обуздать Ландшторм"
SWE_command_the_landstormen_desc: "Ландшторм был создан в 1880-х годах как ополчение от имени правительства, организация, в которую в кризисные времена вступали пожилые мужчины, чтобы служить нации в войне, не входя в состав собственно армии. Хотя Ландстормен был по сути реакционным, дух защиты нации или племени от подавляющего превосходства противника является по сути германским, по крайней мере, по мнению SSS. Хотя Ландстормен был распущен во время революции, Линдхольм хочет вернуть его, чтобы создать подлинно национальное движение для всех, а не только Красную гвардию."

SWE_true_nordic_socialism: "Путь северного социализма"
SWE_true_nordic_socialism_desc: "Судьба германского мира заключается в единстве, даже заблуждающийся дурак Нильс Флюг знал это. Не довольствуясь простым правлением Швецией, Линдхольм в последнее время увлечен трудами Пера Энгдаля, в которых тот говорит о необходимости европейского единства, при необходимости достигнутого силой. В рядах партии нарастает общеевропейское подсознательное чувство, что если революция Линдхольма увенчается успехом в его стране, то её можно и нужно экспортировать в остальную Европу, что, несомненно, повлияло на мышление Рикследарена."





##Nordic Fed Tree###
SWE_DEM_treaty_of_stockholm: "Ратифицировать Стокгольмский договор"
SWE_DEM_treaty_of_stockholm_desc: "Для вступления в силу Стокгольмский договор должен быть одобрен парламентом. Его ратификация позволит нам официально начать сотрудничество с нашими скандинавскими друзьями.\n§YСтокгольмский договор вступит в силу, если в июне 1937 года Дания, Норвегия и Швеция будут демократическими странами.§!"
SWE_DEM_nordic_council: "Учредить Северный совет"
SWE_DEM_nordic_council_desc: "Политические аспекты интеграции стран Северной Европы должны быть организованы в рамках отдельного политического института. Давайте создадим для этой цели Совет Северных стран."
SWE_DEM_defense_union: "Скандинавский оборонный союз"
SWE_DEM_defense_union_desc: "Ни одна из стран Скандинавии не обладает особой военной мощью. Только посредством договора о коллективной обороне мы сможем создать реальную угрозу для потенциальных агрессоров."
SWE_DEM_material_cooperation: "Единые военные закупки"
SWE_DEM_material_cooperation_desc: "Наши вооруженные силы относительно невелики. Если мы будем координировать все закупки военной техники в странах Северной Европы, мы сможем воспользоваться преимуществами крупных заказов и снизить затраты."
SWE_DEM_military_volunteers: "Программа военного обмена"
SWE_DEM_military_volunteers_desc: "Усиление сотрудничества между армиями стран Северной Европы требует офицеров с особым мышлением и определенными навыками. Давайте обменяемся генералами, чтобы ещё больше способствовать этому."
SWE_DEM_passport_union: "Северная паспортная конвенция"
SWE_DEM_passport_union_desc: "Почему граждане стран Северной Европы должны получать визы и разрешения, чтобы посещать друг друга? Мы подпишем конвенцию об отмене внутренних границ в Скандинавии."
SWE_DEM_joint_sessions: "Совместные заседания парламентов"
SWE_DEM_joint_sessions_desc: "До сих пор интеграцию стран Северной Европы поддерживали национальные правительства. Чтобы изменить это, мы предложим проводить совместные межпарламентские сессии, чтобы все могли высказать свое мнение."
SWE_DEM_investments: "Северные инвестиции"
SWE_DEM_investments_desc: "Скандинавия - это наша естественная арена для инвестиций. Возможно, было бы неплохо инвестировать в норвежские и датские проекты."
SWE_DEM_monetary_union: "Скандинавский валютный союз"
SWE_DEM_monetary_union_desc: "С 1873 по 1914 год Скандинавия имела единую валюту. Мы должны восстановить Скандинавский валютный союз и обеспечить свободный оборот всех валют в Скандинавии."
SWE_DEM_found_sas: "Основать Скандинавские авиалинии"
SWE_DEM_found_sas_desc: "Почему скандинавские страны должны иметь свои собственные авиакомпании? Давайте сделаем авиаперелеты символом скандинавского сотрудничества и создадим Скандинавские авиалинии."
SWE_DEM_custom_union: "Выдвинуть идею единого рынка"
SWE_DEM_custom_union_desc: "Естественным продолжением экономического сотрудничества является отмена таможенных пошлин между странами Северной Европы. Пусть больше не будет ограничений на торговлю в Скандинавии."
SWE_DEM_common_tech: "Конференция скандинавских учёных"
SWE_DEM_common_tech_desc: "Скандинавские ученые собираются на нерегулярные встречи с 1839 года. Мы должны формализовать эти встречи, чтобы более эффективно обмениваться нашими техническими разработками."
SWE_DEM_common_tech_2: "Технологическое сотрудничество"
SWE_DEM_common_tech_2_desc: "Успех Скандинавской конференции ученых означает, что мы можем ещё больше углубить наше сотрудничество. Если мы создадим постоянную систему обмена знаниями, в долгосрочной перспективе это принесет пользу всем нам."
SWE_DEM_form_federation: "Северная Федерация"
SWE_DEM_form_federation_desc: "Интеграция и сотрудничество стран Северной Европы оказались поразительно успешными. Давайте теперь объединим наши силы и создадим Северную Федерацию как яркий маяк демократии и свободы в неспокойном мире."

SWE_martial_law_declared: "1-я декларация о чрезвычайном положении"
SWE_martial_law_declared_desc: "После успешного переворота, совершенного шведскими военными, Хельге Юнг, нынешний глава государства, ввел военное положение. Он ввел строгий комендантский час в городах и призвал всех протестующих сложить оружие и мирно сдаться военным и полиции."
SWE_crackdown_demonstrations: "Избавиться от красных"
SWE_crackdown_demonstrations_desc: "В то время как шведские вооруженные силы в сотрудничестве с полицией неустанно работают над подавлением протестов и забастовок по всей стране, в настоящее время не хватает людских ресурсов, чтобы подчинить себе все районы. К счастью, радикальные националистические военизированные формирования предложили свою помощь в подавлении протестов. Хотя такие группы являются беспорядочными и небольшими, они продемонстрировали быстрый успех в борьбе с оставшимися социалистами и синдикалистами в Швеции, и использование этих головорезов будет большим подспорьем в укреплении нашего контроля над Швецией."
SWE_bring_loyal_businesses: "Объединить консервативных бизнесменов"
SWE_bring_loyal_businesses_desc: "Большая часть традиционной базы поддержки состоит из богатых землевладельцев и успешных бизнесменов, таких людей необходимо привлечь на нашу сторону в поддержку нашего режима. Мы должны показать им провалы предыдущих консерваторов в AV в стабилизации Швеции и спасении её от синдикалистской угрозы, что только мы можем по-настоящему защитить Швецию."
SWE_expand_into_cities: "Штурм их последних бастионов"
SWE_expand_into_cities_desc: "Немногие шведские фабрики продолжают работать, а многие их рабочие вышли на улицы, протестуя против нашего переворота в правительстве SSV. Таким образом, с помощью вооруженных солдат мы заставим этих недовольных рабочих вернуться на свои рабочие места и восстановим нормальную жизнь."
SWE_place_of_the_crown: "Венценосный парадокс"
SWE_place_of_the_crown_desc: "Теперь, когда с большинством синдикалистов, социалистов и преступников разобрались, на стол Юнга попал самый важный вопрос для режима. Восстановить монархию или сохранить прямое военное правление? Если монархия будет восстановлена, она не будет такой, как раньше, поскольку военные по-прежнему будут осуществлять прямой контроль, а также выбирать кандидатов. Хотя большая часть нашей поддержки исходит от традиционных правых, которые хотят видеть восстановление короны, некоторые военные желают сохранить свой контроль, считая его более эффективным. Наряду с этим они также заявили, что монархия отчасти виновата в почти полном контроле синдикалистов над Швецией. Как бы то ни было, Юнг и его люди должны теперь сделать выбор, который определит будущее Швеции."
SWE_archibald_take_command: "Националистический марш Дугласа"
SWE_archibald_take_command_desc: "Арчибальд Дуглас и его слабо организованные радикальные националисты и правые агитаторы выиграли межвоенные выборы. Сосредоточившись на милитаризации Швеции как в духе, так и в теле, они уделяют большое внимание тому, чтобы поставить Швецию превыше всего. Группа, состоящая из многих разных идеалов, окружает Дугласа как нынешнюю объединяющую фигуру."
SWE_corporatism_in_north: "Сбывшаяся корпоративистская мечта"
SWE_corporatism_in_north_desc: "Прежняя AV правильно сосредоточилась на экономической политике корпоративизма, однако после поражения на выборах так и не смогла её реализовать. Под нашим правлением мы установим истинный шведский корпоративизм под жёсткой рукой самых лояльных Швеции."
SWE_legitimize_paramilitaries: "Легитимизация парамилитарных формирований"
SWE_legitimize_paramilitaries_desc: "Паравоенные формирования, впервые мобилизованные после введения Юнгом военного положения, оказали нам неоценимую помощь в самый мрачный час Швеции. Проявив себя как одни из самых патриотичных среди нас, они являются примером для подражания для остальной части нации. Привлекая их к участию в правительстве и поддерживая их по всей стране, мы можем не только усилить наш контроль, но и способствовать формированию преданного и националистически настроенного населения!"
SWE_cement_ideology: "Шведский диктат национализма"
SWE_cement_ideology_desc: "Теперь уже многочисленное сообщество правых должно объединиться для формирования единой идеологической основы Швеции. Отбросив мелкие споры ради блага нации, эти группы теперь объединяются, чтобы укрепить национальную безопасность и процветание."
SWE_cut_foreign_vestiges: "Уборка остатков"
SWE_cut_foreign_vestiges_desc: "Несмотря на то, что средний швед становится все более патриотичным по отношению к своей стране, среди нас все ещё есть те, кто, финансируемый Парижем и Лондоном, надеется вновь попытаться уничтожить все хорошее, что мы сделали для Швеции, и установить в Швеции безбожную синдикалистскую конструкцию. Этого не должно произойти! Необходимо возобновить борьбу с синдикализмом, а также предоставить льготы и вознаграждения гражданам, которые правильно идентифицируют диссидентов и предателей."
SWE_patriotic_business_only: "Патриотизм и рабочие"
SWE_patriotic_business_only_desc: "Не секрет, что многие из тех, кто выступает против нашего правительства, являются простыми рабочими. Чтобы исправить эту ситуацию, будут проводиться новые пропагандистские кампании, в которых будут показаны скромные заводские рабочие, их трудолюбие и патриотизм по отношению к Швеции. Им будет показано, что они, наряду с теми, кто сражается на фронте, имеют жизненно важное значение для нации и что благодаря своей лояльности и трудолюбию могут помочь сохранить достоинство Швеции."
SWE_ties_to_international_nationalists: "Единомышленники"
SWE_ties_to_international_nationalists_desc: "Известно, что в других странах есть люди, которые смотрят на мир так же, как и мы. Что мир достигается ценой жертв, что преданность и лояльность как флагу, так и имени необходимы для выживания группы. Члены Румынской железной гвардии, первоначальные создатели легионерства, являются наиболее заметными представителями этих групп. Есть и менее известные организации, такие как легион Эволы на Сицилии, Дарнанд из Национального французского государства и многие другие. Мы организуем встречи с ними не для создания прямого альянса как такового, а для заключения торговых соглашений и открытого диалога с такими блестящими умами."
SWE_state_land_without_social: "Государственная земля без социализма"
SWE_state_land_without_social_desc: "Новая политика правительства по национализации земельных участков по всей Швеции позволит усилить власть правительства над строительством заводов и инфраструктуры. Когда придет время, строительство бункеров и оборонительных сооружений для Швеции также будет проходить легче, без бюрократических проволочек. Это вызывает некоторые споры, поскольку умеренные правые называют такой шаг «социалистическим», однако он необходим для защиты Швеции и её жизнедеятельности."
SWE_grand_military_awakening: "Армия, как символ преданности"
SWE_grand_military_awakening_desc: "Солдат будет создан по образу идеального шведского мужчины, который в своем сердце хранит любовь к родине и готов пожертвовать всем ради её свободы."
SWE_dictate_of_one: "Рикследаре"
SWE_dictate_of_one_desc: "Рикследаре будут предоставлены дополнительные полномочия для стабилизации страны. Хотя наши противники называют это диктатурой старых абсолютных монархий, мы считаем это необходимым для защиты Швеции."
SWE_council_of_command: "Националистическая власть внутри короны"
SWE_council_of_command_desc: "Будет организован великий совет из лучших националистических умов страны, чтобы наилучшим образом руководить нацией. Во главе со своим нынешним лидером они будут формировать Швецию так, чтобы она служила короне."
SWE_svea_rike: "Svea Rike!"
SWE_svea_rike_desc: "Svea Rike! Призыв к независимости нашей нации и нашим германским корням, ибо шведы вновь поднялись над европейскими державами, чтобы занять свой трон над ними."

SWE_create_secret_police: "Глаза в кромешной тьме"
SWE_create_secret_police_desc: "Хотя большинство наиболее ярых социалистов были арестованы и заставлены замолчать, многие по-прежнему держатся за свои иллюзии о грядущей революции. Поэтому было создано специальное подразделение вооруженных сил, задачей которого является поиск оставшихся социалистов, скрывающихся в нашей стране."
SWE_unending_martial_law: "Перманентное военное положение"
SWE_unending_martial_law_desc: "Ситуация в стране по-прежнему слишком нестабильна, чтобы отменить военное положение, поэтому, к сожалению, в обозримом будущем в городах будут сохранены комендантский час и военные патрули."
SWE_junga_junta: "Формирование Jungjunta"
SWE_junga_junta_desc: "Было решено, что Хельге Юнг продолжит руководить Швецией, сосредоточившись на оборонном перевооружении и строгом военном правлении."
SWE_away_with_paramilitary_thugs: "Разоружить военизированные формирования"
SWE_away_with_paramilitary_thugs_desc: "Паравоенные формирования крайне правых хорошо послужили делу уничтожения социалистических ячеек по всей стране, но это быстро привело к их чрезмерной самоуверенности. Эта разношёрстная толпа, которая вступает в конфликты с официальными солдатами, будет распущена."
SWE_marching_through_streets: "Зачистить улицы"
SWE_marching_through_streets_desc: "Мы должны продемонстрировать свою силу, даже несмотря на то, что большинство бывших революционеров потерпели поражение, массовые демонстрации военной и полицейской мощи гарантируют, что те, кто все ещё питает старые симпатии, будут держать язык за зубами."
SWE_destroying_decadent_democracy: "Конец шведской демократии"
SWE_destroying_decadent_democracy_desc: "Демократия, в последнее время было доказано, что демократия как система провалилась. Пропагандируемая как оплот свободы и мира, она, как остается очевидным, обеспечивает империалистические нации и не дает настоящей свободы, и наш народ скоро это поймет."
SWE_rearmament_plan: "План перевооружения"
SWE_rearmament_plan_desc: "Юнг всегда выступал за более активное перевооружение Швеции, и теперь, когда мы у власти, мы можем удвоить усилия в этом направлении."
SWE_reward_loyal_companies: "Вознаграждение лояльным компаниям"
SWE_reward_loyal_companies_desc: "Компании, которые продемонстрировали свою лояльность нашим силам и правительству, будут вознаграждены в надежде, что к ним присоединятся и другие."
SWE_industry_for_army: "Экономика в интересах военных"
SWE_industry_for_army_desc: "Экономика должна быть сосредоточена исключительно на потребностях военных, отстраняя гражданский сектор. Как только закончится чрезвычайное положение в стране, это может измениться, но на данный момент потребности армии являются абсолютным приоритетом."
SWE_mixed_economic_policy: "Смешанная экономика вмешательства"
SWE_mixed_economic_policy_desc: "Необходимо экономическое вмешательство со стороны правительства, поэтому военным будет позволено действовать по своему усмотрению, беря все необходимое для блага Швеции."
SWE_tiger_claw_sharp: "Бастион северной мощи"
SWE_tiger_claw_sharp_desc: "Швеция претерпела полную трансформацию: из слабой демократической страны она превратилась в сильную державу. С более крупной и сильной армией, чем раньше, немногие осмеливаются переступать наши границы, чтобы не столкнуться с мощью всей нации, готовой отдать все."
SWE_finalize_the_junta: "Лучшие из лучших Швеции"
SWE_finalize_the_junta_desc: "Под руководством Юнга Швеция теперь может по праву сказать, что ею управляют самые смелые. Мы готовимся к новой кампании по призыву на военную службу и приобретению ресурсов, потому что не успокоимся, пока Швеция не станет по-настоящему безопасной!"
SWE_Axels_nat_junta: "«Национализация» хунты"
SWE_Axels_nat_junta_desc: "До сих пор хунта оставалась относительно апатичной по отношению к горячим националистическим настроениям в стране. Обратившись к крайне правым лигам, таким как лига нашего союзника Арчибальда Дугласа, Глинкрок может надеяться сформировать по-настоящему национальную хунту!"


SWE_wastes_to_soldiers: "Отрада для солдат"
SWE_wastes_to_soldiers_desc: "Еще остается много людей, пострадавших от Черного понедельника, безработных бродяг, бесцельно бродящих по улицам города. Больше такого не будет, таким людям будет предоставлена возможность вступить в армию, где их будут кормить, одевать и обеспечивать жильем, а в обмен они будут служить Швеции в течение нескольких лет."
SWE_army_symbol_of_sweden: "Символ шведской гордости"
SWE_army_symbol_of_sweden_desc: "До сих пор, в 20 веке, наша страна была известна как нейтральная и пацифистская конституционная монархия, спокойная нация в Скандинавии, которая живет в безопасности и благополучии. Такие идеалы не могут продолжаться, поскольку теперь армия правит нацией, швед должен стать ярым воином, солдатом, преданным нации. Готовые отдать свою жизнь за Швецию, мы должны перековать шведскую идентичность."

SWE_authdem_stabilize_nation: "Состояние милосердия Эренсворда"
SWE_authdem_stabilize_nation_desc: "Армия - это не просто аппарат для угнетения народа и ведения войн, мы должны показать народу Швеции, что мы здесь, чтобы помочь ему заново построить Швецию."
SWE_iron_olive_branch: "Железная оливковая ветвь"
SWE_iron_olive_branch_desc: "Под руководством Эренсверда тем, кто разочарован и обезумел от революционеров, будет предложена оливковая ветвь, дающая им шанс на искупление во благо нации. Однако не заблуждайтесь, если они откажутся, их продолжающиеся беспорядки не будут приняты."
SWE_necessary_economic_intervention: "Необходимое экономическое вмешательство"
SWE_necessary_economic_intervention_desc: "Свободный рынок приводит только к хаосу, а Швеции сейчас не нужен ещё больший хаос. При Эренсварде экономическое вмешательство станет нормой, положив конец эксплуатации скромных шведов враждебными монополиями."
SWE_bring_the_right_back: "Примирить правых"
SWE_bring_the_right_back_desc: "Многие представители демократических правых сил по-прежнему с опаской относятся к нашему нынешнему правительству, мы должны обратиться к бывшим консерваторам, таким как Багге и Линдман, в надежде привлечь их на нашу сторону."
SWE_expand_armed_forces: "Отдать приоритет армии"
SWE_expand_armed_forces_desc: "Хотя гражданскому правительству Швеции могут быть предоставлены некоторые уступки, армия всегда должна оставаться на первом месте. И так будет и впредь."
SWE_overtures_to_entente: "Письмо в Оттаву"
SWE_overtures_to_entente_desc: "Эренсверд всегда высоко ценил Антанту, считая её оплотом свободы во время Первой мировой войны, однако после того, как она изгнала его, он почти полностью утратил веру в нее. Теперь, стоя у руля страны, он надеется восстановить отношения с ней."
SWE_we_the_strong: "Сила нации"
SWE_we_the_strong_desc: "Сила нации зависит от силы её жителей, поэтому мы должны преобразовать пассивный шведский менталитет в менталитет силы и мужества!"
SWE_workers_and_soldiers_in_love: "Солдаты и рабочие рука об руку"
SWE_workers_and_soldiers_in_love_desc: "Чтобы построить по-настоящему стабильную Швецию, солдаты и рабочие должны объединиться, а не противостоять друг другу. Хотя отношения с социалистическими рабочими по-прежнему остаются напряженными, поощряя помощь армии фабрикам и рабочим местам, мы можем надеяться на установление товарищеских отношений между гражданскими лицами и солдатами."
SWE_patriotic_unions_allowed: "Разрешить патриотические профсоюзы"
SWE_patriotic_unions_allowed_desc: "Профсоюзы являются гнездом болезней социализма и синдикализма, однако они по-прежнему обеспечивают необходимый голос рабочим, поэтому правительством одобренные профсоюзы будут восстановлены."
SWE_iron_sharpen_iron: "Железо закаляет железо"
SWE_iron_sharpen_iron_desc: "Швеция по-прежнему остается нестабильной из-за последствий революции, поэтому Эренсверд усилил военное правление до тех пор, пока Швеция не станет по-настоящему безопасной."
SWE_return_to_norm: "Возвращение к нормальной жизни"
SWE_return_to_norm_desc: "Стабильность постепенно возвращается в Швецию, и хотя процесс полностью открытых выборов пока маловероятен, военные предоставили бывшей Избирательной лиге Йёста Багге контроль над правительством Швеции. Хотя армия по-прежнему несет на себе много ответственности и осуществляет явный контроль, сейчас начался медленный переход к гражданскому правлению."
SWE_sweden_guided_by_most_loyal: "Родина самых верных подданных"
SWE_sweden_guided_by_most_loyal_desc: "Швеция теперь возглавляется её самыми верными людьми, противостоящими соблазну радикального национализма, безжалостного авторитаризма и анархических революционеров. Пока эти люди ведут Швецию вперед, нация наконец-то может вздохнуть свежим воздухом."


###Elmo tree###

SWE_sesame_street: "Восход национальной Федерации"
SWE_sesame_street_desc: "В результате почти невозможного стечения обстоятельств радикалы Национальной федерации Элмо Линдхольма вышли вперед и теперь держат бразды правления страной в своих руках. Решительный, стойкий и готовый воплотить в жизнь свое видение Швеции, Линдхольм теперь надеется превратить Швецию из декадентской, безбожной нации в сияющий маяк христианства и монархической преданности."

SWE_regions_affirm: "Песнь о демократии"
SWE_regions_affirm_desc: "Демократия мертва, демократия привела к хаосу социалистических анархистов и ярых консерваторов, что привело к падению даже нашего самого священного символа - монархии. Теперь, когда корона восстановлена, мы не можем и не должны возвращаться к демократии, чтобы не дать её фарсу свободы снова разрушить нас."

SWE_new_royal_guard: "Рыцари нового порядка"
SWE_new_royal_guard_desc: "Использование военизированных бандитов из различных правых групп, от Легиона Фуругарда до ветеранов Экстрёма, доказало свою эффективность как в поиске, так и в уничтожении наших врагов. Однако эти люди недостаточно дисциплинированы, иногда находят бывших врагов и сводят счеты, не обращая внимания на закон и порядок. Поэтому под руководством доверенного союзника Линдхольма Альфа Мейерхоффера эти разбойники станут новой рыцарской и благочестивой боевой группой, преданной и обученной служить в первую очередь короне."

SWE_protest_catholic_issue: "Вознесение Бога над классами"
SWE_protest_catholic_issue_desc: "Одно можно гарантировать: все в Швеции трудятся под властью Господа, нашего Создателя! Мелкие классовые борьбы и беспорядки не будут иметь места, поскольку Бог выше всех нас, поэтому мы начнем принуждать всех, кто желает участвовать в правительстве, к присяге на верность Господу, нашему Богу, или же они будут отстранены."

SWE_royal_youth: "Укрощение безграничной энергии молодежи"
SWE_royal_youth_desc: "Многие молодые люди были развращены соблазнами синдикализма и социализма, поэтому Svenska Scoutunionen будет переделана. Молодежь будут учить реальностям зла, безбожным идеологиям и важности физической подготовки, иерархии и лояльности монарху."

SWE_swedish_revanchism: "Шведский реваншизм"
SWE_swedish_revanchism_desc: "Швеция когда-то была империей, простиравшейся от границ Петрограда до Прибалтики и Северной Германии. Поэтому мы должны вернуть то, что по праву принадлежит нам, давайте восстановим наше величие!"
SWE_fluent_in_maurass: "Аристократия доктринальной сплочённости"
SWE_fluent_in_maurass_desc: "Вновь формирующаяся аристократия, представляющая собой смесь союзной знати из прежнего правительства и вновь помазанных из Национальной федерации, вероятно, станет причиной идеологического столкновения. Поэтому мы будем навязывать всем единую, сплоченную линию поведения - риксвитализм. Опираясь на труды знаменитого Шарля Морасса и других, наша собственная уникальная смесь традиционного национализма должна стать единственной идеологической мыслью без нашей аристократии и нации."

SWE_knights_of_the_new_order: "Безграничный лоялизм и власть монархии"
SWE_knights_of_the_new_order_desc: "Хотя мы уже начали формировать молодежь нашей нации, мы всегда можем пойти дальше! Безусловная преданность и остракизм в отношении тех, кто даже осмеливается её подвергать сомнению, потому что Швеция под властью короля и нашего храброго лидера должна стать величайшей нацией на земле!"

SWE_royal_corporatism: "Экономика короны против коррупции капитала"
SWE_royal_corporatism_desc: "Корпоративизм при прежних консерваторах был ослеплен безжалостными капиталистами, но, переориентировавшись и удвоив ставку на монарха, мы можем использовать его в наших интересах."

SWE_reinforce_hierarchy: "Швеция, чистая от политики"
SWE_reinforce_hierarchy_desc: "Политика ничего не сделала для народа, это лишь скудная фасадная сторона богатства и манипуляций, осуществляемых международным еврейством, которое охотится на слабоумных в нации. Мы сломаем старую политику, Риксдаг и его коррупция не вернутся, как и фальшивый фасад выборов, устройство, используемое международным еврейским купечеством для контроля над народом нации."

SWE_latin_scandinavia: "Новая эра свободы"
SWE_latin_scandinavia_desc: "Как когда-то сказал мудрец: «Избыток свободы, будь то в государстве или у отдельных лиц, кажется, переходит только в избыток рабства», и такая идея должна быть воплощена в нашей нации. Поскольку избыток ведет к расточительству, беспорядкам и разрушению, мы будем господствовать над собой, чтобы предотвратить рабство и тиранию. Только благодаря нашему путеводной свету власти шведы могут надеяться достичь истинной свободы."

SWE_fighting_against_democracy: "Двор верного короля"
SWE_fighting_against_democracy_desc: "Полностью отказавшись от Риксдага, необходимо создать новый орган государства. Должен быть сформирован новый королевский двор, основанный на старых традициях. Во главе с королем, однако, истинная власть будет принадлежать нашему Рикследаре, который вместе со своими верными придворными будет вести Швецию через все испытания."

SWE_oragnic_state: "Чистое северное государство"
SWE_oragnic_state_desc: "Под руководством нашего Рикследаре и могущественной Национальной федерации некогда упадническая демократия была сожжена, а её пепел брошен в океан в память о прошедшем времени. Теперь риксвитализм направляет каждого шведа, определяя все аспекты внутренней и внешней политики, при этом Швеция сама по себе является приоритетом во всех смыслах."

SWE_buildings_worthy_of_an_empire: "Памятники империи"
SWE_buildings_worthy_of_an_empire_desc: "Наша новообразованная империя должна строиться! Ведь римляне до сих пор запомнились великолепием своей архитектуры, которая осталась разбросанной по всей Европе и Африке. Мы сами должны стремиться к этому, потому что, если солнце когда-нибудь закатится на Земле в последний раз, от нас останется только пепел."

SWE_knowledge_of_modern_times: "Расширение прелестей высшего образования"
SWE_knowledge_of_modern_times_desc: "Ничто не важнее хорошего образования, оно дает возможность проявить инициативу и генерировать новые идеи. Необходимо ввести бесплатное образование в университетах для всех истинных шведов, а бремя расходов по этой мере возложить на всех, кто пытается узурпировать нашу власть."

SWE_europe_within_our_bossum: "Европа в нашем сердце"
SWE_europe_within_our_bossum_desc: "Европа - это не просто континент, это колыбель цивилизации, о чем, похоже, забыли многие из наших братьев. Но больше этого не будет: Европа будет объединена под нашим руководством, освобожденная от упадка и врагов с Востока."

