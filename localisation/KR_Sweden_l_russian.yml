SWE_social_dem_pol1: "Строительство Фолькхеммета"
SWE_social_dem_pol1_desc: "Заявленной целью Пер Альбин Ханссон с 1928 года, Фолькхеммет, является идея более доброй, справедливой и процветающей Швеции. Согласно названию Фолькхеммет, или «Дом народа», она представляет собой идею шведского правительства как органа, защищающего благосостояние своих граждан, обеспечивающего здравоохранение и образование, чтобы создать более равноправное общество. Для достижения этой цели необходимо сначала заложить основу, начиная с создания ведомств и укомплектования государственной службы как можно большим количеством трудолюбивых людей. По всей стране государственные планировщики и политики из всех партий собираются, чтобы спланировать будущее страны, которая, как надеются, скоро будет наполнена больницами, школами и домами для всех. Радикальные критики внутри его партии и в поддерживаемых Парижем ассоциациях осуждают его как предателя за сотрудничество с капиталом в его стремлении к социальным реформам, но Пер Альбин намерен доказать, что его оппоненты неправы. Более совершенное общество возможно, и реформы не обязательно должны проводиться с помощью оружия."

SWE_social_dem_pol2: "Возникновение Фолькхеммета"
SWE_social_dem_pol2_desc: "Прогресс есть, но он медленный. В то время как города в полной мере ощущают на себе новый импульс к превращению шведского общества в более равноправное, с созданием новых рабочих мест, открытием школ и больниц каждый квартал, сельская местность оказалась более устойчивой к изменениям. Маргинальные партии возражают против идеи равноправного общества, основанного на реформах, а не на революции, а на севере Швеции политики-синдикалисты часто блокируют то, что они называют «капиталистическим принуждением». В противовес этому, более правые члены политической сцены обвиняют весь проект в том, что он является одним большим социалистическим переворотом. Несмотря на сопротивление со стороны крайних сил, центр держится крепко, и как SAP, так и их оппоненты в Риксдаге остаются верны своему видению. Хотя идея надлежащего государства всеобщего благосостояния остается труднодостижимой, она постепенно становится реальностью."

SWE_social_dem_pol3: "Фолькхеммет"
SWE_social_dem_pol3_desc: "Не так давно беднейшие слои общества верили, что реформы могут быть осуществлены только с помощью насилия. Не так давно синдикалистские агитаторы бродили по суповым кухням, проповедуя революцию, а в изолированных клубах по всей стране офицеры строили планы по спасению страны от хаоса. Не так давно даже стремление Пер Альбина Ханссона создать дом для всех рассматривалось как пустые слова, предвыборная риторика и пустые обещания. Сегодня его скептики и критики замолчали. Благодаря соглашениям и рукопожатиям, дружеским встречам с представителями высшего общества и профсоюзов Пер Альбин Ханссон создал Фолькхеммет - свободное и равное общество для всех, свободное от разрушительных последствий капитализма, но и от крайних проявлений революционного насилия. Ситуация ещё не идеальна, все ещё существуют бедность и неравенство, но пока Швеция держится курса, поддерживает программы, направленные на улучшение положения самых бедных слоев общества, она может служить образцом для всех."


SWE_social_dem_urban_effort: "Крыши для всей нации"
SWE_social_dem_urban_effort_desc: "Шведским городам не хватает планирования. Об этом знают все в Швеции. Мало того, что дороги разбегаются во все стороны, местные городские советы зачастую едва ли имеют представление о том, что развивать дальше. Действительно, в таких местах, как Стокгольм и Гётеборг, наблюдается такой дефицит жилья, что люди живут в лачугах и хижинах, даже вынуждены селиться в небольших дачных домиках, непригодных для проживания зимой. Необходимо что-то предпринять, тем более что после «черного понедельника» продолжающийся отток населения из сельской местности только усилился. Поскольку свободный рынок не проявляет достаточного энтузиазма в решении этой проблемы, правительство вмешивается, покупая землю по мере необходимости и создавая новые застройки, как коммунальное жилье, так и более крупные дома для больших семей. Также предпринимаются усилия по сотрудничеству с ассоциациями арендаторов, а также с городскими арендодателями и даже со Шведской церковью, которая является ещё одним крупным землевладельцем. Со временем Швеция обязательно обеспечит всех жильем."

SWE_social_patriot_idea: "Патриотическая партия"
SWE_social_patriot_desc: "Что может быть более патриотичным, чем любовь к своей стране? Что может быть более патриотичным, чем служение нации в мирное время и в период кризиса? Эта дискуссия бурно ведется во всем шведском обществе после раскола между SAP и их оппонентами справа. Утверждая, что социал-демократы недостаточно патриотичны, а может быть, даже презирают свою страну, правые ввергли нацию в медийную истерию, основанную исключительно на обвинениях и риторике. Однако Пер Альбин Ханссон не намерен поддаваться на эти обвинения. В бурной речи в Риксдаге Ханссон указал, что истинный патриотизм заключается в помощи соотечественникам, работе на общее благо всего общества и строительстве страны, а не в ее продаже тому, кто больше заплатит. Рассказывая о своей жизни, Ханссон сравнивает себя со своими оппонентами, утверждая, что он живет как настоящий швед. Он пьет с друзьями, играет в карты, занимается спортом и ездит на Plymoth Deluxe D6. В противовес этому он указывает, что лидер оппозиции ездит на Mercedes, одевает свою жену в горностаевые меха из Вены и проводит слишком много времени в Швейцарии. Ханссон утверждает, что SAP является единственной патриотической альтернативой на любых выборах, поскольку только голосование за него и его партию может уберечь страну от хищников иностранного капитала." 

SWE_health_care_idea: "Создание национальной системы здравоохранения"
SWE_health_care_idea_desc: "Ключевым элементом концепции Фолькхеммет является идея легкого доступа к здравоохранению. В большинстве городов, как правило, есть хотя бы небольшая частная клиника, а в крупных городах - одна или несколько больниц, но эти учреждения часто недоступны для самых бедных слоев общества. Жители сельской местности, которые часто работают на больших поместьях без какой-либо оплаты, часто страдают от множества болезней и недугов, с которыми можно было бы легко справиться, если бы у них был легкий доступ к врачу. Наконец, Риксдаг решил вмешаться. С несколькими уже построенными больницами, несколькими запланированными и целым поколением готовых и желающих работать врачей и медсестер, медицинская помощь скоро станет доступной для всех. А пока автобусы курсируют от деревни к деревне, перевозя сельских врачей, пока не будет организован доступ к более подходящим учреждениям. Постепенно Фолькхеммет будет построен."
SWE_health_care_idea2: "Национальное медицинское страхование"
SWE_health_care_idea2_desc: "Ключом к легкому доступу к здравоохранению является страхование, и правительство готово помочь в этом. Хотя различные общины и профсоюзы по всей стране уже имеют свои собственные системы медицинского страхования, в Швеции нет обязательного национального медицинского страхования. По крайней мере, до сих пор. После многочисленных дебатов и споров в Риксдаге была разработана схема, которая гарантирует, что каждый мужчина, женщина и ребенок в стране будут охвачены одной и той же системой социальной защиты. За небольшую дополнительную плату ежемесячно в рамках налогов медицинское обслуживание стало обязательным правом всех граждан. Это не только удешевило лекарства, но и, как можно надеяться, теперь никто не окажется в бедственном положении только из-за того, что обратился за помощью."
SWE_social_study: "Народная социал-демократия"

SWE_unity_cabinet_lamp: "Кабинет единства"
SWE_unity_cabinet_lamp_desc: "После начала военных действий за рубежом различные политические партии в Риксдаге решили сплотиться и сформировать правительство национального единства до тех пор, пока страна не будет считаться защищенной от внешних угроз. Хотя нынешний премьер-министр останется на своем посту, состав кабинета был переформирован. Лидеры различных партий, входящих в кабинет единства, получили посты в новом правительстве, что было сделано в целях обеспечения стабильности и безопасности. При этом партии, занимающие крайние позиции, были исключены из этого соглашения, например, синдикалисты и более крайние правые." 

