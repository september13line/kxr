##FOP##

SWE_FOP_tiger_place_in_world: "Снова на мировой арене"
SWE_FOP_tiger_place_in_world_desc: "Швеция стоит выше всех других стран Скандинавии и сейчас смотрит на бурный мир. Однако такое положение привлекает к себе пристальные и жадные взгляды: Россия на востоке, Германия на юге и Интернационал на западе. Швеция должна тщательно планировать свои дальнейшие шаги."
SWE_FOP_realm_of_our_own: "Наше собственное царство"
SWE_FOP_realm_of_our_own_desc: "Когда-то мы были империей, страной, которую боялись и уважали. Мы не добьемся такого же уважения, будучи лакеем иностранных держав или заискивая перед нашими дорогими соседями. Швеция должна проложить свой собственный путь, независимо от того, какой ценой."
SWE_FOP_ready_the_blade: "Готовя меч"
SWE_FOP_ready_the_blade_desc: "В последние годы дипломатия доказала свою несостоятельность, а между политиками двух стран разгорелась ссора, которая сводится к соревнованию по тому, кто потеряет больше. Отныне мы будем говорить с помощью оружия."
SWE_FOP_danes_returned: "Операция «Rädda Danmark»"
SWE_FOP_danes_returned_desc: "Операция «Rädda Danmark», план, разработанный высшим военным руководством, представляет собой радикальный план вторжения в Данию с целью вернуть её в наши объятия. Давайте не будем колебаться."
SWE_FOP_karlstad_failure: "Разорвать Карлстадский договор"
SWE_FOP_karlstad_failure_desc: "Карлстадский договор был подписан, когда Норвегия официально покинула нас, совершив вероломный акт мятежа, порожденный датскими мечтами о независимости. Мы больше не будем уважать этот договор, Норвегия принадлежит Швеции и должна вернуться в её состав."
SWE_FOP_lands_of_old_empire: "Наш балтийский бастион"
SWE_FOP_lands_of_old_empire_desc: "Когда мы ещё были империей, северный регион Прибалтики, земля, которая сейчас называется Эстонией, принадлежал нам. Она предоставляла нам противоположные по отношению к нашим порты для большего контроля над Балтийским морем. Она также давала нам ещё один важный и меньший фронт против русского зверя, и возвращение этой земли будет иметь решающее значение в наших будущих сражениях."
SWE_FOP_contront_bear: "Надвигающееся угроза России"
SWE_FOP_contront_bear_desc: "Медведь, Россия, всегда была занозой в нашем боку, катализатором распада Шведской империи. Мы должны избавиться от нашего позора и убить медведя в последний раз, Россия станет болезненным пятном на страницах истории."
SWE_FOP_wayward_son: "Вернуть блудного сына"
SWE_FOP_wayward_son_desc: "Финляндия, о Финляндия, утраченная нами из-за подлых русских, теперь цепляется за независимость. Мы напомним им об их долге перед Скандинавией, перед северными народами, а не перед русскими. Наш своенравный сын вернется, так или иначе."
SWE_FOP_swedish_dominance: "Рёв тигра"
SWE_FOP_swedish_dominance_desc: "Империя вернулась со страниц истории, Шведская Империя возвращается в блеске славы, снова готовая господствовать тысячу лет."


SWE_FOP_neutrality_again: "Вновь нейтралитет"
SWE_FOP_neutrality_again_desc: "Вновь было решено, что политика нейтралитета является будущим для Швеции. Мы должны удвоить наши усилия по обороне, защищая себя от бессмысленных войн на чужой территории."
SWE_FOP_trade_priority: "Торговый гигант"
SWE_FOP_trade_priority_desc: "Хотя мы и не входим ни в одну из фракций, это не противоречит нашему нейтралитету в торговле и бартере с членами Антанты, Рейхспакта и Интернационала. Таким образом, мы можем быстро стать центром торговли в Европе между потенциальными соперничающими странами."
SWE_FOP_gotland_fortress: "Фортификация важных портов"
SWE_FOP_gotland_fortress_desc: "Крепость: Готланд"
SWE_FOP_fortification_efforts: "Планы массового укрепления"
SWE_FOP_fortification_efforts_desc: "Хотя мы и объявляем о своем нейтралитете, не все готовы уважать наше решение, что стало очевидным, когда Германская империя вторглась в Бельгию во время Первой мировой войны. То же самое может произойти и с нами, поэтому мы должны быть готовы и продолжать массовые укрепления по всей стране."
SWE_FOP_see_evil_speak_evil: "Нейтральная разведывательная служба"
SWE_FOP_see_evil_speak_evil_desc: "Чтобы сохранить нейтралитет и стабильность, мы должны убедиться, что мы свободны от иностранного подрывного влияния, агентов из стран, желающих вызвать у нас беспорядки и хаос, чтобы спровоцировать ответную реакцию. В связи с этим будут сделаны значительные инвестиции в нашу разведывательную службу, чтобы этого не произошло, а также будет проведена информационная кампания, организованная Шведским национальным советом по информации, чтобы информировать наших граждан об опасности открытого обсуждения разведывательной деятельности правительства.\n\nEn Шведский тигр"
SWE_FOP_tiger_guards_den: "Родной дом Швеции - спасён"
SWE_FOP_tiger_guards_den_desc: "Швеция в безопасности, в безопасности от мелких альянсов мира и от иностранных агентов, стремящихся к нашему уничтожению, давайте радоваться!"


SWE_FOP_democractic_light: "Грандиозный альянс"
SWE_FOP_democractic_light_desc: "В этом современном зоопарке лояльности и союзов очевидно, что выживают те, кто держится вместе. У нас остается несколько основных вариантов, с кем мы можем объединиться: в Петрограде русская орда готова продолжить свою территориальную экспансию, Антанта стремится положить конец изгнанию из своих родных земель, а посреди этих групп находится Германский Рейхспакт, которому угрожают, возможно, все фракции. Мы должны принять решение сейчас, чтобы не оказаться на обочине истории."
SWE_FOP_banished_entente: "Возвращение изгнанников"
SWE_FOP_banished_entente_desc: "Мы решили присоединиться к Антанте, стремясь помочь ей в её праведном крестовом походе против орд Интернационала."

SWE_FOP_russian_alliance: "Оттепель в отношениях с Россией"
SWE_FOP_russian_alliance_desc: "В том, что большинство сочло самым неожиданным поворотом, мы решили присоединиться к русскому альянсу. Мы стремимся поддержать их в их законном возвращении родных земель, против любого врага, с которым они столкнутся."

SWE_FOP_former_victors_kaiser: "С победителями Вельткрига"
SWE_FOP_former_victors_kaiser_desc: "В конце мировой войны Германия и её союзники одержали победу над Европой, разгромив объединенные силы бывшей Тройственной Антанты. С учетом установленного господства над Европой и наших уже существующих германских связей, Рейхспакт является наиболее очевидным выбором для присоединения в целях нашей собственной безопасности."

SWE_FOP_ourselves_forward: "Ковать свой собственный путь"
SWE_FOP_ourselves_forward_desc: "Доказано, что ни один союз или фракция не могут по-настоящему представлять наши интересы, если они не исходят из Стокгольма. Швеция может процветать только тогда, когда ею управляет сама Швеция, а не прихоти берлинских промышленников, российских демагогов или неудачников-эмигрантов."

SWE_FOP_naval_history: "Военно-морская мощь Антанты"
SWE_FOP_naval_history_desc: "Несмотря на поражение в мировой войне, Франция и Великобритания доказали, что их военно-морская мощь по-прежнему не имеет себе равных по сравнению с меньшими по размеру военно-морскими силами Германии. Хотя сейчас они находятся в изгнании, многие из их стратегических военно-морских умов и кораблей остаются под их контролем, и передача нам этих знаний поможет нам создать силы, подобные их."

SWE_FOP_entente_history: "Люди превыше всего"
SWE_FOP_entente_history_desc: "Армия может существовать только благодаря людям, которые в ней служат, поэтому эти люди и их способности напрямую отражают опыт армии. Следуя мнению наших союзников о том, что армия должна быть небольшой, элитной и способной, мы тоже станем непревзойденными на поле боя."

SWE_FOP_military_history: "Огромная мощь в размерах"
SWE_FOP_military_history_desc: "Нация не может сражаться с помощью одного человека, ей нужны тысячи храбрых мужчин в пределах своих границ. Мы будем следовать этой доктрине наших союзников, имея тысячи людей, готовых и желающих сражаться, независимо от противника."

SWE_FOP_industrial_focus: "Промышленный опыт"
SWE_FOP_industrial_focus_desc: "Существует множество способов построить полку, но всегда есть способ, который является наиболее эффективным. Точно так же промышленность и бизнес просто отражают это, но в национальном масштабе, с помощью экспертов и финансистов из числа наших союзников, наши природные отрасли промышленности будут процветать."

SWE_FOP_alliance_of_misfits: "Альянс неудачников"
SWE_FOP_alliance_of_misfits_desc: "Наш союз не будет строиться на пограничных марионетках или тех, кто сидит рядом с нами, он будет состоять из «неудачников» или конгломерата различных наций по всему миру, все с одинаковыми желаниями и согласованными целями."

SWE_FOP_secure_nordics: "Взгляд на Скандинавию"
SWE_FOP_secure_nordics_desc: "Скандинавия остается нашей областью, ключевым регионом Европы, в центре которого мы находимся. Таким образом, этим нациям будет предоставлена возможность присоединиться к нам или подчиниться в пределах наших границ."

SWE_FOP_finland_decision: "Судьба Финляндии"
SWE_FOP_finland_decision_desc: "Фредриксхамнский договор был одним из величайших позоров, которые обрушились на нас, запятнав нашу историю и опорочив нас с некогда великой империи до ещё одного незначительного европейского государства. Теперь, когда Финляндия заявляет о своем стремлении к самостоятельности, появился новый шанс вернуть эту землю."

SWE_FOP_iceland_gambit: "Исландский вопрос"
SWE_FOP_iceland_gambit_desc: "Исландия является стратегическим островом в Северной Атлантике, идеальной базой для наших операций в Европе и за рубежом. Однако её жители, похожие по культуре на датчан, претендуют на независимость. Мы должны развеять это ложное представление, пока оно не развилось дальше."

SWE_FOP_triumphant_once_more: "На пути к новому мировому порядку"
SWE_FOP_triumphant_once_more_desc: "Сейчас мы полностью объединились с нашей фракцией, и по всему миру многие говорят о нас и о тех, кто стоит рядом с нами. Начинается новый день, день, когда имя «Швеция» будет на устах у всех."

SWE_FOP_revolutionary_torch: "Неся факел революции"
SWE_FOP_revolutionary_torch_desc: "С победой революции и восстановлением стабильности в стране мы можем обратить свой взор вовне. Самый очевидный выбор - присоединиться к Интернационалу в его праведном деле международного освобождения рабочих, или, может быть, мы сочтем их идеологию несовместимой с нашей?"
SWE_FOP_alongside_internationale: "Бремя, которое мы понесём вместе"
SWE_FOP_alongside_internationale_desc: "Вместе мы должны поднять рабочих, вместе мы будем неустанно работать, чтобы освободить их. Именно вместе Третий Интернационал добьется успеха."
SWE_FOP_french_industrial_aid: "Промышленные советники коммуны"
SWE_FOP_french_industrial_aid_desc: "Коммуна Франции предложила услуги промышленных консультантов, стремясь повысить наше производство и помочь нашим рабочим в предстоящих трудностях."
SWE_FOP_british_naval_advise: "Отправляемся в плавание с Великобританией"
SWE_FOP_british_naval_advise_desc: "Британцы всегда славились своим морским мастерством, и это не изменилось после революции, несмотря на бегство многих королевских адмиралов и кораблей. Мы будем учиться на их опыте, чтобы улучшить наш собственный флот."
SWE_FOP_worker_class_collab: "Международное сотрудничество трудящихся"
SWE_FOP_worker_class_collab_desc: "Рабочие всего мира должны объединиться, если мы хотим добиться успеха и победить жадность капитализма и глупость националистов, поднимайтесь!"
SWE_FOP_ready_world_revolution: "Подготовка к мировой революции"
SWE_FOP_ready_world_revolution_desc: "Единственная цель Третьего Интернационала - полное освобождение рабочего класса во всем мире, и мы должны быть готовы к этой задаче."
SWE_FOP_role_to_play: "Факел, который мы несём"
SWE_FOP_role_to_play_desc: "Мы несем факел, который рассказывает историю освобождения, свободы и надежды. Вместе с нашими товарищами по Интернационалу мы можем многого достичь, потому что вместе мы все несем факел для рабочих!"

SWE_FOP_nordic_torch_alone: "Северный интернационал"
SWE_FOP_nordic_torch_alone_desc: "Третья Интернационал начиналась как благородное дело, но, как и многие другие дела, со временем она стала коррумпированной, превратившись в тень своих первоначальных намерений. её идеологии замутняют воду свободы и тирании в своей интриге ради красного империализма. Из-за этого мы должны действовать в одиночку, провозглашая свою собственную интернациональную организацию здесь, на Севере."
SWE_FOP_decry_reaction: "Против ложных идеологов"
SWE_FOP_decry_reaction_desc: "Бич ложных идеологов скрывается за каждым углом, харизматичные люди, готовые говорить все правильные фразы, чтобы получить власть, не имея в сердце ни капли веры в дело. Такие люди, такие нации не могут проникнуть к нам."
SWE_FOP_workers_arsenal: "Арсенал для освобождения рабочих"
SWE_FOP_workers_arsenal_desc: "Не все нации будут готовы присоединиться к нашему делу, даже если наши идеалы велики, а наши цели справедливы. Поэтому мы должны быть готовы к конфликтам, которые могут возникнуть в ближайшие десятилетия."
SWE_FOP_crush_nordic_crowns: "Разрушить северных владык"
SWE_FOP_crush_nordic_crowns_desc: "Северные короны долгое время угнетали народы Севера, мы должны освободить скандинавские народы от их тиранов! Только так шведская революция будет защищена от сил, которые слишком долго уклонялись от правосудия."
SWE_FOP_rally_oppressed: "Объединить угнетённые массы"
SWE_FOP_rally_oppressed_desc: "Недостаточно просто разгромить реакцию и зловещие силы, сковывающие народы Скандинавии цепями, потому что есть другие народы, которые нуждаются в нашей помощи. Давайте станем маяком свободы, светом надежды в подавляющей тьме мира. Помогая им в их борьбе, мы все обретем свои права."
SWE_FOP_true_nordic_union: "Северный союз"
SWE_FOP_true_nordic_union_desc: "Сметая старый порядок, мы проложили путь в будущее. Создание новой нации гарантирует её гражданам уважение их основных свобод, достигнутых благодаря их человечности, а не каким-то возвышенным аристократическим идеалам. Пришло время создать единое государство для всех северных народов."


SWE_defense_of_sweden: "Путь к новой армии"
SWE_defense_of_sweden_desc: "Армия Швеции в настоящее время находится в запущенном состоянии, являясь пережитком давно минувших войн. По сравнению с постоянными армиями других европейских стран, она остается небольшой и в основном сосредоточена на оборонительной позиции. Однако с новым поворотом истории и возможностью участия в очередной мировой войне, эта старая армия должна быть готова ко всему."
SWE_chief_of_army: "Учреждение начальника сухопутных войск"
SWE_chief_of_army_desc: "Для более эффективного командования и управления нашей армией необходимо создать должность постоянного главы шведской армии и выбрать лидера. В отличие от аналогичных должностей, созданных для военно-морского флота и военно-воздушных сил, до сих пор не принято решение о том, кто станет новым главой армии. Варианты варьируются между Хельге Юнгом, лидером спорной «Хунты» разочарованных офицеров, Олофом Торнеллом, аполитичным выбором кабинета Багге, Арчибальдом Дугласом, вдохновленным Дж. Ф. Фуллером и интересующимся политикой правого толка, и Иваром Хольмквистом, любителем лыж, олимпийцем и всеобщим авторитетом."

SWE_holmquist_plan: "Война на выносливость Хольмквиста"
SWE_holmquist_plan_desc: "Ивар Хольмквист был выбран для реформирования армии, уделяя особое внимание ведению боевых действий в зимних условиях, борьбе со стихией и специальным войскам. Продолжая уделять пристальное внимание ведению боевых действий в зимних условиях, Хольмквист надеется обеспечить Швеции возможность действовать выше своего веса на одной из самых суровых территорий Европы."

SWE_modern_rifle: "Винтовка в руки каждому"
SWE_modern_rifle_desc: "Одной из самых серьезных проблем Хольмквиста в связи с текущим состоянием армии является явная нехватка оружия. Печальным следствием экономического кризиса и социальных потрясений является то, что шведские пехотинцы либо вооружены устаревшими винтовками, либо испытывают нехватку боеприпасов, либо, в худшем случае, испытывают нехватку и того, и другого. Эту ситуацию необходимо исправить."

SWE_olympic_training_regiment: "Олимпийская подготовка солдат"
SWE_olympic_training_regiment_desc: "Солдаты приходят из всех слоев общества, из всех секторов. Некоторые из них происходят из военных семей, некоторые - из высших классов, некоторые - из рабочего класса, но все они должны быть как можно более подготовлены и готовы к действию. Ключевым фактором является выносливость, а не грубая сила, и именно выносливость и физическая подготовка обеспечат шведскому пехотинцу, независимо от его происхождения, возможность сравниться или даже превзойти любого противника в любом столкновении."

SWE_ski_based_infantry: "Совершенствование лыжной войны"
SWE_ski_based_infantry_desc: "Лыжная война остается уникальным навыком, которым обладают различные северные народы. В то время как другие хвастаются мобилизованными грузовиками, кавалерийскими войсками и танками, шведские офицеры знают, что как только они вступят в заснеженные леса, такая техника сломается из-за суровых погодных условий. Пока они будут бездействовать, ремонтируя свои грузовики и танки, шведские коммандос проскользят мимо на лыжах с гранатами и винтовками, нанося удар по врагу, прежде чем тот осознает, что подвергся нападению."

SWE_hidden_in_snow: "Сокровенность снега"
SWE_hidden_in_snow_desc: "Наряду со специалистами, оснащенными лыжами, необходимо подготовить оборону и разработать новые программы обучения, использующие природный ландшафт для защиты от вторжения. Скрываясь среди снега, в лесах и на холмах, враг падет перед самой природой, которую он стремится покорить."

SWE_peoples_army: "Армия для защиты Швеции"
SWE_peoples_army_desc: "Хотя шведские солдаты должны быть готовы сражаться за рубежом от имени ближних и дальних союзников, основное внимание должно быть и всегда будет уделяться защите самой страны. Все шведские офицеры, независимо от своих амбиций, должны быть полностью мотивированы и понимать важность защиты родины."

SWE_fit_ready_army: "Боеспособная армия"
SWE_fit_ready_army_desc: "Под руководством Ивара Хольмквиста шведская армия стала одной из самых подготовленных и специализированных армий в Европе. Шведские солдаты превосходят все другие европейские страны по физическим показателям, а также опережают большинство из них по меткости стрельбы и тактическому планированию."


SWE_archies_plan: "Война манёвров Дугласа"
SWE_archies_plan_desc: "Арчибальд Дуглас был выбран для руководства армией в будущем и, вооружившись трудами из Германии и Канады, намерен перестроить армию в соответствии со своим уникальным видением. Хотя Арчибальд не является поклонником более эзотерических трудов Дж. Ф. Фуллера, он привержен идее создания великой механизированной армии, способной компенсировать небольшой кадровый резерв высокой скоростью и агрессивностью."

SWE_tank_research: "Иностранные танковые конструкции"
SWE_tank_research_desc: "Арчибальд надеется, что благодаря соглашениям, шпионажу и торговле Швеция сможет создать эффективные боевые машины, но сначала необходимо просто изучить, что происходит за рубежом. Немецкие танки, канадские танкетки, российские гиганты - независимо от происхождения или истории, их необходимо купить или приобрести другим способом, разобрать и собрать заново."

SWE_cold_weather_tanks: "Учения с использованием бронетехники"
SWE_cold_weather_tanks_desc: "Учитывая скандинавский климат, бронетехника должна быть адаптирована с учетом снега, длительных поездок и простоты обслуживания. Танковые войска должны быть обучены обслуживанию своей техники, должны понимать и осознавать особенности зимней бронетанковой войны и должны понимать, когда снег просто слишком глубок. Необходимо изучить зимние испытания Путтеса, чтобы шведская армия не оказалась в ситуации, когда все больше танков случайно падают в канавы, реки, озера или случайно врезаются в здания."

SWE_supply_lines: "Укрепление линий снабжения"
SWE_supply_lines_desc: "Без линий снабжения любая армия просто развалится, и поэтому шведская армия должна иметь разветвленную сеть специальных снабженческих компаний и даже независимых добровольных объединений, помогающих в военное время. Пока шведский солдат сыт и его винтовка работает, он способен творить чудеса."

SWE_trucks_not_horses: "Лошади в грузовиках"
SWE_trucks_not_horses_desc: "Кавалерия уходит в отставку? Исчезает? Остается в истории? Никогда! Арчибальд Дуглас считает, что кавалерия просто преобразится, усовершенствуется, и в рамках своей великой программы механизации он стремится преобразовать все шведские кавалерийские подразделения в бронетанковые боевые части. Плоть коня будет заменена металлом машины!"

SWE_officer_initiative: "Инициатива офицеров"
SWE_officer_initiative_desc: "Из-за географических ограничений Швеции просто невозможно поддерживать постоянный контакт с передовыми подразделениями. В связи с этим, а также в рамках уже сложившегося наступательного мышления, от офицеров будет ожидаться, что они будут брать на себя ответственность и руководить своими подразделениями с энергией и инициативой, действовать без приказов вышестоящего командования, если это необходимо и целесообразно. Офицеры больше не будут вынуждены сидеть сложа руки, пока враг отступает, атакует и атакует снова!"

SWE_encircle_attack: "Война в окружении"
SWE_encircle_attack_desc: "Сражение может затянуться в случае лобового столкновения, но благодаря тактике окружения можно минимизировать потери и максимизировать выгоду. Тщательно выбирая места сражений и окружая врага на незнакомой ему местности, можно добиться большого успеха."

SWE_resources_to_front: "Война за ресурсы"
SWE_resources_to_front_desc: "Швеция, несмотря на свои размеры, не может воевать вечно. Войны должны быть быстрыми и решительными, должны быть максимально неудобными для врага, потому что затяжная война раскроет ахиллесову пяту Швеции - её скудный кадровый резерв и неспособность производить более роскошные военные материалы без ресурсов из-за рубежа."

SWE_uitilize_natives: "Секрет Сведлунда"
SWE_uitilize_natives_desc: "В секретном сообщении главе государства, который по закону является главой армии, Нильс Сведлунд под псевдонимом проинформировал самых лояльных членов правительства о создании секретной силы для защиты страны от иностранного вторжения. Сведлунд создал ячейки по всей стране, составляющие новую секретную армию, предназначенную для борьбы с коллаборационистами, шпионажа за преступными элементами в обществе, а также для нанесения как можно большего ущерба оккупационным силам."

SWE_modern_dragoon: "Современная армия"
SWE_modern_dragoon_desc: "Под руководством Арчибальда Дугласа шведская армия достигла высокого уровня мастерства в ведении боевых действий с использованием бронетехники: пехота обучена сопровождать танки в бою, а танкисты хорошо знают свои машины. Вдохновленная «Планом 1919» Фуллера, шведская армия будет наступать решительно, жестко и с четко поставленными целями."
SWE_olof_plan: "Стратегическая война Торнелла"
SWE_olof_plan_desc: "Олоф Торнелл был выбран, к большому удовольствию правительства. Предлагая практичный вариант развития армии, Торнелл стремится сосредоточиться на создании по-настоящему элитного офицерского корпуса, одновременно максимально улучшая условия в армии."
SWE_old_war_doctrine: "Изучение мировой войны"
SWE_old_war_doctrine_desc: "Мировая война - это сокровищница масштабных сражений и подвигов, в которой заключены некоторые из самых передовых военных технологий, известных на сегодняшний день. Торнелл распорядился, чтобы тщательное изучение истории сражений и операций мировой войны стало обязательным в подготовке новых офицеров."
SWE_army_of_aggression: "Приверженность рядового солдата"
SWE_army_of_aggression_desc: "Недостаточно, чтобы генералы знали, за что они сражаются, то же самое должны знать и рядовые солдаты. Они должны знать, с кем, зачем и когда они будут сражаться, их должны обучать агрессивной тактике и беспощадной дисциплине."
SWE_research_army: "Инициативы по инновациям армии"
SWE_research_army_desc: "В какофонии современной войны технологии постоянно развиваются и расширяются, и Швеция не может оставаться позади. Должны быть созданы новые военные исследовательские подразделения, чтобы Швеция оставалась в курсе всех аспектов ведения войны. Кроме того, будут разрешены предложения и просьбы о проведении различных экспериментов, и Торнелл надеется вдохновить поколение офицеров на изучение более передовых вопросов."
SWE_modern_equipment: "Оборудование для образцовой армии"
SWE_modern_equipment_desc: "Преимущество дружественного отношения к правительству заключается в том, что иногда можно получить то, что хочешь. Иногда. Армия должна быть обеспечена современным вооружением в виде винтовок, пистолетов-пулеметов и столь необходимых пистолетов, что понимают даже бюрократы в Риксдаге. С современным вооружением шведская армия, уже начинающая походить на армию из величайших мечтаний Торнелла, станет по-настоящему современной образцовой армией."
SWE_adding_reserves: "Резервная воинская повинность"
SWE_adding_reserves_desc: "В шведском обществе, хотя и иногда с неохотой, понимают, что в случае необходимости правительство, а значит и армия, оставляет за собой право призывать любого человека на службу в любое время и в любом месте. В сочетании с реформированием старого Landstorm, чтобы он стал более современным инструментом армии, необходимо создать и расширить центры призыва, что позволит быстро набирать и проводить базовую подготовку как можно большего числа людей в военное время."
SWE_harsh_officer_corp: "Суровая подготовка офицеров"
SWE_harsh_officer_corp_desc: "Торнелл знает, что самым важным фактором в любой армии является солдат, пехотинец, и что он должен быть хорошо накормлен, уважаем, должным образом обучен и, что наиболее важно, должным образом руководим. Это привело к довольно двуличному стилю работы, при котором Торнелл чрезвычайно строг к своим офицерам, требуя от них лучших результатов, но в то же время проявляет заметное внимание к благополучию младших офицеров и рядовых солдат. Торнелл уже счел целесообразным отдать под военный трибунал Акселя Гюлленкрока за жестокое обращение со своими подчиненными, давая понять, что ни один офицер в армии не может продвигаться по службе, проявляя жестокость."
SWE_counter_attack: "Агрессивная война"
SWE_counter_attack_desc: "Шведские офицеры с самого начала обучаются понимать один основной факт: атака является ключом к победе. Битва при Нарве была успешной не благодаря прочной обороне, а благодаря поразительной эффективности контратаки, которая освободила крепость. Битва при Лютцене была победой не благодаря простому измату, а благодаря воле к борьбе и атаке. Точно так же и в будущем исход сражений будет определяться тем, кто осмелится атаковать наиболее решительно, и Торнелл хочет, чтобы все его подчиненные это понимали. Атакуйте, а затем атакуйте еще!"
SWE_experienced_army: "Опытная армия"
SWE_experienced_army_desc: "Армия Торнелла готова к бою, хорошо организована и мотивирована, возглавляется решительными, хотя и несколько сварливыми офицерами, командующими войсками с высоким боевым духом. Благодаря ориентации на классическую шведскую военную теорию дух старых каролинов живет и по сей день."
SWE_jung_plan: "Оборонительная война Чунга"
SWE_jung_plan_desc: "Хельге Юнг был выбран, уделяя большое внимание оборонительным тактикам с основным использованием артиллерии и укреплений. Выбранный, скорее всего, просто для того, чтобы успокоить армию, Хельге готов и способен сделать все необходимое, чтобы Швеция продолжала существовать, несмотря ни на что."
SWE_emplacement_placement: "Стратегические укрепления"
SWE_emplacement_placement_desc: "Хельге знает одно: хотя и жестокая и бескомпромиссная, позиционная война и усовершенствованные конструкции бункеров помогли переломить ситуацию в пользу Германии. Поэтому по всей территории страны на определенных важных перекрестках и географических объектах необходимо подготовить оборонительные позиции или, по крайней мере, осмотреть местность."
SWE_defensive_positions: "Возведение фортификационных сооружений"
SWE_defensive_positions_desc: "Бункеры, укрепления, все, что сложнее простой ямы в земле, должны быть укреплены и укомплектованы мотивированными и хорошо вооруженными людьми, компенсируя нехватку рабочей силы бетоном, камнем и сталью."
SWE_elite_units: "Эластичная структура обороны"
SWE_elite_units_desc: "Швеция - длинная страна с длинной береговой линией и ещё более широким фронтом. Поскольку невозможно укрепить все побережье от вторжения врага, Хельге считает, что шведская армия должна быть достаточно мобильной, чтобы быть гибкой, окружать и изолировать вторгшиеся войска с помощью быстрого транспорта и разведки противника."
SWE_communication_around: "Коммуникация между командованием"
SWE_communication_around_desc: "Сигнальные пистолеты и крики могут помочь шведской армии только до определенной степени, и поэтому большие усилия направлены на закупку достаточного количества радиостанций, чтобы охватить как можно большую часть армии. Чаще всего побеждает тот, кто обладает превосходной связью, и чтобы шведская армия не попала случайно в засаду врага, как в Танненберге, связь будет ключевым фактором любого будущего развития."
SWE_shells_shells_shells: "Необходимость артиллерии"
SWE_shells_shells_shells_desc: "Артиллерия - последний аргумент королей! Хотя Швеция всегда имела амбициозный артиллерийский сектор, чаще всего бюджета просто не хватало, чтобы удовлетворить её потребности. Но теперь все изменилось. Хельге Юнг считает, что Швеции нужно как можно больше мощных пушек, и предполагает возвращение к (относительно) высокомобильным батареям Тридцатилетней войны."
SWE_no_soil_lost: "Несокрушимая армия"
SWE_no_soil_lost_desc: "Под руководством Юнга шведская армия стала практически непобедимой - небольшой современной армией, способной противостоять любому врагу, вооруженной множеством пушек и обладающей мощной сплоченностью."
SWE_modern_army_of_sweden: "Современные вооружённые силы"
SWE_modern_army_of_sweden_desc: "Шведская армия обновилась, подготовилась и готова противостоять любому, кто осмелится вторгнуться в её границы! С пушками и винтовками, с танками и лыжами, шведская армия сегодня готова сразиться с кем угодно и где угодно!"

SWE_arms_against_tyranny: "Оружие против тирании"
SWE_arms_against_tyranny_desc: "В условиях полномасштабной революции и развала армии шведские вооруженные силы должны быть переформированы в нечто, подходящее для рабочих! Хотя в настоящее время шведская армия все ещё существует и дислоцирована в казармах по всей стране, новый революционный Риксдаг может по-настоящему доверять только красногвардейцам - специальным ополченческим отрядам, состоящим из всех, кто обладает достаточным революционным рвением, чтобы держать в руках винтовку, и возглавляемым избранными офицерами. Такое положение дел неприемлемо. Либо старая армия должна быть упразднена и заменена рабочими ополчениями, либо старая армия должна быть окрашена в красный цвет, альтернативы нет, чтобы не произошла ещё одна попытка переворота.\n\nБолее анархически настроенные синдикалисты настаивают на упразднении армии и сохранении красных гвардейцев, утверждая, что при поддержке и руководстве из-за рубежа сегодняшние специальные ополчения могут стать хорошо организованными и подлинно демократическими авангардами революции. Однако Карл Чильбум, находясь в прямом противостоянии, встал на сторону своего бывшего друга Нильса Флюга и коммунистов Свена Линдерута, утверждая, что армия должна остаться, но только как инструмент революции, непосредственно подчиняющийся народу."
SWE_swedish_red_army: "Создать красную армию"
SWE_swedish_red_army_desc: "Большевики проиграли гражданскую войну из-за военной некомпетентности, не прислушавшись к словам товарища Троцкого, что в конечном итоге привело к их поражению. Вдохновленная планами Троцкого по реформированию армии, перестроенная армия извлечет уроки из прошлого, чтобы создать лучшее будущее. Офицерам будет позволено остаться в армии под пристальным наблюдением комиссара, и в свою очередь эти старые агенты старого порядка помогут создать новое поколение офицеров, не зараженных гнилью буржуазной идеологии благодаря политическому образованию, но в то же время возглавляемых и обученных опытными людьми. Это может быть циничный план, и никто в Риксдаге не особенно рад тому, что бывшие агенты реакции находятся в иначе красной армии, но было бы просто безрассудством начинать все с нуля, тем более когда немцы дышат на Стокгольм, как безумное чудовище белого террора."
SWE_swedish_red_militia: "Поднять красные ополчения"
SWE_swedish_red_militia_desc: "По образцу ополчений в Союзе Великобритании и Франции, Каталонии и Стране Басков, ранее недисциплинированные и буйные отряды революционной воли и энергии будут обузданы и превращены в идеальных агентов будущего. Офицеры будут избираться своими подчиненными, а эти избранные офицеры, в свою очередь, будут голосовать между собой за то, кто должен быть главнокомандующим на том или ином фронте. Хотя сегодняшние милиции не будут так зависимы от голосования перед принятием мер, как CNT-FAI в Испании, авангард революции настолько демократичен, насколько это считает возможным Риксдаг."
SWE_new_high_command: "Новое высшее командование"
SWE_new_high_command_desc: "После того как многие офицеры и генералы ушли или были арестованы за содействие военному перевороту, необходимо сформировать новое высшее командование, поскольку угрозы внутри и вне страны становятся все более серьезными. Необходимо выбрать опытного генерала, который под надзором комиссара или солдатского совета будет руководить армией в обозримом будущем. Возможно, как и генерал Брусилов в России, один из этих старых королевских офицеров продемонстрирует свою полную готовность и способность спасти революцию, если только это поможет спасти страну."
SWE_reborn_officer_corp: "Возрождённый офицерский корпус"
SWE_reborn_officer_corp_desc: "Не секрет, что многие офицеры прямо или косвенно поддержали военный переворот, поэтому офицеров, все ещё лояльных правительству, осталось очень мало. В связи с этим некоторых офицеров-повстанцев можно выпустить из тюрьмы, поставить под усиленный надзор и поручить им подготовку нового поколения офицеров."
SWE_remove_old_generals: "Избавиться от реакционных пережитков"
SWE_remove_old_generals_desc: "По армии и залам Риксдага распространяется слух. Какой слух? Что нелояльные офицеры готовят новый переворот. Естественно, это недопустимо. Необходимо провести полную чистку вооруженных сил, чтобы убедиться, что в ополчении и оставшихся армейских частях нет контрреволюционеров."
SWE_hit_and_run: "Тактика «бей и беги»"
SWE_hit_and_run_desc: "Часть планов старой шведской армии предполагала противостояние гораздо более сильному противнику, чаще всего России, высаживавшему войска на длинных побережьях страны. Не имея возможности защитить всю береговую линию, много времени уделялось подготовке к возможной высадке врага, с планом нанести сильный удар, уничтожить высадившиеся войска, а затем отступить в густые леса сельской местности. Тактика «удар и бегство» может показаться трусливой для других, но, вдохновляясь прошлым планированием, новые современные ополченцы докажут, что они равны или превосходят любую буржуазную армию."
SWE_officer_uplifting: "Верховенство местных офицеров"
SWE_officer_uplifting_desc: "В разгаре сражения именно офицеры берут на себя командование, становясь решающим фактором между победой и поражением. Поощряя избранных офицеров и наделяя их невиданными ранее полномочиями на местном уровне, они сохранят инициативу и демократический характер ополчения, не нуждаясь в ожидании разрешения на те или иные действия в бою. Инициатива выигрывает войны, и инициатива выиграет революцию!"
SWE_motorise_workers: "Моторизация кавалерии"
SWE_motorise_workers_desc: "По мере быстрого изменения ведения войны и развития технологий использование кавалерии становится все более бесполезным. Старая кавалерия, в последнее время используемая только в качестве специальных жандармов и инструментов капитализма, должна быть заменена железными колесницами социализма, приводимыми в движение двигателями, изготовленными на шведских заводах шведскими рабочими для шведской, а впоследствии и мировой революции."
SWE_new_doctrine: "Современная война"
SWE_new_doctrine_desc: "Современная война отвратительна, это ужасающая перспектива, но к ней все должны быть готовы. Бомбардировщики могут уничтожить города за один рейд, линкоры могут уничтожить тысячи жизней за один залп, а ядовитый газ убивает более ужасным образом, чем старая скромная пуля. Понимание современной войны, понимание современных тактик и инструментов будет важно для спасения революции и нации."
SWE_international_tactics: "Изучение революций за рубежом"
SWE_international_tactics_desc: "Революции в Париже и Лондоне увенчались успехом, в то время как революция в Петрограде провалилась, и это должны изучить все, от студентов Маркса или Кропоткина до офицеров, чтобы сделать выводы, которые помогут обеспечить выживание революции здесь, в Стокгольме. Был ли Троцкий предан своими товарищами по партии? Был ли городской пролетариат в Лондоне и Париже просто более привержен идее классовой борьбы? Возникает много вопросов, и ответы на них можно найти только через изучение и исследование."
SWE_cold_weather_partisans: "Партизаны холодного климата"
SWE_cold_weather_partisans_desc: "Из-за сурового зимнего климата Швеции в случае активного вторжения зима должна помочь революции. Обучая солдат эффективно сражаться в холодную погоду, а также обучая их катанию на лыжах и обращению с ними, а также расширяя поставки зимнего снаряжения для нуждающихся войск, вооруженные силы революции всегда будут иметь преимущество над любыми буржуазными противниками. Пусть агенты капитала дрожат и жмутся у костра, а агенты социализма уничтожают их одного за другим!"
SWE_defensive_tank_fleet: "Оборонительный танковый флот"
SWE_defensive_tank_fleet_desc: "Содержание большого парка бронетехники может быть затруднительным для армии после революции, но всем известно, что танки будут играть решающую роль в любом будущем конфликте. Сохраняя элитное бронетанковое подразделение или направляя как можно больше энергии на создание новых, Швеция может оставаться на переднем крае развития танковых технологий."
SWE_army_commissars: "Военные комиссары"
SWE_army_commissars_desc: "Несогласие и подрывная деятельность по-прежнему процветают в рядах армии, и поэтому уже существующая система комиссаров должна быть формализована и стать постоянным фактором в армии, а не просто временной мерой."
SWE_reserve_units: "Резервы рабочих"
SWE_reserve_units_desc: "Введя обязательную военную службу для большинства рабочих, можно будет обеспечить ещё больший резерв рабочей силы для революции. Надеемся, что квалифицированные рабочие не будут вынуждены служить в окопах или становиться мишенью для артиллерии и снарядов, но в случае необходимости они будут готовы и способны принять участие в борьбе за мировую революцию."
SWE_rifle_in_every_home: "Винтовка в каждой руке"
SWE_rifle_in_every_home_desc: "Мужчины и женщины, молодые и старые, должны быть готовы защищать революцию и все её достижения, потому что если король вернется на трон, если капитал вернется в страну, все достижения будут потеряны, и шведские рабочие, только недавно освободившиеся, будут вновь брошены в оковы рабства. Этого нельзя допустить. Этого не должно произойти!"
SWE_fast_tank_fleet: "Легкий танковый флот"
SWE_fast_tank_fleet_desc: "Танки дают много преимуществ, но ни одно из них не сравнится со скоростью и надежностью. Сосредоточившись на этих сильных сторонах, люди могут быть уверены в быстром и эффективном развертывании бронетехники против любого буржуазного врага!"
SWE_concentrated_breakthroughs: "Скоординированные прорывы"
SWE_concentrated_breakthroughs_desc: "Чтобы компенсировать меньшую численность армии, крайне важно, чтобы любой удар и прорыв осуществлялись с большой амбицией, энергией и координацией. Обеспечение того, чтобы солдаты сохраняли инициативу вопреки всем трудностям, чтобы они приняли старый классический культ атаки, будет абсолютно одним из самых сильных трюков, которые есть в запасе революции."
SWE_wave_offensives: "Наступательные операции ополчения"
SWE_wave_offensives_desc: "Волнообразные атаки имеют плохую репутацию, заставляя людей вспоминать ужасы западного фронта или другие подобные кровопролития. Однако на самом деле волнообразные атаки на меньшего по численности противника творят чудеса и являются одной из старейших тактик в истории человечества. Считать её методом прошлого смешно, ведь кто сказал, что волнообразные атаки нельзя проводить с помощью бронетехники или, что ещё лучше, с помощью мотивированных и хорошо защищенных революционеров? Ошеломить врага одним махом, внезапно разгромить его с максимальной агрессией и огневой мощью - это не устарело, это прямо-таки революционно!"
SWE_army_of_the_people: "Шведская народная армия"
SWE_army_of_the_people_desc: "Старой армии больше нет, её заменила высокомотивированная и революционная сила, посвятившая себя исключительно защите народа, нации и революции. Чтобы отпраздновать это, были созданы новые медали и новые праздники в честь важных мучеников революции и последующих событий на службе революции и нации."

SWE_swedish_air_force: "Шведские ВВС"
SWE_swedish_air_force_desc: "Шведские ВВС, основанные в 1926 году, в настоящее время возглавляет Торстен Фриис, которому поручено развитие и расширение самой амбициозной ветви шведских вооруженных сил. Хотя сам Фриис выступает за доктрину превосходства, согласно которой как можно больше самолетов должны превосходить любого противника, чтобы бомбардировщики могли доминировать в воздушном пространстве, Аксель Гюлленкрок из Jung «Junta» называет эту идею непрактичной и претенциозной, вместо этого выступая за то, чтобы военно-воздушные силы были построены в первую очередь на поддержке армии, поскольку Гюлленкрок считает, что любая война против превосходящего противника требует большего, чем просто хорошая координация между двумя видами вооруженных сил."
SWE_swedish_army_air: "Воздушная поддержка Гюлленкрока"
SWE_swedish_army_air_desc: "Был выбран план Гюлленкрока для ВВС, ориентированный на потребности армии, в котором основное внимание уделяется небольшим бомбардировщикам, нацеленным на вражеские подразделения и линии снабжения, что позволяет шведской армии получить преимущество в любой боевой ситуации."
SWE_swedish_independent_air: "Доктрина превосходства"
SWE_swedish_independent_air_desc: "В качестве наиболее прямолинейного плана была выбрана доктрина превосходства, ориентированная на истребители и бомбардировщики и основанная на идее более универсальных ВВС. После того как вражеские истребители будут сбиты, бомбардировщики будут беспрепятственно наносить удары по вражеским городам, причиняя огромные разрушения."
SWE_swedish_socialist_air: "Советы по воздушному превосходству"
SWE_swedish_socialist_air_desc: "После хаоса революции военно-воздушные силы были реформированы, и основное внимание было уделено производству и использованию самолетов в целом. При поддержке Франции и Англии старые шведские военно-воздушные силы будут заменены новыми, энергичными и активными, готовыми сражаться с реакционерами по всему миру."
SWE_swedish_CAS: "Доктрина прямой авиационной поддержки"
SWE_swedish_CAS_desc: "Близкая авиационная поддержка играет ключевую роль в плане Гилленкрока, будь то более классические бомбардировщики или новые пикирующие бомбардировщики. В частности, пикирующий бомбардировщик B17 не только является отечественной разработкой, но и отличается высокой точностью, способен выполнять крутое пикирование и сбрасывать бомбы с точностью, недостижимой для других самолетов."
SWE_swedish_air_help_army: "Военно-воздушные силы для нужд армии"
SWE_swedish_air_help_army_desc: "Военно-воздушные силы будут косвенно служить армии, оставаясь независимой ветвью, но в целом будут подчиняться прихотям армии. Благодаря тесной связи военно-воздушных сил с армией, будет упрощена коммуникация, что позволит быстрее перехватывать врагов и быстрее реагировать на угрозы."
SWE_swedish_tactical_bomber: "Исследования в области тактических бомбардировщиков"
SWE_swedish_tactical_bomber_desc: "Создание небольшого бомбардировщика, способного поражать как вражеские подразделения, так и здания, позволит шведским ВВС эффективно доминировать в воздухе, и уже сейчас проект B18 выглядит многообещающим в качестве платформы именно для этой цели."
SWE_swedish_best_fighter: "Доминирование истребителей"
SWE_swedish_best_fighter_desc: "Нет самолета важнее истребителя, обеспечивающего превосходство в воздухе, останавливающего вражеские бомбардировщики и оказывающего непосредственную воздушную поддержку. Это самая важная роль, и к ней следует относиться соответственно. Будущие асы-истребители не только получат красивые медали, но и станут кумирами общества!"
SWE_swedish_strategic_bombing: "Разрушение зданий"
SWE_swedish_strategic_bombing_desc: "Большинство стран Европы имеют гораздо более развитую промышленную базу, чем Швеция, но благодаря эффективному использованию бомбардировщиков можно выровнять игровое поле."
SWE_swedish_fast_production: "Приоритет производства самолетов"
SWE_swedish_fast_production_desc: "Швеции нужно как можно больше самолетов в небе, и приоритетной задачей будет превосходство над врагом по количеству самолетов. Это может быть сложно, но вполне выполнимо, если враг не слишком велик."
SWE_swedish_no_gender_req: "Все способные к полетам пилоты"
SWE_swedish_no_gender_req_desc: "Женщины так же способны летать, как и мужчины, поэтому очень важно развеять мифы об обратном, поскольку женщины набираются в военно-воздушные силы для заполнения вакансий. Если женщина способна владеть винтовкой в армии или бороться с угнетением, то, безусловно, она способна пилотировать самолет!"

SWE_swedish_logistic_targeting: "Логистическая нацеленность"
SWE_swedish_logistic_targeting_desc: "Используя самолеты для нанесения ударов по линиям снабжения противника, можно ограничить превосходство в материальных ресурсах, на которое рассчитывает вторгшийся враг, что позволит солдатам на земле нанести удар, который в противном случае был бы невозможен."
SWE_swedish_saab_expansion: "Расширение SAAB"
SWE_swedish_saab_expansion_desc: "SAAB - одна из самых крупных шведских авиастроительных компаний, и её расширение и сотрудничество с ней будут иметь ключевое значение для укрепления шведских ВВС, а инженеры компании уже разрабатывают проекты истребителей, бомбардировщиков и самолетов с реактивными двигателями."
SWE_swedish_supporting_bombers: "Защита «Ангелов смерти»"
SWE_swedish_supporting_bombers_desc: "Несмотря на теории современных авиационных теоретиков, идея о том, что «бомбардировщик всегда прорывается», оказалась ошибочной, и необходимо позаботиться о том, чтобы бомбардировщики были должным образом защищены, в идеале - пилотами истребителей с орлиным зрением."
SWE_swedish_blind_sky: "В защиту неба Швеции"
SWE_swedish_blind_sky_desc: "Для защиты страны понадобятся наблюдатели, радисты и новейшие радиолокационные технологии, а люди, не пригодные для службы на передовой, будут направлены на защиту неба, обнаруживая и сообщая о чем-либо подозрительном в иначе чистом голубом небе."
SWE_swedish_aviation_unions: "Создание авиационных союзов"
SWE_swedish_aviation_unions_desc: "Идея создания авиационного союза, связующего звена между рабочими и пилотами, членами экипажа и механиками, будет ключевой в создании позитивных и эффективных военно-воздушных сил. Когда пилоты могут легко общаться со своими товарищами-революционерами, а механики могут открыто обсуждать потребности определенных механизмов, эффективность и демократия объединяются в идеальную красную машину."
SWE_swedish_jet_testing: "Испытания двигателей будущего"
SWE_swedish_jet_testing_desc: "Самолеты всегда могут летать быстрее и дальше, поэтому необходимо исследовать альтернативные системы привода, чтобы раздвинуть их границы. Вдохновленные ракетными двигателями и прототипами реактивных двигателей, Швеция в скором времени сможет создать самолет, который будет летать быстрее любого врага, возможно, даже быстрее скорости звука."
SWE_swedish_aa_emplacement: "Планирование размещения зениток"
SWE_swedish_aa_emplacement_desc: "По всей стране уже размещены и приведены в боевую готовность зенитные батареи, но, по мнению различных жилищных ассоциаций по всей стране, этого недостаточно. Шведский народ, видя опасность, в которой находится страна, собрал огромный фонд для поддержки создания дополнительных зенитных батарей по всей стране, чтобы защитить идеальное голубое небо от враждебной агрессии."
SWE_swedish_air_superior: "Учения пилотов-собак"
SWE_swedish_air_superior_desc: "Современный пилот - это современный рыцарь, благородный и способный, безжалостный и эффективный, и к нему нужно относиться соответственно. Обучение будет тяжелым и интенсивным, так как любая будущая война, несомненно, потребует большого количества здоровых и способных пилотов, и часть будущего планирования должна включать в себя объединение более опытных пилотов с новобранцами, как рыцарь и его оруженосец, чтобы новички могли учиться у своих наставников."
SWE_swedish_new_age_aircraft: "Новая эра воздушной войны"
SWE_swedish_new_age_aircraft_desc: "Военное дело постоянно развивается, и самолеты не являются исключением, шведские ВВС должны быть передовыми, всегда. Благодаря опытным инженерам, способным пилотам и культуре нанесения сильных и быстрых ударов, шведские ВВС, несомненно, будут одними из лучших в мире."


SWE_swedish_navy_start: "Шведские ВМФ"
SWE_swedish_navy_start_desc: "Один из старейших военно-морских флотов в мире, основанный в 1522 году победоносным Густавом Вазой, шведский флот 1936 года является крупнейшим в Скандинавии и насчитывает тысячи матросов, офицеров и вспомогательного персонала. После распада Российской империи шведский флот изменил свою основную задачу с защиты Швеции от российского нападения на создание сил для противодействия любому враждебному прорыву синдикалистов через Скагеррак и Каттегат, и в связи с этим сосредоточился в основном на более легких судах, хотя основным центром планирования флота по-прежнему остаются большие корабли береговой обороны, известные в Швеции как Pansarskepp.\n\nКак и во всех других военных учреждениях шведского общества, Густав V является номинальным главой, но в настоящее время разрабатываются планы по ослаблению привязки этой должности к королевскому двору. Шарль де Шампс, пожилой морской офицер и инженер, много лет служил стране, будучи атташе в Токио, Пекине и Лондоне, и в конце этого года должен стать первым официальным главой ВМС, Chefen för Marinen. Де Шампс больше не будет просто членом адмиралтейства, он будет отвечать за руководство военно-морским флотом в предстоящие времена, выбирая из трех различных путей в будущее."
SWE_navy_baltic_sea: "План по Балтийскому морю"
SWE_navy_baltic_sea_desc: "План по Балтийскому морю - это план, который поддерживает адмиралтейство и который предусматривает создание и структурирование военно-морского флота с учетом условий Швеции, при этом единственной целью является защита суверенитета Швеции в Балтийском море. Хотя Россия сейчас разбита, это не будет длиться вечно, и хотя де Шампс испытывает сильную симпатию к Германии, он знает, что кайзер в лучшем случае может быть непостоянен, а Берлин не имеет никаких проблем с участием в «дипломатии канонерок». Благодаря расширению береговой обороны, более точному картированию нелепого количества островов и отмелей, окружающих Швецию, а также созданию и закупке специализированных эсминцев, Швеция, несомненно, сможет в ближайшие годы превзойти свои возможности!"
SWE_navy_trade_disrupt: "План на случай сбоев в торговле"
SWE_navy_trade_disrupt_desc: "Хотя шведский флот является старым и славным, он, тем не менее, полон уроков прошлого. В эпоху парусного флота, когда Швеция ещё серьезно участвовала в великой игре империй, пытаясь создать как можно более крупный флот, победы были мимолетными, а катастрофы - масштабными. Корабль «Васа» трагически затонул, не успев принести никакой пользы, «Кронан», один из крупнейших кораблей в мире на момент спуска на воду в 1668 году, взорвался в катастрофическом огненном шаре, а во время Великой Северной войны шведский флот, несмотря на свою храбрость, сумел защитить только метрополию, а не свои владения за её пределами. Тем не менее, в этом есть и свои плюсы.\n\nНесмотря на катастрофы с «Васа» и «Кронаном», шведский флот смог восстановиться, несмотря на все препятствия, и в период, когда шведский флот находился под давлением Великой Северной войны, шведский капер Ларс Гатенхильм оказался настолько успешным в захвате кораблей датских купцов, что ненавистные датчане смогли ощутить на себе последствия своей войны. Очевидно, что из истории можно извлечь уроки, и Шарлю де Шампу предлагается вариант, который ему самому не слишком нравится: преобразование шведского флота в ограниченные надводные силы с значительным подводным компонентом. Даже если Швеция утратит господство на Балтийском море, шведские подводные лодки смогут топить корабли направо и налево, даже выходя в Атлантический океан и за его пределы, чтобы нанести ещё больший ущерб любому агрессору."
SWE_navy_old: "Взгляд в прошлое"
SWE_navy_old_desc: "Шведский флот уже давно не может на равных соперничать со своими друзьями и соперниками на континенте, но это не значит, что это невозможно. Хотя это дорого и требует тщательного планирования, Швеция вполне может построить хотя бы несколько современных линкоров, а может быть, даже авианосец, если будет политическая воля. Человеческие ресурсы есть, квалифицированные офицеры готовы к этому, а сухие доки достаточно велики, чтобы вместить один или два бронированных гиганта. Старые Pansarskepp будут казаться карликами по сравнению с проектами, придуманными адмиралтейством, поскольку де Шампс обращается к истории, чтобы сформировать шведский флот будущего. Поскольку российский флот все ещё не оправился от катастрофической гражданской войны, вполне возможно, что Швеция сможет добиться морского превосходства над заблудшим потомством Рюрика."
SWE_navy_baltic_destroyers: "Эсминцы для мелководья"
SWE_navy_baltic_destroyers_desc: "Учитывая условия Швеции, такие как слишком большое количество островов и отмелей, не говоря уже о том, что Балтийское море является известным своим суровым климатом океаном, вполне справедливо, что шведские эсминцы строятся в соответствии с новым шведским стандартом. С небольшой осадкой и акцентом на максимально возможную скорость, оснащенные максимально возможным количеством торпед, шведский флот продемонстрирует любой высокомерной великой державе взрывные качества шведского TNT!"
SWE_navy_air_over_sea: "Сотрудничество с ВВС"
SWE_navy_air_over_sea_desc: "Шведский флот является домом для многих любимых проектов, одним из которых является HMS Gotland. Готаланд, крейсер-самолетоносец, действует как глаза и уши флота, путешествуя по всему миру и посещая порты по всему миру, не говоря уже о том, что он всегда играет ведущую роль в разведке при любых крупных маневрах на родине. Считаясь объединяющим звеном между ВВС и ВМС, пилоты на этом корабле проходят обучение в ВВС, но подчиняются ВМС, в отличие от других стран, где ВМС приходится тратить дополнительное время на управление горсткой пилотов гидросамолетов. Хотя шведский флот по-прежнему огорчен лишением собственной авиации, сегодня шведские ВВС охраняют небо, а шведский флот - моря, поддерживая идеальные отношения. Очевидно, что эти отношения необходимо расширять."
SWE_navy_sub_attack: "Совершенствование подводной войны"
SWE_navy_sub_attack_desc: "Неограниченная подводная война может рассматриваться как варварская и ненужно жестокая в военное время, но только страны, прошедшие через настоящую войну, могут понять необходимость тотальной войны. Если бы Гатенхильму не было предоставлено звание капера, датчане не только беспрепятственно бы разгулялись вокруг осажденного шведского флота, но и, как и во время последней великой европейской войны, немецкие подводные лодки сыграли бы ключевую роль в вынуждении ценных кораблей Королевского флота патрулировать бесконечные океаны, уводя их от иначе железной блокады вокруг Германии. В случае войны нельзя ожидать, что Швеция будет полностью следовать правилам призового права, и каждый командир подводной лодки должен понимать, что важен тоннаж, а не героизм."
SWE_navy_battle_cruiser: "Крейсеры основной линии"
SWE_navy_battle_cruiser_desc: "Хотя идея о том, что шведский флот будет иметь массивные дредноуты или полноценные линейные корабли, все ещё считается немного нелепой в коридорах адмиралтейства, крейсеры-боевые корабли могут оказаться вполне жизнеспособными. Обладая вооружением линейного корабля и скоростью крейсера, крейсеры-боевые корабли (Slagkryssare) могут стать подходящим инструментом для возрождающегося шведского флота."
SWE_navy_battle_ship: "Восстановление великого флота"
SWE_navy_battle_ship_desc: "Способность проецировать силу по всему миру - задача сложная, но вполне выполнимая. Вложив время в расширение резерва небольших вспомогательных кораблей и участвуя в длительных экспедициях за рубежом, со временем шведский флот приобретет достаточный опыт, чтобы вновь проецировать свою силу за пределы Балтики, возможно, даже в Америку или Африку. Имея достаточное количество кораблей хорошей и надежной конструкции, а также амбициозных офицеров и матросов, для шведского флота нет ничего невозможного!"
SWE_navy_coastal_fortification: "Укрепить прибрежные цели"
SWE_navy_coastal_fortification_desc: "Гётеборг, Карлскруна, Стокгольм. Что их всех объединяет? Порты, важная инфраструктура для военно-морского флота в целом и значительные укрепления. Благодаря расширению этих фортов и модернизации слишком старых батарей военно-морской флот обеспечит, чтобы катастрофа, подобная той, что произошла в Порт-Артуре, не повторилась здесь."
SWE_navy_further_doctrine: "Инновации военно-морской доктрины"
SWE_navy_further_doctrine_desc: "Шведский флот всегда имел хорошие связи за рубежом, будь то с Лондоном, Парижем, Вашингтоном или Амстердамом. Углубляя сотрудничество с друзьями и партнерами, шведский флот будет оставаться в курсе основных событий. Кроме того, разработанные технологии будут передаваться союзникам, при условии, что они сделают то же самое в ответ. С друзьями все возможно!"
SWE_navy_encourage_citizen_funding: "Программа финансирования ВМФ"
SWE_navy_encourage_citizen_funding_desc: "Когда в 1910 году правительство приняло неразумное решение не расширять военно-морской флот, это не только привело к тому, что правительство уступило давлению королевской семьи и общественности, но и способствовало укоренению идеи, что народ сам несет ответственность за финансирование обороны страны. Так же, как в 1912 году народ собрал деньги на создание военного корабля Sverige, шведский народ должен вновь сплотиться вокруг флага, чтобы помочь финансировать расширение военно-морского флота."
SWE_navy_carrier_experiment: "Эксперименты с авианосцами"
SWE_navy_carrier_experiment_desc: "HMS Gotland - хороший крейсер для перевозки самолетов, но шведский флот может добиться гораздо большего. Вдохновляясь как синдикалистами из UOB, так и немецкими проектами, более близкими по духу, шведский флот должен и будет получить авианосец скорее раньше, чем позже. Хотя это будет стоить дорого и потребует много времени, и несмотря на то, что критики утверждают, что он бесполезен в таком небольшом океане, как Балтийское море, это всего лишь скептики, которых можно игнорировать. Линейные корабли были доказательством престижа в преддверии Первой мировой войны. Сейчас настала эра авианосцев."
SWE_navy_large_and_big: "Крупные корабли и крупные пушки"
SWE_navy_large_and_big_desc: "Авианосцы - это для щеголей и слабаков, их используют англичане как механизм защиты после своего провального управления в Ютландии, обвиняя свои собственные линкоры в неудаче своего командного состава. Смешно. Линкоры большие, имеют массивные орудия, тяжело бронированы и подходят только для мужественных воинственных народов. Пусть англичане играют со своими авианосцами, а европейцы - со своими линкорами!"
SWE_navy_henrik_trolle: "Флот подобному Хенрику Тролле"
SWE_navy_henrik_trolle_desc: "Хенрик аф Тролле, пожалуй, один из величайших героев в истории шведского флота, хотя он не дожил до своего величайшего достижения. Близкий доверенный человек Густава III, тесно сотрудничавший с другим гением Фредриком Хенриком аф Чапманом, аф Тролле неустанно работал над тем, чтобы шведский флот и шведский архипелажный флот могли должным образом конкурировать с русскими на востоке. Уделяя особое внимание более легким кораблям и ставя во главу угла атаку, аф Тролле обучал своих людей и подчиненных быть профессиональными моряками, а не просто солдатами, временно размещенными на кораблях. Превратив флот в престижный элемент короны, именно благодаря его реформам и амбициям Швеция смогла сразиться с русскими в битве при Свенсксунде, крупнейшем морском сражении в Балтийском море и одном из крупнейших сражений по количеству кораблей в истории человечества." 


### Second term election focuses ###

SWE_second_election: "Очередные национальные выборы"
SWE_second_election_desc: "Шведский народ вновь приходит на избирательные участки, и их результат в очередной раз определит будущее страны."

## SOCDEM 2nd term ##

SWE_social_dem_second: "Социал-демократы обеспечивают победу"
SWE_social_dem_second_desc: "Социал-демократы получают достаточное большинство голосов, чтобы выиграть выборы."

SWE_folkhemmet_improve: "Отмена Статаре"
SWE_folkhemmet_improve_desc: "С помощью Шведского профсоюза сельскохозяйственных рабочих ужасное обращение с безземельными крестьянами будет прекращено. С помощью требований и соглашений, сотрудничества и принуждения землевладельцы будут вынуждены, как и любые другие работодатели, платить своим работникам твердой валютой, а не временными землями или арендованным скотом. Наконец-то наступает конец Статаре."

SWE_Hjalmar_Branting_ideology: "Идеи Хьялмара Брантинга"
SWE_Hjalmar_Branting_ideology_desc: "Первый из величайших социал-демократических умов Швеции, Хьялмар Брантинг, первый социал-демократический премьер-министр Швеции. Его усилия и работа по стабилизации Швеции и подготовке её к процветанию на долгие годы очевидны даже сейчас в обществе. Мы будем праздновать его великие дела, обещая продолжить его наследие."

SWE_marx_and_key: "Марксизм и кейнсианство"
SWE_marx_and_key_desc: "В то время как изначально, при Хьялмаре Брантинге, социал-демократическая партия придерживалась прагматичного взгляда на марксизм, будучи готовой сотрудничать как с центристами, так и с либералами, доминирование Германии в Европе привело партию к кейнсианской экономике. Однако некоторые члены партии требуют вернуться к нашим марксистским корням, к черту Германию."

SWE_social_rikstag_dom: "Господство социалистической партии"
SWE_social_rikstag_dom_desc: "Приняв решение вернуться к прагматичному марксизму, партия теперь продвигает свою социальную политику и политику национализации. Хотя многие критики и оппозиция видят в этом прямую связь с Интернационалом, мы осуждаем такой радикализм."

SWE_market_rikstag_dom: "Господство умеренной партии"
SWE_market_rikstag_dom_desc: "Партия высказалась, и победило умеренное кейнсианское крыло. Партия сохранит свой номинальный капитализм в экономике, одновременно поддерживая социал-демократические ценности, соединяя старый марксизм и деньги будущего."

SWE_people_over_politics: "Люди превыше всего"
SWE_people_over_politics_desc: "В политике одно можно сказать наверняка: большинство людей либо презирают своих политиков, либо не понимают их, особенно когда прогресс идет медленно. Мы будем ставить интересы народа Швеции выше личных политических интересов, выходя за рамки наших коалиций и планов в пользу того, что лучше для каждого человека в Швеции."



## SOCLIB ##

SWE_social_liberal_win: "Bondeförbundet побеждает на выборах"
SWE_social_liberal_win_desc: "В результате совершенно неожиданного поворота событий, Bondeförbundet выиграл выборы!"
SWE_environment_help: "Охранить окружающую среду"
SWE_environment_help_desc: "Хотя каждой стране необходима промышленность для выживания в современном мире, мы не можем позволить бесстыдной индустриализации разрушить то, что у нас есть от природы. Подписание закона, который определит, какие территории могут и не могут подвергаться застройке, с целью защиты как шведской сельской местности, так и её животных."
SWE_europe_agrarian: "Европейская аграрная модель"
SWE_europe_agrarian_desc: "В истории Европы фермеры являются основой всего континента. Имея богатую и глубокую историю сельского хозяйства и фермерства как в Европе, так и в самой Швеции, мы должны быть готовы принять эти связи. Мы должны и дальше финансировать развитие нашего сельского хозяйства, потому что нация движется вперед благодаря своему желудку!"
SWE_farmer_focus: "Фермеры прежде всего"
SWE_farmer_focus_desc: "Несмотря на все преимущества, которые дают фабрики, сталелитейные заводы и заводы по производству красок, ни один из них не может работать без продовольствия. Наши фермеры являются чрезвычайно важной частью нашего общества, независимо от того, помним мы об этом или нет. Таким образом, государственные стимулы и финансирование ещё больше сблизят их с нашей партией и значительно расширят отрасль."
SWE_centre_full: "Истинное центристское правительство"
SWE_centre_full_desc: "Сблизившись с Народной партией, мы сможем избежать жестких мер социал-демократов и не попасть в ловушку ненужного вмешательства и чрезмерной индустриализации. Вместо этого давайте полностью поддержим центристское правительство!"
SWE_centre_left: "Урожай и розы"
SWE_centre_left_desc: "Социал-демократы являются нашими ближайшими союзниками в Риксдаге, обеспечивая нам необходимые места для достижения наших целей. Мы должны продолжать плодотворное сотрудничество между нашими объединенными силами на благо всех рабочих и крестьян."
SWE_agricultural_future: "Будущее развития"
SWE_agricultural_future_desc: "Мир постоянно меняется, о чем свидетельствуют массовые потрясения и преобразования в обществах за последние десятилетия. Как нация, мы должны быть готовы к будущему, каким бы оно ни было. Давайте планировать наше развитие таким образом, чтобы мы могли подготовиться к воздействию времени."



## MARLIB 2nd ##

SWE_market_liberal_win: "Folkpartiet смотрит в будущее"
SWE_market_liberal_win_desc: "Folpartiet победила на выборах и полна решимости воплотить в жизнь свою классическую либеральную мечту в Швеции!"
SWE_finnish_rights: "Финские меры защиты и законы"
SWE_finnish_rights_desc: "Одной из крупнейших меньшинств в Швеции являются финны. Поддерживая с ними хорошие отношения и по возможности помогая им, мы можем надеяться на развитие промышленности в этих регионах."
SWE_grass_roots_prot: "Независимость от Шведской церкви"
SWE_grass_roots_prot_desc: "Очевидно, что Svenska Kyrkan, хотя и является в некоторых отношениях достойным уважения государственным учреждением, во многом способствовала сдерживанию роста подлинной веры среди нашего населения. Мы должны стремиться дать нашему населению возможность активно участвовать в более широком спектре независимых евангелическо-лютеранских кругов, если мы хотим укрепить наш дух."
SWE_nordic_wealth: "Обилие богатств Северных стран"
SWE_nordic_wealth_desc: "Северная Европа - это регион с поистине неиспользованными богатствами, жидкое золото скрывается под её замерзшими равнинами и просто ждет, когда его обнаружат! Дальнейшие инвестиции в горнодобывающую промышленность позволят нам надеяться на открытие множества новых полезных ископаемых, скрытых под землей."
SWE_market_centre: "Истинное либеральное правительство"
SWE_market_centre_desc: "Фермерская лига представляет левую часть политического центра, и объединение с ней является естественным и единственным путем к созданию по-настоящему умеренного центристского правительства!"
SWE_market_conserv: "Классическая правая коалиция"
SWE_market_conserv_desc: "Консерваторы по-прежнему занимают прочное положение в Риксдаге, и поскольку некоторые из наших политических курсов совпадают с их интересами, вполне естественно сформировать с ними коалицию."
SWE_Anders_Chydenius: "Ратификация идей Андерса Чюдениуса"
SWE_Anders_Chydenius_desc: "Андерс Чиденюс был и остается отцом-основателем шведского либерализма и умеренности, образцовым гражданином и священником. Его приверженность делу искоренения пыток и деспотизма в Швеции проложила путь к превращению страны в образцовую демократию, и без его усилий мы были бы далеко не там, где находимся сейчас."



## SOCCON ##

SWE_social_conservative_win: "Консерваторы одерживают победу"
SWE_social_conservative_win_desc: "Консерваторы одержали победу в Риксдаге, готовые трудиться и работать на благо Швеции, чтобы обеспечить ей традиционное и верное будущее."
SWE_landman_legacy: "Наследие Линдмана закреплено"
SWE_landman_legacy_desc: "Арвид Линдман - это все, чем должен быть образцовый консерватор в Швеции: умный, добрый, но решительный, его замечательные государственные качества помогли ввести всеобщее избирательное право, расширить доступ к государственному образованию и заслужили ему уважение даже со стороны других политиков из противоположного лагеря. Хотя его смерть является огромной утратой для нации, его наследие будет жить, и все будущие премьер-министры будут следовать его примеру!"
SWE_regulate_agriculture: "Жесткое регулирование сельского хозяйства"
SWE_regulate_agriculture_desc: "Жаль, что многие фермы и сельскохозяйственные предприятия в Швеции остаются отсталыми, растрачивая потенциал земли, на которой они трудятся. В такие времена необходимо вмешательство правительства, мы должны проложить себе путь и обеспечить максимально эффективное использование сельскохозяйственных земель."
SWE_further_central: "Необходимая централизация правительства"
SWE_further_central_desc: "В каждой провинции есть свой совет, а каждый совет - это бюрократия и пустая трата времени. Централизуя ключевые области по всей стране, мы сможем сократить расходы и растрачиваемый потенциал."
SWE_conservative_radicals: "Сдвиг вправо"
SWE_conservative_radicals_desc: "В периоды политических перемен лучше всего следовать течению. Растущая популярность крайне правых сил не является секретом, их яркие и непристойные предложения быстро покорили многих правых, и только объединившись с такими силами, мы можем надеяться сдержать их амбиции."
SWE_conservative_majority: "Традиции и честь"
SWE_conservative_majority_desc: "В дискуссиях и дебатах есть честь, такие традиции должны быть сохранены, в то время как радикалы пытаются заставить замолчать своих оппонентов, мы знаем, что хорошая дискуссия больше способствует убеждению общественности."
SWE_against_free_market_thought: "Свержение идеи свободного рынка"
SWE_against_free_market_thought_desc: "Нельзя допускать продолжения безумия, которое поддерживают некоторые сторонники полностью свободного рынка, его нерегулируемость и безразличие к отдельной нации не имеют места в шведском обществе."


## NAT lEAGUE ##

SWE_national_league_win: "Рождение Национальной лиги"
SWE_national_league_win_desc: "В результате шокирующего поворота событий мы, Национальная лига, выиграли выборы, обойдя как умеренных консерваторов, так и левых, и теперь Швеция находится у нас на ладони!"
SWE_bully_opposition: "Запугать мерзкую оппозицию"
SWE_bully_opposition_desc: "Оппозиция по-прежнему громко заявляет о себе, блокируя наши предложения на каждом шагу, независимо от того, какие выгоды они могут принести. Поэтому мы должны найти способ заглушить их, чтобы показать нации лицемерие таких людей."
SWE_dagsposten: "Газета о национальной политике и культуре"
SWE_dagsposten_desc: "Dagsposten, или Газета национальной политики и культуры, - это конгломерат, состоящий из наших самых фундаментальных убеждений как партии, и теперь, находясь у власти, мы можем распространять его по всей стране, чтобы все могли его читать."
SWE_break_syndicalism: "Сокрушить синдикалистскую угрозу"
SWE_break_syndicalism_desc: "Синдикализм, социализм, умеренный левый радикализм - в какой бы форме он ни проявлялся, суть остается прежней. Это гнусная антинациональная идеология, нацеленная на уничтожение каждой нации, которую она пытается поглотить. Мы должны напомнить общественности об этой угрозе и положить ей конец раз и навсегда."
SWE_european_social_union: "Поддержать европейское дело"
SWE_european_social_union_desc: "Наша цель, наше предназначение - по-настоящему единая Европа. Великая континентальная нация, посвятившая себя благополучию Европы и национализму - мы будем и дальше поддерживать эту идею!"
SWE_nordic_radicalism: "Бастион северного национализма"
SWE_nordic_radicalism_desc: "Северные народы имеют долгую историю, переплетенную между собой: с жестокостью викингов, нашим совместным крещением, мы являемся единым народом. Мы будем распространять наши ценности среди наших северных соседей, несмотря на любые претензии, которые они могут иметь."
SWE_against_all_odds: "Бросить вызов судьбе"
SWE_against_all_odds_desc: "Мы каким-то образом преодолели все препятствия: изначально являясь отколовшейся молодежной группой от консерваторов Линдмана, мы сформировали свою собственную партию и теперь доминируем в Риксдаге. Три раза «ура» королю и нации!"


