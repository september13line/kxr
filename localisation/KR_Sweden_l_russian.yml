SWE_revolution_building_decisions_desc: "«Folkhemmet», или «Народный дом», изначально был планом, разработанным бывшей социал-демократической партией. Этот план был направлен на распространение по всей стране услуг, которые правительство считало жизненно важными, таких как инфраструктура, здравоохранение и доступ к другим важным ресурсам. Однако теперь, под нашим новым красным знаменем, бывший капиталистически ориентированный Фолькхеммет будет преобразован в аппарат, полностью посвященный защите интересов рабочих!"

