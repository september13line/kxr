### Military Events ###

swemil.9999.t: "Глаза в темноте"
swemil.9999.d: "К сожалению, многие революционеры по-прежнему ведут подпольную деятельность в Швеции вместе со своими союзниками из международных организаций. В настоящее время в Швеции нет официального разведывательного агентства, ближе всего к нему по функциям является Statspolisen (государственная полиция), однако её полномочия чрезвычайно ограничены, а финансирование недостаточно. Учитывая это, наше новое правительство запланировало значительное расширение этого подразделения и создание официального разведывательного агентства под названием «Генеральная служба безопасности». Это позволит нам отслеживать телефонные звонки и выявлять диссидентов и революционеров, которые все ещё скрываются в Швеции. Хотя это может быть непопулярно среди большинства граждан, особенно тех, кто не признает наше правительство, однако, когда на карту поставлена национальная безопасность, необходимо принять все меры предосторожности."
swemil.9999.a: "Мы уничтожим всех диссидентов!"

swemil.8888.t: "Трудоустройство и служба"
swemil.8888.d: "Одной из проблем, которые сегодня беспокоят шведское общество, является высокий уровень безработицы среди молодежи, и армия, естественно, подходит для решения этой проблемы. Хотя призыв на военную службу считается в Швеции нормальным явлением, не все молодые шведы пригодны для ношения оружия, поскольку либо сомневаются в лояльности к новому порядку вещей, либо просто не желают рисковать своей жизнью в бою. Решением проблемы является призыв этих людей на военную службу, но вместо винтовки они получают лопату и на время службы в армии будут работать по всей стране."
swemil.8888.a: "Пайки скудны, но это лучше, чем голодать!"

swemil.0.t: "Убить короля"
swemil.0.d: "После смерти Пер Альбина Ханссона в результате военного переворота было лишь вопросом времени, когда социалисты нанесут ответный удар. И они его нанесли.\n\nНе имея возможности вести открытую борьбу с правительством, радикалы, связанные с Парижской кликой, ушли в подполье, совершая террористические акты против изолированных гарнизонов, нападая на членов бывшей королевской семьи и ввозя из-за границы тонны оружия. Несмотря на то, что армия изо всех сил пытается взять ситуацию под контроль, более радикальные группы, такие как боевики под руководством Экстрёма, вышли из подполья, чтобы наконец сразиться со своими красными врагами, используя свой опыт, полученный в ходе войны в Финляндии и Эстонии, для обнаружения и уничтожения очагов сопротивления. Несмотря на это, сегодня радикалы смогли нанести удар по самому сердцу нации. В своем замке в Стокгольмском архипелаге Густав V и его семья с большой тревогой и беспокойством наблюдали за событиями на материке. Не только правительство было свергнуто армией, но и поступали сообщения о насилии и репрессиях, не говоря уже о террористических актах. Тем не менее, на острове Тулльгарн, любимом летнем месте отдыха Густава V, они считали себя в достаточной безопасности. Части армии заняли позиции вокруг резиденции, чтобы защитить семью, и домочадцы не могли вмешиваться или действовать, вынужденные ждать на острове, пока хаос на материке не уляжется. Именно в этой ситуации бывший король, теперь называющий себя просто «мистер Г.», вышел из-под контроля.\n\nНе желая сидеть взаперти в своей любимой резиденции, он вышел, чтобы осмотреть свои лодки, когда появился диссидент-солдат и застрелил почти 80-летнего бывшего монарха. Хотя его задержали, прежде чем он смог покончить с собой, обещание ужасного наказания за его преступление мало утешает теперь скорбящую семью."
swemil.0.a: "Подарите этому современному Анккарстрёму такую же судьбу."

swemil.1.t: "Разбитые надежды и разрушенные мечты"
swemil.1.d: "Ранним утром Хельге Юнг в сопровождении генералов Арчибальда Дугласа и Гёсты Эренсверда объявил по национальному радио о роспуске предыдущего правительства, сославшись на проникновение антинациональных сил как в SAP, так и в SSV. Заявив, что в Риксдаг проникли агенты синдикалистов, Юнг заявил, что он просто был вынужден распустить правительство силой, при этом нынешний аппарат остался без изменений. Он призвал государственных служащих вернуться на работу на следующее утро в интересах национальной безопасности, а также назвал отмену монархии антидемократической.\n\nНация ошеломлена. Одновременно с радиообращением солдаты и полиция, а также, по слухам, боевая организация Мартина Экстрёма, приступили к штурму основных социалистических офисов по всей стране, даже «LO-Borgen» Landsorganisationen был штурмован вооруженными пистолетами буржуа. За один день, с гибелью Пер Альбина Ханссона и уходом руководства SSV в подполье, мечта о Шведской Социалистической Республике кажется более мертвой, чем когда-либо."
swemil.1.a: "Так близко, и yet so far."

swemil.2.t: "Смыть красных"
swemil.2.d: "Хотя три крупных города - Стокгольм, Гётеборг и Мальмё - были захвачены и умиротворены в самом начале военного переворота, в сельской местности и на островах разгоралось красное сопротивление. После того как местному гарнизону не удалось подавить социалистическую агитацию на Готланде, в стенах Висбю была провозглашена недолговечная коммуна, возглавляемая группой мятежных моряков. Провозгласив «Рабочую коммуну Готланда», этот странный и недолговечный эксперимент по прямой социалистической деятельности был подавлен военными кораблями шведского флота. На севере, в окрестностях Паялы и Лулео, Мартин Экстрём использует свой опыт, полученный во время гражданской войны в Финляндии, сжигая деревни и терроризируя восставшее население, чтобы заставить его подчиниться.\n\nПо всей стране документируются и транслируются за границу сцены белого террора, показывающие, что якобы мирный военный переворот на самом деле является результатом десятилетий накопившегося гнева, наконец вырвавшегося наружу. Альф Мейерхоффер, офицер армии и избранный политик, связанный с Эльмо Линдхольмом, воспользовался хаосом, чтобы воссоздать боевую организацию, когда-то запрещенную Арвидом Линдманом, и теперь банды вооруженных головорезов, вдохновленные АФ, бродят по улицам и деревням, выискивая даже малейшие признаки красного или даже розового цвета. Между тем, Мейерхоффер - не единственный, кто воспользовался гражданской войной для укрепления своей власти. Карл Беннедич, связанный с покойным королем Густавом V и правым исследователем Свеном Хедином, привлек к активной деятельности своего сына и офицера Кэрола Беннедича, который создал отдельную сеть информаторов и агентов для отслеживания оставшихся социалистических элементов."
swemil.2.a: "Грязная работа."

swemil.3.t: "Обязанность работать, обязанность перед нацией"
swemil.3.d: "Многие из тех, кто сражался против нас, были рабочими и мелкими фермерами, и из-за этого многие из некогда оживленных фабрик, которые обеспечивали работу основных отраслей промышленности Швеции, теперь простаивают. Эту ситуацию необходимо исправить и разработать обширный план, но хунта Юнга уже приступила к действиям. Солдаты и военная полиция помогают нынешним правоохранительным органам в борьбе с диссидентскими рабочими и предприятиями, которые по-прежнему отказываются признавать легитимность нашего правления. Хотя это и считается чрезмерным и жестким для всего мира, стабильность необходима после провала социалистического правительства, и только военные могут её обеспечить."
swemil.3.a: "Оружие во имя труда."

swemil.4.t: "Загадка короны"
swemil.4.d: "Хотя хунта изначально намеревалась вернуть Густава V на трон, убийство его величества приостановило всю эту затею. Пока убийца не был наказан достаточно, чтобы быть освобожденным от своей смертной казни, Хельге Юнг, Арчибальд Дуглас и Гёста Эренсверд обсуждают между собой, что делать дальше. Восстановят ли они монархию, институт, существовавший в Швеции ещё до образования самой страны? Или же они начнут новую страницу и пойдут в будущее с более современной системой, управляемой армией?"
swemil.4.a: "Слишком многое изменилось, сохраним наш нынешний контроль!"
swemil.4.b: "Объявить о назначении нового короля!"

swemil.555.t: "Кровоточащее сердце и молодой ум"
swemil.555.d: "Теперь, когда красная угроза изгнана из залов Стокгольма, а синдикалистский эксперимент раздавлен под сапогом патриотического порядка, нация обращается к своему прошлому, чтобы обеспечить свое будущее. Монархия, без церемоний отвергнутая предательским синдикалистским режимом, подражавшим Парижу, будет восстановлена. Это решение, принятое Высшим командованием, знаменует возвращение к законным традициям Швеции.\n\nОднако трон не может оставаться пустым. Необходимо выбрать монарха.\n\nМожно было бы ожидать, что наследник престола, принц Оскар Адольф, старший сын убитого Густава V, вернет себе свое право по рождению, но, к сожалению, такие надежды тщетны. Оскар Адольф, опечаленный смертью отца и последовавшим за ней хаосом, вместо этого предложил, чтобы его собственный сын, Густав Адольф, был коронован вместо него, а бывший наследный принц стал его наставником.\n\nТаким образом, внимание хунты обратилось к его сыну, принцу Густафу Адольфу, герцогу Вестерботтенскому. Густаф Адольф, военный, опытный фехтовальщик и наездник, уже несколько лет является активной силой в армии, внеся свой вклад в разработку приказа о тотальной обороне. Имея связи с английской королевской семьей и преисполненный патриотическим рвением, Густав Адольф верит в мировой крестовый поход против синдикализма, хотя и критикует жестокость Мартина Экстрёма и Мейерхоффера.\n\nЕстественно, не все в вооруженных силах поддерживают молодого независимого герцога. Появилось второе имя - граф Фольке Бернадот из Висборга, человек благородного происхождения и дипломатического таланта. Известный своими гуманитарными усилиями и тесными связями в аристократических и международных кругах, Бернадот пользуется уважением среди офицерского корпуса, особенно среди тех, кто не входит в ближний круг хунты. Его умеренные взгляды и опыт позволяют предположить, что он сможет стабилизировать ситуацию в стране и, возможно, вернуть Швецию на мировую арену в дипломатическом плане. Однако он никогда не высказывал решительной поддержки более радикальным националистическим идеалам, тлеющим в тени военного правительства.\n\nВыбор сложный. Один кандидат является символом новой Швеции, лояльным режиму и готовым к национальному возрождению. Другой - опытный лидер, способный залечить раны и узаконить наше правление как внутри страны, так и за рубежом, но потенциально представляющий угрозу идеологической чистоте нашего дела."
swemil.555.a: "Адольф будет коронован законным королем!"
swemil.555.b: "Фольке обладает необходимыми нам знаниями и связями!"

swemil.556.t: "Прокламация Фольке Бернадотта"
swemil.556.d: "В ходе торжественной церемонии в Стокгольмском дворце, а затем перед собравшимся Риксдагом, после чего последовало аналогичное обращение к собравшейся снаружи толпе, новый король, ранее известный только как граф Фольке Бернадотт аф Висборг, принес присягу стране и представил свой королевский девиз, такой же, как и у основателя династии: «Folkets kärlek min belöning» («Любовь народа - моя награда»), выражая благодарность народу, которым он будет править. В соответствии с традицией, созданной Густавом V, Фольке не был коронован, не носит корону, а представляет народу клятву в качестве договора и, в соответствии с светскими временами, не утверждает, что его власть на этой земле исходит от Бога.\n\nВ тяжелые времена и после таких хаотичных событий, как нынешние, вступление на престол широко любимой общественностью личности, безусловно, является поводом для празднования, и действительно, этот день стал национальным праздником. В соответствии с законом и положениями, традициями и ожиданиями, новый король не будет вмешиваться в дела правительства, хотя он по-прежнему имеет возможность сделать это, если того потребуют обстоятельства."
swemil.556.a: "Да здравствует король!"

swemil.557.t: "Фольке Бернадотт аф Висборг" #Shakirah
swemil.557.d: "По мере стабилизации ситуации в Швеции и стремления хунты к возвращению мира и спокойствия, восстановление монархии было ожидаемым, хотя и не неизбежным результатом. Выбрав Фольке Бернадотта аф Висборг в качестве нового наследника, хунта надеется, что его дружелюбие и веселый нрав помогут стабилизировать и объединить королевство.\n\nНесмотря на то, что он был лишен наследства из-за того, что его отец женился на женщине более низкого происхождения, он дружелюбен ко всем, дипломатичен, не слишком амбициозен и пользуется широкой популярностью среди населения в целом. Действительно, хотя он и был лишен наследства, это можно просто списать на счет ещё одного непродуманного шага со стороны прежней правящей династии. Фольке уже учится не называть себя «графом аф Висборгом», титулом, используемым для лишенных наследства шведских королевских особ, и постепенно приспосабливается к своей позиции короля. Более того, Фольке также начинает отстаивать свою независимость от более радикальных членов хунты, таких как Дуглас, намереваясь стать королем с согласия народа, а не без него. Тем не менее, в прошлом ни один король не носил имя Фольке, и поэтому Фольке и его растущий двор должны решить вопрос о его королевском имени. Второй вариант - назвать его в честь его отца и деда, короля Оскара II. Третий вариант - разрушить ожидания и позволить Фольке править под своим собственным именем."
swemil.557.a: "Ура Карлу Фольке XVI!"
swemil.557.b: "Ура Оскару III!"
swemil.557.c: "Новое имя для нового короля, Фольке!"

swemil.5.t: "Коронация Густава VI Адольфа"
swemil.5.d: "В ходе торжественной церемонии в Стокгольмском дворце, а затем в собравшемся Риксдаге, после чего последовало аналогичное провозглашение перед собравшимися снаружи толпами, новый король, ранее известный только как принц Густав Адольф, был коронован как король Густав VI Швеции, став её законным правителем. Провозгласив своим королевским девизом «Folkets väl min högsta lag» («Благо народа - мой высший закон»), Густав VI черпает вдохновение у Карла XIII, приемного отца Карла XIV Йохана, ставя потребности народа превыше всего. Не коронованный и не утверждающий, что его власть исходит от Бога, Густав VI черпает вдохновение у своего деда, надеясь стать современным монархом для современной эпохи. Не намереваясь покидать свою работу в армии, впервые за столетие казалось, что формальный глава армии может стать чем-то большим, чем просто формальным главой. Кайзер Вильгельм II из Германии, а также Эдуард VIII из Канады направили свои поздравления, а тесть Густава VI Чарльз Эдуард также присутствовал на церемонии."
swemil.5.a: "Да здравствует король!"

swemil.6.t: "Правая оппозиция"
swemil.6.d: "После объявления о том, что военное правительство будет поддерживать военное положение и откажется восстановить корону Швеции, перед зданием Риксдага началась небольшая организованная акция протеста. Среди участников - члены ныне распущенных политических партий, представители фермерской партии, народной партии и некоторые члены избирательной лиги. Не имея реальной власти или силы, чтобы свергнуть нынешний режим, протест продемонстрировал разрыв в дружеских отношениях между правой поддержкой и военными, которые когда-то приносили дополнительную поддержку таким партиям, как Избирательная лига. Теперь, когда эти отношения разорваны, вооруженные силы должны полагаться только на себя, что увеличивает шансы на возвращение к нормальной жизни и демократии."
swemil.6.a: "Швеция замерзнет."

swemil.7.t: "Помазание Рикследаре"
swemil.7.d: "С стабилизацией положения в стране под новым военным режимом настало время урегулировать спор о национальном лидерстве. В настоящее время Хельге Юнг остается лидером Швеции, руководя страной с момента военного переворота, свергшего прежнее социалистическое правительство, однако некоторые ставят под сомнение его пригодность для этой должности в будущем. Юнг сам по себе является прежде всего генералом, и если его выберут для продолжения руководства, он, вероятно, удвоит свои усилия по укреплению национальной обороны, милитаризации шведского общества и возвышению армии над всем остальным в Швеции.\n\nС другой стороны, Карл Эренсверд, близкий союзник Юнга и генерал, считается более умеренным в своих взглядах, если он окажется у руля Швеции. Склоняясь в сторону членов Антанты и имея связи с представителями Избирательной лиги в бывшем Риксдаге, он сохранил бы авторитет военных, одновременно вернув многих гражданских политиков из Избирательной лиги и Народной партии.\n\nВ последнем лагере находится Арчибальд Дуглас, считающийся более вовлеченным в политику, чем два других мужчины, известный частыми посещениями националистических клубов и групп, Дуглас придерживается более выраженной точки зрения на шведский национализм. Вместе с Мартином Экстрёмом, другой видной военной фигурой, они возглавляют небольшую группу, известную как Svea Rikes Nationella Samlingsparti (Партия национального единства Шведского королевства), в которой доминируют генералы и представители высшего класса. Группа выступает за шведский экспансионизм и веру в исключительность Швеции. Имея взгляды, не слишком отличающиеся от взглядов Железной гвардии в Румынии, группа в основном оставалась неизвестной и незаметной из-за ограниченной базы поддержки. Теперь, получив шанс на национальное лидерство, группа официально зарегистрировалась как политическая организация, обратившись к лишенным прав консерваторам.\n\nТеперь необходимо сделать выбор, который определит направление развития военного правительства Швеции: железный кулак под руководством военного Юнга? Оливковая ветвь - коалиция армии с бывшей консервативной базой? Или ультранационалистическое военное правительство, проповедующее исключительность Швеции?"
swemil.7.a: "Юнг привел нас до сих пор и будет продолжать это делать!"
swemil.7.b: "Эренсвард, верный союзник Юнга, стабилизирует страну!"
swemil.7.c: "Дуглас имеет средства и волю, чтобы вести нас вперед!"

swemil.8.t: "Партия за национальное единство Швеции"
swemil.8.d: "С Арчибальдом Дугласом и его группой единомышленников-националистов у руля Швеции, они теперь могут приступить к перестройке страны в соответствии со своим видением. Они сосредоточены на таких идеалах, как сохранение Шведской церкви в качестве национальной религии Швеции, приоритет шведов в соседних странах с точки зрения национальной безопасности и экспансии, выражение национального корпоративизма в качестве экономической основы и почти полный контроль над страной.\n\nУже начались новые кампании по набору молодых людей в армию и вспомогательные военизированные формирования, а также работа с старшим поколением в надежде возродить утраченную Шведскую империю. Партия также надеется преобразовать нынешнюю скаутскую организацию в стране, используя её обширную членскую базу для обучения мальчиков физической подготовке и боевым навыкам, а девочек - подготовке к будущему материнству."
swemil.8.a: "Будьте готовы, всегда будьте готовы!"

swemil.9.t: "Гамбит маурасистов"
swemil.9.d: "Внутри собственной партии Дугласа существует множество небольших групп с незначительными различиями в идеологии. Хотя все эти группы присягают на верность Дугласу из-за своей довольно ограниченной поддержки со стороны общественности, одна из таких групп под руководством харизматичного Элмо Линдхольма выступила с предложением. Элмо Линдхольм, возглавляющий собственную группу под названием Sveriges Nationella Förbund, или Шведская национальная федерация, когда-то руководил молодежным движением в рамках Общей избирательной лиги. Однако из-за растущего радикализма молодежи вправо на фоне усиления синдикализма в Европе они были исключены из AV, и была создана новая молодежная организация. Некоторые же остались под руководством Элмо, продолжая следовать его идеалам.\n\nЭти идеалы были сформированы под влиянием его встреч со знаменитым, или печально известным, Шарлем Моррасом и недавно умершим Рудольфом Кьелленом. Эти личности сформировали идеологическую точку зрения Элмо, согласно которой король занимает необходимое место в обществе, в котором действует иерархия, применяется королевский корпоративизм и преобладают антидемократические взгляды.\n\nТеперь, после официальной встречи с Дугласом, он наконец может предложить свой план Рикследаре. Предоставить Элмо должность почетного Рикследаре, позволяя Дугласу сохранить большую часть своего контроля, в обмен на то, что Элмо будет проводить в жизнь больше своей маурасистской политики. Хотя Дуглас мог бы легко сместить этого человека, чтобы сохранить текущий статус-кво, связи Элмо с группами в изгнанном Национальном французском государстве, некоторыми членами североитальянских сепаратистских государств и в Испании могли бы оказаться благоприятными, если бы ему была предоставлена эта должность. В конечном итоге выбор остается за Дугласом, как единственным лидером нации."
swemil.9.a: "Тривиальная группа с тривиальными предложениями - нет."
swemil.9.b: "Органическое государство - это именно то, что нужно Швеции!"

swemil.10.t: "Встреча с Мартином"
swemil.10.d: "Один из ближайших союзников Рикследаре, которого многие считают неофициальным вторым Рикследаре государства, Мартин Экстрём попросил нынешнего Рикследаре о предоставлении ему больше полномочий для дальнейшего подавления остатков красного рака в Швеции. Предоставление ему таких полномочий сделало бы Мартина де-факто Рикследаре Швеции, давая ему почти полный контроль, такой шаг позволил бы Дугласу более внимательно сосредоточиться на своей страсти к военным вопросам, давая своему другу возможность облегчить его бремя. Хотя Мартин не поднимет восстание, если его просьба будет отклонена, поскольку он и Дуглас являются членами одного националистического блока, такой шаг мало изменил бы позицию правительства. В очередной раз, будучи единоличным правителем Швеции, Рикследаре сталкивается с ещё одним вопросом лидерства."
swemil.10.a: "Правило Дугласа остается абсолютным."
swemil.10.b: "Вместе мы ведём!"

swemil.11.t: "Радикализм и ветеринары"
swemil.11.d: "В довольно необычном нарушении этикета в офис Riksledare было доставлено эксцентричное письмо, которое сначала было перехвачено, проверено на наличие химических или взрывчатых веществ и в конечном итоге одобрено военными цензорами внутренней безопасности Riksdag. Автор? Никто иной, как Биргер Фуругорд, имя, почти забытое большинством в политических кругах Стокгольма, за исключением тех, кто помнит маргинальные движения 1920-х годов. Когда-то Будугорд был лидером недолговечного национал-социалистического движения в Швеции, но со временем он ушел в тень и тихо жил провинциальным ветеринаром в Вермланде. Теперь, похоже, Будугорд вернулся на политическую арену в своей типичной неортодоксальной манере. Содержание его письма просто лихорадочное. Фуругард умоляет Рикследаре предоставить ему широкие полномочия, утверждая, что он может объединить общеевропейскую сеть национальных революционеров под руководством Швеции. Он перечисляет странный и тревожный список фигур, таких как Свен Олов Линдхольм, неуловимый шведский радикал; Жозеф Дарнан из французского легиона; Хория Сима из румынской Железной гвардии; даже изгнанный франко-канадский демагог Адриан Аркан. Фуругард считает, что Швеция находится на историческом перепутье и что при правильном идеологическом выравнивании она может стать путеводной звездой нового националистического международного движения.\n\nВ письме смешаны расплывчатые угрозы с обещаниями славы, поддержкой со стороны зарубежных военизированных формирований, тайными легионами, готовыми к восстанию, и утопическим видением возрожденной Европы под шведским контролем. Большинство этих утверждений невозможно проверить, а его риторика граничит с бредом, если не является откровенно опасной.\n\nИ все же в этих бреднях может быть доля правды. Несколько групп, которые он упоминает, существуют на самом деле, и Швеция, изолированная и неуверенная в себе в поствоенном мире, может вскоре нуждаться в союзниках, какими бы неприятными они ни были. Является ли Фуругард просто сумасшедшим чудаком или безумным пророком, предлагающим Швеции место в более мрачной международной перестройке?"
swemil.11.a: "Какой сумасшедший, заприте его."
swemil.11.b: "Национальный международный, легко произносится!"

swemil.12.t: "Начать с чистого листа"
swemil.12.d: "В то время как военизированные формирования и переформированные полицейские силы усердно и без устали выполняли свою работу, избавляясь от анархистов и синдикалистов, многие по-прежнему симпатизируют провалившейся революции. Некоторые даже из бывшей Лиги фермеров и Народной партии выражают недовольство нашим правлением, устраивая небольшие протесты против нашего правительства. Такое прямое противостояние нашему режиму не останется незамеченным и не будет проигнорировано, такие люди должны быть подвергнуты дальнейшему наказанию. Дальнейшее продвижение в сельские деревни и города при поддержке военных быстро разгромит оставшихся социалистов!"
swemil.12.a: "Умеренный социалист все равно остается социалистом!"

swemil.13.t: "Европейское дело"
swemil.13.d: "Во всем мире существует множество партий и групп, которые стремятся к порядку и освобождению от анархии, сеяемой бредовыми революционерами. Многие, как и мы, стремятся к духовному возрождению и возвращению к исторической меритократии силы. Среди этих групп наиболее успешной является Железная гвардия в Румынии, провозгласившая себя «легионерами». Следуя их делу со своим собственным англо-канадским уклоном, французско-канадский Адриен Аркан в Канаде поддерживает возвращение изгнанных монархий на Британские острова. Помогают им в их стремлении разношёрстные ультранационалистические идеологи из изгнанного Национального французского государства, наиболее заметным из которых является знаменитый Шарль Морас.\n\nХотя открытый союз между всеми этими разными членами в настоящее время практически невозможен, тайное соглашение и дружеские отношения между всеми членами могли бы значительно способствовать восстановлению старой Европы."
swemil.13.a: "Континент порядка и стабильности."

swemil.14.t: "Рикследаре"
swemil.14.d: "С падением шведской короны красная волна, прокатившаяся по Риксдагу, оставила неизгладимый след в политическом ландшафте страны. Многовековая монархия, когда-то считавшаяся опорой шведской идентичности, теперь лежит в руинах. её символы были удалены с общественных зданий, а число её бывших сторонников с каждым днем сокращается. В результате этого исторического потрясения наше решение продлить чрезвычайное положение и сохранить прямое управление страной со стороны военных ещё больше усилило антимонархические настроения во всех слоях общества. Теперь новый порядок, далеко не являющийся временной мерой или правилом, стал определяющей главой в истории возрождения нации. То, что когда-то считалось радикальным, теперь с энтузиазмом принимается общественностью. Если раньше люди искали стабильности в королевской семье, то теперь они смотрят на одну единственную фигуру - Рикследаре. Считающийся спасителем Швеции, он является маяком, который провел нацию через самые мрачные часы и привел к новому рассвету.\n\nХотя шепотки о восстановлении монархии все ещё слабо раздаются по всей Швеции, с каждым днем они становятся все тише. Монархические фракции, когда-то ярко выражавшие правые взгляды, теперь расколоты и теряют свое влияние. Корона, когда-то символ вековых традиций, стала реликвией старой эпохи, её значение для народа уменьшилось. ещё предстоит пройти долгий путь, прежде чем память о монархии исчезнет в учебниках истории и музеях, но с каждым шагом вперед Швеция освобождается от этих оков."
swemil.14.a: "Да здравствует Рикследаре!"

swemil.15.t: "Этеризация монархии"
swemil.15.d: "Король является правителем Швеции, однако фактический контроль остается в руках военных, и король не может даже выступить перед публикой без их предварительного одобрения. Это быстро изменило образ короля в глазах общественности с близкой народу фигуры, знакомой с простыми людьми, до почти божественной личности. Такой сдвиг был использован нынешним режимом, усилившим эфирную природу короны как нечто большее, чем просто фигура, сидящая на троне.\n\nЕще далеко до видения монархов, которое можно увидеть в таких странах, как Япония или Российская империя, но со временем шведская монархия станет маяком души Швеции."
swemil.15.a: "Боже, храни короля!"

swemil.16.t: "Порядок восстановлен, Швеция возродилась"
swemil.16.d: "Прошло много лет с тех пор, как красная волна прокатилась по Швеции, погрузив страну в хаос. Социалистическая революция, когда-то провозглашенная новым рассветом, быстро развалилась под тяжестью идеологических раздоров и экономического коллапса. Воцарился беспорядок, и государственная система начала распадаться. Контрреволюция была быстрой и безжалостной: арестовали, расправились и сокрушили тех, кто привел страну к гибели. После свержения старого режима военные обратились к новой фигуре, чтобы возглавить нацию: человеку с железной волей, ярому ультранационалисту, символу дисциплины и обновления.\n\nПод его руководством Швеция была перекована. Излишества прошлого были устранены, экономика стабилизировалась, а вера народа в государство восстановлена. Благодаря радикальным реформам, кампаниям по укреплению национального единства и строгому контролю над инакомыслием началась новая эра, определяемая не классовой борьбой, а силой, порядком и верховенством шведской нации.\n\nТам, где когда-то царил хаос, теперь есть цель. Швеция движется вперед."
swemil.16.a: "Дисциплина. Единство. Возрождение."

swemil.17.t: "Диктат шведского национализма"
swemil.17.d: "До сих пор новое правительство оставалось собранием единомышленников-ультранационалистов, из-за чего возникло много различных идей по поводу экономической политики, расы и экспансии. Вызвав множество дебатов, для Рикследаре настало время сформулировать единую точку зрения, которой будет следовать остальная часть партии. Определение таких позиций будет сопряжено с трудностями из-за текущих изменений и расколов в партии, но чтобы избежать полного восстания внутри, необходимо сформировать единую идеологию."
swemil.17.a: "Сохраняйте военное правление, полное и абсолютное!"
swemil.17.b: "Закрепите корпоративизм, смягчая нашу националистическую мысль!"
swemil.17.c: "Подчеркивайте расовое превосходство и полный контроль государства!"
swemil.17.e: "Необходимо сделать больше для уничтожения наших врагов, усилить безопасность!"

###Jung events###

swemil.18.t: "Официальное создание «Юнгюнты»"
swemil.18.d: "Генерал Хельге Виктор Юнг, созвав высшее военное руководство Швеции, вышел на первое место. Считающийся лицом армии, он своей непревзойденной решимостью защищать Швецию от проблемных революционеров, а также своими быстрыми действиями против них спас Швецию от погружения в красную волну, захлестнувшую Европу. Организовав дивизии и полки, он создал обширные оборонительные аванпосты во всех крупных городах, что дало армии жизненно важную передышку для самоорганизации и борьбы с красными. Считаясь одним из самых решительных людей в генеральском корпусе, он теперь поднялся на вершину иерархии как единственный лидер Швеции. Он объединил правые элементы из бывшей Генеральной избирательной лиги, а также развязал радикальных полувоенных формирований под командованием Дугласа против социалистов и синдикалистов.\n\nУкрепление его лидерства обозначило прямой путь для Швеции, характеризующийся сильным акцентом на национальную оборону, гибкую внешнюю политику и действия против любых красных элементов, пытающихся окружить Швецию. Его правительство получило прозвище «Jungjunta» как от его сторонников, так и от противников, поскольку, похоже, хунта Юнга здесь надолго."
swemil.18.a: "Под руководством Хельге Юнга Швеция будет защищена."

swemil.19.t: "Обезвреживание нелояльных политиков"
swemil.19.d: "С момента создания Хунты Юнгом многие политики бывшего Риксдага выступили против нашего правления. Они организовали протесты у здания бывшего Риксдага, требуя отставки военных и Юнга и продолжения демократических выборов под гражданским правлением. В связи с этим Юнг отдал приказ об аресте всех лиц, зарегистрированных при прежних правительствах, в основном членов Фермерской лиги и демократов Ханссона. Многие члены Народной партии и Всеобщей избирательной лиги молчат о продолжающихся арестах, а наиболее активные из них присоединяются к рядам заключенных.\n\nОднако генерал Мартин Экстрём выдвинул предложение Хельге Юнгу. Он утверждает, что при нынешних темпах арестов большинство бывших политиков смогут бежать из Швеции и сформировать правительства в изгнании в поддерживающих их странах, что подорвет легитимность Хунты как единственного правительства Швеции. В этом случае Экстрём просит расширить его полномочия, обещая более быстрые действия против бывших политиков и более впечатляющие результаты, чем при использовании текущих методов. Время быстро уходит, и Юнг должен принять решение: сохранить текущий курс или дать этому радикалу шанс проявить себя?"
swemil.19.a: "Нет, наши нынешние методы верны."
swemil.19.b: "Цель оправдывает средства."

swemil.20.t: "Дерзкий Чун"
swemil.20.d: "С момента прихода к власти Чун и его нынешняя хунта распространили свое влияние на все слои общества. Уже имея хорошие связи с высшими слоями общества, небольшие партии постепенно заявляют о своей поддержке военного режима, и хорошие пиар-кампании играют здесь ключевую роль. Несмотря на то, что у него есть друзья в СМИ и он лично очень дружелюбен, Чун страдает от того, что его считают немного грубым, немного дерзким и немного самодовольным, и разразился скандал из-за его грубого языка...\n\nНесколько дней назад, на встрече с богатыми светскими людьми, во время которой он беседовал с двумя дамами из высшего общества, он шокировал скромных представителей высших слоев общества. Когда две дамы сделали ряд уничижительных замечаний о третьей, которая отсутствовала на мероприятии, одна из дам спросила Чунга, что он думает об отсутствующей третьей. «Наверняка она не такая уж плохая?» - спросила дама Чунга. «Я не знаю, я не был с ней так близко».\n\nХотя он и объяснил свой комментарий тем, что выпил слишком много джина и слишком мало тоника, очевидно, что Юнг просто не может контролировать себя на публике, и, возможно, ему лучше сделать шаг назад и продолжить управлять хунтой из-за кулис? Если так, то Аксель Гюлленкрок более чем готов внести свои изменения в хунту, позволив Юнгу отойти на второй план в публичной деятельности хунты."
swemil.20.a: "Юнг сократит употребление алкоголя и сохранит контроль."
swemil.20.b: "Аксель Гюлленкрок привнесет свежую струю в хунту."

swemil.21.t: "Искоренение радикалов"
swemil.21.d: "После революции, сметавшей монархию, и последующего прихода к власти социалистов Швеция погрузилась в хаос. Порядок был восстановлен благодаря решительным действиям армии под твердым руководством генерала Хельге Юнга. Однако даже внутри контрреволюционной коалиции остаются расколы.\n\nОдним из первых союзников Юнга был генерал Арчибальд Дуглас, способный командир и ярый противник левых. Однако Дуглас давно симпатизировал ультранационалистическим элементам, которые теперь действуют вне прямого контроля армии. Эти группы, сформированные в военизированные отряды во время гражданских беспорядков, оказались полезными в разгроме последних остатков социалистических ополчений. Но за прошедшие месяцы они стали все более безрассудными, не подчиняются приказам, совершают зверства и угрожают дисциплине восстановленного шведского государства.\n\nТеперь Юнг предпринимает шаги, чтобы восстановить полный контроль. Обратившись к Дугласу, он выдвигает ультиматум: распустить военизированные формирования и интегрировать их членов в официальные вооруженные силы или столкнуться с расформированием силой. Только путем упорядочения командования и устранения недисциплинированных элементов шведская армия и правительство смогут действовать сообща."
swemil.21.a: "Вперед, своенравные сыновья, ещё есть над чем работать."

swemil.22.t: "Манифест Юнга о перевооружении"
swemil.22.d: "Хельге Юнг долгое время убеждал прежнее правительство в необходимости оборонительного перевооружения страны. Он считал, что в скором времени неизбежно произойдет конфликт, сопоставимый по масштабам с мировой войной, и Швеция должна быть готова защищать свои границы от любого врага, как на суше, так и на море. До сих пор призывы Юнга оставались без внимания, но теперь, когда бразды правления страной перешли в его руки, началась реализация масштабного плана оборонительного перевооружения. Вдоль всех границ соседних стран, будь то друзья или враги, возводятся укрепления, а во всех крупных городах начинается строительство важнейших морских фортов. Многим это может показаться чрезмерной мерой, даже паранойей, но Юнг знает, что когда враг нанесет удар, Швеция будет готова."
swemil.22.a: "Вскоре подуют ветры истории."

swemil.23.t: "Бастион северной мощи"
swemil.23.d: "После краха монархии и недолгого правления социалистической республики Швеция оказалась на грани хаоса. На фоне гражданских беспорядков и неопределенности военные под руководством генерала Хельге Юнга поднялись на борьбу за восстановление порядка. Хотя многие ожидали возвращения старой монархии, Юнг опроверг эти ожидания.\n\nВместо восстановления короны он проложил новый путь - путь железной республики, основанной на силе, единстве и дисциплине вооруженных сил. Преодолев испытания внутри страны и за рубежом, он увлек Швецию прочь от раскола и слабости. Теперь вся оппозиция была заглушена или кооптирована, и нация движется вперед как маяк северной силы и порядка. Швеция стоит высоко, не как королевство и не как пролетарская мечта, а как дисциплинированная республика, рожденная в огне и поддерживаемая волей."
swemil.23.a: "Юнг снова сделал Швецию могущественной."

swemil.24.t: "Корона и меч"
swemil.24.d: "После краха монархии и хаоса, вызванного социалистическим режимом, генерал Хельге Юнг возглавил военных в быстром и решительном контрперевороте. Хотя многие ожидали новой военной диктатуры, Юнг выбрал более взвешенный путь. Но за позолоченным троном скрывается истинный центр власти - Юнг и военное руководство. Король правит номинально, но фактически страной управляет армия. Политическая оппозиция была разгромлена, социалистическая угроза устранена, а нация восстановлена под дисциплинированной властью.\n\nШвеция представляет собой не либеральную демократию и не монархию по духу, а военный режим, прикрытый королевской легитимностью."
swemil.24.a: "Король носит корону, но Юнг держит меч."

swemil.25.t: "Шведский военно-промышленный комплекс"
swemil.25.d: "Под решительным руководством генерала Хельге Юнга Швеция быстро преобразовала свою промышленность, превратившись из страны мирного потребления в грозную военную машину. Всего за несколько месяцев наши заводы, которые раньше производили гражданские товары, теперь гудят от производства оружия, боеприпасов и военной техники, укрепляя наше положение настоящей северной державы. Хунта ясно дала понять, что промышленники и бизнесмены, которые поддерживают дело военного возрождения Швеции, будут щедро вознаграждены государственными контрактами, налоговыми льготами и поддержкой со стороны государства. Те, кто сопротивляется или не подчиняется новому порядку, будут подвергнуты быстрым и суровым наказаниям. Лояльность нашей промышленной элиты больше не является добровольной, она обязательна. Те, кто стоит с нами, будут играть важную роль в обеспечении будущего Швеции, а те, кто противостоит нам, будут сметены.\n\nС такими компаниями, как Aktiebolaget Landsverk, возглавляющими это движение, мы теперь обладаем промышленной базой, необходимой для того, чтобы стать неостанавливаемой силой в Европе. Сила нашей нации основана на стали, огневой мощи и непоколебимой решимости народа под знаменем Хунты."
swemil.25.a: "С Aktiebolaget Landsverk и другими мы будем непобедимы."

####authdem events####

swemil.26.t: "Военные милосердия"
swemil.26.d: "С назначением Карла Августа Эренсверда лидером Швеции в армии начался необходимый сдвиг в политике. Некогда сильная военная сила, которую общественность считала безразличной и безжалостной в изгнании «предателей», быстро превращается в силу национального восстановления. Эренсверд запретил жестокое обращение с гражданским населением, сосредоточившись на арестах основных политических целей и террористов, а также привлечении большего числа солдат к восстановлению инфраструктуры. Этот разворот в военной политике, вызвавший недовольство среди более жестких генералов, воодушевил гражданское население и вернул надежду на то, что армия станет силой стабильности, а не оккупационной силой.\n\nХотя до полного признания военного правления общественностью ещё предстоит проделать большую работу, эти первые небольшие шаги будут иметь большое значение."
swemil.26.a: "Обязанность армии - служить народу."

swemil.27.t: "Примирение с умеренными правыми"
swemil.27.d: "Последствия переворота, совершенного армией против революционеров, привели к полному хаосу во многих основных партиях. Многие социал-демократы Ханссона были арестованы или бежали из страны, поскольку их обвинили в свержении монархии. Фермерская лига осталась, приняв в свои ряды некоторых сторонников Ханссона, но находится под пристальным наблюдением военных. В результате остались Народная партия и Общая избирательная лига, которые по-прежнему пользуются значительной поддержкой гражданского населения. Обращение к их бывшим лидерам, особенно к Йёсте Багге, благодаря поддержке Линмана, обеспечит стабильность в Швеции и расширит нашу базу поддержки."
swemil.27.a: "Вместе мы сможем восстановить Швецию."

swemil.28.t: "Телеграмма в Оттаву"
swemil.28.d: "Эренсверд всегда положительно относился к Антанте и её членам, особенно к Виндзорам. Во время хаоса британской революции Эренсверд призывал шведское правительство помочь роялистам, считая их доблестными союзниками. Однако из-за экономических проблем после мировой войны и решимости шведского правительства сохранить нейтралитет ничего не было отправлено. Теперь, стоя у руля страны, Эренсверд приказал отправить телеграмму королю в Оттаву, полную восхищения и желания взаимной помощи. Хотя такая телеграмма не гарантирует союза с Антантой, она откроет путь к дружеским отношениям с ними, если они ответят взаимностью."
swemil.28.a: "Мы можем только надеяться, что они откликнутся."

swemil.29.t: "Восстановление профсоюзов"
swemil.29.d: "Профсоюзы служили важным голосом рабочих, однако они также позволили себе заразиться паразитическими идеологами, которые стремились использовать их в своих целях. После военного переворота против революционеров многие профсоюзы были распущены либо армией, либо радикальными военизированными формированиями. В связи с этим профсоюзы по-прежнему запрещены на всей территории страны, однако Эренсвард теперь разрешил создание новых профсоюзов с некоторыми ограничениями. Профсоюзы должны оставаться прежде всего патриотическими, не допускать захвата власти мятежными или диссидентскими идеологами, а также будет введен армейский надзор за профсоюзами. Такие шаги вызвали некоторую надежду среди шведских рабочих, однако насколько они будут эффективны, ещё предстоит выяснить."
swemil.29.a: "Не дайте себя увлечь харизматичным оратором."

swemil.30.t: "Закат хунты"
swemil.30.d: "После нескольких месяцев упорных переговоров, дипломатических маневров и тонкого давления Йёста Багге добился частичной, но символической победы. Военная хунта, захватившая власть в хаосе, последовавшем за национальным кризисом, согласилась передать ограниченную политическую власть остаткам гражданского правительства, существовавшего до переворота. Багге, который сейчас возглавляет возрожденную Национальную организацию правых, возникшую на руинах старой Всеобщей избирательной лиги, позиционирует себя как стойкий сторонник восстановления конституционного порядка. Хотя [SWE.GetLeader] разрешили выполнять церемониальные функции, реальная власть по-прежнему остается недостижимой и прочно удерживается генералами и их ближайшим окружением.\n\nТем не менее, возможная уступка может стать предварительным поворотным моментом. С помощью осторожной государственной политики и национального единства Багге надеется постепенно восстановить демократические традиции Швеции, которые были уничтожены, но не забыты. Путь впереди неопределен и полон внутренних противоречий, но искры парламентского правления ещё не погасли полностью. Швеция ещё может вернуть свою душу из тисков военной власти."
swemil.30.a: "Пока что мы сохраняем контроль."
swemil.30.b: "Это будет шаг вперед!"

swemil.31.t: "Железная республика"
swemil.31.d: "Было доказано, что даже самым убежденным консерваторам нельзя доверять, поскольку они питают ложную надежду на восстановление старой монархии. Той самой монархии, которая привела нас к этой катастрофе. Никаких репрессий в их отношении не будет, а самых ярых из них необходимо арестовать и предать военному суду за их проступки. Швеция теперь - республика сильных людей, и слабые не должны порочить наш имидж."
swemil.31.a: "Железо закаляет железо."

swemil.32.t: "Под руководством самых верных"
swemil.32.d: "Огонь революции остался лишь угасающим тлеющим углем, погребенным под железной дисциплиной шведских вооруженных сил. После того как Карл Август Эренсверд был избран главнокомандующим страны, он приступил к преобразованию Швеции, поддерживая новый порядок. Под его руководством шведская армия превратилась из жестокой силы, угнетавшей рабочих, в людей, которые изо всех сил старались восстановить Швецию после хаоса. С возвращением стабильности многие полагали, что возвращение к парламентскому правлению гарантировано, однако Эренсверд знает, что угли могут легко разгореться в любой момент. Таким образом, для предотвращения хаоса последних лет необходимо сохранить военное правление. Хотя будущее гражданского правительства остается возможным, оно находится в далеком будущем, и пока Швеция будет управляться железной дисциплиной и единым правительством."
swemil.32.a: "Порядок превыше всего."

swemil.33.t: "Под руководством самых верных"
swemil.33.d: "Огонь революции погас, превратившись в разбросанные угли под пятой шведских вооруженных сил. Под решительным руководством Карла Августа Эренсверда социалистическое сопротивление было подавлено, и на его месте начинает формироваться новая Швеция, основанная на стабильности, единстве и национальной дисциплине.\n\nПри сотрудничестве с монархом Эренсверд смог совершить немыслимое - отвоевать у низких красных незапятнанную нацию, спасенную в последний момент от пропасти. Не намереваясь становиться постоянным диктатором, как Колчак на востоке, Эренсверд заложил основу для возвращения к обычной приличной демократии, теперь, когда уроки революции были поняты всеми. Социальные реформы будут разрешены, но все, что окрашено в слишком красный цвет, все, что слишком радикально, просто никогда больше не будет разрешено в Швеции."
swemil.33.a: "Мы шагаем в ногу, как одно целое!"

###Elmo events###
swemil.34.t: "Шведский интегральный национализм" #requires rewrite
swemil.34.d: "Известно, что молодежные движения, как правило, более радикальны, чем их родительские организации, и в случае старой молодежной лиги AV, Sveriges Nationella Ungdomsförbund (SNU), это вновь подтвердилось. В последние несколько лет, активно противостояя нарастающей волне социализма, SNU радикализировалась, превратившись из просто жестко консервативной организации в нечто совершенно иное. Под руководством нового лидера Элмо Линдхольма SNU была вынуждена прекратить сотрудничество с AV, сменила название на Sveriges Nationella Förbund (Шведская национальная федерация) и стала радикальной силой на правой политической арене. Вытесненная Арвидом Линдманом и Йёстой Багге из-за того, что экстремизм SNU стал неприемлемым, SNF оказалась единственной крайне правой массовой партией в шведской политике, настолько оторванной от идеи демократической системы, либеральных ценностей и социалистической философии, что её можно охарактеризовать только как радикально реакционную, хотя даже такое определение не отражает всей сути SNF. Элмо Линдхольм, доцент по латинскому языку и литературе и крупный интеллектуал, превратил некогда неуправляемое молодежное движение в политически заряженную и воинственную партию вместе со своим прямым подчиненным, армейским офицером Альфом Мейерхоффером, который командует боевой организацией. По провидению или по чистой случайности, благодаря умению или удаче, SNF пришла к власти в Швеции. Стремясь к сильной системе социального обеспечения, активному участию государства в экономике, искоренению любой социалистической деятельности и полному и окончательному прекращению демократической системы, манифест SNF длинный и предусматривает запрет всего, от джаза до смешанных браков. Поскольку армия занята борьбой с социалистической оппозицией, кажется, что единственным человеком, способным сдержать новое правительство, является король, поскольку SNF является ярым монархистом. Король уже был вынужден вмешаться в политику правительства, что Линдхольм, с неохотой или нет, был вынужден принять. Вдохновляясь скорее историей, чем современными политическими мыслителями, единственным политическим мыслителем, в некоторой степени созвучным Элмо, является Шарль Моррас из Национальной Франции, чьи труды вдохновили Линдхольма на организацию своего движения."
swemil.34.a: "Линдхольм? Может быть..."

swemil.35.t: "Очищение движения" #basically getting rid of furugard/von rosen
swemil.35.d: "Национальное возрождение требует жертв, как крови и пота, так и жизней. Пока Мейерхоффер и его боевые группы занимаются социалистическим сопротивлением, необходимо разобраться и с правыми, чтобы Швеция не попала в ловушку невыносимой реакционной политики, основанной на притворстве. Биргер Фуругорд и Эрик фон Розен, когда-то горячие сторонники великого плана Эльмо Линдхольма, в последние недели стали враждебно настроены. Биргер Фуругорд, ветеринар, вдохновленный Железной гвардией в Румынии, хочет превратить Швецию в своего рода легионерский ад, уничтожив при этом шведские традиции и культуру, в интересах некой расистской политики, неприемлемой даже для Линдхольма. Хотя Фуругорд в некоторой степени разделяет антисемитизм Фуругорд, он оказался просто истеричным сумасшедшим, склонным обвинять врагов в принадлежности к племени, доходя до того, что в своей газете Vidi загадочно намекнул, что сам Элмо, а также знаменитый путешественник Свен Хедин, тоже были евреями или, по крайней мере, «смешанного происхождения». Эльмо хочет отстранить Фуругорда от дел по личным причинам, но также и в попытке наладить отношения с королевской семьей. Король [SWE.GetLeader] недвусмысленно дал понять, что он отречется от престола, если Эльмо не сможет сдержать антисемитизм своего движения, и что он просто не будет больше терпеть бесконечные язвительные выпады Фуругорда.\n\nКроме того, необходимо решить вопрос с Эриком фон Розеном, некогда любимцем шведской реакции и главным сторонником Элмо в его ранние годы. Когда Эрик фон Розен не вырезает руны и не пытается переводить древнескандинавские тексты в своем замке, он является ярым сторонником искоренения того, кого он считает «еврейским Христом», в пользу «германского Христа», желая превратить церковь в инструмент для реализации любых прихотей, которые в данный момент приходят в голову фон Розену. В замке Рокельста Эрик приглашает радикальных мыслителей со всей Европы и из-за рубежа, встречается со всеми, от странного англичанина Арнольда Лиза до фигур, связанных с Гугенбергом в Германии, желая сформировать некое тайное объединение, вероятно, не совсем благоприятное для нового правительства. Очевидно, что Эрик фон Розен должен быть устранен, по крайней мере, по мнению Мейерхоффера, второго человека после Элмо. По словам Мейерхоффера, фон Розен пытался сформировать некую оппозицию новому режиму и использовал встречи в своем замке для сбора поддержки из-за рубежа. После экстренного заседания правительство приняло решение арестовать как Фуругорда, так и фон Розена, поместив первого в тюрьму, а второго под домашний арест."
swemil.35.a: "Истеричка и самозванец-волшебник…"

swemil.36.t: "Скрытая рукоять" #event about Elmo not minding freemasonry but keeping it downlow
swemil.36.d: "Чтобы спасти шведскую нацию, тайные общества должны быть уничтожены, запрещены, полностью искоренены. По крайней мере, так гласил план, и хотя это по-прежнему остается одним из основных принципов его движения, Элмо Линдхольм был вынужден пойти на уступки. Несмотря на то, что различные тайные общества были уничтожены, а их члены либо оштрафованы, либо посажены за решетку, пожалуй, самым крупным тайным обществом в Швеции являются масоны, корни которых уходят довольно глубоко, даже слишком глубоко, чтобы Элмо мог их искоренить, не уничтожив при этом собственное движение. Несколько членов его собственной партии являются масонами, его соратник-националист Мартин Экстрём тоже масон, и несколько священников в церкви сами являются масонами. Возможно, хуже всего то, что ходят ужасающие слухи о том, что сам Элмо Линдхольм является масоном, или, возможно, Мейерхоффер тоже, а такие конспирологи, как Фуругард, обвиняют все движение в том, что оно по сути является одним большим иудео-масонским заговором с целью уничтожить страну. Несмотря на это, игнорируя слухи, ясно, что Элмо Линдхольм был вынужден пойти на компромисс в своей позиции по запрету всех тайных обществ... В конце концов, королевская семья, по крайней мере с 18 века, была тесно связана со шведским масонским орденом, а сам [SWE.GetLeader] был покровителем этого движения. Таким образом, Линдхольм должен балансировать на грани, решая, как поступить с масонами в своей новой стране: просто игнорировать шведский масонский орден или, возможно, даже более тесно связать себя с ним. Густав III вступил в орден и в результате смог спасти страну, используя свои связи в нем, чтобы свергнуть коррумпированную аристократическую дуополию, которая управляла страной в то время, и открыть период культуры, искусства и права. Кто может сказать, что Элмо Линдхольм не сможет сделать то же самое?"
swemil.36.a: "Держи эту информацию в секрете, никто не должен знать."
swemil.36.b: "Масонство не противоречит нашей идеологии!"

swemil.37.t: "Визит из Королевства Франция" #NFA Maurassists visit (NFA must be kingdom)
swemil.37.d: "Швеция и Франция - старые друзья, хотя и разлученные политическими обстоятельствами. До Французской революции, когда их король был варварски обезглавлен толпой, Швеция и Франция были близки, как две капли воды, и даже сражались друг с другом с определенным уважением. Действительно, в самые тяжелые годы после Великой Северной войны именно французские деньги и поддержка помогли Швеции выбраться из бездны, а ещё раньше, во время 30-летней войны, французские католики финансировали протестантов-шведов, чтобы нанести австрийцам сокрушительное поражение. Действительно, в эпоху Густава III Швеция и Франция были, пожалуй, близки как никогда: дворы регулярно поддерживали переписку, а дипломат в Париже Аксель фон Ферсен даже имел роман с самой Марией-Антуанеттой. Когда подлый революционер захватил Париж штурмом и заставил бедного короля Людовика XVI играть роль марионетки, Густав III попытался собрать войска, чтобы спасти короля и убить революцию в зародыше, но великие державы проигнорировали его просьбы. Когда идеалы Просвещения пали под кровавым знаменем Французской революции, Швеция и Франция стали врагами, и в последующих войнах против Наполеона шведы сражались храбро, а дружеские связи в некоторой степени сохранились благодаря уважительному и честному поведению маршала Жана Батиста Бернадота, который репатриировал шведских военнопленных на родину без жестокого обращения и выкупа. Когда Бернадотт был позже приглашен стать наследным принцем, бывший республиканец столкнулся со своим бывшим начальником Наполеоном в последующей битве при Лейпциге, битве народов, укрепив свою лояльность к новой родине.\n\nОднако после падения Наполеона шведская дипломатия долгое время отдавала предпочтение Германии и Великобритании, считая их более важными в борьбе против российского экспансионизма. Однако с наступлением нового века, когда настоящие французы наконец-то получили контроль - пусть и только в Алжире - пришло время шведам и французам вновь сплотиться. Делегация из Франции во главе с лоялистом Морисом Пужо была принята сегодня в Гётеборге, откуда её провели по каналу Гёта в Стокгольм, где ей был устроен королевский прием. Несмотря на явные различия, такие как вера маурассистов в более децентрализованную систему по сравнению с более централизованным уклоном SNF, не говоря уже о вопросе религии, недельное совещание прошло успешно. После нескольких дней переговоров и дебатов французская делегация оказалась не готова пойти на уступки в своей антипротестантской позиции, а шведы не захотели полностью отказаться от отношений с Германией, хотя, несмотря на это, обе стороны сделали много фотографий, пожали друг другу руки и весело пообщались на тему кухни своих стран. Результатом этого длительного мероприятия стала совместная декларация о том, что шведско-французские связи должны укрепляться в будущем, что Европа должна быть очищена от либерализма, социализма и англофилии, а ценности и народы, враждебные природе Европы, должны быть изгнаны. Однако, несмотря на королевский прием с большой помпой, его королевское величество (лидер) отказался пожать руку Морису Пужо, возмущенному обращением с евреями, протестантами и масонами в Алжире. Тем не менее, визит прошел с большим успехом, и обе стороны считают его важной победой."
swemil.37.a: "Надеемся скоро увидеться снова!"

swemil.38.t: "Наследие Карла Рекса" #we love carolus rex larp event
swemil.38.d: "Хотя Швеция была благословлена множеством монархов, некоторые из которых были хорошими, некоторые плохими, некоторые безумными, а некоторые совершенно некомпетентными, возможно, величайшим шведским королем в романтическом мифе является Карл XII, известный за рубежом как Карл XII или под своим латинским именем Carolus Rex. С юных лет сталкиваясь с войной как внутри страны, так и за рубежом, войной, навязанной ему, в истинном шведском военном духе он стремился перенести войну на территорию врага, не желая, чтобы ужасы войны затронули его народ. Дания, один из зачинщиков, была вынуждена капитулировать после отважного марша по льду. Польша, другой агрессор, была ввергнута в гражданскую войну, и наследие потопа вновь прошло по её разоренной войной земле. Россия, ещё одна часть этой оси зла, была вынуждена бежать в ужасе и страхе снова и снова, терпя поражение от отважных легионов людей, которым внушали, что все русские - порождения Гога. После катастрофической битвы при Полтаве, где отважные люди сражались и умирали за флаг, Бога и короля, предательские датчане вновь вступили в войну, продлив её ещё на несколько лет. Окруженный со всех сторон и после пребывания в Константинополе, Карл XII вновь взял на себя командование нацией, надеясь ещё раз одним мастерским ударом выбить Данию из войны. Войдя в датскую Норвегию, Карл XII был застрелен с близкого расстояния, находясь под защитой своего окопа. Эта смерть, скорее всего, убийство, совершенное предательскими дворянами, сделала поражение неизбежным.\n\nНесмотря на его смерть, его личный героизм и тактический ум помогли спасти нацию от полного поражения, поскольку измученные и уставшие вражеские державы вскоре вновь обратились к его преемникам с просьбой о мире. Благодаря своей смелой жертве и десятилетиям непрерывных войн Карл XII навсегда останется в памяти как человек, который противостоял времени, боролся против всех шансов и искренне верил в идею тотальной войны, к большому огорчению своих врагов. Вновь, под руководством SNF, наследие Карла XII будет использовано как сила добра, очищающая сила, объединяющая сила. По словам Эсайаса Тегнера\n\nМолодой герой король Карл стоял в дыму и пыли. Он вытащил меч из ножен и бросился в бой. «Давайте проверим, как кусается шведская сталь. Прочь, московиты! Дерзайте, парни в синем!»"
swemil.38.a: "Будьте здравы, парни в синем!"

swemil.39.t: "Новая власть Церкви" #rewrite to be how its more ingrained in gov
swemil.39.d: "Неотъемлемой частью шведского характера является Шведская церковь, буквально созданная освободителем королем Густавом Вазой ещё в XVI веке вместе с братьями Петри. Заявляя о своей апостольской преемственности через первого евангелическо-лютеранского архиепископа Лауренция Петри Нериция, Шведская церковь долгое время была сильным моральным ядром общества, способствуя распространению грамотности через общества изучения Библии, а в сельских районах, где местный приходской священник играл важную роль в обеспечении того, чтобы его паства могла читать Библию. Именно благодаря Шведской церкви даже самые бедные слои общества могли читать до внедрения системы государственных школ, и в результате правительство и нация находятся в долгу перед ней. Однако в последнее время, в условиях наступления секуляризации и доминирования либерально-консервативно-социалистической гидры в шведской политике, церковь оказалась под угрозой отделения от правительства, от самого государства, и даже утраты статуса законной национальной церкви Швеции. Это недопустимо. После заседания в Риксдаге Линдхольм объявил, что Шведская церковь останется неотъемлемой частью шведского общества и управления, даже открыв возможность для архиепископа Эрлинга Эйдема служить министром в правительстве, возможно, как способ наладить отношения с Церковью, поскольку Эйдем регулярно и горячо осуждает антисемитизм Линдхольма. Несмотря на то, что Эйдем и Линдхольм не сходятся во мнениях по большинству вопросов, а Линдхольм считает архиепископа слишком откровенным и окутанным мистицизмом, оба согласны с тем, что Швеция нуждается в религии так же, как растение нуждается в воде. Уже разработаны планы по обязательному преподаванию Библии в школах, по крайней мере тех частей Библии, которые Линдхольм считает наиболее актуальными для современности. Последний раз шведское общество было так увлечено изучением Библии и её преподаванием во время Великой Северной войны, когда солдатам на поле боя внушали, что все русские являются потомками Каина, а шведы, как прямые потомки Авеля, имеют божественное право изгнать их из мира.\n\nХотя никто в правительстве не хочет возвращения к мистицизму и библейскому фанатизму прошлого, Элмо, следуя по стопам Морасса, считает, что общая вера полезна для общества."
swemil.39.a: "Боже, храни Швецию."

swemil.40.t: "Воссоздание королевской гвардии"
swemil.40.d: "Ранее королевская гвардия выполняла исключительно церемониальные функции: солдаты выходили на парады, сопровождали короля при публичных выходах или «охраняли» королевский дворец. Они стали кумирами, но утратили свою силу, ту страсть, которая лучше всего проявилась в 1713 году. Когда королевская гвардия Карла XII, насчитывавшая около 40 человек, сражалась бок о бок с королем и защищала его от османской армии численностью более 10 000 человек. После изнурительных семи часов сражения, превосходящая по численности османская армия одержала победу, вынудив короля и его оставшихся в живых солдат сдаться. Хотя эта битва закончилась поражением, она показала, насколько преданны были гвардейцы своему монарху и каким рвением они отличались.\n\nТакое рвение необходимо восстановить, поскольку наша новая королевская гвардия должна смотреть на этих храбрых людей как на образец для подражания. Альф Мейерхоффер лично взял на себя эту задачу, считая её лучшим способом укрепить доверие народа к способности Национальной федерации улучшить обороноспособность Швеции. Некоторые даже говорят, что Мейерхоффер должен стать новым Риксельдаре, позволив Линдхольму отойти на второй план, чтобы более эффективно заниматься политикой, в то время как Мейерхоффер сможет привлекать внимание общественности и демонстрировать военное мастерство, которым не обладает харизматичный Элмо. В любом случае, новая гвардия будет охранять короля, Риксельдаре и нацию в целом, присягая служить на улицах, избавляясь от синдикалистов и евреев."
swemil.40.a: "Пусть Мейерхоффер возглавит эту новую армию!"
swemil.40.b: "Мейерхоффер возьмет на себя военное командование Швецией!"
swemil.40.c: "Мейерхоффер будет использовать королевскую гвардию для защиты каждого сантиметра Швеции!"

swemil.41.t: "Видение в плоской упаковке"
swemil.41.d: "В тихих лесах Смоланда молодой предприниматель по имени Ингвар Кампрад основал небольшую компанию по почтовой торговле под названием IKEA. Продавая повседневные товары для дома по доступным ценам, бизнес-модель Кампрада делает акцент на эффективности, простоте и доступности, что резко контрастирует с традиционными, дорогими рынками мебели.\n\nНесмотря на скромные масштабы, IKEA олицетворяет новый дух шведской инновационности и бережливости - ценности, которые однажды могут повлиять не только на быт, но и на всю шведскую экономику в целом. Пока это всего лишь название. Но для тех, кто внимательно следит за развитием событий, это может быть началом чего-то гораздо большего."
swemil.41.a: "Многообещающее будущее для шведской промышленности."
swemil.41.b: "Блестящий ум, пригласите его в правительство!"

swemil.42.t: "Выбор флага Элмо"
swemil.42.d: "Как будущие единоличные правители Европы, мы должны разработать флаг, подходящий для нашего нового королевства. Для этого Рикследаре Линдхольм объявил национальный конкурс на создание нового флага. В рамках этого конкурса внимание лидеров привлекли три варианта, все украшенные пурпурным цветом, символизирующим европейскую королевскую власть, и большим кругом из золотисто-желтых лилий. Различия заключаются в том, что первый вариант наиболее ярко символизирует шведское господство над новой империей: три короны в круге, выполненном в национальных цветах Швеции. Второй вариант имеет схожий дизайн, но без круга вокруг коронок. В последнем варианте короны расположены в левом верхнем углу.\n\nОкончательный выбор..."
swemil.42.a: "Первое: шведское превосходство и могущество!"
swemil.42.b: "Второе: только короны демонстрируют наше могущество!"
swemil.42.c: "Третье: продемонстрировать истинное европейское единство!"
swemil.42.f: "Давайте поместим на нем наш герб, чтобы продемонстрировать силу!"

swemil.43.t: "Телеграмма из Стокгольма"
swemil.43.d: "Из Стокгольма пришла необычная телеграмма от шведского правительства. Во главе с лидером страны Карлом Эренсвардом, оно предложило Антанте оливковую ветвь. Проявляя привязанность и восхищение альянсом, оно предложило взаимовыгодные торговые соглашения, а также помощь обеим странам. Хотя в телеграмме не предлагается прямое вступление в Антанту, она также не исключает такой возможности. Теперь у нас есть выбор: отправить помощь их стране, восстанавливающейся после попытки революции, или отказать им в этом. Отказ от помощи отдалит их от Антанты, но Швеция также может стать бременем для альянса."
swemil.43.a: "Отправить помощь, мы предоставляем её в натуральной форме."
swemil.43.b: "Мы ценим телеграмму, но должны отказаться."

swemil.44.t: "Ответ"
swemil.44.d: "Похоже, державы Антанты ответили нам взаимностью! Они направили нам военную и финансовую помощь, а также предложили новые торговые соглашения между нашими странами. Это значительно укрепит стабильность Швеции и усилит наши международные отношения с Антантой!"
swemil.44.a: "Боже, храни Антанту!"

swemil.45.t: "Ответ"
swemil.45.d: "К сожалению, наша просьба к Антанте была отклонена. Оценив наши доблестные усилия по установлению лучших отношений, Антанта, похоже, сосредоточилась на своих целях по восстановлению. Такая узкая точка зрения может стать причиной их падения, однако теперь мы должны двигаться вперед без Антанты."
swemil.45.a: "Печальное состояние международных отношений."

swemil.46.t: "Торнелл против «хунты» Юнга"
swemil.46.d: "В эпоху, когда политика влияет на армию больше, чем хотелось бы старым генералам, предательство проявляется не в виде шпионажа и саботажа, а в виде костюмов и галстуков. Хотя Оскар Нигрен был бы главным претендентом на пост начальника генерального штаба армии, правительство Йёсты Багге в частном порядке посоветовало ему уйти в отставку, сославшись на его проканадские симпатии. Вместо этого армия склоняется в сторону Олофа Торнелла, прогерманского и в остальном аполитичного офицера. Хотя Торнелл ненавидим SSV, он имеет достаточно хорошие отношения с большинством членов Риксдага, что делает его предполагаемое назначение скорее политическим, чем основанным на заслугах. По крайней мере, так утверждают Хельге Юнг и его «Хунта». Заявляя, что Торнелл будет просто лакеем правительства, слишком стремящегося сократить военные расходы в период кризиса, Хельге Юнг и его чрезмерно громкая армейская клика разрывают на части иначе единую армию. В серии язвительных статей, редакционных колонок, брошюр и даже радиоинтервью «Хунта» Юнга утверждает, что социализм и синдикализм набирают силу во всем мире и что только быстрое и амбициозное перевооружение может спасти нацию.\n\nТорнелл, как обычно, хранит гробовое молчание... По крайней мере, на публике. В частном порядке Торнелл обвинил Хельге в том, что он алкоголик и бабник, Арчибальда Дугласа - в том, что он тайный сектант, а члена «Хунты» Акселя Гюлленкрока - в том, что он садист и хулиган. Пожалуй, единственный, кого Торнелл не ненавидит, - это Ивар Хольмквист, и то только потому, что Торнелл считает его хобби - катание на лыжах - «достаточно мужественным».\n\nПока в армии бушуют споры, шведский народ может только наблюдать за этим со смесью удивления и недоумения."
swemil.46.a: "Что?"

swemil.47.t: "Возвращение к старому порядку"
swemil.47.d: "Несмотря на репрессии в отношении многих политических диссидентов, официальное заявление хунты и назначение Эренсверда, многие в Швеции и во всем мире по-прежнему осуждают наше правительство как нелегитимное. Несмотря на то, что Эренсверд принял в свои ряды нескольких бывших консерваторов, мы по-прежнему боремся с проблемами легитимности. В связи с этим некоторые члены нашего кабинета предложили идею, которая поможет укрепить нашу легитимность: возродить старую институцию в новом виде. Восстановить и назвать наше правительство Riksrådet, или Тайный совет Швеции, - порядок, существовавший в средневековой Швеции. Риксраде когда-то был консультативным и соправительским органом, действовавшим наряду с королем Швеции. Независимо от того, есть у нас король или нет, такое учреждение и его возвращение могли бы вернуть легитимность из истории, вернуться к нашим истинным традиционным корням правительства. Хотя такое предложение могло бы сработать, другие члены нашего правительства называют такой шаг бессмысленным и пустой тратой времени, и считают, что такая смена названия пока не нужна. Что бы мы ни выбрали, это нужно сделать сейчас."
swemil.47.a: "Изменим это, мы примем наше прошлое!"
swemil.47.b: "Изменим это и полностью примем наше прошлое, восстановив Тайный совет!"
swemil.47.c: "Нет необходимости в средневековых изменениях."

swemil.48.t: "Шведские железные дороги"
swemil.48.d: "По мере того как страна выходит из хаоса и раскола, различные должностные лица выдвинули предложение временно поднять вместо него Риксбанер. Королевский флаг Швеции, Riksbaner, - это древний флаг, который должен был развеваться в бою, а нынешний флаг датируется серединой XVIII века. На флаге изображены королевские символы, печати и всевозможные изысканные детали. Флаг видел смену многих монархов и в настоящее время считается священным символом королевской власти. В настоящее время знамя выставляется только во время похоронной процессии монарха, в последний раз его видели на похоронах покойного короля, и существует множество правил, касающихся его представления. Поскольку нынешний флаг может быть расценен как запятнанный несколькими десятилетиями, возможно, для страны настало время вновь принять старые традиции, чтобы стоять не под любым флагом, а под знаменем войны и королевского верховенства."
swemil.48.a: "Пусть этот лозунг развевается по всей стране!"
swemil.48.b: "Мы и так хорошо справляемся."

swemil.49.t: "Ликвидация Landsorganisation"
swemil.49.d: "Не было секретом, что профсоюзы Швеции, объединенные в так называемую Landsorganisation, а также в Центральную рабочую организацию Швеции (SAC), поддерживали старое предательское правительство. После переворота многие из этих профсоюзов пытались организовать забастовки против нового правительства, но с ограниченным успехом. Через некоторое время хунта сделала то, что было необходимо, и распустила все профсоюзы."
swemil.49.a: "Слава богу."

swemil.50.t: "Наследие Карла Великого - Часть вторая"
swemil.50.d: "Будучи сторонником полного уничтожения врага перед тем, как двигаться дальше, именно с таким пониманием следует оценивать действия, предшествовавшие Полтавской битве и последовавшие за ней. Будучи преследуемым казаками на протяжении всей своей кампании в России и получив обещание помощи от Ивана Мазепы, Карл хотел нанести русским последний удар, бросив вызов судьбе, как он делал это несколько раз ранее, и заставить царя под угрозой сабли заключить мир. Сражение началось неудачно. Король был ранен и по настоянию своих советников вынужден остаться в тылу, а по мере разгорания сражения местность окутала дымка и дым от горящих укреплений и орудийного дыма, что ограничивало способность обеих сторон принимать взвешенные решения. Шведы, измученные годами бесконечных конфликтов без передышки и возможности вернуться домой, в конце концов сломались. Русские проявили себя как сильные и непоколебимые, что вызвало неохотное уважение короля, и когда он попытался собрать своих людей для последнего сражения, он был вынужден отступить, что вскоре превратилось в бегство. Несколько лет спустя, после пребывания в дружественной Османской империи и долгого марша домой, Карл вернулся в страну, все ещё пребывавшую в кризисе. С пустыми казнами и героическими генералами, такими как Магнус Стенбок, находящимися в плену в снова враждебной Дании, или занятыми боевыми действиями на востоке, как Карл Густав Армфельдт, а местное финское население вынуждено было уйти в леса и вести партизанскую войну против российской оккупации, Карл снова должен был бросить вызов судьбе. Отдыхая после многих лет, проведенных за границей, король решил нанести удар на запад, в Норвегию, в надежде вновь заставить датчан капитулировать перед свершившимся фактом, а затем двинуться на восток и вновь сразиться с русскими. Но этого не произошло. Никто не знает, что произошло во время осады замка Фредрикстен: норвежцы и датчане утверждают, что король был застрелен снайпером, а шведы склоняются к версии о заговоре офицеров против короля. Получив пулю в голову с близкого расстояния, король скончался, и кампания в Норвегии закончилась, вызвав отступление, которое привело к серии ужасных трагедий, поскольку солдаты были вынуждены маршировать по снегу, в метель и под вражеским обстрелом. Когда война закончилась несколько лет спустя, Швеция и Северная Европа в целом остались израненными. Прибалтика была насильно присоединена к России, часть Финляндии была отнята, и единственным реальным победителем в конфликте оказались русские, хотя сам царь умер вскоре после этого, не успев увидеть свою великую победу. Польша погрузилась в хаос и истощение, Дания была вынуждена играть вторую скрипку после Великобритании, а Саксония оказалась в конфликте с очень враждебно настроенной Пруссией.\n\nКогда «Stormaktstiden» подошла к концу, Швеция была вынуждена примириться со своим прошлым. По мере того как на престол вступала серия некомпетентных, хотя и часто благонамеренных монархов, а дворяне отнимали у монархии все больше и больше власти, а и без того бедные крестьяне страны становились ещё беднее, пожалуй, единственным сокровищем, которое осталось, было воспоминание о Карле XII. Вновь, под руководством SNF, наследие Карла будет использовано как сила добра, сила очищения, сила объединения."
swemil.50.a: "Lets hear the poem!"

swemil.51.t: "Словами Эсайаса Тегнера"
swemil.51.d: "Молодой герой король Карл,\n\nстоял в дыму и пыли.\n\nОн вытащил меч из ножен\n\nи бросился в бой.\n\n“Как прочно шведское сталь,\n\nдавайте проверим.\n\nПрочь с дороги, московиты!\n\nМужества, ребята в синем!"
swemil.51.a: "Мужества, ребята в синем!"

swemil.52.t: "Создание «Informationsbyrån»"
swemil.52.d: "После того как мы взяли на себя обязательство обеспечить национальную безопасность, создав «Генеральную службу безопасности», аресты диссидентов и участников беспорядков с каждым днем только увеличивались. Однако наша способность бороться с иностранными подрывными элементами остается в лучшем случае слабой, даже несмотря на увеличение бюджета наших спецслужб. Этим диверсантам удалось похитить важную правительственную информацию и военные стратегические планы, и такие действия не могут продолжаться бесконечно. К нашему счастью, генерал Карл Беннедич обратился к нашему правительству с предложением от своего сына, нынешнего капитана генерального штаба, который желает увеличить наши службы безопасности в десять раз.\n\nОбычно называемое Специальным бюро генерального штаба обороны, он назвал свое новое агентство «Informationsbyrån», сокращенно IB. Он обещает, что это позволит нам продолжать нашу текущую работу по ликвидации подрывной деятельности внутри страны, а также даст нам преимущество в расследовании деятельности иностранных агентов. Хотя результаты работы этого нового агентства ещё предстоит увидеть, его полная секретность и решимость защищать национальную независимость Швеции от иностранцев неоспоримы."
swemil.52.a: "Будем надеяться, что это гарантирует нашу национальную безопасность..."

swe.30.t: "Восстановление профсоюзов"
swe.30.d: "Социализм - это болезнь, и чаще всего профсоюзы сами становятся зараженными или запятнанными красной гнилью. Landsorganisationen всегда была связана с SAP, а слюнявые синдикалисты SAC всегда были в сговоре с красными в Париже, и поэтому до сих пор вся профсоюзная деятельность была запрещена. Однако такое положение дел довольно невыносимо. Аргументы, которые когда-то можно было просто решить между представителями профсоюзов и соответствующими предприятиями, стали национальными проблемами, а протесты, которые когда-то ограничивались лишь несколькими преданными делу рабочими, стали более масштабными, и теперь они не могут выразить свое недовольство иначе, как уличными акциями. Естественно, что для решения этой проблемы необходимо что-то предпринять. Правительству было представлено три варианта: восстановление номинально свободных профсоюзов, восстановление контролируемых профсоюзов или просто закрытие всего дела и сохранение запрета на профсоюзы."
swe.30.a: "Разрешить «независимые» профсоюзы."
swe.30.b: "Профсоюзы восстанавливаются под строгим контролем правительства."
swe.30.c: "Профсоюзы остаются под запретом."

swe.31.t: "Гильдейская система"
swe.31.d: "Профсоюзы были созданы отвратительными социалистами для борьбы с либерально-капиталистической эксплуатацией, но теперь, когда у власти находится новое движение, в профсоюзах больше нет необходимости, за исключением, возможно, нескольких единичных случаев. Вместо этого правительство с большой осторожностью и усилиями стремится вновь ввести старую гильдейскую систему, при которой представители определенных профессий могут использовать свои знания и работать вместе на благо нации."
swe.31.a: "Богатые и бедные шведы объединяются в стремлении к лучшему!"

swe.32.t: "Состояние профсоюзов"
swe.32.d: "Спустя полгода после того, как профсоюзы под значительным контролем правительства были вновь разрешены, результаты, к сожалению, оказались разочаровывающими. Вместо того, чтобы серьезно отнестись к своей новой лояльности, мы сразу же увидели возрождение синдикализма в их рядах, и правительство вскоре было вынуждено принять меры. Скоро смутьяны были исключены из профсоюзов, и правительственный контроль вновь набрал обороты, но в результате лишь немногие работники считают профсоюзы легитимным органом, защищающим их интересы. Для многих они являются лишь организациями, находящимися под контролем буржуазного правительства и тех самых боссов, которым они должны противостоять."
swe.32.a: "Сократим убытки, снова запретим их."
swe.32.b: "Сделаем членство обязательным, чтобы заставить людей участвовать!"

swe.33.t: "Профсоюзы"
swe.33.d: "После того как правительство постановило, что все должны вступать в профсоюзы, они внезапно наполнились незаинтересованными работниками, которые неохотно посещали профсоюзные собрания. Легитимность оставалась низкой, но благодаря активному продвижению со стороны правительства участие начало расти, и через некоторое время некоторые уступки убедили ещё больше рабочих в преимуществах этой системы. В результате контролируемая профсоюзная система стала чем-то вроде самоподдерживающегося организма, но, вероятно, все ещё не является тем, чем её хотели видеть Riksledare и идеологи."
swe.33.a: "Скажите прессе, что это большой успех!"

### Intro Events ###

swe.9999.t: "Прошлое стабильной демократии"
swe.9999.d: "На протяжении всей мировой войны Швеция оставалась нейтральной державой, даже несмотря на прогерманские настроения как в политической среде, так и среди дворянства, она сохраняла позицию вооруженного нейтралитета на протяжении всего конфликта. Период после мировой войны был отмечен усилением немецкого влияния на северную страну, крупные предприятия из Германии обеспечили жизненно важную торговлю со Швецией. Наряду с расширением немецкого гиганта внизу, политическая арена Швеции извлекла выгоду из видимой стабильности, с введением всеобщего избирательного права в 1921 году, что позволило провести досрочные всеобщие выборы, в результате которых первые женщины-депутаты были приведены к присяге в Риксдаге, что позволило социал-демократам одержать победу.\n\nОднако удача изменилась, когда в 1924 году из-за экономического спада выросла безработица, а в Великобритании произошла революция, что привело к резкому росту синдикализма и левых настроений и позволило консерваторам одержать победу на выборах 1928 года под руководством Арвида Линдмана. Линдман продолжил эту традицию консерватизма в Северной Европе до своей внезапной отставки в 1935 году. Это оставило Генеральную избирательную лигу, крупнейшую консервативную партию Швеции, с новым лидером Йёстой Багге, который теперь ведет страну к выборам 1936 года.\n\nВ условиях растущей международной напряженности, когда и изгнанная Антанта, и Японская империя, и Третий Интернационал стремятся вернуть или завоевать новые территории, следующие выборы будут иметь решающее значение для определения места Швеции на мировой арене."
swe.9999.a: "För Sverige!"

swe.17.t: "Шведские беженцы"
swe.17.d: "Швеция стала жертвой социалистического бедствия, которое уже некоторое время опустошает Европу. После успешного установления рабочего государства местные тоталитаристы воспользовались шансом отомстить шведским капиталистам, политикам, священникам и другим представителям старого шведского режима. В результате многие пытаются бежать из Швеции, но, в отличие от многих других народов, ставших жертвами этой беды, у них нет колониальной империи, на которую они могли бы положиться. Поэтому они ищут убежища в [Root.GetNameDef]. Несколько групп уже прибыли к нашей границе, но должны ли мы их принять?"
swe.17.a: "Добро пожаловать в [Root.GetNameDef]!"
swe.17.b: "Убирайтесь, шведская мразь!"

swe.34.t: "Рикследаре и архиепископ"
swe.34.d: "SRNS признавала моральный авторитет, которым обладала над шведским народом Шведская церковь. Фактически, получение поддержки этой организации было одной из причин, по которой небольшая шведская еврейская община пользовалась защитой Рикследаре от менее толерантных в расовом отношении членов его кабинета, поскольку архиепископ был известен своим противодействием антисемитизму. По этим причинам не было ничего удивительного в том, что Арчибальд Дуглас и архиепископ Уппсалы Эрлинг Эйдем регулярно встречались. Дуглас был готов принять важные законы в пользу Шведской церкви, например, восстановить законодательство, которое делало незаконным выход из церкви, а также бороться с греховными деяниями. Однако в обмен на это церковь должна была активно избавляться от прогрессивного антиправительственного духовенства и открыто поддерживать Рикследаре. Основываясь на своей беседе с Рикследаре, Эрлинг созвал синод для обсуждения этого вопроса."
swe.34.a: "Пусть синод идет своим чередом..."
swe.34.b: "Облегчить принятие решения, посетив антиправительственное духовенство."

swe.35.t: "Синод в Упсале"
swe.35.d: "Синод Шведской церкви завершил свою работу, и священники пришли к выводу, что ни одно земное правительство, подобное SRNS, не может пользоваться безоговорочной поддержкой, и что в свете этого демократия, существовавшая ранее, страдала меньшим моральным дефицитом. Кроме того, они согласились с тем, что нельзя торговаться за поддержку Бога, принимая законы в поддержку Его ценностей. В конце концов, люди должны сами открыть для этого свои сердца. Явным результатом синода стало отвержение доктрины SRNS.\nРикследаре возмутились этой новостью, и к концу дня Шведская церковь перестала быть государственной, а многие священники организации, в том числе архиепископ Эрлинг, лишились свободы."
swe.35.a: "Но гнев - это грех?"

swe.36.t: "Синод в Упсале"
swe.36.d: "Странно, но многие прогрессивные священнослужители не прибыли на синод или внезапно изменили свое мнение по этому вопросу. Однако синод прошел, как и планировалось: священнослужители, которые все-таки присутствовали на нем, согласились, что исполнение воли Божьей стоит некоторых уступок и что правительство SRNS уже исполняет волю Божью, преследуя языческих синдикалистов и защищая Швецию от этого бедствия.\nРикследаре был восхищен этой новостью, и с этого момента церковь Швеции стала неотъемлемой, хотя и порой несколько неохотной частью пропагандистской машины SRNS, с вертикальным обеспечением ортодоксальной поддержки правительства и, в свою очередь, значительной поддержкой правительства для церкви."
swe.36.a: "Мы тоже выполним свою часть соглашения!"

swe.37.t: "Переход к гражданскому правительству"
swe.37.d: "Со временем военная форма правления становилась все более неустойчивой. Поэтому неудивительно, что в какой-то момент Рикследаре объявил все места в Риксдаге частью своей собственной партии «Svea Rikes Nationella Samlingsparti». После этого власть была передана Риксдагу, который немедленно принял закон, навсегда закрепивший за Дугласом статус Рикследаре, позволявший обладателю этой должности обходить сам Риксдаг в шведских органах власти. На этом этапе Рикследаре обладал практически неограниченной властью, и Швеция, какой она была до переворота, исчезла навсегда."
swe.37.a: "Все по-прежнему, но все изменилось."

swe.38.t: "Новые инструменты управления"
swe.38.d: "Риксдаг принял новый набор инструментов управления, который служит шведской конституцией. Новый документ явно исключает партии, придерживающиеся марксистских или синдикалистских идей, и закрепляет право шведского монарха осуществлять свои резервные полномочия, а также содержит другие незначительные поправки, которые в значительной степени благоприятствуют консервативному правительству."
swe.38.a: "Ура!"

swe.39.t: "Швеция хочет присоединиться к Интернационалу"
swe.39.d: "Шведское революционное правительство обратилось к нам с просьбой присоединиться к борьбе за мировую революцию. Давайте вместе со шведскими рабочими разгромим буржуазию?"
swe.39.a: "Конечно!"
swe.39.b: "Мы никогда не будем сражаться вместе с этими марионетками!"

swe.40.t: "Франция согласна!"
swe.40.d: "Мы получили сообщение от коммунарского правительства о том, что мы приветствуемся в борьбе против сил реакции и темных сил финансового капитализма. Вместе мы сокрушим буржуазию!"
swe.40.a: "Ура!"

swe.41.t: "Франция отвергает нас!"
swe.41.d: "Коммунары сообщили нам, что мы не приветствуемся на поле битвы против сил реакции. По-видимому, они считают нас ещё одним фронтом, который не будет удержан."
swe.41.a: "Проклятые улитки!"

swe.42.t: "Статуя настоящему революционеру"
swe.42.d: "Хотя Пер Альбин Ханссон не был лишен недостатков - он был ярым сторонником довольно безнадежной стратегии работы в рамках буржуазного правительства с целью его реформирования - этот человек проявил себя как настоящий герой революции. В конце концов, было ясно, что он определенно намеревался добиться создания этой республики, о чем свидетельствовала отречение короля, к которому он подтолкнул. К сожалению, этот великий герой революции погиб от рук военных на начальном этапе переворота. Если бы не героические действия милиции SP, мы, возможно, никогда не смогли бы найти его тело.\nКонечно, такого славного революционера нужно помнить, и по этой причине мы заказали большую статую в городе, где вырос Ханссон: Мальмё."
swe.42.a: "Великая статуя для великого революционера!"

swe.43.t: "Первый день революции"
swe.43.d: "Ровно год назад жестокая капиталистическая тирания была смыта кровью пролетариата. Поскольку для народа Швеции важно помнить, что свобода Швеции не дается даром, мы решили объявить день революции национальным праздником. В этот день все работники будут иметь выходной, а государство организует мероприятия для следующего поколения, в то время как взрослые смогут пообщаться!"
swe.43.a: "Это станет ежегодным событием!"

swe.44.t: "День революции"
swe.44.d: "Снова наступил день рождения революции. Государство организовало мероприятия для детей Швеции в честь революции, а взрослые, которые не выходят на работу, используют свой свободный день, пока дети на мероприятиях, для общения!"
swe.44.a: "Leve vår Revolution!"

swe.49.t: "Общая избирательная лига меняет название"
swe.49.d.socdem: "С момента своего поражения в 1936 году судьба консервативной Всеобщей избирательной лиги была полна несчастий. Партия потеряла значительную часть своей поддержки, перешедшей к социал-демократам Ханссона, а те, кто поддерживал Лигу в противовес социал-демократам, возвращаются в Народную партию, если верить опросам общественного мнения.\nВ попытке изменить имидж партии, которая сейчас является оплотом правой оппозиции, и вновь переломить ситуацию, руководство партии решило изменить её название на Национальную организацию правых (Högerns Riksorganisation). Удастся ли этой тактике вновь привлечь больше избирателей, покажет время."
swe.49.d.soccon: "С момента нашей яркой победы над социал-демократами в 1936 году медленный поворот общества в сторону консерватизма значительно повысил нашу популярность. Поскольку поддержка Ханссона и его сторонников с каждым днем сокращается, было принято решение позиционировать себя как консервативную силу в Швеции. Хотя члены AV сначала сочли изменение названия бессмысленным, эта идея позволяет нам привлечь дополнительную поддержку и избирателей, придав себе новый облик. Поскольку большинство партии уже высказалось в пользу этого, похоже, что новое название нашей партии теперь будет Национальная организация правых (Högerns Riksorganisation). Остается только ждать и посмотреть, как отреагирует общественность!"
swe.49.d.marlib: "Хотя это и не обязательно поражение, их второе место в коалиции привело к резкому снижению числа избирателей и общественной поддержки консерваторов. Теперь большинство поддерживает нас, Народную партию, а все непостоянные центристы обращаются к Лиге фермеров или социал-демократам Ханссона.\n\nВ попытке изменить имидж партии, которая сейчас является оплотом правой оппозиции, и вновь переломить ситуацию, руководство партии решило изменить её название на Национальную организацию правых (Högerns Riksorganisation). Удастся ли этой тактике вновь привлечь больше избирателей, покажет время."
swe.49.a: "Интересно..."

swe.50.t: "Король намеревается отправить письмо"
swe.50.d: "Его королевское величество сообщил нам о своем намерении отправить письмо германскому кайзеру. Похоже, он хочет поблагодарить немцев за то, что они избавили Европу от синдикалистской заразы. Такое письмо может поставить нас в неловкое положение и нанести ущерб нашей нейтральности, поэтому некоторые члены правительства хотели бы, чтобы мы помешали его величеству отправить это письмо."
swe.50.a: "Укрепление наших связей с другими странами никогда не повредит!"
swe.50.b: "Мы не можем так подвергать риску наш нейтралитет, запретите это!"

swe.51.t: "Письмо от короля Швеции"
swe.51.d: "Мы получили письмо от короля Густава V Швеции. Он благодарит нас за то, что мы избавили Францию от синдикалистской заразы, и поздравляет нас с достигнутыми победами. Очень любезный жест со стороны шведов - таким образом выразить свою поддержку нашему делу."
swe.51.a: "Поручите нашему послу поблагодарить их за это!"
swe.51.b: "Действительно, милый жест!"

swe.52.t: "Немецкая благодарность!"
swe.52.d: "Немецкий посол передал благодарность своей страны одному из министров нашего кабинета за любезное письмо нашего короля в поддержку их борьбы с синдикалистами. Они говорят, что это был очень любезный жест и что они считают нас хорошими друзьями."
swe.52.a: "Это было мило, не правда ли? Это была даже идея Его Величества!"
swe.52.b: "Но мы запрещаем... Неважно, великолепно!"

swe.53.t: "Folkpartiet поднимается в рейтингах"
swe.53.d: "Какое-то время казалось, что лишение социал-демократов прав сделало консервативный контроль над Швецией беспрепятственным. Однако, похоже, что в их отсутствие либеральная Народная партия вышла на первый план, и большая часть старой социал-демократической базы поддержки теперь поддерживает ее, зная, что, хотя она и не разделяет тех же экономических идеалов, что и они, она поддерживает возвращение SAP в законность и восстановление свободы, как это было до того, как консерваторы сделали свой контроль практически непроницаемым с помощью закона."
swe.53.a: "Появляется новый соперник..."

swe.54.t: "Folkpartiet контролирует оппозицию"
swe.54.d: "В течение длительного времени консерваторы были самой влиятельной партией в Швеции, но, похоже, это закончилось. Сначала они уступили власть социал-демократам, а затем, не сумев решительно вернуть ее, стали терять популярность на выборах. На последних выборах это наконец произошло: консерваторы вновь получили наименьшее количество мест с момента создания современного Риксдага, утратили статус второй по величине партии и опустились на третье место, уступив либералам, которые теперь возглавят шведскую оппозицию."
swe.54.a: "Это был мрачный день для шведского консерватизма."

swe.55.t: "[GetYear] Всеобщие выборы в Швеции"
swe.55.d: "Предвыборная кампания подошла к концу, и шведский народ отправился на избирательные участки, чтобы выбрать правительство, которое он считает лучшим для Швеции. Осталось только подсчитать голоса, и мы сможем объявить победителя..."
swe.55.a: "Социал-демократы торжествуют!"
swe.55.b: "Консерваторы одержали победу!"
swe.55.c: "Народная партия победила!"
swe.55.e: "На первый план вышла партия Бондефёрбунд!"

swe.56.t: "Формирование социал-демократического правительства"
swe.56.d: "Социал-демократы вновь одержали победу на выборах, и они имеют право сформировать правительство Швеции. Пресса с нетерпением гадает, какое правительство будет править Швецией в ближайшие годы..."
swe.56.a: "Кабинет единства всех центристских партий."
swe.56.b: "Аграрно-социал-демократическая коалиция."
swe.56.c: "Однопартийный кабинет, опирающийся на полученное большинство."

swe.57.t: "Формирование консервативного правительства"
swe.57.d: "Выборы принесли явную победу консерваторам, и поэтому вполне справедливо, что именно мы будем формировать шведское правительство. Пресса с нетерпением ждет заявления партии, поскольку оно будет иметь решающее значение для определения того, какое правительство будет править Швецией в ближайшие годы."
swe.57.a: "Мы будем править вместе с аграриями!"
swe.57.b: "Либеральная Folkpartiet - наш естественный союзник!"

swe.58.t: "Формирование либерального правительства"
swe.58.d: "Либералы одержали решительную победу на выборах в Риксдаге, и поэтому формирование шведского правительства ложится на плечи Народной партии. Многие задаются вопросом, какое правительство создадут либералы, и пресса с нетерпением ждет объявления."
swe.58.a: "Настоящая либеральная коалиция с Bondeförbundet."
swe.58.b: "Коалиция с консерваторами, но под либеральным руководством!"

swe.59.t: "Ключевое решение о коалиции"
swe.59.d: "Вопреки всем ожиданиям, Bondeförbundet стала крупнейшей партией на недавних выборах, воспользовавшись поддержкой сельских жителей и стремлением общественности к прагматичному, центристскому руководству. Теперь, не имея явного большинства в Риксдаге, партия стоит перед важным решением: формировать коалицию с рыночно-либеральной Народной партией, чья экономическая концепция соответствует сельскому предпринимательству, или с социал-демократами, чья ориентация на благосостояние и социальную сплоченность привлекает многих в кооперативной традиции Бондефёрбютен. Оба варианта обеспечивают стабильность, но также несут риск отчуждения ключевых частей электората. Выбранный путь определит политическое направление Швеции на ближайшие годы."
swe.59.a: "Сотрудничать с Народной партией для создания либерально-центристского альянса."
swe.59.b: "Сформировать прогрессивный блок с социал-демократами."

swe.60.t: "Швеция вводит тарифы"
swe.60.d: "Шведы ввели против нас тарифы, несмотря на то, что они являются частью зоны свободной торговли Mitteleuropa и, таким образом, в принципе не имеют права вводить такие меры. Многие экономисты считают, что мы должны принять ответные меры, чтобы не нанести ущерб целостности Mitteleuropa и не дать другим членам организации идеи!"
swe.60.a: "Мы отомстим!"
swe.60.b: "Сейчас у нас есть более важные дела!"

swe.61.t: "Германия принимает ответные меры!"
swe.61.d: "Немцы не отнеслись легкомысленно к нашей попытке изменить правила в свою пользу: они ввели свои собственные санкции против нас, и из-за их экономического веса это наносит нашим компаниям, специализирующимся в основном на сырьевых ресурсах, гораздо больший ущерб, чем наши санкции им. Объявляются новые увольнения, поскольку шведские компании теперь должны платить тарифы, чтобы выйти на рынки Германии и Дании."
swe.61.a: "Черт!"

swe.62.t: "Кризисная ситуация улучшается"
swe.62.d: "Уровень безработицы упал ниже 24 %. В результате шведская экономика начинает показывать первые признаки восстановления, поскольку все больше людей работают и снова начинают тратить свои зарплаты. Хотя худшее уже позади, мы по-прежнему далеки от докризисного уровня."
swe.62.a: "Это только начало!"

swe.63.t: "Кризисная ситуация продолжает улучшаться"
swe.63.d: "Уровень безработицы в настоящее время снизился ниже 20 %. По мере того как все больше людей находят работу, шведская экономика восстанавливается все более быстрыми темпами. Несмотря на это, последствия кризиса по-прежнему ощущаются, и для полного восстановления потребуются значительные усилия."
swe.63.a: "Со временем процветание вернется!"

swe.64.t: "Кризисная ситуация продолжает улучшаться"
swe.64.d: "Уровень безработицы в настоящее время снизился ниже 16%. Многие люди, которые ранее были вынуждены оставаться дома, снова находят работу, и ситуация уже выглядит гораздо лучше, чем раньше. Хотя последствия кризиса все ещё ощущаются, полное восстановление кажется ближе, чем когда-либо!"
swe.64.a: "Швеция переживет это!"

swe.65.t: "Кризис миновал!"
swe.65.d: "С уровнем безработицы ниже 12% шведская экономика снова работает с той же скоростью, что и до тревожных событий Черного понедельника. Мы успешно преодолели экономический спад!"
swe.65.a: "Ура!"

swe.67.t: "Отчет Комиссии по кризису!"
swe.67.d: "Комиссия по кризисным ситуациям, созданная в соответствии с Законом о кризисных ситуациях 1936 года, представила отчеты о балансе за прошлый год. Они лежат на вашем столе."
swe.67.a: "Ах, великолепно! Я посмотрю!"

swe.68.t: "Кризис суверенного долга"
swe.68.d: "Ужасно! Было известно, что комиссия неортодоксально использовала кредиты, но никто не ожидал, что все будет так плохо! Огромный долг, который комиссия набрала в попытках противостоять последствиям Черного понедельника, не может быть покрыт остальной частью шведского бюджета, и мы вынуждены объявить, что наши долги не могут быть погашены, то есть фактически объявить банкротство! Как отечественные, так и иностранные инвесторы потеряют свои деньги и, конечно, не будут довольны!"
swe.68.a: "О нет!"

swe.69.t: "Кризис суверенного долга в Швеции"
swe.69.d: "Швеция долгое время считалась безопасным убежищем для инвестиций, но теперь это уже не так: сегодня утром она официально объявила о банкротстве, по-видимому, в результате «черного понедельника»: она больше не в состоянии погасить свои долги. Многие [Root.GetAdjective] инвесторы, вложившие средства в шведские облигации, теперь потеряли свои деньги."
swe.69.a: "Черт!"

swe.70.t: "Снижение безработицы"
swe.70.d: "В результате нашей политики девальвации шведской кроны покупка сырьевых ресурсов, которые мы экспортируем, стала довольно дешевой. В результате наш экспорт резко вырос, что положительно сказывается на занятости в нашей стране!"
swe.70.a: "Ура!"

swe.71.t: "Гиперинфляция"
swe.71.d: "Наше решение продолжать девальвировать шведскую крону после того, как она начала влиять на нашу экономику, возможно, было ошибкой. Инфляция теперь начала нарастать как снежный ком, и все указывает на то, что уровень внутренних цен в этом году удвоится дважды. Поскольку денежные сбережения всех тают на глазах, у нас практически нет выбора, кроме как отказаться от нашей суверенной валюты и начать все заново с новой."
swe.71.a: "Крона мертва! Да здравствует Крона!"

swe.73.t: "Смерть короля Густава"
swe.73.d: "Наш дорогой суверен, король Густав V Швеции, скончался сегодня в Стокгольмском дворце в результате осложнений, вызванных гриппом. Столетие назад наследный принц Густав VI Адольф был бы коронован королем Швеции, однако, как и его отец, его величество решил не принимать корону, а вместо этого принять только Konungaförsäkran - королевскую клятву."
swe.73.a: "Король умер, да здравствует король!"

swe.74.t: "Смерть Густава V"
swe.74.d: "Бывший король Швеции Густав Бернадот скончался в поместье, купленном Бернадотами примерно в сорока километрах от Стокгольма после потери шведского престола. Все ещё надеясь на восстановление короны, его сын Густав Адольф Бернадот стал претендентом на шведский престол."
swe.74.a: "Покойся с миром..."

swe.75.t: "Смерть Густава V"
swe.75.d: "Бывший король Швеции Густав Бернадот скончался в поместье, которое семья Бернадот приобрела примерно в сорока километрах от Стокгольма после утраты шведского престола. Его Величество король Густав VI Адольф, который был восстановлен на престоле после того, как его дед утратил его, лично заверил, что он будет похоронен вместе с другими бывшими королями Швеции со времен Густава Адольфа в Риддархольмской церкви."
swe.75.a: "Покойся с миром..."

swe.76.t: "Пропагандисты"
swe.76.d: "Коммунальное правительство столицы - вероятно, при поддержке определенных элементов в нашем кабинете - одобрило предложение установить во всех общественных зданиях громкоговорители с музыкой и государственной пропагандой, призывающие рабочих внести свой вклад в шведскую революцию, а также пропагандирующие идеологическую чистоту. Многие считают, что это будет отличной тестовой средой для проверки эффективности такой доктрины тотальной пропаганды, но некоторые опасаются, что эффект будет ограниченным, а энтузиазм муниципального правительства приведет только к обратному результату."
swe.76.a: "Кто мы такие, чтобы вмешиваться в дела местных властей?"
swe.76.b: "Пусть отменят это, ничего не выйдет!"

swe.77.t: "Средняя эффективность пропагандистов"
swe.77.d: "Широкое использование пропагандистских громкоговорителей, которое мы разрешили муниципальным властям, по-видимому, дало посредственные результаты: хотя членство в тоталитарных профсоюзах действительно выросло немного больше, чем в остальной части страны, поступило несколько жалоб на то, что громкий шум громкоговорителей мешает людям сосредоточиться (на работе) или спать (ночью). Несколько громкоговорителей были даже повреждены и потребовали замены. Похоже, эксперимент оказался умеренно неудачным."
swe.77.a: "Охватить всей Швецией!"
swe.77.b: "Отказаться от эксперимента!"

swe.78.t: "Судьба прессы"
swe.78.d: "После установления рабочего государства неотложной проблемой стала пресса: большинство газет, а также национальная радиослужба продолжали действовать после шведской революции, и некоторые из них даже имели наглость критиковать новый порядок.\n\nХотя все фракции революционеров согласились с тем, что такие явные буржуазные пропагандистские станции, как капиталистическая Svenska Dagbladet, очевидно, не могут оставаться активными в прежнем виде, все они предложили разные подходы. Флиггисты из SP предложили свой план «Likriktning»: все средства массовой информации в Швеции должны быть поставлены под строгий контроль правительства, чтобы обеспечить надежную защиту революции от реакционных лжи. Синдикалисты SAC выдвинули другое предложение: все СМИ должны быть реорганизованы в единый профсоюз журналистов под эгидой общешведской организации Landsorganisationen, которая будет следить за объективностью контента и не допустит распространения лжи, наносящей ущерб социалистическому порядку. Наконец, радикальные социалисты SSV предлагают осторожность: хотя они согласны с тем, что явно реакционные СМИ должны быть распущены, они хотят, чтобы остальные СМИ остались в покое."
swe.78.a: "Ликриктнинг: защитим революцию!"
swe.78.b: "Реорганизация: захватим средства информации!"
swe.78.c: "Осторожность: сохраним свободу прессы!"

swe.79.t: "Создание Stasä"
swe.79.d: "Многие нетоталитарные социалисты были довольно недовольны действиями военизированных организаций SP против реакционеров. По их словам, охота стоила жизни многим, кого нельзя было даже считать угрозой революционному порядку, и значительно усложнила задачу убедить шведов, которые ещё не присоединились к революции, что это действительно лучший путь вперед.\n\nВ результате они предложили создать новое агентство, которое получило бы исключительные полномочия по защите Швеции от контрреволюционной деятельности и официальную поддержку правительства. К их некоторому удивлению, тоталитаристы сразу же подхватили эту идею и предложили предоставить этому новому «Sekretariatet för Statssäkerhet» далеко идущие полномочия - похоже, они надеются получить над ним контроль."
swe.79.a: "Пусть охота возобновится с новыми ресурсами!"
swe.79.b: "Следует установить надлежащую систему сдержек и противовесов."

swe.80.t: "Социализация экономики на практике"
swe.80.d: "С принятием четкого постановления конгресса, богатство, которое мы отобрали у отечественных и иностранных капиталистических свиней по всей Швеции, готово быть возвращено шведскому народу с процентами. Отныне средний швед будет наслаждаться процветанием, которого он заслуживает, не будучи рабом интересов плутократии!"
swe.80.a: "Построим сильную экономику, основанную на профсоюзах!"
swe.80.b: "Построим единый профсоюз, представляющий интересы рабочего класса!"
swe.80.c: "Построим автономную экономику, основанную на коммунах!"

swe.81.t: "Смерть Густава Бернадота"
swe.81.d: "Злодейский символ реакции Густав Бернадот, который почти 30 лет был марионеткой немецких реакционеров-капиталистов, эксплуатировавших Швецию, умер в изгнании, все ещё надеясь когда-нибудь разорвать цепи, которые когда-то сковывали народ Швеции. Его сын принял на себя роль претендента на «шведский трон» и номинального главы шведских изгнанников."
swe.81.a: "Слава богу!"

swe.82.t: "Централизация власти"
swe.82.d: "После прихода к власти по мандату рабочих, Totalisterna и теперь их генеральный секретарь немедленно приступили к работе. Одними из первых действий Нильса Флюга в качестве генерального секретаря было освобождение от должности тех высокопоставленных чиновников, которые были враждебно настроены по отношению к тоталитарной идеологии и доктрине полной приверженности революции, и их замена лояльными членами движения."
swe.82.a: "Если ты не полностью привержен делу, тебе здесь не место!"

swe.83.t: "Умиротворение профсоюзов"
swe.83.d: "Не прошло много времени, как государственный аппарат был очищен от антитотализма. С учетом того, что различные позиции в правительстве находились под тоталитарным контролем, главной политической угрозой для сохранения единства Швеции были профсоюзы, которые технически могли созвать конгресс, чтобы форсировать смену правительства. Чтобы не допустить повторного укоренения криптореакционного ревизионизма, генеральный секретарь объявил, что лидеры профсоюзов должны пройти политическую проверку, чтобы не привести своих последователей к неправильному выводу."
swe.83.a: "Шведы не должны поддаваться на обман ревизионистов!"

swe.84.t: "Начало чего-то большего!"
swe.84.d: "Через несколько месяцев влияние тоталитарного движения на шведское общество стало практически тотальным. Генеральный секретарь Нильс Флюг часто выступал с речами, чтобы поднять шведский народ на поддержку национально-революционной доктрины, используя свои отточенные ораторские таланты. Однажды, после одной из таких речей, газета «Folkets Dagblad», которую когда-то редактировал шведский лидер, вышла с передовой статьей, восхваляющей великое лидерство генерального секретаря и его мудрость.\n\nСтатья привлекла внимание лидера и его кабинета, которые начали считать, что сосредоточение внимания СМИ на качествах Нильса Флюга может быть политически выгодным."
swe.84.a: "Взяться за этот «культ личности»!"
swe.84.b: "Наше внимание должно быть сосредоточено на революции, а не на товарище Флюге!"

swe.85.t: "Создание культа"
swe.85.d: "В течение последнего года новости усилили роль Нильса Флюга в революции. Роль товарища Флюга в революции стала легендарной, и широко распространено мнение, что именно его решение защитить революцию от либералов сделало её возможной. Кроме того, школам было дано указание изображать Нильса Флюга как настоящего шведского героя и пример для подражания, а официальные фотографии генерального секретаря украшают вагоны общественного транспорта!"
swe.85.a: "Отлично, товарищ Флюг - пример для всех нас!"

swe.86.t: "Союз писателей хочет написать биографию"
swe.86.d: "Союз писателей сообщил нам, что они намерены написать биографию нашего великого лидера Нильса Флюга, от детства до наших дней. Это, конечно, отличный способ популяризировать знания о своем генеральном секретаре, но начали возникать разногласия по поводу того, должны ли мы - и товарищ Нильс в частности - жестко контролировать то, что будет написано. Некоторые члены кабинета министров хотят, чтобы мы подвергли это начинание тщательному государственному контролю, в то время как другие считают, что, учитывая известную политическую корректность Союза писателей, это не приведет к дискредитации личности, а если это все же произойдет, мы всегда сможем подвергнуть книгу цензуре перед её выпуском."
swe.86.a: "Мы должны убедиться, что в книге будет изложена правда!"
swe.86.b: "Пусть писатели пишут так, как они хотят."

swe.87.t: "Жизнь Нильса Флюга"
swe.87.d: "Союз писателей завершил работу над биографией Нильса Флюга: в книге подробно описывается жизнь товарища Флюга, например, о том, как генеральный секретарь уже в возрасте 8 лет высказывал замечания о присущей современной феодально-капиталистической системе несправедливости, которая держала Швецию в цепях, и о том, как буржуазные шпионы, проникшие в рабочее движение, постоянно пытались помешать карьере Флюга, понимая, что он освободит шведских рабочих, если они не смогут его контролировать, чего, конечно, в конечном итоге им не удалось. Книга заканчивается описанием важной роли, которую Флюг сыграл в шведской революции, что можно считать отходом от позиции правительства, которая сохранялась со времени революции, когда главным событием, заложившим основу для революционного режима, считалась самопожертвовательная смерть Пер Альбина Ханссона."
swe.87.a: "Превосходное литературное произведение!"
swe.87.b: "Ложь за ложью, отмените биографию!"

swe.88.t: "Жизнь Нильса Флюга"
swe.88.d: "Союз писателей завершил работу над биографией Нильса Флюга: книга подробно описывает жизнь товарища Флюга, рассказывая историю от его рождения до прихода к власти в наши дни. В целом книга положительно оценивает усилия Флюга, хваля, например, его способность к самообразованию в ранней юности, что позволило ему подняться среди многих рабочих в социалистическом движении в начале 20 века, но иногда звучит и критический тон: например, подразумевается, что сила социалистического движения сильно пострадала от решения Флюга создать собственную партию, что привело к расколу шведского социализма. Более того, в книге также критикуется отсутствие Флюга в самые нестабильные часы революции, когда по улицам бродили тоталитарные военизированные формирования."
swe.88.a: "Критика - это хорошо, давайте!"
swe.88.b: "О нет, я так не думаю!"

swe.89.t: "Генеральный секретарь посещает рабочее место"
swe.89.d: "Чтобы приблизить режим к народу, генеральный секретарь, бывший промышленный рабочий, прибыл с визитом на завод, где бьется сердце шведской промышленности. Один из сотрудников секретариата по экономике тем временем разработал план по повышению эффективности таких заводов. Один из младших членов свиты генерального секретаря предлагает избавиться от этого чиновника и представить эту идею как собственную идею товарища Флюга в его заключительной речи, что продемонстрирует мудрость товарища Флюга шведскому народу."
swe.89.a: "Хитрый план! Примите меры."
swe.89.b: "Похвалите государственного служащего за его достижение!"

swe.90.t: "Нильс Флюг перенес сердечный приступ"
swe.90.d: "Трагедия: сегодня наш генеральный секретарь Нильс Флюг перенес сердечный приступ. К счастью, он пережил это бедствие, но после того, как его доставили к врачу, тот объяснил, что Флюг больше никогда не будет прежним. В дальнейшем он, вероятно, будет страдать от одышки, которая, скорее всего, будет прогрессировать. Кроме того, существует риск повторного сердечного приступа. Врач рекомендует товарищу Флюгу как можно больше отдыхать."
swe.90.a: "Отдыхать? Генеральный секретарь Швеции никогда не отдыхает!"

swe.91.t: "Плохое здоровье генерального секретаря становится достоянием общественности!"
swe.91.d: "После сердечного приступа товарища Флюга его одышка постепенно ухудшалась, как и предсказывал врач. В результате генеральный секретарь в конце концов сдался и сократил количество публичных выступлений, что, в свою очередь, подпитывает слухи среди шведского населения о том, что с их генеральным секретарем что-то не так, а новости о сердечном приступе тщательно цензурируются.\n\nИз-за нашего... рьяного культа личности Нильса Флюга распространяются слухи, что это доказательство того, что правительство обманывает шведское население, пытаясь изобразить Флюга богом, тогда как на самом деле он просто человек, который тоже может заболеть."
swe.91.a: "Собрать митинг, чтобы доказать, что Флюг в порядке!"
swe.91.b: "Пора перейти к минимизации ущерба!"

swe.92.t: "Митинг проходит безрезультатно"
swe.92.d: "Митинг, который мы организовали, чтобы доказать здоровье нашего вечного генерального секретаря, не смог развеять сомнения; более того, ситуация ухудшилась, поскольку, хотя речь началась относительно гладко, с самого начала было легко заметить, что генеральный секретарь не чувствует себя хорошо, и по мере продолжения речи его явно охватила усталость. Это даже побудило одного журналиста написать, что из-за этого события жизнь Нильса Флюга сократилась на три месяца. Естественно, с этим контрреволюционным отбросом быстро разобрались."
swe.92.a: "Я говорю вам, он в полном здравии!"

swe.93.t: "Зарезервирована гостиничная комната"
swe.93.d: "По мере того как состояние нашего генерального секретаря постепенно ухудшается, он больше не может ежедневно добираться из виллы Томтебо, дома Флюга, приобретенного им в 1924 году. Поскольку для выполнения своих обязанностей генерального секретаря ему важно иметь возможность встречаться с членами конгресса и другими должностными лицами шведского государства, он арендовал номер в отеле недалеко от Стокгольмского замка, где собирается ассамблея и где находится его офис. Сообщается, что он огорчен тем, что на время будет жить в гостиничном номере."
swe.93.a: "Это для блага страны..."

swe.94.t: "Предложение Линдерота"
swe.94.d: "С момента захвата власти тоталистами шведский конгресс превратился в учреждение, которое лишь утверждает решения генерального секретаря Флюга, практически не вызывая никаких волнений. Конгресс был заполнен преданными тоталистами, за исключением примерно 30% делегатов, которые не были удалены, чтобы сохранить видимость демократии, и которые объединились вокруг бывшего соратника Нильса Флюга Карла Чильбума и в основном безуспешно голосовали против почти всех предложений, причем каждое предложение получало одинаковое количество голосов «за» и «против» с момента укрепления контроля над SP.\n\nСегодня утром эта атмосфера политической апатии была внезапно разрушена: Свен Линдерут, лидер фракции внутри SP, выступающей за больший интернационализм и меньшую (европейскую) националистическую доктрину в партии, внезапно выдвинул предложение о создании «Politiska Byrån» - политического бюро - для выполнения обязанностей генерального секретаря от имени конгресса, пока его состояние не позволяет ему должным образом выполнять указанные обязанности. Это было быстро осуждено сторонниками Флюга во главе с Арвидом Олссоном, однако Кильбоммаре, став свидетелями раскола в рядах своих противников, воспользовались ситуацией и поддержали предложение. Впервые с 1937 года было принято предложение, противоречащее воле сторонников Флюга."
swe.94.a: "How dare they!"

swe.95.t: "Назначение «Politiska Byrån»"
swe.95.d: "После принятия Конгрессом предложения Линдрота, Конгресс должен был избрать делегатов, которые станут членами бюро. Неудивительно, что Линдрот представил свой собственный список, в котором он сам был указан в качестве председателя бюро, а остальные места были заняты его сторонниками, что по сути давало ему всю власть, которой ранее обладал Флюг. Однако Килбоммаре не поддался на это и представил свой альтернативный список сторонников синдикалистской демократии во главе с самим Килбомом. Олссон и флюггисты опасались, что оппозиция не сможет снова заблокировать предложение, и решили, что лучше помочь одной из двух сторон получить большинство, необходимое для захвата бюро - желательно той стороне, которая будет менее способна отстранить Флюга от власти."
swe.95.a: "Поддержать Линдерота - по крайней мере, он тоталист!"
swe.95.b: "Поддержать Килбома - по крайней мере, он нас не предал!"

swe.96.t: "Политическое бюро приказывает перевезти Флюга домой!"
swe.96.d: "Благодаря своему влиянию на созданное им Политическое бюро, Свен Линдерут получил фактический контроль над страной. Первым решением бюро стало возвращение Флюга в Томтебо. По заявлению бюро, это сделано для того, чтобы генеральный секретарь мог отдохнуть, но большинство считает, что настоящая причина заключается в том, чтобы политически умиротворить Флюга. Ведь без своего гостиничного номера Флюг не сможет легко добраться до коридоров власти в хорошем состоянии, и таким образом Линдероту и его соратникам будет значительно легче контролировать страну и вездесущих сторонников Флюга. Неудивительно, что генеральный секретарь сопротивлялся со всей своей мощью, но полицейские, «защищавшие» его, были неумолимы."
swe.96.a: "Это для твоего же блага, Ниссе!"

swe.97.t: "Политическое бюро собирается для принятия следующего решения!"
swe.97.d: "С устранением генерального секретаря контроль Политического бюро стал неограниченным. Теперь перед Линдротом стоит выбор: либо объявить об отставке Флюга сейчас, пока тот неспособен реагировать и находится в плохом состоянии здоровья, либо повременить, управляя страной в обозримом будущем, и рискнуть, что Флюг не выздоровеет и, возможно, в будущем отомстит ему за то, что он только что сделал."
swe.97.a: "Объявить об отставке Флюга!"
swe.97.b: "Останемся там, где мы есть!"

swe.98.t: "Избрание генерального секретаря"
swe.98.d: "С «отставкой» Нильса Флюга амбиции самого Линдрота стали явными. Флюггисты и смешанные тоталисты, теперь твердо осознавая, что Линдерут пытается сделать, и что отставка Флюга не была его собственным решением, поддерживают товарища Флюга и заявляют, что никогда не поддержат «крысу» Свена Линдерута на посту генерального секретаря, говоря, что они предпочтут даже Килбома на этом посту, чем Линдерута. Оппозиция Килбоммаре тем временем стремится сделать именно это, но и среди них ясно, что под предлогом «лучше знакомый дьявол» и учитывая плохое состояние Флюга, они склонны поддержать Флюга. В качестве темной лошадки на пост генерального секретаря выдвигается Свен Олов Линдхольм, сторонник жёсткой линии Хартии Тоала и генерального секретаря Флюга, который часто вступал в конфликт с более умеренными синдикалистами. Хотя некоторые осуждают его как псевдореакционера, он, похоже, имеет значительное влияние, учитывая трусливый умеренный подход Килбома и плохое здоровье Флюга. Похоже, Линдеррот переоценил свои силы: он проиграл гонку ещё до её начала, и, зная, что ни одна из сторон не будет к нему снисходительна за попытку захвата власти, его сторонники массово от него отказываются. Вопрос, однако, в том, какая сторона сдастся первой?"
swe.98.a: "Флюг переизбран в третьем туре!"
swe.98.c: "Линдхольм избран в третьем туре!"
swe.98.b: "Кильбом избран в третьем туре!"

swe.99.t: "Чистка фракции Линдрота!"
swe.99.d: "С устранением Флюга Политическое бюро также было автоматически распущено, поскольку оно являлось своего рода регентством для генерального секретаря. В связи с этим Линдерот и его сторонники планировали воспользоваться статьями, включенными в их предложение о восстановлении Политического бюро. Однако эти планы были прерваны, когда власти прибыли к Линдероту и арестовали его по подозрению в реакционных симпатиях. В тот же день в ходе показательного суда он был поспешно приговорен к тридцати годам каторжных работ и отправлен в тюремный комплекс на севере Швеции, специально предназначенный для врагов режима. В Стокгольме его больше не видели.\n\nНесколько других преданных сторонников Линдрота также были взяты под стражу. Власть Линдрота и его интернационалистов-тоталитаристов была сломлена."
swe.99.a: "Слава богу!"

swe.100.t: "Politiska Byrån распускает конгресс!"
swe.100.d: "С Килбомом во главе бюро, которое выполняет обязанности самого важного ведомства страны, бюро постановило, что политические барьеры, введенные ранее генеральным секретарем Флюгом, должны быть сняты, а конгресс распущен. Через месяц все делегаты конгресса должны будут принять участие в свободных выборах, без каких-либо политических барьеров, мешающих вам участвовать в них. Очевидно, что Килбоммаре намерены добиться того, чтобы конгресс, враждебный тоталитарному правлению, инициировал голосование об отзыве генерального секретаря Флюга, а затем восстановил демократию."
swe.100.a: "Время начинать кампанию!"

swe.101.t: "Восстановление голосования по Нильсу Флюгу"
swe.101.d: "После активной предвыборной кампании были проведены свободные выборы, которые изменили состав конгресса. Таким образом, мы сейчас инициируем голосование об отзыве, чтобы попытаться отстранить Нильса Флюга от власти, что, в свою очередь, позволит нам избрать нового генерального секретаря и защитить революционную демократию в Швеции."
swe.101.a: "Голосование об отзыве проходит, Нильс Флюг отстранен от должности!"
swe.101.b: "Голосование об отзыве не проходит, Флюг остается у власти."

swe.102.t: "Избрание генерального секретаря"
swe.102.d: "Конгресс, ориентированный на синдикалистско-демократические взгляды, отстранил Нильса Флюга от должности генерального секретаря, что, вероятно, скорее помогает ему, чем вредит, учитывая его слабое здоровье. Однако теперь конгресс должен избрать нового генерального секретаря. Большинство согласны с тем, что Карл Чильбум, который сейчас является спасителем шведской революционной демократии, должен стать новым генеральным секретарем от имени SSV. Однако SAC выдвинул кандидатуру Франса Северина, и члены обеих партий сформировали альянс в надежде полностью упразднить должность генерального секретаря, считая, что она ведет только к тирании."
swe.102.a: "Килбом избран генеральным секретарем."
swe.102.b: "Северин избран генеральным секретарем."
swe.102.c: "Конгресс упраздняет эту должность."

swe.103.t: "Конец эпохи" #Linderot rebuffed or recall vote failed
swe.103.d: "Сегодня первый генеральный секретарь Швеции перенес второй инфаркт. На этот раз ему не повезло так же, как в январе 1941 года, и он скончался после этого несчастья. Его жена была срочно доставлена в его номер в отеле, но когда она прибыла, было уже слишком поздно - генеральный секретарь скончался в одиночестве. Она потеряла мужа, а Швеция - своего лидера, и в результате в парламенте царит хаос, поскольку внезапно образовался вакуум власти. Однако этот вакуум вскоре был заполнен: после того как Линдерот и Килбом были ранее вытеснены, а фракция SP вновь объединилась, стало ясно, кто станет новым председателем SP."
swe.103.a: "Да здравствует генеральный секретарь [SWE.GetLeader]!"

swe.104.t: "Конец эпохи" #Linderot seized control
swe.104.d: "Сегодня первый великий секретарь Швеции перенес второй инфаркт. На этот раз ему не повезло так же, как в январе 1941 года, и он скончался после этого несчастья. Флюг провел последние месяцы своей жизни, ворча и злясь на Свена Линдеррута, который, будучи председателем «Политического бюро», отправил его домой «отдыхать», в результате чего он не мог ничего противопоставить фактическому осуществлению председателем власти, которая технически принадлежала ему. Однако, к лучшему или к худшему, он был дома, в своей вилле в Томтебо; останься он в гостиничном номере, который ему первоначально был выделен, он вполне мог бы умереть в одиночестве, без своей жены и ближайших сторонников. Теперь по улицам Стокгольма дует новый ветер."
swe.104.a: "Да здравствует генеральный секретарь Линдерут!"

swe.105.t: "Конец эпохи" #Recall vote succeeded
swe.105.d: "Сегодня первый великий секретарь Швеции перенес второй инфаркт. На этот раз ему не повезло так же, как в январе 1941 года, и он скончался после этого несчастья. Флюг провел последние месяцы своей жизни, ворча и гневаясь на своего бывшего соратника Карла Чильбума, который, будучи председателем «Политического бюро», восстановил социалистическую демократию, существовавшую сразу после революции, что нарушало принципы тоталитарной хартии, принятой в 1938 году, а затем использовал её в качестве оружия, чтобы сместить его с должности. Однако, к лучшему или к худшему, он был дома, в своей вилле в Томтебо; останься он в гостиничном номере, который ему был первоначально выделен, он вполне мог бы умереть в одиночестве, без своей жены и ближайших сторонников."
swe.105.a: "Он был не идеален, но, несмотря на это, был великим революционером!"

swe.106.t: "Конец эпохи" #Kilbom elected after Linderot rebuffed
swe.106.d: "Сегодня первый великий секретарь Швеции перенес второй инфаркт. На этот раз ему не повезло так же, как в январе 1941 года, и он скончался после этой беды. Флюг провел последние месяцы своей жизни, ворча и злясь на своего бывшего соратника Карла Чильбума, который, будучи вторым генеральным секретарем, восстановил социалистическую демократию, существовавшую сразу после революции, что нарушало принципы тоталитарной хартии, установленной в 1936 году, и на Свена Линдерута, который организовал уход Флюга на пенсию. Однако, к лучшему или к худшему, он был дома, в своей вилле в Томтебо; останься он в гостиничном номере, который ему был первоначально выделен, он, возможно, умер бы в одиночестве, без своей жены и ближайших сторонников."
swe.106.a: "Он был несовершенен, но, несмотря на это, был великим революционером!"

swe.107.t: "Смерть Нильса Флюга" #Sweden was a different kind of socialist or democratic
swe.107.d: "Характерный лидер SP, Нильс Сванте Флюг, сегодня перенес второй инфаркт. С момента первого инфаркта в январе 1941 года он был известен своим плохим здоровьем, и чтобы он мог оставаться политически активным, партия обеспечила ему номер в отеле в Стокгольме. Однако он не пережил второй инфаркт. Председателем SP стал Арвид Олссон."
swe.107.a: "Покойся с миром!"

swe.108.t: "Смерть Нильса Флюга" #Sweden was authdem, pataut or natpop
swe.108.d: "Мы получили сообщения о том, что один из самых известных шведских синдикалистов, Нильс Сванте Флюг, скончался от второго сердечного приступа, находясь в изгнании в [getFlygsRefuge]. Его руководство тоталитарной фракцией Швеции перешло к его соратнику Арвиду Олссону."
swe.108.a: "Слава богу!"

swe.109.t: "Конец эпохи" #Нильс Флюг can't be evacuated and Stockholm under attack
swe.109.d: "Поскольку враг приближается к Стокгольму, мы пришли к выводу, что плохое здоровье генерального секретаря не позволяет нам эвакуировать его. Таким образом, лидер тоталистов не имел иного выбора, кроме как дождаться прибытия вражеских войск, и ему была выдана таблетка цианида, чтобы он не попал в плен к врагу. В этот критический момент Швеция осталась без лидера; нам нужно немедленно выбрать нового генерального секретаря!"
swe.109.a: "Олссон - новый генеральный секретарь."
swe.109.b: "Линдеррот - новый генеральный секретарь."
swe.109.e: "Линдхольм - новый генеральный секретарь."
swe.109.c: "Килбом - новый генеральный секретарь."

swe.110.t: "Конец эпохи" #First heart attack happens while Stockholm is occupied
swe.110.d: "Сегодня Нильс Флюг перенес сердечный приступ. Возможно, при надлежащем уходе он бы выжил, но из-за падения Стокгольма Флюг оказался в военном лагере, где врачи были перегружены работой с ранеными солдатами и не имели необходимых средств для оказания помощи Флюгу. Он ушел из жизни мирно."
swe.110.a: "Новым генеральным секретарем стал Мак Олссон."

swe.111.t: "Второе вторжение Швеции на Аландские острова"
swe.111.d: "Второй раз вероломные шведы направили военные силы на архипелаг Аланд в Балтийском море в надежде аннексировать его. Это явно незаконное действие, учитывая нашу победу в арбитражном разбирательстве спора в 1920-х годах. Однако теперь, когда мы подвергаемся полномасштабной атаке и находимся на грани краха, Швеция увидела свой шанс захватить то, что по праву принадлежит нам!"
swe.111.a: "Мы ничего не можем сделать!"
swe.111.b: "Просим Германию заставить шведов отступить!"
swe.111.c: "Они должны отступить, иначе будет война!"

swe.112.t: "Вторжение на Аландские острова прошло успешно"
swe.112.d: "Хотя финны, как и следовало ожидать, весьма возмущены нашим законным захватом Аландских островов, наша операция прошла успешно. Ограничения, установленные в ходе немецкого арбитража в 1920-х годах, в котором было принято неразумное решение в пользу финнов, означали, что военные объекты на островах были ограничены, и мы взяли их под свой контроль практически без сопротивления!"
swe.112.a: "Добро пожаловать обратно, Аландские острова!"

swe.113.t: "Финляндия просит нашей поддержки!"
swe.113.d: "Финны находятся под сильным давлением в продолжающейся войне, и Швеция безжалостно этим пользуется, как и во время финской гражданской войны двадцать лет назад. Финны умоляют нас показать, что наше решение 1920-х годов должно быть выполнено, и заставить шведов отступить, но можем ли мы действительно позволить себе настроить шведов против себя в текущей ситуации?"
swe.113.a: "Мы не можем здесь помочь!"
swe.113.b: "Взыскать отступление Швеции!"

swe.125.t: "Швеция выходит из Рейхспакта"
swe.125.d: "Мы получили сообщение от шведского посла о том, что они намерены расторгнуть наш военный союз, официально и фактически прекратив свое участие в Рейхспакте."
swe.125.a: "Предатели!"

swe.126.t: "Швеция выходит из Интернационала"
swe.126.d: "Мы получили сообщение от шведского посла о том, что они намерены расторгнуть наш военный союз, официально и фактически прекратив свое членство в Третьем Интернационале."
swe.126.a: "Предатели!"

swe.127.t: "Прекращение деятельности Allmänna Säkerhetstjänsten"
swe.127.d: "С окончанием войны и возвращением мира в Швецию, специальная структура секретной службы, которая была создана, также завершила свою работу. В результате желания политиков сократить расходы, этот проект теперь будет прекращен, и агентства вновь будут работать автономно."
swe.127.a: "Это поможет нам сохранить наш бюджет."

swe.128.t: "Авария с ракетой"
swe.128.d: "Одна из наших ракет, которая тестировалась в рамках наших усилий по расширению знаний в области ракетостроения, попала в аварию: траектория ракеты, которая должна была упасть в Балтийское море, чтобы мы могли её забрать, была рассчитана неверно. В результате ракета упала почти в 200 км к северу от первоначально запланированной цели. Разумеется, местные власти уже занимаются этим вопросом."
swe.128.a: "Боюсь, что ракета потеряна..."

swe.129.t: "Бомба в Бэкэбо"
swe.129.d: "Немецкая ракета упала в шведском лесу недалеко от Бэкэбо, на территории, принадлежащей Роберту Густавссону, где оставила воронку диаметром пять метров. Наши военные уже прибыли на место и забрали обломки, которые в данный момент транспортируются в Стокгольм для экспертизы."
swe.129.a: "Кто нашел, тот и владеет!"

 swe.130.t: "Густав V Швеции отрекается от престола"
 swe.130.d: "В пресс-релизе, опубликованном сегодня перед Стокгольмским дворцом, Его Высочество король Густав V потряс мир, заявив, что он отрекается от престола Швеции, положив конец более чем 115-летнему правлению династии Бернадоттов. Его Высочество сказал: «Избранные представители шведского народа сочли необходимым потребовать моего отречения. Я не принимаю это решение легкомысленно, но не буду противиться воле народа». Шведской королевской семье разрешено остаться в стране, но она должна отказаться от всех королевских титулов. Члены королевской семьи, включая сына и внука Густава, предпочли покинуть страну, чем отказаться от своих титулов. Правящая партия SAP вместо королей назначила своего лидера Пер Альбина Ханссона президентом новой Шведской Республики. Будущее Швеции кажется неопределенным."
 swe.130.a: "Северное сияние становится все более тусклым."

 swe.131.t: "Шведская армия объявляет военное положение"
 swe.131.d: "После преобразования Швеции в социалистическую республику под руководством коалиции SAP-SSV и отмены монархии генерал Оскар Нигрен и шведские вооруженные силы под покровом ночи быстро оккупировали Стокгольм сегодня утром, объявив в городе военное положение. Батальонам военной полиции было приказано арестовать всех социалистических политиков, связанных с кабинетом Ханссона, а национальные силы безопасности были мобилизованы для подавления очагов социалистического сопротивления. Хотя поступают сообщения о некоторых кровопролитных столкновениях, похоже, что переворот прошел относительно без сопротивления. Одним из первых решений генерала Нюгрена во главе шведского государства было восстановление титулов королевской семьи, а также приглашение обратно Густава Адольфа, внука Густава V. Хотя Швеция, возможно, вновь обрела стабильность, её будущее остается неопределенным."
 swe.131.a: "Так или иначе, в Швеции восстановлен порядок."


### Flavor Event ###

swe_flavor.1.t: "Карин Бойе выпускает «För Lite»"
swe_flavor.1.d: "Карин Бойе, известная писательница, поэтесса и активистка за права женщин, окрашенная социализмом, только что выпустила свою последнюю работу. Это роман под названием «För Lite» («Слишком мало» или «За мало»), в центре которого находятся темы работы для достижения своих мечтаний или обеспечения себя, а также ответственности перед собой как личностью и перед своей семьей и друзьями. Бойе очень популярна и вызывает некоторые споры, поскольку развелась с мужем и вступила в романтические отношения с немецкой писательницей Маргот Ханель. Часто занимаясь политической деятельностью и ухаживая за своей неразделенной любовью Анитой Наторст, которая в настоящее время страдает от рака груди, Бойе страстно пишет о жизни, смерти и героизме. Роман Бойе, хорошо известный в шведских литературных кругах, продается как горячие пирожки."
swe_flavor.1.a: "Я должен будет когда-нибудь его прочитать."

swe_flavor.2.t: "Грета Гарбо снимается в фильме «Камилла»"
swe_flavor.2.d: "Грета Гарбо снимается в американском фильме «Камилла», романтической драме. Грета Гарбо - одна из самых известных личностей в киноиндустрии, как в Швеции, так и во всем мире. Фильм довольно безобидный и отличается высоким качеством производства, но некоторые более консервативные элементы нашего общества очень возмущены... её одежда слишком откровенная! Они требуют введения цензуры. Что нам делать?"
swe_flavor.2.a: "Этот наряд слишком откровенный! Введите цензуру!"
swe_flavor.2.b: "Похоже, это очень интересно. Пришлите мне билет!"

swe_flavor.3.t: "Пятилетие Адалена"
swe_flavor.3.d: "В мае 1931 года большая колонна забастовщиков двинулась к казармам штрейкбрехеров, которые работали на местных фабриках. Полиция вызвала на помощь военных, и до конца дня беспорядки закончились гибелью пяти забастовщиков от выстрелов военных. С тех пор социалисты ежегодно проводят марши в память о погибших рабочих, хотя консерваторы утверждают, что рабочие были вооружены и напали на них первыми. В этом году забастовки необычайно масштабны. Что нам делать?"
swe_flavor.3.a: "Пусть делают. В конце концов они устанут."
swe_flavor.3.b: "Разве одного раза не хватило? Пришлите военных!"

swe_flavor.4.t: "Окончательный приговор банде из Салы"
swe_flavor.4.d: "Летом прошлого года банда под руководством человека по имени Сигвард Нильссон-Турнеман (фамилию он добавил себе сам, предположительно потому, что это анаграмма слова «Manhunter») была арестована за убийство. Вскоре расследование вышло на первые полосы национальных новостей, когда выяснилось, что банда была виновна не только в убийствах, уходящих корнями ещё в 1931 год, но и в том, что она действовала почти как оккультная группа и была известна под прозвищем «The Magic Circle».\n\nНа днях лидер и его сообщники были приговорены судом: большинство получили пожизненное заключение, однако сам главарь был признан настолько психически больным, что его направили на принудительное закрытое психиатрическое лечение. Многие люди возмущены и предпочли бы, чтобы Сигвард Нильссон-Турнеман был изолирован навсегда!"
swe_flavor.4.a: "Мы должны уважать решение суда. Пусть будет закрытое лечение."
swe_flavor.4.b: "Организовать перевод этого чудовища в тюрьму."

swe_flavor.5.t: "Маньяк на свободе!"
swe_flavor.5.d: "Два года назад Сигвард Нильссон-Турнеман был приговорён к закрытому психиатрическому лечению, однако наши политики отменили это решение и отправили его в тюрьму. В заключении его психическое состояние, как сообщается, ухудшилось, и сразу после Рождества прошлого года он сбежал, убил таксиста и угнал его автомобиль. Полиция не располагает надёжными зацепками и опасается, что он мог уйти в подполье или даже покинуть страну..."
swe_flavor.5.a: "Что же я натворил?!"

swe_flavor.6.t: "Крупная забастовка в гостиничном секторе!"
swe_flavor.6.d: "После провалившихся переговоров с профсоюзами крупная забастовка в гостиничной сфере привела к локауту отелей по всей Швеции. От Стокгольма до Гётеборга и Мальмё вы не найдёте ни одного отеля с полноценным персоналом. Жёсткое силовое подавление протестующих может их разогнать… или вызвать ответную реакцию, тогда как переговоры могут усилить позиции красных партий. Мы также можем просто игнорировать ситуацию, но это, по крайней мере на время, ударит по нашей экономике."
swe_flavor.6.a: "Повторим Одолен - вводите армию!"
swe_flavor.6.b: "Начать переговоры."
swe_flavor.6.c: "Игнорировать. Само ведь прекратится?"

swe_flavor.7.t: "Городская резня"
swe_flavor.7.d: "Наши храбрые солдаты доблестно защищали правительственные распоряжения, когда забастовщики, красные и прочий сброд начали бросать бутылки и камни. Беспорядки и столкновения продолжались весь день, и более десятка рабочих были убиты, прежде чем протестующих окончательно разогнали. По какой-то причине нескольким журналистам удалось слить фотографии истекающих кровью мирных жителей на улицах Гётеборга, и теперь Швеция в шоке!"
swe_flavor.7.a: "Если бы они просто остались дома..."

swe_flavor.8.t: "Гостиничная забастовка окончена"
swe_flavor.8.d: "Забастовка продолжалась несколько месяцев, нанося ущерб нашей экономике и престижу, но в итоге мы их измотали. Забастовки завершились, и всё вернулось в норму… пока что."
swe_flavor.8.a: "Слава богу!"

swe_flavor.9.t: "Похороны Йёсты Экмана"
swe_flavor.9.d: "Легенда - Йёста Экман, самый популярный актёр и театральный режиссёр Швеции, - скончался в возрасте 47 лет после периода болезни. За последние одиннадцать лет Экман принял участие не менее чем в двадцати трёх постановках. За его похоронной процессией на улицах Стокгольма наблюдали более 100 000 (!) человек - примерно пятая часть населения города, - провожая в последний путь шведскую легенду."
swe_flavor.9.a: "Сегодня мы все скорбим."

swe_flavor.10.t: "Астрид Киндстранд в эфире радио"
swe_flavor.10.d: "Несколько дней назад Астрид Киндстранд зачитала новости на Sveriges Radio, национальном радиоканале, став первой женщиной в истории Швеции, сделавшей это. В последующие дни в государственные учреждения и различные газеты по всей стране поступили сотни возмущённых звонков и писем с жалобами на то, что женщине позволили читать государственные новости."
swe_flavor.10.a: "Им правда больше не на что возмущаться?"

swe_flavor.11.t: "«Lilla Lotta» из Ландшторма"
swe_flavor.11.d: "Новый шведский комедийный фильм вышел в прокат и неожиданно стал весьма популярным. Он вольно обыгрывает классическую историю Ромео и Джульетты, а также переворачивает привычный порядок вещей: директор банка становится рядовым после вступления в армию, а смотритель - командиром. Все валяют дурака, никто не относится к военной подготовке всерьёз и при этом влюбляются в одну из красивых женщин корпуса Lotta."
swe_flavor.11.a: "Хо-хо-хо! Обожаю весёлые фильмы!"
swe_flavor.11.b: "Как они смеют высмеивать шведскую армию?! Запретить!"

swe_flavor.12.t: "Гарбо смеется - Ниночка!"
swe_flavor.12.d: "«Гарбо смеётся» - так фильм рекламируют по всему миру, ведь шведская, прекрасная мегазвезда Грета Гарбо впервые пробует себя в комедийной роли. Фильм сосредоточен на Гарбо в образе Ниночки - ледяной синдикалистки, которая находит любовь и отказывается от своих политических взглядов, переезжая в капиталистическое общество. Несмотря на ироничный тон и насмешки над капитализмом, очевидно, что картина высмеивает все формы синдикализма."
swe_flavor.12.a: "Она так прекрасна! Купите мне билет!"
swe_flavor.12.b: "Как они смеют высмеивать славную шведскую революцию?! Запретить!"

swe_flavor.13.t: "Выход романа «Kallocain»"
swe_flavor.13.d: "«Kallocain» - роман, написанный вечно занятой Карин Бойе. Действие происходит в антиутопическом, вымышленном государстве, где критика власти строго запрещена, а государство контролирует каждую сторону вашей жизни. Произведение размышляет о мужчинах и женщинах, о классовых вопросах и конфликтах, которые из них проистекают. В конечном счёте это мрачное чтение, наносящее беспощадные удары по любым тоталитарным режимам - левым и правым."
swe_flavor.13.a: "Захватывающее и тревожное чтение!"
swe_flavor.13.b: "Как она смеет высмеивать сильное, славное государство? Запретить!"

swe_flavor.14.t: "Смерть Карин Бойе"
swe_flavor.14.d: "Карин Бойе была найдена без признаков жизни на холме к северу от Алингсоса после того, как, по всей видимости, намеренно приняла смертельную дозу снотворного. Совершив самоубийство на том же холме, который любила посещать её подруга-возлюбленная Натхорст, Бойе ясно продемонстрировала мотив своего поступка. Всегда известная своей эмоциональностью, в последние годы её чувства лишь усиливались: годы тяжёлой политической работы, написание романов и забота о своих возлюбленных оставили глубокие шрамы на её психике. Недовольство политическим развитием страны, проблемы в отношениях с возлюбленной Ханель и медленная смерть другой любви, Натхорст, в конце концов подтолкнули молодую писательницу к краю. Её сексуальность была «открытым секретом», и давление всего этого, возможно, оказалось слишком сильным, несмотря на то что семья принимала её такой, какая она есть. Вскоре после того как Карин покончила с собой, Натхорст умерла от рака, а Ханель, убитая горем и оставшаяся одна в чужой стране, с семьёй на родине, отрёкшейся от неё, также покончила с собой."
swe_flavor.14.a: "Трагический исход."

swe_flavor.15.t: "Основание IKEA"
swe_flavor.15.d: "На днях семнадцатилетний юноша по имени Ингвар Кампрад основал небольшую компанию, торгующую всем - от карандашей и рыболовных принадлежностей до чулок и ремней. Компания работает с родительской фермы как предприятие почтовой торговли, и, как сообщается, он лично развозит заказы на велосипеде, доставляя товары прямо к вашей двери."
swe_flavor.15.a: "Похоже, амбициозный молодой человек."

swe_flavor.16.t: "Открытие нового театра в Мальмё"
swe_flavor.16.d: "Недавно открывшийся Городской театр Мальмё является одним из крупнейших театров Европы и представляет собой поистине впечатляющее зрелище. В вечер открытия будет показана классическая пьеса «Сон в летнюю ночь» - произведение Шекспира."
swe_flavor.16.a: "Дайте мне билет!"

swe_flavor.17.t: "Смерть Арвида Линдмана"
swe_flavor.17.d: "Арвид Линдман был консервативным политиком, членом военно-морского штаба и многими считался отцом нации. Бывший адмирал занимал пост премьер-министра с 1906 по 1911 год, а затем вновь - фактически как постоянный глава правительства - с 1924 по 1934 год, когда он ушёл в отставку в пользу более молодого Йёсты Багге.\n\nГоворят, что Багге редко принимал какие-либо решения, не посоветовавшись со старшим Линдманом, но теперь этому пришёл конец. Состоятся публичные похороны, на которых будут присутствовать король и другие знатные особы."
swe_flavor.17.a: "Великий государственный деятель ушёл."

swe_flavor.18.t: "Арвид Линдман мёртв"
swe_flavor.18.d: "Арвид Линдман был бывшим консервативным политиком, членом военно-морского штаба и многими считался тираном, который делал всё возможное, чтобы задушить демократию и социализм в колыбели. Он занимал пост премьер-министра с 1906 по 1911 год, а затем вновь - фактически как постоянный глава правительства - с 1924 по 1934 год, когда ушёл в отставку в пользу более молодого Йёсты Багге.\n\nКогда наше революционное правительство провозгласило Швецию республикой, он оказался среди первых, кто бежал за границу, и умер - одинокий и никому не нужный - в квартире в Берлине."
swe_flavor.18.a: "Великий тиран ушёл."

swe_flavor.19.t: "Создание Valkyriorna"
swe_flavor.19.d: "С приближением войны к берегам Швеции каскадёр-пилот Эльза Андерссон, известная своими смелыми прыжками с парашютом в двадцатые годы, обратилась с просьбой создать полностью женскую авиационную бригаду. Проект получил название «Valkyriorna» - в честь крылатых женщин древнескандинавской мифологии, определявших, какие воины будут сражены на поле боя. Женщины массово записываются добровольцами, желая получить шанс сражаться за Швецию, однако идея вызывает споры. Многие считают, что присутствие женщин в армии не соответствует образу современной цивилизованной нации."
swe_flavor.19.a: "Каждый, кто хочет сражаться за Швецию, желанен!"
swe_flavor.19.b: "Дамы! Вы нужнее нам в тылу..."

## new flavour events ##

swe_flavor.20.t: "Премьера фильма «Sol över Sverige»!"
swe_flavor.20.d: "По мере того как кино и кинематограф становятся все более популярными и доступными для производства, сегодня вышел ремейк фильма «Sun Over Denmark» под названием «Sun Over Sweden». Фильм рассказывает о двух группах людей: продавщицах Инге и Бритте, которые путешествуют по Швеции на велосипедах, и Ниссе и Рут, которые наслаждаются медовым месяцем в своем грузовике. Фильм, снятый режиссером Арне Борнебушем, привлек внимание многих жителей Стокгольма и подарил им много смеха и радости. В фильме показаны красивые виды шведских городов и сельской местности, а также трогательная сцена свадьбы, которая растопит сердца зрителей. Фильм заканчивается сценой, в которой священник поздравляет молодоженов, напоминая зрителям о богатстве Швеции и их любви к своей стране."
swe_flavor.20.a: "Обязательно посмотрите!"

swe_flavor.21.t: "Странные исчезновения в Кируне"
swe_flavor.21.d: "Приход «черного понедельника» сильно ударил по шведскому обществу, но нигде так сильно, как на крайнем севере. С крахом мировой экономики шахты и связанные с ними отрасли, которые поддерживали жизнь региона, были вынуждены закрыться, в результате чего большая часть населения осталась без работы. Несмотря на то, что ситуация и без того плохая, поступают сообщения о пропавших без вести людях, которые бросают все свои вещи, уходят из дома и исчезают в дикой местности. Пока полиция занята урегулированием беспорядков среди рабочих и ростом преступности, правительство само должно решить эту проблему.\n\nДля расследования исчезновений была создана комиссия, единственным общим знаменателем для всех исчезнувших является абсолютная бедность."
swe_flavor.21.a: "Странно."

swe_flavor.22.t: "Медленное возвращение"
swe_flavor.22.d: "Кирунасвенскарна, шведы из Кируны, как местные СМИ называют пропавших без вести нищих, были найдены. Комиссия, которой было поручено их разыскать, наконец представила отчет о своих выводах, и он выглядит весьма мрачно.\n\nКогда наступил «чёрный понедельник» и шахты закрылись, бедные и обездоленные люди прослышали о событиях, происходивших недалеко от них, в российской Карелии. Здесь им обещали, что трудолюбивых шведов наймут на хорошую работу с хорошей зарплатой, они будут строить дороги, создавать поселения, при этом им будут гарантированы выходные дни и даже возможность посетить Швецию во время семестра. Но этого не случилось.\n\nВскоре после прибытия в Карелию они стали мишенью местной тайной полиции. После нескольких дней тяжелой работы мужчин вытаскивали из их домов для допросов, и большинство из них больше никто не видел. Детей помещали в школы, где еды было мало или не было вовсе, а для получения медицинской помощи приходилось проходить километры пешком в жаркое лето и суровую зиму. Когда наступил обещанный семестр, одна семья с ужасом обнаружила, что обещание отправить их домой не распространялось на их детей, которых до их возвращения поместили в детский дом.\n\nВ то время как на наши границы постепенно прибывают возвращенцы, рассказывающие истории ужасов и жестокого обращения, возможно, самые страшные истории ещё не были рассказаны, поскольку их хранители заперты в Сибири, в тюрьмах или под землей."
swe_flavor.22.a: "Господи, они возвращаются!"

swe_flavor.23.t: "Привет из Карелии!"
swe_flavor.23.d: "Кирунасвенскарна, шведы из Кируны, как местные СМИ называют пропавших без вести нищих, были найдены. В Швецию поступает поток писем, отправленных из нескольких деревень в Карелии, и комиссия, занимающаяся расследованием, проверяет содержащиеся в них утверждения.\n\nВ некоторых письмах есть деньги, но во всех есть добрые пожелания и информация о том, что они живут хорошо, или, по крайней мере, лучше, чем раньше. Неквалифицированные рабочие были наняты правительством для строительства дорог от деревни Ухта до Кема, а те, кто имел навыки в горнодобывающей промышленности, оказались наняты в Хибиногорске, недалеко от Мурманска, и все они получают заработную плату и обещанные привилегии. Хотя это и не совсем утопия, комиссия довольна тем, что может просто назвать всю эту историю добровольной эмиграцией, не совсем отличающейся от эмиграции в Америку."
swe_flavor.23.a: "Хибино-что-теперь?"

swe_flavor.25.t: "Железнодорожная катастрофа в Губберо"
swe_flavor.25.d: "В результате шокирующей катастрофы потерпел крушение поезд, следовавший по железной дороге в Губберо. Причины и обстоятельства этого происшествия пока неизвестны, однако известно, что в результате инцидента погибли несколько человек. Эта катастрофа, которая сейчас называется самой страшной железнодорожной катастрофой в истории Швеции, потрясла всю страну."
swe_flavor.25.a: "Какая трагедия!"

swe_flavor.26.t: "Странный случай с пропавшей собакой"
swe_flavor.26.d: "Известная семья фон Розенов издавна занималась эзотерическими вопросами. От пожертвования самолета белым в финской гражданской войне до служения короне в самых разных ролях, погружаясь в духовные тайны древней Туле, семья фон Розенов имеет много дел. Однако для Бьорна фон Розена, молодого потомка знатной семьи, главной страстью является природа. В отличие от своего брата Карла Густава фон Розена, активного пилота и смелого наемника, Бьорн увлечен животными всех видов и цветов, в особенности собаками.\n\nВ детстве Бьорн всегда был увлечен странной породой коротких, коренастых, но удивительно стройных собак, которые жили на большинстве ферм в его районе. Небольшие и несколько пушистые, готовые лаять и защищать скот, они имели характерный внешний вид, который, по крайней мере для Бьорна, означал, что эта порода собак, безусловно, заслуживает сохранения. К сожалению, Бьорн не видел таких собак уже несколько десятилетий. Тем не менее, как аристократ, увлеченный природой, Бьорн фон Розен поднял этот вопрос перед своим коллегой, любителем природы и собак К-Г Зеттерстеном, который решил присоединиться к Бьорну в велосипедной поездке по сельской местности, чтобы спасти эту исчезающую породу собак."
swe_flavor.26.a: "Удачи!."

swe_flavor.27.t: "Фон Розен оправдан!"
swe_flavor.27.d: "После нескольких недель поисков по Вараслаттену, обширной сельскохозяйственной местности в Вестрагёталанде, фон Розен и его измученный спутник Зеттерстен наконец-то нашли то, что искали. Посетив одну ферму за другой и отследив одну собаку за другой, они составили список оставшихся представителей породы и наконец смогли зарегистрировать её как уникальную, а не просто как особый вид дворняг.\n\nОни приобрели достаточное количество собак, чтобы обеспечить будущее породы, и многие считают, что благодаря их вмешательству удалось избежать судьбы более крупной, но трагически вымершей породы далбохунд. Уже сейчас считается, что эта собака, недавно получившая название Svensk Vallhund, на самом деле является древней породой, которую использовали даже древние викинги! В то время как Svenska Kennelklubben - авторитетный орган по всем вопросам, связанным с собаками - спорит о том, следует ли называть эту породу просто Svensk Vallhund или Västgötaspets, фон Розен недавно услышал о другой породе, которую необходимо спасти, ещё дальше на севере."
swe_flavor.27.a: "Большая собака в маленьком теле."

swe_flavor.28.t: "Благородный, художник, собака"
swe_flavor.28.d: "Уже почти два десятилетия в залах Svenska Kennelklubben идет яростная дискуссия. С одной стороны стоят сторонники породы, которую они называют Jämthund, а с другой - те, кто считает её просто дворняжкой. Слишком большая, чтобы считаться просто разновидностью норвежского элкхаунда, но слишком маленькая, чтобы быть какой-то породой боевых собак, сторонники ямтхунда хотят занести её в книги как самостоятельную породу. Теперь, воодушевленный своим открытием более низкорослой породы шведский вальхунд, фон Розен присоединился к дискуссии, поддержав ярого сторонника Акселя Линдстрёма, известного художника.\n\nУтверждая, что порода уникальна и не является просто разновидностью норвежской, Линдстрём приводит несколько аргументов в пользу того, что эта собака особенная, насколько она отличается от других и как её используют жители Йемтланда. Более того, Линдстрём рассказывает мрачную сказку о том, что порода происходит от большой собаки, принадлежавшей королю Олаву Норвежскому, а значит, и от викингов. Для Линдстрёма это очень личное дело, так как он путешествовал по сельской местности в поисках собак, похожих на собак фон Розена и Зеттерстена. После инвентаризации Линдстрём купил столько собак этой породы, сколько смог, и утверждает, что в одиночку спас породу от вымирания, постоянно окруженный тридцатью собаками в своем доме. Именно эта приверженность впервые привлекла внимание фон Розена к делу ямтхунда, что позволило вынести дискуссию о породе на национальный уровень. Пока дискуссия продолжается, судьба породы остается неопределенной."
swe_flavor.28.a: "Боже мой!"

swe_flavor.29.t: "Оправдание"
swe_flavor.29.d: "Это заняло время и энергию. Потребовались бесконечные встречи и бесчисленные газетные статьи. Потребовались книги и одна-две личные обиды. Линдстрём был оправдан. Ямтхунд, которого жители Ямтланда используют, по всей видимости, уже тысячу лет или больше, наконец получил признание.\n\nУже создан новый клуб, посвященный исключительно этой породе, и предпринимаются активные усилия, чтобы она просуществовала и процветала ещё тысячу лет, как связующее звено между прошлым и настоящим. Для Линдстрёма это действительно очень личное дело. Увидев, как порода, которая была широко распространена в его молодости, сократилась до нескольких экземпляров, разбросанных по огромной территории, он практически в одиночку спас ее. Как и следовало ожидать, его сторонники считают его героем, а его противники удобно замолчали после решения Svenska Kennelklubben включить породу в свои ряды."
swe_flavor.29.a: "О, как мило!"

swe_flavor.30.t: "Северные братья"
swe_flavor.30.d: "В течение последних месяцев наше правительство начало получать тревожные сообщения о странных явлениях и загадочных передвижениях неопознанных людей вокруг озера Хельгасён в Смоланде. Хотя люди без документов не являются чем-то необычным в такой обширной стране, как Швеция, и обычно их оставляют в покое, если они не представляют угрозы для безопасности государства, этот конкретный случай оказался исключительным. Первые необычные сообщения содержали упоминания об организованных бандах, отправляющихся в ближайшие сельские районы и, по-видимому, «разведывающих» деревни, при этом размахивая старыми винтовками и нося униформу времен Первой мировой войны. После того как мэр Векшё, крупнейшего города местного муниципалитета, направил полицию для расследования, правоохранители выследили подозреваемых в руинах замка Кроноберг, который теперь превратился в временную оперативную базу этой новой милиции.\n\nОрганизаторами всего этого предприятия оказались британские националисты, монархисты и другие радикальные правые изгнанники, которые в последние годы добровольно покинули Союз и с тех пор бродят по Европе в поисках поддержки. При допросе лидер группы - предположительно уроженец Швеции, называющий себя «Det Härliga Lejonet» (Славный Лев) - объяснил, что с его отделением Партии национального единства Шведского королевства связались члены Right Club (известного английского движения, проповедующего нордизм, расизм и антисемитизм), которые искали братского сотрудничества в своей борьбе против дегенеративного социализма. Насколько удалось выяснить мэру, группу иностранцев возглавлял человек по прозвищу «Золотой», или Sē Gyldenan Ænne, как его предпочитают называть на староанглийском языке.\n\nНесмотря на заявления о том, что они «нормальные люди», прибывшие на «Землю, Север, Мать Свеа», группа, прозванная местными журналистами «Северными братьями», способна создать проблемы, если её оставить без внимания. Их ненависть ко всему, что, по их собственным словам, пытается лишить их культуры, нации и цивилизации, может превратиться в опасный военизированный режим, сеющий хаос в близлежащих поселениях. Что делать с этой группой самоуправцев?"
swe_flavor.30.a: "Их рвение... достойно восхищения."
swe_flavor.30.b: "Разогнать этих безумцев!"

swe_flavor.31.t: "Ева в Индии!"
swe_flavor.31.d: "Ева Диксон, известная автомобилистка и авиатор из высшего общества Швеции, снова отправилась в путешествие. После того, как она прославилась как первая женщина-автомобилистка, пересекшая Сахару в поездке из Найроби в Стокгольм вместе со своим водителем-механиком Хасаном Али, Ева решила снова отправиться в великое путешествие. Новая цель? Шелковый путь. Недавно опубликовав книгу «Ева в Сахаре» о своих приключениях в Африке, Ева была увлечена духом исследований и путешествий, который поддерживал и культивировал её муж и соратник по приключениям Брор фон Бликсен-Финеке, а также их общий друг Эрнест Хемингуэй. После свадьбы Евы и Брора и долгого путешествия на лодке Хемингуэя «Пилар» Ева заявила о своем желании пойти по стопам Свена Хедина и совершить долгое путешествие до Китая. Однако путешествие пока что складывается нелегко. С момента пересечения границы с Ближним Востоком Еву преследуют не только болезни, но и бандиты и грабители, а путешествие оказалось гораздо дороже, чем планировалось изначально. На данный момент ей удалось добраться до Калькутты, но прежде чем она смогла спланировать следующий этап путешествия, бедная Ева заболела загадочной болезнью.\n\nЕстественно, предписанным лечением загадочной болезни Евы было лечение мышьяком, что, естественно, отравило путешественницу, положив конец путешествию в Индии, хотя, возможно, это и к лучшему. Хотя Индия сама по себе не является мирной страной, находясь в состоянии бесконечной гражданской войны между тремя сторонами, Китай находится в гораздо худшем состоянии. Цин снова погрузилась в анархию, Шелковый путь закрыт на неопределенный срок, и Ева просто устала от всего этого беспорядка. Уже сейчас, хотя она все ещё прикована к больничной койке и её средства на исходе, Ева планирует снова отправиться в путешествие по Африке, гораздо более мирному континенту по сравнению с Азией.\n\n«Я верю, что человек, однажды попавший под чары Африки, никогда больше не сможет быть свободным. Там ты вступаешь в тесный контакт с природой, волшебной и нетронутой человеческим влиянием, и я считаю, что в этом заключается величайшее очарование Африки»."
swe_flavor.31.a: "Лечение мышьяком? Что?"

swe_flavor.32.t: "Запечатано и конфиденциально"
swe_flavor.32.d: "Собаки - лучшие друзья человека, это факт. Собак можно дрессировать, поручать им простые задачи, и, как показала Первая мировая война, они могут положительно влиять на исход сражений. Поэтому, по мнению психологов Вальдемара Феллениуса и Гуннара Боальта, несложно представить себе тюленей как лучших друзей человека в океане, и именно поэтому они предложили несколько безумный план, предполагающий использование тюленей в качестве подводных разведчиков. Несмотря на странность этой идеи, Феллениус и Боальт каким-то образом сумели получить финансирование от военно-морского флота, персонал из зоопарка Скансен в Стокгольме и свой собственный секретный остров Галё.\n\nПод кодовым названием «Пальмен» Феллениус и его сотрудники будут в основном изолированы на острове в течение неопределенного количества лет, работая в условиях строжайшей секретности, чтобы создать безопасную для тюленей среду для обучения и испытаний. Для этой задачи было собрано около двадцати тюленей, от серых до морских, и было вложено много энергии в создание достаточно хорошей среды обитания, в которой они могли бы процветать. Для них был создан огромный замаскированный бассейн, позволяющий им свободно пользоваться обычной морской водой, и тюлени регулярно кормятся, как в рамках простого питания, так и в рамках обучения. Хотя это и странный план, собственные инвестиции Феллениуса в проект, а также отчаянное стремление военно-морского флота разработать хорошую противолодочную систему фактически закрепили сделку. Феллениус и его семья будут проживать на Гало вместе с несколькими коллегами, которые дали клятву хранить тайну, от повара до дрессировщиков животных, дайверов и специальных охранников. Некоторые тюлени, такие как Поттифар, Лотта, Бигге и Пелле, уже стали известны своей внимательностью и эффективностью в дрессировке."
swe_flavor.32.a: "Давайте не будем об этом никому рассказывать."

swe_flavor.33.t: "Подводные лодки и морские котики"
swe_flavor.33.d: "В самом сердце Стокгольмского архипелага тюлени усердно трудятся. В самой глубокой части залива, окруженная водорослями и мусором, лежит подводная лодка, которую нужно обнаружить. На поверхности, оснащенный специально изготовленным ремнем с карбидными лампами-буями, тюлень Пелле готовится к действию. После мотивации рыбой и веселой командой Пелле ныряет в воду, сканируя дно и исчезая из виду. Тишина. Где тюлень? Где Пелле? Проходят минуты, кричат птицы, усиливается ветер. Неужели Феллениус случайно выпустил тюленя на волю, случайно освободил его навсегда? Тишина оглушительна... «ПЛОП!» Высунув голову вдали, Пелле мчится к Феллениусу и компании, полный энергии и энтузиазма. Он мчится по рампе, практически набрасываясь на обслуживающего, которому поручено его кормить, и чуть не сбивая его с ног. Быстрая проверка упряжи показывает результат операции: один из идентификационных буев больше не прикреплен к упряжи, и после некоторого поиска с помощью бинокля сигнал обнаруживается, прикрепленный непосредственно к подводной лодке, а ламповый буй теперь мягко покачивается на поверхности. Пелле - сегодняшний чемпион, если не чемпион всего проекта, и как таковой получает много подарков.\n\nВ то время как Пелле окружен обожанием и любовью, Феллениус и компания испытывают только огромную радость от успеха. Годы упорного труда, долгие дни бесконечных тренировок и слишком много тонн рыбы, чтобы даже вспомнить, наконец окупились. Когда подводная лодка вдали поднимается на поверхность с прикрепленным буем, становится ясно, что проект полностью оправдал себя. На тюленей, надетых на которых установлены ремни с радиостанцией и буями с лампами, можно положиться не только в плане обнаружения подводной лодки, но и в плане прижимания к проводам, установленным на судне, в процессе чего один или несколько буев прикрепляются непосредственно к морскому судну. Более того, тюлень может уплыть от судна после выполнения задания, не задерживаясь поблизости и не подвергаясь опасности от мин или бомб. Действительно, как только буй прикреплен к самому кораблю, для вывода судна из строя требуется всего одна правильно настроенная глубинная бомба. После испытаний со всеми двадцатью тюленями только один тюлень не смог прикрепить буй к цели, что фактически рассматривается как статистическая аномалия.\n\nСам Пелле - интересный экземпляр. Пойманный в молодом возрасте в Ботническом заливе, как и большинство других тюленей, Пелле вскоре оказался в центре внимания и энергии благодаря своей дружелюбной и энергичной личности. Стремящийся к общению, стремящийся быть активным с другими, как с тюленями, так и с людьми, Пелле считается символом секретного проекта. Также известный как Флигар-Пелле, Летающий Пелле, этот маленький тюлень однажды случайно оказался в долгом авиапутешествии и был найден только после того, как самолет вернулся в ангар. Однако, в отличие от других тюленей, Пелле не считается пригодным для выпуска в природу по окончании проекта и был выбран сотрудниками зоопарка Скансен для возвращения в Стокгольм."
swe_flavor.33.a: "Надеюсь, скоро посетить Пелле!"

swe_flavor.34.t: "Суровый моряк"
swe_flavor.34.d: "На военном корабле «Дроттнинг Виктория» служит моряк. Он имеет грубую шерсть, очень маленький рост и зовут его Нике. Он щенок. Родившийся в ноябре 1939 года, Нике вскоре был призван в военно-морской флот в качестве корабельной собаки и направлен на военный корабль. В возрасте всего двух месяцев он впервые прибыл на военный корабль и получил звание матроса второго класса. В его послужном списке указано, что по прибытии его профессия была «щенок», он был неженат, а его характер соответствовал характеру фокстерьера. С момента присоединения к экипажу военного корабля Нике был зачислен во «вторую собачью роту», ему разрешалось бродить по палубе и он даже получил работу посудомойщика. Однако эта должность не очень подходила Нике, который часто вступал в ожесточенные споры с поваром из-за остатков еды. Во время отпуска на суше Нике размещался у младшего флаг-офицера.\n\nВ конце концов Нике был переведен в батарею и отправлен в специальную школу для корабельных собак, а затем переведен в ту же школу, что и другие стажеры. По-видимому, Нике так хорошо освоил роль члена батареи, что перед началом стрельбы он бегал по палубе, лая, чтобы предупредить всех. После периода отличной службы Нике был повышен до корабельной собаки второго класса, но вскоре потерял свою должность из-за повторяющегося плохого поведения. Во время чемпионата Швеции по хоккею с мячом Нике был настолько увлечен зрелищем, что выбежал на поле, чтобы поиграть с остальными участниками. Кроме того, Нике вскоре потерял поводок в Стрёмстаде и начал бегать по городу, лая, валяясь в грязи и доставляя всем неудобства. В конце концов Нике стал гораздо спокойнее, получил свою собственную форму и с тех пор достойно служит в военно-морском флоте. Известный своим дружелюбным нравом и отличными навыками плавания, Нике нравится всем."
swe_flavor.34.a: "О боже, он просто очарователен!"

swe_flavor.35.t: "Смерть скогфиннов"
swe_flavor.35.d: "Финская диаспора в Швеции довольно большая и разнообразная, но, пожалуй, самой забытой её частью являются скогсфинны, или метсасуомалайсет по-фински, коренные жители шведско-норвежской границы, которые прибыли в этот регион в конце 1500-х годов в рамках политики переселения, проводимой Карлом IX. Основной причиной проведения этой политики было то, что многие шведы уже поселились в этих регионах, но только вблизи русел рек, и поэтому финны, в основном из лесных районов восточной половины Шведского королевства, таких как Саволакс и Тавастланд, были привезены для заселения лесных районов, оставленных пустыми самими шведами. В условиях изоляции у этих лесных финнов сформировалась своя субкультура, и они редко взаимодействовали с более широким финским населением на родине или в районах Швеции, заселенных финнами. Некоторые из них оказались в Нья-Швеции, шведской колонии в Новом Свете, как правило, после тюремного заключения.\n\nКультура скогфиннов начала умирать после того, как шведские власти усилили их ассимиляцию в большинство населения, причем наиболее значительным фактором стал запрет на использование финского языка. Скогфинны, которые занимались подсечно-огневым земледелием, уже находились в упадке из-за предыдущего запрета на эту форму сельскохозяйственной экспансии, первоначально введенного потому, что древесный уголь, используемый скогфиннами, был ценен для зарождающейся шведской металлургической промышленности.\n\nК началу XX века скогфинны почти исчезли, за исключением нескольких оставшихся носителей языка, и эти немногие выжившие стали предметом большого интереса для нового независимого финского государства. Этот интерес недавно усилился после смерти известной скогфинны Кайсы Вилхуйнен, которая была известна во всем мире благодаря своим интервью с финским исследователем народного творчества Лаури Кеттуненом. Вилхуйнен участвовала в многочисленных интервью с Кеттуненом и несколькими другими финскими исследователями и писателями, и её знания финской мифологии, народных традиций и старых обычаев скогфиннов были высоко оценены финскими учеными. её репутация ведьмы и местной мудрецы вызывала подозрения у шведских властей, но это только добавляло ей загадочности в глазах финнов. С её смертью важная часть знаний о скогфиннах уходит из этого мира, и, по оценкам, остальной части этой меньшинственной группы осталось жить, в лучшем случае, одно или два поколения, прежде чем она полностью исчезнет."
swe_flavor.35.a: "Медленный конец островного народа."

swe_flavor.36.t: "Движение Корпела"
swe_flavor.36.d: "Северные территории Швеции - это отдаленные и малонаселенные регионы, и связь между Стокгольмом и самыми северными районами Лапландии едва ли можно назвать хорошо налаженной или часто используемой. Однако в редких случаях из далекого севера доходят новости, и редко они бывают столь же странными, как последняя история, дошедшая до Стокгольма. Согласно отчету местного чиновника, среди жителей северной Швеции возник культ, основанный финским проповедником Тойво Корпела, но фактически превратившийся в полноценную секту благодаря его последователю Сигурду Сиикаваара. Финская ветвь лютеранства, известная как лаэстадизм, стала главной инкубаторной средой для этого странного движения, поскольку является самым популярным движением среди христиан Лапландии.\n\nИзвестный как довольно консервативная и замкнутая ветвь лютеранства, лаэстадизм популярен в западных и северных частях Финляндии и Швеции и имеет довольно большое количество последователей среди саамов. Недавно получившее название «движение Корпела» возникло среди этой довольно традиционалистской ветви лютеранства, но среди корпелистов трудно найти традиционализм. Новое движение, среди прочего, проповедует, что Антихрист приземлился на Земле и пробудет на ней 1335 дней, и только те, кто следует движению Корпела, по словам Сиикаваары, насчитывающему около 664 или 666 человек, полетят на хрустальном ковчеге в Палестину.\n\nЛюбопытно, что пророк Сиикаваара утверждал, что ковчег должен был прибыть зимой 1935 года, но такого небесного творения так и не произошло. Движение известно проведением крупных митингов в таких городах, как Кируна и Луулайя, которые особенно популярны среди местных финнов и саамов. В этих митингах часто участвует местная женщина, чаще всего подросток, которая смотрит на лица собравшейся толпы, и если она видит чье-то лицо черным, она называет этого человека одержимым дьяволом, а это недуг можно излечить, только взойдя на церковные ступени и выкрикивая оскорбления в адрес дьявола.\n\nДвижение в основном считается безвредным, хотя местные жители и даже сам Корпела считают его формой милленаристской ереси с потенциально опасными последствиями. Некоторые местные полицейские склонны соглашаться с этим, и некоторые члены движения Корпела были заключены в тюрьму, что привело к столкновениям между полицией и членами движения, пытавшимися освободить заключенных. В новостях о движении сообщалось, что по мере того, как Сиикаваара продолжает терять поддержку, он становится все более эксцентричным, и его недавнее принудительное посещение психиатрической больницы, по-видимому, только усугубило ситуацию. Ходят слухи о том, что движение развивается в ещё более эзотерическом направлении, хотя остается неизвестным, подтверждаются ли они реальностью или являются лишь спекуляциями и гиперболами."
swe_flavor.36.a: "Что, черт возьми, они там делают?"



### TO BE REVISED STUFF ###

swe.700.t: "Стокгольмская конференция"
swe.700.d: ""
swe.700.a: "Пригласите другие скандинавские страны!"
swe.700.b: "Это плохая идея..."

swe.800.t: "Стокгольмская конференция"
swe.800.d: "Швеция пригласила нас на встречу, посвященную углублению сотрудничества между скандинавскими странами и народами. Принимаем ли мы это приглашение?"
swe.800.a: "Конечно!"
swe.800.b: "Думаю, я пас..."

swe.1700.t: "Открытие Стокгольмской конференции"
swe.1700.d: "Сегодня утром премьер-министр Швеции открыл Стокгольмскую конференцию по скандинавскому сотрудничеству. В течение следующих нескольких дней делегаты будут обсуждать политические и культурные вопросы."
swe.1700.a: "Хорошо!"

swe.2000.t: "Стокгольмский договор"
swe.2000.d: "После долгих обсуждений представители Норвегии, Швеции и Дании подписали сегодня утром Стокгольмский договор. Договор обязывает подписавшие его стороны стремиться к интеграции стран Северной Европы и тесному сотрудничеству по всем вопросам."
swe.2000.a: "Новый рассвет для Скандинавии."

