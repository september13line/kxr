swe_establish_allmana_sakerhetstjansten_desc: "В связи с тем, что война вновь приближается к нашим берегам, было предложено объединить наши службы безопасности и разведки под единым командованием Генеральной службы безопасности. Мы поручим опытному полицейскому Эрику Халлгрену руководить этой секретной операцией по поддержанию целостности нашей национальной безопасности."


