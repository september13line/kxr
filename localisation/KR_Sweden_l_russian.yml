###News 

newsswe.1.t: "Выборы в Швеции 1936 года"
newsswe.1.d: "Подсчет голосов завершен, и известны результаты всеобщих выборов 1936 года в Швеции. Несмотря на растущую обеспокоенность по поводу политической радикализации в Европе, шведский народ вновь продемонстрировал свою приверженность парламентской демократии и конституционной монархии. С возвращением к власти демократической партии, обещавшей полную поддержку сохранения нынешнего статуса-кво монархии и существующих политических норм, будущее Швеции теперь будет стабильным и безопасным.\n\nВ речи перед собравшимися представителями прессы новоизбранный премьер-министр в сопровождении лидеров новой коалиции и оппозиции объявил о своем намерении сформировать новое правительство. «Власть - это не только власть, это ещё и ответственность»."
newsswe.1.a: "Как и ожидалось, Швеция выбрала стабильность." #norm
newsswe.1.b: "Капиталистические рабы!" #socialists
newsswe.1.c: "Кризис предотвращен!" #swe

newsswe.2.t: "Красная революция в Швеции"
newsswe.2.d: "В результате потрясающего поворота событий Швеция пережила полномасштабный политический переворот. Партия SSV, обеспечившая себе небольшую, но значимую победу на выборах, не стала терять времени и приступила к перестройке основ шведского государственного устройства. Многовековая монархия была быстро ликвидирована, а король Густав был вынужден отречься от престола под нарастающим давлением.\n\nНапряженность достигла критической точки, когда группа реакционных военных офицеров предприняла попытку государственного переворота против нового режима. Однако их план провалился, поскольку многие рядовые солдаты дезертировали и присоединились к растущей рабочей милиции. Рано утром вблизи Риксдага начались боевые действия, но восстание было быстро подавлено. Мятежные генералы были арестованы, а их амбиции были разбиты теми самыми солдатами, которыми они когда-то командовали.\n\nХотя революция укрепила власть SSV, в самом революционном движении уже начали появляться трещины. Фракционные споры и идеологические разногласия бурлят под поверхностью. Тем не менее, одно можно сказать наверняка: красный флаг теперь развевается над Стокгольмом, и путь Швеции в будущее безвозвратно изменился."
newsswe.2.a: "Даже Швеция поддается красному приливу..." #norm
newsswe.2.b: "Рабочие захватили свою судьбу!" #socialists
newsswe.2.c: "Вперед, товарищи!" #swe

newsswe.3.t: "Военные восстанавливают монархию"
newsswe.3.d: "После того как SSV с небольшим перевесом одержала победу на выборах, она не стала терять времени и приступила к демонтажу старого порядка. В течение нескольких недель король Густав был вынужден отречься от престола, и монархия, долгое время считавшаяся опорой шведских традиций, была сметена во имя революции. Но старая гвардия не была готова уйти без боя. Напряженность достигла предела, когда группа высокопоставленных военных офицеров во главе с генералом Хельге Юнгом начала скоординированную контрреволюцию. На рассвете войска двинулись на Стокгольм и окружили Риксдаг. Началась короткая, но жестокая перестрелка, когда лояльные правительству ополченцы попытались защитить социалистическое правительство. Превосходящие их по оружию и тактике, они быстро потерпели поражение.\n\nК середине утра радиостанции и газеты по всей стране передали заявление военных, Риксдаг был распущен, власть перешла к временному военному совету, и началась национальная чистка «красных элементов». В ходе массовых репрессий социалистические лидеры, главы профсоюзов и подозреваемые в симпатиях к ним были арестованы или вынуждены уйти в подполье. После насильственного восстановления порядка военные объявили о восстановлении монархии. Принц Густав Адольф был коронован как король Густав VI - символический шаг, направленный на демонстрацию стабильности и преемственности. Несмотря на королевские церемонии и публичные заверения, реальная власть по-прежнему остается в руках военных."
newsswe.3.a: "Корона вернулась, но кто держит меч?" #norm
newsswe.3.b: "Опять неудачные революции? Блеать." #socialists
newsswe.3.c: "Необходимое действие." #swe

newsswe.4.t: "Шведские военные поддерживают диктатуру"
newsswe.4.d: "После того как SSV с небольшим перевесом одержала победу на выборах, она не стала терять времени и приступила к демонтажу старого порядка. В течение нескольких недель король Густав был вынужден отречься от престола, и монархия, долгое время считавшаяся опорой шведских традиций, была сметена во имя революции. Но старая гвардия не была готова уйти без боя. Напряженность достигла предела, когда группа высокопоставленных военных офицеров во главе с генералом Хельге Юнгом начала скоординированную контрреволюцию. На рассвете войска двинулись на Стокгольм и окружили Риксдаг. Началась короткая, но жестокая перестрелка, когда лояльные правительству ополченцы попытались защитить социалистическое правительство. Превосходящие их по оружию и тактике, они быстро потерпели поражение.\n\nК середине утра радиостанции и газеты по всей стране передали заявление военных, Риксдаг был распущен, власть перешла к временному военному совету, и началась национальная чистка «красных элементов». По всей стране проводились массовые аресты видных социалистов, профсоюзных деятелей и подозреваемых в диссидентстве. Хотя многие надеялись на восстановление монархии или возвращение к демократическому правлению, военные не давали таких обещаний. Принц Густав Адольф по-прежнему не участвует в общественной жизни, и ходят слухи, что генералы не видят места для короля в новой Швеции. Пока что страна движется в такт барабанному бою армии."
newsswe.4.a: "Корона исчезла, но меч остался." #norm
newsswe.4.b: "Опять неудачные революции? Блеать." #socialists
newsswe.4.c: "Необходимое действие." #swe

newsswe.5.t: "Объединение европейских королевских династий"
newsswe.5.d: "Под железной рукой Эльмо Линдхольма и восстановленного дома Бернадоттов Швеция создала Союз европейских коронок - великую империю, объединившую континент под единым монархическим руководством. На пепле разгромленной социалистической революции интегральные националисты Линдхольма завоевали Европу, установив новый порядок, основанный на традициях, дисциплине и королевской власти. Мир наблюдает за ростом этой беспрецедентной силы."
newsswe.5.a: "На сцену выходит новая сила." #norm
newsswe.5.b: "Такие тиранические империи не могут существовать долго." #socialists
newsswe.5.c: "Смотрите! Наше величество!" #swe


