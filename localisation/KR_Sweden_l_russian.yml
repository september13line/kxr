SWE_statare_idea2: "Малые реформы жилищных условий статаре"
SWE_statare_idea2_desc: "Статаре, несчастные жертвы шведской политики сосредоточения внимания на животноводстве и крупных поместьях, вскоре станут забытым классом. Благодаря созданию доступного жилья и запрету на оплату «статом», то есть сельскохозяйственной продукцией, а не валютой, бродяги и бедняки старых времен вскоре станут лишь воспоминанием. Наконец-то получив возможность зарабатывать деньги и жить в собственных домах, оставшиеся статаре быстро становятся полноправными фермерами или могут покинуть сельскую местность и переехать в города."

