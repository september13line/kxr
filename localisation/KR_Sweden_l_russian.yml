### Leaders ###

# Kings #
Politics_Gustaf_V_desc: "Родившийся в 1858 году Густав V Бернадотт может быть и довольно стар, но он всегда старался быть монархом новой эпохи. Не претендуя на власть от Бога, а от самой страны, не коронованный и никогда не носящий королевских регалий своего отца Оскара II, Густав Бернадотт предпочитает идти в ногу со временем, даже если это происходит с неохотой. Все ещё способный вмешиваться в шведскую политику, Густав V вмешивался в несколько политических кризисов, способствовав падению правительства Карла Стаафа в 1914 году, заставив Хьялмара Брантинга пойти на уступки в своих более спорных политических курсах и лично участвуя в обеспечении нейтралитета Скандинавии в Первой мировой войне. Отстраненный и непритязательный для монарха, плохой оратор, но полный личных мнений, Густав V является фигурой, вызывающей полярные оценки. Для социалистов он - агент капитала и реакции, для либералов - инструмент старого порядка, а для консерваторов - возможно, слишком мягкий в вопросах обеспечения королевской власти. Несмотря на это, Густав V пользуется широкой популярностью среди населения, его часто видят играющим в теннис под прозвищем «Мистер Г.», рыбачащим с семьей и поддерживающим тесные отношения с военными. В частной жизни Густав V обеспокоен политической напряженностью в мире и уделяет много времени переписке с послами и другими королевскими семьями, предупреждая о росте социализма, антисемитизма и возрождении реваншистской России."

Politics_Gustaf_VI_Adolph_desc: "Родившийся в апреле 1906 года, избранный королем после убийства своего деда, Густав VI Адольф должен занять место, которое было нелегко занять, но благодаря поддержке своего отца, бывшего наследного принца, молодой король, несомненно, станет человеком с сильным характером. Активный член вооруженных сил, занимающийся как политическими, так и военными и социальными вопросами, Густав VI Адольф вступает на престол, будучи хорошо известным и широко любимым. Являясь ярым критиком синдикализма, Густав VI Адольф поддерживает связи с семьей Маунтбеттен, которая в настоящее время находится в изгнании в Канаде, и надеется однажды увидеть Европу, освобожденную от красного бедствия, часто обсуждая этот вопрос со своим тестем, Карлом Эдвардом Саксен-Кобург-Готским."

Politics_Folke_desc: "Родившийся в 1895 году и ставший неожиданным выбором в качестве монарха, Фольке Бернадотт аф Висборг имеет много дел, но благодаря своему веселому характеру и дружелюбным манерам он уже находит широкую поддержку. Активный член шведского скаутского движения, близкий к военным, Фольке продемонстрировал свою способность налаживать связи с людьми независимо от их происхождения, часто участвуя во всех видах СМИ с легкостью, невиданной в семье Бернадоттов. Будучи гуманистом в душе, Фольке ненавидит угнетение и насилие и на протяжении всей своей жизни ненавидел хулиганов, и в изменившейся Швеции, все ещё оправляющейся от смерти Густава V, человечность харизматичного и доброго короля, безусловно, будет востребована."

# counter rev #
Politics_Helge_Jung_desc: "Родившийся в 1886 году, Хельге Юнг давно стал занозой в боку для армейского истеблишмента, даже когда он сам командовал армией. Откровенный, грубый, саркастичный и часто использующий черный юмор, Хельге Юнг, тем не менее, обладает сильной способностью окружать себя способными и талантливыми молодыми офицерами, его штаб является одним из лучших в стране. Изучавший за границей и увлеченный читатель военной истории, Хельге Юнг приносит с собой знания и опыт, не говоря уже о здоровой дозе аргументации. Лидер одноименной «Юнгюнты», группы офицеров и генералов-дилетантов, протестующих против некомпетентности правительства в вопросах вооружения и военных дел, Хельге Юнг никогда не ожидал, что возглавит страну, хотя он довольно комфортно чувствует себя в этой новой для себя позиции власти."

Politics_Carl_August_desc: "Родившийся в 1892 году Карл Август Эренсверд, по прозвищу «Кала», был ассоциированным членом «Юнгюнты», но всегда был в ней умеренной силой. Устав от синдикализма и роста социализма, Карл Август с ужасом наблюдал, как SAP объединилась с ярыми радикалами SSV, что подтолкнуло его присоединиться к ближайшему окружению Хельге Юнга, готовящему переворот для спасения страны. Как ветеран финской гражданской войны, Эренсверд не понаслышке знает, как гражданские войны могут разрушить страну и чувство общности в ней, и поэтому он выступает за спокойный и мирный переход к демократии, но без риска возрождения красных."

Politics_Axel_Gyllenkrok_desc: "Родившийся в 1888 году, Аксель Гюлленкрок является одним из самых противоречивых членов «Юнгюнты», хотя и не столько из-за своих политических взглядов, сколько из-за своей личности. Резкий и дерзкий, циничный и немного задиристый, Аксель был отдан под военный трибунал за свое обращение с подчиненным офицером, в результате чего его перевели как можно дальше от любого значимого командования. Тем не менее, Аксель Гюлленкрок - способный и творческий человек, и его положение национального лидера в такой хунте, как эта, является вполне ожидаемым результатом. Аксель - заядлый писатель, автор многочисленных работ в защиту военных и по военной теории, в которых он выступает за тотальную мобилизацию всего населения в случае войны."

Politics_Archibald_Douglas_desc: "Арчибальд Дуглас, родившийся в 1883 году, является самым радикальным членом «Юнгхунты», приверженцем крайне правых идей и преданным антисоциалистом, антисемитом и вообще противником всего. Ветеран финской гражданской войны, Арчибальд Дуглас собственными глазами видел преступления, совершенные во имя интернационализма и освобождения рабочих, что сделало его ярым противником социализма в частности и демократии в целом. Вместе со своим протеже Мартином Экстрёмом Арчибальд является частью «Jungjunta», которая вряд ли когда-нибудь вернется к статусу-кво или чувству цивилизованности, поскольку чрезвычайное положение, объявленное после переворота, может никогда не быть полностью отменено."

Politics_Martin_Ekstrom_desc: "Родившийся в 1887 году Мартин Экстрём выделяется как единственный член Хунты, который фактически имеет под своим руководством преданную политическую партию, хотя партийная часть партии является не столько бюрократическим инструментом политической воли, сколько командным штабом. Имея опыт службы в персидской жандармерии до и во время мировой войны, измученный боевыми действиями на Кавказе, израненный финской гражданской войной и закаленный в боях от Таллинна до Петрограда, Мартин Экстрём побывал почти везде, посвятив себя борьбе с российским империализмом и варварством. Преданный антисоциалист, Экстрём был готов сражаться с «красной ордой» на протяжении всей своей жизни, от чего пострадала его личная жизнь, поскольку у него не было ничего, кроме военного опыта и жизни, чтобы занять себя."

# socialist #

Politics_Karin_Boye_desc: "Карин Бойе, родившаяся в 1900 году, является преданным писателем и активистом, долгое время бывшим социалистом и горячим сторонником революционных идей во всем мире. Хотя Карин была слишком молода, чтобы помогать социалистам в Петрограде, она была очарована социальным освобождением в Париже и Лондоне и стала горячей сторонницей идеалов социализма, синдикализма и освобождения женщин. Откровенная и открытая лесбиянка, Карин Бойе является уважаемой, хотя и противоречивой писательницей и общественной деятельницей."

Politics_Karl_Kilbom_desc: "Родившийся в 1885 году, Карл Чильбум остается преданным независимым социалистом даже в эпоху, которая, кажется, заставляет людей делиться на разные лагеря. Будучи социалистом с юных лет, Карл Чильбум общался и сотрудничал с социалистами со всей Европы, и когда революция в России угасла из-за некомпетентности большевиков, Кильбом повернулся на запад, вдохновившись революционерами Парижа и Лондона. Возглавляя SSV в тайне из Парижа, где он руководил шведской делегацией на третьем интернационале, Кильбом является одним из трех членов так называемой Парижской клики, другими членами которой являются Зеф Хёглунд и Нильс Флюг. В отличие от Зета и Нильса, Килбом по-прежнему верит, что социал-демократия - это путь к социализму, предпочитая реформы революции, хотя, если власть имущие отказываются идти по пути мира, он без колебаний готов пойти по пути насилия."

Politics_Ernst_Wigforss_desc: "Эрнст Вигфорс, родившийся в 1881 году, много лет был членом SAP и долгое время активно участвовал в формировании экономической политики партии. Вызывая споры как среди левых, так и среди правых, как внутри своей партии, так и за её пределами, Эрнст Вигфорс считает, что SAP должна быть мостом между либерализмом и социализмом, должна иметь экономическую политику, основанную на здравом смысле, но также и на идеализме, должна поощрять рост и в то же время защищать права рабочих. Теперь, возглавив партию, которой он долгое время руководил, Вигфорс с энтузиазмом приступает к разработке национальной политики на ближайшие десятилетия."

Politics_Elise_Jensen_desc: "Родившаяся в 1886 году Элиза Оттесен-Йенсен долгое время боролась за освобождение женщин, а также за право людей на сексуальную свободу в более широком смысле. Много лет выступая за сексуальное просвещение для всех, Элиза считает, что только когда любовь станет свободной и справедливой, можно будет достичь подлинного равенства. Благодаря своей активной деятельности и долгой борьбе Элиза Оттесен-Йенсен с осторожностью относится к чрезмерному вмешательству правительства и примкнула к анархистскому течению шведского синдикализма, хотя внутри движения она подвергается критике за свою поддержку евгеники, как в отношении умственно неполноценных, так и в отношении расовой гигиены."

Politics_Frans_Severin: "Родившийся в 1889 году Франс Северин является одним из ведущих организаторов и общественных активистов SAC, в частности, он является редактором их газеты Arbetaren. Пытаясь найти баланс между более централистскими течениями и анархистскими тенденциями внутри движения, Северин изначально рассматривался как лидер единства движения, хотя в последние годы он перешел в лагерь централистов, поскольку стал придерживаться более умеренных политических взглядов. Дружелюбный, но скептически настроенный по отношению к социал-демократии, Северин хочет мира, в котором рабочий действительно уважается, где ни один человек не стоит выше другого, и где благодаря здоровому и заботливому государственному аппарату можно достичь мира между людьми."

Politics_Jan_Fridegard: "Ян Фридегорд, родившийся в 1897 году, является так называемым «пролетарским писателем», всю свою жизнь писавшим о бедственном положении бедных и угнетенных, что радикализировало его и сделало голосом красных масс. Ярый любитель древней истории, Ян Фридегорд обнаружил две отдельные рунические камни, и когда он не занят пропагандой лучшего мира, он с энтузиазмом участвует в революционной культурной весне, разворачивающейся в стране. Выбранный лидером благодаря своей заботе о бедных и уязвимых, Фридегорд хочет принести благосостояние нуждающимся, свободу заключенным, еду голодающим."

Politics_Nils_Flyg_desc: "Родившийся в 1891 году Нильс Флюг, по прозвищу «Ниссе», был человеком чисто революционных действий. Будучи давним коммунистом, Флюг с ужасом наблюдал, как Хьялмар Брантинг преклонился перед королем и сформировал буржуазное правительство, с недоверием смотрел, как русская революция скатилась в безумие и кровопролитие, и скорбел, когда его дочь Сольвейг умерла от туберкулеза после того, как он укрыл в своем доме немецкого революционера. В этом хаосе, в этом горе неудивительно, что Нильс Флюг стал радикалом. Вдохновленный Парижем и Лондоном, Нильс особенно увлекся идеалами тоталитаризма, с энтузиазмом подписав хартию в Бирмингеме, будучи полностью убежденным, что тоталитаризм освободит человечество. Известная спорная фигура в шведском левом движении и изгой в правом, Нильс Флюг считает, что Германия не справилась со своей исторической задачей стать первым рабочим государством, и полностью убежден, что именно германский мир приведет остальной мир к утопии, поскольку англосаксонский мир и славянский мир просто слишком дегенерировали и были искажены капитализмом и азиатской дикостью соответственно. Являясь противником идеи «люмпенпролетариата», Нильс Флюг стремится привлечь в свое движение как можно больше рабочих и крестьян, желая объединить социальные классы под одной тоталитарной крышей для достижения германского марксистского исторического императива. Общаясь с кем угодно, от антисемитов до интернационалистов, Нильс Флюг является сложной фигурой, полностью посвятившей свою жизнь делу мирового социализма. Член парижской клики, Нильс давно списал Карла Чильбума и Зета Хёглунда со счетов как неспособных псевдобуржуазных предателей."

Politics_Sven_Linderot_desc: "Родившийся в 1889 году как Свен Ларссон, позже известный как Линдеррот, «Свен-Лассе» является марксистом старой закалки, и в то время как другие с ужасом отвернулись, когда социализм был уничтожен в России, Линдеррот просто пошел работать, помогая изгнанной РКП. Революционный герой, Линдерут был одним из моряков, которые прорвали блокаду Петрограда на корабле «Эскильстуна III», лично встретившись при этом с Лениным. Исключенный из SSV Карлом Чильбумом и парижской кликой, Свен Линдерут сформировал SKP в прямой оппозиции, сохраняя чистую марксистскую линию даже тогда, когда бывшие социалисты обратились к буржуазной тенденции синдикализма. Будучи близким другом РПК, Бухарина и Зиновьева, Линдерут считает, что коммунизм - единственный путеводный свет мирового пролетариата и что только через изучение Ленина и Маркса международный рабочий класс может обрести свободу и демократию. Открытый как для реформ, так и для революции, Линдерут сделал и сделает все для дела коммунизма."

Politics_Hugo_Sillen_desc: "Уго Силлен, родившийся в 1892 году, возглавляет SKP, как и её газету, руководствуясь ортодоксальными взглядами и бюрократическими убеждениями. Будучи преданным сторонником РКП, Уго Силлен абсолютно убежден, что только под руководством Зиновьева, Молотова и других ключевых членов RPK мировой социализм может стать реальностью, что сделало его соперником Свена Линдерута, стремящегося к большей независимости. Обвиненный Свеном Линдерутом в нерадивости и лени, Уго Силлен, в свою очередь, обвинил своего бывшего друга в том, что тот притворяется социал-демократом, является марионеткой семьи Валленбергов и предателем дела красного глобуса. Теперь, стоя во главе целой страны, Уго Силлен черпает вдохновение в словах Ленина, надеясь создать красную утопию на холодном севере."

Politics_Sven_Olov_Lindholm: "Родившийся в 1903 году, Линдхольм появился на свет слишком поздно для финской гражданской войны, но как раз вовремя для грядущей мировой революции. Будучи офицером армии, Линдхольм, тем не менее, является последователем тоталитаризма, черпая вдохновение, в частности, у Муссолини и Мосли, которых он иногда цитирует своим последователям. Бывший последователь братьев Фуругард и бывший член Svenska Antisemitiska Föreningen, Линдхольм был радикализирован своим окружением и пошел по пути реакции, хотя вскоре ему стало ясно, что эта реакция сама по себе шла рука об руку с теми самыми людьми, которых Линдхольм был научен ненавидеть. После неудачной попытки Эрика фон Розена объединить правых в один радикальный национальный блок, Свен Олов Линдхольм повернул свою партию в сторону радикальной левой, либо из цинизма, либо из искреннего убеждения, найдя достаточное количество новобранцев в разочарованных рабочих ассоциациях и собраниях в городе Гётеборг. В то время как фон Розен и Фуругард, Экстрём и Дуглас притворялись радикальными националистами, Линдхольм был занят развитием пролетарского национального движения, посвятившего себя делу освобождения от мирового еврейства, мирового банковского дела, либерализма и всего, что считалось социальным или мировым злом."


#### FOP ####
swefop.999.t: "Возвращение Svenska Guldkusten"
swefop.999.d: "В результате замечательного возвращения к 1650 году наша страна теперь контролирует полосу земли, обычно называемую «Золотым побережьем», вдоль западного побережья африканского континента. Теперь, когда она надежно вышла из-под контроля наших врагов и находится под нашим контролем, остается открытым вопрос о том, что делать с такими отдаленными и далекими землями. Наиболее очевидным выбором было бы сотрудничество с бывшими администрациями с целью создания аналогичного правительства, подчиненного нашему, в попытке максимально стабилизировать ситуацию в регионе. Однако другие предлагают решение воссоздать нашу старую колонию, утраченную нами в 1664 году, когда её захватили вероломные голландцы. Формирование такого колониального правительства будет гораздо менее гладким процессом, потребующим установления новых границ и отправки министров из Стокгольма. Такая задача будет более дорогостоящей, но может принести большие выгоды в будущем."
swefop.999.a: "Вернёмся в 1660 год, восстановим колонию!"
swefop.999.b: "Будем работать с бывшими администраторами этой земли."

swefop.998.t: "Колония Винланд"
swefop.998.d: "Недавно мы получили контроль над территориями Лабрадора и Ньюфаундленда, которые хранят уникальную часть древней истории. Возвращаясь к викингам, таким как Лейф Эрикссон, эта территория, по-видимому, была открыта и названа Винланд, или Винленд. Название происходит от винограда, который, как полагают, рос в этой местности, поскольку «Вин» означает «вино», однако это может быть оспорено, так как оно также может означать «пастбище» или «луг». На данный момент не найдено никаких вещественных доказательств существования поселений викингов, но многие документы королей Дании подтверждают веру в существование поселений викингов задолго до прибытия Колумба в Новый Свет. Археологи из наших престижных учебных заведений уже приступили к раскопкам в надежде найти и раскрыть какие-либо материальные свидетельства существования скандинавских поселений, и теперь это лишь вопрос времени.\n\nХотя такая история остается интересной, использование этой версии о первой североамериканской колонии из Европы позволило нам установить там колониальное правительство, имитирующее наше нынешнее правительство. Удастся ли такое государство, покажет время, но это ещё один шаг к раскрытию нашей истории."
swefop.998.a: "Новый Свет, теперь наш."

swefop.777.t: "Приказ непослушному ребенку"
swefop.777.d: "Не виденная с 1809 года, когда Финляндия была уступлена России после поражения Шведской империи, Финляндия теперь снова находится под бдительным оком Швеции. Нынешнее шведское правительство продемонстрировало свою силу, подняв шведский флаг над ратушей в Хамине, которая когда-то называлась Фредриксхамном, когда находилась под властью Шведской империи, где был подписан бывший Фредриксхамнский договор, уступающий Финляндию России.\n\nПосле такой демонстрации многие финны начали выходить на улицы в знак сопротивления шведской оккупации, многие отбросив свои идеологические разногласия в защиту независимости Финляндии. Такое сопротивление встретило жесткий отпор со стороны шведских солдат и офицеров, поскольку правительство Стокгольма решает, что делать с вновь обретенной землей.\n\nПервый и самый прямой вариант - полная аннексия и реинтеграция Финляндии в Швецию. Это привело бы к длительному и трудного процессу уничтожения финской культуры и суверенитета, при этом, вероятно, встретив сильное сопротивление со стороны коренных финнов. Некоторые в правительстве считают, что это единственный вариант, поскольку, как и в случае с Йормунгандом, бесконечный цикл предоставления финнам самоуправления приведет только к постоянным восстаниям.\n\nДругая группа поддерживает идею интеграции финнов, но предлагает другое решение. Аннексировать основные районы, где проживает большое количество шведов, и установить марионеточную администрацию над остальной частью, чтобы подавить сопротивление финнов, одновременно постепенно принуждая их к реинтеграции в Швецию.\n\nПоследний лагерь считает полную интеграцию Финляндии действительно невозможной задачей, поскольку многолетнее самоуправление Финляндии приведет к экономическим проблемам и постоянным восстаниям в случае принудительной реинтеграции. Поэтому они выступают за то, чтобы Финляндией управляло прошведское правительство, давая финнам ощущение самоуправления, но при этом сохраняя их связь со Швецией.\n\nВыбор должен быть сделан в ближайшее время, поскольку сопротивление финнов с каждым днем только усиливается."
swefop.777.a: "Полная шведская интеграция!"
swefop.777.b: "Включить в состав страны регионы, где преобладает шведское население, подготовить остальные к возможной интеграции!"
swefop.777.c: "Полунезависимое управление под нашим пристальным наблюдением!"

swefop.500.t: "От Скандинавии до Объединенных Северных стран"
swefop.500.d: "Благодаря недавнему расширению на финские земли, мы теперь претендуем на все северные территории, известные как «Северные страны». Хотя изначально мы одержали победу над Скандинавией, захват всех земель Северных стран позволяет нам присвоить себе такое название, хотя некоторые утверждают, что это только укрепляет важность Финляндии в нашей новой империи. Таким образом, у нас остается выбор: включить название «Северные страны» или пока оставить его."
swefop.500.a: "Изменим наше название!"
swefop.500.b: "Пока оставим все как есть.".

swefop.1.t: "Возрождённая эпоха Stormaktstiden"
swefop.1.d: "В не столь далёкой истории Швеция когда-то считалась империей, стоявшей в одном ряду с другими великими державами того времени - Францией, Британией и Россией. Теперь же мы утратили все наши имперские владения: от гор Норвегии и равнин Дании до сверкающих берегов Золотого Берега в Африке; с вмешательством России наше падение стало особенно глубоким. \n\nОднако с изменением политического курса в нашей стране правительство решило взяться за восстановление некогда существовавшей империи. Когда все усилия обращены на завоевание того, что есть и всегда будет по праву нашим, Швеция идёт своим путём, жаждущая возмездия."
swefop.1.a: "Провозгласить Империю - Швеция возвращается!"
swefop.1.b: "Провозгласить себя Svea Rike!"
swefop.1.c: "Провозгласить себя Svea Rike под нынешним флагом!"
swefop.1.e: "Мы - королевство свеев, готов и вандалов!"
swefop.1.f: "Нам не нужно устаревшее название!"

swefop.2.t: "Лев пробуждается"
swefop.2.d: "Некогда могущественная держава, властвовавшая над Балтикой и далеко в глубине Северной Европы, Швеция долго дремала под тяжестью нейтралитета и забытых амбиций. Но теперь ветры перемен вновь развевают старые знамёна. Народ вполголоса говорит о новом военном рывке, об империи, о предназначении. Пришло время сбросить оковы сдержанности. Север вспомнит, кто когда-то властвовал над его водами, лесами и тронами. Швеция восстанет вновь."
swefop.2.a: "Наша империя вновь засияет!"

swefop.3.t: "Возвращение к 1905 году"
swefop.3.d: "В июне 1905 года норвежский Стортинг сделал торжественное заявление: союз между Швецией и Норвегией был расторгнут. Этим актом почти век совместного правления, дипломатии и переплетённых судеб подошёл к концу. За этим последовало мирное расставание, однако оно оставило многих шведов с чувством предательства, а многих норвежцев - с жаждой полной независимости.\n\nТеперь, когда Норвегия вновь оказалась под шведским контролем, пусть даже силой, мы стоим на распутье. Должны ли мы возродить дух старой двойной монархии, предложив более примирительный союз, способный завоевать сердца и умы в Осло? Или же объявить, что время компромиссов прошло, и Норвегия будет управляться напрямую из Стокгольма как провинция великого шведского государства?\n\nПрошлое даёт нам подсказки, но именно нам предстоит решить будущее."
swefop.3.a: "Мы примем наше двойное наследие!"
swefop.3.b: "Шведы правят в одиночку!"

swefop.4.t: "Тень русского медведя"
swefop.4.d: "За восточным горизонтом простирается гигант - древний и беспокойный. Будь то цари, комиссары или автократы, прикрытые современными титулами, Россия всегда отбрасывала длинную и тяжёлую тень на Север. Её амбиции безграничны, её границы никогда не бывают окончательными, а её жажда влияния - неиссякаема.\n\nТеперь, когда напряжённость по всей Европе растёт и баланс сил начинает смещаться, Швеция должна взглянуть правде в глаза: мир с Россией временен, а готовность - вечна. Наши генералы вспоминают древние войны, Нарву и Полтаву, утраченные провинции и поблёкшую славу. Народ шепчет о реванше, обороне и судьбе.\n\nНанесём ли мы удар первыми или же укрепимся перед неизбежным - ясно одно: русский медведь наблюдает, и вскоре он может прийти в движение."
swefop.4.a: "Точить копья. Готовить Север."

swefop.5.t: "Месть за Кальмарскую унию"
swefop.5.d: "В смелом и историческом заявлении Швеция провозгласила себя Шведская Империя, возродив мечты о едином Севере, в последний раз воплощённые во времена Кальмарской унии. Флаги Дании и Норвегии ныне склоняются перед властью Стокгольма, а гавани Копенгагена и фьорды Осло прочно находятся под нашим контролем. Однако этот триумф омрачён массовыми волнениями: по новым присоединённым территориям, от Орхуса до Бергена, вспыхивают протесты. Шёпот неповиновения разносится по улицам, и мир с тревогой наблюдает, как амбиции Швеции отбрасывают длинную тень на Европу. Сконсолидируем ли мы власть над Скандинавией через единство, подавим ли инакомыслие железной рукой, продвинем общую северную идентичность или же дерзко провозгласим наше предназначение перекроить континент?"
swefop.5.a: "Вести справедливые войны против несправедливых врагов!"


swefop.6.t: "Старая империя обрела новую жизнь"
swefop.6.d: "Мечта об империи, когда-то погребенная под веками нейтралитета и скромной дипломатии, возродилась и осуществилась. Под твердым и дальновидным руководством Швеция отбросила свою традиционную сдержанность и захватила свою судьбу в качестве доминирующей силы на Севере. Северные земли, Дания, Норвегия, Финляндия и Исландия, все были поставлены под контроль Швеции, добровольно или нет. Даже древний враг на востоке, Россия, склонился перед мощью возрожденной шведской военной машины.\n\nОт ледяных фьордов Норвегии до ветреных степей за Карельским перешейком шведские солдаты теперь маршируют под знаменем Трех коронок. Балтийское море, когда-то оспариваемое, теперь является шведским озером. Стокгольм стал столицей новой империи, империи, напоминающей времена Густава Адольфа и Карла XII, но теперь возрожденной для современности.\n\nНекоторые приветствуют это возрождение как начало золотого века для Скандинавии. Другие шепчут о тирании и возмездии. Но одно можно сказать наверняка: Шведская Империя больше не является воспоминанием - это сила, с которой мир должен считаться."
swefop.6.a: "Север принадлежит нам, да здравствует Империя!"

swefop.7.t: "" #Neutrality 1
swefop.7.d: ""
swefop.7.a: ""

swefop.8.t: "" #Neutrality 2
swefop.8.d: ""
swefop.8.a: ""

swefop.9.t: "Ситуация в Гренландии" #Demand Greenland Denmark
swefop.9.d: "Гренландия является идеальным местом для расширения нашей военно-морской базы, а также имеет схожую культуру. Учитывая небольшую численность населения и наличие важных портов на севере, мы должны потребовать эту территорию от нашего южного соседа, Дании."
swefop.9.a: "Мы должны потребовать Гренландию!"

swefop.10.t: "Швеция требует Гренландию" #Danishh response
swefop.10.d: "Наша северная скандинавская страна Швеция обратилась к нам с требованием уступить ей наши территории в Гренландии. Они предупредили нас, что отказ от такого требования может обернуться серьезными последствиями. Как нам реагировать?"
swefop.10.a: "Они с ума сошли? Нет!"
swefop.10.b: "Это не стоит таких хлопот - конечно."

swefop.11.t: "Дания уступает Гренландию" #Denmark accept
swefop.11.d: "Благодаря великолепной дипломатии и переговорам мы убедили Данию уступить нам свою территорию в Гренландии. Получив эту новую землю, мы можем надеяться на расширение нашей нынешней территории и укрепление военно-морского присутствия."
swefop.11.a: "Наша законная территория!"

swefop.12.t: "Дания держится" #Denmark refuse
swefop.12.d: "Похоже, Дания отклонила наш запрос о передаче её территорий в Гренландии, поэтому некоторые члены правительства заявляют, что война остается единственным вариантом, поскольку дипломатия потерпела неудачу. Остальные предлагают подождать, выждать более подходящий момент для захвата территорий."
swefop.12.a: "К оружию!"
swefop.12.b: "Мы будем ждать подходящего момента..."

swefop.13.t: "Швеция требует Гренландию" #Canadian response
swefop.13.d: "Северная скандинавская страна Швеция обратилась к нам с требованием уступить ей наши территории в Гренландии. Они предупредили нас, что отказ от такого требования может обернуться серьезными последствиями. Как нам реагировать?"
swefop.13.a: "Ха, какой армией? Нет!"
swefop.13.b: "Да, не стоит вступать в конфликт."

swefop.14.t: "Канада уступает Гренландию" #Canada accepts
swefop.14.d: "Благодаря великолепной дипломатии и переговорам мы убедили Канаду уступить нам свою территорию в Гренландии. Получив эту новую землю, мы можем надеяться на расширение нашей нынешней территории и укрепление военно-морского присутствия."
swefop.14.a: "Мудрый шаг со стороны Канады!"

swefop.15.t: "Канада отклоняет наши требования" #Canada refuses
swefop.15.d: "Похоже, Канада отклонила наш запрос о передаче её территорий в Гренландии, поэтому некоторые члены правительства заявляют, что война остается единственным вариантом, поскольку дипломатия потерпела неудачу. Остальные предлагают подождать, выждать более подходящий момент для захвата территорий."
swefop.15.a: "К оружию!"
swefop.15.b: "Мы будем ждать подходящего момента..."

swefop.16.t: "Победа на горизонте" #swedish victory against Canada
swefop.16.d: "После вытеснения канадских войск с их атлантических территорий некоторые члены правительства выступили с предложением предложить Канаде мир. Они просят о полной инкорпорации их атлантических территорий, чтобы избежать дальнейшего кровопролития и войны."
swefop.16.a: "Отправьте соглашение, они наверняка примут его?"
swefop.16.b: "Канадское королевство падет!"

swefop.17.t: "Швеция предлагает переговоры" #Peace with Sweden?
swefop.17.d: "Швеция направила нам сообщение с просьбой о мире при условии, что мы уступим ей наши атлантические территории. Продолжим ли мы войну и вернем наши земли или уступим, чтобы укрепить наши силы для их возвращения?"
swefop.17.a: "Хорошо, пусть забирают эту бесплодную ледяную землю!"
swefop.17.b: "Нет, мы уничтожим этих скандинавов!"

swefop.18.t: "Канада соглашается на переговоры" #They accept peace
swefop.18.d: "В результате беспрецедентных переговоров и дипломатических усилий Канада согласилась на мир, предоставив нам полный контроль над территориями, которые мы требовали. С окончанием войны и возвращением солдат домой мы можем только надеяться, что это было стоит кровопролития."
swefop.18.a: "Победа над титаном!"

swefop.19.t: "Просьба от Швеции" #request canada response greenland
swefop.19.d: "Наш северный скандинавский союзник Швеция обратился к нам с просьбой уступить им наши территории в Гренландии. Хотя эти территории не имеют большой ценности, они могут оказаться полезными при восстановлении родных островов. Как нам ответить?"
swefop.19.a: "Нет, у них нет никаких прав на них."
swefop.19.b: "Конечно, они знают климат лучше нас."

swefop.20.t: "Канада сдается" #Canada accepts
swefop.20.d: "В результате беспрецедентных переговоров и дипломатических усилий наши доблестные союзники в Канаде согласились передать нам территории в Атлантическом океане!"
swefop.20.a: "Поистине, союзники до конца!"

swefop.21.t: "Канада отклонила наш запрос" #Canada refuses
swefop.21.d: "Канада отклонила наше предложение по атлантическим территориям, и теперь у нас есть два варианта. Либо принять тот факт, что сотрудничество с Канадой больше невозможно, либо проглотить свою гордость и продолжить союз с изгнанниками."
swefop.21.a: "Тогда мы уходим."
swefop.21.b: "Унизительно."

swefop.22.t: "Швеция запрашивает Исландию" #Demand canada iceland response
swefop.22.d: "Наш северный скандинавский союзник Швеция обратился к нам с требованием уступить им наши территории в Исландии. Хотя эти территории не имеют большой ценности, они могут оказаться полезными для восстановления родных островов. Как нам ответить?"
swefop.22.a: "Их положение слишком важно для восстановления - нет."
swefop.22.b: "Пусть берут."

swefop.23.t: "Канада уступает Исландию" #Canada accepts
swefop.23.d: "В результате беспрецедентных переговоров и дипломатических усилий наши доблестные союзники из Канады согласились передать нам Исландию!"
swefop.23.a: "Блестящий результат переговоров!"

swefop.24.t: "Канада отклоняет нашу просьбу" #Canada refuses
swefop.24.d: "Канада отклонила наше предложение по Исландии, и теперь у нас есть два варианта. Либо принять тот факт, что сотрудничество с Канадой больше невозможно, либо проглотить свою гордость и продолжить союз с Изгнанниками."
swefop.24.a: "Тогда мы оставим их позади."
swefop.24.b: "Ужасно."

swefop.25.t: "Швеция требует нашей аннексии" #Iceland responsse
swefop.25.d: "Сегодня ранним утром прибыла делегация из Швеции, которая сообщила нам, что шведское правительство «любезно» попросило о нашей прямой аннексии к их территории. Обещая ограниченную автономию и защиту от врагов в Европе, приглашение выглядит заманчиво, однако отказ от нашей независимости не понравится большинству жителей Исландии."
swefop.25.a: "Хорошо, мы уступим."
swefop.25.b: "Заберите наш остров из наших холодных, рыбных, мертвых рук!"

swefop.26.t: "Исландия принимает аннексию" #Iceland agrees
swefop.26.d: "В результате беспрецедентных переговоров и дипломатических усилий Исландия приняла наше предложение о присоединении к нам, ура!"
swefop.26.a: "Еще одна территориальная амбиция удовлетворена!"

swefop.27.t: "Исландия отвергает нас" #Iceland denies
swefop.27.d: "Как и ожидалось, Исландия отвергла наше предложение о мирной аннексии её территорий, что оставляет нам мало вариантов."
swefop.27.a: "Переговоры провалились, готовьте войска."

swefop.28.t: "Альянс во главе со Швецией" #Create own factrion 
swefop.28.d: "Приняв решение создать собственный альянс, в котором мы будем де-факто лидером, нам теперь осталось выбрать название. Было предложено много вариантов, но выбрать можно только один, давайте выберем его мудро."
swefop.28.a: "Северный альянс!"
swefop.28.b: "Пакт Аврора!"
swefop.28.c: "Шведский оборонный пакт!"
swefop.28.e: "Стокгольмское соглашение!"

swefop.29.t: "Швеция приглашает нас в свою фракцию" #Generic invite to faction
swefop.29.d: "Сегодня ранним утром прибыла делегация из Швеции, которая сообщила нам, что шведское правительство предложило нам место в своем великом альянсе. Обещая защиту, взаимную помощь и совместные военные учения, такой альянс может оказаться полезным для нас, мы должны взвесить все варианты."
swefop.29.a: "Пусть придут беды, ведь вместе мы будем едины!"
swefop.29.b: "Нет, спасибо!"

swefop.30.t: "Плач по Финляндии" #Переименование финских городов
swefop.30.d: "Теперь, когда Финляндия полностью находится под нашим контролем, у нас появилась возможность переименовать финские города, находящиеся под нашей властью, вернув им их шведские названия. Многие в правительстве протестуют, утверждая, что это вызовет массовую путаницу - не только для нас самих, но и для финского гражданского населения, ныне находящегося в составе нашего государства. В ответ они предлагают компромисс: переименовать лишь Хельсинки, продемонстрировав силу и господство над финнами, не заходя слишком далеко. Однако более радикальные элементы внутри нашего правительства настаивают, что лишь полное переименование каждого города с возвращением его исконного шведского названия будет достаточным."
swefop.30.a: "Оставить всё как есть - это вызовет слишком много путаницы."
swefop.30.b: "Утвердим наше господство лишь над их столицей."
swefop.30.c: "Искоренить сам язык финнов!"

swefop.31.t: "Kompani Linge наносит удар вновь"
swefop.31.d: "После начала войны между Швецией и Норвегией норвежское диверсионное подразделение действует в нашем тылу, нанося ущерб шведским военным усилиям. Состоящее из преданных саботажников и движимое стремлением сохранить независимость Норвегии, Kompani Linge и его бойцы стали настоящей занозой для шведского высшего командования. Взрывы зданий, нападения на аванпосты и иные действия, существенно подпитывающие норвежское военное сопротивление, ясно дают понять: эту угрозу необходимо остановить. И тут появляется некий Харри Сёдерман, утверждающий, что у него есть решение проблемы Linge.\n\nХарри Сёдерман, известный среди криминологов как «Револьверный Харри», - необычайно изобретательный полицейский. Он изучал судебную экспертизу по всей Европе и даже работал в Нью-Йорке, где помогал создавать полицейские лаборатории. Его опыт охватывает множество дел - от стрельбы в Одолене до расследования похищения Линдберга, а также ряда убийств в самой Швеции. Будучи заядлым авантюристом, Харри счёл задачу противодействия группе Linge особенно интересной и обратился к правительству и армии с предложением создать лояльное норвежское подразделение для борьбы с повстанцами. Он утверждает, что в Швеции имеется немало норвежских военнопленных и дружественных эмигрантов, и предлагает обучить тех, кто имеет военный опыт или достаточно решительно настроен против нынешнего норвежского правительства, чтобы сражаться бок о бок со шведскими войсками. Проект предполагается секретным: норвежские солдаты пройдут полную подготовку и будут действовать под командованием норвежских офицеров, формально числясь «полицейскими войсками» - Polistrupperna по-шведски и Polistropperne по-норвежски. Учитывая, что война, вероятно, скоро не закончится, правительству предстоит решить: стоит ли тратить время на создание норвежского боевого подразделения для борьбы с их же соотечественниками или же продолжать вести войну с Kompani Linge так, как это делалось до сих пор."
swefop.31.a: "В словах Харри есть смысл - сформировать подразделение."
swefop.31.b: "Пусть полиция не лезет в военные дела."

swefop.32.t: "Полицейские и разбойники"
swefop.32.d: "После решения о формировании норвежских сил в изгнании Харри Сёдерман и военное командование усердно работали над приведением подразделения в боеготовое состояние. Норвежские офицеры прошли подготовку и теперь бесконечно гоняют своих людей на учениях, однако становится ясно, что те рвутся к настоящему бою со своими соотечественниками из Kompani Linge. Пока война с норвежским правительством продолжается, изгнанники буквально изнывают от нетерпения покинуть казармы и уйти в леса, чтобы «освободить свои дома от мятежного правительства». В то же время некоторые утверждают, что изгнанники слишком неопытны, слишком рьяны и, откровенно говоря, вызывают подозрения. Не так давно произошёл странный инцидент, когда несколько изгнанников подорвали гранатой собственный туалет в казарме - событие, которое одни расценивают как умышленную диверсию, а другие как признак несерьёзного отношения со стороны солдат.\n\nХарри Сёдерман, тем не менее, твёрдо отстаивает своё детище. Он заявляет, что подразделение лояльно как шведскому правительству, так и войне в целом, и настаивает: если не бросить его в бой в ближайшее время, изгнанники сочтут всё это лишь хитроумной попыткой занять их время, а не реальным намерением создать боевую часть."
swefop.32.a: "Ввести войска - прочесать местность в поисках Linge и его людей!"
swefop.32.b: "Норвежцы против норвежцев? О чём мы вообще думали…"

swefop.33.t: "Испытано и доказано"
swefop.33.d: "Это заняло время и потребовало усилий, но вложения в полицейские войска наконец оправдали себя. Хотя первые месяцы действий подразделения прошли в попытках безуспешно выследить Kompani Linge - иногда они даже натыкались на изолированные норвежские патрули, принимая их за главную цель, - в последнее время на их счету целая череда успехов. В районах, считавшихся свободными от враждебной активности, были раскрыты норвежские ячейки, исход боестолкновений всё чаще складывается в нашу пользу, и наконец сам Kompani Linge был обнаружен при попытке эвакуации из сельской местности на небольших лодках. После короткой стычки, в ходе которой сам Linge получил смертельное ранение, большая часть отряда сдалась, сложив оружие перед победившими изгнанниками.\n\nХарри Сёдерман, создатель проекта и его покровитель, участвовал в бою и отзывается о своём подразделении исключительно восторженно. Уже обсуждаются планы либо расформировать войска, распределив их по регулярной лояльной полиции, либо использовать их как ядро освобождённых норвежских массовых сил, однако эти разговоры, возможно, преждевременны. В сельской местности всё ещё действуют враждебные отряды, среди норвежского населения сохраняется широкое недовольство войной, а некогда братские узы между двумя народами оказались серьёзно испытаны. Тем не менее полицейские войска внесли свой вклад в общее дело войны и, безусловно, заслуживают того, чтобы считаться героями."
swefop.33.a: "Ура, блестящая работа!"

swefop.34.t: "И вновь - в пролом"
swefop.34.d: "Швеция, несмотря на свои скромные размеры, уже не раз спасала Европу. Она спасла её от католического владычества, когда Густав II Адольф устремился на юг, чтобы помочь своим протестантским собратьям в Германии, нанеся сокрушительный удар папистам и одновременно разрушив мнимые остатки Римской империи. Она спасла Европу вновь в XVIII веке, когда в ходе Великой Северной войны шведские солдаты под началом короля-воина Карла XII сражались против славянского деспотизма царя Петра, презренных поляков и услужливых саксонцев… И действительно, будь услышаны мольбы Густава III, возможно, Французская революция была бы задушена в колыбели, не дав Европе погрузиться в хаос либерализма и реакции. В конечном счёте лишь под руководством Жана Батиста Бернадота, Карла XIV Юхана, наполеоновская угроза была окончательно устранена.\n\nИ вот, вновь оказавшись на историческом распутье, Швеция должна крепко ухватить судьбу за горло и снова выступить, чтобы спасти Европу - от самой себя, от славянской агрессии, от капиталистического извращения, от прусско-саксонской аристократической беспомощности. Из пепла освобождённой Европы родится новое государство, созданное при участии всех народов континента, жаждущих чистой и свободной земли. Критики называют эти амбиции нелепыми, абсурдными и возмутительными, но те же критики забывают героев Брейтенфельда и Нарвы, забывают жертвы королей-воинов, забывают шведскую способность бросать вызов судьбе. В громовой речи перед партией и нацией [SWE.GetLeader] провозгласил намерение спасти Европу от самой себя - раз и навсегда."
swefop.34.a: "Амбициозно… Давайте сделаем это!"
swefop.34.b: "Амбициозно… и нелепо!"

swefop.35.t: "Флаг нашей республики" #Hugo Soviet flags
swefop.35.d: "С вступлением Уго в должность председателя республики и нашим господством в Скандинавии он объявил, что только полное восстановление земель бывших русских большевиков вернет имидж Ленина. Восстановив земли, вверенные Ленину под нашим командованием, мы сможем создать единую социалистическо-коммунистическую республику по его образу и подобию. В связи с этим возник вопрос о выборе национального флага, и было предложено множество вариантов."
swefop.35.a: "Будьте в курсе событий."
swefop.35.b: "Верхний левый вариант подходит достаточно хорошо."
swefop.35.c: "Верхний правый вариант имеет хорошую визуальную составляющую."
swefop.35.e: "Нижний левый вариант прост и подходит хорошо."
swefop.35.f: "Нижний правый вариант подойдет нам."
swefop.35.g: "Шведская советская республика!"
swefop.35.h: "Объединенная шведская советская республика!"

swefop.36.t: "От Риксдага до Рейхстага" #mates gfx
swefop.36.d: "После первых сообщений об успешном захвате столицы Германии и Пруссии, Берлина, в шведских СМИ быстро распространились рассказы о шведских солдатах, доблестно водрузивших флаг Империи на крыше Рейхстага. Многие провозгласили это событие последним гвоздем в гробу Рейхспакта, и тысячи шведов, когда между воздушными налетами наступало безопасное время, высыпали на улицы, чтобы праздновать. По мере того как этот миф распространялся по стране, в имперских СМИ появилась поразительная фотография, которая вынесла эту историю на международный уровень. На фотографии, несмотря на зернистый фильтр, была запечатлена бомба и почти опустошенный Берлин с пеплом, падающим с неба. Однако внимание мира привлекло не разрушение города, а флаг Шведской Империи, мягко развевающийся на вершине Рейхстага, символ как превосходства Швеции над Германией, так и предвестник краха Германии. Хотя на континенте по-прежнему идут интенсивные бои, и даже в самом Берлине продолжаются стычки, никто не может отрицать, что наследие Шведской Империи действительно возродилось."
swefop.36.a: "Никакие усилия не являются слишком малыми, никакая цена не является слишком высокой."

swefop.37.t: "Швеция требует нашей аннексии" #norway event
swefop.37.d: "Сегодня ранним утром прибыла делегация из Швеции, которая сообщила нам, что шведское правительство «любезно» попросило о нашей прямой аннексии к их территориям. Обещая ограниченную автономию и защиту от врагов в Европе, приглашение выглядит заманчиво, однако отказ от нашей независимости не понравится большинству нашего населения."
swefop.37.a: "Хорошо, давайте вместе сделаем Скандинавию красной."
swefop.37.b: "День, когда мы откажемся от независимости, будет днем нашей смерти!"

swefop.38.t: "Швеция требует нашей аннексии" #denmark event
swefop.38.d: "Сегодня ранним утром прибыла делегация из Швеции, которая сообщила нам, что шведское правительство «любезно» попросило о нашей прямой аннексии к их территориям. Обещая ограниченную автономию и защиту от врагов в Европе, приглашение выглядит заманчиво, однако отказ от нашей независимости не понравится большинству нашего населения."
swefop.38.a: "Хорошо, давайте вместе сделаем Скандинавию красной."
swefop.38.b: "День, когда мы откажемся от независимости, будет днем нашей смерти!"

swefop.39.t: "Норвегия соглашается на аннексию" #nation agrees
swefop.39.d: "В результате беспрецедентных переговоров и дипломатических усилий Норвегия приняла наше предложение о присоединении к нам, ура!"
swefop.39.a: "Еще одна территориальная амбиция удовлетворена!"

swefop.40.t: "Дания соглашается на аннексию" #nation denies
swefop.40.d: "В результате беспрецедентных переговоров и дипломатических усилий Дания приняла наше предложение о присоединении к нам, ура!"
swefop.40.a: "Еще одна территориальная амбиция удовлетворена!"

swefop.41.t: "Норвегия отвергает нас" #nation denies
swefop.41.d: "Как и ожидалось, Норвегия отвергла наше предложение о мирной аннексии её территорий, что оставляет нам мало вариантов."
swefop.41.a: "Переговоры провалились, готовьте войска."

swefop.42.t: "Дания отвергает нас" #nation denies
swefop.42.d: "Как и ожидалось, Дания отвергла наше предложение о мирной аннексии её территорий, что оставляет нам мало вариантов."
swefop.42.a: "Переговоры провалились, готовьте войска."

swefop.43.t: "Мир над Норвегией"
swefop.43.d: "Теперь, когда наши войска прочно контролируют всю Норвегию, скандинавский фронт фактически рухнул. Норвежское государство больше не имеет средств сопротивляться нашей оккупации, и его территория полностью находится под шведским военным управлением. Это ставит нас в положение, когда мы можем диктовать условия возможного урегулирования, предлагая мир в обмен на официальное признание нашего контроля и реорганизацию Норвегии под нашей властью. Однако не все в Генеральном штабе согласны с тем, что война должна закончиться на этом. Некоторые утверждают, что иностранные державы, которые решили вмешаться в пользу Норвегии, сейчас перенапряжены и истощены, и что Швеция находится на историческом перепутье, когда продолжение наступательных действий может окончательно разорвать их союз. Окончательное решение остается за высшим руководством королевства. Должны ли мы сейчас стремиться к миру или продолжать и закончить войну?"
swefop.43.a: "Норвегия была нашей целью, давайте закончим этот конфликт."
swefop.43.b: "Они все падут рядом друг с другом!"

swefop.44.t: "Мир над Финляндией"
swefop.44.d: "Теперь, когда наши войска прочно контролируют всю Финляндию, восточный фронт фактически рухнул. Финляндское государство больше не имеет средств сопротивляться нашей оккупации, и его территория полностью находится под шведским военным управлением. Это ставит нас в положение, когда мы можем диктовать условия возможного урегулирования, предлагая мир в обмен на официальное признание нашего контроля и реорганизацию Финляндии под нашей властью. Однако не все в Генеральном штабе согласны с тем, что война должна закончиться на этом. Некоторые утверждают, что иностранные державы, которые решили вмешаться в пользу Финляндии, сейчас перенапряжены и истощены, и что Швеция находится на историческом перепутье, когда продолжение наступательных действий может окончательно разорвать их союз. Окончательное решение остается за высшим руководством королевства. Должны ли мы сейчас стремиться к миру или продолжать и закончить войну?"
swefop.44.a: "Финляндия была нашей целью, давайте положим конец этому конфликту."
swefop.44.b: "Они все падут рядом друг с другом!"

swefop.45.t: "Швеция хочет присоединиться к нашему альянсу"
swefop.45.d: "Швеция обратилась к нам с намерением подписать соглашение о взаимной обороне. На практике это соглашение сделает Швецию членом нашей сферы влияния. Мы возьмем на себя ответственность за оборону территорий в Скандинавии, но при этом улучшим свое стратегическое положение. Норвежское побережье длинное и имеет решающее значение для проведения операций в Балтийском море."
swefop.45.a: "Да, они ценный союзник."
swefop.45.b: "Нет, они будут только обузой."

swefop.46.t: "[FROM.GetName] принимает наш запрос"
swefop.46.d: "[FROM.GetName] решает принять наш запрос. Швеция теперь является членом их альянса."
swefop.46.a: "[FROM.GetName] и Швеция — братья навеки!"

swefop.47.t: "[FROM.GetName] отклоняет наш запрос"
swefop.47.d: "Похоже, [FROM.GetName] решает отклонить наш запрос о защите."
swefop.47.a: "К сожалению..."

### Events ###
sweden.1.t: "Вездесущие немцы"
sweden.1.d: "После тяжелой победы Германской империи в Первой мировой войне немецкая нация стремилась расширить свое влияние и власть. Поскольку обширные территории Африки, Восточной Азии и Европы теперь находились под колониальным правлением или под властью союзных королевств, немцы создали для себя новый источник господства. В это время немецкие предприятия стремились к расширению своей деятельности в Швеции, от наших обширных предприятий по добыче железа и цинка на севере до фабрик и магазинов в городских районах на юге. Почти половина всех шведских компаний могут проследить своих благодетелей или прямых владельцев до Германской империи. Поначалу это, казалось, приносило только пользу Швеции, обеспечивая столь необходимые рабочие места для безработных, ускоряя индустриализацию, а также способствуя дальнейшей немецкой иммиграции.\n\nОднако это не обошлось без последствий: многие из этих бизнесменов оказывают влияние на политиков в Риксдаге, что многие в Швеции рассматривают как медленное захват власти Германией.\n\nВ настоящее время Швеция разрывается между желанием ещё больше завоевать расположение немцев для получения финансовой выгоды и началом масштабного выкупа немецких предприятий для восстановления экономической независимости. AV и большинство правых сил поддерживают сохранение экономических связей с Германией, полагая, что дальнейшая интеграция обеспечит продолжение мира и что текущая ситуация выгодна для обеих сторон. В оппозиции находится SAP, которая считает, что эти связи с Германией скорее похожи на оковы, способные втянуть Швецию в нежелательные и ненужные войны. Естественно, в последний раз, когда SAP была у власти, она пыталась устранить немецкое влияние, а после возвращения AV стремилась его усилить. Рано или поздно по этому вопросу должен быть найден консенсус, и либералы готовы выступить в качестве посредников, чтобы повысить свою значимость в шведской политике."
sweden.1.a: "Немецкий левиафан проникает во все щели."

sweden.2.t: "Политическая ситуация"
sweden.2.d: "Благодаря своей нейтральности в мировой войне Швеция смогла сохранить стабильную политическую обстановку по сравнению с остальной Европой. В то время как павшие Королевство Великобритания и Французская Республика были захвачены ордами синдикалистов, Россия в настоящее время находится под руководством так называемого социал-либерала Керенского после разрушительной гражданской войны. Однако эта кажущаяся стабильность не помешала некоторым своенравным шведам присоединиться к тем, кого считают слишком далекими от политической сцены.\n\nВ центре-левом спектре находится Лига фермеров, считающаяся аграрной и социально либеральной партией, которая пользуется большой поддержкой со стороны сельских фермеров и чаще всего вступает в коалицию с более крупными левыми партиями, но при благоприятных условиях может склониться вправо. Крупнейшая левая партия, возглавляемая Пер Альбином Ханссоном, руководит Шведской социал-демократической рабочей партией, которая придерживается левоцентристской или умеренно левой политической позиции, а также продолжает поддерживать монархию, существующую в настоящее время в Швеции. ещё левее находится Шведская социал-демократическая левая партия, группа более радикальных социал-демократов, которые придерживаются многих политических взглядов Пер Альбина Ханссона, за исключением вопроса о монархии, которую они считают символом реакционной традиции, полагая, что Швеция может быть по-настоящему свободной только в качестве республики.\n\nВдохновленная французскими и британскими синдикалистами, группа, называющая себя Центральной организацией рабочих Швеции, надеется упразднить монархию и провести в Швеции синдикалистскую революцию, как и в других синдикалистских странах. её члены также являются членами Левой партии, но не допускаются к участию в коалиции, поскольку считаются слишком радикальными. Наконец, есть ещё отколовшиеся партии - Национальная синдикалистская партия Швеции и Коммунистическая партия Швеции, возглавляемые соответственно Нильсом Флюгом и Свеном Линдерутом. Имея много общего в своей политике, из-за своего небольшого статуса они вступили в коалицию друг с другом в надежде получить больше мест в Риксдаге. Хотя победа для них невозможна, они могут быть приглашены другими фракциями.\n\nСправа находится Народная партия, классическая либеральная группа, рассматриваемая как умеренный мост между правоцентристами и левыми, которая в настоящее время имеет статус коалиции с консерваторами. Крупнейшей консервативной партией является Общая избирательная лига, которую в настоящее время возглавляет Йёста Багге. Она поддерживает идеи протекционистской экономики, сохраняя консервативные ценности и придерживаясь близости к шведской короне. ещё правее находятся небольшие разрозненные военные клики и ультранационалистические военизированные формирования, крупнейшая из которых, возглавляемая Хельге Юнгом, носит прозвище «Юнгхунта». В ультранационалистических группах лидируют Арчибальд Дуглас, ведущая военная фигура; Биргер Фуругорд, чья политика перекликается с политикой легионеров по всей Европе; и Элмо Линдхольм, следующий маурассианской системе управления..."
sweden.2.a: "Стабильность порождает безопасность, верно?"

sweden.3.t: "Немецкие промышленники встречаются в Стокгольме"
sweden.3.d: ""
sweden.3.a: ""

sweden.4.t: "Судьба немецкой промышленности"
sweden.4.d: "Сейчас, когда политическая ситуация постепенно стабилизируется, вопрос о немецких промышленниках, которые по-прежнему присутствуют в Швеции, вновь привлек внимание общественности. Находясь на перепутье, мы можем либо сохранить наши связи с Центральной Европой, сохранив присутствие немецких промышленных гигантов. Хотя Германия будет удерживать контроль над нашей промышленностью, это позволит нам получить доступ к инфраструктуре, которая в противном случае была бы для нас практически недоступна. С другой стороны, среди шведского населения преобладает мнение, что мы должны избавиться от этих немецких бизнесменов. Освободившись от гнета Рейха, мы, хотя и затормозим наш промышленный рост в краткосрочной перспективе, сможем укрепить нашу независимость от Берлина."
sweden.4.a: "Немецкий бизнес должен быть сохранен."
sweden.4.b: "Мы избавимся от этих паразитов!"

sweden.5.t: "Конец монополии"
sweden.5.d: "После смерти шведского мультимиллиардера и гиганта пирамидных схем Ивара Креугера в 1932 году Германия получила полный контроль над шведской экономикой. Креугер, когда-то один из самых богатых людей в Европе благодаря производству спичек и безжалостному деловому чутью, владел почти всей шведской экономикой и проникал в немецкую промышленность и банковскую сеть... До так называемого краха Креугера. После того, как все больше и больше людей начали интересоваться истинными масштабами и размерами операций Креугера, его некачественной документацией и даже ставили под сомнение его честность, Креугер покончил с собой. В мгновение ока его бизнес-империя развалилась, принадлежавшие ему предприятия были проданы за бесценок, а его наследие исчезло без следа. После его смерти выяснилось, что во многих случаях Креугер просто лгал о том, чем он занимался и чем не владел, о активах, которые находились под его контролем, и мировые рынки с неудобным осознанием поняли, что так называемый «король спичек» был скорее финансовым мошенником.\n\nОднако в последовавшем хаосе, пока канадские и американские предприятия и банки терпели крах, немцы воспользовались ситуацией. Скупив львиную долю бывшей империи Креугера и проникнув в шведскую экономику, немецкие щупальца контролируют льва севера, высасывая как можно больше прибыли из бесчисленных предприятий, находящихся под их контролем. Вскоре, менее чем за полдесятилетия, шведская экономика оказалась под полным контролем Германии, а богачи в Берлине и Руре пожинали плоды, к большому огорчению шведских промышленников, бедных и практически всех, кто не был связан с немецким аппаратом. Теперь, после катастрофы Черного понедельника, похоже, что шведы насытились и возвращают контроль над своей экономикой. LKAB была национализирована, банки были по частям разбиты на части, и, похоже, что некогда уважаемая компания STAB, владевшая 60% мирового рынка спичек, тоже была захвачена.\n\nЗа месяц немецкое господство над шведской экономикой полностью рухнуло."
sweden.5.a: "Нельзя доверять этим проклятым шведам!"

sweden.6.t: "От монополии к партнерству"
sweden.6.d: "После смерти шведского мультимиллиардера и гиганта пирамидных схем Ивара Креугера в 1932 году Германия получила полный контроль над шведской экономикой. Креугер, когда-то один из самых богатых людей в Европе благодаря производству спичек и безжалостному деловому чутью, владел почти всей шведской экономикой и проникал в немецкую промышленность и банковскую сеть... До так называемого краха Креугера. После того, как все больше и больше людей начали интересоваться истинными масштабами и размерами операций Креугера, его некачественной документацией и даже ставили под сомнение его честность, Креугер покончил с собой. В мгновение ока его бизнес-империя развалилась, принадлежавшие ему предприятия были проданы за бесценок, а его наследие исчезло без следа. После его смерти выяснилось, что во многих случаях Креугер просто лгал о том, чем он занимался и чем не владел, о активах, которые находились под его контролем, и мировые рынки с неудобным осознанием поняли, что так называемый «король спичек» был скорее финансовым мошенником.\n\nОднако в последовавшем хаосе, пока канадские и американские предприятия и банки терпели крах, немцы воспользовались ситуацией. Скупив львиную долю бывшей империи Креугера и проникнув в шведскую экономику, немецкие щупальца контролируют льва севера, высасывая как можно больше прибыли из бесчисленных предприятий, находящихся под их контролем. Вскоре, менее чем за полдесятилетия, шведская экономика оказалась под полным контролем Германии, а богачи в Берлине и Руре пожинали плоды, к большому огорчению шведских промышленников, бедных и практически всех, кто не был связан с немецким аппаратом. Теперь, после катастрофы Черного понедельника, похоже, что шведы выступили с предложением, или завуалированным требованием, по поводу возможности создания более дружественной структуры для германо-шведской экономической реальности, превратив её из односторонней немецкой монополии в равноправное партнерство. По сути, шведы готовы сотрудничать с немецкими промышленниками и финансовыми магнатами, выкупая крупные немецкие предприятия в обмен на более тесные связи и дальнейшую интеграцию в немецкий рынок в целом, включая Центральную Европу."
sweden.6.a: "Лучше так, чем быть полностью вытесненным."

sweden.7.t: "Маннергейм возвращается"
sweden.7.d: "Несмотря на все его попытки вернуться в Финляндию, Маннергейму, по всей видимости, было отказано, причем финские власти привели различные доводы, большинство из которых являются полностью вымышленными и неверными. Обвиненный в том, что он является тайным агентом синдикалистов или, что ещё хуже, агентом российско-шведских империалистических амбиций, Маннергейм вернулся в Швецию озлобленным и разочарованным. Недовольный направлением развития нового революционного государства, Маннергейм планирует в ближайшем будущем уехать в другое место."
sweden.7.a: "Saatana Perkele..."

sweden.8.t: "Landsverk L-190"
sweden.8.d: "Концепция бронемашины существовала ещё до Первой мировой войны, и хотя грязные и суровые местности Соммы, Вердена и Пашендале, безусловно, продемонстрировали ограничения этой новой инновации, другие театра военных действий и конфликты с тех пор показали, что бронемашина действительно имеет свое применение. Однако это заставило некоторых задаться вопросом: можно ли ещё больше уменьшить размеры этого концепта, чтобы им могли управлять всего два человека на мотоцикле, при этом оставаясь защищенными от стрелкового оружия противника? Сама концепция существовала в той или иной форме ещё со времен Первой мировой войны, но из-за множества факторов она редко находила широкое применение. Однако шведская компания Landsverk намерена изменить эту ситуацию с помощью своего нового бронированного мотоцикла Landsverk L-190. Вооруженный пулеметом ksp m/14-29 и защищенный многочисленными броневыми пластинами, этот громоздкий мотоцикл-черепаха имеет фронтальную защиту для обоих членов экипажа, в основном изготовленную из клепаных пластин: сиденье стрелка покрыто полукольцом в форме ванны, а водитель сидит за слегка наклоненной пластиной.\n\nЭто транспортное средство, разработанное в 1930 году, уже почти пять лет проходит испытания в шведской армии под названием pansrad mc или pansarbil fm/30, и хотя его конструкция довольно примитивна, а броня значительно замедляет иначе быстрый мотоцикл, в целом он пользуется популярностью. Однако, учитывая последние достижения в области технологии бронированных автомобилей, такая бюджетная мера может показаться слишком примитивной для шведской армии, особенно с учетом того, что Landsverk уже усердно работает над производством таких известных бронированных автомобилей, как Landsverk L-180 и Landsverk Lynx."
sweden.8.a: "Интересная концепция, но выдержит ли она испытания войной?"

sweden.9.t: "Landsverk L-210"
sweden.9.d: "По мере того как испытания бронированного мотоцикла Landsverk L-190 постепенно подходят к концу, а среди сотрудников отдела закупок шведских вооруженных сил продолжаются дебаты о целесообразности использования такого транспортного средства, противники его внедрения привели в пример Landsverk L-210. В то время как L-190 изначально предназначался для шведской армии, L-210 изначально был заказан Данией как аналогичный, но более усовершенствованный транспортный средство. Дания, как меньший и явно более бедный младший брат Швеции, испытывала трудности с финансированием большого количества настоящих бронированных автомобилей и поэтому искала альтернативу.\n\nКомпания Landsverk, уже реализовавшая аналогичный проект, предложила собственный проект, который представлял собой довольно странную по форме машину Landsverk L-210. В отличие от более ранней и простой L-190, в 210 использовалась в основном сварная броня, а отсек экипажа был почти полностью закрыт, с броней по бокам машины. Однако из-за ограничений по весу, связанных с двигателем мощностью тридцать лошадиных сил, броня имела толщину четыре с половиной сантиметра и, таким образом, была совершенно недостаточной для защиты от пуль калибра винтовки, а единственным способом сделать машину действительно пуленепробиваемой было наклонить ее, что было трудно сделать в жаре боя. Датчане потребовали отказаться от среднего пулемета шведской L-190 и вместо него установить на L-210 пулемет Madsen местного производства.\n\nОднако, когда первые машины прибыли в Данию и прошли испытания, вскоре стало очевидно, что отсутствие брони и, что наиболее важно, ужасное рулевое управление и управляемость тяжелого и маломощного транспортного средства делали его совершенно бесполезным для военного использования, а максимальная скорость 50 километров в час делала его медлительным по сравнению даже с некоторыми бронемашинами, находившимися на вооружении Дании. Однако, когда дело L-210 было поднято в качестве осуждения программы L-190 в Швеции, компания Landsverk раскрыла планы по обновленной модели L-210 с улучшенной компоновкой, более мощным двигателем и, что интересно, поворотным креплением для пулемета, которое позволяло использовать его в качестве зенитного оружия. Датчане, по-видимому, проявили больший интерес к этой новой модификации, и хотя скептики в шведской армии по-прежнему относятся к обновленной версии с некоторым недоверием, она в некоторой степени оживила всю дискуссию о бронированных мотоциклах."
sweden.9.a: "Возможно, нам стоит понаблюдать, как датчане справятся с этими транспортными средствами."

sweden.10.t: "Чёрный понедельник наступает в Швеции"
sweden.10.d: "Две недели назад немецкий фондовый рынок рухнул. Вскоре последовала катастрофа. Во всех странах Балтии шведская промышленность и бизнес подвергаются сильному финансовому давлению, а внутри страны массовые увольнения следуют за сокращением смен на производственных предприятиях. Это было более катастрофично, чем крах в Америке и последовавший за ним крах Krueger, и любые политические цели Йёста Багге и его правительства были фактически отложены. Все силы брошены на то, чтобы предотвратить полный коллапс шведской промышленности и анархию на улицах."
sweden.10.a: "Herre min skapare!"

sweden.11.t: "Пер Альбин Ханссон критикует наши меры по преодолению кризиса"
sweden.11.d: "Пер Альбин Ханссон, лидер Шведской социал-демократической рабочей партии (SAP) и широко считающийся главным лидером оппозиции, резко осудил реакцию кабинета Багге на продолжающийся экономический кризис, назвав их веру в невмешательство опасной и вредной для Швеции.\nОн вновь выступил в поддержку своей программы «Folkhemmet», которая, по его утверждению, действительно защитит тех, кто потерял работу из-за кризиса, начавшегося в Германии."
sweden.11.a: "Мы делаем все, что в наших силах!"

sweden.12.t: "Рост числа членов SSV"
sweden.12.d: "Хотя оппозицию явно возглавляет SAP, две более мелкие партии присоединились к ней в противостоянии AV в правительстве: Sveriges Socialdemokratiska Vänsterparti (SSV), которая считает себя «истинными» социал-демократами и решительно поддерживает Третий Интернационал, и Bondeförbundet, партия, ориентированная на нужды сельских жителей Швеции.\n\nВ то время как Bondeförbundet продолжает тяжко продвигаться под руководством своего политического гиганта Перссона-Брамсторпа, SSV в последнее время переживает подъем. Умея заручиться поддержкой SAP и опираясь на избирателей, разочарованных реформизмом Ханссона, SSV является настоящим темной лошадкой на предстоящих выборах. Хотя она не может сформировать правительство самостоятельно, если SSV получит достаточно голосов и сумеет заставить SAP войти в избирательный блок, есть большая вероятность, что Швеция может стать красной на следующих выборах."
sweden.12.a: "Впереди страшные времена!"

sweden.13.t: "Арвид Линдман поддерживает кабинет Багге"
sweden.13.d: "Многолетний премьер-министр и бывший лидер Allmänna Valmansförbundet (AV) Арвид Линдман публично высказался в поддержку правительства, заявив о своей полной вере в Багге и призвав избирателей поддержать партию, которую он когда-то возглавлял.\nЛиндман правил Швецией с 1906 по 1911 год, а затем непрерывно с 1924 года до своей отставки в 1934 году. Многие считают, что его харизматичная личность была главной причиной того, что консерваторы не уступили власть социал-демократам, как это произошло в Дании. Многие сомневаются, что Багге сможет сохранить доминирующее положение Всеобщего избирательного союза в шведской политике, и многие считают, что выборы 1936 года - первые выборы с Багге в качестве лидера консерваторов - будут иметь решающее значение в этом вопросе."
sweden.13.a: "Спасибо, старый друг!"

sweden.14.t: "SAP отказывается исключать сотрудничество с радикалами"
sweden.14.d: "Шокирующая новость: Ханссон отказывается исключать возможность формирования коалиции с SSV, если это приведет к получению демократического мандата.\nОткрытое стремление SSV положить конец шведской системе в пользу социалистической формы правления, как во Франции и Великобритании (хотя и с шведскими особенностями, как указано в программе партии), вызывает дополнительную озабоченность среди представителей правого крыла. В частных кругах генерал Арчибальд Дуглас комментирует, что Ханссон может быть просто замаскированным большевиком или, в лучшем случае, полезным идиотом."
sweden.14.a: "SAP показала своё истинное лицо!"

sweden.15.t: "Новости из Парижа" #Introductory event to Swedish socialists
sweden.15.d: "Парижская клика, сформированная вокруг шведской делегации на Третьем Интернационале, сообщила своим товарищам из SSV и SAP, что они намерены вернуться домой в этом предвыборном году.\n\nПосле краха русских большевиков шведские коммунисты оказались без руководящего светоча... До тех пор, пока не была создана Французская коммуна и провозглашен Союз Великобритании. Карл Чильбум, Нильс Флюг и Зеф Хёглунд, видные социалисты и преданные коммунисты, увидели в возникновении западного синдикалистского восстания материальное доказательство того, что синдикализм был истинным путем к реализации видения Маркса, а не теории, отстаиваемые Лениным и его преемниками. Карл Чильбум продолжал называть себя коммунистом, но открыто заявлял о своем интересе к синдикалистским событиям во Франции, став лидером шведской делегации в этой стране. Нильс Флюг, преданный делу шведского марксизма любыми средствами, находил утешение в атмосфере революции и неотложности в Париже и Лондоне, поскольку это отвлекало его от трагедии его личной утраты - его шестилетней дочери Сольвейг, которая только что умерла от туберкулеза. С большой энергией и энтузиазмом Нильс Флюг стал известен среди более радикальных кругов Третьего Интернационала, неоднократно посещая Лондон и Париж, общаясь со всеми, от Дорио и Валуа до восходящей звезды Мосли. Зет Хёглунд, известный своим пацифизмом и отказом поддерживать что-либо, кроме народной революции, был очарован энергией социальных потрясений и справедливостью в отношении рабочих и стал отстаивать позицию SSV на бесконечных конгрессах в Париже.\n\nС момента расцвета революции всего лишь десять лет назад парижская клика прилагала все усилия, чтобы повлиять на SSV и заставить её занять более синдикалистскую позицию, формируя такие связи внутри партии в целом, чтобы эффективно управлять ею из-за границы. Поскольку Килбом является лицом шведского социализма на международном уровне, а Нильс Флюг часто участвует в дебатах и беседах с Мосли, Зета Хёглунд занял позицию неформального лидера SSV. Оказывая давление на SAP Пер Альбина Ханссона, чтобы тот присоединился к коалиции с ними на следующих выборах, парижская клика намерена форсировать революцию, полагая, что компромиссная политика SAP граничит с реакцией. Если революция дойдет до шведских берегов, Килбом и его товарищи уже готовы к ней, имея в своем распоряжении оружие, людей и здоровую дозу революционной бюрократии."
sweden.15.a: "Смешанные чувства."

sweden.16.t: "Истинные верующие"
sweden.16.d: "В то время как парижская клика заискивала перед синдикалистами и другими соратниками, истинные сыновья Маркса и герой Ленин остались верны своим идеалам. Свен Линдерут и Уго Силлен считают, что революция в России провалилась из-за внешних сил, а не из-за недостатков их идеологии. Считая, что западные социалисты, такие как Каутский и Люксембург, обрекли дело на провал, не сумев поднять свой народ на восстание против сил, враждебных красной России, Линдерут и Силлен возлагают вину исключительно на внешние силы, а не на Ленина, Зиновьева или даже Троцкого. То, что последовало в Париже и Лондоне, было позитивным, и Линдерут и Силлен оценивают это положительно, но это не означает, что пограничные буржуазные тенденции синдикализма являются приемлемой заменой полному истинному контролю рабочих. Действительно, в то время как парижская клика Килбома Флюга и Хёглунда рабски восхваляет систему, которая, по мнению Линдрота и Силлена, является фундаментально реакционной, эти два товарища установили тесные связи с русскими большевиками в изгнании. В своей газете «Norrskensflamman» Силлен ежедневно призывает к мировой революции, осыпая похвалами героев русской революции и изливая желчь на немецких «социалистических» предателей и их марионетку Керенского. Постоянно подвергаясь угрозам убийства, Силлен остается в Швеции, а его товарищ Линдерут остается в Париже, чтобы заручиться поддержкой из-за рубежа.\n\nСвен Линдерут, известный прежде всего своим героическим поступком - прорывом блокады Петрограда на корабле SS Eskilstuna III, - хорошо известен среди скандинавских коммунистов, не ослепленных блеском Парижа. Линдерут - заядлый дебатер, он может часами произносить речи, спорить с кем угодно и предан делу мировой революции. Хотя он по-прежнему верит в возможность мирного перехода к социализму, он более чем готов бороться за него. Если Линдерут - энергичный борец за красное будущее, то Уго Силлен - медленный методичный пророк, возможно, слишком медленный, поскольку товарищи часто обвиняют его в нерасторопности и отсутствии инициативы. Однако Силлен знает, что большинство этих обвинений исходит от иностранных делегатов или их агентов, и не испытывает особого интереса к чему-либо, кроме следования намеченному курсу. Он пишет, создает пропаганду, и когда наступит время революции, он будет готов сделать все необходимое, чтобы сохранить и защитить шведский путь к социализму."
sweden.16.a: "Бесконечные споры!"

sweden.17.t: "Голос за SAP - это голос за Париж!"
sweden.17.d: "В результате новости о том, что социал-демократы открыты для сотрудничества с явными радикалами, Общая избирательная лига начала пропагандистскую войну. Они открыто нацелены на избирателей SAP, утверждая, что SAP поддерживает Третий Интернационал и что любой голос за них будет напрямую связан с голосом за синдикалистский режим во Франции.\nНесмотря на резкое осуждение этой риторики со стороны SAP и то, что лишь немногие избиратели SAP поддадутся на эту пропаганду, она, похоже, успешно сыграла на эмоциях либеральных избирателей Folkpartiet, которые начинают считать SAP очень реальной угрозой для своего благосостояния. Они начинают видеть в AV гораздо более способную фракцию, способную противостоять злым планам SAP, чем Folkpartiet."
sweden.17.a: "Ничего личного, Андерссон..."

sweden.18.t: "Дебаты по поводу военных расходов"
sweden.18.d: "В связи с приближением выборов Йёста Багге и его министр вынуждены учитывать вполне реальную возможность поражения, поэтому правительство запланировало дебаты с целью утвердить по крайней мере бюджет Швеции на 1936 год с нынешним Риксдагом. Кабинет Багге стремится сохранить значительные инвестиции в военную сферу, чему решительно противостоит социал-демократическая оппозиция, утверждая, что в настоящее время Швеции не угрожает прямая опасность и что эти деньги лучше потратить на другие цели, чтобы улучшить жизнь шведов. Консерваторы пытаются противостоять этому, аргументируя это тем, что глобальная напряженность растёт и что тревожные события в Норвегии и Финляндии могут в будущем непосредственно угрожать Швеции. Правительство имеет большинство в Риксдаге, поэтому бюджет будет определенно принят, но преобладающий аргумент может приблизить партию, которая его выдвинула, к победе на предстоящих выборах.\nЭксперты сходятся во мнении, что..."
sweden.18.a: "...оппозиция полностью разгромила проект бюджета."
sweden.18.b: "...консерваторы умело защитили свой бюджет на год."
sweden.18.c: "...народная партия спасла Багге от позора."

sweden.19.t: "Выборы в шведский Риксдаг 1936 года"
sweden.19.d: "Предвыборная кампания 1936 года прошла под знаком подлых тактик, разжигания эмоций и едва завуалированных угроз. На данный момент единственной определенностью является то, что кто бы ни одержал победу на этих выборах, ему придется сотрудничать с другими, чтобы обеспечить себе большинство. Если победу одержат социал-демократы и они выполнят свою угрозу сотрудничать с SSV, то можно ожидать серьезных проблем. Если же победят консерваторы, Багге укрепит свою позицию как наследник Линмана, но недовольные социалисты, несомненно, будут сеять сомнения в легитимности этих выборов."
sweden.19.a: "SAP одерживает победу!"
sweden.19.b: "Консервативная коалиция под руководством AV остаётся у власти!"
sweden.19.c: "Консервативная коалиция теперь под руководством Folkpartiet!"
sweden.19.e: "Коалиция SAP-SSV одерживает шокирующую победу!"

sweden.20.t: "Принц за морем"
sweden.20.d: "Когда Российская империя распалась, а Финляндия погрузилась в гражданскую войну, Маннергейм, генерал-лейтенант ныне несуществующей Императорской российской армии, взял с собой группу своих самых доверенных людей и других финских офицеров и вернулся на родину. Предложив свои услуги новому финскому правительству, Маннергейм был назначен главнокомандующим и успешно защитил правительство от красных, но, хотя он сражался за финское правительство, правительство не испытывало к нему особой любви. С самого момента возвращения Маннергейма из России ходили слухи о том, что он был российским агентом или был лоялен не Финляндии, а другой стране. Ведь, хотя Маннергейм мог писать по-фински, в 1917 году его знание языка было далеко не идеальным. Дома он говорил по-шведски, в российской армии говорил по-русски, а в российском высшем обществе говорил по-французски. Более того, даже его манеры могли вызвать у других обиду или быть расценены как признак того, что он каким-то образом будет действовать против интересов своей родины. Слишком аристократичный, воспитанный в духе резкости по отношению к подчиненным и почти отстраненный, Маннергейм определенно не был выбором всех для лидера новообразованной финской армии.\n\nДаже когда финский парламент назначил Маннергейма главой армии, среди политиков возникли разногласия, некоторые задавались вопросом, не лучше ли было бы назначить немецкого командующего, поскольку законодатели - временные или нет - были заинтересованы в получении защиты со стороны Германии. Несмотря на то, что Маннергейм и его люди знали о тревожных событиях в тылу, они храбро сражались и спасли Финляндию от нападения Куллерво Маннера и его красных бандитов, но как только орудия замолчали, Маннергейм был жестоко удивлен. После ухода из армии, чтобы навестить родственников в Стокгольме, Маннергейм был проинформирован о том, что финское правительство по-прежнему настаивает на назначении немецкого монарха на престол, и при встрече с послами Антанты Маннергейм громко и четко высказался против этой идеи. После этого явного протеста Маннергейм был отправлен за границу финским правительством в надежде добиться признания со стороны западных держав.\n\nДостигнув своих целей в дипломатии за рубежом, когда Финляндия была признана независимым государством всеми, даже если и с некоторым неохотой со стороны русских белых, Маннергейм так и не вернулся в Финляндию. По-прежнему возражая против идеи немецкого монарха, несмотря на свои собственные монархические наклонности, не одобряя сосредоточение внимания на создании армии вокруг Германии и финских егерей, Маннергейм остался в Стокгольме. С тех пор как Маннергейм сделал Стокгольм своим домом, он был принят шведской армией и шведскими правыми, но это не означает, что сам Маннергейм считает себя привязанным к шведскому делу. С момента обретения Финляндией независимости Маннергейм свободно владеет финским языком, хотя говорит медленно и с сильным акцентом, и часто общается и посещает свою родину. Вместе со своими соотечественниками и друзьями Маннергейм готов вновь спасти Финляндию, если это понадобится, когда она перестанет быть просто марионеткой Германии."
sweden.20.a: "Med rena vapen för en ren sak."

sweden.21.t: "Национальные радикалы"
sweden.21.d: "Гражданская война в Финляндии затронула не только Финляндию, но и шведскую правую партию. Армия уже была рассадником реакционных и антисоциалистических взглядов, поэтому неудивительно, что несколько офицеров и солдат взяли отпуск, чтобы сражаться в Финляндии, перейдя границу с целью положить конец красной угрозе. Эти войска, сформированные в батальон под командованием ветеранов Персидской жандармерии Харальда Хьялмарсона и его подчиненного Мартина Экстрёма, рассматривали участие в войне в Финляндии не просто как акт братства, но как активный крестовый поход против социализма. Сражавшиеся в прошлом с русскими, Харальд и Мартин оказались в безжалостной войне не только против русских красных, но и против финнов, что, возможно, и побудило их превратить свои войска в инструмент белого террора. Являясь одним из немногих подразделений под командованием белых, состоявшим из профессиональных солдат, помимо финско-немецких егерей или бывших царских финских офицеров, шведский батальон использовался в качестве ударного элемента против окопавшихся красных, принимая участие в крупных сражениях на протяжении всей гражданской войны.\n\nПосле окончания гражданской войны и ухода Маннергейма из страны из-за растущих споров с белым правительством Свинхуфуда и его прогерманской позицией, шведская бригада последовала за ним обратно в Стокгольм, маршируя парадом после высадки в порту. Не довольствуясь только сражениями в Финляндии, Экстрём и группа единомышленников из числа офицеров и солдат приняли участие в боевых действиях в Эстонии, начав смелую кампанию от Ревеля до Нарвы, командуя и опираясь на помощь эстонцев, финнов, шведов и всех других антикоммунистов, которых только удалось найти. Однако дома, пока Экстрём сражался с большевиками, его бывший командир Хьялмарсон покончил с собой, так и не оправившись от жестокостей гражданской войны. Поэтому, когда Экстрём вернулся домой, его не только окружили высокопоставленные офицеры, но и шведские правые в целом, и шведские ультраправые в частности.\n\nКогда в 1931 году в Одалене произошло столкновение между рабочими и правительством, Экстрём ещё больше убедился в том, что шведское общество проникнуто и заражено социалистической агитацией. Создав не столь секретную группу преданных антисоциалистов из армии и широкой общественности, Экстрём пообещал представителям правых сил, что, если наступит время, он сможет мобилизовать около тысячи человек для защиты нации. Вступив в контакт с семьей фон Розен, которая познакомила его с Биргером Фуругордом и молодым, но радикальным офицером Свеном Оловом Линдхольмом, Экстрём был побужден своим товарищем по гражданской войне Эриком фон Розеном сформировать единый шведский националистический блок, что так и не произошло. Фуругорд был слишком радикален и сосредоточен на расовых вопросах, которые Экстрём едва понимал, Экстрём был слишком нехаризматичен, чтобы сплотить кого-либо, кроме уже убежденных сторонников, а Линдхольм отказался играть вторую скрипку, не говоря уже о том, что ему не нравился аристократический состав этого предполагаемого блока. В последующие годы Линдхольм и Фуругард оба вступили в контакт с решительно социалистически настроенным Нильсом Флюгом, в то время как Экстрём и фон Розен решили возложить свою веру и доверие на армию, в частности на генерала Арчибальда Дугласа.\n\nСегодня Фуругард руководит собственной партией, в общих чертах вдохновленной немецкой DVLP, и борется за голоса на периферии с Линдхольмом, который в политическом плане принял более тоталитарный курс. Экстрём ещё больше втерся в доверие к Дугласу и сформировал политическую силу, которая номинально притворяется настоящей политической партией. Шведские ультраправые расколоты, но не бездействуют."
sweden.21.a: "Фуругард? Разве он не ветеринар?"

sweden.22.t: "Еще один день, ещё одна забастовка"
sweden.22.d: "Портовый город Гётеборг сегодня закрыт, поскольку профсоюзы, входящие в SAC, протестуют против неспособности правительства справиться с кризисом «Черного понедельника», а также против того, что правительство является рабским последователем капиталистической системы угнетения. Эти забастовки не являются чем-то новым, поскольку с 20-х годов Sveriges Arbetares Centralorganisation активно и регулярно протестует против правительства и богачей, приводя город и его порт к остановке. Часто сталкиваясь с представителями профсоюзов и «охранниками» из SAP, а также с полицией, SAC защищает интересы рабочих в эти тяжелые времена.\n\nSAC, Центральная организация рабочих Швеции, является одной из самых радикальных рабочих ассоциаций во всей стране. SAC, представляющая собой большой блок синдикалистских профсоюзов, противостоящих реформистам из контролируемой SAP профсоюзной зонтичной организации Landsorganisationen, ведет постоянную борьбу против нетерпимости, неравенства и империализма. Основанная в 1910 году и решительно отказывающаяся участвовать в основной буржуазной политике, SAC часто конфликтует с LO, часто противостоит ей в забастовках и сотрудничает с ней только в редких случаях. Считая, что рабочие LO были обмануты реформизмом и капиталистическим принуждением, SAC жаждет того дня, когда рабочие увидят свет и присоединятся к их делу, делу синдикалистской экономической демократии.\n\nС самого начала синдикалистская SAC наблюдала за изменением хода истории, с ужасом следя за тем, как русская революция превратилась в кровопролитие, и с нетерпением наблюдая за поворотом истории в Лондоне и Париже. Вдохновленный своими товарищами на Западе, SAC в последние несколько лет принял гораздо более воинственный тон, превратив парижскую клику Килбома и SSV из потенциальных союзников в революционных соперников. В то время как Килбом хочет постепенного перехода Швеции к более равноправному обществу, вдохновляясь и извлекая уроки из опыта Парижа, SAC рассматривает это как лишь поверхностную имитацию постепенного реформизма SAP с более красным оттенком маски. SAC отказывается сотрудничать с SSV или Нильсом Флюгом и его группой, несмотря на их синдикалистские связи, требуя максимальной независимости и не желая, чтобы их дело было подвергнуто подрыву во имя каких-то высоких государственных целей. Если SAC добьется своего, революция будет исходить от рабочих, от профсоюзов, без влияния буржуазных политиков из SAP и SSV или их притворных большевистских союзников из SKP. Несмотря на участие в делегации в Париже, SAC под руководством своих двух лидеров Франса Северина и Элизы Оттесен-Йенсен ревностно охраняет свою независимость и действует вне контроля как Парижа, так и Килбома."
sweden.22.a: "Связанные, но независимые?"

sweden.23.t: "Проблема «Lex Hinke»" #Contraception event 1938
sweden.23.d: "«Lex Hinke» по-прежнему остается законом в Швеции, сохраняя полный запрет на использование, продажу и рекомендацию противозачаточных средств. Впервые введенный в 1910 году после того, как социалистический писатель Хинке Берггрен, умерший в 1936 году, опубликовал свою книгу «Любовь без детей», закон был создан в ответ на его идеи. Берггрен выступал за сексуальность взрослых без обязательств по отношению к детям и продвигал легализацию контрацептивов, утверждая, что такое изменение пойдет на пользу шведскому обществу.\n\nДебаты продолжаются уже почти три десятилетия. Противники, от умеренных социал-демократов до Лиги фермеров, Народной партии и консерваторов, утверждают, что легализация ослабит рост населения в стране, которая и без того небольшая по сравнению с европейскими великими державами, и что она рискует подорвать традиционные моральные нормы, отделяя сексуальность от семейной жизни. Сторонники отвечают, что контрацептивы дают женщинам большую свободу и равенство, а также помогают предотвратить воспитание детей в неблагополучных или вредных семьях. Более необычная форма поддержки исходит от некоторых кругов крайне правых, которые утверждают, что широкое использование контрацептивов может способствовать реализации их видения сохранения шведской идентичности путем ограничения рождаемости среди групп, которые они считают нежелательными.\n\nВ связи с тем, что как критики, так и сторонники вновь активизировались, правительство должно решить, будет ли Швеция придерживаться своей нынешней позиции или примет новый подход. Это решение определит отношение шведского общества к семье, морали и личной свободе в ближайшие годы."
sweden.23.a: "Отменить закон, легализовать контрацептивы." #dem paths yes
sweden.23.b: "Сохранить запрет, они останутся вне закона." #dem paths no
sweden.23.c: "Равенство требует свободы выбора." #socialist paths yes
sweden.23.e: "Необходимо предотвратить моральный упадок." #counter-rev paths no
sweden.23.f: "Разрешить их использование нашими евгенистами." #counter-rev paths yes

sweden.24.t: "Смерть Нильса Флюга" #Sweden was a different kind of socialist or democratic
sweden.24.d: "Характерный лидер SNSP Нильс Сванте Флюг сегодня перенес второй инфаркт. С момента первого инфаркта в январе 1941 года он был известен своим плохим здоровьем, и чтобы он мог оставаться политически активным, партия обеспечила ему номер в отеле в Стокгольме. Однако второй инфаркт оказался для него смертельным. Председателем SNSP стал Агатон Блом."
sweden.24.a: "Покойся с миром!"

sweden.25.t: "Смерть Нильса Флюга" #Sweden was authdem, pataut or natpop
sweden.25.d: "Мы получили сообщения о том, что один из самых известных шведских синдикалистов, Нильс Сванте Флюг, скончался от второго инфаркта, находясь в изгнании в пока неизвестном месте. Его руководство шведской национальной синдикалистской фракцией SNSP перешло к его соратнику Агатону Блому."
sweden.25.a: "Слава богу!"

sweden.26.t: "Разделение волос, разделение атомов" #nuclear research
sweden.26.d: "В предложении правительству советник правительства и лауреат Нобелевской премии Манне Сигбан представил физика Альберта Бьоркесона и офицера Торстена Шмидта, все трое выступали за поддержку в создании секретной шведской ядерной программы. Согласно контактам на Западе и Востоке, как Интернационал, так и русские разрабатывают какое-то крупное оружие, основанное на силе атома, которое, по словам Сигбана, приведет к довольно сильному взрыву. По мнению этой тройки, доступ к этой силе и её использование будут выгодны Швеции, поскольку позволят компенсировать нехватку рабочей силы огромным энергетическим потенциалом. В конце концов, никто не осмелится напасть на Швецию, если она сможет сбросить на них гипотетическую супербомбу. После внутренних обсуждений в правительстве было решено, что Швеция попытается использовать эту энергию, и проект был поручен офицеру Нильсу Сведлунду, прозванному «Стора Буллерт» (Большой Шум). Уже разрабатываются планы по открытию энергии атома, как для мира, так и для войны."
sweden.26.a: "Представьте себе... Энергия солнца в руках Швеции..."

sweden.27.t: "Неудобный случай"
sweden.27.d: "В ходе драматических событий семья «таттаре» (сленговое обозначение цыган или кочевых семей в целом) обвинила правительство в принудительной стерилизации их сына против его и их воли, что вызвало широкий резонанс в обществе. Впервые представленный в качестве закона в 1920-х годах SAP, а затем уточненный и расширенный AV в 1934 году, закон о стерилизации с момента его введения был предметом глубоких споров и вызвал широкий раскол между теми, кто обладает материальным богатством, и теми, кто его не имеет. Согласно закону, каждый мужчина, женщина и ребенок могут быть стерилизованы, если они признаны непригодными или иным образом неполноценными по уму или телу, часто, если не почти всегда, против их воли. В силу характера закона, семьи, проживающие в плохих жилищных условиях, матери-одиночки, семьи с одним или несколькими алкоголиками или даже просто лица, находящиеся в психиатрической лечебнице по любой причине, могут быть стерилизованы, для чего требуется только решение врача, а не согласие заинтересованного лица или лиц.\n\nВ этом публичном деле государственный служащий посетил семью путешественников, счел их «развратными и непригодными для воспитания детей» и отобрал у них детей. Ребенок был помещен в учреждение, где после нескольких лет обучения врач, ответственный за его лечение, почти по прихоти решил стерилизовать ребенка, не представив при этом никаких причин. Узнав об этом, семья обратилась в прессу и направила письмо с просьбой и мольбой разъяснить, как и почему кто-то может стерилизовать чужого ребенка против его воли. Действительно, бедные люди часто боятся государственных служащих как прямое следствие этого закона, опасаясь, что, если государственный служащий сочтет их морально неполноценными или просто «антисоциальными», их стерилизуют, якобы для их же блага. Несмотря на то, что рабочий класс презирает этот закон, сам Риксдаг в целом доволен им и, похоже, не заинтересован в его отмене или изменении."
sweden.27.a: "Трагическая ситуация, но соблюдайте закон."
sweden.27.b: "По крайней мере, пересмотрите закон..."

sweden.28.t: "В память"
sweden.28.d: "На поле случайного стрельбища покоится часть шведской военной истории. Несмотря на испытания, тестирование и критику, взрывы и обстрелы, она остается на месте. Renault FT 17, построенный в конце последней великой войны, купленный в 1921 году, пионер шведской теории бронетехники. Впервые прибыв в Стокгольм на корабле Vega, Putte был передан под номинально секретную опеку тканевого отдела армии. Из-за любопытного внешнего вида машины и сложностей с разгрузкой тяжелого зверя, журналисты и зеваки успели полюбоваться им, прежде чем армия поспешила увезти его. Тем не менее, Putte вскоре прошел множество тренировок и учений, чтобы выяснить, что именно танк может делать в шведских условиях. Были скептики, которые утверждали, что бронетехника никогда не найдет применения в шведской армии. Были сторонники, которые утверждали, что в будущем машины сделают людей ненужными. А посередине, сталкиваясь как с критикой, так и с невозможными чаяниями, находился Putte.\n\nВ конце концов, после многих лет службы в качестве артиллерийского транспортера, испытательного стенда и радиомашины, Путте был окончательно выведен из эксплуатации в 1925 году. Его вывезли на поле, где провели последние испытания, обстреливая из пулеметов, пушек и ручных гранат. Швеция, шагая в механизированное будущее, должна помнить о смелой жертве Путте, который отдал все на службе своей стране."
sweden.28.a: "Ура, Путте!"

