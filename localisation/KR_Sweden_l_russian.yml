### Tool tips ###

SWE_chief_of_army_tt: "§OВласть короля над вооруженными силами будет заменена должностью главнокомандующего армией, чтобы улучшить структуру нашего высшего командования!§!" 

SWE_arms_against_tyranny_tt: "§RС ликвидацией монархии и уходом многих аристократических генералов шведская армия должна быть полностью реформирована и перестроена!§!" 

SWE_remove_german_industry_tt: "§RУстранив немецкую промышленность, мы нанесем ущерб нашим внешнеполитическим отношениям с Рейхспактом.§!"

SWE_kept_german_industry_tt: "§RПри выборе союза мы получим стимулы для присоединения к Рейхспакту.§!"

SWE_landsturm_expansion_tt: "§OЕсли война обрушится на Швецию, после первоначальной волны будет мобилизована дополнительная подготовленная экспансия Ландстормена.§!"

SWE_linderot_purged_tt: "§RСвен Линдерут будет отстранен от должности и заменен Агатоном Бломом.§!"

SWE_linderot_plan_coup_tt: "§RСвен Линдерут сделает свой ход...§!"

SWE_lindholm_purged_tt: "§RЛиндхольм и его реакционные соратники должны быть уничтожены!§!"

SWE_lindholm_coup_tt: "§Линдхольм готовится к своему ходу...§!"

SWE_red_folkhemmet_militarize_it_tt: "§RFolkhemmet будет переоборудован для поддержки нашей военной промышленности, и уделение большего внимания нашему военному аппарату уменьшит наши выгоды для гражданского сектора. Помните, это решение нельзя отменить!§!"

SWE_red_folkhemmet_people_it_tt: "§RФолькхеммет будет в дальнейшем сосредоточен на помощи нашему народу§!"

SWE_red_folkhemmet_available_tt: "§5Станут доступны решения по началу формирования нашего собственного Фолькхеммета.§!"

SWE_SSV_start_effect_tt: "Наш §HЭкономический закон§! будет §Gулучшен§! до §H$low_economic_mobilisation$§!. Кроме того, мы также получим [?2|=+0] $industrial_complex$"

SWE_syndicalist_agrarian_effect_tt: "Мы будем в полной мере поддерживать наши §HАграрные союзы§!, получая [?3|=+0] §G$industrial_complex$§! и доступ к дополнительному §Hстроительному слоту§! во всех регионах."

SWE_flyg_purges_riksdag_tt: "Флиг займётся наведением стабильности в хаотичном Рабочем Риксдаге посредством масштабной §Rчистки§!; в первую очередь под удар попадёт §R$SWE_radical_socialist_party$§!, представляющая пороки бывших социал-демократов, которых они бесстыдно поддерживали.\n\nДалее последуют §R$SWE_syndicalist_party$§! - лицо иностранного влияния, бесконтрольно разросшегося из-за их безоговорочной преданности Парижу и Лондону.\n\nВ результате мы потеряем [?260|-0] людских ресурсов."

SWE_militarist_buildup_effect_tt: "В рамках нового §Rплана перевооружения§! Свена Линдхольма наши §HЗакон о призыве§! и §HЭкономический закон§! будут §Gулучшены§! до §H$extensive_conscription$§! и §H$partial_economic_mobilisation$§! соответственно, а также мы получим [?5000|=+0] людских ресурсов.\n\nКроме того, мы построим [?3|=+0] §G$arms_factory$§! и [?2|=+0] §C$dockyard$§!, а также получим дополнительный §Hстроительный слот§! во всех регионах."

SWE_mobilize_the_nation_small_effect_tt: "Наши §HЗаконы о призыве§! и §HЭкономический закон§! будут §Gулучшены§! до §H$limited_conscription$§! и §H$partial_economic_mobilisation$§! соответственно."

SWE_mobilize_the_nation_medium_effect_tt: "Наши §HЗаконы о призыве§! и §HЭкономический закон§! будут §Gулучшены§! до §H$extensive_conscription$§! и §H$partial_economic_mobilisation$§! соответственно."

SWE_mobilize_the_nation_big_effect_tt: "Наши §HЗаконы о призыве§! и §HЭкономический закон§! будут §Gулучшены§! до §H$extensive_conscription$§! и §H$partial_economic_mobilisation$§! соответственно. Кроме того, мы также получим [?2|=+0] $arms_factory$ и [?20000|=+0] людских ресурсов."

SWE_economic_decisions_tt: "§5Станут доступны решения по улучшению экономики Швеции.§!"

SWE_banned_socialist_parties_effect_tt: "Оставшиеся §RТоталистские§!, §RСиндикалистские§! и §RРадикально-социалистические§! группы будут запрещены в официальном Риксдаге для обеспечения национальной стабильности."

SWE_conservative_scouts_effect_tt: "Наш §HЗакон о призыве§! будет §Gулучшен§! до §H$extensive_conscription$§!. Кроме того, мы также получим [?8000|=+0] людских ресурсов."

SWE_freeing_market_effect_tt: "Наши §HТорговые законы§! будут §Gизменены§! на §H$free_trade$§!. Кроме того, мы также получим [?2|=+0] $industrial_complex$ и [?1|=+0] $dockyard$."

SWE_elmo_cohesion_effect_tt: "Мы обеспечим сплочённость наших рядов, введя §gArméns Fosterlandsvänner§! и §LFosterländska Stiftelsen§! в наши структуры в рамках великой §Hмонархической§! коалиции!"

SWE_indulge_folkpartiet_effect_tt: "Наши §HТорговые законы§! будут §Gизменены§! на §H$free_trade$§!, и мы построим [?1|=+0] §C$dockyard$§!. Кроме того, если этот фокус будет взят до фокуса §HСозвать Риксдаг по вопросу военных расходов§!, мы получим более значительные положительные эффекты как для себя, так и для Folkpartiet."

