SWE_totalist_party_long: "Sveriges Kommunistiska Parti\n§LКоммунистическая партия Швеции§!\nSveriges Nationalsyndikalistiska Parti\n§LНациональная синдикалистская партия Швеции§!\n§gШведские маргиналы объединяют в себе довольно много странных союзников, вынужденных сотрудничать, но в то же время соперничать из-за различия идеологий. После хаоса русской революции шведские левые раскололись, образовав целую плеяду различных партий, две из которых - SKP и SNSP - являются наиболее заметными и радикальными. Обе эти партии откололись от SSV, которая, в свою очередь, откололась от SAP. SKP, возглавляемая Свеном Линдерутом и Уго Силленом, стремится к созданию шведского коммунистического государства по образцу неудавшегося российского эксперимента. Партия поддерживает тесные связи с большевиками, находящимися в изгнании в Париже, и часто общается с Зиновьевым. Вдохновленная рассказами о героизме большевиков и пролетарской борьбе на Востоке, SKP считает, что социалистическая Швеция должна принимать активное участие в мировой революции, предпочтительно в сотрудничестве с другими социалистическими государствами. Возмущенные и потрясенные крахом русских красных в гражданской войне, Нильс Флюг и его соратники по SSV вместо этого обратились за вдохновением к Парижу и Лондону, а сам Флюг впоследствии стал самым ярым сторонником новой моды тоталитаризма в Швеции. Отделившись от SSV из-за нежелания принимать более радикальную политику, национал-синдикалистская партия Нильса Флюга взяла левых штурмом, в частности потому, что Флюг хорошо известен своими революционными убеждениями и готовностью работать с более неприятными элементами для обеспечения социалистической Швеции.§!"

SWE_totalist_C_party_long: "Sveriges Kommunistiska Parti\n§LКоммунистическая партия Швеции§!\n§gДействуя как сильная сила в левом крыле шведской политики, SKP намеревается силой втянуть Швецию в новый социалистический мировой порядок, надеясь, что любой ценой в шведском обществе удастся внедрить социалистическую систему по российскому образцу, как того хотел бы Ленин. Уделяя большое внимание промышленности и образованию, а также подчиняя клубы и ассоциации SKP, партия надеется остаться у власти в Швеции на долгие поколения, постепенно строя коммунизм. Смеясь над синдикалистами за их мягкость и наивность и обвиняя оставшихся лоялистов SNSP в том, что они являются мослиевскими головорезами, SKP считает себя умеренной, но революционной силой, отрекшейся от революционного романтизма Зиновьева.§!"

SWE_totalist_flyg_party_long: "Sveriges Nationalsyndikalistiska parti\n§LНациональная синдикалистская партия Швеции§!\n§gНильс Флюг и его партия более десяти лет неустанно работали над укреплением своих позиций в шведском обществе, выступая за контроль рабочих над промышленностью, а также за систему, свободную от буржуазного угнетения и злоупотреблений. По мнению Флюга и его SNSP, такая великая цель, как социализм, требует абсолютной самоотдачи, полного подчинения и всеобщей мобилизации пролетариата. Собрав силой сторонников со всего политического спектра Швеции, от элементов бывшей крайней правой до так называемого люмпенпролетариата, Флюг не просто хочет создать социалистическую Швецию как таковую, он хочет полностью перестроить страну.§!"

SWE_totalist_lind_party_long: "Svensk Socialistisk Samling\n§LШведское социалистическое собрание§!\n§gЛюбопытное творение Свена Олова Линдхольма, SSS было сформировано в результате неудачи шведских ультраправых объединиться под одним общим знаменем. Разочарованные нежеланием SRNS подчинить капитал государству, возмущенные стремлением SNSP приступить к жестокой индустриализации и презирающие притворных большевиков из SKP, SSS была буквально создана в качестве реакции, хотя это не делает её по сути реакционной. Вдохновляясь легионерами Железной гвардии, но без их насилия, изучая работы Муссолини и Мосли, но не слепо следуя им, Линдхольм хочет, чтобы SSS стала массовой партией. Одержимый идеей шведской чистоты в мышлении и обществе, враждебный к реальным и мнимым иностранным элементам, большая часть его идеологии все ещё остается неопределенной. Действительно, несмотря на склонность Линдхольма к витиеватым речам, кажется, что политика SSS формируется по ходу дела. Насколько известно миру, Линдхольм и его SSS являются либо оппортунистами, стремящимися к поддержке рабочего класса, либо беспринципными бандитами, либо искренними сторонниками новой системы.”

SWE_syndicalist_party_long: "Sveriges Arbetares Centralorganisation\n§LЦентральная организация рабочих Швеции§!\n§gБьющееся сердце шведского синдикализма, SAC и их газета Arbetaren поддерживают мечту, будь то на баррикадах, забастовках или протестах по всей стране. Не связанная с какой-либо другой шведской политической партией, SAC черпает вдохновение в событиях в Париже и Лондоне, веря, что истинный путь шведского рабочего лежит прежде всего в синдикализме. Наполненная различными течениями левой мысли, от более анархистских до более классово-коллаборационистских, SAC является широкой левой церковью, хотя и объединенной синдикализмом. Если бы SAC поступила по-своему, Швеция стала бы коммуной в стиле своих друзей в Париже, свободной и любящей свободу, объединенной в деле построения социалистической и синдикалистской Швеции.§!"

SWE_radical_socialist_party_long: "Sveriges Socialdemokratiska Vänsterparti\n§LШведская социал-демократическая левая партия§!\n§gОтделившись от SAP во время Первой мировой войны, SSV с самого начала была раздираема расколами и внутренними партийными спорами. Когда русская революция погрузилась в хаос, коммунисты, поддерживавшие Россию, были изгнаны из партии в результате серии жестоких фракционных споров, в результате чего была создана SKP. После появления Мосли и Муссолини и их так называемого тоталитаризма Нильс Флюг и его так называемые национальные синдикалисты также были исключены из партии после неудавшегося внутрипартийного переворота, организованного Флюгом. Однако, несмотря на эти внутренние расколы, SSV по-прежнему привержена делу шведского социализма благодаря своему нынешнему лидеру Зету Хёглунду и его буржуазной протеже Карин Бойе. Хотя на бумаге партия возглавляется Хёглундом, она тесно связана со шведской делегацией в Третьем Интернационале, так называемой Парижской кликой, главным действующим лицом которой является Карл Чильбум, и находится под её контролем. Не особо стремясь к сотрудничеству с SAP из-за обвинений SSV в предательстве пролетариата, в особых случаях SSV и SAP могут объединиться, хотя бы для продвижения целей рабочего движения. Возможно, самая известная и связанная с Парижем и Лондоном партия, SSV, тем не менее, остается прагматичной в отношении пути социализма, открытой как для парламентской борьбы, так и для революционных действий. Стремясь к сотрудничеству со своими друзьями в Третьем Интернационале, SSV не является синдикалистской, хотя и извлекает уроки из экспериментов во Франции.§!"

SWE_social_democrat_party_long: "Sveriges Socialdemokratiska Arbetarepartiet\n§LШведская социал-демократическая рабочая партия§!\n§gХьялмар Брантинг создал современную SAP, партию, основанную на сотрудничестве и дружбе между всеми людьми, независимо от их классовой принадлежности, и стремящуюся построить социализм постепенными средствами. Именно этот постепенный подход, вера в медленное продвижение к более равноправному обществу, разделил шведских левых. Некогда гигантская левая рабочая сила, SAP, стремясь к сотрудничеству с прошлыми и нынешними правительствами, а также ограничиваясь правовыми реформами, привела к тому, что её более радикальное молодежное движение откололось и образовало SSV, которая впоследствии сама разделилась. С момента избрания первого социал-демократического премьер-министра Хьялмара Брантинга, который занимал эту должность с 1919 по 1924 год, с 1928 года партией руководил Пер Альбин Ханссон, сторонник классового сотрудничества и его идеи «фолькхеммет», согласно которой любое шведское правительство должно строиться на сотрудничестве всех классов общества в интересах всего народа страны, на благо шведской нации. Первый кабинет Ханссона сформировался в 1928 году, и хотя он успешно продвигал реформы и идею государства всеобщего благосостояния, в 1932 году он проиграл перевыборы Арвиду Линдману, своему сопернику из правого крыла Риксдага. Пер Альбин Ханссон и его протеже Таге Эрландер с большим вниманием и усилиями готовятся к следующим выборам, по-прежнему придерживаясь идеалов folkhemmet и пытаясь успокоить правых, которые считают их замаскированными синдикалистами. Несмотря на то, что по сути своей они являются социал-демократической партией, как и их друзья из немецкой СДПГ, они были вынуждены или иным образом изменились под влиянием Первой мировой войны, став более склонными к сотрудничеству как с армией, так и с «властями», чтобы достичь власти и сохранить нацию.§!"

SWE_social_liberal_party_long: "Bondeförbundet\n§LЛига фермеров§!\n§gШвеция - сельская страна, полная лесов и ферм, озер и полей. Bondeförbundet стремится выступать от имени тех, кто живет за пределами городов, вдали от тяжелого труда на земле, вдали от тех, кто владеет фермами, наполняющими желудки нации. Хотя аграрная направленность присутствует во всех правых партиях Швеции, только Bondeförbundet выступает от имени фермеров, независимо от их статуса, независимо от того, бедны они или богаты. Эта партия, представленная в основном в сельских районах, до сих пор находилась в стороне от шведской политики, стремясь продвигать реформы, ориентированные на фермеров, и готовая сотрудничать с кем угодно, кроме крайне левых и крайне правых, для достижения своих целей. В последнее время Bondeförbundet приняла более либеральную позицию, стремясь отойти от роли партии, представляющей интересы сельских жителей, и надеясь завоевать растущий слой государственных служащих и молодых специалистов с помощью более шведского стиля либерализма.§!"

SWE_market_liberal_party_long: "Folkpartiet\n§LНародная партия§!\n§gЯвляясь маяком либерализма в шведской политике, Folkpartiet выступает за строго правильную фискальную политику и за тысячи мелких предпринимателей по всей стране, а также за дружественное государство с программами для самых бедных, без социалистического вмешательства или злоупотреблений. Folkpartiet хочет видеть Швецию заботливой и сострадательной, но независимой от прихотей правых или левых, где каждый мужчина, женщина и ребенок могут продвигаться в обществе благодаря своему труду и поддержке со стороны правительства. Folkpartiet, в основном сосредоточенная в крупных городах страны, перепредставлена в интеллигенции, хотя в последние годы её электорат все больше переходит на сторону SAP или AV.§!"

SWE_social_conservative_party_long: "Allmänna Valmansförbundet\n§LОбщая избирательная лига§!\n§gНет партии, которая бы больше посвятила себя делу шведской пристойности и умеренности, чем AV, поскольку благодаря её лидеру Арвиду Линдману Швеция предотвратила социалистический переворот в 1924 году, а также в 1932 году... По крайней мере, так хочет, чтобы вы верили Йёста Багге. Созданная из бывших независимых политиков и небольших консервативных партий, AV стремится к сильной и консервативной Швеции, свободной как от либеральных иллюзий, так и от экстремистских злоупотреблений. Багге хочет вернуться к более благопристойным временам, когда люди были набожными и ходили в церковь, когда местный священник пользовался уважением, а Риксдаг был полон бесконечных споров и коррупционных скандалов. Вдохновленная величайшими периодами шведской истории, AV знает, что шведская история и успех основаны на набожности и преданности шведскому образу жизни, а также на скромности и умеренности. Скептически относясь к системам социального обеспечения, но не желая их ликвидировать, стремясь финансировать военных, но опасаясь авантюризма за рубежом, AV все чаще занимает позицию оппозиции - даже находясь у власти. Имея в прошлом нескольких премьер-министров, AV опасается почивать на лаврах, поскольку Йёста Багге болезненно осознает, что его коллеги по партии все больше смиряются с испанским стилем turnismo. В последнее время AV усердно работает над тем, чтобы изобразить SAP гораздо более радикальной, чем она есть на самом деле, прилагая все усилия, чтобы выставить Ханссона почти предателем страны или полезным идиотом Парижа, при этом не уделяя особого внимания тому, во что они сами верят.§!"

SWE_social_conservative_alternate_party_long: "Högerns Riksorganisation\n§LНациональная организация правых§!\n§gЯвляясь эволюцией AV, Högerns Riksorganisation пытается извлечь уроки из опыта старой партии, в частности, пытается наконец принять современную массовую политику. Финансируемая богатыми сторонниками и поддерживаемая правоцентристами, партия занимает позицию преданного защитника консервативных ценностей и благочестивых шведских традиций, выступая за сохранение роли церкви в повседневной жизни, нравственность в СМИ и верность традициям, сложившимся на протяжении тысячелетий. Пытаясь избежать ошибок прошлых консервативных партий и экспериментов, партия делает все возможное, чтобы сдержать снобизм, и даже пытается укрепить свое присутствие в рабочих классах, поощряя членство в профессиональных (и лояльных) профсоюзах. По-прежнему скептически относясь к концепции социального обеспечения, партия понимает, что не может ликвидировать институты, которые избиратели сейчас считают постоянными, и поэтому она будет пытаться внедрить консервативные ценности в быстро развивающуюся систему общественного здравоохранения.§!" 

SWE_authoritarian_democrat_party_long: "Fosterländska Stiftelsen\n§LОтечественный фонд§!\n§gСозданная из-за опасений социалистической революции, FS является не столько партией, сколько просто союзом единомышленников - правых политиков, чиновников и интеллектуалов. FS существует благодаря существованию SAP и SSV и тратит огромные средства на продвижение в СМИ информации, раскрывающей общественности истинную природу социализма. FS тесно сотрудничает с AV, несколько членов входят в обе организации, но не связаны с ней напрямую. FS с презрением относится к Риксдагу и хочет более прямого лидера, который спас бы нацию, предпочтительно из своих рядов. Однако, по сути, FS только притворяется антисоциалистической, по крайней мере, по сравнению с SRNS Мартина Экстрёма, и не интересуется ничем, кроме борьбы с социализмом.§!"

SWE_authoritarian_democrat_league_party_long: "Sveriges Nationella Förbund\n§LШведская национальная федерация§!\n§gОснованная в 1915 году как молодежное движение AV, в результате растущих разногласий и радикализации внутри движения в 20-е годы она откололась от своей материнской партии, став одной из первых по-настоящему радикальных правых партий в Европе. Вдохновленная правыми движениями во Франции и Германии, SNF объединяет широкий спектр различных правых настроений, от корпоративистов, интегралистов, националистов до воинствующих консерваторов. Под руководством своего последнего лидера Элмо Линдхольма организация приняла более маурассианскую направленность, черпая вдохновение не только из прошлого, но и из тенденций, наблюдаемых по всей Европе, таких как политические боевые отряды и современная пропаганда. Впечатляя правые СМИ, Эльмо Линдхольм и его SNF, наряду с Kamporganisation, известной публично как «Серые рубашки» (Gråskjortor) под руководством Альфа Мейерхоффера, представляют серьезную угрозу для правых. Обвиняя SAP в том, что они являются большевиками и синдикалистами, агентами еврейского интернационализма и всем, что только можно придумать, Линдхольм и Мейерхоффер хорошо известны (и нелюбимы) как правым, так и левым за свои реакционные идеалы. Линдхольм хочет омолодить и полностью национализировать Швецию, считая, что демократия заразила душу нации, и надеется превратить свое движение в маяк радикальной реакции в Ультима Туле.§!"

SWE_authoritarian_democrat_old_party_long: "Riksrådet\n§LСовет королевства§!\n§gПосле окончания социалистического безумия был создан специальный совет для обеспечения будущего Швеции. Хотя и не ясно, является ли это постоянным учреждением или просто временным решением, Riksrådet состоит из бывших министров, политиков, военных и нескольких представителей правого крыла.§!"

SWE_paternal_autocrat_party_long: "Arméns Fosterlandsvänner\n§LСоратники армии на родине§!\n§gЯвляясь ассоциацией, связанной с армией и выступающей в её поддержку, AF не имеет никакой последовательной идеологии или позиции, кроме как демонстрировать поддержку армии и поощрять её активное участие в государственном аппарате. По сути являясь рупором недовольных генералов, AF проводит наиболее последовательную антисоциалистическую политику и объединяет множество различных оппозиционных взглядов, которые объединены под общим знаменем поддержки военных.§!"

SWE_paternal_autocrat_jung_party_long: "Försvarsmaktens Råd för Nationell Stabilitet\n§LСовет вооруженных сил по национальной стабильности§!\n§gХунта останется у власти, хотя и с некоторыми изменениями. Совет национальной стабильности, состоящий из офицеров и тщательно отобранных министров и политиков, намерен оставаться у власти на неопределенный срок, по крайней мере до тех пор, пока не будут устранены угрозы шведскому государству. Аппарат правительства по-прежнему остается, хотя и под управлением и контролем армии, но гражданские политики все ещё имеют свое место, хотя партии, выступающие против нового положения дел, были запрещены. Предполагая, что чрезвычайное положение закончится, демократия в Швеции навсегда изменится.§!"

SWE_national_populist_party_long: "Svea Rikes Nationella Samlingsparti\n§LПартия национального единства Шведского королевства§!\n§gВо главе с Мартином Экстрёмом и при поддержке генерала Арчибальда Дугласа, SRNS является архетипичной белой силой, посвятившей себя цели уничтожения угрозы красного повстанческого движения и всего остального, что Экстрём и его друзья считают «неправильным». Не заинтересованная в том, чтобы быть массовой партией, и питающая недоверие к населению в целом, SRNS состоит в основном из офицеров и военных, но пользуется поддержкой антисоциалистической буржуазии, а также более радикальных представителей высших классов. Предполагая, что красные поднимутся в стране, SRNS будет готова с ними бороться, хотя, несмотря на заявления Экстрёма о тысячах членов, из-за его плохих ораторских способностей и ужасающей неспособности донести свою идею до масс, SRNS является скорее группой лоялистов, чем настоящей партией.§!"

SWE_national_populist_maurass_party_long: "Sveriges Nationella Förbund\n§LШведская национальная федерация§!\n§gSNF превратился в маурационистский блок в правой части шведской политики, объединивший под одной крышей широкую коалицию монархистов и правых, всех объединенных общей идеей Элмо Линдхольма и его маурационистскими идеями. Хотя некоторые настроены скептически, все участники движения с нетерпением ждут, какие планы Элмо готовит для страны: одни ожидают интегралистской трансформации общества, другие просто надеются на усиление монархии. Тем не менее, Линдхольм быстро принимает элементы раздробленной шведской правой партии, а старая SRNS Экстрёма склоняется в пользу этого нового подхода.§!"

SWE_banned_soc_party_long: "Считаясь слишком радикальными для шведского общества, эти левые партии были полностью запрещены правительством в попытке сдержать радикализм."

SWE_banned_soc_party_tt: "§YСчитаясь слишком радикальными для шведского общества, левые партии были полностью запрещены правительством в попытке сдержать радикализм.§!"

