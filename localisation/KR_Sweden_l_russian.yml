SWE_sami_aid: "«Оставшиеся позади» Сведлунда"
SWE_sami_aid_desc: "«Оставшиеся позади» Нильса Сведлунда - это высококвалифицированная группа, состоящая из солдат, готовых и желающих скрываться на нашей территории, которая может быть завоевана противником, чтобы затем нанести удар по врагу с тыла. Они нарушают линии снабжения и подрывают боевой дух противника, в то время как наши солдаты пробираются между городами и лесами, которые они знают так хорошо."

