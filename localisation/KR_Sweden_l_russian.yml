sweden_focus: "Швеция в фокусе"

####Ideas####
SWE_political_chaos_idea: "Политическая стагнация"
SWE_political_chaos_idea_desc: "С момента объявления нейтралитета после Первой мировой войны политическая ситуация в Швеции оставалась относительно стабильной, и страна сохраняла статус конституционной монархии на Севере. Однако после отставки предыдущего премьер-министра и усугубления экономической стагнации в Риксдаге практически ничего не делается. Любой законопроект, вносимый одной из сторон, быстро отклоняется противоположной стороной. На фоне растущей напряженности в мире предстоящие выборы рассматриваются как новая надежда на будущее Швеции."
SWE_political_chaos_idea2: "Политический стагнация"
SWE_political_chaos_idea2_desc: "С момента объявления нейтралитета после Первой мировой войны политическая ситуация в Швеции оставалась относительно стабильной, и страна сохраняла статус конституционной монархии на Севере. Увы, с отставкой предыдущего премьер-министра и усилением экономического застоя в Риксдаге мало что делается. Любой законопроект, вносимый одной из сторон, быстро отклоняется противоположной стороной, а на фоне растущей напряженности в мире предстоящие выборы рассматриваются как новая надежда на будущее Швеции."


SWE_german_reach_1: "Германское экономическое влияние"
SWE_german_reach_1_desc: "Несмотря на то, что Швеция сохраняла нейтралитет во время Первой мировой войны, она заключила ряд торговых соглашений с Германской империей, считавшейся экономическим бастионом Центральной Европы. Хотя это значительно помогло шведской экономике, оно не обошлось без недостатков: немецкие промышленники и бизнесмены теперь обладают большим влиянием в стране и могут оказывать давление на политическую сцену, чтобы поддержать как свои интересы, так и интересы Германии."
SWE_conservative_army_idea_1: "Раскол в армейском руководстве"
SWE_conservative_army_idea_1_desc: "Шведская армия находится в состоянии раскола, поскольку фракционность и разные теории современной войны вызывают бесконечные споры и возмущение. Генерал Олоф Торнелл часто ссорится со своим младшим соперником и подчиненным Хельге Юнгом, а политическая радикализация растёт в рядах армии по мере того, как угроза синдикализма становится все более реальной."
SWE_statare_idea: "Рабочая сила Статаре"
SWE_statare_idea_desc: "От фермы к ферме бродят безземельные Статаре, крестьяне, лишенные как собственности, так и богатства, которые работают на годовой основе в поместьях и на фермах. В результате увеличения импорта зерна из Украины и Америки шведские фермы перешли на работу в основном с животными, что требует огромного количества скотоводов и конюхов. Статаре занимают самое низкое положение в обществе, вынуждены спать на обочинах дорог между контрактами и скучиваются в бараках на крупных поместьях. Получая половину заработной платы наличными, а половину «статом», то есть продуктами или арендованной землей, они не имеют никаких возможностей для социального продвижения."

SWE_hotellockout: "Гостиничный локаут"
SWE_hotellockout_desc: "Из-за трудового конфликта и массовых забастовок гостиничный сектор Швеции оказался парализован: по всей стране практически не осталось отелей, способных нормально функционировать из-за нехватки персонала."

SWE_removing_the_statare_idea: "Освобождённые Статаре"

SWE_starting_neutrality_idea: "Ощутимый нейтралитет"

SWE_devalued_krona_idea: "Девальвация кроны"
SWE_tighten_expenses1: "Сокращение расходов"
SWE_black_monday: "Полночь чёрного понедельника"
SWE_black_monday_desc: "Годы упорного труда и экономического планирования пошли насмарку, экономика мертва. После краха американской экономики всего несколько лет назад шведская экономика оказалась почти полностью сосредоточенной на немецком рынке, и с последующим крахом последнего все развалилось. Зарплаты были сокращены во всех крупных компаниях, увольнения стали повсеместными, растут социальные волнения. В городах местные профсоюзы и политические партии организовали бесплатные столовые, чтобы помочь недавно обедневшему населению, а в сельской местности церкви и их миссии заполнены нищими. Все готово для абсолютной катастрофы." 
SWE_black_monday_0: "Тёмные облака чёрного понедельника"
SWE_black_monday_0_desc: "Дела обстоят плохо, хуже чем плохо. После решения правительства вмешаться и помочь экономике выбраться из пропасти фондовый рынок восстановился, но лишь в минимальной степени. Шок от краха теперь распространяется на потребителей, недели, если не месяцы сокращений зарплат и увольнений наносят ущерб и малым предприятиям, создавая порочный круг упадка. Суповые кухни продолжают работать, и везде, где есть суповая кухня, есть социалистический агитатор, проповедующий лучший мир."
SWE_black_monday_1: "Серые облака чёрного понедельника"
SWE_black_monday_1_desc: "Это потребовало времени и усилий, но зловещие тучи начинают рассеиваться. После восстановления мировой экономики, слияния конгломератов и реструктуризации компаний ситуация наконец-то начинает улучшаться, пусть и незначительно. Суповые кухни посещает меньше людей, чем в пик кризиса, потребительские расходы постепенно растут после того, как крупные работодатели снова начали нанимать сотрудников, но ситуация по-прежнему остается сложной. Города рано или поздно могут вернуться к уровню активности, который был до кризиса, но деревни и небольшие города по-прежнему страдают."
SWE_black_monday_2: "Рассеивающиеся облака чёрного понедельника"
SWE_black_monday_2_desc: "Графики показывают рост, линия идет вверх, ситуация улучшается... По крайней мере, по данным статистиков. Деревни по-прежнему бедны, бедняки злятся как никогда, и хотя сейчас работает больше заводов, чем в последние несколько недель, их деятельность часто затрудняется забастовками. Ситуация улучшается, но остается напряженной. Возможно, самой важной новостью последнего времени является то, что огромная государственная компания LKAB возобновила свою деятельность, добыча полезных ископаемых снова в повестке дня, и минералы вновь поставляются за границу."
SWE_black_monday_3: "Ясное небо после чёрного понедельника"
SWE_black_monday_3_desc: "Наконец-то все закончилось, во всяком случае, скоро закончится. После того как фабрики возобновили свою работу в полном объеме, а потребность в природных ресурсах растёт, даже деревни в самых отдаленных уголках Норрланда и Дальсланда вновь процветают. Однако напряженность остается. В то время как рабочие в городах борются за улучшение своих прав и зачастую за конец капиталистической системы в целом, те, кто живет в лесах и на полях, спорят о чем-то совершенно другом. Действительно, что, если вся эта катастрофа произошла из-за безбожия и пороков, а не из-за капризов маммоны?" 	

SWE_cutting_the_army: "Сокращение военных расходов"
SWE_cutting_the_army_desc: "Чтобы спасти нацию, гарант её безопасности должен столкнуться с метафорической пилой. Хотя генерал Олоф Торнелл поддержал этот план, молодые офицеры вокруг Хельге Юнга протестуют. В конце концов, в последний раз армия была сокращена до предела незадолго до Первой мировой войны..."
SWE_austerity_measures: "Дальнейшие меры жёсткой экономии"
SWE_austerity_measures_desc: "Трагическая правда заключается в том, что прихоти капитала затрагивают тех, кто имеет на него наименьшее влияние. Беднейшие слои шведского общества быстро беднеют, поскольку правительство пытается сократить все возможные расходы, приватизировать или просто закрыть несколько социальных программ предыдущего правительства, чтобы спасти нацию. Хотя правительство заявляет, что однажды восстановит сокращенные программы, суровость «черного понедельника» означает, что в ближайшее время это вряд ли произойдет..."

SWE_removing_statare: "Отмена Статаре"
SWE_removing_statare_desc: "В соответствии с соглашением между Шведским профсоюзом сельскохозяйственных рабочих и Ассоциацией лесоводов и землевладельцев, эпоха статаре наконец подходит к концу. В соответствии с требованием правительства, а также в связи с возмущением населения, ни один сельскохозяйственный рабочий или наемный работник больше не будет получать оплату не в твердой валюте, что фактически означает конец бедственного положения Статаре. Теперь, когда крестьяне наконец-то получают оплату наличными, их бродячий образ жизни быстро подходит к концу, поскольку они наконец-то могут приобрести собственное жилье, покупать себе еду и возделывать свою землю."

