EnhancedAIOptions.t: "Enhanced AI: Allow space marines?"
  
EnhancedAIOptions.SpaceMarines:0 "You have the option to allow the AI to field space marine divisions. Note that this will make the AI prioritize distributing its armor battalions across infantry divisions rather than concentrating them into dedicated tank divisions. Would you like to do so?\n\n§RWARNING: Enabling space marines will generate additional land xp overhead for the AI, hindering its ability to get doctrines and templates. To alleviate this, you should use the Division Templates Cost Less XP mod.§"

EnhancedAIOptions.1.Allow: "Yes!"

EnhancedAIOptions.1.Disallow: "No thanks."
