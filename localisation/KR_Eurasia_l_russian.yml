### Leaders loc ###
POLITICS_DMITRI_MIRSKY_DESC: "Дмитрий Петрович Святополк-Мирский. Красный принц. Родившись в семье министра внутренних дел Российской империи, Дмитрий Мирский был типичным отпрыском интеллигенции - он получил блестящее образование, интересовался поэзией и языками. Он сражался в армии Деникина в Гражданскую войну в России, а в 1922 году заинтересовался евразийством и стал одним из основателей Евразийской партии. Мирский был очень заинтригован победой синдикалистов во Франции и особенно интересовался новыми формами искусства, развивавшимися в социалистических странах. Его дальнейшая поддержка синдикалистских режимов на Западе только усилилась из-за неспособности режима Керенского повысить уровень жизни и справиться с экономической депрессией на его Родине. Более того, он разочаровался в евразийцах, которых считал защитниками правящего класса аристократии. К 1936 году Мирский стал убеждённым марксистом, хотя всё ещё оставался видным евразийцем, готовым осуществить резкий поворот влево, если представится возможность."
POLITICS_LEV_GUMILYOV_DESC: "Лев Гумилёв. Родившись в семье знаменитых поэтов, Николая Гумилёва и Анны Ахматовой, Лев был воспитан в манере типичной русской интеллигенции - интересующейся гуманитарными науками, языками и историей своей Родины. Он рано начал интересоваться политикой, и его особый интерес вызывало евразийство - то, что он считал научным подходом к истокам русского народа. В начале 1930-х годов Гумилёв предпринял около трёх геологических и этнографических экспедиций в Среднюю Азию и Монголию. К 1934 году он также вступил в Евразийскую партию, став лидером молодёжного движения партии - Союза Евразийской Молодёжи, или национал-максималистов. Гумилёв проявил себя как амбициозный и страстный лидер с репутацией блестящего историка и пионера евразийства. В 1936 году Юрий Шихматов является членом так называемого «Совета пяти» - совета высших лидеров евразийцев, среди которых Николай Трубецкой, Пётр Савицкий, Георгий Вернадский и Дмитрий Мирский. Имея в голове большие амбиции, Гумилёв планирует расширить свои полномочия как лидер молодёжного движения - даже если цена будет высокой."

### Foreign Policy ###
eurasiafor.50.t: "Великий Евразийский союз"
eurasiafor.50.d: "Правительство Евразии обратилось к нам с дружественным предложением - объединить наши две фракции в одну и объединить большую часть Евразии под единым знаменем Чингисхана. Хотя поначалу многим это может показаться безумием, евразийцы одобрили нашего великого лидера в качестве Сюзерена Монголии под протекторатом могучей Евразийской армии. Если мы не согласимся, отношения между нашими странами ухудшатся, что в конечном итоге может привести к войне."
eurasiafor.50.a: "Давайте объединим Евразию!"
eurasiafor.50.b: "Никаких союзов с варварами!"

eurasiafor.51.t: "[FROM.GetNameDefCap] согласился!"
eurasiafor.51.d: "Они согласились. Это всё, что нам нужно знать, поскольку знамя Единой Евразии поднято над Континентом."
eurasiafor.51.a: "О Боже! Идеальная сделка!"

eurasiafor.52.t: "[FROM.GetNameDefCap] отказывается!"
eurasiafor.52.d: "Трусливый Безумный Барон отверг наш союз. Похоже, он слишком безумен, чтобы мыслить рационально. За свои деяния он будет уничтожен позже."
eurasiafor.52.a: "Очень жаль его."

eurasiafor.53.t: "Судьба Безумного Барона"
eurasiafor.53.d: "Конечно, вместе с интеграцией Монголии непосредственно в Евразию возник вопрос, под чьим контролем останутся эти территории. С одной стороны, если мы арестуем барона Унгерна, мы нарушим соглашения, на основании которых существует его лен. В связи с этим мы можем оставить всё как есть и позволить барону делать всё, что он хочет, на этих территориях. С другой стороны, безумный барон может быть опасен. Под его контролем находится армия из тысяч отборных монгольских солдат, готовых убивать за своего лидера, если что-то пойдёт не так. Поэтому можно тихо устранить барона и назначить кого-то своего для руководства Монгольским автономным регионом."
eurasiafor.53.a: "Позволить безумцу править в его лене."
eurasiafor.53.b: "Заставить барона бесследно исчезнуть."

