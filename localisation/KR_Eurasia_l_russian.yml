RUS_orth_eur_enlightenment_modifier_idea: "Евразийское просвещение"
RUS_orth_eur_enlightenment_modifier_idea_desc: "Великое евразийское просвещение началось с создания специальных правительственных советов, которые должны заниматься неграмотностью среди населения, ассимилировать коренные меньшинства и продвигать евразийскую идеологию среди всех социальных слоев.\n§W--------------\nПрирост политической власти: [?RUS.RUS_orth_eur_enlightenment_political_power_factor|=%+0]\nСтабильность: [?RUS.RUS_orth_eur_enlightenment_stability|=%+2]\nПоддержка войны: [?RUS.RUS_orth_eur_enlightenment_war_support|=%+0]\nФабрики гражданского потребления: [?RUS.RUS_orth_eur_enlightenment_consumer_goods_factor|=%+]\nЛюдские ресурсы: [?RUS.RUS_orth_eur_enlightenment_conscription_factor|=%+]\nЗащита от изменения идеологии: [?RUS.RUS_orth_eur_enlightenment_ideology_drift_defense|=%+0]\nПодчинение для интеграции: [?RUS.rus_core_integration_cost_compliance|Y3]\nВремя интеграции: [?RUS.rus_core_integration_time_to_remove|Y0] дней"

RUS_orth_eur_cultural_revolution_decisions: "Великое евразийское просвещение"
RUS_orth_eur_cultural_revolution_decisions_desc: "Наше правительство наконец начало создавать настоящую §Cидеократию§! с помощью процесса «§Gвеликого евразийского просвещения§!»\n\nПросвещение - сложная, но необходимая программа, которую нам нужно завершить, чтобы уменьшить §Yвремя§! §Gинтеграции§! и §Gсреднее подчинение для интеграции§!.\n\nПоказатель §Cидеократии§! зависит от §Yассимиляции коренных меньшинств§!, §Mграмотности§! и §gпринятия евразийской идеологии§!.\n\n\nОбщий показатель §Cидеократии:§! [?RUS.rus_ideocracy|С2]\n\n§YАссимиляция коренных меньшинств:§! [?RUS.rus_assimiliation_of_native_minorities|Y2]\n§MГрамотность:§! [?RUS.rus_illiteracy|M2]\n§gПринятие евразийской идеологии:§! [?RUS.party_popularity@ruling_party|%g2]"

