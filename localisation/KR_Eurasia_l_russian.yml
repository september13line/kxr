RUS_EURASIAN_UNION_FOCUS: "Евразийское дерево фокусов"

RUS_Birth_Of_The_Eurasian_Union: "Рождение Евразийского союза"
RUS_Birth_Of_The_Eurasian_Union_desc: "Евразийский союз наконец создан. Рождённый в уме Трубецкого, теоретизированный Савицким и реализованный Евразийской партией. Россия уже никогда не будет прежней."

RUS_A_Split_In_The_Party: "Раскол в партии"
RUS_A_Split_In_The_Party_desc: "Даже Евразийская партия, казавшаяся такой единой и сильной, раздираема различными партийными фракциями. Мирский склоняется влево и даже очень влево - к социализму, а Шихматов сформировал национал-максималистскую фракцию, которая стремится найти третий путь модернизации Евразии."

RUS_Turn_The_Other_Cheek: "Подставить другую щеку"
RUS_Turn_The_Other_Cheek_desc: "Сначала были лишь жаркие дебаты, но теперь ситуация вышла из-под контроля, и в воздухе висит насилие. Однако мы не должны ввязываться в насилие. Как говорит Библия: подставь другую щеку."

RUS_Evil_Comes_From_Everywhereness: "Зло происходит от повсеместности"
RUS_Evil_Comes_From_Everywhereness_desc: "Теперь, когда ситуация становится жестокой и враждебной, мы не должны бояться или быть беззащитными. Зло происходит от зла - мы должны дать отпор."

RUS_Council_Of_Five: "Развязка"
RUS_Council_Of_Five_desc: "Пять ведущих евразийцев: Мирский, Сувчинский, Трубецкой, Савицкий и Шихматов наконец выяснят, кто способен управлять Евразийским союзом."

RUS_Left_Eurasianists: "Левые евразийцы"
RUS_Left_Eurasianists_desc: "Левые евразийцы под руководством Мирского стали ведущей фракцией в Евразийской партии."

RUS_Orthodox_Eurasianists: "Ортодоксальные евразийцы"
RUS_Orthodox_Eurasianists_desc: "Партия будет следовать доктрине ортодоксального евразийства Трубецкого."

RUS_Young_Eurasianists: "Национал-максималисты"
RUS_Young_Eurasianists_desc: "Национал-максималисты под руководством князя Юрия Ширинского-Шихматова стали ведущей фракцией в Евразийской партии. Стремясь построить коллективистское общество, но с огромным влиянием русского превосходства и национализма, национал-максималисты намерены вывести проект на новый уровень: панъевразийский."

RUS_The_Red_Prince: "Красный принц"
RUS_The_Red_Prince_desc: "Мирский, или Красный принц, как его теперь называют, - теперь лидер союза. Под его правлением Союз столкнётся с множеством перемен - и, возможно, родится новое общество."

RUS_Center_Left_Coalition: "Левоцентристская коалиция"
RUS_Center_Left_Coalition_desc: "Роман Якобсон всегда был идеологически ближе к ПЛЕ, чем к Трубецкому и Савицкому. Открытое привлечение его в нашу партию принесёт нам сторонников. Кроме того, он не так радикален, как левые эсеры."

RUS_Alliance_With_Left_SRs: "Союз с левыми эсерами"
RUS_Alliance_With_Left_SRs_desc: "Левые эсеры так же заинтересованы в народничестве, как и мы. С их помощью в правительстве мы скоро объединим всех евразийцев под знаменем истинной крестьянской и рабочей партии."

RUS_Eurasian_Soviets: "Евразийская советская система"
RUS_Eurasian_Soviets_desc: "С приходом к власти левых эсеров система советов должна быть значительно расширена. Наша истинная пролетарская свобода приведёт новые нации в Союз без мер жёсткой экономии."

RUS_Issue_Of_Ethnic_Councils: "Проблема этнических советов"
RUS_Issue_Of_Ethnic_Councils_desc: "Несмотря на интернационалистскую позицию Евразийского союза, мы не должны забывать, что этничность и национальность очень важны для самоопределения людей, и их идентичности как евразийцев может быть недостаточно. С другой стороны, это может усилить национализм и межэтническую напряжённость."

RUS_Eurasian_Popular_Front: "Евразийский народный фронт"
RUS_Eurasian_Popular_Front_desc: "Мы больше не будем править страной в одиночку. Все социалисты Евразии будут объединены в единый широкий народный фронт."

RUS_Struggle_With_Clericalism: "Борьба с клерикализмом"
RUS_Struggle_With_Clericalism_desc: "Русские - православные христиане, но клерикализм православного евразийства привёл нас к открытым конфликтам со многими этносами. Мы остановим буржуазную политику и сделаем так, чтобы Евразия была свободна от любых религиозных предрассудков."

RUS_Scythian_Reserve_of_Revolution: "Скифский резерв революции"
RUS_Scythian_Reserve_of_Revolution_desc: "Евразийский союз не остановится, пока весь мир не станет пролетарским и освобождённым. Наш народ, как сказал Якобсон, является Скифским резервом мировой революции - и именно евразийская нация освободит мир."

RUS_Panslavist_Internationalism: "Панславянский интернационализм"
RUS_Panslavist_Internationalism_desc: "Славянские народы - истинные воины пролетарского интернационализма. Веками угнетаемые тевтонами, монголами, англосаксами и другими, славянский пролетариат поднимется, чтобы освободить наш континент."

RUS_Panslavist: "Интегрировать панславизм"
RUS_Panslavist_desc: "С интеграцией офицеров, связанных с РОВС, в наше движение произошёл приток многих монархических активистов, связанных с реставрационистским делом. Хотя их цели могут не полностью совпадать с чистым идеалом Евразии, концепция бывшего Царства как защитника всех славянских народов более чем достойна того, чтобы быть включённой в нашу официальную доктрину."

RUS_Eurasian_Wide_Narodism: "Общеевразийское народничество"
RUS_Eurasian_Wide_Narodism_desc: "Принципы народничества, привнесённые в нас русской имперской интеллигенцией, должны стать ключевыми основами новой нации. Построенная на крестьянстве умом и решимостью высшего класса, наша новая евразийская нация будет процветать."

RUS_Ceaser_Of_October: "Цезарь Октября"
RUS_Ceaser_Of_October_desc: "Наш лидер должен стать Цезарем Октября. Великая Октябрьская социалистическая революция, часто неправильно понимаемая предателями и капиталистами как большевистский переворот, была первым проявлением истинной социалистической демократии. Помня принципы Ленина, Красный принц приведёт нас к будущему."

RUS_Brutus_Of_The_World_Bourgeousie: "Брут мировой буржуазии"
RUS_Brutus_Of_The_World_Bourgeousie_desc: "Навеки единые в дружбе и труде, евразийский пролетариат освободит Континент от капитализма. Буржуазия будет уничтожена."

RUS_Strengthen_The_Chairman: "Укрепить председателя"
RUS_Strengthen_The_Chairman_desc: "Председатель Евразийской партии будет править нашей страной. Он единственный, на кого мы можем положиться."

RUS_Avanguardist_Eurasian_Thought: "Авангардная евразийская мысль"
RUS_Avanguardist_Eurasian_Thought_desc: "Новое мышление Евразийской партии - революционный авангардный космополитизм. В отличие от идей Трубецкого, провозглашавшего аристократический православный национализм. Запад - препятствие для революции народов."

RUS_We_Are_Building_A_Better_Future: "Мы строим лучшее будущее"
RUS_We_Are_Building_A_Better_Future_desc: "Нас могут разорвать на части, разделить, наши мнения могут расходиться - но мы никогда не должны забывать нашу великую цель - мы строим лучшее будущее для человечества."

RUS_Proletkult: "Пролеткульт"
RUS_Proletkult_desc: "«Пролетарская культура», или Пролеткульт, - это новая организация, федерация местных культурных обществ и художников-авангардистов. Пролеткульт будет стремиться радикально изменить существующие художественные формы, создав новую, революционную рабочую эстетику. Новая культура будет направляться Пролеткультом."

RUS_Eurasianists_Bolsheviks: "Евразийский большевизм"
RUS_Eurasianists_Bolsheviks_desc: "В то время как мы проводили социалистическую политику в нашей стране, мы создали новую идеологию - евразийский большевизм. Он ориентирован не только на одну страну, как предсказывал РКП раньше - теперь идея евразийского большевизма и его успеха должна завоевать мир."

RUS_Spirit_Of_The_Revolution: "Дух революции"
RUS_Spirit_Of_The_Revolution_desc: "Революция, предпринятая Красным принцем, была сверху, но революционный дух нации присутствует. Мы должны использовать эту энергию для нашего государственного строительства в Союзе."

RUS_Sobornost: "Соборность"
RUS_Sobornost_desc: "Принцип соборности, означающий «духовную общность многих совместно живущих людей», является ключевым принципом нашей нации. Противопоставляя себя индивидуализму, коллективистская евразийская нация будет гораздо более стабильной и единой, чем Запад."
RUS_sobornost: "Соборность"

RUS_National_Maximalist_Church: "Национал-максималистская церковь"
RUS_National_Maximalist_Church_desc: "Создав новую церковь для евразийской нации, церковь, которая будет руководствоваться идеями национал-максимализма, наша нация войдёт в новую эпоху, новую эру своего этногенеза."

RUS_Socialism_With_Eurasianist_Characteristics: "Социализм с евразийской спецификой"
RUS_Socialism_With_Eurasianist_Characteristics_desc: "Идеи нашей партии переросли в нечто новое - евразийство, которое освободит крестьянство и пролетариат и создаст новый социальный класс. Превосходство нашей культуры, расширенное пролетарской идеологией, вместе дают 100% успеха."

RUS_Rule_Of_Intelligentsia: "Правление интеллигенции"
RUS_Rule_Of_Intelligentsia_desc: "Интеллигенция - это социальный класс, состоящий из различных интеллектуалов, музыкантов, художников, писателей и философов. Они - самые светлые умы в нашей стране, которые приведут нацию в будущее."

RUS_A_New_Social_Class: "Новый социальный класс"
RUS_A_New_Social_Class_desc: "Благодаря евразийцам и русской культуре возник новый социальный класс - интеллигенция. Правящий класс, вдохновлённый музыкой молодого Шостаковича и шедеврами Кандинского, поведёт новую нацию."

RUS_A_New_Eurasian_Nation: "Новая евразийская нация"
RUS_A_New_Eurasian_Nation_desc: "Мы больше не будем верить лжецам, которые говорят о европейской культуре и происхождении. Мы - евразийцы - уникальная нация, возникшая как сочетание европейских и азиатских культур."

RUS_Cultural_Revolution: "Просвещение"
RUS_Cultural_Revolution_desc: "Наше государственное строительство будет основано на Просвещении сверху. Евразийская партия заявила, что процесс Просвещения будет включать ликвидацию неграмотности, высокие образовательные стандарты и пропаганду евразийской идеологии."

RUS_A_New_Identity: "Новая идентичность"
RUS_A_New_Identity_desc: "Прежняя идентичность русских погибла. Отныне мы все будем называться евразийцами."

RUS_Respect_Classic_Eurasianism: "Уважать классическое евразийство"
RUS_Respect_Classic_Eurasianism_desc: "Сама идея евразийства, разработанная Трубецким, единственно возможна в современной реальности. Мы не должны склоняться ни к какой другой идеологии."

RUS_Power_Of_The_Orthodoxy: "Сила православия"
RUS_Power_Of_The_Orthodoxy_desc: "Москва - третий Рим, как гласит история. Мы - ведущая православная нация в мире: нашего Патриарха слушают от диаспоры в Харбине и на Аляске до наших братьев в Сербии."

RUS_Promote_Eurasianist_Ideology: "Продвигать евразийскую идеологию"
RUS_Promote_Eurasianist_Ideology_desc: "Идеология, воплощённая в жизнь триумвиратом Сувчинского, Трубецкого и Савицкого в 1920-х годах, теперь имеет много сторонников в Союзе. Но «евразизация» - долгий процесс, и требуются некоторые дополнительные усилия со стороны правительства."

RUS_The_Only_True_Eurasianists: "Единственные истинные евразийцы"
RUS_The_Only_True_Eurasianists_desc: "Соблазнившись ложными идеологиями социализма или национал-популизма, наша партия раскололась на фракции. Но мы знаем, что мы - единственные, кто остался на пути евразийства."

RUS_Eurasia_One_And_Indibisible: "Евразия единая и неделимая"
RUS_Eurasia_One_And_Indibisible_desc: "Всегда было правдой, что наша нация, жившая под гнётом веками, должна быть единой и сильной. Под руководством Евразийской партии мы представим эту возможность нашим гражданам."

RUS_Question_Of_The_Monarchy: "Вопрос о монархии?"
RUS_Question_Of_The_Monarchy_desc: "Когда-то мы были против этого - ни царь, ни диктатор не должны править нацией свободных людей - но кое-что изменилось. Разруха некогда самых развитых демократий мира учит нас уроку: простой человек верит в царя и его божественное руководство как в единственно истинное."

RUS_Tsar_Of_All_Eurasia: "Царь всея Евразии"
RUS_Tsar_Of_All_Eurasia_desc: "Царь вернулся. Ему был дарован трон новой нации, которая была построена для него, чтобы он правил. Границы Евразии не ограничены границами, проведёнными немцами в Минском договоре. Большинство населения мира будет управляться Евразийским царём."

RUS_Royal_Constitution: "Королевская конституция"
RUS_Royal_Constitution_desc: "С восстановлением монархии пришло время разработать новую королевскую конституцию - ту, которая провозгласит право Его Величества править Евразией."

RUS_Social_Hierarchy: "Социальная иерархия"
RUS_Social_Hierarchy_desc: "Liberté, égalité, fraternité. Что это, если не ложь - ибо мы знаем, что люди никогда не были равны, не равны сейчас и никогда не будут равны. Все великие империи всегда управлялись лучшими - интеллектуалами, дворянами, аристократами. Это люди, которые знают, что такое власть и как с ней обращаться."

RUS_The_Dictates_Of_Reason: "Власть разума"
RUS_The_Dictates_Of_Reason_desc: "Всё началось с Разума, когда великий лингвист и философ выдвинул идею. Идея превратилась в идеологию. А затем идеология превратилась в идеократию. Вся нация управляется не ложью Ленина, Сореля или кого-либо ещё, а научным знанием. Пусть Разум правит умами!"

RUS_Coalition_With_Solidarists: "Коалиция с солидаристами"
RUS_Coalition_With_Solidarists_desc: "Как национал-максималистам, нам суждено объединиться с молодым крылом партии НРПР: солидаристами. Великие идеи, которые они разделяют, - это ключ к тому, чтобы стать великой нацией."

RUS_Coalition_With_Nationalists: "Коалиция с савинковцами"
RUS_Coalition_With_Nationalists_desc: "Так называемые савинковцы - адепты идеологии Савинкова о национал-популизме - должны быть нашими союзниками и нашим электоратом."

RUS_The_New_Eurasian_Generation: "Новое евразийское поколение"
RUS_The_New_Eurasian_Generation_desc: "Следующее поколение, воспитанное нашими последователями, станет первым евразийским поколением. Мы молоды - наш лидер Шихматов в свои двадцать лет. Правление старых, бездумных автократов закончилось - пусть молодое поколение ведёт нацию."

RUS_Adopt_Savinkovs_Ideology: "Принять синкретизм Савинкова"
RUS_Adopt_Savinkovs_Ideology_desc: "Идеология Бориса Савинкова - смесь различных идеологий, повлиявших на него в течение всей его жизни, была очень популярна среди русского населения старой России. В то время как остатки старого режима исчезли, идея вечна. Мы должны принять эту идеологию."

RUS_Embrace_The_Krestostrel: "Принять Меч и Звезду"
RUS_Embrace_The_Krestostrel_desc: "Меч и Звезда Чингисхана - это символ нашей идеологии - Октаграмма. Она представляет собой максимальный евразийский простор - «Местопространство» нашей нации, которое мы будем защищать мечом. Октаграмма - это Звезда Чингисхана в Тёмном Небе Евразии. Под чёрно-жёлтым знаменем Меча и Звезды наша нация выстоит вечно и принесёт свободу и новое сознание народам Евразии."

RUS_The_New_Oprichnina: "Новая опричнина"
RUS_The_New_Oprichnina_desc: "Опричники были первой политической полицией в России, специальным корпусом телохранителей, созданным царём Иваном Грозным. Сама опричнина была отдельной территорией в пределах границ, на которую царь имел исключительную власть. Мы должны вернуть этот метод организации, но на этот раз территория должна находиться под прямым управлением Национал-максималистской партии. Специальные подразделения нео-опричников также будут сформированы."

RUS_Legacy_Of_Slavophilia: "Наследие славянофильства"
RUS_Legacy_Of_Slavophilia_desc: "Истоки нашей партии лежат в интеллектуальном движении славянофилов, которые стремились защитить русскую традицию и культуру от влияния Запада. Теперь, в XX веке, правильность этой идеологии подтверждается созданием Евразийского союза и популярностью нашего движения."

RUS_The_Dark_Sky_Of_Eurasia: "Тёмное Небо Евразии"
RUS_The_Dark_Sky_Of_Eurasia_desc: "Звезда Чингисхана в Тёмном Небе Евразии приведёт нас к будущим победам - против варваров Запада и предателей Востока. Новый Путь освещён, и мы знаем правду о нашем пути."

RUS_Right_Syndicalism_Eurasia: "Правый синдикализм победит"
RUS_Right_Syndicalism_Eurasia_desc: "Синдикализм был очернён грязными коммунарами, которые создали свои профсоюзные государства, построенные на лжи о равенстве, которого они никогда не достигнут. Правый синдикализм, с синдикатами и корпорациями, объединёнными вместе и сориентированными на нужды государства, - это истинная формула экономического успеха и счастья граждан."

RUS_The_Apocalyptic_Equestrian: "Всадники апокалипсиса"
RUS_The_Apocalyptic_Equestrian_desc: "Вот ты... стоишь здесь, боясь внезапности и неопределённости будущего, которое в твоих руках. Беги, пока Всадники Апокалипсиса не настигли тебя, но помни одно - это твоя судьба, если ты не защищён Могучим Союзом и нашей партией."

RUS_Organic_State: "Органическое государство"
RUS_Organic_State_desc: "Когда есть люди, которые работают на земле, где родились, когда они платят за свою жизнь, они хотят, чтобы к ним относились справедливо. Когда есть Государство, которое владеет этой землёй и платит этим людям справедливую сумму денег и даёт им необходимые общественные блага, должен быть только посредник, который обеспечит, чтобы всё работало хорошо. Сердце нашего великого организма - Евразийского государства - находится в людях, которые живут здесь, а Мозг - это наша партия."

RUS_Russian_Supremacy: "Под русским руководством"
RUS_Russian_Supremacy_desc: "Мы не лжём о наших намерениях. Русские являются большинством в государстве - мы - люди, которые всё создали. Мы не против существования меньшинств, но все они должны слушать нас и русских губернаторов, которых мы назначаем в наших подданных."

RUS_Nationalize_Everything: "Национализировать всё"
RUS_Nationalize_Everything_desc: "Всё, что может быть полезно для нашего государства, должно быть национализировано. Только под строгим и бюрократическим контролем правительства и Партии мы можем быть уверены, что всё идёт по плану."

RUS_Neoeurasianism: "Неоевразийство"
RUS_Neoeurasianism_desc: "За время нашего правления мы разработали новую идеологию неоевразийства. Русская нация будет направлять все малые и слабые нации и защищать их от империалистов. Третий путь здесь: и он принесён собратьями-национал-максималистами. Новая империя рождена: Империя, которая приведёт нас к светлому будущему."

RUS_Principles_Of_Geopolitics: "Принципы геополитики"
RUS_Principles_Of_Geopolitics_desc: "Геополитика - это изучение влияния географии Земли на политику и международные отношения. Наша уникальная география - барьер между Европой и Азией - развила нашу культуру и национальное самосознание. Мы будем использовать наше драгоценное географическое положение, чтобы наконец стать Великой Державой."

RUS_Six_Year_Plan: "Шестилетний план"
RUS_Six_Year_Plan_desc: "[GetSixYearPlanDesc]"
RUS_Six_Year_Plan_desc_totalist: "С приходом к власти левых евразийцев Центральный комитет партии издал указ о создании Госплана и запуске первого экономического плана. На его выполнение должно уйти шесть лет, он поможет нам индустриализировать страну и радикально улучшить нашу экономику."
RUS_Six_Year_Plan_desc_natpop: "С установлением нового правительства пришло время начать улучшать нашу экономику. Национал-максималисты, учитывая масштабы как НРПР, так и НСНП, ввели шестилетний экономический план. В то время как страна движется к государственному капитализму, наша экономика отходит от чистого рынка, и вводятся некоторые виды регулирования."

RUS_Eurasianist_Land_Reform: "Евразийская земельная реформа"
RUS_Eurasianist_Land_Reform_desc: "Земельный вопрос мучает Россию с самой революции. Теперь, когда евразийцы консолидировали власть, время компромиссов прошло. Крестьяне-фермеры будут служить Союзу, и взамен они будут справедливо вознаграждены - система для всей Евразии."

RUS_EUR_Mechanization_Of_Agriculture: "Механизация сельского хозяйства"
RUS_EUR_Mechanization_Of_Agriculture_desc: "Наше правительство понимает проблемы, с которыми в настоящее время сталкивается наша сельскохозяйственная промышленность. Быстрая механизация сельского хозяйства необходима для улучшения этой экономической отрасли, а также знаний крестьянства."

RUS_Electrification_Of_Eurasia: "Электрификация Евразии"
RUS_Electrification_Of_Eurasia_desc: "Правительство создало Государственный совет по электрификации Евразии, имея амбициозные планы по проведению электричества сначала во все сельские районы Сибири, а затем продолжить этот алгоритм на вновь завоёванных территориях."

RUS_Expand_The_Corporations: "Расширить корпорации"
RUS_Expand_The_Corporations_desc: "Мы должны вкладывать больше денег в крупные корпорации, чтобы обеспечить их лояльность нам. Помогая им расширять их государственно значимый бизнес, мы также обеспечиваем развитие нашей экономики."

RUS_EUR_Launch_Industrialization: "Запустить индустриализацию"
RUS_EUR_Launch_Industrialization_desc: "Первые попытки улучшить экономику были предприняты, и теперь она показывает устойчивый рост. Пришло время начать полномасштабную индустриализацию нашей Родины, чтобы конкурировать с иностранными державами и подготовиться к будущим войнам."

RUS_EUR_Labour_Collectives: "Трудовые коллективы"
RUS_EUR_Labour_Collectives_desc: "Создавая Трудовые коллективы, мы создадим кооперацию между рабочими, и наша производственная эффективность возрастёт."

RUS_Ensure_National_Defence: "Обеспечить национальную оборону"
RUS_Ensure_National_Defence_desc: "Наши возможности национальной обороны вызывают сомнения. Поэтому мы должны повысить эффективность строительства новых военных заводов, а также способствовать стандартизации производства нашего оружия и оборудования."

RUS_Build_Up_New_Capital: "Построить новую столицу"
RUS_Build_Up_New_Capital_desc: "Чтобы создать новую столицу в центре континента, нам потребуется много рабочей силы и ресурсов для быстрого превращения столицы в индустриальный город с доступным жильём и высоким уровнем доходов."

### New Focuses ###
RUS_Jakobsons_Socdem_Eurasia: "Поворот к социализму"
RUS_Jakobsons_Socdem_Eurasia_desc: "Новая Евразия, объединяющая веками угнетённые народы и классы, освободит их от колониального гнёта западных держав. Пусть её сыновья восстанут из пепла революции и вновь зажгут пламя прогресса."

RUS_Question_Of_The_Duma: "Вопрос о Думе"
RUS_Question_Of_The_Duma_desc: "Дума, несмотря на все её недостатки, может быть восстановлена и, что более важно, стать лучше при Евразийской партии."

RUS_Dominant_Party_Democracy: "Демократия с доминирующей партией"
RUS_Dominant_Party_Democracy_desc: "Евразийская партия будет направлять нашу нацию и будет самой могущественной партией в стране. Если мы не хотим, чтобы наша страна погибла."

RUS_Sovereign_Democracy: "Суверенная демократия"
RUS_Sovereign_Democracy_desc: "Концепция Суверенной демократии возвращает идею сильной партии и сильного руководства. Без какого-либо радикализма социализма и национализма Евразийская партия устоит."

RUS_Appeal_To_ROVS: "Призыв к РОВС"
RUS_Appeal_To_ROVS_desc: "РОВС станет главной опорой для евразийской армии, рождённой из принципов и тактики старой Русской Республиканской армии."

RUS_Development_OF_Ideocracy: "Развитие идеократии"
RUS_Development_OF_Ideocracy_desc: "С успешной пропагандой наших идей мы можем начать думать, что, по крайней мере, Евразийская идеократия начинает вовлекать в себя всё больше и больше людей. Наша идеология победит."

RUS_Conquer_The_Mestoprostranstvo: "Завоевать Местопространство"
RUS_Conquer_The_Mestoprostranstvo_desc: "Концепция «Местопространства», первоначально сформулированная Петром Савицким, - это идея «естественных границ Евразии», не географических, а скорее культурных. Пришло время нам восстать против угнетателей. Будущее в наших руках. Пусть позорный Минский договор сгорит в огне вместе с теми, кто добровольно согласился превратить нашу нацию в экзогенное оцепенение. Но пусть мир услышит - Медведь пробудился."

RUS_War_Plan_Yug: "План войны: Юг"
RUS_War_Plan_Yug_desc: "План войны «Юг», предложенный Генеральным штабом [ROOT.GetNameDefCap], рассматривает наше первоочередное расширение на земли к югу от нашего государства. Это включает возвращение исконно евразийских земель Дона-Кубани и Кавказа, а также Среднеазиатского региона. Более того, штаб требует дальнейшего расширения на Турцию, Персию и Ближний Восток, а также Индию."

RUS_Operation_Kavkaz: "Операция «Кавказ»"
RUS_Operation_Kavkaz_desc: "Операция «Кавказ» в первую очередь направлена на расширение нашей сферы влияния на Донско-Кубанский регион и кавказские государства. Предательские казаки и мелкие национальные государства, захватившие власть в этом регионе, представляют реальную угрозу для нашего существования, независимо от того, поддерживаются ли они немцами или османами."

RUS_Operation_Steppe: "Операция «Степь»"
RUS_Operation_Steppe_desc: "Операция «Степь» должна вернуть под нашу пятку Среднеазиатский регион и воюющие народы узбеков и казахов. Само существование этих государств опасно для стабильности в регионе, и Просвещение, принесённое нашим правительством и солдатами на эти территории, может привести к великой волне самосознания в этих государствах."

RUS_Turkish_Threat: "Операция «Царьград»"
RUS_Turkish_Threat_desc: "Хотя мифические времена завоевания Царьграда князем Олегом давно канули в историю, став чем-то вроде мифа, реальность, с которой мы сталкиваемся сегодня, такова. Больной человек Европы (и Азии), называемый Османской империей, является нашей величайшей угрозой на Ближнем Востоке. Мы должны завоевать проливы и город между Европой и Азией, который станет величайшим колониальным городом нашего государства."

RUS_Persian_Threat: "Операция «Тегеран»"
RUS_Persian_Threat_desc: "Персия была нашим жизненно важным торговым партнёром и союзником на протяжении веков, но с потерей Кавказа и Средней Азии наши отношения стали холоднее. Пришло время вернуть Персию в нашу сферу влияния."

RUS_Claim_Jerusalem: "Вернуть Иерусалим"
RUS_Claim_Jerusalem_desc: "Иерусалим - святое место для всех христиан мира. Наше государство, как лидер всех православных христиан, должно установить тесные отношения с городом Иерусалимом. Мы должны установить наш протекторат над этой территорией, чтобы ни одна другая нация или религия не держали Святой Город в своих руках."

RUS_War_Plan_Zapad: "План войны: Запад"
RUS_War_Plan_Zapad_desc: "План войны «Запад», предложенный Генеральным штабом [ROOT.GetNameDefCap], в первую очередь ориентирован на наше расширение на бывшие регионы Российской империи, такие как Украина, Беларусь, Финляндия и Польша. Однако, если возможно, следует применять ещё более агрессивные методы: сокрушить германского зверя."

RUS_Restore_1914_Borders: "Восстановить границы 1914 года"
RUS_Restore_1914_Borders_desc: "Евразийство рассматривает все бывшие российские территории на Западе, которые теперь известны как отколовшиеся марионеточные германские государства, как исконно евразийские. Мы должны вернуть эти земли Родине и установить нашу сильную власть на этих территориях."

RUS_Against_The_Varangians: "Против варягов"
RUS_Against_The_Varangians_desc: "Те народы, которые ранее назывались варягами, теперь правят в скандинавских землях. Хотя эти территории не считаются исконно евразийскими, мы должны установить над ними наш протекторат."

RUS_End_The_Reich: "Покончить с Рейхом"
RUS_End_The_Reich_desc: "Деспотичная Германская империя - наш главный соперник в Западном регионе. Порабощение славянских народов и наложение на них строгих ограничений было главной причиной для нас разорвать Минский договор. Пришло время покончить с германским господством в этом регионе."

RUS_Liberate_Slavs_In_Austria: "Освободить славян в Австрии"
RUS_Liberate_Slavs_In_Austria_desc: "Народы чехов, словаков, поляков, украинцев, сербов, словенцев, хорватов - все находятся под австрийской оккупацией. Несмотря на обещания Кайзера предоставить этим нациям больше автономии и свободы, они никогда не были по-настоящему независимыми. Пришло время сделать их независимыми и присоединиться к нашей свободной евразийской коалиции."

RUS_Liberate_The_Balkans: "Освободить Балканы"
RUS_Liberate_The_Balkans_desc: "Те, кто попал под иго германских королей в Греции, Болгарии и Румынии, должны быть освобождены."

RUS_To_The_Atlantic: "К Атлантике!"
RUS_To_The_Atlantic_desc: "Рейх теперь пал, открывая возможность для нас распространить наши протектораты до Атлантического океана."

RUS_EUR_The_Iron_Curtain: "Железный занавес"
RUS_EUR_The_Iron_Curtain_desc: "После окончательного падения Рейха нам угрожают социалистические враги на Западе. Железный занавес должен быть установлен между нами, чтобы мы укрепили наши границы."

RUS_War_Plan_Vostok: "План войны: Восток"
RUS_War_Plan_Vostok_desc: "Генеральный штаб предложил план войны «Восток», который является самым важным планом, с которым нам предстоит иметь дело. Это план возвращения к нашим истокам. Евразийская степь, лежащая на Востоке, - это сокровище для нашей нации, которое должно быть возвращено Родине и превращено в сердцевинные регионы нашей нации."

RUS_EUR_Deal_With_Transamur: "Операция «Адмирал»"
RUS_EUR_Deal_With_Transamur_desc: "Когда-то адмирал Колчак с помощью некоторых областников и казаков установил своё деспотическое правление над восточными территориями нашей нации. Поддерживаемый японцами, он сумел контролировать огромную территорию Забайкалья и Заамурья. Теперь пришло время вернуть эти земли Родине."

RUS_Reclaim_The_Ancestors: "Вернуть предков"
RUS_Reclaim_The_Ancestors_desc: "Хотя монголы не являются нашими прямыми предками, наша государственность многое заимствовала из их системы. Сейчас нация Монголии очень нестабильна, хотя и удерживает наши коренные провинции и часть Транссибирской магистрали, которые должны быть возвращены нам."

RUS_End_The_Japanese_Domain: "Покончить с японским господством"
RUS_End_The_Japanese_Domain_desc: "Японская империя доказала, что стала самой могущественной нацией на Дальнем Востоке, стремясь превратить весь Китай и Тихий океан в свою собственную сферу влияния. Мы не должны позволить им этого сделать, и нам придётся сражаться с ними либо на суше, либо на море."

RUS_Dominate_The_Pacific: "Доминировать в Тихом океане"
RUS_Dominate_The_Pacific_desc: "После падения Японии мы должны установить наши протектораты в Тихом океане, чтобы обеспечить наше присутствие и доминирующее положение в Азии."

RUS_EUR_Intervetion_In_China: "Операция «Желтороссия»"
RUS_EUR_Intervetion_In_China_desc: "Когда-то у нас были планы колонизировать материковый Китай, но план был отправлен в мусорную корзину. Теперь, когда наша страна стабильна и готова к бою, мы должны вмешаться в китайскую гражданскую смуту и восстановить наши интересы там, где это необходимо."

RUS_Invade_Afghanistan: "Вторгнуться в Афганистан"
RUS_Invade_Afghanistan_desc: "Афганистан открывает нам ворота в Индию - регион, богатый ресурсами и людьми, которые будут готовы сотрудничать с новой мировой сверхдержавой. Но прежде - нация Афганистана должна быть завоёвана."

RUS_EUR_Intervetion_In_India: "Интервенция в Индию"
RUS_EUR_Intervetion_In_India_desc: "Индия, как и Китай, разделена - и мы должны помочь одной из сторон победить, положив конец гражданской смуте и британскому присутствию в регионе."

RUS_Operation_Indokitai: "Операция «Индокитай»"
RUS_Operation_Indokitai_desc: "Индокитай - самый юго-восточный регион на Евразийском континенте, который слишком долго находился под оккупацией. Мы должны освободить тамошние нации и предложить им присоединиться к нашей сфере."

RUS_EUR_Bring_Back_Alaska: "Вернуть Аляску"
RUS_EUR_Bring_Back_Alaska_desc: "Когда-то проданная американцам, но теперь находящаяся в состоянии анархии, Аляска должна быть возвращена Родине, пока ещё есть шанс. Хотя это и не является нашей прямой сферой влияния, мы сможем ещё больше контролировать Тихий океан."





### Events ###
eurasia.1.t: "Рождение Евразийского союза"
eurasia.1.d: "Очередная сессия Думы подошла к концу. Депутаты возвращались по домам к своим семьям. Сегодня был действительно долгий день, полный работы и рутины.\n\nНо в Таврическом дворце горел свет в единственном окне. В комнате за длинным дубовым столом сидели пятеро мужчин в костюмах: Георгий Вернадский и Пётр Савицкий сидели рядом и перешёптывались. Напротив них сидел князь Мирский, задумчиво глядя на какие-то бумаги на столе. Рядом с ним молча сидел князь Ширинский-Шихматов. Во главе стола сидел князь Трубецкой - лидер Евразийской партии, премьер-министр.\n\nНаконец, последний сказал: «Пора начинать наше заседание...»"
eurasia.1.a: "Тихая ночь в Петрограде."

eurasia.100.t: "Флаг Евразийского союза"
eurasia.100.d: "После официального создания Евразийского союза встал вопрос о флаге, и было предложено два варианта.\nПервый вариант - синее знамя с красной полосой внизу, над ней белый круг с символом нашего Союза в середине.\nДругой вариант проще - синее поле с золотым символом Евразийского союза в центре. Оба этих варианта имеют свои преимущества, но мы должны остановиться на одном."
eurasia.100.a: "Выбрать первый вариант, он лучше выглядит."
eurasia.100.b: "Второй вариант проще и выглядит привлекательнее."

eurasia.2.t: "Возможность?"
eurasia.2.d: "Князь Шихматов внезапно прервал князя Трубецкого.\n«Мы не должны упускать шанс. Будущее в наших руках», - заявил он.\n«Успокойтесь, Юрий», - нервно сказал князь Трубецкой. Ротмистр, сидевший напротив него, был обузой для большинства присутствующих.\nЕго не считали истинным евразийцем, несмотря на то, что он был одним из лидеров. Его всегда считали аутсайдером - человеком со странной репутацией и биографией. Его отец был камергером Высочайшего двора, действительным статским советником, обер-прокурором Святейшего Синода, сенатором, членом Государственного совета, участником монархического движения в России. Неудивительно, что его сын имел такие большие амбиции.\n\n«Возможно, Юрий прав», - прервал молчание Савицкий. - «Когда наши принципы воплотятся в жизнь, а Дума и Сенат будут полностью поддерживать нас, у нас будут развязаны руки».\n\n«Неужели вы не понимаете, Пётр!» - воскликнул Трубецкой. - «Вы говорите об опасных вещах. Общественность не поймёт. Оппозиция не поймёт. Более того, оппозиция не примет этого».\n\n«Кому какое дело, Николай Сергеевич? Неужели вы думаете, что армия не поддержит нас? Все эти монархисты, консерваторы - они поддержат всё, что мы делаем, если это направлено против социалистов»."
eurasia.2.a: "Что-то назревает..."

eurasia.3.t: "Поворотный момент"
eurasia.3.d: "«Довольно!» - Шихматов вылетел из комнаты, оставив остальных в тишине.\n«Его амбиции вышли из-под контроля», - произнёс Мирский первое слово на заседании. - «Не злитесь. Вы помните, кем был его отец? Его организация маргинальна и не имеет никакой поддержки. Поэтому он и находится среди евразийцев. Мы не должны придавать большого значения его словам».\n\n«Я тоже ухожу», - пробормотал Мирский.\nТрое друзей, трое основателей евразийской идеологии остались одни."
eurasia.3.a: "Пойдёмте домой."

eurasia.4.t: "Тёмная лошадка"
eurasia.4.d: "«Я слушаю».\nБорис Савинков сидел, скрестив ноги, в своём кресле. Трудно было сказать, проявляет ли он искренний интерес к мольбе Шихматова или просто притворяется.\n«Борис Викторович, я здесь, чтобы попросить вашей поддержки. Поддержки военизированных формирований, а также, возможно, некоторого финансирования».\n«Так почему я должен быть заинтересован?» - спокойно ответил Савинков.\n«Мы боремся за будущее нашей Родины, Борис Викторович. Нам нужна эта победа. При поддержке НРПР я могу рассчитывать, что Совет прислушается. Они должны прислушаться».\n\n«Перестаньте, Юрий Алексеевич. Мы оба знаем, что это неправда. Вами движет желание обладать властью. Огромной властью. Неужели вы думаете, что я не прав?»\n\nШихматов молча постоял минуту. Он страстно верил в свои собственные идеалы, его желание создать истинно православную Евразию было так же велико, как и его желание обладать какой-либо властью. Минута прошла. Шихматов посмотрел на Вождя; его лицо было без всяких эмоций, с поджатыми губами и прищуренными глазами.\n«Итак, могу ли я рассчитывать на вашу поддержку?»\n\nСавинков ответил ледяным взглядом..."
eurasia.4.a: "«У нас общие цели»."
eurasia.4.c: "«Я ничего не могу обещать»."

eurasia.5.t: "Совет трёх"
eurasia.5.d: "В Петрограде было тихое, но дождливое утро. Савицкий, Трубецкой и Вернадский сидели на террасе, пили кофе и вспоминали предыдущую ночь.\n\n«Думаешь, Шихматов предпримет какие-то действия?» - спросил Трубецкой.\n\n«Друг мой, ты слишком переживаешь из-за этого чудака», - ответил Савицкий. - «Он никто. У него нет поддержки, и мы - единственные, на кого он может положиться. Без нас он быстро потеряет всю оставшуюся поддержку среди евразийцев».\n\n«Возможно, ты прав. Но я не могу перестать думать о его словах. Великая Евразия. Революция. Ради чего была наша политическая борьба? Мы должны быть интеллектуалами, новыми философами, основателями новой политической мысли, а не радикалами или экстремистами».\n\n«Но мы не можем быть просто горсткой сенаторов, как в старые времена, не так ли, Николай?..»"
eurasia.5.a: "Может, лучше обсудить Мирского?'"

eurasia.6.t: "Красный принц"
eurasia.6.d: "«Говорят, у Мирского в последнее время появились социалистические настроения», - утверждал Савицкий.\n\n«Это могут быть просто слухи, Пётр. Мы знаем его давно - он не такой».\n\n«Я понимаю твой скептицизм, Николай. Но его дружба с Сергеем Эфроном и Львом Карсавиным...»\n\n«Ладно, Пётр».\n\nТрубецкой задумчиво смотрел на панораму реки Невы. Он тоже испытывал некоторые опасения по поводу Мирского. В последнее время он был слишком неразговорчив и меланхоличен. Возможно, слухи верны, но это означает, что нужно предпринять какие-то действия. Трубецкой продолжил:"
eurasia.6.b: "«Мы должны шпионить за ним»."
eurasia.6.c: "«Мы должны оставить его в покое»."

eurasia.7.t: "Дорогой друг"
eurasia.7.d: "Я пишу тебе в то время, которое, как ты знаешь, является крайне нестабильным. В партии происходят некоторые движения. Шихматов думает о перевороте и установлении автократического правления партии. Триумвират держит уши и глаза открытыми. Нам будет трудно что-либо сделать, если только не представится шанс. Твоя помощь... её, я полагаю, недостаточно. У нас нет средств защитить себя. Я собираюсь связаться с кем-нибудь в России.\n\nБерегись, они могут шпионить за нами. Личные встречи теперь слишком опасны. Поэтому я и пишу тебе. Жду твоего ответа."
eurasia.7.a: "Искренне твой, Д.П. Красный принц"

eurasia.8.t: "Товарищ Вольский"
eurasia.8.d: "«Я рад это слышать от тебя, Дмитрий», - улыбнулся Вольский. Бывший лидер КОМУЧа, казалось, чувствовал себя довольно радостно, когда Мирский попросил его поддержки. Поскольку ПСР была ведущей политической идеологией народничества, идеи Мирского довольно точно соответствовали взглядам Вольского. Сама идея поистине народнической России рассматривалась старым лидером партии как лекарство. Крестьянство, которое наконец займёт заслуженное место в обществе. Вольский добавил:"
eurasia.8.a: "«Но как насчёт Спиридоновой?'"

eurasia.9.t: "Лёд треснул"
eurasia.9.d: "Все пятеро сидели в тишине. Раскол стал для них слишком очевиден, но, возможно, никто не осознавал истинных масштабов трагедии. По крайней мере, Трубецкой ничего не мог поделать с расколом. Основателям новой идеологии, нового мирового порядка ничего не оставалось, кроме как принять текущее положение дел.\n\nБудет борьба. Вечная борьба за власть. Евразийство, безусловно, оказалось на распутье между национализмом и космополитизмом, но кто мог представить это в те дни? Другие подпали под неконтролируемое влияние социализма. Если они вообще понимают, что дало им православное евразийство, если они не недооценивают идеократию, которую мы создали. Возможно, всё было напрасно."
eurasia.9.a: "Мы должны открыто объявить о расколе партии."
eurasia.9.b: "Нам лучше не показывать свою уязвимость."

eurasia.10.t: "Раскол партии"
eurasia.10.d: "«Евразийская партия наконец поставила точку в слухах о расколе в партии» - так гласил заголовок свежей газеты, которую держал в руках Трубецкой. Возможно, открытое объявление о расколе на заседании Думы принесло ещё больше беспокойства и проблем. Теперь авторитет партии подорван. Это может навредить и будущим выборам. Но, с другой стороны, как размышлял Трубецкой, раскол открывает новые возможности - новую политическую борьбу для православных евразийцев, которая должна показать стране, что они всё ещё сильны и готовы бороться."
eurasia.10.a: "Нам нужен план."

eurasia.11.t: "Объявлен съезд Евразийской партии"
eurasia.11.d: "Трубецкой объявил внеочередной партийный съезд, который, по его мнению, станет поворотным моментом в будущем Евразийской партии. На съезде делегаты от ПЛЕ под руководством Мирского; национал-максималисты под руководством Шихматова; и он сам в сопровождении Савицкого и Вернадского представят новую партийную программу для остальных членов Евразийской партии. После этого будет принято демократическое решение: назначено новое партийное руководство и принята новая партийная программа."
eurasia.11.a: "Демократия всегда победит."

eurasia.12.t: "Заставить замолчать оппозицию"
eurasia.12.d: "Даже если раскол партии был секретом, всё больше и больше людей становятся хранителями этого секрета. Газеты пишут о расколе в правящей партии, ссылаясь на «информацию из инсайдерских источников».\n\nНо теперь пришло время действовать. Оппозиция «Генеральной линии партии» должна быть заставлена замолчать. Ни Мирский, ни Шихматов не имеют такого влияния, как мы. Мы должны использовать любой шанс, чтобы пресечь нарушения и подавить в зародыше все попытки свергнуть нынешнее партийное руководство."
eurasia.12.b: "Сосредоточиться на национал-максималистах."
eurasia.12.a: "Сосредоточиться на левых евразийцах."

eurasia.13.t: "Доктрина единой идеологии"
eurasia.13.d: "Один из лидеров Евразийской партии, Георгий Вернадский, произнёс речь на партийном съезде о единстве и единой идеологической повестке, обязательной для всех делегатов партии.\n\nВ этом акте авторитарных тенденций внутри Партии руководство пытается заставить замолчать внутреннюю оппозицию основным направлениям политики евразийцев. С расколом партии на левых, центристов и правых этот акт был воспринят как намеренная необходимость. Пытаясь заставить оппозицию замолчать, Вернадский пытается восстановить порядок в партии, что он называет «Положением конца вечным праздным дискуссиям о партийной программе и подавлением дестабилизирующих элементов, вызывающих раскол внутри партии»."
eurasia.13.a: "Будем надеяться, это поможет."

eurasia.14.t: "Шихматов и Мирский критикуют Доктрину"
eurasia.14.d: "Недавняя доктрина, принятая на партийном съезде, вызвала большое недовольство среди делегатов партии, особенно среди левых и правых. Хотя Доктрина, безусловно, подорвала позиции «дестабилизирующих элементов», они становятся готовыми действовать более активно.\n\nДаже если левая и правая оппозиция всё ещё слишком слабы, чтобы заявить о своём выходе из партии, а списки их сторонников слишком малы, критики говорят, что Доктрина единой идеологии могла вызвать даже больший раскол, чем тот, который она изначально планировала подавить."
eurasia.14.a: "Лучше для всех нас."

eurasia.15.t: "Союз национал-максималистов"
eurasia.15.d: "Прошедшая неделя была нелегка для Юрия. Ему пришлось решать серьёзные проблемы, возможно, самые сложные в его жизни. Это был трудный выбор, который он должен был сделать. Его несогласие с традиционной евразийской доктриной и текущей партийной политикой побудило его принять решение покинуть партию вместе со своими сторонниками.\n\nС уходом Шихматова из Евразийской партии и воссозданием Союза Российских Национал-Максималистов он окончательно и навсегда разорвал свои связи с другими членами Евразийской партии. Но решение было принято. Либо он, либо они. Власть или подавление. Свобода или тюрьма. Что ему делать дальше? У него был план. Если спор нельзя решить миром и словами, он будет решён войной и оружием."
eurasia.15.a: "Борьба за власть начинается."

eurasia.16.t: "Партия левых евразийцев"
eurasia.16.d: "Мирский твёрдо стоял на ногах. Он стоял перед своими сторонниками. Только что закончился Первый съезд ПЛЕ, Партии левых евразийцев. Были определены политическая программа, состав Центрального комитета. После ухода Шихматова и создания СРНМ ему ничего не оставалось, кроме как провозгласить свою собственную политическую силу. Новая партия была поддержана некоторыми социалистическими партиями, и говорят, что даже левые эсеры установили тесные связи с новой партией."
eurasia.16.a: "Социалистические евразийцы?"

eurasia.17.t: "Левая пропаганда"
eurasia.17.d: "С созданием Партии левых евразийцев идеи социализма и общеевразийского народничества распространились по всей стране, и, самое главное, среди делегатов Евразийской партии. Социалистические идеалы становятся всё более привлекательными благодаря пропаганде в средствах массовой информации. Не имея возможности заставить оппозицию замолчать, мы должны, следовательно, активизировать наши усилия по продвижению православного евразийства."
eurasia.17.a: "Истина в православном евразийстве."

eurasia.18.t: "Правые объединяются"
eurasia.18.d: "Возможно, харизма лидера правых евразийцев сыграла решающую роль в продвижении идеологии партии. Более того, при поддержке НРПР влияние национал-максималистов распространяется быстрее. Мы должны что-то сделать, чтобы убедить делегатов Съезда держаться подальше от радикализма и поддержать нас."
eurasia.18.a: "Шихматов становится всё более претенциозным."

eurasia.19.t: "Съезд Евразийской партии начинается..."
eurasia.19.d: "«Уважаемые члены Съезда, пора начинать наше заседание. Большинство из вас понимает, почему этот Съезд необходим. В партии существует серьёзный раскол, более того, раскол не может быть разрешён созданием сильной коалиции, не уязвимой для внешних врагов и внутренних идеологических разногласий...»\n\nТрубецкой остановился. Он не споткнулся о слова, он просто не знал, что сказать дальше. Эта минутная пауза раскрыла истинные эмоции лидера партии - его лицо выражало печаль. Этот Съезд, который войдёт в историю в будущем, собирается положить конец той Евразийской партии, которую он знал. Партии, возникшей из идеи, что Россия может быть сильной - что она должна быть сильной. Уникальная культурная и политическая среда, невиданный героизм русского народа и возрождённое славянофильство в противовес предыдущему правительству, угождавшему Кайзеру."
eurasia.19.a: "Вы в порядке, мистер Трубецкой?"

eurasia.20.t: "Интерлюдия"
eurasia.20.d: "«Мы собрались здесь сегодня, чтобы избрать новое руководство партии», - продолжил Трубецкой.\n\n«Будучи полностью верными идеалам евразийской демократии, единственное решение кризиса в партии, которое я вижу, - это выборы. На текущем заседании мы собираемся заслушать делегатов от партийных фракций.\n\nЯ представлю выступающих. Князь Дмитрий Петрович Мирский выступит от лево-евразийской фракции. Юрий Алексеевич Шихматов представит политическую программу, предложенную национал-максималистами. От лица нынешнего руководства выступит господин Вернадский.\n\nСпасибо за внимание»."
eurasia.20.a: "Давайте продолжим."

eurasia.21.t: "Красный принц"
eurasia.21.d: "«Уважаемые члены Съезда, с благодарностью к господину Трубецкому, я могу продолжить повестку дня заседания. Я уважаю решение партийного руководства предоставить мне слово. От имени русского народа, крестьян и рабочих Евразийского союза я представлю новую партийную программу, разработанную ведущими специалистами в экономической и политической сферах. Основываясь на теоретических положениях, разработанных мной лично, Союз должен черпать свою силу в большинстве своего населения. Полностью разрушая основы нашего общества - русский народ, мы рискуем снова попасть под влияние Запада. Порабощённые Кайзером, отравленные несчастьями испорченного западного капитализма, нашей нации не хватало единства и силы для достижения своих целей. Передав власть крестьянам и рабочим, Союз просуществует вечно.\n\nГрядёт новая эра. Прусский орёл умирает от мечей и факелов интернационального пролетариата. Я осмелюсь заверить вас, уважаемые члены Съезда, что будущее в наших руках. В руках сильной Евразии, движимой идеями народничества и социализма...»"
eurasia.21.a: "Кажется, он льстит своему знанию."

eurasia.22.t: "Ротмистр"
eurasia.22.d: "Финал речи Мирского сопровождался неприкрытой враждебностью и общим недовольством членов Съезда, особенно национал-максималистов. Его поддержала группа его сторонников, которые аплодировали. Презентация так называемого Красного принца была окончена.\n\nЮрий Шихматов, стоя перед Съездом, начал свою речь.\n\n«Уважаемые члены Съезда, я рад, что национал-максималистам предоставили слово после этого неподобающего выступления левой делегации левых евразийцев. Национал-максималисты решительно протестуют против предложений господина Мирского превратить наш великий Союз в оплот интернационального социализма. Я хочу подчеркнуть решимость, с которой Мирский изложил свои лженаучные представления о русском народе и, что самое важное, о евразийской нации.\n\nНационал-максималисты глубоко разочарованы решением господина Трубецкого предоставить возможность выступить на Съезде этой абсолютно антиевразийской интернационалистской оппозиционной группе...»\n\nШихматов продолжил свою пламенную речь о бесконечном позоре левого евразийства и дряблости нынешнего евразийского руководства и так далее. Трубецкой не слушал. Он был погружён в размышления о принятом им решении. Правильно ли было предоставлять слово всем этим невеждам? Он чувствовал ответственность перед Съездом за то, что только что сделал. Возможно, было бы лучше заставить оппозицию замолчать и способствовать единству партии? Кто знает?\n\n«Господин Вернадский, прежде чем вы выступите...»"
eurasia.22.a: "Убедите членов Съезда, что они ошибаются...'"

eurasia.23.t: "Отец-основатель"
eurasia.23.d: "«Уважаемые члены Съезда, я хотел бы начать свою речь со следующего - десять лет назад я, господин Трубецкой, господин Савицкий и господин Якобсон стали отцами-основателями новой революционной доктрины - единой идеи о том, что русская нация может быть сильной - может быть могущественной, может быть суверенной. Из этой единой идеи родилось новое движение. Движение, которое в конце концов победило. И я осмелюсь не согласиться с господином Шихматовым. Все мы глубоко разочарованы тем, что Съезду приходится тратить время на обсуждение идей, противоречащих основам евразийской идеологии. Ни левые евразийцы, ни национал-максималисты не являются евразийцами в каком-либо смысле этого слова. Наше движение антинационалистично и антиинтернационалистично. Мы здесь, чтобы создать новую национальную идентичность. Мы здесь, чтобы создать новую идеократию. Но мы здесь не для того, чтобы создавать что-то новое - мы здесь, чтобы рассказать правду о нас самих, о нашем происхождении и о нашем будущем. Создание Евразийского союза было задумано нами задолго до того, как мы впервые появились в Думе. Это естественный процесс, и мы здесь, чтобы гарантировать, что этот процесс будет стабильным и пройдёт беспрепятственно. Мы все выслушали выступления господина Мирского и господина Шихматова. Их идеи вполне ясны и могут найти отражение в предпочтениях членов Съезда и граждан России. К сожалению, они не имеют ничего общего с евразийством. И я призываю всех не делать ложного шага, превращая евразийство в бессмыслицу. Помните об этом, когда вы будете голосовать за новое руководство»."
eurasia.23.a: "Страстная речь!"

eurasia.24.t: "Начало голосования"
eurasia.24.d: "«Уважаемые члены Съезда, я рад, что мы выслушали всех делегатов и все мнения, представленные сегодня. Теперь я объявляю о начале голосования. Спасибо».\n\nТрубецкой, Савицкий и Вернадский удалились на закрытое заседание, оставив Съезд в состоянии бурного обсуждения. Решение должно было быть принято."
eurasia.24.a: "Начало новой эры."

eurasia.25.t: "Избрано новое партийное руководство"
eurasia.25.d.orth: "Пока Съезд голосовал за новое партийное руководство, Трубецкой и Вернадский обсуждали другой, последний, но не менее важный вопрос: что делать дальше? Будучи уверенными, что большинство членов Съезда всё ещё... в здравом уме, они размышляли о будущем в случае катастрофы. Что, если члены Съезда прислушаются к Мирскому или поверят в шизофрению Шихматова?\n\nПрошёл час, а лидеры евразийцев всё ещё не имели ни малейшего понятия. Они могли просто покинуть страну, чтобы спастись от возможных преследований. Они могли остаться и взять на себя руководство сопротивлением радикалам.\n\nНо внезапно их мысли были прерваны. Это был Роман Якобсон, близкий друг Трубецкого и Вернадского.\n\n«Голосование закончено».\n\nКогда Трубецкой и Вернадский вернулись в зал, были объявлены результаты. Съезд голосует за..."
eurasia.25.d.left: "Мирский не был уверен, станет ли его фракция победителем. Более того, он боялся преследований, которые последуют, если он проиграет. Очевидное исключение из партии, уход в подполье или переезд во Французскую Коммуну, или, возможно, арест и суд за измену. Он пытался убедить себя в обратном. У него было много сторонников среди социалистических групп в России. Съезд не полностью состоит из антисоциалистов. Он обратился к своему товарищу, Сергею Эфрону, чтобы выразить своё беспокойство, когда внезапно Трубецкой и Вернадский вернулись в зал. Результаты должны были быть объявлены. Съезд голосует за..."
eurasia.25.d.young: "Юрий Шихматов в сопровождении своих товарищей-национал-максималистов всегда был уверен в своих действиях. Он знал, что правда за ним. Более того, его поддерживали многие члены Съезда и ещё более влиятельные фигуры, такие как Савинков. Он терпеливо ждал результатов. Время шло, а голоса всё ещё подсчитывались. Он не думал о последствиях, если проиграет. Растворится ли движение национал-максималистов? Арестуют ли его самого? Он не сделал ничего плохого. Внезапно Трубецкой и Вернадский вернулись. Результаты должны были быть объявлены. Съезд голосует за..."
eurasia.25.a: "Сохранение нынешнего руководства."
eurasia.25.b: "Левые евразийцы."
eurasia.25.c: "Национал-максималисты."

eurasia.26.t: "Радикализация общества"
eurasia.26.d: "Общество становится всё более радикализированным, поскольку левые евразийцы и национал-максималисты получают поддержку среди членов Евразийской партии и населения. Князь Мирский, поддерживаемый различными социалистическими группами, и Шихматов, поддерживаемый НРПР, угрожают евразийской демократии. Мы должны действовать решительно сейчас, если хотим сохранить наше правление."
eurasia.26.a: "Настоящая битва начинается..."

eurasia.27.t: "Первые удары!"
eurasia.27.d: "Крупные промышленные центры страны сообщают о забастовках рабочих на заводах. Это можно с уверенностью признать действиями партии левых евразийцев, которые стремятся дестабилизировать общество и наше правительство. Мы можем игнорировать это или подавить протестующих."
eurasia.27.a: "Игнорировать их."
eurasia.27.b: "Раздавить забастовщиков!"

eurasia.28.t: "Националистические рейды!"
eurasia.28.d: "В небольших городах националисты, носящие эмблему партии национал-максималистов, инициируют рейды и собираются в вооружённые группы, дестабилизируя ситуацию в стране. Эти группы опасны, поскольку действуют радикально, и вмешательство полиции необходимо."
eurasia.28.a: "Игнорировать их."
eurasia.28.b: "Раздавить рейдеров!"

eurasia.29.t: "Рост активности военизированных формирований"
eurasia.29.d: "Мы получили информацию от служб безопасности о том, что в последнее время наблюдается значительный рост активности военизированных формирований. Все экстремисты принадлежат либо к левым евразийцам, либо к национал-максималистам. Они крадут оружие со складов армии или получают его через чёрный рынок, что можно объяснить беспрецедентным актом должностной коррупции. Более того, те, кто инициировал эти незаконные действия, несут ответственность, сходную с круговой порукой, поэтому расследование может ничего не показать, и виновные останутся на свободе."
eurasia.29.a: "Начать расследование."
eurasia.29.b: "Искоренить военизированные формирования."

eurasia.30.t: "Забастовка на Путиловском заводе"
eurasia.30.d: "Всё началось как всегда. Путиловский завод. Разъярённые рабочие с иррациональными требованиями. Крупная забастовка, направленная против главного промышленного завода страны, чтобы оказать давление на правительство.\n\nТрубецкой сидел в Таврическом дворце. Был созван чрезвычайный совет для решения текущей ситуации. Его сопровождало высшее партийное руководство, состоящее из Савицкого, Вернадского, Чхеидзе и Якобсона. Совет также пригласил верховного главнокомандующего, Лавра Корнилова, если поддержка армии для разгона забастовки станет необходимой.\n\n«Уважаемые члены Совета, мы здесь, чтобы обсудить забастовку на Путиловском заводе, которая в настоящее время наносит ущерб стабильности Союза и ведёт к дальнейшей радикализации общества. По сообщениям, забастовка организована партией левых евразийцев при поддержке социалистических партий, включая ПЛСР, НСП, РСДРП и ПСР. Шансы на успех [противодействия] спорны, но, возможно, высоки, если мы просто разгоним рабочих, возможно, при поддержке армейских офицеров и полиции. С другой стороны, в случае нашей неудачи забастовка может распространиться на другие заводы и города, что приведёт к экономическому коллапсу, последствия которого могут быть серьёзными для нашей стабильности. Есть какие-либо идеи или предложения, мои уважаемые коллеги?»\n\nБольшинство членов совета согласились с Трубецким, за исключением Савицкого, которого также поддержал Корнилов. Он настаивал на более радикальном способе подавления социалистической оппозиции - аресте лидеров и введении чрезвычайного положения до тех пор, пока социалистическое сопротивление не будет полностью искоренено."
eurasia.30.a: "Лучше не начинать репрессии..."
eurasia.30.b: "Чем сильнее мы ударим по социалистам - тем лучше."

eurasia.31.t: "Столкновения в Петрограде"
eurasia.31.d: "Прежде чем какое-либо решение было принято на совете, забастовка на Путиловском заводе перекинулась, поскольку завод был «посещён» военизированными формированиями национал-максималистов. Забастовка переросла в вооружённые столкновения между рабочими и военизированными формированиями; последние новости сообщают о пятерых погибших. Ситуация вышла из-под контроля, и теперь национал-максималисты также виноваты."
eurasia.31.a: "Арестовать Шихматова и позволить армии разогнать столкновения."

eurasia.32.t: "Развязка"
eurasia.32.d.left: "Столкновения в Петрограде всё изменили. Они изменили недавно созданный Евразийский союз в ходе внезапной, но безжалостной, беспорядочной резни, за которой последовал переворот. Рабочих Путиловского завода вскоре поддержали социалистические военизированные формирования левых евразийцев, которые вскоре прибыли и вступили в бой с национал-максималистами. Были ли стороны равны по силе, левые евразийцы в сопровождении забастовщиков одолели националистов. Прибывшая полиция и армия ничего не могли поделать, так как их сил было недостаточно.\n\nВскоре после того, как национал-максималисты были разбиты, некоторые из них убиты или сбежали, радикалы попытались захватить Таврический дворец, где заседал чрезвычайный совет. Почти в то же время Шихматов был арестован по мандату совета, что привело к окончательному поражению движения национал-максималистов сегодня.\n\nТаврический дворец вскоре был захвачен протестующими, которых возглавляли князь Мирский, Ширинский-Шихматов и военизированные формирования под руководством Сергея Эфрона. Совет вскоре был арестован и задержан. Красный принц объявил о переходе власти к рабочим и крестьянам партии левых евразийцев с формированием нового правительства."
eurasia.32.d.orth: "Столкновения в Петрограде всё изменили. Они изменили недавно созданный Евразийский союз в ходе внезапной, но безжалостной, беспорядочной резни, за которой последовали аресты всех лидеров оппозиции. Рабочих Путиловского завода вскоре разогнали, а зачинщиков арестовали. Военизированные формирования национал-максималистов также сбежали или были задержаны полицией и армией. Юрию Шихматову также удалось уйти от правосудия, и никто не раскрывает его текущее местонахождение. Кажется, что, хотя эти события укрепили правление Евразийской партии, они также сделали режим более автократичным. Мы не можем надеяться на свободы в будущем, и любая оппозиция, вероятно, будет преследоваться."
eurasia.32.d.young: "Столкновения в Петрограде всё изменили. Они изменили недавно созданный Евразийский союз в ходе внезапной, но безжалостной, беспорядочной резни, за которой последовал переворот. Военизированные формирования национал-максималистов вскоре были поддержаны Боевыми дружинами Савинкова, которые прибыли вскоре и вступили в бой с левыми евразийцами. Были ли стороны почти равны по силе, национал-максималисты в сопровождении Боевых дружин одолели националистов. Более того, Корнилов также способствовал их победе, продемонстрировав решительную поддержку националистов.\n\nВскоре после разгрома левых евразийцев национал-максималисты под руководством Юрия Шихматова попытались захватить Таврический дворец, где заседал чрезвычайный совет. Они могли бы проиграть эту битву, если бы Корнилов не был на их стороне. К большому удивлению евразийского руководства, он лично арестовал чрезвычайный совет. Юрий Шихматов провозгласил себя «первым среди евразийцев», что бы это ни значило, и объявил о переходе власти к партии национал-максималистов с формированием нового правительства."
eurasia.32.a: "Победа социалистов!"
eurasia.32.b: "Православные евразийцы сохранили своё руководство."
eurasia.32.c: "Победа национал-максималистов!"

eurasia.33.t: "Выбор новой столицы"
eurasia.33.d: "Наше правительство предложило перенести столицу Евразии ближе к азиатской части нашей страны. Эта столица будет не только безопаснее, будучи удалённой от границ, особенно с недружественным Западом. Были выбраны три города в качестве возможных столиц: Нижний Новгород, Екатеринбург и Новосибирск. Первый город расположен на высоком укреплённом холме со стратегическим положением на берегах рек Оки и Волги. Второй город - столица Уральского региона, крупный индустриальный центр. Третий вариант - перенести столицу так далеко, как Восточная Сибирь - в город Новосибирск, в основном сельскую местность, близкую к границам Монголии и Заамурья."
eurasia.33.a: "Нижний Новгород."
eurasia.33.b: "Екатеринбург."
eurasia.33.c: "Новосибирск."

eurasia.34.t: "Прибытие большевистских военачальников"
eurasia.34.d: "С установлением власти левых евразийцев по всей Евразии видные военачальники, герои Гражданской войны, прибыли на Родину, чтобы вести Евразийскую Красную армию в будущее. Их возвращение вызвало большое недовольство среди белых генералов, которые заявили правительству, что красные генералы должны быть немедленно арестованы.\n\nОднако при новом правительстве это невозможно. Похоже, что теперь белые генералы - это те, кто должен покинуть страну, отправившись в изгнание, опасаясь за свою жизнь."
eurasia.34.a: "Социалистические генералы вместо империалистов!"

### Orthodox Eurasianist Events ###
ortheurasia.1.t: "Новая эра"
ortheurasia.1.d: "Трубецкой вошёл в зал, быстро оглядел переполненную комнату и опустился на единственный свободный стул. На самом деле это был не случайный стул - это было кресло лидера Евразийской партии.\n\nПыль улеглась. Лидеры оппозиции во внутренних кругах были либо арестованы, либо бежали из страны. Правление евразийцев было обеспечено, и теперь можно было провести реальные реформы и преобразование российского общества. Трубецкой поприветствовал сторонников. Вся восхищённая публика смотрела на него. Трубецкой, хотя и был значительным политиком, который теперь управлял всей страной, никогда не обожал свою популярность. Он был скорее скромным человеком, который верил, что он в первую очередь учёный.\n\nТеперь у него было время оглядеть толпу. Это была интеллигенция в своём лучшем проявлении: бывшие и действующие сенаторы, профессиональные и известные учёные, включая Владимира Зворыкина, пионера телевидения, Игоря и Бориса Курчатовых, ведущих исследователей в области ядерной физики. Здесь также были различные музыканты, художники и композиторы, включая Игоря Стравинского, члена Евразийской партии, только что вернувшегося из Германии, и Дмитрия Шостаковича, восходящего композитора. Рюрик Ивнев и Анатолий Мариенгоф развлекали толпу, декламируя стихи. Банкет должен был начаться.\n\nБлиже к Трубецкому сидели его ближайшие соратники: Пётр Савицкий и Георгий Вернадский с отцом. Чуть поодаль стоял Константин Чхеидзе в сопровождении Феликса Юсупова, Дмитрия Романова и Василия Шульгина. Наконец, взгляд Трубецкого упал на знакомые лица Романа Якобсона и Петра Сувчинского, которые обсуждали какой-то вопрос."
ortheurasia.1.a: "Официальная церемония началась."

ortheurasia.2.t: "Дальнейшие планы"
ortheurasia.2.d: "Когда шум только что закончившейся вечеринки наконец стих, в комнате осталось пятеро. Мысли Трубецкого унеслись в недавнее прошлое. Это было внезапное озарение или воспоминание? Он вспомнил, как одной тихой ночью в Петрограде их тоже было пятеро, обсуждавших нечто более важное, чем новая симфония Шостаковича. Он попытался отогнать эту навязчивую мысль. По крайней мере, он взял себя в руки, два радикала исчезли из политики, и теперь его окружают единомышленники.\n\nВ действительности это было не так. Новый Совет пяти, в который теперь входили Якобсон и Чхеидзе, был гораздо более разнообразным клубом, чем мог себе представить Трубецкой. Но на этот раз им нужно было как-то сотрудничать - уступать и договариваться. Новые мятежи строго запрещены - и все они знали это.\n\nВсе они уважали авторитет и безусловное лидерство Трубецкого, но в то же время знали его слабости и скромный характер. Каждый из них хотел получить свой кусок пирога, и если они хотели, чтобы их инициативы были продвинуты, им приходилось чем-то жертвовать - возможно, общей стабильностью партии."
ortheurasia.2.a: "Сотрудничество - это ключ!"

ortheurasia.3.t: "Позиция интеллигенции"
ortheurasia.3.d: "«Если в начале века 90% населения страны были крестьянами, неграмотными и бедными, то Февральская революция 1917 года принесла права и власть беднейшим классам. Большевистская и эсеровская пропаганда, извратившая умы простых людей сказками Маркса и Энгельса, уничтожила легитимность социализма в мире, что привело к окончательному провалу большевистского заговора.\n\nНаша партия евразийцев воплотила в жизнь новую идеологию - идеологию свободных людей, желающих стать такими же образованными, как учёные, такими же богатыми, как аристократы, и стать гордыми носителями новой нации.\n\nДавайте сбросим оковы прошлого. Давайте прислушаемся к интеллектуалам - к тем, кто сейчас представляет всё лучшее, что есть у наших наций. Пусть политики ведут вас к светлому будущему. Пусть новый социальный класс эволюционирует - каждый русский должен принадлежать к интеллигенции: декламировать современную русскую поэзию, слушать процветающую русскую классическую музыку, помнить заветы прошлого, изучать историю нашей нации такой, какая она есть - от генезиса русской государственности на основе монгольского владычества...»"
ortheurasia.3.a: "...Давайте процветать вечно!'"

ortheurasia.4.t: "Кто мы?"
ortheurasia.4.d: "Ещё совсем недавно большинство российских граждан никогда не знали, что такое евразийство. Политическая программа евразийцев, обещавшая антигерманскую и антисиндикалистскую внешнюю политику, процветание всем социальным классам, усиление роли Православной церкви, не внесла ясности в умы простых граждан. Они просто знали, что евразийцы предлагают что-то новое и что-то, что сделает государство России защищённым и сильным.\n\nУ них не было ни времени, ни способности читать длинные и трудные для понимания статьи и книги Трубецкого, Савицкого и Вернадского. Будучи слишком эзотерическими и лженаучными для одних, идеи евразийцев в то же время казались разумными и дарили им почти осязаемое чувство единства с историей. В то время как евразийская программа Просвещения уже развёрнута полным ходом, многие граждане и дети в школах изучают истоки евразийства, и всё становится всё более ясным. Процесс nation-билдинга начался - процесс «евразизации» всего российского населения - если идеократия сработает, величайший эксперимент, который мы когда-либо видели, покажет результат."
ortheurasia.4.a: "Новая нация должна развиваться."

ortheurasia.5.t: "Земля"
ortheurasia.5.d: "Каждый из вас, граждан России, должен однажды спросить себя. Кто я? Почему я существую? И я верю, что большинству из вас будет трудно ответить на эти вопросы. Они сложны - и они довольно серьёзны.\nНо я дам вам ответ - вы евразиец. Вы живёте на стыке двух великих цивилизаций - Европейской и Азиатской. Наша великая страна - единственная когда-либо существовавшая страна, у которой был удивительный шанс наблюдать, как эти две цивилизации сливаются воедино.\n\nН. Трубецкой, 1928"
ortheurasia.5.a: "Мы особенные."

ortheurasia.6.t: "Культура"
ortheurasia.6.d: "Наше культурное своеобразие нельзя рассматривать как европейское или азиатское. Вместо этого оно евразийское - смесь, сплав. Мы должны обратиться к нашим предкам - детям Турана, детям Чингисхана, храбрым воинам, наездникам и искусным работникам. Мы никогда не должны забывать наше происхождение и наши корни. И мы всегда должны помнить, кто мы - евразийцы.\nП. Савицкий, 1926."
ortheurasia.6.a: "Солнце встаёт на Востоке."

ortheurasia.7.t: "Идея"
ortheurasia.7.d: "Я верю, вы правильно поняли мои уроки - принципы, которые вы всегда должны помнить и никогда не забывать. Помните своё происхождение - и помните, кто вы. Идея - это то, что управляет нацией, что заставляет людей сражаться на войнах за своё выживание. Идея, что они могут быть свободными. Что они могут жить, любить, жениться, зарабатывать на жизнь. Наша нация евразийцев должна быть основана на осознанной идее, а не на материалистических идеалах. И я хочу, чтобы каждый русский, украинец, бурят, татарин помнил эту идею. Мы евразийцы, и мы должны сохранить нашу уникальную культуру.\nГ. Вернадский, 1932"
ortheurasia.7.a: "В начале была Идея."

ortheurasia.8.t: "Пространство"
ortheurasia.8.d: "Уникальное сочетание ландшафтов, где родилась наша нация, называется Месторазвитие. Тундра Кольского полуострова, тайга Олонецкой губернии, леса и степи. Бескрайние морские просторы и безграничное небо. Наше Евразийское государство - живой организм, и ему свойственно расширяться. Пространство - это причина, по которой у нас есть люди, говорящие по-русски в Харбине и Владивостоке, в Бухаре и Баку, в Варшаве и Лемберге. Мы должны защищать наше пространство - и мы должны завоевать больше пространства.\nП. Савицкий, 1934"
ortheurasia.8.a: "Необъятные просторы Родины."

ortheurasia.9.t: "Легитимизация евразийства"
ortheurasia.9.d: "Евразийцы публично объявили о создании нового государства - Евразии, фактически новой религии евразийства, и начали процесс nation-билдинга. Но с самого основания Союза граждане Евразии всё ещё не имели формального удостоверения своей новой национальности и гражданства. Успешно интернализовав евразийство многими российскими гражданами, Партия решила принять новую систему удостоверений личности и широко расширить её, чтобы теперь каждый гражданин получил формальное удостоверение личности. Выдавая новые евразийские паспорта каждому гражданину, мы можем гарантировать, что они могут передвигаться по стране, защищённые законом и полицией, и к ним будут относиться как к равным. В новом евразийском паспорте будет указано гражданство '[ROOT.GetNameDefCap]' и национальность «Евразиец» для всех. У этнических меньшинств также будет национальность «Евразиец» в их паспортах, но с указанием их национальности в скобках."
ortheurasia.9.a: "Реформа обеспечит стабильность."

ortheurasia.10.t: "Отставка?"
ortheurasia.10.d: "Трубецкой, как всегда, был погружён в свои мысли, просматривая какие-то бумаги на столе. Он бегло прочитал доклад правительства о текущих проблемах и тяжело вздохнул. Он устал. Он посмотрел на фотографию в рамке, на которой были изображены он сам, Вернадский и Савицкий в начале их политической карьеры на первом съезде Евразийской партии. Это было почти 20 лет назад, когда он был моложе и амбициознее. Теперь, после многих месяцев на посту главы правительства, Трубецкой действительно устал. Более того, он не чувствовал себя таким амбициозным, как его коллеги по партии, которые были или притворялись такими же энергичными, как прежде.\n\nТрубецкой утратил свой незыблемый авторитет в Евразийской партии, но он сделал всё возможное, чтобы обеспечить нашу победу. Он выиграл выборы и всё это время был высококвалифицированным премьер-министром. Пришло время уйти в отставку и продолжать стабильно работать в Сенате, где его почти ничто не может беспокоить."
ortheurasia.10.a: "Трубецкой уходит в отставку с поста премьер-министра!"

ortheurasia.11.t: "Отставка?"
ortheurasia.11.d: "Трубецкой, как всегда, был погружён в свои мысли. Имея беспрецедентный авторитет в Сенате и своей партии, он думал о расширении своих полномочий ещё больше. Он думал о крупной реформе исполнительной ветви власти Евразийского союза, где он будет главой государства и будет формировать правительство так, как он хочет, вместо того чтобы это делал парламент.\n\nПозже на этой неделе он представил свой законопроект в Думу и Сенат, которые в большинстве своём поддержали его без поправок. Это знаменует начало новой эры в истории Евразийской партии и Евразийского союза."
ortheurasia.11.a: "Трубецкой становится Президентом Союза."

ortheurasia.12.t: "Предложение Чхеидзе"
ortheurasia.12.d: "Чхеидзе произнёс большую речь в Сенате, где теоретически обосновал, что восстановление монархии Романовых необходимо для достижения народной поддержки нашего правительства. Он утверждает, что с возвращением Царя наша легитимность будет обеспечена, и долгая традиция монархии продолжится.\n\nСенат, однако, был разделён по этому вопросу. Одни заявили, что мы не должны отходить от православной евразийской доктрины, но другие поверили в тезисы Чхеидзе. Поскольку авторитет Чхеидзе довольно высок, его предложение, вероятно, будет принято большинством Сената. Однако они также могут прислушаться к мнению Трубецкого и других отцов-основателей, которые вряд ли поддержат Чхеидзе."
ortheurasia.12.a: "Мы должны восстановить Царя."
ortheurasia.12.b: "Предложение отклонено."

ortheurasia.13.t: "Наследник престола"
ortheurasia.13.d: "Когда первые споры были наконец улажены, возникли другие. Кто будет Царём? После Революции преемники престола оспаривались членами Царской семьи. Мы можем помочь им наконец решить этот вопрос, просто выбрав предпочтительного наследника.\n\nПервый кандидат - самопровозглашённый Император Всероссийский в изгнании Кирилл Владимирович. Второй кандидат - Дмитрий Павлович, бывший спикер Сената, аристократ и один из лидеров партии ВНС. Третий кандидат, предложенный самим Чхеидзе, - молодой князь Андрей Александрович, старший племянник последнего Царя Николая II. Четвёртый вариант - выбрать Всеволода Иоанновича, молодого и популярного наследника."
ortheurasia.13.d_2: "Когда первые споры были наконец улажены, возникли другие. Кто будет Царём? После Революции преемники престола оспаривались членами Царской семьи. Мы можем помочь им наконец решить этот вопрос, просто выбрав предпочтительного наследника.\n\nПервый кандидат - самопровозглашённый Император Всероссийский в изгнании Владимир Кириллович. Второй кандидат - Дмитрий Павлович, бывший спикер Сената, аристократ и один из лидеров партии ВНС. Третий кандидат, предложенный самим Чхеидзе, - молодой князь Андрей Александрович, старший племянник последнего Царя Николая II. Четвёртый вариант - выбрать Всеволода Иоанновича, молодого и популярного наследника."
ortheurasia.13.a: "Кирилл Владимирович."
ortheurasia.13.f: "Владимир Кириллович."
ortheurasia.13.b: "Дмитрий Павлович."
ortheurasia.13.c: "Андрей Александрович."
ortheurasia.13.e: "Всеволод Иоаннович."

ortheurasia.14.t: "Царь всея Евразии"
ortheurasia.14.d: "Божией Милостью, Мы, [ROOT.GetLeader], Император и Самодержец всея Евразии, Московский, Киевский, Владимирский, Новгородский; Царь Казанский, Царь Астраханский, Царь Польский, Царь Сибирский, Царь Херсонеса Таврического, Царь Грузинский; Государь Псковский и Великий Князь Смоленский, Литовский, Волынский, Подольский, Финляндский; Князь Эстляндский, Лифляндский, Курляндский, Семигальский, Самогитский, Белостокский, Карельский, Тверской, Югорский, Пермский, Вятский, Болгарский и иных; Государь и Великий Князь Нижегородский, Черниговский, Рязанский, Полоцкий, Ростовский, Ярославский, Белозерский, Удорский, Обдорский, Кондийский, Витебский, Мстиславский и всех северных стран Повелитель; и Государь Иверских, Карталинских и Кабардинских земель и Армянских областей; наследственный Государь и Властитель Черкасских и Горских князей и иных; Государь Туркестанский; Наследник Норвежский; Герцог Шлезвиг-Гольштейнский, Стормарнский, Дитмаршенский и Ольденбургский и иных, и иных, и иных."
ortheurasia.14.a: "Слава Царю!"

ortheurasia.15.t: "Основа"
ortheurasia.15.d: "Разногласия между евразийцами всегда были камнем преткновения в единстве и стабильности партии. Сначала крупные разногласия между Мирским, Трубецким и Шихматовым привели к очевидному идеологическому конфликту. Будучи сторонниками классического евразийства, два политика пытались адаптировать идеологию для своих собственных целей и нужд. Такая оппозиция была подавлена. Многие из пионеров евразийства считают, что в партии не должно быть идеологического разнообразия, оставаясь как можно ближе к первоначальному курсу. Другие, в основном включая Якобсона и Чхеидзе, считают, что некоторое отклонение от «Генеральной линии партии» возможно и может быть даже полезным для государства и его граждан."
ortheurasia.15.a: "Мы должны уважать классическое евразийство."
ortheurasia.15.b: "Мы должны иметь некоторую свободу в партийной идеологии."

ortheurasia.16.t: "Массовое евразийство"
ortheurasia.16.d: "Евразийское движение выросло до самой распространённой идеологии, которую когда-либо видела наша страна. Оно распространилось на политику, историю, искусство, науку и образование и стало почти религией. Наша народная поддержка велика, оппозиции почти нет, поскольку Дума и Сенат полностью находятся под нашим влиянием. Вся подпольная антиевразийская деятельность подавлена, и люди в целом поддерживают наше правление. Однако всё ещё есть люди, которые угрожают нашей Родине из-за рубежа. После попытки захватить власть Мирский и Шихматов покинули страну, хотя всё ещё остаются активными. Поскольку реального подавления их сторонников никогда не проводилось, некоторые круги левых евразийцев и национал-максималистов всё ещё присутствуют в нашей стране.\n\nНаша разведка сообщила, что Мирский находится во Французской Коммуне вместе с левыми эсерами и другими антиевразийскими социалистическими группами. Шихматов находится где-то в Монголии или Китае и, как говорят, занимается полевыми исследованиями и воздерживается от политики. Мы не знаем, можно ли этому доверять, но мы знаем, что мы - Единственные истинные евразийцы, и любое инакомыслие должно преследоваться.\n\nСавицкий предложил финансировать секретные операции по поиску Мирского и Шихматова и тихо избавиться от них. Его поддержали Вернадский и некоторые другие члены партии, включая Трубецкого - хотя и неохотно. Судьба операции зависит от решения [ROOT.GetLeader]."
ortheurasia.16.a: "Они должны быть стёрты из истории."
ortheurasia.16.b: "Они не опасны для нашего режима."

ortheurasia.17.t: "Королевская конституция"
ortheurasia.17.d: "В связи с изменениями в политической системе Евразийского союза и восстановлением монархии правительство разработало новую королевскую конституцию, в которой Царь упоминается как глава государства. Хотя он почти не имеет власти и является скорее номинальной фигурой, Конституция повысит легитимность монарха. Согласно новой Конституции, полномочия Сената и правительства будут значительно расширены, в то время как Дума будет преобразована в совещательный орган."
ortheurasia.17.a: "Новая Конституция для Империи."

ortheurasia.18.t: "Возвращение Табели о рангах"
ortheurasia.18.d: "Табель о рангах был официальным списком должностей и чинов в армии, правительстве и при дворе Российской империи, впервые введённый Петром Великим. Табель о рангах был отменён большевиками вскоре после их переворота в 1917 году, но позже он так и не был восстановлен, оставив наши страны с «равными» всеми. С приходом к власти Евразийской партии необходимость Табели о рангах становится очевидной для лидеров партии, и пришло время восстановить её, чтобы формально закрепить социальную иерархию. Однако некоторые сенаторы против восстановления, утверждая, что это только углубит социальную напряжённость в стране."
ortheurasia.18.a: "Восстановить Табель о рангах."
ortheurasia.18.b: "Нам не нужен этот пережиток прошлого."

ortheurasia.19.t: "Дальний Восток согласен"
ortheurasia.19.d: "Дитерихс согласился на наше предложение, объединив Евразию под одной короной без единой капли пролитой крови. Чхеидзе и его собратья-монархисты объявили это абсолютной победой, и их влияние в Совете пяти в результате возросло. Хотя некоторые монархисты, включая самого Чхеидзе, слегка разочарованы тем, что их желаемый наследник престола не был приглашён стать Царём, многие согласны, что этот Царь с Востока будет хорошим правителем. По Божественному праву Кирилл Владимирович, Император Всероссийский, скоро прибудет на торжественную церемонию в [RUS.GetCapital] и снова поведёт наш народ к славе."
ortheurasia.19.a: "Боже, храни Царя!"

ortheurasia.20.t: "Возврат к думской демократии?"
ortheurasia.20.d: "Демократическая система, несмотря на предвзятость, является единственно правильной системой. Под руководством Евразийской партии Дума должна быть восстановлена, чтобы мы могли слышать голоса оппозиции и народа."
ortheurasia.20.a: "Мы должны восстановить полномочия Думы."
ortheurasia.20.b: "Предложение отклонено."

RUS_eurasian_duma: "Дума была восстановлена"

ortheurasia.21.t: "Единая партия для Евразии"
ortheurasia.21.d: "Большинство нынешних партий несовершенны. На самом деле, они были созданы давно, когда евразийская идеология существовала только на бумаге. Теперь кажется, что большинство идей старых партий устарели. Под руководством Евразийской партии они станут гораздо точнее и актуальнее."
ortheurasia.21.a: "Это всё ещё демократия, не так ли?"

ortheurasia.22.t: "«Суверенная демократия»"
ortheurasia.22.d: "Концепция «Суверенной демократии», теоретизированная Тырковой-Вильямс, предполагает, что Евразийская демократическая система с доминирующей партией продлит существование нашего государства, поскольку необходимые демократические процессы и принципы будут существовать, но в то же время предотвратит приход к власти радикальных партий путём контроля над парламентом демократическими средствами."
ortheurasia.22.a: "Уникальная Евразийская демократия!"

### Young Eurasianists Events ###
youngeurasia.1.t: "Меч и Звезда"
youngeurasia.1.d: "Шихматов сидел за столом - на том месте, где когда-то сидел Трубецкой и устроил жалкое представление. Теперь Шихматов был на коне. Вскоре после прихода к власти вся оппозиция была преследуема, за исключением лояльных движений, которые теперь стали частью правительства. Когда вся власть теперь оказалась в руках его партии, Шихматов планировал как можно скорее реализовать свои первые указы. Его правление было довольно консолидированным, но всё же требовало большего контроля над гражданами и подданными государства.\n\nШихматов смотрел в окно, где ярко светило солнце, что он счёл провидением. На улице маршировали его верные солдаты. Ведущий нёс чёрное знамя с мечом и звездой."
youngeurasia.1.a: "Меч и Звезда поведут нацию."

youngeurasia.2.t: "Новый порядок"
youngeurasia.2.d: "Пришло время реализовать нашу самую радикальную - и, следовательно, самую прогрессивную политику по консолидации нашей власти - формирование Новой опричнины. Некоторые территории получат особый статус и будут находиться под прямым контролем Национал-максималистской партии. Граждане на этих территориях в большинстве своём будут служить государству, специальные подразделения наших военизированных формирований будут реорганизованы в Нео-опричников, местные силы политической полиции, которые обеспечат отсутствие сопротивления нашей власти."
youngeurasia.2.a: "Возвращаемся ли мы в Тёмные века?"

youngeurasia.3.t: "Наследие Древней Руси"
youngeurasia.3.d: "Славянофильство было интеллектуальным движением в Императорской России, которое утверждало, что русские обладают уникальной культурой и обществом и что западное влияние было чуждым и беспокоящим для веками развивавшегося Русского государства. Основой идеологии славянофильства были Православная религия и Соборность - особый термин для органического единства, интеграции между людьми.\n\nПартия Трубецкого долгое время отказывалась от идеи славянофильства, утверждая, что их движение является Революционно-Традиционалистским и что славянофильство радикально отличалось от доктрин евразийства. Однако Национал-максималистская партия не откажется от славянофильства, а, напротив, аккумулирует его в Национал-максималистскую доктрину Евразийского государства. Несомненно, что у нашей страны есть свой путь, и прогрессивное национал-максималистское движение поведёт за собой.\n\nВ идеологии Молодого евразийства Православное христианство, русские как конституирующий элемент государства, Соборность и твёрдая, диктаторская власть Партии объединяются воедино, создавая сильнейшее государство, которое когда-либо видел мир."
youngeurasia.3.a: "Никогда не забывайте своё происхождение."

youngeurasia.4.t: "Плоды лояльности"
youngeurasia.4.d: "Это был он. Высокий стройный мужчина, стоявший в зале, одетый в военную форму и окружённый офицерами. Терновый венец, перекрещенный мечом, почти пылал на его груди. Это был Борис Викторович Савинков, окружённый верховным командованием своих военизированных Боевых дружин. Шихматов стоял прямо перед ним. Двое мужчин, один из которых был почти вдвое старше второго, пожали друг другу руки и ушли в комнату, оставив военизированные формирования одних.\n\n«Борис Викторович, с уважением и почётом, я рад объявить, что считаю ваше предложение о создании единого национал-максималистско-НРПР кабинета принятым. Суровая реальность жизни заставляет нас, чтобы выжить - и обеспечить выживание Государства, наши партии должны объединить усилия по восстановлению сильной и независимой Евразии. Я прислушался к вашим советам и, безусловно, назначу Александра и Эмму Дикгоф-Деренталь министрами иностранных дел и безопасности соответственно».\n\nМужчины снова пожали друг другу руки и вышли из комнаты, где Савинков вскоре ушёл в сопровождении своих верных офицеров.\n\nСавинков ушёл уже давно, но Шихматов всё ещё думал о встрече, третьей или четвёртой с момента их первой встречи. Они не слишком много говорили, не писали друг другу писем. Но Шихматов знал, что помощь Савинкова была исключительной для прихода национал-максималистов к власти."
youngeurasia.4.a: "Начинается новая история..."

youngeurasia.5.t: "Внедрение программы НРПР"
youngeurasia.5.d: "Программа НРПР Савинкова смешивает различные идеи, повлиявшие на него на протяжении всей его жизни, включая тоталитарное диктаторское правление, аграрную социалистически-революционную политику, православное христианство и концепцию палингенетического возрождения. Более или менее эти идеи соответствуют Национал-максималистской доктрине, при этом Новая опричнина является по сути расширенной эсеровской политикой «Социализации земли». Это создаёт идеальный синтез национал-максималистской и НРПР политических доктрин.\n\nС другой стороны, есть одна вещь, к которой Савинков сильно стремится. Власть. Коалиция между национал-максималистами и НРПР ставит его в драгоценное положение личного советника Шихматова, что вредит имиджу национал-максималистов. Легитимизация роли Савинкова в правительстве, например, назначение его премьер-министром, снимет это бремя и вызовет больше симпатий к правлению Шихматова. Однако это может создать проблемы для Шихматова, сделав его ещё более зависимым от премьер-министра, который контролирует правительство."
youngeurasia.5.a: "Сделать Савинкова премьер-министром."
youngeurasia.5.b: "Не стоит недооценивать Савинкова."

youngeurasia.6.t: "Обычный день"
youngeurasia.6.d: "Это был обычный день в Евразийском государстве. Детская площадка была заполнена шумными детьми, люди спешили вовремя на работу, промышленные заводы дымили, поставляя оборудование для Государства. На улицах было видно несколько автомобилей, включая НАЗ-1, серийный евразийский седан на базе Ford Model 18, который стал популярным и широко распространённым среди граждан Евразии. Жизнь простого человека была такой, какой и должна быть: жизнь в сверхдержаве, которая медленно улучшает уровень жизни и индустриализируется. Конечно, были массовые аресты и преследование инакомыслия. В нескольких регионах Новая опричнина уже была внедрена с закрытыми городами, массовым военным производством и жёсткими квотами. Но с хорошей стороны, жизнь в Евразийском государстве была просто идеальной.\n\nВо время одного из таких обычных дней в жизни евразийского народа внезапно стало очевидно, что что-то назревает... На улицах [ROOT.Capital.GetName] появились солдаты без знаков различия Евразийского государства, но с терновым венцом, перекрещенным мечом, и с российским триколором на служебной нашивке. Солдаты выглядели так, будто на них была символика НРПР, что было странно. Наконец, через два-три часа на главной улице показались танки и артиллерия, направляющиеся к административному зданию, где заседало евразийское правительство."
youngeurasia.6.a: "Что-то происходит."

youngeurasia.7.t: "Напряжение"
youngeurasia.7.d: "Шихматов проводил совещание в правительственном здании [ROOT.Capital.GetName], где он только что услышал от своего верного офицера Секретной службы новость о том, что на улицах танки и солдаты и что они направляются к ним с возможной целью свергнуть правительство.\n\nШихматов был охвачен ужасом на минуту или больше. Он быстро понял, что Савинков использовал его. Он постепенно получал всё больше и больше власти над ним, над правительством и, наконец, над государством. Теперь даже части армии на его стороне, и последствия для них катастрофичны. Вряд ли Савинков пощадит его. Вероятно, его арестуют, а затем казнят так же, как он ранее поступил с левыми евразийцами.\n\n«Каковы ваши приказы, Юрий Алексеевич?» - спросил Пономарёв, начальник Совета государственной безопасности. - «Мы не можем просто сидеть здесь, ожидая, пока нас убьют или уничтожат снарядом эти предатели снаружи».\n\nМог ли он что-то сделать? Шихматов не знал. Он, вероятно, был человеком, который мог бы управлять сверхдержавой, но он сомневался в этом на протяжении всей своей политической карьеры. Он пришёл к власти благодаря помощи Савинкова, и его победа была обеспечена Боевыми дружинами и общенациональным страхом перед Второй гражданской войной. Он чувствовал себя отрезанным от своей страны, запертым в административном здании посреди огромной страны. Он думал ещё минуту, а затем сказал самым спокойным голосом, каким может говорить потрясённый человек."
youngeurasia.7.a: "Мы должны эвакуировать здание и бежать из города."
youngeurasia.7.b: "Приказать опричникам защищать здание."
youngeurasia.7.c: "Приказать армии стрелять в предателей."

youngeurasia.8.t: "Спасение"
youngeurasia.8.d: "Совету потребовалось около сорока минут или больше, чтобы покинуть [ROOT.Capital.GetName], пока они не пересекли городскую границу и не оказались на ближайшем посту безопасности. Офицеры были удивлены, увидев главу государства в их небольшом подразделении, но оттуда Шихматову удалось связаться с лояльными армейскими генералами, которые подтвердили, что группа солдат и генералов присоединилась к так называемому «Временному совету Союза защиты Родины и Свободы» во главе с самим Савинковым. В спонтанной попытке свергнуть правительство Савинков консолидировал силы и попытался установить контроль над [ROOT.Capital.GetName], что ему удалось, но всё государство за пределами города находилось под контролем опричников или гражданских администраций национал-максималистов.\n\nСбежав из города, Шихматов спас свою жизнь, но судьба Евразии всё ещё была неопределённой из-за высокой популярности Савинкова в обществе. Поэтому требовались дальнейшие действия."
youngeurasia.8.a: "Окружить город и уничтожить врагов."
youngeurasia.8.b: "Найти Савинкова и казнить его."

youngeurasia.9.t: "Последняя надежда"
youngeurasia.9.d: "Шихматов в окружении своих сторонников быстро сбежал вниз по лестнице, где его ждала правительственная машина, чтобы эвакуировать его из города. Он резко дёрнул дверную ручку и вышел из здания...\n\nЭто был сам Савинков, стоящий прямо перед ним, окружённый огромным количеством Боевых дружин, все с направленными на Шихматова пистолетами.\n\n«Всё кончено, Юрий Алексеевич», - Савинков стоял неподвижно в своей форме, с леденящим душу взглядом.\n\n«Борис Викторович, я ничего не сделал. Почему, во имя всего мира, вы предали меня? Я доверял вам - и у вас было всё, что вы хотели - за лояльность!»\n\n«Вы ошибаетесь, Юрий. Не было ни дружбы, ни лояльности. Вы вели себя как дурак, и вас одурачили. Таковы правила игры».\n\nШихматову нечего было ответить.\nКогда Агнец снял четвёртую печать, я услышал голос четвёртого животного, говорящего: «Иди». Я взглянул, и вот, бледный конь, и имя сидящему на нём - смерть, и ад следовал за ним.\n\nПоследовали выстрелы. Шихматов лежал на земле, глядя в небо. Оно становилось всё темнее и темнее, пока не стало настолько тёмным, что единственное, что освещало путь - была Звезда Чингисхана. В Тёмном Небе Евразии."
youngeurasia.9.a: "Нет друзей в политике."

youngeurasia.10.t: "Битва за [ROOT.Capital.GetName]"
youngeurasia.10.d: "Обычный день в жизни евразийского гражданина был определённо испорчен. Танки и солдаты в центре города, сильное чувство страха за свою жизнь...\n\nЭтот день снова изменил Евразийское государство... снова навсегда...\nОпричники национал-максималистов, сопровождаемые несколькими армейскими подразделениями, находящимися в городе, попытались защитить здание и уничтожить мятежников. Но их было больше.\n\nКаждый опричник и верный солдат лежал мёртвым на земле. Силы так называемого «Временного совета Союза защиты Родины и Свободы» под руководством савинковцев уничтожили главную охрану правительственного здания. Министры, включая Юрия Шихматова, вероятно, всё ещё находятся в здании, окружённые путчистами."
youngeurasia.10.a: "Наше руководство в окружении!"

youngeurasia.11.t: "Битва за [ROOT.Capital.GetName]"
youngeurasia.11.d: "Обычный день в жизни евразийского гражданина был определённо испорчен. Танки и солдаты в центре города, сильное чувство страха за свою жизнь...\n\nЭтот день снова изменил Евразийское государство... снова навсегда...\nОпричники национал-максималистов, сопровождаемые несколькими армейскими подразделениями, находящимися в городе, попытались защитить здание и уничтожить мятежников.\n\nИм удалось сдерживать путчистов какое-то время, но этого было достаточно только для того, чтобы руководство национал-максималистов покинуло город. Силы так называемого «Временного совета Союза защиты Родины и Свободы» под руководством савинковцев были превосходимы по численности быстро мобилизованными опричниками, но их было недостаточно, чтобы победить их. Битва всё ещё продолжается, большинство опричников ожидают приказов от Шихматова."
youngeurasia.11.a: "Есть шанс..."

youngeurasia.12.t: "Битва за [ROOT.Capital.GetName]"
youngeurasia.12.d: "Обычный день в жизни евразийского гражданина был определённо испорчен. Танки и солдаты в центре города, сильное чувство страха за свою жизнь...\n\nЭтот день снова изменил Евразийское государство... снова навсегда...\nВерная армия сумела быстро добраться до города, только чтобы увидеть, как опричники изо всех сил пытаются защитить правительственное здание от предателей-савинковцев.\n\nАрмейские подразделения присоединились к сопротивлению, началась перестрелка, сообщается о десятках убитых и раненых. К сожалению, похоже, что местных армейских подразделений было недостаточно, чтобы превзойти численностью путчистов, и вскоре инициатива снова перешла к савинковцам. Они атаковали правительственное здание, в котором вспыхнул пожар. Оставшиеся лоялисты вынуждены были отступить, чтобы избежать полного уничтожения, и вскоре после этого правительственное здание было окружено."
youngeurasia.12.a: "Провал операции!"

youngeurasia.13.t: "Битва за [ROOT.Capital.GetName]"
youngeurasia.13.d: "Обычный день в жизни евразийского гражданина был определённо испорчен. Танки и солдаты в центре города, сильное чувство страха за свою жизнь...\n\nЭтот день снова изменил Евразийское государство... снова навсегда...\nВерная армия сумела быстро добраться до города, только чтобы увидеть, как опричники изо всех сил пытаются защитить правительственное здание от предателей-савинковцев.\n\nАрмейские подразделения присоединились к сопротивлению, началась перестрелка, сообщается о десятках убитых и раненых. К счастью, похоже, что путчисты уступали в численности опричникам и подразделениям Евразийской армии и были вынуждены отступить с главной улицы для подкрепления. Битва ещё не окончена, и, хотя лоялисты вернули себе инициативу, неизвестно, продержатся ли они дольше."
youngeurasia.13.a: "Битва всё ещё продолжается."

youngeurasia.14.t: "Крестовый поход"
youngeurasia.14.d: "Теперь, когда правительство в безопасности, дополнительные армейские подразделения получили приказ присоединиться к сопротивлению в [ROOT.Capital.GetName].\n\nНа следующий день в город прибыло несколько подразделений и обнаружили, что правительственное здание занято «Временным советом Союза защиты Родины и Свободы». Путчисты забаррикадировались в здании при поддержке армии снаружи. На улицах время от времени происходили стычки между путчистами и опричниками.\n\nОднако путчисты были окружены. Их последнему оплоту не хватало припасов, так как их силы уступали по численности опричникам и армии. Битва продолжалась, теперь армия и опричники пытались взять под контроль правительственное здание. К несчастью для савинковцев, внешняя оборона вскоре пала, открыв фланг. К концу дня опричники ворвались в здание, уничтожая любое сопротивление и арестовывая сдавшихся.\n\nСавинкова там не было. Возможно, эта крыса стремится бежать из страны, опасаясь немедленного ареста и казни за измену. Мы должны найти его немедленно, пока не стало слишком поздно, но, возможно, время, которое мы потратили на уничтожение путчистов, позволило ему бежать быстрее, чем мы думали."
youngeurasia.14.a: "Найти этого предателя."

youngeurasia.15.t: "Бледный конь ускользает"
youngeurasia.15.d: "Последние сообщения говорят о том, что человека, похожего на Савинкова, видели на границе с Монголией. Без ясного объяснения ему каким-то образом удалось пересечь границу и исчезнуть...\n\nСлужбы безопасности не смогли найти предателя и предать его суду военного трибунала. Его побег означает, что оппозиция всё ещё жива, поэтому существует острая необходимость в чистках и расширении полномочий опричников и Национал-максималистской партии. Но с исчезновением Савинкова мы можем надеяться, что на некоторое время стабильность нашего государства обеспечена."
youngeurasia.15.a: "Очень жаль, что он жив."

youngeurasia.16.t: "Смерть Вождя"
youngeurasia.16.d: "Савинков никогда не был тем человеком, за которого его все принимали. Социалист? Никогда. Террорист? Да. Революционер? Вероятно. Он сам никогда не знал, кто он. Ропшин, автор романа, в котором все его идеалы разбиты? Он никогда не был человеком сильного характера, чётко определённой идеологии. История распорядилась так, что он создал самую большую партию в стране, но знал ли он на самом деле, что делать со всей этой властью? Не ему суждено было отвечать на этот вопрос. Многие десятилетия спустя люди будут говорить о нём, изучать его биографию и строить теории о том, кем он был на самом деле.\n\nСлужба безопасности знает, где он находится, и скоро он будет арестован. Это было единственным, что имело значение. И он никогда не сдастся. Бежать было некуда, поэтому Савинков приготовил свой пистолет к действию. Когда Агнец снял четвёртую печать, я услышал голос четвёртого животного, говорящего: «Иди». Я взглянул, и вот, бледный конь, и имя сидящему на нём - смерть;"
youngeurasia.16.a: "и ад следовал за ним."

youngeurasia.17.t: "Новое столетие"
youngeurasia.17.d: "Вождь мёртв. Да здравствует новый Вождь.\n\nСавинков сидел на стуле, на котором когда-то сидел Юрий Шихматов. Его синкретизм никогда не знал границ - сочетая аграрный социализм и национал-популистскую повестку с христианством и концепцией Национального Воскресения. Теперь есть новый элемент, ожидающий добавления в элегантную концепцию будущей российской сверхдержавы - евразийство.\n\nПосле того как руководство национал-максималистов было арестовано и казнено, многие опричники присоединились к Боевым дружинам, чтобы избежать немедленной чистки, последовавшей за этим. Нация, когда-то охваченная страхом, теперь может наслаждаться мирной жизнью в центре Евразийского континента. Евразийское государство продолжает жить."
youngeurasia.17.a: "Слава Вождю."

youngeurasia.18.t: "Манифест"
youngeurasia.18.d: "«Манифест Евразийского государства. Апокалиптический всадник, Вождь нашей Нации здесь, чтобы править величайшим государством из когда-либо существовавших. С верховной властью в его руках величие и мощь нашей Славной Родины пребудут вовеки. Слабое правительство национал-максималистов, которое никогда не представляло, как удержать эту нацию вместе, и случайно оказалось у руководства, будет удалено, а их наследие и идеология будут собраны теми, кто этого заслуживает...»\n\nШихматов отбросил газету. Затем он снова взял её в руку и разорвал на части.\n\n«Предатели Родины! Они думают, что мы слабы, что мы потерпим эту газетную клевету, которую они распространяют. Они призывают к революции только потому, что их «Вождь» не диктатор. Савинков становится всё более и более опасным. Даже если эта статья была написана не по его приказу, это создаёт прецедент. Мы должны вернуть их в реальность. Страна полна опричников, различных агентов и служб безопасности. Неужели они думают, что их не казнят за их речи?»\n\nШихматов расслабился на мгновение. Его только что закончившийся эмоциональный срыв наконец привёл к некоторым логическим мыслям. Коалиция с НРПР была опасной вещью, поскольку Савинков становился больше, чем просто советником. Это было неправдой, но действительно требования Вождя возникают всё чаще и чаще, а полномочия, которыми он обладает, расширяются."
youngeurasia.18.a: "Мы должны взять его влияние под контроль."
youngeurasia.18.b: "Сделать его премьер-министром, надеясь, что это его успокоит."
youngeurasia.18.c: "Игнорировать Манифест и продолжить наши реформы."

youngeurasia.19.t: "Обычный день"
youngeurasia.19.d: "Это был обычный день в Евразийском государстве. Детская площадка была заполнена шумными детьми, люди спешили вовремя на работу, промышленные заводы дымили, поставляя оборудование для Государства. На улицах было видно несколько автомобилей, включая НАЗ-1, серийный евразийский седан на базе Ford Model 18, который стал популярным и широко распространённым среди граждан Евразии. Жизнь простого человека была такой, какой и должна быть: жизнь в сверхдержаве, которая медленно улучшает уровень жизни и индустриализируется. Конечно, были массовые аресты и преследование инакомыслия. В нескольких регионах Новая опричнина уже была внедрена с закрытыми городами, массовым военным производством и жёсткими квотами. Но с хорошей стороны, жизнь в Евразийском государстве была просто идеальной.\n\nВо время одного из таких обычных дней в жизни евразийского народа внезапно стало очевидно, что что-то назревает... На улицах [ROOT.Capital.GetName] появились солдаты без знаков различия Евразийского государства, но с терновым венцом, перекрещенным мечом, и с российским триколором на служебной нашивке. Солдаты выглядели так, будто на них была символика НРПР, что было странно. Наконец, через два-три часа на главной улице показались танки и артиллерия, направляющиеся к административному зданию, где заседало евразийское правительство."
youngeurasia.19.a: "Что-то происходит."

youngeurasia.20.t: "Наша политика по отношению к меньшинствам"
youngeurasia.20.d: "Православные евразийцы считали, что к этническим меньшинствам, проживающим на обширных территориях Евразийского континента, следует относиться как к равноправным гражданам государства. Политика национал-максималистов почти такая же, однако с той оговоркой, что русские являются высшей и государствообразующей этнической группой Евразийского государства. В отличие от православных евразийцев, Шихматов считает, что идея провозглашения евразийской этничности сверху не принесёт никакого положительного эффекта. Вместо этого национал-максималисты, перенимая эту точку зрения из политики НРПР, считают, что все этнические группы неравны и имеют ограниченные права по сравнению с русскими.\n\nЭта политика русского превосходства, вероятно, будет подорвана всеми меньшинствами и даже окажет негативное влияние на стабильность и популярность нашего правительства. Тем не менее, как думает Шихматов, это справедливо."
youngeurasia.20.a: "Мы должны реализовать эту политику."
youngeurasia.20.b: "Лучше не надо - пусть остаётся как есть."

youngeurasia.22.t: "Молодое руководство"
youngeurasia.22.d: "Евразийский союз молодёжи ищет молодых патриотов, истинных граждан Евразийского государства, для вступления в организацию. Теперь каждый школьник или школьница должны быть назначены в организацию, так как членство является обязательным. Союз Евразийской молодёжи будет обучать юных граждан государства идеологическим основам евразийской доктрины. С детства будущие граждане Евразийского союза должны ознакомиться с национал-максимализмом и евразийством. Каждый человек - это личность, но вместе - под яркими идеями Солидарности - они сделают наше государство стабильным и суверенным. По всем вопросам обращайтесь к Льву Николаевичу Гумилёву."
youngeurasia.22.a: "Они - наше будущее!"

youngeurasia.24.t: "Концептуализация неоевразийства"
youngeurasia.24.d: "Ортодоксальное евразийство мертво, но его наследие живёт.\n\nВ мире, где индивид - ничто, а политики борются за власть, Евразийское государство является островом надежды. Надежды на светлое будущее человечества.\nСначала рождённая в уме Трубецкого, теоретизированная его сторонниками, евразийская доктрина наконец реализована на практике - силами нашего народа - и законными преемниками старой партии - национал-максималистами.\n\nВ отличие от наших предшественников, политика национал-максималистов, которая теперь официально концептуализирована как «Неоевразийство», - это переосмысленное евразийство - евразийство, применённое к русскому народу. И основные принципы таковы.\n\n1. Каждый гражданин должен служить государству, а государство - служить гражданам в ответ.\n2. Власть Национал-максималистской партии неоспорима, вечна и совершенна. Идеологический дрейф возможен, если правительственный курс это позволяет.\n3. Евразийство - единственная истинная доктрина, имеющая теоретическое обоснование в русской истории.\n4. Нация. Братство. Евразийство."
youngeurasia.24.a: "Навеки."

youngeurasia.25.t: "Культ Разума"
youngeurasia.25.d: "Разум привёл нас к этому. Народы Евразии, веками жившие в лесах, степях, пустынях, тундре и тайге, были разобщены под влиянием царских шовинистов, затем идей социалистического равенства, а в конце концов были развращены либеральными западными ценностями. Только сейчас, когда у власти находятся национал-максималисты, основатели рационального евразийства, союза славян и тюрков на основе общей истории, Разум восторжествовал. Подняв знамя Звезды Чингисхана, мы объединены духовно и физически. Наша история только начинается, но через десять лет вся Евразия будет под единым флагом, а наши народы сольются в величайшую нацию - евразийцев."
youngeurasia.25.a: "Да будет так."


### Left Eurasianists ###

lefteurasia.1.t: "Красный принц торжествует"
lefteurasia.1.d: "Мирский обычно был меланхоличен и часами проводил в глубоких размышлениях. Его блестящая эрудиция и тонкий ум были ключом к его успеху - он вдохновлял людей, он был знаком с известными поэтами и писателями - и вот он оказался на вершине государства - лидером отколовшейся партии левых евразийцев, вдохновлённой большевизмом.\n\nХотя в глазах многих он считался предателем идей евразийства, его внезапный дрейф в сторону социализма в столь антисоциалистической атмосфере послевоенной России воспринимался современниками как безумие. Тем не менее, он был вдохновлён сам - и в этом была вина Керенского. Невежество и высокомерие православных евразийцев по отношению к простым людям, неприкрытое прославление интеллигенции, чистая роскошь и великолепие аристократии и высших классов, в то время как большинство русского населения умирало - это стало последней каплей для Мирского.\n\nХотя его называют Красным принцем, он здесь, чтобы спасти русский народ от буржуазного реализма."
lefteurasia.1.a: "Да здравствует Красный принц."

lefteurasia.2.t: "Большевики возвращаются"
lefteurasia.2.d: "Самолёт приземлился на взлётно-посадочную полосу так аккуратно, как только мог. Пассажирские рейсы из Парижа в Москву были такой же редкостью, как ледяная вода в аду, и даже этот конкретный рейс был необычным.\n\nНаконец, после пятнадцати лет за границей, они вернулись на Родину. Передняя дверь самолёта открылась, и несколько мужчин спустились по трапу.\nВетреная Москва. Ходынка. Делегация из Коммуны была немного нервной. Они не знали, чего ожидать. Правда ли, что их Родина наконец смогла сбросить оковы капитализма? Что, если их арестуют через минуту и казнят без суда? Никто из них не знал этого наверняка.\n\nСамолёт был окружён прессой, полицией и несколькими высокопоставленными чиновниками.\n«Товарищ Зиновьев, мы рады приветствовать вас в Союзе Евразийских Социалистических Республик. Пожалуйста, проследуйте к правительственной машине».\n\nЗиновьев посмотрел на своих товарищей, прибывших с ним."
lefteurasia.2.a: "«Мы наконец дома, Лев»."

lefteurasia.3.t: "Меч и серп"
lefteurasia.3.d: "Ширинский-Шихматов был в крайнем возбуждении с тех пор, как большевики вернулись. Слишком долго он консолидировал все национал-большевистские силы в стране, одновременно сотрудничая с левыми евразийцами, чтобы отдать всю свою власть когда-то сосланным большевикам. У него были личные разногласия с Зиновьевым, особенно в вопросах интернационализма. Ширинский-Шихматов видел будущее Русского государства в его экспансии в Евразию, а не в сотрудничестве с Интернационалом.\n\nШиринский-Шихматов знал, что теперь всё зависит от Мирского, которого он лично не считал великим лидером для новой страны.\n\nТем не менее, борьба за место в коалиции займёт некоторое время, и Ширинский-Шихматов знал, что если ему не удастся создать сильную коалицию с Мирским, левые эсеры возьмут верх."
lefteurasia.3.a: "Национал-максимализм - это будущее."

lefteurasia.4.t: "Трёхсторонняя встреча"
lefteurasia.4.d: "«Мы сейчас у власти, но в то же время наша власть всё ещё слишком слаба. Вот почему вы здесь. Это историческая встреча, когда мы наконец решим будущее нашей партии и будущее Социалистической Евразии». - сказал Мирский двум своим соратникам. Слева сидела Спиридонова - лидер ПЛСР, или левых эсеров, видная революционерка, когда-то ближайший соратник Ленина. С другой стороны сидел Якобсон, лидер СЕРП, который был тесно связан с Евразийской партией и даже считался некоторыми критиками ещё одним социалистом.\n\n«Итак, ключевой момент нашей встречи - обсудить наши разногласия и то, как избавиться от них путём сотрудничества».\n\nЯкобсон не ответил, а только нахмурился. Ему никогда не нравилась идея коалиции с левыми эсерами. Бывшие союзники кровавых большевиков были оставлены в покое благодаря коррумпированному Керенскому. Именно он, Роман Якобсон, понимал истинные последствия Гражданской войны - он остался, чтобы вдохновлять русский народ на борьбу за свою свободу - и он принял правильное решение присоединиться к евразийцам - он знал, что они победят, потому что в каждом слове Трубецкого была правда. Правда о русской нации - евразийской нации. Но Трубецкой никогда не понимал, что его желание создать особый класс, который будет править евразийским крестьянством, - это просто кучка аристократов и дворян, которые будут только грабить простых людей, как они это делали уже пятьсот лет. Евразийский народ должен править - с мечами и серпами в руках."
lefteurasia.4.a: "Спиридонова никогда не поймёт евразийство."

lefteurasia.5.t: "Валькирия говорит"
lefteurasia.5.d: "Спиридонова смотрела на Якобсона. Лингвист о чём-то думал, о чём-то очень тревожном для самой Спиридоновой. Он хорошо понимал, что коалиция между РКП и СЕРП невозможна, но не из-за противоречий - существование двух социалистических партий в коалиции одновременно казалось Спиридоновой странным и непрактичным. Это создаст куда более серьёзные проблемы, чем думал Мирский. И вот они сидят рядом друг с другом, готовясь обсуждать какие-то коалиционные вопросы, которые никто из них не хотел обсуждать.\n\nРеволюция удалась - власть в Евразийском союзе должна принадлежать левым эсерам. Таковы были её мысли. Тем не менее, она посмотрела на собравшихся и начала.\n\n«Товарищи, я рада быть здесь вместе с революционерами - защитниками крестьян и рабочего класса. Мы сейчас находимся на новом этапе Русской революции - третьем. На этот раз русский народ эволюционировал во что-то большее - в самоидентификацию как евразийцев. Партия левых эсеров всегда хотела, чтобы простые люди стали правящим классом - и нет противоречий в том, называется ли страна Россией или Евразией. У меня нет разногласий по поводу широкой коалиции с левыми евразийцами и СЕРП. Пусть наша общая власть хорошо служит народу»."
lefteurasia.5.a: "Была ли она искренна в этот момент?"

lefteurasia.6.t: "На распутье"
lefteurasia.6.d: "Спиридонова всегда была хорошим оратором. Все знали это, и поэтому она была успешным революционером. В холодные дни Гражданской войны, когда путч левых эсеров провалился, Спиридонова сумела удержать распадающихся левых эсеров в течение полутора лет. После гражданской войны она продолжала вдохновлять сторонников обещаниями Третьей революции и восстановления Советской власти и никогда не примирялась с ПСР. У неё не было другого выбора, кроме как присоединиться к левым евразийцам, когда она прочитала в газете, что левые одержали победу в Евразийском союзе. Теперь она стремится взять бразды правления в свои руки.\n\nЯкобсон смотрел на выступающую Спиридонову с нескрываемой враждебностью. Если только враждебность была правильным словом в этой ситуации. Спиридонова была не на публичном митинге и не на заводе перед рабочими. Зачем столько пафоса, если в комнате их всего трое? Якобсон был довольно раздражён речью Валькирии и изо всех сил старался изобразить спокойствие и согласие.\n\nОн чувствовал ответственность за важное решение, которое будет принято сегодня. Коалиция необходима, но не с предательскими левыми эсерами.\n\n«Спасибо, товарищ», - сказал Мирский и повернулся к Якобсону. - «Роман Осипович, у вас есть какие-либо возражения против широкой народной коалиции нового правительства Евразийского союза?»"
lefteurasia.6.a: "«Нет возражений, Дмитрий Петрович»."

lefteurasia.7.t: "Объявлена коалиция ПЛСР-ПЛЕ-СЕРП"
lefteurasia.7.d: "На секунду яркая фото-вспышка осветила лица трёх товарищей. Спиридонова, Мирский и Якобсон пожимали друг другу руки. На лице Мирского была тень улыбки, но на лицах двух его соратников не было ни проблеска удовлетворения.\n\nЭтот момент ознаменовал новую веху в российской истории. Первая социалистическая коалиция Евразийского союза была только что объявлена и вскоре приступит к работе."
lefteurasia.7.a: "Как долго она продержится?"

lefteurasia.8.t: "Возрождение народничества"
lefteurasia.8.d: "Движение народничества наиболее естественно для русского народа. Впервые возникнув в XIX веке, оно приобрело много сторонников, но в конечном итоге было раздавлено царским режимом. С революцией 1917 года народничество воплотилось в партии эсеров. Но ненадолго. Задушенное контрреволюцией и мелкобуржуазными реформами Керенского, народничество снова стало лишь призраком когда-то утерянной мечты.\n\nТеперь всё изменится. Движение народничества возродится в политике левых евразийцев и достигнет самого широкого уровня. Став государственной политикой, общеевразийское народничество поможет беднейшим классам нашего великого государства стать образованными, революционными и богатыми."
lefteurasia.8.a: "Будем надеяться, на этот раз народничество добьётся успеха."

lefteurasia.9.t: "Модернизированное «Хождение в народ»"
lefteurasia.9.d: "Кампании «Хождения в народ» когда-то были движущей силой движения народничества. Интеллигенция посещала русские деревни и пыталась пропагандировать идеалы народничества среди крестьян.\n\nИдея, которую хотят реализовать левые евразийцы, заключается в создании специального агентства, которое будет иметь цель, схожую с той, которую когда-то имели кампании «Хождения в народ». Они предлагают, чтобы идеи народничества и евразийства продвигались повсеместно среди евразийских регионов. Территории, которые будут интегрированы в наше государство, также будут охвачены этими кампаниями, которые, как мы надеемся, помогут нам интегрировать их в нашу идеологию."
lefteurasia.9.a: "За народ."

lefteurasia.10.t: "В зале горного короля"
lefteurasia.10.d: "Мирский вошёл в комнату, где собралось несколько человек - все они были членами недавно созданного Министерства просвещения - специального учреждения, которое будет заниматься пропагандой евразийства и идей народничества. Там были всё знакомые лица, но самым заметным был сам Министр просвещения - Роман Якобсон. Он проделал хорошую работу в 1920-х годах, оценивая идеи левого евразийства. Теперь он наконец стал одним из самых важных чиновников в Евразийском союзе.\n\nКонференция должна была решить некоторые важные принципы будущей социалистической программы Просвещения.\n\nЯкобсон начал свою речь с необходимости создания новой просветительской доктрины. Он настаивал на создании культа личности, который станет Цезарем Октября и Брутом мировой буржуазии - человека, который освободит рабочих и крестьян во всём мире. Этим человеком, естественно, должен быть Мирский - лидер Евразийского союза.\n\nМирский знал, что он не такой человек. Он был скорее скромным - но решительным. Его главным желанием было создание евразийского социализма - движения, которое освободит самые талантливые слои евразийского общества. Но он никогда не считал себя «Вождём пролетариата и крестьянства». Это было странно для него. Но он верил, что это сработает. А сам он, вместе с партией, левыми эсерами и СЕРП, должны стать последователями этих идей."
lefteurasia.10.a: "Это звучит знакомо..."

lefteurasia.11.t: "Цезарь Октября"
lefteurasia.11.d: "«Милая» конференция взаимного обожания была прервана Спиридоновой, которая всё это время хранила молчание.\n\n«Культ личности? Это чудовищно... Мы не должны попадать в бесконечную петлю большевизма. Мы здесь, чтобы создать новую идеологию - и мы уже создали её. Теперь нам просто нужно продвигать её среди народа - наше правительство не так популярно, как может казаться всем вам в этом высокопоставленном кабинете, министр. Не поймите меня неправильно, но при всём должном уважении, товарищ Якобсон, ваша программа Просвещения не очень вписывается в идеологию народничества».\n\nЗакончив свою эмоциональную речь, Спиридонова наблюдала за потрясёнными лицами Мирского и Якобсона. Последний, казалось, был очень оскорблён речью Валькирии. Якобсон заговорил первым.\n\n«Товарищ Спиридонова, как вы смеете говорить, что не уважаете работу, проделанную евразийцами? Своими словами вы подвергаете нападкам характер нашей партии. Вы разрушаете коалицию и то, к чему стремится товарищ Мирский - мир и сотрудничество между нашими партиями на благо всех. Во время Гражданской войны мы были по разные стороны баррикад. Но это не значит, что мы не должны уважать друг друга в такое трудное время. Я призываю всех собравшихся здесь слушать и не устраивать хаос на конференции. Решать будет товарищ Мирский, но я надеюсь, что он примет правильное решение»."
lefteurasia.11.a: "«Спиридонова права» - сказал Мирский."
lefteurasia.11.b: "«Якобсон прав» - сказал Мирский."

lefteurasia.12.t: "Коалиция ПЛСР-ПЛЕ-СЕРП разваливается"
lefteurasia.12.d: "Новость на первой полосе о распавшейся коалиции была индикатором очередного политического кризиса в Союзе. И Мирский ничего не мог с этим поделать. Его попытки объединить левых эсеров и СЕРП под знамёнами левого евразийства провалились. Противоречия между Спиридоновой и Якобсоном стали слишком очевидными, чтобы их можно было игнорировать обеими партиями. У Мирского не было выбора - он должен был сформировать коалицию, чтобы обеспечить свою власть. Но теперь есть выбор - либо левые эсеры, либо СЕРП. Оба являются естественными союзниками левых евразийцев. Но вместе они вызывают хаос и кризисы.\n\nМирский должен принять важное решение - он выберет подходящего партнёра по коалиции. Только одного. Другие, вероятно, будут очень разочарованы этим решением и могут вызвать некоторые волнения в обществе или в армии.\nС одной стороны, идеалы СЕРП Якобсона ближе к евразийским, поскольку Якобсон с самого начала был евразийцем.\nС другой стороны, есть левые эсеры, довольно непопулярная партия после Гражданской войны. Только недавно левым эсерам удалось обрести некоторую популярность.\n\nВыбор труден, но Мирский должен действовать сейчас - иначе ситуация слишком долго не будет под контролем."
lefteurasia.12.a: "Коалиция с левыми эсерами"
lefteurasia.12.b: "Коалиция с СЕРП"
lefteurasia.12.c: "Мирский решает править в одиночку."

lefteurasia.13.t: "Объявлена коалиция ПЛЕ-СЕРП"
lefteurasia.13.d: "Не прошло и трёх дней с тех пор, как Мирский объявил о новой правительственной коалиции - на этот раз между левыми евразийцами и СЕРП. Мирский и Якобсон уже встретились и обсудили новую политику, которая будет вскоре реализована.\n\nРеакция левых эсеров последовала быстро - председатель ПЛСР Спиридонова осудила правительственную коалицию, заявив, что нынешняя коалиция контрреволюционна и что власть в государстве захвачена небольшой группой буржуа и капиталистов, желающих свергнуть социалистический государственный строй."
lefteurasia.13.a: "Она должна быть арестована."
lefteurasia.13.b: "Спиридонова не может нам навредить."
lefteurasia.13.c: "В нашем государстве не будет оппозиции - казнить левых эсеров."

lefteurasia.14.t: "Спиридонова арестована"
lefteurasia.14.d: "Сегодня утром в центре столицы и в крупнейших городах Евразии наблюдалось увеличение числа полицейских. Председатель партии левых эсеров Мария Спиридонова была арестована и помещена в камеру предварительного заключения до дальнейшего расследования. Другие лидеры партии, включая Камкова и Штейнберга, также были арестованы. Неизвестно, какое преступление вменяется левым эсерам, но, скорее всего, они будут преданы суду за измену."
lefteurasia.14.a: "Плохой конец для бедных парней."

lefteurasia.15.t: "Спиридонова бежит из страны"
lefteurasia.15.d: "Жалким, но успешным образом руководство ПЛСР бежало из страны во Французскую Коммуну. Кажется, эсеровская политика была недостаточной, и левое евразийство будет на подъёме как его истинный модернизированный преемник."
lefteurasia.15.a: "Им лучше не возвращаться."

lefteurasia.16.t: "Мятеж Балтийского флота"
lefteurasia.16.d: "То, что мы никогда не думали, что может случиться - но на самом деле - случилось. Некоторые части Балтийского флота, в основном рядовые моряки, присоединились к тому, что они назвали «Объединённым комитетом оппозиционных партий». Однако ПЛСР - единственная партия, которая, вероятно, создала нелегальный Комитет. В попытке свергнуть наше законное руководство Спиридонова и её сторонники организовали движение сопротивления. Но они обречены на провал."
lefteurasia.16.a: "Подавить мятеж."
lefteurasia.16.b: "Пообещать морякам более высокие зарплаты и гарантии."

lefteurasia.17.t: "Мятеж подавлен"
lefteurasia.17.d: "Моряки успокоились, убеждённые правительством левых евразийцев. Без какой-либо военной поддержки левые эсеры теперь сталкиваются с тотальным уничтожением. ОКОП, Объединённый комитет оппозиционных партий, будучи на самом деле вымышленной организацией, не может предложить никакой поддержки ПЛСР.\n\nЛевые эсеры были вынуждены бежать из страны. Разбитые Евразийской армией, они должны выбрать смерть или изгнание - и выбор Спиридоновой очевиден. Она всегда верила, что живая принесёт больше пользы крестьянству. Контрреволюционные левые евразийцы никогда не достигнут истинной власти социализма. Ей было дано время жить - великая милость, которой самой Спиридоновой сильно не хватало - и она оценила это. Пришло время уезжать - вместе с близкими товарищами. Остальные могут остаться в Евразийском союзе."
lefteurasia.17.a: "Союз только по названию."

lefteurasia.18.t: "Неожиданный переворот"
lefteurasia.18.d: "Спиридонова, безусловно, была настоящим революционером. Она убедила моряков и некоторые части армии перейти на её сторону - и граждане последовали за ней. Революция в Петрограде - затем в Москве... а затем и в других крупных городах Евразийского союза. Сопротивление, состоящее в основном из левых евразийцев, реакционеров и Мирского, было вынуждено бежать. Знамя левых эсеров теперь над Кремлём - и грядёт новый порядок."
lefteurasia.18.a: "Долой евразийство!"

lefteurasia.19.t: "Суд над левыми эсерами"
lefteurasia.19.d: "Когда-то они сами были преследователями - но им была дарована амнистия. Теперь они наконец там, где должны быть. На скамье подсудимых. С началом закрытого заседания суда последняя надежда Спиридоновой, Камкова и Штейнберга исчезла. Они были приговорены к смертной казни. За измену Евразии и Партии левых евразийцев. Их смерть ознаменовала конец долгой истории партии левых эсеров."
lefteurasia.19.a: "Им нет места в нашей стране."

lefteurasia.20.t: "Объявлена коалиция ПЛЕ-ПЛСР"
lefteurasia.20.d: "Не прошло и трёх дней с тех пор, как Мирский объявил о новой правительственной коалиции - на этот раз между левыми евразийцами и левыми эсерами. Мирский и Спиридонова уже встретились и обсудили новую политику, которая будет вскоре реализована.\n\nРеакция СЕРП последовала быстро - председатель СЕРП Роман Якобсон осудил правительственную коалицию, заявив, что нынешняя коалиция контрреволюционна и что власть в государстве захвачена небольшой группой анархо-синдикалистов, желающих свергнуть истинный евразийский социалистический государственный строй."
lefteurasia.20.a: "Якобсон должен исчезнуть."
lefteurasia.20.b: "Оставьте беднягу в покое - он не может навредить."

lefteurasia.21.t: "ПЛЕ правит в одиночку"
lefteurasia.21.d: "В результате внезапного решения, принятого Мирским - что он может править в одиночной коалиции, без левых эсеров или СЕРП, оба бывших партнёра по коалиции почувствовали себя преданными Красным принцем.\n\nС одной стороны, левые эсеры, чувствуя, что потеряли власть в стране, снова испытывают сильное чувство, что Спиридонова снова упустила контроль над правительством - что привело к окончательному исключению членов левых эсеров. Некоторые, однако, считают, что Спиридонову не следует винить в этом, так как она сделала всё, чтобы дискредитировать СЕРП и самих левых евразийцев.\n\nС другой стороны, есть Роман Якобсон, который чувствует себя ещё более преданным, поскольку его идеология хорошо вписывается в идеологию левого евразийства.\n\nПоскольку полиция и армия, кажется, на нашей стороне, Мирский, вероятно, останется у власти до дальнейших действий."
lefteurasia.21.a: "Эта страна нуждается в сильном руководстве..."

lefteurasia.22.t: "Славная революция"
lefteurasia.22.d: "В один момент Мирский осознал, что он наделал. Его отказ от формирования новой коалиции или сохранения предыдущей привёл к своего рода мятежу среди левых евразийцев, которые считают, что Мирский сам по себе не является сильным лидером. В то время как раньше они считали, что он зависел от интеллигенции с Якобсоном и от населения со Спиридоновой. Теперь, без них обоих, руководство левых евразийцев посчитало, что Мирский опасен и должен быть удалён.\n\nВ событии, которое позже назовут Славной революцией, высшее руководство левых евразийцев сумело заставить Мирского уйти в отставку. Вместо Мирского, без сюрпризов для населения и номенклатуры, но с умеренным сюрпризом для интеллигенции, левые евразийцы выбрали одного из лидеров левых эсеров, Бориса Камкова, председателем правительства левых евразийцев.\n\nТеперь, взяв на себя руководство, Камков в сопровождении Спиридоновой сумел арестовать лидеров СЕРП, чего он всегда хотел, и провозгласил новый, свободный курс Евразийского союза - в глубокой связи с традициями государства и желаниями населения."
lefteurasia.22.a: "Да здравствует новый Председатель!"

lefteurasia.23.t: "Образ Председателя"
lefteurasia.23.d: "Борис Камков выдвинул идею о том, что нынешний образ Мирского как лидера Партии левых евразийцев немного... странный. Несмотря на то, что он выходец из интеллигенции, сын царского министра внутренних дел, его поведение может иметь контрреволюционные мотивы. Хотя преданность Мирского принципам народничества несомненна, его образ - это не образ Вождя пролетариата и крестьян. Лидер великой евразийской нации должен быть харизматичным... он должен быть настоящим Брутом мировой буржуазии...\n\nИтак, как предлагает Камков, новое лицо должно быть номинальным лидером Союза - без реальной власти в руках, но с образом сильного лидера. Хотя, конечно, трудно выбрать из достойного числа кандидатов на эту роль, Камков считает, что лучше всех подходит... Спиридонова. Валькирия Русской революции, лидер левых эсеров, человек, способный объединить людей в их борьбе против капитализма."
lefteurasia.23.a: "Интересный выбор, Борис."

lefteurasia.24.t: "Брут мировой буржуазии"
lefteurasia.24.d: "Как и ожидалось, предложение, выдвинутое Камковым, получило большое осуждение со стороны Якобсона, министра просвещения. Он обвинил Камкова в попытке захватить Союз и узурпировать власть.\n\nТем не менее, он одобряет идею образа сильного лидера - и предложил себя. Будучи лингвистом, не таким талантливым, как Спиридонова, а также лидером политической организации, его предложение звучало нелепо.\n\nНе нужно быть гением, чтобы догадаться, что дискуссия продолжилась взаимными обвинениями и оскорблениями. Однако решение снова должен был принять Мирский. У него было сильное чувство, что коалиция находится на волоске от распада, но на этот раз сиюминутный выбор был первостепенным."
lefteurasia.24.a: "«Камков прав» - сказал Мирский."
lefteurasia.24.b: "«Якобсон прав» - сказал Мирский."

lefteurasia.25.t: "Вопрос власти"
lefteurasia.25.d: "Мирский, как всегда, размышлял. На этот раз его мысли были о провалившейся коалиции и власти. Великая нация Евразия должна иметь сильное руководство, которое не раздирается ни левыми эсерами, ни СЕРП. Он не был уверен, является ли он сам сильным лидером - он склонялся к тому, чтобы принимать идеи других и прислушиваться к уважаемым советникам. Но теперь большая часть власти находится не в его руках, а в руках правительства, состоящего из людей разных взглядов. Его решения могут быть легко заблокированы правительством, даже если он является его лидером.\n\nОднако у него всё ещё есть право расширить свои полномочия - так, чтобы правительство ничего не могло сделать. Но ему понадобится поддержка - либо Спиридоновой, либо Якобсона. При поддержке одного из партнёров по коалиции он сможет легко провести Акт и не опасаться сопротивления со стороны Конгресса.\n\nПришло время действовать."
lefteurasia.25.a: "Поговорить со Спиридоновой."
lefteurasia.25.b: "Поговорить с Якобсоном."

lefteurasia.26.t: "Спиридонова объявляет о полной поддержке"
lefteurasia.26.d: "Как и ожидалось, Спиридонова объявила о полной поддержке этого дела, возможно, надеясь полностью удалить СЕРП из процесса принятия решений в правительстве. Спиридонова добавила, что Мирский может рассчитывать на полную поддержку всех членов левых эсеров. Акт будет представлен правительству через несколько дней."
lefteurasia.26.a: "Великолепно!"

lefteurasia.27.t: "Якобсон объявляет о полной поддержке"
lefteurasia.27.d: "Как и ожидалось, Якобсон объявил о полной поддержке этого дела, возможно, надеясь полностью удалить левых эсеров из процесса принятия решений в правительстве. Якобсон заверил, что Мирский может рассчитывать на полную поддержку всех членов СЕРП. Акт будет представлен правительству через несколько дней."
lefteurasia.27.a: "Великолепно!"

lefteurasia.28.t: "Акт о руководстве Председателя"
lefteurasia.28.d: "«Уважаемые министры правительства Евразийского союза. Как Председатель Евразийского союза, председатель Партии левых евразийцев, глава коалиционного правительства, я стою здесь, чтобы объявить Акт о полномочиях Председателя. Акт был создан для расширения полномочий действующего и последующих Председателей. С даты принятия акта Председатель имеет право в любое время формировать и распускать кабинет министров, в любое время распускать любые политические организации, осуществлять высшее руководство работой правительства и курсом национальной политики. Акт, как указано в Декретах [ROOT.GetNameDefCap], не требует посредничества министра, ни одобрения, ни неодобрения со стороны другого правительственного учреждения. Подписанный Д. Мирским, акт вступает в законную силу сейчас».\n\nКогда Мирский закончил свою речь, на мгновение в комнате стало тихо, и министры лишились дара речи. Через несколько секунд заседание взорвалось шумом. Был слышен громкий голос Спиридоновой, воскликнувшей, что Партия левых эсеров принимает Акт в полном объёме, объявляя о полной поддержке нынешнего Председателя и решительно отвергает любые попытки другой правительственной оппозиции отменить Акт или критиковать его и будет рассматривать такие попытки как контрреволюционные.\n\nЧерез несколько секунд воскликнул Якобсон:"
lefteurasia.28.a: "«СЕРП в полном составе покидает правительство!»"

lefteurasia.29.t: "Акт о руководстве Председателя"
lefteurasia.29.d: "«Уважаемые министры правительства Евразийского союза. Как Председатель Евразийского союза, председатель Партии левых евразийцев, глава коалиционного правительства, я стою здесь, чтобы объявить Акт о полномочиях Председателя. Акт был создан для расширения полномочий действующего и последующих Председателей. С даты принятия акта Председатель имеет право в любое время формировать и распускать кабинет министров, в любое время распускать любые политические организации, осуществлять высшее руководство работой правительства и курсом национальной политики. Акт, как указано в Декретах [ROOT.GetNameDefCap], не требует посредничества министра, ни одобрения, ни неодобрения со стороны другого правительственного учреждения. Подписанный Д. Мирским, акт вступает в законную силу сейчас».\n\nКогда Мирский закончил свою речь, на мгновение в комнате стало тихо, и министры лишились дара речи. Через несколько секунд заседание взорвалось шумом. Был слышен голос Якобсона, воскликнувшего, что Социалистическая Евразийская Рабочая Партия принимает Акт в полном объёме, объявляя о полной поддержке нынешнего Председателя и решительно отвергает любые попытки другой правительственной оппозиции отменить Акт или критиковать его и будет рассматривать такие попытки как контрреволюционные.\n\nЧерез несколько секунд комната огласилась воплем Спиридоновой:"
lefteurasia.29.a: "«Левые эсеры в полном составе покидают правительство!»"

lefteurasia.30.t: "Речь Вождя"
lefteurasia.30.d: "Утро в стране ознаменовалось первой публичной речью нового Председателя Республики, Вождя Юрия Шихматова, ротмистра, Князя крестьян. В своей речи ротмистр объявил о слиянии Евразийской партии с СРНМ и о том, что он становится новым избранным лидером объединённых партий и, следовательно, Республики.\n\nДовольно длинный эпизод его речи был посвящён проблеме левых евразийцев, которых он назвал предательскими змеями, хотевшими превратить Евразийский союз в интернационалистический сырьевой придаток синдикалистов, строящих своё государство на терроре и репрессиях. Он также заявил, что несомненно, что некоторые деятели среди левых евразийцев хотели распустить Евразийский союз и захватить власть.\n\nШихматов также объявил, что грядут новые социальные реформы, которые будут направлены на улучшение уровня жизни евразийской нации.\n\nРеволюция только начинается!"
lefteurasia.30.a: "Новая Евразия явится."

lefteurasia.31.t: "Новая веха"
lefteurasia.31.d: "Утро в Евразийском союзе было отмечено речью совместного руководства Председателя Союза Дмитрия Мирского и главы правительства Романа Якобсона. В публичной речи два лидера объявили о новой вехе в истории России и Евразии - объединении двух партий левых евразийцев и СЕРП в единый союз. Новая политика будет вскоре реализована.\n\nДовольно длинный эпизод речи Якобсона также был посвящён проблеме левых эсеров, которых он назвал предательскими змеями, хотевшими построить наше государство на терроре и репрессиях. Он также заявил, что несомненно, что некоторые деятели среди левых эсеров хотели расторгнуть коалицию между левыми евразийцами и СЕРП и захватить власть.\n\nРеволюция только начинается!"
lefteurasia.31.a: "Новая Евразия явится."

lefteurasia.32.t: "Соборность"
lefteurasia.32.d: "«Для иностранца слово «Соборность» ничего не значит. Только истинный русский, и, что самое главное, истинный евразиец поймёт эту концепцию. Соборность означает нас. Группу людей, коммуну, объединённую духовным чувством нашей коллективности. Кооперация и коллективизм - это термины, которые всегда применялись к нашей великой евразийской нации - и наше существование зависит от нашего народа. Единые и сильные, мы справимся с любой проблемой. Наше руководство может быть слабым, как у Керенского, но есть люди, которые принимают решения - и они выбрали нас. Продвигая Соборность, мы победим!»\n\nЮрий Шихматов, в своём обращении к нации."
lefteurasia.32.a: "Единство - это сила!"

lefteurasia.33.t: "Новая Церковь Евразии"
lefteurasia.33.d: "Шихматов поднял вопрос о церкви. В то время как идеология левого евразийства гарантирует свободу вероисповедания, мы не можем недооценивать влияние Русской Православной Церкви на наше население. Более того, мы должны думать и о других неправославных христианах и даже нехристианах. Принимая во внимание все эти факты, ротмистр предложил создать новую Церковь Евразии в соответствии с национал-максималистской идеологией. Церковь Евразии объединит всех прихожан разных конфессий под единой Церковью на основе концепции Всеединства. Эта экуменическая организация будет представлять каждого человека во всей нации. Хотя проект очень амбициозен, в долгосрочной перспективе он может нам помочь, но мы получим много неодобрения со стороны людей, которые считают, что религиозные традиции должны оставаться такими, какие они есть. Тем не менее, выбор должен сделать Шихматов."
lefteurasia.33.a: "Учредить Всеединую экуменическую Церковь Евразии."
lefteurasia.33.b: "Просто заставить Православную Церковь служить нашим нуждам."

lefteurasia.34.t: "Провозглашение евразийского социализма"
lefteurasia.34.d: "Благодаря крупным реформам, проведённым левыми евразийцами, Евразия наконец стала такой, какой и должна быть. Сильное государство, где люди объединены принципами Свободы, Равенства и Братства и своим общим евразийским будущим. Доктрина, разработанная ПЛЕ с помощью союзников по коалиции, получила название Социализма с евразийской спецификой - синтеза евразийства и народничества. Евразийские народы пробудятся, и мир изменится."
lefteurasia.34.a: "Слава Председателю!"

lefteurasia.35.t: "Истинное творчество есть теургия"
lefteurasia.35.d: "«В истории, как и в природе, есть ритм, ритмическая смена эпох и периодов, смена типов культуры, приливы и отливы, подъёмы и спуски. Ритмичность и периодичность свойственны всякой жизни. Говорят об органических и критических эпохах, о ночных и дневных эпохах, о сакральных и секулярных эпохах. Нам суждено жить в историческое время смены эпох. Старый мир новой истории (которая по старой привычке ещё называет себя «новой») состарился и дряхл, приходит к концу и разлагается, а новый, ещё неизвестный мир рождается.\n\nИ замечательно, что этот конец старого мира и рождение нового одними воспринимается как «революция», а другими - как «реакция». «Революционное» и «реакционное» настолько смешались, что всякая отчётливость в употреблении этих терминов потеряна. Я условно обозначаю нашу эпоху как конец новой истории и начало новых средних веков. Я не предсказываю, по какому пути необходимо пойдёт история, а хочу лишь проблематически наметить идеальные черты и тенденции нового типа общества и культуры.\n\nРациональный день новой истории кончается, его солнце заходит, спускаются сумерки, мы приближаемся к ночи. Все категории уже пережитого солнечного дня непригодны. По всем признакам, мы вышли из дневной исторической эпохи и вошли в ночную. Это чувствуется самыми чуткими людьми.\n\nПлохо ли это, мрачно ли, пессимистично ли? Падают фальшивые покровы, и обнажается добро и зло. Ночь не менее прекрасна, чем день, не менее божественна, в ночи ярко сияют звёзды, в ночи бывают откровения, которых не знает день. Ночь изначальнее, стихийнее, чем день».\n\nНиколай Бердяев."
lefteurasia.35.a: "Новый евразийский гений!"

lefteurasia.36.t: "Просвещение начнётся"
lefteurasia.36.d: "Изначальная идеология евразийства предполагала новые просветительские меры по внедрению в население идей евразийства, рациональности и классической культуры. В общем, в идеале все граждане Евразии должны разделять ценности интеллигенции и безоговорочно подчиняться идеям евразийства. С приходом к власти левых евразийцев стратегию необходимо изменить. Якобсон был склонен полагать, что нация должна пройти через культурную революцию и быть просвещённой, но на этот раз идеями социализма и левого евразийства. Новая народническая культура должна стать ведущей в новом государстве, крестьянство должно объединиться под знаменем евразийства."
lefteurasia.36.a: "Социалистическая культура должна стать господствующей."

lefteurasia.37.t: "Новая веха"
lefteurasia.37.d: "Сегодня Евразийский союз изменился раз и навсегда. В совместной речи лидеры двух партий, левых евразийцев и левых эсеров, объявили об объединении двух партий в Партию левых социалистов-революционеров (евразийцев). Спиридонова и Мирский, теперь соответственно глава правительства и секретарь Союза, будут работать вместе, чтобы создать новую силу - рабочих и крестьян Евразийского союза, построенного на братстве народов, общей истории и великом будущем."
lefteurasia.37.a: "Герцен предвидел это."

lefteurasia.38.t: "Пролеткульт"
lefteurasia.38.d: "В комнату вошёл человек - молчаливый, но с взглядом решимости и самоотверженной веры в идею.\n«Садитесь, товарищ Богданов», - сказал Луначарский, - «Как дела с народным просвещением?»\n\nБогданов был главным идеологом так называемого большевистского Просвещения - Пролеткульта. В самом начале XX века Богданов говорил с Лениным о важности пролетарской культуры, её главной функции - пропаганде коллективизма и солидарности, необходимых для молодого социалистического государства. Во время Гражданской войны, в немногих местах, где большевистская власть была сильна, Богданов уже занимался Пролеткультом. Но с падением большевистской власти, как и другие, преданные идеям Ленина, Богданов уехал в Коммуну.\n\nТеперь, снова во главе Пролеткульта, Богданов уже пытался интегрировать евразийские идеи в мировоззрение пролетариата. К счастью, это было нетрудно из-за интернационального характера идеологии большевизма. Однако теперь самой важной частью этой интернациональности было самовосприятие советских граждан как новой нации евразийцев - государствообразующего класса на всём континенте."
lefteurasia.38.a: "«Народ просвещается, товарищ»."

lefteurasia.39.t: "Пролеткульт"
lefteurasia.39.d: "В уединённой обстановке кабинета Народного комиссара просвещения Луначарского Богданов чувствовал себя комфортно и спокойно. Портрет Ленина на стене - рядом с портретом Зиновьева. Красное знамя с крупной белой надписью: «Да здравствует Пролеткульт!».\n\nВ течение нескольких часов Богданов и Луначарский обсуждали всё новое, что должен был принести Пролеткульт, от переосмысления культурного эпоса прошлых эпох до возникновения нового слоя творческой элиты.\n\n«Важность распространения пролеткульта за рубежом, особенно в соседних странах, нельзя недооценивать, товарищ. И это не чисто внешнеполитический вопрос, это внутренний вопрос, поскольку эти территории, захваченные контрреволюцией, безусловно, являются неотъемлемой частью Евразийского союза. Рабочие и крестьяне, борющиеся за свои права на этих исконно советских землях, должны сначала быть просвещены идеями пролеткульта, и только затем - освобождены от вечного рабства капитала»."
lefteurasia.39.a: "«Вы безусловно правы, товарищ Богданов»."

lefteurasia.40.t: "Важный вопрос"
lefteurasia.40.d: "«Если бы товарищ Ленин был жив, он обязательно сказал бы что-нибудь чертовски умное!» - воскликнул Зиновьев.\n\n\nЭто было закрытое партийное собрание, одно из многих, проводимых в это время правящей элитой. Мирский и Зиновьев, теперь не просто союзники, но и идеологически равные в глазах простых граждан, должны были объединить свои две идеологии в одну. Однако весь вопрос, который мучил собрание, заключался в том, следует ли называть новую государственную систему евразийским большевизмом или большевистским евразийством. Конечно, никто из них не настаивал на каком-то одном варианте. Более того, этот вопрос, вероятно, касался только Зиновьева. Конечно, ни одно из названий не имело какого-либо конкретного значения. Они были эквивалентны и одинаково олицетворяли политику государства.\n\nВ конце концов, члены партии согласились, что новая государственная политика будет называться евразийским большевизмом. За это название, как и по всем остальным вопросам, партия проголосовала..."
lefteurasia.40.a: "Единогласно."



### Opposition events ###
eurasian_opposition.1.t: "Оппозиция"
eurasian_opposition.1.d: "Пыль улеглась, и новое руководство готовится к проведению первых реформ евразийского общества. Однако оппозиция нашему режиму всё ещё существует. Прежде чем мы начнём какие-либо реформы, мы должны убедиться, что оппозиция не помешает нам это сделать - наше правление всё ещё шатко. Мы должны начать операции против лидеров оппозиции."
eurasian_opposition.1.a: "Все против предателей!"

eurasian_opposition.2.t: "Операция «Красный принц»"
eurasian_opposition.2.d: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: ДМИТРИЙ ПЕТРОВИЧ СВЯТОПОЛК-МИРСКИЙ, РОДИЛСЯ 9 СЕНТЯБРЯ 1890 ГОДА\n\nМестонахождение объекта неизвестно с момента установления нового правительства. Лицо, похожее на объект, видели в Ямбурге в сопровождении женщины, вероятно, направляющееся к границе с Эстонией.\n\nАНАЛИЗ\nОбъект, хотя и является лидером политической организации «Левые евразийцы», возможно, не представляет угрозы для нынешнего правительства и пытается покинуть страну. Тем не менее, учитывая его контакты с левыми эсерами, объект может продолжать подрывную деятельность за рубежом. Его следует арестовать до побега, чтобы предотвратить дальнейшие социалистические действия."
eurasian_opposition.2.a: "Арестовать его."
eurasian_opposition.2.b: "Арестовать и казнить его."

eurasian_opposition.3.t: "Операция «Валькирия»"
eurasian_opposition.3.d: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: МАРИЯ АЛЕКСАНДРОВНА СПИРИДОНОВА, РОДИЛАСЬ 28 ОКТЯБРЯ 1884 ГОДА\n\nОбъект скрывается где-то в крестьянских районах Центральной России.\n\nАНАЛИЗ\nОбъект, хотя и является лидером запрещённой террористической организации «ПЛСР - Партия левых социалистов-революционеров», не представляет угрозы стабильности нашего правительства из-за низкой народной поддержки и подорванной репутации из-за связей с большевиками."
eurasian_opposition.3.a: "Арестовать её и её союзников."
eurasian_opposition.3.b: "Арестовать и казнить её и её союзников."

eurasian_opposition.4.t: "Операция «Ротмистр»"
eurasian_opposition.4.d: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: ЮРИЙ АЛЕКСЕЕВИЧ ШИРИНСКИЙ-ШИХМАТОВ, РОДИЛСЯ 12 СЕНТЯБРЯ 1890 ГОДА\n\nОбъект находится в Петрограде, предположительно не имея возможности бежать. Все известные места нахождения объекта в Петрограде будут скоро проверены, а объект немедленно арестован.\n\nАНАЛИЗ\nОбъект опасен, является лидером террористической организации «СРНМ - Союз Российских Национал-Максималистов», штабс-ротмистром Русской Императорской армии и Вооружённых сил Российской Республики (Stabs-Rittmeister). Объекта нельзя недооценивать, может быть вооружён и опасен."

eurasian_opposition.5.t: "Операция «Отец»"
eurasian_opposition.5.d.young: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: НИКОЛАЙ СЕРГЕЕВИЧ ТРУБЕЦКОЙ, РОДИЛСЯ 16 АПРЕЛЯ 1890 ГОДА\n\nОбъект находится в Петрограде, в своей квартире, не оказывает сопротивления.\n\nАНАЛИЗ\nПсихологическое состояние объекта спорно. Выявлены признаки посттравматического шока. Объект находился под домашним арестом."
eurasian_opposition.5.d.left: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: НИКОЛАЙ СЕРГЕЕВИЧ ТРУБЕЦКОЙ, РОДИЛСЯ 16 АПРЕЛЯ 1890 ГОДА\n\nОбъект находится в Петрограде, в своей квартире, не оказывает сопротивления.\n\nАНАЛИЗ\nПсихологическое состояние объекта спорно. Выявлены признаки посттравматического шока. Объект находился под домашним арестом."
eurasian_opposition.5.a: "Оставить беднягу в покое."
eurasian_opposition.5.b: "Конфисковать все его бумаги и оставить в покое."

eurasian_opposition.6.t: "Операция «Идеократ»"
eurasian_opposition.6.d.young: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: ПЁТР НИКОЛАЕВИЧ САВИЦКИЙ, РОДИЛСЯ 15 МАЯ 1895 ГОДА\n\nТекущее местонахождение объекта неизвестно. По последним данным, объект видели в Екатеринбурге.\n\nАНАЛИЗ\nОбъект известен как ведущий идеолог первоначальной Евразийской партии с сильной антисоциалистической позицией и, предположительно, сторонник более строгой дисциплины в партии. Объект, вероятно, не опасен для нынешнего режима и, скорее всего, бежит во Владивосток или Ургу."
eurasian_opposition.6.d.left: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: ПЁТР НИКОЛАЕВИЧ САВИЦКИЙ, РОДИЛСЯ 15 МАЯ 1895 ГОДА\n\nТекущее местонахождение объекта неизвестно. По последним данным, объект видели в Екатеринбурге.\n\nАНАЛИЗ\nОбъект известен как ведущий идеолог первоначальной Евразийской партии с сильной антисоциалистической позицией и, предположительно, сторонник более строгой дисциплины в партии. Объект может быть особенно опасен для нынешнего режима и, скорее всего, бежит в капиталистические, сильно антисоциалистические государства во Владивостоке или Урге."

eurasian_opposition.7.t: "Операция «Профессор»"
eurasian_opposition.7.d.young: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: ГЕОРГИЙ ВЛАДИМИРОВИЧ ВЕРНАДСКИЙ, РОДИЛСЯ 20 АВГУСТА 1887 ГОДА\n\nТекущее местонахождение объекта неизвестно. По последним данным, объект видели в Волгограде.\n\nАНАЛИЗ\nИзвестно, что объект является в основном профессором Пермского университета, хотя и был одним из лидеров первоначальной Евразийской партии. Объект не опасен для режима и известен своей правой риторикой и антисоциалистическими речами. В настоящее время объект, вероятно, покинет страну в страны Рейхспакта."
eurasian_opposition.7.d.left: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: ГЕОРГИЙ ВЛАДИМИРОВИЧ ВЕРНАДСКИЙ, РОДИЛСЯ 20 АВГУСТА 1887 ГОДА\n\nТекущее местонахождение объекта неизвестно. По последним данным, объект видели в Волгограде.\n\nАНАЛИЗ\nИзвестно, что объект является в основном профессором Пермского университета, хотя и был одним из лидеров первоначальной Евразийской партии. Объект не опасен для режима и известен своей правой риторикой и антисоциалистическими речами. В настоящее время объект, вероятно, покинет страну в страны Рейхспакта."

eurasian_opposition.8.t: "Операция «Кавказец»"
eurasian_opposition.8.d.young: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: КОНСТАНТИН АЛЕКСАНДРОВИЧ ЧХЕИДЗЕ, РОДИЛСЯ 19 СЕНТЯБРЯ 1897 ГОДА\n\nТекущее местонахождение объекта неизвестно, но ходят слухи, что он бежал в Горскую республику, в свой родной город Моздок в Алании.\n\nАНАЛИЗ\nОбъект является членом партии евразийцев с 1920 года, одним из лидеров с 1930 года. Объект сражался за белых в Гражданской войне и известен своей радикальной антисоциалистической позицией."
eurasian_opposition.8.d.left: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: КОНСТАНТИН АЛЕКСАНДРОВИЧ ЧХЕИДЗЕ, РОДИЛСЯ 19 СЕНТЯБРЯ 1897 ГОДА\n\nТекущее местонахождение объекта неизвестно, но ходят слухи, что он бежал в Горскую республику, в свой родной город Моздок в Алании.\n\nАНАЛИЗ\nОбъект является членом партии евразийцев с 1920 года, одним из лидеров с 1930 года. Объект сражался за белых в Гражданской войне и известен своей радикальной антисоциалистической позицией."

eurasian_opposition.9.t: "Операция «Немец»"
eurasian_opposition.9.d: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: РОМАН ОСИПОВИЧ ЯКОБСОН, РОДИЛСЯ 11 ОКТЯБРЯ 1896 ГОДА\n\nОбъект в настоящее время находится в стране, последний раз его видели у границы с Белой Русью.\n\nАНАЛИЗ\nОбъект является близким соратником Трубецкого и Савицкого, известен как левый, но остающийся в первоначальной Евразийской партии, воздерживающийся от контактов с террористической группой левых евразийцев. Объект может считаться тайным социалистом и, вероятно, продолжит антиправительственные действия за рубежом. Предпочтительнее арестовать."

eurasian_opposition.10.t: "Операция «Отродье»"
eurasian_opposition.10.d: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: ЛЕВ НИКОЛАЕВИЧ ГУМИЛЁВ, РОДИЛСЯ 18 СЕНТЯБРЯ 1912 ГОДА\n\nТекущее местонахождение объекта неизвестно, последний раз его видели в Оренбурге.\n\nАНАЛИЗ\nОбъект является лидером национал-максималистской военизированной террористической организации, диверсантом, радикальным антисоциалистом и близким соратником Савинкова. Объект пытается бежать, предположительно в Среднюю Азию или Монголию. Должен быть немедленно найден и арестован за измену."

eurasian_opposition.11.t: "Операция «Вождь»"
eurasian_opposition.11.d: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: БОРИС ВИКТОРОВИЧ САВИНКОВ, РОДИЛСЯ 19 ЯНВАРЯ 1879 ГОДА\n\nТекущее местонахождение объекта неизвестно, последний раз его видели в Тамбове.\n\nАНАЛИЗ\nОбъект чрезвычайно опасен, известен как давний террорист, революционер, организатор убийств высокопоставленных чиновников, создатель Боевых дружин и ультраправой партии НРПР. Объект, возможно, находится под охраной и вооружён."

eurasian_opposition.12.t: "Операция «Кадетка»"
eurasian_opposition.12.d.young: "Кому: ЮРИЮ АЛЕКСЕЕВИЧУ ШИРИНСКОМУ-ШИХМАТОВУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ПОНОМАРЁВА ИВАНА ИЛЬИЧА\n\nОбъект: АРИАДНА ВЛАДИМИРОВНА ТЫРКОВА-ВИЛЬЯМС, РОДИЛАСЬ 25 НОЯБРЯ 1869 ГОДА\n\nТекущее местонахождение объекта неизвестно, последнее сообщение было из Берлина.\n\nАНАЛИЗ\nИзвестно, что объект была бывшим членом Конституционно-демократической партии, позже работала в ОСВАГе Деникина, затем стала членом Евразийской партии. Британская подданная. Её влияние считается низким; объект не считается опасным."
eurasian_opposition.12.d.left: "Кому: ДМИТРИЮ ПЕТРОВИЧУ СВЯТОПОЛК-МИРСКОМУ.\n\nОт: НАЧАЛЬНИКА СОВЕТА ГОСУДАРСТВЕННОЙ БЕЗОПАСНОСТИ ВАКСИНА АЛЕКСАНДРА НИКОЛАЕВИЧА\n\nОбъект: АРИАДНА ВЛАДИМИРОВНА ТЫРКОВА-ВИЛЬЯМС, РОДИЛАСЬ 25 НОЯБРЯ 1869 ГОДА\n\nТекущее местонахождение объекта неизвестно, последнее сообщение было из Берлина.\n\nАНАЛИЗ\nИзвестно, что объект была бывшим членом Конституционно-демократической партии, позже работала в ОСВАГе Деникина, затем стала членом Евразийской партии. Британская подданная. Её влияние считается низким; объект не считается опасным."
eurasian_opposition.12.a: "Похоже, мы ничего не можем сделать."

eurasian_opposition.13.t: "Аристократ среди критиков"
eurasian_opposition.13.d: "До Мировой войны Дмитрий Мирский был типичным представителем интеллигенции «Серебряного века»: писал стихи и изучал восточные языки. Война всё изменила. Его мобилизовали, сослали на Кавказ за пацифистские речи, затем он воевал в Добровольческой армии Деникина, где познакомился с ротмистром Ширинским-Шихматовым.\n\nКогда пыль улеглась, он остался в России, преподавал в университете, будучи известным умным человеком среди поэтов и профессоров, судьёй русского модернизма. В 1920-х годах он выпустил «Историю русской литературы», которая вскоре стала бестселлером даже за границей и стала очень популярна в Кайзеррайхе. С 1922 года он присоединился к евразийскому движению, был основателем журнала «Вёрсты», почитателем Марины Цветаевой и близким другом её мужа Сергея Эфрона.\n\nМы никогда не узнаем, что было изначальным моментом эволюции его взглядов в сторону марксизма, но влияние Ширинского-Шихматова, который был национал-максималистом, сыграло значительную роль в этой эволюции.\n\nТеперь всё кончено. Но, возможно, это было началом чего-то нового. Мирский знал, что однажды он попадёт во Французскую Коммуну, к красным эмигрантам, где будет в безопасности. Он знал и другое: Россия однажды будет свободна. Свободна от национализма. Но пока, что ж. Его маленького убежища во Франкфурте будет достаточно, чтобы дождаться сил Коммуны..."
eurasian_opposition.13.a: "...Мировая революция близка."

eurasian_opposition.14.t: "Последний шанс для евразийской демократии"
eurasian_opposition.14.d: "Ариадне было почти 70. У неё была долгая и счастливая жизнь. Долгое время её считали потенциальным первым женским лидером России после последней императрицы. Талантливая, интеллектуальная, она видела ужасы Гражданской войны как журналист и мирную жизнь как либеральный политик. Она была в комфорте в Берлине, до войны, которая, безусловно, скоро начнётся. Она думала о переезде в далёкое место, например, в Австралазию, где не будет больше ужасов войны. Ариадна думала о своей Родине. Последняя надежда русского народа, которую она видела в евразийстве, угасла. Политики всегда делают неправильные вещи и всегда искажают идеологии в своих интересах."
eurasian_opposition.14.a: "Была ли она последней надеждой русской демократии?"

eurasian_opposition.15.t: "Визионер"
eurasian_opposition.15.d: "Трубецкой, как всегда, замкнулся в себе. Это он всё разрушил? Или он был спасителем нации? Он не знал. Его оставили одного. Его не арестовали, не бросили в тюрьму, как бедную собаку. Его просто оставили одного, среди его работ.\n\nЭто было плодом его многолетних трудов. Он никогда не хотел стать визионером нации, но, похоже, именно это он и стал. Визионер. Его идеи, хотя и переосмысленные, теперь являются идеологией нового государства. Государства, которое не имеет ничего общего с евразийством. Но таков был результат.\n\nТрубецкой стоял, глядя в окно. Люди гуляли по улицам, солдаты маршировали по Невскому проспекту, размахивая новыми знамёнами государства. Он вздохнул."
eurasian_opposition.15.a: "Его история закончилась."

eurasian_opposition.16.t: "Последний отъезд"
eurasian_opposition.16.d: "Пётр Савицкий стоял на холме, восхищённо глядя на великую русскую реку Амур. Наконец, другой берег. Хотя граница была далеко, он всё ещё не был очень уверен, что его не преследуют. Дикие степи Монголии, быстрая встреча с [MON.GetLeader], который позволил ему пересечь границу в Заамурье, теперь он был в безопасности. Последний отъезд был ещё впереди. Он не знал, надолго ли независимость Дальневосточной республики задержится здесь. Он знал, что грядёт Великая война, но, по крайней мере, он будет в безопасности во Владивостоке. Возможно, он будет преподавать там в университете или изучать дальневосточную культуру местных жителей. Или уплывёт в Японию или посетит Маньчжурию. Это была свобода как она есть.\n\nСавицкий посмотрел на часы. Поезд, отправляющийся из Хабаровска во Владивосток, был через час.\n\n«Пора отправляться на вокзал», - сказал он себе."
eurasian_opposition.16.a: "И затем он исчез..."

eurasian_opposition.17.t: "Знания"
eurasian_opposition.17.d: "Георгий Вернадский всегда был близок к науке. Его отец был известным исследователем, сам он был страстным любителем истории, профессором Пермского университета. В 1927 году у него также была возможность преподавать историю России в Йельском университете в США, но он вернулся в Россию 5 лет спустя, чтобы стать сенатором и помочь агитировать за Евразийскую партию на выборах 1932 года.\n\nЧто дальше? Сейчас в Киеве, гостеприимно принятый Скоропадским, затем в Берлине, опустошённом Чёрным понедельником. Было ли в мире место, где он был в безопасности? Он не знал. Что он знал, так это то, что он не сделал ничего плохого, но какая-то подсознательная паранойя была в его голове. Возможно, он будет продолжать заниматься тем, что у него получается лучше всего."
eurasian_opposition.17.a: "Преподавание русской истории."

eurasian_opposition.18.t: "Тихий город Моздок"
eurasian_opposition.18.d: "Чхеидзе вернулся в свой родной город. Ничего не изменилось с тех пор, как он был здесь в последний раз. Возможно, когда Пушкин, Лермонтов или Грибоедов посещали Моздок, всё было так же, как сейчас. Старые дома, нет электричества, водопровода, тротуаров или мостовой. Правительство Горской республики ничего не сделало для улучшения состояния города. Но, по крайней мере, это была его родина.\n\nЧхеидзе не собирался оставаться здесь надолго, он просто подумал, что должен посетить это место, когда для него всё закончилось в России. Он планировал переехать в Грузию - а затем уехать куда-нибудь ещё морем. Его политическая карьера была окончена. Его Родина была оккупирована радикалами. Его родной город был всего лишь остатками давно ушедшего прошлого."
eurasian_opposition.18.a: "«В Моздок я больше не ездок»."

eurasian_opposition.19.t: "«Хунну»"
eurasian_opposition.19.d: "Центральная Азия была землёй контрастов - пустыни, степи, горы, озёра, реки и... гунны.\n\nГумилёв вздохнул. Он проиграл. И теперь он никогда не вернётся на свою Родину. Он оставил там всё - свою молодость, свои статьи, которые никто не хотел публиковать, свою политическую карьеру, которая началась так ярко и закончилась так быстро, свою семью и друзей. Но у него был план. Он уедет в Монголию, где будет наконец в безопасности и сможет закончить свою книгу о Центральной Азии. Когда он закончит книгу, он сможет начать другую - а затем ещё одну. К тому времени марксистский режим России падёт. Он будет намного старше, но он вернётся и воссоздаст евразийство. Он называл себя Первым из евразийцев, хотя знал, что это неправда и довольно несправедливо. Но он имел в виду, что он был Первым из евразийцев, кто создал новое видение Евразии. Теперь всё кончено. Угасло во тьме красных знамён и извилистости марксизма, его Родина пала. И теперь он останется..."
eurasian_opposition.19.a: "...Последним из евразийцев."

eurasian_opposition.20.t: "Вторая волна красной эмиграции"
eurasian_opposition.20.d: "Мария вместе с Борисом и Исааком сидели в квартире где-то в центре Парижа. Из окна были видны красные знамёна, на некоторых из которых было изображено лицо [FRA.GetLeader]. Их долгий путь в новую столицу Мировой революции был нелёгким. Во всяком случае, они не знали, кто был таинственным спонсором их побега. Мария не хотела уезжать. Она не уехала во время Гражданской войны, когда была возможность, она не уехала в годы, когда её разыскивали. Однако теперь она ясно понимала, что должна выбирать - умереть неизвестной где-то в лесах Тобольска или продолжать нести этот крест - крест Валькирии Русской революции, символ сопротивления и надежду всех угнетённых."
eurasian_opposition.20.a: "Однажды я вернусь."

eurasian_opposition.21.t: "Ротмистр, окружён."
eurasian_opposition.21.d: "Ширинский-Шихматов знал, что они придут. Хотя он был обычным политиком, он был близким соратником Мирского. Но он был готов сражаться. Он был кавалерийским офицером, ротмистром Русской Императорской армии. И он умрёт как офицер.\n\n10 минут спустя он услышал топот ног. Группа неизвестного размера поднималась по лестнице.\n\n«Господин Ширинский-Шихматов? Мы знаем, что вы здесь», - сказал голос.\nЮрий ничего не ответил. Он нацелил винтовку на дверь.\n\n«Откройте дверь, или мы откроем её сами», - продолжал голос.\n\nМинуту спустя в комнату вошёл человек с чёрно-жёлтой повязкой на руке и револьвером в руке. Ротмистр выстрелил. Затем снова."
eurasian_opposition.21.a: "И затем он был застрелен."

eurasian_opposition.22.t: "«Красный принц?»"
eurasian_opposition.22.d: "«Да, так его называли...»\n\nДвое офицеров расхохотались. Перед ними стоял тот, над кем они смеялись. Коренастый мужчина, коротко остриженный и лысеющий, избитый и в наручниках.\n\n«Всё кончено, Красный принц», - продолжил тот, что повыше. На его руке красовалась чёрно-жёлтая повязка.\n\n«Тебя скоро отправят в Петроград. Там решат, что с тобой делать. Но знаешь что, Анатолий?» - повернулся он к более низкому. - «Я бы застрелил его прямо здесь, эту марксистскую мразь».\n\nМирскому было всё равно. Он знал, что для него всё кончено. В тихом городке у границы с Эстонией. Что бы ни случилось дальше - его не пощадят. Арест не лучше смерти. Он посмотрел на небо, которое становилось фиолетовым, и на начинающие мерцать звёзды."
eurasian_opposition.22.a: "Это был последний раз, когда он видел небо."

eurasian_opposition.23.t: "«Красный принц?»"
eurasian_opposition.23.d: "«Да, так его называли...»\n\nДвое офицеров расхохотались. Перед ними стоял тот, над кем они смеялись. Коренастый мужчина, коротко остриженный и лысеющий, избитый и в наручниках.\n\n«Всё кончено, Красный принц», - продолжил тот, что повыше. На его руке красовалась чёрно-жёлтая повязка.\n\n«Тебя скоро отправят в Петроград. Там решат, что с тобой делать. Но знаешь что, Анатолий?» - повернулся он к более низкому. - «Я бы застрелил его прямо здесь, эту марксистскую мразь».\n\nМирскому было всё равно. Он знал, что для него всё кончено. В тихом городке у границы с Эстонией. Что бы ни случилось дальше - его не пощадят. Арест не лучше смерти. Он посмотрел на небо, которое становилось фиолетовым, и на начинающие мерцать звёзды."
eurasian_opposition.23.a: "Это был последний раз, когда он видел небо."

eurasian_opposition.24.t: "Визионер"
eurasian_opposition.24.d: "Трубецкой, как всегда, замкнулся в себе. Это он всё разрушил? Или он был спасителем нации? Он не знал. Его оставили одного. Его не арестовали, не бросили в тюрьму, как бедную собаку. Его просто оставили одного, забрав его работы с собой.\n\nЭто было плодом его многолетних трудов. Он никогда не wanted to become a visionary of the nation, but it seems that it was the exact thing he became. A Visionary. Его идеи, хотя и переосмысленные, теперь являются идеологией нового государства. Государства, которое не имеет ничего общего с евразийством. Но таков был результат.\n\nТрубецкой стоял, глядя в окно. Люди гуляли по улицам, солдаты маршировали по Невскому проспекту, размахивая новыми знамёнами государства. Он вздохнул.\n\nКому нужна жизнь, где всё, что ты создал, даже если это было написано на бумаге, потеряно? Трубецкой встал на стул, затянул петлю на шее и упал."
eurasian_opposition.24.a: "Его история закончилась."

eurasian_opposition.25.t: "Визионер"
eurasian_opposition.25.d: "Трубецкой, как всегда, замкнулся в себе. Это он всё разрушил? Или он был спасителем нации? Он не знал. Его оставили одного. Его арестовали, бросили в тюрьму, как бедную собаку. Его просто оставили одного, забрав его работы с ними.\n\nЭто было плодом его многолетних трудов. Он никогда не хотел стать визионером нации, но, похоже, именно это он и стал. Визионер. Его идеи, хотя и переосмысленные, теперь являются идеологией нового государства. Государства, которое не имеет ничего общего с евразийством. Но таков был результат.\n\nОн был приговорён к 15 годам тюрьмы, далеко от Петрограда, без возможности записывать свои идеи. Это было намного хуже, чем быть застреленным там, в своей петроградской квартире, в тот день, когда его арестовали. Он не будет страдать. Но теперь ты ничего не можешь изменить. Он думал, что [ROOT.GetLeader], который когда-то был его соратником, помилует его. Но он не помиловал."
eurasian_opposition.25.a: "Его история закончилась."

eurasian_opposition.26.t: "Визионер"
eurasian_opposition.26.d: "Они пришли быстро. Слишком быстро, чтобы Трубецкой мог что-либо сделать. Но он ничего и не хотел. Он проиграл войну, он потерял всё, что любил - он не знал, где его друзья. Он медленно сходил с ума. Мужчина вошёл в комнату и приказал офицерам поставить «обвиняемого» на ноги, а затем приставить его к стене. Трубецкой посмотрел на лицо мужчины, которое было ему знакомо, но он не мог вспомнить его имя.\n\n«Трубецкой, Николай Сергеевич, властью, данной мне государством», - провозгласил мужчина, - «вы признаны виновным в измене Евразии».\n\nТрубецкой не мог поверить своим ушам.\n\n«Как вы смеете?! Я создал Евразию!..»\n\nНо мужчина прервал его.\n\n«Вы приговорены к смертной казни через расстрел».\n\nЧерез несколько секунд Трубецкой лежал мёртвый."
eurasian_opposition.26.a: "Его история закончилась."

eurasian_opposition.27.t: "Последний отъезд"
eurasian_opposition.27.d: "Внезапно поезд остановился. «Поезд не должен был останавливаться на этой станции», - подумал Савицкий. Он только что выехал из Ново-Николаевска в том, что, как он думал, было его последним отъездом к границам Монголии. За две остановки до границы он должен был выйти из поезда, ударить по шпалам и затем попытаться обойти пограничный контроль. Вот что он думал.\n\nЧерез несколько минут офицеры Совета государственной безопасности вошли в его купе, открыли складные двери. Один из них сказал.\n\n«Господин Савицкий? Вы арестованы. Вы будете экстрадированы в Ново-Николаевск»."
eurasian_opposition.27.a: "Останавливать целый поезд ради меня?"

eurasian_opposition.28.t: "Последний отъезд"
eurasian_opposition.28.d: "Савицкий вышел из поезда в сопровождении офицеров.\n«Что дальше, офицеры? Будем ждать следующий поезд?»\n\n«К сожалению, господин Савицкий, мы не ждём следующий поезд».\n\nЧерез несколько секунд Савицкий был в грузовике, направлявшемся в никуда. Но путь был коротким. Через 10 минут грузовик остановился. Савицкого вывели из грузовика.\n\n«Властью, данной мне государством», - провозгласил офицер, - «Вы признаны виновным в измене Евразии»."
eurasian_opposition.28.a: "Выстрел последовал."

eurasian_opposition.29.t: "Волга, Волга"
eurasian_opposition.29.d: "Вернадский надеялся скоро пересечь границу. Они не достанут его на казачьей земле. Затем он пересечёт границу с Украиной как беженец и найдёт лучшее место в Рейхспакте. Он ошибался.\n\nЗа несколько часов до [GetDateText] его арестовали в комнате в Волгограде, которую он снял на ночлег. Кто-то знал, что он здесь остановился. «Не надо было доверять той женщине внизу», - подумал Вернадский.\n\nТем не менее, он думал, что всё будет хорошо. Конечно, ему было опасно оставаться в стране, но его отец - известный учёный. Он также является видным профессором. Его арестуют, но вскоре отпустят. Так не обращаются с людьми, которые даже не являются оппозицией.\n\n«Я ухожу», - повторял он снова и снова офицерам. Но они не слушали, они просто делали свою работу. В следующие несколько дней Вернадский вернулся в Петроград."
eurasian_opposition.29.a: "А затем был суд."

eurasian_opposition.30.t: "Волга, Волга"
eurasian_opposition.30.d: "Вернадский надеялся скоро пересечь границу. Они не достанут его на казачьей земле. Затем он пересечёт границу с Украиной как беженец и найдёт лучшее место в Рейхспакте. Он ошибался.\n\nЗа несколько часов до [GetDateText] его арестовали в комнате в Волгограде, которую он снял на ночлег. Кто-то знал, что он здесь остановился. «Не надо было доверять той женщине внизу», - подумал Вернадский.\n\nТем не менее, он думал, что всё будет хорошо. Конечно, ему было опасно оставаться в стране, но его отец - известный учёный. Он также является видным профессором. Его арестуют, но вскоре отпустят. Так не обращаются с людьми, которые даже не являются оппозицией.\n\n«Я ухожу», - повторял он снова и снова офицерам. Но они не слушали, они просто делали свою работу. В следующие несколько дней Вернадский вернулся в Петроград. А затем был суд."
eurasian_opposition.30.a: "А после суда ничего не было."

eurasian_opposition.31.t: "Бумажная душа"
eurasian_opposition.31.d: "«Я всего лишь бумажная душа. Я никогда не был лидером. Я никогда не планировал каких-либо действий, угрожающих государству».\n\n«Мы это уже много раз слышали, господин Якобсон. Не могли бы вы ещё раз описать ваши отношения с Трубецким и Савицким?»\n\n«Они были моими старыми друзьями. Но клянусь, я не знаю, где они. Я также не планировал никаких антиправительственных действий. Никто из нас не планировал. Мы ушли от этого».\n\n«Хорошо, господин Якобсон. Я вас хорошо понял. Но... согласно Декрету №17 [ROOT.GetLeader], все высокопоставленные чиновники первоначальной Евразийской партии должны быть арестованы. Ваша дальнейшая судьба будет решена судом».\n\n«Я всего лишь бумажная душа, офицер...»"
eurasian_opposition.31.a: "...и я всегда склонялся влево...'"
eurasian_opposition.31.b: "...и я всегда был против социалистов...'"

eurasian_opposition.32.t: "«Дорогой Дмитрий Петрович,"
eurasian_opposition.32.d: "Арест двух людей, которые единственные близки мне, наносит мне удар, который я больше не могу вынести. Я прошу вас, Дмитрий Петрович, вернуть мне моего сына, я уверена, что никто об этом никогда не пожалеет..."
eurasian_opposition.32.a: "Искренне ваша, А. Ахматова'"

eurasian_opposition.33.t: "Последний из..."
eurasian_opposition.33.d: "Всё было уже кончено, когда он покинул Петроград, оставив там всё, что у него было. Спасаясь бегством куда? В анархию среднеазиатской степи? В хаос Монголии? Ему предстояло так много сделать в жизни... писать научные статьи, стать профессором, как Вернадский, изучать различные этнические группы. Но он выбрал то, что выбрал. Политику. Мечты о Евразийской нации, объединённой под единым чёрно-жёлтым знаменем с пучком стрел, направленных в противоположные стороны.\n\n«Чёрт возьми. Мне только 25. Я ничего не знаю о мире».\n\nУ Гумилёва были определённые связи - через 5 минут он должен выйти из комнаты, спуститься по лестнице и покинуть здание. Он должен проехать по Николаевской улице и повернуть налево у Старообрядческой церкви. Там должен быть грузовик. Он должен забраться в кузов грузовика и два раза постучать. Через несколько часов он будет в Казахстане.\n\nГумилёв оделся, вышел из здания и повернул налево у Старообрядческой церкви. Грузовика не было. Но был человек. Человек с пистолетом. Он прицелился в Гумилёва и выстрелил три раза."
eurasian_opposition.33.a: "И через несколько секунд всё было кончено."

eurasian_opposition.34.t: "Бледный конь"
eurasian_opposition.34.d: "Савинков никогда не был тем человеком, за которого его все принимали. Социалист? Никогда. Террорист? Да. Революционер? Вероятно. Он сам никогда не knew, кто он. Ропшин, автор романа, в котором все его идеалы разбиты? Он никогда не был человеком сильного характера, чётко определённой идеологии. История сделала так, что он создал самую большую партию в стране, но знал ли он на самом деле, что делать со всей этой властью? Не ему было отвечать на этот вопрос. Много десятилетий спустя люди будут говорить о нём, изучать его биографию и строить теории о том, кем он был на самом деле.\n\nСлужба безопасности знает, где он находится, и скоро он будет арестован. Это было единственным, что имело значение. И он никогда не сдастся. Бежать было некуда, поэтому Савинков приготовил свой пистолет к действию. Когда Агнец снял четвёртую печать, я услышал голос четвёртого животного, говорящего: «Иди». Я взглянул, и вот, бледный конь, и имя сидящему на нём - смерть;"
eurasian_opposition.34.a: "и ад следовал за ним."

eurasian_opposition.35.t: "Подрезая крылья"
eurasian_opposition.35.d: "«Военная коллегия Верховного суда Евразии признаёт Марию Александровну Спиридонову виновной в том, что обвиняемая «до дня своего ареста состояла в объединённом эсеровском центре и организовывала террористические и вредительские группы в Уфе, Нижнем Новгороде, Тобольске, Самаре и других городах для развёртывания широкой контрреволюционной террористической деятельности. Решение Военной коллегии обжалованию не подлежит. Суд приговаривает Спиридонову к 25 годам тюремного заключения».\n\nСпиридонова не слушала. Вместе с другими подсудимыми, её близкими союзниками, среди которых были Борис Камков, Исаак Штейнберг и другие, она просто гордо и решительно смотрела в глаза прокурору. Она знала, что невиновна и что крестьяне однажды освободятся. Вся эта эпопея с интеллигенцией и евразийством была для неё новой, и её связи с Мирским не закончились ничем хорошим. Она знала, что были некоторые серьёзные тактические ошибки в операциях левых эсеров. Она думала, что они, вероятно, проиграли в тот период Русской революции, когда они сначала объединились с большевиками, которые предательски их предали. Тем не менее, что сделано, то сделано. Она знала, что это конец.\n\nОднажды крестьяне и рабочие будут гораздо свободнее и гораздо сознательнее. В тот день произойдёт последняя Русская революция. И её будут помнить."
eurasian_opposition.35.a: "Этот день настанет."

eurasian_opposition.36.t: "Трагедия для революции?"
eurasian_opposition.36.d: "«Заключённые, стройтесь, руки за голову!»\nОпричник громко закричал на заключённых тюрьмы в пригороде Орла.\n\n«Я должен сообщить вам печальные новости. Из центральных органов власти поступило решение о невозможности вашего содержания в Орловской тюрьме. Поступали сообщения о якобы плохих условиях содержания и требованиях о переводе в другие места лишения свободы. К сожалению, правительство не может обеспечить ваш перевод. Нам пришлось принять это трудное решение и взять на себя эту ответственность. Думаю, вы уже понимаете, о чём идёт речь. Вы будете переведены в другое место, это правда. Борис, пожалуйста, инициируйте перевод».\n\nГоворят, что той ночью они слышали выстрелы. Некоторые даже говорили, что насчитали ровно 151 выстрел. Неизвестно, правда это или нет, но в любом случае, многие жители близлежащих деревень знали, что той ночью в тюрьме под Орлом, кажется, стало на 151 заключённого меньше."
eurasian_opposition.36.a: "Они, должно быть, ослышались."

eurasian_opposition.37.t: "Последние из нас"
eurasian_opposition.37.d: "Больше нет оппозиции нашему режиму. Теперь ничто не может помешать нам реализовать нашу политику в жизни."
eurasian_opposition.37.a: "Великолепно!"



### Decisions ###
RUS_Council_Of_Five_decision_category: "Council of Five"
RUS_Council_Of_Five_decision_category_desc: "Главенство Евразийской партии состоит из 5 влиятельных фигур.\nВ центре - §gНиколай Трубецкой§!, §gПётр Савицкий§! и §gГеоргий Вернадский§!. Они стремятся укрепить партийное единство и расширить влияние Евразийской партии в политической атмосфере страны.\n\nСлева - §RДмитрий Мирский§!, который пытается использовать раскол в партии в свою пользу, двигаясь радикально влево - к социалистическим доктринам. Пускай он и держит намерения в секрете, уже во всю ходят слухи о его связях с социалистическими партиями.\n\nСправа - §8Юрий Шихматов§!, лидер Союза евразийской молодежи, или Национал-Максималистов. Он выступает за радикальное преобразование Союза, которое включает в себя националистическую политику России, подавление меньшинств, демократических прав и институтов.\n\nПоскольку оба члена Совета пытаются дестабилизировать партию и продвигать свои идеологии, кажется, что единственный способ для Центра сохранить власть в их руках - действовать более радикально.\n\n                                                 §XАВТОРИТЕТ & ВЛИЯНИЕ:§!\n\n                           §RДмитрия Мирского§!      §P»§!   §X(§! [?RUS.LeftEurAuthority|W] §X)§!   [GetLeftEurAuthority]\n                                §NЛевых Эсеров§!           §P»§!   §X(§! [?RUS.LeftEurPLSRSupport|W] §X)§!   [GetLeftEurLeftSRSupport][GetLeftEurSocialistSupport]\n\n                                       §PЦентра§!                  §P»§!   §X(§! [?RUS.OrthEurAuthority|W] §X)§!   [GetOrthEurAuthority]\n                             §MРомана Якобсона§!        §P»§!   §X(§! [?RUS.OrthEurJakobsonAuthority|W] §X)§!   [GetOrthEurJakobsonAuthority]\n                         §5Ариадны Тырковой§!      §P»§!   §X(§! [?RUS.OrthEurTyrkovaAuthority|W] §X)§!   [GetOrthEurTyrkovaAuthority]\n                        §CКонстантина Чхеидзе§!    §P»§!   §X(§! [?RUS.OrthEurChkheidzeAuthority|W] §X)§!   [GetOrthEurChkheidzeAuthority]\n                         §gНиколая Трубецкого§!    §P»§!   §X(§! [?RUS.OrthEurTrubetzkoyAuthority|W] §X)§!   [GetOrthEurTrubetzkoyAuthority]\n                         §gГеоргия Вернадского§!    §P»§!   §X(§! [?RUS.OrthEurVernadskyAuthority|W] §X)§!   [GetOrthEurVernadskyAuthority]\n                             §LПетра Савицкого§!        §P»§!   §X(§! [?RUS.OrthEurSavitskyAuthority|W] §X)§!   [GetOrthEurSavitskyAuthority]\n\n                            §8Юрия Шихматова§!       §P»§!   §X(§! [?RUS.YoungEurAuthority|W] §X)§!   [GetYoungEurAuthority]\n                              §FСавинковистов§!          §P»§!   §X(§! [?RUS.YoungEurNationalistSupport|W] §X)§!   [GetYoungEurNationalistSupport]\n"

RUS_Connections_With_Left_SRs: "Установить связи с левыми эсерами"
RUS_Connections_With_Left_SRs_desc: "Из-за левых тенденций Мирского он ищет поддержки самой радикальной социалистической группы в стране - подпольной организации ПЛСР. Поскольку левые эсеры находятся в изгнании или в подполье, связь с ними затруднена."

RUS_Increase_Influence_Of_Roman_Jakobson: "Увеличить влияние Романа Якобсона"
RUS_Increase_Influence_Of_Roman_Jakobson_desc: "Роман Осипович Якобсон, хотя пока и не присоединяется открыто к левым евразийцам, является гораздо более левым, чем его коллеги по Центру, поэтому ничто не мешает Мирскому взаимодействовать с ним."

RUS_Enlist_Duma_Socialist_Support: "Заручиться поддержкой социалистических партий Думы"
RUS_Enlist_Duma_Socialist_Support_desc: "Левые партии Думы могут поддержать наше движение, особенно в ситуации их меньшинства в парламенте. Если мы заручимся их поддержкой, мы сможем добиться большего успеха в свержении нынешнего режима."

RUS_Advocate_Party_Unity: "Выступать за единство партии"
RUS_Advocate_Party_Unity_desc: "Сила в единстве, которого сейчас не хватает Евразийской партии. Мы должны продвигать единство партии среди наших последователей, чтобы предотвратить дальнейший раскол."

RUS_Supress_Left_Eurasianists_Influence: "Подавить левые настроения"
RUS_Supress_Left_Eurasianists_Influence_desc: "Левое влияние становится всё сильнее. Трат Pолитической власти на подавление левых взглядов, мы можем быть уверены, что их авторитет в Евразийской партии будет низким, хотя это, возможно, одновременно увеличит правое влияние."

RUS_Supress_Right_Eurasianists_Influence: "Подавить правые настроения"
RUS_Supress_Right_Eurasianists_Influence_desc: "Влияние национал-максималистов растет, поскольку они всё ещё являются официальной молодёжной организацией нашей партии. Даже если мы перестали их спонсировать, их авторитет всё ещё высок. Подавляя националистические настроения, мы можем быть уверены, что они не расширят свою сферу влияния в партии, но мы можем одновременно увеличить левое влияние."

RUS_Enlist_NRPR_Support: "Заручиться поддержкой НРПР"
RUS_Enlist_NRPR_Support_desc: "НРПР - это крайне правая партия в Думе, возглавляемая экспрессивным и харизматичным лидером. Влияние партии очень велико. При поддержке НРПР мы можем легко победить."
RUS_Enlist_NRPR_Support_1: "Заручиться поддержкой НРПР"
RUS_Enlist_NRPR_Support_1_desc: "После захвата власти национал-максималистами партия НРПР Савинкова стала основным игроком на политической арене государства. При их поддержке мы можем быть уверены, что наша страна стабильна, а правительство популярно."

RUS_Enlist_Savitsky_Support: "Заручиться поддержкой Петра Савицкого"
RUS_Enlist_Savitsky_Support_desc: "Один из главных идеологов Евразийской партии, Пётр Савицкий, считается более правым, чем его коллеги. Заручившись его поддержкой для дела национал-максималистов, мы можем обеспечить большую поддержку."
RUS_Enlist_Savitsky_Support_1: "Заручиться поддержкой Петра Савицкого"
RUS_Enlist_Savitsky_Support_1_desc: "Один из главных идеологов Евразийской партии, Пётр Савицкий, считается более правым, чем его коллеги. Заручившись его поддержкой для дела национал-максималистов, мы можем обеспечить большую поддержку."

RUS_Equiping_The_Paramilitaries: "Оснащение военизированных формирований"
RUS_Equiping_The_Paramilitaries_desc: "Поскольку раскол в партии становится всё более очевидным, пришло время начать вооружать и оснащать радикальные военизированные группы."

RUS_Frustrate_The_Party_Unity: "Подорвать единство партии"
RUS_Frustrate_The_Party_Unity_desc: "С окончательным расколом в партии пришло время действовать решительно. Руководство Партии делает вид, что всё в порядке, поэтому мы должны сделать всё возможное, чтобы разрушить образ партийного единства."

RUS_Condemn_The_Radicals: "Осудить радикалов"
RUS_Condemn_The_Radicals_desc: "Общество радикализировано. Экстремисты из левых евразийцев и национал-максималистов пытаются подорвать нашу силу и единство. Мы должны осудить действия радикалов, поскольку они опасны для Евразийской демократии."


RUS_New_Eurasian_Capital: "Выбрать новую столицу Евразии"
RUS_New_Eurasian_Capital_desc: "Правительство предлагает перенести нашу столицу подальше от границ с Западом - ближе к азиатской части нашей страны, или даже дальше - в саму азиатскую часть. Это также укрепит идеологическое восприятие нашего государства гражданами."


### Dealing with opposition ###
RUS_persecuting_eurasian_opposition: "Судьба оппозиции"
RUS_persecuting_eurasian_opposition_desc: "После окончательного решения вопроса о руководстве пришло время начать обеспечивать наше правление. Даже несмотря на то, что результаты недавних событий помогли нам установить наше влияние в Евразийском союзе, оппозиция нашему режиму всё ещё действует, делая наше правление небезопасным из-за внутренних угроз.[GetLeftistOpposition][GetCentristOpposition][GetRightistOpposition]"

RUS_end_opposition_repressions: "Прекратить репрессии против оппозиции"
RUS_end_opposition_repressions_desc: "Поскольку большинство лидеров оппозиции находятся в изгнании, арестованы или казнены, пришло время прекратить операции и сосредоточиться на внутренней политике."

