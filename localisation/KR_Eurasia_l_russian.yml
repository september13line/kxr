### Ideas ###
RUS_sponsor_combat_squads: "Расширение боевых дружин"
RUS_sponsor_combat_squads_1: "Нацгвардия"

RUS_rule_of_intelligentsia_center: "Правление интеллигенции"
RUS_rule_of_intelligentsia_left: "Правление интеллигенции: относительно §Mлевого уклона§!"
RUS_rule_of_intelligentsia_left_2: "Правление интеллигенции: умеренно §Mлевого уклона§!"
RUS_rule_of_intelligentsia_left_3: "Правление интеллигенции: значительно §Mлевого уклона§!"
RUS_rule_of_intelligentsia_right: "Правление интеллигенции: относительно §Fправого уклона§!"
RUS_rule_of_intelligentsia_right_2: "Правление интеллигенции: умеренно §Fправого уклона§!"
RUS_rule_of_intelligentsia_right_3: "Правление интеллигенции: значительно §Fправого уклона§!"

RUS_eurasianist_intellectualism: "Мыслить как интеллигенция"
RUS_eurasianist_intellectualism_desc: "Евразийцы по большей части учёные и творцы - они обожают научные исследования, авангардизм в искусстве и литературе и все прочие проявления модернизма в обществе. Позиционируя себя как люди из народа, они стремятся сделать интеллигенцию самым широким социальным классом в Евразийском союзе, избавляясь от «простых рабочих, крестьян и мелкой буржуазии» через образование, ликвидацию неграмотности и пропаганду своих идеалов."

RUS_eurasianist_passports: "Евразийские паспорта"
RUS_eurasianist_passports_desc: "Система идентификации с помощью внутренних паспортов, которая позволяет идентифицировать каждого гражданина Евразии, делает наше общество более стабильным, единым и защищённым. Более того, евразийское гражданство и евразийская национальность усиливают идеологическое влияние на наше население."

RUS_six_year_plan: "Шестилетний план"
RUS_six_year_plan_desc: "Наша страна начала шестилетний экономический план, который должен помочь нам индустриализировать страну и сделать нашу экономику стабильной и сильной, чтобы конкурировать с другими мировыми державами."

RUS_Royal_Constitution_idea: "Королевская конституция"
RUS_Royal_Constitution_idea_desc: "Принята новая Конституция Евразийской империи, которая значительно расширила власть Сената и сделала наше королевское и аристократическое руководство легитимным."

RUS_legacy_ROVS: "Наследие РОВС"

RUS_krestostrel: "Звезда и Меч"
RUS_krestostrel_desc: "Звезда и Меч - наш новый национальный символ, который представляет максимальный евразийский простор - «Местопространство» нашей нации. Под чёрно-жёлтым знаменем Звезды и Меча наша нация пребудет вечно и принесёт свободу и новое сознание народам Евразии."

RUS_krestostrel_2: "Тёмное Небо Евразии"
RUS_krestostrel_2_desc: "Звезда и Меч - это не только символ максимального евразийского простора. Это также Звезда Чингисхана в Тёмном Небе Евразии - путеводная звезда. И пока другие нации будут агонизировать под devastation, принесённой Западными державами - будь то экономической, политической или культурной - мы будем стремиться завоевать Местопространство, которое мы заслуживаем."

RUS_new_oprichnina: "Новая опричнина"
RUS_new_oprichnina_desc: "Новая опричнина была создана - специальные территории или целые регионы, находящиеся под прямым контролем Национал-максималистской партии, с особым статусом. Граждане, проживающие на этих территориях, будут служить государству, и будет сформировано специальное вооружённое подразделение опричников."

RUS_NRPR_coalition_1: "Синкретизм НРПР"
RUS_NRPR_coalition_1_desc: "Мы приняли идеологию НРПР и Савинкова, объединив её с политикой национал-максималистов. Этим мы обеспечили коалицию между нашими партиями и укрепили наше Государство."

RUS_solidarist_coalition_1: "Евразийский солидаризм"
RUS_solidarist_coalition_1_desc: "Мы приняли идеологию солидаристов, объединив её с политикой национал-максималистов. Этим мы обеспечили коалицию между нашими партиями и укрепили наше Государство."

RUS_esm: "ЕСМ"
RUS_esm_desc: "«Евразийский Союз Молодёжи» - это политическая организация, в которой теперь участвует молодое поколение граждан Евразии от 14 до 18 лет. Организация стремится воспитать новое поколение граждан, которые будут преданы идеям евразийства и национал-максимализма."

RUS_sovereign_democracy: "Суверенная демократия"

RUS_oprichnina_state_modifier: "£pol_idea Государство опричнина"
RUS_new_eurasian_capital_modifier: "£pol_idea Новая евразийская столица"

RUS_Left_Eurasian_Coalition: "§VПЛСР§!-§RПЛЕ§!-§MСЕРП§! Статус коалиции: [GetLeftEurCoalitionStatus]"
RUS_Left_Eurasian_Coalition_desc: "[GetLeftEurCoalitionDesc]"
RUS_Left_Eurasian_Coalition_stable_desc: "Коалиция между тремя теперь основными партиями левых эсеров, левых евразийцев и СЕРП обеспечена. Несмотря на противоречия между Романом Якобсоном и Марией Спиридоновой, теперь они работают вместе в правительстве, хотя едва терпят друг друга."
RUS_Left_Eurasian_Coalition_very_stable_desc: "Коалиция теперь такая, какой и должна быть в представлении Мирского: Спиридонова и Якобсон работают вместе, чтобы обеспечить богатое и стабильное будущее гражданам Евразийского союза. Кажется, ничто не может угрожать этому благословенному союзу..."
RUS_Left_Eurasian_Coalition_unstable_desc: "Коалиция между тремя теперь основными партиями начинает трещать по швам. Хотя их точки зрения почти схожи, борьба за власть между левыми эсерами и СЕРП разрывает союз."
RUS_Left_Eurasian_Coalition_very_unstable_desc: "Коалиция оказалась великой катастрофой: однажды объединённые Мирским в союз, левые эсеры и СЕРП теперь открыто критикуют друг друга и пытаются отхватить всё себе. Неизвестно, как долго просуществует коалиция..."

RUS_National_Maximalism: "§VНационал-максималистская§! политика"
RUS_National_Maximalism_desc: "Шихматов теперь свободен проводить свои радикальные реформы Евразийского союза."

RUS_National_Maximalism_4: "Тотализм с евразийской спецификой"
RUS_National_Maximalism_4_desc: "Первоначальные реформы национал-максималистов завершены, и теперь Евразийский союз одобряет свой собственный путь к социализму. Хотя критики (если они ещё существуют) утверждают, что это всего лишь более эзотерический, но типичный тоталистский способ управления, нашему народу нравится наша партия и руководство."

RUS_Unpopular_Regime: "Непопулярный режим"
RUS_Unpopular_Regime_desc: "Левые евразийцы вышли из Евразийской партии, которая в большинстве своём имела правых сторонников. Хотя значительная часть интеллигенции поддерживала Мирского, население, голосовавшее за евразийцев, чувствует себя обманутым. Потребуется время и усилия, чтобы добиться успеха в наших социалистических реформах, чтобы наше правительство стало по-настоящему популярным."

RUS_church_of_all_religions: "Церковь всех религий"

RUS_religious_opposition: "Религиозная оппозиция"
RUS_religious_opposition_desc: "С созданием Церкви всех религий простые люди не доверяют ей и считают, что действия правительства кощунственны и незаконны. Пройдёт время, прежде чем они поймут необратимость этих действий и то, что они правы."

RUS_Eurasian_Bolsheviks: "§VПолитика левых эсеров§!"
RUS_Eurasian_Bolsheviks_desc: "Спиридонова и Штейнберг теперь свободны проводить свои радикальные реформы Евразийского союза, конечно, в согласии с евразийцами."

RUS_Eurasian_Bolsheviks_4: "Эсеровское евразийство"
RUS_Eurasian_Bolsheviks_4_desc: "Первоначальные реформы левых эсеров завершены, и теперь Евразийский союз одобряет свой собственный путь к социализму. Хотя критики (если они ещё существуют) утверждают, что это всего лишь типичная эсеровская идеология, нашему народу нравится наша партия и руководство."

RUS_Bolshevist_Enlightenment: "Социалистическое просвещение"
RUS_Bolshevist_Enlightenment_desc: "С новой эрой Просвещения Якобсон и СЕРП стремятся к более успешной интеграции граждан и новых освобождённых рабочих в евразийство, делая их гордыми и счастливыми жить в Союзе.\n§W--------------\nСредний уровень лояльности для интеграции: [?RUS.rus_core_integration_cost_compliance|Y3]\nВремя интеграции: [?RUS.rus_core_integration_time_to_remove|Y0] дней"

RUS_eurasian_popular_front: "Евразийский народный фронт"
RUS_eurasian_popular_front_desc: "Социалисты всей Евразии, объединяйтесь!"

bolshevist_change_tooltip: "Изменить §HСоциалистическое просвещение§! на\nСредний уровень лояльности для интеграции: §G-5%§!\nВремя интеграции: §G-5%§!\nЕжедневный прирост политической власти: §G+0.1§!\nСтабильность: §G+5%§!\nПоддержка войны: §G+5%§!\n"
bolshevist_1_change_tooltip: "Изменить §HСоциалистическое просвещение§! на\nСредний уровень лояльности для интеграции: §G-5%§!\nВремя интеграции: §G-5%§!\nСтабильность: §G+5%§!\nПоддержка войны: §G+5%§!\n"
bolshevist_3_change_tooltip: "Изменить §HСоциалистическое просвещение§! на\nСредний уровень лояльности для интеграции: §G-10%§!\nВремя интеграции: §G-10%§!\nЕжедневный прирост политической власти: §G+0.15§!\n"
