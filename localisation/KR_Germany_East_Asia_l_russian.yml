GEA_flush_budget: "Здоровый бюджет"
GEA_flush_budget_desc: "Состояние нашего бюджета улучшилось и теперь превосходит даже докризисный уровень."
GEA_colonial_disaster_idea: "Колониальные волнения"
GEA_colonial_disaster_idea_desc: "Последствия Чёрного понедельника оказались катастрофическими, и восстания распространяются по всем нашим колониям."
GEA_colonial_instability_idea: "Колониальная нестабильность"
GEA_colonial_instability_idea_desc: "Мы предприняли усилия для установления контроля над ситуацией, однако колонии по-прежнему остаются нестабильными."
GEA_Infrastructural_Effort_Idea: "Экономическая сфера Остазии"
GEA_Infrastructural_Effort_Idea_desc: "Благодаря улучшению инфраструктуры связи между нашими колониями стали крепче, чем когда-либо."
GEA_Colonial_Nation: "Колониальное правительство"
GEA_Colonial_Nation_desc: "Созданная в ходе стремительной экспансии 1920-х годов Германская Восточная Азия по сути представляет собой подразделение Кайзерлихе Марине, связанное с несколькими территориями. Адмиралтейство в [GetNameGEASingapore] существует не как правительство и даже формально не как орган власти, а скорее как юрисдикция - обширная территория, где относительно беспристрастному Адмиралтейству приходится одновременно балансировать между местными интересами, различными колониальными системами и обеспечивать защиту всего этого."
GEA_Local_Guard_Idea: "Местная гвардия"
GEA_Local_Guard_Idea_desc: "Мы разрешили местным монархам набирать собственную королевскую гвардию."
