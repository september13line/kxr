### Ideas ###
GEA_colonial_nation:0 "Колониальное правительство"
GEA_colonial_nation_desc:0 "Несмотря на ограниченную самостоятельность в отношениях с соседями, Германская Восточная Азия фактически остаётся колониальным правительством. Весь её государственный аппарат опирается на германскую власть и поддерживается ею, бюджет составляется в Берлине, а валюта привязана к германской марке."
GEA_colonial_question:0 "Колониальный вопрос"
GEA_colonial_question_desc:0 "Численность людей, которых способны набрать наши сухопутные силы, серьёзно ограничена. Строгие правила приёма иностранных подданных на службу и общее нежелание местного населения вступать в наши ряды мешают попыткам создать более крупную армию."
GEA_prussian_force:0 "Прусская мысль"
GEA_prussian_force_desc:0 "Было решено, что местные жители недостойны служить великому адмиралу или кайзеру. Это серьёзно ограничит возможности набора, зато позволит повысить качество наших солдат."
GEA_local_troops:0 "Опора на местные силы"
GEA_local_troops_desc:0 "Как бы нам ни хотелось обратного, германских людских ресурсов попросту недостаточно для формирования всех необходимых новых частей. Нам придётся набирать местных, независимо от того, насколько сильно они не любят нас, а мы - их."
GEA_admirality:0 "Великое Адмиралтейство"
GEA_admirality_desc:0 "Германская Восточная Азия - земля, над которой безраздельно господствует флот. Великая армада, находящаяся под командованием [GEA.getleader], является одной из самых могучих, какие когда-либо видел мир. Наши плавучие крепости защищают этот тропический рай от восстаний и иностранных захватчиков, охраняя жемчужину азиатской сферы Кайзеррейха. Эти земли склонны к сепаратизму и радикализму, однако благодаря мощи флота остаются в безопасности и исключительно в германских руках, а потому военно-морские силы являются нашим высшим приоритетом. Всё, что наша страна способна выделить, идёт на содержание этого великолепного флота, ведь без него мы неизбежно погрузились бы в хаос и дикость. И пусть такое первенство флота вредит другим областям государства, нашим морским волкам до этого нет дела - ведь наша жизнь принадлежит морю!"
GEA_language:0 "Германский стандарт"
GEA_language_desc:0 "Мы реорганизовали наши вооружённые силы, включив в них местных жителей и обеспечив, чтобы каждый унтер-офицер, офицер и командир свободно владел немецким языком и мог эффективно руководить теперь уже объединёнными войсками."
GEA_counter_insurgency:0 "Миттельафриканские советники"
GEA_counter_insurgency_desc:0 "Применение обычных и «необычных» методов, разработанных теми, кому приходилось сражаться в суровых условиях Африки, обеспечило нашим войскам необходимое преимущество."
GEA_black_monday_idea:0 "Чёрный понедельник"
GEA_black_monday_idea_desc:0 "Чёрный понедельник обрушился на нас и парализовал и без того слабую промышленность."
GEA_black_monday_idea2:0 "Восстановление после Чёрного понедельника"
GEA_black_monday_idea2_desc:0 "Чёрный понедельник обрушился на нас и парализовал и без того слабую промышленность, однако мы предпринимаем усилия для восстановления."
GEA_austerity_budget:0 "Бюджет жёсткой экономии"
GEA_austerity_budget_desc:0 "Несмотря на меры по смягчению последствий Чёрного понедельника, Адмиралтейство по-прежнему страдает от нехватки средств."
GEA_austerity_budget2:0 "Бюджет жёсткой экономии"
GEA_austerity_budget2_desc:0 "Несмотря на меры по смягчению последствий Чёрного понедельника, Адмиралтейство по-прежнему страдает от нехватки средств."
GEA_harassed_by_vc_idea:0 "Нападения Вьетконга"
GEA_flush_budget:0 "Здоровый бюджет"
GEA_flush_budget_desc:0 "Состояние нашего бюджета улучшилось и теперь превосходит докризисный уровень."
GEA_colonial_disaster_idea:0 "Колониальные волнения"
GEA_colonial_disaster_idea_desc:0 "Последствия Чёрного понедельника оказались катастрофическими, и восстания распространяются по всем нашим колониям."
GEA_colonial_instability_idea:0 "Колониальная нестабильность"
GEA_colonial_instability_idea_desc:0 "Мы предприняли меры для установления контроля над ситуацией, однако колонии по-прежнему остаются нестабильными."
GEA_Infrastructural_Effort_Idea:0 "Восточноазиатская экономическая сфера"
GEA_Infrastructural_Effort_Idea_desc:0 "Благодаря развитию инфраструктуры связи между нашими колониями стали крепче, чем когда-либо прежде."
GEA_Colonial_Nation:0 "Колониальное правительство"
GEA_Colonial_Nation_desc:0 "Созданная в ходе стремительной экспансии 1920-х годов Германская Восточная Азия по существу представляет собой подразделение Кайзерлихе Марине, к которому привязано несколько территорий. Адмиралтейство в [GetNameGEASingapore] существует не как правительство и даже формально не как самостоятельный орган власти, а скорее как юрисдикция - обширная территория, на которой сравнительно беспристрастному Адмиралтейству приходится одновременно учитывать местные интересы, взаимодействовать с различными колониальными системами и обеспечивать безопасность всего этого сложного образования."
GEA_Local_Guard_Idea:0 "Местная гвардия"
GEA_Local_Guard_Idea_desc:0 "Мы разрешили местным монархам формировать собственную королевскую гвардию."
GEA_Local_Guard_with_advisors_Idea:0 "Местная гвардия"
GEA_Local_Guard_with_advisors_Idea_desc:0 "Мы разрешили местным монархам формировать собственную королевскую гвардию."
GEA_help_small_business_idea:0 "Помощь малому бизнесу"
GEA_pure_admirality_idea:0 "Флот, поддерживаемый колониями"
GEA_naval_plan:0 "Заключительный этап плана 1934 года"
GEA_colonization_idea:0 "Колонизация Восточной Азии"
GEA_New_Shipbuilding_Methods_idea:0 "Новые методы кораблестроения"
GEA_Anti_Invasion_Plan_idea:0 "План противодействия вторжению"
GEA_Absolute_Defense_Sphere_idea:0 "Сфера абсолютной обороны"
GEA_plantations_negotiation_idea:0 "Переговоры с рабочими плантаций"
GEA_falling_price_idea:0 "Падение цен"
GEA_conrol_price_idea:0 "Меры по контролю цен"
GEA_pacific_rule_idea:0 "Господство над Тихим океаном"
GEA_vietcong_killer_idea:0 "Истребитель Вьетконга"
GEA_vietcong_killer_idea_desc:0 "Кто бежит - тот Вьетконг! Кто стоит на месте - тот хорошо дисциплинированный Вьетконг!"

GEA_AOG_BONUS:0 "A.O.G."
GEA_AOG_bonus_idea:0 "Allgemeine Ostasiatische Gesellschaft"
GEA_AOG_bonus_idea_desc:0 "Благодаря A.O.G. мы обладаем жизненно важными экономическими правами в §Y[?GEA_AOG_CITIES_NUMBER]§! важных китайских прибрежных городах:\n[GEA_Guangzhou]\n[GEA_Xiamen]\n[GEA_Wenzhou]\n[GEA_Nantong]\nи мы будем их защищать.\n§WФабрики товаров народного потребления:§! §Y[?GEA_AOG_CITIES_FACTORIES]%"
GEA_AOG_bonus_idea_5:0 "Allgemeine Ostasiatische Gesellschaft"
GEA_AOG_bonus_idea_5_desc:0 "Благодаря A.O.G. мы обладаем жизненно важными экономическими правами в 4 важных китайских прибрежных городах:\n- §GГуанчжоу§!\n- §GСямынь§!\n- §GВэньчжоу§!\n- §GНаньтун§!\nи мы будем их защищать."
