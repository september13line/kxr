### Focuses ###
GEA_mission1: "Статус Адмиралтейства"
GEA_mission1_desc: "После аннексии французских колоний и присоединения британских территорий, Немецкая Ост-Азия стала колониальным правительством, уникальным в своем роде, управляемая Гранд-адмиралом Хельмутом фон Мюкке и Остазиенфлотте. Мы должны пересмотреть статус нашей постоянной миссии по защите колоний от внешних агрессоров и определить, как наилучшим образом этого можно добиться."
GEA_army1: "Восточноазиатская армия"
GEA_army1_desc: "Армия Остазии представляет из себя гремучую смесь из местных гарнизонов, отборных немецких войск и разрозненных туземных отрядов. Мы должны подвести итоги и решить, следует ли уделять больше внимания вербовке местных жителей или дальнейшему укреплению наших сил из Отечества."
GEA_military1: "Запросить оружие из Берлина"
GEA_military1_desc: "Нам по-прежнему не хватает собственного ВПК для производства оружия, и мы полагаемся на Берлин в плане поставок. До тех пор, пока у нас не будет возможности наладить внутренние поставки, мы должны запрашивать у метрополии дополнительные винтовки."
GEA_military2: "Запросить новую артиллерию"
GEA_military2_desc: "Наши существующие артиллерийские орудия являются ржавыми реликвиями, устаревшими ещё во время Вельткрига. Чтобы лучше защитить наши колонии, мы должны запросить современное оружие из Берлина."
GEA_military3: "Запросить дополнительные поставки оружия"
GEA_military3_desc: "С ростом напряженности в регионе мы должны ещё больше укрепить наши силы. Мы отправим запрос в Берлин на дополнительное оборудование."
GEA_germantroops1: "Немецкая армия"
GEA_germantroops1_desc: "Туземцы не в состоянии защищаться и умереть за Кайзера. Мы должны продолжать полагаться на немецкие войска, даже если они уменьшат нашу общую численность."
GEA_germantroops2: "Прусская дисциплина"
GEA_germantroops2_desc: "Наша армия должна олицетворять дух воинов, прошедших Вельткриг, строгую дисциплину и воинскую честь высшего порядка."
GEA_germantroops3: "Вербовка военной полиции"
GEA_germantroops3_desc: "В настоящее время наша военная полиция существует на полунеофициальных началах, имея лишь стрелковое оружие, которое они используют в патрулировании. Поскольку мы нуждаемся в дополнительных людях, мы должны стремиться вооружить эти подразделения и включить их в качестве вспомогательных войск"
GEA_germantroops4: "Запросить немецкую гвардию из Берлина"
GEA_germantroops4_desc: "Если мы хотим обезопасить наши колонии и защитить их от фанатичных захватчиков, то нам нужны не менее фанатичные войска. Мы пошлем запрос в Берлин на новое подразделение элитных солдат, чтобы помочь нам укрепить нашу оборону."
GEA_localtroops1: "Найм туземцев"
GEA_localtroops1_desc: "В то время как туземцы никогда не будут соответствовать в силе и дисциплине немецким войскам, простой факт заключается в том, что их больше, чем нас. В конце концов, числа выигрывают войны, а не зрелища."
GEA_localtroops2: "Туземные гарнизоны"
GEA_localtroops2_desc: "Это правда, что у нас есть большое местное население, и хотя они не могут сражаться и умирать, как немцы, они будут сражаться и умирать за свой собственный народ. Мы должны сформировать ряд гарнизонных дивизий из туземных войск и разместить их в своих регионах."
GEA_localtroops3: "Преодоление языкового барьера"
GEA_localtroops3_desc: "Наши силы сталкиваются с проблемами общения из-за запутанной сети языков и переводчиков в вооружённых Силах. Мы решим это путём передачи дальнейших полномочий полковым офицерам по языку и силовому составу, чтобы свести на нет эти проблемы."
GEA_localtroops4: "Гражданство за службу"
GEA_localtroops4_desc: "Наши колониальные подданные в настоящее время не пользуются теми же правами, что и граждане Германии, даже если они служат в вооружённых Силах. Чтобы привлечь больше новобранцев, это должно измениться, и служба должна быть достойной для каждого."
GEA_budget1: "Финансовая строгость"
GEA_budget1_desc: "В связи с глобальным финансовым кризисом, который начался в Берлине, мы должны немедленно сократить наши расходы и увеличить наши доходы или же столкнуться с огромным дефицитом."
GEA_budget2: "Колониальная марка"
GEA_budget2_desc: "В отличие от наших друзей в Африке, мы никогда не предпринимали серьезных усилий для поощрения использования Остазиатской марки с момента введения собственной валюты в 1927. путём усиленного ввода её в оборот в наших колониях мы сможем обеспечить валютное единообразие и ослабить бремя кризиса."
GEA_budget3: "Разделим наше бремя"
GEA_budget3_desc: "Местные европейские поселенцы уже давно пользуются нашей защитой и платят очень мало налогов в обмен на порядок, которым они пользуются. Но поскольку мы полагаемся на их сотрудничество в управлении колониями и не можем заходить слишком далеко, будет лучше заключить с ними соглашение."
GEA_budget4: "Укрепление колониальной бюрократии"
GEA_budget4_desc: "Германская Ост-Азия никогда не имела полностью функциональной администрации для реализации своей воли. Теперь, после пережитых колониальных потрясений, пришло время расширить бюрократию и установить прямое правление над нашими колониями."
GEA_budget5: "Умиротворение [GetNameGEAIndochina]"
GEA_budget5_desc: "[GetNameGEAIndochina], является ключевой частью Администрации Немецкой Ост-Азии и её экономическим центром. Угроза Вьетконга не оставляет нам иного выбора, кроме как укреплять регион."
GEA_budget6: "Фабрики в Сингапуре"
GEA_budget6_desc: "В настоящее время в Сингапуре отсутствует какая-либо значимая тяжелая промышленность. Некоторые немецкие корпорации заинтересованы в том, чтобы увеличить своё присутствие в Азии, но просят нашу поддержки от государства, прежде чем начать строительство. Новые заводы позволят увеличить занятость население и стабилизировать ситуацию."
GEA_budget7: "Умиротворение Малайи"
GEA_budget7_desc: "Малайя - жемчужина германской Восточной Азии и оперативный центр всей нашей администрации, но после "черного Понедельника" она оказалась охвачена жестоким повстанческим движением. Мы должны стремиться внедрить систему постов, бункеров и бастионов, чтобы умиротворить местных повстанцев. Это поможет нам и в случае нападения врага с суши."
GEA_budget8: "Инвестиции в [GetNameGEAIndochina]"
GEA_budget8_desc: "Текстильные фабрики [GetNameGEAIndochina] призывают к дальнейшему финансированию для расширения производства и ввода новых методов производства одежды. Предоставление всему этому финансирования будет способствовать трудоустройству местных и принесет новые доходы в долгосрочной перспективе. Это будет способствовать экономическому подъему и стабилизации общества."
GEA_budget9: "Местные заводы оружия"
GEA_budget9_desc: "Нынешних производителей оружия в пределах нашей юрисдикции, мягко говоря, не хватает. Мы должны инвестировать в дальнейшее развитие ВПК, чтобы уменьшить нашу зависимость от отходов из Берлина."
GEA_budget10: "Защита Циндао"
GEA_budget10_desc: "Наши войска сражались и истекали кровью до последнего, чтобы защитить Циндао во время Вельткрига. Эти храбрые и стойкие ветераны сейчас составляют большую часть внутреннего круга Клики Хельмута, и они заставляют его лучше защищать то, за что они сражались."
GEA_budget11: "Разрешить местным производить оружие"
GEA_budget11_desc: "В настоящее время многие из наших договоров запрещают местным властям и князьям устанавливать производство оружия в качестве платы за покровительство. Благодаря реформам, проведенным в основной структуре нашего правительства, мы стали рассматривать эти ограничения как устаревший архаизм."
GEA_budget12: "Укрепления на границе с Сиамом"
GEA_budget12_desc: "В то время как Королевство Сиам оказывало помощь Германской Империи во время Вельткрига, они не были вознаграждены достаточно, и теперь претендуют на наши земли. Мы должны укрепить границу на тот случай, если они решат, что оружие говорит громче слов."
GEA_budget13: "Укрепление связей с Миттельафрикой"
GEA_budget13_desc: "Миттельафрика - это наш полноценный союзник, мы оба обладаем одинаковым уровнем автономии в Империи и должны стремиться к расширению нашего сотрудничества и связей, где это возможно."
GEA_budget14: "Леса Хайнаня"
GEA_budget14_desc: "Хайнань является важным перевалочным пунктом для операций на юге Китая и вдоль побережья Индокитая. Мы должны стремиться укрепить его."
GEA_budget15: "Уроки борьбы с повстанцами"
GEA_budget15_desc: "Миттельафриканские колониальные силы имеют большой опыт жесткого и кровопролитного подавления местных повстанцев. Поскольку у нас есть серьезные проблемы с такими людьми в нашей собственной стране, мы должны просить о создании постоянного военного атташе."
GEA_budget16: "Внедрение Flüssigkeitsbrandbombe"
GEA_budget16_desc: "Местность Миттельафрики заполнена густой растительностью и джунглями, из-за чего они внедрили новое оружие: Flüssigkeitsbrandbombe 'Напалмовоя бомба', для бомбардировки повстанцев в густой растительности Африки. Использование в ней белого фосфора поистине захватывает дух, хотя более традиционные члены Адмиралтейства считают его воздействие на противника довольно неприятным."
GEA_budget17: "Валькирии войны"
GEA_budget17_desc: "Из-за плохой инфраструктуры и пересеченной местности, в которой действуют наши войска, мы часто испытываем трудности с извлечением раненых, что приводит к гибели людей от ран, которые в противном случае можно было бы лечить. Компания Фокке-Вульф обратилась к нам с возможным решением: приобрести большое количество своих последних вертолетов, которые имеют Размер достаточно большой, чтобы нести раненого человека в безопасное место."
GEA_air1: "Авиакорпус в Сингапуре"
GEA_air1_desc: "Наши нынешние воздушные силы полностью состоят из нашего отряда морской авиации. Мы должны стремиться найти и подготовить дополнительных пилотов для сухопутных ВВС."
GEA_air2: "Авиабазы в [744.GetName]"
GEA_air2_desc: "[744.GetName], является идеальным местом для демонстрации нашей воздушной мощи по всему региону. Теоретически, мы можем ударить по Цин, Фэнтяню и даже Японии с одной базы. Теперь мы должны попытаться расширить его, чтобы облегчить эти варианты."
GEA_air3: "Воздушные учения"
GEA_air3_desc: "Наши пилоты должны быть обучены в лучших условиях, чтобы удовлетворить ваши потребности, мы будем проводить воздушные военные игры в Циндао, чтобы показать нашим конкурентам, что мы имеем в виду."
GEA_air4: "Запросить Фокке-Вульф для Восточной Азии"
GEA_air4_desc: "Фокке-Вульф выразили заинтересованность в открытии восточноазиатской дочерней компании, чтобы воспользоваться нашими рабочей силой и ресурсами. Нам нужно полностью поддержать их в этом начинании."
GEA_air5: "Восточноазиатские десантники"
GEA_air5_desc: "Великий Адмирал фон Мюкке давно восхищался десантниками и их сильной дисциплины. Недавно он вступил в контакт с "волком" Дитрихом Витцелем, который предложил обучать и командовать элитной дивизией здесь, на Востоке; предложение, от которого мы не можем отказаться."
GEA_air6: "Запросить истребители из Берлина"
GEA_air6_desc: "В то время как мы сейчас производим некоторые самолеты на местном уровне, мы по-прежнему нуждаемся в большем, чем мы можем в настоящее время производить. Мы попросим авиакрыло истребителей из Берлина, чтобы временно заполнить пробел в наших ВВС."
GEA_navy1: "Великий флот"
GEA_navy1_desc: "Ост-азиатский флот является крупнейшим и самым грандиозным за пределами Европы и составляет ядро нашей деятельности в Восточной Азии. Нашим главным врагом в регионе, конечно, является Японская Империя и их собственный значительный флот. Они используют все свои ресурсы, чтобы тягаться с нами."
GEA_navy2: "Восточноазиатский флот по доктрине 1934 года"
GEA_navy2_desc: "Восточная Азия, возможно больше, чем где-либо ещё, зависит от своего ВМФ, чтобы защитить её разбросанные острова и базы. Поэтому, в то время как большая часть ресурсов Отечества посвящена исключительно поддержанию престижа нашего флота, военно-морской план 1934 года содержит существенные положения для его расширения."
GEA_fleet1: "Воздействие флотом"
GEA_fleet1_desc: "Настоящее преимущество Океанического флота в том, что мы - превосходящая сила, и благодаря разрушительным ударам по врагу мы можем контролировать море. Мы можем гарантировать, что немецкая морская доктрина будет поддерживаться во всех флотах."
GEA_fleet_2: "Улучшенные эсминцы"
GEA_fleet_2_desc: "Эсминцы являются основой современного флота. Мы должны обновить и перестроить наши собственные под более современные конструкции."
GEA_battlecruiser1: "Контроль моря"
GEA_battlecruiser1_desc: "У нашего флота есть только один приоритет на будущее: победить японцев в случае войны. Это значит, что наши усилия должны быть сосредоточены на использовании их слабостей. Япония в значительной степени полагается на импорт из своих марионеток и союзников. Поэтому, стремясь нарушить торговлю, мы можем нанести огромный удар."
GEA_battlecruiser2: "Колониальные крейсера"
GEA_battlecruiser2_desc: "В то время как более крупные линкоры являются опорой немецкого флота, местному восточноазиатскому судостроению не хватает огромных доков и доступа к стали, которая есть в материковой Германии. Соответственно, мы намерены и дальше использовать крейсеры, быстрые и маневренные корабли с тяжелым вооружением, но более слабой броней."
GEA_strikegroup1: "Школа авиастроения"
GEA_strikegroup1_desc: "В то время как немецкая доктрина считает, что военно-морская авиация должна использоваться только в разведке, Великий Адмирал получили удивительную степень свободы для экспериментов. С этой целью, если он так решит, мы могли бы начать инвестировать гораздо больше времени в морскую авиацию, которая может стать будущим войны. Но это вызовет споры в Берлине."
GEA_strikegroup2: "Легкие крейсера"
GEA_strikegroup2_desc: "Легкие бронированные крейсеры, весящие менее 5000 тонн, довольно часто являются ключом к созданию мобильных военно-морских сил; будь то для рейдерства конвоев, доставляющих военные материалы в Японию, или сопровождения наших авианосцев в Тихом океане. Они должны стать основой нашего флота."
GEA_strikegroup3: "Конверсия конвоев"
GEA_strikegroup3_desc: "Наша экспериментальная доктрина привела к необходимости перестроить некоторые крейсера под авианосцы. Это в свою очередь, идёт в разрез с общепринятой доктриной Кайзеррейха и может вызвать подозрения в том, что мы просто пилим бюджет."
GEA_strikegroup4: "Амбиции морской авиации"
GEA_strikegroup4_desc: "Какими бы ни были мысли Берлина об авианосцах, даже они не будут отрицать, что самолеты имеют некоторую полезность в военно-морском контексте. Поэтому мы получили разрешение на дальнейшее развитие наземной авиации, специализирующейся на атаке судов и портов."
GEA_naval_air1: "Наш корпус ВВС"
GEA_naval_air1_desc: "Сингапурский летный корпус мог бы стать бы быть расширен. путём формирования специализированной военно-морской дивизии мы можем увеличить разнообразие их оперативной деятельности."
GEA_naval_air2: "Усиление ПВО"
GEA_naval_air2_desc: "Угроза воздушных атак на Сингапур вызывает постоянную тревогу, ведь самолеты из континентального Китая, Филиппин и Австралии могут добраться до острова. Инвестирование в местную противовоздушную оборону не только даст нам некоторое спокойствие, но и заверит местных жителей в нашей готовности их защитить."
GEA_fleet3: "Некар"
GEA_fleet3_desc: "В то время как наш флот уже является сильным и могучим, никогда не помешает увеличить его размер. Мы начали строительство нового линкора "Некар", который будет служить сильным и современным флагманом."
GEA_fleet4: "Подводный флот"
GEA_fleet4_desc: "Подводная лодка должна взять на себя существенную роль в нашем флоте, с целью уничтожения японских кораблей на воде. Инвестируя в развитие подводных судов, мы можем закрепить наше преимущество над их уязвимыми торговыми путями."
GEA_navy4: "Расширение местных верфей"
GEA_navy4_desc: "Хотя мы никогда не сможем построить линкор и авианосец с нашими местными ресурсами, эсминцы и крейсеры построить мы в состоянии. Мы должны расширить возможности местных верфей, чтобы это стало реальностью."
GEA_navy3: "Расширить бюджет ВМФ"
GEA_navy3_desc: "В настоящее время нынешние военно-морские объекты в Сембаванге и Камрани могут вмещать только прибрежные патрули, дислоцированные в этом районе. Мы должны расширить эти военно-морские базы, чтобы они лучше справлялись с большими кораблями и поддерживали наше растущее присутствие."
GEA_navy5: "Восточноазиатский торговый флот"
GEA_navy5_desc: "Одно из самых прибыльных занятий для нас, и одна из причин, по которой нас поддерживает Германия, - это контроль за потоками торговли, который дает нам власть в регионе. Оказывая давление на некоторые из обширных торговых флотов, мы можем получить временно увеличить пропускную способность судов и доков.."
GEA_navy6: "Новые методы кораблестроения"
GEA_navy6_desc: "Развитие судостроения продолжалось с 1934 года. Теперь, используя новейшие методы фрезерования стали, строительства корпуса и электронику, мы можем построить новые более современные корабли гораздо быстрее."
GEA_navy7: "Ведущий флот в Тихом Океане"
GEA_navy7_desc: "Германия правит морями! От Атлантики до Тихого океана мы будем править морями, и наш флот будет иметь почетный титул короля самого большого океана в мире."
GEA_navyfort1: "Программа береговых укреплений"
GEA_navyfort1_desc: "Сейчас [GetNameGEASingapore] уязвим для высадок с моря. В связи с политикой экспансии в Японии, мы должны построить сеть укреплений на побережье Сингапура."
GEA_navyfort2: "План защиты от высадок"
GEA_navyfort2_desc: "В настоящее время Сингапур, как представляется, уязвим для высадки десанта. С наращиванием японцами своих морских сил мы должны расширить нашу оборону, чтобы противостоять им."
GEA_navyfort3: "Абсолютная защита"
GEA_navyfort3_desc: "Доктрина 'Gesamtschutzsphär' - это последняя разработка нашего бюро по защите колоний от вторжения. Она требует создания нескольких различных резервных планов, чтобы подготовиться к каждому возможному сценарию вторжения, а также собственного военно-морского десанта. Мы должны муштровать наши войска до полной готовности."
GEA_navyfort4: "Береговые укрепления в Сайгоне"
GEA_navyfort4_desc: "Сайгон является воротами во Вьетнам и собственно в Индокитай, и как таковой мы должны стремиться укрепить город от десантных нападений."
GEA_marine1: "Ост-Азиатские морпехи"
GEA_marine1_desc: "Наше уникальное положение делает нашу армию более зависимой от морпехов, чем в других соседних странах. Мы должны обеспечить дальнейшую подготовку, с тем чтобы наши бойцы были лучшими. Они станут посланниками смерти, молящимися о том, чтобы скорее началась война."
GEA_marine2: "Развертывание отряда в [GetNameGEASingapore]е"
GEA_marine2_desc: "Хотя наши морпехи свирепы и выносливы, их количество ограничено. Мы должны стремиться к увеличению численности наших сил."
GEA_marine3: "Война в джунглях"
GEA_marine3_desc: "Суровые джунгли Индокитая долгое время были кладбищем империй, не щадя ни нас, ни местных. Мы должны подготовить все наши войска к более эффективной работе в таких враждебных условиях."
GEA_internal1: "Сотрудничество с местной знатью"
GEA_internal1_desc: "Наше внутреннее управление является архаичным из-за наследования как французской, так и британской колониальных систем в дополнение к нашим непосредственно управляемым территориям. Мы решили содействовать более тесному сотрудничеству с местными элитами, чтобы попытаться улучшить ситуацию."
GEA_internal2: "Укрепить наши связи"
GEA_internal2_desc: "Сам великий Адмирал фон Мюкке проведет важные переговоры с нашими местными протекторатами. Его заявленный подход в увеселение местных князьков может и провалиться, но стоит попытаться."
GEA_internal3: "Помощь малому бизнесу"
GEA_internal3_desc: "Мы можем помочь вернуть экономику на прежний курс, поддерживая местные предприятия больше, чем филиалы крупных немецких корпораций. Это обеспечит процветание и занятость аборигенам и поможет отговорить их от участия в восстании."
GEA_internal4: "Новое Адмиралтейство"
GEA_internal4_desc: "Началась переоценка роли Адмиралтейства в Германской Остазии, поскольку оно постепенно превращается в полноценную администрацию, а не просто во флот с территориями."
GEA_johor1: "Решение Малайи"
GEA_johor1_desc: "Султан Джохора был и остаётся ключевой фигурой в Малайских Султанатах, так легко принявших наше правление. Теперь он просит о дальнейших уступках, чтобы исправить ошибки предыдущей британской администрации, и мы должны идти ему навстречу."
GEA_johor2: "Сотрудничество с местными монополистами"
GEA_johor2_desc: "Лучший способ выбраться из кризиса Черного Понедельника - поддержать экономику страны и оживить наш экспорт. Для этого мы должны поддержать крупные немецкие предприятия в экономическом проникновении в регион, чтобы получить доступ к дешевому сырью."
GEA_johor3: "Местная экономическая компания"
GEA_johor3_desc: "Рудольф Фирл, высокопоставленный сотрудник Северогерманской биржи, обратился к нам с всеобъемлющим планом спонсирования местной торговли и судоходства. Это послужило бы поддержкой экономике Юго-Восточной Азии в долгосрочной перспективе, сделав её менее зависимой от экспорта сырья."
GEA_bao1: "Реформы Бао Дая"
GEA_bao1_desc: "Когда мы завладели французскими территориями после Вельткрига, было решено, что Император Бао Дай останется в своем положении как Император Аннама под нашей "направляющей рукой" Теперь он просит провести ряд реформ, чтобы оживить древнюю имперскую систему. Посмотрим, сможем ли мы предоставить ему это."
GEA_bao2: "Группа немецких советников"
GEA_bao2_desc: "Создав постоянную систему военных атташе для местных сил, мы можем не только помочь сгладить процесс их интеграции в нашу собственную армию, но и следить за радикальными элементами, которые могут проникнуть в них."
GEA_bao3: "Размещёние местной гвардии"
GEA_bao3_desc: "У многих местных князей есть общая просьба: расширение их личных военных сил. Мы можем допустить такие личные армии только при условии, что мы получим часть солдат себе."
GEA_vong1: "Чаепитие с Королем Сисавангом"
GEA_vong1_desc: "В то время как Король Сисаванг может быть одним из небольших автономных иждивенцев, он всё ещё влиятелен, как и другие. Он попросил исправить некоторые ошибки, допущенные прежней администрацией в его адрес. Нам придётся в некоторой степени удовлетворить его прошение."
GEA_vong2: "Реформа образования"
GEA_vong2_desc: "Уровень грамотности коренного населения в настоящее время ужасающий. Продвигая образование на немецком языке двуязычными местными жителями, мы можем попытаться исправить некоторые из этих проблем."
GEA_vong3: "Исследовательские институты"
GEA_vong3_desc: "Спонсирование пары университетов в европейском стиле в Сингапуре и Сайгоне позволит нам расширить нашу исследовательскую базу, а также позволит более богатым и образованным аборигенам учиться здесь, а не за границей, где они могут стать радикалами."
GEA_railway3: "План развития инфраструктуры"
GEA_railway3_desc: "Разрабатывая комплексный план развития местных железных дорог, а также новую сеть автомобильных дорог между городами, мы можем провести капитальный ремонт местной инфраструктуры и улучшить наше отсутствие транспортных связей."
GEA_railway2: "Заводы в Тонкинском заливе"
GEA_railway2_desc: "Трудности в строительстве инфраструктуры показали нашу нехватку металлургической промышленности. Разработка Хайнаньского Железного рудника уже давно является целью наших промышленных проектировщиков. В сочетании с развитием угольных шахт в Северном Вьетнаме мы теперь можем начать проект производства стали в Тонкине."
GEA_railway: "Индокитайские железные дороги"
GEA_railway_desc: "Последняя серия инвестиций и новый подвижной состав позволил нам завершить маршрут к Тонкину. Это должно помочь улучшить нашу внутреннюю торговлю и позволит людям более свободно передвигаться по джунглям."
GEA_develop_tsingtau: "Развитие Циндао"
GEA_develop_tsingtau_desc: "Циндао - это больше, чем город, это символ немецкого господства, контроля, и больше всего на свете это наше место под солнцем. Потерять Циндао было бы немыслимо для высшего командования, и необходимо приложить все усилия, чтобы укрепить эту Концессию."
GEA_fortify_concessions: "Укрепить Концессии"
GEA_fortify_concessions_desc: "Ситуация в Китае выглядит мрачной. Националистические элементы нарушают наш тщательно выстроенный мир, а японские силы просто ждут признаков слабости. Защита наших текущих Концессий от враждебных сил, как внутри, так и за её пределами, является первоочередной задачей."
GEA_kill_yunnan: "Наказать Юньнань"
GEA_kill_yunnan_desc: "Прибыльная торговля оловом, которую мы вели с Юньнанем, была прекращена этими негодяями. Пришло время показать им мощь Хир и силой возобновить наши дружественные деловые отношения."
GEA_become_pals_with_qing: "Возобновить Китайско-Германское сотрудничество"
GEA_become_pals_with_qing_desc: "Приказ Берлина ясен: отбросив вопросы цивилизации и расы, Германия и Китай должны встретиться друг с другом с протянутыми руками взаимной силы и дружбы, столкнувшись с обоюдным врагом.\n\nПо правде говоря, Германии нужны китайские солдаты как буфер против Японии, а Китаю нужно немецкое оружие, чтобы вооружить их."
#GEA_bail_out_dab: "Request a Bailout for the DAB"
#GEA_bail_out_dab_desc: ""
GEA_invest_in_concessions: "Инвестировать в Концессии"
GEA_invest_in_concessions_desc: "Циндао может быть драгоценным камнем в нашей короне, но это не единственная концессия под нашей юрисдикцией. Развитие наших баз в Вэйхае и Гуанчжоуване, обеспечит долгосрочные выгоды для нашего господства в регионе."
GEA_attack_lec: "Защитить Города-Концессии"
GEA_attack_lec_desc: "В акте высшего безумия, Германия была исключена из Совета Городов-Концессий, этот эксперимент в глобальном партнерстве, явно подошел к концу, и германское господство в этих прибыльных городах должно быть восстановлено."
GEA_borneo_money: "Отправка рабочих на шахты Борнео"
GEA_borneo_money_desc: "Северное Борнео в настоящее время обладает огромным количеством неразвитых промышленных районов, и нашим главным препятствием является нехватка рабочей силы для эксплуатации этих ресурсов, импортируя китайских рабочих-мигрантов в Борнео, мы сможем начать развивать эти зарождающиеся отрасли промышленности."
GEA_help_lep_focus: "Отправить помощь нанкинским полевым командирам"
GEA_help_lep_focus_desc: "Хотя наше прямое влияние в Китае ограничивается Концессиями, мягкая сила Германии напрямую направляется через Нанкинскую Клику, а потому любая угроза их продолжающемуся господству над южным Китаем, является для нас долгосрочной угрозой."
GEA_pimp_the_concessions: "Усилить контроль над Концессиями"
GEA_pimp_the_concessions_desc: "С приемлемым уровнем немецкого влияния на Нанкин, мы можем отказаться от претензий на равноправное сотрудничество с китайскими военачальниками. Полный контроль над германскими Концессиями на юге Китая, должны быть переданы администрации Остазии, и вступить в силу немедленно."

### Events ###
# Introduction event
Ostasien.0.t: "Жемчужина Востока"
Ostasien.0.d: "С момента краха Британской империи в 1926 году Кайзерлихе Марине остаётся бесспорным хозяином Восточных морей и хранителем западного порядка на Востоке. Отступление британской «Китайской станции» в Австралазию оставило азиатские колонии и концессии Британии беззащитными перед местными социалистическими восстаниями и нуждающимися в защите, которую могла предоставить лишь Германия. Так завершилась цепь германских владений и концессий от Суэца до Циндао. Однако это славное достижение далось нам дорогой ценой.\n\nНаше расширение на Востоке отличалось необычайной стремительностью и масштабом, распространив нашу юрисдикцию на сложную и пёструю совокупность колоний, оторванных от своих метрополий. Они были вынуждены признать наше превосходство, но при этом оказались слишком запутанными и громоздкими, чтобы их можно было полностью перестроить или подчинить единой системе без риска обрушить вместе с ними и нашу собственную администрацию. Поэтому Германская Восточная Азия существует не как колония и даже формально не как единая административная структура, а скорее как юрисдикция - огромная территория, где сравнительно беспристрастное Адмиралтейство вынуждено одновременно балансировать местные интересы, иметь дело с различными колониальными системами и обеспечивать защиту всего этого комплекса.\n\nНесмотря на наше господство, Япония остаётся угрозой и, как прежде, намерена вытеснить нас с Востока и присвоить его себе. Наши храбрые солдаты стоят лицом к лицу с японцами в Городах концессий, а славные линкоры неусыпно стерегут моря.\n\nЕсли отвлечься от внутренних трудностей, впереди нас ещё может ждать великое столкновение, и долг Адмиралтейства - сделать всё возможное, чтобы к его началу мы были готовы."
Ostasien.0.a: "Очень хорошо!"
Ostasien.0.b: "А что насчёт Китая?"

Ostasien.1.t: "Китай и A.O.G."
Ostasien.1.d: "Китайские владения Отечества также находятся под нашей юрисдикцией, и согласно условиям Шанхайской конференции 1928 года, проходившей при посредничестве американцев, права Германии в Китае равны правам любой другой иностранной державы. Город Циндао уже давно служит центром наших операций в регионе, одновременно являясь современным городом, процветающим портом и сердцем обширной торговой сети, раскинувшейся по всему Востоку.\n\nОднако далеко не всё, что проходит через залив Цзяочжоу, можно назвать полностью законным. Allgemeine Ostasiatische Gesellschaft, или Всеобщая восточноазиатская компания, управляет многочисленными судами, фабриками и даже неофициальными концессиями, которые нарушают если не букву, то дух соглашения 1928 года.\n\nНанкинский военачальник Сунь Чуаньфан, стремясь сохранить независимость от центрального правительства Китая, согласился на ряд кабальных оружейных сделок в обмен на обширные экономические концессии в Лиге восьми провинций. Хотя ни Пекин, ни остальное международное сообщество не признают эти соглашения, A.O.G. продолжает распространять своё влияние по всей Лиге и всё глубже проникать во внутренние районы страны.\n\nВ конечном счёте Берлин хотел бы использовать Китай как своего рода буфер против Японии: каждый солдат, которого японцы вынуждены держать там, - это солдат, которого они не смогут направить против нас в Малайе или Индокитае. Поэтому необходимо поддерживать правительство Китая и Лигу восьми провинций, а любое японское продвижение в Китае следует рассматривать как лишь один шаг до [GetNameGEASingapore]."
Ostasien.1.a: "Очень хорошо!"

# Black Monday
Ostasien.2.t: "Чёрный понедельник!"
Ostasien.2.d: "Положение в Германии катастрофическое. После разрушительного финансового кризиса германская экономика лежит в руинах, а вслед за ней неизбежно пострадают и колонии. Нам придётся серьёзно сократить расходы и немедленно искать способы поддержать уже ослабевающую экономику Восточной Азии. В качестве первого шага Reichskolonialamt передал распоряжение из Берлина передислоцировать «ненужные» гарнизоны из портов Лиги. Восстановление может занять долгие годы..."
Ostasien.2.a: "Катастрофа!"

Ostasien.3.t: "Конец Чёрной недели"
Ostasien.3.d: "Прошла неделя с момента первоначального краха Берлинской фондовой биржи. Каучук и олово, наши главные экспортные товары, уже потеряли более половины своей стоимости по сравнению с периодом до Чёрного понедельника из-за обвала спроса на автомобильные шины. Тем временем экспорт риса на европейский рынок практически прекратился, и десятки тысяч тонн урожая гниют на полях и в доках. Европейцы в Сингапуре, Сайгоне и других городах, не имевшие значительных сбережений или земельной собственности, поставили всё на рынок и потеряли всё. Теперь многие из них живут лишь немногим лучше своих индокитайских соседей."
Ostasien.3.a: "Нужно что-то делать!"

### Uprising Chain ###
# Yen Bai Muytiny
Ostasien.4.t: "Нестабильность в Индокитае"
Ostasien.4.d: "С тех пор как десять лет назад наша экспедиционная армия уничтожила Хо Ши Мина и его синдикалистских агитаторов в Гуанчжоу, Индокитай переживал относительно стабильный период. Однако недавний крах Берлинской фондовой биржи, или Чёрный понедельник, оказал разрушительное воздействие на сильно коммерциализированную индокитайскую экономику. Забастовки и рисовые бунты распространяются по Тонкину, Аннаму и Кохинхине. Городские студенты и представители интеллигенции требуют больше свобод. Хуже того, наша разведка сообщает, что подпольные революционеры тайно расширяют своё влияние."
Ostasien.4.a: "Эта колония печально известна своей непокорностью."

Ostasien.5.t: "Националистическая агитация в Тонкине"
Ostasien.5.d: "Мы обнаружили целую сеть националистических и антиколониальных движений в Тонкине. По всему Ханою агитаторы распространяют листовки с призывами к национальному единству и независимости. Главной силой, стоящей за этой агитацией, является организация под названием Вьетнамская националистическая партия, VNQDD, а наши агенты раскрыли их коварный план: эти бандиты проникают в наши гарнизоны в Тонкине."
Ostasien.5.a: "Мы должны подготовиться."

Ostasien.6.t: "Мятеж в Йенбае"
Ostasien.6.d: "Сегодня несколько тонкинских гарнизонов в Йенбае, военном посту неподалёку от китайско-индокитайской границы, подняли мятеж против колониальной администрации! Вместе с ними выступили вооружённые боевики VNQDD. Благодаря работе наших агентов нам удалось сорвать их план одновременного восстания. Мы отбили атаки мятежников и начали масштабные репрессии по всему Тонкину. Теперь отчаявшиеся повстанцы бегут в горные районы на китайско-вьетнамской границе."
Ostasien.6.a: "Сосредоточить силы и уничтожить этих бандитов!"
Ostasien.6.b: "Ввести военное положение во всём Индокитае!"

Ostasien.7.t: "Индокитайская трагедия"
Ostasien.7.d: "«Вьетнам! Вьетнам! Вьетнам! Родина Юга! Тринадцать раз я слышал этот крик перед гильотиной Йенбая. Тринадцать приговорённых к смерти мужчин выкрикивали его один за другим, всего в двух метрах от эшафота».\n\n- Французский журналист Луи Рубо стал свидетелем недавних жестоких германских репрессий в Индокитае, нашей бывшей колонии и нынешнем бастионе германского колониализма на Дальнем Востоке. Теперь генерал Жак Дорио, близкий друг покойного индокитайского революционера Хо Ши Мина, выступает за вмешательство в Индокитае. После окончания Вельткрига тысячи индокитайских студентов, солдат и рабочих остались во Франции и стали убеждёнными революционерами. Если отправить их обратно с достаточным количеством оружия, они смогут организовать восстание в Кохинхине. Это способно дестабилизировать германскую колониальную империю и послужить делу мировой революции."
Ostasien.7.a: "Счастливого пути, индокитайские товарищи!"
Ostasien.7.b: "Мы не новые Пиньо де Беэны."

Ostasien.8.t: "Индокитайская трагедия"
Ostasien.8.d: "«Вьетнам! Вьетнам! Вьетнам! Родина Юга! Тринадцать раз я слышал этот крик перед гильотиной Йенбая. Тринадцать приговорённых к смерти мужчин выкрикивали его один за другим, всего в двух метрах от эшафота».\n\n- Французский журналист Луи Рубо стал свидетелем недавних жестоких германских репрессий в Индокитае, бастионе германского колониализма на Дальнем Востоке. Теперь индокитайские революционеры в Калькутте требуют помощи. Если мы отправим снаряжение и добровольцев, пока германская полиция и жандармерия заняты в Тонкине, революционеры смогут организовать восстание в Кохинхине. Это способно дестабилизировать германскую колониальную империю и стать важным шагом в нашей международной революционной борьбе."
Ostasien.8.a: "Отправить им помощь."
Ostasien.8.b: "Нас это не интересует."

# Bao Dai Reform
Ostasien.9.t: "Император Бао Дай возвращается в Индокитай"
Ostasien.9.d: "Бао Дай, монарх Аннама, недавно завершил обучение в Германии и вернулся в Индокитай. К сожалению, его не устраивает чисто церемониальная роль, однако тщательно контролируемая монархия могла бы помочь нам снизить нестабильность в сельской местности и заручиться поддержкой населения, поскольку аннамские крестьяне традиционно глубоко привязаны к своему императору. Однако европейские поселенцы в Сайгоне категорически выступают против любых попыток поделиться властью с аннамитами."
Ostasien.9.a: "Добро пожаловать, наш марионеточный император."
Ostasien.9.b: "Может, ему стоит продолжить учёбу."

Ostasien.10.t: "Реформы Бао Дая: первый шаг"
Ostasien.10.d: "Взойдя на престол, Бао Дай привлёк ко двору нескольких сторонников реформ, включая интеллектуала-неотрадиционалиста Фам Куиня и католического администратора Нго Динь Зьема. Теперь его министры решили начать административную реформу, чтобы оживить неработоспособную бюрократическую систему. В настоящее время мандарины в протекторате Аннам лишь номинально управляют страной, тогда как реальная власть находится в руках их европейских советников. Реформы Бао Дая неизбежно подорвут европейскую монополию на власть."
Ostasien.10.a: "Это необходимо."
Ostasien.10.b: "Остановить его. Он зашёл слишком далеко."

Ostasien.11.t: "Реформы Бао Дая: второй шаг"
Ostasien.11.d: "После административной реформы кабинет Бао Дая начал дальнейшую централизацию власти. Недавние беспорядки в Индокитае дали ему удобный повод. Теперь он просит нас предоставить ему полномочия для создания императорской полиции. Бао Дай и его министры утверждают, что лишь полиция, получающая приказы непосредственно от императорского двора в Хюэ, сможет эффективно усмирить непокорных крестьян и восстановить порядок в Аннаме."
Ostasien.11.a: "Это поможет."
Ostasien.11.b: "Давать аннамитам власть опасно."

# Revolution in Cochinchina

Ostasien.12.t: "Нестабильность в Кохинхине"
Ostasien.12.d: "Пока наши силы заняты подавлением националистов в Тонкине, положение южнее, в Кохинхине, становится всё менее стабильным. Число забастовок сократилось, однако профсоюзные активисты, по сообщениям, регулярно проводят собрания, а по региону распространяются слухи, будто агитаторы, переодетые монахами и торговцами, организуют крестьян в тайные общества в Кохинхине и южном Аннаме. Дополнительные сведения разведки указывают, что многие вьетнамские эмигранты нелегально переходят границу и проникают в Индокитай. Вероятно, их направляют иностранные державы для ведения подрывной деятельности. Наши чиновники придумали для этих красных угроз новый термин: «Вьетконг», полное название - Viet Nam Cong Doan, то есть «Вьетнамский синдикалист»."
Ostasien.12.a: "Я чувствую затишье перед бурей."

Ostasien.13.t: "Побег из тюрьмы Пуло-Кондор"
Ostasien.13.d: "Сегодня утром центральная тюрьма на острове Пуло-Кондор сообщила о массовом побеге! Очевидно, акция была тщательно организована: заключённые выбрались через туннель под покровом ночи, затем сели на заранее подготовленные джонки и скрылись в сети каналов и болот дельты Меконга. По оценкам, из 25 000 заключённых сбежало около 150 человек. Большинство из них - левые агитаторы."
Ostasien.13.a: "От этой колонии одни неприятности!"

Ostasien.14.t: "Коммунальное движение в Биньдине"
Ostasien.14.d: "Провинция Биньдинь, родина восстания Тэйшонов, переживает резкое усиление крестьянского движения. Первоначально демонстранты требовали отмены барщины, фактически являющейся разновидностью крепостного труда, но после того как местная администрация проигнорировала их требования, разгневанные крестьяне начали поджигать административные здания, ратуши и железнодорожные станции, уничтожать налоговые реестры и грабить полицейские участки. Местная администрация оказалась парализована, возникли объединения, называющие себя «коммунами», а движение начало распространяться на другие провинции южного Аннама и Меконга. Очевидно, за всем этим стоит Вьетконг!"
Ostasien.14.a: "Возможно, это можно решить мирно."
Ostasien.14.b: "Ввести войска!"

Ostasien.15.t: "Сайгонское восстание"
Ostasien.15.d: "Вчера от Тонкина до Кохинхины одновременно вспыхнули восстания. Профсоюзы объявили всеобщую забастовку и попытались захватить здания муниципальных органов власти. Хотя в большинстве мест порядок уже восстановлен, Вьетконг перенёс крестьянское восстание из Биньдиня и региона Меконга в Сайгон и вошёл в город. Местные гарнизоны перешли на сторону восставших, а мятежники захватили ключевые узлы связи и административные объекты Сайгона!"
Ostasien.15.a: "Да здравствует революция! (Переключиться на INC)"
Ostasien.15.b: "Проклятый Вьетконг!"

Ostasien.16.t: "Положение в Индокитае ухудшается"
Ostasien.16.d: "Положение в Индокитае продолжает ухудшаться, а усмирить повстанцев оказалось значительно сложнее, чем мы ожидали. Регулярные силы Вьетконга продвигаются на север, тогда как их партизанские отряды наносят удары по нашим коммуникациям и сеют страх. Многие поселенцы сомневаются, что мы вообще способны удержать Индокитай, и требуют эвакуировать ценные активы в другие колонии."
Ostasien.16.a: "Эвакуировать активы!"
Ostasien.16.b: "Всё под контролем!"

Ostasien.17.t: "Положение в Индокитае ухудшается"
Ostasien.17.d: "Похоже, несмотря на то что официальные отчёты из наших дальневосточных колоний сообщают о значительных успехах в подавлении восстания, по данным военной разведки реальное положение в Индокитае серьёзно ухудшилось. Усмирение мятежников Вьетконга, судя по всему, оказалось не по силам Адмиралтейству. Несколько крупных городов и стратегических позиций уже перешли в руки повстанцев, а страх и беспорядки распространяются всё шире. Возможно, Германской Восточной Азии нужна помощь?"
Ostasien.17.a: "Они справятся."
Ostasien.17.b: "Отправить подкрепления!"
Ostasien.17.c: "Сухопутная война в Азии? Вперёд!"

Ostasien.18.t: "Индокитайский Союз предлагает мир"
Ostasien.18.d: "Восстание в Индокитае продолжает разрастаться. Ключевые позиции оказались в руках бандитов Вьетконга, и мы с трудом удерживаем ситуацию. Теперь индокитайские повстанцы направили нам предложение о мирных переговорах. Несмотря на опасения, что согласие будет воспринято как унижение, возможно, разумнее всего отказаться от контроля над регионом."
Ostasien.18.a: "Нет, мы продолжим бороться с этими мятежниками!"
Ostasien.18.b: "Мы больше не можем позволить себе эту войну."

Ostasien.19.t: "Мирные переговоры провалились"
Ostasien.19.d: "Германские империалисты отвергли нашу мирную инициативу и решили продолжить войну."
Ostasien.19.a: "С империалистами может говорить только оружие!"

Ostasien.20.t: "Победа в Индокитае"
Ostasien.20.d: "Германия приняла мирную инициативу и отступила с Индокитайского полуострова. Мы выполнили свою задачу и заставили германских империалистов уйти. Индокитай теперь освобождён от германского колониального режима! Это великая победа нашего народа и тяжёлое поражение германских империалистов и их приспешников."
Ostasien.20.a: "Пикельхельме, убирайтесь домой!"

Ostasien.21.t: "Хорошие новости, плохие новости"
Ostasien.21.d: "Похоже, Берлин обеспокоен ситуацией в Индокитае. Плохая новость заключается в том, что они выяснили, насколько плохо у нас идут дела, и подвергли нас жёсткой критике. Хорошая новость - они направили подкрепления для подавления мятежников Вьетконга."
Ostasien.21.a: "Хорошие новости."

Ostasien.22.t: "Победа в Индокитае"
Ostasien.22.d: "Наша славная армия сумела подавить восстание Вьетконга в Индокитае! Сегодня великий день для Германии!"
Ostasien.22.a: "Очень хорошо, товарищи!"

Ostasien.23.t: "Эскалация войны в Индокитае"
Ostasien.23.d: "После того как Германская империя перебросила основные силы на Индокитайский полуостров, война сопротивления достигла невиданного прежде масштаба! Но мы победим, ибо правое дело освобождения непобедимо. Ходят также слухи, что другие великие державы пытаются превратить Индокитайский полуостров в болото, в котором Германия увязнет..."
Ostasien.23.a: "В бой!"

Ostasien.25.t: "Решение Бао Дая"
Ostasien.25.d: "Кохинхина пала перед Вьетконгом, партизаны поднимаются повсюду, и весь Индокитай оказался в чрезвычайном положении. Местные элиты и анти-синдикалистские националисты сплотились вокруг императора Бао Дая и предложили решение: если мы выполним условия договора о протекторате, то есть предоставим династии Нгуенов более широкую автономию в Аннаме и Тонкине, они помогут усмирить сельские районы, мобилизовать местные ресурсы и разгромить повстанцев. В противном случае распространённые антиколониальные настроения дадут Вьетконгу серьёзное преимущество. Послание Бао Дая завершается зловещим предупреждением: если Германия не прислушается к вьетнамскому национализму, «каждая деревня станет гнездом сопротивления, каждый бывший коллаборационист - врагом, а ваши чиновники и колонисты сами захотят покинуть эту удушающую атмосферу»."
Ostasien.25.b: "Мы справимся сами."
Ostasien.25.a: "Нам нужна его помощь."
Ostasien.25.c: "Бао Дай приведёт Аннам к миру и порядку. (Играть за Вьетнам)"

Ostasien.30.t: "Падение цен"
Ostasien.30.d: "Цены на рис и каучук стремительно падают по всем колониям. Фермеры и владельцы плантаций, зависящие от экспорта риса и каучука, понесли тяжёлые потери, особенно в двух наших крупнейших колониях - Индокитае и Малайе. Мы способны удержать цены в одной из них, но наши ресурсы ограничены, и почти наверняка это произойдёт за счёт другой."
Ostasien.30.a: "Это не наше дело."
Ostasien.30.b: "Защитить Индокитай."
Ostasien.30.c: "Защитить Малайю."

Ostasien.32.t: "Забастовки на плантациях"
Ostasien.32.d: "Цена на каучук продолжает падать. Многие владельцы плантаций решили уволить часть работников, а остальных заставить трудиться полный рабочий день. Эти меры спровоцировали масштабные забастовки на плантациях Индокитая и Малайи. Рабочие требуют прекратить увольнения, сократить продолжительность рабочего дня и улучшить условия труда. Поскольку большинство плантационных рабочих неграмотны, предполагается, что за координацией протестов стоят социалистические агитаторы."
Ostasien.32.a: "Подавить забастовки."
Ostasien.32.b: "Попытаться договориться."

Ostasien.31.t: "Европейские привилегии"
Ostasien.31.d: "После потрясения Чёрного понедельника многие европейские поселенцы потеряли всё и обнищали буквально за одну ночь. Теперь некоторые из них обратились к нам с петицией, требуя усилить их социальные и коммерческие привилегии, чтобы поселенцы не были низведены до уровня обычных колониальных подданных. Они утверждают, что лишь жёсткая расовая кастовая система способна сохранить мир в наших колониях."
Ostasien.31.a: "Отказать им."
Ostasien.31.b: "Усилить привилегии европейцев."

Ostasien.33.t: "Коммунальное движение в Биньдине усмирено"
Ostasien.33.d: "Крестьянское восстание в провинции Биньдинь было подавлено нашими солдатами. Бомбардировщики и огонь корабельной артиллерии оказались особенно эффективны в запугивании вьетнамских крестьян. «Биньдинь» по-вьетнамски означает «умиротворение», и теперь эта провинция действительно оправдала своё название."
Ostasien.33.a: "Превосходно!"

Ostasien.34.t: "Агитация в Сайгоне идёт на спад"
Ostasien.34.d: "Шум дождя, барабанящего по опустевшей площади, кажется оглушительным. Потрёпанная листовка, брошенная в сточную канаву, чернила на которой расплываются по бумаге мягкими голубоватыми пятнами, - единственное свидетельство того, что ещё совсем недавно Сайгон был очагом радикальной социалистической и синдикалистской агитации. На листовке изображён вьетнамский рабочий с красным социалистическим знаменем. Подпись гласит: «Рабочие Индокитая, объединяйтесь!». Вскоре дождь подхватывает её и уносит в канализацию, откуда ей и место."
Ostasien.34.a: "Хорошие новости."

Ostasien.35.t: "Законы войны"
Ostasien.35.d: "Вьетконг не соблюдает современные законы войны. Их партизаны не только отказываются носить форму, но и всеми силами стараются раствориться среди гражданского населения. Отличить бойца Вьетконга от мирного жителя практически невозможно. Наши генералы утверждают, что война против Вьетконга может быть только тотальной."
Ostasien.35.b: "Хотя бы попытайтесь их различать..."
Ostasien.35.a: "Стрелять во всё, что движется!"

Ostasien.40.t: "Пригласить советников из Миттельафрики"
Ostasien.40.d: "Миттельафрика в некотором смысле является родственным нам проектом: и мы, и они защищаем Кайзеррейх от внешних врагов и непокорных подданных, поэтому укрепление наших связей выглядит вполне разумным. Великий адмирал решил нанять советников из Миттельафрики в надежде, что их опыт поможет нашим вооружённым силам и усилит борьбу с повстанцами."
Ostasien.40.a: "Интересно, их каннибалы хуже наших?"

Ostasien.41.t: "Военная делегация из Миттельафрики"
Ostasien.41.d: "[root.getleader] и другие высокопоставленные лица встретили делегацию из Миттельафрики, когда та сошла с кораблей в [GetNameGEASingapore]. Судя по их суровому и потрёпанному виду, это были именно те люди, которых недавно запросило наше Адмиралтейство. После обмена любезностями гостей сопроводили к новым местам размещения. Местных жителей особенно позабавило присутствие среди них нескольких аскари."
Ostasien.41.a: "Майн Готт, да он быка завалит."

Ostasien.42.t: "Учимся у Миттельафрики"
Ostasien.42.d: "Наша военная делегация вернулась из Миттельафрики. Несмотря на некоторые недостатки местной администрации, представители сообщили, что их тепло приняли и что поездка позволила многому научиться."
Ostasien.42.a: "Превосходно!"

Ostasien.51.t: "Новое Адмиралтейство"
Ostasien.51.d.a: "После внезапной смерти Альберта Баллина почётный Хельмут фон Мюкке принял командование Восточноазиатским гарнизоном, а с началом Индокитайского восстания весьма эффективно руководил флотом Дойч-Остазиен. Однако, несмотря на его морское мастерство, исход восстания решался в джунглях Вьетнама и Камбоджи, где оно в конечном счёте было проиграно, а наша колония после столь страшного поражения оказалась серьёзно ослаблена. Большая часть материковых владений утрачена из-за восстания местного населения, наши силы разгромлены, и теперь у нас слишком много неотложных проблем, чтобы заниматься потенциальными реформами, которые планировал режим фон Мюкке. Флот вновь станет главным и фактически единственным приоритетом германских владений в Восточной Азии, а [root.getleader] будет править этой измученной войной колонией железной рукой, стремясь закрепить остатки наших владений и приспособиться к суровой новой реальности."
Ostasien.51.d.b: "После внезапной смерти Альберта Баллина почётный Хельмут фон Мюкке принял командование Восточноазиатским гарнизоном, а с началом Индокитайского восстания весьма эффективно руководил флотом Дойч-Остазиен. Его морское мастерство проявилось во всей полноте, когда под его командованием объединённые силы германских войск в Восточной Азии решительно подавили восстание, и теперь наша колония празднует победу. Однако значительная часть её территории охвачена пожарами или уже разрушена войной, поэтому у нас слишком много неотложных задач, чтобы заниматься потенциальными реформами, которые планировал режим фон Мюкке. Флот вновь станет главным и фактически единственным приоритетом германских владений в Восточной Азии, а [root.getleader] будет править этой измученной войной колонией железной рукой, стремясь закрепить её положение и приспособиться к суровой новой реальности."
Ostasien.51.d.c: "После внезапной смерти Альберта Баллина почётный Хельмут фон Мюкке принял командование Восточноазиатским гарнизоном, и под его твёрдым и размеренным руководством Германская Восточная Азия процветает. Господство флота было ограничено, а давно назревавшие противоречия между местным населением и германским гарнизоном удалось урегулировать дипломатическим путём. Самым заметным новым событием стало восстановление сотрудничества между вьетнамским монархом Бао Даем и администрацией фон Мюкке. По мере того как повстанческие ячейки угасают и теряют влияние, а германское присутствие вновь распространяется по этому тропическому раю, [root.getleader] наконец готов приступить к давно задуманным реформам, которые должны превратить это отсталое «государство при флоте» в полноценную функционирующую колонию."
Ostasien.51.a: "Мы отступаем к морю..."
Ostasien.51.b: "Пора принести цивилизацию в эту хаотичную колонию!"

Ostasien.5101.t: "Пора выполнять обещания"
Ostasien.5101.d: "Хотя нараставшие революционные настроения пошли на спад и угроза полномасштабной войны больше не маячит на горизонте, народы Германской Восточной Азии всё ещё громко требуют реформ и перемен. Если мы хотим сохранить достигнутый прогресс на пути к миру и стабильности, нашему режиму стоило бы наконец начать исполнять негласные обещания, данные ради предотвращения возможного восстания. Прежде всего местные жители желают получить реальное представительство в колониальном правительстве, чтобы их проблемы и жалобы действительно принимались во внимание. Мы можем просто проигнорировать эти требования перемен, но тогда необходимо быть готовыми к новому росту сепаратистских настроений."
Ostasien.5101.a: "Начнём открывать правительство для местного населения."
Ostasien.5101.b: "Мы вновь доказали свою силу. Пусть местные убираются."

Ostasien.5102.t: "Парламент для местных?"
Ostasien.5102.d: "Первое крупное требование местного неколониального населения заключается в получении полноценного представительства в колониальном правительстве. Они требуют создать новую нижнюю палату германского колониального законодательного органа, открытую для жителей Германской Восточной Азии, чтобы лучшие из них могли представлять себя и свои народы перед германским режимом. Однако, чтобы не допустить наплыва нежелательных элементов и возможных радикалов, первый состав представителей будет лично отобран нашей администрацией. Хотя эта нижняя палата почти не получит реальной политической власти, её создание, вероятно, существенно успокоит местное население и постепенно откроет путь к более широким реформам."
Ostasien.5102.a: "Мы выполним первоначальные обещания, но представителей выберем сами."
Ostasien.5102.b: "Мы ни за что не позволим этим дикарям управлять собой!"

Ostasien.5103.t: "Требование открытых выборов"
Ostasien.5103.d: "После того как мы согласились создать новую нижнюю палату, укомплектованную лояльными местными жителями, население колонии немедленно потребовало настоящих открытых выборов, чтобы самостоятельно выбирать своих представителей. Это действительно опасная перспектива, поскольку выборы могут открыть правительство для подрывных элементов, однако они значительно успокоили бы большинство недовольных местных групп. Если просто запретить радикалов вроде социалистов, подпитывавших индокитайские сепаратистские ячейки, мы, вероятно, сможем достаточно тщательно контролировать выборы и не допустить захвата новой нижней палаты экстремистами. Как нам поступить?"
Ostasien.5103.a: "Ради стабильности разрешим нерадикальным кандидатам участвовать в местных выборах."
Ostasien.5103.b: "Они не способны самостоятельно принимать такие решения! Отказать!"

Ostasien.5104.t: "Первые колониальные выборы в парламент Германской Восточной Азии"
Ostasien.5104.d: "После решения разрешить свободные местные выборы подготовка к этому знаменательному событию началась немедленно, ведь жители колонии не намерены терять время на пути к обеспечению своего будущего под колониальным правлением. Хотя эти «выборы» определят лишь состав гражданского правительства при колониальном парламенте и почти не дадут ему реальной власти, они должны значительно снизить недовольство масс. Участвующие группы даже нельзя назвать полноценными партиями - скорее это рыхлые коалиции единомышленников, каждая из которых представляет собственных покровителей и интересы. Национальная организация султанов служит оплотом консерватизма, традиций и монархизма, а значительная часть её ведущих деятелей происходит из многочисленных дворянских домов и семей архипелага. Им противостоят различные группы, оставшиеся со времён французского и британского господства над этими землями, объединения особых интересов, представляющие элиты и деловые круги, а также небольшое, но растущее рабочее движение во главе с мелкими служащими. Места в нижней палате стремительно заполняются, однако только одна группа сможет получить явное большинство и задать ей единое направление. Подсчёт последних голосов подходит к концу, и совсем скоро будет объявлен состав нового гражданского правительства Германской Восточной Азии."
Ostasien.5104.a: "NOS/PKS используют свои связи с монархиями и побеждают."
Ostasien.5104.b: "EHV/HTMBT, финансируемые индокитайскими предпринимателями, получают больше всего мест."
Ostasien.5104.c: "SMB/MMS, поддерживаемые остатками французов, набирают больше всего голосов."
Ostasien.5104.e: "PAF/PLF захватывают подавляющее большинство мест в нижней палате."

Ostasien.510.t: "Новая благородная администрация"
Ostasien.510.d.a: "После внезапной смерти Альберта Баллина благородный принц Йозиас цу Вальдек унд Пирмонт принял командование Восточноазиатским гарнизоном и с началом Индокитайского восстания доблестно руководил гарнизоном Дойч-Остазиен. Хотя Йозиас пытался договориться с местной знатью и монархами, было уже слишком поздно, и Индокитайское восстание охватило колонию вопреки всем его дипломатическим усилиям. Несмотря на неудачи, принц сумел сплотить германский гарнизон и после череды тяжёлых побед по всему архипелагу и в джунглях Индокитая наши силы наконец отбросили радикальных повстанцев, стремившихся разрушить колониальный порядок. Теперь принц Йозиас правит разорённым войной, но уцелевшим колониальным владением, опираясь на потрёпанный, но всё ещё великолепный флот, защищающий этот рай. Именно ему предстоит собрать осколки и восстановить сохранившийся колониальный порядок, чтобы вернуть ему былую славу."
Ostasien.510.d.b: "После внезапной смерти Альберта Баллина благородный принц Йозиас цу Вальдек унд Пирмонт принял командование Восточноазиатским гарнизоном и с началом Индокитайского восстания руководил гарнизоном Дойч-Остазиен с переменным успехом. Хотя Йозиас пытался договориться с местной знатью и монархами, было уже слишком поздно, и Индокитайское восстание охватило колонию вопреки всем его дипломатическим усилиям. После сокрушительных поражений по всему архипелагу и в джунглях Индокитая наши силы оказались полностью разбиты. Теперь принц Йозиас управляет жалким остатком прежних владений, опираясь лишь на тень некогда великолепного флота, защищавшего этот рай. Ему предстоит собрать осколки и восстановить хотя бы часть разрушенной германской гегемонии, некогда господствовавшей над этими дикими землями."
Ostasien.510.d.c: "После внезапной смерти Альберта Баллина благородный принц Йозиас цу Вальдек унд Пирмонт принял командование Восточноазиатским гарнизоном, и благодаря искусной дипломатии, долгим переговорам и многочисленным компромиссам волна местного радикализма, стремившаяся разрушить устоявшийся колониальный порядок, была остановлена. Теперь принц Йозиас правит стабильной и относительно спокойной Германской Восточной Азией, опираясь как на новых союзников среди местной знати, так и на возрождённую колониальную администрацию. Используя обретённую власть и влияние, принц намерен превратить это хаотичное империалистическое владение в образцовую колонию Кайзеррейха."
Ostasien.510.a: "Мы прошли через ад и вышли из него сильнее прежнего!"
Ostasien.510.b: "Пламя революции искалечило, но не уничтожило наш колониальный порядок. Мы выстоим!"
Ostasien.510.c: "Слава принцу Йозиасу, искусному дипломату, спасшему нас."

Ostasien.511.t: "Странная новая администрация"
Ostasien.511.d: "После смерти Баллина и подъёма индокитайского сепаратизма почётный генерал Август Вильгельм Хейе управлял колонией как чрезвычайный правитель вместе с кликой лоялистов и своим сыном Хельмутом Хейе, который и сам стал заметным адмиралом. Всё это время они вели страну по тонкой проволоке над бушующим пламенем индокитайского радикализма. Будучи стойким и умным офицером, Хейе доблестно командовал германским гарнизоном в ужасах Индокитайского восстания, однако теперь, когда огонь войны наконец погас, многие требуют, чтобы это военное правительство исполнило своё временное предназначение и ушло в отставку. Вильгельм Хейе всегда был верным слугой кайзера и никогда не стремился к личной власти, поэтому, скорее всего, он удовлетворит требования об отставке и вернётся в Германию к семье, продолжив службу военным инструктором. Наиболее вероятным преемником считается почётный, пусть и несколько эксцентричный, Феликс Николаус Александр Георг граф фон Люкнер. Прозванный «Der Seeteufel», или Морским Дьяволом, фон Люкнер является одним из самых известных и одновременно печально знаменитых адмиралов Кайзеррейха. Он прославился не только преданной службой кайзеру, но и своим необычным увлечением, ведь фон Люкнер - настоящий современный пират. Получивший известность благодаря набегам на морские коммуникации Антанты во время Вельткрига, фон Люкнер и его «Die Piraten des Kaisers», как ожидается, станут преданными, хотя и шумными и крайне нестандартными новыми командирами Германской Восточной Азии. Однако слухи о растущих эксцентричности и амбициях фон Люкнера уже вызывают беспокойство."
Ostasien.511.a: "Хейе уходит, и новым губернатором становится фон Люкнер."
Ostasien.511.b: "Морской Дьявол и его пираты делают ход и захватывают всё правительство!"
Ostasien.511.c: "Хейе отвергает требования Люкнера и остаётся у власти на неопределённый срок."

Ostasien.5112.t: "Новый великий адмирал"
Ostasien.5112.d: "С детства бороздивший моря и со временем ставший одним из величайших флотоводцев кайзера, Феликс Николаус Александр Георг граф фон Люкнер является одним из самых известных моряков, когда-либо выходивших в плавание. Он родился в Дрездене в 1881 году в семье Люкнеров - дворянском роду, прославленном своими военными традициями. Отец постоянно давил на юного Феликса, заставляя его поступить в кавалерию, хотя сам мальчик с ранних лет мечтал о жизни моряка. Не выдержав этого давления, в тринадцать лет Люкнер сбежал из дома, поклявшись семье, что вернётся лишь тогда, когда будет носить «морскую форму императора и носить её с честью». Взяв вымышленное имя, этот «Филакс Людекке» сумел устроиться неоплачиваемым юнгой на старое русское парусное судно, направлявшееся в Австралию.\n\nВо время плавания он едва не погиб, упав за борт, но сумел поймать альбатроса и использовать его как сигнал, чтобы привлечь внимание товарищей по кораблю. После этого юный фон Люкнер быстро освоился с морской жизнью.\n\nПрибыв в Австралию, мальчик перебивался множеством случайных работ, которые впоследствии привели его в разные уголки мира. Он успел побывать строителем, барменом, содержателем таверны, боксёром, охотником на кенгуру, цирковым артистом, рыбаком, смотрителем маяка, охранником президента Мексики и даже отсидеть срок в чилийской тюрьме за кражу нескольких свиней - и всё это ещё до двадцатилетия. После освобождения он вернулся в Германию, где поступил в мореходную школу, чтобы стать настоящим моряком. Затем Люкнер работал на пароходной линии между германскими владениями в Центральной Америке и Гамбургом, а позднее наконец вернулся к семье, давно считавшей его погибшим. В 1912 году, всего за два года до Вельткрига, он был призван на службу в Кайзерлихе Марине.\n\nИменно во время этой войны фон Люкнер обрёл славу. Сначала он служил на SMS Panther, где быстро зарекомендовал себя стойким и блестящим морским офицером. Раз за разом нанося поражения британскому флоту, он внушил англичанам настоящий страх и получил знаменитое прозвище «Der Seeteufel» - Морской Дьявол. После многочисленных побед кайзер подарил фон Люкнеру конфискованный трёхмачтовый парусник, переименованный в Seeadler, или Морской Орёл. Корабль передали ему под командование главным образом потому, что Люкнер был одним из немногих офицеров германского флота с серьёзным опытом управления столь крупным парусным судном. Оснащённый современными пушками, Морской Дьявол и его «Piraten des Kaisers» продолжили создавать себе легендарную репутацию, возродив практику морского рейдерства против торгового судоходства и весьма эффективно нарушая линии снабжения держав Антанты.\n\nПосле войны фон Люкнер и его команда продолжили службу кайзеру, совершая рейды на вражеские морские пути и топя незаконные суда по всем Семи морям. За это он получал новые награды и повышения, пока в итоге не оказался в Германской Восточной Азии под командованием Хельмута фон Мюкке и Вильгельма Зольфа. Теперь, когда их неудачи привели к тому, что значительная часть Германской Восточной Азии оказалась охвачена пламенем, Морской Дьявол фон Люкнер унаследовал их полномочия. Под его железным надзором Германская Восточная Азия вновь будет усмирена во имя кайзера - если, конечно, этот старый пират не решит взять всё в собственные руки..."
Ostasien.5112.a: "Вот это человек."

Ostasien.5113.t: "Макс и Мориц"
Ostasien.5113.d: "Печально известный адмирал Феликс фон Люкнер известен на всех Семи морях как человек действия, харизмы и благородной хитрости, непревзойдённый у штурвала. Блестящий стратег, надёжный командир, многократно награждённый герой и ветеран войны - от такого человека можно было бы ожидать сурового, холодного и стального характера типичного военного старой школы, однако у этого капера Кайзеррейха есть и мягкая сторона.\n\nПрактически повсюду фон Люкнера сопровождают Макс и Мориц, две его любимые таксы. Он берёт их с собой на официальные встречи, визиты, учения и даже в самое сердце войны, где они буквально танцуют над водяной могилой, пока фон Люкнер, Морской Дьявол, командует морями во имя кайзера с мостика своего знаменитого военного корабля SMS Seeadler. Он выгуливает собак при любой возможности, даже по палубе собственного судна, и эти две таксы для фон Люкнера дороже любой награды, когда-либо полученной им. Макс и Мориц ценятся им больше собственной жизни, а возможно, даже жизней людей под его командованием. Эти два очаровательных пса помогают фон Люкнеру смягчаться и расслабляться во время редких передышек от однообразия колониальной жизни."
Ostasien.5113.a: "Даже у Морского Дьявола есть слабость."

Ostasien.5114.t: "Судьба командования Хейе"
Ostasien.5114.d: "После окончательной победы над индокитайскими революционерами Берлин вновь потребовал, чтобы наш колониальный губернатор и герой Великой войны Август Вильгельм Хейе вернулся домой и помог Отечеству там, где его опыт необходим больше всего, - на границе с французами или русскими. И кайзер, и Reichskolonialamt, Имперское колониальное управление в Берлине, отвечающее за надзор над колониальной администрацией огромного Кайзеррейха, считают, что выдающиеся способности Вильгельма Хейе попросту растрачиваются в какой-то захолустной тропической колонии на другом конце света. Вместо него Берлин предлагает назначить колониальным губернатором собственного сына Хейе, уважаемого адмирала Хельмута Гвидо Александра Хейе, ссылаясь на его талант флотоводца, особенно хорошо знакомого с действиями морских коммандос, подводных лодок и крейсеров, его связи с Партией Центра в Берлине и безусловную верность Кайзеррейху. Однако старший Хейе резко выступает против этой идеи, заявляя, что ещё не закончил дела с Индокитаем и намерен остаться в колонии до отставки или смерти - смотря что наступит раньше. Следует ли нам обойти мнение Августа Вильгельма Хейе и отправить его обратно в Берлин, где он нужнее, позволив сыну выйти из отцовской тени и возглавить колонию, или же старому боевому псу стоит позволить провести последние годы среди тропической идиллии колониальной бюрократии и партизанской войны, как он того желает?"
Ostasien.5114.a: "Вильгельм Хейе останется командовать ради блага колонии."
Ostasien.5114.b: "Хельмут приходит к власти с умеренной программой отцовского колониального патернализма."
Ostasien.5114.c: "Хельмут принимает командование с программой, основанной на идеях Партии Центра."

Ostasien.5115.t: "Рыцарь Империи возвращается домой"
Ostasien.5115.d_lost: "Освобождённый от колониальной службы после ведущей роли в провальной войне против индокитайских революционеров, запятнанный офицер и бывший герой Великой войны Август Вильгельм Хейе вернулся из Германской Восточной Азии, чтобы помочь Отечеству там, где он нужен больше всего, - на наших собственных границах. Однако в грядущей борьбе за выживание против мерзких синдикалистов и разнообразных реваншистов, окружающих нас словно волки, поражение недопустимо. Поэтому некоторые представители Генерального штаба предлагают принудительно отправить Хейе в досрочную отставку. Стоит ли списать этого старого боевого пса и позволить ему исчезнуть в забвении вынужденной отставки, или некогда почётному рыцарю нужно дать последний шанс послужить Кайзеррейху?"
Ostasien.5115.d_won: "Освобождённый от колониальной службы и переведённый обратно в Германию после ведущей роли в победоносной войне против индокитайских революционеров, почётный герой Великой войны и Индокитайского восстания Август Вильгельм Хейе вернулся из Германской Восточной Азии, чтобы помочь Отечеству там, где он нужен больше всего, - на наших собственных границах. Однако старый боевой пёс уже давно мечтает об отставке и, безусловно, заслужил её. Следует ли наконец позволить Хейе уйти на заслуженный покой или же оставить его на службе, чтобы опыт этого стойкого и железного человека привёл нас к ещё одной последней победе?"
Ostasien.5115.a: "Ты подвёл нас в последний раз, генерал."
Ostasien.5115.b: "Даровать старому псу заслуженную отставку."
Ostasien.5115.c: "Оставить Хейе членом Генерального штаба."

Ostasien.512.t: "Новая радикальная администрация?"
Ostasien.512.d: "После смерти Баллина и подъёма индокитайского сепаратизма почётный генерал Август Вильгельм Хейе управлял колонией как чрезвычайный правитель вместе с кликой лоялистов и своим сыном Хельмутом Хейе, который и сам стал заметным адмиралом. Всё это время они вели страну по тонкой проволоке над бушующим пламенем индокитайского радикализма. Однако, несмотря на весь свой опыт, Хейе подвёл и кайзера, и соотечественников: он не только не сумел подавить Индокитайское восстание, но и допустил потерю почти половины всей территории колонии в пользу социалистических революционеров. Его провалы оставили после себя столь глубокие раны, хаос и страдания, что многие жители уцелевшего колониального огрызка, которым теперь стала Германская Восточная Азия, требуют немедленной отставки Хейе и его возвращения в Германию, называя генерала неудачником и предателем германских интересов и национальной гордости. Жаждущие возмездия и мести оставшиеся немцы требуют передать власть более эффективному и куда более печально известному военному - Фердинанду Шёрнеру. Репутация человека, отличающегося дикой результативностью и беспощадной эффективностью, уже сделала Шёрнера главным кандидатом нынешнего режима на замену Хейе. Сам Хейе, однако, продолжает утверждать, что война ещё далеко не проиграна и что, получив немного больше времени, он докажет союзникам: борьба за Германскую Восточную Азию не окончена. Другие считают, что решение заключается не в мести, а в отказе от внешних авантюр и сосредоточении на внутренних проблемах. Эти сторонники мира выдвинули кандидатуру собственного сына генерал-оберста Хейе - Хельмута, более умеренного голоса разума в кабинете своего отца, который, скорее всего, согласится принять наши потери и двигаться дальше.\n\nВильгельм Хейе, несмотря на сильно пострадавшую репутацию, остаётся талантливым офицером и наверняка поможет Империи подготовиться к войне против коммунаров. Вероятно, в Германии от него будет больше пользы, чем в Восточной Азии, которую многие уже считают безнадёжно потерянной.\n\nПока наш Генеральный штаб спорит о том, кто должен возглавить колонию в этот кризисный час, остаётся лишь ждать, когда пыль уляжется и будет выбран новый курс."
Ostasien.512.a: "Несмотря на ошибки, Хейе остаётся преданным лоялистом. Дать ему ещё один шанс."
Ostasien.512.b: "Отправить Вильгельма Хейе обратно в Берлин и позволить его сыну возглавить колонию!"
Ostasien.512.c: "Хейе подвёл нас в последний раз. Привести Фердинанда Шёрнера..."

Ostasien.52.t: "Прибывают новые корабли"
Ostasien.52.d: "Новые корабли, построенные в рамках Морского плана 1934 года, присоединились к славному Остазиенфлоту в [GetNameGEASingapore]."
Ostasien.52.a: "Превосходно!"

# GEA Action in the Philippines

Ostasien.60.t: "Социалистическое восстание на Филиппинах"
Ostasien.60.d: "После окончания американского колониального правления Филиппинский архипелаг погрузился в хаос. Группа недовольных армейских офицеров вместе с отрядами крестьян и промышленных рабочих подняла восстание с целью свергнуть правительство и установить социалистический режим. Пока неизвестно, смогут ли филиппинские вооружённые силы подавить мятежников, однако некоторая помощь определённо повысит их шансы на победу."
Ostasien.60.a: "Тайно поддержать филиппинскую армию."
Ostasien.60.b: "Не наше дело."

Ostasien.61.t: "Социалисты захватывают власть на Филиппинах!"
Ostasien.61.d: "Филиппинское правительство передало власть синдикалистскому движению. Однако южные районы Филиппин, включая острова Палаван и Минданао, не находятся под твёрдым контролем нового центрального правительства. Возможно, это наш шанс освободить их от синдикалистской тирании и взять под имперскую защиту?"
Ostasien.61.a: "Отправить флот для захвата южных островов."
Ostasien.61.b: "Оставить их в покое."

Ostasien.62.t: "Германский флот у берегов Палавана!"
Ostasien.62.d: "Германия объявила население южных регионов находящимся под своей «защитой» и направила флот для установления контроля над этой территорией. Как нам следует отреагировать?"
Ostasien.62.a: "Мы погибнем героями."
Ostasien.62.b: "Мы ничего не можем сделать."

Ostasien.63.t: "Филиппинское правительство уступает"
Ostasien.63.d: "Филиппинское правительство отказалось вступать с нами в противостояние. Теперь южные острова Филиппин могут быть присоединены к колониям Остазии - славный день для Кайзеррейха."
Ostasien.63.a: "Превосходно."

Ostasien.64.t: "Флот Остазии захватывает Южные Филиппины"
Ostasien.64.d: "Сегодня адмирал фон Мюкке сообщил из [GetNameGEASingapore], что флот Остазии успешно взял под контроль южные острова Филиппин, оградив их от синдикалистского режима в Маниле. Славный день для Кайзеррейха."
Ostasien.64.a: "Превосходно!"

Ostasien.65.t: "Филиппины объявляют нам войну"
Ostasien.65.d: "После установления синдикалистского правительства в Маниле флот Остазии смело попытался взять под контроль южные острова Филиппин. Теперь синдикалистское правительство Филиппин решило самоубийственно объявить нам войну."
Ostasien.65.a: "Прекрасно."

# GEA Intervention in Burma

Ostasien.66.t: "Общественные волнения в Бирме"
Ostasien.66.d: "Королевство Бирма, получившее независимость при помощи Германской империи, столкнулось с глубоким политическим кризисом. Студенты и рабочие выступили против монархии, организовав массовые демонстрации и протесты. До сих пор полицейские подразделения совершенно не справляются с радикальными протестующими. Следует ли нам попытаться поддержать бирманскую монархию в этом кризисе?"
Ostasien.66.a: "Отправить флот в знак нашей поддержки."
Ostasien.66.b: "Не наше дело."

Ostasien.67.t: "Германский флот прибывает в Янгон"
Ostasien.67.d: "Сегодня в Янгон прибыл огромный германский флот. Военно-морская делегация Германии прибыла, чтобы продемонстрировать поддержку бирманской монархии. Мощь германского флота потрясла оппозиционеров и заставила их отступить."
Ostasien.67.a: "Могучая Германия!"

Ostasien.68.t: "Порядок в Бирме восстановлен"
Ostasien.68.d: "Бирма, молодое королевство, ещё недавно переживавшее глубокий политический кризис, восстановила порядок благодаря быстрым и решительным действиям флота Остазии. Бирманский посол выразил признательность Германской империи и [GEA.GetLeader]. Теперь они стремятся к более тесным отношениям с Германской империей, чтобы защитить свою независимость и стабильность."
Ostasien.68.a: "Гарантировать их независимость."
Ostasien.68.b: "Но я ничего не знаю о Бирме!"

#GEA natural disaster

Ostasien.69.t: "Извержение вулканов Вулкан и Кайя!"
Ostasien.69.d: "Сегодня город Рабаул пострадал от двух мощных вулканических извержений. Несмотря на все наши усилия, сотни жителей не успели эвакуироваться и оказались погребены под пеплом. Миссионеры Святого Сердца наблюдали за взрывными извержениями и быстро организовали эвакуационный лагерь при своей миссии в Хербертсхёэ. Теперь несколько тысяч раненых и лишившихся крова людей ожидают помощи от колониальной администрации после этой катастрофы."
Ostasien.69.a: "Нужно спешить."

# Dissolution of the GEA

#Ostasien.69.t: "Berlin Goes Quiet"
#Ostasien.69.d: "We've now lost all contact with our colonial office in Berlin, not knowing what to do next. Meanwhile the natives start to gather outside the Government Office, demanding independence. The atmosphere is tense like it never has been before."
#Ostasien.69.a: "An uncertain future awaits us."

Ostasien.200.t: "Подкрепления в Восточную Азию"
Ostasien.200.d: "Рейхсколониаламт запросил отправку дополнительных людей для операций в Восточной Азии, чтобы сменить измотанные войска на месте. Хотя этим солдатам было бы куда проще служить на родине, Восточная Азия остаётся очагом синдикализма и борьбы между различными фракциями, с которыми у нас заключены выгодные соглашения."
Ostasien.200.a: "Такова цена Империи."

Ostasien.201.t: "Поставки снаряжения в Восточную Азию"
Ostasien.201.d: "Рейхсколониаламт запросил отправку дополнительного вооружения для операций в Восточной Азии, чтобы сократить дефицит и обеспечить все дивизии полным комплектом снаряжения. Эти винтовки найдут хорошее применение против жителей Востока, осмелившихся выступить против Кайзеррейха."
Ostasien.201.a: "Такова цена Империи."

Ostasien.202.t: "Германия предлагает нам вооружение"
Ostasien.202.d: "Правительство Германской Восточной Азии от имени Германии признало тяжесть нашего положения и предложило щедрую поставку пехотного снаряжения, чтобы помочь нам в борьбе за выживание. Однако за этой добротой наверняка скрывается стремление ещё сильнее подчинить нашу экономику после окончания войны."
Ostasien.202.a: "У нас нет выбора, кроме как согласиться."
Ostasien.202.b: "Мы должны отстоять свою независимость!"

Ostasien.203.t: "Германия предлагает помочь нашей промышленности"
Ostasien.203.d: "Правительство Германской Восточной Азии от имени Германии признало тяжесть нашего положения и предложило временно задействовать некоторые принадлежащие им предприятия на нашей территории для снабжения нашего военного производства. На первый взгляд это крайне полезно, но невольно возникает вопрос: какой окажется цена после окончания войны..."
Ostasien.203.a: "Как бы печально это ни было, от этого зависит выживание нашего правительства."
Ostasien.203.b: "Мы не можем позволить себе ещё сильнее запутаться в их сетях!"

Ostasien.204.t: "Срок аренды фабрик истёк"
Ostasien.204.d: "Условия, установленные A.O.G., предусматривают окончание аренды их предприятий сегодня. Они оказались чрезвычайно полезны в нашей борьбе, и мы уверены, что немцы прекрасно это понимают."
Ostasien.204.a: "Придётся принять последствия этой «помощи»."

Ostasien.205.t: "Истощение шахты Крамат-Пулай"
Ostasien.205.d: "Шахта Крамат-Пулай, являющаяся главным источником нашего экспортного вольфрама, превратила нас в одного из крупнейших мировых поставщиков этого металла. Однако последние отчёты указывают на истощение залежей шеелита и предупреждают, что в ближайшем будущем шахта может быть полностью выработана."
Ostasien.205.a: "Тревожно."

Ostasien.206.t: "Шахта Крамат-Пулай исчерпана!"
Ostasien.206.d: "Запасы шахты Крамат-Пулай официально исчерпаны. Хотя отдельные залежи шеелита всё ещё сохраняются, а шахты Перака продолжают давать приемлемые объёмы, наш статус ведущего экспортёра вольфрама в регионе остался в прошлом."
Ostasien.206.a: "Хорошо было, пока длилось."

Ostasien.207.t: "Влияние A.O.G. в Китае растёт..."
Ostasien.207.d: "На фоне череды противоречивых новостей нашим партнёрам из A.O.G., похоже, наконец улыбнулась удача. Завершение строительства и приобретение Чжэганской железной дороги, крупномасштабного железнодорожного проекта на территории Лиги восьми провинций, позволило A.O.G. распространить своё влияние ещё глубже в китайские земли. Хотя некоторые реакции на действия A.O.G. были далеко не дружелюбными, можно с уверенностью предположить, что это лишь начало благоприятных перемен."
Ostasien.207.a: "Радостно слышать."

Ostasien.208.t: "Чёрный понедельник обрушивается на A.O.G.!"
Ostasien.208.d: "Похоже, наши китайские партнёры переживают кризис Чёрного понедельника ничуть не лучше нас. Особенно сильно пострадали германские предприятия, которые и без того испытывали давление со стороны местных сил. Deutsch-Asiatische Bank, некогда считавшийся слишком крупным, чтобы обанкротиться, теперь балансирует на грани краха, а последствия этой финансовой нестабильности уже начинают отражаться и на нашем собственном финансовом секторе."
Ostasien.208.a: "И вас тоже, значит?"

Ostasien.209.t: "Германский бизнес покидает Лигу"
Ostasien.209.d: "После распада Лиги восьми провинций и начала гражданской войны германская уверенность в существующем порядке, как и в Китае в целом, также рухнула. Хотя Ци Сеюань гарантировал защиту германских интересов после своей победы, вера в дальнейшее существование A.O.G. и его ценных концессионных городов стремительно угасает."
Ostasien.209.a: "Да имейте же хоть немного веры!"

Ostasien.210.t: "A.O.G. остаётся на страже..."
Ostasien.210.d: "После полного уничтожения Нанкинской клики германское влияние в Китае, похоже, столкнулось с серьёзнейшим препятствием. Мы делаем всё возможное, чтобы разместить вытесненную Нанкинскую администрацию в наших концессиях, однако смириться с потерей нашего главного китайского союзника непросто. Тем не менее A.O.G. сохраняет бдительность, а администрация Германской Восточной Азии внимательно следит за отколовшимися режимами, возникшими после распада Лиги."
Ostasien.210.a: "По крайней мере, у нас ещё есть Циндао."

Ostasien.211.t: "Германский бизнес возвращается в Китай"
Ostasien.211.d: "После успешного выживания Нанкинской клики доверие к ведению бизнеса в Китае начало восстанавливаться. Хотя A.O.G. явно потрясено пережитым кризисом, оно рассматривает его одновременно как ценный урок и новую возможность, надеясь использовать ослабленное положение Нанкина, чтобы лучше защитить германские интересы от будущих потрясений."
Ostasien.211.a: "Значит, всё снова как обычно."

Ostasien.212.t: "Связи с Остазией"
Ostasien.212.d: "Поскольку наши нынешние дружественные отношения с Германией остаются прочными, администрация Остазии предприняла шаги по поддержке нашего зарождающегося военно-морского строительства. Их мотивы, несомненно, сугубо прагматичны, однако предлагаемая помощь от этого не становится менее полезной для нашего выживания. Германские инженеры предложили предоставить нашим верфям новые проекты кораблей либо, в качестве альтернативы, направить постоянного военно-морского атташе для дальнейшей подготовки нашего флота."
Ostasien.212.a: "Мы внедрим их проект лёгкого корабля."
Ostasien.212.b: "Нам пригодится их опыт в строительстве линкоров."
Ostasien.212.c: "Постоянный военно-морской атташе будет полезен."

Ostasien.213.t: "Остатки A.O.G..."
Ostasien.213.d: "После полного уничтожения Нанкинской клики глава германского влияния в Китае, похоже, подошла к концу. Мы делаем всё возможное, чтобы разместить вытесненную администрацию A.O.G. в оставшихся концессиях, однако смириться с потерей нашего влияния в Азии непросто."
Ostasien.213.a: "По крайней мере, у нас ещё есть Циндао."

######
Ostasien.214.t: "Апокалипсис сегодня"
Ostasien.214.d: "Душные джунгли Индокитайского полуострова скрывают одну из самых густых и суровых местностей на Земле: тёмные леса и коварные пещеры поглощают бесчисленных несчастных, заблудившихся в их мрачной пасти. Этот ад на Земле отпугивает всех, кроме самых отважных или безумных, и именно здесь Фердинанд Шёрнер занял свой пост. Пока пламя синдикалистской революции стремительно распространяется по региону, Шёрнер принялся подавлять левых повстанцев с холодной эффективностью. Не проявляя ни малейшего раскаяния, он сочетает выдающийся военный талант с беспощадной жестокостью, прокладывая себе путь через Южную Азию. Под его командованием войска Германской Восточной Азии буквально вбомбили этих левых псов обратно в каменный век. Шёрнер не знает ни пощады, ни снисхождения: по его приказу солдаты расстреливают, сжигают заживо и разрывают взрывчаткой мерзких красных в своём крестовом походе за спасение колонии и сохранение германской гегемонии в регионе. В его глазах он всего лишь очищает законные земли кайзера от гнилой заразы синдикализма и без колебаний проведёт этот необходимый экзорцизм марксистской скверны. Пока Шёрнер находится в Индокитае, свет кайзера будет и дальше сиять над этой глушью, а под его командованием силы Германской Восточной Азии непременно одержат победу!"
Ostasien.214.a: "Деревья говорят по-вьетнамски, а Шёрнер отвечает им свинцом."

Ostasien.215.t: "Каждому изобретению найдётся применение"
Ostasien.215.d: "Исследовательские и конструкторские коллективы Кайзеррейха неустанно трудятся над созданием новых способов дать нашим вооружённым силам преимущество над многочисленными врагами. Однако бесконечно производить хорошие идеи непросто, и далеко не каждый проект оправдывает ожидания. Многие самые безумные задумки так и не доходят до производства, но на этот раз, похоже, победили именно самые странные идеи.\n\nЭта одноместная бронированная машина производства Krupp, получившая название «шаровой танк», или «Kugelpanzer», действительно не похожа ни на что другое. Она состоит из крупной сферической кабины, с двух сторон окружённой наклонёнными внутрь круглыми гусеницами, а сзади на небольшой трёхногой опоре закреплено маленькое балансировочное колесо. Kugelpanzer совершенно не похож ни на одну ранее созданную бронемашину. Для водителя предусмотрена лишь узкая смотровая щель спереди, а собственное вооружение отсутствует вовсе, если не считать оружия, которое экипаж возьмёт с собой. По здравому смыслу такие «шаровые танки» вообще не следовало запускать в производство. Однако вопреки логике и здравомыслию было изготовлено 24 машины, которые отправили в германские восточноазиатские колонии для распределения между нашими войсками. При толщине стальной брони всего в 5 мм и лёгком одноцилиндровом двухтактном мотоциклетном двигателе Kugelpanzer, вероятно, окажется полезен разве что в разведке. Какими бы странными и бесполезными эти машины ни казались, выбирать нам не приходится, поэтому остаётся надеяться, что хоть для чего-нибудь они пригодятся."
Ostasien.215.a: "Возможно, здесь от них будет больше пользы, чем от пыления в Берлине."

#####
Ostasien.300.t: "Смерть Альберта Баллина"
Ostasien.300.d: "Горе и подавленность подтачивают человеческое тело, и Альберт Баллин не стал исключением из этой печальной истины. Влиятельный судоходный магнат и новатор морского дела, ставший колониальным губернатором, почти всю жизнь Баллин находился на вершине - по крайней мере, до недавнего времени. Великая депрессия, а затем Чёрный понедельник загнали его компанию и состояние глубоко в убытки, в то время как куда более опасные Красные пытаются разрушить всё, что он создал здесь, в Восточной Азии. Преклонный возраст и тяжесть финансовых проблем привели к быстрому ухудшению как физического, так и психического здоровья Баллина. Однако последней каплей, похоже, стала смерть его старого делового партнёра и друга на всю жизнь Вильгельма Зольфа, покойного штатгальтера Миттельафрики. Потеряв дорогого союзника, стареющий Баллин погрузился в глубокое уныние и на несколько недель заперся в своих покоях, существуя лишь на алкоголе, наркотиках и остатках чёрствого хлеба. Теперь объявлено, что губернатор Баллин скончался. Общественности сообщили, что он всего лишь перенёс сердечный приступ и мирно умер во сне, однако местная администрация и ближайшее окружение знают правду - Баллин покончил с собой, приняв смертельную смесь обезболивающих, опиума и германского спиртного, предпочтя уйти в иной мир в состоянии опьяняющего блаженства и оставить разрушенную жизнь позади. Истину быстро скрыли, чтобы германский гарнизон не выглядел уязвимым перед индокитайскими сепаратистами, которые кружат вокруг нашего режима в поисках любого признака слабости, однако семья и друзья Баллина в Германии были уведомлены о трагедии. Теперь, когда Баллин предан земле, уважаемый адмирал Хельмут фон Мюкке приведён к присяге в качестве исполняющего обязанности губернатора до тех пор, пока Берлин не объявит официального преемника."
Ostasien.300.a: "Уйди с миром в эту долгую ночь, старый друг."

Ostasien.301.t: "Берлин назначает новое правительство"
Ostasien.301.d: "Хотя Хельмут фон Мюкке добросовестно служил кайзеру в качестве временного губернатора колонии после трагической смерти Альберта Баллина, настало время определить нового постоянного губернатора, а это уже обязанность кайзера и Колониального ведомства. Однако обращение в Берлин и получение ответа займут время, поэтому нам остаётся ждать. Считается, что у кайзера и его советников имеется три основных кандидата. Первый и наиболее очевидный - сохранить фон Мюкке в должности полноценного и постоянного губернатора. Для многих это само собой разумеется, учитывая его прославленную морскую карьеру и безупречную службу. Однако называются и два других имени: печально известный аристократ принц Йозиас цу Вальдек унд Пирмонт и заслуженный генерал Август Вильгельм Хайе. Оба, вероятно, также стали бы достойными руководителями колонии, поскольку за плечами каждого долгая служба Кайзеррейху и богатый военный опыт. Но выбор принадлежит нашему государю, и мы с нетерпением ожидаем его решения..."
Ostasien.301.a: "Берлин официально утверждает Хельмута фон Мюкке."
Ostasien.301.b: "Назначить принца Йозиаса цу Вальдек унд Пирмонт."
Ostasien.301.c: "Назначить маршала Августа Вильгельма Хайе."

Ostasien.302.t: "Уступки народу"
Ostasien.302.d: "Чтобы укрепить наши позиции здесь и выполнить прежние обещания, [GEA.getleader] настоял на том, чтобы нынешний режим облегчил положение простого населения Германской Восточной Азии. Промышленные рабочие и крестьяне, составляющие большинство населения и являющиеся опорой нашей экономики, будь то образованные германские рабочие или местные восточноазиатские труженики, являются душой этой колонии. Губернатор [GEA.getleader] объявил о намерении провести целый ряд новых законов в пользу рабочих, чтобы заручиться их поддержкой. Подобные символические экономические и социальные уступки представляют собой лишь незначительную цену для нашей администрации по сравнению с их эффективностью в сохранении мира и той атмосферы стабильности, которую нам удалось здесь создать."
Ostasien.302.a: "Человек из народа, [GEA.getleader] умиротворяет низшие классы!"

Ostasien.303.t: "Уступки знати"
Ostasien.303.d: "Чтобы укрепить наши позиции здесь и выполнить прежние обещания, [GEA.getleader] настоял на том, чтобы нынешний режим установил более тесные связи и заключил новые соглашения с местной элитой Германской Восточной Азии. Хотя по численности они значительно уступают рабочим массам, состояния этих аристократов составляют большую часть неколониальной экономики, а сами они являются хранителями традиций и пользуются уважением внутри своих культур. Будь то колониальные предприниматели, азиатская знать, местные владельцы предприятий или промышленные магнаты, именно эти состоятельные и влиятельные люди задают ритм жизни колонии. Губернатор [GEA.getleader] объявил о намерении провести целый ряд новых законов в пользу элиты, чтобы заручиться её поддержкой. Подобные символические экономические и социальные уступки ничтожны по сравнению с их эффективностью в сохранении мира и той атмосферы стабильности, которую нам удалось здесь создать."
Ostasien.303.a: "Истинный голубокровный, [GEA.getleader] умиротворяет элиты!"

Ostasien.304.t: "Поездка в деревню"
Ostasien.304.d: "На берегу реки Донгнай, всего в нескольких десятках миль к югу от города Анлок, находилась тихая рыбацкая деревня, словно застывшая в традиционном раю - мирный оазис посреди всё более хаотичного Индокитая. Эта идиллия могла бы продлиться ещё десятилетия: местные вьетнамские крестьяне усердно трудились на рисовых полях и с рыбацкими сетями, почти не тревожась о внешнем мире, словно персонажи пасторальной картины. Но такой судьбы им было не суждено.\n\nНеизвестно для большинства жителей, небольшая синдикалистская ячейка начала использовать одно из деревенских рыболовных предприятий как прикрытие для своей радикальной деятельности. Арендуя рыбацкие плоты и другие суда у более сочувствующих рыбаков, эта группа преимущественно молодых, получивших университетское образование и заблуждающихся повстанцев переправляла украденное германское оружие вверх по реке к более крупным партизанским отрядам, скрывавшимся в горах на севере. Наивные юнцы полагали, что помогают благородному делу, но даже не подозревали, что их заговор уже предрешил судьбу всей деревни.\n\nПод рёв моторов вверх по Донгнаю поднялись до зубов вооружённые речные патрульные катера. Фердинанд Шёрнер и его верный отряд смерти из отборных ветеранов подготовили огнемёты, зажигательные гранаты, MP-40 и зажигалки IMCO, ведь в эту глушь они прибыли с одной задачей - превратить это гнездо социализма в пепел. Едва быстроходные суда приблизились к окраине деревенской гавани, люди Шёрнера открыли огонь по рыбакам в лодках, окрасив залив кровью ещё до того, как германские катера причалили. Высадившись, отряд смерти пронёсся через поселение подобно чуме: магазин за магазином опустошался в каждую соломенную хижину, после чего дома поджигали, сжигая внутри мёртвых и раненых. Не прошло и часа, как деревню поглотил бушующий пожар, а воздух наполнился душераздирающими криками и запахом горящей плоти и напалма.\n\nМенее чем через час вся деревня либо пылала, либо уже превратилась в пепел, и в живых не осталось ни одного жителя - ни невиновного, ни социалиста. Многие пытались бежать, но всех расстреляли или предали огню. Шёрнер и его люди действовали настолько тщательно, что зачистили даже тайные проходы под деревней, а единственное судно социалистов, сумевшее вырваться, было сожжено прежде, чем смогло уйти. От прежнего поселения не осталось и следа, и такая же судьба ожидает любую другую деревню, укрывающую индокитайских сепаратистов. Теперь это Восточная Азия Шёрнера, и он намерен сохранить её именно такой."
Ostasien.304.a: "Всего лишь препятствие на пути к совершенному колониализму."

Ostasien.305.t: "Ещё больше уступок?"
Ostasien.305.d.nobles: "Последний раунд уступок знати и элите колонии оказался успешным для нашей администрации, и стабильность вместе с процветанием начали укрепляться. Однако это не остановило наших новых союзников от требований ещё более привилегированного отношения и дополнительных уступок. Их запросы становятся всё более роскошными и невыполнимыми, фактически превращая наше правительство в заложника. Нам необходимо решить, настало ли время указать этим дворянам на дверь и предложить искать новых союзников, за чей счёт они смогут жить, следует ли сократить объём предоставляемой помощи или же просто капитулировать перед их требованиями и позволить аристократам диктовать условия нашей колониальной администрации. Возможно, нам нужна поддержка голубой крови, но стоит ли ради неё удовлетворять каждую их прихоть?"
Ostasien.305.d.people: "Последний раунд уступок простым рабочим колонии оказался успешным для нашей администрации, и стабильность вместе с процветанием начали укрепляться. Однако это не остановило наших новых союзников от требований ещё более привилегированного отношения и дополнительных уступок. Их запросы становятся всё более чрезмерными и невыполнимыми, фактически превращая наше правительство в заложника. Нам необходимо решить, настало ли время указать этим рабочим на дверь и предложить искать новых союзников, за чей счёт они смогут жить, следует ли сократить объём предоставляемой помощи или же просто капитулировать перед их требованиями и позволить прихотям крестьян диктовать условия нашей колониальной администрации. Возможно, нам нужна поддержка низших классов, но стоит ли ради неё удовлетворять каждое их желание?"
Ostasien.305.a: "Сократить поддержку, но оставить достаточно, чтобы они сохраняли спокойствие."
Ostasien.305.b: "Ради сохранения колониальной системы придётся умиротворять их и дальше."
Ostasien.305.c: "Кайзеррейх больше не будет прогибаться перед этими буйными туземцами."

Ostasien.306.t: "Мир с Рейхспактом?"
Ostasien.306.d: "Наконец наша храбрая армия и армада успешно изгнали германских захватчиков из Океании, и теперь мы можем начать переговоры о выгодном мире с Рейхспактом, тем самым обеспечив полный контроль над его обширными тропическими владениями. Теперь нам предстоит решить: продолжать борьбу против германского империализма или заключить мир и окончательно закрепить свои завоевания?"
Ostasien.306.a: "Никакого мира, пока мы не войдём в Берлин!"
Ostasien.306.b: "Нас всё устраивает, отправьте им мирный договор."

Ostasien.307.t: "Сиамский передел?"
Ostasien.307.d: "Теперь, когда земли Сиама находятся под контролем сил, верных кайзеру, перед нами стоит решение, которое определит облик Восточной Азии на десятилетия вперёд. Тайские короли долго удерживали части законных земель наших монархов-подданных - в Малайе, Лаосе и Камбодже - не имея на это чётко определённых и закреплённых международными договорами прав. Мы можем немедленно исправить положение и приказать гарнизонам Остазии занять оставшиеся части этих государств, однако это способно ещё сильнее дестабилизировать и без того хрупкий регион. Какое решение примет Колониальное ведомство?"
Ostasien.307.a: "Проект Остазии должен стать ещё грандиознее!"
Ostasien.307.b: "Воссоединим Камбоджу."
Ostasien.307.c: "Расширим Малайю."
Ostasien.307.e: "Вернём Лаосу его земли."
Ostasien.307.f: "Не нужно делить регион сильнее, чем необходимо."

Ostasien.308.t: "Джорджисты бухты Цзяочжоу"
Ostasien.308.d: "Среди множества наших владений, разбросанных вдоль китайского побережья, арендованная территория залива Киаочоу в бухте Цзяочжоу, расположенная в Шаньдуне, пожалуй, является одной из самых необычных. С момента своего создания в 1898 году эта концессия управлялась на основе джорджистских принципов. Стремясь избежать земельных спекуляций, преследовавших колонии кайзера в Африке, администрация арендованной территории Киаочоу полностью внедрила джорджистскую систему единого налога, при которой единственным источником государственных доходов стал единый шестипроцентный налог на стоимость земли, взимаемый на всей территории владения. Удивительно, но эта система успешно действует уже несколько десятилетий, сохраняя эффективность по сей день и пользуясь широкой популярностью как среди германского, так и среди местного китайского населения. Впрочем, некоторые иностранные деловые круги из других империалистических держав, например Японии, ненавидят эту практику, утверждая, что она сокращает их прибыли.\n\nОднако, несмотря на популярность идей Генри Джорджа во всём политическом спектре, они зародились в левых кругах, и поэтому многие в колонии опасаются, что джорджистские практики могут стать каналом проникновения куда более опасных синдикалистских идей. Следует ли позволить арендованной территории Киаочоу продолжить следовать джорджизму или же пора раз и навсегда покончить с этим предполагаемым псевдосиндикализмом?"
Ostasien.308.a: "Если работает, значит работает. Пусть сторонники единого налога спокойно организуются."
Ostasien.308.b: "Джорджизм? По мне так синдикализм. Немедленно положить этому конец!"

#decisions
GEA_indochina_war_decisions: "Индокитайская война"
GEA_indochina_war_decisions_desc: "Индокитайское восстание переросло в полномасштабную войну. Однако у войны против повстанцев Вьетконга нет чёткой линии фронта. Фронт повсюду, и каждый крестьянин в рисовой шляпе может оказаться бойцом Вьетконга. Мы должны сделать всё возможное, чтобы обеспечить победу Кайзеррейха.\n\nПредполагаемая §Yсила повстанцев§! в Индокитае: §R[?INC.guerilla_activity|-0]§!\n"
reduce_10_guerilla_tooltip: "По нашим оценкам, это снизит §Yсилу повстанцев§! на §R10§!.\n"
GEA_suppress_Tonkin: "Подавить Вьетконг в Тонкине"
GEA_maintain_Tonkin_control: "Сохранить наш контроль над Тонкином"
GEA_reinforce_police: "Усилить полицейские подразделения"
GEA_Zeppelin_decision: "Развернуть дирижабли «Цеппелин»"
GEA_Zeppelin_decision_desc: "С развитием морской авиации дирижабли «Цеппелин» постепенно были вытеснены из арсенала Остазии более современными морскими патрульными самолётами при выполнении задач военно-морской разведки. Однако недавняя война в Индокитае породила смелую идею: использовать «Цеппелины» для патрулирования Индокитайского полуострова. Эти дирижабли также смогут доставлять припасы изолированным гарнизонам. Учитывая слабость противовоздушного вооружения повстанцев, риск должен быть невелик."
GEA_Fernspaher_decision: "Сформировать подразделения Ферншпэеров"
GEA_Fernspaher_decision_desc: "Всё более ожесточённая война в Индокитае выявила слабость нашей армии. Хотя наши пехотные части хорошо оснащены для удержания позиций против врага, они слишком неповоротливы для агрессивных и гибких действий. Предлагается отобрать лучших солдат наших вооружённых сил и, объединив специальные навыки Гебиргсъегерей и Фальширмъегерей, сформировать собственные элитные подразделения Ферншпэеров, лучше приспособленные для выполнения подобных задач."
GEA_reintegrate_Cochinchina_decision: "Реинтегрировать Кохинхину"
GEA_German_vietnamese_reconciliation_decision: "Германо-вьетнамское примирение"
GEA_German_vietnamese_reconciliation_decision_desc: "Воспоминания о противоповстанческих операциях в Индокитае преследуют адмирала Хельмута фон Мюкке, и теперь он чувствует необходимость хоть как-то искупить последствия жестоких убийств. Он намерен проводить более народную колониальную политику, предоставив большую местную автономию и поощряя германо-вьетнамское согласие. Таким образом Мюкке надеется вновь завоевать сердца и умы жителей Кохинхины."
GEA_expand_war: "Расширить австралазийско-германскую войну"
GEA_break_malay_chaos: "Покончить с хаосом в Малайе"
GEA_take_east_asian_navy: "Принять командование Восточноазиатским флотом"
GEA_take_east_asian_navy_desc: "Флот Германской Восточной Азии является ценным элементом нашей военно-морской стратегии. Было бы лучше теснее интегрировать его в берлинскую систему командования."
GEA_Integrate_East_Indies: "Интегрировать администрацию Ост-Индии"
blow_singapore_causeway: "Разрушить дамбу [GetNameGEAJohore]-[GetNameGEASingapore]"
blow_singapore_causeway_desc: "Будучи единственным сухопутным маршрутом между материком и [GetNameGEASingapore], эта дамба в случае уничтожения даст нам драгоценное время для укрепления острова. Однако такой шаг негативно скажется на наших военных усилиях, поскольку фактически будет означать решение оставить материк в руках противника..."

GEA_colonial_decisions: "Имперское колониальное ведомство"
GEA_colonial_decisions_desc: "Рейхсколониаламт, или Имперское колониальное ведомство, осуществляет общее руководство германским колониальным проектом. Поэтому именно через него мы должны получать ценное военное снаряжение и пополнение с Родины."
GEA_steal_manpower_from_home: "Запросить людские ресурсы"
GEA_steal_manpower_from_home_desc: "Наши резервы стремительно истощаются, и вскоре мы больше не сможем поддерживать дивизии в полном составе. Настало время попросить Рейхсколониаламт направить нам с Родины дополнительных призывников для содействия нашим усилиям по дальнейшему продвижению интересов Кайзеррейха."
GEA_steal_guns_from_home: "Запросить оружие"
GEA_steal_guns_from_home_desc: "Наши запасы пехотного снаряжения стали тревожно малы. Чтобы должным образом исполнять свой долг перед кайзером, необходимо запросить у Рейхсколониаламта новую партию оружия."

GEA_help_lep_decisions: "Нанкинский кризис"
GEA_help_lep_decisions_desc: "Различные военачальники и даже синдикалисты восстали против Нанкинского правительства. Мы обязаны помочь ему, чтобы обеспечить безопасность наших инвестиций в Китае, иначе наш контроль над китайской экономикой может рухнуть."
GEA_give_factories_to_lep: "Аренда фабрик"
GEA_give_factories_to_lep_desc: "Мы обсудим с A.O.G. временную передачу части предприятий в концессиях в полное распоряжение Нанкинского правительства, чтобы помочь ему в борьбе за выживание."
GEA_give_guns_to_lep: "Передать им оружие"
GEA_give_guns_to_lep_desc: "Мы обеспечим отправку значительной партии германского снаряжения плохо оснащённым войскам Нанкинского правительства, надеясь тем самым склонить чашу весов в их пользу."

GEA_development_idea: "Горнодобывающие работы"
GEA_develop_aluminum_deposits: "Развивать добычу бокситов в [GetNameGEAJohore]"
GEA_develop_aluminum_deposits_desc: "Наши геологи обнаружили богатые залежи бокситов в [GetNameGEAJohore], идеально подходящие для производства алюминия. Хотя первоначальные затраты на разработку месторождений будут значительными, предполагаемые объёмы добычи оправдывают расходы."
GEA_develop_aluminum_deposits_wtt: "Развивать добычу бокситов в [GetNameGEAJohore]"
GEA_develop_aluminum_deposits_wtt_desc: "Наши геологи обнаружили богатые залежи бокситов в [GetNameGEAJohore], идеально подходящие для производства алюминия. Хотя первоначальные затраты на разработку месторождений будут значительными, предполагаемые объёмы добычи оправдывают расходы."
GEA_develop_sarawak_oil: "Нефтедобыча в Сараваке"
GEA_develop_sarawak_oil_desc: "Нынешние объёмы потребления нефти не позволят снабжать наш флот при длительных военно-морских операциях. Однако, увеличив местную добычу нефти на Борнео, мы сможем начать создавать запас, способный предотвратить дефицит топлива."
GEA_develop_sarawak_oil_wtt: "Нефтедобыча в Сараваке"
GEA_develop_sarawak_oil_wtt_desc: "Нынешние объёмы потребления нефти не позволят снабжать наш флот при длительных военно-морских операциях. Однако, увеличив местную добычу нефти на Борнео, мы сможем начать создавать запас, способный предотвратить дефицит топлива."

GEA_uprising_decisions: "Индокитайское восстание"
GEA_uprising_decisions_desc: "Текущий уровень недовольства в Индокитае: [GetNameGEAIndochinaAnger]\n Удерживайте §Yнедовольство в Индокитае§! ниже §G0§!, чтобы предотвратить §Rвосстание§!"

#Fleet Exercise
#With the arrival of new capital ships, our fleet has experimented and exercised new group tactics. Maybe it's time to have a joint exercise with the High Sea Fleet?
#Fleet Exercise
#Admiral Hellmuth wanted to hold a fleet exercise between the High Sea Fleet and the East Asian fleet. The East Asian fleet is known for their tactic innovation. This might be a good chance to examine our fleet tactics.
#Kaiserliche Marine has decided to launch a large-scale naval exercise in Indian Ocean. The scenario is be a war for the control of Indian Ocean between the Black fleet in a defensive stance and a superior Yellow fleet aimed to destroy the Black fleet and seize the control of the Andaman Islands. The powerful Yellow Fleet, commanded by admiral Wilhelm Marschall, is comprised of some most modern battleships in the High Sea Fleet. The Yellow Fleet will conduct their operation from Trincomalee naval base. Now it's time to decide our fleet composition and plan.
#Deploy our battleships for a face-to-face combat!
#Deploy battlecruisers for strategic deterrance!
#Deploy carrier groups for long-range operation!

#The Yellow Fleet tried to seize the Andaman Islands
#The exercise has started. The intelligence and air reconaissance suggests that the Yellow fleet is actively preparing the invasion of the Andaman islands. It's estimated that the Yellow will try to secure the Bay of Bengal with concentrated fleet, and then launched the invasion. Should we take a defensive stance to intercept Admiral Marschall's fleet in the area close to the Andaman islands, or try to take the initiative to disturb enemy operation by aggressive actions?
#Intercept them
#Take the initiative!

#Result: Black fleet tactic defeat - battlecruisers
#The Black fleet located the invading Yellow fleet by air reconaissance. Our battlecruisers soon encountered the Yellow scout cruisers. Although the Yellow fleet was slaughtered by Black battlecruisers in the initial encounter, Yellow battleships managed to arrived in time and overwhelmed the Black fleet with massive firepower. One Black battlecruiser suffered critical hits in their engine room and failed to escape but the rest returned to [GetNameGEASingapore]. Having suffered heavy loss of cruisers, the Yellow fleet doesn't have enough screen ships to support the amphibious assault either. The battle was considered a tactic defeat of the Black fleet but the result was strategic stalemate.

#Result: Black fleet tactic victory - battleships
#The Black fleet located the invading Yellow fleet by air reconaissance. The Black scout line spread out in front of the main battle force soon encountered the Yellow scout cruisers. The Black battelships were placed in execellent position to deal serious blows to the Yellow cruisers. Admiral Marschall's main force came into action before the cruisers were annihilated. Over the next hours both fleets exchanged long-range gunfire. The new rangefinders on SMS Neckar allowed it to deliver precious hits even when firing at extreme range. Admiral Hellmuth broke the engagement before the Yellow fleet could shorten the range and fully exploit its numerous advantage. managed to withdraw, it had suffered heavy loss and lost the ability to defend the Andaman islands, and the Yellow fleet eventually was able to launch an amphibious operation. Although the battle was indecisive, the Yellow fleet doesn't have enough screen ships to support the amphibious assault and the exercise ended up with Black fleet's strategic victory.

#Result: Black fleet strategic defeat - battleships
#Black's advance was quickly located by the Yellow's picket line of submarines, depriving them of any advantage of surprise. Soon, the Black fleet encountered the Admiral Marschall's cruiser group west of the Andaman islands. The Yellow cruisers turning to the north-west on a course to rejoin the battleships. The Black fleet pursued the cruisers until the Yellow battelships moved into position. Over the next hours both fleets exchanged long-range gunfire and the Black fleet was outgunned by the superior Yellow fleet. When Admral Hellmuth's fleet managed to withdraw, it had suffered heavy loss and lost the ability to defend the Andaman islands, and the Yellow fleet eventually was able to launch an amphibious operation. The exercise ended up with Black fleet's strategic defeat.


#Result: Black fleet strategic victory - battlecruisers
#Admiral Hellmuth decided to disperse his cruisers to harass the Yellow fleet and use battlecruiser to support them. These commerce destroyers posed great threats to the Yellow convoys. The Yellow fleet attempted to fend off the raiders by search and destroy actions but the Black cruisers avoid the engagement. Finally Admiral Marschall decided to disperse his fleet to protect the convoys. In an engagement, the convoys escorted by a Yellow battleship was assaulted by a Black raiding fleet supported by three battlecruisers. The convoys were savaged before the reinforcement arrived. The Yellow fleet was deterred from further actions. The result was judged a strategic victory of Admiral Hellmuth's Black fleet.

#Result: Black fleet decisive victory - carriers
#Admiral Hellmuth decided to take an audacious action: The black fleet comprised four aircraft carriers plus supporting ships under the command of the Admiral moved to about 200 miles south of Sri Lanka. The first attack wave of 93 aircraft took off in pre-dawn darkness heading towards Trincomalee. The air strike achieved complete surprise. The Yellow battle fleet and convoys are at anchor in the harbour of Trincomalee and failed to organise any resistance. Aerial torpedo experts in all modern navies had previously thought that torpedo attacks against ships can not take place in shallow waters, but the Ostasien fleet had developed a new method of preventing torpedoes from diving too deep. The air strike delivered a devastating blow to the Yellow fleet with surprisingly little loss of planes. The exercise ended up with Black decisive victory.

#Result: Black fleet decisive victory - carriers
#The Black carriers and screen ships formed a concentrated battle group sailing towards the west. The scout bombers managed to locate the Yellow convoys by the morning. A massive attack wave was launched but the pilot missed the position of the convoys. Instead, they discovered the location of the Yellow main forces. The Ostasien torpedo bombers launched their strike with deadly precision. As a result of two waves of aerial attacks, at least three Yellow battelships and two cruisers were judged to have suffered damage, among which one cruiser considered to be hit by three torpedoes was judged sunk. The loss of Black aircrafts was negeligible. The exercise ended up with Black decisive victory.

#Result: Black fleet strategic defeat - carriers
#The Black's advance was quickly located by the Yellow's picket line of submarines. Due to the failure of reconaissance, Black carriers encountered the scout cruisers fleet of the Yellow. Significant damage was laid on carriers during the surface gunfire action, with Hellmuth's carrier eventually judged sunk by torpedo from a Yellow destroyer. The Black fleet had lost the ability to defend the Andaman islands, and the Yellow fleet eventually was able to launch an amphibious operation. The exercise ended up with Black fleet's strategic defeat.



