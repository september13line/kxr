### Leader Bios ###
POLITICS_SCHORNER_DESC: "Кто бы мог подумать, что однажды Фердинанд Шёрнер возглавит владения кайзера в Восточной Азии? Несмотря на тщетные усилия его недоброжелателей, теперь это стало реальностью.\n\nРодившийся в 1892 году Шёрнер вступил в Баварскую армию в 1911 году и доблестно сражался во время Вельткрига, заслужив награды и завершив войну в звании лейтенанта. Он отличался впечатляющими командными и организаторскими способностями, будучи в состоянии управлять группировкой численностью свыше 500 000 человек, хотя некоторые критиковали его за жестокость и называли беспощадным. После завершения Вельткрига Шёрнер вступил в Пангерманский союз фон Геринга. Будучи убеждённым националистом и беззаветно преданным Германии, он участвовал в нескольких германских военных экспедициях в различных странах мира, что в итоге принесло ему заслуженное повышение до генерала.\n\nЗатем Шёрнера направили в Индокитай, где он часто конфликтовал с начальством, особенно по вопросу использования местного населения. Шёрнер отказывался командовать подразделениями, состоявшими из туземцев, предпочитая части, полностью укомплектованные чистокровными немцами. Он хотел, чтобы вся колониальная армия состояла исключительно из немцев, а не из «дикарей», как он называл местных жителей. Местные элиты Шёрнер считал бесполезными как для управления колонией, так и для выполнения цивилизаторской миссии, предпочитая им исключительно германскую правящую касту.\n\nПосле того как прежняя администрация потеряла Индокитай, уступив его социалистам, Шёрнер возглавил Германскую Восточную Азию и намерен воплотить там свои крайние принципы, сохраняя германский порядок любой ценой."
POLITICS_HEYE_DESC: "Лишь самые храбрые и сильные мужчины осмеливаются отправиться в глубокие и враждебные джунгли владений кайзера в Восточной Азии, и Хайе - один из них.\n\nОпытный и уважаемый ветеран Вельткрига, личный друг Эриха Людендорфа и пожизненный слуга кайзера, Хайе посвятил свою жизнь и сердце величию Германской империи. Подобно фон Эппу в Миттельафрике, он намерен использовать любые необходимые средства для поддержания порядка в колониях, которыми теперь управляет железной рукой, обещая как административную, так и военную централизацию. Старый ветеран, похоже, настроил против себя местное население, а некоторые критикуют его взгляды, фактически отстраняющие местные элиты от управления Германской Восточной Азией.\n\nОднако Хайе это не волнует. Кайзер поручил ему миссию, и он намерен выполнить её с блеском, как делал всегда."
POLITICS_BALLIN_DESC: "Альберт Баллин - один из самых известных людей Германии во всём, что связано с морем. Блестящий предприниматель, он является генеральным директором Hamburg-Amerikanische Packetfahrt-Actien-Gesellschaft, которая после победы Германии в Вельткриге стала крупнейшей судоходной компанией мира. Именно Баллин считается создателем концепции круизного лайнера: построенный им SS Augusta Victoria, названный в честь германской императрицы Августы Виктории Шлезвиг-Гольштейнской, стал первым современным круизным судном в мире и ярким свидетельством германского ума и гения.\n\nОгромный опыт Баллина побудил кайзера назначить его главой Германской Восточной Азии, и тот с радостью принял эту честь, ведь счастливее всего он всегда чувствовал себя у воды. Его правление ознаменовалось спокойным статус-кво, сохранявшимся десятилетиями. Колония, похоже, процветает как в финансовом отношении, так и в вопросах стабильности, несмотря на усиление социалистического сопротивления в Индокитае, где повстанцы напрямую финансируются Третьим Интернационалом.\n\nОднако, несмотря на это невозмутимое спокойствие, Альберт Баллин уже стар, и многие считают, что дни старого германского судоходного магната сочтены. Вопрос о его преемнике становится всё более насущным с каждым днём."
POLITICS_JOSIAS_DESC: "Принц Йозиас цу Вальдек унд Пирмонт является наследным принцем княжества Вальдек-Пирмонт, сыном Фридриха Вальдек-Пирмонтского и генералом армии кайзера. Поэтому было вполне естественно, что с началом Вельткрига в Европе Йозиас поступил кадетом в Императорскую армию. Во время войны он получил тяжёлое ранение, но чудом сумел выжить.\nОтец Йозиаса, разочарованный его военной службой, убедил кайзера отправить сына в Восточную Азию, чтобы тот искупил свои неудачи. Однако, к удивлению отца, Йозиас проявил себя способным военным и колониальным администратором и чрезвычайно сблизился с судоходным магнатом и главой Германской Восточной Азии Альбертом Баллином. Поддерживая политику и решения Баллина, он оказывал ему значительную помощь в их реализации, и многие стали считать Йозиаса правой рукой старика, что обеспечило ему выгодное положение в борьбе за место преемника.\n\nИменно это теперь и произошло. Йозиас цу Вальдек унд Пирмонт по-настоящему возглавил колонию и намерен сохранить незыблемый статус-кво, продолжая политику своего предшественника. Теперь его отец наконец может им гордиться. Остаётся лишь увидеть, сумеет ли Йозиас сохранить целостность колонии или же кружащие вокруг неё социалистические псы Индокитая утащат Германскую Восточную Азию в ад."
POLITICS_HELLMUTH_VON_MUCKE_DESC: "Гельмут фон Мюкке - само воплощение моряка, вечно ищущего новые открытия, новые волны, по которым можно пройти, и удивительные народы, с которыми можно познакомиться.\n\nОн прославился как предводитель небольшой группы германских моряков, которые во время Вельткрига оказались отрезаны в Индийском океане. После множества приключений Мюкке сумел вместе со своей командой вырваться из ловушки и в ходе долгого путешествия добраться до Индонезии, откуда им удалось отплыть в Хиджаз. Затем моряки решили пробиваться к Константинополю, чтобы наконец оказаться в безопасности. Им пришлось пересечь Аравию, остановиться в Мекке, пережить нападение бедуинов, пройти через Сирию и в конце концов триумфально прибыть в османскую столицу, где в честь Гельмута и его команды была устроена торжественная церемония и вручены награды.\n\nПолучив звание капитана, после войны Мюкке был направлен в Германскую Восточную Азию и воспользовался этой возможностью, чтобы ближе познакомиться с чрезвычайно разнообразными коренными народами колонии. Он стал одним из важнейших сторонников расширения политических, религиозных и экономических прав местного населения, децентрализации колонии, а также политики уважения к обычаям и верованиям коренных народов. Великий адмирал также известен тесными связями с Реформгруппой в Миттельафрике. Теперь, придя к власти в колонии, фон Мюкке при поддержке единомышленников среди администрации, местных элит и коренных народов намерен повести её к более светлому будущему."
POLITICS_FELIX_VON_LUCKNER_DESC: "Бороздивший моря с юных лет и ставший одним из величайших флотоводцев кайзера, Феликс Николаус Александр Георг граф фон Люкнер является одним из самых прославленных моряков, когда-либо поднимавших паруса. Он родился в Дрездене в 1881 году в известной военной семье и с детства находился под постоянным давлением, поскольку отец ожидал, что сын, подобно ему, вступит в кавалерию. Не выдержав этого, в тринадцать лет Люкнер сбежал из дома. Взяв вымышленное имя «Филакс Людеке», он сумел устроиться неоплачиваемым юнгой на старое русское парусное судно, направлявшееся в Австралию. Несмотря на то что во время путешествия он едва не погиб, молодой фон Люкнер быстро полюбил морскую жизнь. Прибыв в Австралию, мальчик перебивался множеством случайных заработков, которые впоследствии понесли его по всему миру: он успел побыть чернорабочим, барменом, боксёром, охотником на кенгуру, цирковым артистом, рыбаком, смотрителем маяка, охранником мексиканского президента и даже отсидеть срок в чилийской тюрьме за кражу нескольких свиней - и всё это ещё до двадцатилетия. После освобождения он вернулся в Германию и поступил в навигационную школу, чтобы стать настоящим моряком. Затем Люкнер служил на пароходной линии из Гамбурга, пока наконец не вернулся к семье и в 1912 году, всего за два года до Вельткрига, не был призван на службу во флот кайзера. Именно эта война принесла фон Люкнеру славу. Сначала он служил на SMS Panther, где быстро приобрёл репутацию блестящего морского офицера. Раз за разом нанося поражения британскому флоту, Люкнер заставил англичан бояться своего имени и получил знаменитое прозвище «Der Seeteufel» - «Морской дьявол». После многочисленных побед кайзер передал ему конфискованный трёхмачтовый корабль, переименованный в Seeadler - «Морского орла», и назначил фон Люкнера его командиром. Оснащённые современными орудиями Морской дьявол и его «Piraten des Kaisers», «Пираты кайзера», возродили практику рейдерской войны против торгового судоходства и с огромным успехом использовали её для нарушения британских линий снабжения. После войны фон Люкнер продолжил служить кайзеру, совершая рейды на вражеские морские пути и топя суда противников по всем Семи морям, попутно получая новые награды, пока в конце концов не оказался в Германской Восточной Азии под командованием Гельмута фон Мюкке. Теперь, когда неудачи Зольфа и Мюкке привели к потере значительной части Германской Восточной Азии, Морской дьявол фон Люкнер унаследовал их командование. Под его надзором Восточная Азия вновь будет укрощена во славу кайзера - если, конечно, старый пират не решит попросту взять всё в собственные руки..."

