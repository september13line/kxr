### Ideas ###
GEA_colonial_nation: "Колониальное правительство"
GEA_colonial_nation_desc: "Несмотря на ограниченную самостоятельность в отношениях с соседями, GEA фактически является колониальным правительством: весь государственный аппарат зависит от германской мощи и поддерживается ею, бюджет составляется в Берлине, а валюта привязана к германской марке."
GEA_colonial_question: "Колониальный вопрос"
GEA_colonial_question_desc: "Количество людских ресурсов, которое способны привлечь наши сухопутные силы, крайне ограничено. Строгие правила в отношении службы иностранных граждан и общее нежелание местного населения вступать в армию препятствуют созданию более крупных вооружённых сил."
GEA_prussian_force: "Прусская мысль"
GEA_prussian_force_desc: "Было решено, что местное население недостаточно пригодно для службы великому адмиралу или кайзеру. Хотя это значительно ограничит наши возможности по набору личного состава, качество солдат станет выше."
GEA_local_troops: "Местная динамика"
GEA_local_troops_desc: "Как бы нам ни хотелось обратного, германских людских ресурсов попросту недостаточно для формирования необходимых новых частей. Нам придётся набирать местных жителей, как бы сильно они ни не любили нас, а мы - их."
GEA_admirality: "Великое Адмиралтейство"
GEA_admirality_desc: "Германская Восточная Азия - земля, над которой господствует флот. Великая армада под командованием [GEA.getleader] является одной из сильнейших, когда-либо виденных миром. Наши могучие плавучие крепости защищают этот тропический рай от восстаний и иностранных захватчиков, оберегая главную жемчужину азиатской сферы Кайзеррейха. Хотя эти земли склонны к сепаратизму и радикализму, именно могучий флот удерживает их в безопасности и исключительно в германских руках, поэтому военно-морские силы являются нашим высшим приоритетом. Всё, что может выделить наша страна, направляется этому великолепному флоту, ведь без него мы неизбежно погрузились бы в хаос и дикость. И хотя господство флота может вредить другим сферам государства, нашей шайке морских волков до этого нет дела - ведь жизнь моряка и есть наша судьба!"
GEA_language: "Германский стандарт"
GEA_language_desc: "Мы реорганизовали наши вооружённые силы, включив в их состав местных жителей и обеспечив, чтобы каждый унтер-офицер, офицер и командир свободно владел немецким языком для более эффективного управления теперь уже объединёнными войсками."
GEA_counter_insurgency: "Миттельафриканские советники"
GEA_counter_insurgency_desc: "Использование как обычных, так и «нетрадиционных» методов, разработанных ветеранами суровых кампаний в Африке, дало нашим войскам необходимое преимущество."
GEA_black_monday_idea: "Чёрный понедельник"
GEA_black_monday_idea_desc: "Чёрный понедельник обрушился на нас и парализовал нашу и без того слабую промышленность."
GEA_black_monday_idea2: "Восстановление после Чёрного понедельника"
GEA_black_monday_idea2_desc: "Чёрный понедельник обрушился на нас и парализовал нашу и без того слабую промышленность, однако мы предпринимаем усилия для восстановления."
GEA_austerity_budget: "Бюджет строгой экономии"
GEA_austerity_budget_desc: "Несмотря на меры по смягчению последствий Чёрного понедельника, Адмиралтейство по-прежнему ограничено недостатком финансирования."
GEA_austerity_budget2: "Бюджет строгой экономии"
GEA_austerity_budget2_desc: "Несмотря на меры по смягчению последствий Чёрного понедельника, Адмиралтейство по-прежнему ограничено недостатком финансирования."
