Ostasien.100.t: "Большой парад"
Ostasien.100.d: "В 09:00 Великий Остазиатский флот вышел из гавани [GetNameGEASingapore] для проведения масштабных учений за пределами города. Наши авианосные силы продемонстрировали впечатляющие учебные воздушные атаки, дополненные мощными бортовыми залпами линкоров. После завершения манёвров флот направился в Циндао для проведения новых учений, которые должны послужить предупреждением всем, кто осмелится нам угрожать."
Ostasien.100.a: "И правильно делают, что боятся нашей мощи."

