### Leader Bios ###
POLITICS_SCHORNER_DESC:0 "Кто бы мог подумать, что однажды Фердинанд Шёрнер возглавит владения кайзера в Восточной Азии? Несмотря на тщетные усилия его недоброжелателей, именно это теперь стало реальностью.\n\nРодившийся в 1892 году Шёрнер вступил в Баварскую армию в 1911 году и доблестно сражался во время Вельткрига, заслужив награды и завершив войну в звании лейтенанта. Он отличался впечатляющими командными и организаторскими способностями и был способен руководить группировкой численностью свыше 500 000 человек, хотя некоторые критиковали его за жестокость и называли беспощадным. После окончания Вельткрига Шёрнер вступил в Пангерманский союз Геринга. Будучи убеждённым националистом и преданным Германии человеком, он участвовал в нескольких германских военных экспедициях в различных странах мира, что принесло ему заслуженное повышение до генерала.\n\nЗатем его направили в Индокитай, где он часто конфликтовал с начальством, особенно по вопросу отношения к коренному населению. Шёрнер отказывался командовать подразделениями, состоящими из местных жителей, предпочитая части, полностью укомплектованные чистокровными немцами. Он желал, чтобы вся колониальная армия состояла исключительно из германцев, а не из «дикарей», как он называл местное население. Местные элиты он считал бесполезными как в управлении колонией, так и в осуществлении цивилизаторской миссии, предпочитая им исключительно германскую правящую касту.\n\nПосле того как прежняя администрация потеряла Индокитай, уступив его социалистам, Шёрнер возглавил Германскую Восточную Азию и намерен любой ценой воплотить здесь свои крайние принципы и сохранить германский порядок."
POLITICS_HEYE_DESC:0 "Лишь самые храбрые и сильные мужчины осмеливаются отправляться в глубокие и враждебные джунгли, которыми изобилуют владения кайзера в Восточной Азии, и Хейе - один из них.\n\nОпытный и уважаемый ветеран Вельткрига, личный друг Эриха Людендорфа и пожизненный слуга кайзера, Хейе посвятил свою жизнь и сердце величию Германской империи. Подобно Эппу в Миттельафрике, он намерен использовать любые необходимые средства для поддержания порядка в колониях, которыми теперь управляет железной рукой, обещая как административную, так и военную централизацию. Старый ветеран, похоже, настроил против себя местное население, а некоторые критикуют его взгляды, фактически отстраняющие коренные элиты от управления Германской Восточной Азией.\n\nНо Хейе это не волнует. Кайзер поручил ему миссию, и он намерен выполнить её с блеском, как делал всегда."
POLITICS_BALLIN_DESC:0 "Альберт Баллин - один из самых известных в Германии людей во всём, что связано с морем и судоходством. Блестящий предприниматель, он является генеральным директором Hamburg-Amerikanische Packetfahrt-Actien-Gesellschaft, которая после германской победы в Вельткриге превратилась в крупнейшую судоходную компанию мира. Именно Баллин считается создателем концепции круизного лайнера: построенный им SS Augusta Victoria, названный в честь германской императрицы Августы Виктории Шлезвиг-Гольштейнской, стал первым современным круизным судном в мире и наглядным свидетельством германского ума и гения.\n\nЕго огромный опыт побудил кайзера назначить Баллина главой Германской Восточной Азии, и тот с радостью принял оказанную честь, ведь настоящее счастье он всегда находил на воде. Его правление ознаменовалось спокойным статус-кво, сохранявшимся десятилетиями. Колония, судя по всему, благополучна как в финансовом отношении, так и с точки зрения стабильности, несмотря на усиление социалистического сопротивления в Индокитае, где повстанцы получают прямое финансирование от Третьего Интернационала.\n\nОднако, несмотря на это невозмутимое спокойствие, Альберт Баллин уже стар, и многие считают, что дни престарелого германского судоходного магната сочтены. Вопрос о его преемнике с каждым днём становится всё насущнее."
POLITICS_JOSIAS_DESC:0 "Принц Йозиас цу Вальдек унд Пирмонт - наследный принц княжества Вальдек-Пирмонт, сын Фридриха Вальдек-Пирмонтского и генерал армии кайзера. Когда в Европе вспыхнул Вельткриг, Йозиас вполне закономерно поступил кадетом в Императорскую армию. Во время войны он получил тяжёлое ранение, но чудом сумел выжить.\nОтец Йозиаса, разочарованный его военными результатами, убедил кайзера отправить сына в Восточную Азию, чтобы тот смог искупить свои неудачи. Однако, к удивлению отца, Йозиас проявил себя способным военным и колониальным администратором и чрезвычайно сблизился с судоходным магнатом и главой Германской Восточной Азии Альбертом Баллином. Поддерживая политику и решения Баллина, он значительно помогал в их осуществлении, и многие стали считать его правой рукой старика, что обеспечило Йозиасу привилегированное положение среди возможных преемников.\n\nТеперь именно это и произошло. Йозиас цу Вальдек унд Пирмонт прочно стоит во главе колонии и рассчитывает сохранить незыблемый статус-кво, продолжая политику своего предшественника. Теперь его отец может им гордиться. Остаётся лишь узнать, сумеет ли Йозиас сохранить целостность колонии или же кружащие вокруг Индокитая социалистические псы утащат Германскую Восточную Азию в ад."
POLITICS_HELLMUTH_VON_MUCKE_DESC:0 "Хельмут фон Мюкке - само воплощение моряка, вечно стремящегося к новым открытиям, новым волнам и встречам с удивительными коренными народами.\n\nОн прославился как предводитель небольшой группы германских моряков, оказавшихся во время Вельткрига отрезанными в Индийском океане. После множества приключений Мюкке вместе с экипажем сумел выбраться, совершив долгое путешествие до Индонезии, где им удалось сесть на судно, направлявшееся в Хиджаз. Оттуда они намеревались добраться до Константинополя и наконец оказаться в безопасности, однако для этого им пришлось пересечь Аравию. По пути они остановились в Мекке, подверглись нападению бедуинов, затем прошли через Сирию и в конце концов триумфально прибыли в османскую столицу, где в их честь была устроена церемония, а Хельмут и его экипаж получили заслуженные почести.\n\nПолучив звание капитана, после войны Мюкке был направлен в Германскую Восточную Азию и воспользовался возможностью ближе познакомиться с многочисленными коренными народами, населявшими колонию. Он стал одним из важнейших сторонников расширения политических, религиозных и экономических прав местного населения, децентрализации колонии и политики уважения к обычаям и верованиям коренных народов. Гросс-адмирал также известен тесными связями с Реформгруппе, действующей в Миттельафрике. Теперь, придя к власти в колонии, Мюкке при поддержке единомышленников среди администрации, местных элит и коренных народов намерен повести Германскую Восточную Азию к более светлому будущему."
POLITICS_FELIX_VON_LUCKNER_DESC:0 "С детства бороздивший моря и ставший одним из величайших морских командиров кайзера, Феликс Николаус Александр Георг граф фон Люкнер является одним из самых прославленных моряков, когда-либо выходивших в плавание. Он родился в Дрездене в 1881 году в известной военной семье и с юных лет находился под постоянным давлением, поскольку отец ожидал, что сын, как и он сам, поступит в кавалерию. Не выдержав этого, в тринадцать лет Люкнер сбежал из дома. Взяв вымышленное имя «Филакс Людеке», он сумел устроиться неоплачиваемым юнгой на старое русское парусное судно, направлявшееся в Австралию. Несмотря на то, что во время путешествия он едва не погиб, юный Люкнер быстро освоился с морской жизнью. Прибыв в Австралию, мальчик брался за самые разные случайные заработки, которые в итоге провели его по всему миру: он был разнорабочим, барменом, боксёром, охотником на кенгуру, цирковым артистом, рыбаком, смотрителем маяка, телохранителем президента Мексики и даже успел отсидеть в чилийской тюрьме за кражу нескольких свиней - и всё это до двадцатилетия. После освобождения Люкнер вернулся в Германию и поступил в навигационную школу, чтобы стать настоящим моряком. Затем он работал на пароходной линии в Гамбурге, наконец примирился с семьёй и в 1912 году был призван на службу во флот кайзера, всего за два года до Вельткрига. Именно на этой войне Люкнер обрёл славу. Сначала он служил на SMS Panther, где быстро заработал репутацию блестящего морского офицера. Раз за разом нанося поражения британскому флоту, он внушил англичанам настоящий страх и получил знаменитое прозвище «Der Seeteufel» - «Морской дьявол». После многочисленных побед кайзер подарил Люкнеру конфискованный трёхмачтовый парусник, переименованный в Seeadler - «Морской орёл», и передал его под командование капитана. Оснащённые современными орудиями Морской дьявол и его «Piraten des Kaisers» возродили крейсерскую войну против торгового судоходства и с огромной эффективностью нарушали британские линии снабжения. После войны Люкнер продолжил служить кайзеру, совершая рейды на вражеские морские пути и топя неподконтрольные суда по всем Семи морям, по пути зарабатывая новые награды, пока наконец не оказался в Германской Восточной Азии под командованием Хельмута фон Мюкке. Теперь, после провалов Зольфа и Мюкке, из-за которых значительная часть Германской Восточной Азии была потеряна, Морской дьявол Люкнер унаследовал их командование. Под его надзором Восточная Азия вновь будет укрощена во имя кайзера - если только старый пират не решит взять всё в собственные руки..."

