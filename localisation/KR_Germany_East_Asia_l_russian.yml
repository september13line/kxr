GEA_start_naval_blockade:0 "Начать морскую блокаду"
GEA_start_naval_blockade_desc:0 "Конвои Интернационала могут беспрепятственно входить в Южно-Китайское море и тайно снабжать индокитайских повстанцев. Так больше продолжаться не может."
