### Focuses ###
GEA_mission1:0 "Статус Адмиралтейства"
GEA_mission1_desc:0 "После аннексии французских колоний и включения британских территорий Германская Восточная Азия превратилась в уникальную по масштабам контроля колониальную администрацию. После смерти Баллина колонией временно управляют великий адмирал Гельмут фон Мюкке и Восточноазиатский флот, и теперь нам необходимо пересмотреть статус нашей продолжающейся миссии по защите колоний от внешних агрессоров и определить, каким образом лучше всего её выполнять."
GEA_army1:0 "Восточноазиатские силы"
GEA_army1_desc:0 "В настоящее время Восточноазиатские силы представляют собой разрозненную смесь восточноазиатской морской пехоты, местных гарнизонных частей и свежих пополнений из Берлина. Нам следует оценить положение и решить, сосредоточиться ли на более широком наборе местного населения или продолжить усиливать наши части солдатами из Отечества."
GEA_military1:0 "Запросить оружие у Берлина"
GEA_military1_desc:0 "У нас по-прежнему отсутствует сколько-нибудь развитая военно-промышленная база, из-за чего мы зависим от поставок из Берлина. Пока у нас не появится возможность создать собственное снабжение, следует запросить у Отечества дополнительные винтовки."
GEA_military2:0 "Запросить современную артиллерию"
GEA_military2_desc:0 "Наши нынешние артиллерийские орудия представляют собой ржавые реликты ещё довельткриговской эпохи. Чтобы лучше защищать колонии, следует запросить у Берлина современные образцы."
GEA_military3:0 "Запросить дополнительные поставки оружия"
GEA_military3_desc:0 "По мере дальнейшего роста напряжённости в регионе нам необходимо ещё сильнее укрепить наши постоянные силы. Мы направим в Берлин запрос на дополнительное снаряжение."
GEA_germantroops1:0 "Германские силы"
GEA_germantroops1_desc:0 "Местные жители не годятся для того, чтобы защищать кайзера и умирать за него. Мы должны и дальше полагаться на германские войска, даже если это уменьшает общую численность наших сил."
GEA_germantroops2:0 "Прусская дисциплина"
GEA_germantroops2_desc:0 "Наша армия должна воплощать дух воинов, принёсших нам победу в Вельткриге: суровую дисциплину и воинскую честь высочайшего порядка."
GEA_germantroops3:0 "Привлечь военную полицию"
GEA_germantroops3_desc:0 "В настоящее время наша военная полиция существует преимущественно в неформальном виде и располагает лишь лёгким стрелковым оружием, используемым при патрулировании. Поскольку нам требуются дополнительные люди, следует вооружить эти подразделения и включить их в состав вспомогательных сил."
GEA_germantroops4:0 "Запросить прусских гвардейцев у Берлина"
GEA_germantroops4_desc:0 "Если мы хотим удержать колонии и защитить их от фанатичных агрессоров, нам нужны столь же фанатичные солдаты. Мы направим в Берлин запрос на новую дивизию ударных войск, которая поможет укрепить нашу оборону."
GEA_localtroops1:0 "Использовать местных"
GEA_localtroops1_desc:0 "Хотя местные жители никогда не сравнятся с германской силой и прусской дисциплиной, остаётся простой факт: их намного больше, чем нас. В конце концов, войны выигрывают числом, а не парадной выправкой."
GEA_localtroops2:0 "Местные гарнизоны"
GEA_localtroops2_desc:0 "У нас действительно имеется многочисленное местное население, и хотя эти люди, возможно, не станут сражаться и умирать за нас так же, как немцы, они будут сражаться и умирать за собственный народ. Следует сформировать ряд гарнизонных дивизий и разместить их в родных регионах."
GEA_localtroops3:0 "Преодолеть языковой барьер"
GEA_localtroops3_desc:0 "Наши вооружённые силы страдают от проблем со связью из-за запутанной сети языков и переводчиков. Мы решим эту проблему, передав полковым офицерам больше полномочий в вопросах языка и состава подразделений, чтобы свести подобные трудности к минимуму."
GEA_localtroops4:0 "Официальные права за службу"
GEA_localtroops4_desc:0 "В настоящее время наши колониальные подданные не пользуются теми же правами, что и германские граждане, даже если служат в вооружённых силах. Чтобы привлечь больше добровольцев, это должно измениться, а сама служба должна быть достойно вознаграждена."
GEA_budget1:0 "Бюджетная экономия"
GEA_budget1_desc:0 "На фоне мирового финансового кризиса, исходящего из Берлина, мы должны немедленно сократить расходы и увеличить доходы, иначе столкнёмся с огромным дефицитом бюджета."
GEA_budget2:0 "Колониальная марка"
GEA_budget2_desc:0 "В отличие от наших друзей в Африке, мы никогда не предпринимали серьёзных усилий для распространения Остазиенмарки с момента её введения в 1927 году. Сделав её использование обязательным, мы повысим единообразие денежного обращения в колониях и улучшим сбор доходов."
GEA_budget3:0 "Разделить наше бремя"
GEA_budget3_desc:0 "Местные европейские поселенцы давно пользуются нашей защитой и платят взамен крайне мало налогов за поддерживаемый нами порядок. Однако поскольку управление колониями зависит от их сотрудничества и слишком далеко заходить нельзя, разумнее будет заключить с ними соглашение."
GEA_budget4:0 "Укрепить колониальную бюрократию"
GEA_budget4_desc:0 "Германская Восточная Азия никогда не располагала полностью дееспособной администрацией, способной последовательно проводить её волю. Теперь, на фоне колониальных волнений, настало время расширить бюрократический аппарат и установить прямое управление нашими колониями."
GEA_budget5:0 "Умиротворение [GetNameGEAIndochina]"
GEA_budget5_desc:0 "[GetNameGEAIndochina] является важнейшей частью администрации Германской Восточной Азии и крупным экономическим центром. Пока над регионом нависает угроза вьетконговских повстанцев, вполне разумно провести его умиротворение и укрепление."
GEA_budget6:0 "Фабрики Сингапура"
GEA_budget6_desc:0 "В настоящее время [GetNameGEASingapore] практически лишён сколько-нибудь значимой тяжёлой промышленности. Некоторые германские корпорации заинтересованы в переносе деятельности в Азию, однако прежде чем начать, требуют от нас гарантий поддержки своих инвестиций. Новые фабрики увеличат занятость и помогут стабилизировать положение."
GEA_budget7:0 "Умиротворение Малайи"
GEA_budget7_desc:0 "Малайя является сияющей жемчужиной Германской Восточной Азии и операционным центром всей нашей администрации, однако после Чёрного понедельника её охватило ожесточённое повстанческое движение. Следует создать сеть постов, бункеров и укреплённых пунктов для подавления местных мятежников. Эти сооружения также пригодятся в случае вражеского сухопутного наступления."
GEA_budget8:0 "Инвестиции в [GetNameGEAIndochina]"
GEA_budget8_desc:0 "Текстильные фабрики [GetNameGEAIndochina] остро нуждаются в дополнительном финансировании для расширения производства и внедрения новых методов изготовления одежды. Предоставив средства, мы расположим к себе местное население и в долгосрочной перспективе получим новые источники дохода. Это поможет восстановлению экономики и стабилизации общества."
GEA_budget9:0 "Местные оружейные предприятия"
GEA_budget9_desc:0 "Нынешние производители вооружений в пределах нашей юрисдикции, мягко говоря, крайне слабы. Следует инвестировать в разработку новых образцов и создание производственных мощностей, чтобы меньше зависеть от объедков, присылаемых Берлином."
GEA_budget10:0 "Защитить Циндао"
GEA_budget10_desc:0 "Во время Вельткрига наши солдаты сражались и истекали кровью до последнего человека, защищая Циндао. Эти храбрые и стойкие ветераны составляют значительную часть ближайшего окружения [GEA.GetLeader] и требуют от него лучше защитить город, ставший для них предметом особой гордости."
GEA_budget11:0 "Разрешить местное производство оружия"
GEA_budget11_desc:0 "Сейчас многие наши договоры запрещают местным властям и князьям создавать собственное производство вооружений в обмен на нашу защиту. После реформ основной структуры нашего правительства мы стали рассматривать эти ограничения как устаревшую помеху и готовы от них отказаться."
GEA_budget12:0 "Укрепления на сиамской границе"
GEA_budget12_desc:0 "Хотя Королевство Сиам помогало Германской империи во время Вельткрига, оно так и не получило все территории, на которые претендовало, и часть из них ныне находится под нашим контролем. Следует укрепить границу на случай, если в Бангкоке решат, что оружие говорит убедительнее слов."
GEA_budget13:0 "Уроки Миттельафрики"
GEA_budget13_desc:0 "Миттельафрика в некотором смысле является нашим родственным колониальным проектом и с самого начала своего существования сталкивается с недовольством местного населения. Наём советников из Миттельафрики наверняка принесёт нам пользу."
GEA_budget14:0 "Крепость Хайнань"
GEA_budget14_desc:0 "Хайнань является важным плацдармом для операций в Южном Китае и вдоль побережья Индокитая. Следует укрепить остров."
GEA_budget15:0 "Уроки борьбы с повстанцами"
GEA_budget15_desc:0 "Колониальные силы Миттельафрики обладают огромным опытом борьбы с местными мятежниками и повстанцами, добытым тяжёлой и кровавой ценой. Создание более постоянной системы военных атташе позволило нам перенять новые доктрины и тактические приёмы. Хотя это привело к снижению успешности набора добровольцев, результаты говорят сами за себя."
GEA_budget16:0 "Применение жидкостной зажигательной бомбы"
GEA_budget16_desc:0 "Местность Миттельафрики покрыта густой растительностью и джунглями, поэтому там было внедрено новое оружие: Flüssigkeitsbrandbombe, «жидкостная зажигательная бомба», предназначенная для поражения повстанцев в плотных африканских зарослях. Использование белого фосфора производит поистине ошеломляющий эффект, хотя более традиционно настроенные представители Адмиралтейства считают его воздействие на противника весьма неприглядным."
GEA_budget17:0 "Валькирии поля боя"
GEA_budget17_desc:0 "Из-за плохой инфраструктуры и тяжёлой местности, в которой действуют наши войска, эвакуация раненых часто оказывается крайне затруднена, что приводит к смертям от ран, которые при иных обстоятельствах можно было бы вылечить. Использование местных носильщиков, прекрасно знающих местность, стало настоящим спасением. Солдаты прозвали их «Валькириями», ведь они уносят тех, кому суждено жить, и оставляют после сортировки тех, кому уже не помочь."
GEA_air1:0 "Сингапурский авиационный корпус"
GEA_air1_desc:0 "В настоящее время наши воздушные силы полностью состоят из подразделения морской авиации. Следует найти и подготовить дополнительных пилотов для создания сухопутных военно-воздушных сил."
GEA_air2:0 "Авиабазы Вэйхайвэя"
GEA_air2_desc:0 "Вэйхайвэй, который мы делим с A.O.G., занимает идеальное положение для распространения нашей воздушной мощи по всему региону. Теоретически с одной этой базы мы способны наносить удары по Цин, Фэнтяню и даже Японии. Теперь следует расширить её, чтобы эти возможности стали реальностью."
GEA_air3:0 "Воздушные учения"
GEA_air3_desc:0 "Наши пилоты должны проходить подготовку в условиях, максимально соответствующих нашим потребностям. Мы проведём воздушные военные игры над Циндао, чтобы показать соперникам серьёзность наших намерений."
GEA_air4:0 "Восточноазиатское отделение Focke-Wulf"
GEA_air4_desc:0 "Focke-Wulf проявила интерес к открытию восточноазиатского отделения, чтобы воспользоваться местной рабочей силой и ресурсами. Мы должны всецело поддержать компанию в этом начинании."
GEA_air5:0 "Восточноазиатские фальширмъегери"
GEA_air5_desc:0 "Великий адмирал Мюкке давно восхищается фальширмъегерями и их суровой дисциплиной. Недавно он связался с «Волком» Дитрихом Витцелем, который предложил подготовить и возглавить здесь, на Востоке, элитную дивизию. От такого предложения нельзя отказываться."
GEA_air6:0 "Запросить истребители у Берлина"
GEA_air6_desc:0 "Хотя теперь мы производим часть самолётов на месте, наши потребности всё ещё превосходят нынешние производственные возможности. Пока разрыв сохраняется, мы запросим у Берлина четыре истребителя."
GEA_navy1:0 "Великий флот"
GEA_navy1_desc:0 "Восточноазиатский флот является крупнейшим и наиболее мощным германским соединением за пределами Европы и составляет основу наших операций в Восточной Азии, служа ярким свидетельством нашей приверженности существующему порядку. Главным противником в регионе, разумеется, остаётся Японская империя с её собственным внушительным флотом. Само присутствие нашего великого флота в порту вынуждает японцев держать значительные военно-морские силы для постоянного наблюдения за ним."
GEA_navy2:0 "Восточноазиатский флот в Морском плане 1934 года"
GEA_navy2_desc:0 "Восточная Азия, возможно, больше любого другого региона зависит от германской морской мощи, защищающей разбросанные острова и базы. Поэтому, хотя большая часть ресурсов Отечества направляется на чрезвычайно престижный Хохзеефлотте, Морской план 1934 года предусматривает значительное расширение и нашего флота."
GEA_fleet1:0 "Флот наличия"
GEA_fleet1_desc:0 "Нынешняя доктрина Хохзеефлотте исходит из того, что господство на море будет достигнуто превосходящей силой и редкими, но сокрушительными боевыми выходами. Следуя этой школе мысли, мы обеспечим сохранение ортодоксальной германской военно-морской доктрины во всех флотах."
GEA_fleet_2:0 "Современные эсминцы"
GEA_fleet_2_desc:0 "Эсминцы являются основой современного флота. Следует переработать их конструкцию и довести наши корабли этого класса до более высоких стандартов."
GEA_battlecruiser1:0 "Господство на море"
GEA_battlecruiser1_desc:0 "У Восточноазиатского флота есть лишь один главный приоритет на будущее: разгромить японцев в случае войны. Следовательно, наши доктринальные усилия должны быть направлены на использование их слабостей. Япония сильно зависит от импорта из своих марионеток и владений, поэтому, сосредоточившись на нарушении торговли, мы сможем нанести ей несоразмерно тяжёлый удар."
GEA_battlecruiser2:0 "Колониальные линейные крейсеры"
GEA_battlecruiser2_desc:0 "Хотя линкоры и колоссальные дредноуты составляют основу Германского флота, восточноазиатскому судостроению недостаёт огромных верфей и доступа к стали, которыми располагает метрополия. Поэтому мы намерены расширить использование линейных крейсеров, типа бронированных кораблей с более тяжёлым вооружением, но более слабой защитой, который в значительной степени вышел из моды среди мировых морских держав. Для наших нужд они подойдут идеально."
GEA_strikegroup1:0 "Авиационная школа"
GEA_strikegroup1_desc:0 "Хотя германская доктрина отводит морской авиации исключительно разведывательную роль, великий адмирал обладает удивительно широкой свободой в распоряжении собственными силами. Если он того пожелает, мы можем начать уделять куда больше внимания школе, считающей воздушную мощь будущим морской войны, хотя в Берлине это наверняка вызовет споры."
GEA_strikegroup2:0 "Лёгкие крейсеры"
GEA_strikegroup2_desc:0 "Легкобронированные крейсеры водоизмещением менее 5000 тонн нередко являются ключом к созданию мобильного флота, будь то рейды против конвоев, доставляющих Японии военные материалы, или сопровождение авианосцев для распространения воздушной мощи в Тихом океане. Они станут надёжной основой наших соединений."
GEA_strikegroup3:0 "Переоборудование в авианосцы"
GEA_strikegroup3_desc:0 "Возможно, придётся прибегнуть к некоторым взяткам, а когда Берлин обо всём узнает, разразится скандал, но для поддержки нашего доктринального отступления от нормы следует как можно скорее переоборудовать несколько линейных крейсеров в авианосцы с плоской полётной палубой."
GEA_strikegroup4:0 "Амбиции морской авиации"
GEA_strikegroup4_desc:0 "Что бы в Берлине ни думали об авианосцах, даже там не станут отрицать определённую пользу авиации на море. Поэтому мы получили разрешение продолжить разработку сухопутных самолётов, специально предназначенных для ударов по кораблям и портам."
GEA_naval_air1:0 "Наш корпус морской авиации"
GEA_naval_air1_desc:0 "Авиационному корпусу [GetNameGEASingapore] не помешает расширить круг задач. Создав специализированное морское подразделение, мы значительно увеличим широту его возможных операций."
GEA_naval_air2:0 "Усилить противовоздушную оборону"
GEA_naval_air2_desc:0 "Угроза воздушных налётов на [GetNameGEASingapore] остаётся постоянным поводом для беспокойства, поскольку теперь до него способны долететь самолёты из материкового Китая, Филиппин и Австралии. Инвестиции в местную противовоздушную оборону не только позволят нам чувствовать себя спокойнее, но и убедят население в серьёзности наших обязательств."
GEA_fleet3:0 "SMS Neckar"
GEA_fleet3_desc:0 "Хотя Восточноазиатский флот уже силён и могущественен, увеличить его размеры никогда не помешает. Мы заложим новый линкор «Neckar», который станет мощным и современным остриём нашего флота."
GEA_fleet4:0 "Подводный флот"
GEA_fleet4_desc:0 "U-боты должны занять видное место в нашем флоте, чтобы лучше противостоять японской надводной мощи. Продолжая развитие подводных сил, мы сможем ещё сильнее использовать уязвимость их морских коммуникаций."
GEA_navy4:0 "Расширить местные верфи"
GEA_navy4_desc:0 "Хотя из местных ресурсов мы никогда не сможем построить линкор или авианосец, эсминцы и крейсеры вполне нам по силам. Следует расширить местные судостроительные мощности, чтобы это стало реальностью."
GEA_navy3:0 "Расширить военно-морскую инфраструктуру"
GEA_navy3_desc:0 "В настоящее время военно-морские объекты в Сембаванге и Камрани способны обслуживать лишь силы берегового патрулирования, размещённые в регионе. Следует расширить эти базы, чтобы они могли принимать крупные тяжёлые корабли и поддерживать наше растущее присутствие."
GEA_navy5:0 "Торговый флот Восточной Азии"
GEA_navy5_desc:0 "Одним из важнейших преимуществ восточноазиатских колоний и одной из причин, по которым Отечество продолжает их удерживать, является огромный объём торговли, находящийся под нашим контролем. Мобилизовав часть обширного торгового флота для перевозки военных материалов, мы временно увеличим наши транспортные возможности."
GEA_navy6:0 "Новые методы судостроения"
GEA_navy6_desc:0 "За годы, прошедшие после Морского плана 1934 года, судостроение значительно продвинулось вперёд. Используя новейшие методы обработки стали, строительства корпусов и электроники, мы сможем гораздо быстрее строить новые и более современные корабли."
GEA_navy7:0 "Править Тихим океаном"
GEA_navy7_desc:0 "Германия правит волнами! От Атлантики до Тихого океана мы будем господствовать на морях, а Восточноазиатский флот займёт почётное место королевы величайшего океана мира."
GEA_navyfort1:0 "Программа береговых укреплений"
GEA_navyfort1_desc:0 "В настоящее время [GetNameGEASingapore], похоже, уязвим для морских десантов. Японцы расширяют свои силы морской пехоты, и нам следует укрепить оборону, чтобы соответствовать этой угрозе и успешно ей противостоять."
GEA_navyfort2:0 "План противодействия вторжению"
GEA_navyfort2_desc:0 "Проводя военные игры, создавая запасы бетона и стали и обучая гражданское население методам эвакуации, мы сможем гарантировать, что любое вторжение встретит всю мощь нашей обороны."
GEA_navyfort3:0 "Сфера абсолютной защиты"
GEA_navyfort3_desc:0 "Доктрина «Gesamtschutzsphäre», сферы всеобъемлющей защиты, является крайней формой нашей политики обороны колоний от вторжения. Она предусматривает создание множества резервных механизмов и запасных планов на каждый возможный сценарий нападения или морской высадки, а также непрерывную муштру войск, чтобы они были готовы абсолютно ко всему."
GEA_navyfort4:0 "Береговые укрепления Сайгона"
GEA_navyfort4_desc:0 "Сайгон является воротами во Вьетнам и Индокитай в целом, поэтому следует укрепить город против морских десантов."
GEA_marine1:0 "Восточноазиатская морская пехота"
GEA_marine1_desc:0 "Наше уникальное положение в мире естественным образом заставляет уделять морской пехоте больше внимания, чем соседние страны, а восточноазиатские морпехи особенно известны своими быстрыми и жёсткими десантными атаками. Следует обеспечить им дополнительную подготовку, чтобы они оставались на переднем крае военного искусства."
GEA_marine2:0 "Расширить отряд [GetNameGEASingapore]"
GEA_marine2_desc:0 "Хотя наши морские пехотинцы суровы и выносливы, их численность ограничена. Следует расширить силы морской пехоты."
GEA_marine3:0 "Война в джунглях"
GEA_marine3_desc:0 "Суровые джунгли Индокитая давно служат кладбищем империй, как дружественных, так и враждебных. Мы должны обучить все наши войска эффективнее действовать в столь враждебных условиях."
GEA_internal1:0 "Сотрудничать с местными элитами"
GEA_internal1_desc:0 "Наша внутренняя система управления одновременно византийски сложна и архаична, поскольку мы унаследовали как французские, так и британские колониальные порядки, добавив их к территориям под прямым управлением. Мы решили наладить более тесное сотрудничество с местными элитами, чтобы попытаться исправить положение."
GEA_internal2:0 "Укрепить наши связи"
GEA_internal2_desc:0 "Великий адмирал Мюкке лично проведёт важные переговоры с нашими местными партнёрами. Его заявленный подход, основанный на обаянии и шампанском, может оказаться не столь эффективным, как он надеется, однако мы сделаем всё возможное для поддержки этих встреч."
GEA_internal3:0 "Помочь малому бизнесу"
GEA_internal3_desc:0 "Мы можем вернуть экономику на верный путь, поддерживая местные предприятия вместо крупных германских корпораций. Это обеспечит местному населению занятость и благосостояние, а также снизит желание участвовать в восстаниях."
GEA_internal4:0 "Новое Адмиралтейство"
GEA_internal4_desc:0 "В Германской Восточной Азии начался пересмотр роли Адмиралтейства, которое постепенно превращается в полноценную администрацию вместо флота, случайно обзаведшегося территориями."
GEA_johor1:0 "Малайское решение"
GEA_johor1_desc:0 "Султан Джохора был и остаётся ключевой фигурой, благодаря которой малайские султанаты столь легко приняли нашу власть. Теперь он требует дополнительных уступок для исправления несправедливостей прежней британской администрации, и мы согласны, что часть этих ошибок можно исправить."
GEA_johor2:0 "Сотрудничество с местными монополистами"
GEA_johor2_desc:0 "Лучший способ выбраться из спада после Чёрного понедельника заключается в поддержке экономики Отечества и восстановлении нашего экспорта. Для этого следует содействовать проникновению крупных германских компаний в экономику региона, обеспечив им доступ к дешёвому сырью."
GEA_johor3:0 "Местная экономическая инициатива"
GEA_johor3_desc:0 "Рудольф Фирле, высокопоставленный сотрудник Norddeutscher Lloyd, представил нам комплексный план поддержки местной торговли и судоходства. В долгосрочной перспективе это поможет экономике Юго-Восточной Азии, сделав её менее зависимой от экспорта сырья."
GEA_bao1:0 "Решение Бао Дая"
GEA_bao1_desc:0 "Когда после Вельткрига мы получили французские территории, было решено оставить императора Бао Дая на престоле Аннама под нашей «направляющей рукой». Теперь он просит провести ряд реформ, чтобы вдохнуть новую жизнь в древнюю имперскую систему. Посмотрим, сможем ли мы удовлетворить эти просьбы."
GEA_bao2:0 "Германская консультативная группа"
GEA_bao2_desc:0 "Создав постоянную систему военных атташе при местных силах, мы не только упростим их интеграцию в нашу собственную армию, но и сможем следить за радикальными элементами, способными проникнуть в их ряды."
GEA_bao3:0 "Развернуть местную гвардию"
GEA_bao3_desc:0 "Многие местные князья обращаются к нам с одной и той же просьбой: расширить их личные вооружённые силы. Если разрешить это при условии, что каждый из них сформирует немецкоязычный полк элитной королевской гвардии, мы одновременно усилим наши регулярные силы и удовлетворим их требования."
GEA_vong1:0 "Выпить с королём Сисавангом"
GEA_vong1_desc:0 "Хотя король Сисаванг правит одним из меньших автономных зависимых владений, он всё же остаётся влиятельной фигурой. Подобно другим, он потребовал исправить некоторые несправедливости колониального управления. В определённых пределах мы пойдём ему навстречу."
GEA_vong2:0 "Реформа образования"
GEA_vong2_desc:0 "Уровень грамотности местного населения в настоящее время лучше всего описывается как удручающий. Продвигая обучение на немецком языке силами двуязычных местных преподавателей, мы сможем хотя бы частично исправить положение."
GEA_vong3:0 "Исследовательские институты"
GEA_vong3_desc:0 "Финансирование двух университетов европейского образца в [GetNameGEASingapore] и Сайгоне позволит расширить нашу научную базу, а также даст более состоятельным и образованным местным жителям возможность учиться здесь, а не отправляться за границу, где они могут подвергнуться радикализации."
GEA_railway3:0 "Инфраструктурный план Восточной Азии"
GEA_railway3_desc:0 "Разработав комплексный план местных железных дорог и новую сеть шоссе между городами, мы сможем полностью обновить инфраструктуру региона и улучшить наши пока неудовлетворительные транспортные связи."
GEA_railway2:0 "Сталелитейные заводы Тонкинского залива"
GEA_railway2_desc:0 "Трудности при строительстве инфраструктуры ясно показали отсутствие у нас собственной сталелитейной промышленности. Разработка железорудного месторождения Тхатькхе давно входит в планы наших промышленников, а вместе с развитием угольных шахт Северного Вьетнама теперь можно приступить к созданию общетонкинского комплекса по производству стали."
GEA_railway:0 "Трансиндокитайские железные дороги"
GEA_railway_desc:0 "Благодаря последней серии инвестиций и новому подвижному составу нам удалось завершить соединительный маршрут до Тонкина. Это должно улучшить внутреннюю торговлю и передвижение."
GEA_develop_tsingtau:0 "Развивать Циндао"
GEA_develop_tsingtau_desc:0 "Циндао - больше чем просто город. Это символ германского господства и контроля, а прежде всего наше место под солнцем. Потеря Циндао немыслима для высшего командования, поэтому необходимо приложить все усилия для укрепления концессии."
GEA_fortify_concessions:0 "Укрепить концессии"
GEA_fortify_concessions_desc:0 "Положение в Китае становится всё более мрачным. Националистические силы разрушают тщательно выстроенный нами мир, а японцы лишь ждут малейшего признака слабости. Защита наших нынешних концессий от враждебных сил как внутри, так и за их пределами является первоочередной задачей."
GEA_kill_yunnan:0 "Наказать Юньнань"
GEA_kill_yunnan_desc:0 "Эти негодяи положили конец прибыльной торговле оловом с Юньнанью. Настало время продемонстрировать им мощь Хеера и силой возобновить наши дружеские деловые отношения."
GEA_become_pals_with_qing:0 "Возобновить китайско-германское сотрудничество"
GEA_become_pals_with_qing_desc:0 "Приказы Берлина ясны: оставив в стороне вопросы цивилизации и расы, Германия и Китай должны протянуть друг другу руки во взаимной дружбе и силе перед лицом общего врага.\n\nВ действительности Германии нужны китайские солдаты как буфер против Японии, а Китаю нужны германские винтовки, чтобы их вооружить."
#GEA_bail_out_dab:0 "Запросить помощь для DAB"
#GEA_bail_out_dab_desc:0 ""
GEA_invest_in_concessions:0 "Инвестировать в концессии"
GEA_invest_in_concessions_desc:0 "Циндао может быть жемчужиной нашей короны, но это далеко не единственная концессия под нашей юрисдикцией. Развитие баз в Вэйхайвэе и Гуанчжоуване принесёт долгосрочную пользу нашему господству в регионе."
GEA_attack_lec:0 "Обезопасить города Легаций"
GEA_attack_lec_desc:0 "В приступе высшего безумия Германию исключили из Совета Легаций, управляющего концессиями. Очевидно, эксперимент с глобальным партнёрством исчерпал себя, и германское господство над этими прибыльными городами должно быть восстановлено."
GEA_borneo_money:0 "Направить рабочих на рудники Борнео"
GEA_borneo_money_desc:0 "Северное Борнео располагает огромным количеством ещё не освоенных промышленных районов, а главным препятствием остаётся нехватка рабочей силы для использования этих ресурсов. Ввозя на Борнео китайских рабочих-мигрантов, мы сможем приступить к развитию зарождающейся промышленности."
GEA_help_lep_focus:0 "Отправить помощь нанкинским милитаристам"
GEA_help_lep_focus_desc:0 "Хотя наше прямое влияние в Китае ограничено концессиями, германская мягкая сила напрямую проводится через Нанкинскую клику. Любая угроза её продолжающемуся господству в Южном Китае в долгосрочной перспективе является угрозой и для нас."
GEA_pimp_the_concessions:0 "Усилить контроль над концессиями"
GEA_pimp_the_concessions_desc:0 "Поскольку германское влияние в Нанкине достигло приемлемого уровня, можно отбросить притворство равноправного сотрудничества с китайскими милитаристами. Полный контроль над германскими концессиями в Южном Китае должен быть немедленно передан администрации Восточной Азии."

### Events ###
# Introduction event
Ostasien.0.t:0 "Жемчужина Востока"
Ostasien.0.d:0 "С момента краха Британской империи в 1926 году Кайзерлихе Марине остаётся бесспорным хозяином Восточных морей и стражем западного порядка на Востоке. Отступление британской «Китайской станции» в Австралазию оставило азиатские колонии и концессии Британии беззащитными перед местными социалистическими восстаниями и нуждающимися в защите, которую могла предоставить лишь Германия, тем самым замкнув непрерывную цепь колоний и концессий от Суэца до Циндао. Однако это славное достижение досталось нам дорогой ценой.\n\nНаша экспансия на Востоке отличалась необычайной стремительностью и размахом, распространив нашу юрисдикцию на пёструю и запутанную систему колоний, оторванных от своих метрополий. Они были вынуждены признать наше превосходство, но при этом оказались слишком сложны и по-византийски запутанны, чтобы их можно было полностью перестроить или переустроить без риска обрушить вместе с ними и нашу администрацию. Таким образом, Германская Восточная Азия существует не как колония и даже формально не как единый орган власти, а скорее как юрисдикция - пространство, в пределах которого сравнительно беспристрастному Адмиралтейству приходится одновременно уравновешивать местные интересы, разбираться с различными колониальными системами и обеспечивать защиту всего этого порядка.\n\nНесмотря на наше господство, Япония остаётся угрозой и по-прежнему намерена вытеснить нас с Востока и присвоить его себе. Наши храбрые солдаты глядят в лицо японцам через границы Городов Легаций, а наши великолепные линкоры неусыпно несут дозор на морях.\n\nЕсли отвлечься от внутренних трудностей, впереди нас ещё может ждать решающее столкновение, и долг Адмиралтейства - сделать всё возможное, чтобы к этому часу мы были готовы."
Ostasien.0.a:0 "Очень хорошо!"
Ostasien.0.b:0 "А что насчёт Китая?"

Ostasien.1.t:0 "Китай и A.O.G."
Ostasien.1.d:0 "Китайские владения Отечества также находятся под нашей юрисдикцией, и согласно условиям Шанхайской конференции 1928 года, проведённой при посредничестве американцев, права Германии в Китае равны правам любой другой иностранной державы. Город Циндао уже давно служит центром наших операций в регионе, одновременно являясь современным городом, процветающим портом и сердцем обширной торговой сети, опутавшей весь Восток.\n\nОднако далеко не всё, что проходит через залив Цзяочжоу, можно назвать полностью законным. Allgemeine Ostasiatische Gesellschaft, или Всеобщая восточноазиатская компания, управляет многочисленными судами, фабриками и даже неофициальными концессиями, нарушающими если не букву, то дух соглашения 1928 года.\n\nНанкинский военачальник Сунь Чуаньфан, стремясь сохранить независимость от центрального правительства Китая, согласился на серию кабальных оружейных сделок в обмен на широкие экономические концессии в пределах Лиги восьми провинций. Хотя ни Пекин, ни остальное международное сообщество не признают эти соглашения, A.O.G. продолжает распространять своё влияние по всей Лиге и всё глубже проникает во внутренние районы страны.\n\nВ конечном счёте Берлин хотел бы использовать Китай как своего рода буфер против Японии: каждый японский солдат, направленный туда, не сможет быть использован против нас в Малайе или Индокитае. Поэтому правительство Китая и Лига восьми провинций должны получать нашу поддержку, а любое японское продвижение в Китае следует считать лишь одним шагом от [GetNameGEASingapore]."
Ostasien.1.a:0 "Очень хорошо!"

# Black Monday
Ostasien.2.t:0 "Чёрный понедельник!"
Ostasien.2.d:0 "Положение в Германии катастрофическое. После разрушительного финансового кризиса германская экономика лежит в руинах, и колонии неизбежно последуют за ней. Нам придётся резко сократить значительную часть расходов и немедленно искать способы укрепить уже слабеющую экономику Восточной Азии. В качестве первого шага Рейхсколониаламт передал приказ из Берлина вывести «ненужные» гарнизоны из портов Лиги. Восстановление может занять долгие годы..."
Ostasien.2.a:0 "Катастрофа!"

Ostasien.3.t:0 "Конец Чёрной недели"
Ostasien.3.d:0 "Прошла неделя с момента первоначального обвала Берлинской фондовой биржи. Каучук и олово, наши главные экспортные товары, уже потеряли более половины своей стоимости по сравнению с уровнем до Чёрного понедельника из-за резкого падения спроса на автомобильные шины. Тем временем экспорт риса на европейский рынок практически прекратился, оставив десятки тысяч тонн урожая гнить на полях и в портах. Европейцы в Сингапуре, Сайгоне и других городах, не имевшие значительных сбережений или земли, рискнули всем на рынке и всё потеряли, а теперь едва ли живут лучше своих индокитайских соседей."
Ostasien.3.a:0 "Нужно что-то предпринять!"

### Uprising Chain ###
# Yen Bai Muytiny
Ostasien.4.t:0 "Нестабильность в Индокитае"
Ostasien.4.d:0 "С тех пор как десять лет назад наша экспедиционная армия уничтожила Хо Ши Мина и его синдикалистских агитаторов в Гуанчжоу, Индокитай переживал относительно стабильный период. Однако недавний крах Берлинской фондовой биржи, или Чёрный понедельник, нанёс сокрушительный удар по сильно коммерциализированной индокитайской экономике. Забастовки и рисовые бунты распространяются по Тонкину, Аннаму и Кохинхине. Городские студенты и интеллектуалы требуют большей свободы. Хуже того, наша разведка сообщает, что подпольные революционеры тайно расширяют своё влияние."
Ostasien.4.a:0 "Эта колония печально известна своей непокорностью."

Ostasien.5.t:0 "Националистическая агитация в Тонкине"
Ostasien.5.d:0 "Мы обнаружили целый ряд националистических и антиколониальных движений в Тонкине. Во всех уголках Ханоя агитаторы распространяют листовки с призывами к национальному единству и независимости. За этой агитацией стоит организация под названием Вьетнамская националистическая партия, VNQDD, а наши агенты раскрыли их коварный план: бандиты пытаются внедриться в наш гарнизон в Тонкине."
Ostasien.5.a:0 "Нужно подготовиться."

Ostasien.6.t:0 "Мятеж в Йенбае"
Ostasien.6.d:0 "Сегодня несколько тонкинских гарнизонов в Йенбае, военном посту неподалёку от китайско-индокитайской границы, подняли мятеж против колониальных властей! Вместе с ними выступили вооружённые агенты VNQDD. Благодаря работе наших агентов нам удалось сорвать их план одновременного восстания. Мятежники были отброшены, а в Тонкине началась масштабная кампания репрессий. Теперь отчаявшиеся повстанцы бегут в горные районы на китайско-вьетнамской границе."
Ostasien.6.a:0 "Сосредоточить силы и раздавить этих бандитов!"
Ostasien.6.b:0 "Объявить военное положение во всём Индокитае!"

Ostasien.7.t:0 "Индокитайская трагедия"
Ostasien.7.d:0 "«Вьетнам! Вьетнам! Вьетнам! Родина Юга! Тринадцать раз я слышал этот крик у гильотины в Йенбае. Тринадцать приговорённых к смерти произносили его один за другим, всего в двух метрах от эшафота».\n\n- Французский журналист Луи Рубо стал свидетелем недавнего жестокого германского подавления восстания в Индокитае, нашей бывшей колонии и нынешнем бастионе германского колониализма на Дальнем Востоке. Теперь генерал Жак Дорио, близкий друг покойного индокитайского революционера Хо Ши Мина, призывает вмешаться в дела Индокитая. После окончания Вельткрига тысячи индокитайских студентов, солдат и рабочих остались во Франции и стали убеждёнными революционерами. Если мы отправим их обратно с достаточным количеством оружия, они смогут организовать восстание в Кохинхине. Это способно дестабилизировать германскую колониальную империю и послужить делу мировой революции."
Ostasien.7.a:0 "Счастливого пути, индокитайские товарищи!"
Ostasien.7.b:0 "Мы не современные Пиньо де Беэн."

Ostasien.8.t:0 "Индокитайская трагедия"
Ostasien.8.d:0 "«Вьетнам! Вьетнам! Вьетнам! Родина Юга! Тринадцать раз я слышал этот крик у гильотины в Йенбае. Тринадцать приговорённых к смерти произносили его один за другим, всего в двух метрах от эшафота».\n\n- Французский журналист Луи Рубо стал свидетелем недавнего жестокого германского подавления восстания в Индокитае, бастионе германского колониализма на Дальнем Востоке. Теперь индокитайские революционеры в Калькутте добиваются нашей помощи. Если мы отправим снаряжение и добровольцев, пока германская полиция и жандармерия заняты в Тонкине, индокитайские революционеры смогут организовать восстание в Кохинхине. Это способно дестабилизировать германскую колониальную империю и станет важным шагом в нашем проекте международной революции."
Ostasien.8.a:0 "Отправить помощь."
Ostasien.8.b:0 "Нас это не интересует."

# Bao Dai Reform
Ostasien.9.t:0 "Император Бао Дай возвращается в Индокитай"
Ostasien.9.d:0 "Бао Дай, монарх Аннама, недавно завершил обучение в Германии и вернулся в Индокитай. К сожалению, его не устраивает чисто церемониальная роль, однако тщательно контролируемая монархия могла бы помочь нам снизить нестабильность в сельских районах и заручиться поддержкой населения, поскольку аннамские крестьяне традиционно привязаны к своему императору. Европейские поселенцы в Сайгоне, однако, решительно выступают против любых попыток поделиться властью с аннамцами."
Ostasien.9.a:0 "Добро пожаловать, наш марионеточный император."
Ostasien.9.b:0 "Возможно, ему стоит продолжить обучение."

Ostasien.10.t:0 "Реформы Бао Дая: первый шаг"
Ostasien.10.d:0 "Взойдя на престол, Бао Дай привлёк ко двору нескольких сторонников реформ, включая интеллектуала-неотрадиционалиста Фам Куиня и католического администратора Нго Динь Зьема. Теперь его министры решили начать административную реформу, чтобы оживить неработоспособную бюрократическую систему. В настоящее время мандарины протектората Аннам лишь номинально управляют страной, тогда как реальная власть принадлежит их европейским советникам. Реформа Бао Дая неизбежно нанесёт удар по европейской монополии на власть."
Ostasien.10.a:0 "Это необходимо."
Ostasien.10.b:0 "Остановить его. Он зашёл слишком далеко."

Ostasien.11.t:0 "Реформы Бао Дая: второй шаг"
Ostasien.11.d:0 "После административной реформы кабинет Бао Дая начал дальнейшую централизацию власти. Недавние волнения в Индокитае дали ему удобный предлог. Император просит предоставить ему полномочия для создания собственной императорской полиции. Бао Дай и его министры утверждают, что лишь императорская полиция, исполняющая распоряжения двора в Хюэ, способна эффективно усмирить непокорных крестьян и восстановить порядок в Аннаме."
Ostasien.11.a:0 "Это поможет."
Ostasien.11.b:0 "Давать аннамцам власть опасно."

# Revolution in Cochinchina

Ostasien.12.t:0 "Нестабильность в Кохинхине"
Ostasien.12.d:0 "Пока наши силы заняты подавлением националистов в Тонкине, обстановка южнее, в Кохинхине, становится всё более нестабильной. Число забастовок сократилось, однако профсоюзные активисты, как сообщается, регулярно проводят собрания, а слухи утверждают, что агитаторы, переодетые монахами и торговцами, организуют крестьян в тайные общества по всей Кохинхине и южному Аннаму. Дополнительные сведения разведки указывают, что множество вьетнамских эмигрантов нелегально пересекают границу и проникают в Индокитай. Вероятнее всего, их направляют иностранные державы для подрывной деятельности. Наши чиновники даже придумали новый термин - «Вьетконг», полное название Viet Nam Cong Doan, то есть «Вьетнамские синдикалисты», которым теперь обозначают эту красную угрозу."
Ostasien.12.a:0 "Похоже на затишье перед бурей."

Ostasien.13.t:0 "Побег из тюрьмы Пуло-Кондор"
Ostasien.13.d:0 "Сегодня утром центральная тюрьма на острове Пуло-Кондор сообщила о массовом побеге! Очевидно, это была тщательно организованная операция: заключённые бежали через тоннель под покровом ночи, затем погрузились на заранее подготовленные джонки и растворились в сети каналов и болот дельты Меконга. По оценкам, из примерно 25 000 заключённых сбежало около 150 человек. Большинство из них - левые агитаторы."
Ostasien.13.a:0 "От этой колонии одни неприятности!"

Ostasien.14.t:0 "Коммунальное движение в Биньдине"
Ostasien.14.d:0 "Провинция Биньдинь, родина восстания Тэйшон, переживает резкое обострение крестьянского движения. Первоначально демонстранты требовали отменить барщинный труд, фактически равнозначный крепостной зависимости, но после того как местные власти проигнорировали их требования, разгневанные крестьяне начали поджигать административные здания, ратуши и железнодорожные станции, уничтожать налоговые реестры и грабить полицейские участки. Местная администрация парализована, появились объединения, именующие себя «коммунами», а движение уже распространяется на другие провинции южного Аннама и Меконга. Совершенно очевидно, что за всем этим стоит Вьетконг!"
Ostasien.14.a:0 "Возможно, это ещё можно решить мирно."
Ostasien.14.b:0 "Ввести войска!"

Ostasien.15.t:0 "Восстание в Сайгоне"
Ostasien.15.d:0 "Вчера от Тонкина до Кохинхины одновременно вспыхнули восстания. Профсоюзы объявили всеобщую забастовку и попытались захватить здания муниципальных властей. Хотя в большинстве районов порядок уже восстановлен, Вьетконг перенёс крестьянское восстание из Биньдиня и Меконга в Сайгон и вошёл в город. Местные гарнизоны перешли на сторону мятежников, а повстанцы захватили ключевые узлы связи и административные объекты Сайгона!"
Ostasien.15.a:0 "Да здравствует революция! (Переключиться на INC)"
Ostasien.15.b:0 "Проклятый Вьетконг!"

Ostasien.16.t:0 "Положение в Индокитае ухудшается"
Ostasien.16.d:0 "Положение в Индокитае продолжает ухудшаться, а усмирить повстанцев оказалось куда сложнее, чем мы предполагали. Регулярные силы Вьетконга продвигаются на север, тогда как партизанские подразделения нарушают наши линии снабжения и сеют страх. Многие поселенцы сомневаются, что мы вообще способны удержать Индокитай, и требуют эвакуировать ценные активы в другие колонии."
Ostasien.16.a:0 "Эвакуировать имущество!"
Ostasien.16.b:0 "Всё под контролем!"

Ostasien.17.t:0 "Положение в Индокитае ухудшается"
Ostasien.17.d:0 "Похоже, несмотря на официальные отчёты наших дальневосточных колоний о значительных успехах в подавлении восстания, военная разведка сообщает, что положение в Индокитае на самом деле лишь ухудшилось. Усмирение мятежников Вьетконга, похоже, оказалось слишком тяжёлой задачей для Адмиралтейства. Несколько крупных городов и стратегических позиций уже перешли в руки повстанцев, а страх и беспорядки продолжают распространяться. Возможно, Германской Восточной Азии требуется помощь?"
Ostasien.17.a:0 "Они справятся сами."
Ostasien.17.b:0 "Отправить подкрепления!"
Ostasien.17.c:0 "Сухопутная война в Азии? Вперёд!"

Ostasien.18.t:0 "Индокитайский союз предлагает мир"
Ostasien.18.d:0 "Восстание в Индокитае продолжает разрастаться. Ключевые позиции перешли в руки бандитов Вьетконга, и нам всё труднее справляться с положением. Теперь индокитайские повстанцы направили предложение о мирных переговорах. Несмотря на опасения, что это будет воспринято как унижение, разумным решением может стать отказ от контроля над регионом."
Ostasien.18.a:0 "Нет, мы продолжим сражаться с этими мятежниками!"
Ostasien.18.b:0 "Мы больше не можем позволить себе эту войну."

Ostasien.19.t:0 "Мирные переговоры провалились"
Ostasien.19.d:0 "Германские империалисты отвергли нашу мирную инициативу и решили продолжить войну."
Ostasien.19.a:0 "С империалистами можно говорить только языком оружия!"

Ostasien.20.t:0 "Победа в Индокитае"
Ostasien.20.d:0 "Германия приняла мирную инициативу и отступила с Индокитайского полуострова. Мы выполнили свою задачу и вынудили германских империалистов уйти. Индокитай освобождён от германского колониального режима! Это великая победа нашего народа и тяжёлое поражение германских империалистов и их приспешников."
Ostasien.20.a:0 "Пикельхаубы, убирайтесь домой!"

Ostasien.21.t:0 "Хорошие новости, плохие новости"
Ostasien.21.d:0 "Похоже, Берлин обеспокоен положением в Индокитае. Плохая новость заключается в том, что там узнали о наших неудачах и подвергли нас суровой критике. Хорошая новость - нам направили подкрепления для подавления мятежников Вьетконга."
Ostasien.21.a:0 "Хорошая новость."

Ostasien.22.t:0 "Победа в Индокитае"
Ostasien.22.d:0 "Наша славная армия сумела подавить восстание Вьетконга в Индокитае! Это великий день для Германии!"
Ostasien.22.a:0 "Очень хорошо, камрады!"

Ostasien.23.t:0 "Эскалация войны в Индокитае"
Ostasien.23.d:0 "После того как Германская империя перебросила основные силы на Индокитайский полуостров, война сопротивления достигла невиданного прежде размаха! Но мы одержим победу, ибо справедливое дело освобождения непобедимо. Ходят также слухи, что другие великие державы пытаются превратить Индокитайский полуостров в трясину, в которой увязнет Германия..."
Ostasien.23.a:0 "В бой!"

Ostasien.25.t:0 "Решение Бао Дая"
Ostasien.25.d:0 "После падения Кохинхины под ударами Вьетконга и распространения партизанского движения по всей стране весь Индокитай оказался в чрезвычайном положении. Местные элиты и антисиндикалистские националисты сплотились вокруг императора Бао Дая и предлагают решение: если мы будем соблюдать договор о протекторате, то есть предоставим династии Нгуенов более широкую автономию в Аннаме и Тонкине, они помогут усмирить сельские районы, мобилизовать местные ресурсы и разгромить повстанцев. В противном случае повсеместные антиколониальные настроения дадут Вьетконгу решающее преимущество. Послание Бао Дая завершается зловещим предупреждением: если Германия не даст ответа на вьетнамский национализм, «каждая деревня станет гнездом сопротивления, каждый бывший коллаборационист превратится во врага, а ваши чиновники и колонисты сами станут искать возможность покинуть эту удушающую атмосферу»."
Ostasien.25.b:0 "Мы справимся сами."
Ostasien.25.a:0 "Нам нужна его помощь."
Ostasien.25.c:0 "Бао Дай приведёт Аннам к миру и порядку. (Играть за Вьетнам)"

Ostasien.30.t:0 "Падение цен"
Ostasien.30.d:0 "Цены на рис и каучук стремительно падают по всем колониям. Фермеры и владельцы плантаций, зависящие от экспорта этих товаров, понесли тяжёлые убытки, особенно в двух наших крупнейших колониях - Индокитае и Малайе. Мы можем попытаться стабилизировать цены в одной из них, однако наши ресурсы ограничены, и почти наверняка это будет сделано за счёт другой."
Ostasien.30.a:0 "Это не наше дело."
Ostasien.30.b:0 "Защитить Индокитай."
Ostasien.30.c:0 "Защитить Малайю."

Ostasien.32.t:0 "Забастовки на плантациях"
Ostasien.32.d:0 "Цена на каучук продолжает падать. Многие владельцы плантаций решили уволить часть работников, заставив оставшихся трудиться полный рабочий день. Эти решения вызвали масштабные забастовки на плантациях Индокитая и Малайи. Рабочие требуют прекратить увольнения, сократить рабочий день и улучшить условия труда. Поскольку большинство плантационных рабочих неграмотно, предполагается, что координацией протестов занимаются социалистические агитаторы."
Ostasien.32.a:0 "Подавить забастовки."
Ostasien.32.b:0 "Попытаться договориться."

Ostasien.31.t:0 "Европейские привилегии"
Ostasien.31.d:0 "После потрясения Чёрного понедельника многие европейские поселенцы потеряли всё и буквально за одну ночь оказались в нищете. Теперь часть из них просит нас укрепить их социальные и торговые привилегии, чтобы они, как поселенцы, не были вынуждены жить на одном уровне с простыми колониальными подданными. Они утверждают, что лишь строгая расовая кастовая система способна гарантировать мир в наших колониях."
Ostasien.31.a:0 "Отклонить их требования."
Ostasien.31.b:0 "Укрепить европейские привилегии."

Ostasien.33.t:0 "Коммунальное движение в Биньдине усмирено"
Ostasien.33.d:0 "Крестьянское восстание в провинции Биньдинь было подавлено нашими солдатами. Бомбардировщики и огонь корабельной артиллерии оказались особенно эффективны для устрашения вьетнамских крестьян. Название «Биньдинь» по-вьетнамски означает «усмирение», и теперь провинция действительно оправдала своё имя."
Ostasien.33.a:0 "Превосходно!"

Ostasien.34.t:0 "Агитация в Сайгоне утихает"
Ostasien.34.d:0 "Шум дождя, падающего на опустевшую площадь, кажется оглушительным. Изорванная листовка, выброшенная в канаву, чернила на которой расползаются по бумаге мягкими голубоватыми разводами, остаётся единственным свидетельством того, что ещё совсем недавно Сайгон был рассадником радикальной социалистической и синдикалистской агитации. На листовке изображён вьетнамский рабочий с красным социалистическим знаменем. Надпись гласит: «Рабочие Индокитая, объединяйтесь!». Вскоре дождевой поток уносит её в канализацию, откуда ей и место."
Ostasien.34.a:0 "Хорошие новости."

Ostasien.35.t:0 "Законы войны"
Ostasien.35.d:0 "Вьетконг не соблюдает современные законы войны. Его партизаны не только отказываются носить военную форму, но и всеми силами стараются раствориться среди мирного населения. Отличить повстанца Вьетконга от обычного гражданского практически невозможно. Наши генералы утверждают, что война против Вьетконга может быть только тотальной."
Ostasien.35.b:0 "Хотя бы попытайтесь отличать их..."
Ostasien.35.a:0 "Стрелять во всё, что движется!"

Ostasien.40.t:0 "Привлечь советников из Миттельафрики"
Ostasien.40.d:0 "Миттельафрика в некотором смысле является нашим сестринским проектом: и мы, и они защищаем Кайзеррейх от внешних врагов и непокорных подданных, поэтому укрепление наших связей выглядит вполне разумным. Великий адмирал решил пригласить советников из Миттельафрики в надежде, что они помогут нашим вооружённым силам и укрепят наши возможности в борьбе с повстанцами."
Ostasien.40.a:0 "Интересно, их каннибалы хуже наших?"

Ostasien.41.t:0 "Военная делегация из Миттельафрики"
Ostasien.41.d:0 "[root.getleader] и другие видные сановники приветствовали миттельафриканскую делегацию, когда та сошла с кораблей в [GetNameGEASingapore]. Судя по их суровому и потрёпанному виду, это и были те самые люди, которых недавно запрашивало наше Адмиралтейство. После обмена любезностями гостей сопроводили к месту их нового размещения. Присутствие среди них нескольких аскари немало позабавило местных жителей."
Ostasien.41.a:0 "Mein Gott, да он бы быка завалил."

Ostasien.42.t:0 "Учимся у Миттельафрики"
Ostasien.42.d:0 "Наша военная делегация вернулась из Миттельафрики. Несмотря на отдельные недостатки, замеченные в местной администрации, представители сообщили, что были тепло приняты и сумели многому научиться."
Ostasien.42.a:0 "Превосходно!"

Ostasien.51.t:0 "Новое Адмиралтейство"
Ostasien.51.d.a:0 "После внезапной смерти Альберта Баллина почтенный Хельмут фон Мюкке принял командование Восточноазиатским гарнизоном и с началом Индокитайского восстания весьма эффективно руководил флотом Дойч-Остазиен. Однако, несмотря на его талант флотоводца, восстание велось и было проиграно в джунглях Вьетнама и Камбоджи, а наша колония после столь ужасного поражения оказалась серьёзно ослаблена. Большая часть материковых владений теперь потеряна из-за восстания местного населения, а наши силы наголову разбиты, поэтому у нас слишком много насущных проблем, чтобы заниматься какими-либо реформами, запланированными режимом Мюкке. Флот вновь станет главным и единственным приоритетом германских владений в Восточной Азии, а [root.getleader] будет управлять этой израненной войной колонией железной рукой, стремясь укрепить её остатки и освоиться в новой суровой реальности."
Ostasien.51.d.b:0 "После внезапной смерти Альберта Баллина почтенный Хельмут фон Мюкке принял командование Восточноазиатским гарнизоном и с началом Индокитайского восстания весьма эффективно руководил флотом Дойч-Остазиен. В полной мере продемонстрировав свои военно-морские таланты и командуя объединёнными силами германских войск в Восточной Азии, он решительно подавил восстание, и наша колония вышла из войны победительницей. Однако значительная часть её территории охвачена пожарами или уже разрушена войной, поэтому у нас слишком много насущных проблем, чтобы заниматься какими-либо реформами, запланированными режимом Мюкке. Флот вновь станет главным и единственным приоритетом германских владений в Восточной Азии, а [root.getleader] будет управлять этой израненной войной колонией железной рукой, стремясь укрепить её и освоиться в новой суровой реальности."
Ostasien.51.d.c:0 "После внезапной смерти Альберта Баллина почтенный Хельмут фон Мюкке принял командование Восточноазиатским гарнизоном, и под его твёрдым и взвешенным руководством Германская Восточная Азия процветает. Господство флота было ограничено, а давно назревавшая напряжённость между местным населением и германским гарнизоном была урегулирована дипломатическим путём. Самым заметным новым достижением стало подтверждение сотрудничества между вьетнамским монархом Бао Даем и администрацией Мюкке. По мере того как повстанческие ячейки угасают и теряют влияние, а германское влияние вновь распространяется по этому тропическому раю, [root.getleader] наконец готов приступить к давно задуманным реформам, которые должны превратить это отсталое Государство с флотом в полноценную колонию."
Ostasien.51.a:0 "Мы отступаем к морю..."
Ostasien.51.b:0 "Мы принесём цивилизацию в эту хаотичную колонию!"

Ostasien.5101.t:0 "Пора выполнять обещания"
Ostasien.5101.d:0 "Хотя нараставшие революционные настроения ослабли, а угроза полномасштабной войны больше не маячит на горизонте, народы Германской Восточной Азии по-прежнему громко требуют реформ и перемен. Если мы хотим сохранить достигнутый прогресс на пути к миру и стабильности, нашему режиму стоит наконец выполнить негласные обещания, данные в попытке предотвратить возможное восстание. Прежде всего местные жители колонии хотят получить настоящее представительство в колониальном правительстве, чтобы к их проблемам и жалобам действительно прислушивались. Мы можем просто проигнорировать эти призывы к переменам, но тогда следует опасаться нового роста сепаратистской напряжённости."
Ostasien.5101.a:0 "Начнём открывать правительство для местного населения."
Ostasien.5101.b:0 "Мы вновь доказали свою силу. Пусть местные убираются."

Ostasien.5102.t:0 "Парламент для местных?"
Ostasien.5102.d:0 "Первым крупным требованием местных жителей, не относящихся к колониальной администрации, стало предоставление им настоящего представительства в колониальном правительстве. Они требуют создать новую нижнюю палату германского колониального законодательного органа, открытую для уроженцев Германской Восточной Азии, чтобы лучшие из них могли представлять себя и свои народы перед германским режимом. Однако, чтобы не допустить наплыва нежелательных элементов и возможных радикалов, первый состав представителей будет лично подобран нашей администрацией. Хотя эта нижняя палата почти не получит реальной политической власти, она, вероятно, значительно успокоит местных жителей и одновременно понемногу откроет путь к более широким реформам."
Ostasien.5102.a:0 "Мы сдержим первые обещания, но представителей выберем сами."
Ostasien.5102.b:0 "Мы ни за что не позволим этим дикарям управлять собой!"

Ostasien.5103.t:0 "Призыв к открытым выборам"
Ostasien.5103.d:0 "После нашего согласия создать новую нижнюю палату, укомплектованную лояльными местными жителями, население колонии немедленно потребовало настоящих открытых выборов, чтобы самостоятельно выбирать своих представителей. Это действительно опасная перспектива: выборы могут открыть наше правительство для подрывных элементов, но одновременно способны значительно успокоить большинство недовольных жителей колонии. Если просто запретить радикалов вроде социалистов, подпитывавших индокитайские сепаратистские ячейки, то мы, вероятно, сможем достаточно тщательно контролировать выборы и не допустить захвата новой нижней палаты экстремистами. Как нам поступить?"
Ostasien.5103.a:0 "Ради стабильности допустим к местным выборам всех нерадикальных кандидатов."
Ostasien.5103.b:0 "Они неспособны принимать такие решения сами! Отказать!"

Ostasien.5104.t:0 "Первые колониальные выборы в парламент Германской Восточной Азии"
Ostasien.5104.d:0 "После решения разрешить свободные местные выборы немедленно началась подготовка к столь знаменательному событию, ведь местные жители не желали терять время на пути к обеспечению своего будущего под колониальным правлением. Хотя эти «выборы» определят лишь состав гражданского правительства в колониальном парламенте, которое всё равно будет обладать ничтожной реальной властью, они значительно помогут успокоить массы. Участвующие группы пока даже нельзя назвать полноценными партиями: это скорее рыхлые коалиции единомышленников, каждая из которых представляет собственных покровителей и интересы. Национальная организация султанов выступает оплотом консерватизма, традиционализма и монархизма, а среди её наиболее заметных фигур преобладают представители многочисленных знатных домов и семей архипелага. Им противостоят различные группы, оставшиеся со времён французского и британского господства, объединения интересов местных элит и предпринимателей, а также небольшое, но растущее рабочее движение во главе с мелкими служащими. Пока все эти силы ведут борьбу, места в нижней палате стремительно заполняются, однако лишь одна группа сможет получить явное большинство и задать палате общее направление. Последние голоса уже подсчитываются, и вскоре будет объявлен состав нового гражданского правительства Германской Восточной Азии."
Ostasien.5104.a:0 "NOS/PKS используют монархические связи и одерживают победу."
Ostasien.5104.b:0 "EHV/HTMBT, финансируемые индокитайскими предпринимателями, получают большинство мест."
Ostasien.5104.c:0 "SMB/MMS, поддерживаемые французскими остатками, получают больше всего голосов."
Ostasien.5104.e:0 "PAF/PLF захватывает подавляющее большинство мест в нижней палате."

Ostasien.510.t:0 "Новая благородная администрация"
Ostasien.510.d.a:0 "После внезапной смерти Альберта Баллина благородный принц Йозиас цу Вальдек унд Пирмонт принял командование Восточноазиатским гарнизоном и с началом Индокитайского восстания доблестно руководил гарнизоном Дойч-Остазиен. Хотя Йозиас пытался договориться с местной знатью и монархами, было уже слишком поздно, и Индокитайское восстание охватило колонию вопреки всем дипломатическим усилиям принца. Несмотря на эти неудачи, принц Йозиас сумел сплотить германский гарнизон, и после череды тяжёлых побед по всему архипелагу и в джунглях Индокитая наши силы наконец отбросили радикальных повстанцев, стремившихся уничтожить колониальный порядок. Теперь принц Йозиас правит разрушенной войной, но уцелевшей колонией, опираясь на потрёпанный, но всё ещё великолепный флот, защищающий этот рай. Именно ему предстоит собрать осколки и восстановить уцелевший колониальный порядок, чтобы вернуть ему былую славу."
Ostasien.510.d.b:0 "После внезапной смерти Альберта Баллина благородный принц Йозиас цу Вальдек унд Пирмонт принял командование Восточноазиатским гарнизоном и с началом Индокитайского восстания руководил гарнизоном Дойч-Остазиен с переменным успехом. Хотя Йозиас пытался договориться с местной знатью и монархами, было уже слишком поздно, и Индокитайское восстание охватило колонию вопреки всем дипломатическим усилиям принца. После сокрушительных поражений по всему архипелагу и в джунглях Индокитая наши силы были полностью разбиты. Теперь принц Йозиас правит сильно ослабленными колониальными владениями, опираясь лишь на тень некогда великолепного флота, защищавшего этот рай. Теперь ему предстоит собрать осколки и восстановить хотя бы часть разрушенной германской гегемонии, некогда господствовавшей над этими дикими землями."
Ostasien.510.d.c:0 "После внезапной смерти Альберта Баллина благородный принц Йозиас цу Вальдек унд Пирмонт принял командование Восточноазиатским гарнизоном и благодаря искусной дипломатии, долгим переговорам и многочисленным компромиссам сумел погасить местную волну радикализма, стремившуюся уничтожить давно сложившийся колониальный порядок. Теперь принц Йозиас властвует над стабильной и относительно мирной Германской Восточной Азией, опираясь как на новых союзников среди местной знати, так и на оживлённую колониальную администрацию. Обладая новым влиянием и властью, принц Йозиас намерен превратить это хаотичное империалистическое владение в образцовую колонию Кайзеррейха."
Ostasien.510.a:0 "Мы прошли через ад и вышли из него сильнее прежнего!"
Ostasien.510.b:0 "Огонь революции искалечил, но не уничтожил наш колониальный порядок. Мы выживем!"
Ostasien.510.c:0 "Слава принцу Йозиасу, непревзойдённому дипломату, спасшему нас."

Ostasien.511.t:0 "Странная новая администрация"
Ostasien.511.d:0 "После смерти Баллина и подъёма индокитайского сепаратизма почтенный генерал Август Вильгельм Хайе управлял колонией как чрезвычайный руководитель вместе с кликой лоялистов и собственным сыном Хельмутом Хайе, который и сам стал заметным адмиралом, ведя страну по канату над бушующим пожаром индокитайского радикализма. Стойкий и умный военный офицер, Хайе доблестно командовал германским гарнизоном во время ужасов Индокитайского восстания, но теперь, когда пламя войны наконец погашено, многие требуют, чтобы временное правительство выполнило своё предназначение и ушло в отставку. Долгие годы преданно служивший кайзеру и никогда не стремившийся к власти ради неё самой, Вильгельм Хайе, скорее всего, согласится сложить полномочия и вернуться в Германию к семье, продолжив работу военным инструктором. Наиболее вероятным преемником считается почтенный, хотя и несколько эксцентричный, Феликс Николаус Александр Георг граф фон Лукнер. Прозванный «Der Seeteufel», то есть Морским Дьяволом, Лукнер является одним из самых знаменитых и печально известных адмиралов Кайзеррейха. Он одинаково известен как своей преданной службой кайзеру, так и необычным увлечением, ведь Лукнер является настоящим современным пиратом. Прославившись налётами на морские коммуникации Антанты во время Вельткрига, Лукнер и его «Die Piraten des Kaisers» обещают стать лояльными, пусть шумными и нетрадиционными, новыми правителями Германской Восточной Азии. Однако слухи о растущей эксцентричности и амбициях Лукнера уже вызывают беспокойство."
Ostasien.511.a:0 "Хайе уходит, а Лукнер становится нашим новым губернатором."
Ostasien.511.b:0 "Морской Дьявол и его пираты делают ход, чтобы подчинить себе всё правительство!"
Ostasien.511.c:0 "Хайе отвергает требования Лукнера и остаётся у власти на обозримое будущее."

Ostasien.5112.t:0 "Новый гросс-адмирал"
Ostasien.5112.d:0 "Плававший по морям ещё с юности и ставший одним из величайших флотоводцев кайзера, Феликс Николаус Александр Георг граф фон Лукнер является одним из самых знаменитых моряков, когда-либо выходивших в море. Он родился в Дрездене в 1881 году в семье Лукнеров, старинном дворянском роду, прославившемся военными заслугами. Отец буквально душил юного Феликса постоянным давлением, заставляя его идти в кавалерию, хотя сам мальчик с детства мечтал о море. Не выдержав, Лукнер сбежал из дома в тринадцать лет, поклявшись семье, что вернётся лишь тогда, когда будет носить «морскую форму Императора, и с честью». Взяв вымышленное имя, этот «Филакс Людеке» устроился неоплачиваемым юнгой на старый русский парусник, направлявшийся в Австралию.\n\nВо время плавания он едва не погиб, свалившись за борт, но сумел спастись, схватив альбатроса и используя его как сигнал, чтобы привлечь внимание товарищей. Несмотря на это, молодой Лукнер быстро освоился с морской жизнью.\n\nПрибыв в Австралию, мальчик брался за любую работу, чтобы выжить, и за несколько лет успел объехать весь мир. Он был строителем, барменом, содержателем таверны, боксёром, охотником на кенгуру, цирковым артистом, рыбаком, смотрителем маяка, охранником мексиканского президента и даже успел отсидеть в чилийской тюрьме за кражу свиней, причём всё это ещё до двадцати лет. После освобождения он вернулся в Германию, где поступил в навигационную школу, чтобы стать настоящим моряком. Затем служил на пароходной линии, связывавшей германские владения в Центральной Америке с Гамбургом, и лишь после этого вернулся к семье, давно считавшей его погибшим. В 1912 году Лукнер был призван на службу в кайзеровский флот, всего за два года до Вельткрига.\n\nИменно в этой войне Лукнер обрёл славу. Сначала он служил на SMS Panther, где быстро заработал репутацию стойкого и талантливого морского офицера. Раз за разом громя британцев, он внушил англичанам такой страх, что получил знаменитое прозвище «Der Seeteufel», Морской Дьявол. После многочисленных побед кайзер подарил ему конфискованный трёхмачтовый парусник, переименованный в Seeadler, или Морского Орла, и передал его под командование Лукнера главным образом потому, что тот был одним из немногих германских офицеров с серьёзным опытом управления столь крупным парусным судном. Оснащённые современными пушками Морской Дьявол и его «Piraten des Kaisers» продолжили создавать себе легенду, возродив торговое рейдерство и с огромным успехом нарушая снабжение держав Антанты.\n\nПосле войны Лукнер и его команда продолжили служить кайзеру, совершая налёты на вражеские морские пути и топя нарушителей порядка на всех Семи морях, постепенно получая новые награды и повышения. В конце концов он оказался в Германской Восточной Азии под началом Хельмута фон Мюкке и Вильгельма Зольфа. Теперь, когда их неудачи привели к тому, что значительная часть Германской Восточной Азии оказалась охвачена огнём, Морской Дьявол Лукнер унаследовал их командование. Под его стальным взглядом Германская Восточная Азия снова будет усмирена во имя кайзера, если только старый пират не решит взять всё в свои руки..."
Ostasien.5112.a:0 "Вот это человек."

Ostasien.5113.t:0 "Макс и Мориц"
Ostasien.5113.d:0 "Печально известный адмирал Феликс фон Лукнер известен на всех Семи морях как человек действия, харизмы и благородной хитрости, обладающий непревзойдённым мастерством управления кораблём. Блестящий стратег, надёжный командир, многократно награждённый герой и ветеран войны, казалось бы, Лукнер должен обладать суровой, холодной и стальной внешностью типичного военного старой гвардии. И всё же даже у этого капера Кайзеррейха есть слабость.\n\nПрактически повсюду Лукнера сопровождают Макс и Мориц, две его любимые таксы. Он берёт их на все официальные встречи, визиты и учения, а порой даже в самую гущу войны, где они буквально пляшут над водяной могилой, пока Морской Дьявол Лукнер управляет морями во имя кайзера с мостика своего знаменитого SMS Seeadler. Он выгуливает их при любой возможности, даже по палубе собственного корабля, и эти две собаки для него ценнее любой когда-либо полученной награды. Ценя Макса и Морица больше собственной жизни, а возможно, даже жизней подчинённых, Лукнер благодаря этим очаровательным псам становится мягче и хоть ненадолго расслабляется среди рутины колониальной жизни."
Ostasien.5113.a:0 "Даже у Морского Дьявола есть слабость."

Ostasien.5114.t:0 "Судьба командования Хайе"
Ostasien.5114.d:0 "После окончательной победы над индокитайскими революционерами Берлин вновь напомнил о себе, потребовав, чтобы наш колониальный губернатор и герой Великой войны Август Вильгельм Хайе вернулся на родину и помог защищать Отечество там, где он нужнее всего, снова на границе с французами или русскими. И кайзер, и Reichskolonialamt, Имперское колониальное управление в Берлине, отвечающее за надзор над колониями по всему огромному Кайзеррейху, считают, что выдающиеся способности Вильгельма Хайе растрачиваются впустую в захолустной тропической колонии на другом конце света. На место губернатора Берлин желает назначить собственного сына Хайе, уважаемого адмирала Хельмута Гвидо Александра Хайе, ссылаясь на его мастерство в морских диверсионных операциях, подводной войне и тактике крейсеров, связи с Партией Центра в Берлине и абсолютную преданность Кайзеррейху. Однако старший Хайе резко выступил против этой идеи, заявив, что ещё не закончил с Индокитаем и намерен оставаться в колонии до самой отставки или смерти, смотря что наступит раньше. Стоит ли обойти волю Августа Вильгельма Хайе, отправить его обратно в Берлин, где он действительно нужнее, и позволить сыну выйти из отцовской тени и возглавить колонию, или же старому псу войны следует позволить провести последние годы среди тропического блаженства колониальной бюрократии и партизанской войны, как он сам того желает?"
Ostasien.5114.a:0 "Вильгельм Хайе остаётся у власти ради блага колонии."
Ostasien.5114.b:0 "Хельмут приходит к власти с умеренной программой отцовского колониального патернализма."
Ostasien.5114.c:0 "Хельмут приходит к власти с программой, основанной на идеях Партии Центра."

Ostasien.5115.t:0 "Рыцарь Империи возвращается домой"
Ostasien.5115.d_lost:0 "Освобождённый от колониальной службы после ведущей роли в провальной войне против индокитайских революционеров, опозоренный офицер и бывший герой Великой войны Август Вильгельм Хайе вернулся из Германской Восточной Азии, чтобы помочь Отечеству там, где он нужнее всего, на наших родных границах. Однако в грядущей борьбе за выживание против мерзких синдикалистов и разнообразных реваншистов, окружающих нас словно волки, поражение недопустимо. Поэтому некоторые члены Генерального штаба предлагают отправить Хайе в досрочную отставку. Следует ли списать этого старого пса войны и позволить ему исчезнуть в принудительном забвении или же некогда почтенный рыцарь заслуживает последнего шанса послужить Кайзеррейху?"
Ostasien.5115.d_won:0 "Освобождённый от колониальной службы и переведённый на родину после ведущей роли в победоносной войне против индокитайских революционеров, почтенный герой Великой войны и Индокитайского восстания Август Вильгельм Хайе вернулся из Германской Восточной Азии, чтобы помочь Отечеству там, где он нужнее всего, на наших родных границах. Однако старый пёс войны давно мечтает об отставке и, безусловно, уже заслужил её. Стоит ли наконец позволить Хайе уйти на заслуженный покой или оставить его на службе, чтобы его опыт под твёрдым и холодным взглядом привёл нас ещё к одной последней победе?"
Ostasien.5115.a:0 "Ты подвёл нас в последний раз, генерал."
Ostasien.5115.b:0 "Дайте старому псу заслуженный покой."
Ostasien.5115.c:0 "Оставить Хайе в составе Генерального штаба."

Ostasien.512.t:0 "Новая радикальная администрация?"
Ostasien.512.d:0 "После смерти Баллина и подъёма индокитайского сепаратизма почтенный генерал Август Вильгельм Хайе управлял колонией как чрезвычайный руководитель вместе с кликой лоялистов и собственным сыном Хельмутом Хайе, который и сам стал заметным адмиралом, ведя страну по канату над бушующим пожаром индокитайского радикализма. Однако, несмотря на весь опыт, Хайе подвёл и кайзера, и своих соотечественников: он не только не сумел подавить Индокитайское восстание, но и допустил потерю почти половины всей территории колонии в пользу социалистических революционеров. Его неудачи оставили после себя столь глубокие раны, хаос и страдания, что многие в уцелевшем колониальном огрызке, который теперь представляет собой Германская Восточная Азия, требуют немедленной отставки Хайе и его возвращения в Германию, называя его неудачником и предателем германских интересов и гордости. Жаждущие возмездия и мести оставшиеся немцы требуют передать власть более эффективному и куда более печально известному военному - Фердинанду Шёрнеру. Благодаря репутации человека дикой результативности и беспощадной эффективности Шёрнер стал главным кандидатом нынешнего режима на замену Хайе, хотя сам Хайе продолжает утверждать, что война ещё далеко не проиграна и что, получив лишь немного дополнительного времени, сумеет доказать союзникам, что борьба за Германскую Восточную Азию не окончена. Другие считают, что решение заключается не в мести, а в сосредоточении на собственных проблемах. Эти сторонники мира выдвигают сына генерал-полковника Хайе, Хельмута, более умеренный голос разума в кабинете собственного отца, который, скорее всего, просто признает потери и двинется дальше.\n\nВильгельм Хайе, несмотря на серьёзно испорченную репутацию, остаётся талантливым офицером и, без сомнения, сможет помочь Империи подготовиться к войне против коммунаров. Вероятно, в Германии он принесёт куда больше пользы, чем в Восточной Азии, которую многие уже считают безнадёжно потерянной.\n\nПока наш Генеральный штаб спорит о том, кто должен возглавить нас в этот кризисный момент, остаётся лишь дождаться, когда пыль уляжется и для колонии будет избран новый курс."
Ostasien.512.a:0 "Несмотря на ошибки, Хайе остаётся убеждённым лоялистом. Дать ему ещё один шанс."
Ostasien.512.b:0 "Отправить Вильгельма Хайе обратно в Берлин и позволить его сыну возглавить колонию!"
Ostasien.512.c:0 "Хайе подвёл нас в последний раз. Привести Фердинанда Шёрнера..."

Ostasien.52.t:0 "Прибывают новые корабли"
Ostasien.52.d:0 "Новые корабли, построенные в рамках Морского плана 1934 года, присоединились к славному Восточноазиатскому флоту в [GetNameGEASingapore]."
Ostasien.52.a:0 "Превосходно!"

# GEA Action in the Philippines

Ostasien.60.t:0 "Социалистическое восстание на Филиппинах"
Ostasien.60.d:0 "После окончания американского колониального правления Филиппинский архипелаг погрузился в хаос. Группа недовольных армейских офицеров вместе с отрядами крестьян и промышленных рабочих подняла восстание, стремясь свергнуть правительство и установить социалистический режим. Пока неизвестно, смогут ли филиппинские вооружённые силы подавить мятежников, однако небольшая помощь определённо повысит их шансы."
Ostasien.60.a:0 "Тайно поддержать филиппинскую армию."
Ostasien.60.b:0 "Не наше дело."

Ostasien.61.t:0 "Социалисты захватывают власть на Филиппинах!"
Ostasien.61.d:0 "Филиппинское правительство передало власть синдикалистскому движению. Однако южные районы Филиппин, включая острова Палаван и Минданао, пока не находятся под твёрдым контролем нового центрального правительства. Быть может, это наш шанс освободить их от синдикалистской тирании и взять под имперскую защиту?"
Ostasien.61.a:0 "Отправить флот и занять южные острова."
Ostasien.61.b:0 "Оставить их в покое."

Ostasien.62.t:0 "Германский флот у берегов Палавана!"
Ostasien.62.d:0 "Германия объявила население южных областей находящимся под своей «защитой» и направила флот для установления контроля над регионом. Как нам реагировать?"
Ostasien.62.a:0 "Мы умрём героями."
Ostasien.62.b:0 "Мы ничего не можем сделать."

Ostasien.63.t:0 "Филиппинское правительство уступает"
Ostasien.63.d:0 "Филиппинское правительство отказалось вступать с нами в противостояние. Теперь южные острова Филиппин могут быть включены в состав колоний Дойч-Остазиен. Славный день для Кайзеррейха."
Ostasien.63.a:0 "Превосходно."

Ostasien.64.t:0 "Восточноазиатский флот занимает Южные Филиппины"
Ostasien.64.d:0 "Сегодня адмирал Мюкке сообщил из [GetNameGEASingapore], что Восточноазиатский флот успешно установил контроль над южными островами Филиппин, защитив их от синдикалистского режима в Маниле. Славный день для Кайзеррейха."
Ostasien.64.a:0 "Превосходно!"

Ostasien.65.t:0 "Филиппины объявляют нам войну"
Ostasien.65.d:0 "После установления синдикалистского правительства в Маниле Восточноазиатский флот смело попытался занять южные острова Филиппин. Теперь синдикалистское правительство страны самоубийственно решило объявить нам войну."
Ostasien.65.a:0 "Отлично."

# GEA Intervention in Burma

Ostasien.66.t:0 "Социальные волнения в Бирме"
Ostasien.66.d:0 "Королевство Бирма, получившее независимость при содействии Германской империи, столкнулось с глубоким политическим кризисом. Студенты и рабочие выступили против монархии с масштабными демонстрациями и протестами. Полиция пока совершенно не справляется с радикальными протестующими. Стоит ли нам поддержать бирманскую монархию в этом кризисе?"
Ostasien.66.a:0 "Отправить флот в знак поддержки."
Ostasien.66.b:0 "Не наше дело."

Ostasien.67.t:0 "Германский флот прибывает в Янгон"
Ostasien.67.d:0 "Сегодня в Янгон прибыл огромный германский флот. Морская делегация Германии явилась продемонстрировать поддержку бирманской монархии. Мятежники были потрясены и напуганы мощью германского флота."
Ostasien.67.a:0 "Могучая Германия!"

Ostasien.68.t:0 "Порядок в Бирме восстановлен"
Ostasien.68.d:0 "Бирма, молодое королевство, ещё недавно находившееся в глубоком политическом кризисе, восстановила порядок благодаря быстрым и решительным действиям Восточноазиатского флота. Бирманский посол выразил признательность Германской империи и [GEA.GetLeader]. Теперь они стремятся к более тесным отношениям с Германской империей, чтобы защитить свою независимость и стабильность."
Ostasien.68.a:0 "Гарантировать их независимость."
Ostasien.68.b:0 "Но я вообще ничего не знаю о Бирме!"

#GEA natural disaster

Ostasien.69.t:0 "Извержение вулканов Вулкан и Кайа!"
Ostasien.69.d:0 "Сегодня город Рабаул подвергся сразу двум мощным вулканическим извержениям. Несмотря на все наши усилия, сотни жителей не успели вовремя покинуть город и были погребены под пеплом. Миссионеры Святого Сердца стали свидетелями взрывных извержений и быстро организовали эвакуационный лагерь при своей миссии в Хербертсхёэ. Несколько тысяч раненых и лишившихся крова людей теперь ждут помощи от колониальной администрации после этой катастрофы."
Ostasien.69.a:0 "Нужно спешить."

# Dissolution of the GEA

#Ostasien.69.t:0 "Берлин замолкает"
#Ostasien.69.d:0 "Мы окончательно потеряли связь с нашим колониальным ведомством в Берлине и не знаем, что делать дальше. Тем временем местные жители начинают собираться у здания правительства, требуя независимости. Напряжение достигло невиданного прежде уровня."
#Ostasien.69.a:0 "Нас ждёт неопределённое будущее."

Ostasien.200.t:0 "Подкрепления в Восточную Азию"
Ostasien.200.d:0 "Reichskolonialamt запросило дополнительные силы для отправки в Восточную Азию, чтобы сменить истощённые войска. Хотя этим людям было бы куда проще служить дома, Восточная Азия остаётся очагом синдикализма и борьбы между многочисленными силами, с которыми у нас заключены выгодные соглашения."
Ostasien.200.a:0 "Такова цена Империи."

Ostasien.201.t:0 "Поставки снаряжения в Восточную Азию"
Ostasien.201.d:0 "Reichskolonialamt запросило дополнительное вооружение для операций в Восточной Азии, чтобы сократить нехватку и полностью укомплектовать все дивизии. Эти винтовки наверняка пригодятся для подавления тех жителей Востока, которые осмелятся выступить против Кайзеррейха."
Ostasien.201.a:0 "Такова цена Империи."

Ostasien.202.t:0 "Германия предлагает нам вооружение"
Ostasien.202.d:0 "Правительство Германской Восточной Азии от имени Германии признало тяжесть нашего положения и предложило щедрую партию пехотного снаряжения, чтобы помочь нам в борьбе за выживание. Однако за этой добротой наверняка скрывается желание ещё сильнее подчинить нашу экономику после окончания войны."
Ostasien.202.a:0 "У нас нет выбора, придётся принять."
Ostasien.202.b:0 "Мы должны отстоять свою независимость!"

Ostasien.203.t:0 "Германия предлагает помощь нашей промышленности"
Ostasien.203.d:0 "Правительство Германской Восточной Азии от имени Германии признало тяжесть нашего положения и предложило временно использовать некоторые принадлежащие им предприятия на нашей территории для снабжения военного производства. Хотя эта помощь кажется крайне полезной, невольно возникает вопрос, какую цену нам придётся заплатить после окончания войны..."
Ostasien.203.a:0 "От этого зависит выживание нашего правительства, как бы печально это ни было."
Ostasien.203.b:0 "Мы не можем позволить себе ещё сильнее запутаться в их сетях!"

Ostasien.204.t:0 "Срок аренды предприятий истёк"
Ostasien.204.d:0 "Условия, навязанные A.O.G., предусматривают окончание аренды их предприятий сегодня. Они оказались чрезвычайно полезны в нашей борьбе, и мы уверены, что немцы прекрасно это понимают."
Ostasien.204.a:0 "Придётся принять последствия этой «помощи»."

Ostasien.205.t:0 "Запасы рудника Крамат-Пулай истощаются"
Ostasien.205.d:0 "Рудник Крамат-Пулай, главный источник нашего вольфрамового экспорта, превратил нас в одного из ведущих мировых поставщиков вольфрама. Однако последние отчёты указывают на истощение залежей шеелита и предупреждают о близком полном исчерпании рудника."
Ostasien.205.a:0 "Тревожно."

Ostasien.206.t:0 "Рудник Крамат-Пулай исчерпан!"
Ostasien.206.d:0 "Запасы рудника Крамат-Пулай официально исчерпаны. Хотя небольшие залежи шеелита ещё остаются, а рудники Перака продолжают давать приемлемые объёмы, наше положение ведущего экспортёра вольфрама в регионе осталось в прошлом."
Ostasien.206.a:0 "Хорошо было, пока длилось."

Ostasien.207.t:0 "Влияние A.O.G. в Китае растёт..."
Ostasien.207.d:0 "Среди череды противоречивых новостей кажется, что нашим партнёрам из A.O.G. наконец улыбнулась удача. Завершение строительства и приобретение железной дороги Чжэган, крупного железнодорожного проекта на территории Лиги восьми провинций, позволило A.O.G. ещё глубже распространить своё влияние в Китае. Хотя реакция на действия A.O.G. местами была далеко не дружелюбной, можно с уверенностью предположить, что это хороший знак на будущее."
Ostasien.207.a:0 "Радостная новость."

Ostasien.208.t:0 "Чёрный понедельник поражает A.O.G.!"
Ostasien.208.d:0 "Похоже, наши китайские партнёры переживают кризис Чёрного понедельника ничуть не лучше нас. Германские предприятия, и без того испытывавшие давление со стороны местных сил, пострадали особенно сильно. Deutsch-Asiatische Bank, некогда считавшийся слишком крупным, чтобы обанкротиться, балансирует на грани краха, а последствия этой финансовой нестабильности уже ощущает и наш собственный финансовый сектор."
Ostasien.208.a:0 "И вас тоже, да?"

Ostasien.209.t:0 "Германский бизнес покидает Лигу"
Ostasien.209.d:0 "После распада Лиги восьми провинций и начала гражданской войны германское доверие к статус-кво, да и к Китаю в целом, также рухнуло. Хотя Ци Сеюань обещает после победы гарантировать германские интересы, вера в дальнейшее существование A.O.G. и его ценных концессионных городов стремительно исчезает."
Ostasien.209.a:0 "Да имейте же хоть немного веры!"

Ostasien.210.t:0 "A.O.G. остаётся на страже..."
Ostasien.210.d:0 "После полного уничтожения Нанкинской клики германское влияние в Китае, похоже, столкнулось с непреодолимым препятствием. Мы всеми силами пытаемся принять перемещённую нанкинскую администрацию в наших концессиях, однако трудно смириться с потерей главного китайского союзника. Тем не менее A.O.G. сохраняет бдительность, а администрация Германской Восточной Азии внимательно следит за отколовшимися образованиями, возникшими после исчезновения Лиги."
Ostasien.210.a:0 "По крайней мере, у нас всё ещё есть Циндао."

Ostasien.211.t:0 "Германский бизнес возвращается в Китай"
Ostasien.211.d:0 "После успешного выживания Нанкинской клики доверие к ведению бизнеса в Китае начало восстанавливаться. A.O.G., хотя и явно потрёпанная кризисом, воспринимает его одновременно как урок и возможность, надеясь использовать ослабление Нанкина, чтобы лучше защитить германские интересы от будущих потрясений."
Ostasien.211.a:0 "Значит, всё снова как обычно."

Ostasien.212.t:0 "Связи с Остазиен"
Ostasien.212.d:0 "Поскольку наши нынешние дружественные отношения с Германией остаются прочными, администрация Остазиен предприняла шаги для поддержки нашего зарождающегося военно-морского строительства. Их мотивы, несомненно, исключительно прагматичны, однако предложенная помощь от этого не становится менее полезной для нашего выживания. Германские инженеры готовы предоставить нашим верфям новые проекты кораблей или, в качестве альтернативы, направить постоянного военно-морского атташе для дальнейшего обучения нашего флота."
Ostasien.212.a:0 "Мы внедрим их проект лёгкого корабля."
Ostasien.212.b:0 "Нам пригодится их опыт в линкорах."
Ostasien.212.c:0 "Постоянный военно-морской атташе будет полезен."

Ostasien.213.t:0 "Остатки A.O.G...."
Ostasien.213.d:0 "После полного уничтожения Нанкинской клики история германского влияния в Китае, похоже, подошла к концу. Мы всеми силами пытаемся принять остатки администрации A.O.G. в наших сохранившихся концессиях, однако смириться с утратой влияния в Азии нелегко."
Ostasien.213.a:0 "По крайней мере, у нас всё ещё есть Циндао."

######
Ostasien.214.t:0 "Апокалипсис сегодня"
Ostasien.214.d:0 "Душные джунгли Индокитайского полуострова скрывают одни из самых густых и суровых мест на Земле. Тёмные леса и коварные пещеры без остатка поглощают несчастных, заблудившихся в их мрачной пасти. Этот земной ад отпугивает всех, кроме самых храбрых или самых безумных, и именно здесь занял свой пост Фердинанд Шёрнер. Пока пламя синдикалистской революции стремительно распространяется по региону, Шёрнер холодно и методично подавляет левых повстанцев. Не проявляя ни малейшего раскаяния, он сочетает военный талант с беспощадностью, прокладывая кровавый путь через юг Азии. Под его командованием войска Германской Восточной Азии обрушивают на мятежников всю доступную огневую мощь, а сам Шёрнер не признаёт ни жалости, ни пощады. По его приказу солдаты без колебаний расстреливают и сжигают противников в ходе кампании по спасению колонии и сохранению германской гегемонии в регионе. В собственных глазах Шёрнер лишь очищает законные земли кайзера от гнили синдикализма и намерен провести это необходимое «изгнание» марксистской заразы без малейших угрызений совести. Пока Шёрнер остаётся в Индокитае, свет кайзера будет сиять над этим захолустьем, а под его командованием силы Германской Восточной Азии непременно одержат победу!"
Ostasien.214.a:0 "Деревья говорят по-вьетнамски, а Шёрнер отвечает им свинцом."

Ostasien.215.t:0 "Каждому изобретению найдётся применение"
Ostasien.215.d:0 "Исследовательские и конструкторские коллективы Кайзеррейха непрерывно трудятся над новыми способами дать нашим вооружённым силам преимущество над многочисленными врагами. Однако бесконечно выдавать хорошие идеи трудно, и далеко не каждый проект оказывается удачным. Хотя многие наиболее безумные замыслы так и не доходят до производства, на этот раз одна особенно странная идея всё же победила.\n\nЭта одноместная бронированная машина производства Krupp получила название «шаровой танк», или «Kugelpanzer», и действительно не похожа ни на что другое. Она представляет собой крупную сферическую кабину между двумя наклонёнными внутрь кольцевыми гусеницами, а сзади на небольшой трёхопорной стойке установлено маленькое балансировочное колесо. Спереди имеется лишь узкая смотровая щель для водителя, а встроенное вооружение вообще отсутствует, если не считать оружия, которое сам пилот возьмёт с собой. По здравой логике такие машины, вероятно, вообще не следовало запускать в производство. Тем не менее вопреки логике и здравому смыслу было изготовлено 24 экземпляра, которые теперь отправлены в германские владения в Восточной Азии и распределены между нашими войсками. При броне толщиной всего 5 мм и лёгком одноцилиндровом двухтактном мотоциклетном двигателе каждый из этих Kugelpanzer, скорее всего, пригодится лишь для разведки. Какими бы странными и бесполезными они ни казались, выбирать нам не приходится, поэтому остаётся надеяться, что хотя бы здесь им найдётся применение."
Ostasien.215.a:0 "Может, здесь от них будет больше пользы, чем от пыли в Берлине."

#####
Ostasien.300.t:0 "Смерть Альберта Баллина"
Ostasien.300.d:0 "Печаль и депрессия разрушают тело, и Альберт Баллин не стал исключением из этой жестокой закономерности. Влиятельный судоходный магнат и новатор военно-морского дела, ставший колониальным губернатором, всю жизнь находился на вершине, по крайней мере до недавнего времени. Экономический кризис Великой депрессии, а затем Чёрный понедельник загнали компанию и состояние Баллина глубоко в убытки, пока куда более опасные Красные стремятся разрушить всё, что он построил здесь, в Восточной Азии. Преклонный возраст и постоянное давление финансовых проблем привели к стремительному ухудшению как физического, так и душевного здоровья Баллина. Последней каплей, похоже, стала смерть его старого делового партнёра и друга всей жизни Вильгельма Зольфа, покойного штатгальтера Миттельафрики. Потеряв столь дорогого союзника, стареющий Баллин погрузился в глубокую тоску и неделями не покидал своих покоев, существуя на алкоголе, наркотиках и остатках чёрствого хлеба. Теперь объявлено, что губернатор Баллин скончался. Общественности сообщили, будто он перенёс сердечный приступ и мирно умер во сне, однако местная администрация и ближайшее окружение знают правду: Баллин покончил с собой, приняв смертельную дозу обезболивающих, опиума и германского алкоголя, предпочтя уйти из жизни в состоянии наркотического забытья и оставить разбитую судьбу позади. Истину быстро скрыли, чтобы германский гарнизон не выглядел слабым перед индокитайскими сепаратистами, высматривающими любые признаки уязвимости режима. Семья и друзья Баллина в Германии, однако, были уведомлены о трагедии. Теперь, когда Баллин предан земле, почтенный адмирал Хельмут фон Мюкке приведён к присяге как исполняющий обязанности губернатора до тех пор, пока Берлин не объявит официального преемника."
Ostasien.300.a:0 "Уходи спокойно в эту долгую ночь, старый друг."

Ostasien.301.t:0 "Берлин назначает новое правительство"
Ostasien.301.d:0 "Хотя Хельмут фон Мюкке верно служил кайзеру в качестве временного губернатора колонии после трагической смерти Альберта Баллина, необходимо назначить нового постоянного руководителя, и это обязанность кайзера и колониального ведомства. Запрос в Берлин потребует времени, поэтому нам остаётся ждать ответа. Широко распространено мнение, что кайзер и его советники рассматривают трёх основных кандидатов. Первый и самый очевидный вариант - оставить Мюкке полноправным постоянным губернатором, что кажется большинству естественным решением с учётом его прославленной морской карьеры и безупречной службы. Однако называются ещё два имени: печально известный аристократ принц Йозиас цу Вальдек унд Пирмонт и почтенный генерал Август Вильгельм Хайе. Оба также могли бы стать прекрасными руководителями колонии, обладая долгой службой Кайзеррейху и богатым военным опытом. Однако окончательный выбор принадлежит нашему монарху, и мы с нетерпением ждём его решения..."
Ostasien.301.a:0 "Берлин официально утверждает Хельмута фон Мюкке."
Ostasien.301.b:0 "Назначить принца Йозиаса цу Вальдек унд Пирмонт."
Ostasien.301.c:0 "Назначить маршала Августа Вильгельма Хайе."

Ostasien.302.t:0 "Уступки народу"
Ostasien.302.d:0 "Чтобы укрепить наше положение и выполнить прежние обещания, [GEA.getleader] добился того, чтобы нынешний режим облегчил положение простых жителей Германской Восточной Азии. Промышленные рабочие и крестьяне, будь то образованные германские трудящиеся или местные восточноазиатские рабочие, составляют большинство населения и служат основой нашей экономики, а значит, именно они являются душой этой колонии. Губернатор [GEA.getleader] объявил о намерении принять целый ряд новых законов в пользу рабочих, рассчитывая завоевать их поддержку. Подобные символические экономические и социальные уступки обходятся нашей администрации совсем недорого по сравнению с тем, насколько эффективно они помогают сохранять мир и атмосферу стабильности, которую нам удалось создать."
Ostasien.302.a:0 "Человек из народа, [GEA.getleader] успокаивает низшие слои!"

Ostasien.303.t:0 "Уступки знати"
Ostasien.303.d:0 "Чтобы укрепить наше положение и выполнить прежние обещания, [GEA.getleader] добился того, чтобы нынешний режим установил более тесные связи и заключил новые соглашения с местной элитой Германской Восточной Азии. Хотя по численности эти люди значительно уступают рабочим массам, их состояния составляют большую часть неколониальной экономики, а сами они являются хранителями традиций и авторитета в своих культурах. Будь то колониальные предприниматели, азиатская знать или местные владельцы предприятий и промышленные магнаты, эти богатые и влиятельные люди являются сердцем колонии. Губернатор [GEA.getleader] объявил о намерении принять целый ряд новых законов в пользу элиты, рассчитывая завоевать её поддержку. Подобные символические экономические и социальные уступки ничтожны по сравнению с тем, насколько эффективно они помогают сохранять мир и атмосферу стабильности, которую нам удалось создать."
Ostasien.303.a:0 "Истинная голубая кровь, [GEA.getleader] успокаивает элиты!"

Ostasien.304.t:0 "Поездка в деревню"
Ostasien.304.d:0 "На берегу реки Донгнай, всего в нескольких десятках миль к югу от города Анлок, существовала тихая рыбацкая деревня, словно застывшая в традиционной идиллии, мирный островок среди всё более хаотичного Индокитая. Эта картина могла бы сохраняться ещё десятилетиями: местные вьетнамские крестьяне усердно трудились на рисовых полях и с рыболовными сетями, почти не заботясь о событиях большого мира, словно персонажи пасторального полотна. Но судьба распорядилась иначе.\n\nНеизвестно большинству жителей, небольшая синдикалистская ячейка начала использовать один из местных рыболовных промыслов как прикрытие для подпольной деятельности. Арендуя плоты и другие суда у наиболее сочувствующих рыбаков, группа преимущественно молодых, образованных в колледжах и одурманенных идеями мятежников переправляла украденное германское оружие вверх по реке крупным партизанским отрядам, скрывавшимся в северных горах. Эти наивные юнцы считали, что помогают благородному делу, но даже не подозревали, что своими действиями уже обрекли всю деревню.\n\nПоднимаясь по Донгнаю на тяжело вооружённых патрульных катерах, Фердинанд Шёрнер и его верный карательный отряд опытных ветеранов готовили огнемёты, зажигательные гранаты, MP-40 и зажигалки IMCO. Они прибыли в это захолустье с одной задачей - уничтожить подпольную сеть и полностью ликвидировать её опорный пункт. Едва катера достигли окраины гавани, люди Шёрнера открыли огонь по находившимся на воде рыбакам, а затем высадились и начали методично прочёсывать поселение. Хижины обыскивались и поджигались, подозреваемых в помощи повстанцам расстреливали на месте, а огонь быстро охватил деревню.\n\nМенее чем через час поселение было охвачено пламенем или уже обращено в пепел. Шёрнер и его люди действовали настолько тщательно, что обнаружили даже тайные проходы под деревней, а единственное судно, на котором пытались скрыться члены подполья, было уничтожено ещё до выхода в реку. От прежнего поселения почти ничего не осталось. Такова участь, которой Шёрнер намерен подвергать любые деревни, укрывающие индокитайских сепаратистов, ведь теперь это его Восточная Азия, и он намерен сохранить её именно такой."
Ostasien.304.a:0 "Всего лишь препятствие на пути к идеальному колониализму."

Ostasien.305.t:0 "Ещё больше уступок?"
Ostasien.305.d.nobles:0 "Предыдущие уступки знати и элите колонии хорошо послужили нашей администрации, а стабильность и процветание начали укрепляться. Однако это не помешало новым союзникам потребовать ещё большего особого отношения и дополнительных привилегий, фактически удерживая правительство в заложниках по мере того, как их запросы становятся всё более чрезмерными и невыполнимыми. Нам предстоит решить, настало ли время приказать этим аристократам убираться и искать новых покровителей, которых можно будет доить, сократить объём оказываемой им помощи или же полностью уступить требованиям и позволить аристократии диктовать политику колониальной администрации. Поддержка голубой крови нам необходима, но стоит ли ради неё выполнять каждую прихоть и желание?"
Ostasien.305.d.people:0 "Предыдущие уступки простым рабочим колонии хорошо послужили нашей администрации, а стабильность и процветание начали укрепляться. Однако это не помешало новым союзникам потребовать ещё большего особого отношения и дополнительных привилегий, фактически удерживая правительство в заложниках по мере того, как их запросы становятся всё более чрезмерными и невыполнимыми. Нам предстоит решить, настало ли время приказать этим рабочим убираться и искать новых покровителей, которых можно будет доить, сократить объём оказываемой им помощи или же полностью уступить требованиям и позволить колониальной администрации плясать под дудку крестьян. Поддержка низших классов нам необходима, но стоит ли ради неё выполнять каждую прихоть и желание?"
Ostasien.305.a:0 "Сократить поддержку, но оставить достаточно, чтобы они были довольны."
Ostasien.305.b:0 "Ради сохранения колониальной системы придётся уступить ещё больше."
Ostasien.305.c:0 "Кайзеррейх больше не будет прогибаться перед этими буйными местными."

Ostasien.306.t:0 "Мир с Рейхспактом?"
Ostasien.306.d:0 "Наконец наши храбрые армия и флот успешно выбили германские силы из Океании, и теперь мы можем заключить выгодный мир с Рейхспактом, получив полный контроль над его обширными тропическими владениями. Теперь нам предстоит решить: продолжать борьбу против германского империализма или заключить мир и окончательно закрепить наши завоевания?"
Ostasien.306.a:0 "Никакого мира, пока мы не пройдём маршем по Берлину!"
Ostasien.306.b:0 "Нас это устраивает. Отправить им мирный договор."

Ostasien.307.t:0 "Сиамское переустройство?"
Ostasien.307.d:0 "Теперь, когда земли Сиама находятся под контролем сил, верных кайзеру, перед нами стоит решение, которое определит облик Восточной Азии на десятилетия вперёд. Тайские короли долго удерживали части законных владений наших зависимых монархов, будь то в Малайе, Лаосе или Камбодже, не имея на то ясного и признанного международными договорами права. Мы могли бы немедленно изменить положение и приказать гарнизонам Остазиен занять оставшиеся части этих государств, однако это способно ещё сильнее расшатать и без того хрупкий регион. Какое решение примет колониальное ведомство?"
Ostasien.307.a:0 "Проект Остазиен должен стать ещё грандиознее!"
Ostasien.307.b:0 "Воссоединим Камбоджу."
Ostasien.307.c:0 "Расширим Малайю."
Ostasien.307.e:0 "Вернём Лаосу его земли."
Ostasien.307.f:0 "Не стоит перекраивать регион больше необходимого."

Ostasien.308.t:0 "Джорджисты залива Цзяочжоу"
Ostasien.308.d:0 "Среди многочисленных германских владений, разбросанных вдоль китайского побережья, арендованная территория залива Киаочоу в Цзяочжоу, Шаньдун, пожалуй, является одной из самых необычных. С самого основания в 1898 году эта концессия управлялась на джорджистских принципах. Стремясь избежать спекуляций землёй, от которых страдали колонии кайзера в Африке, администрация арендованной территории залива Киаочоу полностью внедрила джорджистскую систему единого налога: единственным источником государственных доходов стал фиксированный шестипроцентный налог на стоимость земли, взимавшийся по всей территории владения. Удивительно, но эта система успешно работает уже десятилетиями, сохраняя эффективность и по сей день и пользуясь широкой популярностью как среди германцев, так и среди местного китайского населения. Впрочем, некоторые иностранные предприниматели из других империалистических держав, например Японии, ненавидят эту практику, поскольку, по их словам, она сокращает их прибыль.\n\nОднако, несмотря на популярность идей Генри Джорджа во всём политическом спектре, их истоки лежат в левых кругах, поэтому многие в колонии опасаются, что джорджистская практика способна стать каналом проникновения куда более опасных синдикалистских идей. Стоит ли позволить арендованной территории залива Киаочоу продолжить следовать джорджизму или же раз и навсегда подавить этот предполагаемый псевдосиндикализм?"
Ostasien.308.a:0 "Если работает, значит работает. Пусть сторонники единого налога спокойно организуются."
Ostasien.308.b:0 "Джорджизм? По мне так это синдикализм. Немедленно подавить!"

#decisions
GEA_indochina_war_decisions:0 "Индокитайская война"
GEA_indochina_war_decisions_desc:0 "Индокитайское восстание переросло в полномасштабную войну. Однако война против повстанцев Вьетконга не имеет чёткой линии фронта. Фронт находится повсюду, и каждый крестьянин в рисовой шляпе может оказаться бойцом Вьетконга. Мы должны сделать всё возможное, чтобы обеспечить победу Кайзеррейха.\n\nПредполагаемая §Yсила повстанческого движения§! в Индокитае: §R[?INC.guerilla_activity|-0]§!\n"
reduce_10_guerilla_tooltip:0 "По нашим оценкам, это снизит §Yсилу повстанческого движения§! на §R10§!.\n"
GEA_suppress_Tonkin:0 "Подавить Вьетконг в Тонкине"
GEA_maintain_Tonkin_control:0 "Сохранить наш контроль над Тонкином"
GEA_reinforce_police:0 "Усилить полицейские подразделения"
GEA_Zeppelin_decision:0 "Развернуть дирижабли-цеппелины"
GEA_Zeppelin_decision_desc:0 "С развитием морской авиации дирижабли-цеппелины в арсенале Остазии постепенно вытесняются более современными морскими патрульными самолётами при выполнении задач морской разведки. Однако недавняя война в Индокитае породила смелую идею: использовать цеппелины для патрулирования Индокитайского полуострова. Эти дирижабли также смогут доставлять припасы изолированным гарнизонам. Учитывая слабость противовоздушных средств повстанцев, риск должен быть минимальным."
GEA_Fernspaher_decision:0 "Сформировать подразделения Ферншпэеров"
GEA_Fernspaher_decision_desc:0 "Всё более ожесточённая война в Индокитае выявила слабости нашей армии. Хотя наши пехотные части хорошо оснащены для обороны своих позиций от противника, они слишком громоздки для ведения агрессивных и гибких боевых действий. Предлагается отбирать лучших солдат из наших вооружённых сил и объединить специальные навыки Гебиргсъегер и Фальширмъегер, сформировав собственные элитные подразделения Ферншпэеров для более эффективного выполнения подобных задач."
GEA_reintegrate_Cochinchina_decision:0 "Реинтегрировать Кохинхину"
GEA_German_vietnamese_reconciliation_decision:0 "Германо-вьетнамское примирение"
GEA_German_vietnamese_reconciliation_decision_desc:0 "Воспоминания о противоповстанческих операциях в Индокитае преследуют адмирала Хельмута фон Мюкке, и теперь он чувствует, что обязан предпринять что-то, чтобы искупить жестокие убийства. Он намерен проводить популярную колониальную политику, предоставляя больше местной автономии и способствуя германо-вьетнамскому согласию. Таким образом он надеется вновь завоевать сердца и умы жителей Кохинхины."
GEA_expand_war:0 "Расширить Австралазийско-германскую войну"
GEA_break_malay_chaos:0 "Покончить с хаосом в Малайе"
GEA_take_east_asian_navy:0 "Принять командование Восточноазиатским флотом"
GEA_take_east_asian_navy_desc:0 "Германский Восточноазиатский флот является ценным инструментом нашей военно-морской стратегии. Было бы лучше теснее интегрировать его в командную структуру Берлина."
GEA_Integrate_East_Indies:0 "Интегрировать администрацию Ост-Индии"
blow_singapore_causeway:0 "Уничтожить дамбу [GetNameGEAJohore]-[GetNameGEASingapore]"
blow_singapore_causeway_desc:0 "Будучи единственным сухопутным путём между материком и [GetNameGEASingapore], её уничтожение даст нам драгоценное время для укрепления острова. Однако такой шаг отрицательно скажется на наших военных усилиях, поскольку фактически будет означать, что мы решили оставить материк в руках врага..."

GEA_colonial_decisions:0 "Имперское колониальное ведомство"
GEA_colonial_decisions_desc:0 "Рейхсколониаламт, или Имперское колониальное ведомство, осуществляет общее руководство германским колониальным проектом. Поэтому именно через него мы должны получать драгоценные военные материалы и новые людские ресурсы из Отечества."
GEA_steal_manpower_from_home:0 "Запросить людские ресурсы"
GEA_steal_manpower_from_home_desc:0 "Наши резервы стремительно истощаются, и вскоре мы уже не сможем поддерживать дивизии в полном составе. Пришло время обратиться к Рейхсколониаламту с просьбой отправить нам больше призывников с родины, чтобы помочь в дальнейшей защите интересов Кайзеррейха."
GEA_steal_guns_from_home:0 "Запросить оружие"
GEA_steal_guns_from_home_desc:0 "Наши запасы пехотного снаряжения вызывающе малы. Чтобы должным образом исполнять свой долг перед кайзером, мы должны запросить у Рейхсколониаламта новую партию оружия."

GEA_help_lep_decisions:0 "Нанкинский кризис"
GEA_help_lep_decisions_desc:0 "Различные военачальники и даже синдикалисты поднялись против Нанкинского правительства. Мы обязаны помочь ему, чтобы защитить наши инвестиции в Китае, иначе наш контроль над китайской экономикой может рухнуть."
GEA_give_factories_to_lep:0 "Передать фабрики в аренду"
GEA_give_factories_to_lep_desc:0 "Мы обсудим с A.O.G. возможность временно передать часть фабрик в концессиях в полное распоряжение Нанкинского правительства, чтобы помочь ему в борьбе за выживание."
GEA_give_guns_to_lep:0 "Передать им оружие"
GEA_give_guns_to_lep_desc:0 "Мы обеспечим отправку крупной партии германского снаряжения плохо оснащённым войскам Нанкинского правительства в надежде склонить чашу весов в их пользу."

GEA_development_idea:0 "Горнодобывающие работы"
GEA_develop_aluminum_deposits:0 "Развить добычу бокситов в [GetNameGEAJohore]" #Change to the German spelling 'Johore' for lore-consistency
GEA_develop_aluminum_deposits_desc:0 "Наши геологоразведчики обнаружили богатые залежи бокситов в регионе [GetNameGEAJohore], идеально подходящие для производства алюминия. Хотя первоначальные затраты на разработку месторождений будут значительными, прогнозируемые объёмы добычи полностью оправдывают расходы."
GEA_develop_aluminum_deposits_wtt:0 "Развить добычу бокситов в [GetNameGEAJohore]"
GEA_develop_aluminum_deposits_wtt_desc:0 "Наши геологоразведчики обнаружили богатые залежи бокситов в регионе [GetNameGEAJohore], идеально подходящие для производства алюминия. Хотя первоначальные затраты на разработку месторождений будут значительными, прогнозируемые объёмы добычи полностью оправдывают расходы."
GEA_develop_sarawak_oil:0 "Разработка нефтяных месторождений Саравака" #Change to the German spelling 'Johore' for lore-consistency
GEA_develop_sarawak_oil_desc:0 "Нынешние объёмы потребления нефти не позволят нам поддерживать флот в случае длительных военно-морских операций. Однако, увеличив местную нефтедобычу на Борнео, мы сможем начать формировать резерв и предотвратить возможный дефицит топлива."
GEA_develop_sarawak_oil_wtt:0 "Разработка нефтяных месторождений Саравака"
GEA_develop_sarawak_oil_wtt_desc:0 "Нынешние объёмы потребления нефти не позволят нам поддерживать флот в случае длительных военно-морских операций. Однако, увеличив местную нефтедобычу на Борнео, мы сможем начать формировать резерв и предотвратить возможный дефицит топлива."

GEA_uprising_decisions:0 "Индокитайское восстание"
GEA_uprising_decisions_desc:0 "Текущий уровень недовольства в Индокитае: [GetNameGEAIndochinaAnger]\n Удерживайте §Yнедовольство в Индокитае§! ниже §G0§!, чтобы предотвратить §Rвосстание§!"

#Fleet Exercise
#With the arrival of new capital ships, our fleet has experimented and exercised new group tactics. Maybe it's time to have a joint exercise with the High Sea Fleet?
#Fleet Exercise
#Admiral Hellmuth wanted to hold a fleet exercise between the High Sea Fleet and the East Asian fleet. The East Asian fleet is known for their tactic innovation. This might be a good chance to examine our fleet tactics.
#Kaiserliche Marine has decided to launch a large-scale naval exercise in Indian Ocean. The scenario is be a war for the control of Indian Ocean between the Black fleet in a defensive stance and a superior Yellow fleet aimed to destroy the Black fleet and seize the control of the Andaman Islands. The powerful Yellow Fleet, commanded by admiral Wilhelm Marschall, is comprised of some most modern battleships in the High Sea Fleet. The Yellow Fleet will conduct their operation from Trincomalee naval base. Now it's time to decide our fleet composition and plan.
#Deploy our battleships for a face-to-face combat!
#Deploy battlecruisers for strategic deterrance!
#Deploy carrier groups for long-range operation!

#The Yellow Fleet tried to seize the Andaman Islands
#The exercise has started. The intelligence and air reconaissance suggests that the Yellow fleet is actively preparing the invasion of the Andaman islands. It's estimated that the Yellow will try to secure the Bay of Bengal with concentrated fleet, and then launched the invasion. Should we take a defensive stance to intercept Admiral Marschall's fleet in the area close to the Andaman islands, or try to take the initiative to disturb enemy operation by aggressive actions?
#Intercept them
#Take the initiative!

#Result: Black fleet tactic defeat - battlecruisers
#The Black fleet located the invading Yellow fleet by air reconaissance. Our battlecruisers soon encountered the Yellow scout cruisers. Although the Yellow fleet was slaughtered by Black battlecruisers in the initial encounter, Yellow battleships managed to arrived in time and overwhelmed the Black fleet with massive firepower. One Black battlecruiser suffered critical hits in their engine room and failed to escape but the rest returned to [GetNameGEASingapore]. Having suffered heavy loss of cruisers, the Yellow fleet doesn't have enough screen ships to support the amphibious assault either. The battle was considered a tactic defeat of the Black fleet but the result was strategic stalemate.

#Result: Black fleet tactic victory - battleships
#The Black fleet located the invading Yellow fleet by air reconaissance. The Black scout line spread out in front of the main battle force soon encountered the Yellow scout cruisers. The Black battelships were placed in execellent position to deal serious blows to the Yellow cruisers. Admiral Marschall's main force came into action before the cruisers were annihilated. Over the next hours both fleets exchanged long-range gunfire. The new rangefinders on SMS Neckar allowed it to deliver precious hits even when firing at extreme range. Admiral Hellmuth broke the engagement before the Yellow fleet could shorten the range and fully exploit its numerous advantage. managed to withdraw, it had suffered heavy loss and lost the ability to defend the Andaman islands, and the Yellow fleet eventually was able to launch an amphibious operation. Although the battle was indecisive, the Yellow fleet doesn't have enough screen ships to support the amphibious assault and the exercise ended up with Black fleet's strategic victory.

#Result: Black fleet strategic defeat - battleships
#Black's advance was quickly located by the Yellow's picket line of submarines, depriving them of any advantage of surprise. Soon, the Black fleet encountered the Admiral Marschall's cruiser group west of the Andaman islands. The Yellow cruisers turning to the north-west on a course to rejoin the battleships. The Black fleet pursued the cruisers until the Yellow battelships moved into position. Over the next hours both fleets exchanged long-range gunfire and the Black fleet was outgunned by the superior Yellow fleet. When Admral Hellmuth's fleet managed to withdraw, it had suffered heavy loss and lost the ability to defend the Andaman islands, and the Yellow fleet eventually was able to launch an amphibious operation. The exercise ended up with Black fleet's strategic defeat.


#Result: Black fleet strategic victory - battlecruisers
#Admiral Hellmuth decided to disperse his cruisers to harass the Yellow fleet and use battlecruiser to support them. These commerce destroyers posed great threats to the Yellow convoys. The Yellow fleet attempted to fend off the raiders by search and destroy actions but the Black cruisers avoid the engagement. Finally Admiral Marschall decided to disperse his fleet to protect the convoys. In an engagement, the convoys escorted by a Yellow battleship was assaulted by a Black raiding fleet supported by three battlecruisers. The convoys were savaged before the reinforcement arrived. The Yellow fleet was deterred from further actions. The result was judged a strategic victory of Admiral Hellmuth's Black fleet.

#Result: Black fleet decisive victory - carriers
#Admiral Hellmuth decided to take an audacious action: The black fleet comprised four aircraft carriers plus supporting ships under the command of the Admiral moved to about 200 miles south of Sri Lanka. The first attack wave of 93 aircraft took off in pre-dawn darkness heading towards Trincomalee. The air strike achieved complete surprise. The Yellow battle fleet and convoys are at anchor in the harbour of Trincomalee and failed to organise any resistance. Aerial torpedo experts in all modern navies had previously thought that torpedo attacks against ships can not take place in shallow waters, but the Ostasien fleet had developed a new method of preventing torpedoes from diving too deep. The air strike delivered a devastating blow to the Yellow fleet with surprisingly little loss of planes. The exercise ended up with Black decisive victory.

#Result: Black fleet decisive victory - carriers
#The Black carriers and screen ships formed a concentrated battle group sailing towards the west. The scout bombers managed to locate the Yellow convoys by the morning. A massive attack wave was launched but the pilot missed the position of the convoys. Instead, they discovered the location of the Yellow main forces. The Ostasien torpedo bombers launched their strike with deadly precision. As a result of two waves of aerial attacks, at least three Yellow battelships and two cruisers were judged to have suffered damage, among which one cruiser considered to be hit by three torpedoes was judged sunk. The loss of Black aircrafts was negeligible. The exercise ended up with Black decisive victory.

#Result: Black fleet strategic defeat - carriers
#The Black's advance was quickly located by the Yellow's picket line of submarines. Due to the failure of reconaissance, Black carriers encountered the scout cruisers fleet of the Yellow. Significant damage was laid on carriers during the surface gunfire action, with Hellmuth's carrier eventually judged sunk by torpedo from a Yellow destroyer. The Black fleet had lost the ability to defend the Andaman islands, and the Yellow fleet eventually was able to launch an amphibious operation. The exercise ended up with Black fleet's strategic defeat.



### Misc Events ###
Ostasien.100.t:0 "Большой парад"
Ostasien.100.d:0 "В 09:00 Великий Восточноазиатский флот вышел из гавани [GetNameGEASingapore], чтобы провести масштабные учения за пределами города. Наши авианосные силы продемонстрировали впечатляющие учебные воздушные атаки, дополненные залповыми стрельбами главного калибра линкоров. После завершения манёвров флот взял курс на Циндао, где проведёт новые учения в качестве предупреждения всем, кто осмелится нам угрожать."
Ostasien.100.a:0 "И они правильно делают, что боятся нашей мощи."

