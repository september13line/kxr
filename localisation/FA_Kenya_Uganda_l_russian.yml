KEN_Colonial_Government: "Колониальный протекторат"
KEN_Colonial_Government_desc: "Хотя Кения-Уганда сохранила куда большую независимость от германского влияния, чем её собратья в Нигерии, революция 1925 года и последующее включение в рыхлую структуру Миттельафрики обнажили глубокий раскол между элитой белых поселенцев и коренным населением. Потрясённое борьбой с Мау-Мау, будущее колонии и по сей день остаётся неопределённым."
KEN_Economic_Woes: "Экономические трудности"
KEN_Economic_Woes_desc: "С самого начала восстания Мау-Мау Кения страдает от вялой экономики и практически полного отсутствия инвестиций. Первоочередной задачей любого правительства региона должно стать разрешение этого кризиса."
KEN_Economic_Woes_Two: "Борьба с экономическими трудностями"
KEN_Economic_Woes_Two_desc: "С самого начала восстания Мау-Мау Кения страдает от вялой экономики и практически полного отсутствия инвестиций. Первоочередной задачей любого правительства региона должно стать разрешение этого кризиса."
KEN_Economic_Woes_Three: "Восстановление после экономических трудностей"
KEN_Economic_Woes_Three_desc: "С самого начала восстания Мау-Мау Кения страдает от вялой экономики и практически полного отсутствия инвестиций. Первоочередной задачей любого правительства региона должно стать разрешение этого кризиса."
KEN_Economic_Woes_Four: "Ослабленные экономические трудности"
KEN_Economic_Woes_Four_desc: "С самого начала восстания Мау-Мау Кения страдает от вялой экономики и практически полного отсутствия инвестиций. Первоочередной задачей любого правительства региона должно стать разрешение этого кризиса."
KEN_Economic_Woes_Five: "Оживлённая кенийская экономика"
KEN_Economic_Woes_Five_desc: "С самого начала восстания Мау-Мау Кения страдает от вялой экономики и практически полного отсутствия инвестиций. Первоочередной задачей любого правительства региона должно стать разрешение этого кризиса."
KEN_Economic_Woes_Six: "Новая кенийская экономика"
KEN_Economic_Woes_Six_desc: "Мы наконец освободились от оков экономического кризиса и теперь можем с надеждой смотреть на грядущий приток инвестиций в нашу экономику. Для Кении наступил новый день."
KEN_Maumau: "Партизанская война Мау-Мау"
KEN_Maumau_desc: "Мау-Мау в Кикуйюленде восстают против нас ещё со времён революции 1925 года. Пока нам удаётся удерживать их в горах восточной Кении, однако они продолжают нарушать нашу работу в колонии и подрывать нашу легитимность в глазах местного населения."
KEN_Maumau2: "Добить Мау-Мау"
KEN_Maumau_desc2: "Мы начали кампанию по выкуриванию Мау-Мау из их укрытий в Галла-Ленде. Если приложить достаточно времени и усилий, нам, возможно, удастся покончить с ними раз и навсегда."
