### Events ###
ugken.1.t: "Второе восстание Мау-Мау"
ugken.1.d: "Мау-Мау вновь подняли восстание! Несмотря на все наши усилия по его подавлению, повстанцам удалось захватить несколько ключевых районов и объявить о начале Второго восстания. Во главе их стоит, казалось бы, воскресший Обама, который выглядит ещё безумнее обычного. Правительство должно действовать быстро, иначе мы рискуем пасть под натиском мятежников."
ugken.1.a: "Смерть империалистическим псам!"
ugken.1.b: "О Боже!"

ugken.2.t: "Коллаборационисты побеждают на выборах в Кении-Уганде"
ugken.2.d: "Коллаборационисты одержали победу на выборах в Кении-Уганде, к разочарованию многих. Пока неизвестно, какие планы они готовят для страны, и нам остаётся лишь надеяться, что будущее окажется светлым."
ugken.2.a: "Лучший из возможных исходов."

ugken.3.t: "Правоцентристская коалиция побеждает на выборах в Кении-Уганде"
ugken.3.d: "Правоцентристская коалиция одержала победу на выборах в Кении-Уганде, и празднования по всей стране продолжались до глубокой ночи. Для многих эта победа не стала неожиданностью, а поскольку планы коалиции на будущее страны уже известны, впереди нас, похоже, ждут хорошие времена."
ugken.3.a: "Приемлемый исход."

ugken.4.t: "Левоцентристская коалиция побеждает на выборах в Кении-Уганде"
ugken.4.d: "Вопреки ожиданиям левоцентристская коалиция одержала победу на выборах в Кении-Уганде, и празднования по всей стране продолжались до глубокой ночи. Хотя для многих её успех всё же не оказался полной неожиданностью, а её планы на будущее страны уже известны, впереди, похоже, нас ждут большие перемены."
ugken.4.a: "Прискорбный исход."

ugken.5.t: "Перенести борьбу к горе Кения"
ugken.5.d: "Мы наконец сделали это! После тяжёлой и упорной битвы Мау-Мау капитулировали перед нашими войсками. Несколько ключевых районов были разорены в ходе конфликта, однако теперь, когда правительство окончательно восстановило контроль, ожидания скорого восстановления чрезвычайно высоки."
ugken.5.a: "Смерть KLFA!"

ugken.6.t: "Успокоить предпринимателей"
ugken.6.d: "Мы решили обратиться к различным германским промышленным компаниям в надежде вернуть инвестиции в Кению. Однако в зависимости от выбранного направления мы можем привлечь разные предприятия. Реа Лики призывает обратиться к германским производителям танков, чтобы заложить основу собственных бронетанковых сил, тогда как богатые британские колонисты в Кении предлагают одновременно привлечь германский и канадский бизнес, хотя время, потраченное на ухаживания за обеими сторонами, уменьшит выгоду от каждого отдельного вложения. Разумеется, мы также можем инвестировать в строительную отрасль, учитывая плачевное состояние нашей инфраструктуры после восстания Мау-Мау. Как нам поступить?"
ugken.6.a: "Привлечь производителей бронетехники."
ugken.6.b: "Инвестировать в строительную отрасль."
ugken.6.c: "Обратиться и к германским, и к канадским компаниям."

ugken.7.t: "Военно-промышленный комплекс Найроби"
ugken.7.d: "В современном мире наличие «военно-промышленного комплекса» становится обычным явлением для государств с развитой промышленностью и сильными вооружёнными силами. Если мы хотим последовать их примеру, следует начать создание собственного военно-промышленного комплекса. Разумеется, лучшим местом для этого станет Найроби - наш главный военный центр и важнейший город. Благодаря новому институту мы получим преимущество над соседями."
ugken.7.a: "Почему здесь столько дыма?"

ugken.8.t: "Япония предлагает инвестиции"
ugken.8.d: "В последнее время инвестиции в Кению были минимальны, но к нашим берегам прибыло необычное предложение. Японская империя предлагает вложить средства в Кению, вероятно стремясь одновременно подорвать позиции Германской империи в Восточной Африке и получить прибыль. Япония традиционно не считается одним из крупнейших мировых инвесторов, но кто мы такие, чтобы отказываться от помощи, если они сами готовы её предоставить?"
ugken.8.a: "Примем их помощь!"
ugken.8.b: "Останемся с европейцами..."

ugken.9.t: "Невидимая рука рынка"
ugken.9.d: "Рост наших рынков сопровождается всё более громкими призывами отделить государственное регулирование от промышленности. Крупнейшие предприятия страдают под сапогом чрезмерной бюрократии и высоких налогов, и настало время позволить им заниматься тем, что они умеют лучше всего. Без обременительных ограничений компании смогут свободно конкурировать, как и должно быть, а вместе с ними процветёт и вся страна. Однако для государственного бюджета это может обернуться нехваткой ресурсов."
ugken.9.a: "Цена того стоит!"

ugken.10.t: "Национализировать железные дороги"
ugken.10.d: "Пожалуй, важнейшей отраслью Кении являются железные дороги. Германские и британские инвестиции позволили построить в стране многие километры путей, однако наш народ возмущён сложившимся положением. Люди справедливо напоминают, что именно они, а не иностранные инвесторы, собственными руками строили эти дороги. Более того, компаниям нельзя доверять поддержание движения во время экономических кризисов, что мы уже увидели в начале Чёрного понедельника. Намного безопаснее передать железные дороги под государственный контроль, чтобы они продолжали работать при любых обстоятельствах. Отдадим эти пути народу!"
ugken.10.a: "Больше нами пользоваться не будут!"

ugken.11.t: "Целевые торговые ограничения"
ugken.11.d: "Серьёзную обеспокоенность вызывает то, что иностранные силы эксплуатируют кенийские ресурсы ради собственной выгоды. Антанта, немцы, даже японцы - все они пытались присвоить наше богатство. И хотя Германия формально является нашей колониальной метрополией, её требования зашли слишком далеко. Мы мало что можем противопоставить Берлину, однако должны как можно твёрже заявить право на принадлежащие нам ресурсы. Британцы, в свою очередь, обладают интересами по всей Кении, но вовсе не заботятся о нашем благополучии. Введение против них торговых барьеров могло бы стать ещё одним шагом к экономическому восстановлению. Наконец, японцы, наши необычные новые торговые партнёры, похоже, решили, что могут обращаться с нами так же, как европейцы. Их высокомерие ослепляет их, и мы могли бы преподать им урок дипломатии. Необходимо решить, против кого направить ограничения."
ugken.11.a: "Ударим по немцам!"
ugken.11.b: "Британцы станут хорошей целью!"
ugken.11.c: "Остановить японцев!"

ugken.12.t: "Уроки для армии"
ugken.12.d: "Многие наши люди по-прежнему помнят разрушительные годы Вельткрига, когда война опустошила Европу и даже добралась до Кении. Нам следует изучить главные сражения той войны и извлечь из них как можно больше уроков. Некоторые советники указывают на битву при Вердене, где решающим оказался боевой дух солдата, как на пример ведения современной войны. Другие обращаются к Сомме и считают, что опыт позиционной войны и оборонительной тактики, полученный в этом сражении, следует перенять и Кении. Какую битву мы возьмём за образец?"
ugken.12.a: "Учиться у Вердена."
ugken.12.b: "Учиться у Соммы."

ugken.13.t: "Тактика выжженной земли"
ugken.13.d: "Одним из важнейших уроков восстания Мау-Мау стала эффективность тактики выжженной земли в современной войне. Нынешние войны уже не похожи на прежние: в них участвуют не только армии, но и всё население воюющих государств. Чтобы приспособиться к подобным конфликтам, нам следует взять на вооружение собственную разновидность этой тактики, чтобы в случае вторжения более крупного и сильного противника мы смогли дать ему отпор. Какой подход следует выбрать?"
ugken.13.a: "Мобилизация и изматывание."
ugken.13.b: "Скорость и восстановление."
ugken.13.c: "Лучше сосредоточиться на доктрине."

ugken.14.t: "Разобраться с NKP"
ugken.14.d: "Мы обнаружили доказательства того, что наиболее заметные политики Партии Новой Кении были связаны с мауистами, причём некоторые поддерживали эти контакты вплоть до недавнего времени! Для всей страны это настоящая катастрофа, и с предателями необходимо разобраться. Мы арестуем их лидеров, а тех, кто решит сопротивляться, ждёт куда более мрачная участь..."
ugken.14.a: "Это было необходимо."

ugken.15.t: "Точечные рейды"
ugken.15.d: "После восстания Мау-Мау Боб Лики осознал, что многие их бойцы всё ещё существуют, пусть и лишившись какого-либо настоящего руководства. Однако это мало что меняет, когда бандиты терроризируют наши деревни, нападают на торговцев в городах и даже беспокоят солдат прямо в казармах. Тысячи подобных головорезов всё ещё разгуливают на свободе, а некоторые якобы даже служат в нашей собственной армии. Мы должны решить, где сосредоточить усилия по их искоренению. Что бы мы ни выбрали, придётся приспособиться к нестандартной тактике этих мятежников. Где нанести главный удар?"
ugken.15.a: "Выкурить их из джунглей."
ugken.15.b: "Преследовать их в горах."

ugken.16.t: "Восстановление университетов"
ugken.16.d: "После устранения множества проблемных левых из высших профессий и университетов мы наконец можем приступить к формированию новой интеллектуальной элиты. Эта элита будет верна нашему правительству и, что ещё важнее, единой Кении. С её помощью мы обеспечим стабильность страны на долгие годы!"
ugken.16.a: "Прекрасно!"

ugken.17.t: "Обращение к рабочим"
ugken.17.d: "Настало время разобраться с теми слоями общества, которые доставили нам больше всего проблем во время восстания мауистов. Главными среди них были наши собственные рабочие, чьи жалобы на плохое обращение и несправедливую оплату труда привели многих из них к мятежу. Теперь, когда наша коалиция пришла к власти, необходимо решить судьбу этой толпы. Мы можем увеличить оплату их труда, однако это потребует средств, которых нам сейчас не хватает из-за иссякших германских и других европейских инвестиций. В качестве альтернативы можно привлечь рабочую силу из других колоний или регионов. Если же оба варианта кажутся слишком радикальными, можно сохранить статус-кво, хотя тогда причины восстания так и останутся нерешёнными. Как нам поступить?"
ugken.17.a: "Улучшить оплату труда рабочих."
ugken.17.b: "Заменить их рабочими-иммигрантами."
ugken.17.c: "Сохранить статус-кво."

ugken.18.t: "Общественные гарантии"
ugken.18.d: "Восстание Мау-Мау ясно показало, что народу нельзя позволять свободно организовываться, не рискуя при этом подорвать национальное правительство. Профсоюзы, левые партии и даже собрания или митинги могут вновь расколоть нашу страну, и мы этого не допустим. Поэтому были выдвинуты предложения по борьбе с угрозой. Запретив подобные организации, мы серьёзно ограничим их возможности распространять влияние. Кроме того, германские и британские промышленники предлагают поощрить конкуренцию среди фермеров. Выдавая субсидии тем, кто выполняет определённые квоты или владеет необходимым количеством земли, мы заставим их бороться друг с другом, а не с нашим правительством. Гениальная уловка, хотя, возможно, проще просто запретить организации."
ugken.18.a: "Немного конкуренции ещё никому не вредило..."
ugken.18.b: "Сосредоточимся на уничтожении левых группировок!"

ugken.19.t: "Мечты о социал-демократии"
ugken.19.d: "В отличие от синдикалистов, марксистов и прочих кенийских экстремистов, мы стремимся создать новые левые силы мирными и реформистскими методами. Разумеется, восстание Мау-Мау серьёзно запятнало репутацию всего левого движения в регионе, и уже само наше избрание можно считать чудом. Победить удалось лишь благодаря коалиции левоцентристских партий. Теперь, когда выборы позади, было бы разумно дистанцироваться от мауистов и всех, кто с ними связан. Сделать это можно разными способами. Мы можем обыграть мауистов и других соперников на их же поле, мобилизуя массы ради собственных целей и прибегая к популистской риторике. С другой стороны, можно сотрудничать с более консервативными силами правительства в подавлении мятежников. Это может стоить нам доверия части сторонников, однако необходимо сделать всё возможное, чтобы не допустить нового восстания."
ugken.19.a: "Обратимся напрямую к народу!"
ugken.19.b: "Поможем подавить эти сомнительные элементы!"

ugken.20.t: "Вопрос здравоохранения"
ugken.20.d: "Одним из важнейших обещаний, данных народу перед выборами, было создание новой системы здравоохранения. В Кении подобная система фактически отсутствует, и если мы хотим догнать современный мир, её создание должно стать одной из первоочередных задач. Однако члены Партии Новой Кении расходятся во мнениях относительно подходящей модели. Одни выступают за систему, похожую на германскую, с обязательным медицинским страхованием для определённых категорий работников и малоимущих. Управляться она будет преимущественно государством, хотя точные детали предстоит определить позднее. Провести такую реформу через остальные партии будет трудно, зато она наверняка окажется популярной среди населения. Другой вариант предусматривает медицинское обеспечение только для пожилых, финансируемое за счёт взносов тех, кто впоследствии будет им пользоваться. Люди младшего возраста также смогут приобретать медицинскую страховку у страховых компаний. Такая система выгоднее корпорациям, которые смогут извлекать из неё прибыль, но и для населения она станет заметным улучшением. Если же ни один вариант нас не устраивает, можно сохранить статус-кво и отложить вопрос здравоохранения на будущее. Как нам поступить?"
ugken.20.a: "Государственная система."
ugken.20.b: "Корпоративная система медицинского страхования."
ugken.20.c: "Сохранить статус-кво."

ugken.21.t: "Разобраться с левоцентристской коалицией"
ugken.21.d: "Хотя некоторые обвиняют нас в восстании Мау-Мау, в действительности именно левые в нашем конгрессе годами препятствовали любым решительным действиям и тем самым не позволили нам задушить мауистский мятеж ещё в зародыше. Поэтому этих предателей, которые мешали нам в лучшем случае по наивности, а в худшем из злого умысла, следует наказать. Запретить ли Партию Новой Кении, самую левую из них, или сразу арестовать предателей, чтобы держать их под постоянным надзором?"
ugken.21.a: "Запретить партию!"
ugken.21.b: "Арестовать эту сволочь!"

ugken.22.t: "Определить наше будущее"
ugken.22.d: "Крах Миттельафрики потряс весь континент. Теперь, когда мы обрели относительную свободу как от её влияния, так и от наших германских хозяев, настало время решить, кому мы действительно преданы. Мы можем сохранить верность кайзеру и пообещать поддержку Германии в любых будущих войнах. С другой стороны, в стране проживает множество британских колонистов со времён прежнего британского владычества, и они призывают нас вновь примкнуть к Антанте. Однако громче всех звучат голоса тех, кто требует проложить собственный путь - путь к свободной Кении. Как нам поступить?"
ugken.22.a: "Остаться верными немцам."
ugken.22.b: "Пойти своим путём."
ugken.22.c: "Встать на сторону Антанты."

ugken.23.t: "Странное, но эффективное трио"
ugken.23.d: "Холодный ночной воздух хлестал по лицам англичан. Они лежали в засаде за невысокой каменной стеной, скрытой кустарником и густой растительностью. Пока отважное трио терпеливо ожидало, их добыча быстро приближалась. По соседней тропе брёл отряд повстанцев Мау-Мау, отступавший после провального наступления на Исиоло. Пока остальные Кенийские пограничные силы остались в городе праздновать победу над марксистскими псами выпивкой и дымом, храбрые Джек Черчилль, Дигби Тэтэм-Уортер и Билл Миллин понимали, что дело ещё не закончено, и покинули весёлых товарищей ради погони за врагом. Когда разношёрстная группа тоталистских мятежников приблизилась по тропе, внезапно зазвучала резкая мелодия, эхом разлетаясь по ночной тишине так, будто шла со всех сторон. Пока какофония волынки Миллина продолжалась, «Безумный Джек» Черчилль поднялся из-за стены, натянул длинный лук и пустил стрелу прямо в правый глаз мятежника, возглавлявшего колонну. После точного попадания Мау-Мау в панике закричали и бросились к редким укрытиям, пытаясь подготовить самодельные винтовки. Но прежде чем кто-либо успел сделать первый выстрел, вторая стрела вонзилась в грудь старшего офицера повстанцев, а Безумный Джек и Дигби обрушили на мятежную сволочь один залп за другим. Мау-Мау наконец открыли ответный огонь, однако в панике ни одна пуля не нашла цели в темноте. С молниеносной скоростью и под прикрывающим огнём Дигби Безумный Джек бросился вперёд, выхватил палаш из ножен и атаковал строй Мау-Мау, пока Миллин продолжал играть на своей великолепной волынке «Scotland Forever», заглушая крики и мольбы о пощаде бодрой патриотической мелодией. Когда Безумный Джек ворвался в ряды сепаратистов, Дигби также вступил в рукопашную, используя свой знаменитый зонтик как дубинку против тоталистской сволочи. Когда кровопролитие закончилось, трио стояло залитое кровью, с безумным блеском в глазах, торжествующе приветствуя новую победу. Вытерев кровь с сабель и зонтика и собрав стрелы из тел мёртвых красных, они направились обратно в лагерь, торопясь присоединиться к празднованию товарищей. Выпивка за всех - победа была заслуженной!"
ugken.23.a: "Офицер, идущий в бой без меча, одет неподобающим образом."

ugken.24.t: "Судьба Кении-Уганды"
ugken.24.d: "Кения и Уганда были объединены в хаосе Британской революции, когда два бастиона англосаксонского влияния оказались под германским контролем, но британцам сохранили значительную автономию. После Краха оккупация Миттельафрики завершилась, что вызвало восстание в Уганде, раскололо союз надвое и вынудило нас возвращать эти земли силой оружия. Теперь, когда наша власть восстановлена, необходимо решить их дальнейшую судьбу."
ugken.24.a: "Восстановить Кению-Уганду!"
ugken.24.b: "Разделить эти два ценных, но беспокойных региона."

### Decisions ###
KEN_claim_maf: "Начать восстановление Миттельафрики"
KEN_form_maf: "Новая «Миттельафрика»"
KEN_maumau_actions: "Борьба с повстанцами Мау-Мау"
KEN_maumau_actions_desc: "Мау-Мау в Кикуйюленде восстают против нас ещё со времён революции 1925 года. Пока нам удаётся удерживать их в горах восточной Кении, однако они продолжают нарушать нашу работу в колонии и подрывать нашу легитимность в глазах местного населения."
KEN_maumau_1: "Коллаборационистский подход"
KEN_maumau_1_desc: "Вторя настроениям своих друзей, а возможно, и хозяев в Дар-эс-Саламе и Берлине, Германо-британское восточноафриканское общество стремится нанести по Мау-Мау двойной удар и очистить Кению-Уганду от этой заразы. При поддержке немцев они намерены подкупать, поощрять и, если потребуется, запугивать всех потенциальных сторонников радикалов Мау-Мау. Какой бы ни была экономическая цена и сколько бы жизней это ни стоило, Обама и его свирепая банда должны быть любой ценой изолированы и уничтожены. Склоняя местных жителей на нашу сторону, запугивая их и нарушая деятельность повстанцев, мы заставим Мау-Мау голодать в зарослях вокруг Ваджира."
KEN_maumau_2: "Консервативный подход"
KEN_maumau_2_desc: "Крыло Объединённой партии в составе Кенийской коалиции служит опорой консервативной политики и экономики Кении-Уганды. Хотя с партнёрами по коалиции они согласны далеко не во всём, обе стороны разделяют глубокую любовь к политике laissez-faire. Сочетая приверженность свободному предпринимательству с расплывчатыми популистскими и социально-консервативными взглядами, Объединённая партия намерена провести реформы и предложить новые денежные стимулы слоям, наиболее склонным поддерживать Мау-Мау, прежде всего бедноте, чтобы разрушить социальную опору отвратительных марксистов. На некоторое время это ощутимо нагрузит нашу промышленность, однако выгода для народа и борьбы с врагом слишком велика, чтобы от неё отказаться."
KEN_maumau_3: "Рыночно-либеральный подход"
KEN_maumau_3_desc: "Будучи более ориентированным на свободный рынок, «либеральным» крылом консервативной Кенийской коалиции, Объединённая сельская партия уверена, что знает секрет уничтожения восстания Мау-Мау. Значительная часть бойцов и сторонников повстанцев происходит из разорённых и недовольных фермеров Кенийского нагорья, поэтому рыночные либералы намерены провести целый ряд реформ и постановлений в пользу земледельцев. Это должно заставить фермеров конкурировать друг с другом за ограниченные места в государственных программах и одновременно приблизить их к государству, отдалив от Обамы и его буйной банды. Хотя программа отвлечёт средства и производственные мощности от других проектов, уничтожение этих бродяг остаётся нашим главным приоритетом."
KEN_maumau_4: "Социал-демократический подход"
KEN_maumau_4_desc: "Левое, лейбористское крыло Партии Новой Кении предлагает ослабить тоталистских повстанцев, ударив по их общественной поддержке. Стремясь завоевать доверие местного населения и уменьшить привлекательность демагогических речей Обамы, социал-демократы хотят предложить новые льготы и принять законы в пользу рабочих, чтобы облегчить положение низших слоёв и реформами оттянуть потенциальных сторонников Мау-Мау от их варварского экстремизма. Несколько месяцев экономика будет буксовать, приспосабливаясь к новым уступкам, однако та поддержка, которую лейбористы отнимут у Мау-Мау, стоит этих издержек."
KEN_maumau_5: "Жёсткий подход"
KEN_maumau_5_desc: "Ядовитые выродки из так называемых «Мау-Мау» являются нашей первоочередной проблемой! Выделив дополнительные военные припасы пограничным войскам и санкционировав новые рейды на территорию мятежников, мы обеспечим их уничтожение и сотрём эту тоталистскую заразу с лица Тёмного континента. Усиление военного давления, несомненно, приведёт к большим потерям среди Мау-Мау, но также, вероятно, увеличит сочувствие к ним среди коренного населения, за чем придётся внимательно следить."


### Focuses ###
KEN_theeconomyyoufools: "Экономика, глупцы!"
KEN_theeconomyyoufools_desc: "Восстание Мау-Мау явно нанесло огромный ущерб нашей экономике: мы приближаемся к рецессии, а хозяйственная система находится на грани полного краха. Действовать необходимо быстро, иначе вскоре мы вообще не сможем проводить никакую политику. Подобное бездействие лишит нас возможности помогать населению и, возможно, даже приведёт к падению правительства. Нужно что-то делать!"
KEN_aindustryofarmor: "Бронетанковая промышленность"
KEN_aindustryofarmor_desc: "Реа Лики всегда был убеждённым сторонником танков и моторизованной техники, человеком, опередившим своё время. Теперь, когда мы начинаем воплощать его идеи, было бы разумно наладить и стандартизировать производство танков и моторизованного оборудования, чтобы выпускать их как можно быстрее и эффективнее."
KEN_doctrineofoffence: "Доктрина наступления"
KEN_doctrineofoffence_desc: "Говоря о противнике, Лики всегда утверждал, что врагу нельзя давать передышки и армия должна непрерывно атаковать, лишая его организации и изматывая силы. Тогда неприятель окажется уязвим перед последним сокрушительным ударом, который принесёт нам преимущество. Следует как можно скорее внедрить эту наступательную тактику в армии."
KEN_expandthearmsindustry: "Расширить оружейную промышленность"
KEN_expandthearmsindustry_desc: "Теперь, когда с восстанием мауистов покончено, стало совершенно ясно, что нам необходимо расширить оружейную промышленность, чтобы предотвратить новое восстание подобного масштаба. Мы не знаем, когда произойдёт следующий мятеж коренного населения: сколько бы уступок ему ни делали, кажется, оно никогда не бывает довольно. Вперёд к более безопасному будущему!"
KEN_industrialresearch: "Промышленные исследования"
KEN_industrialresearch_desc: "Европейские колониальные империи смогли покорить мир во многом благодаря своей промышленной мощи. Кения, возможно, никогда не станет империей подобного масштаба, однако если мы хотим процветать как регион, лучшим применением наших ограниченных ресурсов могут стать промышленные исследования. Это позволит заложить основу собственной промышленности и одновременно повысить эффективность производства."
KEN_aharrasingrea: "Манёвренный «Реа»"
KEN_aharrasingrea_desc: "Танк «Реа», названный в честь лидера RVA Реа Лики, является практически идеальной машиной, однако новые доктрины требуют некоторых изменений. Народный танк должен быть одновременно быстрым и дешёвым. Мы превратим «Реа» в машину, пригодную для массового производства и достаточно стремительную для разработанной нами тактики ударов и отхода."
KEN_dealwiththeoligarchicalcollectevists: "Бороться с олигархическими коллективистами"
KEN_dealwiththeoligarchicalcollectevists_desc: "Партия Новой Кении состоит из глупцов, мерзавцев и людей ещё хуже. Это худшая партия в стране, не более чем мауисты из RAA, которые даже не особенно стараются скрываться. Теперь, когда мы одержали победу на недавних выборах, настало время показать им, насколько ошибочной была уверенность в собственной безопасности..."
KEN_dealwiththefanatics: "Разобраться с фанатиками"
KEN_dealwiththefanatics_desc: "Каким-то образом, несмотря на многочисленные попытки уничтожить их, наиболее радикальные элементы Мау-Мау всё ещё существуют. Пока армия методично разбирается с остатками восстания, возник интересный вопрос: какой вообще должна стать армия новой Кении? Какую роль она будет играть в нашем государстве?"
KEN_dealwiththefalseliberals: "Разобраться с лжелибералами"
KEN_dealwiththefalseliberals_desc: "С самого основания Партия Новой Кении лишь создавала проблемы нашей стране. Что ещё хуже, именно она мешала нам бороться с синдикализмом, не говоря уже о появлении движения Мау-Мау. За сознательную некомпетентность она должна ответить. Мы принесём Кении стабильное и компетентное управление."
KEN_thesteelsword: "Стальной меч"
KEN_thesteelsword_desc: "Когда пыль осела, стало ясно, что Германо-британское восточноафриканское общество сохранило власть. DBOAG является прогерманской авторитарной партией, стремящейся улучшить отношения Кении как с Дар-эс-Саламом, так и с Берлином. Теперь её возглавляет молодой, но энергичный экономист Роберт «Боб» Лики, и нам предстоит увидеть, сможет ли его партия избавить страну от последствий нескольких тяжёлых лет прежнего правления."
KEN_agoodeconomist: "Хороший экономист"
KEN_agoodeconomist_desc: "Мы уверены, что под руководством Боба Лики кенийская экономика будет процветать. Совершенно очевидно, что мало кто в Кении понимает законы экономики так же хорошо, как он, а теперь, когда восстание подавлено, мы можем без помех сосредоточиться на этой стороне государственного управления. Вскоре экономика Кении станет сильнейшей среди африканских колоний!"
KEN_reassurecompanies: "Успокоить компании"
KEN_reassurecompanies_desc: "Судя по тому, насколько яростно корпорации выступали против нашего избрания, они явно опасаются правительства Германо-британского восточноафриканского общества. В частности, бизнес боится усиления государственного вмешательства и падения прибыли. Следует убедить компании, что мы готовы сотрудничать и найти способ сохранить или даже увеличить их доходы в этой дикой земле. Имея корпорации на своей стороне, мы станем ещё на шаг ближе к процветающей экономике!"
KEN_digdeeper: "Копать глубже"
KEN_digdeeper_desc: "С появлением новых технологий добычи мы можем проникать всё глубже в землю и эффективнее извлекать ресурсы, необходимые нашей стране для выживания в новом мире. Если мы хотим быть полезны кайзеру в период его экономических трудностей, нельзя полагаться только на традиционно экспортируемое сырьё. Новые виды ресурсов могут также вновь привлечь внимание Дар-эс-Салама..."
KEN_dealwithtradeunions: "Разобраться с профсоюзами"
KEN_dealwithtradeunions_desc: "Настало время определить наше отношение к профсоюзам. После предателей-мауистов именно они являются вторым главным врагом государства. С первого дня нашего прихода к власти эти организации делали всё возможное, чтобы помешать развитию промышленности. Пошлём несколько наших ребят нанести им визит, и, будем надеяться, больше об этих профсоюзах беспокоиться не придётся."
KEN_nairobianmilitaryindustrycomplexnmic: "Военно-промышленный комплекс Найроби"
KEN_nairobianmilitaryindustrycomplexnmic_desc: "Наблюдая за строительством военного завода, Лики пришёл к великолепной идее. У нас уже имеется довольно внушительная оружейная промышленность, однако он считает, что в наших интересах создать в Найроби полноценный военно-промышленный комплекс. Этот институт позволит ещё эффективнее снабжать собственные войска, а если всё пойдёт по плану, даже силы DKG. Кения станет оружейной кузницей Миттельафрики!"
KEN_weareinthegreenlads: "Мы в плюсе, парни"
KEN_weareinthegreenlads_desc: "Похоже, нам удалось превратить слабую и упадочную экономику Кении в чрезвычайно прибыльную. Теперь у нас множество заводов, довольные инвесторы, а что ещё лучше - Кения стала безопасным направлением для поставок оружия. Мы наконец можем уверенно сказать, что экономическое процветание пришло надолго."
KEN_ablackstorm: "Чёрная буря"
KEN_ablackstorm_desc: "Некий человек из России, как ни странно, привнёс в наши политические круги интересную идею. Он предлагает создать организацию под названием «Юнармия», предназначенную для воспитания будущих поколений в духе борьбы с синдикалистской заразой. Она также поможет укрепить лояльность населения и держать беспокойные слои под контролем. Лики считает, что нам стоит ввести нечто подобное."
KEN_cuttheirheads: "Отрубить им головы"
KEN_cuttheirheads_desc: "Эти левые предатели продолжают показываться на глаза и открыто бросать вызов правительству, и мы больше не намерены это терпеть. Наконец настало время отправить чернорубашечников, которые покажут левым цену неповиновения! Мы раз и навсегда обезглавим этот мятеж."
KEN_hunttheirtroops: "Охота на их отряды"
KEN_hunttheirtroops_desc: "От бескрайних сельскохозяйственных угодий до самых удалённых лесов коллективисты продолжают свою войну. Им удалось нарушить снабжение продовольствием и, что ещё важнее, работу промышленности. Настало время обнаружить их скрытые базы и покончить с ними. Если лишить повстанцев армии, как они смогут продолжать борьбу?"
KEN_collectivistswhatcollectivists: "Коллективисты? Какие коллективисты?"
KEN_collectivistswhatcollectivists_desc: "Ура, дело сделано! Благодаря доблестной работе чернорубашечников и нашей славной армии мы наконец уничтожили коллективистов и очистили землю от их грязных рук. Мы заслужили доверие немцев и теперь можем рассчитывать на инвестиции того уровня, которым пользовались прежде."
KEN_grabthecollectivists: "Схватить коллективистов"
KEN_grabthecollectivists_desc: "Даже теперь, когда большинство отрядов коллективистов уничтожено или иным образом обезврежено, среди граждан, особенно студентов, остаётся немало сочувствующих их делу. Настало время послать чернорубашечников за этими предателями мысли и перевоспитать их, чтобы они поняли, насколько пагубен олигархический коллективизм для нашей страны!"
KEN_lessonsfromnairobi: "Уроки Найроби"
KEN_lessonsfromnairobi_desc: "В битве за Найроби мы вопреки всему сумели победить туземцев, используя тактику времён Вельткрига. Следовательно, старые методы всё ещё работают, по крайней мере в Кении, и нам следует совершенствовать их, а не полностью отказываться ради какой-то новой доктрины."
KEN_reasdream: "Мечта Реа"
KEN_reasdream_desc: "Сэр Реа Лики, представитель RVA в Конгрессе и лидер KUP, всегда утверждал, что будущее войны принадлежит грузовикам и танкам. Его военные способности пользуются широким уважением, и наша администрация склонна считать, что он прав. Следует прислушаться к его словам и вложиться в механизированные силы."
KEN_adefensiverea: "Оборонительный «Реа»"
KEN_adefensiverea_desc: "Танк «Реа», названный в честь лидера RVA Реа Лики, является практически идеальной машиной, однако новые доктрины требуют некоторых изменений. Мы обеспечим ему возможность дополнять оборонительный характер нашей армии и поддерживать наших ребят в окопах столько, сколько потребуется. Мы забросаем противника снарядами, пока он не сдастся!"
KEN_aoffensiverea: "Наступательный «Реа»"
KEN_aoffensiverea_desc: "Танк «Реа», названный в честь лидера RVA Реа Лики, является практически идеальной машиной, однако новые доктрины требуют некоторых изменений. Реа всегда представлял быстрый и мощный танк, прорывающий вражеские линии и разбивающий оборону вдребезги. Именно такой машиной мы и сделаем «Реа» - неудержимой наступательной силой."
KEN_kenyianguards: "Кенийская гвардия"
KEN_kenyianguards_desc: "Хотя идея Кенийской гвардии принадлежит не Реа Лики, её стоит рассмотреть. Предлагается создать отряды коммандос, способные не только вести разведку, но и изматывать противника и поддерживать наши войска при выполнении задач. Будут ли они успешны - другой вопрос, однако сама идея заслуживает испытания."
KEN_expandtheofficercorp: "Расширить офицерский корпус"
KEN_expandtheofficercorp_desc: "Господа, вышедшие победителями из Вельткрига и восстания Мау-Мау, возможно, являются лучшими и наиболее опытными людьми в нашем распоряжении. Однако это не означает, что лишь им следует позволять командовать армией. Однажды они будут лежать в могилах, и вместе с ними исчезнет весь накопленный опыт. Чтобы этого избежать, необходимо расширить офицерский корпус за счёт нового поколения и обеспечить армии компетентное руководство на долгие годы."
KEN_preparetheartillery: "Подготовить артиллерию"
KEN_preparetheartillery_desc: "Хотя наши солдаты защищены окопами, совершенно ясно, что нам требуется средство против вражеских обстрелов, способных сделать сами окопы практически бесполезными. А что может быть лучше против чужой артиллерии, чем наша собственная, желательно ещё более мощная?"
KEN_lessonsfromverdunandsomme: "Уроки Соммы и Вердена"
KEN_lessonsfromverdunandsomme_desc: "Битвы при Вердене и на Сомме преподали нам важные уроки о современной войне. Верден показал, как даже в самых ужасных условиях простая воля и решимость солдата способны удерживать позицию столько, сколько потребуется, а Сомма продемонстрировала, как не следует проводить наступление в условиях позиционной войны. Мы обязаны изучить эти сражения и использовать полученный опыт в собственных военных доктринах."
KEN_armyradio: "Армейские радиостанции"
KEN_armyradio_desc: "Реа Лики когда-то предложил внедрить радиосвязь в дивизиях, полках и танках, считая, что она позволит повысить организованность частей даже в разгар боя. Нам следует начать производство военных радиостанций и снабдить ими армию везде, где возможно, чтобы связь оставалась эффективной, а войска могли быстрее приспосабливаться к постоянно меняющимся условиям войны."
KEN_thekaiserspartyofkenya: "Кения кайзера"
KEN_thekaiserspartyofkenya_desc: "Несмотря на влияние британских колонистов, Кения прочно закрепилась в германской сфере. Теперь кайзер направил своих представителей оценить наши успехи, и мы покажем им, что являемся блистательным примером эффективного германского управления."
KEN_loyaltyquestions: "Вопрос верности"
KEN_loyaltyquestions_desc: "После восстания Мау-Мау и общего хаоса в Миттельафрике правительство в Дар-эс-Саламе получало противоречивые сигналы относительно верности Кении. Теперь, когда порядок наконец восстановлен, можно взглянуть на соседей и германских хозяев и, возможно, пересмотреть прежние обязательства. Не настало ли время сбросить германское ярмо?"
KEN_kenyianvolunteercorp: "Кенийский добровольческий корпус"
KEN_kenyianvolunteercorp_desc: "Мы внимательно изучили британскую и германскую армии и решили, как лучше всего перенять их опыт. Подобно старому Британскому добровольческому корпусу, Кения также создаст такие формирования. Наш добровольческий корпус обеспечит достаточное количество людей для борьбы с коварными врагами великого государства Кения."
KEN_dealwiththeinternationalists: "Разобраться с интернационалистами"
KEN_dealwiththeinternationalists_desc: "Совершенно очевидно, что Интернационал поддерживает некоторые наиболее враждебные элементы нашего общества. В частности, он помогал левым мятежам вроде восстания Мау-Мау и вообще любому сопротивлению, готовому принять его помощь. Синдикалисты лишь мешают нашему новому левому движению, подрывая легитимность режима и вдохновляя экстремистов на восстания. Теперь, когда мятежи подавлены, настало время разобраться с этими внешними подстрекателями."
KEN_breakthecommune: "Сломить синдикалистов"
KEN_breakthecommune_desc: "После того как их европейские поставщики были отрезаны, кенийские левые лишились ресурсов для продолжения борьбы против нашего правительства. Настало время загнать их в последние опорные пункты и раз и навсегда арестовать или иным образом устранить."
KEN_nationalizationofcivicindustry: "Национализировать гражданскую промышленность"
KEN_nationalizationofcivicindustry_desc: "В рамках нашего кейнсианского экономического плана началась национализация терпящих крах компаний. В конце концов, зачем позволять жадным корпорациям повторять те же действия, которые и привели нас к экономическому кризису? Национализированная промышленность обеспечит государству больший контроль над экономикой и, возможно, позволит укрыться от глобального хаоса Чёрного понедельника."
KEN_heartheirpleads: "Услышать их мольбы"
KEN_heartheirpleads_desc: "Народ Кении умоляет нас о помощи - и он её получит! Первым шагом станет улучшение инфраструктуры. Программа создаст тысячи рабочих мест для страдающих кенийцев и одновременно принесёт долгосрочную пользу, обеспечив более удобный доступ к торговым центрам. Мы вытащим Кению с края пропасти и создадим процветающую экономику на долгие годы."
KEN_bringeuropeaninvestersback: "Вернуть европейских инвесторов"
KEN_bringeuropeaninvestersback_desc:0 "Всем наблюдателям очевидно, что восстание Мау-Мау отпугнуло европейских инвесторов от Кении. Поток инвестиций практически иссяк, и в результате наша экономика оказалась парализована. Однако теперь, когда нам удалось восстановить хотя бы подобие стабильности, мы докажем им, что бояться больше нечего. Кения вновь встаёт на ноги, и наши рынки снова оживут."
KEN_fixthebarrier: "Исправить торговые барьеры"
KEN_fixthebarrier_desc: "Многие государства, инвестировавшие в нас, использовали наш неофициальный колониальный статус, чтобы эксплуатировать земли и богатеть за наш счёт. Этого больше нельзя допускать. Мы по-прежнему позволим иностранным инвесторам работать здесь, но теперь они будут подчиняться нашим законам и уважать их, нравится им это или нет."
KEN_adealwiththeworkers: "Сделка с рабочими"
KEN_adealwiththeworkers_desc: "Фабрика ничто без своих рабочих, и они понимают это не хуже нас. С момента нашего прихода к власти они с надеждой следят за правительством, ожидая выполнения обещаний об улучшении условий труда. Мы докажем им, что не желаем зла и, более того, полностью готовы сотрудничать."
KEN_tradeunionconcession: "Уступки профсоюзам"
KEN_tradeunionconcession_desc: "Становится ясно, что наших рабочих не так просто удовлетворить. Мы уже заключили с ними соглашение, но они продолжают требовать новых уступок от правительства. Эту проблему можно решить, предоставив некоторые уступки именно профсоюзам. Так рабочие будут уверены, что их интересы представлены, а капиталисты не станут в панике кричать, будто в Кению пришли синдикалисты."
KEN_thegoldeneconomy: "Золотая экономика"
KEN_thegoldeneconomy_desc: "Теперь, когда гражданская экономика снова работает, а рабочие удовлетворены своим положением, страна вступила в новый золотой век. Похоже, это процветание пришло надолго, и впервые за многие годы мы можем уверенно сказать: Кения переживает настоящий подъём."
KEN_rulebritannia: "Правь, Британия!"
KEN_rulebritannia_desc: "К чёрту Берлин! Когда-то мы были британской колонией, и по сей день вспоминаем те времена с теплотой. Теперь, когда германское ярмо сброшено, мы вновь станем британской колонией! Гордо запоём «Правь, Британия!», ибо Империя жива!"
KEN_freehealtcare: "Бесплатное здравоохранение"
KEN_freehealtcare_desc: "Одной из главных проблем страны остаётся довольно неэффективная субсидируемая система здравоохранения. Левые группы Кении годами добивались введения той или иной формы всеобщего медицинского обеспечения, однако колониальный статус позволял игнорировать эти требования. Теперь, когда власть принадлежит нам, возможно, настало время создать бесплатную систему здравоохранения ради благополучия народа."
KEN_freeeducation: "Бесплатное образование"
KEN_freeeducation_desc: "Одним из соглашений «Страстной пятницы» было введение нескольких социальных законов, однако ни один из них не касался образования. «Новый курс» уже предусматривал реформу кенийского образования, а с поддержкой либералов она теперь практически наверняка будет принята. Пора преодолеть интеллектуальное отставание и начать кампанию бесплатного образования."
KEN_thekenyandream: "Кенийская мечта"
KEN_thekenyandream_desc: "Дом для каждой семьи, школа для наших детей и доступ к медицинской помощи для всех. Объединив всё это, мы дали народу возможность воплотить кенийскую мечту. Возможно, это стоило денег и даже крови, но теперь будущие поколения кенийцев смогут жить в мире и процветании."
KEN_apopularwar: "Народная война"
KEN_apopularwar_desc: "В прошлом войны в Африке велись небольшими колониальными силами против многочисленных, но значительно уступающих им туземных войск. Больше этого не будет! С сегодняшнего дня мы будем вести народные войны, в которых всё население так или иначе участвует в борьбе. Лучших мужчин из деревень мы призовём в армию, и вся Африка содрогнётся перед нашей мощью!"
KEN_harassandambush: "Изматывать и устраивать засады"
KEN_harassandambush_desc: "Бескрайние саванны Кении, перемежающиеся лесами и даже джунглями, идеально подходят для нападений и засад. Эти приёмы служили нашим предкам и послужат нам. Подобно льву в высокой траве, мы будем выслеживать добычу, а когда она меньше всего этого ожидает - нанесём удар!"
KEN_hitemwheretheyareweak: "Бить по больному месту!"
KEN_hitemwheretheyareweak_desc: "У любой армии есть слабости. Подобно тому как Мгаи сумели тайно провести войска в Найроби, воспользовавшись прорехами в нашей обороне, слабые места существуют и у армий захватчиков. Если мы обнаружим их и нанесём сокрушительный удар по мягкому подбрюшью, враг непременно сломается, а независимость нашей земли будет обеспечена на долгие годы."
KEN_salttheland: "Засолить землю"
KEN_salttheland_desc: "Если враг придёт за Кенией, он не найдёт здесь ничего, кроме пепла и соли. Кения куда больше, чем может показаться на первый взгляд, и в её бескрайних саваннах легко потеряться. Используя тактику выжженной земли, мы лишим противника любой передышки и постепенно истощим его. Когда он окажется наиболее слаб, наступит время для удара."
KEN_apeoplesarmy: "Народная армия"
KEN_apeoplesarmy_desc: "Кения ещё ни разу не вела настоящую войну самостоятельно. Нам удалось победить лишь восстание Мау-Мау, и причиной тому были слабое командование и отсталые технологии повстанцев, а не какое-либо наше военное превосходство. Мечта Реа Лики осуществима лишь при наличии промышленности германского или британского масштаба, что практически невозможно. Однако у нас есть земля и народ, и именно их мы используем в будущих войнах. Народ и партизанская борьба позволят отбросить любого захватчика, а однажды, быть может, и перенести войну на его территорию..."
KEN_anewdeal: "Новый курс"
KEN_anewdeal_desc: "Выборы завершились, и победителем, похоже, стала Партия Новой Кении. Добившись политического триумфа и поставив во главе региона Найджела Лики, партия теперь намерена воплотить своё видение «Нового курса» для Кении."
KEN_anewcenter: "Новый центр"
KEN_anewcenter_desc: "Недавний хаос мауистского восстания против колониального правительства породил множество вопросов об эффективности действующей власти. В первую очередь они касаются DBOAG, вернее того, что от неё осталось, и её дальнейшей судьбы. Разумеется, официально существовать ей позволят, однако партия оставила после себя очевидный беспорядок, и прежде всего нам предстоит устранить самый крупный из них - экономический."
KEN_anewleft: "Новые левые"
KEN_anewleft_desc: "После прихода к власти социал-демократического правительства в Кении возник вопрос о судьбе наиболее радикальных левых сил. Хотя мы сами считаем себя левыми, мы не синдикалисты, и дальнейшее дистанцирование от радикалов может повысить легитимность правительства. Все, кто стремится к революции или пытается посеять хаос в Кении, будут остановлены тем или иным способом..."
KEN_hunttheagrarianist: "Охота на аграриев"
KEN_hunttheagrarianist_desc: "Аграрный социализм является одной из самых популярных форм левой идеологии в Кении и особенно распространён среди сельского населения и жителей некоторых крупных деревень. После подавления восстания большинство его сторонников отказались от этих убеждений, но оставшихся аграрных социалистов необходимо разыскать и обезвредить, пока они вновь не подняли мятеж."
KEN_contactthechinese: "Связаться с китайцами"
KEN_contactthechinese_desc: "Китай обладает богатством ресурсов, с которым мало кто в мире способен сравниться. Он, возможно, отстаёт от Запада и страдает от политической раздробленности и коррупции, однако его экономический потенциал нельзя недооценивать. Установление торговых отношений с регионом принесёт нам огромную пользу, и следует начать работу в этом направлении."
KEN_apopularkenya: "Народная Кения"
KEN_apopularkenya_desc: "Право управлять нам дал кенийский народ, и мы никогда об этом не забудем. Мы живём и правим ради Кении, и регион вступает в новую эпоху своей истории, когда люди получают заслуженные права и могут спокойно засыпать, зная, что завтра на их столе будет еда."
KEN_anationalistkenya: "Националистическая Кения"
KEN_anationalistkenya_desc: "Кения всё ещё молода по сравнению с большинством стран мира, однако уже обладает сильным национальным самосознанием. С помощью Германии мы превратим её в одну из самых могущественных, если не самую могущественную колонию во всей Африке. Слава Кении и слава кайзеру!"
KEN_afreekenya: "Свободная Кения"
KEN_afreekenya_desc: "Нам не нужны лживые обещания Берлина или Оттавы. Наш народ устал от колониального господства, и теперь впервые в истории мы наконец будем править сами! Если потребуется, мы будем сражаться за свободу и отдадим всё, чтобы никогда больше не оказаться под властью чужой метрополии."
KEN_aunitedfront: "Единый фронт"
KEN_aunitedfront_desc: "Несмотря на восстание Мау-Мау и почти полный крах, вызванный внутренней борьбой, Объединённая партия и Объединённая сельская партия выстояли. Получив новый мандат на управление страной, Реа Лики намерен так или иначе исправить хаос, в котором оказалась Кения."
KEN_aneweconomy: "Новая экономика"
KEN_aneweconomy_desc: "После хаоса мауистского восстания свободная экономика Кении рухнула. Компании одна за другой покидали страну, инвестиции иссякли, а хозяйство казалось таким же разрушенным, как и правительство. Теперь Реа Лики предлагает новую экономику - благоприятную для инвестиций и открытую для торговли с кем угодно. Благодаря ей мы достигнем невиданного прежде процветания."
KEN_theeuropeancomesback: "Возвращение европейцев"
KEN_theeuropeancomesback_desc: "Очевидно, что прежние европейские инвестиции не дали нам ресурсов, необходимых для подавления крупного восстания. Если бы не способности Реа Лики, мы потерпели бы полный крах как колония. Следовательно, необходимо добиться значительно большего объёма вложений. Сможем ли мы привлечь достаточно интереса, чтобы по-настоящему процветать?"
KEN_bringmoreinvestors: "Привлечь больше инвесторов"
KEN_bringmoreinvestors_desc: "Рынок не делает различий, так почему должны делать их мы? Вместо прежних привилегий для германских промышленников мы откроем колонию для инвестиций со всего мира и никому не откажем. Любое государство, желающее вложиться в наше славное будущее, является достойным торговым партнёром. Так будет и в Кении."
KEN_cultivateacapitalistsociety: "Взрастить капиталистическое общество"
KEN_cultivateacapitalistsociety_desc: "Наше общество пока не воплощает принципы капитализма в той степени, которая позволила бы нам извлекать из него настоящую выгоду. Вместо этого мы страдали от колониальной эксплуатации, пока старые и могущественные державы расхищали наши наиболее ценные ресурсы. Хватит! Теперь капиталистами станем мы сами и построим общество, где самые талантливые кенийцы смогут подняться на вершину и обрести богатство, о котором прежде не могли даже мечтать."
KEN_thecapitalistdream: "Капиталистическая мечта"
KEN_thecapitalistdream_desc: "Мы наконец создали в Кении капиталистическое общество! После тяжёлого труда, пота и ожесточённой внутренней борьбы возник строй, в котором наиболее талантливые среди нас способны подняться на вершину и стать одними из богатейших людей континента. Кения действительно превращается в капиталистическую рыночную экономику, а за последние месяцы наши прибыли резко выросли. Будем надеяться, что процветание продолжит расти и однажды мы сможем соперничать с самими колонизаторами!"
KEN_rebelliousworker: "Мятежный рабочий"
KEN_rebelliousworker_desc: "Кения годами остаётся очагом синдикалистской активности, вдохновлённой революцией у наших прежних британских хозяев. Ни для кого не секрет, что с местными рабочими обращаются плохо, однако они не понимают одного: иначе сейчас быть не может. У нас недостаточно ресурсов, чтобы платить каждому столько, чтобы он жил в роскоши, и если они хотят однажды достичь такого общества, придётся показать им, что ради этого нужно работать. А тех, кто восстаёт, ждёт уничтожение..."
KEN_exterminatetheplague: "Искоренить заразу"
KEN_exterminatetheplague_desc: "Единственное влияние, ещё хуже аграризма или синдикализма, - марксизм. Именно эта идеология вдохновила восстание Мау-Мау и продолжает подрывать наше правительство до сегодняшнего дня. Если мы хотим вернуть Кении стабильность, необходимо задушить эти элементы, иначе однажды они сами одолеют нас."
KEN_solidifycorporatecontrol: "Укрепить власть корпораций"
KEN_solidifycorporatecontrol_desc: "Пока мы охотимся на последних мятежных рабочих, давно настало время обратиться к корпорациям, на которые они прежде работали. Компании использовали восстание как повод потребовать больше полномочий, утверждая, что им не хватает ресурсов для самостоятельного подавления подобных мятежей. Мы вынуждены согласиться - корпорации получат то, что им причитается!"
KEN_acorporateland: "Корпоративная земля"
KEN_acorporateland_desc: "После долгой борьбы мы преодолели социальный кризис среди рабочих, а корпорации, на которые они трудятся, стали сильнее, чем когда-либо. Если новое восстание когда-нибудь начнётся, компании задушат его ещё в зародыше, а мы покажем всему миру, что лучшего места для ведения бизнеса в Африке не существует."
KEN_acorporatekenya: "Корпоративная Кения"
KEN_acorporatekenya_desc: "Кения, возможно, отстаёт от стран Европы и Северной Америки, однако мы тщательно выстроили капиталистическую экономику, которая позволит обойти конкурентов в Африке и стать самостоятельной промышленной державой. Бизнесу и промышленности в Кении больше никто не бросит вызов!"
KEN_letitfloat: "Отпустить курс"
KEN_letitfloat_desc: "Кенийский фунт был привязан к миттельафриканской рейхсмарке ещё со времён основания колонии десятилетия назад. Однако после Чёрного понедельника эта валюта фактически мертва, и наилучшим решением может стать переход к свободному курсу кенийского фунта. Это будет ещё одним шагом на пути восстановления экономики."
KEN_thepacifickraken: "Тихоокеанский кракен"
KEN_thepacifickraken_desc: "Японская Сфера сопроцветания всё шире распространяет влияние по Азии и за её пределами, превращаясь в самостоятельную великую державу. Её щупальца добрались даже до наших берегов, и японцы предлагают стать одним из крупнейших торговых партнёров Кении. Они соперничают как с Германией, так и с Канадой, однако мы обещали сотрудничать с любой страной ради лучшего будущего Кении, поэтому в принципе должны принять предложение. Согласимся ли мы на их инвестиции?"
KEN_themarketliberalideasexpand: "Расцвет экономики невмешательства"
KEN_themarketliberalideasexpand_desc: "Её можно заметить в деревнях и на улицах, хотя сама она остаётся невидимой. Невидимая рука рынка уже позволяла Кении процветать раньше и сделает это вновь. Пусть саму «руку» никто не видит, народ обязательно почувствует последствия корпоративного процветания, которым теперь наслаждается Кения. Идеи капитализма всё шире распространяются и укореняются в стране, а вместе с ними растёт и сама капиталистическая мечта."
KEN_corporatemilitias: "Корпоративные ополчения"
KEN_corporatemilitias_desc: "Будущее Кении принадлежит частным вооружённым формированиям, с помощью которых корпорации смогут подавлять восстания ещё до того, как те станут слишком сильны для государства. Подобная тактика уже доказала эффективность в капиталистических странах по всему миру, и здесь она также принесёт успех. Корпоративные ополчения будут служить всем истинным кенийцам через службу компаниям, а вся Кения в результате станет процветать. Однако вместе с этим мы рискуем чрезмерно усилить корпорации и лишиться части людских ресурсов для национальной армии..."
