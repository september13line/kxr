### Leaders ###
POLITICS_BARATA_AMA_DESC: "Жоаким де Магальяйнш Кардозу Барата родился в 1888 году в Белене и десятилетиями с отличием служил в бразильской армии. Однако он более известен своим многократным пребыванием на посту администратора штата, так как он является лидером местной военной фракции в том штате, которая поддерживала Сан-Паулу в межштатной войне. Его сроки полномочий обычно были стабильными, даже в год выборов он часто оказывался в противоречии с другими крупными политическими фракциями и действиями, такими как его главные соперники из семьи Содре, которые неоднократно обвиняли Барату в фальсификации выборов, но политический союз с Амазонасом и другими северными штатами должен дать ему некоторое пространство для манёвра. Как президент Пара, Барата также является главнокомандующим, и его влияние на недавно сформированные вооружённые силы не следует недооценивать, поскольку он уделял пристальное внимание формированию этой военной силы. Столь долго борясь за сохранение политического контроля над регионом, Барата наконец добился того, что Пара марширует под его барабан."
POLITICS_LAURO_SODRE_HOS_AMA_DESC: "Лауро Нинья Содре-и-Силва оставил политику позади после межштатной войны, но нынешнее положение Пара как независимой нации вернуло его на передний план, на этот раз в качестве главы государства, а не просто губернатора. Родившийся в Белене в 1858 году, старик - не просто влиятельный и опытный политик, но, возможно, и самый старый действующий политик в Пара. Также военный, как и многие руководители в Бразилии во времена старой республики, он принимал участие в Восстании вакцины в Рио, будучи при этом арестован, и после этого продолжил свою карьеру в качестве многократного представителя своего штата в этом городе. Хотя его годы, возможно, подходят к концу, он готовит политическую систему новой республики к тому, чтобы она оставалась в русле его семьи и союзников, одновременно балансируя между иностранными требованиями и восстанавливая военный ущерб жизненно важной портовой инфраструктуре по всем штатам, над которыми он теперь правит."
POLITICS_ANTONIO_FACIOLA_AMA_DESC: "Истинный капитан старой гвардии, политическая карьера Антониу ди Алмейды Фасиолы началась ещё в 1880-х годах, и с тех пор он не покидал игру, даже в своём преклонном возрасте. Хотя некоторые члены оппозиции утверждают, что наличие президента с «одной ногой в могиле» опасно для демократии Пары, многократному президенту штата Пара в его политической власти нельзя отказать, даже если его тело подводит его всё чаще и чаще за последние несколько лет, как и любого человека в возрасте за восемьдесят. Хотя он обладает значительным влиянием на своей бывшей политической арене, «президент-старик» не имеет сильного влияния в Амазонасе или на более мелких территориях и может столкнуться с проблемами в реальном управлении разрозненными политическими фракциями нации; поскольку его позиция первого президента в значительной степени основана на иностранном назначении, а не на его собственных усилиях."
POLITICS_ALVARO_BOTELHO_MAIA_AMA_DESC: "Родившийся на берегу Риу-Мадейра на окраине города Умайта, Алвару Ботелью Майя ещё молодым переехал в столицу провинции Манаус, чтобы закончить учёбу, и быстро оказался вовлечённым в местные газеты, а позже занялся политикой, но в свободное время он также поэт и писатель. Хотя его карьера до сих пор представляла собой череду относительно неважных назначенных должностей на более мелких территориях упразднённого бразильского правительства, его растущее разочарование из-за отсутствия власти для надлежащего реформирования северных регионов страны было огромным ещё до войны, и теперь он видит себя в идеальном положении для модернизации всё ещё молодой экономики, образования и политической инфраструктуры Амазонаса. Однако, будучи одновременно реформатором и не принадлежа к традиционной политической семье, он сталкивается с влиятельными землевладельцами и каучуковыми баронами, и ему придётся приложить значительные усилия, чтобы провести эти изменения даже при иностранной поддержке."
POLITICS_EFIGENIO_SALE_AMAS_DESC: "Уроженец города Серро в Минас-Жерайсе, Эфижениу Феррейра ди Салис был у руля штата Амазонас в начале межштатной войны, и когда новости о войне достигли севера, он предпочёл выжидательную позицию, что привело к его отстранению от должности после того, как повстанцы успешно свергли президента Бернардиса в том случае; с тех пор он занимал относительно незначительные должности в качестве представителя и работал учителем, его основной работой на протяжении большей части жизни. Однако результат войны, в которой оказалась Бразилия, заставил его политическую судьбу сделать ещё один неожиданный поворот, поскольку теперь он является президентом и главой государства недавно основанной республики Амазонас - позиция одновременно могущественная и шаткая, так как его влияние в Белене и за пределами Амазонаса в целом severely ограничено, особенно после стольких лет вне высшего эшелона большой игры. Однако его опыт, союзники в Манаусе и иностранная поддержка почти гарантируют, что в любых спорных вопросах его голос будет последним услышанным и единственным, к которому действительно прислушаются в молодой республике."
POLITICS_LANDRY_SALES_AMA_DESC: "Уроженец Акарау, родившийся в 1904 году, Ландри Салис Гонсалвиш начал свою карьеру как военный офицер и участвовал в восстаниях ещё в Старой республике, а также взаимодействовал с несколькими ключевыми фигурами тенентистских восстаний, которые должны были последовать. Хотя он заигрывал с AIB во время подъёма этой партии, с тех пор он принял более классические либеральные позиции в ущерб милитаристской политической мысли и был избран президентом при большой поддержке коллег-офицеров во время кампании. Его взгляды на политику также изменились с годами, и он больше выступает за деэскалацию напряжённости и в целом менее активную роль действующих офицеров в политических делах. Хотя он не является уроженцем северных земель, он провёл большую часть последнего десятилетия на административных постах в Пара и поэтому выбрал его своей надеждой на данный момент, одновременно поддерживая хорошие отношения с республикой своего родного места на западе. Перед ним стоит большая задача, так как и без того скудная инфраструктура этих приречных земель может восстанавливаться десятилетиями, но Ландри привык как к суровой жизни в казармах, так и к постоянно меняющимся политическим симпатиям."
POLITICS_AMA_POMAR_DESC: "Педру Вентура Фелипи ди Араужу Помар, несомненно, провёл неортодоксальное детство, переехав в Нью-Йорк из своего родного штата Пара в возрасте 5 лет, прожив там два года, прежде чем вернуться в свой маленький родной город Обидус, а затем переехать в столицу штата Белен. Он начал политическую деятельность в возрасте тринадцати лет, весьма публично поддерживая дело повстанцев в межштатной войне, но позже, по достижении совершеннолетия, он сдвигался всё дальше и дальше влево, став законченным социалистом к 20 годам; эти молодые годы он провёл, изучая медицину и по совместительству играя в футбол за «Клубе ду Ремо». Спокойный и собранный человек, Педру часто остаётся молчаливым на политических собраниях, лишь изредка вставляя слово в редких случаях, и обычно имеет позитивный и располагающий к себе нрав, что привело к его относительной популярности среди членов профсоюзов, несмотря на его несколько молодой возраст; теперь он столкнулся с огромной задачей руководства нацией, которая так же молода, как и он, и сталкивается с огромными проблемами инфраструктуры и бюджета. Хотя эти проблемы, безусловно, вызывают беспокойство, он верит, что при поддержке народа социализм может процветать даже здесь, на берегах бассейна Амазонки."
POLITICS_CLAUDIO_SANTORO_AMA_DESC: "Клаудиу Франку ди Са Сантору родился в Манаусе в 1919 году и является чрезвычайно известным музыкантом и композитором. Его карьера в музыке началась, когда он был ещё молод, но его участие в Интернационале столь же давнее, так как он часто обнаруживал, что его коллеги участвуют в синдикалистских и левых организациях с самого раннего возраста. Его назначение на пост первого главы государства его новой страны является признанием его карьеры в обеих этих областях, но также и огромной ответственностью, так как приречная республика должна восстановить огромный военный ущерб, как административный, так и инфраструктурный, одновременно имея дело с могущественными и алчными землевладельцами, которые видят в Клаудиу иностранного коллаборациониста и не остановятся ни перед чем, чтобы держать людей в невежестве и расхищать богатства величайшего леса мира. Противостояние с этими оппонентами может оказаться сложным делом для молодого социалиста, которого всё ещё считают чрезмерно надеющимся и наивным, и, возможно, потребует иностранного вмешательства."
POLITICS_AMA_JOAO_AMAZONAS_DESC: "Родившийся в Белене в 1919 году, Жуан Амазонас ди Соуза Педрозу начал заниматься политикой и социалистическим движением относительно недавно, в 1932 году, во время одного из первых действий недавно основанных Демократических левых в его родном городе. Будучи изначально социал-демократом, с годами он сдвинулся дальше влево, разочаровавшись во власти, которую землевладельцы имели над демократическими институтами, и становясь всё более и более циничным в отношении способности демократии принести реальные изменения в его родной край. Теперь он находится в положении, когда может сделать гораздо больше после освобождения Бразилии, будучи главой государства и председателем своей родины, и принести современность всему Пара; и на этот раз землевладельцы находятся во власти пролетариата, а не наоборот. Со временем, надеется он, земли вокруг реки, в честь которой он был назван, станут известны как сияющий пример социалистического успеха и процветания."

### Ideas ###
AMA_riverland: "Приречье"
AMA_riverland_desc: "Гран-Пара медленно, но верно работает над установлением полного контроля над отдалёнными землями в бассейне Амазонки."
AMA_pare: "Приречная армия"
AMA_pare_desc: "Армия Гран-Пара прошла через ряд преобразующих структурных реформ. Её боеспособность, особенно в суровых условиях Амазонии, значительно возросла."
AMA_no_fist_contact: "Политика позитивного контакта"
AMA_no_fist_contact_desc: "Амазонас установил политику контактов с коренным населением, направленную на минимизацию разрушения коренных народов и их культуры."
AMA_idenitity: "Параэнская идентичность"
AMA_idenitity_desc: "Режим Параэнсе работает над созданием уникальной культурной идентичности Параэнсе среди своего народа."
AMA_gold: "Природные богатства"
AMA_gold_desc: "Гран-Пара начала разрабатывать свои месторождения драгоценных минералов. В результате уровень жизни вырос."
AMA_gold_rush: "Золотая лихорадка"
AMA_gold_rush_desc: "Бум добычи золота и других драгоценных минералов привлёк значительные инвестиции. Беспрецедентное число частных лиц также ищут свою удачу."
AMA_land_reorg_idea: "Заселение Амазонии"
AMA_land_reorg_idea_desc: "Гран-Пара поощряет как граждан, так и иммигрантов к созданию новых поселений по всему региону Амазонии."

