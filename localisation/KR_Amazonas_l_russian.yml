AMA_the_great_riverland_desc: "Амазонка - величайшая река в мире и центр нашей новой нации. Белен, наш крупнейший город, расположен рядом с её огромным устьем. Однако вверх по течению всегда не хватало политического контроля. Мы должны преуспеть там, где потерпела неудачу Бразилия, и надлежащим образом управлять приречьем."
AMA_political_restructurong_desc: "Наше правительство унаследовало от Бразилии серьёзную неэффективность. Хотя изменение этой ситуации потребует времени, мы должны начать этот процесс."
AMA_tracking_and_exploration_desc: "Амазония густа и зловеща, многие её зелёные катакомбы не исследованы. Нам следует нанять людей с опытом навигации по джунглям и передать их знания нашим вооружённым силам и гражданской администрации."
AMA_seize_brazilian_assets_desc: "Многие предприятия, принадлежащие компаниям и частным лицам с юга, продолжают грабить нашу нацию ради собственной выгоды. Это должно прекратиться - эти предприятия должны служить нашей нации."
AMA_state_protection_desc: "Хотя в городах наша новая нация быстро укрепила свой контроль, влияние государства быстро рассеивается в сельской местности. Чтобы бороться с этим, мы должны профинансировать создание и заселение новых общин, сосредоточенных вокруг сильно субсидируемой лёгкой промышленности. Эти маяки цивилизации естественным образом станут небольшими узлами управления."
AMA_land_reorganization_desc: "Наша новая система землепользования недостаточна для обеспечения значительного расширения. Однако целинные земли, которые нанесли на карту наши исследователи, не могут оставаться без дела. Мы должны сделать всё необходимое, чтобы управлять этими землями и распределять их."
AMA_development_program_desc: "Инициатива по развитию новых поселений лёгкой промышленности достигла некоторого успеха, но наша промышленность отстаёт от остального мира по своей сложности. Давайте сосредоточимся на достижении паритета даже с великими державами мира."
AMA_native_protection_desc: "Коренные народы Амазонии живут в ужасных условиях с незначительными экономическими возможностями, часто эксплуатируемые незаконными предприятиями, действующими в джунглях. Это должно прекратиться; всем племенам коренных народов должен быть предоставлен правительственный атташе для защиты от злоупотреблений."
AMA_prime_directive_desc: "Хотя контакт с цивилизацией может принести некоторую пользу наиболее изолированным группам коренных народов, он также, несомненно, принесёт множество проблем, особенно болезни и разрушение культуры. Мы должны институционализировать упреждающую, но социально сознательную политику контактов."
AMA_govermental_reform_desc: "Шок от быстрого отделения нашей нации от Бразилии оставил мало времени для развития достаточных политических институтов. Теперь, когда шок позади, мы должны попытаться устранить недостатки нашей государственной структуры."
AMA_reach_into_the_jungle_desc: "В самых отдалённых районах Амазонии не хватает многих базовых государственных услуг. Письмо с границы с Перу может идти до адресата неделями! Давайте принесём эти аспекты современности в каждый участок тропического леса."
AMA_para_identity_desc: "Наши люди считают себя не параэнцами, а бразильцами. Мы должны работать над изменением этого."
AMA_higher_learning_desc: "Образование и развитие человеческого капитала стимулируют долгосрочный экономический рост. Испытывая острую нехватку университетов, мы должны основать огромный центральный кампус, который станет центром любых будущих образовательных программ."
AMA_amapa_belem_railway_desc: "В настоящее время до Макапы невозможно добраться по железной дороге. Проложив железную дорогу из столицы, Макапа, несомненно, будет процветать."
AMA_belem_manaus_railway_desc: "Расположенный в центре Амазонии, несмотря на значительное население, до Манауса можно добраться только на речном судне или самолёте, что изолирует его население. Если бы наше правительство смогло заложить основы для современной железнодорожной сети, город, несомненно, вступил бы в новый золотой век."
AMA_manaus_roraima_railway_desc: "Расположенная на самом краю страны, Рорайма поразительно изолирована для современного города. Учитывая уже установленную необходимость развития железнодорожной системы в Амазонии, пусть Рорайма наконец будет соединена с сетью."
AMA_manaus_rio_branco_railway_desc: "Доступный по железной дороге только с территорий, не находящихся под нашим контролем, Риу-Бранку, а вместе с ним и регион Акри, рискует ускользнуть из наших рук. Мы не можем позволить этому прекрасному городу стать рассадником подонков и зла, давайте соединим его с нашей растущей железнодорожной сетью."
AMA_manaus_fonte_boa_railway_desc: "Почти у колумбийской границы любая армия, наступающая с севера, обязательно пройдёт через Фонти-Боа. Мы должны соединить этот стратегически важный город с железнодорожной сетью."
AMA_port_of_belem_desc: "Белен - крупнейший порт на многие сотни миль и бесспорные ворота в Амазонию. К сожалению, в городе недостаточно сооружений для наших военных кораблей. Мы не можем позволить, чтобы нашу нацию так легко поставили на колени. Должна быть построена большая база."
AMA_new_future_desc: "Хотя консолидация наших земель и их богатств важна, мы также должны смотреть в будущее. Новые экономические возможности ждут нас."
AMA_arm_our_forces_desc: "Наши вооружённые силы не могут производить вооружения, необходимые для снабжения их растущих рядов. Следует построить новые заводы, специально предназначенные для военного производства."
AMA_mining_processing_construction_desc: "Предприятия по переработке полезных ископаемых так же важны, как и сами шахты. Мы должны инвестировать в развитие мощностей, достаточных для удовлетворения нашего растущего производства."
AMA_estaleiro_manaus_desc: "Амазонка в Манаусе настолько велика, что там можно строить огромные речные суда, которые связывают Амазонию. Нам больше не нужно импортировать такие суда. Давайте профинансируем строительство специализированных верфей в Манаусе."
AMA_estaleiro_belem_desc: "Белен - наш крупнейший порт и место, где легче всего строить торговые и военные корабли. Мы должны работать с производителями, чтобы увидеть новый бум судостроения там."
AMA_arming_industry_desc: "Мы должны раз и навсегда покончить с нашими постоянными проблемами военного снабжения. Средства должны быть выделены на новое грандиозное расширение нашей отечественной оружейной промышленности."
AMA_defense_of_amazon_delta_desc: "Длинное побережье дельты представляет собой идеальную цель для потенциальных сил вторжения. Хотя это может быть трудно обеспечить, всё оно должно быть укреплено."
AMA_industrial_incentives_desc: "С booming судостроительной промышленностью в Манаусе, там также должны быть отрасли, поддерживающие такую деятельность. Мы должны предложить финансовые стимулы для местных отраслей, участвующих в этом."
AMA_zona_franca_desc: "Чтобы стимулировать дальнейшее развитие Амазонии, налоговые льготы должны быть предоставлены тем, кто работает в ключевых отраслях в регионе."
AMA_extract_wealth_desc: "Огромные месторождения золота и других природных ресурсов остаются неиспользованными. Мы должны оценить эти месторождения и начать экспорт богатств нашей нации."
AMA_garimpo_desc: "Месторождения ресурсов нашей нации начали привлекать внимание искателей удачи со всего континента и мира. Особенно золотые прииски наводнились рабочими, а осадок Амазонки всё чаще промывается в поисках золота."
AMA_leite_do_pau_desc: "Всего несколько десятилетий назад производители каучука обратили своё внимание на регион Амазонки. Поскольку спрос на каучук выше, чем когда-либо, этот «каучуковый бум Амазонии» должен быть воспроизведён. Давайте работать в тесном сотрудничестве с этими производителями, чтобы обеспечить это."
AMA_asserting_independence_desc: "Хотя мы можем полагаться на иностранные державы для защиты, мы не будем их простой болонкой. Хотя мы не стремимся к восстанию, мы должны утвердить наше право прокладывать свой собственный путь."
AMA_armed_forces_desc: "Армия Бразилии вечно страдала от коррупции и регионализма. Наша собственная должна быть развита, чтобы избежать таких ловушек."
AMA_equipment1_desc: "Все аспекты процесса закупок нашего вооружения отстают от наших врагов. Мы должны инвестировать в полный капитальный ремонт системы и приобретение ряда нового оборудования."
AMA_doctrine1_desc: "Развитие современного Генерального штаба является ключом к успеху всех других реформ. Мы должны начать создание этой инфраструктуры."
AMA_marines_desc: "Окружающая среда нашей нации привила населению знания, особенно полезные для подразделений морской пехоты. Мы должны усилить нашу морскую пехоту, опираясь на этот опыт."
AMA_army_modernization_desc: "Необходима совершенно новая система военных исследований, чтобы контролировать полную модернизацию наших сил. Хотя это может быть дорого, это необходимо."
AMA_equipment2_desc: "Без своей винтовки солдат - ничто. Люди должны быть оснащены лучшим оружием, которое можно купить за деньги."
AMA_doctrine2_desc: "Мы должны нанять лучших и умнейших со всего мира, чтобы помочь в разработке нашей военной доктрины."
AMA_paratroopers_desc: "Парашютисты - это недавнее новшество, которое покорило мир. У нас должны быть свои собственные парашютные подразделения."
AMA_jungle_skies_desc: "Густой тропический лес местами почти непроходим по земле. Однако с воздуха земля открыта. Давайте инвестируем в национальные военно-воздушные силы."
AMA_rule_skies_desc: "Истребители являются основой любых военно-воздушных сил. Давайте начнём догонять остальной мир в проектировании истребителей."
AMA_bomber_desc: "Иногда лучшая защита - это хорошее нападение. Если мы когда-либо хотим по-настоящему сдерживать наших врагов, у нас должны быть бомбардировщики, способные наносить сокрушительные удары по их городам и посёлкам."
AMA_CAS_desc: "Недавние войны показали необходимость непосредственной воздушной поддержки боевых действий. Военно-воздушные силы, предназначенные только для защиты своих рубежей, обречены на провал. У нас должна быть своя собственная ближняя авиационная поддержка."
AMA_FAP_desc: "Наследие бразильских военно-воздушных сил и их доктрины препятствует развитию наших собственных. Мы должны найти свой собственный путь."
AMA_airlifts_desc: "Часто войска, действующие в отдалённых районах Амазонии, не могут быть легко снабжены по суше. Мы должны построить новую авиабазу, специально предназначенную для переброски грузов по воздуху."
AMA_long_rage_flights_desc: "Ни один дюйм земли или воздушного пространства не может быть уступлен врагу. Мы должны исследовать самолёты с дальностью полёта, способной сделать это реальностью."
AMA_green_skies_desc: "Богатые минералами воды дельты Амазонки представляют собой дополнительную проблему для любого потенциального захватчика. На подходе к нашим берегам они обязательно станут лёгкой мишенью! Мы должны разработать морские бомбардировщики, чтобы использовать это преимущество."