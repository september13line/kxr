### Leader Bios ###
SCT_MACCORKMICK_DESC: "Юрист, националист, а теперь лидер восстания в Шотландии. Все эти должности занимает Джон Маккормик, человек, который надеется освободить шотландский народ от английской тирании. С ранних лет Маккормик был горячим сторонником домашнего правления Шотландии, и этой позиции он придерживался до конца своей жизни. Однако, несмотря на его ораторские таланты и большую базу поддержки, шотландский национализм подавлялся более радикальными фракциями внутри теперь уже Британского союза, что усугублялось тем, что он принимал в свою организацию более правые группы. Со временем его организация была вынуждена уйти в подполье. Это послужило основой для создания современной организации 'Родина', которая в то время была всего лишь периферийной террористической группой. Но когда Британский Союз распался под тоталитарным правлением Мосли, "Родная стража" взяла под контроль Шотландию, где британцы потерпели неудачу. И когда правительство было развалено, Маккормик увидел свой шанс наконец-то разорвать оковы, которые Англия наложила на Шотландию. Время пришло, Шотландия должна была стать свободной, и больше не было никого, кто мог бы этому помешать."

### Focuses ###

SCT_free_caledonia: "Свободная Каледония!"
SCT_free_caledonia_desc: "Максимистская тирания была свержена! Два века спустя, Шотландия вновь свободна! Да здравствует Каледония!"
SCT_german_watch: "Под немецким наблюдением"
SCT_german_watch_desc: "Наш доблестный союзник на континенте сыграл решающую роль в заложении новой Шотландской власти. Мы могли бы выразить нашу признательнсоть и укрепить наш союз короновав якобитского претендента, крон-принца Баварии, Рупрехта."
SCT_rightful_king: "Король по праву"
SCT_rightful_king_desc: "Канадская помощь позволила нам поддержать неуверенное национальное движение в Шотландии. Временное правительство приняло мудрое решение о начале процесса реинтеграции Шотландии в Антанту."
SCT_union_of_crowns: "Королевская уния"
SCT_union_of_crowns_desc: "Восстание против Британского Союза разожгло в народе Шотландии какую-то искру. Боле не желая быть лишь составной частью Соединённого Королевства, временное правительство избрало компромис между Националистами и Юнионистами, и объявило о восстановлении Королевской Унии. Впервые за два века у шотландцев будет собственный Король!"
SCT_united_kingdom: "Парламентская уния"
SCT_united_kingdom_desc: "Радикальные юнионисты из временного правительства не станут терпеть предательства наших угнетённых союзников в других частях Британии.Парламентская уния 1707 года должна быть восстановлена, и вместе с ней национальная гордость шотландцев и британцев. Боже храни короля [CAN.GetLeader]; Боже храни наш драгоценный союз!"
SCT_democracy: "От народа, для народа"
SCT_democracy_desc: "Победу одержали умеренные лидеры. Ни радикализм, ни терроризм или шовинизм, ни националисты, юнионисты, популисты и не синдикалисты, а либерально - демократические принципы приведут Шотландию к будущему, которое она заслуживает. Именно наши принципы свободы и справедливости для каждого Шотландца станут примером для всего мира."
SCT_dictatorship: "Настоящий шотландский дух"
SCT_dictatorship_desc: "Переворот национальной гвардии увенчался успехом. Мы не будем терпеть ни раскольников-юнионистов, ни предателей-синдикалистов. Теперь - начать программу коренных преобразований в Шотландии-священный долг Джона МакКормика и национальной гвардии. Грядёт национальное Шотландской возрождение. Шотландия может стать действительно демократической только тогда, когда воспрянут гордость и дух Шотландцев."
SCT_christian_nutters: "По Его воле"
SCT_christian_nutters_desc: "Во время нашего восстания, самыми эффективными боевыми группами были боевые бригады ковенанта. Будучи радикальными протестантами, во главе с харизматичным преподобным Джоном Уайтом, они получили львиную долю поддержки от юнионистов благодаря своей анти-католической риторике. Похоже, что после успешного марша на здание парламента и свержения временного правительства, ничто не сможет остановить эту почти мистическую организацию от свержения и папской власти в Шотландии."
SCT_macleans_dream: "За рабочих!"
SCT_macleans_dream_desc: "Джон МакЛин был национальным героем Шотландии.А Освальд мосли извратил его мечту до неузноваемости. Первый президент Британского Союза был бы в ужасе от того, как поступают с его соотечественниками, но это вовсе не значит, что синдикалистский проект провалился. Используя синдикалистскую экономическую модель, но в масштабе меньшем, чем в Британском союзе мы наконец сможем принести настоящее равенство на нашу землю!"

SCT_first_elections: "Первые выборы"
SCT_first_elections_desc: "С преобразованием верменного правительство в полноценный политический кабинет, все шотландские демократические партии начали политическую агитацию. Да победит же достойнейший!"
SCT_press_freedom: "Гарантия свободы слова"
SCT_press_freedom_desc: "Краеугольный камень либеральной демократии - это свобода слова и свобода самовыражения. Эти принципы станут основой новой Шотландии, вместве со свободой и справедливостью для всех и каждого!"
SCT_peace_with_socialists: "Разобраться с социалистами"
SCT_peace_with_socialists_desc: "Шотландские социалисты не слишком-то довольны тем, что мы взяли власть в свои руки. Многие из них восставали против нас с оружием в руках, и с радостью сделают это вновь. Пришло время решить, стоит с ними договорится либо вытеснить их из властных кругов. "
SCT_political_pluralism: "Политичесий плюрализм"
SCT_political_pluralism_desc: "Максимисты пытались уничтожить оппозицию как явление, и именно это привело Шотландию к точке невозврата. Мы не повторим их ошибки, и будем продвихать умеренный политический дискурс и сильный политический плюрализм."
SCT_local_democracy: "Местная демократия"
SCT_local_democracy_desc: "Нынешняя юнионистская Шотландская система приходов и городов - отстала от времени. мы заменим её на трёхуровневую систему из окружных, городских и региональных советов. Таким образом мы разовьём систему местной демократии, и тем самым уровняем всех граждан." 
SCT_homeland_watch: "Конец гвардии"
SCT_homeland_watch_desc: "Так называемая "национальная гвардия ('Родина')" - это националистическое парамилитаристское формирование, сыгравшее решающую роль на ранних этапах восстания и не позволившее более радикальным группам узурпировать власть. На повестке дня всё ещё остаётся вопрос о том, что нам следует с ними сделать."
SCT_entrenched_liberty: "Свобода и стабильность"
SCT_entrenched_liberty_desc: "Наш прект преобразования Шотландии в сияющий маяк свободы и демократии вскоре завершится. Шотландцы всегда любили свободу, и теперь, когда у них есть собственная страна, они могут доказать это всему миру."
SCT_negotiate: "Переговоры с юнионистами"
SCT_negotiate_desc: "Очевидно, что лучший способ разобраться с религиозными проблемами в Шотландии - это добится компромиса с юнионистами-протестантами. Чтобы они не чувствовали себя обделёнными в Шотландком государстве, мы должны пойти на уступки и построить свой парламент по образцу тех, которые юнионисты считают идеальными."
SCT_union_autonomy: "Автономия для юнионистов"
SCT_union_autonomy_desc: "Очевидно, что юнионисты никогда не захотят стать полноценной частью Шотландского государства, и это их полное право. Однако, мы не можем позволить им политический процесс. Решением этой дилеммы станет учреждение их собственных, автономных советов внутри Глазго и на западе Шотландии."
SCT_free_thought: "Поощрение свободомыслия"
SCT_free_thought_desc: "Подовление свободомыслия было основой максимистского правления. Мы пойдём от обратного. Новая Шотландия будет свободной гаванью для учёных и политических диссидентов и, что важнее всего, для каждого шотландца."
SCT_liberalize: "Либерализация экономики"
SCT_liberalize_desc: "Идеи сына Шотландии, Адама Смита сыграют ключевую роль в становлении нашей нации. Выбрав фискально правую власть, они отвергли синдикалистскую риторику и избрали путь свободного рынка и процветания!"
SCT_austerity: "Экономический аскетизм"
SCT_austerity_desc: "Строительство нового государственного механизма обошлось нам дорого и, в результате, нам не хватает средств чтобы обеспечить социальные программы временного правительства. Теперь нам следует положиться на рынок, а не на государство."
SCT_balance_books: "Экономический баланс"
SCT_balance_books_desc: "Наш экономический подход, похоже, оправдал себя. Государственный долг значительно упал,  граждане всё менее и менее зависимы от государственной поддержки, а наши экономические центры прямо-таки расветают!"
SCT_privatisation: "Приватизация нефтянных месторождений"
SCT_privatisation_desc: "Лучший способ извлечь прибыль из природных ресурсов-это отдать их в частные руки. Рынок распределит ресурсы наилучшим образом, и наша нефтянная промышленность будет приносить доход."
SCT_socialism: "Для всех и каждого"
SCT_socialism_desc: "Общественное благо превыше всего! В честности понятие основных . Шотландия всегда стримилась к той или иной форме социальнй демокртатии. Пора показать миру, на что способна наша идеология!"
SCT_welfare: "Обеспечение общественного благосостояния"
SCT_welfare_desc: "Наше правительство не будет гнаться за невозможным, но мы и не остановимся на том, чего мы уже добились. Мы будем заботится о каждом шотландце от рождения до смерти. Соркщённые социальные программы верменного правительства будут расширени и продолжены."
SCT_new_economics: "Немецкая экономическая модель"
SCT_new_economics_desc: "Курс Хьялмара Шахта - немецкого экономиста, медленно но верно восстанавливает экономику Германской Империи. Мы должны извлечь из этого уроки и учредить подобную модель здесь. Если такая экономическая политика помогает немецкой экономике - значит, она может и нашу вытащить из депрессии"
SCT_democratic_oil: "Нефть северного моря"
SCT_democratic_oil_desc: "Большие залежи нефти и природного газа были обнаружены у нашего побережья. Их разработка значительно улучшит наше экономическое положение"
SCT_new_constitution: "Новая конституция"
SCT_new_constitution_desc: "Когда северная морская компния Кристиана Салвесена обнаружила залежи ресурсов Шотландском Шельфе, никто не могу сказать какой курс действия будет лучшим для Шотландии. Наше правительство решило национализировать эту компанию, чтобы природное богатство принадлежало народу Шотландии"

SCT_benevolent_dictatorship: "Отец нации"
SCT_benevolent_dictatorship_desc: "Не имей Джон МакКормик большого влияния в национальной гвардии и временном правительстве, он бы не смог взять власть в свои руки так бескровно. Каждый день диссидентские издания и собрания атакуют вандалы, и каждый раз этим вандалам удаётся уйти безнаказанными. Похоже, что Шотландское национальное возрождение удастся несмотря ни на что."
SCT_defang_parliament: "Обломаем парламенту зубы!"
SCT_defang_parliament_desc: "В первые дни восстания многие выказывали поддерку идеям консуционной демократии. В конечном итоге это, конечно же, в наших интересах, однако, в его нынешнем состоянии Шотландское общество не готово к этому. Чтобы государство следовало нашему ясному курсу, мы должны урезонить парламент и убедиться, что он не сожет нам помешать."
SCT_control_opposition: "Оппозиция под нашим контролем"
SCT_control_opposition_desc: "После наших 'преобразований' парламент не представлят сколь-либо значительной угрозы нашему режиму. Несмотря на это, многие про-демократические партии продолжаютнастраивать общество против нас. Мы убедим их следовать нашему курсу, пока не придёт время перемен."
SCT_scots_education: "Шотландский язык и образование"
SCT_scots_education_desc: "Ирландия смогла добится определённых успехов в учреждении своего коренного языка. Мы же сожем добится ещё большего. Все университеты Шотландии празрабатывают радикальные планы по переводу своих учебных планов на скотс. Английский язык перестанет доминировать в Шотландии, а старый добрый Скотс займёт его место. От этого зависит будущее нашей страны. "
SCT_empower_watch: "Усиление гвардии"
SCT_empower_watch_desc: "Крайне наивно будет предположить, что национальная гвардия оставит правительство. Джон МакКормик это хорошо понимает. Также хорошо как то, что эти люди искренне желают лишь лучшего своей стране и соотечественникам. Местные власти будут опираться на гвардию и силу её оружия, а не на бессмысленные и опасные идеи на подобие юнионизма или синдикализма."
SCT_ban_covenanters: "Устранение угрозы ковеанта"
SCT_ban_covenanters_desc: "Ковенант-странная группа. Мы согласны с ними во многих вопросах, однако их более.. радикальные идеи могут нам помешать. Пока харизматичный лидер этого движения и его фанатичные подданные не стали для нас проблемой-стоит их устранить."
SCT_venerate_our_heroes: "Воздадим почести нашим героям"
SCT_venerate_our_heroes_desc: "Мы прошли долгий путь. Брюс и Уоллес гордились бы нами. В век индустрии мы вновь победили Англию с идеей собственной нации в сердцах!. Мы должны быть уверены, что следующее поколение взрастёт зная о Бэккобёрн и Стерлинг-бридж . "
SCT_martial_law: "Объявить военное положение"
SCT_martial_law_desc: "Религиозные распри, остатки вооружения и максимистские недобитки. Эти проблемы подрывают наше единство во времена оно нужно больше всего. Мы сможем с ними справится, если люди подчинятся нашей новосозданной национальной арммии и оперативникам гвардии. "
SCT_destroy_traitors: "Аресты предателей-юнионистов"
SCT_destroy_traitors_desc: "От Глазго до Абердина слышится один возглас; ‘К стенке ублюдков’ Если мы репрессируем самых радикальных и ненавидимых-юнионистов, мы сможем объеденить нацию."
SCT_red_scare: "Уничтожить Красный Клайдсайд"
SCT_red_scare_desc: "Джон МакЛин-неоднозначная фигура. Пускай он и его синдикалистская секта и пользуются популярностью, мы не можем их наивности подорвать нашу независимость. При каждом удобном случае нам следует очернять его наследие и проводить параллели с преступлениями максимистского режима. Только так красная угроза уйдёт навсегда. "
SCT_faith_unity: "Единство в вере"
SCT_faith_unity_desc: "Наше движение в основе своей не духовно, однако все мы понимаем, что под главенством Кирка пресвитерианская идеология должно сыграть объединяющую роль. Это не только поставит на место неблагонадёжных юнионистов, но и напомнит католиком, которых большинство среди синдикалистов, чья это страна."
SCT_military_buildup: "Развитие военной промышлености"
SCT_military_buildup_desc: "Разве можем мы сохранить нашу независимость, не защищяя её с оружием в руках? Наипервеишей задачей национального правительства явлеятся переоборудование старых мануфактур в новые оружейные производства."
SCT_defence_contracts: "Военные заказы"
SCT_defence_contracts_desc: "Обнаружив новый, нетронутый рынок военные копании со всего света пришли на поклон к нашему правительству дабы предоставить свои услуги. Очевидно, у нас нет недостатка в тех, кому мы можем отдать роль производителя орудий Шотландской независимости."
SCT_build_forts: "Новый Адрианов Вал"
SCT_build_forts_desc: "Если история ему-то и учит, так это тому, что южане никогда не оставят нас в покое. Мы будем защищать Шотландию до последней мины, последнего патрона и последнего штыка. Никогда боле они не смогут пересечь границу без жертв."
SCT_exploit_north_sea: "Богатства Северного Моря"
SCT_exploit_north_sea_desc: "Тысячи лет наш народ обладал богатствами, до которых он не мог добраться. Обнаружение нефти у побережья Оркни, Шетланда и Абердиншира может обеспечить нам процветание. Экспортируя этот ресурс мы построим самую сильную армию, которую когда-либо видели эти зелмли."
SCT_promote_business: "Поочь шотландскому бизнесу"
SCT_promote_business_desc: "Национальное восстание-это исорическая необходимость. Однако, оно совершенно разрушило нашу экономику. Мы не мжем позволить себе истратить ресурсы на оружейные заводы. Перед тем, как это станет возможно, Шотландская экономика должна восстановиться."
SCT_scottish_houses: "Города высокогорья"
SCT_scottish_houses_desc: "Нищета, на которую наша земля была обречена как часть Британской Империи, без приувеличения, разрушительна. Дети в рваных лохмотьях побираются на улицах нашей столицы .Программы социального жилья в Британском Союзе были в основном нацелены на пригороды. Мы построим новые города в недоразвитой сельской местности ради процветания нашего народа."
SCT_support_farmers: "Вопрос крофтеров"
SCT_support_farmers_desc: "Прогнило что-то в крофтерских кругах. Эти их разрешения, да земельная война после Вельткрига. Наша цель-отстроить Шотландию заново, и в том числе мы долны отстроить анахроничные высокогорные сообщества. Мы сделаем так, что никакие землевладельцы больше не придут в нашу страну, и землей будет владет тот, кто на ней работает."
SCT_mineral_mining: "Шахты в высокогорьях"
SCT_mineral_mining_desc: "Долгое время мощь сначала Британской Империи, а затем Британского Союза зижделась на Шотландии. Пришло время Шотландцам завладет их природными богатствами. Наша цель-открывать по одной шакте в месяц. Наконец-то, сама Шотландия переродится в железе!"
SCT_permanent_stability: "Вечная стабильность"
SCT_permanent_stability_desc: "Наши реформы увенчались несомненным успехом, но Джон МакКормик считает, что стране всё ещё требуется несколько лет руководства от нашиа правительством. Ради Шотландии, мы превратим старый аппарат временного правительства в нечто куда-более долговечное."
SCT_restore_democracy: "Восстановление демократии"
SCT_restore_democracy_desc: "Режим национальной гвардии не мог длиться вечно, но этого никогда и не требовалось. Сейчас Шотландия переживает своё културное возрождение. Новые поколения говорят на Шотландском, и шотландская идентичность практически восстановлена. Теперь мы можем передать власть в руки шотладнского народа. Теперь, когда его процветание было гарантировано."

SCT_gods_country: "Единый Союз под Богом"
SCT_gods_country_desc: "Штурмом зала парламента наши закаленные в боях войска показали шотландскому народу, что с твердой рукой Бога нельзя шутить. Загнивающие идеи современности должны быть отброшены, мы должны начать новый завет с Богом, как это сделали наши предки много веков назад."
SCT_sword: "Меч"
SCT_sword_desc: "Что такое Шотландия без верных христианских легионов? Слабый, бессильный и беззащитный детеныш.  Мы перестанем быть агнцем Божьим, мы станем его львом, и легионы Шотландии потрясут землю, по которой они ходят. Они пройдут по Божьей стране и предадут наших врагов священному мечу."
SCT_religious_police: "Расследовать папский заговор"
SCT_religious_police_desc: "Агенты Рима продолжают плести заговоры против нас. Куда бы ни повернулся настоящий шотландец с голубой кровью, к каждому его слову прислушивается иезуит. Мы должны искоренить это. Наши источники сообщают нам, что папство и силы Интернационала вполне могут сотрудничать с католическими синдикалистами, чтобы свергнуть наш режим. Мы бросим их священников в тюрьму и заставим их говорить!"
SCT_crush_monarchists: "Покончить с угрозой юнионистов"
SCT_crush_monarchists_desc: "Юнионисты оказались полезными на некоторое время. Преимущественно протестанты, некоторые из них даже поддерживали наш режим, надеясь, что когда-нибудь мы попытаемся восстановить Союз. Пришло время разрушить их жалкие мечты."
SCT_shield: "Щит"
SCT_shield_desc: "Мы находимся в самом сердце глобальной революции. Не той высокомерной, которую пропагандировали синдикалисты и либералы до них. Нет, мы находимся на пороге чего-то великого, благочестивого и доброго. Пламя, однако, слабое. Мы не можем допустить, чтобы наша вера была задушена в своей колыбели. Святая Шотландия будет защищена."
SCT_oath_of_loyalty: "Клятва верности"
SCT_oath_of_loyalty_desc: "Чтобы защитить будущие поколения от ереси, мы сделаем так, чтобы все государственные и образовательные профессии требовали присяги на верность Богу и государству. Те, кто откажется, предстанут перед судом Господа."
SCT_christian_science: "Протестантское образование"
SCT_christian_science_desc: "Мы закрыли католические школы. Мы запретили получать высшее образование всем, кроме практикующих пресвитериан, и теперь стремимся воспитать наших сыновей и дочерей кроткими людьми Божьими, какими их всегда хотел видеть наш Создатель. Да, ибо сегодня славный день, отныне Шотландией будут управлять только самые праведные, избранные сыны."
SCT_purge_unfaithful: "Очистить неверных"
SCT_purge_unfaithful_desc: "Атеисты. Католики. Епископалы. Англикане. Вот четыре врага, с которыми должна столкнуться Шотландия, если мы хотим быть сильной и единой нацией, с благословением и заветом Бога. Судить их должен Бог, но отправить их к Нему - наша задача. Без лишних слов, друзья-ковенантеры; Окружите их!"
SCT_boris_johnson: "Распустить парламент"
SCT_boris_johnson_desc: "Какая польза нашему движению от разложившегося и своекорыстного шотландского парламента? Как либеральные, синдикалистские идеи равенства и демократии приближают нас к Христу? Совет старейшин Кирка решил, что нет. Здание будет снесено за то высокомерие, которое оно олицетворяет."
SCT_kirk_parliament: "Ассамблея Кирка"
SCT_kirk_parliament_desc: "Роспуск парламента может быть глупым шагом. В конце концов, резиновая печать для узаконивания наших действий может оказаться исключительно полезной для закрепления нас в качестве маяка протестантской мысли в Северной Атлантике. Вместо этого парламент должен стать расширенным Советом старейшин Церкви Шотландии, только тогда мы сможем направить корабль к более праведному будущему."
SCT_super_protestants: "Протестантское превосходство"
SCT_super_protestants_desc: "Пока мы спешим изгнать последних врагов Божьих в Шотландии, новое настроение стало очевидным по всей стране. Наш народ наконец-то снова гордится своей правильной и родной религией. Шотландия действительно является свидетелем такого духовного возрождения, какого ещё никогда не было. Христос - Царь!"
SCT_new_people: "Ковенантерская теология в одном графстве"
SCT_new_people_desc: "Несмотря на нашу вновь обретенную убежденность в служении Христу-Царю, мы живем в XX веке. Лидер Шотландии должен быть из плоти и крови, чтобы сплотить народ к Агнцу Божьему. Мы построим нашу ветвь ковенантерской теологии сначала в Шотландии, и только потом будем экспортировать нашу веру по всему миру."
SCT_work_camps: "Вера через труд"
SCT_work_camps_desc: "Восстание было разрушительным, с этим не поспоришь. Экономика Шотландии должна восстановиться, прежде чем мы сможем реализовать нашу радикальную и благочестивую программу преобразований. К счастью, у нас нет недостатка в наших врагах, которые с радостью будут трудиться, а не отдадут себя под меч."
SCT_work_ethic: "Протестантская трудовая этика"
SCT_work_ethic_desc: "Учитывая распространенное в нашей национальной церкви представление о предопределении, многие истинно верующие придерживаются мнения, что усердно трудиться - значит проявлять признаки избранности Божьей. По мере того как наша хватка за власть продолжает расти, эти настроения будут усиливаться. Это лишь вопрос времени, когда лень будет искоренена на этой земле, и для этого мы должны продвигать традиционную протестантскую трудовую этику и расширять трудовые лагеря."
SCT_seize_lands: "Захватить католические земли"
SCT_seize_lands_desc: "Много веков назад варвары с берегов Шотландского моря наводнили нашу землю после того, как Бог наказал их лень голодом. Теперь они стремятся лишь агитировать и протестовать против режима, который ставит Христа на первое место. Ясно, что эти паписты - не более чем помеха, давайте конфискуем их собственность и передадим её добрым пресвитерианам."
SCT_gods_kingdom: "Божье Царство на Земле"
SCT_gods_kingdom_desc: "Мы должны распространять теологию ковенантеров далеко и широко! Наши угнетенные братья в Ольстере и остальной Ирландии свидетельствуют о том, что может произойти, когда самый верный Божий народ оказывается под пятой папистов и других врагов Христа. Наше Царство будет не только всеобъемлющим, оно будет праведным и богоугодным! Давайте же нести весть о Христе Царе во все уголки мира!"
SCT_call_faithful: "Призыв к верующим"
SCT_call_faithful_desc: "По всей стране служители, верные движению ковенантеров, заставляют наших молодых людей приносить вторую присягу Торжественной Лиге и Завету. Навсегда стать её защитником во времена раздоров и действовать как солдаты-миссионеры на Его службе. Мы создаем армию, чтобы спасти человечество от самого себя, чтобы вернуть весь мир к свету."
SCT_prussian_brothers: "Наши прусские братья"
SCT_prussian_brothers_desc: "У нас много общего с нашими протестантскими братьями в северной Германии. Мы должны быть благодарны за то, что Пруссия управляется объединенной церковью кальвинистов и лютеран. Хотя мы считаем лютеранство просто ещё одной нереформированной верой, в Германии есть промышленники, которые следуют правильным кальвинистским путём. Мы будем советоваться с ними по поводу экономической помощи между двумя антипапскими Державами."
SCT_silver_legion: "Сыны легиона"
SCT_silver_legion_desc: "Повсюду в Шотландии легионы продолжают расти. То, что когда-то было военизированным крылом движения ковенантеров, стало действительно могучей армией. А такой могучей армии нужно оружие, чтобы сражаться. Мы обратимся через Атлантику к нашим братьям по вере и помолимся, чтобы Серебряный легион увидел свет и стал нашим новым благодетелем."
SCT_gods_light: "В Божьем Святом Свете"
SCT_gods_light_desc: "Завет переделан и восстановлен. Народ, обращенный на верный путь. Все шотландцы теперь читают с одного листа гимн. Повсюду в Шотландии на улицах слышно, как скандируют "Христос - Царь" Воистину, мы скоро станем свидетелями Его второго пришествия и, по милости Божьей, действительно станем Его избранным народом. "

SCT_jacobite_king: "Якобинский Король"
SCT_jacobite_king_desc: "Благодаря помощи наших доблестных союзников в Европе нам удалось освободиться от синдикалистской британской тирании. Теперь настало время выразить нашу признательность. Чтобы укрепить наши связи с зарождающейся германской державой в Европе, мы хотим короновать Руппрехта Баварского как короля Шотландии. Да здравствует Король Роберт IV из дома Стюартов-Виттельсбахов, и пусть потомок Брюса навсегда займет наш трон!"
SCT_kings_guard: "Учредить Королевскую гвардию"
SCT_kings_guard_desc: "В то время как одни открыто приветствуют возвращение монархии в Шотландии, другие возмущены тем, что наш Король - немец. Будет создан новый полк верных шотландцев, который не только обеспечит безопасность Его Величества, но и послужит ярким примером того, как наш народ должен сплотиться вокруг трона."
SCT_erase_parliament: "Стереть парламент"
SCT_erase_parliament_desc: "Многие из новых подданных короля испытывают ностальгию по тем временам, когда их интересы представлял парламент. Мы должны стереть эти плохие воспоминания и сделать так, чтобы призрак демократии больше не преследовал нас."
SCT_royal_council: "Расширить полномочия Королевского совета"
SCT_royal_council_desc: "Демократия в Шотландии - вещь непостоянная. Учитывая нестабильность восстания, Король счел нужным отдать приказ о разработке новой шотландской конституции, которая обеспечит ему, его тайным советникам и церкви руководящую, отеческую руку."
SCT_destroy_syndies: "Уничтожение оставшихся синдикалистов"
SCT_destroy_syndies_desc: "К синдикалистам присоединились не только фабричные рабочие или те, кто вкалывал на верфях Шотландии. Недовольные земельными реформами старого Соединённого Королевства также взялись за оружие против империи. Как горные, так и низменные фермеры-арендаторы должны быть приведены в чувство."
SCT_secret_police: "Создать Специальную полицейскую комиссию"
SCT_secret_police_desc: "Оппозиция нашему правлению оказалась сильнее, чем ожидалось. Чтобы лучше защитить Его Величество и государство, была создана новая специальная полиция, которая будет действовать из тени."
SCT_german_education: "Реформировать систему образования"
SCT_german_education_desc: "Университеты Шотландии уже давно стали местом инноваций и полезного обучения не только для местных жителей, но и для всего мира. Шотландская наука известна как одна из самых лучших в мире, и нам бы не помешало использовать талант нашей нации в этом направлении как можно лучше."
SCT_legitimacy_crisis: "Кризис легитимности"
SCT_legitimacy_crisis_desc: "Руппрехт, герцог Баварский, чтобы использовать его немецкое имя, был командующим Имперской немецкой армией в Первой мировой войне. Это не понравилось многим ветеранам Шотландии. Не говоря уже о том, что его сына зовут Генрих. Мы должны стремиться к тому, чтобы Король принял шотландские манеры и общую религию, чтобы обеспечить его легитимность" Однако Руппрехт, похоже, расстроен тем, что он сам и его сын отказались от католицизма."
SCT_crush_british: "Сокрушить юнионистов"
SCT_crush_british_desc: "Я с удовольствием выучу шотландский язык, но я не могу отказаться от религиозного обычая, который моя семья исповедовала на протяжении веков" Слова короля показательны, и это не понравится жестким протестантам-унионистам в Шотландии. Их дни сочтены."
SCT_work_with_british: "Примириться с юнионистами"
SCT_work_with_british_desc: "'Если то, что я стану одним из верующих Шотландии, приблизит их народ ко мне, то так тому и быть'. Похоже, что после долгих раздумий Король выбрал путь наименьшего сопротивления. Он покажет юнионистам, что шотландской церкви никогда не будет угрожать присутствие на троне католика. В конце этой недели он встретится с министрами церкви Шотландии, чтобы принять крещение как пресвитерианин."
SCT_purge_republicans: "Чистка республиканцев"
SCT_purge_republicans_desc: "Шотландская республика просто не отвечает ничьим интересам. Идеи республиканизма породили не только синдикалистские, но и оголтелые легионерские государства по всей Европе. Петля более чем достаточна для всех, кто выступает против короля Шотландии."
SCT_assert_independence: "Экономическая независимость"
SCT_assert_independence_desc: "Хотя мы ценим все, что Германия сделала для нас, мы не можем позволить себе стать ещё одним винтиком в экономическом проекте Mitteleuropa. Членство в Рейхспакте обеспечит Шотландии безопасность, но экономическая независимость сделает нас свободными."
SCT_scottish_farms: "Субсидировать шотландские фермы"
SCT_scottish_farms_desc: "В результате подъема поля оголились. С импортом сельскохозяйственной техники из Германии мы проведем великую трансформацию от картофельных полей Ангуса к ячменным пастбищам границ. Только с сильным сельскохозяйственным сектором мы сможем по-настоящему процветать!"
SCT_ban_unions: "Запретить профсоюзы"
SCT_ban_unions_desc: "Угроза синдикализма впервые показала свою уродливую голову при поддержке профсоюзов в Шотландии. Это предательство по отношению к любой короне нельзя больше терпеть ни минуты. С винтовками и дубинками мы добьемся того, что подпольные собрания на рабочих местах больше никогда не повторятся. "
SCT_focus_on_mining: "Акцент на горнодобывающей промышленности"
SCT_focus_on_mining_desc: "Шотландское нагорье - это гористая местность, которая многое дала Британской империи. Благодаря наличию угля, железа и цинка Шотландия может стать мастерской островов при условии достаточного финансирования."
SCT_mitteleuropa: "Связи с Миттелевропой"
SCT_mitteleuropa_desc: "Более либеральные элементы в Германии, кажется, взывают к изменению структуры Mitteleuropa. Германия больше не будет душить экономику других стран, а вместо этого будет способствовать росту и свободной торговле на всем континенте. Три "ура" за европейскую кухню!"
SCT_german_grain: "Покупайте немецкое зерно"
SCT_german_grain_desc: "Шотландия богата своей способностью производить высококачественный скот и продукты, связанные с животноводством, а также овес и ячмень. Больше времени можно посвятить разведению и выращиванию таких прекрасных продуктов, если мы будем импортировать дешевое немецкое зерно!"
SCT_invite_companies: "Приглашать немецкие компании"
SCT_invite_companies_desc: "Германия - мировой гегемон, и хотя в связи с "Чёрным Понедельником" произошел небольшой переполох, немецкие компании уже восстанавливаются. Посол Германии обратился к нам с официальной просьбой ослабить ограничения и направить приглашения различным немецким промышленным гигантам. Их присутствие в Шотландии может быть только полезным для нас обоих!"
SCT_german_oil: "Права Германии на нефть"
SCT_german_oil_desc: "Нефть поддерживает в движении машины не только военного, но и гражданского назначения. К северо-востоку от Абердина было обнаружено большое месторождение нефти. При правильной эксплуатации Шотландия и Европа в целом могут оказаться на пороге неслыханного процветания в эту новую и захватывающую эпоху!"
SCT_scottish_king: "Шотландский Король"
SCT_scottish_king_desc: "Сын Стюартов и, в свою очередь, сын самого Брюса теперь снова восседает на троне Шотландии. Шотландский народ отбросил своё недоверие к немцу и теперь считает его и его наследников такими же шотландцами, как и они сами, если не по крови, то по культуре и преданности Шотландии,"

SCT_socialist_legacy: "Наследие Маклина продолжает жить"
SCT_socialist_legacy_desc: "Джона Маклина считали спасителем Шотландии. Во времена гражданских войн, экономической депрессии и издевательств над шотландским пролетариатом со стороны англо-шотландской буржуазии, именно Джон Маклин прошел по Клайдсайду с красным знаменем в руках, призывая народ к социализму и лучшей жизни. Вопреки всем демагогам, либералам и диктаторам, Шотландия действительно снова станет некоррумпированным рабочим государством."
SCT_highland_campaign: "Начать кампанию в Хайленде"
SCT_highland_campaign_desc: "После успешной революции мы смогли изгнать Мосли и его головорезов вместе с реакционерами. К сожалению, последние всё ещё упорствуют и преследуют наше правление с тайных баз в Горных районах. Если мы хотим когда-нибудь по-настоящему освободить Шотландию, они должны быть уничтожены."
SCT_destroy_watch: "Уничтожить 'Родину'"
SCT_destroy_watch_desc: "Родина - это гнездо реакционных гадюк, которые выступали против нашего правления с самого его основания. Когда Шотландия вырвалась на свободу, все ядовитые реакционные элементы сплотились вокруг Маккормика и его банды головорезов. Пришло время покончить с ними раз и навсегда."
SCT_root_out_unionists: "Искоренить юнионистов"
SCT_root_out_unionists_desc: "Красный флаг развевается над мэрией Глазго. Легионы рабочих мужчин и женщин идут на юнионистские кварталы. Сегодня ночью мы покончим с буржуазным религиозным расколом в Шотландии. Католики больше не будут работать в плохих условиях, как и любой шотландец!"
SCT_secular_state: "Светское Государство"
SCT_secular_state_desc: "Шотландия - страна многих религий и вероисповеданий, и это приводит к ожесточенной межконфессиональной розни, особенно между протестантами и католическим меньшинством. Вместо того чтобы выбирать сторону в этой борьбе, мы объявим светское государство. Ни одной религии не будет отдаваться предпочтение, и все будут вольны следовать своей вере или её отсутствию."
SCT_communard_spirit: "Дух Маклина"
SCT_communard_spirit_desc: "Для того чтобы Шотландия выжила, мы должны прививать дух Маклина с самого раннего возраста. Дух сопротивления капиталистам и реакционерам. Дух надежды и света в конце туннеля. Дух создания лучшего общества."
SCT_socialist_science: "Социалистическое образование"
SCT_socialist_science_desc: "К счастью для нас, большая часть старой системы образования, существовавшей при Британском Союзе, осталась нетронутой. И хотя нам придется внести в нее некоторые незначительные изменения, мы сможем эффективно поддерживать и поддерживать этот яркий пример социалистических принципов и прививать их молодым поколениям."
SCT_scottish_tuc: "Шотландский TUC"
SCT_scottish_tuc_desc: "Конгресс профсоюзов был краеугольным камнем британской демократии до того, как тиран Мосли набил его своими головорезами. Идея, однако, небезупречна. Шотландский TUC будет служить интересам пролетариата Шотландии лучше, чем любой буржуазный парламент!"
SCT_punish: "Наказать тоталистов"
SCT_punish_desc: "Именно они уничтожили наследие Маклина, именно они сделали национальное восстание неизбежным, именно они позволили силам реакции запятнать прогрессивные силы социализма на этих островах. Тоталисты должны предстать перед судом и заплатить за то, что они сделали с наследием Маклина."
SCT_compromise_with_totalists: "Компромисс с тоталистами"
SCT_compromise_with_totalists_desc: "Возможно, дело в том, что наши братья-пролетарии по всей Шотландии и Британии были просто сбиты с пути Мосли и его бандой предателей? В конце концов, эти люди - наши соотечественники, и мы не можем держать их в тюрьме бесконечно. Дайте им увидеть чудесные преобразования, к которым приступила наша нация, и позвольте им реинтегрироваться в наше общество."
SCT_decentralize_government: "Децентрализация правительства"
SCT_decentralize_government_desc: "Мы слишком долго использовали аппарат Временного правительства. Пришло время вернуть реальную политическую власть общинам и рабочим Шотландии. Только в этом случае мы действительно будем жить в условиях успешной пролетарской демократии!"
SCT_isolation: "Великая изоляция"
SCT_isolation_desc: "Остальные страны Интернационала умышленно игнорируют наши мольбы о помощи. Неважно. Шотландия будет стоять на собственных ногах, являясь маяком социализма и эгалитаризма в Северной Атлантике."
SCT_support_communes: "Инвестировать в местные коммуны"
SCT_support_communes_desc: "Фабрики и верфи Шотландии когда-то были лучшей частью Британской империи и Союза. Мы стремимся сделать их доменной печью нашего нового государства. Со средствами производства в руках наше будущее обеспечено!"
SCT_collective_farming: "Поддержите крофтеров"
SCT_collective_farming_desc: "В последние десятилетия в большинстве районов Лоуленда предпринимались бессисТёмные попытки земельной реформы и ещё более худшие попытки упразднить исторических крофтеров. Только шотландское синдикалистское государство может исправить ошибки, которые бесцеремонное правительство в Лондоне нанесло фермерам Шотландии. Пусть люди пожинают то, что они посеяли."
SCT_drilling_efforts: "Усилия по бурению"
SCT_drilling_efforts_desc: "Чёрный, богатый и прекрасный. Такими словами Хью Макдэрмид описал последнее открытие у берегов Абердиншира. Энергетические потребности Шотландии больше не будут удовлетворяться коррумпированными социалистическими режимами или буржуазными государствами. Теперь власть в наших руках!"
SCT_join_internationale: "Присоединяйтесь к Интернационалу"
SCT_join_internationale_desc: "Успехов! Французы и другие члены Интернационала приняли Шотландию с распростертыми объятиями. И не только! Они согласились с нашей оценкой того, что Британский Союз был осажден контрреволюционными силами. Это победа социализма. Скоро Мосли предстанет перед народным судом за свои преступления против них! Давайте официально присоединимся к Интернационалу!"
SCT_french_construction: "Просить помощи у Франции"
SCT_french_construction_desc: "Олд Альянс между Шотландией и Францией крепко держится. Пока мы говорим, тысячи тонн промышленного оборудования направляются к берегам Шотландии. Нация, возрожденная в рабочих печах!"
SCT_french_farming: "Подражайте французским методам ведения сельского хозяйства"
SCT_french_farming_desc: "Франция уверенно восстановилась после Вельткрайга благодаря своим гениальным методам коллективного земледелия. Мы должны стремиться копировать их как можно ближе, чтобы не только восстановиться после восхода, но и оправиться от 300-летнего правления."
SCT_world_revolution: "Принять мировую революцию"
SCT_world_revolution_desc: "Корни британской революции лежат в долинах Уэльса и доках Клайдсайда. Шотландия, вместе с нашими международными партнерами, будет стремиться продолжать это наследие сейчас и навсегда. Солидарность навсегда!"
SCT_the_dream: "Красная Шотландия"
SCT_the_dream_desc: "Британский профсоюз никогда по-настоящему не представлял рабочих Шотландии. Комитеты, набитые английскими и валлийскими рабочими людьми - это все хорошо, но наконец-то у рабочих Шотландии действительно есть собственное государство и аппарат местного самоуправления, чтобы змея империализма, будь то ревизионизм наших союзников или сила из-за моря, никогда больше не коснулась наших берегов."

SCT_the_windsor_king: "Виндзор на троне"
SCT_the_windsor_king_desc: "О, славный день! Королевский штандарт снова развевается над дворцом в Балморале! Король вернулся! Боже, храни короля!"
SCT_brothers_again: "Снова братья!"
SCT_brothers_again_desc: "Очевидно, что после революции и восстания шотландский народ принял новый образ себя. Полная реинтеграция Шотландии в Соединённое Королевство может оказаться глупым шагом, учитывая нынешние настроения. Достаточно союза корон!"
SCT_revive_culture: "Возродить шотландскую культуру"
SCT_revive_culture_desc: "Определяющей характеристикой шотландца из низменных районов является его преданность. Союзники ликуют, а националисты неспокойны. Давайте успокоим и тех, и других, внедрив учебную программу, ориентированную на шотландцев, и тем самым продолжим укреплять связи между Шотландией, Англией и остальным Содружеством!"
SCT_accomodate_unionists: "Успокоить юнионистов"
SCT_accomodate_unionists_desc: "Шотландские юнионисты пережили тяжелые времена. Во время революции были запрещены братские организации юнионистов и подавлены протестантские церкви, а восстание заставило их почувствовать себя как никогда далекими от своих британских собратьев. Они должны знать, что наконец-то они в безопасности."
SCT_purge_syndies: "Арестовать левых агитаторов"
SCT_purge_syndies_desc: "Именно синдикалисты способствовали падению одного из самых успешных политических союзов в мире. Они должны быть наказаны за своё предательство. Верные люди вытащат "интеллектуалов" Клайдсайда из их постелей сегодня ночью."
SCT_parliament_question: "Вопрос о парламенте"
SCT_parliament_question_desc: "Кому должна принадлежать верховная власть в Шотландии? Нация, всё ещё осажденная республиканскими, сепаратистскими и синдикалистскими влияниями, не может устоять. Была созвана чрезвычайная сессия шотландского парламента, должна ли власть принадлежать премьер-министру короля или демократическому собранию, которое он должен представлять?"
SCT_iedc_aid: "Помощь ИСЭР"
SCT_iedc_aid_desc: "Имперская корпорация экономического развития является неотъемлемой частью в поддержании империи не только процветающей, но и единой в своих целях.  Восстановление Шотландии - это совместное предприятие, подобное которому убедит всех, кроме самых ярых сепаратистов, что мы все братья по Британии и общим ценностям."
SCT_entente_ties: "Торговые связи Антанты"
SCT_entente_ties_desc: "Шотландцы в Канаде могут многое предложить шотландцам у себя на родине, а те в свою очередь могут многое предложить империи. Давайте углублять наши связи с нашими самыми естественными партнерами. Бочки виски для лучшего зерна Канады."
SCT_mining_grants: "Субсидии на добычу полезных ископаемых"
SCT_mining_grants_desc: "В то время как частное предпринимательство было изгнано с берегов Шотландии и Великобритании, в Канаде есть много компаний, желающих воспользоваться природными ресурсами Шотландии. Мы предложим им больше стимулов для прихода в Шотландию, по одной субсидии и снижению налогов за раз."
SCT_homecoming: "Возвращение на родину"
SCT_homecoming_desc: "Мысль о распаде союза совершенно непереносима для нашего монарха. Шотландия и Англия снова будут Соединенным Королевством, будь то ад или высокая вода. Хотя националисты могут поставить вопрос, мы выстоим. За короля и страну!"
SCT_border_forts: "Укрепить границу"
SCT_border_forts_desc: "Режим на юге Шотландии утверждает, что он британский, но он не придерживается тех ценностей, которые сделали нашу нацию такой великой. Нельзя отказываться от драгоценного плацдарма, который Великобритания имеет в Шотландии. Они не пересекут границу."
SCT_raise_loyal_militia: "Поднять лоялистское ополчение"
SCT_raise_loyal_militia_desc: "Восстановление идет полным ходом. По всему Глазго и центральному поясу лоялисты, которых когда-то промывали мозги и подавляли как синдикалисты, так и националисты, теперь стекаются под знамена Союза. Мелодия "Я клянусь тебе, моя страна" звучит в тренировочных залах по всей Шотландии."
SCT_silence_nats: "Заставить националистов замолчать"
SCT_silence_nats_desc: "В другой жизни радикал Маклеод мог бы быть полезен Британии, но реальность такова, что его движение является лишь источником религиозной и националистической агитации. Что касается Маккормика, то его следовало бы бросить в петлю много лет назад. Мы покончим с обоими движениями, отрубив голову змее и наблюдая, как умирает тело."
SCT_governor_powers: "Установить полномочия губернатора"
SCT_governor_powers_desc: "Пока мы не вернём себе Британию, Шотландией будет править назначенный и несколько авторитарный губернатор. Необходимое и прискорбное зло. На его стол попала петиция с призывом провести демократические реформы, чтобы показать добрым, лояльным британцам на юге, что мы всегда будем поддерживать британские ценности. Напротив, военные и дворяне считают, что это всего лишь затея националистов и что статус-кво должен быть сохранен."
SCT_prepare_integration: "Готовиться к интеграции"
SCT_prepare_integration_desc: "Шотландская и английская экономики существуют в синергии. Одна дополняет другую. Этот аспект мы должны иметь в виду, когда будем стремиться к воссоединению островов и возрождению духа Британской империи."
SCT_british_economy: "Британская экономика"
SCT_british_economy_desc: "Шеффилдская сталь на верфях Глазго. Грузовые поезда с товарами беспрепятственно следуют из Шотландии в Англию - вот экономика, к которой мы стремимся. Шотландия не может выжить сама по себе, и мы не дадим ей такой возможности."
SCT_open_oil_reserves: "Использовать запасы нефти"
SCT_open_oil_reserves_desc: "Чудесно. British Petroleum обнаружила ещё больше нефтяных месторождений у побережья Шетландских островов. Этот прекрасный Чёрный природный ресурс будет питать Шотландию и Британские острова в течение десятилетий."
SCT_farming_grants: "Субсидии фермерам"
SCT_farming_grants_desc: "Свободные землевладельцы Шотландии страдают от бездарного и тяжелого правления синдикалистов. Мы исправим это путём прямого предоставления грантов шотландским фермерам в надежде, что они используют эти деньги для модернизации своего сельскохозяйственного оборудования... Оборудование, которое удобно производить в Канаде."
SCT_kings_party: "Настоящая шотландская партия"
SCT_kings_party_desc: "Консервативная и юнионистская партия в настоящее время доминирует в парламенте. CUP - настоящая шотландская партия, как никакая другая. В то время как другие партии продадут нас капиталу или превратят Шотландию в синдикалистскую нацию с черного хода, CUP отстаивает истинные шотландские ценности с яростной лояльностью к нашим англоязычным братьям."
SCT_king_and_country: "За короля и страну!"
SCT_king_and_country_desc: "Пошли ему победу счастливую и славную, долго Царствовать над нами, Боже, храни короля! Время уже скоро! Давайте изгоним синдикалистов с нашей зеленой и приятной земли и возродим Соединённое Королевство, более великое и более сплоченное, чем когда-либо прежде!"

SCT_devolved_government: "Децентрализованная администрация"
SCT_devolved_government_desc: "Политика Никласа И Глаиса, направленная на передачу определенного уровня управления в страны проживания, оправдала себя, и в Эдинбурге создается новая администрация. Хотя это не является полной независимостью, это свидетельствует о значительных изменениях в политике Союза. Чтобы закрепить новое правительство, были назначены внеочередные выборы. Пусть победит сильнейший!"
SCT_swf_victory: "Победа PLN!"
SCT_swf_victory_desc: "На внеочередных выборах победу одержала Шотландская Федерация трудящихся, объединенная с автономистами! Их политика в основном совпадает с политикой автономистов: расширение гражданских свобод и стремление к созданию все более справедливого общества."
SCT_autonimist_doctrine: "Доктрина автономистов"
SCT_autonimist_doctrine_desc: "Доктрина автономистов - это в значительной степени либеральное отношение к повседневной жизни. Ибо почему дела человека должны принадлежать кому-то, кроме него самого? Мы будем стремиться закрепить эту конституционную свободу и развивать её в Шотландии."
SCT_work_with_syndies: "Работа с синдикалистами"
SCT_work_with_syndies_desc: "Мы и синдикалисты не такие уж разные. Вместо того, чтобы заниматься мелкой партийностью, которая разрушает либеральную демократию, мы будем привлекать их присоединиться к нам в создании лучшей Шотландии."
SCT_national_army: "Шотландская армия"
SCT_national_army_desc: "Хотя наши внешние дела по-прежнему частично диктуются Британией, нам дали добро на создание собственных вооружённых сил для самозащиты."
SCT_fairer_society: "Более справедливое общество"
SCT_fairer_society_desc: "На протяжении сотен лет Шотландия была несправедливым обществом, где рабочие люди подвергались угнетению, будь то наши собственные тираны или англичане. Но теперь мы можем исправить старые ошибки и продвинуться вперёд к более справедливому и мягкому обществу."
SCT_uob_support: "Попросите поддержки у Великобритании"
SCT_uob_support_desc: "Теперь, когда мы сами отвечаем за свои дела, нам нужно строить экономику. Британия, несомненно, с удовольствием предоставит нам субсидии, чтобы мы могли стать лучше."
SCT_invest_in_industry: "Инвестировать в промышленность"
SCT_invest_in_industry_desc: "Основа нашей демократии и процветания заложена в промышленности. Дымящиеся, почерневшие фабрики Глазго и Эдинбурга. Мы направим дополнительные средства на то, чтобы обеспечить процветание всей нации."
SCT_radsoc_mining: "Открыть шахты"
SCT_radsoc_mining_desc: "Шотландия - страна гор, а где горы, там и железо, руда и всевозможные ресурсы. Берите свои кирки и лопаты, мы отправляемся в шахты!"
SCT_joint_research: "Совместные научные усилия"
SCT_joint_research_desc: "Разделенные, наши научные усилия, естественно, будут затруднены, поэтому лучше облегчить сотрудничество между британскими и шотландскими учеными."
SCT_update_scottish_law: "Обновить шотландское законодательство"
SCT_update_scottish_law_desc: "Традиционно Шотландии разрешалось практиковать шотландское право, и это стало ещё более распространенным явлением с передачей полномочий администрации. Однако оно никогда не было действительно предназначено для социалистического государства, и нам следует заняться его реформированием и обновлением в соответствии с современными реалиями."
SCT_age_of_rail: "Эпоха железных дорог"
SCT_age_of_rail_desc: "Одной из главных побед синдикализма является отмена частного транспорта. От Лондона до Парижа и Турина поезда являются транспортом рабочего человека. Давайте принесем этот век железных дорог в Шотландию и сделаем рабочих от Эдинбурга до Глазго ближе друг к другу!"
SCT_redistribute_wealth: "Перераспределить богатство"
SCT_redistribute_wealth_desc: "Наше общество основано на взаимопонимании и справедливости, поэтому будет справедливо, если рабочие и фермеры получат то, что они посеяли. Конечно, мы можем помочь в этом."
SCT_stuc_victory: "Победа STUC!"
SCT_stuc_victory_desc: "Синдикалистский Конгресс профсоюзов Шотландии победил на внеочередных выборах! Их политика - это возвращение к синдикализму, как это было до победы автономистов."
SCT_urbanization: "Поощрение урбанизации"
SCT_urbanization_desc: "Хотя автономисты занимают более свободную позицию в отношении экономического развития, мы, синдикалисты, знаем, что истинное место рабочего человека - в великих городах Британских островов. Эти города должны быть расширены, чтобы способствовать мировой революции!"
SCT_public_housing: "Строить общественное жилье"
SCT_public_housing_desc: "Истинно социалистическое жилье является коммунальным! Один человек не должен оставаться бездомным, пока у другого есть единственная пустая комната! Как социалисты, мы должны исправить это и построить больше общего жилья для людей. От Эдинбурга до Скапа-Флоу у всех жителей Шотландии должна быть крыша для сна!"
SCT_syndie_army: "Создать ополчение"
SCT_syndie_army_desc: "В 1925 году революцию выиграл не какой-то офицерский корпус, который учился за много миль отсюда и не имел никакой связи со своими солдатами! Нет, вместо этого победителями революции стали простые люди, ведомые простыми людьми, служащие для простых людей! Мы не должны отказываться от того, что дало нам успех в революции!"
SCT_empower_trade_unions: "Расширить возможности профсоюзов"
SCT_empower_trade_unions_desc: "Настоящей отличительной чертой синдикалистской экономики являются профсоюзы. Можно сказать, что свобода народа измеряется силой его профсоюзов, и поэтому мы должны предоставить профсоюзам больше привилегий и власти в правительстве."
SCT_workers_paradise: "Рай для рабочих"
SCT_workers_paradise_desc: "После бесчисленных часов и неустанной работы мы создали здесь, в Шотландии, образцовое революционное государство. От горных районов до Эдинбурга шотландский народ может гордиться своей работой по созданию социалистической экономики, независимой от английской. И хотя трусы дрожат, а предатели усмехаются, мы будем держать здесь красный флаг!"

SCT_economy_start: "Обзор экономики"
SCT_economy_start_desc: "На протяжении веков Шотландия была второстепенным партнером Англии, и поэтому мы должны оценить, что мы имеем как нация вдали от максимилистского домкрата."
SCT_reconstruction: "Начать реконструкцию"
SCT_reconstruction_desc: "Между ужасами правления Мозли и нашим кровавым бегством от него, Шотландия должна восстановить свою экономику, чтобы сохранить с таким трудом завоеванную независимость."
SCT_repair_nation: "Восстановить нацию"
SCT_repair_nation_desc: "Война за независимость оставила Шотландию в руинах. Чтобы загладить шрамы войны за независимость, мы должны восстановить страну, где бы армии ни маршировали и ни опустошали её."
SCT_minor_investments: "Мелкие инвестиции"
SCT_minor_investments_desc: "Мы не можем развиваться, не вкладывая в экономику собственные средства. Для поддержания роста мы должны сначала стимулировать нашу экономику, сделав небольшие инвестиции."
SCT_foreign_cash: "Иностранные инвестиции"
SCT_foreign_cash_desc: "Потенциальные инвесторы есть везде, от Французской коммуны до Германской империи. Если мы сможем пообещать устойчивый экономический рост для этих инвесторов, то, несомненно, мы сможем кого-то привлечь."
SCT_agriculture: "Сосредоточиться на сельском хозяйстве"
SCT_agriculture_desc: "Хотя Британский Союз был достаточно самодостаточным, когда дело касалось продовольствия, Шотландия имеет лишь малую часть земель, которыми располагал Британский Союз, и поэтому ей необходимо стимулировать сельское хозяйство для развития устойчивого источника продовольствия."
SCT_fishing: "Расширить рыбную промышленность"
SCT_fishing_desc: "Шотландия занимает ключевое положение, контролируя рыбную промышленность Северного моря, и это открывает нам возможности не только кормить наших людей, но и получать прибыль от рыбной промышленности! Мы должны уделять этому больше внимания, чтобы доминировать в рыболовстве."
SCT_energy: "Развитие энергетики"
SCT_energy_desc: "Большая часть Шотландии всё ещё живёт в условиях недостатка электроэнергии, однако инвестиции в строительство плотин и разработку нефтяных месторождений легко решают эту проблему и делают Шотландию более энергетически независимой!"
SCT_new_docks: "Новые верфи"
SCT_new_docks_desc: "Для создания военного или рыболовного флота нельзя полностью полагаться на старые верфи, поэтому следует построить новые верфи для производства судов и обеспечения процветания."
SCT_reforged_economy: "Укрепление экономики"
SCT_reforged_economy_desc: "Шотландская экономика, хотя и не является огромной, но значительно выросла. Шотландцы живут, по большей части, без голода и нужды с большим комфортом, чем во времена Союза. Шотландия утвердила свою независимость не только в названии."
SCT_salvage_industry: "Спасение британской промышленности"
SCT_salvage_industry_desc: "Хотя в Союзе в значительной степени доминировала Англия, он дал Шотландии некоторое промышленное развитие. Мы должны работать над восстановлением промышленности, оставшейся после Союза, и использовать то, что мы можем, в качестве основы для нашей собственной промышленности."
SCT_industry_focus: "Сосредоточьтесь на промышленности"
SCT_industry_focus_desc: "Хотя от Союза осталась некоторая промышленность, для того чтобы Шотландия смогла продержаться в ближайшие годы и сохранить свою независимость, мы должны развивать промышленность и оставить позади наше аграрное прошлое."
SCT_radio: "Развитие радио"
SCT_radio_desc: "Радио не является новым изобретением, однако его военное применение всё ещё изучается. Мы должны изучить военное применение радио, а также его использование в более гражданских вопросах."
SCT_gun_factories: "Новые арсеналы"
SCT_gun_factories_desc: "Хотя некоторые утверждают, что мы должны сосредоточиться на собственной внутренней промышленности, чтобы сделать Шотландию комфортной для жизни, мы знаем, что если мы намерены оставаться независимыми, мы должны поддерживать большую военную промышленность любой ценой."
SCT_expand_docks: "Расширить верфи"
SCT_expand_docks_desc: "Наша армия сильна и растёт, однако, как островному государству, нам крайне необходимо иметь флот, способный защитить наши берега. Вместо того чтобы тратить деньги на новые дорогостоящие проекты, мы можем расширить существующие верфи."
SCT_smoky_cities: "Расширять промышленные центры"
SCT_smoky_cities_desc: "Наши города являются центром нашей экономики и уже являются домом для нашей бурно развивающейся промышленности. Вместо того чтобы тратить деньги на рискованные проекты в сельской местности, мы просто расширим существующие промышленные центры."
SCT_highland_industry: "Инвестировать в сельскую промышленность"
SCT_highland_industry_desc: "Промышленность должна быть ещё более рассредоточена. Очень неразумно сосредотачивать производство военных материалов в небольших районах, где они могут стать легкой мишенью для бомбардировок, мы должны переместить нашу промышленность в сельскую местность."
SCT_economic_boom: "Экономический бум"
SCT_economic_boom_desc: "Благодаря работе шотландского народа и разумным инвестициям, Шотландия стала не просто выживать, а процветать, и шотландский народ теперь живёт без особых проблем и забот. Рост оказался устойчивым, а сопротивление Шотландии - бесценным."

SCT_review_military: "Оценка вооружённых сил"
SCT_review_military_desc: "Шотландские военные преуспели в защите нашей родины. Но сейчас пришло время обратить внимание на вооруженные силы и решить, как двигаться дальше. Что мы будем делать с нашей армией?"

SCT_army_reform: "Шотландская национальная армия"
SCT_army_reform_desc: "Национальная армия будет защищать Шотландию от всех бед, с которыми мы сталкиваемся как нация. Она будет обеспечивать безопасность граждан страны в трудные времена."
SCT_embrace_innovation: "Принять инновации"
SCT_embrace_innovation_desc: "Оставаясь в прошлом, мы ничего не добьемся. Единственный способ для нас развиваться как нация - это развивать наши вооруженные силы."
SCT_cryptology: "Департамент криптологии"
SCT_cryptology_desc: "Обеспечение безопасности нашей системы связи является жизненно важным приоритетом для Шотландии. Используя криптографию, мы можем сделать связь и координацию для всех видов вооружённых сил действительно безопасными."
SCT_new_doctrines: "Новые доктрины"
SCT_new_doctrines_desc: "Старые способы ведения войны были глубоко ошибочными. Чтобы защитить нашу нацию, мы должны принять новые доктрины и стратегии. "
SCT_artillery_research: "Инвестировать в артиллерию"
SCT_artillery_research_desc: "Мы должны инвестировать в артиллерию. Большие пушки могут нанести гораздо больший ущерб, чем стандартные винтовки. И они лучше подходят для нашего сурового климата."
SCT_new_tanks: "Экспериментальные исследования танков"
SCT_new_tanks_desc: "Путь в будущее - это танки. Инвестиции в них отпугнут тех, кто хочет уничтожить Шотландию. "
SCT_first_academy: "Первая академия"
SCT_first_academy_desc: "Будут созданы школы, чтобы молодые и пожилые люди могли проявить талант к ведению войны всех видов."
SCT_shock_and_awe: "Шок и трепет"
SCT_shock_and_awe_desc: "Лучший способ отбиться от врагов - это парализовать их желание сражаться. Мы добьемся этого, используя подавляющую огневую мощь и быстрые демонстрации силы, чтобы показать своё превосходство. "
SCT_proven_methods: "Используйте проверенные идеи"
SCT_proven_methods_desc: "Если ничего не сломалось, зачем это исправлять? Используемые в настоящее время доктрины защищали Шотландию на протяжении 100 лет, не выходя из строя. Зачем что-то менять сейчас, эти идеи проверены временем."
SCT_old_ideas: "Старые идеи, новые учебники"
SCT_old_ideas_desc: "Старые идеи проверены временем, но никто не говорит, что они совершенны. Мы всё ещё можем реформировать их, и один из способов сделать это - создать новые учебники, отражающие время, в котором мы находимся."
SCT_anti_tank: "Противотанковые исследования"
SCT_anti_tank_desc: "Танки - оружие будущего, поэтому мы должны адаптироваться к этому, создавая противотанковое оружие, чтобы уничтожать бронированные мехи захватчиков."
SCT_trench_war: "Уроки Вельткрига"
SCT_trench_war_desc: "Мы знаем о Вельткриге, но что мы извлекли из него? Всего за пять лет конфликта погибло бесчисленное количество солдат, чтобы научить нас новой динамике ведения войны. Если мы не узнаем о них, то и наших солдат постигнет та же участь на поле боя."
SCT_emulate_foreign_strategy: "Подражать иностранным стратегиям"
SCT_emulate_foreign_strategy_desc: "Искусство войны было освоено другими на протяжении 100 лет. И если мы не в состоянии сформулировать стратегию самостоятельно, нам следует обратиться к другим для разработки стратегии обороны. "
SCT_hold_line: "Держать строй!"
SCT_hold_line_desc: "Все шотландцы должны выполнять свой долг! Мы не можем позволить линии сломаться и Шотландия падет, линия никогда не должна пасть или быть сломанной!"
SCT_reform_command: "Реформа верховного командования"
SCT_reform_command_desc: "Верховное командование Шотландии страдает от некомпетентности. Чтобы иметь действительно слаженную армию, мы должны иметь талантливый генеральный штаб, основанный на заслугах, а не на назначении.  "
SCT_political_officers: "Политические офицеры"
SCT_political_officers_desc: "Комиссары должны присутствовать в армии, чтобы обеспечить надлежащий надзор за армией и гарантировать, что военные контролируются и сдерживаются"
SCT_standard_guns: "Стандартизация оборудования"
SCT_standard_guns_desc: "В нашей нынешней ситуации в одной и той же армии используется множество различных видов оборудования. Чтобы решить эту проблему, нам необходимо обеспечить стандартизацию всего оборудования в армии."
SCT_army_research: "Отдел исследований и разработок армии"
SCT_army_research_desc: "Для дальнейшего развития исследований и разработок оборудования для нашей армии был создан отдел исследований и разработок, который будет координировать работу между отделами. "
SCT_highland_forts: "Укрепление горных районов"
SCT_highland_forts_desc: "Малонаселенное Шотландское нагорье - идеальное место для строительства укреплений. К тому же, местность плохо приспособлена для захватчиков. Так что, кажется, нет никаких недостатков в укреплении этой территории."
SCT_military_intelligence: "Создайте Бюро военной разведки"
SCT_military_intelligence_desc: "Военная разведка жизненно важна для выживания нации. Мы должны создать специальное отделение для сбора информации о наших врагах. "
SCT_bruce_spirit: "Дух Брюса"
SCT_bruce_spirit_desc: "Роберт Брюс привел Шотландию к победе. Он был талантливым воином, который в конечном итоге привел Шотландию к независимости против английской угрозы. Мы чтим его наследие и продолжаем жить его духом. И мы будем вспоминать его всякий раз, когда наши соседи с юга будут стучаться к нам. "
SCT_brave_scotland: "Храбрая Шотландия!"
SCT_brave_scotland_desc: "Шотландия, моя горная родина,\nВысоко пусть развеваются твои гордые штандарты,\nСтрана моих высоких стремлений,\nСтрана сияющей реки,\nСтрана моего сердца навеки,\nШотландия храбрая."

SCT_air_reform: "Реформа ВВС"
SCT_air_reform_desc: "Шотландское воздушное командование находится в плачевном состоянии. В воздухе витают вопросы о том, будет ли оно играть центральную или вспомогательную роль. Мы должны быстро решить, какую роль будут играть ВВС в вооружённых силах Шотландии."
SCT_close_air: "Шотландский ААК"
SCT_close_air_desc: "Воздушному корпусу не место в качестве независимого подразделения. Военно-воздушные силы должны оставаться в составе армии для улучшения координации."
SCT_strategic_bombing: "Независимые ВВС!"
SCT_strategic_bombing_desc: "Авиационный корпус должен быть независимым от вооружённых сил. Нахождение их в составе армии снижает предназначение ВВС. Воздух - это путь в будущее, поэтому мы должны относиться к ВВС с особым вниманием "
SCT_army_integration: "Интеграция армии"
SCT_army_integration_desc: "Армейский авиационный корпус должен быть полностью интегрирован в армию. Иметь их как нечто иное, чем армия армии, было бы излишне сложно. Это обеспечит централизацию и простоту действий между ними."
SCT_ground_support: "Роль поддержки"
SCT_ground_support_desc: "Роль поддержки лучше всего подходит для авиации. Небо необходимо контролировать, но не стоит иметь ВВС в качестве чего-то большего, чем поддержка армии."
SCT_better_coordination: "Координация между армией и авиацией"
SCT_better_coordination_desc: "Поскольку ВВС и армия находятся в одной ветви, возможна более тесная координация между ними. Это позволит армейским и военно-воздушным силам работать вместе, чтобы одерживать решающие победы. "
SCT_naval_bombers: "Шотландская военно-морская воздушная служба"
SCT_naval_bombers_desc: "Военно-воздушные силы не обязательно должны ограничиваться полетами над сушей. Моря - это широкие открытые равнины, где наши самолеты могут наносить разрушительные удары по вражеским кораблям."
SCT_carrier_fighters: "Переработать конструкцию военно-морских истребителей"
SCT_carrier_fighters_desc: "Основным направлением наших сил должна стать адаптация существующих конструкций. Текущие конструкции морских истребителей неработоспособны, поэтому мы должны улучшить и адаптировать их."
SCT_radar: "Эксперименты с радарами"
SCT_radar_desc: "Благодаря недавнему развитию технологий, мы нашли способ обнаруживать самолеты с помощью радиоволн. Эта технология имеет большой потенциал, и мы должны использовать её в полной мере. "
SCT_build_airports: "Строительство аэродромов"
SCT_build_airports_desc: "Создание больших аэропортов дорого и неудобно. Хорошим вариантом является строительство аэродромов - дешёвых небольших площадок, с которых самолеты могут взлетать и садиться."
SCT_paratroopers: "Эксперименты с парашютом"
SCT_paratroopers_desc: "Эксперименты с парашютами дали отличные результаты. Используя эти парашюты, мы можем успешно вторгаться в места, расположенные далеко от дома"
SCT_rain_hell: "Адский дождь"
SCT_rain_hell_desc: "Дождь Ада сверху уничтожит уважение врага, его инфраструктуру и его драгоценных солдат. Сверху наши бомбы будут далеко. Разрушая все на своем пути"
SCT_buy_fighters: "Купить истребители"
SCT_buy_fighters_desc: "В настоящее время наша нация не имеет возможности производить большое количество самолетов. Наш лучший вариант иметь значительные силы самолетов - это покупать самолеты у других стран."
SCT_cas_development: "Разработка легких бомбардировщиков"
SCT_cas_development_desc: "Легкие бомбардировщики как своего рода летающая артиллерия - лучший способ поддержки сухопутных операций со стороны ВВС. Вполне логично, что при создании современных ВВС мы сосредоточимся на этих средствах ближней авиационной поддержки."
SCT_night_raids: "Практика ночных миссий"
SCT_night_raids_desc: "В настоящее время большинство современных ВВС проводят воздушные миссии только днем. Большим преимуществом перед нашими врагами будет, если мы сможем проводить эти миссии в ночное время."
SCT_scots_in_the_skies: "Шотландцы в небе"
SCT_scots_in_the_skies_desc: "Великую нацию делают великой только великие армии. И один из ключевых моментов в создании великой армии - это наличие армии в воздухе, а это то, что есть у нас в Шотландии. Шотландцы в небе будут защищать нашу землю и наши моря от всех врагов. "

SCT_naval_reform: "Военно-морской флот Шотландии"
SCT_naval_reform_desc: "В настоящее время ВМС Шотландии состоят из переоборудованных гражданских судов и захваченных рыболовных траулеров с установленными на них 6-дюймовыми пушками. Чтобы защитить моря Шотландии, мы должны создать конкретный шотландский флот."
SCT_big_navy: "Великий флот"
SCT_big_navy_desc: "Наш флот должен стать величайшим из когда-либо существовавших. Могучие корабли будут выигрывать сражения в Северном море, от которых меньший флот мог бы только бежать."
SCT_coastal_navy: "Сосредоточиться на побережье"
SCT_coastal_navy_desc: "Побережье - одна из самых важных частей нации. Если позволить побережью пасть перед иностранными захватчиками, вся страна будет открыта для завоевания."
SCT_new_battleships: "Развитие линкоров"
SCT_new_battleships_desc: "Линкоры - короли открытого моря. Мы должны начать исследования новых моделей с большими орудиями и лучшей воздушной защитой."
SCT_big_fleet_doctrine: "Действующий флот"
SCT_big_fleet_doctrine_desc: "Поддерживая наш флот в рабочем состоянии, мы в конечном итоге победим врага; мы бы не дошли до этого, если бы наша гордая военно-морская традиция была фарсом!"
SCT_little_fleet_doctrine: "Загляните в море"
SCT_little_fleet_doctrine_desc: ""
SCT_buy_subs: "Купить подводные лодки"
SCT_buy_subs_desc: "Подводные лодки позволяют нам разрушать вражеские суда и тяжелые корабли. Мы должны приобрести флот подводных лодок для защиты наших вод."
SCT_merchant_marine: "Торговый флот Шотландии"
SCT_merchant_marine_desc: "Инвестиции в сильный военный флот будут напрасными. К моменту окончания военных действий наш флот всё ещё будет находиться в зачаточном состоянии. Вместо этого мы могли бы использовать это время для вложения значительных средств в наш торговый флот, чьи плавания могут напрямую повлиять на нашу международную торговлю и принести кругленькую прибыль."
SCT_protect_shipping: "Защитить судоходные пути"
SCT_protect_shipping_desc: "Хотя все наши воды имеют жизненно важное значение, одной из самых важных частей наших вод являются судоходные пути. Без них Шотландия не может функционировать "
SCT_protect_coast: "Защитить побережье"
SCT_protect_coast_desc: "Побережье - одна из самых важных частей нации. Если позволить побережью пасть перед иностранными захватчиками, вся страна будет открыта для завоевания."
SCT_new_shipyards: "Новые верфи"
SCT_new_shipyards_desc: "С появлением новой промышленности пришло время увеличить наши судостроительные мощности и способность содействовать торговле, жизненно важной для нашей промышленности. Эти совершенно новые верфи будут поддерживать наш флот и торговый флот, обеспечивая наше превосходство в Северном море над любыми потенциальными английскими завоевателями."
SCT_coastal_forts: "Укрепление побережья"
SCT_coastal_forts_desc: "Побережье - одна из самых важных частей нации. Если позволить побережью пасть перед иностранными захватчиками, то вся страна будет открыта для завоевания. Нам нужно укрепить береговые укрепления."
SCT_marines: "Шотландская морская пехота"
SCT_marines_desc: "Использование военно-морских сил для армейских операций часто было источником соперничества и разногласий. Создав независимую морскую пехоту, мы сможем обеспечить подготовку и развертывание специалистов по амфибийным операциям из флота и армии без помех со стороны мелких споров между другими родами войск"
SCT_carrier_experiments: "Эксперименты с авианосцами"
SCT_carrier_experiments_desc: "Авианосцы - это волна будущего. Мы должны инвестировать в их исследования и строительство, чтобы лучше проецировать военно-морскую мощь."
SCT_rule_waves: "Дальнейшее финансирование ВМС"
SCT_rule_waves_desc: "Военно-морской флот - одна из самых недофинансируемых частей современных вооружённых сил Шотландии. Военно-морской флот - одна из самых важных частей вооружённых сил, и мы должны направить на него больше средств."
SCT_scrap_program: "Свернуть программу"
SCT_scrap_program_desc: "Кораблестроительные программы не принесли никаких результатов и служат лишь для отвлечения наших средств. Пришло время отказаться от этой программы и перейти к чему-то другому. "
SCT_subsidize_shipyards: "Субсидировать судостроителей"
SCT_subsidize_shipyards_desc: "Мы не можем построить большое количество кораблей только своими силами. Мы должны субсидировать судостроительные компании, которые сделают это за нас."
SCT_invest_in_destroyers: "Инвестиция в исследования эсминцев"
SCT_invest_in_destroyers_desc: "Экранопланы жизненно важны для любого флота, как и корабли, специализирующиеся на противолодочной войне. К счастью, эсминцы прекрасно подходят для обеих целей и будут именно тем, что нам нужно для нашего военно-морского превосходства."
SCT_activate_island_bases: "Активировать островные базы"
SCT_activate_island_bases_desc: "Мы создали множество баз на отдаленных шотландских островах. Сейчас самое время начать действовать и использовать их."
SCT_keep_it_flexible: "Сохраняйте гибкость"
SCT_keep_it_flexible_desc: "Негибкие доктрины - это рецепт катастрофы. Гибкость позволит убедиться, что наш флот способен продолжать действовать в любой момент."
SCT_office_of_naval_intelligence: "Управление военно-морской разведки"
SCT_office_of_naval_intelligence_desc: "Сбор разведданных так же важен в военно-морском флоте, как и в армии. Мы должны создать службу военно-морской разведки для сбора военно-морской информации."
SCT_innovative_admirals: "Инновационные адмиралы"
SCT_innovative_admirals_desc: "Нам не нужны адмиралы, которые упрямы и отказываются идти на компромисс. Нам нужны гибкие адмиралы, готовые идти на компромисс и адаптироваться."
SCT_scotland_rules_the_waves: "Шотландия правит волнами"
SCT_scotland_rules_the_waves_desc: "В старые времена говорили, что Британия правит волнами. Что ж, те времена остались в прошлом. Шотландия теперь правит волнами, заполняя место, которое когда-то занимала Британия."

SCT_scotland_unshackled: "Шотландия без оков!"
SCT_scotland_unshackled_desc: "Пришло время снова сбросить английское иго. Слишком долго Шотландию угнетали, и Мосли со своими реформами стал последней каплей. Альба больше не будет страдать под английским сапогом!"
SCT_deal_with_the_devil: "Внешняя угроза"
SCT_deal_with_the_devil_desc: "Сейчас не время ввязываться в Гражданскую войну. Мы не будем делать открытые жесты в сторону синдикалистов, мы будем поддерживать статус-кво, пытаться сдержать стычки и сосредоточиться на угрозе, исходящей от британцев."
SCT_the_coup: "Защита тыла"
SCT_the_coup_desc: "Правительство синдикалистов - это пятно на истории Шотландии. Именно синдикалистская угроза привела нас сюда с самого начала, и именно она ввергнет нас ещё глубже в несчастье и хаос. Пришло время уничтожить их раз и навсегда."
SCT_purge_democrats: "Очистить демократов"
SCT_purge_democrats_desc: "Демократы выполнили свою задачу. Чтобы убедиться, что они больше не угрожают Шотландии, их лидеры и самые ярые сторонники будут уничтожены. То, что останется от них и от Родного Родины, будет использовано и поглощено нашим собственным командованием."
SCT_reach_out_to_france: "Обратиться к Франции"
SCT_reach_out_to_france_desc: "Французы умыли руки в этой борьбе, и хотя они не оказали нам никакой реальной поддержки, многие французы желают увидеть спины вероломных англо. Конечно, они скорее встанут на сторону истинной синдикалистской нации, чем на сторону британских предателей."
SCT_arm_refugees: "Вооружить беженцев"
SCT_arm_refugees_desc: "Многие беженцы, бежавшие от тирании Мосли, проявили готовность сражаться за свой новый дом. Уже формируются специальные батальоны, и эти люди окажутся полезными в борьбе против Англии."
SCT_manage_refugees: "Призыв к международным волонтерам"
SCT_manage_refugees_desc: "Для обеспечения независимости Шотландии необходимы международные волонтеры. И мы знаем несколько стран, которые с радостью готовы помочь в этом деле."
SCT_our_old_masters: "Наши истинные владыки"
SCT_our_old_masters_desc: "Британцы - наши старые хозяева. Именно они могут лучше всего помочь нам в трудную минуту."
SCT_consolidate_internal: "Внутренние альянсы"
SCT_consolidate_internal_desc: "Нам не нужна поддержка этих проклятых немцев или канадцев. Все, что нам нужно - это боевой дух каждого шотландца, и мы сможем это обеспечить."
SCT_appeal_to_germany: "Обратиться к Германии"
SCT_appeal_to_germany_desc: "Немцы - те, кто может лучше всего помочь Шотландии в это тяжелое время."

### Events ###

scotland.1.t: "Оценка экономики"
scotland.1.d: "После того как Шотландия была внезапно втянута в независимость, можно с уверенностью сказать, что наша экономика всё ещё молода, застойна и лишена направления. Хотя правительство уже утвердило планы, призванные хоть как-то сдвинуть экономику с места, нам предстоит решить, каким курсом идти дальше. Некоторые в правительстве утверждают, что нам следует обратиться к примеру крофтеров и аграрному прошлому Шотландии. Наше население невелико, и превращение Шотландии в житницу островов, безусловно, помогло бы смягчить эту проблему. Однако другие считают, что нам следует направить экономику к индустриализации."
scotland.1.a: "Аграрная реформа звучит как хорошая идея!"
scotland.1.b: "Сделать горы чёрными от смога - вот путь!"

scotland.2.t: "Покупка подводных лодок"
scotland.2.d: "Вместо того чтобы вкладываться в огромный флот, мы решили сосредоточиться на создании меньшего флота, основанного на подводных лодках. И вместо того чтобы обременять наших кораблестроителей, флот предложил закупать старые излишки. Хотя они устарели, они достанутся нам дёшево, и их можно будет легко переоборудовать и изучить, пока мы не научимся строить собственные."
scotland.2.a: "Мы не откажемся от хорошей сделки!"

scotland.3.t: "Бюджетные проблемы флота"
scotland.3.d: "Представители флота сообщили правительству, что расходы, вызванные программой морских инвестиций, достигли критической точки и больше не являются устойчивыми, после чего запросили спасение флота и увеличение финансирования. Хотя министерство финансов и армия выступают против любого увеличения бюджета, флот утверждает, что без этого возникнет серьёзная брешь в обороне."
scotland.3.a: "Мы не можем себе этого позволить, отказать в спасении."
scotland.3.b: "Это слишком опасно, предоставить спасение!"

scotland.4.t: "Флот восстанавливается"
scotland.4.d: "Хотя это было долго и болезненно, после различных мер по сокращению расходов и урезания морской программы бюджет флота снова оказался под контролем. Хотя флот больше никогда не будет рисковать банкротством, некоторые задаются вопросом, не была ли цена слишком высокой."
scotland.4.a: "Цена за стабильную экономику."

scotland.5.t: "Германия «просит» о реставрации"
scotland.5.d: "После того как Шотландия стала полностью независимой и вошла в Рейхспакт, германский посол запросил встречу с временным президентом Джоном Маккормиком. На встрече германская делегация изложила просьбу о якобитской реставрации короля Баварии Рупрехта на троне Шотландии с его сыном Генрихом в качестве регента. Якобитская монархия в Шотландии мертва уже веками, и для многих шотландцев сама мысль о таком возвращении в лучшем случае вызывает недоумение. Согласиться на такое предложение неизбежно опозорит правительство, но в то же время ясно, что немцы не примут отказа..."
scotland.5.a: "С неохотой согласиться."
scotland.5.b: "Сказать им, чтобы засунули это себе в задницу."

scotland.6.t: "Германия свергает правительство"
scotland.6.d: "Разозлённая отсутствием интереса к реставрации, Германия дала зелёный свет своим войскам на нашей земле на свержение временного правительства и установление Рупрехта как марионеточного короля. Теперь мы оказались глубоко под германским сапогом, и многие шотландцы задаются вопросом, что это будет означать для их страны."
scotland.6.a: "Да здравствует Король!"

scotland.7.t: "Канада «просит» о реставрации"
scotland.7.d: "После того как Шотландия стала полностью независимой и вошла в Антанту, канадский посол запросил встречу с временным президентом Джоном Маккормиком. На встрече канадская делегация изложила просьбу о полной реставрации короля [CAN.GetLeader] на троне, с включением Шотландии во временное британское правительство. Однако некоторые члены делегации намекнули, что согласились бы на реставрацию Униона Корон, по крайней мере до полного завоевания самой Британии. Вся делегация согласилась, что готова предоставить самоуправление после возвращения Британии. Согласиться на такое предложение неизбежно опозорит правительство, но в то же время ясно, что канадцы не примут отказа..."
scotland.7.a: "Только помягче, парни..."
scotland.7.b: "Мы уже однажды выгнали вашу шайку, сделаем это снова."

scotland.8.t: "Канада свергает правительство!"
scotland.8.d: "Как и ожидалось, канадские войска, размещённые в Шотландии, устроили переворот, арестовав Маккормика и распустив правительство при содействии большей части Консервативной и юнионистской партии. Теперь, когда Шотландия находится под британским контролем, мы должны решить, следует ли учредить британское временное правительство или шотландское государство под властью короля [CAN.GetLeader] и юнионистов."
scotland.8.a: "Усилить оккупационные власти!"
scotland.8.b: "Вознаградить юнионистов!"

scotland.9.t: "Временное правительство"
scotland.9.d: "Теперь, когда английское ярмо было свергнуто, Джон Маккормик передал власть гражданскому временному правительству, возглавляемому коалицией всех главных демократических партий, а также некоторыми представителями политической организации Дозора Родины - PNA. Заметно отсутствуют синдикалисты, которые на данный момент отказались участвовать. Выборы планируется провести как можно скорее, чтобы жизнь могла вернуться к нормальности."
scotland.9.a: "Благослови тебя, Джон!"

scotland.10.t: "Синдикалисты протестуют против правительства"
scotland.10.d: "Как и ожидалось, синдикалистский Шотландский конгресс тред-юнионов и связанная с ним Независимая лейбористская партия выступили против правительства. Лидер синдикалистов Вилли Галлахер произнёс пламенную речь в Глазго, обрушив презрение на Временное правительство и заявив, что оно является не более чем марионеткой Дозора. В заключительной части своей речи он призвал шотландских рабочих повсюду подняться и установить синдикалистское правительство."
scotland.10.a: "Перемирие мертво."

scotland.11.t: "Синдикалисты пытаются устроить переворот"
scotland.11.d: "Как мы и опасались, синдикалисты попытались свергнуть наше правительство. По всей стране объявлена всеобщая забастовка, а синдикалистские милиции начали открыто атаковать полицию и нашу молодую армию. Милиции в Эдинбурге готовы нанести удар, и если ничего не произойдёт, правительство падёт."
scotland.11.a: "Правительство рушится!"
scotland.11.b: "Призвать Дозор Родины!"
scotland.11.c: "Обратиться к шотландскому народу!"

scotland.12.t: "Прибыло подкрепление Дозора!"
scotland.12.d: "После отправки экстренного вызова Дозор Родины направил все усилия на борьбу с синдикалистами. При крупном столкновении в городах никто не может быть уверен, кто победит."
scotland.12.a: "Синдикалисты подавлены!"
scotland.12.b: "Синдикалисты отбили Дозор!"

scotland.13.t: "Что теперь?"
scotland.13.d: "После окончательного уничтожения синдикалистов Временное правительство в безопасности, по крайней мере пока. Без серьёзной оппозиции и при государстве, всё ещё ослабленном и потрясённом, многие высокопоставленные члены Дозора считают, что нужна твёрдая рука, пока Шотландия не будет готова к демократии."
scotland.13.a: "Дозор Родины свергает Временное правительство."
scotland.13.b: "Дозор Родины отступает."

scotland.14.t: "Синдикалисты сокрушают правительство"
scotland.14.d: "Поскольку лишь немногие шотландцы откликнулись на призыв, а Дозор слишком поздно сумел ответить, синдикалисты успешно уничтожили Временное правительство раз и навсегда, обеспечив, что мечта о социализме в Шотландии ещё не умерла."
scotland.14.a: "Ура...?"

scotland.15.t: "Демократы дают отпор!"
scotland.15.d: "Как раз когда синдикалистские милиции были готовы свергнуть правительство, тысячи шотландцев сформировали стихийные отряды и дали отпор синдикалистам во имя Временного правительства, а Дозор Родины успел вовремя предоставить подкрепления. Похоже, демократия в Шотландии ещё не мертва!"
scotland.15.a: "Ура!"

scotland.16.t: "Что делать с ковенантерами"
scotland.16.d: "Во время восстания правительство Дозора Родины очистило демократические элементы, обеспечив, что в грядущем мире Шотландия станет демократической, когда будет готова к такой свободе. Радикальные ультраправые ковенантеры помогли обеспечить победу, и теперь, когда мир достигнут, Дозор Родины не знает, что с ними делать."
scotland.16.a: "Очистить их, пока они не стали слишком сильны."
scotland.16.b: "Пока продолжать использовать их."

scotland.17.t: "Битва за Эдинбург"
scotland.17.d: "Похоже, решение Маккормика продолжать использовать ковенантеров было серьёзной ошибкой: они начали крупное нападение на базы Дозора Родины в Эдинбурге. Хотя они плохо оснащены, у них высокий боевой дух и свирепая воля к борьбе. По мере распространения слухов о том, что они обезглавливают и калечат всех, кого захватывают, дезертирство стало массовым, а подразделения Дозора Родины начали рассыпаться."
scotland.17.a: "Истинно богобоязненные люди побеждают в борьбе!"
scotland.17.b: "Маккормик собирает людей и отражает ковенантеров!"

scotland.18.t: "Выборы начинаются"
scotland.18.d: "Когда стабильность наконец возвращается в Шотландию, выборы готовы быть объявленными, вызывая большое волнение относительно будущего Шотландии. Несмотря на множество мелких партий, участвующих в гонке, большинство аналитиков видит её как борьбу между более либеральными и рыночно ориентированными Шотландскими демократами во главе с Филипом Керром, которые ведут кампанию на обещании вернуть либерализм в Шотландию как в общественной жизни, так и в экономике. Их главный соперник - Лейбористская партия [SocDem]. Хотя они не принимают синдикализм Союза Британии, они желают сохранить некоторые более умеренные синдикалистские меры и удержать Шотландию твёрдо слева, одновременно принимая демократию. Среди менее значительных участников Консервативная и юнионистская партия ведёт кампанию на схожей с Шотландскими демократами платформе, но с автономией для юнионистских районов. Партия крофтеров также вступила в гонку, обещая отменить жёсткую политику сельскохозяйственной коллективизации и вернуться к традиционным крофтерским практикам. Ни одна из этих двух партий, как ожидается, не победит самостоятельно из-за узкой базы поддержки, но обе могли бы сформировать коалицию с одной из крупных партий."
scotland.18.a: "Как ужасно волнительно!"

scotland.19.t: "Результаты объявлены!"
scotland.19.d: "Результаты объявлены, и это не лучшие новости ни для одной партии. Ни одна партия не смогла получить абсолютное большинство, и, похоже, им придётся сформировать коалицию с одной из малых партий. Решающим фактором, однако, является то, какая партия получила больше всего мест."
scotland.19.a: "Шотландские демократы получили больше всего мест!"
scotland.19.b: "Лейбористская партия получила больше всего мест!"

scotland.20.t: "Шотландские демократы ищут коалицию"
scotland.20.d: "Поскольку Шотландские демократы получили больше всего мест в парламенте, они начали искать партнёров по коалиции. Хотя некоторые малые партии пообещали поддержку, это в лучшем случае даёт лишь несколько мест, и демократам придётся добиваться союза либо с юнионистами, либо с крофтерами. Юнионисты - очевидный выбор, но они ясно дали понять, что их главным требованием будет безусловная автономия для юнионистов - горькая пилюля для многих националистов, опасающихся, что это разделит нацию. Другой вариант - Партия крофтеров, если переговоры с юнионистами провалятся, но они могут отказаться работать с пробизнесовыми демократами."
scotland.20.a: "Открыть переговоры с юнионистами."

scotland.21.t: "Переговоры начинаются"
scotland.21.d: "Филип Керр встретился с лидером юнионистов Тэмом Галбрейтом, чтобы начать обсуждение потенциальной коалиции. Галбрейт и юнионисты, как и ожидалось, настаивали на своём желании получить автономные зоны и общины для юнионистов, а некоторые даже предложили отдельный юнионистский парламент. Многие в Шотландских демократах скептически относятся к таким планам, и хотя все согласны, что юнионистов необходимо как-то учесть, эти предложения считаются слишком радикальными и дали бы юнионистам слишком много власти. Если мы уступим сейчас, это сломает тупик, но даст им огромную власть в правительстве. Некоторые сторонники предлагают прервать переговоры и попытаться работать с крофтерами."
scotland.21.a: "Согласиться на их требования."
scotland.21.b: "Настаивать на компромиссе."
scotland.21.c: "Выгнать Галбрейта и поговорить с крофтерами."

scotland.22.t: "Продвижение компромисса"
scotland.22.d: "Вместо того чтобы просто уступить юнионистам, демократы начали продвигать компромиссный вариант с некоторыми уступками уже сейчас, но с откладыванием разговоров о юнионистской автономии на будущее. Теперь всё зависит от юнионистов и от того, согласятся ли они на такое предложение."
scotland.22.a: "Довольно напряжённый момент..."

scotland.23.t: "Юнионисты согласились!"
scotland.23.d: "К большой радости, юнионисты согласились на компромисс, ограничив своё влияние в правительстве, но предоставив ценную поддержку и отложив ядовитый вопрос юнионистской автономии, по крайней мере пока."
scotland.23.a: "Ура!"

scotland.24.t: "Переговоры провалились"
scotland.24.d: "Как и ожидалось, переговоры рухнули: юнионисты были отстранены и обрушили презрение на Шотландских демократов, отказавшись работать с ними в ближайшем будущем. Начинается паника, и многие опасаются правительства меньшинства, хотя некоторые независимые политики предложили спасти коалицию, работая с Партией крофтеров."
scotland.24.a: "Сформировать правительство меньшинства."
scotland.24.b: "Попытаться поговорить с крофтерами."

scotland.25.t: "Юнионисты отказываются от компромисса"
scotland.25.d: "Юнионисты отказались от любого компромисса, ясно дав понять, что это их окончательное предложение и что они не примут ничего меньше того, что уже лежит на столе. Цена высока, и мы всегда можем согласиться за счёт поддержки среди националистов, хотя некоторые предлагают разорвать связи с юнионистами и попытаться работать с крофтерами или, возможно, сформировать правительство меньшинства."
scotland.25.a: "Уступить их требованиям."
scotland.25.b: "Выгнать их и сформировать правительство меньшинства."
scotland.25.c: "Попытаться заключить сделку с крофтерами."

scotland.26.t: "Крофтеры отказываются"
scotland.26.d: "Ссылаясь на нашу пробизнесовую политику, крофтеры отказали нам и исключили возможность работать с нами в ближайшем будущем. В сочетании с нашим отказом работать с юнионистами это означает, что у нас нет выбора, кроме как сформировать правительство меньшинства."
scotland.26.a: "Значит, правительство меньшинства."

scotland.27.t: "Крофтеры согласились"
scotland.27.d: "Удивительно, но крофтеры согласились начать с нами переговоры, хотя они ведут жёсткий торг. Они требуют субсидий для крофтеров и защиты от нашей политики жёсткой экономии, а также клянутся, что компромисса не будет. Мы могли бы сформировать правительство меньшинства, но это может плохо обернуться."
scotland.27.a: "Согласиться на их требования, это наш единственный вариант."
scotland.27.b: "Отказаться от их требований и сформировать правительство меньшинства."

scotland.28.t: "Лейбористская партия ищет коалицию"
scotland.28.d: "Поскольку Лейбористская партия получила больше всего мест в парламенте, она начала искать партнёров по коалиции. Хотя некоторые малые партии пообещали поддержку, это в лучшем случае даёт лишь несколько мест, и лейбористам придётся добиваться союза либо с юнионистами, либо с крофтерами. Крофтеры - очевидный выбор, но они ясно дали понять, что их главными требованиями будут субсидии для крофтеров и защита традиционного образа жизни, что в основном уже соответствует их экономической политике. Другой вариант - юнионисты, если переговоры с крофтерами провалятся, но они могут отказаться работать с социалистическими лейбористами."
scotland.28.a: "Открыть переговоры с крофтерами."

scotland.29.t: "Переговоры начинаются"
scotland.29.d: "Дженни Ли встретилась с лидером крофтеров Джин Манн, чтобы начать обсуждение потенциальной коалиции. Манн и крофтеры, как и ожидалось, настаивали на своём желании получить субсидии, защиту крофтерского образа жизни и продвижение гражданских прав женщин. Хотя это в целом соответствует собственной политике лейбористов, главные опасения заключаются в том, что крофтеры могут присвоить себе заслугу за эти меры и получить слишком много власти в правительстве. Некоторые более социально консервативные члены нашей партии также предложили смягчить вопрос прав женщин. Если мы уступим сейчас, это сломает тупик, но даст им огромную власть в правительстве. Некоторые сторонники предлагают прервать переговоры и попытаться работать с юнионистами."
scotland.29.a: "Согласиться на их требования."
scotland.29.b: "Настаивать на компромиссе."
scotland.29.c: "Выгнать Манн и поговорить с юнионистами."

scotland.30.t: "Продвижение компромисса"
scotland.30.d: "Вместо того чтобы просто уступить крофтерам, лейбористы начали продвигать компромиссный вариант с некоторыми уступками уже сейчас, но с откладыванием разговоров о правах женщин на будущее. Теперь всё зависит от крофтеров и от того, согласятся ли они на такое предложение."
scotland.30.a: "Довольно напряжённый момент..."

scotland.31.t: "Крофтеры согласились!"
scotland.31.d: "К большой радости, крофтеры согласились на компромисс, ограничив своё влияние в правительстве, но предоставив ценную поддержку и отложив вопрос прав женщин, по крайней мере пока."
scotland.31.a: "Ура!"

scotland.32.t: "Переговоры провалились"
scotland.32.d: "Как и ожидалось, переговоры рухнули: крофтеры были отстранены и обрушили презрение на Лейбористскую партию, отказавшись работать с ней в ближайшем будущем. Начинается паника, и многие опасаются правительства меньшинства, хотя некоторые независимые политики предложили спасти коалицию, работая с юнионистами."
scotland.32.a: "Сформировать правительство меньшинства."
scotland.32.b: "Попытаться заключить сделку с юнионистами."

scotland.33.t: "Крофтеры отказываются от компромисса"
scotland.33.d: "Крофтеры отказались от любого компромисса, ясно дав понять, что это их окончательное предложение и что они не примут ничего меньше того, что уже лежит на столе. Цена высока, и мы всегда можем согласиться за счёт поддержки среди наших более консервативных членов, хотя некоторые предлагают разорвать связи с крофтерами и попытаться работать с юнионистами или, возможно, сформировать правительство меньшинства."
scotland.33.a: "У нас нет выбора, согласиться на их требования."
scotland.33.b: "Выгнать их и сформировать правительство меньшинства."
scotland.33.c: "Выгнать их и попытаться заключить сделку с юнионистами."

scotland.34.t: "Юнионисты отказываются"
scotland.34.d: "Ссылаясь на нашу про-независимую политику, юнионисты отказали нам и исключили возможность работать с нами в ближайшем будущем. В сочетании с нашим отказом работать с крофтерами это означает, что у нас нет выбора, кроме как сформировать правительство меньшинства."
scotland.34.a: "Похоже, нам придётся сформировать правительство меньшинства."

scotland.35.t: "Юнионисты согласились"
scotland.35.d: "Удивительно, но юнионисты согласились начать с нами переговоры, хотя они ведут жёсткий торг. Они требуют автономии для юнионистов и возможности создать второй парламент, а также клянутся, что компромисса не будет. Мы могли бы сформировать правительство меньшинства, но это может плохо обернуться."
scotland.35.a: "Уступить их требованиям."
scotland.35.b: "Отказаться и сформировать правительство меньшинства."

scotland.36.t: "Что делать с синдикалистами"
scotland.36.d: "Синдикалисты всегда выступали против нашей власти и печально известны тем, что оспаривали Временное правительство. Хотя теперь с ними по большей части разобрались, их наследие сохраняется, и они всё ещё пользуются широкой поддержкой в городских районах. Поэтому мы должны решить, как поступить с оставшимися синдикалистами: через амнистию или жёсткие репрессии."
scotland.36.a: "Даровать амнистию."
scotland.36.b: "Начать подавление."

scotland.37.t: "Конец амнистии"
scotland.37.d: "Когда период амнистии наконец завершился, синдикалисты были мирно реинтегрированы в гражданское общество. Многие пришли к тому, чтобы принять, или по крайней мере терпеть, нашу власть, и синдикалистская угроза навсегда устранена."
scotland.37.a: "Надеюсь, это последние из них."

scotland.38.t: "Подавление начинается"
scotland.38.d: "Используя элементы полиции, армии и бывших сил Дозора Родины, мы начали жестокое подавление синдикалистских сил, начиная с наиболее населённых районов страны, таких как города Эдинбург и Глазго. Похоже, многие сторонники синдикалистов бегут на север, спасаясь от полиции, или на юг, в Союз Британии. Со временем мы наконец уничтожим красную угрозу."
scotland.38.a: "Стой на месте, синдикалистская мразь!"

scotland.39.t: "Подавление усиливается"
scotland.39.d: "По мере усиления подавления многие сторонники синдикалистов и их лидеры покинули самые городские районы, скрываясь в малых городах и деревнях, а в некоторых случаях переходя границу в Британию. Пока это лишь временная проблема, и хотя вопрос синдикалистов сохраняется, он является лишь мелкой неприятностью."
scotland.39.a: "Лучше пусть докучают англичанам, чем нам, а?"

scotland.40.t: "Охота в Хайленде"
scotland.40.d: "По мере того как синдикалистские рейды становятся всё интенсивнее, они теряют позиции по всей стране, а многие их сторонники арестованы или вовсе покинули страну. Те, кто остался, полностью оставили городские районы и юг, теперь уходя в северный Хайленд, чтобы вести партизанскую войну из гор. Их так мало, а население столь враждебно к ним, что недолго осталось до того, как уродливая голова синдикализма будет окончательно разбита."
scotland.40.a: "Знаешь, у холмов есть глаза..."

scotland.41.t: "Очищение Северных островов от синдикализма"
scotland.41.d: "Когда мы изначально отделились, Северные острова остались верны Британии, поскольку местные максимистские силовики смогли подавить любое недовольство. Это оставило прочное наследие синдикализма, и многие социалисты бегут на острова в надежде найти там убежище. Похоже, их конец близок."
scotland.41.a: "Отправить их в шетландский круиз."

scotland.42.t: "Конец подавления"
scotland.42.d: "В пыльном старом коттедже на побережье Шетланда лидер синдикалистов Вилли Галлахер смотрел на море. Он сам, лидер Независимой лейбористской партии Джеймс Макстон и немногие оставшиеся их сторонники оказались заперты на этом жалком острове, ожидая безопасного прохода на континент. Но прежде чем они смогли совершить это путешествие, коттедж был взят штурмом береговой охраной, и оба лидера были арестованы и отправлены на суд на материк. С захватом лидеров и сломленным синдикалистским духом мы наконец преодолели красную угрозу."
scotland.42.a: "Ура!"

scotland.43.t: "Реформа избирательной системы"
scotland.43.d: "Нынешняя система приходов и городов Шотландии происходит из крайне устаревшего взгляда на страну и была сформирована, когда мы трудились под английским ярмом. Парламент только что принял законопроект о реформе этой старой системы путём перехода к новой трёхуровневой системе советов графств, бургов и регионов. Создана более демократичная и подотчётная система, и шотландцы повсюду приветствуют свою демократию."
scotland.43.a: "Чертовски хорошо, парни!"

scotland.44.t: "Что делать с Дозором Родины"
scotland.44.d: "Дозор Родины - аномалия в Шотландии. Хотя они помогли отбиться от британцев и защитили нашу демократию от синдикалистов, многие из их членов выступают за авторитарное правление в Шотландии, и порой ходят слухи о готовящемся перевороте. Хотя публичное лицо Дозора, Джон Маккормик, твёрдо настаивает, что их долг - перед шотландским народом и, следовательно, перед шотландской демократией, демократы, естественно, скептичны. Это также создаёт серьёзные проблемы, поскольку парамилитарной группе позволено свободно бродить по стране. Хотя они действительно оказывают определённую услугу, их воспринимают как вполне реальную угрозу нашей демократии. Некоторые предлагают использовать их, тогда как другие считают, что мы должны их устранить."
scotland.44.a: "Использовать их, они могут пригодиться позже..."
scotland.44.b: "Распустить их, они выполнили своё предназначение."

scotland.45.t: "Борьба с сектантской рознью"
scotland.45.d: "Как и в Ирландии, сектантская рознь между католиками и протестантами давно мучает нашу нацию. Ещё хуже то, что расколы между самими протестантами обычны, а сектантское насилие часто преодолевало религиозные и политические границы, печально известным образом проникая даже в футбольное соперничество. Хотя эту проблему нелегко решить, нынешнее правительство проводит политику примирения расколов и объединения нации за пределами одной лишь религии."
scotland.45.a: "В небе всё тот же парень, а?"

scotland.46.t: "Переговоры с юнионистами"
scotland.46.d: "Начались переговоры с юнионистами, чтобы попытаться лучше учесть их место в нации. Хотя некоторые из их требований были признаны нелепыми, многие готовы работать с новым государством и приняли маловероятность возвращения к жизни под властью короля Соединённого Королевства. Хотя переговоры, вероятно, будут трудными и долгими, компромисс станет ключом к удовлетворению всех."
scotland.46.a: "Компромисс в политике - это искусство."

scotland.47.t: "Юнионисты согласились!"
scotland.47.d: "Переговоры увенчались успехом, и хотя были некоторые ворчания по поводу новых выгод, предоставленных юнионистам, все довольны результатом, и они готовы работать и принять новое государство. Хотя некоторые экстремисты никогда не примут шотландское правление, многие наконец признают политическую реальность, и юнионистский вопрос решён."
scotland.47.a: "Прекрасные новости!"

scotland.48.t: "Юнионисты тянут время"
scotland.48.d: "Юнионисты медленно отвечают и, похоже, затягивают переговоры, часто выдвигая нелепые требования и временами угрожая уйти. Хотя ясно, что даже они не ожидают исполнения своих требований, это снижает боевой дух нашей переговорной команды, многие члены которой больше не видят смысла пытаться работать с юнионистами."
scotland.48.a: "Ну же, парни, нельзя сдаваться!"

scotland.49.t: "Соглашение достигнуто!"
scotland.49.d: "Переговоры увенчались успехом, и хотя было много ворчания по поводу новых выгод, предоставленных юнионистам, все довольны результатом, и они готовы работать и принять новое государство. Хотя некоторые экстремисты никогда не примут шотландское правление, многие наконец признают политическую реальность, и юнионистский вопрос решён."
scotland.49.a: "В конце концов мы справились!"

scotland.50.t: "Переговоры срываются"
scotland.50.d: "При малом продвижении с обеих сторон худшее стало явью: юнионисты покинули переговоры, сочтя их бессмысленными. Наши собственные сторонники также видят мало причин продолжать, и общее чувство враждебности с обеих сторон быстро растёт."
scotland.50.a: "Разве мы все не можем просто ужиться?"

scotland.51.t: "Соглашение спасено!"
scotland.51.d: "Хотя это и не особенно идеально, поскольку нам пришлось прогнуться перед юнионистами, переговоры были спасены, и соглашение достигнуто. Хотя наши собственные сторонники не особенно довольны выгодами, которые теперь получили юнионисты, мы смогли избежать крупного политического кризиса."
scotland.51.a: "Лучше, чем гражданская война!"

scotland.52.t: "Юнионистская напряжённость разгорается"
scotland.52.d: "С провалом переговоров юнионистская напряжённость разгорелась: между юнионистами и националистами идут открытые столкновения, а некоторые более крайние элементы призывают к открытому восстанию. Депутаты-юнионисты угрожают покинуть парламент, а враждебность между юнионистами и националистами достигла невиданного уровня. Хотя гражданская война маловероятна, эта напряжённость не исчезнет ещё очень, очень долго."
scotland.52.a: "Чёрт побери, парни, вы все не можете успокоиться?"

scotland.53.t: "Протест юнионистов заканчивается насилием"
scotland.53.d: "Ещё один юнионистский протест против националистического правительства закончился насилием после того, как националисты прибыли провести контрпротест. Несмотря на все усилия полиции удержать две стороны разделёнными, всё в итоге вылилось в насилие и переросло в крупную потасовку. Хотя никто, вероятно, не погиб, многие были ранены и госпитализированы, а юнионисты используют это против нашего правительства, ещё больше осложняя отношения."
scotland.53.a: "Разве мы все не можем просто ужиться?"

scotland.54.t: "Правление Дозора"
scotland.54.d: "Демократия в конечном счёте является целью многих членов Дозора, и лидеры Дозора знают, что она хороша для Шотландии. Но если восстание чему-то нас научило, так это тому, что Шотландия не готова к демократии, по крайней мере пока. Английская тирания просочилась в самую сердцевину, а демократы не знают, как править железной рукой, когда это необходимо. Призрак синдикализма всё ещё преследует Шотландию, и пока все угрозы нашему новому государству не будут уничтожены, демократии быть не может."
scotland.54.a: "Да здравствует президент Маккормик!"

scotland.55.t: "Что делать с парламентом"
scotland.55.d: "Шотландия не является полной диктатурой. Временный парламент был учреждён, когда мы отделились, с планами провести выборы после обретения независимости. Хотя это в конечном счёте входит в наши долгосрочные цели, пока парламенту будет позволено существовать, пусть и беззубым и неспособным действительно влиять на политику, пока мы не решим, что парламент готов быть достойным своего имени."
scotland.55.a: "Направляемая демократия всё ещё демократия."

scotland.56.t: "Реформа системы образования"
scotland.56.d: "Один из более амбициозных планов нового шотландского государства под управлением Дозора - возрождение шотландских традиций и культуры. Слишком долго Англия вытесняла наши древние обычаи и заставляла нас ассимилироваться в её собственные порядки. Если детей будут учить истинной шотландской истории, мы продвинем национальное возрождение шотландской культуры и языка."
scotland.56.a: "Новые учебники для всех!"

scotland.57.t: "Возрождение шотландского языка"
scotland.57.d: "Со временем традиционный шотландский язык медленно угасал, будучи оттеснён к изолированным носителям в Лоуленде, тогда как Шотландия в целом англизировалась извне, что вело к медленной смерти нашего древнего языка. Один из более амбициозных планов Дозора Родины - возрождение шотландского языка. Хотя он и близко не достиг уровня распространённости английского, язык растёт: многие шотландцы изучают его как второй язык, и он постепенно входит в повседневную жизнь."
scotland.57.a: "An-asgaidh aon uair eile!"

scotland.58.t: "Введение военного положения"
scotland.58.d: "Наш приход к власти не был особенно упорядоченным, и многие противники режима среди демократов, синдикалистов и ковенантеров всё ещё ходят на свободе, открыто агитируя против нашего режима. Большая часть Дозора согласна, что мы должны продолжать править напрямую через военное крыло Дозора и ввести военное положение, чтобы лучше укрепить наш режим. Однако некоторые более либеральные элементы Дозора считают, что мы должны сохранить гражданское право и начать править через гражданское крыло Дозора."
scotland.58.a: "Ввести военное положение!"
scotland.58.b: "Перейти к гражданской администрации."

scotland.59.t: "Военное положение даёт результаты!"
scotland.59.d: "Наша новая политика военного положения приносит хорошие результаты. Значительная часть оппозиции нашей власти была заставлена замолчать, а мерзкие социалистические протесты подавлены, прокладывая путь к их окончательному уничтожению. По всей стране враги Шотландии боятся возмездия железного кулака. Хотя умеренные внутри Дозора тревожатся о долгосрочных последствиях для Шотландии, мы знаем, что это досадная необходимость."
scotland.59.a: "Стой на месте, преступная мразь!"

scotland.60.t: "Конец военного положения?"
scotland.60.d: "Наша политика военного положения оказалась чрезвычайно успешной, приведя к аресту многих врагов государства в особых судах, управляемых Дозором. Поскольку многие из этих врагов находятся в тюрьме или мертвы, некоторые в Дозоре считают, что настало время отменить репрессивные меры и проложить путь к демократическому правлению в будущем. Однако другие члены Дозора считают, что отмена сейчас лишь усилит наших врагов."
scotland.60.a: "Отменить военное положение!"
scotland.60.b: "Оставить его в силе."

scotland.61.t: "Переход к гражданскому правительству"
scotland.61.d: "В споре о военном положении более умеренные элементы Дозора одержали верх над более экстремистскими элементами. При отсутствии военного положения президент Маккормик согласился перейти к гражданской администрации, где политическое крыло Дозора, Национальная партия Шотландии, возьмёт власть до проведения выборов. Хотя это не переход к демократии - далеко нет, - это всё же показывает изменение настроений в руководстве Дозора."
scotland.61.a: "Лучше начать кампанию!"

scotland.62.t: "«Выборы»"
scotland.62.d: "После недавнего перехода от военного правительства гражданское крыло Дозора Родины распорядилось провести новые выборы. Было введено множество практик, чтобы обеспечить PNA крупную победу. Джон Маккормик выступил с речью в парламенте, объявив, что уходит в отставку. Несмотря на это, все лидеры партий умоляли его остаться как истинного защитника Шотландии. «С неохотой» Маккормик согласился остаться."
scotland.62.a: "Ну что ж, если вы настаиваете..."

scotland.63.t: "Единство через веру"
scotland.63.d: "Один из самых насущных вопросов, стоящих перед Шотландией, - сектантская рознь, мучающая нацию. Эта рознь заразила все элементы шотландского общества, печально известным образом проникнув даже в футбольные соперничества. Хотя простого решения нет, президент Маккормик, сам будучи набожным христианином, объехал различные протестантские и католические церкви по всей стране, продвигая религиозный мир между конфессиями и единство новой шотландской нации."
scotland.63.a: "Он одно из Божьих чад!"

scotland.64.t: "Вопрос крофтеров"
scotland.64.d: "Крофтинг - полуколлективный способ ведения сельского хозяйства, впервые развитый шотландцами в горах Хайленда и являющийся важной частью нашей истории. При Союзе британцы изо всех сил пытались уничтожить крофтеров и полностью коллективизировать сельское хозяйство. С нашими недавними разработками в хайлендских регионах многие протестуют против наших планов и требуют, чтобы мы поддержали их образ жизни. Хотя поддержка их повредит нашим жилищным планам, отказ от поддержки противоречил бы нашему духу."
scotland.64.a: "Принудительно поселить их в новых городах."
scotland.64.b: "Переселить их в города, но позволить сохранить их практики."

scotland.65.t: "Пророгация парламента"
scotland.65.d: "Хотя демократия является долгосрочной целью правительства Дозора, она, кажется, с каждым днём отдаляется всё дальше. Многие члены Дозора приняли, что демократия может никогда не прийти в Шотландию, тогда как другие считают, что этот период политической опеки ещё не готов завершиться. Как бы там ни было, диктатура Дозора была централизована ещё сильнее, а военное положение сделано бессрочным. В великой речи перед шотландским парламентом Джон Маккормик объявил, что парламент должен быть пророгирован sine die, как и первоначальный шотландский парламент, под громовые аплодисменты."
scotland.65.a: "Да здравствует президент Маккормик!"

scotland.66.t: "Восстановление демократии"
scotland.66.d: "В неожиданном обращении к парламенту президент Маккормик объявил, что тот должен быть пророгирован. Многие парламентарии опасались, что этот день наступит, и были готовы покинуть свои места в последний раз, прежде чем Маккормик объявил о планах провести досрочные выборы и полностью восстановить демократию. Под громовые аплодисменты парламент был пророгирован, и по всей стране шотландцы плачут от радости, когда свет демократии снова сияет над нашей нацией."
scotland.66.a: "Мечта достигнута..."

scotland.67.t: "Выборы"
scotland.67.d: "Выборы наконец наступили, и вокруг царит большое волнение! Фаворитами являются Джон Маккормик и его социально-консервативная Национальная шотландская партия, соревнующаяся с Филипом Керром и его Шотландскими демократами. Слева им обоим составляют серьёзную конкуренцию Партия крофтеров Джин Манн и Лейбористская партия Дженни Ли. По мере поступления результатов победителем становится..."
scotland.67.a: "NSP и Джон Маккормик!"
scotland.67.b: "Шотландские демократы и Филип Керр!"
scotland.67.c: "Партия крофтеров и Джин Манн!"
scotland.67.e: "Лейбористская партия и Дженни Ли!"

scotland.68.t: "Виндзорская реставрация"
scotland.68.d: "Юнион Джек гордо реет над Балморалом, пока юнионисты и роялисты по всей стране празднуют возвращение законного короля на трон. Однако не всё хорошо, поскольку противники слева и справа агитируют за республиканское дело, утверждая, что Шотландия является лишь плацдармом для британцев. Но наш Король выдержит, и вскоре он будет коронован в Вестминстере!" 
scotland.68.a: "Ох, какой он очаровательный!"

scotland.69.t: "Коронация"
scotland.69.d: "С избытком пышности и фанфар [CAN.GetLeader] был коронован как король [CAN.GetLeader] II в Эдинбургском замке представителями Церкви Шотландии, прежде чем официально открыть парламент и передать власть премьер-министру и фактическому генерал-губернатору Тэму Галбрейту из Консервативной и юнионистской партии. Шотландия пойдёт вперёд, вновь как братья с англичанами!"
scotland.69.a: "Да здравствует Король!"
scotland.69.b: "Да здравствуют Король и генерал-губернатор!"

scotland.70.t: "Возрождение шотландской культуры"
scotland.70.d: "Теперь, когда мы снова стали королевством, появились призывы к возрождению традиционной шотландской культуры с возвращением крофтинга и поощрением шотландского языка. Хотя националисты горячо поддерживают такое возрождение, англофильские элементы нашего правительства считают, что нам не следует преследовать столь возвышенные амбиции, а вместо этого нужно поддерживать статус-кво, облегчая отношения с нашими англо-канадскими покровителями."
scotland.70.a: "Согласиться с предложениями!"
scotland.70.b: "Отказаться от предложений."

scotland.71.t: "Культурные программы приносят плоды!"
scotland.71.d: "Похоже, наши усилия по вложению средств в культурные программы принесли много хороших плодов, и наиболее высоко оцениваемой мерой программы стало более широкое использование шотландского языка в повседневной жизни. Хотя впереди ещё долгий путь, многие националисты рады видеть, что мы серьёзно отнеслись к их заботам, и, похоже, в будущем они будут доставлять меньше хлопот."
scotland.71.a: "Прекрасные новости!"

scotland.72.t: "Положение парламента"
scotland.72.d: "Хотя все согласны, что новое Шотландское королевство будет демократией, в отличие от первоначального королевства, есть некоторые споры о том, каким должно быть положение парламента и где должна находиться исполнительная власть. Некоторые юнионисты утверждают, что должность премьер-министра следует усилить и сформировать правительство в более американском стиле, тогда как большинство партий желает видеть парламентскую демократию, какой была демократия старого Соединённого Королевства."
scotland.72.a: "Усилить премьер-министра!"
scotland.72.b: "Усилить парламент!"

scotland.73.t: "Временное правительство"
scotland.73.d: "После повторной ратификации Союза парламентов и восстановления короля [CAN.GetLeader] на троне Соединённого Королевства Бернард Монтгомери был назначен генерал-губернатором Временного правительства. При его широких полномочиях среди шотландцев много недовольства, и крики о том, что Шотландия - не более чем прославленный плацдарм, не являются редкостью. Тем не менее Монтгомери пообещал править справедливо, одновременно гарантируя, что ничто теперь не помешает вернуть Союз."
scotland.73.a: "Благослови тебя, Монти!"

scotland.74.t: "Полномочия губернатора"
scotland.74.d: "В настоящее время генерал-губернатор Монтгомери обладает широкими и фактически диктаторскими полномочиями от имени военного правительства. Это разгневало демократов, и многие шотландцы желают возвращения демократии, которой они пользовались при Соединённом Королевстве. Хотя столь ранняя передача власти парламентской системе была бы ужасной идеей, велись разговоры о создании Исполнительного комитета, который заменил бы генерала хотя бы с некоторыми демократическими элементами. Напротив, военный режим желает сохранить статус-кво и провести чистку подрывных элементов."
scotland.74.a: "Сохранить статус-кво."
scotland.74.b: "Учредить Исполнительный комитет!"

scotland.75.t: "Интеграция экономики"
scotland.75.d: "Поскольку Шотландия вскоре снова присоединится к Великобритании, необходимо провести политику быстрой десиндикализации, а также подготовить Шотландию к возвращению в более широкую британскую экономику. Более медленная интеграция будет относительно безболезненной, но даст меньше результатов, тогда как более быстрая интеграция будет болезненнее, но принесёт значительно лучшие плоды."
scotland.75.a: "Двигаться медленно."
scotland.75.b: "Полный ход вперёд!"

scotland.76.t: "Выборы"
scotland.76.d: "Первые выборы независимого Королевства Шотландия принесли подавляющую победу Тэму Галбрейту и Консервативной и юнионистской партии. В отличие от тех, кто хотел бы разорвать Шотландию мелким национализмом и развращающими пороками социализма, консерваторы и юнионисты являются истинно шотландской партией, представляющей этот прекрасный народ и борющейся за эту прекрасную землю. Тост за наших славных лидеров!"
scotland.76.a: "Поздравляем с победой, парни!"

scotland.77.t: "Вторжение в Британию"
scotland.77.d: "Пришло время вернуть право по рождению и отвоевать Британию раз и навсегда. Форты укомплектованы, окопы вырыты, а люди готовы. Остаётся лишь дать сигнал к вторжению."
scotland.77.a: "За Короля и страну!"
scotland.77.b: "Отложить планы до следующего года."
scotland.77.c: "Отложить планы до следующего месяца."

scotland.78.t: "Вторжение в Британию"
scotland.78.d: "Пришло время вернуть право по рождению и отвоевать Британию раз и навсегда. Форты укомплектованы, окопы вырыты, а люди готовы. Остаётся лишь дать сигнал к вторжению."
scotland.78.a: "За Короля и страну!"
scotland.78.b: "Отложить планы до следующего месяца."

scotland.79.t: "Вторжение в Британию"
scotland.79.d: "Пришло время вернуть право по рождению и отвоевать Британию раз и навсегда. Форты укомплектованы, окопы вырыты, а люди готовы. Остаётся лишь дать сигнал к вторжению."
scotland.79.a: "За Короля и страну!"
scotland.79.b: "Отложить планы до следующей недели."

scotland.80.t: "Вторжение в Британию"
scotland.80.d: "Пришло время вернуть право по рождению и отвоевать Британию раз и навсегда. Форты укомплектованы, окопы вырыты, а люди готовы. Остаётся лишь дать сигнал к вторжению."
scotland.80.a: "За Короля и страну!"

scotland.81.t: "Вторжение в Британию начинается!"
scotland.81.d: "Вторжение на материковую Британию началось, и пришло время вернуть право по рождению. Все добрые шотландцы, беритесь за оружие и сражайтесь, чтобы вернуть то, что по праву принадлежит нам!"
scotland.81.a: "За Короля и страну!"

scotland.82.t: "Возвышение ковенантеров"
scotland.82.d: "Это считалось немыслимым, но ковенантеры правят Шотландией! На протяжении большей части своего существования они были оттеснены на окраины политики и преследовались до самых краёв королевства в годы британского социалистического вмешательства. Но теперь преподобный доктор Джон Уайт правит Шотландией по мандату Бога. Выступая в центре Эдинбурга, преподобный доктор Уайт провозгласил священную победу над Дозором. Хотя он был необходим во время восстания, он давно пережил свою пользу, а потому, как и все прочие враги Бога, будет предан мечу. Однако один из самых насущных вопросов в умах всех ковенантеров - как Шотландия должна смотреть на мир. Преобладающее мнение состоит в том, что нация должна обратиться внутрь и строить ковенантерское богословие в одной стране, сохраняя его для Избранного народа. Небольшая, но быстро растущая альтернатива - стремительно выйти на мировую сцену и найти союзников среди протестантов по всему миру."
scotland.82.a: "Сосредоточиться на внутренних вопросах."
scotland.82.b: "Обратить взгляд к миру."

scotland.83.t: "Великий крестовый поход"
scotland.83.d: "Хотя мы решили, как должно исповедоваться наше ковенантерское богословие, остаётся вопрос сектантской розни, мучающей нашу нацию. Католики, евреи, гомосексуалы, юнионисты, атеисты, социалисты и секуляристы - все они населяют эту прекрасную землю. Все они еретики, плюющие на само имя Бога. Первый из многих Божественных приказов, изданных Верховным старейшиной преподобным доктором Уайтом, откроет врата чистого гнева, который обрушится на врагов Бога и Шотландии. Теперь начинается Великий крестовый поход!"
scotland.83.a: "Alba gu bràth!"

scotland.84.t: "Бюро церковных и еретических дел"
scotland.84.d: "Чтобы гарантировать, что Шотландия следует истинному пути Бога, и защитить нацию от папизма и еретиков, Верховный старейшина преподобный доктор Уайт учредил Бюро церковных и еретических дел, часто именуемое БЦЕД. Бюро будет следить за всеми преступлениями против Бога, такими как ересь, атеизм, верность Папе и любые другие преступления, которые могут угрожать святости государства. Хотя критики называют его тайной полицией, добрые богобоязненные шотландцы повсюду знают, что оно необходимо в борьбе против папизма."
scotland.84.a: "Стой на месте, еретическая мразь!"

scotland.85.t: "Сожжение главного управления"
scotland.85.d: "Среди ночи мерзкие злоумышленники обрушили поток огня на главное управление Бюро церковных и еретических дел. Пожарная команда всю ночь пыталась потушить гигантское пламя, пока полиция опрашивала жителей в поисках свидетелей саботажников. Похоже, обе попытки были напрасны: никаких имён не появилось, а к утру здание представляло собой не более чем обугленные останки. Хотя Бюро переместилось в другое место, немедленно началось расследование, и было установлено, что агенты Папы, опасаясь подъёма Шотландии, сговорились уничтожить нас изнутри. С одобрения высших уровней правительства расследование полного масштаба Папского заговора уже начато. Кто знает, какие ужасы они обнаружат..."
scotland.85.a: "Все враги Шотландии будут преданы мечу."

scotland.86.t: "Расследование начинается"
scotland.86.d: "Бюро начало расследование Папского заговора. Хотя всё ещё находится на ранних стадиях, они утверждают, что оно принесёт очень многообещающие результаты, хотя многие священники беспокоятся, насколько глубоко уходит кроличья нора и сколько это будет стоить. Разумеется, расследование ведётся не только ради блага Шотландии, но и всего мира. Сама судьба протестантизма может лежать на плечах Бюро - или, по крайней мере, так они говорят."
scotland.86.a: "С Богом, парни!"

scotland.87.t: "Расследование приносит плоды"
scotland.87.d: "После почти месяца молчания расследование наконец принесло плоды. Выступая перед Великим дознанием, собранием всех министров Шотландии, ведущие следователи объяснили свои последние выводы и то, кто виновен в сожжении главного управления..."
scotland.87.a: "Расследование настолько засекречено, что его нужно уничтожить и никогда больше не упоминать!"
scotland.87.b: "Ирландия, клиентское государство Ада!"
scotland.87.c: "Сам Папа!"

scotland.88.t: "Расследование заканчивается"
scotland.88.d: "По словам ведущих следователей, расследование на самом деле настолько секретно, что все связанные с ним документы должны быть уничтожены и никогда больше не упоминаться. Под громовой гнев и крики о мерзости они наконец уступили и объяснили, что за поджогом на самом деле стояла еврейская британская католическая синдикалистская гомосексуальная элита из Лондона, а все нападавшие были убиты. Это мало успокоило растущий гнев среди духовенства, утверждавшего, что это «объяснение» было придумано на ходу и что комиссия ничего не добилась. Похоже, даже сам преподобный доктор Джон Уайт счёл это объяснение слишком глупым, приказал казнить следователей и заменить их. Несмотря на это, нация взорвалась огромным гневом из-за расточительного расследования."
scotland.88.a: "Это... было странно..."

scotland.89.t: "Виноваты ирландцы"
scotland.89.d: "К большому удивлению, похоже, за поджогом стояло не само Папство, а ирландцы! Известные своей пламенной преданностью Папе и неистовым преследованием протестантов, ирландцы являются естественными врагами Шотландии. Как провозглашено в докладе, похоже, они ещё хуже, чем мы думали! Сама Ирландия является ложной конструкцией, впервые созданной как клиентское государство Ада на земле. Хотя утверждения о том, что под Дойлом находится портал в Ад, пока не подтверждены, и многие представители духовенства, включая самого преподобного доктора Уайта, считают всё это несколько слишком нелепым, было решено, что Ирландия - враг Шотландии, а значит, любые действия против неё совершаются ради общего блага."
scotland.89.a: "Начать допрос заключённых!"
scotland.89.b: "Послать агентов раскрыть заговор!"

scotland.90.t: "Открытие лагерей"
scotland.90.d: "Когда мы впервые пришли к власти, большая часть католического духовенства Шотландии была немедленно отправлена в концентрационные лагеря, чтобы трудиться там до самого своего пути в Ад. Похоже, это была очень хорошая идея, поскольку членов комиссии начали допрашивать, чтобы выяснить, насколько глубоко уходит кроличья нора этого заговора. Хотя немногие из них имеют реальную связь с Ирландией, если они хотят спасти свои жизни, им лучше заговорить и выложить все подробности злодеяний, совершённых ирландцами."
scotland.90.a: "Лучше им всё выложить..."

scotland.91.t: "Допросы приносят плоды"
scotland.91.d: "Как и ожидалось, священники оказались более чем готовы предать своих собратьев и признались во всевозможных мрачных и развратных деяниях. Похоже, портал в Ад под Дойлом действительно существует, а Майкл Коллинз является демоном в человеческом обличье и регулярно совершает гомосексуальные и еретические деяния. Хотя многие задаются вопросом, не являются ли это лишь ложью отчаявшихся людей, подвергнутых пыткам, для комиссии это кажется достаточным доказательством, и она попросила Верховного старейшину провести публичные показательные процессы перед Великим дознанием."
scotland.91.a: "Созвать заседание Дознания!"
scotland.91.b: "Пока этого достаточно."

scotland.92.t: "Показательные процессы начинаются"
scotland.92.d: "Когда следствие вновь предстало перед Великим дознанием, теперь наполненным простолюдинами, жаждущими услышать о преступлениях Папства, многие священники католической веры были приведены перед полный гнев Божий. Дни сменялись ночами, пока зачитывались бесконечные обвинения, и каждый священник полностью признавался во всём предъявленном ему списке преступлений. Народный гнев против заговора достигает невиданных высот, а подозреваемых католиков, которые могли скрывать свою веру, убивают на улицах. Многие требуют, чтобы комиссия ушла в отставку, но она утверждает, что у неё есть ещё больше открытий."
scotland.92.a: "Что у вас ещё есть?"
scotland.92.b: "Они уже достаточно повеселились."

scotland.93.t: "Майкл Коллинз и портал в Ад"
scotland.93.d: "Как будто всё не могло стать ещё более странным, расследование, похоже, достигло вершины нелепости. Члены комиссии наперебой пытаются раскрыть всё более мрачные и причудливые истории интриг, папизма и зла. Верховному старейшине преподобному доктору Джону Уайту наконец пришлось вмешаться после того, как один из членов комиссии заявил, что обладает фотоснимками Майкла Коллинза, входящего в портал в Ад и общающегося с самим Люцифером. Хотя некоторые более... внушаемые члены комитета желают увидеть фотографии, преподобный доктор Джон Уайт и его ближайшие соратники решили, что комиссия стала слишком политически постыдной, чтобы сохранять её существование. Пока, однако, комиссии велено отложить расследование."
scotland.93.a: "От всех этих интриг у меня голова раскалывается!"
scotland.93.b: "Продолжать!"

scotland.94.t: "Расследование распущено"
scotland.94.d: "Набрав несколько более здравомыслящих членов Бюро, Верховный старейшина преподобный доктор Джон Уайт фактически создал тайную полицию внутри тайной полиции, чтобы арестовать тех, у кого слишком бурное воображение. Теперь, когда комиссия давно пережила всякую возможную пользу, следователей привели перед Великое дознание и приговорили к смерти за причастность к столь мрачным и тревожным интригам. По мере того как в Шотландию возвращается хотя бы слабое подобие здравого смысла, страсти остыли. Пока."
scotland.94.a: "История для учебников!"

scotland.95.t: "Отправка агентов в Ирландию"
scotland.95.d: "Комиссия решила сосредоточиться на саботаже и сборе доказательств различных преступлений, происходящих в Ирландии. Разумеется, для этого нам понадобятся люди на месте. Если наших агентов поймают, всё может обернуться очень плохо, но если они вернутся с сочными сплетнями, врата небесного гнева распахнутся."
scotland.95.a: "На Изумрудный остров отправляетесь!"
scotland.95.b: "Может, лучше остаться дома..."

scotland.96.t: "Наши агенты прибыли"
scotland.96.d: "Наши агенты прибыли в Ирландию и были направлены в ключевые точки по всему острову. Каковы их первые приказы?"
scotland.96.a: "Готовиться к убийствам и заложить взрывчатку в ключевых местах!"
scotland.96.b: "Начать сбор доказательств."

scotland.97.t: "Взрывы гремят по всей стране"
scotland.97.d: "Сегодня Ирландию охватил страх, когда во всех крупных городах случайным образом сработали взрывные устройства. Гарда пытается выяснить, что именно произошло, и всё выглядит как скоординированная террористическая атака, которая ужасно провалилась. Хотя кроме самих подрывников никто не пострадал, многие задаются вопросом, кто мог стоять за этим и каковы были их настоящие намерения."
scotland.97.a: "Вы уверены, что это не юнионисты?"

scotland.98.t: "Заговор с убийствами провалился!"
scotland.98.d: "До Шотландии дошли дурные вести: похоже, наш план убийства высших чинов ирландского государства ужасно провалился, поскольку все бомбы преждевременно взорвались и убили агентов. Хотя это, к счастью, обрывает любые связи с нами, а Гарда больше сосредоточена на юнионистах, это всё равно великое посрамление, и Верховный старейшина преподобный доктор Уайт решил, что оставшаяся комиссия давно пережила свою пользу."
scotland.98.a: "У вас была всего одна задача..."

scotland.99.t: "Операция глубокого прикрытия начинается"
scotland.99.d: "Наши шпионы приступили к работе по проникновению в органы ирландского государства, чтобы, будем надеяться, добыть какие-нибудь доказательства того, чем именно занимаются ирландцы. Это займёт некоторое время, но наши агенты должны справиться и принести падение ирландцам!"
scotland.99.a: "С Богом, парни!"

scotland.100.t: "Агенты возвращаются"
scotland.100.d: "Наши агенты вернулись из Ирландии с тем, что выглядело как многообещающие доказательства готовящихся злодеяний. После того как Великое дознание рассмотрело собранные материалы, оно осталось совершенно недовольно, и, что ещё хуже, различные агенты начали дискредитировать друг друга в попытке снискать расположение Дознания. Вдобавок найденные доказательства оказались хаотичными, а в некоторых случаях откровенно нелепыми. Комиссия была распущена, и Дознание теперь обсуждает их судьбу."
scotland.100.a: "Какая трата времени."

scotland.101.t: "Виноват Папа"
scotland.101.d: "К малому удивлению, похоже, за поджогом стоял Папа! Кажется естественным, что дом католицизма будет местом, откуда нашей власти противостоят с пламенной завистью. Шотландия представляет собой единственный бастион протестантизма перед лицом папизма, синдикализма, гомосексуализма и синдикалистского гомосексуального папизма. Теперь мы должны решить, как убить зверя раз и навсегда."
scotland.101.a: "Начать допрос заключённых!"
scotland.101.b: "Послать агентов раскрыть заговор!"

scotland.102.t: "Открытие лагерей"
scotland.102.d: "Когда мы впервые пришли к власти, большая часть католического духовенства Шотландии была немедленно отправлена в концентрационные лагеря, чтобы трудиться там до самого своего пути в Ад. Похоже, это была очень хорошая идея, поскольку членов комиссии начали допрашивать, чтобы выяснить, насколько глубоко уходит кроличья нора этого заговора. Все они люди, верные Папе, и если они хотят спасти свои жизни, им лучше заговорить и выложить все подробности злодеяний, совершённых Римом."
scotland.102.a: "Лучше им всё выложить..."

scotland.103.t: "Допросы приносят плоды"
scotland.103.d: "Как и ожидалось, священники оказались более чем готовы предать своих собратьев и признались во всевозможных мрачных и развратных деяниях. Похоже, портал в Ад под базиликой действительно существует, а Папа регулярно предаётся блуду со всевозможными демонами. Хотя многие задаются вопросом, не являются ли это лишь ложью отчаявшихся людей, подвергнутых пыткам, для комиссии это кажется достаточным доказательством, и она попросила Верховного старейшину провести публичные показательные процессы перед Великим дознанием."
scotland.103.a: "Созвать заседание Дознания!"
scotland.103.b: "Пока этого достаточно."

scotland.104.t: "Показательные процессы начинаются"
scotland.104.d: "Когда следствие вновь предстало перед Великим дознанием, теперь наполненным простолюдинами, жаждущими услышать о преступлениях Папства, многие священники католической веры были приведены перед полный гнев Божий. Дни сменялись ночами, пока зачитывались бесконечные обвинения, и каждый священник полностью признавался во всём предъявленном ему списке преступлений. Народный гнев против заговора достигает невиданных высот, а подозреваемых католиков, которые могли скрывать свою веру, убивают на улицах. Многие требуют, чтобы комиссия ушла в отставку, но она утверждает, что у неё есть ещё больше открытий."
scotland.104.a: "Что у вас ещё есть?"
scotland.104.b: "Они уже достаточно повеселились."

scotland.105.t: "Папа и портал в Ад"
scotland.105.d: "Как будто всё не могло стать ещё более странным, расследование, похоже, достигло вершины нелепости. Члены комиссии наперебой пытаются раскрыть всё более мрачные и причудливые истории интриг, папизма и зла. Верховному старейшине преподобному доктору Джону Уайту наконец пришлось вмешаться после того, как один из членов комиссии заявил, что обладает фотоснимками Папы, общающегося с самим Люцифером в тайном сексуальном подземелье под замком Святого Ангела. Хотя некоторые более... внушаемые члены комитета желают увидеть фотографии, преподобный доктор Джон Уайт и его ближайшие соратники решили, что комиссия стала слишком политически постыдной, чтобы сохранять её существование. Пока, однако, комиссии велено отложить расследование."
scotland.105.a: "От всех этих интриг у меня голова раскалывается!"
scotland.105.b: "Продолжать!"

scotland.106.t: "Расследование распущено"
scotland.106.d: "Набрав несколько более здравомыслящих членов Бюро, Верховный старейшина преподобный доктор Джон Уайт фактически создал тайную полицию внутри тайной полиции, чтобы арестовать тех, у кого слишком бурное воображение. Теперь, когда комиссия давно пережила всякую возможную пользу, следователей привели перед Великое дознание и приговорили к смерти за причастность к столь мрачным и тревожным интригам. По мере того как в Шотландию возвращается хотя бы слабое подобие здравого смысла, страсти остыли. Пока."
scotland.106.a: "История для учебников!"

scotland.107.t: "Отправка агентов в Рим"
scotland.107.d: "Комиссия решила сосредоточиться на саботаже и сборе доказательств различных преступлений, происходящих в Папской области. Разумеется, для этого нам понадобятся люди на месте. Если наших агентов поймают, всё может обернуться очень плохо, но если они вернутся с сочными сплетнями, врата небесного гнева распахнутся."
scotland.107.a: "В Рим отправляетесь!"
scotland.107.b: "Может, лучше остаться дома..."

scotland.108.t: "Наши агенты прибыли"
scotland.108.d: "Наши агенты прибыли в Рим и были направлены в ключевые точки по всему городу. Каковы их первые приказы?"
scotland.108.a: "Готовиться к убийствам и заложить взрывчатку в ключевых местах!"
scotland.108.b: "Начать сбор доказательств."

scotland.109.t: "Взрывы гремят по всей стране"
scotland.109.d: "Сегодня Рим охватил страх, когда по всему городу случайным образом сработали взрывные устройства. Полиция пытается выяснить, что именно произошло, и всё выглядит как скоординированная террористическая атака, которая ужасно провалилась. Хотя кроме самих подрывников никто не пострадал, многие задаются вопросом, кто мог стоять за этим и каковы были их настоящие намерения."
scotland.109.a: "Красные выглядят удобными подозреваемыми!"

scotland.110.t: "Заговор с убийствами провалился!"
scotland.110.d: "До Шотландии дошли дурные вести: похоже, наш план убийства высших чинов Папского государства ужасно провалился, поскольку все бомбы преждевременно взорвались и убили агентов. Хотя это, к счастью, обрывает любые связи с нами, а полиция больше сосредоточена на красных, это всё равно великое посрамление, и Верховный старейшина преподобный доктор Уайт решил, что оставшаяся комиссия давно пережила свою пользу."
scotland.110.a: "У вас была всего одна задача..."

scotland.111.t: "Операция глубокого прикрытия начинается"
scotland.111.d: "Наши шпионы приступили к работе по проникновению в органы Папского государства, чтобы, будем надеяться, добыть какие-нибудь доказательства того, чем именно занимается Ватикан. Это займёт некоторое время, но наши агенты должны справиться и принести падение Папе!"
scotland.111.a: "С Богом, парни!"

scotland.112.t: "Агенты возвращаются"
scotland.112.d: "Наши агенты вернулись из Ирландии с тем, что выглядело как многообещающие доказательства готовящихся злодеяний. После того как Великое дознание рассмотрело собранные материалы, оно осталось совершенно недовольно, и, что ещё хуже, различные агенты начали дискредитировать друг друга в попытке снискать расположение Дознания. Вдобавок найденные доказательства оказались хаотичными, а в некоторых случаях откровенно нелепыми. Комиссия была распущена, и Дознание теперь обсуждает их судьбу."
scotland.112.a: "Какая трата времени."

scotland.113.t: "Щит"
scotland.113.d: "Один из наиболее необычных приказов Верховного старейшины преподобного доктора Уайта, «Щит», представляет собой всеобъемлющий законодательный акт, призванный защитить Шотландию от греха и врагов как внутри, так и снаружи. Его самый амбициозный проект - реформа системы образования, но он также стремится регулировать все стороны шотландской жизни: от одежды граждан до разрешённых праздников. Хотя некоторые осуждают это как крайность, все верные знают, что это ради общего блага."
scotland.113.a: "Общее благо."

scotland.114.t: "Запрет Рождества"
scotland.114.d: "В неожиданной директиве в рамках нового законодательства было объявлено, что Рождество теперь официально запрещено. Праздник больше не должен отмечаться, а участие в рождественских торжествах теперь является наказуемым преступлением. Всем пекарям приказано доносить на тех, кто пытается купить рождественский хлеб, а выдача себя за святого Николая является преступлением, караемым смертью. По всей стране общественность кричит от смеси шока, растерянности и гнева, а специальные полицейские подразделения развёрнуты для подавления беспорядков. Скоро все добрые шотландцы будут проводить годовщину рождения Христа в тихом размышлении и благодарности нашему Господу и Спасителю, отказавшись от таких декадентских роскошеств, как обмен подарками и веселье."
scotland.114.a: "Они ещё Пасху запретят!"

scotland.115.t: "Спиритический сеанс Хелен Дункан"
scotland.115.d: "В неожиданном повороте событий одна из наших собственных государственных фигур, Хелен Дункан, пригласила видных министров принять участие в спиритическом сеансе, чтобы доказать существование Рая и Ада. Ночь быстро превратилась в хаос, когда стало ясно, что Дункан не медиум, а мошенница, и её «эктоплазма» была сделана из марли. Хотя правительство отчаянно пыталось скрыть этот позорный случай, он каким-то образом попал в прессу, и Дункан так жестоко высмеяли, что правительство было вынуждено арестовать её за колдовство в показательном процессе, а затем вскоре отпустить."
scotland.115.a: "Какая катастрофа!"

scotland.116.t: "Клятва верности"
scotland.116.d: "Амбициозные образовательные реформы начались, и все государственные служащие, учителя, врачи и прочие публичные должностные лица были вынуждены принести на Библии клятву верности Богу и Верховному старейшине преподобному доктору Уайту. Те, кто отказался, были отправлены в трудовые лагеря, чтобы научиться ошибочности своего пути, и теперь навсегда отстранены от общественной жизни. Хотя некоторые беспокоятся о последствиях клятвы, все добрые шотландцы знают, что это принесёт порядок и стабильность нации, отчаянно нуждающейся в обоих."
scotland.116.a: "Вперёд к более святой Шотландии!"

scotland.117.t: "Образовательный исход"
scotland.117.d: "Из-за недавно введённой Клятвы верности и запрета всем непресвитерианам получать высшее образование Шотландия теперь охвачена образовательным исходом: учёные, учителя, врачи, академики и теоретики бегут из страны, спасаясь от преследований из-за своей веры."
scotland.117.a: "Что?!"

scotland.118.t: "Ассамблея Кирка"
scotland.118.d: "Было решено, что прямой роспуск парламента был бы глупым шагом, а сохранение хотя бы какой-то формы законодательного органа создаст ощущение стабильности в стране и покажет, что мы не являемся полными тиранами. Разумеется, такой орган окажется хотя бы небольшой занозой в боку Верховного старейшины преподобного доктора Уайта и его будущих преемников."
scotland.118.a: "Необходимое зло."

scotland.119.t: "Ковенантерское богословие в одной стране"
scotland.119.d: "Похоже, [ISOLATIONIST MINISTER] одержал верх, и вместо того, чтобы стремиться распространять нашу идеологию повсюду, мы обратим взгляд внутрь. Границы будут закрыты, поле абсолютного ужаса окружит нацию и защитит добрых шотландцев от зла, изгоняя тех, кто желает нам вреда. В связи с этим правительство примет участие в экономике, направляя её так, как счёл бы угодным Бог."
scotland.119.a: "Воистину земля Божья."

scotland.120.t: "Вера через труд"
scotland.120.d: "В рамках нашего внимания к внутренним вопросам нам, очевидно, придётся найти средства для развития страны изнутри. К счастью, у нас есть обильный запас дешёвой рабочей силы из числа различных язычников, которые были арестованы. Поэтому Верховный старейшина преподобный доктор Уайт счёл нужным утвердить программу перевоспитания «Вера через труд», в рамках которой им будет позволено реабилитироваться и искупить свои грехи тяжёлым трудом. Следует ли нам отправить их работать на инфраструктуру или на заводы?"
scotland.120.a: "Пусть строят новые дороги!"
scotland.120.b: "На заводы отправляетесь!"

scotland.121.t: "Царство Божье на земле"
scotland.121.d: "Похоже, [OTHER MINISTER] одержал верх, и вместо того, чтобы Шотландия исчезла в нейтральной безвестности, она займёт чрезвычайно активную позицию на мировой арене, продвигая ковенантерское богословие и стремясь работать с другими протестантскими народами, чтобы избавить мир от папизма и синдикализма."
scotland.121.a: "Весь мир принадлежит Богу!"

scotland.122.t: "Призыв к верным"
scotland.122.d: "Сегодня Верховный старейшина преподобный доктор Уайт выступил с великим радиобращением, в котором призвал протестантов по всему миру взяться за оружие и сражаться в великом крестовом походе против Папы и синдикализма. Вместо оргии насилия и мировой войны, которая, по обещанию Верховного старейшины преподобного доктора Уайта, должна была разразиться, реакция оказалась невероятно вялой, если не считать требования прекратить противоправные действия от небольшой католической группы в Англии. В другой великой речи Верховный старейшина преподобный доктор Уайт попытался спровоцировать католические страны на нападение, но и это снова осталось без внимания, заинтересовав лишь нескольких ультранационалистических голландских протестантов. Это стало чудовищным ударом для правительства, и преподобный доктор Уайт потребовал объяснить, почему радиопередача не вызвала религиозную войну."
scotland.122.a: "Они, должно быть, глушат наши сигналы!"

scotland.123.t: "Наши прусские братья"
scotland.123.d: "Самое могущественное государство Германского рейха, Пруссия, давно является знаменосцем протестантизма на континенте. Они наверняка будут рады помочь нам в нашей борьбе, став нашим главным экономическим покровителем через субсидии, дешёвые займы и весьма приятные торговые сделки."
scotland.123.a: "Добрые протестанты заботятся друг о друге!"

scotland.124.t: "Просьба из Шотландии"
scotland.124.d: "После первоначального шотландского восстания над Хайлендом, казалось, воцарилась тишина - по крайней мере до сегодняшнего дня, когда шотландский посланник, одновременно выступающий в роли священника, прибыл в Ганновер с желанием поговорить с германским правительством. Получив аудиенцию, посланник объяснил довольно... странное положение, в котором оказалась Шотландия, и изложил бредовый список «просьб», таких как беспроцентные кредиты, субсидии для бизнеса и выгодные для шотландцев торговые соглашения, а также помощь в будущем «крестовом походе против папизма». Посланника быстро высмеяли и выставили из здания, отправив обратно в Шотландию, а южные католические государства остались довольны тем, что ни одно из их требований не было удовлетворено."
scotland.124.a: "Как странно."

scotland.125.t: "Германия говорит нет"
scotland.125.d: "Наш посланник вернулся с ужасными новостями! Коварные немцы отказались от наших простых просьб, назвав их «глупыми» и «убийственными». Похоже, гуннские варвары до самого основания проникнуты влиянием южных католиков. Нам придётся искать помощь в другом месте и добавить ещё одну нацию в список заражённых папизмом."
scotland.125.a: "Проклятые фрицы!"

scotland.126.t: "Сыны Легиона"
scotland.126.d: "Пока Америка охвачена гражданской войной, из пепла Союза возникло новое государство добрых честных протестантов. Хелен Дункан сообщила нам, что человек по имени Пелли собирает добрых христиан под знаменем Хьюи Лонга и при этом совершает чудеса. Если Америка будет на нашей стороне, католический мир содрогнётся!"
scotland.126.a: "Отправляемся в Дикси!"

scotland.127.t: "Просьба из Шотландии"
scotland.127.d: "Посланник от недавно провозглашённого шотландского государства прибыл сегодня в столицу и просит Союзное государство взять Шотландию под своё крыло. Их просьбы просты и варьируются от экономических инвестиций до военной защиты, прежде чем в конце концов перейти к полномасштабной войне против католицизма. Хотя Пелли проявил интерес, его попытки пролоббировать это в Комитете военных полномочий с треском провалились, а Чарльз Кофлин положил конец всякому дальнейшему обсуждению."
scotland.127.a: "Простите, ребята..."

scotland.128.t: "Янки тоже отказали нам!"
scotland.128.d: "В наш час нужды американцы отвернулись от нас. Хотя этот человек, Пелли, по-видимому, лоббировал наше дело, деньги Союзного государства в лице Комитета военных полномочий якобы до краёв набиты ревностными католиками, которые скорее увидят Шотландию в огне, чем дадут нам монету. Что ещё хуже, похоже, один из собственных агитаторов Папы, священник по имени Кофлин, шепчет на ухо Хьюи Лонгу и следит за тем, чтобы к нам не пришло никаких денег."
scotland.128.a: "Полные козлы!"

scotland.129.t: "Якобитская реставрация"
scotland.129.d: "О славный день! Ибо якобитская семья вновь восседает на троне Шотландии. Вероломные англичане изгнаны с этой прекрасной земли, и Королевский штандарт Шотландии развевается по всей стране. Мы идём вперёд под благосклонным германским надзором, и теперь Король должен быть коронован. Пока король Рупрехт останется в Баварии, а после его смерти его сын и наш нынешний регент Генрих станет Королём, разделив линии."
scotland.129.a: "Да здравствует Король!"
scotland.129.b: "Да здравствуют Король и принц Генрих!"

scotland.130.t: "Вопрос парламента"
scotland.130.d: "На протяжении многих лет Шотландия жила под парламентским правлением в составе Соединённого Королевства, и во время восстания демократическое правление было одной из её надежд. Король Рупрехт не слишком благосклонно относится к мысли, что его власть и власть Генриха должны быть ограничены, и желает править как традиционный якобитский король без стеснений. Разумеется, наши новые подданные не в восторге. Скоро они узнают ошибочность своих взглядов, ибо сегодня начинается великая реформация шотландского общества."
scotland.130.a: "Мы можем начать со старого здания парламента."

scotland.131.t: "Что делать со старым зданием"
scotland.131.d: "Теперь, когда король покончил с представлением о демократическом правлении, необходимо решить, что делать со старым зданием. Оно использовалось как резиденция местного правительства Шотландии при синдикалистском правительстве, а теперь стоит в Эдинбурге как подрывной символ против нашей власти. Большая часть нашего правительства считает, что здание следует вернуть и превратить в резиденцию королевской власти. Однако сторонники жёсткой линии полагают, что здание нужно уничтожить, чтобы стереть само представление о демократии в Шотландии. Как нам поступить?"
scotland.131.a: "Переоборудовать здание!"
scotland.131.b: "Сжечь его!"

scotland.132.t: "Усиление Королевского совета"
scotland.132.d: "После успешного удаления парламента из общественного сознания Король теперь может перейти к правлению Шотландией без вмешательства. В настоящее время действует византийская администрация с недееспособным тайным советом, состоящим из льстивых и недавно созданных шотландских дворян, германским консультативным советом и епископами, которые все борются за благосклонность Короля. Было предложено распустить все эти советы и упорядочить администрацию в единый Королевский совет. Разумеется, некоторым это не понравится..."
scotland.132.a: "Учредить Королевский совет!"
scotland.132.b: "Оставить систему как есть."

scotland.133.t: "Кризис легитимности"
scotland.133.d: "Из-за германского происхождения [SCT.GetLeader] и растущего недовольства германскими оккупантами возник кризис. Большинство населения считает [SCT.GetLeader] и все германские силы в стране нелегитимными."
scotland.133.a: "Мы более шотландцы, чем эти проклятые англы!"

scotland.134.t: "Деволюционная администрация"
scotland.134.d: "Никлас-и-Глайс предоставил автономию Шотландии и Уэльсу, оставив нас независимыми от Лондона - номинально. Хотя наша внешняя политика всё ещё диктуется Лондоном, дома у нас есть широкая свобода действий. Были объявлены выборы в наш Конгресс, который изберёт нового главу государства Шотландии. Это ожесточённая борьба между НРП и шотландским крылом Конгресса тред-юнионов."
scotland.134.a: "Избрать SWP!"
scotland.134.b: "Избрать STUC!"

scotland.135.t: "Шотландия просит помощи"
scotland.135.d: "С тех пор как Шотландии было предоставлено самоуправление, её экономика оставалась вялой. Они попросили помощи - следует ли нам её предоставить?"
scotland.135.a: "Что может пойти не так?"
scotland.135.b: "Мы вам не копилка!"

scotland.136.t: "Англия отправляет помощь"
scotland.136.d: "Правительство в Лондоне отправило нам необходимую помощь. Это поможет нашей экономике."
scotland.136.a: "Отлично!"

scotland.137.t: "Англия отказывает в помощи"
scotland.137.d: "Правительство в Лондоне отказалось отправить нам необходимую помощь. Это не поможет нашей экономике."
scotland.137.a: "Проклятье!"

scotland.140.t: "Последние охотники-собиратели Британских островов"
scotland.140.d: "Самые северные регионы Британских островов едва ли можно назвать самыми населёнными местами в мире, и если негостеприимной природы этих краёв было недостаточно, чтобы отпугнуть приезжих, то своеобразный характер шотландцев, по крайней мере в глазах их южных кузенов, вполне способен сделать это сам. Тем не менее даже до далёкого севера Британии современность сумела пробиться через любые преграды… кроме одного особого острова, известного как Сент-Килда. По словам немногих историков, изучавших историю этого своенравного клочка земли, люди жили на острове по меньшей мере с позднего Средневековья, и для местных жителей с тех времён мало что действительно изменилось. В более феодальные периоды местные платили ренту шотландским кланам Внешних Гебрид, но кроме визитов разных администраторов и редких лекарей, на протяжении веков почти никто не взаимодействовал с населением острова. Сент-Килда состоит из пяти островов, крупнейший из которых, известный просто как Хирта, содержит единственное человеческое поселение - Ам-Байле.\n\nИз-за нехватки материалов жители Сент-Килды никогда особенно не занимались рыболовством, и местная кухня вместо этого сложилась вокруг яиц морских птиц, трав и овощей, а также редкого мяса пасущихся на острове животных, таких как овцы и коровы. Раннее Новое время принесло на островную цепь куда больше любопытных посетителей, главным образом богатых орнитологов и антропологов, а иногда и простых туристов, очарованных аскетичным и примитивным образом жизни жителей Сент-Килды. Однако вслед за этими путешественниками пришло разорение, и болезни, принесённые в изолированную общину из внешнего мира, медленно сократили население острова, пока сегодня там не осталось лишь несколько десятков жителей. Революция и конец Виндзорской монархии мало что значили для островитян, но недавно они связались с властями материка в отчаянной просьбе о помощи. Десятилетиями Сент-Килда боролась за выживание, пока всё больше мужчин покидало остров ради работы и надежды на лучшую жизнь в Шотландии и других частях Гебрид. Поддержка с материка была жизненно важна для деревенских жителей Сент-Килды, но, похоже, предел наконец наступил. Ссылаясь на легко предотвратимую смерть молодой девочки в деревне, местные жители подали прошение правительству материка о полной эвакуации и переселении всего населения Сент-Килды. Нехватка мужчин для выполнения традиционных работ на острове сделала выживание слишком тяжёлым для населения, и потому они надеются найти лучшую жизнь на материке. Учитывая малочисленность жителей острова, эвакуация, как ожидается, пройдёт быстро, а переселение будет столь же простым делом: жителей Сент-Килды распределят по деревням и хуторам Гебрид, наиболее нуждающимся в новой крови.\n\nОднако остаётся вопрос, что делать с островами в будущем. Некоторые чиновники предлагают создать в этом районе военный объект, особенно с появлением радио- и радарных технологий, тогда как другие считают нетронутую природу региона лучшим местом для создания природного заповедника. Последнее предложение особенно приветствуется правительством, учитывая, что эти крошечные островки являются домом для множества эндемичных видов, таких как сент-килдский крапивник и сент-килдская полевая мышь, а также одичавшие и крайне уникальные овцы сойской породы и довольно редкая порода овец данфейс на острове Хирта."
scotland.140.a: "Это место кажется подходящим для изолированного военного развития."
scotland.140.b: "Природный заповедник звучит идеально для такого скрытого места."

sctrevolt.1.t: "Восстание начинается!"
sctrevolt.1.d: "Англичане довели нас до края своими тоталитарными законами. Настало время подняться, как наши предки, и сбросить англосаксонское ярмо раз и навсегда!"
sctrevolt.1.a: "За свободу!"

sctrevolt.2.t: "Шотландия освобождена от оков!"
sctrevolt.2.d: "Выступая перед возбуждённой толпой в центре Эдинбурга, у подножия Эдинбургского замка, Джон Маккормик произнёс великую речь под названием «Шотландия освобождена от оков», в которой осудил Мосли и его максимистских союзников за разрушение союза и призвал Шотландию бороться за свою свободу и само существование. Множество молодых людей добровольно вступили в Дозор Родины и временную шотландскую армию, чтобы сражаться за свой дом и страну, тогда как синдикалистское «правительство» мобилизовало синдикалистскую милицию на это дело. Хотя формально две группы противостоят друг другу, они пока не перешли к открытому столкновению, и некоторые задаются вопросом, возможна ли коалиция..."
sctrevolt.2.a: "Пусть Альба взлетит!"

sctrevolt.3.t: "Сделка с дьяволом"
sctrevolt.3.d: "Представители Дозора Родины, главных демократических партий и синдикалистского правительства встретились, чтобы обсудить перемирие. После часов жарких переговоров и многочисленных угроз срыва с обеих сторон соглашение в конце концов было достигнуто. Хотя это и не Единый фронт, подобный валлийскому, по крайней мере пока обе стороны прекратят убивать друг друга и сосредоточатся на британцах."
sctrevolt.3.a: "Какие прекрасные новости!"

sctrevolt.4.t: "Обеспечение тыла"
sctrevolt.4.d: "До сих пор две главные фракции существовали в тревожном мире, с мелкими стычками, но без настоящей эскалации в полноценную гражданскую войну. Теперь всё изменилось: Дозор Родины стал рассматривать синдикалистские милиции как законные цели. Прежде чем страна успела скатиться в открытую гражданскую войну, синдикалисты объединились с ныне разочаровавшимися демократами и свергли Джона Маккормика и его реакционных головорезов."
sctrevolt.4.a: "Великий Джон Маклин вернулся на Клайд!"

sctrevolt.5.t: "Старый союз"
sctrevolt.5.d: "Шотландия и Франция всегда были естественными союзниками, объединёнными частым врагом - Англией. Франция решила не вмешиваться в гражданскую войну, и это даёт идеальную возможность добиться её благосклонности."
sctrevolt.5.a: "Оно того не стоит."
sctrevolt.5.b: "Отправить запрос!"

sctrevolt.6.t: "Шотландия просит помощи"
sctrevolt.6.d: "Британия погрузилась во внутреннюю смуту, но, что удивительно, синдикалистские фракции взяли верх в Шотландии и запросили вступление в Интернационал, а также исключение Англии, ссылаясь на её предательство революции. Хотя шотландцы - хороший народ, они могут оказаться не столь сильным союзником по сравнению с Британией, несмотря на её преступления."
sctrevolt.6.a: "Англия предала революцию! Принять их!"
sctrevolt.6.b: "Вежливо отклонить их просьбу."

sctrevolt.7.t: "Французы отказали!"
sctrevolt.7.d: "Как и ожидалось, французы отклонили нашу просьбу, решив поддержать британцев. Похоже, нам придётся сражаться в этой битве в одиночку."
sctrevolt.7.a: "Ублюдки!"

sctrevolt.8.t: "Французы бросили нас!"
sctrevolt.8.d: "До Лондона дошли тревожные новости. К удивлению, французы решили поддержать шотландцев и потребовали, чтобы мы вступили в мирные переговоры. Похоже, Шотландия потеряна, по крайней мере пока."
sctrevolt.8.a: "Что?!"

sctrevolt.9.t: "Прошение к Канаде"
sctrevolt.9.d: "Джон Маккормик решил, что лучшим иностранным покровителем будет Канада, дом британских изгнанников. Шотландия стала бы для них хорошим стратегическим выбором, а взамен мы смогли бы закрепить нашу независимость от Британии. Конечно, чего именно нам следует просить?"
sctrevolt.9.a: "Только помощь и снаряжение."
sctrevolt.9.b: "Ещё и немного добровольцев."
sctrevolt.9.c: "Экспедиционный корпус!"

sctrevolt.10.t: "Шотландия просит помощи"
sctrevolt.10.d: "Делегаты от недавно провозглашённой независимой Шотландии прибыли сегодня с просьбой о помощи в борьбе против Союза Британии. Хотя они прямо не заявили о поддержке изгнанников, они дали понять, что в дальнейшем будут открыты к расширенной поддержке."
sctrevolt.10.a: "Отправить им оружие!"
sctrevolt.10.b: "Мы не можем выделить снаряжение!"

sctrevolt.11.t: "Шотландия просит добровольцев"
sctrevolt.11.d: "Делегаты от недавно провозглашённой независимой Шотландии прибыли сегодня с просьбой о помощи и добровольцах в борьбе против Союза Британии. Хотя они прямо не заявили о поддержке изгнанников, они дали понять, что в дальнейшем будут открыты к расширенной поддержке, а многие шотландцы в Канаде уже проявили желание сражаться за свою родину."
sctrevolt.11.a: "Отправить им людей!"

sctrevolt.12.t: "Шотландия просит экспедиционный корпус"
sctrevolt.12.d: "Делегаты от недавно провозглашённой независимой Шотландии прибыли сегодня с просьбой об экспедиционном корпусе для борьбы против Союза Британии. Хотя они прямо не заявили о поддержке изгнанников, они дали понять, что в дальнейшем будут открыты к расширенной поддержке, а канадские войска на шотландской земле могут оказаться весьма полезны..."
sctrevolt.12.a: "Отправить им экспедиционный корпус!"

sctrevolt.13.t: "Канадцы защищают Шотландию"
sctrevolt.13.d: "К ошеломляющему открытию, канадцы начали высадку в Шотландии, а реакционная республика объявила о верности Антанте. Чтобы предотвратить полномасштабную войну с Антантой, был поспешно заключён мир, предоставивший им плацдарм на островах. Французский посол, кажется, не слишком доволен..."
sctrevolt.13.a: "Ох, чёрт побери!"

sctrevolt.14.t: "Прошение к Германии"
sctrevolt.14.d: "Джон Маккормик решил, что лучшим иностранным покровителем будет Германия, дом нашего прежнего врага. Шотландия стала бы для них хорошим стратегическим выбором, а взамен мы смогли бы закрепить нашу независимость от Британии. Конечно, чего именно нам следует просить?"
sctrevolt.14.a: "Только помощь и снаряжение."
sctrevolt.14.b: "Ещё и немного добровольцев."
sctrevolt.14.c: "Экспедиционный корпус!"

sctrevolt.15.t: "Шотландия просит помощи"
sctrevolt.15.d: "Делегаты от недавно провозглашённой независимой Шотландии прибыли сегодня с просьбой о помощи в борьбе против Союза Британии. Хотя они прямо не заявили, что помогут нам или вступят в Рейхспакт, они дали понять, что в дальнейшем будут открыты к расширенной поддержке."
sctrevolt.15.a: "Отправить им оружие!"

sctrevolt.16.t: "Шотландия просит добровольцев"
sctrevolt.16.d: "Делегаты от недавно провозглашённой независимой Шотландии прибыли сегодня с просьбой о помощи и добровольцах в борьбе против Союза Британии. Хотя они прямо не заявили, что помогут нам, они дали понять, что в дальнейшем будут открыты к расширенной поддержке. Многие немцы жаждут службы и хотят как следует ударить по Союзу."
sctrevolt.16.a: "Отправить им людей!"

sctrevolt.17.t: "Шотландия просит экспедиционный корпус"
sctrevolt.17.d: "Делегаты от недавно провозглашённой независимой Шотландии прибыли сегодня с просьбой об экспедиционном корпусе для борьбы против Союза Британии. Хотя они прямо не заявили о поддержке Рейхспакта, они дали понять, что в дальнейшем будут открыты к расширенной поддержке, а немецкие войска на шотландской земле могут оказаться весьма полезны..."
sctrevolt.17.a: "Отправить им экспедиционный корпус!"

sctrevolt.18.t: "Немцы защищают Шотландию"
sctrevolt.18.d: "К ошеломляющему открытию, германские военные силы начали высадку в Шотландии, а реакционная республика объявила о верности Рейхспакту. Чтобы предотвратить полномасштабную войну с Германией, был поспешно заключён мир, предоставивший им плацдарм на островах. Французский посол, кажется, не слишком доволен..."
sctrevolt.18.a: "Это нехорошо..."

sctrevolt.19.t: "Укрепление нашей власти"
sctrevolt.19.d: "Вместо того чтобы искать иностранный союз, лучше обратить взгляд внутрь и укрепить нашу внутреннюю поддержку, чтобы мы не зависели от чужеземной державы, как это бывало веками. Естественный вариант - наши нынешние союзники, демократы, хотя многие задаются вопросом, готова ли Шотландия к демократии. Другой вариант - вербовка ковенантеров. Свирепые воины, они показали фанатичную преданность делу, и хотя они могут быть полезны, они также могут быть опасны..."
sctrevolt.19.a: "Укрепить наши связи с демократами."
sctrevolt.19.b: "Очистить власть от демократов и встать на сторону ковенантеров!"

sctrevolt.20.t: "Помощь отклонена"
sctrevolt.20.d: "Нам отказали в просьбе о помощи в войне против Британии. Похоже, нам придётся сражаться с этой угрозой в одиночку."
sctrevolt.20.a: "Проклятье."

