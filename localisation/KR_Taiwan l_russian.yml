 POLITICS_XIE_XUEHONG_DESC:0 "§YРодилась:§! 17 октября 1901 года, уезд Чжанхуа, Японский Тайвань, Японская империя\n§YПолитическая карьера:§! Тайвань наконец обрёл свободу благодаря иностранной помощи и неустанной революционной борьбе Тайваньской синдикалистской партии. Се Сюэхун, Цзянь Цзи и многие другие примкнули к Тайваньскому культурному обществу, боровшемуся за независимость или автономию острова и демократию. Однако внутренние распри и японские репрессии вскоре раскололи общество на несколько групп.\n\nСе состояла в Китайской синдикалистской партии и училась в Университете имени Сунь Ятсена во Франции. В 1928 году при негласной поддержке японских и китайских социалистов она основала Тайваньскую синдикалистскую партию. Допуская участие буржуазии в движении за независимость, Се оставалась убеждённой социалисткой и со временем решительно порвала с Тайваньской народной партией Цзян Вэйшуя. TSP претендует на более верное толкование Трёх народных принципов, обличает \"ложь\" TPP и соперничает с ней за поддержку рабочих и крестьян, зачастую безуспешно.\n\nВ отличие от многих китайских синдикалистов, Се настаивает на особой тайваньской идентичности и праве тайваньцев управлять своим островом, хотя бы на местном уровне. Это стоило ей части сторонников, но создание почти независимого правительства в итоге закрепило её позицию. Партия по-прежнему расколота на радикальное и умеренное крылья, а её власть, вопреки пышным речам об освобождении, сосредоточена главным образом в крупных городах. Сохранится ли этот порядок после ухода иностранных войск или Тайвань присоединится к дружественному Китаю либо Японии, покажет время."

 POLITICS_JIANG_WEISHUI_DESC:0 "§YРодился:§! 6 августа 1890 года, Илань, провинция Фуцзянь-Тайвань, империя Цин\n§YПолитическая карьера:§! Учёный, врач и противник японского господства Цзян Вэйшуй был одним из основателей Тайваньского культурного общества. В своём знаменитом эссе \"Свидетельство о клиническом диагнозе\" он описал Тайвань как пациента, страдающего от тяжёлого культурного истощения. Талантливый оратор неоднократно попадал в тюрьму и в 1931 году едва пережил тиф.\n\nЕго сдвиг влево вызвал недовольство многих членов общества. Вскоре после провала Северного похода Гоминьдана он создал Тайваньскую народную партию как ответвление этого движения. Сохранив верность Трём народным принципам и схожую символику, партия в остальном стремилась к самостоятельности, что едва ли спасало её от японских репрессий.\n\nРазочаровавшись в мирных протестах, Цзян сосредоточил власть в своих руках. Он часто спорит со своим бывшим подчинённым Цай Пэйхо, который стремится удержать TPP в стороне от классовой борьбы и социализма. Создание новой республики, однако, хотя бы временно примирило их, а самого Цзяна превратило в национального героя.\n\nНекоторые называют его тайваньским Сунь Ятсеном. Если это так, работы ему предстоит немало. Тайваньская идентичность остаётся раздробленной, на острове есть сторонники объединения как с Японией, так и с Китаем. Партийное государство Цзяна вряд ли просуществует долго, прежде чем запросит автономию в составе одной из этих стран, но пока его сторонники намерены преобразить тайваньское общество."

 POLITICS_LIAO_WENKUI_DESC:0 "§YРодился:§! 14 ноября 1905 года, уезд Юньлинь, Японский Тайвань, Японская империя\n§YПолитическая карьера:§! Едва ли кто ожидал, что новое тайваньское государство станет республикой под руководством молодых либералов из Товарищества возрождения Тайваня. Но труды Ляо Вэнькуя и других молодых технократов, получивших образование за рубежом, убедили оккупационные власти в серьёзности обещанных демократических преобразований. Теперь им поручено создать временную Республику Тайвань.\n\nЛяо происходил из влиятельного местного рода крупных землевладельцев, преданных конфуцианским ценностям. Однако его отец принял христианство, обратившись к Западу, а сам Ляо отправился учиться в Японию. Стремясь соединить китайскую философию с западной наукой, он продолжил образование в Цзиньлинском университете в Китае, а затем в Чикагском университете в США. Он также ненадолго посетил Европу, где встретил будущую жену и продолжил формировать свои политические взгляды.\n\nКогда распад Лиги усилил напряжённость, Ляо стал посредником между соперничающими фракциями по обе стороны пролива. Вместе с братом Вэньи он возглавил отцовскую компанию, переименовал её в Dacheng Industrial Co. и использовал для налаживания связей от Тайбэя до Шанхая.\n\nБлагодаря широким политическим связям и доброжелательности к иностранцам Товарищество казалось подходящим посредником между зарубежными \"освободителями\" и местными жителями. Но одного идеализма недостаточно, в чём молодая тайваньская демократия вскоре убедилась."

 POLITICS_LIN_XIANTANG_DESC:0 "§YРодился:§! 22 октября 1881 года, Тайчжун, провинция Фуцзянь-Тайвань, империя Цин\n§YПолитическая карьера:§! Линь Сяньтан состоял в Тайваньском культурном обществе, широком объединении местной интеллигенции, добивавшемся демократии и автономии при японском правлении. Выходец из богатой семьи землевладельцев, он участвовал в различных революционных обществах и в 1913 году даже отказался от японского гражданства в пользу гражданства Китайской республики. Японского он так и не выучил, предпочитая южноминьский язык, а в частном порядке начал изучать путунхуа.\n\nНедовольные левым поворотом общества и Тайваньской народной партии Цзяна, Линь и его единомышленники в 1930 году создали Тайваньский союз самоуправления. Ожесточённый раскол привёл к их исключению из TPP, после чего они попытались договориться с японскими властями мирным путём. Это не помогло: вскоре после TPP запретили и их организацию.\n\nТем не менее движение продолжило существовать благодаря огромным средствам Линя. К нему присоединились другие тайваньские консерваторы, желавшие автономии, а некоторые осмеливались мечтать и о независимости. Крушение Японской империи наконец исполнило их желание. При иностранной поддержке была восстановлена недолговечная Республика Формоза, за которую когда-то боролись отец Линя и другие члены его семьи.\n\nОстаётся лишь гадать, сколько проживёт новая республика, фактически остающаяся протекторатом внешних сил. Линь и другие представители знати предпочитают решать проблемы по мере их появления, удерживая равновесие между реакционным и умеренным крыльями."

 POLITICS_LIN_XIONGZHENG_DESC:0 "§YРодился:§! 5 ноября 1888 года, префектура Тайбэй, провинция Фуцзянь-Тайвань, империя Цин\n§YПолитическая карьера:§! Линя Сюнчжэна называли одним из немногих толстяков Японской Формозы, что само по себе говорило о его богатстве и влиянии. После присоединения Тайваня к Японии его семья перебралась в Фучжоу, но вскоре вернулась. При новой власти Линь сумел использовать местные связи, чтобы занять прочное положение в системе управления. Он входил в совет генерал-губернатора и устраивал светские приёмы, в том числе во время визита наследного принца Хирохито.\n\nПоддерживая Тунмэнхой, он сохранял хорошие отношения с китайцами. Сахарный магнат неоднократно вступал в конфликты с крестьянами, но при этом успешно поддерживал репутацию благотворителя. Когда Тайвань занял новый завоеватель, Линь одним из первых оказался среди кандидатов на руководство островом. Теперь он входит в круг влиятельной местной знати, финансистов и предпринимателей. Особое место в нём занимает его новый заместитель Лань Гаочуань, ветеран войны Ивэй против Японии. Некоторые считают, что именно Лань с его обширными связями является истинным хозяином правительства, но решения принимаются за закрытыми дверями, и судить об этом трудно.\n\nВо многом старое генерал-губернаторство никуда не исчезло: его лишь сменила местная верхушка с чуть большей самостоятельностью. Оставаясь в почти колониальной зависимости, Формоза с президентом Линем вступает в новое будущее, каким бы оно ни оказалось."

