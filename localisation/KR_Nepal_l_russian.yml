NEP_tanka_prasad_acharya: "Танка Прасад Ачарья"
NEP_tanka_prasad_acharya_leader_desc: "§YДата рождения:§! §L31 декабря 1912 года, Навалпараси, Королевство Непал§!\n§YПроисхождение:§! §LТанка Прасад Ачарья родился у Тики Прасада Ачарьи, районного сборщика доходов, у которого было две жены, и Танка был рождён первой. Взрослея, Танка поддерживал очень близкие отношения со своей матерью и находился под сильным влиянием не только её моральных учений, но и учений индуистской веры. Родившийся под астрологическими знаками Шукры и Брихаспати, их «материалистическое» и «духовное» влияние привело к тому, что многие предсказывали, что он когда-нибудь станет раджой (королём) или джоги (святым), и эти ожидания глубоко повлияли на него по сей день.\n\nВ совсем юном возрасте его отец раскрыл коррупцию среди своих подчинённых, однако этот подчинённый был оправдан, а Тику, как начальника, Раны заставили выплатить крупный штраф. С тех пор Танка испытывает глубокую ненависть к ним и стал одержим политикой, что в конечном итоге привело к основанию Непальского Народного Совета.\n\nСчитая себя человеком настоящего, Танка рассматривает своё прошлое как простую древность, и точно так же он смотрит на феодальное прошлое Непала. Танка планирует утвердить независимость Непала и привести его в современную эпоху, даже если такая задача окажется чрезвычайно трудной.§!"
NEP_bishweshwar_prasad_koirala: "Бишвешвар Прасад Коирала"
