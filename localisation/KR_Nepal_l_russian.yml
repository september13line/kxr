NEP_follow_the_calcutta_line: "Следовать линии [BHC.Capital.GetCapitalVictoryPointName]"
NEP_follow_the_calcutta_line_desc: "Будучи доиндустриальной нацией без собственного реального социалистического движения, Праджа Паришад действует не столько как самостоятельная сила, сколько как местное отделение правительства в [BHC.Capital.GetCapitalVictoryPointName]. С учётом недавних идеологических сдвигов в Индии, было бы благоразумно обеспечить наше полное соответствие текущему руководству Республики."

NEP_the_darjeeling_conspiracy_category: "[NEP_loc_conspiracy_name]"
NEP_the_darjeeling_conspiracy_category_desc: "[NEP_loc_conspiracy_desc]"
NEP_the_darjeeling_conspiracy_category_NEP: "Дарджилингский заговор"
NEP_the_darjeeling_conspiracy_category_desc_NEP: "В Непале назревает революция: антирановская оппозиция объединилась в Мукти Сену, «Освободительную армию», действующую при значительной поддержке [BHC.GetNameDef] в Калькутте. С помощью [DEH.GetNameDef] премьер-министр Джуддха Шумшер Рана надеется разгромить этих повстанцев и полностью согласовать свои действия с Доминионом, чтобы отомстить Республике за их прегрешения.\n\nТрудно сказать, что может произойти, когда повстанцы наконец сделают свой ход, но если какая-либо из сторон преуспеет, Непал окажется втянутым в сферу влияния своего покровителя. Однако если ни одна из сторон не сможет добиться успеха, у короля может появиться возможность восстановить порядок и сохранить национальный нейтралитет.$NEP_the_darjeeling_conspiracy_category_desc_info$"
NEP_the_darjeeling_conspiracy_category_BHC: "Революция в Непале"
NEP_the_darjeeling_conspiracy_category_desc_BHC: "Теперь, когда подготовка к Операции «Гром» идёт полным ходом, наша поддержка антирановской оппозиции в Непале даёт нам прекрасную возможность вырвать одно из немногих государств, всё ещё дружественных оккупантам в Дели, до начала вторжения. Мы должны убедиться, что когда Мукти Сена наконец выступит против Ранов, у них будет достаточно союзников, оружия и подготовки для успеха. Как только Непал будет освобождён, остальная часть субконтинента, несомненно, быстро последует его примеру.$NEP_the_darjeeling_conspiracy_category_desc_info$"
NEP_the_darjeeling_conspiracy_category_DEH: "Наши интересы в Непале"
NEP_the_darjeeling_conspiracy_category_desc_DEH: "Бандиты, оккупировавшие большую часть нашей страны, явно не удовлетворены просто разрушением Индии; теперь они хотят принести хаос и анархию также и в Непал. Наш союзник в Непале, достопочтенный премьер-министр Джуддха Шумшер Рана, твёрдо противостоит этим повстанцам, но без нашей помощи он, вероятно, окажется мёртв. Мы не можем допустить этого, и мы должны разгромить этих повстанцев, и, надеюсь, Непал окажется в состоянии отплатить услугой, когда Калькутта неизбежно попытается напасть на нас.$NEP_the_darjeeling_conspiracy_category_desc_info$"
NEP_the_darjeeling_conspiracy_category_desc_info: "\n\n[BHC.GetFlag] Сила повстанцев, поддерживаемых Бхаратией: [?NEP.NEP_conspiracy_influence_var_@BHC|Y0]\n[DEH.GetFlag] Сила правительства, поддерживаемого Доминионом: [?NEP.NEP_conspiracy_influence_var_@DEH|Y0]\nЕсли одна из сторон имеет §G25 или более очков выше другой§!, Непал согласует свои действия с ними после завершения миссии, в противном случае он, вероятно, останется нейтральным.\n\nПри текущих уровнях влияния, вероятно, что:\n[NEP_conspiracy_winning_check]"

NEP_conspiracy_mission: "Дарджилингский заговор"
NEP_conspiracy_mission_desc: "Когда они накопят достаточно сил, Мукти Сена сделает свой ход против династии Рана. Так или иначе, будущее Непала скоро решится."
NEP_conspiracy_BHC_winning_check: "§l[BHC.GetFlag] Повстанцы успешно свергнут Ранов.§!"
NEP_conspiracy_DEH_winning_check: "§P[DEH.GetFlag] Премьер-министр разгромит повстанцев.§!"
NEP_conspiracy_NEP_winning_check: "§g[NEP.GetFlag] Армия может вмешаться, чтобы предотвратить анархию.§!"

NEP_weaken_BHC_influence_decision: "[NEP_loc_weaken_BHC_influence_name]"
NEP_weaken_BHC_influence_rebels_name: "Противодействовать доминированию Республики"
NEP_weaken_BHC_influence_ranas_name: "Выступить против повстанцев"
NEP_weaken_BHC_influence_decision_desc: "[NEP_loc_weaken_BHC_influence_desc]"
NEP_weaken_BHC_influence_rebels_desc: "Хотя мы полагаемся на поддержку Калькутты в борьбе против Ранов, если мы позволим их влиянию стать слишком сильным, мы, вероятно, просто превратимся в марионетку Бхаратии. Мы должны подчеркнуть нашу независимость, чтобы предотвратить такой исход."
NEP_weaken_BHC_influence_ranas_desc: "Нельзя позволять повстанцам наращивать силу, и хотя мы вряд ли уничтожим их всего несколькими рейдами, мы должны наносить по ним удары при любой возможности, чтобы в долгосрочной перспективе надеяться подорвать их силы."

NEP_weaken_DEH_influence_decision: "[NEP_loc_weaken_DEH_influence_name]"
NEP_weaken_DEH_influence_rebels_name: "Посеять раздор в рядах правительства"
NEP_weaken_DEH_influence_ranas_name: "Уменьшить зависимость от Доминиона"
NEP_weaken_DEH_influence_decision_desc: "[NEP_loc_weaken_DEH_influence_desc]"
NEP_weaken_DEH_influence_rebels_desc: "Династия Рана не является единым фронтом, о чём свидетельствуют её многочисленные внутренние распри и особенно число Ранов в наших рядах, желающих видеть конец тирании своей семьи. Вложив несколько нужных слов в их уши, мы можем легко погубить их с помощью междоусобиц."
NEP_weaken_DEH_influence_ranas_desc: "Хотя мы полагаемся на поддержку Дели в борьбе против Мукти Сены, если мы позволим их влиянию стать слишком сильным, мы, вероятно, просто превратимся в индийскую марионетку. Мы должны подчеркнуть нашу независимость, чтобы предотвратить такой исход."

NEP_increase_BHC_influence_decision: "[NEP_loc_increase_BHC_influence_name]"
NEP_increase_BHC_influence_BHC_name: "Поддержка Праджа Паришад"
NEP_increase_BHC_influence_rebels_name: "Привлечение королевских офицеров"
NEP_increase_BHC_influence_ranas_name: "Сократить масштабы патрулирования"
NEP_increase_BHC_influence_decision_desc: "[NEP_loc_increase_BHC_influence_desc]"
NEP_increase_BHC_influence_BHC_desc: "Непальский Народный Совет представляет более граждански настроенную сторону восстания против Ранов и жизненно важен для привлечения большей части населения, которое презирает Ранов, но опасается радикализма. Мы должны усилить нашу поддержку их роста, если хотим, чтобы их восстание увенчалось успехом."
NEP_increase_BHC_influence_rebels_desc: "Хотя сейчас они своими действиями могут служить Ранам, многие не-рановские офицеры в армии хранят истинную верность прежде всего королю. Убедив их, что свержение Ранов будет в интересах короля, они, вероятно, присоединятся к революции."
NEP_increase_BHC_influence_ranas_desc: "Даже при назревающем восстании мы не можем жить в состоянии постоянного страха. Нет особых причин продолжать ежедневные рейды в любом месте, где подозревают наличие повстанцев, хотя бы потому, что это просто не стоит затрат, которые вместо этого можно было бы потратить на новый автомобиль для премьер-министра или подобные покупки."

NEP_increase_DEH_influence_decision: "[NEP_loc_increase_DEH_influence_name]"
NEP_increase_DEH_influence_DEH_name: "Отправить средства Джуддхе Ране"
NEP_increase_DEH_influence_rebels_name: "Ограничить групповые встречи"
NEP_increase_DEH_influence_ranas_name: "Укрепить лояльность армии"
NEP_increase_DEH_influence_decision_desc: "[NEP_loc_increase_DEH_influence_desc]"
NEP_increase_DEH_influence_DEH_desc: "Если непальский премьер-министр собирается бороться с этими повстанцами, ему понадобятся средства для покупки оружия, снаряжения и найма дополнительной охраны и солдат. Имея достаточный излишек, мы должны предоставить средства, чтобы помочь ему в этих вопросах."
NEP_increase_DEH_influence_rebels_desc: "Несмотря на то, что эффективная организация жизненно важна для успешной революции, мы подвергаем себя риску ареста каждый раз, когда встречаемся, чтобы спланировать будущие действия. Было бы благоразумно по возможности сократить количество проводимых встреч, чтобы избежать таких арестов."
NEP_increase_DEH_influence_ranas_desc: "Повстанцы не могут победить Непал, пока армия на стороне премьер-министра, и, к сожалению, многие опасаются, что, когда придёт время, именно они выстрелят ему в спину. Этого нельзя допустить, и мы должны обеспечить лояльность армии любыми возможными способами."

NEP_india_send_guns_decision: "[NEP_india_send_guns_name]"
NEP_india_send_guns_BHC_name: "Вооружение Мукти Сены"
NEP_india_send_guns_DEH_name: "Помощь силам безопасности Непала"
NEP_india_send_guns_decision_desc: "[NEP_india_send_guns_desc]"
NEP_india_send_guns_BHC_desc: "Когда придёт время для их восстания, нашим союзникам понадобится столько оружия, сколько они физически смогут унести. Поскольку в самом Непале мало способов приобрести это огнестрельное оружие, мы должны предоставить им это снаряжение."
NEP_india_send_guns_DEH_desc: "Люди, которых Непал использует в качестве сил безопасности, зачастую оснащены хуже, чем средний полицейский в Дели, и при этом должны победить вооружённое восстание. Мы должны отправить им всё оружие, которое можем выделить, чтобы у них был реальный шанс против повстанцев, вооружённых Калькуттой."

NEP_india_command_power_decision: "[NEP_india_command_power_name]"
NEP_india_command_power_BHC_name: "Обучение социалистических революционеров Совета"
NEP_india_command_power_DEH_name: "Увеличение операций РАБ в Катманду"
NEP_india_command_power_decision_desc: "[NEP_india_command_power_desc]"
NEP_india_command_power_BHC_desc: "Хотя Совет, безусловно, полезен для нас, мы с трудом представляем, как кучка интеллектуалов из среднего класса штурмует Катманду, когда придёт время. Более решительные силы среди Праджа Паришад - гораздо более удачная ставка для выполнения задачи, и мы должны дополнительно обучить их для подготовки к восстанию."
NEP_india_command_power_DEH_desc: "Разведывательное бюро Дели представляет одних из лучших шпионов во всей Азии, и без них Республика, вероятно, устроила бы 29 различных восстаний только в этом году. Если кто и может остановить повстанцев в Непале, так это они, поэтому мы должны отправить больше агентов в Катманду, чтобы помочь Джуддхе Ране."

NEP_join_faction_name: "[NEP_loc_join_faction]"
NEP_join_faction: "Присоединиться к [FROM.GetNameDef]"

NEP_assert_the_mantle_of_asal_hindustan: "Утвердить мантию Асал Хиндустан"
NEP_assert_the_mantle_of_asal_hindustan_desc: "Когда великий Притхви Нараян Шах объединил Непал, он провозгласил наше королевство Асал Хиндустан, настоящим Хиндустаном, поскольку остальная часть субконтинента была оккупирована захватчиками-моголами. Хотя мало кто воспринимал его заявление иначе как националистическое бахвальство, теперь мы стоим как бесспорные правители всего Хиндустана, и мы обеспечим, чтобы мир знал о нашем праве править им."

NEP_surviving_the_indian_nightmare_category: "Выжить в индийском кошмаре"
NEP_pilfer_the_depots: "Обшарить склады"
NEP_pilfer_the_depots_desc: "Мы отчаянно нуждаемся в винтовках, и, к счастью для нас, наша армия редко выбрасывает или продаёт старое снаряжение, просто отправляя его на хранение на всякий случай. Многие из этих винтовок больше не функционируют или настолько устарели, что могли бы и не функционировать, но мы должны быть в состоянии собрать достаточно, чтобы дополнительно вооружить наши войска."
NEP_emergency_military_production: "Экстренное военное производство"
NEP_emergency_military_production_desc: "То немногое, что у нас есть в плане промышленности, потенциально можно перепрофилировать под производство униформы, боеприпасов и другого снаряжения, в котором наша армия отчаянно нуждается. Это, конечно, ограничит наши возможности производить что-либо ещё, но сейчас мало что имеет значение."
NEP_retreat_to_kathmandu: "Отступить в [323.GetCapitalVictoryPointName]"
NEP_retreat_to_kathmandu_desc: "Наши враги прорвали линию фронта и начали оккупировать части Непала. Отступление в столицу и подготовка к обороне могут быть нашим лучшим вариантом на данном этапе, и надежда на то, что неудачные атаки на неё дадут нам возможность контратаковать."
NEP_fortify_uttaranchal: "Укрепить [814.GetName]"
NEP_fortify_uttaranchal_desc: "Горы и холмы [814.GetName] сами по себе обеспечивают значительное оборонительное преимущество, но этого, вероятно, недостаточно для полной защиты самого Непала от решительной армии. Мы должны позаботиться о строительстве укреплений в регионе, чтобы мы могли держать боевые действия подальше от центральных районов."
NEP_fortify_darjeeling: "Укрепить [887.GetName]"
NEP_fortify_darjeeling_desc: "[887.GetName] представляет собой жизненно важный логистический центр для наших войск, действующих на востоке, особенно потому, что это единственная реальная связь с [888.GetName] и другими восточными регионами. Мы должны обеспечить, путём строительства дополнительных укреплений, чтобы [887.GetName] не пал."

### Tooltips ###
NEP_royal_restoration_flag: "Король сформировал Национальное правительство."
NEP_rana_regency_flag: "Антиранская революция провалилась."
NEP_revolution_flag: "Джуддха Рана был свергнут."
NEP_democratic_revolution_flag: "Непальский Народный Совет (Nepal Praja Parishad) пришёл к власти."
NEP_socialist_revolution_flag: "Социалисты внутри Непальского Народного Совета были поставлены у власти."
NEP_has_ranas: "Непалом правят Раны"

NEP_koirala_resignation_flag: "М.П. Коирала ушёл в отставку."

NEP_join_PRF_tt: "Открывает решение: £decision_icon_small §YСогласовать действия с [PRF.GetNameDef]§!"
NEP_will_join: "создаёт или присоединяется к фракции, Непал присоединится к ней вместе с ними."
NEP_join_DEH: "§YЕсли [DEH.GetNameDef] $NEP_will_join$§!"
NEP_join_BHC: "§YЕсли [BHC.GetNameDef] $NEP_will_join$§!"
NEP_join_PRF: "§YЕсли [PRF.GetNameDef] создаст или присоединится к фракции, Непал сможет присоединиться к ней вместе с ними.§!"
NEP_join_factions_india: "§YЕсли мы создадим или присоединимся к фракции, Непал присоединится к нам.§!"
NEP_follow_the_calcutta_line_radical_socialist_tt: "Социалисты Совета переориентируются на §RРадикальный социализм§!."
NEP_follow_the_calcutta_line_syndicalist_tt: "Социалисты Совета переориентируются на §rСиндикализм§!."
NEP_follow_the_calcutta_line_totalist_tt: "Социалисты Совета переориентируются на §oТотализм§!."

NEP_indian_nightmare_subject_tt: "§YЭтот дух будет удалён после воссоединения Индии.§!"
NEP_indian_nightmare_neutral_tt: "§YЭтот дух будет удалён, если мы вступим в союз с любым индийским правительством.§!"
NEP_indian_nightmare_volunteer_DEH_tt: "(§Y[DEH.GetNameWithFlag]§!) $volunteer_limit_plus_one_tt$"
NEP_indian_nightmare_volunteer_PRF_tt: "(§Y[PRF.GetNameWithFlag]§!) $volunteer_limit_plus_one_tt$"
NEP_indian_nightmare_volunteer_BHC_tt: "(§Y[BHC.GetNameWithFlag]§!) $volunteer_limit_plus_one_tt$"
NEP_indian_nightmare_decisions_tt: "§WВоенные решения§! будут разблокированы на время войны."

NEP_five_year_plan_tt: "§YЭкономика коррупции и застоя§! теперь будет §Gвременным§! и будет удалён через 5 лет."
NEP_five_year_plan_shorten_tt: "Время действия §YЭкономики коррупции и застоя§! будет §Gсокращено§!."

NEP_conspiracy_ongoing_flag: "Дарджилингский заговор продолжается."
NEP_conspiracy_influence_change_tooltip: "[$COUNTRY$.GetFlag] [$COUNTRY$.GetAdjective]ое влияние изменяется на [?NEP_conspiracy_influence_change|=Y0] очков."
NEP_conspiracy_influence_costchange_tooltip: "Стоимость решений для [$COUNTRY$.GetFlag] [$COUNTRY$.GetAdjective]ого влияния изменяется на £pol_power §Y$NUMBER$§! единиц политической власти."
NEP_backed_revolution_flag: "Мы решили поддержать заговор против Ранов."
NEP_backed_ranas_flag: "Мы решили поддержать премьер-министра против повстанцев."
NEP_backed_revolution_tt: "Мы попытаемся поддержать §lМукти§! §RСену§! в их революции по свержению Джуддхи Раны и его династии, открывая ветку фокусов §Y$NEP_the_darjeeling_conspiracy$§!."
NEP_backed_ranas_tt: "Мы продолжим поддерживать §Pпремьер-министра§! в его попытках удержать власть, открывая ветку фокусов §Y$NEP_rooting_out_the_traitors$§!."
NEP_conspiracy_start_decisions_tt: "Открывает решения £GFX_decision_icon_small §Y[NEP_loc_conspiracy_name]§!.\n\n"
NEP_conspiracy_start_NEP_tt: "§gНачнётся заговор против правящей династии Рана, открывающий соответствующую категорию решений. Примерно в это же время в следующем году премьер-министр либо будет «отстранён» от должности, либо заговорщики будут решительно разгромлены, даже если король окажется среди их числа.§!"
NEP_conspiracy_start_DEH_tt: "§gНачался заговор против правящей династии Рана в Непале, организованный нашими врагами в Калькутте, которые желают установить лояльный режим в Королевстве. Мы должны обеспечить разгром этих повстанцев, когда они сделают свой ход чуть менее чем через год, если мы не хотим получить ещё одного врага на востоке.§!"
NEP_conspiracy_start_BHC_tt: "§gНачался заговор против правящей династии Рана в Непале при полной поддержке наших храбрых агентов. Восстание должно начаться чуть менее чем через год, и мы должны обеспечить успех наших союзников в их революции, лишив Доминион ценного союзника и, возможно, приобретя одного для себя.§!"
NEP_conspiracy_spirit_tt: "§YЭтот дух будет удалён после завершения заговора.§!"
NEP_conspiracy_ending_soon_nepal_tt: "§RЗаговорщики сделают свой ход через 30 дней, окончательно определяя будущее Непала так или иначе.§!"
NEP_conspiracy_ending_soon_india_tt: "§RПовстанцы в Непале должны сделать свой ход через 30 дней, что положит конец нашим попыткам влиять на них. Мы не можем позволить нашим врагам одержать над нами верх.§!"

### Characters ###
NEP_tribhuvan: "Трибхуван"
NEP_tribhuvan_leader_desc_start: "§YДата рождения:§! §L30 июня 1906 года, Катманду, Королевство Непал§!\n§YПроисхождение:§! §LПосле кончины своего отца, короля Притхви, в 1913 году всего пятилетний Трибхуван Бир Бикрам Шах Дев стал королём Трибхуваном. Выросший под регентством королевы-матери Дивешвари Лакшми Деви, в возрасте 12 лет он женился на Канти Раджья Лакшми Деви Шах и её сестре Ишвари в один день на двух отдельных церемониях.\n\nНесмотря на то, что он был главой Королевского дома Горкха (также известного как династия Шах), ни Трибхуван, ни его мать не обладали реальной властью во время его взросления, поскольку Раны железной рукой держали реальное управление. Во время Мировой войны его и его мать запугивали и угрозами заставили отдать приказ непальским войскам воевать в поддержку усилий Британии и Антанты, что углубило взаимную неприязнь между двумя семьями.§!\n\n"
NEP_tribhuvan_leader_desc: "$NEP_tribhuvan_leader_desc_start$§LСегодня Трибхуван - взрослый человек и гораздо дольше, чем ему хотелось бы, испытывает недовольство Ранами. Пока Непальский Народный Совет продолжает строить заговоры, Трибхуван тоже чувствует, что время для его хода наступит скорее раньше, чем позже.§!"
NEP_tribhuvan_restored_leader_desc: "$NEP_tribhuvan_leader_desc_start$§LТеперь, когда Раны разгромлены, Трибхуван готов наконец исправить почти столетний деспотизм Ранов. Сосредоточив значительную власть в своих руках, время покажет, что именно Трибхуван решит делать со своим возрождённым мандатом.§!"
NEP_tribhuvan_democratic_leader_desc: "$NEP_tribhuvan_leader_desc_start$§LТеперь, когда Раны разгромлены, Трибхуван готов наконец исправить почти столетний деспотизм Ранов. Передавая свою легитимность правительству, состоящему из свободных людей Непала, Трибхуван теперь надеется руководить переходом Непала из деспотии XIX века в современное демократическое государство.§!"
NEP_tribhuvan_socialist_leader_desc: "$NEP_tribhuvan_leader_desc_start$§LТеперь, когда Раны разгромлены, Трибхуван готов наконец исправить почти столетний деспотизм Ранов. Передавая свою легитимность правительству, состоящему из свободных людей Непала, Трибхуван теперь надеется руководить переходом Непала из деспотии XIX века в современное социалистическое государство.§!"
NEP_ram_prasad_rai: "Рам Прасад Рай"
NEP_ram_prasad_rai_leader_desc: "§YДата рождения:§! §L1 марта 1910 года, Бходжпур, Королевство Непал§!\n§YПроисхождение:§! §LРодившись в зажиточной семье в деревне Сандилунг, мало кто думал, что ничем не примечательное рождение Рам Прасада Рая повлечёт за собой огромные последствия для будущего Непала. В возрасте 14 лет он вступил в армию Британского Раджа в составе элитных бригад гуркхов, прежде чем в конце концов перешёл на сторону правительства Калькутты, сражаясь вместе с индийскими повстанческими войсками против британских индийских сил.\n\nПока Бхаратийская Народная Республика зализывала раны и праздновала свою с трудом завоёванную свободу после перемирия 1927 года, Рам вскоре представил, как могла бы выглядеть такая революция на его родине, в Непале. На протяжении большей части 20-х и 30-х годов он сотрудничал со своими товарищами-революционерами и неустанно работал над внедрением политического сознания среди непальского крестьянства.\n\nПосле многолетних усилий его и его товарищей Непальская революция наконец свершилась, и его соотечественники были освобождены от оков деспотического феодализма Ранов. Тесно связанный с Индийским национальным конгрессом, многие сомневаются, что молодой Рам далеко отойдёт от партийной линии своих соратников в Индии.§!"

NEP_subarna_shumsher_rana: "Суба́рна Шамшер Рана"
