### Events ###

 nepal.1.t: "Непал в 1936 году"
 nepal.1.d: "Королевство Непал, объединённое великим Притхви Нараяном Шахом, издавна было довольно уникальным государством по сравнению со своими ближайшими соседями. Хотя, как и его индийские соседи, оно было подчинено Британией, ему всё же удалось сохранить значительную степень автономии во многом благодаря общеизвестной доблести и храбрости его войск, а также целенаправленной политике изоляционизма. Эта автономия даже получила официальное признание со стороны Британии, подтвердившей независимость Непала в 1923 году, что сделало его вторым государством в регионе, добившимся такого успеха, и первым, сделавшим это дипломатическим путём, в отличие от Афганистана.\n\nУправление Непалом также издавна отличало его от соседей, поскольку, хотя королевство на бумаге и управляется основавшей его династией Шахов, вот уже почти столетие страной правит династия Рана через наследственную диктатуру. Функционируя подобно японским сёгунатам, Раны правят Непалом через должность премьер-министра, в то время как король выступает в роли глубоко уважаемого номинального правителя, который лишь ставит печать на их приказах. Хотя правление Ранов вызывает сильное недовольство как у населения в целом, так и у самого короля; их политика жестоких репрессий, экономического застоя и непоколебимой взаимной поддержки с Британией исторически подавляла любую оппозицию их власти почти сразу же после её возникновения.\n\nКогда в Индии вспыхнул хаос с началом Революции, Непал быстро оказался втянутым в конфликт в поддержку своих британских союзников. Хотя сам Непал не стал непосредственным полем боя, тысячи гуркхов были отправлены сражаться непосредственно под британским командованием, а войска, находившиеся под командованием премьер-министра, были направлены на защиту приграничных районов, где они остаются и по сей день. Неспособность победить повстанцев, наряду с крахом их главного союзника, поставила непальское государство в крайне шаткое положение, а правительство в Калькутте открыто враждебно настроено по отношению к режиму Ранов. При поддержке [BHC.GetNameDef] в годы после перемирия начали формироваться антирановские повстанцы, главным образом Непальский Народный Совет, надеющиеся свергнуть Ранов и установить свободное государство, ориентированное на Калькутту. Только время покажет, сбудутся ли их мечты, или же Раны и их британские союзники сокрушат обоих своих врагов и ещё больше укрепят железную хватку премьер-министра."
 nepal.1.a: "Сплетенные из сотен цветов, мы - гирлянда Непала."

 nepal.5.t: "Смерть Трибхувана Шаха"
 nepal.5.d: "После продолжительной болезни король Непала Трибхуван скончался сегодня утром. Его преемником стал его сын Махендра."
 nepal.5.a: "Да упокоится он с миром."

nepal.6.t: "Будущее Ранов"
nepal.6.d: "Хотя наше удалённое королевство в Гималаях не пострадало напрямую от недавней нестабильности по всему миру, она, тем не менее, вбила очередной гвоздь в крышку гроба ранее установившегося статус-кво внутри Непала. Как раз в тот момент, когда династия Рана продолжала готовиться удерживать реальные бразды правления ещё одно столетие, заключённый в клетку монарх Трибхуван почувствовал возможность вырваться из своих оков. В конечном счёте он потерпел неудачу, и с перетасовкой влияний в столице мы теперь стоим перед новой возможностью определить будущее нации. Это во многом стало возможным благодаря системе Паджани – предоставляющей возможность назначать нового премьер-министра – конечно, в рамках ограничений, согласно которым эта должность является практически наследственной и зарезервированной за династией Шумшер Рана.\n\nНесмотря на название «Сатра Бхай» (17 братьев), есть только три реалистичных варианта. Первый вариант – довериться Джуддхе Шумшер Джанг Бахадуру Ране, олицетворяющему статус-кво в сочетании с молчаливым признанием того, что Непалу необходимо небольшое развитие, иначе народ в конце концов восстанет против семьи. Второй – Мохан Шумшер Джанг Бахадур Рана, сторонник жёсткой линии, считающий, что любые реформы, направленные на либерализацию системы, приведут лишь к распаду общества и, что ещё хуже, дадут больше власти «неопытным» слоям. Последний вариант – Падма Шумшер Джанг Бахадур Рана, которого другие Раны считают ненадёжным из-за его реформистских наклонностей и грандиозных планов, способных поколебать статус-кво. Тем не менее, он заслужил большое одобрение среди простых людей Непала."
nepal.6.a: "Безопасный статус-кво - это путь, поддержим Джуддху."
nepal.6.b: "Сторонники жёсткой линии выступают единым фронтом, поддержим Мохана."
nepal.6.c: "Нам нужны реформы, поддержим Падму."

nepal.10.t: "Непал выигрывает войну"
nepal.10.d: "Невероятно, но непальские гуркхи хлынули из гор и переламывают ход событий против нас. Возможно, пришло время уступить их требованиям и запросить мира?"
nepal.10.a: "Да, давайте закончим это сейчас"
nepal.10.b: "Нет, мы ещё можем переломить ситуацию!"

nepal.2000.t: "Патовое положение в войне с Непалом"
nepal.2000.d.claims: "Наша война с непальцами застопорилась в горах - на территории, где они сражаются слишком умело. Возможно, нам стоит запросить мира: они могут отдать нам требуемые территории и уйти сейчас, а мы откажемся от попыток завоевать их. Несомненно, они знают, что, имея достаточно времени, мы победим… но какой ценой?"
nepal.2000.d.noclaims: "Наша война с непальцами застопорилась в горах - на территории, где они сражаются слишком умело. Возможно, нам стоит запросить мира и просто уйти от этого, прежде чем битва затянется слишком надолго."
nepal.2000.a: "Да, давайте закончим это сейчас"
nepal.2000.c: "Нет! Мы возьмём Катманду или умрём, пытаясь!"

nepal.2100.t: "Мир с Непалом?"
nepal.2100.d.claims: "Война с непальцами застопорилась в горах - на территории, где они сражаются слишком умело. Посланники [From.GetAdjective]ого правительства связались с нами и попросили запросить мира: непальцы могут отдать им требуемые территории и уйти сейчас, а [Root.GetFactionName] откажется от попыток завоевать их. Несомненно, [NEP.GetNameDef] знает, что, имея достаточно времени, мы победим… но какой ценой?"
nepal.2100.d.noclaims: "Война с непальцами застопорилась в горах - на территории, где они сражаются слишком умело. Посланники [From.GetAdjective]ого правительства связались с нами и попросили запросить мира - в долгосрочной перспективе [Root.GetFactionName] несомненно победит, но какой ценой? Они говорят, что войну не стоит продолжать."
nepal.2100.a: "Тогда давайте закончим это сейчас"
nepal.2100.b: "Война не закончится, пока не падёт Катманду"

nepal.2200.t: "Мир с [From.GetNameDef]?"
nepal.2200.d.claims: "Война с [From.GetNameDef] застопорилась в горах, как мы и знали, но мы очень и очень далеки от победы. Представители [From.GetAdjective]ого правительства предложили нам передать спорные территории и уйти сейчас, сохранив независимость."
nepal.2200.d.noclaims: "Война с [From.GetNameDef] застопорилась в горах, как мы и знали, но мы очень и очень далеки от победы. Представители [From.GetAdjective]ого правительства предложили нам закончить войну и уйти сейчас, ни одна из сторон ничего не выиграла, но наша независимость сохранена."
nepal.2200.a: "Да, давайте закончим это сейчас"
nepal.2200.b: "Абсолютно нет!"
 
nepal.20.t: "Вопрос о монархии"
nepal.20.d: "С крушением основы власти, ранее принадлежавшей семье Рана, или по крайней мере большей её части, проявлявшей автократические и антиреформистские тенденции, Королевство Непал может свободно строить своё будущее среди наций, уже всерьёз вступивших в двадцатый век. До сих пор этому процессу сильно способствовал сам король – Трибхуван, который взял за привычку негласно поддерживать либеральное движение в совместных усилиях против режима Ранов. Однако верно и то, что недавняя история непальской монархии навеки связана с установлениями, созданными семьёй бывших премьер-министров, и поэтому вопрос о будущем и жизнеспособности этой недавно возникшей конституционной монархии возник вполне естественно. Хотя подавляющее большинство населения и даже новые партии выступают за сохранение позиции Трибхувана, существуют группы, которые предпочли бы вовсе упразднить этот институт, прежде чем он снова попадёт в ловушки прошлого.\n\nЛагерь сторонников монархии сплотился вокруг знамени Гуркха Дал, общинного объединения, созданного Падмой Шумшер Раной, представляющего консервативные реформистские ценности и мягкий разрыв с самыми вопиющими злоупотреблениями членов его семьи. Естественно, без монархии, с которой они были так долго связаны, даже такие люди, как Падма, остались бы в значительной степени бессильными внутри новой конституционной системы.\n\nИ наоборот, сторона, выступающая за республику, гораздо более разнообразна и разрозненна. Поскольку основная масса членов двух партий Конгресса принимает статус Трибхувана как есть, наиболее воинственные и откровенные элементы вместо этого ухватились за небольшие возможности, связанные с убеждением сговорчивых членов кабинета и лидеров периферийных фракций. Удивительно, но большая концентрация республиканцев сосредоточена на стимулировании поддержки Группы Джйоти – крупнейшего промышленно-коммерческого объединения Непала. Хотя руководство группы нейтрально в вопросе о монархии, оно состоит в основном из буддистов тхеравады, которые не питают особой любви к явно индуистской короне.\n\nНезависимо от того, как и где будут проведены линии разлома, вопрос о будущем нашей системы правления должен быть решён, прежде чем мы сможем по-настоящему начать оправляться от ущерба, нанесённого Ранами."
nepal.20.a: "С короной связано слишком много тьмы, вперёд, к Республике."
nepal.20.b: "Мы не можем рисковать дестабилизацией всей нации, сохраним Монархию."

nepal.21.t: "Выборы в Непале [GetYear] года"
nepal.21.d: "С переходом Королевства Непал к новому, конституционному порядку правления после падения режима Ранов, было лишь вопросом времени, когда народ потребует проведения настоящих выборов. Их желание исполнилось, и теперь жители гималайского королевства стоят перед важным выбором, который определит будущее их нации на долгие годы вперёд.\n\nНаиболее серьёзными претендентами на лидерство являются братья Коирала, представляющие основную массу руководства Непальского национального конгресса (NNC) и его истеблишмент. Хотя оба глубоко привержены демократическому социализму и выступали за ненасильственное свержение Ранов, это не значит, что Бишвешвар и Матрика сходятся во взглядах на всё. Для Матрики Прасада, старшего из двух братьев, будущее партии должно определяться доминированием правительственного кабинета, независимо от более широких пожеланий Рабочего комитета NNC. И наоборот, младший Бишвешвар Прасад опирался на партийные массы для поддержания своей позиции и считает, что только оставаясь верными основным ценностям и уставу NNC, могут процветать истинная демократия и социализм.\n\nНаиболее серьёзную оппозицию доминированию Коирал представляют две, весьма отличные друг от друга, партии. Суба́рна Шамшер Рана и его НДК (NDC), несмотря на то, что лидер действительно принадлежит к обширной семье Рана, отличались от NNC принятием насильственных методов свержения предыдущего режима. Однако Демократический конгресс менее радикален политически и вместо этого делает больший упор на экономическое развитие как двигатель, благодаря которому в Непале расцветёт многопартийная демократия. С другой стороны, существует Гуркха Дал – общинное объединение, сформированное условно либеральной фракцией Ранов под руководством Падмы Шумшера. Хотя эта группа «прогрессивна» по меркам старого порядка, она, тем не менее, представляет собой форму клиентелистского альянса, опирающегося на традиционные монархические ценности и консервативное мышление. Есть также последняя, малая структура, участвующая в выборах без особой надежды на победу. Группа Джйоти – это не обычная партия, так как на самом деле это крупнейший промышленный дом и бизнес Непала, возглавляемый Бхаджу Ратной Кансакаром. По своим взглядам филантропы, её члены также преимущественно буддисты тхеравады и многое сделали для сохранения и переоткрытия дорановских и доиндуистских супремасистских традиций Непала, таких как календарь Непал Самбат и язык непал бхаса, или неварский.\n\nХотя выбор труден, жители Королевства, несомненно, выберут самых достойных, чтобы нести пламя прогресса дальше в оставшейся части этого века."
nepal.21.d_2: "С возникновением Республики Непал из пепла Королевства после падения режима Ранов, было лишь вопросом времени, когда народ потребует проведения настоящих выборов. Их желание исполнилось, и теперь жители гималайской нации стоят перед важным выбором, который определит будущее их страны на долгие годы вперёд.\n\nНаиболее серьёзными претендентами на лидерство являются братья Коирала, представляющие основную массу руководства Непальского национального конгресса (NNC) и его истеблишмент. Хотя оба глубоко привержены демократическому социализму и выступали за ненасильственное свержение Ранов, это не значит, что Бишвешвар и Матрика сходятся во взглядах на всё. Для Матрики Прасада, старшего из двух братьев, будущее партии должно определяться доминированием правительственного кабинета, независимо от более широких пожеланий Рабочего комитета NNC. И наоборот, младший Бишвешвар Прасад опирался на партийные массы для поддержания своей позиции и считает, что только оставаясь верными основным ценностям и уставу NNC, могут процветать истинная демократия и социализм.\n\nНаиболее серьёзную оппозицию доминированию Коирал представляет партия, которая, хотя в определённых аспектах и похожа на Национальный конгресс, всё же весьма от него отлична. Суба́рна Шамшер Рана и его НДК (NDC), несмотря на то, что лидер действительно принадлежит к обширной семье Рана, отличались от NNC принятием насильственных методов свержения предыдущего режима. Однако Демократический конгресс менее радикален политически и вместо этого делает больший упор на экономическое развитие как двигатель, благодаря которому в Непале расцветёт многопартийная демократия. Есть также последняя, малая структура, участвующая в выборах без особой надежды на победу. Группа Джйоти – это не обычная партия, так как на самом деле это крупнейший промышленный дом и бизнес Непала, возглавляемый Бхаджу Ратной Кансакаром. По своим взглядам филантропы, её члены также преимущественно буддисты тхеравады и многое сделали для сохранения и переоткрытия дорановских и доиндуистских супремасистских традиций Непала, таких как календарь Непал Самбат и язык непал бхаса, или неварский.\n\nХотя выбор труден, жители Республики, несомненно, выберут самых достойных, чтобы нести пламя прогресса дальше в оставшейся части этого века."
nepal.21.a: "Партократы Непальского национального конгресса (NNC)!"
nepal.21.b: "Кабинетократы Непальского национального конгресса (NNC)!"
nepal.21.c: "Непальский демократический конгресс (NDC)!"
nepal.21.e: "Группа Джйоти!"
nepal.21.f: "Партия Горкха!"
 
nepal.22.t: "Определение курса Национального конгресса"
nepal.22.d: "Поскольку Непал оказался в ситуации, немыслимой до этого момента, а именно в качестве полностью освобождённой республики в социалистических рамках, ранее единый Непальский национальный конгресс (NNC) должен определить будущее направление своей политики и правительства. Хотя большинство членов были готовы сохранить монархию, были и те, кто выступал против этой перспективы - и наконец увидел своё желание исполненным. Что касается готовности применять насилие против ранее доминировавшего режима Ранов, это тоже было резкой линией разлома между множеством фракций, борющихся за господство внутри NNC.\n\nНаиболее серьёзными претендентами на лидерство являются братья Коирала, представляющие основную массу руководства NNC и его истеблишмент. Хотя оба глубоко привержены демократическому социализму и выступали за ненасильственное свержение Ранов, это не значит, что Бишвешвар и Матрика сходятся во взглядах на всё. Для Матрики Прасада, старшего из двух братьев, будущее партии должно определяться доминированием правительственного кабинета, независимо от более широких пожеланий Рабочего комитета NNC. И наоборот, младший Бишвешвар Прасад опирался на партийные массы для поддержания своей позиции и считает, что только оставаясь верными основным ценностям и уставу NNC, могут процветать истинная демократия и социализм.\n\nНаиболее серьёзную оппозицию доминированию Коирал представляют две фракции, включённые в состав NNC: Праджа Паришад и Мукти Сена. Хотя обе группы участвовали в вооружённой борьбе против Ранов, между Народным советом и Освободительной армией есть определённые важные различия. Первая, возглавляемая Танкой Прасадом Ачарьей, была больше связана с тайными планами убийств, нацеленными на режим, и находится под глубоким влиянием различных течений синдикалистской мысли. Вторая, ведомая Кунваром Индерджитом Сингхом, предпочитала вооружённую борьбу и полное неприятие любой возможности сделки с Ранами, что ещё больше подкреплялось их вдохновителями - восточными коммунистами и Субхасом Чандрой Босом.\n\nКто бы ни оказался наверху, неизбежно, что лицо Непала навсегда изменится под руководством той группы, которую члены Национального конгресса сочтут достойной вести нацию в оставшиеся годы двадцатого века."
nepal.22.a: "К.И. Сингх и Освободительная армия!"
nepal.22.b: "Т.П. Ачарья и Народный совет!"
nepal.22.c: "Б.П. Коирала и партократы Конгресса (NNC)!"
nepal.22.e: "М.П. Коирала и кабинетократы Конгресса (NNC)!"

nepal.23.t: "Пересмотр наших обязательств перед Британией"
nepal.23.d: "Несмотря на определённые первоначальные трудности, отношения между основанным гуркхами Королевством Непал и Британской империей были в целом позитивными, особенно под руководством семьи Рана. Благодаря гарантиям Империи независимости от внешнего китайского влияния и военной поддержке Непала во время различных индийских мятежей и Мировой войны, обе страны создали определённые позиции взаимного доверия и понимания в отношении друг друга.\n\nС падением Трибхувана и отсутствием у династии Шах какого-либо влияния на нашу внешнюю политику, даже если оно ранее и было минимальным, Раны столкнулись с монументальным решением. Должен ли Непал полностью принять свою роль верного союзника Империи, помогая в восстановлении власти Раджа на Индийском полуострове, или же наша политика нерушимой изоляции возобладает, и узы, связывающие нас с Британией, останутся такими, как прежде?"
nepal.23.a: "Давайте сохраним сердечные отношения с Империей на наших условиях."
nepal.23.b: "Будущее Непала принадлежит Британии."

nepal.100.t: "Непал ходатайствует о вступлении во фракцию"
nepal.100.d: "Правительство изолированной горной нации Непал связалось с нашим посольством в надежде заключить союз между Непалом и [ROOT.GetNameDef]. После долгого путешествия из уединённых гималайских вершин эти посланники принесли весть о желании [NEP.GetLeader] заключить этот исторический пакт. Хотя мы всегда рады новым братьям в борьбе [ROOT.GetFactionName], относительная изоляция Непала и его положение, зажатое между двумя геополитическими блоками, заставили некоторых задаться вопросом, не будет ли принятие Непала в наш альянс хлопотным делом, не стоящим выгод."
nepal.100.a: "Немедленно принять их!"
nepal.100.b: "Мы даже не можем найти их на карте..."

nepal.101.t: "[FROM.GetNameDef] отказывает"
nepal.101.d: "Наши предложения присоединиться к [FROM.GetFactionName] не нашли отклика в [FROM.Capital.GetCapitalVictoryPointName], где дипломаты едва ли знали о существовании нашей нации. Руководство в [FROM.Capital.GetCapitalVictoryPointName] отмахнулось от нас, посчитав нашу маленькую страну либо слишком большой обузой за малую выгоду, либо, в одном обидном случае, приняло нашу делегацию за часть тщательно продуманной шутки. С этим оскорбительным отказом мы должны пересмотреть наши варианты в геополитических делах; даже если некоторые считают, что наш лучший вариант теперь - отступить обратно в самонавязанную изоляцию нашей нации."
nepal.101.a: "Ужасно."

nepal.102.t: "[FROM.GetNameDef] принимает"
nepal.102.d: "Наши предложения присоединиться к [FROM.GetFactionName] были немедленно приняты. Дипломаты в [FROM.Capital.GetCapitalVictoryPointName] подняли тосты за новый союз между нашими нациями с лучшим алкоголем, празднуя наше родство грандиозным пиром в [FROM.Capital.GetCapitalVictoryPointName]. Хотя нас могут разделять миры с [FROM.GetNameDef], наши общие ценности гарантируют, что отныне наши нации будут стоять бок о бок в единстве, борясь за общую цель. В речи перед своими избирателями [FROM.GetLeader] назвал вступление Непала в их альянс началом падения для многих врагов нации."
nepal.102.a: "Наши гуркхи быстро разберутся с врагами [FROM.GetFactionName]."

nepal.200.t: "Гуркхи восстают!"
nepal.200.d: "Подстрекаемые нашим врагом на севере, Непалом, непальские гуркхи в Дарджилинге начали массово восставать против нашего правления, поднимаясь против нас, чтобы покориться Непалу! Как это произошло, мы понятия не имеем, но жизненно важно, чтобы мы немедленно отреагировали на этот вопиющий акт войны!"
nepal.200.a: "Пусть уходят, они не стоят борьбы."
nepal.200.b: "К войне!"

nepal.201.t: "Непал запрашивает Дарджилинг"
nepal.201.d: "Наши союзники в Непале запросили возврат территорий в Дарджилинге. Непальские гуркхи в Дарджилинге уже начали массово восставать против нашего правления, заставляя некоторых задаться вопросом, стоит ли передача этой земли Непалу таких хлопот. Должны ли мы отдать им территории, которые они считают по праву своими?"
nepal.201.a: "Пусть уходят, они не стоят борьбы."
nepal.201.b: "Ни за что."

nepal_events.1.t: "Арест Дашаратха Чанда"
nepal_events.1.d: "С тех пор как режим в Калькутте начал укреплять свою власть, они пользуются каждой возможностью, чтобы финансировать восстание против непальского государства в попытке превратить его в лояльного марионетку, возможно, даже с конечными планами аннексии. Так называемый Непальский Народный Совет (Nepal Praja Parishad) был одной из основных групп, получающих поддержку от Республики в их попытках разжечь революцию в Непале, и, несмотря на их относительно недавнее основание, им удалось собрать поразительное число сторонников на высоких постах.\n\nОднако на данный момент Калькутте придётся начать поиски новой змеи, чтобы подослать её к нам, так как по счастливой случайности второй человек в группе, Дашаратх Чанд Тхакури, был сегодня арестован в ходе рейда против членов Совета. Хотя рейд не был специально нацелен на него самого, это приятный сюрприз; и если удача будет на нашей стороне, это заставит этих повстанцев бегать как ошпаренных, в спешке ища новое руководство."
nepal_events.1.a: "Ещё одним мятежником меньше."

nepal_events.2.t: "Слухи из дворца"
nepal_events.2.d: "Несмотря на надежды, что Совет угаснет с заключением Чанд Тхакури за решётку, тревожные сообщения говорят о том, что группа стала активнее, чем когда-либо, возможно, стремясь действовать быстро, пока остальное руководство не постигла та же участь. Однако ещё более тревожны слухи, доносящиеся из дворца, касающиеся личного тренера короля, Дхармы Бхакты Матхемы. Матхема давно находится под подозрением у премьер-министра, так как этот человек когда-то был непосредственно связан с группами, которые сейчас управляют правительством в Калькутте, но никогда не было ничего конкретного, чтобы предъявить ему.\n\nОднако недавние слухи не уменьшили подозрений в отношении этого человека: сотрудники дворца сообщают, что слышали, как в моменты, считавшиеся приватными, королю высказывались довольно крамольные настроения. Один из слуг даже зашёл так далеко, что утверждал, будто король даже соглашался с этими настроениями, якобы считая, что с премьер-министром нужно что-то «сделать». Хотя у нас мало конкретных доказательств, кроме слухов от слуг, что само по себе вряд ли убедительно, учитывая, что их подслушивание уже почти граничит с изменой, трудно не чувствовать паранойю по поводу того, какой яд вливают в уши короля..."
nepal_events.2.a: "Даже если это правда, король представляет мало угрозы."

nepal_events.3.t: "Слухи из Калькутты"
nepal_events.3.d: "В дополнение к возросшей активности Совета и тревожным сплетням из дворца, мы теперь получили разрозненные сообщения о событиях в Калькутте ещё более зловещего характера. Разведка законного правительства Индии в Дели сообщила нам в прошлом году о планах калькуттского режима нанести по ним удар, надеясь вновь разжечь войну на субконтиненте, хотя эти планы были отложены после катастрофической попытки разведки боем на границах Доминиона. Теперь они сообщили нам, что эти планы, судя по всему, были реактивированы, и, что ещё тревожнее, сам Непал был включён в уравнение.\n\nХотя это и не фундаментальная часть планов вторжения, их агенты утверждают, что в Калькутте состоялась встреча с непальскими инсургентами, включая члена Совета Танку Прасада Ачарью и лидера социалистов Рам Прасада Рая, по непальскому вопросу. Якобы был предложен союз между двумя сторонами в надежде создать единый фронт против Ранов и начать революцию против нас как первую доминошку, чтобы свергнуть влияние Доминиона на субконтиненте. Хотя исход встречи ещё не известен, и сообщения предполагают, что она, в лучшем случае, была безрезультатной, это, безусловно, самая организованная группировка революционеров с момента начала их восстания, и поэтому с ней нужно разобраться как можно жёстче, прежде чем она разрастётся ещё больше."
nepal_events.3.a: "Тревожно."

nepal_events.4.t: "Дарджилингский заговор"
nepal_events.4.d: "Кажется, предыдущие сообщения о безрезультатности встречи инсургентов были слишком хороши, чтобы быть правдой, так как новости из приграничного городка Дарджилинг подтвердили наши худшие опасения. Союз был заключён между социалистическими и демократическими членами Совета, теперь действующими под общим названием Мукти Сена, Освободительная армия. Они открыто заявили о своих намерениях свергнуть династию Рана любыми необходимыми средствами, поддерживаемые своими товарищами, которые «желают увидеть освобождение Непала».\n\nЭта новость вызвала волну страха в Катманду, и все лояльные члены династии Рана сплотились вокруг премьер-министра Джуддхи Раны. Король, следуя совету премьер-министра, публично заявил о своём доверии правительству в попытке подавить это восстание, хотя вряд ли это возымеет большой эффект из-за его очевидной неискренности. С этим союзом между повстанцами и их полной поддержкой со стороны Калькутты кажется очевидным, что эта «Освободительная армия» не остановится ни перед чем, чтобы покончить с правлением Ранов в Непале, и они должны быть раздавлены, если только, возможно, такая революция нежелательна."
nepal_events.4.a: "Раны должны быть свергнуты."
nepal_events.4.b: "Государство поддерживает премьер-министра."

nepal_events.5.t: "Дарджилингский заговор"
nepal_events.5.d.DEH: "С учётом обилия слухов и сообщений о растущем милитаризме в режиме к востоку, неудивительно слышать, что Калькутта теперь начала открыто организовывать восстание против правительства Непала, одного из немногих государств в регионе, всё ещё дружественных нам. Непальское правительство под руководством премьер-министра Джуддхи Раны значительно помогало нам в прошлом, и теперь они обратились к нам за помощью в подавлении этого восстания, прежде чем оно разрастётся ещё больше.\n\nЭти повстанцы, действующие под названием Мукти Сена, или Освободительная армия, желают изгнать Ранов и вернуть власть непальскому королю - исход, который в лучшем случае оставит их нейтральными, а в худшем даст Республике нового союзника для войны против нас. Мы не можем допустить такого исхода, и мы должны помочь нашим друзьям в Катманду, которые, как мы надеемся, затем смогут помочь нам в ответ, когда Калькутта неизбежно попытается напасть на нас."
nepal_events.5.d.BHC: "Вскоре после того, как Хук был назначен председателем, многообещающий молодой человек из Непала по имени Танка Прасад Ачарья сумел организовать встречу с правительственными чиновниками, ища поддержки в свержении тиранического режима Ранов и возвращении власти непальскому королю. Несмотря на наше неодобрение каких-либо королей, был сделан выбор в поддержку этого человека, поскольку Раны долгое время были верными союзниками британцев, и слом их хватки над Непалом лишил бы Дели войск гуркхов, на которые они так полагаются. Ачарья вместе со своими союзниками теперь возглавляет основную оппозицию правительству Ранов в Непальском Народном Совете (Nepal Praja Parishad), и при нашей поддержке они превратились в грозную силу против Ранов.\n\nОднако недавно второй человек в группе, Дашаратх Чанд Тхакури, был арестован режимом Ранов, и Совет впоследствии обратился в Калькутту за дополнительной поддержкой, чтобы заполнить пустоту, оставшуюся после него. В соответствии с соглашением, которого мы достигли с Ачарьей, его организация заключила союз с более социалистически настроенными непальскими революционерами, базирующимися в Республике, которые теперь действуют вместе под единым знаменем Мукти Сены, или Освободительной армии.\n\nС возвращением на повестку дня Операции «Гром», мы отправили Мукти Сену обратно в Непал в надежде разжечь революцию против пробританских Ранов с конечной целью установления дружественного режима в Катманду, который поможет нам против Дели. Мы должны обеспечить их успех, если не хотим иметь фронт на севере, когда наконец пробьёт час для остатков британского правления."
nepal_events.5.a: "Мы не можем позволить Непалу пасть."
nepal_events.5.b: "Непал должен быть освобождён от тирании."

nepal_events.6.t: "Слухи о контрабанде"
nepal_events.6.d: "Несмотря на продолжающуюся напряжённость с Республикой, из-за которой наша общая граница охраняется гораздо тщательнее, кажется, что, к сожалению, наши люди не могут быть везде одновременно. За последние несколько дней поступили разрозненные сообщения о небольшой группе людей, пересекших границу в районе Гандаки, проскользнув мимо всех охранников и таща за собой рикшу. Однако, что довольно удивительно, все сообщения о наблюдении за этой группой до сих пор отвергали опасения, что это оружие или другое военное снаряжение из Калькутты. Вместо этого, кажется, утверждают, что это какая-то техника, и наиболее обоснованное предположение о том, что это такое - печатный станок.\n\nПодтверждение того, что эта контрабанда не является оружием для повстанцев, успокоило армию, и в данный момент никого не отправляют на поиски этих людей и их рикши, но в целом это вызвало массу недоумений, зачем они пошли на такие усилия. Ввоз печатного станка в Непал не является незаконным, цензура ещё не зашла так далеко, поэтому лучшее предположение, которое было выдвинуто, - что эти люди воры, пытающиеся сбыть с рук сложный на вид предмет, который им удалось раздобыть.\n\nТем не менее, хотя этот акт контрабанды, вероятно, можно списать на мелкую кражу, тот факт, что им это удалось, означает, что в следующий раз это запросто могут быть оружие или взрывчатка. Охрана на границе должна быть усилена, а те, кто сейчас находится на этом переходе, получат как минимум строгий выговор."
nepal_events.6.a: "Нам нужно удвоить охрану границы."

nepal_events.7.t: "Распространение крамольных газет в Катманду"
nepal_events.7.d: "Кажется, мы наконец получили ответ на загадку контрабандной операции несколько недель назад, и это не тот ответ, на который мы надеялись. За последние несколько дней, куда ни повернись в Катманду, можно было найти экземпляр газеты Janata Patrika из Калькутты, наполненной крамольными и изменническими заявлениями о премьер-министре и его семье. Вместе с этой грязью часто идёт и памфлет от Непальского Народного Совета, берущего на себя ответственность за всю операцию и гордо заявляющего о своих угрозах нации:\n\n«Династия Рана! Вы должны знать, что Непальский Народный Совет был создан с целью освободить и вызволить непальский народ из ваших жестоких тисков, обучить его чистому знанию, почтить его расу, заслужить богатство и религию, и сделать его одной из цивилизованных рас мира, и заставить эхо гордости за свою страну звучать во всех направлениях тысячи лет».\n\nХотя эти бумаги вряд ли возымеют большой эффект, так как большинство достаточно грамотных, чтобы их прочитать, просто сбиты с толку материалом, сам факт, что мы позволили этому проскочить мимо нас, довольно унизителен. Отсутствие отслеживания печатного станка после его обнаружения означает, что мы сейчас не знаем, где он оказался, что потенциально могло бы раскрыть операции Совета. Всё, что мы действительно можем сделать на данный момент, это решить, как реагировать на то, что уже было распространено, причём премьер-министр особенно хочет, чтобы виновные были найдены с использованием всех ресурсов, которые мы можем выделить."
nepal_events.7.a: "Сжечь эти бумаги и найти их печатников."
nepal_events.7.b: "Эта чушь даже не стоит ответа."

nepal_events.8.t: "Генерал Буратоки встречается с королём"
nepal_events.8.d: "Недавние волнения во дворце вызвали серьёзное беспокойство у ближайших советников премьер-министра, поскольку генерал Гири Прасад Буратоки за последние несколько недель организовывал необычно большое количество личных встреч с королём. Несмотря на важную роль генерала как одного из немногих командующих офицеров в Непале, участвовавших в боевых действиях, сражавшегося вместе с Британской Индийской армией в Индийской революции, его последующее разочарование в них, приведшее к возвращению в Непал, часто заставляло многих задаваться вопросом, не питает ли он каких-либо революционных симпатий.\n\nХотя никто, кроме короля и самого генерала, не знает, что обсуждалось на этих встречах, есть большие подозрения, что генерал, возможно, был скомпрометирован повстанцами и теперь пытается втянуть в заговор и короля.\n\nЕсли эти слухи верны и повстанцы пользуются поддержкой ключевых генералов, необходимо принять все меры, чтобы остановить рост их влияния. Однако было бы невозможно принять меры против генерала, основываясь только на слухах, не усугубив ситуацию, но неофициальное отстранение его от дальнейших встреч было бы разумным курсом действий. Мы также должны помнить, что мы действуем исключительно на основе слухов, и человек может быть полностью невиновен, и его отстранение может вызвать ненужные трения ради малой выгоды."
nepal_events.8.a: "Не стоит слишком остро реагировать на слухи."
nepal_events.8.b: "Запретить любые подобные встречи в будущем."

nepal_events.9.t: "Волна арестов в Покхаре"
nepal_events.9.d: "На этот раз премьер-министр смог проснуться с хорошими новостями о повстанцах: в городе Покхара была проведена волна арестов среди тех, кто пытался распространять памфлеты Совета. До сих пор повстанцы действовали в основном в районе Катманду и областях к востоку от него, и поэтому это была явная попытка начать расширять своё восстание на остальную часть страны. Однако, к счастью для нас, группа незнакомых мужчин, прибывших в незнакомый город с попыткой раздавать листовки - это тот тип действий, который вызовет подозрения у любого местного жителя. Очень быстро эти повстанцы были сданы властям и арестованы, и если им повезёт, возможно, они просто просидят в камере до конца своей жизни, или, если не повезёт, до прибытия палача."
nepal_events.9.a: "Ещё одна партия мятежников обезврежена."

nepal_events.10.t: "Расширение Армейского пенсионного фонда"
nepal_events.10.d: "Продолжающееся восстание привело многих в правительстве в состояние крайнего напряжения, состояние, которое можно было бы назвать паранойей, если бы говорящий находился вне пределов слышимости премьер-министра. В то время как ранее любое восстание против государства подавлялось ещё до того, как становилось проблемой, индийская поддержка этого восстания сделала его реальной угрозой; и по мере того как правительственная паранойя множится, страхи по поводу того, насколько далеко может зайти их заговор, также умножаются.\n\nНедавние частные переговоры между королём и генералом Буратоки заронили в умы людей зерно сомнения, что любая часть непальского государства может быть скомпрометирована, особенно армия, и если армия будет скомпрометирована, остановить любую революцию может стать невозможным. Однако в надежде развеять эти страхи было предложено принять активные меры, чтобы удержать армию на своей стороне или вернуть её, если она уже была скомпрометирована.\n\nНесколько лет назад был создан Армейский пенсионный фонд как система пенсионного обеспечения для солдат, где солдаты отчисляют процент от своего жалованья в пенсионный фонд, чтобы обеспечить себя после выхода на пенсию. Эта система уже творит чудеса для общественного имиджа Ранов среди вооружённых сил, но было предложено, что дальнейшее расширение системы, с прямым взносом из государственной казны в итоговые пенсионные выплаты, может быть именно тем, что нужно для ещё большего укрепления их лояльности."
nepal_events.10.a: "Выделить немного дополнительных средств, в долгосрочной перспективе это окупится."
nepal_events.10.b: "Эти взятки не стоят таких затрат."

nepal_events.11.t: "Налёт на Биргандж"
nepal_events.11.d: "Кажется, количество охранников, развёрнутых на границе после инцидента с контрабандой, было далеко не достаточным, так как сегодня люди из Мукти Сены, прибывшие из Республики, совершили налёт на оружейный склад в Биргандже. Двое охранников склада попытались остановить налёт и были застрелены бандитами, запасы винтовок со склада были захвачены, а повстанцы, насколько можно судить по всем сообщениям, ушли невредимыми. Хотя это оружие было в основном винтовками Гахендра, которые были сняты с вооружения и постоянно хранились на складах, как того требует политика правительства в отношении старого снаряжения, они, вероятно, всё ещё найдут применение в будущих нападениях на нас, и вся эта ситуация - большое унижение."
nepal_events.11.a: "Найти этих людей, немедленно!"

nepal_events.12.t: "Предотвращена попытка массового самосожжения"
nepal_events.12.d: "Несмотря на громкий характер действий Мукти Сены против правительства, важно не забывать, что они не единственная угроза для премьер-министра, и другие единомышленные группы могут совершать свои собственные формы измены против Непала. В последние годы группа, состоящая в основном из женщин, возглавляемая одной из немногих женщин-аскетов в Непале, Йогмаей Неупане, медленно становится занозой в боку правительства. Хотя сначала Неупане рассматривалась как более терпимая форма оппозиции, в основном просто призывающая премьер-министра к реформам через апелляцию к индуизму, что можно было успокоить символическими уступками, она стала гораздо более открыто враждебной к самому государству, а не просто к системам внутри него.\n\nЗа последние несколько месяцев, с тех пор как наша борьба против Мукти Сены начала обостряться, она становилась всё смелее в своих требованиях, угрожая совершить самосожжение, чтобы разжечь восстание против режима. Это были явно не пустые угрозы, так как сегодня она и её последователи попытались привести угрозу в исполнение, и были остановлены лишь охранниками, посланными лично премьер-министром, за мгновения до того, как должен был быть зажжён погребальный костёр. Десятки женщин, а также чуть меньше дюжины мужчин были арестованы за участие в этом инциденте, причём мужчины были отправлены в тюрьму в Дханкуте, а женщины заключены в храме Радхакришны.\n\nХотя мужчины, участвовавшие в инциденте, вероятно, останутся за решёткой надолго за измену нам, судьба женщин не столь однозначна. Храм, в котором их содержат, вряд ли подходит для длительного заключения, но другого подходящего места для их содержания нет, и держать женщин в заключении потенциально годами - это плохо выглядит, какими бы изменницами они ни были. Поэтому было предложено просто отпустить их через несколько дней и установить тщательное наблюдение, чтобы предотвратить будущие инциденты. Однако нет гарантии, что они не найдут альтернативные способы досаждать государству, когда снова окажутся на свободе, и поэтому, возможно, вместо этого стоит держать их взаперти так долго, как только возможно."
nepal_events.12.a: "Дать им несколько лет за решёткой, это поставит их на место."
nepal_events.12.b: "Выпустить их через несколько дней, они не представляют большой угрозы."

nepal_events.13.t: "Джая Сингх критикует премьер-министра"
nepal_events.13.d: "Хотя Непал признаёт только одного великого короля, его величество Трибхувана, который правит всеми землями Непала, многие мелкие королевства, объединившиеся под знаменем Притхви Нараяна Шаха, до сих пор существуют как вассалы государства. Сам премьер-министр, как и его предшественники, титулуется махараджей Каски и Ламджунга, получив эти титулы при установлении правления династии. Однако из этих королевств в последние годы ни одно не было столь проблемным, как Баджханг, и его бывший раджа Джая Притхви Бахадур Сингх.\n\nБудучи раджей, Сингх постоянно колебался между союзником государства и его врагом, выдвинувшись первоначально во время недолгого правления Дева Шумшера Раны как самый ярый сторонник образовательных реформ в стране; и, как следствие, был вынужден отправиться в изгнание, когда Дев был свергнут за свой реформизм. Хотя позже он примирился с новым премьер-министром, Чандрой Шумшером Раной, его оппозиция поддержке британцев в Мировой войне привела ко второму изгнанию, на этот раз добровольному, в Индию. Когда началась революция в Индии, он стал поддерживать военные усилия, оказывая медицинскую помощь раненым Республики, а его гуманистические и реформистские взгляды сделали его заметной фигурой среди политических умеренных Калькутты.\n\nДействуя теперь из самой Калькутты и возражая против очевидной «жестокости» премьер-министра в последние месяцы, Сингх произнёс речь, призывающую к прекращению правления Ранов и к непальской «свободе». Эта речь, предположительно организованная правительственными лицами в Республике, вряд ли окажет прямое воздействие на Мукти Сену, но тот факт, что такая заметная фигура выступила против нас, безусловно, создаёт плохое впечатление. Если новости о его речи распространятся по Непалу, это потенциально может нанести значительный репутационный ущерб, что потребует проведения кампании цензуры, хотя затраты на её проведение могут не стоить хлопот, учитывая, каким небольшим влиянием он обладает в Непале в наши дни, даже в самом Баджханге."
nepal_events.13.a: "Природа скоро разберётся с этим наглым стариком."
nepal_events.13.b: "Подвергнуть цензуре любое распространение этой клеветы в Непале."

nepal_events.14.t: "Покушение на Бабера Шумшера"
nepal_events.14.d: "Даже несмотря на постоянные нападки на непальское государство, мало кто мог ожидать, что Мукти Сена опустится так низко, как сегодня. Сегодня, когда герой Мировой войны Бабер Шумшер Рана возвращался домой, в его машину была брошена бомба с целью покушения. Хотя бомба не взорвалась, один из потенциальных убийц вытащил пистолет и выстрелил в Бабера, попав в него по крайней мере дважды. Оставив генерала умирать, эти люди попытались скрыться с места происшествия, но, к счастью, были застрелены солдатами, прибывшими на звуки выстрелов.\n\nСам Бабер, хотя и тяжело ранен, к счастью, выжил, и по всему Катманду были размещены солдаты для защиты всех известных членов династии Рана от дальнейших попыток убийства. Разгневанный этим актом варварства, премьер-министр заявил, что правительство не остановится ни перед чем, чтобы уничтожить это восстание, ясно давая понять, что ни одному мятежнику не будет предоставлено снисхождение и что скоро все они встретят ту же участь, которую пытались уготовить Баберу."
nepal_events.14.a: "На этот раз они зашли слишком далеко."

nepal_events.15.t: "Заговорщики в движении"
nepal_events.15.d: "Кажется, что покушение на Бабера было лишь первым выстрелом революции, так как агенты Доминиона сообщили нам о медленном сосредоточении обученных в Калькутте войск по всей границе страны.\n\nПо всему Непалу повсеместно ходят слухи о вооружённых людях, стремительно передвигающихся глубокой ночью, армии отдан приказ готовиться к худшему."
nepal_events.15.a: "Будущее Непала под угрозой."

nepal_events.16.t: "Заговорщики в движении в Непале"
nepal_events.16.d.DEH: "Наши агенты, действующие по всей Республике, начали докладывать нам о сосредоточении войск у непальской границы, по-видимому, готовящихся к враждебным действиям. Хотя сразу же зазвучала тревога и по поводу того, что это может означать вторжение и против нас, в других местах мы не наблюдали особого движения, что позволяет предположить, что Калькутта пока намеревается действовать только против Непала.\n\nВероятно, скоро эти войска вместе со своими союзниками внутри самого Непала попытаются осуществить свою запланированную революцию против Ранов. Мы уже отправили весточку Джуддхе Ране, и всё, что мы можем сейчас сделать, это подготовиться к тому, что они сделают свой ход."
nepal_events.16.d.BHC: "Несмотря на наши рекомендации против этого, наши союзники из Мукти Сены в Непале несколько недель назад предприняли попытку покушения на видного члена династии Рана, в конечном счёте не сумев убить его. С тех пор непальское правительство ужесточило репрессии настолько, насколько это возможно без активной отправки войск через нашу границу, и Мукти Сена осознала, что у них сейчас почти нет другого выбора, кроме как действовать.\n\nТе, кто действует с наших территорий, теперь начали собираться на ключевых позициях по ту сторону границы, в то время как те, кто находится в самом Непале, начали организовываться на ключевых позициях, и все теперь готовятся, наконец, начать свою революцию против Ранов."
nepal_events.16.a: "Мы должны помогать нашим союзникам, насколько это возможно."

nepal_events.18.t: "Непальская революция"
nepal_events.18.d: "Нанеся удары по всему Непалу, быстро захватив Покхару на западе и Хетауду на юге, то, что Мукти Сена ожидала как кровавую войну по всей стране, закончилось, по сути, хныканьем, за исключением осады самой столицы. После заявления короля об отставке Джуддхи Раны с поста премьер-министра и дальнейшего заявления армии о сложении оружия, лишь немногие действительно выступили против повстанцев, когда те начали устанавливать контроль над страной. Те, кто всё ещё был верен правлению Ранов, в основном отступили в столицу под руководством генерала Экраджа Шумшера Раны, надеясь переломить ход событий или, по крайней мере, доблестно принять последний бой.\n\nНе встретив особого сопротивления, войска Мукти Сены под руководством Суба́рны Шамшера Раны со стороны Совета и Кунвара Сингха со стороны социалистов Совета начали осаду столицы в течение нескольких часов после начала восстания. Бои между войсками Экраджа и Мукти Сеной продолжались до конца дня, и быстро стало очевидно, что Раны уступают в численности и вооружении. Вместо того чтобы сражаться насмерть, правительственные войска наконец сложили оружие ближе к закату, сдавшись повстанцам. Ранним утром следующего дня, когда пыль улеглась, прибытие короля на встречу с лидерами повстанцев было встречено громкими приветствиями, и вскоре должны были начаться обсуждения формирования первого свободного правительства Непала."
nepal_events.18.a: "Непал наконец-то свободен!"

nepal_events.19.t: "Лояльность Калькутте"
nepal_events.19.d: "С падением династии Рана, и по сообщениям, бывший премьер-министр Джуддха Рана бежал из страны, новое правительство потребуется быстро для восстановления порядка. Неудивительно, что король поспешил назначить лидера Совета, М.П. Коиралу, новым премьер-министром страны, поручив ему сформировать временное правительство и направить Непал по пути демократии. Однако, действуя по указке из Калькутты, социалистические члены Совета заявили, что откажутся поддерживать правительство, если они не будут поставлены во главе, чтобы руководить социалистическим государством, лояльным своим покровителям.\n\nХотя мы, вероятно, можем противостоять их влиянию и всё же назначить Коиралу, возможно, будет благоразумно просто уступить и полностью согласовать свои действия с Калькуттой для защиты от Доминиона и дальнейшей нестабильности."
nepal_events.19.a: "Демократия должна быть установлена, а монархия сохранена."
nepal_events.19.b: "Никаких компромиссов, мы тоже примем социализм."

nepal_events.20.t.DEH: "Раны свергнуты в Непале"
nepal_events.20.t.BHC: "Непальская революция побеждает"
nepal_events.20.d.DEH: "Сегодняшние новости можно описать только такими словами, как катастрофа, или используя длинную череду ругательств. В Непале произошла революция, свергнувшая наших друзей из династии Рана и приведшая к власти группу радикалов, ориентированных на Калькутту. Несмотря на их уступающие непальским вооружённым силам возможности, повстанческим войскам удалось захватить власть при незначительном сопротивлении благодаря личной поддержке революции королём, надеявшимся избавиться от Ранов, которые держали его династию в оковах почти столетие.\n\nХотя Джуддха Рана и некоторые из его людей сумели бежать через границу к нам, мы потеряли ценного союзника, и, что ещё хуже, теперь мы можем обрести врага, если Калькутте удастся установить своих самых ярых сторонников в Катманду."
nepal_events.20.d.BHC: "Чудесные новости поступили из Непала; Мукти Сена захватила контроль над Катманду, и все оставшиеся силы, верные династии Рана, сдались, причём большая часть армии сложила оружие по приказу короля. Единственная горькая новость в этом сообщении - это то, что свергнутому премьер-министру удалось бежать, скрывшись с несколькими оставшимися лоялистами в Доминионе, хотя с текущими военными планами он вряд ли сможет долго избегать правосудия.\n\nОднако, что более важно, непальский король созвал руководство Совета и наших союзников из Праджа Паришад для обсуждения создания нового правительства, и, как мы надеемся, вскоре мы сможем оказаться в идеальном положении, чтобы повлиять на эти обсуждения в нашу пользу."
nepal_events.20.a: "Проклясть Калькутту в ад, а Совет вместе с ними."
nepal_events.20.b: "Непал теперь вкушает свободу, и скоро вся Индия последует его примеру!"

nepal_events.21.t: "Будущее непальского правительства"
nepal_events.21.d: "С падением династии Рана в Непале и, по сообщениям, бегством бывшего премьер-министра Джуддхи Раны из страны, новое правительство потребуется быстро для восстановления порядка. Неудивительно, что непальский король поспешил назначить лидера Совета, Матрику Прасада Коиралу, новым премьер-министром страны, поручив ему сформировать временное правительство и направить Непал по пути демократии. Хотя мы можем считать Совет союзником, их отсутствие приверженности международному социалистическому делу означает, что они почти наверняка направят Непал по пути нейтралитета и капитализма, даже если внешне они могут быть дружелюбны к нам.\n\nЕсли бы мы захотели, мы могли бы легко вместо этого установить наших союзников из социалистической фракции Праджа Паришад в качестве единоличных правителей Непала, полностью подчинив его себе и гарантировав его поддержку как против наших врагов в Индии, так и против наших будущих врагов по всей Азии. Однако такое правительство вряд ли будет стабильным и почти наверняка на десятилетия отстаёт от фактического внедрения того, что кто-либо мог бы по доброте душевной назвать социализмом, и поэтому, возможно, будет благоразумно позволить им остаться нейтральными под руководством Коиралы. Что бы ни случилось, наше огромное влияние на Непал означает, что в конечном счёте выбор за нами."
nepal_events.21.a: "Позволить Непалу самому выбирать свою судьбу."
nepal_events.21.b: "Установить лояльное правительство в Катманду."

nepal_events.22.t: "Хаос в Катманду"
nepal_events.22.d: "На встрече с королём несколько дней назад в рамках подготовки к восстанию член Совета Танка Прасад Ачарья обратился к Трибхувану с просьбой открыто поддержать их революцию против Ранов в надежде избежать кровавых столкновений между вооружёнными силами и повстанцами. Опасаясь, что Мукти Сена слишком слаба, чтобы взять власть, король отклонил его просьбу, надеясь, что они просто отложат революцию до более подходящего времени. Однако, что в ретроспективе было плохим решением, Мукти Сена всё равно начала своё восстание независимо от этого. За этим последовали кровавые бои по всей стране, такие города, как Биргандж, быстро переходили к повстанцам, а затем отбивались правительственными войсками в смертоносных перестрелках.\n\nОднако ни одно сражение не было столь разрушительным, как в самом Катманду, где основные силы Мукти Сены оказались втянутыми в бой с войсками под командованием самого Джуддхи Раны. Несмотря на преимущество его войск, премьер-министр был сражён шальной пулей, когда вытеснял повстанческие войска из западных районов столицы, что вызвало хаос в рядах. Даже сейчас, оставшись без руля, войска Рана, кажется, настроены медленно вытеснять Мукти Сену из города, но, вероятно, ценой больших потерь. С обеих сторон этого конфликта раздаются призывы к королю вмешаться и спасти нацию..."
nepal_events.22.a: "Король должен спасти нас!"

nepal_events.23.t: "Приказ государя"
nepal_events.23.d: "Конец этому жестокому конфликту принесла не дальнейшая смерть, а шествие государя по улицам Катманду в сопровождении бесчисленных армейских офицеров, всегда остававшихся непоколебимо верными королю. Суба́рна Шамшер Рана, лидер фракции Совета в Мукти Сене, Кунвар Сингх как лидер социалистов Совета и Кайзер Шумшер Рана как исполняющий обязанности лидера правительства выступили вперёд как представители своих сторон для встречи с королём вскоре после его прибытия.\n\nХотя обе стороны были согласны в том, что боевые действия необходимо прекратить, ни одна из них не была готова просто сдаться другой. Однако в конце концов между Советом и Ранами был достигнут компромисс, согласовано формирование правительства, возглавляемого в основном самим Трибхуваном. В соответствии с этим соглашением Праджа Паришад должен был войти в состав этого нового правительства в качестве лидеров, а лояльным членам династии Рана были предоставлены министерские посты ради стабильности. Главным образом Непал также должен был объявить официальный нейтралитет в индийском конфликте, полностью порвав с попытками как Доминиона, так и Республики влиять на него.\n\nОднако не все были готовы принять эту сделку: социалисты Совета решительно возражали против предложения о нейтралитете, а также не упустили из виду, что в соответствии с ним они будут исключены из правительства. После того как Совет дал понять, что готов принять компромисс, лидеры социалистов Совета вышли из совещания, хотя риск дальнейшего конфликта был невелик, поскольку Мукти Сена в целом, кажется, подчинилась соглашению. По крайней мере, на данный момент Непал находится в мире, возглавляемый своим восстановленным государем."
nepal_events.23.a: "Да здравствует Его Величество!"

nepal_events.24.t: "Реставрация монархии в Непале"
nepal_events.24.d.DEH: "Трудно понять, как относиться к новостям, полученным сегодня утром из Непала. Несколько дней назад революция против режима Ранов началась в полную силу, развязав жестокий конфликт по всему Непалу, и быстрой победы ни одной из сторон не предвиделось. Несмотря на все наши усилия поддержать премьер-министра против повстанцев, наш добрый друг Джуддха Рана был убит при защите Катманду. Очевидно, испугавшись краха без командования своего лидера, правительство согласилось на предложение короля выступить посредником в прекращении огня, начав переговоры с Мукти Сеной о мирном урегулировании.\n\nХотя в соответствии с этим соглашением лидер Совета, к сожалению, был вознаграждён постом премьер-министра, король должен был по-настоящему держать бразды правления, и многие лояльные Раны должны были получить министерские посты в рамках компромисса. Социалисты также были полностью исключены из этого нового правительства, что для нас облегчение, хотя эта новость также сопровождалась объявлением о разрыве Непалом связей как с нами, так и с Республикой. Несмотря на потерю потенциального союзника в нашей борьбе против Калькутты, нейтралитет Непала, по крайней мере, удерживает их от угрозы нам в ближайшем будущем, поэтому мы должны быть по крайней мере благодарны, что исход не был хуже."
nepal_events.24.d.BHC: "Трудно понять, как относиться к новостям, полученным сегодня утром из Непала. Несколько дней назад революция против режима Ранов началась в полную силу, развязав жестокий конфликт по всему Непалу, и быстрой победы ни одной из сторон не предвиделось. Несмотря на все наши усилия поддержать Мукти Сену, они оказались почти вытесненными из Катманду, хотя и смогли убить премьер-министра Рана в процессе. Очевидно, полагая, что у них нет шансов в затяжном конфликте, они ухватились за возможность, когда король предложил выступить посредником между двумя сторонами.\n\nХотя результатом этого посредничества стал конец абсолютного правления Ранов и назначение члена Совета премьер-министром, Совет согласился допустить лоялистов Рана к участию в правительстве и, что более важно, согласился исключить всех социалистов из него. Это новое правительство также согласилось на полный нейтралитет в отношении Индии, разорвав связи с нами, но также и с Доминионом. Несмотря на то, что мы не получили союзника, мы, по крайней мере, достигли нашей цели - сломали хватку Доминиона над Непалом, и поэтому мы всё же можем в конечном счёте записать этот инцидент в Непале как победу."
nepal_events.24.a: "Нейтралитет, по крайней мере, лучше враждебности..."

nepal_events.25.t: "Неудавшийся переворот в Катманду"
nepal_events.25.d: "Несмотря на надежды Мукти Сены посеять хаос, нанеся удар по правительству по всей стране, они, по-видимому, были не готовы к тому, что армия будет поджидать их. На западе их попытки захватить Покхару были быстро подавлены войсками под командованием Экраджа Шумшера Раны, в то время как старший сын премьер-министра аналогичным образом быстро ликвидировал все попытки захватить Хетауду на юге. Явно не осознавая, что они уже проиграли, оставшиеся повстанческие силы попытались также атаковать Катманду, даже не сумев приблизиться к границам города, прежде чем были обращены в массовое бегство.\n\nЛидеры повстанцев, зная, когда тонет корабль, бежали через границу в Республику, явно находясь в заблуждении, что они могли бы попытаться реорганизоваться позже. Однако, к большому удивлению, к ним присоединился сам король, опасаясь, что его связи с повстанцами подвергнут его риску возмездия теперь, когда их восстание было подавлено. Поскольку король считается отрёкшимся от престола, и не осталось очевидного преемника, так как его семья бежала вместе с ним, премьер-министр объявил, что будет установлено регентство до тех пор, пока не будет найден новый король. Действуя теперь как регент, Джуддха Рана провозгласил, что Непал продолжит подавлять все остатки этого восстания, даже если для этого придётся перейти границу."
nepal_events.25.a: "Непал твёрдо стоит против мятежа!"

nepal_events.26.t: "Революция терпит неудачу в Непале"
nepal_events.26.d.DEH: "В редком для этих дней повороте событий мы наконец получили порцию хороших новостей. Сегодня утром повстанцы в Непале наконец начали своё давно запланированное восстание против династии Рана, пытаясь быстро захватить контроль над несколькими городами по всей стране. Однако за этим последовала резня сотен этих повстанцев солдатами, верными премьер-министру, которые были полностью готовы ко всем этим атакам против них. Последняя атака повстанцев на Катманду, состоящая из основной массы повстанческих сил, была быстро отбита, даже не проникнув в город.\n\nВвиду их неудачи лидеры повстанцев бежали в Калькутту, и, к удивлению, к ним присоединился король Трибхуван, который, как утверждается, пытался поддержать восстание. Джуддха Рана, действуя теперь как регент в связи с вакантностью трона, поклялся выследить этих предателей и заявил о своей поддержке нас, когда Республика неизбежно нападёт на нас обоих."
nepal_events.26.d.BHC: "Сегодняшние новости можно описать только такими словами, как катастрофа, или используя длинную череду ругательств. Несмотря на нашу сильную поддержку Мукти Сены, их попытка восстания была подавлена, даже не успев толком начаться, поскольку правительственные силы отразили все попытки захватить контроль над городами по всему Королевству. Руководство повстанцев бежало через границу к нам, надеясь, возможно, на другую возможность в будущем избавиться от Ранов. Непальский король также присоединился к ним, опасаясь за свою жизнь из-за его тайной поддержки повстанцев.\n\nТем временем непальский премьер-министр, теперь действующий как регент, полностью согласовал свои действия с Доминионом и заявил о своём намерении вторгнуться к нам, чтобы захватить руководство Мукти Сены. Кажется, Непал теперь должен быть полностью включён в планы вторжения..."
nepal_events.26.a: "На этот раз щупальца Калькутты не смогли захватить очередную жертву."
nepal_events.26.b: "Операция «Гром» - наш единственный оставшийся вариант для освобождения Катманду."

nepal_events.30.t: "Судьба приграничных территорий"
nepal_events.30.d: "Во время индийской революции мы отправили войска в несколько приграничных штатов для их гарнизонной службы в пользу британцев, предотвратив их попадание в руки повстанцев. С тех пор мы официально признавали эти земли индийскими, планируя вернуть полный контроль над ними, когда ситуация достаточно стабилизируется для этого. Теперь, когда мы оказались в союзе с индийским правительством, находящимся в полном положении, чтобы взять их под свой контроль, мы уведомили их о наших намерениях сделать это, хотя точный перечень передаваемых земель оставляет пространство для манёвра. Хотя трудно спорить, что [814.GetName] и [887.GetName] не являются индийскими, поскольку они были полностью частью Британской Индии, Королевство Сикким всегда считалось отдельным, так же как мы или Бутан. В результате мы, возможно, сможем убедить наших союзников признать наш контроль над ним, позволив ему оставаться отдельным от Индии под нашей властью, всё ещё передавая два других региона."
nepal_events.30.a: "Передать все спорные территории индийцам."
nepal_events.30.b: "Вернуть Уттаранчал и Дарджилинг, но просить оставить Сикким."

nepal_events.31.t: "Непал возвращает оккупированные территории"
nepal_events.31.d.DEH: "С возвращением Индии под нашу власть следующим пунктом повестки дня стали те территории, которые всё ещё удерживаются непальскими войсками.\n\nВсегда признавая эти земли индийскими, просто защищёнными ими от повстанцев, не потребовалось много усилий, чтобы добиться их возвращения, и Непал теперь передал полный контроль над бывшими индийскими территориями [814.GetName] и [887.GetName], а также землями, составлявшими Королевство Сикким."
nepal_events.31.d.BHC: "Хотя Непал никогда не был нашим прямым врагом во время Индийской революции, их войска были развёрнуты в поддержку Британии, чтобы помешать нам захватить ключевые регионы, такие как [814.GetName] и [887.GetName], а также, воспользовавшись ситуацией, захватили контроль над Королевством Сикким.\n\nТеперь, когда их обязательства перед британцами и их прихвостнями в Дели остались в прошлом, они согласились передать контроль не только над индийскими территориями, но и над самим Сиккимом, и наши войска уже направляются на замену непальским."
nepal_events.31.a: "Как и следовало ожидать."

nepal_events.32.t: "Статус Сиккима"
nepal_events.32.d.DEH: "С возвращением Индии под нашу власть следующим пунктом повестки дня стали те территории, которые всё ещё удерживаются непальскими войсками. Всегда признавая эти земли индийскими, просто защищёнными ими от повстанцев, не потребовалось много усилий, чтобы добиться их возвращения, и Непал теперь передал полный контроль над бывшими индийскими территориями [814.GetName] и [887.GetName].\n\nОднако возникла проблема со статусом Сиккима, территории, которая, хотя и была протекторатом Британии, считалась отдельной от Индии, так же как Бутан и сам Непал. Они утверждали, что их контроль над ним возник в результате конфликта между двумя суверенными державами и, следовательно, по праву принадлежит им. Хотя такой аргумент явно ошибочен, возможно, просто легче согласиться на просьбу, ведь в конце концов, что мы действительно выиграем от более прямого контроля над несколькими горными деревнями?"
nepal_events.32.d.BHC: "Хотя Непал никогда не был нашим прямым врагом во время Индийской революции, их войска были развёрнуты в поддержку Британии, чтобы помешать нам захватить ключевые регионы, такие как [814.GetName] и [887.GetName], а также, воспользовавшись ситуацией, захватили контроль над Королевством Сикким. Теперь, когда их обязательства перед британцами и их прихвостнями в Дели остались в прошлом, они согласились передать контроль над индийскими территориями.\n\nОднако возникла проблема со статусом Сиккима, территории, которая, хотя и была протекторатом Британии, считалась отдельной от Индии, так же как Бутан и сам Непал. Они утверждали, что их контроль над ним возник в результате конфликта между двумя суверенными державами и, следовательно, по праву принадлежит им. Хотя такой аргумент явно ошибочен, возможно, просто легче согласиться на просьбу, ведь в конце концов, что мы действительно выиграем от более прямого контроля над несколькими горными деревнями?"
nepal_events.32.a: "Они должны вернуть всё, без исключений."
nepal_events.32.b: "Пусть оставят себе, для нас это малоценно."

nepal_events.33.t: "[FROM.GetNameDefCap] отклоняет нашу просьбу оставить Сикким"
nepal_events.33.d: "Несмотря на нашу законную и мирную просьбу, [FROM.GetNameDef] отказался позволить нам оставить Сикким и забрал его вместе с остальными возвращёнными территориями."
nepal_events.33.a: "Даже крошек не дали оставить..."

nepal_events.34.t: "[FROM.GetNameDefCap] соглашается на нашу просьбу оставить Сикким"
nepal_events.34.d: "Явно недовольные соглашением, но не желая спорить по этому поводу, [FROM.GetNameDef] согласился на нашу просьбу и оставил нам контроль над Сиккимом, забрав обратно другие территории."
nepal_events.34.a: "Фантастика!"

nepal_events.100.t: "Непал предоставляет дополнительные дивизии гуркхов"
nepal_events.100.d: "Гуркхи, получившие своё название от местного этнохоронима непальских мужчин, из которых они состоят, издавна были одними из самых элитных войск Британской индийской армии и остаются таковыми при Доминионе. С хаосом в Индии и последующей революцией в Непале набор дополнительных гуркхов стал очень трудным, так как больше солдат требовалось на родине для защиты своей нации. Однако теперь, когда с восстанием покончено и Непал желает отплатить услугой, они прислали нам две дивизии, полностью укомплектованные солдатами, сражавшимися против Мукти Сены, с обещаниями как можно скорее вернуть набор на нормальный уровень. Мы, конечно, поблагодарили их за это и надеемся, что гуркхи всегда будут оставаться важной частью вооружённых сил."
nepal_events.100.a: "«Лучше умереть, чем быть трусом»."

nepal_events.101.t: "Непал просит большей свободы"
nepal_events.101.d: "После нашего вмешательства в Непальскую революцию Непал оказался очень прочно под нашим контролем: индийские войска постоянно дислоцированы в Катманду для обеспечения порядка и защиты от наших соперников. Теперь, когда мы являемся единственным индийским правительством и ситуация в Непале стабилизировалась, непальское правительство попросило нас вывести наши войска и позволить им снова стать полностью независимой нацией. Они, конечно, останутся нашими верными союзниками, но снова получат свободу действовать по своему усмотрению."
nepal_events.101.a: "Давайте продолжим как партнёры."
nepal_events.101.b: "Мы не можем рисковать тем, что может произойти без нашего надзора."

nepal_events.102.t: "Индия соглашается на нашу просьбу"
nepal_events.102.d: "Мы получили отличные новости от [FROM.GetNameDef], которые согласились вывести свои войска из нашей страны и позволили нам вернуться к статусу полностью автономной нации. Это, надеюсь, станет новым началом плодотворного и долгого партнёрства между Непалом и Индией."
nepal_events.102.a: "Фантастика!"

nepal_events.103.t: "Индия отклоняет нашу просьбу"
nepal_events.103.d: "Мы получили ужасные новости от [FROM.GetNameDef], которые отказались вывести свои войска из нашей страны, ссылаясь на опасения нестабильности в Непале и риск того, что без их непосредственного участия враждебные силы могут захватить контроль над правительством. Похоже, у нас мало выбора в этом вопросе..."
nepal_events.103.a: "Как они смеют?"

nepal_events.200.t: "Коронация короля Самраджьи"
nepal_events.200.d: "Отречение короля Трибхувана и его семьи в добровольное изгнание поставило премьер-министра в довольно сложное положение: монарх был необходим для обеспечения стабильности государства, но не было подходящих вариантов для замены предыдущего короля. Однако после долгих размышлений был сделан спорный выбор - назначить племянника Трибхувана, Самраджью Шумшера Рану, новым королём страны. Несмотря на близкое родство Самраджьи с бывшим государем, молодой человек является членом династии Рана, будучи продуктом брака сестры Трибхувана с Кайзером Раной. Однако, полагая, что нет лучшего выбора, а также видя выгоду в том, чтобы член династии непосредственно находился на троне, Джуддха Рана несколько дней назад утвердил выбор в пользу Самраджьи.\n\nПринеся присягу служить государству, новый король страны, Самраджья Шумшер Джанг Бахадур Рана, титулованный как Его Королевское Высочество Шри Панч Бада Махараджадхираджа «Самраджья», был официально коронован сегодня раньше. Хотя церемония, возможно, была не такой пышной, как многие надеялись, считалось, что будет плохо выглядеть слишком большая экстравагантность после недавнего конфликта, и поэтому мероприятие было скромным. Новый король, не питая иллюзий относительно своего места в вещах, подтвердил положение премьер-министра в правительстве, довольствуясь ролью номинального правителя, не имеющего амбиций повторить судьбу своего предшественника."
nepal_events.200.a: "Будем надеяться, что этот король будет гораздо терпимее."

nepal_events.300.t: "Сдержанная реакция индийцев"
nepal_events.300.d: "Хотя объявление королём полного нейтралитета в индийских делах было жизненно важным для мирного процесса, это, безусловно, была авантюра. Сильная заинтересованность как Доминиона, так и Республики во влиянии на нашу политику оставляла реальную возможность того, что та или другая сторона не примет такой исход и просто отправит свои войска для прямой установки лояльного режима.\n\nОднако пока кажется, что авантюра окупилась, так как, хотя и, безусловно, возмущены, оба индийских правительства, по-видимому, готовы принять новый статус-кво, считая исход, при котором Непал не попадает в руки их врагов, достаточно хорошим. Поскольку непосредственной угрозы вторжения или дальнейшего вмешательства в политику страны нет, у нового правительства должна быть достаточная возможность сосредоточиться сейчас внутри страны на исцелении национального раскола."
nepal_events.300.a: "Мы все можем вздохнуть с облегчением."

nepal_events.301.t: "Социалисты Совета протестуют против мирного соглашения"
nepal_events.301.d: "Хотя социалисты Совета были сразу же идентифицированы как потенциальная угроза после мирного соглашения, отказ Калькутты от поддержки ныне несуществующей Мукти Сены оставил большинство уверенными, что они просто сойдут на нет. Однако социалисты, должно быть, явно не слышали об амбивалентности Республики, поскольку сегодня в [NEP.Capital.GetCapitalVictoryPointName] прошла акция протеста, в которой участвовало более 200 членов социалистов Совета под руководством Рам Прасада Рая и Кунвара Индерджита Сингха.\n\nПламенная речь, произнесённая в основном Сингхом, призывала к немедленному включению социалистов Совета в правительство и аресту Кирана и Мохана Раны за гибель гражданских во время восстания, которую Сингх возложил на династию Рана. Сингх завершил свою речь угрозой возобновить вооружённую революцию, если требования не будут выполнены, что было встречено одобрительными возгласами его товарищей-повстанцев.\n\nНе желая мириться с этой изменой, премьер-министр Коирала приказал разогнать протест и арестовать его участников, и Рай оказался среди тех, кто теперь сидит в ближайшей тюрьме. Однако, как сообщается, Сингх скрылся с протеста без ареста, несмотря на то, что войска считали, что они арестовали его, - ошибка, которую до сих пор объясняют тем, что они перепутали Сингха с другим похожим на вид протестующим. Местонахождение этого человека в настоящее время неизвестно, но ожидается, что арест других членов подавит любые новые выступления социалистов Совета, вызывающие беспорядки."
nepal_events.301.a: "Выследить Сингха, мы не можем допустить дальнейшего мятежа."

nepal_events.302.t: "Нападение на войска у Хетауды"
nepal_events.302.d: "С тех пор как он бежал с протеста в Катманду, Кунвар Сингх не только уклонялся от поимки, но и до сих пор не был замечен теми, кто его разыскивает, и правительство надеялось, что он, возможно, погиб в глуши. Хотя до сих пор нет конкретных доказательств обратного, недавнее нападение на войска, действующие недалеко от Хетауды, явно имеет признаки Сингха и его товарищей-диссидентов. На небольшой аванпост, укомплектованный несколькими десятками человек, внезапно напало неизвестное количество вооружённых мародёров.\n\nПосле первоначальной стычки, в результате которой погибли двое солдат, аванпост был ненадолго сдан этим бандитам, прежде чем подкрепление смогло отогнать их после короткого боя. Среди дополнительных потерь со стороны инсургентов были найдены люди в форме Индийской республиканской армии, очень похожей на ту, что поставлялась Мукти Сене. Хотя это не является окончательным доказательством причастности Сингха, это, безусловно, доказательство того, что диссиденты-социалисты Совета пытаются поднять мятеж, и правительству необходимо будет отреагировать."
nepal_events.302.a: "Отправить больше войск на поиски Сингха."
nepal_events.302.b: "Они явно планируют что-то более масштабное, держать армию в готовности."

nepal_events.303.t: "Восстание Ракша Дал"
nepal_events.303.d.body: "После революции против Ранов солдаты Мукти Сены, которые не просто влились в армию, были преобразованы в Ракша Дал, Силы защиты, чтобы помогать поддерживать порядок вместе с армией. Несмотря на их исключение из правительства, многие бывшие члены социалистического Совета были включены в их ряды, идея, которая сейчас оказалась очень ошибочной. Те, кто всё ещё верен Сингху и Раю, подняли восстание в [NEP.Capital.GetCapitalVictoryPointName], к которому быстро присоединились Сингх и его диссиденты из Хетауды, освободив Рая и других протестующих из тюрьмы.\n\n"
nepal_events.303.d.hunthnd: "$nepal_events.303.d.body$Освобождённые заключённые, вооружённые своими товарищами-повстанцами, отправились занимать столицу, быстро захватив контроль над дворцом Сингха Дурбар, из которого управляло Национальное правительство. Сингх и Рай провозгласили республику, лояльную Калькутте, очевидно, надеясь спровоцировать прямое индийское вмешательство в Непал для поддержки их режима. Однако, к их явному удивлению, после дня осады правительственными войсками и лояльными членами Ракша Дал повстанцы даже не получили ответа от Республики, не говоря уже о подкреплении, на которое они надеялись.\n\nНе опасаясь необходимости бороться с войсками с юга, правительственные войска начали атаку, чтобы выбить повстанцев из дворца, и добились очень быстрого успеха. Однако снова, кажется, Сингх ускользнул, и Рай бежал вместе с ним, хотя с поражением этих повстанцев и без дальнейшей поддержки со стороны Республики у этих двоих мало шансов представлять какую-либо дальнейшую угрозу."
nepal_events.303.d.huntnohnd: "$nepal_events.303.d.body$Освобождённые заключённые, вооружённые своими товарищами-повстанцами, отправились занимать столицу, начав с попытки захватить контроль над дворцом Сингха Дурбар, из которого управляло Национальное правительство. Сингх и Рай провозгласили республику, хотя с уходом калькуттского режима их попытка, очевидно, была обречена с самого начала. После дня осады правительственными войсками и лояльными членами Ракша Дал, не видя признаков внезапного чуда, которое могло бы изменить ситуацию в их пользу, повстанцы начали переговоры с правительством в надежде добиться некоторых уступок.\n\nУстав от борьбы с восстаниями Сингха, правительственным войскам вместо этого был отдан приказ идти на дворец, и, как сообщается, эти приказы исходили непосредственно от короля. Штурм быстро увенчался успехом, дворец был отбит, а повстанцы разгромлены в течение нескольких часов. Однако снова, кажется, Сингх ускользнул, и Рай бежал вместе с ним, хотя с поражением этих повстанцев и без дальнейшей поддержки со стороны Республики у этих двоих мало шансов представлять какую-либо дальнейшую угрозу."
nepal_events.303.d.reinforce: "$nepal_events.303.d.body$Освобождённые заключённые, вооружённые своими товарищами-повстанцами, отправились занимать столицу, начав с попытки захватить контроль над дворцом Сингха Дурбар, из которого управляло Национальное правительство. Благодаря достаточному количеству войск, переброшенных в столицу после атак Сингха в Хетауде, восстание фактически было подавлено ещё до того, как оно началось: дворец был успешно защищён, а повстанцы быстро разгромлены. Однако снова, кажется, Сингх ускользнул, и Рай бежал вместе с ним, хотя с поражением этих повстанцев и без дальнейшей поддержки со стороны Республики у этих двоих мало шансов представлять какую-либо дальнейшую угрозу."
nepal_events.303.a: "Будем надеяться, что мы видели их в последний раз."

nepal_events.304.t: "Трения внутри Совета"
nepal_events.304.d: "Хотя они далеко не так радикально настроены против мирного соглашения, как социалисты, сказать, что все члены Совета принимают то, на что им пришлось согласиться ради стабильности, было бы довольно значительным искажением истины. Ряд разногласий, начиная от противодействия любому участию Ранов в правительстве, заканчивая противодействием роли дворца в политике или даже просто личными разногласиями с новым премьер-министром, начал проявлять трещины в некогда единой партии.\n\nТе, кто считает себя наиболее лояльными к некоторой форме капитализма, первыми начали выражать недовольство новым статус-кво, существенно возражая против того, что их обошли в пользу открытых социалистов. Однако в настоящее время эти разногласия пока остаются за закрытыми дверями, но рисуют картину грядущих новых проблем."
nepal_events.304.a: "Сейчас не время для внутренних раздоров."

nepal_events.305.t: "Братские дрязги"
nepal_events.305.d: "Почти столько, сколько премьер-министр себя помнит, он считал своего младшего брата Бишвешвара Прасада Коиралу одним из своих ближайших союзников, и Б.П. был в числе первых, кто отвергал любую критику своего брата со стороны товарищей по партии. Однако в последние недели отношения между ними, по сообщениям, стали довольно прохладными, и говорят, что негативный взгляд Бишвешвара на темпы процесса демократизации был основным катализатором.\n\nТе, кто более осведомлён, начали задаваться вопросом, может ли быть в этом споре нечто большее, чем просто разногласия по политике. Ходят теории, что недовольные правлением М.П., особенно его чрезмерной опорой на кабинет, а не на пожелания и волю Рабочего комитета партии, начали добиваться замены премьер-министра, заручившись поддержкой Б.П., пообещав ему место брата.\n\nОднако официально все в Совете отрицают какой-либо раскол внутри партии, надеясь, что любую нестабильность можно просто пережить, дав ей достаточно времени..."
nepal_events.305.a: "Разве небольшой спор между братьями не нормален?"

nepal_events.306.t: "Выражение недоверия М.П. Коирале"
nepal_events.306.d: "Несмотря на надежды пережить бурю, кажется, что трещины внутри Совета нельзя было просто замять. Члены партии под руководством Ачарьи и Б.П. Коиралы выступили с инициативой выразить недоверие М.П. и лишить его влияния на будущие операции Совета, заявляя, что он предал цели революции, превратив обещание демократического социалистического Непала в свою собственную властную базу, поддерживаемую всемогущим кабинетом.\n\nБольшая часть Совета выразила поддержку этому решению, хотя не все союзники премьер-министра покинули его, многие высказались в его пользу. Некоторые члены династии Рана, по крайней мере наиболее реформистски настроенные, также выразили поддержку премьер-министру, и по крайней мере пока ни король, ни премьер-министр не дали никаких признаков того, что М.П. Коирала уйдёт в отставку. Однако как правительство будет действовать дальше, остаётся только гадать."
nepal_events.306.a: "Междоусобицы и революционеры - такое неизбежное сочетание."

nepal_events.307.t: "Переформирование Совета"
nepal_events.307.d: "Не желая мириться с выраженным ему недоверием, союзники премьер-министра теперь полностью завершили процесс, начавшийся месяцы назад, а именно трансформацию Совета в Национальный конгресс - партию старых союзников, но с более чёткими идеологическими и методологическими различиями. Хотя Коиралы представляют его ядро, внешне единое, власть Матрики значительно ослабла перед лицом внутренней ортодоксальной оппозиции его брата, а также из-за действий фракций Народного совета и Освободительной армии.\n\nХотя премьер-министр явно уверен в своей способности продолжать свою работу, используя эту новую ситуацию, руководство NNC попросило короля отправить его в отставку с поста премьер-министра, угрожая отозвать свою поддержку правительства, если он останется в должности. Трибхуван, не желая пока уступать их требованиям, отказался прямо заявить о своей позиции в кризисе. Не поддерживая премьер-министра и не отправляя его в отставку, кажется, пока король просто ждёт, сможет ли М.П. удержаться или нет."
nepal_events.307.a: "Возможно, пришло время пересмотреть позицию Коиралы."

nepal_events.308.t: "М.П. Коирала подаёт в отставку"
nepal_events.308.d: "Хотя Рабочий комитет Конгресса ещё не выполнил свою угрозу отозвать поддержку правительства, премьер-министру и королю быстро стало очевидно, что пребывание первого в должности не может продолжаться. Желая превыше всего стабильности, М.П. Коирала подал прошение об отставке королю, готовясь снова отойти на задний план политики.\n\nЧтобы попытаться сформировать новое правительство, король первоначально обратился к старому ядру Совета, причём Ачарья был очевидным следующим кандидатом на пост премьер-министра. Однако самым большим препятствием на этом пути стали Раны, ключевые члены которых заявили об отказе работать с этими «радикалами», и NNC выразил аналогичные настроения.\n\nПоскольку ни одна из сторон не желает идти на компромисс, ближайшие советники Трибхувана предложили, чтобы пока король просто взял на себя прямое управление страной, руководя оставшимися элементами национального правительства с помощью чрезвычайных полномочий. Они предлагают создать консультативный совет, состоящий из ключевых членов династии Шах, таких как Пурендра Бикрам Шах, для обеспечения надлежащего выполнения воли короля. Хотя руководство Ранов не будет довольно этой идеей, они, скорее всего, останутся с ней, даже если союзники Ачарьи почти наверняка будут возражать. Король теперь стоит перед трудным выбором, но его необходимо сделать."
nepal_events.308.a: "Назначить Ачарью преемником Коиралы."
nepal_events.308.b: "Король должен править напрямую пока."

nepal_events.400.t: "Реорганизация Ранов"
nepal_events.400.d: "Хотя многие Раны бежали из Непала, когда революция охватила страну, и бывший премьер-министр был среди них, довольно многие решили стоять на своём и остаться в Непале. Не желая вызывать дальнейшие распри, до сих пор их оставляли в покое, и мало кто ожидал, что они будут представлять угрозу после их полного отстранения от власти. Однако кажется, что их ещё нельзя сбрасывать со счетов, поскольку оставшиеся члены династии в Непале перегруппировались вокруг новой организации, возглавляемой Моханом Шумшером Раной.\n\nОбъединившись с небольшой националистической группой гуркхов, известной как «Кхукури Дал», Мохан сформировал новую политическую партию, действующую теперь под названием «Вир Гуркха Дал», явно надеясь участвовать в любых предстоящих выборах, чтобы попытаться восстановить правление своей династии над страной. Хотя они официально не выступают за прямое восстановление предыдущей системы и пока не предприняли никаких действий, которые были бы незаконны, многие члены этой «Кхукури Дал» явно носят полувоенный характер, и новое правительство опасается, что Раны могут планировать собственное жестокое восстание для восстановления власти. Однако, пока они не начнут действовать, правительство мало что может сделать, кроме как наблюдать за ними."
nepal_events.400.a: "Обеспечить постоянный мониторинг их деятельности."

nepal_events.401.t: "Линии начинают формироваться"
nepal_events.401.d: "Хотя когда-то они были едины в своём желании освободить Непал от Ранов, вопрос о том, что происходит после революции, всегда имеет свойство раскалывать ряды. Ещё до революции Совет часто ссорился по поводу правильного образа действий, и хотя позиция вооружённой революции победила, значительная фракция придерживалась убеждения, что Ранов следовало свергнуть путём мирного протеста. Эта фракция, возглавляемая в первую очередь братьями Коирала Матрикой и Бишвешваром, теперь начала ещё больше расходиться с основным крылом партии, поддерживающим премьер-министра.\n\nВ то время как крыло, стоящее за Ачарьей, продвигалось к версии непальского синдикализма в сочетании с пропагандой индустриализации, больше соответствующей линии правительства Калькутты, крыло Коиралы заняло твёрдую оппозиционную позицию. Желая вместо этого системы демократического социализма, причём некоторые внутри фракции также делают тихие заявления, что страна рискует снова впасть в тиранию без направляющей руки короля, эта фракция начала в частном порядке выступать против многих предложений премьер-министра. Однако, оставаясь в конечном счёте верными революции, эти дрязги пока, кажется, вряд ли развалят Совет, но они начали обнажать линии разлома, которые могут треснуть позже."
nepal_events.401.a: "Мелкие дрязги вряд ли объединят нацию."

nepal_events.402.t: "Раскол в Праджа Паришад"
nepal_events.402.d: "Хотя они сыграли значительную роль в революции против Ранов, социалисты Непальского Народного Совета (Праджа Паришад) почти все оказались исключены из новой непальской системы. При твёрдой поддержке Калькутты в пользу Совета, социалисты внутри партии обнаружили, что почти вся иностранная поддержка для них исчезла, и из-за некоторых предлагаемых спорных политик, таких как республиканизм, новые члены Социалистической фракции не смогли легально зарегистрироваться как политическая партия в рамках новой системы. Хотя более радикальные члены партии обсуждали вторую революцию против новой системы, отсутствие поддержки сделало это невозможным, а те, кто менее предан социалистическому делу, отказались от надежд партии.\n\nС этой целью была создана новая социалистическая партия, отколовшаяся от Праджа Паришад. Nēpālī Rāstriya Kāngrēsakō Mukti Sēnā, или Непальский национальный конгресс (NNC), официально отделился от Совета, заявив о своём намерении провести Социалистическую революцию демократическими средствами, причём члены в основном отказались от республиканизма и приняли положение конституционной монархии для получения юридического признания. Хотя некоторые внутри партии осуждают их как раскольников, NNC удалось привлечь значительное количество членов из своих рядов, а также абсорбировать некоторых радикалов из Совета. Однако эта новая партия вряд ли окажется близка к национальному руководству в ближайшее время, поскольку её политика всё ещё слишком радикальна для большинства населения, но она явно представляет возможное будущее для левых в новом Непале."
nepal_events.402.a: "Социалисты показывают своё истинное лицо."

nepal_events.500.t: "Проблема монархии"
nepal_events.500.d: "Несмотря на желание большей части нашего руководства и особенно наших союзников в Калькутте упразднить монархию, правительство сильно зависит от поддержки убеждённых монархистов для своего существования. Даже если мы сейчас правим без их участия, число фактических социалистов-республиканцев в Непале едва ли достаточно, чтобы заполнить комнату в хороший день, а Совет и другие промонархические группы значительно превосходят нас численностью. Настроив их против себя, избавившись от монархии, мы можем сильно дестабилизировать наш режим, хотя с поддержкой Калькутты мы, вероятно, сможем удержаться.\n\nВ попытке достичь компромисса с монархистами было выдвинуто предложение предоставить Трибхувану титул «Главы государства», Раджья Прамукха, чисто церемониальный титул, признающий его статус, но при этом сохраняющий власть правительства. Хотя этого, возможно, недостаточно, чтобы удовлетворить самых убеждённых монархистов, это, вероятно, успокоит достаточное количество, чтобы иметь значение. Однако немногие в правительстве довольны этим решением, полагая, что сохранение монархистов в любом качестве ослабит государство в долгосрочной перспективе, и вместо этого предложили просто сорвать пластырь сейчас и разобраться с последствиями. Конечно, многие внутри Совета остаются стойкими монархистами, рассматривая установление Республики после Революции как полностью временное и продолжая поддерживать короля Трибхувана, который сам не проявлял ничего, кроме доброй воли по отношению к новому правительству, частично в надежде, что его трон может быть восстановлен. Республиканцы, всё ещё находящиеся в явном меньшинстве, во многих отношениях загнаны в угол, и поддержка восстановления монархии широко распространена внутри социалистического движения."
nepal_events.500.a: "Разрешить церемониальную роль для бывшего короля."
nepal_events.500.b: "Его ещё не изгнали, и это единственная привилегия, которую он будет иметь."
nepal_events.500.c: "Мы полностью сохраним Монархию."

nepal_events.1000.t: "Выбор пути ИИ"
nepal_events.1000.d: "Так ИИ решает, к какому пути он будет стремиться в мини-игре «Заговор». На это влияют игровые правила. Первые три варианта не применяются, если какой-либо из участников является игроком-человеком."
nepal_events.1000.a: "Ориентированный на BHC"
nepal_events.1000.b: "Нейтральный"
nepal_events.1000.c: "Ориентированный на DEH"
nepal_events.1000.e: "Ориентированный на BHC (участие игрока)"
nepal_events.1000.f: "Ориентированный на DEH (участие игрока)"

nepal_events.1001.rana_title: "Провал революции в Непале"
nepal_events.1001.royal_title: "Реставрация монархии в Непале"
nepal_events.1001.revolution_title: "Антиранская революция в Непале"
nepal_events.1001.rana_desc: "В течение последнего года в гималайском королевстве Непал продолжалось восстание, предположительно поддерживаемое соседней [BHC.GetName] с целью свержения премьер-министра Джуддхи Раны. Новости, полученные сегодня из столицы страны [NEP.Capital.GetCapitalVictoryPointName], подтвердили, что произошла попытка общенационального восстания, причём революционеры ненадолго захватили контроль над частями Непала, прежде чем были разбиты правительственными войсками.\n\nПо сообщениям, зачинщики бежали к своим покровителям в Республику, к ним присоединился король Непала, который, как утверждается, поддерживал их. Теперь объявлено регентство, а премьер-министр также дал понять о намерении страны присоединиться к альянсу «Бомбейский пакт» против Калькутты."
nepal_events.1001.royal_desc: "В течение последнего года в гималайском королевстве Непал продолжалось восстание, предположительно поддерживаемое соседней [BHC.GetName] с целью свержения премьер-министра Джуддхи Раны. Новости, полученные сегодня из страны, рисуют мрачную картину: после убийства премьер-министра по всей стране вспыхнул кровавый вооружённый конфликт между правительственными и повстанческими силами, который был прекращён только благодаря перемирию, согласованному непальским королём.\n\nВ рамках перемирия король дал понять о своём намерении создать правительство, состоящее как из антирановских деятелей, так и из ключевых членов династии Рана. Несмотря на участие Индии в конфликте, король, по сообщениям, объявил о полном нейтралитете в отношении Индии, надеясь вместо этого сместить фокус внимания Непала внутрь страны."
nepal_events.1001.revolution_desc: "В течение последнего года в гималайском королевстве Непал продолжалось восстание, предположительно поддерживаемое соседней [BHC.GetName] с целью свержения премьер-министра Джуддхи Раны. За последние несколько дней это восстание наконец переросло в полномасштабную революцию, и теперь страна полностью контролируется повстанческими силами после общенациональных восстаний.\n\nПо сообщениям, бывший премьер-министр бежал в Дели, а представители альянса «Мукти Сена» проводят встречи с королём в столице страны [NEP.Capital.GetCapitalVictoryPointName] для обсуждения формирования временного правительства. Только время покажет, как пройдут эти встречи, причём, как сообщается, [BHC.GetNameDef] уже начала добиваться установления социалистического правительства под своим руководством."
nepal_events.1001.rana_option: "Железная хватка Ранов продолжается."
nepal_events.1001.royal_option: "Может ли такой компромисс действительно продержаться?"
nepal_events.1001.revolution_option: "90 лет правления Ранов закончились за несколько дней."







### Ideas ###

NEP_gurkha_brigades: "Бригады гуркхов"
NEP_gurkha_brigades_desc: "Гуркхи, на непальском называемые горкхали, - это одновременно группа этносов и термин, используемый для обозначения грозных солдат, известных во всей Индии и за её пределами. Владея своим фирменным оружием, кхукри, войска гуркхов преуспели как ядро особых полков, созданных для выполнения специальных миссий. Поскольку современный Непал был создан после того, как королевство Горкха объединило раздробленные государства, мы можем претендовать на истинное право называть храбрых гуркхов своими."
NEP_kingdom_within_kingdom: "Государство в государстве"
NEP_kingdom_within_kingdom_desc: "Династия Рана, сила, которая железной рукой доминировала в Непале почти столетие, получила земли и титул махараджи Ламджунга и Каски в 1856 году, через десять лет после их прихода к абсолютной власти в гималайском королевстве. Эти «Великие короли» не только обеспечили подчинение им современной непальской политики, но и гарантировали, что если произойдёт что-то, направленное на свержение их правления, их личный лен, государство Ламджунг и Каски, станет более чем грозной крепостью для организации сопротивления любым изменениям статус-кво."

NEP_royal_army_name: "Королевская непальская армия"
NEP_republican_army_name: "Республиканская армия Непала"
NEP_royal_army: "[NEP_loc_army_name]"
NEP_royal_army_desc: "[NEP_loc_army_name] - одна из немногих вещей в Непале, которая вызывает гордость у представителей всего политического спектра. Со времён Англо-непальской войны непальские войска получили мировую известность, и более века непальские войска «гуркхов» были известны как самые элитные войска под британским командованием.\n\nПосле Британской и Индийской революций многие непальские ветераны этих конфликтов вернулись на родину, в Непал, принеся с собой мудрость и опыт, необходимые для поднятия собственной армии Непала на новые высоты и позволяя стране значительно превосходить свои возможности."
NEP_an_economy_of_corruption_and_stagnation: "Экономика коррупции и застоя"
NEP_an_economy_of_corruption_and_stagnation_desc: "Из-за сочетания коррумпированной системы, построенной почти исключительно для обогащения династии Рана, и общей политики противодействия индустриализации для ослабления политической власти крестьянства, Непал оказывается невероятно бедным и отсталым, несмотря на большой потенциал экономического роста.\n\nХотя в последние два десятилетия предпринимались некоторые попытки наконец ввести Непал хотя бы в XIX век, хаос 20-х годов решительно сорвал все надежды на это. Индустриализация Непала, вероятно, потребует серьёзных политических изменений и внешней помощи, но будет жизненно важна для того, чтобы нация не канула в лету."
NEP_the_padma_shumsher_plan: "План Падмы Шумшера"
NEP_the_padma_shumsher_plan_desc: "Хотя другие члены династии Рана считают его крайне радикальным и крайне непопулярным, довольно сдержанный план индустриализации Падмы Шумшера был навязан Непалу их покровителями в Доминионе Индия, которые потребовали индустриализации Непала ради национальной безопасности.\n\nХотя план Падмы вряд ли превратит Непал в индустриальную державу, он, вероятно, поможет реально построить современную экономику в Непале и позволит ему помогать своим индийским союзникам."
NEP_realm_of_the_ranas: "Государство в государстве"
NEP_realm_of_the_ranas_desc: "Династия Рана, сила, которая железной рукой доминировала в Непале почти столетие, получила земли и титул махараджи Ламджунга и Каски в 1856 году, через десять лет после их прихода к абсолютной власти в гималайском королевстве. Эти «Великие короли» не только обеспечили подчинение им современной непальской политики, но и гарантировали, что если произойдёт что-то, направленное на свержение их правления, их личный лен, государство Ламджунг и Каски, станет более чем грозной крепостью для организации сопротивления любым изменениям статус-кво.\n\nНепал при Ранах действует как настоящий сёгунат в Гималаях - сравнение, которое не упустило из виду руководство Непала. Провал революции против режима только укрепил их власть над Непалом, разрушив все надежды врагов Ранов на то, что их правление закончится так же, как у Токугавы."
NEP_realm_of_the_ranas_0_desc: "Династия Рана, сила, которая железной рукой доминировала в Непале почти столетие, получила земли и титул махараджи Ламджунга и Каски в 1856 году, через десять лет после их прихода к абсолютной власти в гималайском королевстве. Эти «Великие короли» не только обеспечили подчинение им современной непальской политики, но и гарантировали, что если произойдёт что-то, направленное на свержение их правления, их личный лен, государство Ламджунг и Каски, станет более чем грозной крепостью для организации сопротивления любым изменениям статус-кво.\n\nНепал при Ранах действует как настоящий сёгунат в Гималаях - сравнение, которое не упустило из виду руководство Непала, хотя большинство считает, что они могут избежать участи, постигшей Токугаву. Однако постепенный рост антирановской оппозиции, сильно поддерживаемой индийцами, начал подвергать этот оптимизм сомнению..."
NEP_pnp_finished: "Долгий путь к современности"
NEP_pnp_finished_dec: "Хотя другие члены династии Рана считают его крайне радикальным и крайне непопулярным, довольно сдержанный план индустриализации Падмы Шумшера был навязан Непалу их покровителями в Доминионе Индия, которые потребовали индустриализации Непала ради национальной безопасности.\n\nХотя план Падмы вряд ли превратит Непал в индустриальную державу, он, вероятно, поможет реально построить современную экономику в Непале и позволит ему помогать своим индийским союзникам."
NEP_bnia_finished: "Новая непальская экономика"
NEP_bnia_finished_dec: "Благодаря огромным усилиям Непалу удалось преодолеть застой времён Ранов и построить экономику, которая, по крайней мере, приемлема в современном мире, если не сказать ошеломляющая. Однако надеются, что это только начало, и десятилетия будущего экономического роста ещё впереди."
NEP_state_initiatives: "Государственные инициативы"
NEP_state_initiatives_desc: "Ввиду фактического полного отсутствия какого-либо местного капитала, чтобы надеяться, что Непал просто начнёт индустриализацию самостоятельно, правительство сочло целесообразным запустить непальскую промышленность за счёт государственных усилий и государственных предприятий."

NEP_unchallenged_autocracy: "Беспрепятственная автократия"
NEP_unchallenged_autocracy_desc: "Поражение Мукти Сены почти наверняка уничтожило любую возможность свержения Ранов по крайней мере на следующие несколько десятилетий: целое поколение революционеров мертво или в изгнании. Теперь ничто не стоит на пути их абсолютного правления."
NEP_national_restoration: "Национальное восстановление"
NEP_national_restoration_desc: "Попытка революции в Непале, возможно, привела к падению абсолютной власти Ранов, но также ознаменовалась восстановлением королевской власти, а не более радикальными целями, на которые надеялись многие поддерживаемые Калькуттой революционеры. Король теперь надеется под своим великим руководством и контролем увести непальскую нацию от конфликта и исцелить её глубокие разногласия."
NEP_our_ruler_glorious_idea: "Наш правитель славный"
NEP_our_ruler_glorious_idea_desc: "Хотя национальное правительство, состоящее из представителей всего политического спектра, продолжает функционировать, реальная власть в Непале теперь снова в руках короля - кардинальное изменение по сравнению с его некогда бессильным положением, которое, как надеются, выведет нацию за пределы лет правления Ранов."
NEP_constitution_of_the_revolution: "Конституция революции"
NEP_constitution_of_the_revolution_desc: "Теперь, когда народ полностью контролирует непальскую нацию, первая конституция страны постепенно разрабатывается и вводится в действие через временные законы. Надеются, что к концу десятилетия будет наконец принята полная версия конституции и Непал сможет завершить свой полный переход к подлинно современной и свободной системе."
NEP_the_peoples_kingdom: "Народное королевство"
NEP_the_peoples_kingdom_desc: "Благодаря силе и решимости Мукти Сены и великой поддержке короля Трибхувана Непал сбросил тираническое правление династии Рана. Впервые в истории Непала нацией правят не элиты, а простые люди."
NEP_rule_of_the_mukti_sena: "Правление Мукти Сены"
NEP_rule_of_the_mukti_sena_desc: "При поддержке Калькутты социалисты внутри Праджа Паришад взяли всю полноту власти в Непале, используя военную силу и революционную риторику для легитимации своего положения. Хотя они не могут по-настоящему достичь многих великих целей социализма в доиндустриальной стране, социалисты надеются, что при достаточной поддержке со стороны социалистов мира Непал тоже присоединится к ним на пути к социализму."
NEP_first_citizen_of_nepal: "Первый гражданин Непала"
NEP_first_citizen_of_nepal_desc: "Хотя официально это республика, широкая поддержка монархии и личная популярность самого Трибхувана после его участия в революции сделали полный роспуск института довольно несостоятельным. В качестве компромисса ныне бывший король получил чисто церемониальную должность Раджья Прамукха (Главы государства), что помогает успокоить многочисленных монархистов в стране."
NEP_the_peoples_republic: "Народная республика"
NEP_the_peoples_republic_desc: "Благодаря силе и решимости Мукти Сены Непал сбросил тираническое правление династии Рана. Двигаясь вперёд как свободная и демократическая республика, впервые в истории Непала нацией правят не элиты или корона, а простые люди."

NEP_surviving_the_indian_nightmare: "Выжить в индийском кошмаре"
NEP_surviving_the_indian_nightmare_desc: "Война в Индии вспыхнула вновь, и на карту поставлено не только будущее Индии, исход почти наверняка определит и будущее Непала. Руководство Непала теперь сталкивается с трудной задачей провести нацию через этот кризис, надеясь выйти из него свободной и в целости."

NEP_crushing_the_conspirators: "Разгром заговорщиков"
NEP_crushing_the_conspirators_desc: "С помощью [DEH.GetNameDef] премьер-министр Джуддха Рана начал усилия по подавлению любого заговора против непальского государства, надеясь быстро разобраться с любым запланированным восстанием."
NEP_covert_support_for_the_mukti_sena: "Тайная поддержка Мукти Сены"
NEP_covert_support_for_the_mukti_sena_desc: "Хотя премьер-министр официально начал усилия по подавлению любой оппозиции государству, король в рамках своих ограниченных возможностей начал тайно помогать повстанцам, надеясь положить конец тирании Ранов."

udyog_parishad: "Удьог Паришад"
udyog_parishad_desc: "Удьог Паришад, или по-английски просто «Промышленный совет», был основан в 1935 году в рамках усилий премьер-министра Джуддхи Шумшера Раны по обеспечению медленного уровня индустриализации в Непале, полностью в интересах его династии. Совет существует для эффективной координации государственных расходов и инвестиций, направленных на индустриализацию частей страны сверху вниз, причём основной упор делается на создание небольших государственных предприятий в наиболее потенциально прибыльных секторах."
nepal_government_railway: "Непальская государственная железная дорога"
nepal_government_railway_desc: "Планы создания первой железной дороги в Непале были впервые разработаны в начале 20-х годов, надеясь соединить Непал с Индией как способ для Ранов перевозить лесоматериалы в своих интересах. Эти планы были решительно свёрнуты после начала гражданской войны в Индии, но с нынешней гораздо более стабильной ситуацией и достаточно дружественным правительством на юге проект был возрождён. Не желая останавливаться на достигнутом, непальское правительство намерено построить дополнительные железные дороги по всей стране, действующие под контролем правительства."
biratnagar_mills: "Фабрики Биратнагара"
biratnagar_mills_desc: "Текстиль - одна из самых ценных отраслей, к которым имеет доступ такая страна, как Непал, поскольку предметы роскоши и драпировки всегда пользуются высоким спросом. С этой целью в Биратнагаре были созданы одни из первых фабрик страны с целью производства текстиля из хлопка и джута, чтобы удовлетворить как потребности состоятельных непальцев, так и тех за границей, у кого есть средства их приобрести."

 ### Focuses ###

NEP_rooting_out_the_traitors: "Искоренить предателей"
NEP_rooting_out_the_traitors_desc: "На протяжении почти столетия династия Рана стояла у руля Королевства Непал, и хотя премьер-министр Джудха Шумшер Рана не является королем по названию, он является лидером этой страны. Противостоять ему означает противостоять государству, замышлять против него означает замышлять против Непала."
NEP_intelligence_cooperation_with_the_lib: "Сотрудничество с DIB в области разведки"
NEP_intelligence_cooperation_with_the_lib_desc: "Делийское разведывательное бюро, разведывательное агентство Доминиона Индия, является одним из крупнейших в своем роде на Востоке. Есть веские аргументы в пользу того, что британское правление в Индии давно бы исчезло, как додо, без их превосходных разведывательных служб, которые всегда играли важную роль в пресечении восстаний на корню ещё задолго до создания самого Бюро. С их помощью мы должны легко справиться с нашим собственным восстанием."
NEP_bribing_the_weakest_links: "Подкуп самых слабых звеньев"
NEP_bribing_the_weakest_links_desc: "Даже несмотря на то, что многие из тех, кто восстал против нас, более состоятельны, чем средний непалец, в их рядах все ещё есть бесчисленное множество людей, готовых на все за скромную сумму. Предложив достаточно значительное вознаграждение тем, кто готов сдать своих товарищей-повстанцев, мы очень быстро увидим, как они начнут сражаться друг с другом и выкладывать нам все свои секреты."
NEP_infiltrating_the_praja_parishad: "Внедриться в Praja Parishad"
NEP_infiltrating_the_praja_parishad_desc: "В то время как социалисты из Mukti Sena, прошедшие обучение в Калькутте, гораздо более замкнуты и в них сложнее проникнуть, более крупная организация Parishad всегда готова принимать новых членов, не проявляя особой осторожности, поскольку сосредоточена почти исключительно на расширении своего движения. Поэтому нам будет очень просто отправить туда нескольких человек, которые будут выдавать себя за новых членов, что позволит нам расколоть их изнутри."
NEP_the_fate_of_all_rebels: "Судьба всех мятежников"
NEP_the_fate_of_all_rebels_desc: "Хотя изначально мы планировали оставить лидера повстанцев Дашратха Чанда Тхакури в живых, чтобы пытками выбить из него информацию и использовать его в качестве разменной монеты в случае необходимости, более эффективным использованием его может стать публичная демонстрация того, какая судьба ждет тех, кто выступает против премьер-министра. Давайте подготовим петлю палача и вселим страх в сердца предателей."
NEP_countering_bharatiya_influence: "Пронзить влияние Bharatiya"
NEP_countering_bharatiya_influence_desc: "Без постоянной поддержки союзников в Республике эти повстанцы были бы скорее легким раздражителем, чем реальной угрозой. Нашей приоритетной задачей должно быть перекрытие как можно большего числа потенциальных источников поддержки, и как только мы перережем эти вены, движение должно начать умирать вместе с ними."
NEP_isolating_the_king: "Изолировать короля"
NEP_isolating_the_king_desc: "Несмотря на отсутствие реальной власти, король по-прежнему пользуется большим уважением в непальском обществе, и на данный момент почти ни для кого не секрет, что он недоволен властью премьер-министра. Он может очень легко стать важным источником поддержки для наших врагов, и поэтому, пока это восстание не будет подавлено, мы должны ограничить его доступ к внешнему миру, так как не можем рисковать распространением опасных идей как среди него, так и через него."
NEP_the_darjeeling_conspiracy: "Поддержать заговор в Дарджилинге"
NEP_the_darjeeling_conspiracy_desc: "На протяжении почти столетия коррумпированные автократы из династии Рана держали в тисках политику Непала, угнетая его народ, узурпируя власть его королей и удерживая всю страну в состоянии отсталости. Если народ Непала хочет иметь будущее, то правление тиранов из династии Рана должно подойти к концу."
NEP_establishing_contacts_within_the_army: "Установление контактов в армии"
NEP_establishing_contacts_within_the_army_desc: "Хотя армия, как и остальные органы власти, подчиняется премьер-министру, непальская армия не является полностью потерянной. Многие, несомненно, возмущаются правлением Ранов или остаются верными королю Трибхувану, находящемуся в заложниках. Установив контакт с этими прогрессивно мыслящими патриотами в армии, мы можем подготовить почву для падения Ранов."
NEP_cooperating_with_exiled_ranas: "Сотрудничество с изгнанными ранами"
NEP_cooperating_with_exiled_ranas_desc: "Хотя Раны принесли Непалу разруху, не все из них преследуют наши худшие интересы. Мы можем получить преимущество, заручившись поддержкой тех, кто был отвергнут или изгнан своими родственниками, находящимися у власти."
NEP_strengthen_ties_with_calcutta: "Укрепление связей с Калькуттой"
NEP_strengthen_ties_with_calcutta_desc: "Наши товарищи в Калькутте с большим сочувствием относятся к нашему делу, и их поддержка может оказаться жизненно важной для Освободительной армии. Если мы хотим добиться успеха в изгнании Ранов, мы должны углубить наши связи с Народной Республикой."
NEP_appeal_to_hindu_unity: "Призыв к единству индусов"
NEP_appeal_to_hindu_unity_desc: "С тех пор, как великий король Притхви Нараян Шах объявил Непал «Асал Хиндустан», «Истинной Индией», в знак неповиновения исламским императорам Моголов, Непал сохраняет репутацию последнего свободного оплота индуизма. В Индии, и не только в Республике, многие считают, что свобода Непала имеет жизненно важное значение для защиты индуизма от иностранного влияния; и хотя мы, возможно, не разделяем их радикализм в этом вопросе, их поддержка, безусловно, приветствуется."
NEP_preparing_border_infiltration_efforts: "Подготовка к проникновению через границу"
NEP_preparing_border_infiltration_efforts_desc: "Мы должны посеять семена победы, чтобы в решающий момент быть полностью готовыми нанести смертельный удар угнетателям из династии Рана. С этой целью мы тайно переправляем сторонников и союзников через границу, собираем разведданные и создаем благоприятные условия для использования в нужный момент."
NEP_training_with_the_republican_army: "Обучение в Республиканской армии"
NEP_training_with_the_republican_army_desc: "Раны не будут свергнуты с помощью нескольких строгих брошюр, их необходимо устранить силой, и с премьер-министром нужно поступить аналогичным образом. Приоритетом Мукти Сена должно быть обучение армии вместе с нашими индийскими союзниками и подготовка к неизбежной войне за освобождение Непала."
NEP_sowing_the_seeds_for_democracy: "Посев семян демократии"
NEP_sowing_the_seeds_for_democracy_desc: "Хотя почти наверняка Раны не уйдут просто так, и для их устранения потребуется сила, мы не можем забывать, что именно захватом власти силой и убийством политических лидеров Раны и создали свой режим. Нашим приоритетом должна быть подготовка к построению свободного Непала после свержения премьер-министра, а не только то, как его свергнуть, поскольку без такой подготовки мы можем легко вернуться к тирании."
NEP_limit_the_spread_of_propaganda: "Ограничение распространения пропаганды"
NEP_limit_the_spread_of_propaganda_desc: "Кажется, не проходит и дня, чтобы в Катманду не распространялись газеты из Дели или Калькутты, или чтобы человек с пенджабским или бенгальским акцентом не начинал распространять слухи всем, кто готов их слушать. Эти довольно очевидные попытки повлиять на Непал не должны допускаться, и мы будем пресекать их при каждой возможности."
NEP_request_restraint_by_all_factions: "Призыв к сдержанности всех фракций"
NEP_request_restraint_by_all_factions_desc: "Хотя текущая ситуация далека от идеальной, положение в Непале почти наверняка ухудшится, если «Мукти Сена» усилит свою революцию или Раны станут более жесткими в своих попытках подавить восстание. Мы не можем позволить себе как нация погрязнуть в кровопролитии и должны призывать к сдержанности, даже если это часто остается без внимания."
NEP_defending_our_sovereignty: "Защита нашего суверенитета"
NEP_defending_our_sovereignty_desc: "Позорно, что за Непал борются, как будто он просто игрушка великих держав, а не гордая нация, имеющая право на существование. Никто, кроме самого Непала, не должен решать, какой будет политика Непала, и мы должны предотвратить все попытки извне повлиять на ситуацию в пользу одной из сторон этого конфликта, если мы не хотим стать просто марионеткой."
NEP_put_faith_in_his_majesty: "Вера в Его Величество"
NEP_put_faith_in_his_majesty_desc: "Если в это бурное время в Непале и есть один оплот стабильности, то это его величество король Трибхуван Шах, и даже если страна погрузится в хаос, мы должны верить, что под руководством короля мы выйдем из кризиса и пойдем к светлому будущему."

NEP_acquiring_indian_surplus: "Овладеть индийских излишков"
NEP_acquiring_indian_surplus_desc: "Конфликт в Индии привел к появлению значительных запасов излишнего военного оборудования, и нам жизненно важно приобрести как можно больше из него. То, что для других является излишком, для Непала может означать разницу между поражением и выживанием."
NEP_guarding_the_prime_minister: "Охранить премьер-министра"
NEP_guarding_the_prime_minister_desc: "Поскольку будущее нашей страны зависит от безопасности её лидеров, их защита имеет первостепенное значение для армии. По этой причине мы создадим элитные войска, способные не только непосредственно защищать лидеров от опасности, но и защищать страну на её границах и, при необходимости, наносить удары по территории противника."
NEP_protecting_kathmandu: "Защита Катманду"
NEP_protecting_kathmandu_desc: "В случае наихудшего развития событий жизненно важно защитить столицу и окружающую её долину Катманду от иностранного вторжения. Эти защитные сооружения должны состоять не только из существующих географических барьеров, но и из прочных искусственных укреплений, построенных с учетом методов и средств современной войны."
NEP_preparing_for_tibetan_aggression: "Подготовка к тибетской агрессии"
NEP_preparing_for_tibetan_aggression_desc: "Несмотря на прошлые попытки прояснить ситуацию, наша граница с Тибетом остается нечетко очерченной и уязвимой в нескольких ключевых местах. Хотя в настоящее время нападение с севера кажется маловероятным, важно, чтобы правительство было готово к такой возможности, если северный сосед решит более решительно обозначить границу."
NEP_when_the_ganga_runs_red: "Когда Ганга становится красной"
NEP_when_the_ganga_runs_red_desc: "С возобновлением войны на юге будущее Непала стало более неопределенным, чем когда-либо. Независимо от того, вступим ли мы непосредственно в борьбу за Индию или будем поддерживать нашего фаворита на расстоянии, жизненно важно, чтобы мы играли активную роль в определении того, кто будет доминировать в будущем субконтинента."
NEP_built_around_an_elite_core: "Построенный вокруг элитного ядра"
NEP_built_around_an_elite_core_desc: "Будущее непальской армии зависит от того, сможем ли мы развить элитные традиции, благодаря которым солдаты из Непала стали известны и уважаемы во всем мире. Вместо того чтобы отказываться от того, что явно доказало свою высокую эффективность, мы сосредоточимся на том, чтобы вся армия Непала оправдала репутацию, заработанную её лучшими представителями."
NEP_favouring_flexibility: "Предпочтение гибкости"
NEP_favouring_flexibility_desc: "Хотя наши солдаты и обладают огромной силой, мы должны признать, что в обычной битве нам вряд ли удастся победить более мощные державы. Однако нам повезло, что не все сражения обязательно должны быть обычными, и поэтому мы должны подготовить наших солдат к действиям в любой ситуации, в которой они могут оказаться, чтобы, как можно надеяться, получить необходимое преимущество над неподготовленными противниками."
NEP_capitalising_on_breakthroughs: "Использование прорывов"
NEP_capitalising_on_breakthroughs_desc: "Благодаря элитному характеру наших лучших солдат, прорыв вражеских линий, безусловно, возможен, но эти достижения будут бессмысленными, если мы не будем знать, как их использовать. Поэтому наши солдаты должны быть обучены быстро действовать против неорганизованных сил, даже если это означает работу без связи с нашими более широкими логистическими сетями."
NEP_kafar_hunu_bhanda_marnu_ramro: "Кафар Хуну Бханда Марну Рамро"
NEP_kafar_hunu_bhanda_marnu_ramro_desc: "«Кафар Хуну Бханда Марну Рамро», или «лучше умереть, чем жить как трус», - это девиз, по которому живут и умирают многие из наших солдат. Там, где другие в страхе бегут при первых признаках беды, наши люди стоят твердо и одерживают победы, которых другие слишком трусливы, чтобы достичь, и именно это действительно отличает непальские войска от всех остальных."
NEP_invest_in_mountaineering_equipment: "Инвестировать в альпинистское снаряжение"
NEP_invest_in_mountaineering_equipment_desc: "Хотя многие из наших солдат знакомы с условиями службы в горных районах Непала, даже самый опытный альпинист не сможет эффективно действовать в таких условиях без надлежащего снаряжения. Поэтому крайне важно, чтобы наши солдаты были оснащены всем необходимым, ведь мы не можем ожидать, что они будут пересекать горную местность, опираясь только на свою силу и мужество, не так ли?"
NEP_specialise_the_doctrines: "Специализировать доктрины"
NEP_specialise_the_doctrines_desc: "Непальские солдаты вряд ли будут штурмовать пляжи Дорсета или сражаться в влажных лесах Юкатана, поэтому нет смысла тратить время на их подготовку к бесчисленным ситуациям, с которыми они, вероятно, никогда не столкнутся. Вместо этого мы должны сосредоточиться на подготовке их к боевым действиям в холмах и горах, которые составляют большую часть ближайшего региона, а остальное просто оставить на попечение наших союзников."
NEP_modernising_the_royal_army: "Модернизация [NEP_loc_army_name]"
NEP_modernising_the_royal_army_desc: "Несмотря на то, что непальские солдаты имеют грозную репутацию, наша армия в целом отстает от времени в плане структуры, оснащения и доктрины. Чтобы создать армию, которая будет использовать сильные стороны Непала, мы должны сначала создать армию, способную противостоять современным вызовам и современным противникам на поле боя."
NEP_the_guns_of_a_modern_age: "Оружие современности"
NEP_the_guns_of_a_modern_age_desc: "Артиллерия издавна играет незаменимую роль в ведении войны, и её значение с течением времени только растет, однако даже сегодня трудно найти достаточное количество непальских солдат, достаточно хорошо знакомых с этим оборудованием, чтобы сформировать батальон. Если мы хотим модернизировать армию, то приобретение артиллерии для наших войск и обучение их её использованию должны стать нашим первоочередным приоритетом."
NEP_expand_the_labour_corp: "Расширить трудового корпуса"
NEP_expand_the_labour_corp_desc: "Хотя в непальской армии, безусловно, есть солдаты, которых можно отнести к категории инженеров или саперов, сравнивать их с настоящими инженерными ротами великих держав мира было бы почти неловко. Но даже несмотря на их неопытность, эти люди могут легко послужить отличной основой для создания нового и расширенного трудового корпуса, который однажды может стать равным им."
NEP_copying_indian_tactics: "Подражать индийским тактикам"
NEP_copying_indian_tactics_desc: "Индийская революция научила многих, как будет вестись война с использованием современного оборудования в Индии, и поэтому индийские армии быстро начали формулировать новые доктрины, основанные на своем опыте. Вместо того, чтобы пытаться самостоятельно разрабатывать идеи о том, как мы будем воевать в Индии, гораздо проще просто вдохновиться их опытом, поскольку они уже проделали за нас всю тяжелую работу."
NEP_utilise_contemporary_planning_methods: "Внедрять современные методы планирования"
NEP_utilise_contemporary_planning_methods_desc: "В наши дни война стала настолько многогранной, что традиционные методы планирования сражений значительно усложнились, и мы не можем рассчитывать на победу, используя тактику, разработанную в те времена, когда над полем битвы летали только голодные стервятники. Необходимо приложить значительные усилия для модернизации наших методов, возможно, по примеру наших индийских соседей, от которых мы уже черпаем значительные знания."
NEP_capitalise_on_volunteer_eagerness: "Использовать энтузиазм добровольцев"
NEP_capitalise_on_volunteer_eagerness_desc: "Если и есть одна область, в которой Непалу не хватает, так это людей, готовых взять в руки винтовку и отправиться на передовую. И в 1914, и в 1925 годах тысячи непальских мужчин покинули страну, чтобы сражаться за наших британских союзников, практически не нуждаясь в поощрении, и такой энтузиазм по-прежнему широко распространен по всей стране, чем мы должны воспользоваться для расширения армии."
NEP_implementation_of_conscription: "Внедрять призывную систему"
NEP_implementation_of_conscription_desc: "Несмотря на то, что многие непальские мужчины готовы вступить в вооруженные силы без особых уговоров, ухудшающаяся ситуация в регионе означает, что даже этих добровольцев, скорее всего, будет недостаточно для защиты страны в случае угрозы. Поэтому мы должны перейти к внедрению системы призыва на военную службу для обеспечения национальной безопасности."
NEP_invest_in_nakhu_rifle_workshops: "Инвестировать в производство винтовок Nakhu"
NEP_invest_in_nakhu_rifle_workshops_desc: "Непал никогда не славился производством огнестрельного оружия, но покойный Гехендра Шумшер Рана в Наху предпринял несколько попыток производства собственных винтовок. Хотя результаты не были впечатляющими, оставшееся оборудование, использовавшееся для этих операций, безусловно, лучше, чем ничего, для возобновления производства винтовок, и поэтому его следует использовать в качестве отправной точки."
NEP_training_from_foreign_advisors: "Обучение у иностранных советников"
NEP_training_from_foreign_advisors_desc: "Вопрос о том, станет ли человек офицером в непальской армии, часто сводится к вопросу «Насколько близко вы связаны с премьер-министром?», и в связи с этим в стране наблюдается нехватка опытных офицеров. Однако, если мы хотим изменить эту ситуацию, нам придется пригласить иностранных экспертов для обучения наших военнослужащих, поскольку, как уже упоминалось, у нас наблюдается нехватка опыта."
NEP_inviting_air_instructors: "Приглашать летных инструкторов"
NEP_inviting_air_instructors_desc: "Хотя состоятельные жители Непала, безусловно, слышали о существовании самолетов, в стране очень мало людей, которые могут подтвердить их существование. Таким образом, попытка создать военно-воздушные силы любого уровня, безусловно, будет сложной задачей, которая почти полностью будет зависеть от внешних экспертов и пилотов. Возможно, с их поддержкой мы сможем однажды поднять в небо несколько собственных самолетов."

NEP_war_with_sikkim: "Война с Сиккимом"
NEP_war_with_sikkim_desc: "Небольшая горная страна Сикким долгое время сопротивлялась господству Непала. Однако наконец-то настало время, когда Ганток будет ассимилирован в нашу страну. Мы станем единственным правителем Гималаев. Наконец-то мы пойдем на Ганток и заявим свои права на власть над могучим гималайским хребтом."
NEP_protection_of_nepalese_independence: "Защитить независимость Непала"
NEP_protection_of_nepalese_independence_desc: "Вместо того чтобы просто подчиниться более могущественному соседу, Непал твердо противостоял иностранному контролю, успешно избежав тирании Ранов. Однако такую свободу не следует считать само собой разумеющейся, и мы должны обеспечить, чтобы мы никогда больше не оказались в положении, когда нас можно будет подчинить."
NEP_resolving_the_bhutan_conflict: "Урегулировать конфликт с Бутаном"
NEP_resolving_the_bhutan_conflict_desc: "За исключением нескольких десятилетий, когда британцы не позволяли им этого делать, большая часть истории Бутана связана с жестокими набегами на соседей, особенно на бывшее королевство Сикким. В результате индийской революции мы обеспечили контроль над Сиккимом, что вызвало гнев бутанцев, которые с тех пор постоянно нападают на нас. Пришло время отомстить за эти набеги и, возможно, освободить непальское меньшинство, которое Бутан так жестоко угнетает."
NEP_integration_of_the_frontiers: "Интегрировать приграничные территории"
NEP_integration_of_the_frontiers_desc: "Официально задуманные как временная мера, приграничные районы Уттаранчал и Дарджилинг уже некоторое время находятся в подвешенном состоянии, и ни одна из сторон не может установить над ними полный контроль. Теперь, когда силы Сиккима разгромлены и наше намерение освободиться от любого иностранного контроля стало ясным, было бы разумно не предпринимать шагов по возвращению этих регионов. В конце концов, эти земли когда-то принадлежали Непалу, но были просто украдены у нас британскими завоевателями, и поэтому мы имеем право на них."
NEP_punishing_tibetan_insolence: "Наказать Тибет за дерзость"
NEP_punishing_tibetan_insolence_desc: "Тибетцы издавна были наглым народом, часто обращались с нами, как с нижестоящими, выдвигали нелепые требования и угнетали наш народ. Несколько лет назад их жестокое убийство непальских граждан едва не привело к войне между нами, которую удалось предотвратить только благодаря опасениям вмешательства со стороны Калькутты или Пекина, но теперь, когда обе эти силы уже не вызывают такого беспокойства, наконец-то пришло время поставить тибетцев на место."
NEP_reaffirm_the_friendship_treaty: "Подтвердить договор о дружбе"
NEP_reaffirm_the_friendship_treaty_desc: "Поскольку поддержка Доминиона жизненно важна для нашего выживания, а наша нация вновь прочно вернулась в британскую сферу влияния, мы должны стремиться расторгнуть договор о дружбе, который мы заключили с Великобританией, и теперь вместо этого заключить его с нашими друзьями в [DEH.Capital.GetCapitalVictoryPointName]. Этот договор был впервые подписан до того, как индийцы обрели свою нынешнюю независимость, и поэтому важно признать его непрерывность с Доминионом отдельно от Великобритании, просто как символический жест наших прочных связей, если не более того."
NEP_uphold_gurkha_commitments: "Выполнить обязательства перед гуркхами"
NEP_uphold_gurkha_commitments_desc: "Непальские войска, действующие в британских батальонах гуркхов, сыграли основополагающую роль в выживании британского правления во время индийской революции, и, вероятно, они останутся таковыми до тех пор, пока существует Доминион. Чтобы отплатить за их поддержку в пресечении нашей собственной революции, мы должны обеспечить, чтобы люди по-прежнему отправлялись на помощь нашим индийским друзьям, и приобрести материальные средства, необходимые для их подготовки к будущим предприятиям."
NEP_technological_exchange_with_raj: "Технологический обмен с Доминионом"
NEP_technological_exchange_with_raj_desc: "Наш союз с Доминионом представляет собой прекрасную возможность для обмена знаниями между нашими двумя странами, поскольку теперь мы имеем доступ к иностранным промышленным экспертам и современным технологическим достижениям. Такую возможность, несмотря на наше нежелание полностью индустриализировать страну, нельзя просто игнорировать, и поэтому мы должны стремиться как можно скорее ею воспользоваться."
NEP_under_the_wings_of_the_republic: "[NEP_BHC_or_PRF]"
NEP_under_the_wings_of_the_republic_BHC: "Под крылом Республики"
NEP_under_the_wings_of_the_republic_PRF: "Достичь соглашения с Федерацией"
NEP_under_the_wings_of_the_republic_desc: "Без поддержки индийцев, скорее всего, Мukti Sena была бы разгромлена, а Непал навсегда остался бы под гнетом династии Рана. Мы никогда не забудем великий дар свободы, который подарили нам индийцы, и должны стремиться публично признать ту важную роль, которую они сыграли, чтобы выразить нашу благодарность."
NEP_seek_indian_economic_aid: "Запросить экономическую помощь Индии"
NEP_seek_indian_economic_aid_desc: "Индустриализация Непала - нелегкая задача, и попытки справиться с ней в одиночку вряд ли приведут к быстрым и эффективным результатам. К счастью, наши новые друзья на юге имеют настолько сильную промышленность, что могут нам помочь, даже несмотря на разрушения, причиненные гражданской войной. С их помощью Непал, возможно, однажды сможет назвать себя по-настоящему современной страной."
NEP_acquire_blueprints_from_ishapore: "Получить чертежи из Ишапора"
NEP_acquire_blueprints_from_ishapore_desc: "Основанный сначала британцами и значительно расширенный после его захвата [BHC.GetNameDef], Ишапур является потенциально одним из самых производительных заводов по производству винтовок во всей Азии и, как таковой, имеет возможность производить большое количество огнестрельного оружия. Если мы хотим производить оружие, более подходящее для 20-го века, а не модифицированные винтовки Мартини-Генри, которые все ещё используют большинство наших войск, то нет лучшего места для получения чертежей, чем Ишапур."
NEP_renegotiate_defence_obligations: "Пересмотреть оборонные обязательства"
NEP_renegotiate_defence_obligations_desc: "С окончанием гражданской войны в Индии и победой наших союзников над их варварскими соперниками, нынешний уровень военного присутствия Индии в Непале больше не нужен, и поэтому мы можем свободно добиваться большей независимости от их влияния. Будем надеяться, что наши союзники согласятся с этим мнением и позволят нам снова действовать как свободное государство."

NEP_the_padma_shumsher_economic_plan: "Экономический план Падмы Шумшера"
NEP_the_padma_shumsher_economic_plan_desc: "Несмотря на противодействие этой идее со стороны премьер-министра, а также многих влиятельных членов династии, Доминион потребовал, чтобы мы начали индустриализацию в интересах безопасности обеих наших стран. Они поддержали идеи старшего члена Падмы Шумшера Раны, чьи радикальные взгляды привели его к конфликту с большей частью правительства, но, вероятно, позволят достичь того, чего требует от нас Доминион."
NEP_implementing_the_company_act: "Ввести в действие Закон о компаниях"
NEP_implementing_the_company_act_desc: "Маловероятно, что непальская промышленность начнет развиваться без вмешательства правительства, поскольку в стране мало кто, чье имя не заканчивается на «Рана», способен это сделать. Поэтому именно правительство должно дать старт промышленному развитию, и в связи с этим мы должны начать создание нескольких государственных предприятий в текстильной и других легкодоступных отраслях."
NEP_importing_displaced_indian_workers: "Импортировать перемещённых индийских рабочих"
NEP_importing_displaced_indian_workers_desc: "Многолетний конфликт в Индии привел к тому, что многие люди остались без крова и средств к существованию, что делает их идеальными работниками для наших процветающих отраслей. Многие из них уже имеют опыт работы на фабриках, и, нанимая их, мы также можем избежать необходимости давать среднестатистическому гражданину Непала больше прав, чем это необходимо."
NEP_ensure_defence_of_the_regime: "Обеспечить защиту режима"
NEP_ensure_defence_of_the_regime_desc: "Несмотря на все наши усилия, в будущем мы, вероятно, столкнемся с повторением недавнего восстания, и нет уверенности в том, что мы сможем и дальше полагаться на другие страны в производстве оружия, необходимого для подавления любых дальнейших восстаний. Поэтому мы должны возобновить прежние усилия по производству оружия на местном уровне, даже если оно будет несколько уступать тому, что можно приобрести в других странах."
NEP_place_limits_on_tax_skimming: "Ограничить уклонение от налогов"
NEP_place_limits_on_tax_skimming_desc: "Несмотря на яростное сопротивление этой идее со стороны членов своей династии, Падма Шумшер заявил о своем желании сократить количество денег, выводимых из государства для финансирования многочисленных прихотей Ранов. При поддержке Доминиона мы мало что можем сделать, чтобы остановить такую тиранию."
NEP_cotton_and_jute_mills_in_biratnagar: "Хлопчатобумажные и джутовые фабрики в Биратнагаре"
NEP_cotton_and_jute_mills_in_biratnagar_desc: "Город Биратнагар, расположенный на равнинах Терая, является идеальным местом для реализации первых крупных промышленных проектов страны. Мы должны стремиться к созданию здесь крупных фабрик по производству джута и хлопка, поскольку близость к индийской границе означает, что продукция этих фабрик, такая как шпагат, джутовые мешки и одежда, может быть легко экспортирована в нашу богатую соседнюю страну."
NEP_expanding_the_industrial_council: "Расширить Промышленный совет"
NEP_expanding_the_industrial_council_desc: "Удьёг Паришад, Промышленный совет, представляет собой одну из немногих предыдущих попыток Джадды Раны реализовать идею индустриализации. Он был создан как способ направления финансирования на любые усилия по индустриализации, в первую очередь с целью расширения таких отраслей, как лесозаготовительная промышленность, от которой члены его семьи получают значительную прибыль. Теперь он станет идеальной основой для дальнейшего роста других ключевых национальных отраслей."
NEP_furthering_thoshe_mining_efforts: "Усилить добычу в Тоше"
NEP_furthering_thoshe_mining_efforts_desc: "Шахта Тоше в Рамечхапе является одной из крупнейших в стране по добыче железа, хотя в последние годы добыча значительно сократилась. Однако доступ местного населения к железу для производства стали, вероятно, будет чрезвычайно важен для индустриализации, и поэтому мы должны обеспечить не только возобновление добычи, но и контролировать её значительное расширение."

NEP_bringing_nepal_into_the_industrial_age: "Ввести Непал в индустриальную эпоху"
NEP_bringing_nepal_into_the_industrial_age_desc: "Непал как нация давно обладает потенциалом, чтобы стать промышленной державой, но в результате бесправия Раны он отстает от своих соседей на несколько столетий. После стабилизации ситуации главным приоритетом правительства должно стать изменение курса и, наконец, вывод Непала на путь индустриализации и экономического роста."
NEP_beginning_the_five_year_plan: "Начать пятилетний план"
NEP_beginning_the_five_year_plan_desc: "В последние годы концепция годовых экономических планов стала довольно распространенным явлением в качестве решения проблемы экономической отсталости. Эти идеи широко распространены в соседней Индии и постепенно начинают приживаться среди членов правительства в Катманду. Благодаря тому, что их аргументы оказались убедительными, Непал теперь готов приступить к реализации собственного пятилетнего плана, по окончании которого должна быть достигнута индустриализация."
NEP_inviting_indian_investors: "Пригласить индийских инвесторов"
NEP_inviting_indian_investors_desc: "Непальская экономика вряд ли сможет расти исключительно за счет собственных сил, и не стоит этого ожидать. Многие в соседней Индии с нетерпением ждут возможности заработать себе имя, инвестируя в процветающую промышленность Непала, и мы должны использовать этот энтузиазм для дальнейшего роста."
NEP_utilising_our_natural_beauty: "Использовать нашу природную красоту"
NEP_utilising_our_natural_beauty_desc: "Несмотря на задержку, вызванную индийской революцией, Непал начал завоевывать известность среди многих иностранцев благодаря своей природной красоте. Существует бесчисленное количество богатых мужчин и женщин, которые готовы заплатить целое состояние, чтобы подняться на наши горы и познакомиться с нашей культурой, и нет никаких причин лишать таких посетителей возможности принести нам свое богатство."
NEP_growing_the_pashmina_industry: "Развивать индустрию пашмины"
NEP_growing_the_pashmina_industry_desc: "Хотя шерсть кашемировых коз так тесно ассоциируется с Кашмиром, что даже получила название этого региона, изделия из пашмины часто производятся и в Непале. На протяжении многих лет непальская пашмина носилась даже в далеком гламурном Нью-Йорке в Америке, и, несмотря на гражданскую войну, спрос на эти роскошные изделия по-прежнему высок как там, так и во всем мире; мы должны стремиться удовлетворить его насколько это возможно."
NEP_towards_a_national_highway_network: "Создать сеть национальных дорог"
NEP_towards_a_national_highway_network_desc: "Хотя проект «Почтовое шоссе», начатый Ранами, безусловно, является фантастической отправной точкой, мы должны мечтать о большем и стремиться соединить всю страну через грандиозную сеть автомагистралей. Хотя вряд ли он будет завершен в ближайшее время, даже самые базовые разработки, скорее всего, принесут стране значительные краткосрочные выгоды."
NEP_adopting_modern_irrigation_methods: "Внедрить современные методы орошения"
NEP_adopting_modern_irrigation_methods_desc: "Ирригация имеет жизненно важное значение для роста сельскохозяйственных культур, и в то время как остальной мир начал уходить от тех дней, когда отсутствие дождей могло парализовать страну, многие регионы Непала по-прежнему находятся под угрозой голода, вызванного засухой. Мы должны стремиться улучшить наши ирригационные сети в надежде, что однажды ни один человек в Непале не сможет сказать вам, на что похож вкус вареной травы."
NEP_ramp_up_national_exports: "Увеличить национальный экспорт"
NEP_ramp_up_national_exports_desc: "Будущее экономики Непала должно стать таким, при котором мы будем получать огромную выгоду от экспорта продуктов, начиная от сырых металлов и заканчивая сложными изделиями из одежды и дерева. Мы должны максимально увеличить производство во всех отраслях, одновременно ища новые рынки сбыта для этих товаров, и со временем, вероятно, вся страна начнет получать выгоду."

NEP_paving_the_postal_highway: "Проложить Почтовую магистраль"
NEP_paving_the_postal_highway_desc: "Проект «Почтовое шоссе» был инициирован в начале десятилетия с целью проложить одну непрерывную дорогу вдоль всей южной границы страны, в первую очередь для доставки почты, как следует из названия. Однако большая часть этого проекта до сих пор остается незавершенной, и его дальнейшее развитие должно стать национальным приоритетом, учитывая, что правительство теперь гораздо более стабильно."
NEP_revive_the_government_railway_plan: "Возродить план правительственной железной дороги"
NEP_revive_the_government_railway_plan_desc: "Планы по строительству первой железной дороги в Непале, которая должна была соединить местные лесозаготовительные предприятия вблизи границы с покупателями в Индии, были полностью сорваны индийской революцией. С учетом достаточно стабильной ситуации как в Индии, так и в Непале, эти планы должны быть возобновлены в качестве основы железнодорожного транспорта в Непале."
NEP_connecting_to_the_frontier: "Соединиться с приграничьем"
NEP_connecting_to_the_frontier_desc: "Хотя непальские войска контролируют многие приграничные районы, они действуют довольно автономно от столицы из-за того, что до них очень трудно добраться из Катманду. С нашим недавним вторжением в железнодорожную инфраструктуру было бы разумно попытаться построить железные дороги, соединяющиеся с границей, чтобы расширить наш охват."
NEP_bringing_in_foreign_experts: "Привлечь иностранных специалистов"
NEP_bringing_in_foreign_experts_desc: "Технологическое развитие имеет жизненно важное значение для растущей экономики, однако Непал испытывает недостаток в людях, которые могли бы фактически возглавить такое развитие. Поэтому мы должны стремиться пригласить людей со всего мира, готовых работать за приличную государственную зарплату, чтобы возглавить наши усилия по развитию в будущем."
NEP_constructing_the_sundarijal_station: "Построить станцию Сундариджал"
NEP_constructing_the_sundarijal_station_desc: "Уже несколько лет существуют планы по строительству гидроэлектростанции у истоков реки Багмати в Сундариджале. Небольшая гравитационная плотина в этом месте будет идеальным решением для обеспечения Катманду электроэнергией, и с недавним ростом промышленного потенциала мы наконец-то можем построить такую станцию."

NEP_regency_of_the_ranas: "Регентство Ранов"
NEP_regency_of_the_ranas_desc: "Несмотря на врагов снаружи и предателей внутри, правительство Раны выжило. Социалистическая толпа Мукти Сена была разгромлена и бежала обратно к своим хозяевам в Калькутту вместе с предателем-королем. Попав так близко к краю пропасти, вполне естественно, что рука премьер-министра должна усилить контроль, чтобы предотвратить повторение этой катастрофы."
NEP_replacing_the_rebellious_ruler: "Заменить мятежного правителя"
NEP_replacing_the_rebellious_ruler_desc: "После того как неблагодарный король Трибхуван бежал из страны вместе с большей частью своей семьи, регент оказался в дилемме, служа по номинальному велению пустого трона. Для обеспечения стабильности королевства и преемственности правительства Раны мы должны быстро найти кандидата с законными правами, который также понимает, кто на самом деле держит бразды правления."
NEP_purge_the_army_of_royalists: "Очистить армию от роялистов"
NEP_purge_the_army_of_royalists_desc: "Хотя нам удалось на данный момент отразить угрозу восстановления монархии, большая часть армии по-прежнему преданна поверженному королю и королевскому дому. Поскольку мы не можем полностью ликвидировать монархию, мы должны обеспечить, чтобы армия не стала оплотом для каких-либо глупцов, надеющихся повторить пример бывшего короля Трибхувана."
NEP_furthering_control_of_village_courts: "Усилить контроль деревенских судов"
NEP_furthering_control_of_village_courts_desc: "По всему Непалу большая часть повседневного управления осуществляется местными органами, интересы и заботы которых носят аналогичный местный характер. Усилив наше влияние в этих органах, мы можем обеспечить, чтобы желания и потребности правительства были действительно ощутимы по всей стране и известны народу."
NEP_ramp_up_revenue_extraction: "Увеличить сбор доходов"
NEP_ramp_up_revenue_extraction_desc: "Очевидно, что мы были слишком добры к среднему гражданину, поскольку он обогащается, в то время как государство с трудом финансирует себя. Мы должны устранить эту несправедливость, повысив налоги везде, где это возможно, и земельный налог малгуджари, безусловно, является идеальным кандидатом для такого повышения. Конечно, крестьяне будут протестовать, но мы никогда не прислушивались к их мнению по таким вопросам и не намерены начинать это делать сейчас."
NEP_developing_a_moral_education_system: "Разработать систему нравственного воспитания"
NEP_developing_a_moral_education_system_desc: "Если поражение угрозы со стороны Мукти Сена и показало что-то, так это то, что значительная часть Непала ужасающе открыта для проповедей негодяев, зараженных абсурдными иностранными идеологиями. Для будущего нации следующее поколение должно расти с правильным пониманием своего места в мире и мудрости своих лидеров."
NEP_harness_gorkha_nationalist_rhetoric: "Использовать националистическую риторику гуркхов"
NEP_harness_gorkha_nationalist_rhetoric_desc: "Среди некоторых младших членов династии постепенно укрепляется убеждение, что для продолжения долгосрочного правления Рана нам необходимо убедить среднего непальца в том, что мы работаем в его интересах. Поэтому было предложено попытаться кооптировать растущее националистическое движение, существующее как здесь, так и за границей, представляя Рана как ярых сторонников горкхского национализма, противостоящих иностранному господству."
NEP_empowerment_of_the_council_of_ministers: "Расширить полномочия Совета министров"
NEP_empowerment_of_the_council_of_ministers_desc: "С заменой короля исполнительная власть теперь находится под нашим полным контролем, а премьер-министр и его кабинет беспрепятственно управляют государством. Чтобы закрепить эти изменения, Совет министров должен получить больше свободы действий для определения будущего курса страны."
NEP_remove_vestiges_of_royal_authority: "Устранить остатки королевской власти"
NEP_remove_vestiges_of_royal_authority_desc: "Хотя король Самарайя понимает свое положение, нет гарантии, что будущие короли не будут принимать опрометчивых и необдуманных решений. Чтобы защитить достоинство королевского дома, мы должны четко дать понять, что номинальные полномочия, которые когда-то принадлежали королям Непала, теперь принадлежат премьер-министру и его лояльному правительству. Эта нация подчиняется Ранам, и ничто не изменит этого."
NEP_reorganise_decaying_ministries: "Реорганизовать приходящие в упадок министерства"
NEP_reorganise_decaying_ministries_desc: "Хотя мы уже очистили институты Непала от врагов, в правительстве остается много бесполезных и безрезультатных усилий, которые можно устранить. Кроме того, мы можем использовать эту возможность, чтобы вознаградить тех, кто остался верным, и наказать тех, кто решил ничего не делать в час нашей нужды, даже если они никогда не выступали против нас."
NEP_establish_a_controlled_legislature: "Учредить подконтрольный законодательный орган"
NEP_establish_a_controlled_legislature_desc: "Явно продемонстрировав свое господство над государством, великодушный премьер-министр готов даровать своим подданным право представительства, выбрав самых способных и лояльных из всей страны, чтобы они помогали нашим мудрым правителям в управлении. Поистине, Раны - самые щедрые правители."
NEP_absolute_power_of_the_prime_minister: "Абсолютная власть премьер-министра"
NEP_absolute_power_of_the_prime_minister_desc: "Кораблю нужен один капитан, а нации - один лидер. Служить государственному кораблю - значит действовать в абсолютном повиновении воле премьер-министра. Раны правили таким образом почти столетие и будут править таким образом ещё столетие, теперь уже без необходимости маскировать или размывать свою власть уступками слабым и недостойным. Раны - это Непал, и отрицать это - значит отрицать реальность."

NEP_our_ruler_glorious: "Наш правитель славный"
NEP_our_ruler_glorious_desc: "Сто лет узурпации были положены конец рукой нашего славного короля Трибхувана! Превратив попытки Доминиона и Республики превратить Непал в оружие против других в мощный инструмент для получения поддержки как со стороны Мукти Сена, так и со стороны правительства Раны, король вновь находится на переднем крае политики и правительства Непала."
NEP_his_majestys_loyal_government: "Лояльное правительство Его Величества"
NEP_his_majestys_loyal_government_desc: "С восстановлением короля Непал теперь является по-настоящему независимой страной, не находящейся ни под железной рукой коррумпированного тирана Раны, который преклоняет колени перед англичанами, ни под властью радикальных социалистов, зависимых от правительства в Калькутте, а по-настоящему своей собственной страной. Мы должны действовать быстро, чтобы воспользоваться этой ситуацией и создать правительство, лояльное королю и его планам для страны."
NEP_restoring_power_to_the_sovereign: "Вернуть власть государю"
NEP_restoring_power_to_the_sovereign_desc: "При Ранах король стал лишь символом, с помощью которого они удерживали контроль над страной. С правительством, наконец лояльным королю, мы восстановим практическую власть непальского монарха."
NEP_compromise_with_the_ranas: "Достичь компромисса с Ранами"
NEP_compromise_with_the_ranas_desc: "Хотя годы правления Раны были прискорбными, отдельные Раны остаются способными и влиятельными фигурами, и было бы глупо игнорировать их. В условиях надвигающейся угрозы социализма не составит труда пойти на необходимые уступки, чтобы привлечь на нашу сторону остатки старого порядка."
NEP_empowering_local_councils: "Расширить полномочия местных советов"
NEP_empowering_local_councils_desc: "Король - это всего лишь один человек, и правительство в такой стране, как наша, не может быть слишком обширным. Наделение местных советов полномочиями по решению своих собственных проблем позволит королю и его правительству сосредоточиться на национальных приоритетах, а также создаст ощущение отзывчивого правительства."
NEP_a_state_that_serves_its_people: "Государство, служащее своему народу"
NEP_a_state_that_serves_its_people_desc: "Слишком долго государство управлялось так, как будто его цель заключалась в обеспечении выгод для нескольких влиятельных фигур, принося ущерб всем остальным. Теперь, получив полномочия, король Трибхуван, благодаря своей великой мудрости, понимает, что долг государства и его правителей заключается в обеспечении благосостояния своего народа, и неустанно работает в этом духе."
NEP_ensure_royal_control_of_the_army: "Обеспечить королевский контроль над армией"
NEP_ensure_royal_control_of_the_army_desc: "Теперь, когда период символического правления закончился, крайне важно, чтобы король восстановил прямую королевскую власть над вооруженными силами. Ни при каких обстоятельствах нельзя допустить, чтобы будущий узурпатор использовал силы, предназначенные для защиты королевства, для его разрушения."
NEP_forming_an_elected_assembly: "Сформировать выборное собрание"
NEP_forming_an_elected_assembly_desc: "Наиболее важным приоритетом в стабилизации Непала является предоставление народу права голоса. Только работая с народом и для народа, а также с его законными представителями, мы сможем вывести Непал из-под тирании бесправия Раны."
NEP_royally_appointed_bharadari_sabha: "Назначаемая королём Бхарадари Сабха"
NEP_royally_appointed_bharadari_sabha_desc: "Несмотря на то, что мы пошли на значительные уступки в пользу народного правления, в интересах Королевства необходимо контролировать любую избранную народом ассамблею, чтобы предотвратить возникновение правления толпы. С этой целью мы создадим назначаемую верхнюю палату законодательного органа, в состав которой войдут люди, выбранные королем за их компетентность и мудрость."
NEP_prioritise_the_need_for_education: "Уделить первостепенное внимание необходимости образования"
NEP_prioritise_the_need_for_education_desc: "Для того чтобы Непал имел светлое будущее, его народ должен быть готов решать проблемы современного мира. Основой для подготовки такого населения является образование, вооружение народа знаниями и навыками, которые будут служить ему и Непалу в течение многих лет."
NEP_under_the_courageous_sovereign: "Под руководством отважного государя"
NEP_under_the_courageous_sovereign_desc: "В то время как другие стремились захватить власть, обращаясь к посторонним силам, только король имел мужество подняться на высоту положения, а не преклониться перед теми, кто рассматривает Непал как средство для достижения своих целей. Восстановление королевской власти заложило основу для вступления Непала в эпоху процветания и безопасности на своих условиях."

NEP_the_unshackling_of_nepal: "Освобождение Непала"
NEP_the_unshackling_of_nepal_desc: "Наконец-то тираны Рана были свергнуты, Мукти Сена захватила столицу, и нация наконец-то может смотреть вперед, а не назад. Впервые за много лет будущее Непала выглядит светлым, и ведет его не один человек, а весь народ."
NEP_formation_of_the_interim_government: "Сформировать временное правительство"
NEP_formation_of_the_interim_government_desc: "Успех нашей революции принадлежит в равной степени монархии и социалистам, и народ по-прежнему поддерживает своего короля перед лицом неопределенного будущего. Поскольку некоторые по-прежнему упорно не признают эту реальность, Паришад должен взять на себя ведущую роль наряду с королем в переходе Непала к демократии."
NEP_a_democratic_maha_sabha: "Демократическая Маха Сабха"
NEP_a_democratic_maha_sabha_desc: "Следуя двухпалатной модели других демократических стран, Непал создаст верхнюю палату законодательного органа, избираемую народом. Эта верхняя палата будет контролировать власть нижней палаты и работать с ней и королем для управления страной."
NEP_honour_the_legacy_of_the_martyrs: "Почтить память мучеников"
NEP_honour_the_legacy_of_the_martyrs_desc: "Все те, кто погиб в стремлении к лучшему будущему, все те, кто сражался и погиб в борьбе за прекращение тирании Раны, все те, кто погиб за Непал, будут почтены за свой героизм и жертву, чтобы будущие поколения могли брать с них пример."
NEP_uplift_nepal_into_the_20th_century: "Воздать Непал в XX век"
NEP_uplift_nepal_into_the_20th_century_desc: "Будущее Непала зависит от курса, намеченного Праджа Паришадом. Присоединившись к современному миру, создав богатство и уважая религию, Непал станет одной из передовых стран мира, а гордость народа за свою страну будет звучать во всех направлениях на протяжении тысячелетий."

NEP_loyalty_to_the_liberators: "Хранить верность освободителям"
NEP_loyalty_to_the_liberators_desc: "Революция в Непале была бы невозможна без поддержки наших друзей в Калькутте. В самый мрачный час, когда жестокое правление Ранов казалось неизбежным для Непала, они приютили и поддержали Мукти Сена и помогли Непалу обрести свободу. Хотя Паришад, безусловно, более лоялен к королю, чем социалисты, очевидно, что будущее Катманду связано с Калькуттой."
NEP_the_monarchy_problem: "Проблема монархии"
NEP_the_monarchy_problem_desc: "В отношениях с монархией мы оказались зажаты между нашими принципами, нашими союзниками и реалиями коалиции, которая привела нас к власти. Рано или поздно мы будем вынуждены решить, есть ли место королю в будущем Непала."
NEP_dethrone_the_landlords: "Свергнуть помещиков"
NEP_dethrone_the_landlords_desc: "Первоочередной задачей социалистической революции в любой преимущественно сельской стране является отнятие контроля над землей у помещиков и аристократов. Предоставление земли земледельцам не только разрушает основу власти реакционного класса, но и завоевывает лояльность и поддержку кисанов, которые могут значительно выиграть от упразднения своих хозяев."
NEP_research_support_from_india: "Научная поддержка из Индии"
NEP_research_support_from_india_desc: "Хотя наши амбиции связаны с современным миром, на данный момент Непал, к сожалению, отстает от времени. Чтобы исправить это, наши собственные усилия должны сопровождаться полным сотрудничеством и поддержкой наших союзников в Калькутте. Только тогда Непал сможет начать стремиться к месту в современном мире."
NEP_glorify_the_kisan: "Восславить кисан"
NEP_glorify_the_kisan_desc: "Если слава нации принадлежит кому-либо, то не отдельным людям, живым или мёртвым, а угнетенному классу, чье богатство построило дворцы аристократов и чьи продукты питали армии князей и королей. Именно кисаны являются основой и опорой Непала, и именно для кисанов мы будем строить будущее Непала."
NEP_the_land_of_red_mountains: "Земля Красных гор"
NEP_the_land_of_red_mountains_desc: "То, что ещё недавно казалось невозможным, стало реальностью. Остатки феодализма и реакции пали в горах и долинах Непала, уступив место ярким знаменам социализма и современности, развевающимся высоко в небе и окрашивающим землю под ними в яркий красный цвет."

NEP_sweep_away_the_ranas_greed: "Смести алчность Ранов"
NEP_sweep_away_the_ranas_greed_desc: "С установлением нового правительства настало время покончить с последними остатками коррупции и непотизма Ранов, которые так много украли у Непала. Эпоха клептократии, которая обнищала нацию, будет сметена и никогда не вернется."
NEP_developing_panchayat_self_governance: "Развивать самоуправление панчаятов"
NEP_developing_panchayat_self_governance_desc: "В поисках плана будущего Непала мы имеем большую удачу, что можем воспользоваться одной из старейших систем местного самоуправления в мире, которая соответствует нашим демократическим принципам. Развитие и укрепление этой системы не только позволит нам модернизировать местное самоуправление, но и заручиться поддержкой и сотрудничеством надежных местных институтов."
NEP_establishment_of_the_pradhan_nyayalaya: "Учредить Прадхан Ньяялая"
NEP_establishment_of_the_pradhan_nyayalaya_desc: "Для построения демократического будущего независимая судебная власть является жизненно важным шагом. Создав ответственную Pradhan Nyayalaya, мы гарантируем, что закон не будет использоваться в качестве оружия партийными лидерами и потенциальными тиранами."
NEP_protection_of_the_fundamental_principles: "Защита основополагающих принципов"
NEP_protection_of_the_fundamental_principles_desc: "Без принципов справедливости и человеческого достоинства, которые движут нами, революция, за которую мы боролись против Ранов, является пустой борьбой за власть. Поэтому наш высший долг как участников революции - следовать этим фундаментальным принципам, защищать их от любых посягательств и создавать систему, которая, в свою очередь, будет их защищать."


### Intro Screen ###

NEP_guide: "§MРегентство Рана§! ($paternal_autocrat_coloured$)\n£white_dot Когда закончится Дарджилингский заговор, добейтесь победы правительства, поддерживаемого Доминионом, имея на 25 или более очков больше, чем повстанцы.\n£white_dot Вы начнёте как марионетка, но сможете стать независимым членом Антанты с помощью фокуса §Y$NEP_renegotiate_defence_obligations$§!.\n\n§MРеставрация монархии§! ($authoritarian_democrat_coloured$)\n£white_dot Когда закончится Дарджилингский заговор, добейтесь, чтобы ни одна из сторон не имела преимущества в 25 или более очков над другой.\n£white_dot Завершение фокуса §Y$NEP_protection_of_nepalese_independence$§! даст возможность присоединиться к Сфере сопроцветания, если вы граничите с её членом, или к любой фракции, в которую войдёт Княжеская федерация.\n\n§MОсвобождение Непала§! ($social_liberal_coloured$ / $radical_socialist_coloured$ / $syndicalist_coloured$ / $totalist_coloured$)\n£white_dot Когда закончится Дарджилингский заговор, добейтесь победы повстанцев, поддерживаемых Бхаратией, имея на 25 или более очков больше, чем правительство.\n£white_dot Последующее событие позволит вам выбрать между $social_liberal_coloured$ Непальским Народным Советом (Nepal Praja Parishad) или $radical_socialist_coloured$ Непальским национальным конгрессом (Nepali National Congress).\n£white_dot Впоследствии Социалисты Совета смогут стать $syndicalist_coloured$ или $totalist_coloured$ через решение, если [BHC.GetNameDef] выбрал один из этих вариантов после фокуса §Y$BHC_first_united_congress$§!.\n£white_dot Социалисты Совета начнут как марионетка, но смогут стать независимым союзником [BHC.GetNameDef] через фокус §Y$NEP_renegotiate_defence_obligations$§!, в то время как для Совета завершение фокуса §Y$NEP_under_the_wings_of_the_republic$§! даст возможность присоединиться к любой фракции, в которую войдёт Княжеская федерация."

NEP_KR_gathering_storm_desc: "Почти столетие Непалом правит железная рука династии Рана, подавляющая любое инакомыслие и превратившая монархию страны не более чем в марионеточный институт. Даже после Индийской революции твёрдая рука премьер-министров Рана уберегла страну от участи, постигшей их британских союзников, а любая потенциальная оппозиция быстро устранялась.\n\nОднако с ростом напряжённости в Индии и подготовкой соседней Республики в Калькутте к возвращению на тропу войны начинает казаться, что Раны могут столкнуться с самой серьёзной угрозой на сегодняшний день."

