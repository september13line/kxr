NEP_kunwar_inderjit_singh: "Кунвар Индерджит Сингх"
NEP_kunwar_inderjit_singh_sic_desc: "§YДата рождения:§! §L1906 год, Думракот, Королевство Непал§!"
NEP_juddha_shumsher_jang_bahadur_rana: "Джуддха Шумшер Рана"
NEP_juddha_shumsher_jang_bahadur_rana_leader_desc: "§YДата рождения:§! §L19 апреля 1875 года, Катманду, Королевство Непал§!\n§YПроисхождение:§! §LНе многие Раны обладают такой голубой кровью, как могучий Джуддха Рана, родившийся в семье кшетри и раджпутов и вдобавок являющийся племянником самого основателя династии Рана. Великий Джанг Бахадур Рана сделал его полковником в самом младенчестве, а позже он стал генералом, когда ему было всего десять лет. Несмотря на кратковременную заминку, когда ему пришлось бросить школу из-за слабого здоровья, восхождение Джуддхи к власти было неуклонным и славным.§!"
NEP_samrajya_shumsher_jang_bahadur_rana: "Самраджья Шумшер Джанг Бахадур Рана"
NEP_samrajya_shumsher_jang_bahadur_rana_regnal: "Самраджья"
NEP_samrajya_shumsher_jang_bahadur_rana_leader_desc: "§YДата рождения:§! §L1921 год, Катманду, Королевство Непал§!\n§YПроисхождение:§! §LПоложение Самраджьи уникально: он сын Раны и Шаха. Самраджья провёл бо́льшую часть своего детства в неловком положении между двумя семьями с растущей напряжённостью, хотя его отец, генерал Кайзер Шумшер Джанг Бахадур Рана, и мать, принцесса Лакшми Раджья Лакшми Дев, прилагали стальные усилия, чтобы держать его подальше от семейных ссор.\n\nКак бы то ни было, Самраджья теперь оказался в центре внимания после кульминации многолетних распрей между Ранами и Шахами. Молодой и невероятно неопытный, он (по замыслу) обречён поддерживать многолетнее традиционное правление Ранов над тем, что в остальном формально является владением Королевского дома Горкха. Действительно, Раны теперь наконец добились того, чтобы их окончательно отождествляли с правящей семьёй.§!"
