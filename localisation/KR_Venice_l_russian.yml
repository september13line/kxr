### Political Focuses ###
VNC_great_council: "Открытие Большого совета"
VNC_great_council_desc: "Теперь, когда республика снова независима, мы должны открыть залы Большого совета и решить, как будет устроена Светлейшая."
VNC_new_republic: "Новая республика"
VNC_new_republic_desc: "С победой либералов на заседании Большого совета мы можем приступить к созданию современной, либеральной Венецианской республики."
VNC_together_as_one: "Вместе как одно целое"
VNC_together_as_one_desc: "Мы должны пробудить веру не только в демократию и венецианскую культуру, но и в то, что Венеция должна работать вместе как единое целое и единый разум. Мы все должны посвятить себя цели развития, если хотим выжить."
VNC_meritocracy: "Меритократия"
VNC_meritocracy_desc: "Мы должны поощрять меритократию внутри правительства. Любой мужчина или женщина, добившиеся успеха, должны иметь право войти в залы власти."
VNC_womens_suffrage: "Женское избирательное право"
VNC_womens_suffrage_desc: "Следует ввести женское избирательное право. Как мы можем иметь современное общество, если не дадим прекрасному полу права голоса или участия в политике?"
VNC_concio: "Apertura del Maggior Consiglio"
VNC_concio_desc: "В былые времена Большой совет был залом богатства, власти и, прежде всего, привилегий. С Serrata del Maggior Consiglio, или закрытием Большого совета, он стал закрытым для многих венецианцев. В наших усилиях по либерализации и демократизации Республики мы должны открыть Большой совет."
VNC_venetian_welfare: "Венецианское социальное обеспечение"
VNC_venetian_welfare_desc: "Забота о народе издавна была частью Венецианской республики. С древних времён, когда был учреждён Magistrato alla Sanità для обеспечения здравоохранения. Мы должны работать над возрождением этих институтов и их модернизацией, чтобы новая республика заботилась о людях."
VNC_democratic_republic: "Демократическая республика"
VNC_democratic_republic_desc: "Мы преуспели в Apertura, и теперь Королева Адриатики является маяком демократии в Европе и во всём мире!"
VNC_old_republic: "Старая республика"
VNC_old_republic_desc: "Консерваторы победили на заседании Большого совета и работают над восстановлением старой республики."
VNC_course_of_honors: "Курс почестей"
VNC_course_of_honors_desc: "Старая республика полагалась на систему «курса почестей», где политикам нужно было проводить время в разных советах. Это помогало укреплять государственных мужей и лучше оттачивать их навыки управления."
VNC_state_inquistors: "Государственные инквизиторы"
VNC_state_inquistors_desc: "В былые времена у нас были государственные инквизиторы, которые помогали обеспечивать безопасность республики от внутренних угроз. Действуя рука об руку с Советом десяти, они заботились о том, чтобы Венецианская республика была в безопасности от шпионов и диверсантов."
VNC_new_nobility: "Новое дворянство"
VNC_new_nobility_desc: "Мы должны открыть Большой совет для новых дворян и облагораживать достойных, таких как различные капитаны промышленности и руководители предприятий."
VNC_merchant_princes: "Купцы-принцы"
VNC_merchant_princes_desc: "Деньги, власть и политика были едины в былые времена. В отличие от остальной Европы, где было феодальное дворянство, у нас было торговое дворянство. Наши дворяне были купцами. Мы должны вновь способствовать развитию этого духа предпринимательства."
VNC_aristocratic_republic: "Аристократическая республика"
VNC_aristocratic_republic_desc: "Мы успешно восстановили Венецианскую республику. Теперь правительство напоминает консервативную республику старых времён."

### Foreign Policy Focuses ###
VNC_foreign: "Внешняя политика"
VNC_foreign_desc: "Когда Совет завершил свою работу и наше будущее определено, мы должны обратить взгляд за границу. Есть много возможностей как для расширения Республики, так и для вмешательства в более широкие европейские конфликты."
VNC_stato_da_mar: "Stato da Mar"
VNC_stato_da_mar_desc: "Во времена Старой республики всё восточное Средиземноморье находилось под нашим господством. Побережья Адриатики были домом для наших портов и верфей; это было наше Stato da Mar. Однако сейчас это уже не так, поэтому Большой совет одобрил план разработки политики, как вернуть некоторые территории, которые когда-то принадлежали нам."
VNC_istria_policy: "Политика в отношении Истрии"
VNC_istria_policy_desc: "Истрия долгое время управлялась старой республикой, и многие там до сих пор говорят на нашем благородном языке. Давайте вернём этот утраченный придаток!"
VNC_dalmatia_policy: "Политика в отношении Далмации"
VNC_dalmatia_policy_desc: "Контроль над Далмацией позволял старой республике процветать. Если мы хотим процветать, мы также должны иметь её. К счастью, многие из наших людей до сих пор живут там, что даёт прекрасную основу для обоснования наших претензий."
VNC_take_a_side: "Выбор стороны"
VNC_take_a_side_desc: "Чтобы обеспечить наше дальнейшее выживание, мы должны найти покровителя."
VNC_entente: "Встать на сторону Антанты"
VNC_entente_desc: "Хотя Антанта была изгнана с Европейского континента. Мы должны снова связать нашу судьбу с их судьбой."
VNC_austria: "Встать на сторону Австрии"
VNC_austria_desc: "Гегемон недолговечной республики, союз с Австрией был бы, естественно, чрезвычайно выгоден."
VNC_germany: "Встать на сторону Германии"
VNC_germany_desc: "Сильнейшая нация в мире, рука об руку с немцами, наша нация, несомненно, останется свободной!"

### Economic Focuses ###
VNC_asseses_the_economy: "Consoli dei Mercanti"
VNC_asseses_the_economy_desc: "Старая республика использовала уникальную судебную систему из опытных купцов для разрешения торговых споров. Хотя сегодня такая система устарела, мы должны обращаться за советом к людям торговли."
VNC_venetian_industry: "Венецианская промышленность"
VNC_venetian_industry_desc: "Венеция была великой благодаря людям промышленности. Пусть она вновь обретёт эту мантию."
VNC_railways: "Венецианские железные дороги"
VNC_railways_desc: "Многим деревням у подножия Альп полностью не хватает железнодорожного сообщения. Мы должны это исправить."
VNC_bounty_of_the_sea: "Дары моря"
VNC_bounty_of_the_sea_desc: "Адриатика богата ресурсами, а наша лагуна идеально подходит для военно-морского производства. Мы должны дальше развивать нашу природную нишу."
VNC_expand_the_arsenal: "Расширить Арсенал"
VNC_expand_the_arsenal_desc: "Старый венецианский Арсенал был гордостью мира. При государственной поддержке его расширения он может стать им снова."
VNC_trade_center: "Центр торговли"
VNC_trade_center_desc: "Мы не должны позволять политическим разногласиям ограничивать, каким нациям мы позволяем на равных торговать на наших землях. Мы будем пожинать плоды беспрепятственной торговли."
VNC_avaiation_industry: "Культурное возрождение"
VNC_avaiation_industry_desc: "Хотя в народной памяти Венеция затмевается великими городами Флоренции и Милана, она была родиной многих выдающихся людей. Подобно тому, как кисть Тинторетто озаряла мир, давайте пробудим в людях зарождающийся вкус к изящным искусствам."
VNC_research_institutes: "Исследовательские академии"
VNC_research_institutes_desc: "Хотя наша система образования довольно современна, мы никогда не будем обладать той же исследовательской мощью, что и крупные державы, без инвестиций. Для этого следует создать специализированные исследовательские академии - университеты, ориентированные на одну узкую тему по указанию государства."
VNC_venetian_radio: "Венецианское радио"
VNC_venetian_radio_desc: "Достижения в радиотехнике привели к её широкому внедрению в армиях по всему миру. Мы должны стремиться к паритету в этой новой области."
VNC_bussiness_schools: "Бизнес-школы"
VNC_bussiness_schools_desc: "Коммерческая хватка нашей нации упадёт по мере того, как будет угасать пыл независимости. Чтобы компенсировать это, следует открыть новую систему профессиональных школ, ориентированных на общую деловую грамотность."
VNC_expand_research_institutes: "Расширить исследовательские академии"
VNC_expand_research_institutes_desc: "Исследовательские академии имели огромный успех. Финансирование следует увеличить, чтобы получить ещё большую выгоду."
VNC_synthetic_research: "Синтетические исследования"
VNC_synthetic_research_desc: "Нашей стране не хватает нефти для самодостаточности. К счастью, технология может дать ответ. Теперь возможно преобразовывать другие соединения углерода в пригодное жидкое топливо. Этой отрасли нужна лишь небольшая государственная поддержка, чтобы встать на ноги."
VNC_economic_miracle: "Экономическое чудо"
VNC_economic_miracle_desc: "Процветание медленно возвращается на эту землю. Скоро вернутся дни, когда великие торговые суда заполнят гавань."

### Naval Policy ###
VNC_zara_policy: "Политика Вила"
VNC_zara_policy_desc: "Мы будем придерживаться рекомендаций Исидоро Вила в развитии флота, сосредоточившись на нарушении торговли, подводных лодках и малых кораблях."
VNC_foravanzo_policy: "Политика Да Дзары"
VNC_foravanzo_policy_desc: "Мы будем придерживаться рекомендаций Альберто Да Дзары в развитии флота, сосредоточившись на крупных кораблях и военно-морской огневой мощи."
VNC_riccardi_policy: "Политика Фиораванцо"
VNC_riccardi_policy_desc: "Мы будем придерживаться рекомендаций Джузеппе Фиораванцо в развитии флота, сосредоточившись на вспомогательных судах и морской авиации."
VNC_modernize_the_navy: "Модернизация флота"
VNC_modernize_the_navy_desc: "Когда направление выбрано, мы должны работать над развитием нашей доктрины и заполнением рядов адмиралтейства."
VNC_expand_dockyards: "Расширение верфей"
VNC_expand_dockyards_desc: "Рядом с великим арсеналом следует построить новую верфь, принадлежащую государству и зарезервированную для военного кораблестроения."
VNC_defend_the_coast: "Защита побережья"
VNC_defend_the_coast_desc: "Наш флот не сможет вечно сдерживать решительные силы, берега должны быть защищены на случай вторжения."
VNC_continue_with_reforms: "Продолжение реформ"
VNC_continue_with_reforms_desc: "Наш флот всё ещё отстаёт от своих соперников. Необходимы дальнейшие доктринальные улучшения."
VNC_submarines: "Подводные лодки"
VNC_submarines_desc: "Подводные лодки, также называемые U-Boats, были решающими для победы Германии в Мировой войне. Очевидно, что любая современная армия должна иметь их."
VNC_destroyers: "Эсминцы"
VNC_destroyers_desc: "Мы также должны защищаться от вражеских подводных лодок. Разработка новых эсминцев - наиболее эффективный способ достичь этого."
VNC_heavy_cruisers: "Броненосные крейсеры"
VNC_heavy_cruisers_desc: "Необходимы тяжелейшие крейсеры с наибольшими размерами для поддержки наших флотов и выполнения различных нестандартных ролей."
VNC_battle_cruisers: "Линкоры"
VNC_battle_cruisers_desc: "Хотя у нас нет возможности производить дредноуты в большом масштабе, линкоров более чем достаточно, чтобы отразить любого врага."
VNC_carriers: "Авианосцы"
VNC_carriers_desc: "Превосходство авианосцев над другими крупными кораблями неоспоримо. Разрабатывая авианосцы как гордость нашего нового флота, мы обезопасим наши флоты на будущее."
VNC_naval_aircraft: "Корабельная авиация"
VNC_naval_aircraft_desc: "В настоящее время с авианосцев могут действовать только небольшие легковооружённые самолёты. Благодаря совместным исследованиям для решения этой проблемы наши авианосцы смогут сражаться более эффективно, чем когда-либо."
VNC_life_at_sea: "Жизнь в море"
VNC_life_at_sea_desc: "Венецианцы от природы приспособлены к жизни в море, наш торговый флот должен быть таким же крепким."
VNC_venetian_marines: "Fanti da Mar"
VNC_venetian_marines_desc: "Fanti da Mar были, пожалуй, первыми специализированными десантно-штурмовыми силами. Давайте создадим новый современный корпус морской пехоты."
VNC_thalassocracy: "Провозгласить талассократию"
VNC_thalassocracy_desc: "Венецианская власть всегда проецировалась через море. Хотя времена изменились, место нашей нации - нет. Старая талассократия возрождается с завершением наших военно-морских реформ."

### Air Force Focuses ###
VNC_army_air_upgrade: "Модернизация армейской авиации"
VNC_army_air_upgrade_desc: "Необходимы новые самолёты как для армейской, так и для морской авиации. Теперь мы должны сосредоточиться на приобретении машин для армии."
VNC_navy_air_upgrade: "Модернизация морской авиации"
VNC_navy_air_upgrade_desc: "Необходимы новые самолёты как для армейской, так и для морской авиации. Теперь мы должны сосредоточиться на приобретении машин для флота."
VNC_aeronautica_militare: "Aeronautica Militare"
VNC_aeronautica_militare_desc: "Новый авиационный корпус должен сосредоточиться на качестве, а не на количестве, и иметь свободу действий без явного разрешения армии или флота."
VNC_venetian_air_companies: "Авиационная промышленность Венето"
VNC_venetian_air_companies_desc: "Наш регион производил непропорционально большое количество самолётов для старой Италии. При достаточном финансировании мы можем использовать этот опыт для наращивания производства."
VNC_offensive_priorty: "Наступательный приоритет"
VNC_offensive_priorty_desc: "Наша маленькая нация должна наносить удары быстро и решительно, чтобы оставаться на плаву. Военно-воздушные силы должны уметь эффективно действовать вдали от дома и без связи."
VNC_paratroopers: "Стратегические бомбардировщики"
VNC_paratroopers_desc: "Мы должны иметь современные стратегические бомбардировщики, способные уничтожить промышленную базу противника."
VNC_defned_la_serenissim: "Защита Светлейшей"
VNC_defned_la_serenissim_desc: "Бомбардировщики угрожают разрушить наши дома и промышленность без реального боя. Наши истребители, в свою очередь, должны иметь возможность перехватывать даже самые современные иностранные разработки."
VNC_fighters: "Поддержка войск"
VNC_fighters_desc: "Хотя некоторые хотели бы забыть о важности непосредственной авиационной поддержки в погоне за более независимыми командными структурами ВВС, мы не можем позволить себе отвергать реальность. Наши самолёты не должны работать в одиночку, но всегда в тандеме с людьми на земле."
VNC_jets: "Венецианские реактивные самолёты"
VNC_jets_desc: "Достижения в области двигателестроения катализировали трансформацию военной роли самолётов по всему миру. В условиях таких разработок мы не можем полагаться исключительно на поршневые самолёты."
VNC_build_air_ports: "Строительство аэропортов"
VNC_build_air_ports_desc: "Интегрируя существующую воздушную инфраструктуру с будущими разработками в авиационной промышленности, производство станет существенно более эффективным, а в городах освободится место."

### Venetian Army ###
VNC_venetian_army: "Венецианская армия"
VNC_venetian_army_desc: "Полагаясь на флот, наша страна снова была бы поглощена более сильными державами. Армия должна быть приведена в современное состояние."
VNC_superior_fire_power: "Превосходящая огневая мощь"
VNC_superior_fire_power_desc: "У нас никогда не будет достаточно живой силы для ведения затяжного конфликта с великими державами мира, однако промышленность нашей страны может стать ключевым звеном нашей национальной обороны. Производя большое количество тяжёлого вооружения, эффективно используемого в полевых условиях, наши солдаты могут наносить врагу потери, непропорционально большие по сравнению с их собственной численностью."
VNC_modernize_the_guns: "Модернизация стрелкового оружия"
VNC_modernize_the_guns_desc: "С современным стрелковым оружием наши солдаты превзойдут своих врагов."
VNC_artilery_effort: "Артиллерийские усилия"
VNC_artilery_effort_desc: "Артиллерия была ключом к победе Германии в Великой войне. Мы должны иметь самые крупные орудия с самым большим радиусом действия."
VNC_grand_battle_plan: "Грандиозный боевой план"
VNC_grand_battle_plan_desc: "Благодаря тщательному планированию и эффективным командным структурам армия будет сражаться как чёрт."
VNC_flexiable_planning: "Быстрота и организованность"
VNC_flexiable_planning_desc: "Пехота должна быть как моторизованной, так и достаточно защищённой. Наши планы должны не только быстро реализовываться, но и оставаться неизменными после контакта с противником."
VNC_support_brigades: "Бригады поддержки"
VNC_support_brigades_desc: "Нестандартное вспомогательное оборудование позволяет дивизиям сражаться более эффективно. Мы должны исследовать более совершенные его производные."
VNC_infantry_tanks: "Общевойсковые соединения"
VNC_infantry_tanks_desc: "С новейшим оборудованием на суше, в воздухе и на море, работающим в тандеме, Лев Святого Марка поистине зарычит снова."
VNC_commander_initative: "Инициатива командира"
VNC_commander_initative_desc: "Командиры подразделений дивизионного уровня должны иметь повышенную автономию для интерпретации планов и их реализации по своему усмотрению."
VNC_planning_schools: "Школы планирования"
VNC_planning_schools_desc: "Составление карт и линий сражений само по себе является наукой. Соответственно, следует создать специализированные академии."

### Events ###
venice.1.t: "Первая сессия Большого совета"
venice.1.d: "Впервые за сотню лет Большой совет Венеции собирается вновь. Члены совета со всей республики собираются в Венеции, чтобы обсудить, как должна быть устроена Венецианская республика. Уже сформировались два лагеря: те, кто хочет видеть Венецию современной республикой, и те, кто хочет восстановить Старую республику."
venice.1.a: "Да начнётся."

venice.2.t: "Выборы и срок полномочий дожа"
venice.2.d: "Первый вопрос, который возникает, - это избрание дожа. В старой республике дож избирался пожизненно Большим советом. Случайным жребием выбирались тридцать членов, которые затем случайным жребием сокращались до девяти. Эти девять назначали сорок членов, которых должно было утвердить семь из девяти. Сорок случайным жребием сокращались до двенадцати, которые назначали двадцать пять членов. Эти двадцать пять должны были быть утверждены девятью из двенадцати. Девять назначали сорок пять, и каждый член должен был быть утверждён семью из девяти. Затем сорок пять членов случайным жребием сокращались до одиннадцати. Эти одиннадцать назначали сорок пять, которых должны были утвердить девять из одиннадцати. Наконец, эти сорок пять случайным жребием сокращались до двадцати пяти, и именно они выбирали дожа, который оставался в должности пожизненно.\n\nЕстественно, старая система считается довольно архаичной. Те, кто в Большом совете стремится модернизировать республику, предлагают вместо этого избирать дожа прямым голосованием народа, с четырёхлетним сроком полномочий и правом переизбрания."
venice.2.a: "Прямое избрание и ограничение срока."
venice.2.b: "Старый метод и пожизненно."

venice.5.t: "Установлена Новая республика"
venice.5.d: "После многих дней голосования и дебатов Большой совет принял решение утвердить себя как новую модернизированную и либеральную республику. Это знаменует новую главу в истории Венеции."
venice.5.a: "Fon sù i fondaminti de un nóvo doman."

venice.6.t: "Старая республика восстановлена"
venice.6.d: "После многих дней голосования и дебатов Большой совет принял решение восстановить себя как старую, консервативную республику. Это знаменует новую главу в истории Венеции."
venice.6.a: "Fon sù i fondaminti de un nóvo doman."

