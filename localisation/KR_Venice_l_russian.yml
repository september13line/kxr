venice.1.a: "Да начнётся."

venice.2.t: "Выборы и срок полномочий дожа"
venice.2.d: "Первый вопрос, который возникает, - это избрание дожа. В старой республике дож избирался пожизненно Большим советом. Случайным жребием выбирались тридцать членов, которые затем случайным жребием сокращались до девяти. Эти девять назначали сорок членов, которых должно было утвердить семь из девяти. Сорок случайным жребием сокращались до двенадцати, которые назначали двадцать пять членов. Эти двадцать пять должны были быть утверждены девятью из двенадцати. Девять назначали сорок пять, и каждый член должен был быть утверждён семью из девяти. Затем сорок пять членов случайным жребием сокращались до одиннадцати. Эти одиннадцать назначали сорок пять, которых должны были утвердить девять из одиннадцати. Наконец, эти сорок пять случайным жребием сокращались до двадцати пяти, и именно они выбирали дожа, который оставался в должности пожизненно.\n\nЕстественно, старая система считается довольно архаичной. Те, кто в Большом совете стремится модернизировать республику, предлагают вместо этого избирать дожа прямым голосованием народа, с четырёхлетним сроком полномочий и правом переизбрания."
venice.2.a: "Прямое избрание и ограничение срока."
venice.2.b: "Старый метод и пожизненно."

venice.5.t: "Установлена Новая республика"
venice.5.d: "После многих дней голосования и дебатов Большой совет принял решение утвердить себя как новую модернизированную и либеральную республику. Это знаменует новую главу в истории Венеции."
venice.5.a: "Fon sù i fondaminti de un nóvo doman."

venice.6.t: "Старая республика восстановлена"
venice.6.d: "После многих дней голосования и дебатов Большой совет принял решение восстановить себя как старую, консервативную республику. Это знаменует новую главу в истории Венеции."
venice.6.a: "Fon sù i fondaminti de un nóvo doman."

venice.18.t: "Мы проигрываем Венеции"
venice.18.d: "Невероятно, но мы уступаем позиции венецианцам. Либо мы дадим им то, что они хотят сейчас, и надеемся, что они остановятся на этом, либо мы можем потерпеть довольно унизительное поражение от их рук, в котором потеряем всё."
venice.18.a: "Завершить эту войну сейчас."
venice.18.b: "Нет, ещё слишком рано."

venice.19.t: "[From.GetNameDefCap] просит мира"
venice.19.d: "Наша война против [From.GetNameDef] прошла успешно... настолько успешно, что они готовы отдать нам Истрию и все наши другие претензии, если мы просто закончим войну здесь. Что нам делать?"
venice.19.a: "Давайте закончим это."
venice.19.b: "Зачем останавливаться? Мы заберём всё!"

venice.32.t: "Возобновление обручения с морем"
venice.32.d: "Начиная с 1000 года н.э. на Вознесение проводились Феста де ла Сенса и Обручение с морем. Однако после того, как Наполеон уничтожил республику в 1798 году, празднование фестиваля прекратилось. Но сегодня республика восстановлена, и сегодня мы можем снова отпраздновать Обручение Венецианской республики с морем."
venice.32.a: "Мы обручаемся с тобой, море, как знак истинного и вечного господства."

venice.33.t: "[GetYear] Sposalizio del Mare"
venice.33.d: "Сегодня мы снова празднуем обручение с морем. Многочисленные украшенные корабли покинули гавань Венеции, перевозя сановников как из Республики, так и приглашённых гостей. После многочисленных речей дож [Root.GetLeader] бросает кольцо в лагуну, символизируя обручение Венеции с морем. Позднее ночью над Венецией и другими городами, не только над самой Венецией, взрываются фейерверки, отмечая национальный праздник Венеции."
venice.33.a: "Мы обручаемся с тобой, море, как знак истинного и вечного господства."

venice.34.t: "Возрождение Венецианского карнавала"
venice.34.d: "Во времена Венецианской республики карнавал был популярным фестивалем, который отмечал окончание Великого поста и начало Пепельной среды. Даже после упразднения республики в 1798 году фестиваль всегда был популярен, и частные празднества продолжали проводиться. Однако теперь, когда республика восстановлена, мы можем снова начать праздновать карнавал."
venice.34.a: "Да здравствует Венеция!"

venice.35.t: "Венецианский карнавал"
venice.35.d: "Сегодня города Республики наполняются людьми, пришедшими отпраздновать Венецианский карнавал. Город Венеция и многие города Венецианской республики наполнены людьми в ярких костюмах и замысловатых масках, а в конце дня фейерверки знаменуют окончание карнавала."
venice.35.a: "Да здравствует Венеция!"

venice.36.t: "Ponte della Libertà"
venice.36.d: "Сегодня открывается Ponte della Libertà, или Мост Свободы. Ponte della Libertà соединяет город Венецию с материком. Поскольку республика снова основана, а город Венеция снова является сердцем Республики, мост был создан в честь свободы, которую олицетворяет республика."
venice.36.a: "Defendemo la pace e la liberta!"

venice.37.t: "Военно-морская школа Себастьяно Веньера"
venice.37.d: "Сегодня в Венеции открылась новая военно-морская академия - Военно-морская школа Себастьяно Веньера, которая поможет подготовить новое поколение венецианских адмиралов. Названная в честь знаменитого венецианского адмирала Себастьяно Веньера, выигравшего битву при Лепанто. Военно-морская школа Себастьяно Веньера также помогает прививать любовь к морю с помощью многочисленных связанных с ним мероприятий - от парусного спорта до плавания. Многие из учителей и преподавателей либо являются членами венецианского флота, либо когда-то служили в Венецианском флоте."
venice.37.a: "Новое поколение венецианских моряков."

venice.50.t: "Выборы [GetYear] года в [Root.GetAdjective]"
venice.50.d: "Месяцы, предшествовавшие выборам нового дожа и его партии в этом году в [Root.GetNameDef], были такими же поляризующими и напряжёнными, как и всегда. Когда люди потоком идут к избирательным урнам, победителем оказывается..."
venice.50.a: "...Partito Repubblicano Italiano."
venice.50.b: "...Unione Liberale di Veneto."
venice.50.c: "...Partito Popolare Italiano."
venice.50.e: "...Gruppi di Difesa della Donna."
venice.50.f: "...Venetia Libera."

venice.51.t: "Избрание дожа"
venice.51.d.revolt: "Византийский процесс избрания нового пожизненного дожа занял недели, но теперь осталось два кандидата: Джузеппе Вольпи, герой восстания, и Джироламо Марчелло. Вольпи, возможно, был бы явным победителем благодаря своей роли в обретении Венецией независимости, но многие консерваторы считают, что его происхождение промышленника не подобает истинному дожу. Марчелло гораздо более предпочтителен из-за его места среди патрицианских семей, допущенных в Большой совет. Тем не менее, голосование будет близким."
venice.51.d.norevolt: "Византийский процесс избрания нового пожизненного дожа занял недели, но теперь осталось два кандидата: промышленник Джузеппе Вольпи и патриций Джироламо Марчелло. Учитывая, что Вольпи происходит не из старинной патрицианской семьи, как Марчелло, а был сделан аристократом савойскими королями после объединения, многие в Республике насмехаются над его кандидатурой. Тем не менее, связи Вольпи среди новой элиты и капиталистов значительны, и есть шанс, что он всё же может победить."
venice.51.a: "Джузеппе Вольпи - наш новый дож!"
venice.51.b: "Джироламо Марчелло - наш новый дож!"