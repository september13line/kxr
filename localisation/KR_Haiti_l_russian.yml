HAI_garde_influence_desc: "Гвардия Гаити является единственным официальным военным аппаратом, доступным нашему государству. Созданные под американским руководством и на американском оборудовании, неудивительно, кому они действительно служат. Белые и смешанные офицеры командуют отрядами местных солдат, поскольку они терроризируют и дискриминируют коренной гаитянский народ. Созданная в результате неудачной попытки создать аполитичные вооруженные силы для нашей страны, Гвардия часто пробивается в национальную политику с помощью лоббирования или коррупции. В своем нынешнем состоянии гвардия Хайти всегда будет служить только своим благодетелям, оставляя наше правительство без надежных вооружённых сил."
