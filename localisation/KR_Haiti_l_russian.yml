### Ideas ###
HAI_education_deficit: "Дефицит образования"
HAI_education_deficit_desc: "Острая нехватка образования является одной из, если не самой большой, проблем, с которыми сегодня сталкивается Гаити. Наш недостаток образования сказывается не только на высшем образовании или начальной школе; он так сильно повлиял на все аспекты совокупного интеллекта нашей нации, что даже наши фермеры выращивают свои культуры неэффективными или устаревшими способами. Этот крайний дефицит образования должен быть устранен, поскольку Гаити не сможет выжить, если её население останется одним из наименее образованных людей в мире. Независимо от нашего направления, образование является главным приоритетом."
