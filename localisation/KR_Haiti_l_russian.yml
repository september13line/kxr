#### Focus Tree ###
HAI_begin_education_reform: "Начать реформу образования"
HAI_begin_education_reform_desc: "Наша система образования терпит неудачу почти на каждом шагу. Наши фермеры даже не знают, как правильно сеять и собирать урожай, несмотря на нашу в основном аграрную экономику, а сельскохозяйственные школы, финансируемые десятилетия назад, не смогли по всем критериям обучить наше население основам ухода за растениями. Это должно быть изменено. Единственными хорошими школами на Гаити больше не будут университеты, финансируемые и заполняемые иностранцами."

HAI_approach_the_commission: "Обратиться в Комиссию"
HAI_approach_the_commission_desc: "Комиссия является последним крупным следом американской оккупации, в результате чего многие объекты или расследования остались открытыми и неиспользованными после ухода янки. Мы должны собраться, чтобы обсудить, как нам следует поступить с этими остатками наших деспотичных благодетелей."

HAI_new_normal: "Новая норма"
HAI_new_normal_desc: "Благодаря нашим новейшим реформам и политике, приносящим нам большие дивиденды как в финансовом, так и в общественном плане, появилось новое ощущение нормальности. Хотя это может быть просто затишье перед бурей, все наслаждаются этим безмятежным моментом нормальной жизни."

HAI_reorganize_rural_schools: "Реорганизация сельских школ"
HAI_reorganize_rural_schools_desc: "Чтобы лучше обучать неграмотные и необразованные массы, живущие в сельской нищете, мы должны реорганизовать систему сельских школ. Должна быть введена общая учебная программа и увеличено финансирование, а новые учителя, действительно знающие темы, которые они преподают, будут иметь первостепенное значение для успеха этих новых школ.."

HAI_reform_snpaer: "Реформа SNPAER"
HAI_reform_snpaer_desc: "SNPAER это система сельскохозяйственных программ и школ, которые были предназначены для поддержки и обучения наших фермеров правильному использованию земли и методам ведения сельского хозяйства. Однако они в значительной степени оказались бесполезными, как из-за недостаточного финансирования, так и из-за нехватки персонала, и для дальнейшей модернизации нашей сельскохозяйственной отрасли необходимы радикальные реформы.."

HAI_vocational_academies: "Профессиональные академии"
HAI_vocational_academies_desc: "Профессиональные академии могут служить полезным дополнением к обычной системе школьного образования, обучая полезным навыкам тех, кто не преуспевает в интеллектуальном обучении. Мы должны внедрить официальную государственную систему профессиональных училищ, чтобы дать среднестатистическому гаитянину шанс на солидную карьеру и продуктивную жизнь."

HAI_integrate_jesuits: "Интегрировать иезуитов"
HAI_integrate_jesuits_desc: "Орден Иисуса, или иезуиты, управляет многими школами по всей нашей стране, обучая христианским ценностям и основам образования. Мы должны обратиться к этому святому ордену и интегрировать их школы в нашу образовательную систему. Хотя нам, возможно, придется немного секуляризировать их учебную программу, их помощь будет неизмеримой в нашей борьбе с неграмотностью и необразованностью."

HAI_open_universities: "Открытые университеты"
HAI_open_universities_desc: "Нам нужно будет как открывать новые университеты, так и расширять прием в уже существующие, чтобы обеспечить доступ к высшему образованию для всех гаитян. В настоящее время наши несколько университетов обслуживают только иностранцев или представителей белой и смешанной расовой элиты. Эта система образовательных привилегий должна прекратиться, если Гаити хочет процветать."

HAI_expand_lycees: "Расширять лицеи"
HAI_expand_lycees_desc: "Лицеи - это система среднего образования на французском языке, доступная, как правило, только для более состоятельных гаитян. Мы должны расширить это образовательное крыло, чтобы и дальше предоставлять образование обедневшей и невежественной гаитянской молодежи."

HAI_4c_organizations: "Организации 4C"
HAI_4c_organizations_desc: "Основываясь на американских организациях 4-H, клубы 4C должны повторять своих коллег из янки. Выступая за "кер, серво, корпус и совесть", эти клубы будут направлять гаитянскую молодёжь по пути организации и усердия, обучая их необходимым профессиям и задачам, которые могут им понадобиться на более распространенных карьерных путях Гаити."

HAI_adult_education: "Образование для взрослых"
HAI_adult_education_desc: "Мы должны сосредоточиться не только на образовании наших детей, поскольку большая часть нашего взрослого населения по-прежнему остаётся прискорбно необразованной и невежественной по отношению к более широкому миру, которое может открыть даже базовое образование. Должны быть созданы новые вечерние школы для взрослых, чтобы обучать наших более занятых граждан, в то время как дневные курсы должны быть расширены и созданы для обучения остальных, пока они не смогут стать более продуктивными членами общества."

HAI_status_of_the_legislature: "Статус законодательного органа"
HAI_status_of_the_legislature_desc: "С окончанием американской оккупации режим Борно больше не может править с отстраненным законодательным органом без какого-либо официального заявления. Мы должны подойти к этой непростой ситуации и окончательно решить будущее законодательного органа Гаити и его место в нашем режиме."

HAI_reform_council: "Реформировать Совет"
HAI_reform_council_desc: "Совет Гаити является нижней палатой нашего двухпалатного законодательного органа. Мы должны реформировать этот голос народа, чтобы он действительно действовал в соответствии с волей гаитянского народа, а не по воле иностранных хозяев или местных болонок."

HAI_dismiss_foreigners: "Уволить иностранцев"
HAI_dismiss_foreigners_desc: "Иностранцы - бич на наших берегах, они властвуют над нашими коренными жителями, не заботясь о том, кого они раздавливают ногами. Мы должны изгнать этих демонов из наших границ, если Гаити когда-либо действительно будет работать на гаитянский народ, а не на иностранные заинтересованные группы."

HAI_mixed_council: "Смешанный Совет"
HAI_mixed_council_desc: "Смешанный Совет имеет первостепенное значение для обеспечения того, чтобы наша недавно наделенная полномочиями нижняя палата действительно представляла волю разнообразного гаитянского народа. Представители смешанной расы, белые и афро-гаитяне должны быть вместе как равные в этом доме, и все идеологии и лагеря могут высказать своё мнение. Вместе мы построим лучшее Гаити."

HAI_reel_in_garde: "Катушка в Гвардии"
HAI_reel_in_garde_desc: "Гвардия Гаити служит нашей единственной реальной военной силой, сформированной на пепелище нашей бывшей жандармерии и армии. Выступая в качестве функциональной марионетки американских и элитарных интересов, им нельзя доверять в беспристрастном служении гаитянскому народу. Мы должны обуздать их, чтобы они не стали слишком могущественной силой, которую невозможно остановить."

HAI_legalize_parties: "Легализовать партии"
HAI_legalize_parties_desc: "Для того чтобы истинная демократия вернулась в нашу разваливающуюся республику, политические партии должны быть выведены из тени и иметь возможность действовать. Вопрос только в том, каким партиям будет разрешено снова функционировать на законных основаниях. Популярность социализма в нашей стране значительно возросла, и красные требуют создания собственной легальной партии, к большому огорчению наших более консервативных министров. Мы должны действовать осторожно, поскольку этот выбор может определять будущее нашей политики на десятилетия вперёд."

HAI_integrate_the_council: "Интегрировать Совет"
HAI_integrate_the_council_desc: "Совет должен быть полностью интегрирован в нашу администрацию ещё раз в качестве полностью функционирующего государственного органа, независимого от вмешательства и влияния со стороны более гнусных субъектов. Теперь Совет должен наконец работать на благо гаитянского народа и только на его благо."

HAI_limit_garde_influence: "Ограничить влияние Гвардии"
HAI_limit_garde_influence_desc: "Гвардия Гаити, помимо своих функций в качестве военизированной и полицейской силы, также предприняла экстремальные усилия по политическому лоббированию для достижения своих целей и целей своих американских благодетелей. Мы должны обуздать это влияние, если хотим сохранить хоть какое-то подобие контроля над их рядами."

HAI_electoral_reform: "Избирательная реформа"
HAI_electoral_reform_desc: "Для того чтобы создать хотя бы видимость подлинной демократии в нашей администрации, необходимо провести масштабные избирательные реформы. Весь избирательный аппарат будет перестроен таким образом, чтобы исключить возможность появления на этом посту очередного тирана."

HAI_establish_oversight_committee: "Создание комитетов по надзору"
HAI_establish_oversight_committee_desc: "Поскольку запланированные выборы становятся все более заметными в сознании каждого, была внедрена система наблюдения за выборами для наблюдения за предстоящими выборами и их кампаниями, просматривая каждую деталь на предмет признаков мошенничества. Мы не позволим коррупции испортить волю народа!"

HAI_preside_the_chamber: "Председательствовать в Палате"
HAI_preside_the_chamber_desc: "Поскольку наши реформы продвигаются гладко, мы должны председательствовать в объединенной палате и диктовать наши планы на будущее. Мы дадим понять, что наш путь лежит к демократии. Гаитянская Республика больше не будет нести на себе печать клептократии и какистократии."

HAI_smash_coalition: "Разгромить коалицию"
HAI_smash_coalition_desc: "Коалиция существует уже несколько десятилетий; союз левых, правых и центристских партий объединился в оппозиции против Борно и американцев. С наступлением демократии коалиция должна быть разрушена, чтобы вновь воцарились политическая независимость и свобода выбора.."

HAI_stable_system: "Стабильная система"
HAI_stable_system_desc: "Мы сделали невозможное и выправили тонущий корабль, которым была гаитянская демократия. Теперь, когда наша мерцающая республика спасена, настало время для нашей нации двигаться вперёд к более справедливому и равноправному будущему. Да здравствует Республика Гаити, ибо теперь мы действительно представляем волю нашего народа."

HAI_dissolve_chamber: "Растворить Палату"
HAI_dissolve_chamber_desc: "Палата выполнила свою задачу. Даже в своем ослабленном состоянии она до сих пор не сделала ничего, чтобы помешать нашему правлению и помешать нашим амбициям. Мы отбросим эту бесполезную реликвию, чтобы создать более сильную гаитянскую нацию."

HAI_enhanced_interrogation: "Усиленный допрос"
HAI_enhanced_interrogation_desc: "У нашего режима много врагов, многие из которых прячутся в крысиных норах, как паразиты, избегая нашего государства на каждом шагу. Мы будем повышать ставки в наших методах допроса, чтобы лучше собирать информацию от наших заключенных. У нас есть способы заставить их говорить..."

HAI_legislative_guidance: "Директивное руководство"
HAI_legislative_guidance_desc: "Мы должны более тщательно направлять законодательный орган, чтобы он следовал нашим прихотям и пожеланиям. Мы не можем позволить этим наглым министрам вмешиваться в нашу миссию, поэтому мы бросим им кость."

HAI_pressure_council: "Оказать давление на Совет"
HAI_pressure_council_desc: "Совет по-прежнему остаётся досадной занозой в боку нашего режима, обвиняя каждое наше действие в том, что оно противоречит широкой воле гаитянского народа. Мы могли бы надавить на этих дураков силой, чтобы напомнить им, кто на самом деле главный."

HAI_delegation: "Делегация"
HAI_delegation_desc: "Чтобы сохранить стабильность в наших рядах, нам придется делегировать некоторые из наших обязанностей другим, чтобы казаться менее тираническими в их глазах. Если мы хотим сохранить стабильность и единство перед лицом наших многочисленных политических врагов, нам нужно сначала успокоить наших собственных последователей."

HAI_loyal_chamber: "Верная Палата"
HAI_loyal_chamber_desc: "Палата должна быть вынуждена подчиниться, если мы хотим чего-то добиться, сохранив хоть какую-то толику законности. Мы скуем их ослабленными полномочиями, одновременно пополнив их ряды как можно большим количеством лоялистов, которых сможем найти. Нашему режиму больше не будет мешать его собственная бюрократия!"

HAI_controlled_opposition: "Контролируемая оппозиция"
HAI_controlled_opposition_desc: "Оппозиция внутри нашей страны ожесточенна, объединившись в одну большую и разнообразную коалицию. Мы должны позволить этой коалиции избрать нового спикера, удовлетворяя их потребность извергать ложь о нашем режиме."

HAI_shadow_ministry: "Теневое министерство"
HAI_shadow_ministry_desc: "Под давлением Гвардии Гаити многие призвали к созданию теневого совета во главе с лидерами Гвардии и лоялистскими министрами, который послужил бы последней линией обороны от проникновения в наши ряды социалистических и нуаристских влияний. Хотя это, вероятно, вызовет гнев многих в стране, такую возможность необходимо обсудить, поскольку проблема радикализма на Гаити только растет."

HAI_eliminate_dissent: "Устранить инакомыслие"
HAI_eliminate_dissent_desc: "Поскольку наше правление становится все более непопулярным среди разгневанных масс Гаити, мы должны остановить волну лжи, которая распространяет эту злобу у её истоков. Диссидентов и скептиков заставят замолчать по всей стране, посадят в тюрьму, опозорят или ещё что похуже для особо упрямых. Мы не потерпим обмана в наших рядах."

HAI_all_together: "Все вместе"
HAI_all_together_desc: "Мы должны действовать как единый организм, как единый союз, если мы хотим функционировать как государство. Все ячейки нашей нации должны работать в унисон, чтобы весь этот карточный домик не рухнул. Единство должно быть сохранено, и ни один гаитянин не должен остаться в стороне. Однако мы можем протянуть эту оливковую ветвь только одной радикальной группе, так кто же это будет?"

HAI_contemporary_arrangement: "Современное устройство"
HAI_contemporary_arrangement_desc: "Мы должны обратиться к радикальным националистам, известным как нуаристы, если мы хотим завоевать какие-либо позиции у их базы. По мере того как их популярность растёт, наша уменьшается. Нам может понадобиться их помощь, если мы хотим чего-то добиться, но они также могут оказаться слишком опасными для работы. Мы должны действовать осторожно."

HAI_unshakeable_system: "Непоколебимая система"
HAI_unshakeable_system_desc: "Мы установили железный контроль над аппаратом управления здесь, на Гаити. Укрепив наше правление и укрепив наши основы, мы будем продолжать вести Гаити к процветанию взвешенной рукой."

HAI_miracle_continues: "Чудо продолжается"
HAI_miracle_continues_desc: "Мы вырвались на свободу из темных тюрем, которые были американской оккупацией, режимом Борно и Чёрным Понедельником, и теперь Гаити ожидает светлое и блестящее экономическое будущее. Процветание и настоящий золотой век для наших финансов и промышленности не за горами, поскольку мы превращаем незначительные успехи, достигнутые при президенте Борно, в настоящее экономическое чудо."

HAI_socialist_economics: "Социалистическая экономика"
HAI_socialist_economics_desc: "Краеугольным камнем нашей новой экономической политики должна стать социалистическая мысль. Опираясь на труды Маркса и Энгельсса, а также Бакунина и Пуже, мы создадим действительно красную экономику для гаитянского пролетариата."

HAI_break_imperialist_stranglehold: "Разорвать империалистическую хватку"
HAI_break_imperialist_stranglehold_desc: "Слишком долго империалистические отбросы из Европы и Америки оскверняли наш райский остров своей отвратительной жадностью. Мы должны разорвать последние оковы, которые связывают нас с этими работорговцами, и по-настоящему освободить гаитянский народ раз и навсегда."

HAI_smash_coffee_barons: "Разбить кофейных баронов"
HAI_smash_coffee_barons_desc: "Большая часть нашей кофейной промышленности управляется иностранными мастерами или мастерами смешанной расы, в то время как бедные афро-гаитяне трудятся на полях даром, повторяя чувства давно минувших времен. Мы должны захватить средства производства кофе и изгнать этих паразитов."

HAI_wrest_sugar_control: "Вырвать контроль над сахаром"
HAI_wrest_sugar_control_desc: "Наша сахарная промышленность контролируется деспотичным правящим классом с тех пор, как столетия назад на Гаити была открыта первая сахарная плантация. Хотя французы ушли, их наследие иностранной собственности на наше производство и переработку сахарного тростника не ушло вместе с ними. Многие иностранные бизнесмены или представители белой и смешанной расовой элиты получают всю прибыль, и с этим неравенством нужно бороться."

HAI_upend_hapag: "Перевернуть АПАГ"
HAI_upend_hapag_desc: "АПАГ выступает в качестве главного судоходного гиганта в наших водах. Мы должны бороться с этими титанами промышленности, если хотим вырвать контроль над нашими торговыми интересами на море. Мы больше не позволим этим немцам диктовать гаитянские правила судоходства!"

HAI_revolutionary_infrastructure: "Революционная инфраструктура"
HAI_revolutionary_infrastructure_desc: "Гаити нуждается в современных железнодорожных и автомобильных системах, если мы хотим когда-либо полностью объединить нашу нацию. Простота передвижения и доступа способствует единству и экономическому росту, а также позволяет нашим войскам передислоцироваться гораздо эффективнее. Заставьте наших праздных работников прокладывать новые пути для граждан Гаити!"

HAI_light_of_socialism: "Свет социализма"
HAI_light_of_socialism_desc: "Красная звезда взошла над Порт-о-Пренсом, озаряя Гаити красным светом социализма. Эта новая путеводная звезда открыла новый золотой, или багровый, век для гаитянского народа, и мы с нетерпением ожидаем светлого будущего."

HAI_restore_frontier: "Восстановить границу"
HAI_restore_frontier_desc: "Большая часть нашей границы, особенно в направлении границы с Доминиканцами, была опустошена безудержной неэффективной сельскохозяйственной практикой и чрезмерной зависимостью от выращивания древесного угля. Мы должны немедленно прекратить эти программы, разработать более эффективные стратегии ведения сельского хозяйства и заново заселить границу, чтобы восстановить девственные леса, чтобы дикая природа Гаити снова могла дышать свободно."

HAI_petroleum_substitution: "Замена нефти"
HAI_petroleum_substitution_desc: "Мы должны следовать примеру синдикалистских режимов во Франции и Англии и искать альтернативные источники топлива. Мы уже используем древесный уголь для освещёния наших домов и предприятий, но древесный уголь не может питать танки и самолеты. Наши учёные исследуют синтетические пути, в то время как наши экономисты ищут выгодные торговые сделки по нефти и природному газу."

HAI_favor_urban_syndicates: "Польза городских Синдикатов"
HAI_favor_urban_syndicates_desc: "Синдикализм лучше всего развивается в индустриальной и городской среде. Мы должны угодить этим группам, чтобы способствовать истинному социалистическому Просвещению всех гаитян. Хотя мы никогда не должны забывать о наших аграрных корнях, путь в современность лежит через промышленность."

HAI_labor_rehabilitation: "Трудовая реабилитация"
HAI_labor_rehabilitation_desc: "Большая часть нашей рабочей силы всё ещё порабощена, промыта мозгами и обманута капиталистической грязью. Умы всех и каждого работника должны быть очищены и сделаны так, чтобы они свидетельствовали о свете социализма. Новый класс гаитянского пролетариата должен подняться."

HAI_domestic_processing: "Внутренняя переработка"
HAI_domestic_processing_desc: "Гаити понадобятся собственные перерабатывающие предприятия, чтобы использовать сырьевые ресурсы, если мы хотим когда-нибудь избавиться от нашей иностранной зависимости. Нам нужно производить гаитянские товары из гаитянских материалов, обработанных и добытых на Гаити, когда и где это возможно."

HAI_cultural_industry: "Гаитянская культурная индустрия"
HAI_cultural_industry_desc: "Независимо от того, как далеко мы продвинулись, мы никогда не должны забывать о своих корнях. Мы сыны Африки и креольской крови, мы гаитяне все до единого. Это заложено в каждой клеточке нашего существа и должно быть заложено в каждой клеточке нашей промышленности и экономики. Мы никогда не должны упускать из виду, кто мы есть на самом деле."

HAI_socialist_miracle: "Социалистическое чудо"
HAI_socialist_miracle_desc: "Мы произвели революцию в экономике Гаити, превратив её в такую, которая действительно приносит пользу гаитянским рабочим прежде всего. Наши беднейшие слои населения сейчас живут счастливой и процветающей жизнью, а наша экономика процветает больше, чем когда-либо прежде. Будем надеяться, что это чудо продолжится, когда мы вступим в этот новый багровый век Гаити."

HAI_focus_on_commerce: "Фокус на коммерции"
HAI_focus_on_commerce_desc: "Капитализм хорошо относился к Гаити, несмотря на её иностранное происхождение. Теперь, когда наша экономика и финансы находятся в наших собственных руках, а не в руках иностранных собак, мы можем создать действительно справедливый и свободный капиталистический рай на нашем родном острове. На этот раз капиталистическая жадность и амбиции пойдут нам на пользу для разнообразия."

HAI_millionaires_row: "Миллионерский ряд"
HAI_millionaires_row_desc: "Расположенный в самом сердце Порт-о-Пренса, Миллионерский ряд является очагом американской активности. Заполненный роскошными домами, битком набитыми мулатами, белой элитой и иностранцами. Мы должны смотреть на эту группу как на потенциальную сокровищницу инвестиционных возможностей и возможностей для получения прибыли."

HAI_support_private_banks: "Поддержка частных банков"
HAI_support_private_banks_desc: "Частная банковская система облегчила бы нагрузку на наш национальный банк и позволила бы частному капиталу поступать в нашу экономику; капитал, в котором мы отчаянно нуждаемся. Должна быть внедрена система частных банков и расширены иностранные банки для дальнейшего открытия нашей экономики."

HAI_haitian_hasco: "Гаитянское HASCO"
HAI_haitian_hasco_desc: "Мы должны стереть черную метку американского влияния с нашей крупнейшей сахарной компании HASCO, если мы когда-нибудь хотим видеть эти прибыли в руках нашего народа, а не янки. Настало время фермерам и торговцам Гаити управлять как полями, так и рыночными прилавками, когда речь идет о гаитянском сахаре, а не о каких-то иностранных паразитах."

HAI_redevelop_cities: "Перестраивать города"
HAI_redevelop_cities_desc: "Несколько городов, разбросанных по Гаити, выглядят тусклыми и нищими по сравнению со стандартами любой современной и развитой страны. Мы должны восстановить эти города и расширить их, думая о будущем. Необходимо построить новые дороги и канализацию, а также инфраструктуру для потребления электроэнергии в гораздо больших масштабах. Мы должны превратить эти полуразрушенные и жалкие трущобы вчерашнего дня в сияющие города завтрашнего дня!"

HAI_approach_german_community: "Обратиться к немецкому сообществу"
HAI_approach_german_community_desc: "В нашей стране всегда было значительное немецкое меньшинство, которое только увеличилось в размерах благодаря их победе в Вельткриге. Многие находят здесь работу в качестве сельскохозяйственных землевладельцев или в судоходном конгломерате АПАГ, что делает большинство из них довольно богатыми. Мы могли бы обратиться к ним и попытаться установить более тесные связи для получения потенциальной экономической выгоды, учитывая их прибыльные связи."

HAI_kaffeemark: "«Каффемарк»"
HAI_kaffeemark_desc: "В связи с большим количеством немецких иммигрантов, открывающих магазины на наших землях, некоторые члены нашего кабинета призвали к созданию Kaffemark, своего рода специальной валюты, которую могут использовать только говорящие по-немецки в определенных немецкоязычных зонах, которая была бы привязана к немецкой марке. Эта странная система, как они надеются, будет стимулировать приток большего количества немецкого бизнеса в этот регион, стимулируя нашу экономику."

HAI_utilities_investment: "Инвестиции в коммунальные услуги"
HAI_utilities_investment_desc: "Коммунальные услуги являются обязательными для современного и успешного государства. Электричество, канализация, телекоммуникации и многое другое должны быть предоставлены гаитянскому народу, чтобы вытащить его из темных веков."

HAI_negotiate_with_hapag: "Переговоры с АПАГ"
HAI_negotiate_with_hapag_desc: "АПАГ - слишком большой зверь, чтобы сражаться с ним напрямую, поэтому мы должны играть по их правилам. Мы встретимся с их представителями, чтобы выработать сделку в интересах обеих наших сторон. Гаити получит часть прибыльной сети верфей и торговых путей АПАГ."

HAI_assert_financial_independence: "Отстаивать финансовую независимость"
HAI_assert_financial_independence_desc: "Нити финансовой зависимости, которые связывают нас с иностранными благотворителями, препятствуют нашему внутреннему развитию. Мы должны освободиться и встать на путь экономической независимости. Рынки Гаити не должны подчиняться прихотям иностранных хозяев."

HAI_refinance_debt: "Рефинансирование долга"
HAI_refinance_debt_desc: "Гаити уже давно страдает из-за своего знаменитого или, скорее, печально известного долга. Колоссальный и разрушительный, он начался с французов и теперь находится в значительной степени в руках янки. Мы должны обратиться к ним и договориться о более легких условиях, чтобы избавиться от этого давнего позора."

HAI_restructure_bnrh: "Реструктуризация BNRH"
HAI_restructure_bnrh_desc: "BNRH является национальным банком и сердцем нашего банковского аппарата. Тем не менее, он перегружен как единственная федеральная резервная система. Чтобы решить эту проблему, банк будет расширен, и ему будут предоставлены дополнительные средства, отвлеченные от новых источников прибыли, чтобы способствовать притоку частного капитала в руки наших граждан."

HAI_eliminate_disloyal_appointees: "Устранить нелояльных назначенцев"
HAI_eliminate_disloyal_appointees_desc: "До нашего сведения дошло, что большая часть нашей бюрократии, министров и государственных служащих администрации не согласны с нашими будущими целями. Эти беспокойные назначенцы должны быть уничтожены, если мы хотим добиться успеха в достижении наших целей. Телефоны будут прослушиваться, подозреваемых диссидентов уволят, а более неприятные препятствия будут тихо устранены или устранены. У нас будет порядок и единство."

HAI_economic_unity: "Экономическое единство"
HAI_economic_unity_desc: "Наши различные внутренние фракции не должны ссориться из-за того, как лучше продвигать нашу экономику вперёд. Вместо этого необходимо согласовать единую разумную политику и направление ради нашего финансового будущего."

HAI_renewed_infrastructure_effort: "Возобновленные усилия по созданию инфраструктуры"
HAI_renewed_infrastructure_effort_desc: "Дорожная система Гаити - это загляденье, на большей части территории страны есть только грунтовые дороги, если вообще есть дороги. Хотя американцы и десятилетия прогресса добились улучшений, например, в Порт-о-Пренсе, по большей части наша инфраструктурная сеть нуждается во внимании. Будут построены новые дороги и магистрали, которые протянутся поперек и свяжут нашу половину Эспаньолы."

HAI_efficient_civil_conscription: "Эффективная гражданская воинская повинность"
HAI_efficient_civil_conscription_desc: "Наши граждане обязаны выполнять ту работу, которую от них требует их нация. У нас есть официальная система призыва на гражданскую службу, но она крайне неэффективна и в последние годы показала слабые результаты. Мы обновим систему, чтобы обеспечить свежую рабочую силу для государственного кадрового резерва."

HAI_reduce_maritime_congestion: "Уменьшить заторы на море"
HAI_reduce_maritime_congestion_desc: "Такие гиганты, как АПАГ и Crowley Maritime, доминируют на морских путях, в то время как военно-морские силы США и Антанты засоряют наши воды, почти не оставляя нашим судоходным компаниям места для дыхания и роста. Мы должны заключать сделки с этими титанами промышленности, одновременно более тщательно контролируя наши суверенные воды, чтобы обеспечить нашим морякам приоритет в наших водах."

HAI_overhaul_cfc: "Перестроить КЖД"
HAI_overhaul_cfc_desc: "КЖД - это пережиток французской оккупации, но полезный, который сейчас служит сердцем нашей железнодорожной сети. Мы должны модернизировать его оборудование и инфраструктуру, одновременно расширяя его охват, чтобы вся Гаити могла стать свидетелем появления Железного Коня."

HAI_expand_bowen_field: "Расширить Bowen Field"
HAI_expand_bowen_field_desc: "Bowen Field служит маленьким общественным аэропортом, который работает совместно с более крупным военным аэродромом поблизости. Мы должны расширить гражданские ангары, терминалы и взлетно-посадочные полосы, чтобы лучше пропускать как общественный, так и финансовый трафик на Гаити по воздуху."

HAI_dam_artibonite_river: "Плотина на реке Артибонит"
HAI_dam_artibonite_river_desc: "Гидроэлектростанция - это современное чудо, способное чисто питать целые города за счёт силы текущей воды. Мы должны использовать этот потенциал для производства энергии, перекрыв реку Артибонит, самую длинную и мощную реку на нашем идиллическом острове. Помимо экологических последствий, мы надеемся, что это станет благом для нашей страны, помогая нам преодолеть нашу зависимость от угля для производства электроэнергии."

HAI_rapid_electrification: "Быстрая электрификация"
HAI_rapid_electrification_desc: "Большая часть наших граждан по-прежнему живёт в темноте, освещая ночь масляными лампами и свечами без каких-либо современных приборов в поле зрения. Эти условия могут быть подходящими для захолустной выгребной ямы, но не для такой страны, стремящейся к современности, как Гаити. Мы быстро распространим искру электричества по всему штату; в каждом доме будет свет.!"

HAI_anti_charcoal: "Кампания против древесного угля"
HAI_anti_charcoal_desc: "Древесный уголь - это проклятие нашего существования; он достаточно полезен, чтобы мы могли почти полностью полагаться на него, но недостаточно эффективен, чтобы быть почти идеальным. Огромные участки земли должны быть отведены для его выращивания и производства, и это сказалось на Земле. Мы должны провести кампанию по сокращению использования древесного угля и переключить наше население на альтернативные источники топлива."

HAI_fuel_importation: "Импорт топлива"
HAI_fuel_importation_desc: "Поскольку наша зависимость от древесного угля удушает наши потребности в энергии, а наша военная машина становится все более голодной, нефть сейчас нужна больше, чем когда-либо. На нашем острове нет этого вещёства, и поэтому мы должны импортировать его из других стран, чтобы использовать эту чудодейственную жидкость. Пусть Чёрный поток хлынет на Гаити отовсюду!"

HAI_when_our_fathers_broke_their_chains: "Когда наши отцы разорвали свои цепи"
HAI_when_our_fathers_broke_their_chains_desc: "Что может быть прекраснее этого: дети Африки, которые после трехсот лет глубочайшего рабства бросили железо, ярмо и дубинку против враждебных сил и против старых предрассудков! Смотри оттуда, снизу! Это благородное знамя, которое объединяет чернокожих, готовых умереть там, наверху! Но нет! Толпы людей с Ламартиньер спускаются, как пенящийся поток, из Ла-Крет-а-Пьеро."

HAI_embrace_noirist_thought: "Принять идеи нуаризма"
HAI_embrace_noirist_thought_desc: "Нуаризм и его производные или родственные движения глубоко проникают во все аспекты нашего государства, и теперь их влияние почувствует и экономика. Гаитянская экономика должна постепенно перестраиваться в соответствии с идеями нуариста, смещая нас в сторону системы расового популизма для афро-гаитян, истинных наследников и детей Гаити."

HAI_munitions_export_industry: "Индустрия экспорта боеприпасов"
HAI_munitions_export_industry_desc: "Торговля оружием и рэкет являются жизнеспособными источниками дохода, особенно в этом дестабилизирующем глобальном климате. Мы должны включиться в действие и начать играть свою роль в более широком мире международных продаж оружия, поскольку война на горизонте почти на каждом континенте, можно с уверенностью сказать, что спрос определенно будет."

HAI_domestic_repair: "Внутренний ремонт"
HAI_domestic_repair_desc: "Большая часть нашей страны находится практически в руинах, поскольку последствия иностранной оккупации и внутренних раздоров сказались на ней. Мы должны восстановить нашу промышленность, наши районы, наши города и нашу дикую местность, если мы действительно хотим спасти Гаити и её народ от глубин нищеты и отчаяния."

HAI_black_economics: "Чёрная экономика"
HAI_black_economics_desc: "Наша недавно созданная экономика построена на наследии наших украденных предков, доставленных сюда с родного континента. Эта новая система работает на их родственников, наших соотечественников, гарантируя, что ни один афро-гаитянин не останется гнить в канаве отчаяния и нищеты. Экономика Гаити наконец-то работает на тех, кто обеспечивает её больше всего, и люди радуются своей вновь обретенной финансовой независимости."

HAI_time_of_troubles: "Смутное время"
HAI_time_of_troubles_desc: "Гаити находится на перепутье; на протяжении десятилетий она страдает от политических раздоров и экономических потрясений. Теперь гаитянский народ заглядывает через край в бездну хаоса и краха, и необходимо выбрать и укрепить путь, чтобы вся эта нация окончательно не распалась на части."

HAI_the_revolution_triumphant: "Революция восторжествовала"
HAI_the_revolution_triumphant_desc: "Наша революция, прошедшая либо через честные выборы, либо через собственную пламенную волю народа, оказалась успешной. Гаити сейчас заглядывает через край в славное и равное будущее для всех гаитян, поскольку все мы купаемся в красном свете социализма. За Гаити! Для пролетариата!"

HAI_transform_bureaucracy: "Очистить бюрократию от истеблишмента"
HAI_transform_bureaucracy_desc: "Наша бюрократия все ещё смердит реакционными отбросами. Мы должны навести порядок и вымести этих отщепенцев и возможных предателей из наших рядов, чтобы наш режим мог продолжать выполнять свою задачу по обеспечению хорошего управления для пролетариата Гаити."

HAI_establish_syndicates: "Синдикаты и поощрение профсоюзов"
HAI_establish_syndicates_desc: "Синдикаты служат основной организационной единицей в синдикалистской системе. Мы должны создать эти рабочие синдикаты, чтобы организовать нашу рабочую силу и обеспечить более полное удовлетворение государством их специфических потребностей, которые они имеют для своей карьеры и жизни."

HAI_force_out_moderates: "Вытеснить партийных умеренных"
HAI_force_out_moderates_desc: "Умеренные партии лишь тормозят наш прогресс, преграждая пролетариату путь к процветанию и блаженству, которые несет с собой синдикализм. Эти либералы и предатели революции должны быть вытеснены с позиций власти и влияния, чтобы сохранить государство и наши социалистические цели."

HAI_masters_of_dew: "Хозяева росы"
HAI_masters_of_dew_desc: "Президент Жак Румен, будучи великим государственным деятелем, также является плодовитым и знаменитым автором, особенно известным своей литературой, в которой представлены социалистический реализм и нуаристский национализм. Его новое произведение, названное «Gouverneurs de la Rosée» или «Masters of the Dew», рассказывает историю молодого кубинца, вернувшегося из заграничного путешествия на сахарную плантацию, где он работал, и обнаружившего, что его соотечественники болеют и голодают в условиях деспотичного режима. Вместо того чтобы сдаться, герой романа ведет своих соотечественников к социалистической системе, перестраивая свою плантацию в сельскохозяйственную коммуну с нуля. Этот короткий рассказ может быть вымыслом, но он раскрывает мечты Румиана о Гаити яснее, чем любая его речь. Единственный путь вперед для Гаити - это когда средний гаитянин сам возьмет в руки инструменты и начнет действовать, и именно это мы должны сделать в национальном масштабе, воплотив в жизнь предложенный Румианом сплав афро-гаитянского национализма нуаристов и его идеализированного аграрного синдо-коммунизма."

HAI_socialist_education: "Истина - сквозь революционный ум"
HAI_socialist_education_desc: "Наши дети и необразованная молодежь должны быть обучены марксистским принципам жизни и мышления. Без этих уроков революция, несомненно, провалится, и наша синдикалистская мечта рухнет. Мы должны должным образом обучить массы Гаити принципам Маркса, а также базовому образованию, чтобы вывести нашу нацию из состояния образовательного голода, в котором она пребывала долгие годы."

HAI_french_model: "Французская модель"
HAI_french_model_desc: "Несмотря на то, что когда-то они властвовали над нами, сейчас парижский режим выступает под флагом социализма, а не империалистической алчности. Они - маяк синдикализма на Земле и факелоносцы мировой революции. Мы должны ориентироваться на них и их модель, если хотим осуществить успешные социалистические изменения в нашей собственной стране, потому что они делают что-то правильное."

HAI_syndicalist_centralism: "Централизованный нуарный синдикализм"
HAI_syndicalist_centralism_desc: "Хотя наша система и является синдикалистской, она должна быть гораздо более централизованной, чтобы обеспечить стабильность и безопасность в этой суровой стране, и полностью погруженной в идеологию нуаристов, если мы хотим по-настоящему понять бедственное положение афрогаитянских масс и одновременно стать средством, которое избавит их от него. Классицизм, другие социально-экономические различия и ужасная фракционность больше не смогут разделить нас, поэтому, хотя наш народ будет иметь свою автономию, когда дело дойдет до государственных дел, все должны участвовать в одном центральном Национальном синдикате, чтобы объединить административные возможности нашей нации для большей сплоченности и сотрудничества."

HAI_the_student_has_become_master: "Ученик становится мастером"
HAI_the_student_has_become_master_desc: "Макс Гудикур долгое время был ценным учеником и протеже Жака Румена, но по мере того, как Гудикур рос, росла и его собственная независимая форма мышления, стремящаяся к более умеренному пути, чем у его бывшего наставника, и свободная от жестокого романтизма Румена в отношении афро-гаитянского национализма, известного как нуаризм (Noirisme). Теперь Гудикур стоит как свой человек на переднем крае гаитянской национальной политики, готовый сбросить тень своего бывшего учителя и стать хозяином этой нации по своему собственному обряду, продвигая свою собственную форму умеренного социализма в рамках PSP."

HAI_end_rivalries: "Лишённые соперничества и фракционности"
HAI_end_rivalries_desc: "Мы должны покончить с мелкими политическими дрязгами, которые разделяют наш народ и политиков, а также с непрекращающейся фракционностью, которая привела к появлению стольких сил, борющихся за власть. Мы должны сплотиться, если Гаити хочет исцелиться и избавиться от своего расколотого прошлого. Давайте же объединимся прямо сейчас, ради блага всех гаитян."

HAI_fellowship_of_labor: "Братство труда"
HAI_fellowship_of_labor_desc: "Наши рабочие должны не только работать вместе, но и действительно сформировать узы единства и товарищества, если наша социалистическая система когда-либо будет работать. Без единства трудящихся наша база распадется на части, прежде чем мы сможем даже приблизиться к полному раскрытию своего потенциала. Нам необходимо воспитать в гаитянском пролетариате чувство общей цели и культуры, чтобы наша промышленность работала без сбоев, а нация продолжала идти к процветанию."

HAI_repudiate_radical_noirism: "Отречься от радикального нуаризма"
HAI_repudiate_radical_noirism_desc: "Радикальный нуаризм, или нуаризм, - опасная школа мысли. Хотя она характерна только для нашего народа, она также может способствовать разжиганию и распространению темных и националистических настроений. Мы должны решить, что делать с этими радикалами и их ядовитой идеологией, пока наш сверкающий социалистический эксперимент не рухнул на наших глазах."

HAI_academic_ethos: "Укреплять академический дух"
HAI_academic_ethos_desc: "Хотя мы многое сделали для исправления системы образования Гаити, она все ещё нуждается в улучшении. Мы должны привить нашему населению академический дух. Таким образом, интеллект и образование станут основополагающими столпами нашей культуры и общества, к которым смогут стремиться все гаитяне."

HAI_smash_church: "Сократить влияние церкви"
HAI_smash_church_desc: "От католической церкви гораздо больше проблем, чем пользы. Хотя мы не можем полностью объявить религию вне закона, поскольку большая часть нашего населения исповедует христианство, мы можем полностью разорвать их связи с нашим правительством и государственным управлением, конфисковав большую часть земли, которой они владеют и ничего не делают. Мы сразу же секуляризируем эту администрацию, не отторгая народ."

HAI_controlled_opposition_lefty: "Контролируемая оппозиция"
HAI_controlled_opposition_lefty_desc: "Мы не должны допустить, чтобы наша только что созданная народная демократия стала жертвой хаоса и деградации, которые могут быть вызваны неуправляемой и несдержанной оппозицией или нечестной реакцией. Мы не можем допустить, чтобы беды режима Борно стали и нашими болезнями, поэтому мы должны действовать быстро и загнать непокорных противников нашего режима в более управляемое положение."

HAI_workers_democracy: "Умеренная рабочая демократия"
HAI_workers_democracy_desc: "Мы создали на Гаити пролетарский рай, яркий пример настоящей рабочей демократии, которая ставит рабочих, фермеров и других низкооплачиваемых гаитян превыше всего в рамках умеренной демократической системы, созданной и функционирующей по их собственному усмотрению. Хотя во главе партии стоит мулат Макс Гудикур, он оказался верным союзником афрогаитянских масс, а также всех остальных гаитян из всех слоев общества, и вместе будущее Гаити выглядит светлым и купается в красном свете пролетарского республиканизма."

HAI_rags_to_riches: "От тряпок к обогащению"
HAI_rags_to_riches_desc: "Находясь на грани краха и отчаяния, Гаити вырвалась назад и теперь стоит на пороге величия. Под руководством храброго полковника Деместена Каликста, который предал американских морских пехотинцев, чтобы помочь Гаити в борьбе за независимость, а затем стал самостоятельным социал-демократическим политиком, сосредоточившись на широкой кампании единства и креолизации населения и культуры Гаити для создания сильной и центральной национальной идентичности, и его правой рукой, либеральным лидером труда и популистом Даниэлем Финьоле, Гаити превратит свой длинный и трагический хвост в хвост процветания и единства в настоящей истории от лохмотьев к богатству, поскольку новый режим стремится катапультировать нашу давно бедную нацию к величию!"

HAI_professional_bureaucracy: "Построить профессиональную бюрократию"
HAI_professional_bureaucracy_desc: "Если мы хотим, чтобы новый режим Гаити выжил, мы должны создать действительно профессиональную и беспристрастную бюрократию. Они должны служить стране и её народу превыше любых идеологических представлений, которых они могут придерживаться, или прежней лояльности, которую они могли иметь. Их единственной преданностью будет народ, и если это будет обеспечено, гаитянская демократия и свобода будут процветать."

HAI_address_downtrodden: "Честное отношение к обездоленным"
HAI_address_downtrodden_desc: "Слишком долго большинство жителей Гаити оставались в нищете и позоре, влача жалкое существование в попытках выжить. Так больше не должно продолжаться! Бедным и угнетенным гаитянам, которые в большинстве своем являются афрогаитянами, будет протянута рука помощи, поскольку Каликсте и Финьоле стремятся продвинуть всех гаитян вперед, к общему будущему!"

HAI_labor_advisory: "Консультативный совет по вопросам труда"
HAI_labor_advisory_desc: "С момента возникновения первой современной экономики на нашем острове на Гаити повсеместно распространены плохие условия труда как на производстве, так и в полевых условиях. Травмы, пожизненные болезни и даже смерть ожидают многих гаитянских рабочих во всех сферах, что усугублялось при предыдущих режимах из-за плохого медицинского обслуживания и капиталистических боссов-стервятников. Будет создан новый совет, который будет следить за трудовой практикой на Гаити и обеспечит справедливое обращение и вознаграждение за труд даже самого низкого фермера."

HAI_liberate_the_mind: "Освободить разум"
HAI_liberate_the_mind_desc: "Несмотря на то что система образования Гаити за последние месяцы значительно продвинулась вперед благодаря реформам предыдущего режима, ещё многое можно сделать для улучшения образовательной инфраструктуры Гаити. Наши учёные смогут свободно исследовать любые темы, а ряд начинающих областей, от изобразительного искусства до НТИМ, будут широко рекламироваться и субсидироваться нашим правительством, чтобы побудить все больше гаитян получать высшее и более специализированное образование, соответствующее их особым навыкам и потребностям. Мы превратим систему образования Гаити из посмешища всего мира в мирового лидера в области академических наук!"

HAI_cultural_renaissance: "Синкретический культурный ренессанс"
HAI_cultural_renaissance_desc: "Чтобы ещё больше укрепить связи нашего народа, поскольку раны, нанесенные гражданской войной, все ещё болят, но уже заживают, Каликсте и Финьоле недавно начали принимать масштабные законы, финансирующие и поддерживающие исконно гаитянские культурные иконы и программы. Природные зоны, такие как Саут-Мотерин, или археологические чудеса, такие как Цитадель Лаферьер, были объявлены государственными парками и реликвиями, нуждающимися в сохранении. Местные музыканты и художники получили заказ на создание новых произведений для государства, традиции Воду и другие туземные традиции были открыто легализованы и узаконены, и так далее, в то время как государство распространяет идею культурного синкретизма и креольского единства, чтобы связать гаитян в единую национальную идентичность, которая в равной степени объединяет и прославляет различные субкультуры Гаити, будь то афрогаитянская, мулатская, туземная, Воду или любая другая, населяющая наш прекрасный островной дом. Каликсте и Финьоле стремятся возродить культуру, почти полностью утраченную под натиском иностранных держав, таких как американцы и французы, и с этими планами, похоже, им это удастся. Гарлему пришел черед, пусть же начнется гаитянский ренессанс! "

HAI_political_equilibrium: "Вновь мир и равновесие"
HAI_political_equilibrium_desc: "Если мы хотим по-настоящему процветать и избежать прежнего хаоса, в нашем режиме и правительстве должно установиться чувство равновесия и беспартийности. Несмотря на разнообразие идеологических взглядов в нашей стране, все мы заботимся о безопасности и процветании нашей страны и нашего народа. С этой основополагающей концепцией сотрудничество в будущем станет ключом к нашему выживанию."

HAI_creole_democracy: "Истинно креетльская демократия"
HAI_creole_democracy_desc: "Гаити одержало победу над ложными демократическими обещаниями прошлых режимов, созданных Борно или американцами, и теперь твердо стоит на ногах как истинная демократия для народа Гаити. Вместе нас связывают наши крейотльские корни, общее наследие, выкованное в огне нашей бурной истории. Мы стали Розовой жемчужиной Карибского бассейна, истинным представителем народа крейотль на Гаити и за его пределами."

HAI_job_of_elite: "Работа для центра"
HAI_job_of_elite_desc: "Хотя Борно и его жалкий режим потерпели неудачу, это произошло не из-за идеологических провалов, а из-за коррупции и жадности. Благодаря нашим недавним победам на выборах мы будем нести факел капитализма на Гаити, избавляя его от запятнанной репутации, которую он приобрел в нашей стране. Хотя многие считают, что мы, центристы и элита, не в ладах с левыми массами, только мы действительно знаем, что лучше для Гаити и его будущего."

HAI_fight_political_bovarysme: "Борьба с политическим боваризмом"
HAI_fight_political_bovarysme_desc: "Введенное в оборот титаном либерализма Жаном Прайс-Марсом понятие «политический боваризм» относится к элитарным и деспотичным привычкам белой и мулатской аристократии, которая слишком долго задирала нос перед афрогаитянским большинством, стараясь максимально исключить африканские массы из широкой политики. Этому должен быть положен конец, так как если это будет продолжаться, наша недавно завоеванная демократия наверняка потерпит крах или поддастся коррупции, как это сделал режим Борно."

HAI_confront_radicals: "Предложить альтернативу радикализму"
HAI_confront_radicals_desc: "Радикалы по-прежнему атакуют нас как справа, так и слева, но мы непоколебимы в своих убеждениях и должны победить их последователей честными действиями и реформами, а не мелким политическим насилием, поскольку это приведет лишь к новым проблемам. Мы переживем этот шторм, но при этом обратимся к этим группам с миром, чтобы загладить свою вину и заложить основу для возможного компромисса и беспартийного сотрудничества, используя таких известных и широко любимых деятелей, как Жан Прайс Марс, чтобы привлечь радикалов обратно в наши ряды и перевоспитать их в умеренных."

HAI_promote_rural_health: "Улучшить здравоохранение в сельской местности"
HAI_promote_rural_health_desc: "Большая часть гаитянской сельской местности не имеет свободного доступа к современной медицинской помощи, вместо этого она вынуждена полагаться на Воду и другие традиционные виды медицинской практики. Хотя некоторые из этих местных средств могут оказать определенную помощь больным, наш народ не должен полагаться на религию и божественное вмешательство, чтобы исцелить своих больных и раненых. По всему штату должны быть созданы новые государственные клиники, а также открыты новые программы обучения медицине, чтобы обучать местных целителей более современным методам лечения."

HAI_comprehensive_academic_overhaul: "Всеобъемлющая реформа образования"
HAI_comprehensive_academic_overhaul_desc: "Хотя наша страна уже провела небольшую реформу образования, необходимо сделать ещё больше, чтобы население Гаити действительно сравнялось с другими образованными странами. По всей нашей блистательной демократии должны быть открыты или субсидированы новые школы, как государственные, так и частные, чтобы нести свет образования всем гаитянам."

HAI_haitianization: "Принять гаитянизацию"
HAI_haitianization_desc: "Культура нашей страны сильно пострадала во время деспотичной и увядающей американской оккупации. После того как они ушли, а их марионетки в Борно и Лаво были отстранены от власти, Гаити снова может принять и развить свою собственную идентичность. Гаити - для гаитян, и наша культура и образ жизни должны отражать это."

HAI_caribbean_commission: "Создать Карибскую комиссию"
HAI_caribbean_commission_desc: "Мы решили наладить более тесные связи с другими странами Карибского бассейна и с нашими южными соседями в Латинской Америке. Благодаря такому сотрудничеству местных наций, экономические возможности будут щедрыми, а независимость от старых империалистических держав будет процветать как никогда раньше. Мы больше не колонии! Пришло время сосредоточиться на собственном развитии, а не на набивании карманов жадных европейцев и американцев."

HAI_national_syncreticism: "Синкретизм и идеологический прагматизм"
HAI_national_syncreticism_desc: "Под руководством нашей администрации Гаити и её народ создали крепкие, практически нерушимые связи. Наше правление залечило раны, нанесенные Гаити в период, казалось бы, нескончаемых раздоров, и укрепило основы нашей демократии."

HAI_european_commission: "Обратиться в Европейскую комиссию"
HAI_european_commission_desc: "Мы решили установить более тесные связи с великими державами Европы и Северной Америки. Несмотря на то что многие из этих стран в своё время набросились на Гаити во времена нашей слабости, сейчас наша страна сильна и процветает как никогда. Мы больше никогда не попадем под их влияние и контроль, ведь мы уже научились их уловкам."

HAI_liberal_democracy: "Демократия для всех гаитян"
HAI_liberal_democracy_desc: "Когда-то считалось, что на нашем острове и для нашего народа невозможна по-настоящему функционирующая республиканская демократия, но сейчас Гаити является маяком свободы и свободы в Карибском бассейне. Под взвешенным и эффективным правлением [HAI.GetLeader] будущее Гаити выглядит как никогда радужно."

HAI_king_of_la_gonave: "Король в Ла-Гонаве"
HAI_king_of_la_gonave_desc: "Фаустин Эдмонд Виркус прожил довольно стандартную жизнь: сначала он был иммигрантом польского происхождения, приехавшим в Соединенные Штаты в младенчестве, а затем родился в семье родителей-иммигрантов в шахтерском городке в Пенсильвании. Однако после того, как он в юном возрасте поступил на военную службу и стал морским пехотинцем на Гаити, его жизнь приняла странный оборот. Спасая местную Королеву от неминуемой опасности, он был провозглашен «бело-негритянским королем Ла-Гонава», закрепив своё место в сердцах местных жителей. Теперь, когда хаос последних недель остался позади, он правит как король Ла-Гонава и вскоре будет коронован как император Гаити, повторяя наследие Фаустина I, реинкарнацией которого местные жители считают Виркуса. Под его властью пусть процветает наша новая Империя!"

HAI_the_graceful_officer: "Грациозный офицер"
HAI_the_graceful_officer_desc: "Когда-то служивший офицером в Гарде д'Гаити, Фаустин II не забыл о своих военных корнях. Будучи всегда сострадательным и справедливым офицером, он привнесет этот опыт и отношение как в своё правление, так и в правление своих верных офицеров в вооружённых силах Гаити. Под его руководством наш офицерский корпус будет учиться методам умеренного и эффективного командования, совершенствуя свои возможности как в военной комнате, так и на поле боя."

HAI_the_voodoo_king: "Император Воду"
HAI_the_voodoo_king_desc: "Фаустин II, объявленный реинкарнацией Фаустина I и коронованный на церемониях Воду как король Ла-Гонава и император Гаити, проникся большой любовью и интересом к родной религии Воду, её практикам, медицинскому применению и использованию в качестве объединяющего средства для гаитянского народа. Видя её полезность и привлекательность, Фаустин II объявил Воду официальной религией Гаити, а также сделал язык Kreyòl ayisyen государственным языком наряду с французским. Будучи настолько преданным своей новой инициативе, он даже нашел время, чтобы медленно выучить Kreyòl ayisyen, конечно же, с помощью многочисленных репетиторов."

HAI_the_modern_farmer: "Современный фермер"
HAI_the_modern_farmer_desc: "Сельскохозяйственные методы Гаити имеют больше общего с неолитическими методами ведения хозяйства, чем с современными. Фаустин II призвал к полной механизации и модернизации всей сельскохозяйственной системы Гаити с нуля, ведь страна, которая не может прокормить даже саму себя, обречена на провал с самого начала, какими бы праведными ни были её цели."

HAI_train_the_men: "Обучить воинов короля"
HAI_train_the_men_desc: "Фаустин II, чья военная подготовка ещё свежа в его памяти и дорога его характеру, ценит военную мощь и готовность Гаити превыше всего остального, не считая, конечно, общего благополучия всех гаитян. Под его правлением наши вооруженные силы вновь поднимутся на почетную высоту, повторив храброе наследие таких гаитянских героев прошлого, как Дессалин и Лувертюр."

HAI_legacy_of_faustin: "Наследие Фостена I"
HAI_legacy_of_faustin_desc: "Император Фостен-Эли Сулук, или Фостен I, создал Вторую империю Гаити в 1849 году, создав наследие, которое сохранилось до наших дней. Хотя многие пытались забыть о былой славе, жители Ла-Гонава и их Королева Ти Меменн увидели в Фостене Виркусе душу уже давно умершего императора. Благодаря божественной силе Воду, так утверждают местные жители, Фаустин возродился в новом сосуде, который был назначен богами служить единственным и истинным лидером Гаити."

HAI_fight_corruption: "Борьба с институциональной коррупцией"
HAI_fight_corruption_desc: "Несмотря на то, что наш новый режим увенчан короной в виде Фаустина II, его основа все ещё разлагается от разгула коррупции, доставшейся нам в наследство от прежних администраций Гаити. Мы должны сбросить эту оболочку коррупции и эгоистичного управления, ведь наше правление направлено на благо народа Гаити, а не на себя. Фаустин II хорошо понимает это и выступает за новый крестовый поход против коррупции во всех её формах. Гаити станет чистым."

HAI_for_the_people: "Для людей, если не самими людьми"
HAI_for_the_people_desc: "По указу Фаустина II была принята новая серия социальных услуг и других популистских мер для создания страховочной сетки, чтобы защитить наш народ от любых дальнейших трудностей, подражая прогрессивной политике материковой Америки, причем Фаустин черпал прямое вдохновение у таких фигур, как Джордж Норрис, Генри Уоллес и Фиорелло Ла Гуардиа. Фаустин II правит для народа Гаити, а не для себя, и поэтому все, что он делает, и все, что делает государство, должно быть для народа, если не для народа."

HAI_civil_war_intervention: "Дебаты об интервенционизме"
HAI_civil_war_intervention_desc: "Огонь 2-й американской гражданской войны в настоящее время раздирает бывшие Соединенные Штаты, превращая их во все более разделенный водоворот хаоса и смерти. Среди этого хаоса под перекрестным огнем лежат невинные братья и сестры с родного континента, чьи предки были украдены, как и наши. Мы должны решить, стоит ли нам вмешаться в их дела и помочь спасти черную расу от безрассудства белого человека."

HAI_build_hounfours: "Вернуть утраченные хунфоры"
HAI_build_hounfours_desc: "Хунфоры (также называемые хунфорами, хумфортами, уфо и оумфорами) - это традиционные храмы Воду, которые раньше были обычным явлением на всей территории Гаити. Во времена американской оккупации многие из них были разобраны, снесены или оставлены гнить. По совету своего духовного совета Фаустин II приказал построить на Гаити новую серию храмов Hounfours как в городах, так и в сельской местности, чтобы при поддержке государства возродить веру Vodou. Все гаитяне должны иметь свободный доступ к своим молельным домам, ибо ни один гаитянин не должен быть лишен права молиться и воздавать почести Папе Легбе, Маман Бригитте или любому другому божеству Воду, будь то традиционное или одно из тех, что появились позже, в результате католического влияния Воду."

HAI_follow_native_customs: "Соблюдать местные обычаи"
HAI_follow_native_customs_desc: "Фаустин II стал местным! Он полностью влюбился во все родное на Гаити, будь то культура, образ жизни, идеи, искусство или что-то ещё. Он стал настоящим императором народа, и гаитянская публика обожает его за это. При Фаустине II гаитянские традиции и культура наконец-то в безопасности!"

HAI_the_white_king_of_haiti: "Белый Император Гаити"
HAI_the_white_king_of_haiti_desc: "Фостин II укрепил своё положение как Императора Гаити, так и в сердцах гаитян по всей стране. Несмотря на белую кожу, он зарекомендовал себя как настоящий союзник большинства чернокожего и мулатского населения Гаити и всего Карибского бассейна. При его правлении Гаити впервые за десятилетия по-настоящему процветала, и при его продолжающемся правлении все в стране ожидают только самого лучшего для себя и своей страны."

HAI_papa_doc: "Папа Док"
HAI_papa_doc_desc: "Франсуа Дювалье обошел своего бывшего наставника Карла Броура и стал главой правительства Гаити. При его правлении националистическая, вудуистская и панафриканская риторика будут широко распространены, поскольку Папа Док превращает Гаити в государство, достойное его имиджа."

HAI_combat_the_mulattos: "Борьба с мулатами"
HAI_combat_the_mulattos_desc: "Элита мулатов - не что иное, как паразиты на живой крови Гаити. Хотя они обладают значительной частью богатства и опыта населения Гаити, они получили такие преимущества только благодаря системному угнетению афро-гаитянского населения. Этому должен быть положен конец; мы обеспечим это, быстро убрав всех мулатов и белых с постов власти, и будем медленно работать оттуда, чтобы сокрушить их влияние раз и навсегда."

HAI_raid_the_marines: "Налёт на морскую пехоту"
HAI_raid_the_marines_desc: "Хотя американская оккупация закончилась в конце 1935 года, они по-прежнему сохраняли почти полный финансовый контроль над нашей страной вплоть до краха режима Борно. Кроме того, они всё ещё сохраняют небольшое, но стойкое военное присутствие на острове в виде нескольких оставшихся аванпостов и баз USMC, которые усеивают побережье Гаити. Мы должны совершить набег на эти остатки американского угнетения и избавиться от этой головной боли янки раз и навсегда."

HAI_the_failed_coup: "Неудавшийся переворот"
HAI_the_failed_coup_desc: "Оставшиеся мерзкие янки предпринимают последнюю попытку свергнуть законного президента Франсуа Дювалье! Нашему лидеру не должно быть причинено никакого вреда, и ни одна американская собака не должна остаться в живых, если мы хотим пережить это грядущее нападение целыми и невредимыми. Поскольку Америка отвлекается на свои собственные внутренние проблемы, мы будем просто против них. Давайте покончим с этим и закрепим правление папы Дока раз и навсегда!"

HAI_embrace_vodou: "Принять Вуду"
HAI_embrace_vodou_desc: "Поскольку большая часть более высокообразованного или специализированного населения нашей страны бежит или вынуждена покинуть страну из-за наших законов против мулатов, нам пришлось обратиться к альтернативным методам удовлетворения различных основных потребностей. Когда священники, инженеры, учёные, политики, военные деятели и многие другие были изгнаны, пострадало все гаитянское общество. К счастью, у нас есть проверенная альтернатива: Вуду. Вуду показал себя естественным решением наших текущих проблем, будучи уже устоявшимся и широко распространенным явлением хайтайна. Уже полюбившийся президенту Франсуа Дювалье, не составит труда полностью поддержать эти убеждения и распространить их дальше по всей стране. Вуду должен быть одновременно государственной религией и государственной философией."

HAI_foreign_contacts: "Зарубежные контакты"
HAI_foreign_contacts_desc: "Под поверхностью международных отношений скрывается темное подбрюшье одинаково взаимосвязанных организаций и организаций, которые следуют менее строгому и "благородному" набору идеалов и правил. Эти контакты на черном рынке должны лечь в основу политики Дювалье, поскольку папа Док работает над тем, чтобы завести друзей как в высших, так и в низших кругах."

HAI_new_medicine: "Новая медицина"
HAI_new_medicine_desc: "У Вуду много аспектов, но одно из его наиболее интересных применений - в области медицины. Поскольку многие традиционные средства Вуду являются проверенными естественными альтернативами современной медицине в лечении недугов и болезней, которые часто поражают гаитян, наш штат перешел к полному использованию Вуду как медицинской науки. Необходимо провести дальнейшее изучение существующих методов с целью повышения их эффективности и результатов, но при этом они должны быть максимально естественными и соответствовать обычаям. Гаити отвергает идею о том, что современная западная медицина - единственный способ вылечить больных!"

HAI_friends_on_the_other_side: "Друзья на другой стороне"
HAI_friends_on_the_other_side_desc: "Франсуа ‘Папа Док’ Дювалье - не простой смертный. Он бокор, священник и ведьма веры Вуду, которая, как говорят, служит Лоа, или божествам Вуду, обеими руками, или как светлым, так и темным силам, в зависимости от ситуации. Папа Док получает видения от духов и следует их божественному руководству в своем правлении на Гаити. Со своими друзьями на другой стороне Папа Док и само Гаити никогда не будут одиноки..."

HAI_confiscate_property: "Конфисковать собственность белых"
HAI_confiscate_property_desc: "Чтобы способствовать освобождению афро-гаитян и перевороту гаитянского общества, Франсуа "Папа Док" Дювалье издал новый закон, который предусматривает конфискацию всей частной земли, принадлежащей белокожим жителям Гаити. Каждый особняк, каждая квартира, каждая плантация - все должно быть возвращено в руки народа и государства. Белый человек больше не будет пользоваться особым отношением со стороны правительства Гаити. Пришло время им почувствовать боль, которую остальные 99% населения Гаити испытывали на протяжении веков."

HAI_create_the_bogeymen: "Создать "Бугименов""
HAI_create_the_bogeymen_desc: "Тонтон-макуты, или "Бугимены", - это личные эскадроны смерти Франсуа ‘Папа Док’ Дювалье и военизированные формирования. Под покровом ночи они заставляют замолчать врагов режима Дювалье и гаитянского народа во главе со старым другом папы Дока и злобным боевиком Клеманом Барбо."

HAI_purge_leftists: "Чистка левых"
HAI_purge_leftists_desc: "Социализм создал большие очаги инфекции внутри нашей нации. Мы должны разгромить и очистить эти очаги синдикалистского и марксистского разврата, ибо их мерзкое и отвратительное влияние нельзя оставлять гноиться в пределах наших границ. Все формы социализма должны быть объявлены вне закона, их партии запрещены, а их лидеры арестованы и заключены в тюрьму за государственную измену до суда. Если несколько из них потеряются при перетасовке, так тому и быть."

HAI_embodiment_of_haiti: "Воплощение Гаити"
HAI_embodiment_of_haiti_desc: "Папа Док поднялся, чтобы стать лицом Гаити и её народа. Его лицо расклеено на каждой улице, его голос ежедневно транслируется по национальному радио и телевидению. Дювалье стал воплощением Гаити; он стал самим Гаити."

HAI_pan_african_plans: "Панъафриканские планы"
HAI_pan_african_plans_desc: "Одним из ключевых основополагающих столпов политической идеологии Нуарсте и более широкого движения нуаризма является Панъафриканизм. Более тесное сотрудничество между африканской диаспорой и местным населением необходимо для залечивания ран, нанесенных нашим общим народам столетия назад, и для устранения ущерба, нанесенного нашей культуре и нашей коллективной психике. И что может быть лучше для укрепления сотрудничества с нашими чернокожими собратьями, чем победить их лживые, коррумпированные режимы и спасти их от самих себя!"

HAI_baron_samedi: "Барон Суббота"
HAI_baron_samedi_desc: "Барон Суббота служит божеством Вуду, или Лоа, мертвых. Принимая множество возможных обличий, он и его жена Маман Бриджит служат богами смерти в гаитянском пантеоне Вуду. Папа Док долгое время лепил себя по образу и подобию барона, дойдя до того, что большая часть его личных вещей и ценных вещей украшена особым веве Суббота.  Дювалье даже зашел так далеко, что изменил тон своего голоса, когда говорил, чтобы соответствовать голосу барона Суббота, описанному в гаитянских мифах, и стал носить тёмные круглые очки и шляпу, типичные для изображений Лоа. По мере того, как его правление длится все дольше, Дювалье все больше превращается в этого персонажа до такой степени, что почти невозможно сказать, где когда-то начинался Дювалье и где сейчас заканчивается это притворство барона Суббота."

HAI_personality_cult: "Культ личности"
HAI_personality_cult_desc: "Папа Док полностью заменил человека, ранее известного широкой публике как Франсуа Дювалье. Он отказался от своего положения простого человека и вознесся, чтобы стать почти божеством гаитянского народа. Проявленный полубог, папа Док - отец гаитянского народа и стал воплощением самого Гаити. Все должны свидетельствовать и оставаться верными единственному истинному правителю Гаити, и пусть никто не будет настолько глуп, чтобы встать у него на пути."

HAI_the_immaterial_being: "Нематериальное существо"
HAI_the_immaterial_being_desc: "Пуль и пулеметов, способных устрашить Дювалье, не существует. Они не могут прикоснуться ко мне... Я уже нематериальное существо. Ни один иностранец не будет указывать мне, что делать! Если США претендуют на право вмешаться из-за репрессивных условий, почему они не высаживают войска в Алабаме?"

HAI_border_crisis: "Кризис на границе"
HAI_border_crisis_desc: "Поступили недавние сообщения из пограничных районов между нашим штатом и Доминиканской Республикой, к которым прилагается тревожная информация. Похоже, что напряженность достигла абсолютного максимума, поскольку ДР продолжает наращивать своё полицейское присутствие на пограничной полосе. Многие опасаются кровопролития или даже тотальной войны между нашими двумя народами. Мы должны действовать быстро и оценить текущую ситуацию, готовясь к худшему, но надеясь на лучшее."

HAI_monte_christo_affair: "Дело Монте-Кристо"
HAI_monte_christo_affair_desc: "Сегодня рано утром из трущоб Монте-Кристо пришла телеграмма, в которой подробно описывалась небольшая резня. С ростом напряженности местные гаитянские рабочие все чаще вступали в стычки с доминиканской полицией, и ситуация в конце концов вышла из-под контроля. Горстка ни в чем не повинных гаитян сейчас лежит мертвая, а народ Гаити взывает к мести. Мы находимся на грани войны, и наш недавно установившийся режим должен действовать осторожно, чтобы мы полностью не рухнули под сапогами и поступью доминиканской армии."

HAI_tense_negotiations: "Напряженные переговоры"
HAI_tense_negotiations_desc: "Мы решили обратиться к режиму в Санто-Доминго, чтобы попытаться достичь соглашения по поводу этих недавних трагедий на границе. Хотя это будет трудно, должны возобладать более хладнокровные умы, чтобы Гаити и Доминиканская Республика не оказались в состоянии тотальной войны."

HAI_preemptive_strike: "Упреждающий удар"
HAI_preemptive_strike_desc: "К черту переговоры! Мы нанесем удар по нашему старому врагу, пока они думают, что мы приходим в себя после их жестокой резни невинных гаитянских жизней. Эти бедные души будут отомщены. К оружию моих собратьев-гаитян! Сегодня мы возвращаем себе наше достоинство!"

HAI_fate_of_dominican_republic: "Судьба Доминиканской Республики"
HAI_fate_of_dominican_republic_desc: "Теперь, когда кризис с Доминиканской Республикой разрешен и урегулирован, наступает следующий шаг: решение о том, что делать с землями нашего старого соперника. Мы могли бы, наконец, объединить остров Эспаньола под нашим праведным и справедливым правлением, или мы можем работать над установлением дружественного режима на их землях, чтобы способствовать улучшению отношений между нашими двумя народами. Дебаты по этому решению будут ожесточенными, но мы уверены, что наш кабинет примет наилучшее решение."

HAI_new_world: "Новый Свет"
HAI_new_world_desc: "Наше великое государство должно смотреть на наших ближайших соседей, наших собратьев по народам и нациям Нового Света, прокладывая путь вперёд к новым возможностям для расширения и сотрудничества. Гаити больше не будет единственной свободной и незапятнанной страной Карибского бассейна!"

HAI_old_world: "Старый Свет"
HAI_old_world_desc: "Гордая гаитянская нация должна смотреть на Новый Мир, особенно на Родной континент, Африку, в поисках будущих возможностей для расширения. Мы освободим эти земли от ошибочных правительств и империалистической жадности, как мы освобождаем Африку от Кейптауна до Каира."

HAI_looking_outwards: "Глядя наружу"
HAI_looking_outwards_desc: "Решив вопросы на нашем собственном острове, Гаити должна начать смотреть вовне в вопросах внешней политики и взаимодействия, чтобы утвердиться на мировой арене. Мы больше не должны становиться жертвами прихотей иностранцев, поскольку отныне Гаити будет диктовать свою собственную судьбу."

HAI_join_internationale: "Вступить в Интернационал"
HAI_join_internationale_desc: "Учитывая наши левые корни и социалистическое правительство, для нас вполне естественно обратиться к Интернационалу. Основанный нашими бывшими хозяевами-империалистами, которые с тех пор поддались соблазну социализма, этот военный союз служит Гаити наилучшим средством обеспечения её дальнейшей независимости. Вместе мы разорвем эти цепи!"

HAI_liberate_the_caribbean: "Освободить Карибский бассейн"
HAI_liberate_the_caribbean_desc: "Большая часть Карибского бассейна находится под властью империалистических колониальных режимов и реакционных правительств. Мы должны освободить все народы Карибского бассейна от иностранного правления, показав им славу и превосходство социализма."

HAI_free_from_our_chains: "Свободны от наших цепей!"
HAI_free_from_our_chains_desc: "Мы освободили Карибский бассейн от тисков иностранных тиранов и капиталистической жадности. Наше нетронутое море и усеивающие его острова теперь объединены под Красной Звездой социализма. Мы будем двигаться вперёд вместе, во имя светлого будущего для пролетариата Карибского бассейна."

HAI_join_entente: "Присоединиться к Антанте"
HAI_join_entente_desc: "Наши сильные демократические идеалы и любовь к капиталистическим устремлениям четко связывают нашу администрацию с Державами Антанты. Хотя эти режимы являются наследниками наших бывших владельцев и потомками тех самых работорговцев, которые так вредили нашему народу, с тех пор они изменились к лучшему, как и мы. Теперь они представляют собой лучшую надежду демократии в этом диком мире, и с их помощью наша республика обязательно выживёт."

HAI_caribbean_negotiations: "Переговоры Карибского моря"
HAI_caribbean_negotiations_desc: "Мы обратимся к ведущим членам Антанты с просьбой, возможно, предоставить им управление их колониями здесь, в Карибском море. Благодаря нашей близости и более глубокому знанию жизни и культуры Карибского бассейна мы станем гораздо лучшими администраторами этих драгоценных островов, чем любой канадец или француз."

HAI_caribbean_leadership: "Лидерство в Карибском бассейне"
HAI_caribbean_leadership_desc: "Установив своё господство в Карибском бассейне, мы должны теперь действительно играть ту роль, которую мы сейчас играем. Мы должны быть настоящими лидерами различных народов Карибского бассейна, поскольку сейчас мы - их лучшая надежда на процветание и стабильность. Вместе демократия и свобода достигнут каждого острова и песчаной полоски в этом великом море, которое мы называем домом."

HAI_join_reichspakt: "Вступить в Рейхспакт"
HAI_join_reichspakt_desc: "Сильное государство требует сильных союзников, а кто сильнее, если не нынешний мировой гегемон? Германия правит безраздельно и, хотя испытывает много трудностей роста, сумела сохранить своё господство после окончания Вельткрига. Вполне естественно, что наше государство обращается к Кайзеру, чтобы способствовать более тесным связям между нашими славными государствами."

HAI_a_true_empire: "Настоящая Империя"
HAI_a_true_empire_desc: "Мы создадим здесь, в Карибском море, настоящую империю, которая даже превзойдет господство испанцев на этом архипелаге столетия назад. Мы очистим гнилостный след иностранного господства и создадим новую Карибскую империю, которая действительно поставит карибцев превыше всего."

HAI_punish_france: "Наказать Францию"
HAI_punish_france_desc: "Франция является единственным источником многих наших бед, господствуя над нами на протяжении веков только для того, чтобы затем сковать нас огромными долгами и бурной политической и социальной атмосферой. Гаити потребовались десятилетия и десятилетия, чтобы возместить причиненный ими ущерб, и теперь, с нашими новыми союзниками, пришло время отомстить. Мы заставим этих лягушек почувствовать боль, которую они причинили нам много лет назад, потому что месть Лувертюра и Дессалина обрушилась на них."

HAI_our_faction: "Мы одни"
HAI_our_faction_desc: "Гаити не нуждается ни в каких других союзниках, кроме самой себя. Слишком долго мы были привязаны к прихотям иностранных держав, слишком долго труды и усилия Гаити шли на пользу европейским и американским свиньям. Эта договоренность мертва, поскольку Гаити стоит в одиночку против всего мира. Все, что нам нужно, - это друг друг и сильная воля к непокорности."

HAI_caribbean_is_creole: "Креольское Карибское море!"
HAI_caribbean_is_creole_desc: "Карибский бассейн не является ни французским, ни британским, ни испанским, ни голландским, он креольский. Наша собственная общая культура, созданная из осколков нашего африканского наследия, смешанного с европейскими и местными традициями и культурами. Этот плавильный котел идей и идентичностей - это то, что делает нас теми, кто мы есть, и то, что делает Карибский бассейн таким уникальным на этой планете. Мы удалим темное пятно европейского и американского влияния с этого архипелага, пока не останется только наша общая и единственная в своем роде культура."

HAI_louisiana_claims: "Претензии на Луизиану"
HAI_louisiana_claims_desc: "Луизиана является насмешливой жемчужиной единства креолов. Десятки тысяч различных народов Креола жили в своих протоках и водных путях; все они были истинными сыновьями и дочерьми нашей общей культуры. Мы должны обратиться к американцам с просьбой вернуть эти законные земли в наши руки."

HAI_bolster_garde: "Будущее Гвардии"
HAI_bolster_garde_desc: "Мы должны решить, что делать с Гвардией Гаити, если мы хотим наконец создать действительно гаитянские вооруженные силы. Долгое время Гвардия Гаити работала марионетками и военизированными формированиями для американских и мулатских кукловодов. Это унижение и эксплуатация наших собственных вооружённых сил прекратятся немедленно! Мы должны решить, должны ли мы преобразовать Гвардию в пригодный для использования аппарат или выбросить её на свалку истории, когда мы создадим новую гаитянскую армию?"

HAI_militarized_society: "Милитаризованное общество"
HAI_militarized_society_desc: "Наш военный штаб и администрация договорились о полном роспуске гаитянской гвардии в целях создания новых, подлинно гаитянских вооружённых сил. Общество должно быть милитаризовано с нуля, поскольку Гаити стремится создать новую армию, достойную гаитянского народа."

HAI_all_for_one: "Все за одного" 
HAI_all_for_one_desc: "Крайне важно, чтобы Гаити располагала сильными вооруженными силами. Однако, если мы хотим выстоять против наших врагов, мы не можем надеяться полагаться на смехотворно незначительные силы Гвардии, равно как и на то, что другие страны защитят нас. Настало время нам взять дело в свои руки, как мы это сделали давным-давно во время Гаитянской революции. Только гаитяне могут защитить землю, которую они любят, но пройдет некоторое время, прежде чем мы сможем полностью включить коренное население в вооруженные силы."

HAI_native_to_the_soil: "Родная земля"
HAI_native_to_the_soil_desc: "Разнообразная местность Гаити - наш дом: от белых песчаных пляжей до самых глубоких джунглей и самых высоких вершин. Эти земли принадлежат нам, и наши солдаты знают эту дикую местность лучше, чем кто-либо другой на Земле. Этот опыт станет нашим величайшим достоянием; мы будем использовать эти знания для ведения жестокой и эффективной партизанской войны против любого, у кого хватит глупости вторгнуться на Гаити!"

HAI_fanatic_ncos: "Фанатичные сержанты"
HAI_fanatic_ncos_desc: "Наши унтер-офицеры составят основу нашей пехотной тактики, служа связующим звеном между нашим военным штабом и нашими пехотинцами на местах. Фанатизм, фанатизм и преданность нашему делу должны быть глубоко внедрены в каждого сержанта, чтобы они могли распространять эти идеи среди военнослужащих. Мы будем едины в идеологии, целях и борьбе, работая над сохранением безопасности Гаити."

HAI_motley_crews: "Разношёрстные команды"
HAI_motley_crews_desc: "Как и любая другая современная армия, Гаити нуждается в тяжелом вооружении и новых боевых машинах, если она хочет иметь шанс противостоять новому мощному оружию уничтожения, имеющемуся в распоряжении великих держав мира. Наши разношерстные и разношерстные экипажи пилотов, водителей, стрелков, грузчиков и всего другого вспомогательного персонала, возможно, не самые хорошо обученные, но они самые преданные и усердные в своих обязанностях. Они будут авангардом армии Гаити, помогая нашей пехоте, когда и как они могут."

HAI_militarized_youth_organizations: "Военизированные молодёжные организации"
HAI_militarized_youth_organizations_desc: "Молодёжь Гаити - это неиспользованный рынок возможной рабочей силы, который только и ждет, чтобы его использовали. Поскольку молодежные организации уже существуют по всей стране, наш режим перешел к кооптации этих групп для нашего собственного использования. Они должны быть ознакомлены с порядками государства и должны овладеть жизненно важными навыками, необходимыми для ведения войны, как в тылу, так и на передовой. Все гаитянские дети будут полезны государству!"

HAI_flexible_logistics: "Гибкая логистика"
HAI_flexible_logistics_desc: "Наша логистическая сеть должна быть гибкой и гибкой, чтобы пережить непредсказуемость современной войны. В любой момент наши линии снабжения могут быть отрезаны; суровая реальность, к которой все гаитяне должны быть готовы больше всего. Мы должны не только заранее спланировать скрытые склады снабжения и инфраструктуру, но и научить всех гаитян, особенно тех, кто служит в вооружённых силах, жить за счёт земли, когда это необходимо, чтобы максимально сократить наше логистическое присутствие.."

HAI_spirit_of_dessalines: "Дух Дессалина"
HAI_spirit_of_dessalines_desc: "Жан-Жак Дессалин был человеком, который сменил Туссена Лувертюра на посту лидера первой свободной рабовладельческой нации в истории человечества, то есть Гаити. Как один из наших национальных героев, он также известен как военный, который сражался за простых людей Гаити. Если мы хотим помнить о его наследии, мы должны помнить, что он сделал для рабов Гаити, и помнить, что все гаитяне разделяют ответственность за защиту этой нации."

HAI_ceaseless_duty: "Бесконечный долг"
HAI_ceaseless_duty_desc: "Мир не успокоится, и наши люди тоже не могут позволить себе такой роскоши, если мы хотим сохранить нашу страну в безопасности. Мы говорим не о сне, а скорее об отдыхе от нашего долга, нашей ответственности перед нашей страной и нашим народом. Благодаря бдительности нашей армии нас будет невозможно остановить дома и за рубежом."

HAI_garde_reborn: "Возрождённая Гвардия"
HAI_garde_reborn_desc: "Наши военные лидеры согласились реформировать и модернизировать Гвардию Гаити. Военные штабисты поставили перед собой цель превратить нынешнюю гвардию в силу, способную не только защищать границы Гаити, но и противостоять другим современным армиям. Этот процесс будет нелегким, но это важный шаг, который должна сделать наша нация."

HAI_one_for_all: "Один за всех" 
HAI_one_for_all_desc: "Дисциплина - это основа современной армии. Гвардия, несмотря на то, что является американской силой, сделала все, что было в её силах, чтобы защитить Гаити от угроз изнутри и извне. Однако в условиях роста напряженности недостаточно полагаться на Гвардию, не так, как сейчас. Мы должны усерднее тренироваться, мы должны перенять методы современной войны, и, прежде всего, мы должны использовать чистую дисциплину, чтобы победить наших врагов. Одна хорошо обученная сила всегда будет преобладать над несколькими неподготовленными силами."

HAI_modern_training_regimen: "Современный режим тренировок"
HAI_modern_training_regimen_desc: "Наша подготовка новобранцев попросту неудовлетворительна и устарела. Если мы хотим быть качественными силами, Вооруженные силы Гаити не могут терпеть плохо подготовленных солдат. Мы должны подвергнуть наших людей суровому, мучительному Аду, чтобы они могли стать современными, дисциплинированными и смертоносными войсками, готовыми сражаться и побеждать как единое целое."

HAI_cult_of_parity: "Культ равенства"
HAI_cult_of_parity_desc: "Исторически сложилось так, что гаитянским военным не хватало баланса сил между их ветвями, что, в свою очередь, приводило к эрозии их гражданских институтов. Хватит! Если мы хотим обеспечить безопасность Гаити на суше, в воздухе и на море, Гвардия должна иметь конкурентоспособные и сильные подразделения службы. Пехота, авиация, корабли и наша особо недооцененная бронетехника в равной степени получат то внимание, которого они заслуживают."

HAI_war_machines: "Боевые машины"
HAI_war_machines_desc: "В современном мире войну выигрывают с помощью промышленности, и Гаити не может позволить себе отставать в прошлом, в то время как её враги устремляются вперёд, в будущее. Наша военная машина должна быть способна служить нации в часы нужды, а это означает выполнение квот и производство большего количества боеприпасов!"

HAI_our_way_of_war: "Наш способ ведения войны"
HAI_our_way_of_war_desc: "Гвардия уже начинает формировать уникальную гаитянскую традицию ведения войны. Смешивая централизованную, хорошо организованную армию с партизанской тактикой, мы сохраняем сильные стороны обеих сторон, отбрасывая слабые. Организованная партизанская война - это то, что сокрушит наших противников, и скоро мир вспомнит, как мы, гаитяне, выигрываем наши сражения."

HAI_martial_innovation: "Боевые инновации"
HAI_martial_innovation_desc: "Недостаточно того, что Гвардия - это современная сила. Она также должна смотреть в будущее. Мы должны создать традицию новаторских лидеров, которые открыты для экспериментов с новыми доктринами и оружием. Отдавая предпочтение Новой гвардии, Гвардия никогда не отстанет от своих соперников, а вместо этого с гордостью войдет в число лидеров военной мысли."

HAI_louverture_legacy: "Наследие Лувертюра"
HAI_louverture_legacy_desc: "Туссен Лувертюр, лидер повстанцев и основатель современной нации Гаити, сегодня нависает над нашей страной. Мало кто может забыть его храбрость, его талант и дисциплину. Как человек, который доказал свою способность работать с внешними странами и против них, он является идеальным человеком для подражания сегодня: оппортунист, который в первую очередь служит своему народу. Мы должны принять это наследие."

HAI_total_standardization: "Полная стандартизация"
HAI_total_standardization_desc: "Стандартизация - важнейшая часть создания любой современной армии, и гаитянская гвардия остро нуждается в ней. Униформа, оружие, стрижки - все, что можно регулировать, будет регулироваться. Это позволит обеспечить как более надежное оборудование, так и единообразие наших доктрин, процедур и войск. Гвардия скоро станет известна своей эффективностью и последовательностью!"

HAI_shades_of_blue: "Оттенки синего"
HAI_shades_of_blue_desc: "Недавние изменения ясно показали, что наши вооруженные силы изменились по сравнению с теми силами, которыми они были всего несколько коротких лет назад. Теперь в нашу армию включены как элементы гвардии, так и коренное гаитянское население. Это новое положение дел выгодно для нас: мы получим лучшее из обоих миров."

HAI_our_powers_combined: "С нашими объединёнными силами..."
HAI_our_powers_combined_desc: "Несмотря на серьезные разногласия по поводу состояния вооружённых сил Гаити, мы отложили в сторону наши разногласия и решили объединиться на благо Гаити и Карибского бассейна. Если мы, гаитяне, будем держаться вместе, то в регионе мало кто сможет противостоять нам, и поэтому это будет сделано."

### Events ###
haiti.1.t: "Американская комиссия уходит!"
haiti.1.d: "Долгих двадцать тяжёлых лет наши так называемые «благодетели» из Соединённых Штатов прижимали сапог к народу нашей островной нации, оставляя чёрную отметину на девственно белых пляжах, которые мы называем домом. Под их надзором Гаити одновременно возвышалось и попиралось, пока американцы и их марионетка президент Луи Борно насиловали земли нашей страны и грабили нашу экономику ради собственной выгоды, всё это под ложным и опасным предлогом «государственного строительства» и «сохранения мира». С наступлением нового года мы обнаруживаем, что смотрим в весну, когда мы впервые за два десятилетия не сидим на поводке у Вашингтона, и с нашей новой свободой приходит потенциал как для великих успехов, так и для ужасных провалов. Чтобы начать наше новое путешествие, сначала нужно решить самые насущные проблемы. Главной среди этих новых забот является вопрос о том, что делать с остатками Американской комиссии и многочисленными расследованиями состояния нашего государства, которые они проводили перед своим поспешным отъездом после Чёрного понедельника. Наши бывшие повелители были в разгаре проведения многочисленных комиссионных расследований, инициированных ныне печально известным президентом Гербертом Гувером, в отношении того, как наше государство решает проблемы в сельском хозяйстве, политических свободах, экономической мобильности и самой большой чуме из всех - нашей вопиюще коррумпированной и крайне неэффективной системе образования. Хотя все первоначальные следователи давно ушли, их работа и выводы остались здесь, незавершёнными, предоставляя возможность продолжить с того места, на котором они остановились, чтобы мы сами могли исследовать бесчисленные проблемы Гаити. Однако эти недописанные отчёты - не всё, что оставили нам янки: большая часть инфраструктуры, административных систем и других бюрократических удобств Комиссии и оккупационных сил осталась стоять и находиться в хорошем рабочем и пригодном для использования состоянии. Эти богатства оставляют нашей администрации выбор: либо законсервировать эти объекты и незавершённые расследования, предоставив их сносу или забвению, либо заплатить высокую цену за их содержание, чтобы завершить эти расследования и отремонтировать их объекты для нашего собственного использования."
haiti.1.a: "Нам не нужны эти останки наших угнетателей. Снести оставшиеся объекты..."
haiti.1.b: "Они просто бросили сокровищницу полезной информации и оборудования для нашего государства..."

haiti.2.t: "Новая нормальность"
haiti.2.d.nofacilities: "Поскольку наши недавние реформы системы образования идут гладко, особенно в отношении нашей сельскохозяйственной программы благодаря ранним успехам SNPAER, а также после сноса последних оставшихся следов американской оккупации, Гаити вступил в новую эру нормальности и спокойствия. Сбросив ярмо наших бывших империалистических угнетателей раз и навсегда, гордая Гаитянская республика теперь может беспрепятственно идти в своём стремлении привести наш островной дом в современную эпоху. Поскольку националистические группы успокоены нашими недавними антиамериканскими действиями, а фермеры удовлетворены своими новыми реформами, похоже, была достигнута краткая атмосфера мира, и наша администрация теперь стремится обеспечить, чтобы это спокойное состояние сохранилось, пока нация продолжает свою повестку дня."
haiti.2.d.facilities: "Поскольку наши недавние реформы системы образования идут гладко, особенно в отношении нашей сельскохозяйственной программы благодаря ранним успехам SNPAER, и поскольку последние из бывших американских объектов полностью отремонтированы, похоже, нашей гордой республике удалось достичь нового чувства нормальности вопреки нашей обычно бурной истории. Продолжая расследования наших проблем, которые заказали янки, и интегрируя недавно переделанную инфраструктуру непосредственно в государственный аппарат, мы сможем продолжить с того места, на котором они остановились, и дальше продвигать Гаити в двадцатый век. Хотя наша конфискация этих старых американских активов сильно потревожила как националистических, так и социалистических радикалов, которые рвутся в бой, спокойный мир всё же был установлен. Теперь текущему режиму предстоит поддерживать эту атмосферу спокойствия, иначе Гаити снова рухнет в огонь ненормальности."
haiti.2.a: "Хотя некоторые всё ещё сомневаются в нашей работе, мы будем defiantly идти в нормальное будущее."
haiti.2.b: "С достижением нормальности великое Гаитянское государство может смотреть в своё будущее без страха."

haiti.3.t: "Интеграция иезуитских школ"
haiti.3.d: "Пока наше правительство занимается реформированием практически несуществующей системы образования Гаити, неизбежный вопрос о том, что делать с различными иезуитскими школами, разбросанными по гаитянскому ландшафту, наконец, встал в полный рост. Эти школы, управляемые Обществом Иисуса, являются одним из немногих мест, где гаитянин может получить качественное образование, однако они также отравляют умы нашей молодёжи римским католицизмом. Хотя большинство населения - католики, вопрос о том, что делать с этими школами, является высоко спорным в коридорах власти. Многие с католическими наклонностями желают, чтобы мы начали публично финансировать иезуитские школы. Они утверждают, что при публичном финансировании не только распространится их хорошая работа, но и основные гаитянские ценности, проистекающие из католицизма, распространятся вместе с хорошим образованием. Секуляристы и многие левые члены нашего правительства выступают за национализацию школ, возможно, сохранив тот же персонал, но выбросив любое упоминание о католицизме или религии вне исторических и культурных ссылок. Третий вариант, который почти никто не поддерживает, - просто игнорировать иезуитские школы и сосредоточиться на создании хорошей системы публичного образования, сэкономив время и деньги в процессе."
haiti.3.a: "Консерваторы правы, иезуиты должны финансироваться государством!"
haiti.3.b: "Левые правы, только светская школьная система подходит для нашего свободного Гаити."
haiti.3.c: "Иезуитские школы - пустая трата времени! Нам нужно сосредоточиться на создании наших собственных школ!"

haiti.4.t: "Неколебимая система"
haiti.4.d: "Когда солнце садится над эпохой американской оккупации, для нашего государства восходит новая заря. Диссиденты разгромлены, законодательный орган и палата полностью обездвижены, и Гаити стоит гордое и единое впервые за десятилетия. Недавние реформы президента Борно помогли ему консолидировать свою власть, одновременно куя общее чувство национального единства, подобно тому как кузнец закаливает хорошую сталь. После правления более десяти лет президент Борно наконец правит твёрдо и уверенно, и наконец без повторения приказов иностранца. Гаити будет идти в своё новое будущее беспрепятственно как для критиков, так и для янки. Хотя нынешний спикер оппозиции продолжает накапливать влияние, а число социалистов и националистов растёт с каждым днём, наше стойкое государство не склонится перед лицом этих дураков. Гаити марширует дальше!"
haiti.4.a: "Фундамент из бетона и стали выкован. Наш режим не дрогнет."

haiti.5.t: "Стабильная система"
haiti.5.d: "Когда мы выходим из тёмного века, которым была американская оккупация, мы оглядываемся на то, как далеко продвинулось Гаити за такое короткое время. С наступлением 1936 года мы только что сбросили оковы американского угнетения, в то время как гаитянский народ чахнул под дряхлым и разлагающимся авторитарным президентством. Однако с недавними сдвигами президента Борно в сторону демократических идеалов это увядание начало исправляться, поскольку свежий рост республиканизма снова пустил корни на нашем острове. Поскольку наши первоначальные реформы идут splendidly, правительство Гаити не было таким чистым и добродетельным десятилетиями, и мы, гаитяне, с wonder смотрим на нашу новую судьбу - освещённую сиянием демократии. Последние приготовления должны быть спланированы и завершены, но до тех пор, пока честные и свободные выборы наконец не вернутся на наш островной рай, осталось недолго."
haiti.5.a: "Гаитянская весна расцвела. Истинная демократия в пределах досягаемости."

haiti.6.t: "Лицо для гаитянского центра"
haiti.6.d: "Поскольку Гаитянская республика хорошо вернулась на путь нормального демократического функционирования, а большая часть наших прошлых проблем, преследовавших легитимность нашего режима, теперь решена, снова назначены свободные и честные выборы. По мере приближения назначенной даты либерально-консервативная коалиция, служащая основой Либеральной партии, должна теперь выбрать официального кандидата для выдвижения. Этот выбранный кандидат станет лицом нашей разнообразной коалиции на годы вперёд, и поэтому выбор должен быть сделан с некоторой тщательностью и справедливостью. Таким образом, внутри нашей партии будут проведены внутренние выборы, чтобы определить, кто поведёт нашу партию в гонке за президентство Гаити.\n\nОсновные кандидаты в гонке следующие. Представляя либеральное крыло коалиции, выступает академический титан гаитянского национализма и один из главных основателей нуаризма наряду с другими, такими как Бруар, а также эксперт по негритуд и другим чёрным академическим и политическим движениям - Жан Прайс-Марс. Ориентированные на бизнес центристы вместо этого выдвинули Луи Дежуа, видного промышленника и сахарного магната, сосредоточенного на том, чтобы привести экономику Гаити в современную эпоху и на мировой рынок. Консерваторы выдвинули двух кандидатов: правую руку бывшего президента Луи Борно и ярого антиамериканского лидера мулатов Стенё Венсана, а также ведущее лицо мулатской элиты Эли Леско, который возглавляет умирающую проамериканскую фракцию консерваторов. Наконец, крошечное прогрессивное крыло коалиции вместо этого выдвинуло Дюмарсе Эстиме, который исповедует свою собственную смутно технократическую идеологию, называемую эстимизм, которая выступает за прогрессивный национализм, коллаборационизм с буржуазией, политику централизации, национализацию ключевых отраслей и обширные либерализационные меры, направленные на экономику, всё в надежде заманить часть населения Гаити обратно с крайне левого фланга. Кто будет избран, чтобы вести коалицию вперёд?"
haiti.6.a: "Жан Прайс-Марс, либеральный титан и отец гаитянского афроцентризма."
haiti.6.b: "Луи Дежуа, видный промышленник и сахарный магнат."
haiti.6.c: "Стенё Венсан, гордый мулатский государственный деятель и пламенный антиамериканский консерватор."
haiti.6.e: "Эли Леско, проамериканский консерватор и мулатский элитист."
haiti.6.f: "Дюмарсе Эстиме, прагматичный националист и прогрессивный компромиссатор."

haiti.7.t: "Свободные выборы возвращаются на Гаити"
haiti.7.ds: "Впервые за более чем два десятилетия в Гаитянской республике снова проводятся свободные и честные выборы. Наконец, демократически звучащее название нашей нации больше не будет ложью, поскольку истинная власть снова вверена народу. Поскольку все партии были объявлены законными до начала кампании, ожидается, что доминирующая социалистическая коалиция победит, но социал-демократы или либералы могут легко воспользоваться разобщённостью среди крайне левых, чтобы захватить победу. Это гонка любого, и когда последние голоса подсчитаны, похоже..."
haiti.7.dns: "Впервые за более чем два десятилетия в Гаитянской республике снова проводятся свободные и честные выборы. Наконец, демократически звучащее название нашей нации больше не будет ложью, поскольку истинная власть снова вверена народу. Поскольку запрет на социалистические партии всё ещё действует, гонка за президентство сводится к двум основным исходам: либо победа либералов, либо социал-демократов. С поступлением последних голосов гонка вот-вот будет объявлена, и, похоже, что..."
haiti.7.a: "Синдикалистская партия, большая коалиция левых экстремистов, победила."
haiti.7.b: "Социал-демократическая партия побеждает, смещая нас к розовой креольской демократии."
haiti.7.c: "Либеральная коалиция побеждает, цементируя наши капиталистические корни."
haiti.7.e: "Статус-кво сохраняется, и старый режим остаётся."

haiti.8.t: "Легализация политических партий"
haiti.8.d: "Долгие годы политические партии были официально запрещены в гаитянской политике, их члены вместо этого организовывались в группы, действующие вне официальной политической сцены. При таком устройстве эти партии активно распространяют свои идеалы и наращивают свою силу, но не могут фактически участвовать в какой-либо правительственной деятельности. Это должно быть исправлено, если мы хотим построить функционирующую демократию. Мы предложили амнистию их членам и объявили все ранее запрещённые партии теперь законными, от националистических нуаристов, вдохновлённых панафриканизмом и движением негритуд, до марксистских синдикалистов и других различных левых групп. Однако, шокирующе, нуаристы отказались от нашего приглашения, решив вместо этого продолжать работать вне официальной системы. Остальные партии, от социалистов до консерваторов, объединились в полуофициальную коалицию, повторяя своё предыдущее сотрудничество в качестве независимых организаций. С этим шагом Гаити приближается к демократии."
haiti.8.a: "Политическая свобода и самовыражение возвращаются на Гаити."

haiti.9.t: "Уничтожение инакомыслия"
haiti.9.d: "Режим нашего нынешнего президента существует уже более десяти лет и выживал только чудом, даже при «поддержке» американцев. Теперь, когда они ушли, мы не можем позволить, чтобы в наших рядах сеялись раздоры, ибо наш режим слишком уязвим и хрупок, чтобы выдержать гораздо больше злоупотреблений. Из-за нашего временного фасада силы мы нанесём удар по поджигателям и критикам, которые годами высмеивали и ridiculed режим Борно. Газеты и радиостанции будут подвергнуты цензуре, офисы и убежища разграблены, а известные или сильно подозреваемые предатели будут арестованы en masse; не будет передышки. Каждый из этих врагов государства будет гнить в тюремных камерах нашей нации или будет вынужден трудиться на наших полях в качестве покаяния за свои действия, а если кто-то откажется сдаться мирно, их встретит только быстрая и истинная справедливость. Мы больше не будем терпеть этих критиков и недоброжелателей."
haiti.9.a: "Открытые враги государства больше не будут разгуливать на свободе, изливая свою ложь о нашей великой администрации."

haiti.11.t: "Статус законодательного органа"
haiti.11.d: "Всего несколько недель назад американская оккупация, которая душила нашу нацию двадцать лет, рухнула, казалось, в одночасье, когда американцы, пошатнувшись перед лицом Чёрного понедельника, бежали домой, чтобы сократить расходы. С уходом наших кукловодов президент Борно остаётся лидером республики, его нити наконец перерезаны его хозяевами. С толпами разгневанных социалистов, националистов и республиканцев, осуждающих нашу администрацию каждый день, и со всё большей частью нашего населения, разочаровывающейся в нашем правлении, Гаити и его законодательный орган стоят на перепутье. Свободные править, как мы считаем нужным, и с тем, что законодательный орган впервые за два десятилетия снова обретает власть, должен быть сделан выбор: удвоить наши авторитарные методы, распустив палату, и одновременно стремиться к подъёму гаитянского народа, или мы можем снова дрейфовать к демократическим принципам, постепенно переходя к демократическому будущему. В то время как сохранение нашей власти и отстранение законодательного органа на второй план успокоит многих в недавно популярных движениях нуаризма и негритуд, а также более консервативных республиканцев, остающихся в умирающих консервативных партиях, это также неизбежно вызовет ещё больше ненависти со стороны различных социалистических групп, популярность которых взлетела с момента прибытия янки. Альтернатива не более универсально популярна, и дрейф к демократии и реформа совета, несомненно, разозлят эти традиционалистские и националистические группы, поскольку единственные конкурентоспособные партии имеют по крайней мере лёгкий левый уклон. Независимо от того, куда мы приведём законодательный орган, мы будем ходить по стеклу, пока наши многие проблемы не будут решены... или пока мы не рухнем под их тяжестью."
haiti.11.a: "Заново наделить властью законодательный орган и реформировать совет."
haiti.11.b: "Распустить палату, чтобы предотвратить любые препятствия для нашего правления."

haiti.12.t: "Коффее-марк"
haiti.12.d: "В попытке привлечь внимание немецких инвесторов правительство [HAI.GetLeader] начало новую программу под названием «Проект Koffeemark». Программа проста по сути, но то, как она будет осуществляться, должно быть наиболее привлекательным. По сути, весь проект заключается в резком снижении тарифов, налогов и тому подобного, чтобы привлечь новых инвесторов в нашу кофейную промышленность. Однако, чтобы привлечь внимание немецких инвесторов, правительство создаёт серию «зон коффее-марка», в которых немецкая марка является признанной валютой, а немецкий язык - единственным разговорным языком. Хотя этот шаг... странный, мягко говоря, [HAI.GetLeader] надеется, что он привлечёт достаточно внимания, чтобы инвесторы Кайзеррейха заинтересовались нетронутой экономикой Гаити."
haiti.12.a: "Действительно странный шаг."

haiti.13.t: "Истинно гаитянский HASCO"
haiti.13.d: "Среди различных реликвий американской оккупации стоит HASCO, или Гаитяно-Американская сахарная компания - монолит, воплощающий иностранное влияние, которое веками извращало сахарную промышленность на Эспаньоле. Продолжая очищать чёрную отметину, оставленную оккупацией на нашей нации, мы реформируем и переименуем HASCO, чтобы она действительно работала только на интересы Гаити. Конгломерат переименован в HSCO, сбрасывая влияние янки в наших сельскохозяйственных предприятиях. Государство возьмёт на себя общее управление, а части компании будут проданы и приватизированы по частям коренным гаитянам по мере появления возможностей. Сахарная промышленность Гаити теперь может свободно дышать и расширяться в своём собственном темпе, наконец свободная от оков иностранных связей."
haiti.13.a: "Новая и улучшенная HSCO сбросит скорлупу своего американского прошлого и отныне будет работать исключительно на гаитян."

haiti.14.t: "Ряд миллионеров"
haiti.14.d: "В дополнение к своим оккупационным силам американцы также привезли с собой граждан янки, стремящихся использовать наш остров в своих различных целях. Самые богатые из этих иностранцев поселились в шикарном районе из высококлассных домов и квартир в Порт-о-Пренсе, со временем получив прозвище «Ряд миллионеров» из-за привлекаемых ими феерически богатых жильцов. Они принесли с собой не только свои непомерные состояния, но и свою расовую нетерпимость, установив форму сегрегации в районах, где они жили, которая поддерживалась как коррумпированной полицией, так и американскими морскими пехотинцами.\n\nТеперь, когда их благодетели и защитники ушли, те, кто остался вместо того, чтобы бежать с оккупационными силами, отчаянно нуждаются в оливковой ветви. Мы приблизимся к этим элитам и заручимся их поддержкой, как финансовой, так и политической, чтобы позволить этим дуракам заплатить нации, которая укрывала их так долго. Однако мы должны быть осторожны, чтобы эти благодетели не стали нашими следующими повелителями, поэтому они будут на коротком поводке."
haiti.14.a: "Вчерашний угнетатель - сегодняшний прихвостень."

haiti.15.t: "Достижение финансовой независимости"
haiti.15.d: "С каждым иностранным благодетелем или «строителем цивилизации», который прибывает на наши берега, чтобы вести дела на наших землях, гордость, независимость и экономика гаитянского народа отмечаются очередным чёрным пятном, и каждое пятно ещё больше низводит нас до простой экономической площадки других мировых держав. Это кончается сейчас! Под множеством новых финансовых реформ, от новых тарифов и торговых политик до новых законов об иностранной собственности и других новых политик, все чёрные ходы, используемые этими стервятниками, будут запечатаны, и вместе с этим откроются ворота к нашей финансовой независимости. Гаити больше не будет просто перевалочным пунктом в центре Карибского моря; наступит новая эра экономической свободы, и наша островная нация будет служить маяком для этой новой эры. Гаитянская экономика теперь будет работать на гаитян, наполняя наши карманы вместо карманов жирных толстосумов за океаном."
haiti.15.a: "Мы разорвём привязи, которые связывают нас, и вырвемся на свободу на мировой рынок."

haiti.16.t: "Рефинансирование долга"
haiti.16.d: "Гаити имеет сомнительную честь быть обычно беднейшей нацией в Северной Америке. Даже с умеренно успешными экономическими реформами Борно и «помощью» американцев наша островная нация всё ещё существует в полной нищете, и лишь немногие привилегированные элиты могут подняться из грязи, опутывающей экономику нашей нации. Часть этой нищеты проистекает из нашего огромного долга. Впервые накопившись после нашей революции против Франции, наш долг только продолжал расти по мере того, как всё больше «благодетелей» одалживали нам деньги или помощь. Хотя большая часть долга Франции была выплачена за многие десятилетия после нашей первоначальной революции против империализма, мы всё ещё должны большие суммы денег Соединённым Штатам за оккупацию и, в меньшей степени, Кайзеррейху, особенно за платежи, причитающиеся немецким кофейным баронам и судоходным капитанам HAPAG. Наша администрация решила связаться с нашими кредиторами и рефинансировать наш долг, чтобы снизить наши платежи и процентные ставки до более благоприятного уровня. Это позволило бы нашему режиму переоценить и реорганизовать наше невероятно хаотичное экономическое положение в менее ужасной и угнетающей ситуации."
haiti.16.a: "Мы обратимся к нашим щедрым кредиторам и попросим более справедливую сделку."

haiti.1600.t: "Гаити ищет рефинансирование долга"
haiti.1600.d: "Поскольку разрушения Чёрного понедельника и Великой депрессии сеют хаос в нашей собственной экономике и экономиках наших соседей, множество просьб о финансовой помощи достигли наших берегов. Среди более интересных предложений поступило из Порт-о-Пренса, где правящая администрация Борно управляла Гаити десятилетиями при поддержке США. Они спросили, не согласимся ли мы сесть за стол переговоров и пересмотреть их давний долг нашему правительству, стремясь к более приемлемым условиям и менее экстремальным процентным ставкам, поскольку они стремятся к дальнейшему восстановлению своей зарождающейся экономики. Хотя мы больше не правим Гаити официально, с окончанием оккупации в 1935 году, их финансовая сила всё ещё может быть полезна для нашего государства и наших сохраняющихся деловых и военных интересов, которые всё ещё остаются на Эспаньоле. Как нам ответить?"
haiti.1600.a: "Мы должны снять эти санкции, если Гаити когда-либо действительно захочет процветать."
haiti.1600.b: "Почему нас должно волновать положение каких-то гаитян? Отказать в их просьбе!"

haiti.1601.t: "Наш «благодетель» отвечает"
haiti.1601.d: "Наши «благодетели» в Вашингтоне ответили на нашу просьбу о рефинансировании неохотным согласием. Они согласились сесть и разработать более приемлемые условия с нашей администрацией. С их помощью экономика Гаити может вырваться к процветанию, поскольку сокрушительный вес нашего долга больше не душит жизненную силу наших финансов. Хотя нам ещё многое предстоит выплатить, условия и процентные ставки гораздо более реалистичны для нашей скромной, но амбициозной экономики."
haiti.1601.a: "Фантастика! Наша экономика вздыхает с облегчением, когда это бремя уменьшено."

haiti.1602.t: "Наш «благодетель» отвечает"
haiti.1602.d: "Наши «благодетели» в Вашингтоне ответили на нашу просьбу о рефинансировании сокрушительным и решительным отказом. С их отклонением нашей просьбы о переговорах угнетающий и удушающий долг будет продолжать душить экономику нашей нации. Хотя это не будет смертельным ударом по нашим амбициям, экономическое влияние, которое это окажет на наши финансы и промышленность, будет заметным и crippling на некоторое время."
haiti.1602.a: "Проклятье этих экономических империалистов! Мы должны найти другой выход из нашей финансовой ямы."

haiti.17.t: "Поддержка частного банковского сектора"
haiti.17.d: "С момента американской оккупации и подъёма режима Борно большая часть капитала на Гаити была централизована в руках BRH, или Banque de la République d'Haïti, который является единственным национальным и управляемым гаитянами банком нашей нации. Другие банки, которым было разрешено продолжать работу, - это банки, работающие на иностранном капитале из Америки, Германии и Франции. Чтобы восстановить некоторое доверие к нашему режиму в глазах общественности, одновременно позволяя экономический рост, мы должны начать работать более открыто с этими частными банками. Это не только позволит большему количеству капитала поступать в нашу экономику, успокаивая людей, но и снимет большую часть напряжения и финансового бремени управления государством с наших плеч, резко сократив наши расходы. С частными банками, работающими в унисон с BRH, финансовое будущее Гаити приближается к процветанию."
haiti.17.a: "BRH больше не должен быть единственным управляемым гаитянами банком на острове."

haiti.18.t: "Переговоры с HAPAG"
haiti.18.d: "Hamburg Amerikanische Packetfahrt Actien-Gesellschaft, или более известная как HAPAG, является доминирующим игроком в международных и региональных перевозках в водах, окружающих наши острова. Сделав наше родное море своим «Карибским озером», некогда успешная, но сравнительно небольшая компания превратилась в монолитную монополию с тех пор, как их страна-покровитель вышла победителем из Мировой войны. Находясь на вершине мировой иерархии как одна из крупнейших судоходных компаний на Земле, доминирование HAPAG на Гаити никогда не было сильнее, а их влияние и контроль над нашей экономикой продолжают расти с каждым успешным маршрутом или заказом, который они выполняют. Слишком большая и слишком хорошо поддерживаемая, чтобы мы осмелились противостоять ей напрямую, мы должны применить более дипломатический подход, чтобы достичь наших целей. Мы встретимся с главными исполнительными директорами HAPAG в регионе и разработаем сделку, которая устроит обе стороны. Нам понадобится по крайней мере доступ к их портам, докам и другой морской инфраструктуре, если мы когда-нибудь достигнем какой-либо видимости самодостаточности и экономического роста в этой нации."
haiti.18.a: "Мы должны заключить сделку с этими иностранцами, чтобы обеспечить экономическое будущее нашей республики."

haiti.19.t: "Разбирательство с нелояльными назначенцами"
haiti.19.d: "Когда мы начинаем внедрять наши различные экономические реформы, становится всё более ясно, что уже принятые реформы блокируются. В то время как на бумаге мы, возможно, начали менять и заряжать нашу экономику, на местах, однако, ничего не изменилось. После расследования соответствующими властями выяснилось, что ряд бюрократических чиновников во всём - от военных до отдела образования - делают всё возможное, чтобы отменить наши реформы. Хотя они не организованы и сильно разделены идеологически (в основном радикалы, даже несколько американских приверженцев), они всё ещё представляют огромную угрозу для любого прогресса. Чтобы справиться с этим, [HAI.GetLeader] санкционировал великую чистку для борьбы с этими смутьянами. Форма чистки будет..."
haiti.19.a: "...серия увольнений, ничего слишком радикального."
haiti.19.b: "...серия увольнений с несколькими тюремными сроками, чтобы люди знали, что мы настроены серьёзно."
haiti.19.c: "...серия увольнений с несколькими тюремными сроками и парой казней. Мы не можем терпеть инакомыслие в правительстве."

haiti.20.t: "Вырывание контроля над сахарной промышленностью"
haiti.20.d: "С нашим решением наконец разобраться с империалистами, которые так долго держали Гаити под своей железной хваткой, Революционное правительство решило, что одной из наших первых целей станет сахарная промышленность. С самого основания нашей нации гаитянская сахарная промышленность принадлежала иностранным империалистам, европейским толстосумам, которые сидят в своих особняках, потягивая чай, подслащённый плодом пота рабочего. Это не будет продолжаться дольше! С сего момента все сахарные плантации подлежат национализации и возвращению их законным владельцам! Больше не будет Белый человек угнетать наш народ, больше не будут толстосумы пожинать то, что не сеяли. Скоро рабочие будут потягивать чай, подслащённый их собственными плодами! Что касается самих землевладельцев, они получат свою справедливую награду; они будут работать, пока не упадут замертво, работая в шахтах, в полях, выращивая сахар, который они использовали, не думая о тех, кто выращивал его для них."
haiti.20.a: "Тот, кто контролирует сахар..."

haiti.21.t: "Разрушить коалицию"
haiti.21.d: "Теперь, когда все или большинство политических партий могут свободно участвовать в выборах и цветы свободной демократии снова распускаются на нашем островном доме, наш режим приступил к полному демонтажу нынешней и давней коалиции левых, либералов и даже некоторых из немногих оставшихся и быстро умирающих консервативных партий, которые объединились перед лицом американского вмешательства и сползания Гаити в мягкий авторитаризм. С разрушением коалиции входящие в неё партии - от максимистских и сорелианских фанатиков до умеренных либералов и даже редких консерваторов, которые ещё не покинули свои партии ради растущих националистических организаций, - теперь могут преследовать свои собственные политические цели. Хотя лишь горстка партий действительно имеет шанс на победу в реальном избирательном цикле, эта атмосфера политической свободы - ещё один шаг на пути к стабильной и свободной системе."
haiti.21.a: "Из пепла коалиции на Гаити может процветать истинная политическая свобода и разнообразие."

haiti.22.t: "Культурная индустрия"
haiti.22.d: "Хотя мы должны устремиться в индустриализированное и современное будущее, мы никогда не должны забывать наше наследие. Гаитянская идентичность и культура уходят корнями в те времена, когда первые корабли с белыми парусами прибыли на этот остров, и даже раньше - в наши коренные корни здесь и нашу африканскую кровь с родного континента. Даже когда мы возводим великие города и фабрики и наполняем воздух чёрным дымом, или когда мы пашем эти поля эффективно и для пропитания, а не из жадности, мы никогда не должны отклоняться от идентичности, которую мы взращивали и строили поколениями. Она будет вплетена в нашу архитектуру, нашу политику, наши коммуны. Она будет эхом раздаваться на каждой фабрике и в каждой шахте. О ней будут петь гимны, когда наш народ будет работать в полях, которыми теперь все владеют. Наши традиции никогда не должны быть забыты; мы - креолы, мы - африканцы, мы - коренные, мы - гаитяне."
haiti.22.a: "Наша культура - это наша идентичность, она станет основой нашей новой экономики."

haiti.23.t: "Разгром кофейных баронов"
haiti.23.d: "Наш невероятно плодородный остров является домом для многочисленных плантаций и обширных полей товарных культур, простирающихся по всему ландшафту, но при всём том, сколько земли они используют и сколько прибыли получают, очень мало, если вообще что-то, доходит до гаитянского народа. Эта практика продолжается веками, будь то угнетатели - испанцы, французы или американцы, и ни одна из выгод не попадает в руки самих гаитян, за исключением нашей краткой передышки свободы благодаря Туссену Лувертюру и его героизму. В настоящее время главные нарушители - богатые гаитяне и оставшиеся американские и европейские землевладельцы, достаточно глупые, чтобы остаться в наших границах, а на вершине их иерархии находятся кофейные бароны. Производство кофе, наряду с сахарным тростником, сизалем и хлопком, составляет основную массу всех культур, выращиваемых на Гаити, что приводит к тому, что голод является постоянным риском для многих, несмотря на огромные площади земель, отведённых под выращивание культур. Чтобы отрубить голову этой змее, как говорится, наша новая администрация, отстаивающая волю гаитянского народа, нанесёт удар по этим кофейным баронам, которые сидят на вершине, и устранит их из уравнения наших проблем. Когда они будут свергнуты, их земли конфискованы правительством для национализации, а их активы перераспределены народу и в правительственные фонды, мы вернём столетия репараций одним махом."
haiti.23.a: "Эпоха кофейных баронов и их эксплуатации подошла к концу."

haiti.24.t: "Сломать империалистическую удавку"
haiti.24.d: "С ошеломляющей победой левой политики, освободившей рабочих и фермеров нашего бедного островного дома, пришло время нанести ответный удар нашим угнетателям. Американская оккупация унизила наш народ и обесчестила нас без меры, поэтому теперь мы должны восстановить эту гордость. Чтобы мотивировать людей вернуть то, что было у них украдено, наша администрация постановила, что все истинные красные сыновья и дочери Гаити могут нанести ответный удар нашим бывшим хозяевам-марионеткам без возмездия со стороны нашего государства. Кроме того, были спланированы новые государственные меры против крупнейших остатков американского влияния, обещающие вычистить эти крысиные гнёзда янки-мерзости, одновременно перераспределяя захваченные активы народу или припрятывая их в фонды для будущих государственных проектов. С этим объявлением многие из оставшихся американских и европейских администраторов и элит, достаточно глупых, чтобы задержаться здесь так надолго, бежали, а немногие оставшиеся столкнулись с гневом нашего народа. Отпечаток империализма будет навсегда стёрт с нашей нации."
haiti.24.a: "Мы больше не марионетки."

haiti.25.t: "Благоволить городским синдикатам"
haiti.25.d: "С победой гаитянского пролетариата над буржуазией и их империалистическими покровителями наконец пришло время для построения социализма на Эспаньоле. Однако есть небольшое препятствие на пути к справедливой воле трудящихся. Сказать, что на Гаити не хватает городского населения, значит ничего не сказать, и хотя рабочие действительно возглавляют наше новое общество, их число невелико и разрозненно. Поэтому, чтобы одновременно увеличить наше городское население и количество рабочих на тех немногих фабриках, которые у нас есть, был разработан гениальный план. Принята серия реформ, в первую очередь множество налоговых льгот, чтобы склонить сельское население к переезду в города. Кроме того, уже существующим рабочим синдикатам было предоставлено большое количество власти и автономии, чтобы наконец поставить трудящегося человека во главе собственной промышленности. Также началась кампания по организации других синдикатов. Медленно, но верно гаитянский рабочий выкопает себя сам и построит сияющий маяк славы социализма для всего мира."
haiti.25.a: "Благоволить Порт-о-Пренсу!"
haiti.25.b: "Благоволить всем нашим городам!"

haiti.26.t: "Эффективная гражданская повинность"
haiti.26.d: "Гражданская повинность, или принуждение граждан к обязательному труду на государство, имеет долгую историю на Гаити. Даже забывая о наших корнях в работорговле, после обретения независимости от Франции коренные гаитяне всё ещё привлекались новым правительством во главе с чернокожими к выполнению тяжёлого труда, который когда-то выполняли рабы. Хотя для некоторых это может иметь моральные сложности, наше государство смотрит на это иначе. Это часть нашей истории, нашей культуры, а также основа любого стабильного и процветающего гаитянского государства. Несмотря на его долгую историю здесь, это ужасно неорганизованное и ужасное дело, которое необходимо модернизировать и сделать эффективным. Были приняты новые реформы, чтобы не только обеспечить этим принудительным работникам лучшие и более безопасные условия, но и призвать гораздо больше из них для использования нашим государством, в первую очередь из числа многих преступников, заполняющих наши тюрьмы, или других отбросов нашего общества. Это будет их путь к искуплению и наш способ получения бесплатного труда для лучшего удовлетворения потребностей нашей быстрорастущей экономики."
haiti.26.a: "Это их долг - служить."

haiti.27.t: "Реконструкция CFC"
haiti.27.d: "Chemins de Fer de la Caraïbes, или CFC, - крупнейшая железнодорожная линия в стране; наследие французского империалистического режима. После их ухода с нашей революцией более века назад она получала расширения от немцев, французов и американцев - всё в мелких попытках дальнейшей эксплуатации и экономического империализма. Поскольку эти угнетательские режимы больше не заправляют в нашей стране, у нас есть возможность реконструировать CFC и создать истинно гаитянскую железную дорогу. Будут использоваться новые современные локомотивы, а новейшие достижения в железнодорожных и локомотивных технологиях будут импортированы для нашего собственного использования, а также позволят нашим учёным и инженерам попытаться воссоздать их достижения для наших собственных целей в будущем. Этот новый CFC поднимется из пепла империализма и перенесёт гаитянский народ в современность!"
haiti.27.a: "Все пути приведут в Порт-о-Пренс."

haiti.28.t: "Быстрая электрификация"
haiti.28.d: "Гаити не хватает многих вещей, к которым привыкли большинство других народов Северной Америки в этот современный век, но самым вопиющим недостатком является абсолютное безобразие гаитянской электрической сети. Поскольку регулярный доступ к электричеству имеют менее половины населения страны, а постоянное электричество лишь иногда возможно в крупнейших городах страны, значительная часть нашего населения живёт в темноте, полагаясь на более архаичные методы для освещения, охлаждения или консервации, приготовления пищи и многих других повседневных дел. Это необходимо немедленно исправить! Благодаря нашему изобилию древесного угля, а также небольшому количеству обычного угля, природного газа и нефти, которые мы получаем по торговле, мы должны приложить согласованные усилия, чтобы навсегда осветить ночное небо Гаити. С электричеством приходит прогресс!"
haiti.28.a: "Если мы хотим быть современной нацией, наш народ больше не может жить в тени."

haiti.29.t: "Покончить с одержимостью древесным углём"
haiti.29.d: "Древесный уголь - или charbon на местном креольском диалекте Kreyòl Ayisyen - является одной из важнейших отраслей промышленности на Гаити, поскольку из-за нашей критической нехватки запасов природной нефти сжигание древесного угля составляет почти всё производство энергии по всей стране. Чтобы удовлетворить эту безудержную потребность в древесном угле, на острове были посажены огромные рощи мескитового дерева, нима и кассии, потребляющие ценную, дефицитную свободную землю с каждым посеянным семенем. Хотя идеально срезать выше корней, чтобы дерево могло отрасти заново, более быстрая практика поджигания целых рощ сразу получила распространение, создавая большие объёмы пригодного для использования древесного угля, который можно дополнительно высушить и вылечить после сбора за короткий промежуток времени. Эта практика делает большую часть земли, которую она оставляет после себя, непригодной для обработки в течение довольно долгого времени, постепенно уничтожая пахотные земли, а также дополнительно ускоряя обезлесение, поскольку новые земли должны быть расчищены, пока старые восстанавливаются, или когда эти пожары выходят из-под контроля и распространяются на немногие оставшиеся девственные рощи Гаити. Эта безрассудная практика должна быть запрещена и немедленно прекращена, чтобы позволить лесам нашей страны восстановиться, вместо этого заменена более устойчивым методом срезания выше корня, пока не будет найден лучший альтернативный источник топлива в достаточном количестве."
haiti.29.a: "Мы не должны уничтожать красоту нашей страны в погоне за краткосрочной экономической выгодой."

haiti.30.t: "Принять нуаристскую мысль"
haiti.30.d: "Влияние движения нуаризма широко ощущается по всему Гаити, поскольку оно пузырится из множества источников, включая различных левых по всему спектру, таких как Жозеф Жолибуа Фис, Даниэль Финьоле и Эмиль Румер, либералов, таких как Жан Прайс-Марс и синкретист Дюмарсе Эстиме, и, конечно, националистов, таких как Кловис Дезинор или Карл Бруар и его протеже Франсуа Дювалье и Лоример Деннис. Движение представляет собой странное слияние панафриканизма, национализма и популизма с расовыми коннотациями с сильно различающимися идеологическими основаниями и глубоким презрением к империализму и европейско-мулатской культуре, которая угнетала афро-гаитян на протяжении веков. Этот интенсивный синтез различных идей уникален для нашего островного дома и быстро стал одним из доминирующих философских, художественных и политических движений в стране. Идеалы, отстаиваемые нуаристами - особенно теории нуаристского экономиста Кловиса Дезинора, - должны быть расширены, чтобы сформировать основу для нашей новой экономической системы, поскольку мы стремимся построить экономику, полностью ориентированную на благо в основном бедных афро-гаитян, составляющих подавляющее большинство нашего населения, хотя более либеральные течения также стремятся построить сильный чёрный средний класс, в то время как националисты тайно разделились в вопросе выполнения этого популистского обещания или использования его в своих коррумпированных интересах, поскольку они продолжают молча спать с крупным иностранным бизнесом. Независимо от этого, под влиянием нуаризма мы будем дрейфовать всё дальше и дальше в сторону популистской экономики, основанной на расовом признаке; экономики, которая, по крайней мере на бумаге, протягивает руку помощи афро-гаитянам, а не гнусным белым и заблудшим метисам, которые так долго вели экономику нашей страны к элитарному гниению и вместе с этим душили истинный гаитянский народ."
haiti.30.a: "Мы протянем руку помощи всем нуждающимся истинным гаитянам. Вместе мы построим лучшее, более чистое государство."
haiti.30.b: "С другой стороны, возможно, нам стоит держаться на расстоянии..."

haiti.31.t: "Когда наши отцы разорвали свои цепи..."
haiti.31.d: "Чуть меньше полутора веков назад наши предки подняли кулаки в солидарности друг с другом, маршируя плечом к плечу в своей борьбе против наших старых имперских хозяев в Париже. Когда наши отцы разорвали свои цепи, это было не для того, чтобы сложить руки или смотреть и позволять своим братьям трудиться под ними! Это было для того, чтобы освободить всех гаитян и возвысить их до положения равенства. Хотя история сыграла с нашим народом злую шутку, и наша независимость была лишь временной, а истинное равенство никогда не было достигнуто, дух этих предков никогда не был забыт. Как однажды написал великий Освальд Дюран: «Свобода непостоянна без права на равенство! Чтобы с радостью вспахать эту землю, нам нужен этот строгий девиз: Бог! Труд! Свобода!» Мы заставим эти праведные слова эхом разноситься по всему нашему режиму. Истинное равенство будет даровано всем истинным сыновьям и дочерям Гаити как в экономической, так и в политической сферах, в то время как девиз «Бог! Труд! Свобода!» поможет сформировать основную философию нашего нового направления. Объединяя нашу традицию борьбы с несправедливостью с современными концепциями, такими как движения нуаризма и негритуда, мы создадим новую экономическую систему, которая наконец принесёт пользу истинным гаитянам больше всего, особенно самым угнетённым из наших родственников: афро-гаитянам. Следуя духу Лувертюра и Дессалина, Гаити будет смотреть в своё прошлое, устремляясь в будущее - будущее, в котором все истинные гаитяне смогут наслаждаться."
haiti.31.a: "...Это было не для того, чтобы сложить руки."

haiti.32.t: "Преобразование бюрократии"
haiti.32.d: "Со времён возвышения нашего красного правительства нам приходилось иметь дело с непрекращающимися препятствиями, чинимыми различными реакционными бюрократами, которые всё ещё кишат в нашей стране. Даже сейчас они стремятся сгноить основы нашей новой рабочей республики, прежде чем мы сами сможем полностью утвердиться, и эти термиты не остановятся ни перед чем, чтобы достичь своей цели - свергнуть наше государство изнутри. Этому не бывать! Все, кто занимает наши административные должности, бюрократию или управляет гражданской службой и делами государства любым способом, будут подвергнуты тщательному расследованию на предмет любых реакционных симпатий, которые они могут питать. Истинным рабочим и пролетариям нечего скрывать; бояться есть что только мошенникам и жуликам справа и буржуазии. Снизу доверху вся наша администрация будет выметена сверху донизу и очищена от любых предателей нашей славной революции, и Румен поведёт за собой!"
haiti.32.a: "Мы вырежем чёрное сердце коррупции из нашего нового режима."

haiti.33.t: "Хозяева росы"
haiti.33.d: "«Что мы такое? Раз вы задали этот вопрос, я отвечу вам. Мы - эта страна, и без нас она ничего не значила бы, совсем ничего. Кто сажает? Кто поливает? Кто собирает урожай? Кофе, хлопок, рис, сахарный тростник, какао, кукуруза, бананы, овощи и все фрукты - кто будет их выращивать, если не мы? И при всём при этом мы бедны, это правда. Нам не везёт, это правда. Мы несчастны, это правда. Но знаешь ли ты почему, брат? Из-за нашего невежества. Мы ещё не знаем, какую силу мы представляем, какую единую силу - все крестьяне, все негры равнин и холмов, все объединённые. Однажды, когда мы это поймём, мы поднимемся от одного конца страны до другого. Тогда мы созовём Генеральную ассамблею Хозяев росы, большое кумбите фермеров, и мы выметем бедность и посадим новую жизнь». - отрывок из «Хозяев росы», написанных и опубликованных председателем Жаком Руменом, переведённых на английский Лэнгстоном Хьюзом."
haiti.33.a: "Владыка Солнце! Мы, чёрные люди, приветствуем вас вихрем мотыг, высекающих яркие искры огня с неба."

haiti.34.t: "Французская модель"
haiti.34.d: "Хотя когда-то парижский режим возвышался над мировой империалистической империей, теперь он оказался лидером Интернационала и глобальной борьбы трудящихся против империализма и капитализма; ироничный поворот судьбы для наших бывших хозяев. С недавним переходом нашего государства в истинно социалистическое правительство Жак Румен, отец гаитянской революции и современного левого движения в стране, шокировал нацию и демонстративно пренебрёг прошлой ненавистью между нашими двумя народами, поскольку он начал перенимать всё больше и больше анархо-синдикалистских практик из самой Коммуны Франции. Используя их модель как руководство для построения истинного синдикализма на Гаити, амбициозные планы Румена привели бы к созданию высокоцентрализованной формы демократического синдикализма, где коммуны и рабочие синдикаты по всей стране работали бы и поддерживали свои собственные сектора внутренне, но все они обсуждали бы и голосовали бы в одном более крупном централизованном руководящем органе во главе с самим Руменом. Хотя это кажется гораздо менее «анархо» и гораздо более «синдикалистским», Румен и его фракция в Гаитянской синдикалистской партии считают, что это единственная модель, которая сработает, чтобы наконец принести как стабильность, так и процветание гаитянскому народу."
haiti.34.a: "Париж продолжает влиять на Порт-о-Пренс, как бы ни менялся мир."

haiti.35.t: "Покончить с соперничеством"
haiti.35.d: "Жёсткие и ядовитые политические соперничества издавна существовали на Гаити, ещё до того, как американцы пришли и взболтали нестабильный котёл гаитянской политики. Социалисты, либералы, консерваторы и националисты издавна спорили и дебатировали в залах нашего правительства, в то время как после окончания заседаний открыто дрались или даже убивали друг друга на улицах и в сельской глуши. Мы должны залечить этот разрыв, иначе наша нация будет разорвана в процессе. Новые искренние попытки достичь диалога между этими различными фракциями необходимы, и есть одна вещь, в которой мы все можем согласиться, чтобы начать эти необходимые мирные переговоры: Гаити для гаитян, и это должно быть сделано раз и навсегда. Американская и европейская эксплуатация нашего народа продолжается веками, делая наш народ слабым и опозоренным. Этот гнусный курс должен быть обращён вспять! Все партии и политические группы нашей страны могут согласиться с этим твёрдым фактом, и с этой общей отправной точкой будущее политическое сотрудничество и двухпартийность могут стать возможными. Макс Юдикур поведёт за собой и поможет направить эти воюющие идеологические группы к совместной работе ради построения более сильного и независимого Гаити."
haiti.35.a: "В конце концов, мы все просто хотим помочь нашему долго угнетаемому народу."

haiti.36.t: "Осуждение радикального нуаризма и гаитянский вопрос негритуда"
haiti.36.d: "Из всех наших политических врагов есть только один, которого мы не можем игнорировать или работать с ним, если хотим достичь истинного процветания на этом острове: нуарист. Эти чрезмерно ретивые националистические фанатики вызовут лишь дальнейшие проблемы, поскольку их разделительные идеи сеют рознь в наших рядах. Их сирены заманивают разочарованных как слева, так и справа, поэтому мы должны отрубить голову этому змею, прежде чем они заманят ещё больше хороших гаитян к их проклятому делу. Чтобы противостоять этой националистической сирене, президент Макс Юдикур должен выбрать один из двух планов, которые он придумал для борьбы с влиянием нуаризма. Он мог бы специально выделить самих радикальных нуаристов как источник проблемы, которые, по словам Юдикура, извращают идеи и достоинства этой в остальном здравой и уникальной гаитянской идеологии, используя нуаризм для своих собственных эгоистичных целей. Это, вероятно, разозлит радикальные националистические элементы движения справа и слева, даже в рядах его старого наставника Румена, но всё же оставит нетронутой большую часть нашей базы поддержки, состоящей из нерадикальных масс, поскольку мы по-прежнему будем поддерживать нуаризм и подобные течения как уникальное гаитянское культурное явление, очищая его от ненавистной скверны.\n\nВ качестве альтернативы Макс Юдикур также играл с идеей полностью отказаться от нашей уникальной гаитянской формы мысли - нуаризма - в пользу аналогичной идеологии, которая стремится к единству и сотрудничеству со всей франкофонной африканской диаспорой - негритуда, или «черноты». Разработанная афро-карибскими и африканскими академиками по всему франкоязычному миру, такими как Полетт и Жанна Нардаль с Мартиники, а позже расширенная с помощью мартиникского поэта Эме Сезера, сенегальских мыслителей Абдулая Саджи и Леопольда Седара Сенгора и Леона Дамаса из Французской Гвианы, эта обычно марксистская идеология отвергает колониализм, расизм, империализм, неравенство и евроцентризм, продвигая независимую и возрождённую африканскую культуру в рамках постоянных франко-африканских связей, чтобы устранить любую стигму против африканской цивилизации, одновременно поднимая африканскую диаспору до равного положения товарищества и сотрудничества с остальным миром. Хотя принципы негритуда перекликаются с аналогичными идеями, поддерживаемыми начальной Гаитянской революцией, полное принятие негритуда в пользу доморощенной альтернативы - нуаризма - разозлит многих по всему гаитянскому радикальному левому и правому спектру, как радикалов, так и нерадикалов, но это навсегда освободит наш режим от радикальной националистической скверны таких фигур, как Дювалье и Бруар, всё ещё позволяя нам освободить чёрные гаитянские массы с помощью наших африканских и афро-карибских братьев, не прибегая к отвратительному и опасному национализму. Однако некоторые ставят под сомнение приверженность Юдикура этим движениям вообще, учитывая, что он происходит из состоятельной семьи мулатов из неафриканской элиты Гаити, а другие лидеры PSP, такие как Этьен Шарлье и Антони Леспес, также имеют схожее привилегированное происхождение. Как альтернатива представлению этих движений, Юдикур также мог бы осудить или занять промежуточную позицию между нуаризмом и негритудом, вместо этого идя по более идеологически сфокусированной линии, свободной от расовых предрассудков, либо склоняясь к своему прошлому как радикальный псевдо-коммунист, вдохновлённый полусиндикалистско-марксистским синтезом, которым является де Леонизм, либо к своим более поздним склонностям как умеренный демократический социалист. Независимо от решения нашего дорогого лидера, нуаристы ещё некоторое время будут оставаться занозой в нашем боку, пока наша политика и управление не покажут этим заблудшим и блудным сыновьям Гаити путь обратно в стадо. Что выберет Юдикур?"
haiti.36.a: "Отвратительное извращение гаитянской культуры и гордости. Обратиться к негритуду."
haiti.36.b: "Хотя нуаризм страдает от националистической скверны, у него всё ещё есть свои преимущества. Осудить только радикалов."
haiti.36.c: "Занимать промежуточную позицию между обоими и склониться обратно к де Леонизму."
haiti.36.e: "Осудить оба и придерживаться умеренного демократического социализма."

haiti.37.t: "Покончить с вмешательством церкви"
haiti.37.d: "Религия невероятно распространена на Гаити, как римский католицизм, так и местные практики вуду невероятно распространены по всему нашему островному государству. Хотя сама по себе религия не является проблемой в глазах Юдикура, организованная религия становится проблемой, когда она вмешивается в дела государства. Католическая церковь приложила свой сапог и притупила умы гаитянского пролетариата с тех пор, как первые миссионеры прибыли на белоснежных кораблях несколько веков назад. С тех пор господство и влияние церкви только росли, она стала одним из крупнейших землевладельцев, не связанных с сельскохозяйственными угодьями, в стране, а также запускала свои пальцы в наши казны так часто, как только могла, под предлогом десятины и другой ненужной ерунды. Наш народ может по-прежнему иметь свои верования и посещать свои мессы, но власть Рима и остальной католической церкви над Гаити будет немедленно ликвидирована. Специальные налоговые льготы для церковной собственности и должностных лиц будут отменены, действующим священнослужителям будет запрещено баллотироваться на государственные должности или занимать правительственные посты, и государством будет проведена кампания секуляризации, чтобы очистить всё влияние церкви внутри нынешнего правительства. Пусть наш народ будет благочестив и духовен, но пусть церковь больше никогда не вмешивается в наши дела."
haiti.37.a: "Папство больше не будет эксплуатировать Гаити и его народ ради собственной выгоды."

haiti.38.t: "Профессиональная бюрократия"
haiti.38.d: "Новая и современная бюрократия потребуется, если мы хотим эффективно и надлежащим образом управлять нашим государством. Наши новые бюрократы должны быть верны нации превыше всего и будут привлекаться из лояльных государственных служащих и других проверенных работников, которые поддерживают наше правительство превыше всех остальных. Это будет происходить, пока мы активно исключаем множество радикальных групп, которые окружают нас с обеих сторон. Наша новая администрация станет оазисом спокойствия и усердия в хаотическом водовороте гаитянской политики, и мы постараемся сохранить наших новых бумагомарателей как можно более аполитичными, чтобы обеспечить их профессионализм и беспристрастность в их глубоко важной работе. Каждый из них будет отдельным винтиком в большом механизме, и поэтому каждый винтик должен быть идеально подогнан."
haiti.38.a: "Профессионализм важнее слепой лояльности."

haiti.39.t: "Гаитянский культурный ренессанс"
haiti.39.d: "Поскольку наше государство становится всё более стабильным и процветающим, на Гаити начал формироваться своего рода культурный золотой век. С акцентом на гаитянскую музыку, искусство, танец, еду, письменность, поэзию и любые другие аспекты высшего или низшего общества, этот гаитянский ренессанс начался как в салонах Порт-о-Пренса, так и в трущобах Кап-Аитьена, поднимая гаитян со всей страны и через обычные социально-экономические барьеры. Такие движения, как нуаризм и негритуд, были популярны среди многих художников и исполнителей, в то время как спиритуализм вуду и идеи «гаитинизации» также были распространены из-за их недавнего подъёма после падения американской оккупации. Пока остальной мир готовится к войне или сгорает дотла, впервые Гаити танцует ночи напролёт, как будто в мире ничего не случилось..."
haiti.39.a: "Позвать их из их домов и научить их мечтать."

haiti.40.t: "Политическое равновесие"
haiti.40.d: "Если наша мерцающая роза республики для всех гаитян должна выжить, должно быть установлено политическое равновесие. Подобно тому, как животное поддерживает гомеостаз, правительство нации также должно постоянно регулировать себя, поглощая и выпуская по мере необходимости, чтобы функционировать должным образом. С этой целью Демосфен Каликст предпринял шаги по обращению ко всем политическим партиям в нашей стране, чтобы выразить необходимость сотрудничества. То, что хорошо для нынешнего правительства Гаити, хорошо для всех гаитян, - таков его аргумент, поскольку правительство Каликста выступает за всех гаитян одинаково. Мы будем делать то, что делает организм; мы будем принимать хорошее и изгонять плохое, впитывая советы и мысли со всех сторон, чтобы Гаити могло двигаться вперёд как единое целое, а также изгоняя любые вредные или несотрудничающие элементы из уравнения. Хотя потребуется много времени и усилий, прежде чем трещины, разделяющие нас, будут восстановлены или преодолены, Каликст и его правительство усердно работают, и результаты уже начинают проявляться."
haiti.40.a: "Дом, разделённый в себе, не может устоять."

haiti.41.t: "Гаитинизация"
haiti.41.d: "Со времён подъёма и падения американской оккупации гаитянская культура быстро размывалась под сапогами американских морских пехотинцев и гаитянских предателей. С крахом режима Борно и установлением истинной демократии в нашем государстве должен быть проведён процесс «гаитинизации», чтобы стереть американскую скверну с наших земель. Английский язык перестанет звучать на нашем острове, поскольку наш собственный диалект креольского языка, Kreyòl ayisyen, возьмёт верх как главный язык нашей нации, с двойной целью вытеснить базовый французский и английский и изгнать их империалистические языки с наших земель. Гаитянский гурд будет поддерживаться, чтобы подняться выше как франка, так и доллара. Гаитянская история и культура будут преподаваться в каждом классе, вуду и местный гаитянский католицизм будут подчёркиваться, а любые другие следы наших бывших угнетателей будут по возможности стёрты с Гаити. Хотя трудности роста могут быть огромными, пока мы привыкаем к жизни самостоятельно и как свои собственные, мы никогда не должны забывать, почему мы это делаем: мы делаем это для каждого гаитянина, вынужденного трудиться, истекать кровью или умирать от рук иностранцев, для каждого раба, оставленного умирать, и каждого слуги, оставленного голодать. Мы делаем это для каждого гаити, ограбленного своего дома, своей культуры, своей истории, своей жизни. Мы делаем это для всех истинных гаитян, ибо они превыше всего заслуживают свободного и суверенного дома для себя."
haiti.41.a: "Вперёд, к истинно гаитянскому Гаити!"

haiti.42.t: "Устранить политический боваризм"
haiti.42.d: "Идеологический титан и отец гаитянского либерального движения Жан Прайс-Марс - один из самых влиятельных идеологов в стране. Одна из его уникальных идей - концепция «коллективного боваризма», которую он придумал для обозначения небольшой, но arrogant группы элит смешанной расы, состоящей в основном из богатых землевладельцев европейского происхождения. Эти богатые неряхи сидят на вершине иерархии Гаити, в то время как более 90% нашей страны имеют африканское происхождение. Афро-гаитяне должны быть возвышены и получить голос и власть, в то время как эти ложные сыновья Гаити должны быть изгнаны и подчинены правлению истинных чёрных патриотов. Мы больше не позволим небольшому проценту нашей нации диктовать условия правления! Время предоставления избирательных прав и возвращения их чести настало для всех афро-гаитян по всему нашему островному дому."
haiti.42.a: "Мы не должны позволить нашему населению стать просто музыкантами или мечтателями."

haiti.43.t: "Маяк дерадикализации"
haiti.43.d: "Хотя радикалы продолжают подтачивать нашу базу, мы наконец нашли истинный щит, чтобы защищаться от этих идеологических фанатиков: Жан Прайс-Марс. Ярый либерал и лицо либерально-консервативной коалиции, которая стояла как оплот демократии на Гаити, Прайс-Марс - один из самых уважаемых людей в стране. Большая часть этого уважения исходит из его уникального набора идей, которые он лично исповедует, а также активного вклада в каждое движение и совокупность идей. С корнями и работами, опубликованными в медицине, этнологии, панафриканизме, негритуде, афро-национализме и многих других областях, Прайс-Марс является не только ценным интеллектуалом, но и истинным гаитянским патриотом в глазах большинства людей в стране, независимо от их политической принадлежности. Благодаря своей репутации и престижу Прайс-Марс стал маяком, привлекающим бывших членов нашей коалиции, которые в последние годы были сбиты с пути песнями сирен радикализма. С Жаном Прайс-Марсом и другими истинными сыновьями Гаити, подобными ему, наш либерально-консервативный альянс имеет шанс пережить эту бурю радикализации и выйти с другой стороны более сильными, чем когда-либо."
haiti.43.a: "Мы приветствуем всех обратно с распростёртыми объятиями. Каждый должен учиться на своих ошибках."

haiti.44.t: "Национальный синкретизм"
haiti.44.d: "Когда основная часть наших первоначальных реформ позади и наша прочная административная основа установлена, мы оттащили Гаити от края разрушения и радикализации. Сейчас мы стоим единые и более сильные, чем когда-либо прежде, и мы должны объединиться как одно целое, чтобы продолжить наш скачок в процветание и современность. Прежде чем вдаваться в детали того, что нас разделяет, одна вещь превыше всего объединяет нас против всех остальных: мы гаитяне. Эта единственная идентичность - всё, что удерживает нас от полного краха, но это не слабая связь. Наша национальная гордость и наследие прочнее стали, выкованы веками угнетения, империализма и хаоса. Наши узы выкованы в истории, настолько трагичной, что многие не могут вспоминать о ней, и с этими узами Гаити становится только сильнее. С нашим прошлым позади мы должны маршировать в будущее вместе, не зная, что нас ждёт. Но независимо от того, что ждёт нас на нашем пути, мы встретим это лицом к лицу и вместе как единый гаитянский народ."
haiti.44.a: "L'Union fait la force." (В единстве сила)

haiti.45.t: "Наследие Фостена I"
haiti.45.d: "Наш нынешний и величественный монарх, император Фостен II, как следует из его имени, является вторым, носящим это великое имя. Задолго до его правления, почти век назад, бывший раб, ставший национальным правителем Фостен I правил как «Император Фостен-Эли Сулук, Император Гаити» с 1849 года до своего принудительного отречения и изгнания, которые положили конец его правлению в 1859 году. Как император, Сулук был известен как ветеран гаитянской революции и справедливый правитель бедных и угнетённых Гаити. Очистив бюрократию от элит смешанной расы и заполнив её чернокожими лоялистами, приняв вуду и создав тайную полицию, он правил бархатным кулаком, будучи жестоким к своим противникам и справедливым к своему народу. Наш благородный император Фостен II стремится подражать его величию каждую минуту бодрствования, без тиранической репутации, которая навсегда запятнала Фостена I. Он - Фостен II, наследник трона Империи Гаити и чемпион гаитянского народа, как и его тезка до него."
haiti.45.a: "Мы наследуем историю, создаваемую веками. Наш новый режим не подведёт народ Гаити."

haiti.46.t: "Для народа"
haiti.46.d: "Наш славный и справедливый император Фостен II взошёл на давно опустевший трон и взялся править коренными жителями Гаити не ради личной выгоды - он делает это для народа Гаити! Каждый указ, каждая политика, каждое решение этого прекрасного государства принимаются на благо народа Гаити. От самого низкого афро-гаитянского фермера до самого высокого мулата - магната, все равны и свободны при императоре Фостене II. Чтобы облегчить участь этих прекрасных людей, наш славный император объявил о новой серии реформ, которые превратят гаитянское государство в гораздо более заботливую нацию, предоставляющую поддержку, помощь и современные удобства, такие как здравоохранение и образование, всем истинным сыновьям и дочерям нашего островного дома. Под нашим праведным королём гаитянский народ будет поднят из той трясины, в которой он находился веками, и приведён к свету чести и современности."
haiti.46.a: "Император Фостен II протягивает руку гаитянскому народу, чтобы вытащить его к процветанию."

haiti.47.t: "Пока Америка горит..."
haiti.47.d: "Пока мы тушим пожары, вызванные американской оккупацией, новый пожар вспыхнул через Карибское море на землях соседних бывших повелителей, поскольку Соединённые Штаты погружаются в свою вторую гражданскую войну за столетие. Однако их высокомерие пойдёт на пользу нашим братьям за морем в Чёрном поясе, которые жаждали свободы с момента их насильственного прибытия на этот континент; общее наследие, которое мы, гаитяне, разделяем. Поскольку наши братья африканского происхождения на Дикси пытаются сами взяться за оружие, мы могли бы поддержать их дело, отправив помощь и войска как минимум, или даже возможно напрямую вмешаться от их имени, чтобы помочь им в их борьбе против тиранической Конституционной Американской Республики. Некоторые панафриканские радикалы даже предлагают нам самим претендовать на Чёрный пояс, если они не смогут полностью подняться самостоятельно, поскольку самые крайние нуаристы жаждут объединить диаспору любой ценой. Однако любой из этих шагов также бросит гаитянские жизни в огонь, чтобы умереть в чужой братской войне за так называемую «американскую мечту», которая исключала наших родственников в Чёрном поясе, и которую наш собственный король даже оставил, чтобы найти просветление и истинный рай среди людей Ла-Гонава и всего Гаити. Быть столь легкомысленным с жизнями храбрых и верных сынов Гаити, и к тому же на земле наших прошлых угнетателей, скорее всего, разозлит большую часть населения, поскольку большинство гаитян не слишком благосклонны к Америке, и им всё равно, что с ней случится, пока огонь не перекинется на наш остров, поэтому, если их не убедить в правоте борьбы Чёрного пояса, массы, вероятно, никогда не будут на борту, оставляя нашего любимого монарха с большой работой, если план будет одобрен. Однако окончательный выбор остаётся за его величеством императором Фостеном II."
haiti.47.a: "Они наши братья по идеям и происхождению! К войне!"
haiti.47.b: "Их дело правое, но отправки снаряжения и добровольцев достаточно."
haiti.47.c: "Мы не можем рисковать снова ввязываться в дела Америки, сколь бы справедливым ни было дело."
haiti.47.e: "Мы освободим Чёрный пояс сами!"
haiti.47.f: "Мы возьмём мантию Америки на себя, чтобы защитить Гаити и диаспору!"

haiti.48.t: "Принять коренные обычаи"
haiti.48.d: "Гаити - богатая нация с ярким и легендарным прошлым и соответствующей культурой. В эпоху рабства и режима французских империалистов или американской оккупации, опустошавших нашу страну, наша культура медленно расцветала, несмотря на постоянные попытки её искоренения. Когда их оковы были разбиты, гаитянскому народу наконец позволили открыто проявлять свои традиции, что ускорило её рост и дальнейшее расширение уникально гаитянских идей, впервые разработанных при прошлых империалистических режимах, таких как нуаризм и негритуд, или «креольский коммунизм» и панафриканизм. Даже их традиционные религии процветали, а вуду пережило массивное возрождение. Все эти современные идеологии и движения смешались с традиционной коренной культурой Гаити, и необходимо черпать из всех этих движений, поскольку не только многие из их разнообразных идей здравы и полезны, но и, черпая из всех разнообразных идей и традиций коренных гаитянских групп, мы сможем создать истинно единое и гаитянское королевство под властью императора-спасителя Фостена II, истинного чемпиона коренного гаитянского народа."
haiti.48.a: "Да здравствует император Фостен и Третья империя!"
haiti.48.b: "Да здравствует император Фостен и Воскресшая Вторая империя!"
haiti.48.c: "Да здравствует император Фостен и Вторая Вторая империя!"

haiti.49.t: "Рейд на морских пехотинцев"
haiti.49.d: "Всего через несколько недель после его восхождения на высший пост Гаити Франсуа Дювалье всё ещё отчаянно цепляется за власть, поскольку водоворот политических потрясений окружает его и его новый режим. Чтобы получить дополнительный капитал, военное снаряжение и жизненно важную разведывательную информацию, которые понадобятся для поддержания его режима на плаву до тех пор, пока не будет установлена стабильная основа, Дювалье разработал гениальный план: совершить набег на оружейные склады, казармы и базы, в которых размещаются немногие оставшиеся очаги американских морских пехотинцев, которые когда-то контролировали Гаити по своему желанию. Хотя эти янки всё ещё затаились, тяжело вооружённые и хорошо обученные, мы должны вычистить эти крысиные гнёзда, если наше правление когда-либо полностью укоренится. С их добычей, разграбленной, и их укрытиями, сожжёнными, Гаити наконец освободится от иностранного влияния и империализма раз и навсегда, и Франсуа Дювалье приведёт нас к этому!"
haiti.49.a: "Американизм создал очаги заражения здесь, в нашем великом государстве; мы исправим эту проблему."

haiti.50.t: "Провалившийся переворот"
haiti.50.d: "Франсуа Дювалье был разбужен прошлой ночью звуками артиллерийских залпов и выстрелов, когда небольшой отряд элитных американских морских пехотинцев и остатков Гард д’Аити штурмовал президентский особняк. После часов кровопролития, длившегося до тех пор, пока новое солнце взошло на востоке, силы Дювалье одержали победу над американскими прихвостнями, хотя и избитые и окровавленные. Хотя бои были ожесточёнными и десятки были убиты, Дювалье пережил натиск и созвал пресс-конференцию, чтобы обратиться к нации вскоре после того, как дым рассеялся с места битвы. Выступая против своих потенциальных убийц и их лидеров Франка Лаво и Джеральда Томаса в своей речи, Дювалье заметил, что если бы эти янки тратили меньше времени на набивание карманов и больше времени на обучение своих людей настоящей тактике и дисциплине, то, возможно, этой группе вооружённых фермеров и юных новобранцев-подростков повезло бы больше. Хотя его речь была не полностью наполнена ядом, он на мгновение почтил память немногих убитых гаитян как истинных сыновей Гаити и истинных героев гаитянского народа. Дювалье дал ясно понять, что дальнейшие подобные действия не будут терпимы, и что в следующий раз ответ будет не таким любезным. Независимо от его конкретных слов, «Папа Док» в тот день на трибуне ясно дал понять, что он здесь, чтобы остаться, и Гаити придётся к этому привыкнуть."
haiti.50.a: "Революции делаются не литературой. Революции - это выстрелы."

haiti.51.t: "Конфискация имущества"
haiti.51.d: "Президент Франсуа «Папа Док» Дювалье знает, что Гаити, а следовательно, и он сам, понадобятся все средства и капитал, которые только можно собрать, если он хочет продолжать финансировать растущие амбиции Дювалье в отношении страны и одновременно наполнять свои собственные кошельки. Чтобы облегчить эту «острую потребность» в средствах, Дювалье инициировал внушительную систему конфискации имущества, изымая активы у элит смешанной расы и землевладельцев, а также отвлекая средства от любых входящих иностранных или деловых сделок. Запуская пальцы в несколько источников денежного потока, Папа Док стремится одновременно и значительно увеличить состояние Гаити, и своё собственное. Хотя некоторые из его противников выражали обеспокоенность по поводу огромной суммы средств, которые Папа Док отвлекал на свои собственные счета, этих громких критиков вскоре перестали слышать, чтобы они могли оказать длительное влияние на планы президента. Франсуа «Папа Док» Дювалье построит экономику Гаити любыми необходимыми средствами, даже если ему придётся прибегнуть к открытому рэкету и вымогательству, поскольку только он понимает, что Гаити, а следовательно, и он сам, превыше всего."
haiti.51.a: "Сосредоточиться на активах в сельской местности."
haiti.51.b: "Нацелиться на городские активы."

haiti.510.t: "Новая медицина"
haiti.510.d: "Вторя словам и убеждениям достопочтенного президента Франсуа Дювалье, по всему Гаити проводятся масштабные реформы наших систем здравоохранения. Сбросив оболочку лживой медицинской науки Белого человека, которая когда-то пыталась научно доказать нашу неполноценность по сравнению с их презренной расой, мы вступаем в новую эру медицины для Чёрного человека, для афро-гаитянина. Черпая вдохновение из нашей духовности вуду, католических целительских техник и новой современной гаитянской науки, наши врачи и больницы смогут черпать из обширного банка знаний, как старых, так и новых, чтобы лечить и выхаживать множество больных и слабых душ, населяющих нашу нацию. Хотя это вызвало беспокойство у некоторых, наш любящий президент «Папа Док» Дювалье заверил всех, что вуду - это не просто религия, но также философия и наука. Ложь наших иностранных угнетателей больше не будет тянуть нас вниз и делать наш народ больным, ибо система здравоохранения Гаити будет очищена от их коррупции..."
haiti.510.a: "Вопрос не в том, верю ли я в вуду. Я учёный и я изучал концепцию вуду."

haiti.511.t: "Бугимены"
haiti.511.d: "Глубоко в самых тёмных закоулках самых обветшалых и забытых ям Гаити тайная организация обучает молодых новобранцев их будущей роли одного из «бугименов» президента Франсуа «Папа Док» Дювалье. Формально известные как VSN, или Volontaires de la Sécurité Nationale, эти грозные силы официально являются санкционированной государством милицией, но на самом деле они действуют как личные эскадроны смерти и парамилитарные формирования Папа Дока, выступая как физическое проявление его воли, выполняя только его прямые приказы. Заслужив множество прозвищ за время своих первых развёртываний и тренировок, такие как Кагуляры или Вампиры, одно выделяется среди всех: «Тонтон Макут», или Дядюшки Мешки, получившие своё имя от тёмного гаитянского божества, известного похищением и пытками непослушных детей и засовыванием их в свой мешок для последующего употребления. Соответствуя мифологической фигуре своего имени, эти бугимены либо открыто убивают, либо похищают врагов Папа Дока, которых больше никогда не увидят. Что они делают со своими похищенными жертвами, официально неизвестно, но слухи о кислотных ваннах, побивании камнями, сожжениях и других ужасных деяниях отпугивают всех, кроме самых глупых, кто пытается проверить эти утверждения. С этими бугименами под командованием президента «Папа Док» Дювалье ни один враг, громкий или скрытый, не имеет шансов оставаться в безопасности и скрываться долго, ибо Тонтон Макут на охоте."
haiti.511.a: "Я принимаю волю народа. Эти прекрасные люди помогут проследить, чтобы эта воля была выполнена..."

haiti.512.t: "Друзья по ту сторону"
haiti.512.d: "Президент Франсуа «Папа Док» Дювалье - человек многих интересов, от этнологии до медицины, от нуаристской мысли до панафриканизма. Дювалье читает и пишет на многие темы, но искусство и наука гаитянского вуду - одни из его любимых. Истинный и решительный практик как светлых, так и тёмных сил вуду, «Папа Док» всё чаще запирается на всё более долгие периоды времени, якобы получая видения, когда он совершает свои жертвоприношения, тёмные ритуалы и чёрную магию, чтобы преследовать свои собственные устремления к растущей власти. Распространились слухи, что молодой президент даже перестал использовать традиционные жертвоприношения животных и вместо этого начал использовать своих многочисленных врагов и заключённых, в то время как другие сплетничают о склонности Дювалье разговаривать с самим собой или впадать в «видениями вызванные припадки» в определённых, менее публичных местах, которые, как утверждает «Папа Док» Дювалье, являются его общением с его «Друзьями по ту сторону». Став, казалось бы, безумным или нестабильным, некоторые в нашей администрации даже выражали обеспокоенность по поводу пригодности Дювалье к руководству, но эти разоблачители, кажется, всегда исчезают в течение нескольких дней или недель после того, как поднимают шум, чтобы не быть слишком большим беспокойством. Несмотря на странные взгляды, которые он получает, и слухи о его помутнении рассудка, распространяемые за его спиной, никто не может отрицать нынешние успехи режима Дювалье, который, казалось бы, был невероятно удачлив или благословлен перед лицом многочисленных препятствий, с которыми столкнулась его администрация. Существуют ли эти «Друзья» на самом деле или нет - вопрос, который не стоит задавать, рискуя разозлить «Папа Дока» и стать одним из его предполагаемых жертвоприношений, пока Гаити продолжает свой метеоритный подъём к процветанию."
haiti.512.a: "...Вуду - это не суеверие. Это философия, концепция Бога."

haiti.513.t: "Культ «Папа Дока»"
haiti.513.d: "По мере того как президент Франсуа «Папа Док» Дювалье всё больше укрепляет свою власть над Гаити, его обожание в глазах людей только растёт. Его масштабные экономические реформы «Чёрной экономики» превратили раны Чёрного понедельника и Великой депрессии в шрамы прошлого и принесли истинное процветание долго угнетаемому афро-гаитянскому народу. Его взращивание исконных гаитянских традиций и обычаев положило начало золотому веку гаитянской культуры. Его навыки пламенного оратора и публичного спикера приносят ему толпы новых ревностных последователей на каждом новом митинге, который он проводит. «Папа Док» держит гаитянский народ на ладони, и многие массы почитают его как бога, воплощённого из воли и любви гаитянского народа к своему пожизненному президенту. С каждым новым днём Дювалье может приобретать больше врагов, но он приобретает гораздо больше новых сторонников и лихорадочно преданных последователей, чтобы более чем компенсировать это. Культ личности Папа Дока вырос до размеров, превышающих самого человека; он стал идеей, иконой, пророком гаитянского народа и глашатаем их грядущей судьбы."
haiti.513.a: "Я знаю гаитянский народ, потому что я и есть гаитянский народ."

haiti.514.t: "Иностранные контакты"
haiti.514.d: "Президент Франсуа Дювалье правит, прижавшись спиной к стене, отражая нападки критиков и марксистских псов, пока он пытается построить эту гаитянскую утопию. Чтобы ещё больше способствовать своим амбициям и целям в отношении Гаити и себя, Папа Док обратился к альтернативным каналам. Написав и обзвонив многочисленные контакты по всему миру, Дювалье связался с мафиозными контактами в Соединённых Штатах и Италии, с триадами Шанхая и Гонконга, а также с множеством других печально известных черных рынков и торговцев оружием, таких как орден Сенуссия и Мау-Мау, если называть лишь некоторые. Создавая репутацию и взаимопонимание с этими собратьями-бандитами и бродягами, Гаити станет процветающим и богатым. Хотя многие могут свысока смотреть на эти связи, только Папа Док по-настоящему понимает, что только через теневые связи и сделки в подворотнях Гаити когда-либо будет по-настоящему свободно от ужасов нашего трагического прошлого."
haiti.514.a: "Кто сказал, что среди воров нет чести?"

haiti.515.t: "Милитаризованные молодёжные организации"
haiti.515.d: "Наша гордая и многолюдная нация полна множества молодёжных организаций, формально или неформально посвящённых делу и идеалам нашего государства. От организаций, подобных бойскаутам и пионерам, до маргинальных политических групп и псевдопарамилитарных формирований, эти группы кишат молодой кровью, которая будет жизненно важна для наших будущих военных усилий. Мы предпримем шаги, чтобы официально признать все из них действующими подразделениями военных тренировочных усилий государства и дополнительно внедрить в них нашу идеологию и вероучение, а также одновременно ускорить их военную культуру и подготовку. Они станут основой следующего поколения гаитянских солдат, уже преданных нашему делу и знакомых с тактикой войны задолго до того, как они даже поступят на базовую подготовку."
haiti.515.a: "Новая порода гаитянских патриотов."

haiti.516.t: "Машины войны"
haiti.516.d: "Чтобы выиграть войны, которые неизбежно приближаются на нашем горизонте, необходимы современные машины сегодняшнего дня. Через Карибское море в Америке или через Атлантику в Европе танки и моторизованные орудия войны начинают доминировать на полях сражений, в то время как самолёты роятся в небесах. Наша собственная нация была свидетелем эффективности этих машин во время американской оккупации, когда янки применяли свои знания и использование механизированных подразделений, чтобы более эффективно и легко контролировать и угнетать наше население. Нам нужно разработать наши собственные проекты или, что более реалистично, приобрести их различными способами у иностранных правительств, чтобы мы могли построить эти внушающие благоговейный ужас механизмы гибели для себя и использовать их для защиты гаитянского народа и поражения наших врагов. В следующий раз, когда мы встретимся с угнетателями вчерашнего дня, мы будем владеть оружием завтрашнего дня!"
haiti.516.a: "Время пришло!"

haiti.517.t: "Война по-нашему"
haiti.517.d: "Чтобы наилучшим образом использовать ресурсы, находящиеся в нашем распоряжении, Гаити не должно вести войну по шаблону, следуя доктрине иностранных мыслителей, как если бы это было само Евангелие. Вместо этого мы должны разработать нашу собственную специфическую и уникальную школу мысли о том, как проводить любые будущие военные операции. Тактика партизанской войны, подрывная деятельность, импровизированная война и множество других идей будут почерпнуты и сплавлены воедино, чтобы создать единую доктрину, специально разработанную для боёв, в которых будут сражаться наши войска, и с тем, с чем они реально будут сражаться. С распространением этих индивидуальных, созданных на заказ идей в наших вооружённых силах мы обеспечим, чтобы наши армии были готовы к любым испытаниям, которые ждут их на нашем пути к нашей судьбе."
haiti.517.a: "Защищать и оборонять!"

haiti.518.t: "Родной почве"
haiti.518.d: "Никто не знает разнообразных джунглей, сельскохозяйственных угодий и пляжей Гаити так, как коренные гаитяне. Их врождённое и давно укоренившееся знание земли, на которой они живут, происходит из веков обработки почвы и укрощения лесов на нашей половине Эспаньолы. Хотя эти знания принесли пользу многим секторам, таким как сельское хозяйство и торговля, теперь они больше всего принесут пользу нашим вооружённым силам. Наши солдаты рождены этой землёй, и теперь они будут тренироваться на ней, в чаще гаитянской глуши или в густонаселённых районах наших крупнейших городов. Каждый дюйм нашей страны станет им известен, ни один переулок или канава не останутся необследованными и неотработанными. Наши армии научатся жить за счёт самой земли, хотя многие уже это делают, чтобы по-настоящему стать единым целым с Гаити, когда иностранные звери придут на наши берега. Они будут стоять всегда настороже и всегда готовы, ожидая в своих различных логовах и пещерах по всей стране, готовые нанести удар по любому врагу, достаточно глупому, чтобы попытаться принести разрушение нашему суверенному и дикому дому."
haiti.518.a: "Я слышу, как шепчутся деревья и реки, и они говорят по-гаитянски."

haiti.519.t: "Один за всех"
haiti.519.d: "Если мы хотим выиграть войны, которые накапливаются на горизонте, подобно грозовым тучам перед ураганом, мы должны объединиться. Наши армии должны отказаться от своей единоличности и сражаться как один объединённый и организованный организм, ради одного дела, ради одной нации. Их единство и мастерство дадут им силу, а их анонимность даст им безопасность, поскольку они станут частью большего, безликого целого. Хотя они не будут самыми большими силами в мире, их подготовка намного превзойдёт подготовку любого врага, с которым они столкнутся. Наши вооружённые силы будут одним единым могучим мечом, которым мы срубим всех, кто противостоит нашему режиму или стоит на пути к нашей судьбе, поскольку мы будем дальше формировать их в единую и высококвалифицированную боевую силу. Они станут элитным и стойким оплотом против наших многочисленных врагов. Всё для нашего народа, всё для нашего славного лидера [HAI.GetLeader], всё для Гаити."
haiti.519.a: "Одна гаитянская армия, чтобы сокрушить их всех."

haiti.520.t: "Все за одного"
haiti.520.d: "На далёком горизонте грозовые тучи войны продолжают собираться и темнеть с каждым днём. Чтобы подготовить Гаити к этим грядущим конфликтам, наши вооружённые силы должны черпать силы из всех слоёв гаитянского общества, чтобы каждый тип гаитянского мужчины из всех слоёв жизни служил в наших вооружённых силах. Ни один истинный гаитянин не должен быть исключён из военной службы, будь он мулат или афро-гаитянин, поскольку нам понадобится каждая капля крови, если мы хотим обеспечить наши амбиции и пережить грядущую бурю. С этой разнообразной базой людских ресурсов, из которой можно черпать, уникальные идеи и тактика, которые каждый из них приносит с собой, будут отточены и усовершенствованы в наших тренировочных лагерях. Наши армии станут разнообразными и высококвалифицированными в их стремлении стать истинными защитниками и воинами гаитян, и мы знаем, что все истинные гаитяне ответят на призыв, нуждаются ли они в убеждении или нет."
haiti.520.a: "Все истинные гаитяне встанут на защиту единого и славного Гаити."

haiti.521.t: "Смешанный совет?"
haiti.521.d: "Поскольку мы начинаем всё больше и больше двигать Гаити к восстановленной демократии, многие политические силы, как внутри Совета, так и вне его, подали прошение нашему правительству о месте во всё более могущественном органе. Теоретически, добавление большего количества членов в Совет мало что значит, поскольку Совет всё ещё почти бессилен. Тем не менее, нельзя отрицать, что такой шаг был бы популярен, поскольку он показал бы людям, что мы серьёзны в наших заявлениях о реформах, что делает этот шаг почти невозможным для отклонения. Однако остаётся вопрос: кого мы пригласим присоединиться к нам в Совете? От тоталистов из [totalists party here] до нуаристов - все запросили место в Совете. Кого бы мы ни выбрали для присоединения к нам в Совете, это, несомненно, будет рассматриваться как одобрение их позиции. Мы должны выбирать мудро, поскольку судьба Гаити может решиться в этот самый момент..."
haiti.521.a: "Гаити нужны радикальные перемены, пригласить крайне левые партии присоединиться к нам в Совете."
haiti.521.b: "Гаитянская демократия молода, пригласить центристские партии присоединиться к нам в Совете."
haiti.521.c: "Гаити - молодая нация, пригласить националистов присоединиться к нам в Совете."
haiti.521.e: "Мы прекрасно справляемся сами, большое спасибо."

haiti.522.t: "Приструнить Гард д’Аити"
haiti.522.d: "Из многих масштабных изменений, которые американцы навязали нашему народу, немногие были столь же значимыми, как создание Гард д’Аити. Созданная под американским надзором и обучением из трупа наших предыдущих сил жандармерии, которые сами заменили нашу официальную армию в 1916 году под американским «руководством», Гард д’Аити была создана с идеей создания первых аполитичных и современных вооружённых сил Гаити, также действуя как рука оккупационных сил. Хотя их оборудование используется в наших вооружённых силах, а их подготовка и доктрина формируют основу всех наших нынешних военных идей, это также создало то, что по сути является проамериканской парамилитарной и лоббистской организацией, которая едва ли прислушивается к слову или приказам государства после ухода янки. Гард д’Аити лоббирует свои собственные интересы и проводит политику только в отношении того, что считает нуждающимся в полицейском надзоре. Мы должны немедленно обуздать их влияние и автономию, иначе мы будем вынуждены смотреть, как эти проамериканские прихвостни дальше оскверняют наш островной дом гнусной американской скверной. Единственный оставшийся вопрос - как нам ограничить их влияние и до какой степени. Чтобы заставить Гард согласиться прекратить или ограничить своё политическое лоббирование, мы должны обратиться к одному из личных связных и доверенных лиц командира морской пехоты Рассела. Мы можем обратиться к Франку Лаво, уроженцу Гаити, генералу, и дальше пытаться гаитинизировать Гард, одновременно постепенно изолируя их от иностранной помощи, обезвреживая их, но также делая наши единственные нынешние военные силы слабее. В качестве альтернативы мы можем обратиться к командиру морской пехоты США Джеральду Томасу, который сохранит наши каналы и доступ к американскому оборудованию, но также, вероятно, разозлит больше коренных гаитян и ещё больше укрепит военную мощь Гард. Хотя сильный Гард на бумаге звучит отлично, они всё ещё являются инструментом иностранных интересов и должны находиться под наблюдением."
haiti.522.a: "Идти с Лаво. Он вызовет меньше беспорядков."
haiti.522.b: "Идти с Томасом. Его навыки и связи слишком полезны, чтобы отказываться."

haiti.523.t: "Разрушить коалицию"
haiti.523.d: "Теперь, когда все или большинство политических партий могут свободно участвовать в выборах и цветы свободной демократии снова распускаются на нашем островном доме, наш режим приступил к полному демонтажу нынешней и давней коалиции левых, либералов и даже некоторых из немногих оставшихся и быстро умирающих консервативных партий, которые объединились перед лицом американского вмешательства и сползания Гаити в мягкий авторитаризм. С разрушением коалиции входящие в неё партии - от максимистских и сорелианских фанатиков до умеренных либералов и даже редких консерваторов, которые ещё не покинули свои партии ради растущих националистических организаций, - теперь могут преследовать свои собственные политические цели. Хотя лишь горстка партий действительно имеет шанс на победу в реальном избирательном цикле, эта атмосфера политической свободы - ещё один шаг на пути к стабильной и свободной системе."
haiti.523.a: "Из пепла коалиции - истинная политическая свобода и разнообразие..."
haiti.523.b: "Мы должны позволить этой коалиции продолжаться ради блага гаитянской демократии..."

haiti.524.t: "Морской пехотинец возвращается домой"
haiti.524.d: "Поскольку искры хаоса распространяются по Америке, братья сражаются друг с другом на улицах, и во второй раз за столетие Америка находится на грани краха. Даже здесь ощущаются отголоски хаоса: командир морской пехоты и глава Гард д’Аити Джон Рассел возвращается домой, чтобы помочь охранять от мародёров и подготовиться к потенциальному восстанию. С его отъездом в Гард образовалась глубокая дыра, которую может заполнить только один из лучших людей Рассела. Поскольку в их рядах царит хаос, всё, что можно сказать наверняка, это то, что Гард д’Аити больше не будет прежним с отъездом Рассела. Теперь мы ждём объявления о его преемнике, которое вот-вот будет раскрыто..."
haiti.524.a: "Туземец управляет Гард?! Мы приветствуем Лаво и с нетерпением ждём его следующего шага."
haiti.524.b: "Нация вздрагивает, когда другой янки, Джеральд Томас, берёт под контроль Гард."

haiti.525.t: "Прихвостень против императора"
haiti.525.d: "Поскольку внутренние противоречия в Гард д’Аити становятся всё более пламенными и ожесточёнными, многие призывают к смене командования Гард. Поскольку Джеральд Томас всё ещё правит как лидер этих парамилитарных сил, Гард всё ещё действует в значительной степени как инструмент иностранного угнетения и самоудовлетворения. Несмотря на то, что Томас является гаитянским гражданином, его приказы и зарплаты поступают из Вашингтона, и с тех пор как этот факт стал ясен большинству Гаити, многие возненавидели его коррупцию и плохое обращение с афро-гаитянами, поскольку он сам является мулатом-элитой. Как ни удивительно, необычный чемпион гаитянского народа проявил себя в лице молодого полковника морской пехоты Фаустина Э. Виркуса. Виркус стал знаменитым и любимым коренными жителями Гаити благодаря своей репутации человека из народа и героическому спасению местной принцессы на острове Ла-Гонав. По мере роста его обожания он стал грозной и уважаемой фигурой как в самом Гард, так и в целом Гаити, и как таковой стал ядром антитомасовских действий. Поскольку судьба нации поставлена на карту, Фаустин Виркус вместе с лоялистами Гард и помощью туземцев предпринял отчаянную попытку переворота, чтобы раз и навсегда свергнуть Томаса с поста лидера Гард. Пока Фаустин Виркус и остальная часть его свиты атакуют укреплённую позицию Томаса, неясно, кто останется стоять, когда пыль наконец осядет."
haiti.525.a: "Фаустин захватывает контроль над Гард и спасает Гаити от этих американских марионеток!"
haiti.525.b: "Томас сохраняет контроль над большей частью Гард, и Фаустин казнён за измену."

haiti.526.t: "Кок ла Шанте"
haiti.526.d: "Независимо от того, где вы находитесь на Гаити, будь то глубоко в закоулках таких городов, как Порт-о-Пренс, или далеко в сельской гаитянской местности на острове Ла-Гонав, крики и вопли сражающихся петухов можно услышать в любой час дня. Прозванное «самым близким, что есть у Гаити к национальному виду спорта», петушиные бои являются глубокой традицией в нашей стране, уходящей корнями в форму развлечения для первых рабов и колонистов, прибывших на этот остров из Старого Света. С тех пор популярность этого вида спорта взлетела с течением веков, особенно среди масс фермеров, рабочих и трудящихся низшего класса. Недавно, с отъездом американцев и их неприятием «табу», петушиные бои снова пережили массовое возрождение на наших землях, и даже многие в Гард участвуют в этом виде спорта из-за ослабления ограничений по мере того, как всё больше известных янки покидают нашу страну. Более того, крупнейшее петушиное ринг в столице решило провести национальный турнир, чтобы определить, кто является лучшим коком на Гаити. Победитель этого прославленного чемпионата будет коронован как «Гво Кок ла» или «Большой Петух». Пусть удача всегда будет на стороне этих храбрых петухов, и пусть победит лучший кок!"
haiti.526.a: "...Да здравствует Кок ла!"

haiti.527.t: "Избирательные реформы"
haiti.527.d: "Поскольку сияющий маяк свободы, кажется, ближе к нам, чем когда-либо за последние 20 лет, правительство дало зелёный свет призывам реформировать наши избирательные законы. Сказать, что эти законы остро нуждаются в реформе, значит ничего не сказать. Когда голосование сильно ограничено, если не полностью невозможно, удивительно ли, что гаитянский народ испытывает такое презрение к нашему правительству? Именно это и пытаются устранить предлагаемые реформы. Если они будут приняты полностью, любой гаитянин старше 18 лет, независимо от класса, вероисповедания или этнической принадлежности, получит неотъемлемое право голоса. В дополнение к этому реформы также призывают к кампании по просвещению населения о их новых правах. Осталось только одобрение правительства..."
haiti.527.a: "Одобрено! Свет свободы сияет ещё ярче!"
haiti.527.b: "Одобрено, но не допускать левые партии к участию..."
haiti.527.c: "Отказано, эти реформы заходят недостаточно далеко."

haiti.528.t: "Отчаянная мольба"
haiti.528.d: "Поскольку президент Луи Борно с каждым днём всё больше укрепляет как свою власть, так и свои связи с американцами, многие как в его кабинете, так и во всей стране призывают к его отставке. Будучи упрямым и стойким как всегда, Борно игнорировал все эти мольбы, стремясь построить Гаити как современное и сильное государство; игнорировал их до сих пор. Когда он сидел за своим столом в президентском кабинете, он услышал шум за дверью. В течение нескольких минут его давние коллеги и собратья-гаитянские патриоты генерал Франк Лаво и министр Поль Маньоль быстро вошли в его покои, требуя его аудиенции немедленно. Опасаясь как краха их режима, так и воли гаитянского народа, двое старых друзей Борно начали умолять Борно поступить умно и объявить о своей отставке, прежде чем их и без того шаткая хватка за власть не выскользнет из их рук ещё больше. Альтернативно пара предложила возможное возвращение выборов, подстроенных при необходимости, чтобы хотя бы умиротворить народ, дабы их объединённый гнев не вызвал крах всего, что Борно пытался построить. Хотя упрямый, Борно не был глупцом. Хотя отставка могла навсегда запятнать его наследие, она также могла быть воспринята как акт героизма и благодати: истинный Цинциннат! Однако передача судьбы нации выборам и необразованным массам была столь же пугающей перспективой. Президент Борно, наконец, внял мольбам и предупреждениям своих соотечественников и будет внутренне обсуждать этот вопрос до его конца. Каким бы ни было его решение, будущее Гаити в целом теперь зависит от этого окончательного выбора."
haiti.528.a: "Борно правил Гаити почти два десятилетия! Зачем останавливаться сейчас?"
haiti.528.b: "Борно внемлет их предупреждению и подготовится к своей возможной отставке."

haiti.529.t: "Избирательный наблюдатель"
haiti.529.d: "Гаитянская демократия, мягко говоря, хрупка. Ещё до прихода американизма наша демократия была подвержена мошенничеству и коррупции, постоянно подрывая истинную волю гаитянского народа. Это больше не должно терпеть, ибо народ Гаити заслуживает справедливой и свободной демократии после этих долгих лет некомпетентного правления и угнетения. Чтобы облегчить некоторые из наших опасений по поводу предстоящих выборов и их чистоты, будет создан наблюдательный комитет, который будет следить за каждым опросом и каждым голосом, как ястреб, высматривающий свою добычу; ни один голос не будет подделан или неправильно подсчитан. Святость гаитянской демократии должна быть сохранена и обеспечена ещё до того, как будет подан первый бюллетень. Мы не потерпим никаких ошибок!"
haiti.529.a: "Для поддержания сада демократии необходим бдительный и справедливый глаз."

haiti.530.t: "Встреча с нашими министрами"
haiti.530.d: "Поскольку Гаити продолжает выбираться из ужасной трясины корыстной и коррумпированной политики, президент созвал всех министров нашего правительства для полного обсуждения наших планов на будущее. Пока наши реформы продолжают вступать в силу и мы готовимся к неизбежности свободных выборов для всех имеющих право голоса гаитян, мы должны объединиться как единое целое, чтобы доработать твёрдое и единое направление того, как этот процесс будет осуществляться. Хотя немногие в нашем разнородном правительстве сходятся в чём-либо, все они могут согласиться с тем, что необходимо достичь того, что лучше для Гаити, а лучший способ определить, что лучше, - это воля народа."
haiti.530.a: "Гаитянская демократия больше не будет запятнана коррупцией и корыстными интересами!"

haiti.531.t: "Делегирование?"
haiti.531.d: "С началом нашей административной реструктуризации многие в оппозиционной коалиции, а также некоторые из наших собственных министров выразили желание децентрализовать некоторые полномочия и функции, изъяв их из рук президента и распределив среди нижестоящих чиновников. Многие государственные функции были присвоены офисом президента во время Оккупации, и с её крахом многие требуют возврата к прежним и более приемлемым arrangements. Хотя это отнимет власть и влияние у Борно, это также сильно успокоит и расширит возможности многих по всему политическому спектру. Хотя это даст нам некоторое дополнительное пространство для манёвра для более серьёзных реформ в будущем, это также укрепит позиции социалистов внутри нашего собственного режима, углубляя их гнилостную скверну в сердце Гаити. Однако отказ от этой сделки не только разозлит социалистов, но и приведёт в негодование более националистические элементы Гаити, особенно среди нуаристов, поскольку наш режим продолжает кланяться иностранным прихотям вместо воли народа. Независимо от его решения, Борно всё равно косвенно усилит одну из групп, которых он боится больше всего, так на кого же он на этот раз примет удар?"
haiti.531.a: "Президенту Борно не нужна никакая поддержка, кроме его американских благодетелей..."
haiti.531.b: "Было бы мудро отказаться от некоторых полномочий, чтобы успокоить массы, но мы рискуем усилить левых..."

haiti.532.t: "Давление на Совет"
haiti.532.d: "Гаитянский совет наряду с Законодательным собранием является одним из двух главных органов правления Гаитянской республики, и со времён установления мягко-абсолютистского государства при американской оккупации, а затем и при режиме президента Борно, оба оставались в крайне ослабленном состоянии. Борно правил без активного и влиятельного законодательного органа с тех пор, как вступил на свой бесконечный срок, а совет влачил жалкое существование в качестве прихвостня, изредка скуля в знак протеста, прежде чем его снова пинали ногами режим Борно. Будучи ослабленным, Совет всё ещё пытается олицетворять более широкую волю гаитянского народа, выступая в качестве неумирающего препятствия, которое, кажется, всегда возвращается, чтобы досаждать. Чтобы официально положить конец этому препятствию на пути к нашим целям, президент Борно может приказать силам Гарда отправиться в палаты Совета, чтобы с этого момента наблюдать за их заседаниями, навязывая свою волю его членам через Гард д’Аити и обеспечивая их будущее послушание, при этом вызывая радикальное негодование у тех, кто находится в этих палатах, особенно у социалистических министров во главе с Руменом. В качестве альтернативы он может просто послать нескольких офицеров полиции, чтобы обеспечить более гладкое проведение заседаний Совета, одновременно отчитывая действующих министров за то, чтобы они действительно выполняли свою работу, или даже вообще бездействовать. Это было бы менее тиранично и вызвало бы меньше гнева со стороны левых. Но, поступив так, Борно будет выглядеть слабым в глазах нуаристов, которые не переставая следят за нашим правительством и его практикой, постоянно выискивая дальнейшие слабости. Мы будем прокляты, если сделаем это, и прокляты, если не сделаем. Так как же Борно ответит?"
haiti.532.a: "Отправить Гард наблюдать за всеми заседаниями Совета отныне."
haiti.532.b: "Мы не должны сердить социалистов - крупнейшую политическую силу Гаити."

haiti.533.t: "Законодательное руководство"
haiti.533.d: "Президент Луи Борно правил Гаити без помех со стороны активного законодательного органа с тех пор, как занял свой нынешний пост в 1922 году. Хотя это позволяло ему править относительно беспрепятственно, пока он подчинялся редким приказам своего американского хозяина Джона Х. Расселла-младшего, эта ситуация также вызывала большую нестабильность. Демократические и социалистические силы по всему Гаити оплакивают отсутствие представительства, постоянно повышая недовольство против нашего режима. Чтобы бороться с этим, законодательный орган будет восстановлен в сильно ослабленной форме, служа тонкой видимостью легитимности и справедливости в нашем правлении. Этот новый законодательный орган будет на коротком поводке, легко распускаемым и не будет иметь реальной власти вовне, но, надеюсь, удержит растущую волну гнева против, казалось бы, бесконечного срока президента Борно. Последним вопросом является то, кому будет разрешено входить в ряды этого нового законодательного органа и кому будет разрешено выдвигать новые законопроекты для голосования. Мы могли бы запретить социалистическим министрам принимать или выдвигать новые законопроекты, подрезая им крылья, что резко разозлит их министров и избирателей, и оставит нас без их поддержки в случае, если придут националисты. В качестве альтернативы мы могли бы разрешить социалистам действовать так же, как и любому другому министру в палате, умиротворяя Румена и красных, но вызывая глубокое негодование у националистов и нуаристов под руководством всё более погружающегося в алкоголь Карла Бруара и его блестящего протеже Франсуа Дювалье."
haiti.533.a: "Разрешить синдикалистским министрам полные законодательные привилегии; нам нужна их помощь."
haiti.533.b: "Нашему режиму всё равно, почувствуют ли нуаристы себя смелее; это необходимое зло."

haiti.534.t: "Наша глупость оказывается нашей погибелью"
haiti.534.d.syndie: "Мы были ослеплены в нашем стремлении к сильному и стабильному Гаити, сбиты с пути радикалами, которые стремились подорвать этот режим с того дня, как президент Борно впервые пришёл к власти. Поскольку наши недавние попытки реформ и консолидации лишь ухудшили стабильность нашего режима, стало очевидно, что наше время на исходе как правителей Гаити. Прямо за дверями Гаити тысячи разгневанных марксистов скандируют свои призывы к революции и мести за пролетариат Гаити. Под руководством Жака Румена и его широкой левой коалиции они теперь выступают как вероятные наследники этой провалившейся администрации. Вскоре настоящая власть окажется в руках социалистов и синдикалистов, которые принесут с собой ярость и волю народа, неся Красную звезду социализма в столицу, чтобы раз и навсегда освободить всех гаитян от их буржуазных хозяев."
haiti.534.d.natpop: "Мы были ослеплены в нашем стремлении к сильному и стабильному Гаити, сбиты с пути радикалами, которые стремились подорвать этот режим с того дня, как президент Борно впервые пришёл к власти. Поскольку наши недавние попытки реформ и консолидации лишь ухудшили стабильность нашего режима, стало очевидно, что наше время на исходе как правителей Гаити. Пока мы баррикадируемся в залах здания Капитолия, Карл Бруар и его пламенный протеже Франсуа Дювалье штурмуют эту импровизированную крепость. За ними стоят отряды гаитянских патриотов и нуаристской милиции, каждый из которых почти что пену изо рта пускает от негодования из-за чудовищно просчитанного управления режима Борно. Они призывают к концу гаитянского унижения и возвращению нашей общей культуры - культуры, оставленной гнить на солнце, пока американцы срывают плоды нашего труда с лозы. Они скоро поведут Гаити, ибо мы провалили свои обязанности как сохранять единство Гаити, так и защищать гаитянский народ. Порт-о-Пренс падает, и скоро он снова восстанет - под совершенно иным и более решительным правительством, чем любое прежде. Да смилостивятся они, ибо время нашего правления истекает..."
haiti.534.a: "Румен ведёт гаитянский пролетариат избавить Гаити от тиранов!"
haiti.534.b: "Бруар привёл этих гаитянских патриотов к победе! Эти десятилетия унижений окончены!"

haiti.535.t: "Насаждение Палате"
haiti.535.d: "Наша законодательная палата должна быть поставлена на колени, если мы когда-либо снова хотим получить твёрдый контроль над браздами правления после этой растущей волны радикализма. Чтобы сделать это, мы должны очаровать одну из двух основных фракций в правительственном аппарате и склонить их на нашу сторону, чтобы укрепить нашу базу и обезвредить оппозицию. Две основные фракции - это различные социалисты в левой коалиции Жака Румена и остающиеся либералы и консерваторы, образующие базу демократической коалиции Жана Прайс-Марса. Если мы решим работать с лагерем Румена, мы сможем на время умиротворить их ряды, но также рискуем тем, что их влияние может взлететь до небес по мере того, как всё больше их министров войдут в наши ряды. В качестве альтернативы мы могли бы объединиться с центристами Прайс-Марса. Хотя их меньше числом, они не несут с собой бремени социалистического клейма. Однако, выбрав либералов, мы больше не будем иметь поддержки социалистов, самой крупной фракции на Гаити, которая может оказаться жизненно важной в нашей защите от нуаристских боевиков. Мы должны действовать осторожно, ибо ничто не является тем, чем кажется, пока мы идём по канату над ущельем неминуемого коллапса, а наши враги таятся за каждым углом..."
haiti.535.a: "Мы должны встать на сторону социалистов. Дать им больше власти стоит того, чтобы отразить националистов."
haiti.535.b: "Идти с либералами. Хотя это спровоцирует националистов на более смелые действия..."

haiti.536.t: "Контроль над оппозицией"
haiti.536.d: "В то время как правительство Гаити доминируется кликой президента Луи Борно, яростная оппозиционная сила постоянно пыталась блокировать его законодательство. Эта неформальная коалиция партий и идеологий - от консерваторов до социалистов - едина только в своей неприязни к администрации Борно. Чтобы контролировать этих смутьянов и подстрекателей, президент Луи Борно предпринял шаги по консолидации их всех под одним официальным и признанным государством оппозиционным зонтиком, чтобы лучше контролировать их оппозицию. При этой системе лидер фракции, который ещё не выбран, будет служить представителем единой оппозиции администрации Борно, выступая в качестве рупора, через который будет проходить вся критика и проверки, направленные против президента Борно. Эта группа не будет иметь исполнительной власти, теоретически ослабляя их влияние на нашу политику и повестку дня, позволяя президенту Борно осуществлять его консолидационные усилия без их помех.\n\nКогда коалиция сформирована, остаётся только определить, кого эта новая официальная коалиция должна выдвинуть в качестве спикера оппозиции. Есть только два сильных претендента в гонке: марксистский писатель и государственный деятель Жак Румен и либерал Жан Прайс-Марс, известный врач и учитель.\n\nПрайс-Марс выступал как объединяющая сила для всех либералов, умеренных консерваторов и антисоциалистических социал-демократов, которые стекались к нему на фоне подъёма нуаристов справа и марксистов слева. Конкурируя с ним, Румен является основателем недавно созданной Гаитянской синдикалистской партии и получил известность благодаря своей активности и сопротивлению американской оккупации.\n\nВыбор Прайс-Марса позволил бы обойти стороной большое левое влияние, которое иначе загрязнило бы наш текущий режим, но оставил бы нас более уязвимыми перед постоянным разрушительным воздействием движения нуаризма. Вместо этого, переход на сторону Румена помог бы держать националистов на расстоянии, но также глубоко увеличил бы влияние социалистов. Кто из этих двух титанов политического мейнстрима Гаити будет диктовать борьбу против коррумпированного режима президента Борно?"
haiti.536.a: "Оппозиция выбирает Жана Прайс-Марса. Он - либеральный маяк в эти тёмные времена..."
haiti.536.b: "Оппозиция выдвигает Жака Румена. Отныне они будут маршировать под красным знаменем..."

haiti.537.t: "Теневое министерство"
haiti.537.d: "Гард д’Аити стремится глубже запустить свои когти в управление Гаити с тех пор, как был сформирован из останков останков наших старых вооружённых сил. Поскольку большая часть их «гаитянскости» полностью отсутствует, Гард функционирует как собственная лоббистская группа для своих собственных интересов - интересов, которые, так уж случилось, совпадают с интересами наших бывших «благодетелей» из Вашингтона. Наш режим может занять две возможные позиции в отношении их желаемого расширения вглубь нашей нации. Мы можем либо полностью позволить этим американским прихвостням войти в наш режим в качестве своего рода теневого министерства, работающего за кулисами, чтобы обеспечить наше господство над радикалами. Допуск этих рабов чуждых интересов в нашу нацию позволил бы нам лучше следить за множеством социалистов внутри нашего режима и правительства, минимизируя их влияние на наш режим. Однако это также разъярило бы нуаристов под руководством Карла Бруара и вечно восходящего Франсуа Дювалье, которые видят Гард такими, какие они есть на самом деле: головорезами и предателями, оплаченными гаитянскими жизнями и американскими деньгами. Как нам действовать?"
haiti.537.a: "Мы не можем рисковать гневить нуаристов, сколь бы сильными ни стали синдикалисты."
haiti.537.b: "К чёрту националистов! Социализм - наша главная угроза, создайте теневое министерство!"

haiti.538.t: "Все вместе сейчас"
haiti.538.d: "Гаити прошёл сквозь огонь экономического коллапса, политического хаоса и иностранной оккупации, и всё же сумел выдержать всё это и выйти с другой стороны избитым, но живым. Только вместе и единые мы поддерживали это тяжёлое существование, и только вместе это существование продолжится. Однако Гаити сейчас внутренне разделён как никогда с подъёмом синдикалистов и левых под руководством Румена, Юдикура и Каликста, а также с появлением движения нуаризма с Бруаром во главе и Дювалье в его тени. Чтобы сшить вместе разрывы, разбившие этот союз, мы должны протянуть руку одной из этих групп и примирить любые сходства, которые у нас могут быть. Только при поддержке одной из этих радикальных групп у нас будет хоть крошечный шанс сохранить нашу власть. Тот, с кем мы объединимся, станет сильнее и смелее благодаря этой официальной поддержке любой из групп, поэтому мы должны быть осторожны в выборе того, с какой группой экстремистов мы должны объединиться."
haiti.538.a: "Социалисты - крупнейший блок на Гаити. Объединиться с ними."
haiti.538.b: "Гаити лучше мёртвое, чем красное, идти с истинными сынами Гаити - нуаристами."

haiti.539.t: "Современное соглашение"
haiti.539.d: "Поскольку основная часть наших реформ сейчас хорошо продвигается, наш режим выдержал худшее, что радикалы, казалось, могли на нас обрушить, и выжил, чтобы всё это подавить. Завершая последние наши внутренние проблемы, мы должны снова начать смотреть вовне. К северу через голубую жемчужину моря лежат наши старые благодетели и повелители: Соединённые Штаты. Некогда титан Нового Света, США видели лучшие дни и сейчас находятся в почти руинах. Однако их слабость может оказаться нашей силой, поскольку министры в нашем кабинете разработали проект нового возможного соглашения с этими янки. Наша администрация всё ещё должна большую сумму денег их правительству через наш печально известный долг, и в настоящее время американцы отчаянно нуждаются в капитале. Чтобы действовать в ответ на это, эти коварные министры планируют осуществить окончательный платёж сейчас, навсегда вычеркнув долг из наших бухгалтерских книг. Наша экономика предложит этим отчаявшимся янки крупную, но частичную единовременную выплату, и взамен они никогда больше не должны будут постучаться к нам с просьбами о подачках от нашего народа. Хотя это, теоретически, гарантирует, что американцы не попытаются вернуться на наши берега, чтобы вернуть свои потерянные инвестиции, это также глубоко разозлит нуаристов, которые яростно презирают любое сотрудничество с этими иностранными псами. Как ни удивительно, социалисты выступили в поддержку этого законопроекта, надеясь сохранить нашу будущую свободу за простую денежную сделку сейчас. То, что началось как обычные дебаты по поводу финансовой возможности, теперь превратилось в идеологически подпитываемую борьбу. Результат сейчас - дело случая."
haiti.539.a: "Отправить сделку, к чёрту нуаристов."
haiti.539.b: "Отказаться от сделки, но мы должны быть готовы к гневу красных."

haiti.540.t: "Подъём мечты нуаризма"
haiti.540.d: "Хотя их первоначальный переворот произошёл всего несколько дней назад, последствия и влияние нуаристов уже можно ощутить по всему Гаити. Националистические парамилитарные формирования и милиции бродят по улицам и лесам нашей нации, сражаясь с очагами демократических и социалистических партизан, в то время как новый режим занят созданием этого нового государства. Однако на почти каждой встрече и дебатах, которые проводят эти националисты, одно лицо остаётся неуловимым: Карл Бруар. Отец нашего движения и главный организатор переворота, который привёл движение нуаризма к власти, наш пастырь стал всё более неуловимым по мере того, как на него стала снисходить реальность управления страной. Погружаясь всё глубже в свою бутылку, он лишь изредка появляется на публике на национальных митингах в Порт-о-Пренсе и других крупных городах, питаясь общественным обожанием как временным облегчением от его всё углубляющегося депрессивного состояния. Хотя мы оплакиваем нашего лидера, его протеже, молодой Франсуа Дювалье, стал ведущей фигурой вместо него. Хотя этому молодому радикалу ещё многому предстоит научиться, он постепенно начал вытеснять роль Бруара как главы этих националистов. Только время покажет, как развернётся эта ситуация, и многие молятся, чтобы Бруар вышел из своего состояния ума и вернулся к нам как чемпион гаитянского народа!"
haiti.540.a: "Каждая мечта должна закончиться, когда мы сталкиваемся лицом к лицу с реальностью."

haiti.5400.t: "Нуаристы вырывают контроль"
haiti.5400.d: "Поскольку хаос и разобщённость царят и бушуют по всему Гаити, один человек взял на себя смелость захватить контроль. В отчаянной попытке спасти своих соотечественников от них самих Карл Бруар, лицо движения нуаризма, штурмом взял столичный комплекс в Порт-о-Пренсе и захватил контроль над правительством. Он и его верные нуаристы захватили полный контроль над аппаратом государства и быстро приступили к восстановлению чувства стабильности и сплочённости разрозненного гаитянского народа. Хотя его переворот был быстрым, он не обошёлся без крови, и многие тела - как американских прихвостней, так и сынов Гаити - лежат мёртвыми в грязи. После этой короткой вспышки насилия Бруар приступил к укреплению своего якобы временного правления, имея под боком своего ученика Франсуа Дювалье и остальных нуаристов. Что это будет означать для будущего Гаити - неизвестно, но немногие доверяют этому стареющему алкоголику быть истинным чемпионом национального возрождения."
haiti.5400.a: "Нуаризм охватил Гаити, а его пастырь - пьяница."

haiti.541.t: "Бремя гения"
haiti.541.d: "Карл Бруар сидел за своим столом, склонившись над пишущей машинкой, отсыпаясь после вчерашних бутылок пряного кубинского рома. Когда утренний петух издал свой пронзительный крик, а звуки выстрелов эхом разнеслись по городу, полусознательный поэт встрепенулся. Изо всех сил пытаясь встать, Бруар потёр голову, пока выстрелы продолжали усиливать его похмелье, после чего с силой вырвал остатки желчи в ближайшую мусорную корзину и направился к своей кухне. Открыв единственный шкаф, где что-то было, Бруар схватил ещё одну бутылку спиртного и немного хлеба, чтобы смягчить свой раздражённый желудок для очередного дня пьянства ради своего «творческого процесса». Вернувшись к своему столу, он взял со стола пачку сигарет и зажигалку, проходя мимо, зажёг новую и сделал глоток водки, снова усаживаясь на своё место. Когда жгучая жидкость и дым потекли в его тело, жизнь вернулась к этому живому мертвецу, который начал печатать своё следующее великое поэтическое «произведение». Пока звуки выстрелов продолжались снаружи, поскольку нуаристские боевики продолжали вести войну против синдикалистских партизан, Отец их движения скрывался в своём склепе, всё глубже падая в бутылку, в то время как его протеже Дювалье накапливал всё больше и больше власти для себя. Вскоре будет слишком поздно для кого-либо остановить восхождение «Папы Дока»."
haiti.541.a: "Один день из жизни «Героя Гаити»."

haiti.542.t: "Новое лицо восходит"
haiti.542.d: "После недель невыразимого кровопролития и насилия, похоже, что большинство социалистических и демократических партизан либо бежали в подполье, либо были убиты. Однако при каждой крупной победе храбрых нуаристских боевиков Отец нашей нации, Карл Бруар, был не виден. Вместо этого его печально известный, а ныне уважаемый ученик Франсуа Дювалье каждый раз возглавлял атаку, доказывая всем истинным сынам Гаити, что этот «Папа Док» является проверенным и заслуженным лидером нуаристского дела. Пока наш официальный лидер упал на дно бутылки, напиваясь до почти бессознательного состояния при каждом удобном случае, Дювалье вместо этого привёл народ Гаити к победе над призраком синдикализма. Многие начали призывать к тому, чтобы Франсуа «Папа Док» Дювалье заменил Бруара на посту лидера нации, хотя Дювалье отвергал и осуждал эти предложения как предательские по отношению к его старому другу и наставнику. Вместо этого Дювалье планирует встретиться со своим старым наставником, чтобы наконец решить будущее их нации, теперь, когда боевики успокоились, а широкая общественность требует возвращения свободных выборов."
haiti.542.a: "Забудьте о грехах Отца, ибо его Сын здесь, чтобы указать путь всем истинным гаитянам."

haiti.543.t: "Выбор судьбы нации"
haiti.543.d: "По мере продолжения правления Карла Бруара единство не только не увеличилось, но и межличностные отношения на Гаити достигли исторического минимума, а фракционность и гражданские распри охватили каждый уголок нации. Этой хаотичной ситуации не помогает жёсткая хватка Бруара за власть и его сильный алкоголизм, который с каждой новой выпитой Бруаром рюмкой продолжает становиться препятствием для хорошего управления Гаити. Эта шаткая ситуация близка к точке разрыва: даже его давний протеже Дювалье ставит под сомнение способность Бруара вести за собой. Его старый ученик и друг потребовал, чтобы «президент» Бруар наконец принял решение: либо действительно оправдать своё обещание быть спасителем Гаити, восстановив демократию, либо попытаться сохранить эту борьбу за абсолютную власть и надеяться, что карточный домик не рухнет. Если нуаристская миссия когда-либо выживет, уход в отставку может быть единственной надеждой движения, поскольку едва функционирующему пьянице вряд ли позволят править дольше, а его насильственное отстранение только ещё больше запятнает эти дорогие нам идеалы. И кроме того, демократию всегда можно подправить и приспособить к нуждам государства..."
haiti.543.a: "Я спас Гаити от американизма и синдикализма! Я имею право править!"
haiti.543.b: "Уйти в отставку и официально поддержать молодого Дювалье на предстоящих «честных» выборах."

haiti.544.t: "«Свободные» выборы на Гаити"
haiti.544.d: "Цинциннат Гаити Карл Бруар с честью ушёл в отставку всего несколько недель назад после того, как спас нацию от краха, открыв путь к национальным выборам нового президента Гаити. Гаитянский народ затаил дыхание, поскольку ожидается, что эта гонка будет напряжённой. Из-за ужасных действий Жака Ромена во время недавних гражданских беспорядков, запятнавших его наследие и наследие его лучшего ученика Макса Юдикура, единственной левой партией, оставшейся на плаву, остаётся «La Réaction Démocratique» Демосфена Каликста, которая резко выросла после краха синдикалистов. От центра баллотируются Жан Прайс-Марс и его центристская коалиция со Стенио Винсентом и Луи Дежуа на его стороне. Наконец, и впервые в истории Гаити, националистические нуаристы из «Parti de l'Unité Nationale» также участвуют в гонке, выдвигая молодым кандидатом Франсуа Дювалье, поддержанного самим Бруаром. Наблюдать за этой кампанией было захватывающе, но не всё так хорошо отслеживалось общественностью. За кулисами Бруар и Дювалье договорились фальсифицировать голосование в свою пользу; удастся ли их авантюра - пока неизвестно. Однако сегодня всё заканчивается, и пока подсчитываются последние голоса, гонка готова объявить победителя! Похоже, победитель и следующий президент Гаитянской Республики - это..."
haiti.544.a: "...Франсуа «Папа Док» Дювалье, который побеждает с подавляющим перевесом... с 106% голосов!?"
haiti.544.b: "...Демосфен Каликст избран Спасителем демократии Гаити!"
haiti.544.c: "...Жан Прайс-Марс обнаруживает фальсификацию, раскрывает правду и получает комфортное большинство."

haiti.545.t: "Гаитянская кавалерия снова скачет"
haiti.545.d: "После тиранического решения Карла Бруара узурпировать волю народа и править как пьяный диктатор, теперь один человек должен спасти Гаити от националистического яда, который ждёт её: Демосфен Каликст. Бывший офицер кавалерии, обученный американцами, ставший человеком народа, поэтом и социалистическим революционером, Каликст объединил оставшихся центристских и социалистических боевиков в последний рывок против подлых нуаристов и их националистических извращений. Удача улыбнулась этому будущему герою в этот день, поскольку большая часть нуаристского движения - как военного, так и административного крыла - сегодня собралась в Порт-о-Пренсе, чтобы отпраздновать свою очевидную победу над врагами. Однако Каликст и его люди планируют испортить эту встречу собственным празднованием. Собирая и контрабандой перевозя взрывчатые боеприпасы и материалы из давно заброшенных складов, оставленных американцами, этот воин-поэт планирует взорвать собрание националистов, убив большую часть их руководства и офицерского корпуса, не «пролив ни капли невинной гаитянской крови». В качестве последующего шага для обеспечения их уничтожения сам Каликст возглавит верхом на лошади атаку на руины центра Порт-о-Пренса, убивая каждую оставшуюся в живых нуаристскую собаку. Хотя ему и его людям пришлось бы тщательно прочесать руины и окрестную сельскую местность в поисках остающихся укрытий и беглецов, одним этим быстрым ударом Каликст мог бы спасти Гаити раз и навсегда. С установленными старыми горными зарядами и боеприпасами и его людьми на ключевых блокпостах вокруг города, всё, что осталось сделать, - это нажать кнопку..."
haiti.545.a: "...со вспышкой и атакой всё Гаити будет спасено от национализма, но какой ценой?"

haiti.546.t: "Наконец, свобода!"
haiti.546.d.radsoc: "Поскольку режим Борно ошибался на каждом шагу в своих попытках реформировать своё коррумпированное и жалкое подобие республиканского правительства, судьба будущего Гаити пала на нас. Кроме того, по мере того как ужасы этой политической борьбы продолжались, становилось всё более очевидным, что некогда благородный лидер революции Жак Ромен сбился с пути, прибегая к предосудительным и бесчеловечным тактикам в своей войне против националистов. По мере того как борьба продолжалась, его протеже и лучший ученик Макс Юдикур выдвинулся на видное место в партии и с тех пор узурпировал право Ромена вести наше рабочее восстание по воле народа. Юдикур теперь несёт факел истинной синдикалистской и социалистической мысли, а также бремя народной воли, и вместе под его правлением Гаити будет раз и навсегда спасено от тиранов и головорезов, поскольку наша революция приближается к своему окончательному триумфу."
haiti.546.d.natpop: "Поскольку режим Борно ошибался на каждом шагу в своих попытках реформировать своё коррумпированное и жалкое подобие республиканского правительства, судьба будущего Гаити пала на нас. Хотя часто теряясь в алкогольном оцепенении, Карл Бруар служит нашим объединяющим маяком; символом гаитянской национальной гордости. Однако за кулисами «Папа Док» Дювалье управляет истинными рычагами власти, и вскоре он потеряет необходимость сохранять свою позицию простого марионеточного лидера, правящего из тени. Тем временем нуаристы представляют собой единый фронт под лицом Бруара, и вместе они воспользовались многочисленными ошибками президента Борно и захватили власть на Гаити. Под их националистическим правлением Гаити возродится из пепла унижения и национальной деградации."
haiti.546.a: "Режим Борно наконец падает под волей гаитянского народа."
haiti.546.b: "Режим Борно наконец падает под волей гаитянского народа."

haiti.547.t: "Укрепление нашей власти"
haiti.547.d.radsoc: "Хотя мы одержали победу в нашей рабочей революции всего несколько дней назад, влияние синдикализма уже можно увидеть и почувствовать повсюду. Однако, хотя о наших гражданах впервые за десятилетия действительно заботятся, наши проблемы далеки от завершения. Националистические боевики всё ещё бродят по сельской местности, выслеживая наши патрули и конвои в своей тщетной партизанской войне. Хотя наши усилия по борьбе с их рядами не оказались бесплодными, они всё ещё существуют в достаточно большом количестве, чтобы представлять угрозу для безопасности нашего народа. Нам предстоит долгий путь, чтобы полностью построить нашу сияющую социалистическую гавань, но первые признаки нашего успеха начинают проявляться."
haiti.547.d.natpop: "Хотя наша официальная борьба за власть закончилась всего несколько дней назад, страна всё ещё усеяна многочисленными очагами повстанцев, которые на каждом шагу бросают вызов нашей власти. Более того, наш дорогой лидер Карл Бруар отсутствовал в общественной жизни месяцами, топя себя в бутылке, в то время как его протеже Франсуа Дювалье всё больше набирал силу и влияние. Что ждёт Гаити в будущем - неизвестно, но сейчас почти всем на Гаити очевидно, что дни Бруара сочтены, пока рядом Папа Док..."
haiti.547.a: "Корни нашего режима становятся всё глубже, поскольку начинает расцветать стабильность."

haiti.548.t: "Тихая замена"
haiti.548.d: "Поскольку с основной массой синдикалистских ополчений покончено, а нуаристский контроль укреплён на каждом километре нашей территории, пришло время положить конец «правлению» Карла Бруара. Долгое время живя и действуя в его тени, Франсуа Дювалье наконец решил раз и навсегда покончить с этим остовом своего наставника. После долгой и задушевной встречи между ними за выпивкой Дювалье подсыпал природный яд в один из стаканов Бруара - яд, о котором он узнал за время работы врачом и своего увлечения искусствами вуду. Покинув квартиру Бруара, пока пьяный поэт лежал на полу с пеной у рта, Дювалье вернулся в свой кабинет, чтобы приступить к своему окончательному плану: тотальному захвату власти. Теперь, когда последнее препятствие устранено, ничто не мешало ему достичь своей судьбы. Он очернил бы своего старшего протеже как сочувствующего левым из-за его дружеских связей с предателем Жаком Роменом, запятнав последний клочок честного наследия, которое оставил покойный, пока Папа Док восходит на позицию своего бывшего учителя как президент Гаити. Хотя он и не избран, он несёт с собой волю народа и право править. Гаити теперь в руках Папы Дока, и только его."
haiti.548.a: "Итак, новое лицо восходит, чтобы вести нашу хрупкую гаитянскую республику. Будем надеяться, что это последнее новое лицо на некоторое время..."

haiti.549.t: "Ученик становится учителем"
haiti.549.d: "Поскольку этот период гражданских распрей теперь граничит с полномасштабной гражданской войной, конфликты между националистическими и социалистическими силами переросли из небольших изолированных стычек в полномасштабную партизанскую войну. По мере того как этот конфликт усиливался, методы выдающихся лидеров Карла Бруара и Жака Ромена также усиливались. В их интенсивном соперничестве и столкновении идеологий, ещё более усугублённом распадом их глубокой дружбы и художественного сотрудничества, эти два титана гаитянского радикализма эволюционировали в свои крайности. В то время как Бруар отступил дальше в глубины алкоголизма, оставляя всё больше своих обязанностей подчинённым с каждой выпитой рюмкой, Ромен вместо этого сделал противоположное своему замкнутому старому другу и направил свой гнев и боль наружу, что вылилось в его теперь уже печально известные вспышки почти садистских действий против своих самых ненавистных врагов - нуаристов. С деградацией и упадком основополагающих принципов и идеалов Ромена его протеже Макс Юдикур поднялся, чтобы принять факел народной воли. Юдикур через акты доблести и храбрости доказал свою ценность гаитянскому народу и нашим революционерам, которые теперь следуют его слову, а не павшему титану Ромену. Старый Учитель был изгнан из Порт-о-Пренса и в последний раз был замечен направляющимся к docks с небольшим отрядом своих самых верных последователей, вероятно, направляясь в Париж или какой-либо другой синдикалистский оплот. Тем временем Юдикур теперь возглавляет Красную революцию, продолжая их борьбу против нуаристских мятежников."
haiti.549.a: "Ромен больше не имеет права вести! Макс Юдикур - истинный чемпион народа."

haiti.550.t: "Учитель обозревает свои поля"
haiti.550.d: "Жак Ромен совершил, казалось бы, невозможное, свергнув старый порядок Гаити при подлом режиме Борно. Всего несколько недель назад он и его храбрые революционеры захватили аппарат государства и средства производства, спасая гаитянский пролетариат от разинутой пасти националистов и плутократов. Поскольку последние очаги нуаристских и демократических повстанцев зачищаются нашими верными ополчениями, захват власти Роменом укрепился, укоренив этот новый режим в основах Гаити. При Ромене будущее Гаити будет процветающим и свободным под Красной звездой синдикализма."
haiti.550.a: "По всему Гаити Красный рассвет синдикализма озарит нашу землю своим сиянием."

haiti.551.t: "Цена революции"
haiti.551.d: "По мере того как ожесточённая борьба за власть между социалистами и нуаристами продолжается, ужасы и реальность конфликта и его последствия становятся всё более очевидными для нашего народа. В то время как правящий режим при Борно отчаянно пытается исправить ситуацию поверхностным законодательством и пустыми общими фразами, эти радикалы ведут войну на улицах и полях нашей некогда спокойной нации. Запертый в горькой борьбе, лидер социалистического фронта Жак Ромен прибег ко всё более отвратительным тактикам против своих националистических врагов, которые ответили тем же, ещё больше ускоряя эту ядовитую гражданскую распрю. Если эта революция продолжится, многие опасаются, что Ромен опустится до немыслимых уровней, чтобы достичь своей конечной цели. Тем временем его давний протеже и друг Макс Юдикур всё чаще появляется как более мягкая и благородная альтернатива своему старому учителю, увеличивая свою поддержку с каждым новым чудовищным действием, совершаемым Роменом и его силами."
haiti.551.a: "Мы должны следить за нашим уважаемым лидером, ибо он начал подрывать даже волю народа."

haiti.5000.t: "Борно уходит в отставку!"
haiti.5000.d: "В заявлении, которое потрясло нацию, президент Луи Борно публично объявил о своём намерении немедленно уйти с поста власти, открывая путь к истинной демократии на Гаити. Гаитянский народ ликует от Кап-Аитьена до Ле-Ке, ибо скоро их голоса обретут истинную силу! Вместо Борно была создана новая временная хунта, чтобы вести нацию, когда она мчится к своим первым свободным выборам за десятилетия. Однако, хотя и объединённые в цели, этот новый режим заполнен различными партиями - от военных до лоялистов Борно, поэтому этой временной администрации требуется новое лицо, которое будет служить её объединяющей фигурой. Основными кандидатами, претендующими на вершину списка, являются генерал Франк Лаво из Гард д’Гаити, ведущее лицо консервативной мулатской элиты нации Эли Леско и министр Поль Маглуар, верный консервативный лидер во время президентства Борно. Следует ли нам выбрать более стабильный вариант - Лаво, который гораздо более опытен и сдержан, но также с большей вероятностью вызовет гнев масс Гаити, особенно радикалов, или же выбрать Маглуара? Хотя Маглуар всё ещё молод и неопытен, по крайней мере, он не несёт с собой клейма Гард д’Гаити. Окончательный выбор должен быть сделан в ближайшее время, поскольку гаитянскому народу нужно новое лицо, вокруг которого можно сплотиться в эти тёмные и неопределённые времена."
haiti.5000.a: "Лаво - гораздо более стабильный выбор."
haiti.5000.b: "Гард достаточно долго запугивал Гаити, выбирайте Маглуара."
haiti.5000.c: "Мулатская элита, безусловно, приведёт нас к безопасности, выбирайте Леско."

haiti.7001.t: "Вторые гаитянские выборы"
haiti.7001.d: "Поскольку наша сияющая демократия пережила целый президентский срок, наша гордая Республика объявила о вторых честных и свободных выборах президента Гаити после восстановления истинной демократии здесь, в нашем процветающем государстве. Участвующие партии те же, что и в прошлом цикле, с одним важным исключением. Похоже, что за последние несколько лет титаны гаитянских левых Жак Ромен и Макс Юдикур, некогда близкие друзья и коллеги, теперь разорвали свои давние отношения, поскольку Юдикур основал свою собственную социалистическую партию. Критикуя своего старого учителя как тирана, Юдикур стремится принести новое социалистическое будущее для Гаити - гораздо менее централизованное и гораздо более демократичное, чем идеалы Ромена. Разделив огромную левую синдикалистскую партию надвое, Юдикур теперь ведёт свою партию «La Réaction Démocratique» в полной надежд гонке за президентство. Кто выйдет победителем - неизвестно, но вскоре воля народа решит судьбу Гаити."
haiti.7001.a: "Членам PSH и PRH удалось восстановиться!"
haiti.7001.b: "Народная социалистическая партия сметает бюллетени!"
haiti.7001.c: "Движение за свободу побеждает, смещая нас к розовой креольской демократии!"
haiti.7001.e: "Либеральная коалиция побеждает, укрепляя наши капиталистические корни!"
haiti.7001.f: "Национальная партия побеждает с явным перевесом!"

haiti.52.t: "Негодование нуаристов"
haiti.52.d: "Наше решение отступить перед лицом доминиканской жестокости вызвало гнев многих. В результате голоса внутри идентитарного движения «нуаристов» усилились, и многие простые граждане принимают их разрушительную идеологию."
haiti.52.a: "Тревожно."

haiti.53.t: "Подъём нуаристов"
haiti.53.d: "Движение нуаристов продолжает набирать народную поддержку, а наши усилия по ликвидации лидеров движения до сих пор провалились. Что-то должно измениться."
haiti.53.a: "Это необходимо остановить."

haiti.54.t: "Переворот нуаристов"
haiti.54.d: "В то время как Гард так долго пытался искоренить нуаристов, похоже, они наконец проявили себя - и при этом с оружием в руках. Порт-о-Пренс охвачен уличными боями между нуаристами и Гардом, нуаристы медленно пробиваются к центру города и нашему правительству."
haiti.54.a: "Переворот удаётся."
haiti.54.b: "Переворот проваливается."

haiti.55.t: "Гаити просит присоединиться к Интернационалу"
haiti.55.d: "Когда Гаити обрело независимость от Франции, мало кто ожидал, что страна когда-либо снова сблизится со своей метрополией. Со своей стороны, Гаити, казалось, предпочитало быть самостоятельным. Однако, к нашему шоку, они попросили присоединиться к нашему альянсу. Следует ли нам принять это предложение?"
haiti.55.a: "Да! Нам может пригодиться помощь."
haiti.55.b: "Они не стоят хлопот..."

haiti.56.t: "Гаити просит присоединиться к Антанте"
haiti.56.d: "Сегодня неожиданным шагом Гаити запросило вступление в альянс Антанты. Лидеры Канады и Франции разделились во мнениях относительно того, каким должен быть ответ на эту просьбу, но ясно, что их вступление может стать ещё одним шагом к контролю над Атлантикой. Следует ли нам разрешить им вступить?"
haiti.56.a: "Да, они послужат полезной базой..."
haiti.56.b: "Нам нет никакой пользы от этих проблемных гаитян!"

haiti.57.t: "Гаити просит присоединиться к Рейхспакту"
haiti.57.d: "Сегодня к нашим берегам пришло странное предложение из самого Гаити. Они просят о вступлении в наш альянс, ссылаясь на общего врага в лице Франции. Следует ли нам позволить этой бедной нации присоединиться к нашему могучему альянсу?"
haiti.57.a: "Одним больше - не повредит..."
haiti.57.b: "Нам не нужно ещё одно бремя для нашей казны!"

haiti.58.t: "Создание Пан-африканского движения"
haiti.58.d: "Панафриканизм существует как движение уже десятилетия, но никогда прежде идеалы панафриканизма не имели такой силы, как сейчас на Гаити. Под руководством Папы Дока мы могли бы создать поистине африканское государство для африканского народа и двинуться вперёд как единый народ, объединённый под одним знаменем. Следует ли нам воспользоваться этой возможностью, чтобы создать собственную фракцию?"
haiti.58.a: "Да, мы должны быть бдительны перед лицом наших врагов!"
haiti.58.b: "Мы не хотим гневить великие державы..."

haiti.5500.t: "Наши новые союзники"
haiti.5500.d.entente: "Старые державы Антанты удовлетворили нашу просьбу о вступлении в их альянс, и теперь мы готовы помочь отвоевать Европу и мир во имя этих держав."
haiti.5500.d.reichspakt: "Германская империя и её союзники приняли нас в свой альянс. Теперь мы стоим плечом к плечу с сильнейшей нацией на Земле и готовы представлять их интересы в Центральной Америке и, если потребуется, во всей Америке."
haiti.5500.d.internationale: "Синдикалистские нации Западной Европы приняли нас в свой альянс, что открывает путь к большему сотрудничеству между двумя регионами и, возможно, к новой эре успеха для Гаити..."
haiti.5500.a: "Ура!"

haiti.5501.t: "Наша просьба отклонена!"
haiti.5501.d: "Несмотря на все наши усилия, наша дипломатическая просьба о вступлении в число великих держав мира была отклонена. Хотя это неудача, мы не позволим их решению остановить нас..."
haiti.5501.a: "Как жаль!"

haiti.59.t: "Судьба Доминиканской Республики"
haiti.59.d: "Оккупация оказалась дорогостоящей, и теперь мы должны решить окончательную судьбу Доминиканской Республики. Некоторые призывают к её полной аннексии, в то время как другие настаивают, что она должна просто снова стать государством-марионеткой, на этот раз под более строгим надзором и контролем."
haiti.59.a: "Оставить их как марионетку под строгим надзором."
haiti.59.b: "Работать над интеграцией."

haiti.60.t: "Кризис на границе с Доминиканой"
haiti.60.d: "Пограничный регион между Республикой Гаити и Доминиканской Республикой долгое время был аморфным и почти беззаконным, поскольку границы продолжают меняться, а суверенитет над любым конкретным участком земли в регионе в разное время принадлежит то одной, то другой стороне. Это постоянное состояние неопределённости усугубляется тем фактом, что пограничный регион полностью заполнен коренными гаитянами, которые работают в регионе, в основном в сельскохозяйственной промышленности. Обычно эта ситуация бурная, но гражданская, но в последнее время правящий режим Доминиканской Республики неоднократно высказывал и продвигал антигаитянскую риторику и отправлял войска и полицию в пограничную зону для обеспечения своего представления о «мире».\n\nЧто ещё хуже, из гаитянского городка-лачуги Монте-Кристи в пограничном регионе поступают сообщения о том, что силы безопасности Доминиканы начали проводить жёсткую политику против наших гаитянских рабочих, а некоторых даже избили или убили. Если эту ситуацию не удастся урегулировать и деэскалировать дипломатическими средствами, многие опасаются, что война станет единственной альтернативой."
haiti.60.a: "Мы должны отправить мирную делегацию в Санто-Доминго!"
haiti.60.b: "Нам не нужно действовать пока! Следите за этим районом..."
haiti.60.c: "Это недопустимо, готовьтесь к войне!"

haiti.61.t: "Гаити предлагает сделку..."
haiti.61.d: "Карибский регион - одна из основных зон контроля Антанты, оставшихся в мире, во многом сохранившаяся в виде Федерация Вест-Индии. Однако, учитывая недавний хаос в Федерации и сравнительную стабильность нашего нового союзника Гаити, похоже, что другие острова могли бы кое-чему научиться у этого государства. Что ещё лучше, гаитяне предложили ассимилироваться в Федерацию Вест-Индии при условии, что им будет разрешено изменить название нового государства по своему усмотрению и что столица будет перенесена в Порт-о-Пренс. Удовлетворение этой просьбы могло бы помочь стабилизировать регион и позволить нам сосредоточить наши скудные ресурсы в другом месте, но мы также можем потерять контроль над территорией в процессе. Предвосхищая наши колебания, гаитянская делегация уже предложила дополнительно скорректировать сделку, чтобы лучше соответствовать нашим интересам. Они предложили передать как режиму в Алжире, так и нашей администрации в Оттаве полный и суверенный контроль над Суринамом и Французской Гвианой и Гайаной соответственно, вернув эти земли их бывшим колониальным хозяевам напрямую. В дополнение к этому они также предложили, чтобы флот Вест-Индии немедленно покинул порт и отплыл в канадские воды, чтобы вернуться под наше гордое командование - заманчивое предложение, учитывая, что наше улучшенное состояние больше не требует оставлять флот изгнанников разделённым. Наши варианты разнообразны, но время тикает. Что нам делать?"
haiti.61.a: "Одобрить окончательную сделку, пусть наш потерянный флот вернётся к нам вместе с Гвианским щитом."
haiti.61.b: "Одобрить изменённую сделку, Гвианский щит возвращается в европейские руки."
haiti.61.c: "Всё это излишне..."

haiti.62.t: "Канадцы отвечают!"
haiti.62.d: "Сегодня наш запрос к канадцам получил ответ, и могучая северная нация решила принять предложение о своих войсках и кораблях вместе с южноамериканскими колониями в обмен на контроль над Карибским бассейном. Однако эта сделка была принята легче, чем наши дипломаты изначально предполагали, и, возможно, мы могли бы попросить больше уступок. Однако это может поставить под угрозу сделку..."
haiti.62.a: "Сделка и так хороша!"
haiti.62.b: "Объяснить, зачем нам здесь корабли!"

haiti.63.t: "Канадцы отвечают!"
haiti.63.d: "К нашей радости, канадцы приняли наше предложение! Мы будем охранять Карибский бассейн для них, используя старый флот Вест-Индии, в то время как остальная часть Антанты будет сохранять контроль над Гвианским щитом. Это приемлемая сделка для всех участвующих сторон, и мы с нетерпением ждём нового будущего для Карибского региона."
haiti.63.a: "Замечательные новости!"

haiti.64.t: "Канадцы отвечают!"
haiti.64.d: "К нашему большому огорчению, сегодня канадцы сообщили нам, что отклоняют наше предложение. Похоже, они не доверяют нам достаточно, чтобы контролировать этот район, или иначе не желают отказываться от жизненно важных ресурсов и географических позиций, которые этот район может предложить. Это неудача для нашей нации, но мы всё равно будем идти вперёд!"
haiti.64.a: "Ужасно!"

haiti.65.t: "Гаитяне делают встречное предложение"
haiti.65.d: "Сегодня мы получили встречное предложение от правительства Гаити, что ошеломило многих наших дипломатов, ожидавших лёгкой сделки. Возможно, они увидели наше желание избавиться от Вест-Индии и знают, что нам отчаянно нужно лучшее управление в этом районе. Тем не менее, они попросили разрешить им оставить корабли старой Федерации, чтобы они могли лучше защищать этот район для Антанты. Следует ли нам принять это встречное предложение и потерять лицо?"
haiti.65.a: "Если мы должны..."
haiti.65.b: "Ни за что!"

haiti.66.t: "Требование креольского единства"
haiti.66.d: "Великое государство Гаити выросло из слабой и коррумпированной республики, разрушающейся под американской коррупцией, в маяк панафриканского единства в нашем жемчужном Карибском море. Однако Гаити - это не только африканская, но и креольская страна! Мы создали эту культуру после европейского угнетения, взяв всё хорошее, что могли, из их жалких традиций и смешав это с нашими собственными, чтобы создать нечто поистине уникальное - культуру, достойную нашего народа, который был украден с родного континента. Теперь, когда наш режим поднимает своё могучее знамя над этим зелёным архипелагом, мы обращаем взор на последний рай креольской культуры, который всё ещё languishing под иностранным контролем: Луизиану. Наши панафриканские братья в Республике Чёрного пояса теперь владеют этой землёй, и в интересах нашего народа потребовать эту территорию у них, ибо это в интересах Папы Дока, а Папа Док - это гаитянский народ."
haiti.66.a: "Немедленно отправить «запрос»!"

haiti.67.t: "Запрос на креольское единство"
haiti.67.d: "С нашими недавними приобретениями в борьбе за свободу мы теперь контролируем большие территории американского Юга. Имея так много земли, стабильность и единство стали ключевыми проблемами нашей администрации, особенно с ростом более неуправляемых элементов на наших более отдалённых территориях. Одним из таких проблемных районов, который становится всё более охваченным гражданскими беспорядками, является бывший штат Союза Луизиана, и возможное решение наших проблем всплыло на поверхность. На наш стол пришёл странный и суровый запрос от президента Гаити Франсуа «Папы Дока» Дювалье, известного панафриканского националистического автократа. В письме с решительной формулировкой, граничащей с требованием, этот «Папа Док» попросил наш режим передать административные права и контроль над Луизианой во имя «панафриканского сотрудничества и креольского единства», словами гаитянского диктатора. Мы могли бы выполнить эту просьбу, укрепив сотрудничество между двумя выдающимися государствами с большинством чёрного населения в Новом Свете и избавившись от головной боли с каджунскими повстанцами и остатками лонгистов. Однако это также глубоко оскорбит многих в нашей молодой нации, особенно более националистические элементы. Как нам ответить?"
haiti.67.a: "Удовлетворить просьбу Папы Дока во имя единства и сотрудничества между двумя нашими великими государствами."
haiti.67.b: "Немедленно отказать этому безумцу!"

haiti.68.t: "[BBR.GetName] отклоняет наше предложение!"
haiti.68.d: "Неожиданным поворотом событий [BBR.GetName] отклонил нашу просьбу о Луизиане. Действительно, это было маловероятное предложение, но мы надеялись, что они будут более готовы к сотрудничеству..."
haiti.68.a: "Позор!"
haiti.68.b: "К войне!"

haiti.69.t: "Вопрос об избирательных правах"
haiti.69.d: "В настоящее время в национальных выборах в государстве Гаити имеют право голоса только мужчины. Однако с нашими попытками установить «настоящую» демократию на Гаити многие осуждают отсутствие избирательных прав для женщин как смехотворно лицемерное. Хотя многие в нашей нации ненавидят эту идею, особенно многие среди нуаристов и других традиционалистских групп по всей стране, предоставление женщинам права голоса сейчас сильно укрепит нашу кампанию по демократизации в глазах масс, позволяя нашим первым настоящим выборам со времён прихода к власти президента Борно действительно представлять волю всех взрослых избирателей Гаити. Финальное голосование по этому вопросу уже на подходе, поскольку наши министры собираются на эту историческую сессию, в то время как нация с нетерпением ждёт окончательного решения. Финальные голоса подсчитываются, и, похоже..."
haiti.69.a: "...женское избирательное право наконец пришло на гаитянские берега, поскольку женщины получили право голоса."
haiti.69.b: "...женщинам Гаити придётся подождать, поскольку совет принимает единогласное «нет»."

haiti.70.t: "О соборах и песчаных замках"
haiti.70.d: "В 12:0 дня, каждую среду, радио по всему Гаити взрывается жизнью с имперским гимном, за которым следует спокойный, но властный голос Белого Императора Гаити на ломаном креольском. «Приветствую вас, граждане Гаити и люди мира, надеюсь, у вас хороший день. Сегодня по дороге в студию, откуда мы ведём эти передачи, я случайно проходил мимо пляжа, где увидел молодых, счастливых и здоровых детей, играющих, строящих песчаные замки и играющих в войну. Мы также проходили мимо прекрасного Кафедрального собора Богоматери Успения, чьи славные колокола звонили к Ангелусу. Зачем я рассказываю вам это, мои самые верные подданные? Что ж, ситуация, в которой оказалась наша нация, невероятно похожа. Прежде чем вы назовёте меня сумасшедшим, выслушайте меня. Славная Гаитянская империя, которую мы вернули со страниц истории, подобна песчаному замку. Наше правительство стоит как маяк стабильности, экономической нормальности и морального совершенствования, построенный с нуля. Вы, гаитянский народ, - песок, из которого мы строим песчаный замок государства. Даже если море смоет и расчистит песок, это только укрепит решимость строителя. Теперь возьмите тех, кто выступает против возрождения Империи: социалистов, республиканцев, радикальных нуаристов. Они подобны собору; то, что они есть, прекрасно, и то, что внутри, славно, но они становятся застойными. Соборы не стоят вечно, здания временны, и когда они разрушаются, как разрушается всё, их почти невозможно быстро и дёшево восстановить. Примите эти слова близко к сердцу, моё любимое Гаити. Спасибо и спокойной ночи»."
haiti.70.a: "Гаитянский песчаный замок стоит выше даже самого могучего собора."

haiti.71.t: "Быстрое окунание"
haiti.71.d: "Агенты Тонтон Макут ворвались на склад, тихо прочёсывая заброшенные коридоры к центральной камере объекта под покровом ночи. С ними был их драгоценный лидер Папа Док Дювалье и его последняя жертва, бывший президент Луи Борно. Давно считавшийся широкой общественностью Гаити мёртвым, Папа Док держал его скрытым в своей самой тёмной тюрьме, с нетерпением ожидая наиболее подходящего момента, чтобы избавиться от своего предшественника. Пока Пугала тащили избитое, окровавленное и без сознания тело бывшего президента, Папа Док следовал за ними, насмехаясь над своим едва живым противником, в то время как кровь продолжала литься из почти каждого отверстия разбитого лица Борно.\n\nНаконец Дювалье и его свита оказались в пункте назначения, стоя на верхних лесах и проходах этого старого винокуренного завода, паря в десятках футов над большими чанами с тревожно спокойной прозрачной жидкостью. Папа Док приказал своему верному эскадрону смерти привязать Борно за ноги, высоко подняв его над этими зловещими чанами с жидкостью. Давняя тактика, используемая Папой Доком и его Тонтон Макут, то, что ждало Борно внизу, было участью хуже любой смерти, которую он мог себе представить, ибо единственное, что ожидало Борно на дне его падения, - это несколько сотен галлонов серной кислоты. Хотя Дювалье редко когда проходил через все хлопоты этого казнённого театра, обычно просто окуная своих жертв пыток в гораздо более удобные бочки с едким веществом, он чувствовал, что печально известный президент-болонка Гаити заслуживает смерти, столь же волнующей, как и правление Борно и его предательство гаитянского народа. Итак, с последней насмешкой над своим старым врагом Папа Док бросил рычаг, который сбросит Борно к его окончательной и подобающей участи, в последний раз глядя в глаза избитого и напуганного мужчины..."
haiti.71.a: "...Смотри на меня, теперь я президент."

haiti.72.t: "Видения «Истинного Бокора»"
haiti.72.d: "Стойкий Папа Док долгое время страдал от множества проблем со здоровьем - слишком распространённая проблема для большинства гаитян, часто вызванная повсеместными плохими пищевыми привычками большинства нашего народа. Сам Дювалье должен делать инъекции инсулина каждый день, чтобы сдерживать последствия своего диабета, а также страдает от небольшого сердечного заболевания, которое не показывает никаких признаков замедления. Будучи склонным к неправильному обращению с лекарствами или игнорированию их в пользу средств вуду, Папа Док часто находится в изменённых состояниях сознания, впадая в кататонические состояния и даже перенося один-два небольших сердечных приступа. Часто он утверждает, что получает видения в эти периоды физической слабости, поскольку, как сообщается, он общается с Лоа, чтобы подчиняться их прихотям и желаниям. Его недавняя оплошность была катастрофической: передозировка инсулина отправила его в кому на несколько дней, оставив лидера Тонтон Макут Клемана Барбо и правую руку Папы Дока Лоримера Дени временно править вместо него. Хотя Дювалье с тех пор восстановился, он утверждал, что получил видение от Лоа, что Жак Ромен, ядовитая синдикалистская змея, которая уклонялась от поисковых отрядов Тонтон Макут, превратился в паршивую чёрную собаку и теперь свободно бродит по диким местам Гаити. Действуя на основе этого «божественного вдохновения», Папа Док приказал найти и убить всех чёрных собак в Гаити, независимо от того, бездомные они или домашние. Ромену больше не будет позволено заражать наш остров!"
haiti.72.a: "Некоторые говорят, что это болезнь, а я говорю - божественность!"

haiti.73.t: "Президент Дювалье отлучён от церкви!"
haiti.73.d: "После недавних действий президента Дювалье по изгнанию коррумпированного католического духовенства и полному принятию гаитянского вуду глупый старик в Риме отлучил нашего любимого президента от церкви! Хотя этого шага следовало ожидать, в конце концов, эти мошенники никогда не хотят потерять ни копейки, он всё же стал неожиданностью. В ответ на этот явный акт иностранного вмешательства в дела Гаити президент Дювалье объявил, что любой священник, епископ или архиепископ, отказывающийся присягнуть на верность ему и только ему, должен быть выслан из страны. Кроме того, вся церковная собственность, независимо от местонахождения, была национализирована. Несколько из этих конфискованных церквей были переданы местным жрецам вуду, манбо и бокорам, чтобы предоставить им более подходящее место для проведения их божественных ритуалов. Католические страны по всему миру осуждают эти действия как тиранические, и даже Соединённые Штаты, хотя и охваченные политическими потрясениями, присоединились к осуждению этого «нарушения религиозной свободы»."
haiti.73.a: "Вуду - это не суеверие. Это философия, концепция Бога."

haiti.74.t: "Кап-Айисьенский ренессанс"
haiti.74.d: "По мере того как наша родная культура залечивает раны, нанесённые американской оккупацией, новая искра на севере нашей страны зажгла огонь культурного возрождения и перерождения. Названный «Кап-Айисьенским ренессансом» из-за его явного сходства с Гарлемским ренессансом в Нью-Йорке, который начал процветать после Мировой войны, это новое возрожденческое движение вдыхает жизнь в спящие традиции Гаити и родные формы самовыражения. Начавшись в художественных коммунах и поэтических кружках в афро-гаитянских трущобах Кап-Аитьена (или Кап-Айисьен на креольском), оно с тех пор распространилось на другие крупные города Гаити - от Порт-де-Пэ до Ле-Ке, окутывая нацию новым золотым веком гаитянского обновления. Движение выросло настолько, что привлекло внимание знаменитых художников, музыкантов и писателей африканской диаспоры, таких как Лэнгстон Хьюз, Билли Холидей, Луи Армстронг, Чандлер Оуэн и многих других, которые все вносят свой вклад в распространение результатов этого нового источника вдохновения, извергающегося в Гаити. Наша воля и образ жизни больше не будут увядать на страницах истории. Мы здесь, мы - гаитяне, и наша культура не будет забыта!"
haiti.74.a: "Новое негритянское движение, специально для гаитянского народа."

haiti.75.t: "Возвращение Белых законов"
haiti.75.d: "С каждым днём мулатское и белое влияние изгоняется из нашего режима и за наши границы. Папа Док решил наконец ввести в действие своё долгожданное новое законодательство: возвращение «Белого запрета», которым Гаити когда-то было печально известно. Несмотря на название, закон не запрещает белым людям пересекать наши границы, но он запрещает им когда-либо снова владеть собственностью здесь, на Гаити, при этом вся текущая собственность белых конфискуется государством. Однако, в отличие от первоначального запрета, Дювалье распространил эти ограничения и на мулатских элит, в отношении которых можно доказать, что они как минимум наполовину белые. Хотя это более многочисленная группа, чем белые гаитяне, мулаты всё равно меркнут по сравнению с афро-гаитянским населением, которое составляет более 95% населения. Время, когда афро-гаитяне - и только афро-гаитяне - будут получать выгоду от нашей нации, начинается сейчас!"
haiti.75.a: "Ни один белый дьявол больше не осквернит нашу священную землю."

haiti.76.t: "Пан-африканский Интернационал"
haiti.76.d: "Поскольку так много других групп, движений, идеологий, доктрин и других социальных объединений проводят свои собственные национальные и международные конференции, естественно, что мы тоже проведём свою. Интернационал для чёрной расы, чтобы обсудить наши общие интересы для единой и объединённой Пан-Африки. Из всех уголков африканской диаспоры и во все концы самого родного континента мы пригласим величайшие умы и фигуры наших общих народов. Титаны пан-африканской борьбы и борьбы за освобождение чёрных, включая Маркуса Гарви, Сан Ра, Джомо Кениату, Лэнгстона Хьюза, Ннамди Азикиве, Обафеми Аволово, У.Э.Б. Дюбуа, Кваме Нкруму, Собхузу II, Хайле Селассие, Мартина Лютера Кинга-старшего, Дусе Мохамеда и многих других в диаспоре и в самой Африке. Порт-о-Пренс станет подходящим местом для этой исторической встречи, и коллективно эти величайшие умы и лидеры детей Африки будут стремиться облегчить участь наших народов по всему миру, одновременно укрепляя более тесные связи друг с другом. Мы - многие народы, объединённые общей историей и культурой. Давайте примем то, что делает нас похожими, а не мелкие различия, которые разделяют нас. Ибо если мы едины, ни один враг не сможет остановить нас!"
haiti.76.a: "Африка, как Старая, так и Новая, - для африканцев."

haiti.77.t: "Неожиданный гость"
haiti.77.d: "«Сегодня был почти шокирующе спокойный день», - подумал про себя Святой Отец, потягивая чай и размышляя о событиях дня, как он делал каждый вечер. Действительно, день был невероятно скучным: мало писем, меньше заговоров и ещё меньше активности на границе с синдикалистами. Хотя такие дни были благословением, они всегда держали Наместника Христа в напряжении, так как эти дни обычно были затишьем перед бурей. Этот день не станет исключением.\n\nНа грани засыпания Преемник Святого Петра внезапно проснулся от звука стука в дверь. «Войдите!» - сонно воскликнул Его Святейшество. Когда дверь открылась, помощник Понтифика сказал ему, что Жозеф-Мари Ле Гуаз, архиепископ Порт-о-Пренса, столицы Гаити, прилетел в Рим, чтобы срочно встретиться с ним...\n\nПосле почти трёхчасового разговора с архиепископом, который подробно рассказал о том, как Гаити попала под контроль правительства, полностью принимающего вуду - дьявольскую смесь католицизма, африканских родных религий и других подобных практик, - казалось, что Гаити в кризисе. Архиепископ умолял Папу официально отлучить [HAI.GetLeader] от церкви, чтобы дать понять, что Церковь не потерпит таких извращений католической религии. Отпустив архиепископа, Его Святейшество берёт свою ручку и..."
haiti.77.a: "...пишет официальное отлучение [HAI.GetLeader] от церкви за практику и публичное принятие язычества."
haiti.77.b: "...пишет письмо «Фостену Виркусу» с просьбой объясниться и требованием покаяния."
haiti.77.c: "...снова кладёт её, решая, что Церковь на Гаити может справиться с этим сама."

haiti.78.t: "Император Фостен отлучён от церкви!"
haiti.78.d: "Хотя и считая себя в душе хорошим католиком, даже если он использует эстетику и ритуалы вуду в своём правлении, император Фостен II был официально отлучён Папой от церкви за «публичную демонстрацию и участие в языческих ритуалах». Это стало неожиданностью, поскольку Фостен верил, что «окатоличивает» вуду из-за своего принятия его. Несмотря на эту неудачу в его отношениях с Церковью, он не сделал ничего в отместку, как многие ожидали. Вместо этого он просто продолжает свою миссию - защищать и служить народу Гаити, материально и духовно."
haiti.78.a: "Неудача, безусловно, но ничего, с чем я не могу справиться."

haiti.79.t: "Письмо от Папы"
haiti.79.d: "Сегодня в Императорский дворец прибыло письмо на имя императора Фостена - и ни от кого иного, как от самого Папы! В письме Его Святейшество излагает свою озабоченность по поводу принятия Фостеном вуду, говоря, что это может привести к «его духовной гибели и возможной одержимости». Он спрашивает, почему он будет делать что-то столь опасное, особенно когда он знает о рисках. Далее он требует, чтобы Фостен публично покаялся и отрёкся от этой оккультной и языческой религии. Император, конечно, не намерен отрекаться от вуду. Вместо этого он отвечает Папе на обратной стороне, объясняя, что он просто использует вуду и что не всё в нём от дьявола. Он даже просит создать «Гаитянский обряд», чтобы разрешить отправление тех частей вуду, которые, как утверждает Фостен, являются духовно благими. Хотя это, безусловно, не теологический труд и явно работа мирянина, если Его Святейшество примет его, письмо Фостена может стать одним из важнейших произведений католической литературы двадцатого века."
haiti.79.a: "Возможность служить одновременно Богу и гаитянскому народу - моя гордость и радость."

haiti.80.t: "Письмо от императора Гаити"
haiti.80.d: "Как и ожидалось, так называемый император Гаити отправил письмо с ответом Его Святейшеству. Фостен действительно объяснил свою позицию, заявив, что он просто использует вуду для легитимизации своей власти, и что не всё в вуду от дьявола. Однако неожиданно он попросил создать «Гаитянский обряд», чтобы разрешить отправление тех частей вуду, которые, по утверждению Фостена, являются духовно благими. Хотя это, безусловно, не теологический труд и явно работа непрофессионала, он излагает свои аргументы с большой ясностью и очевидным уважением к человеку, к которому они обращены. Если Его Святейшество примет это предложение, Гаити станет одним из немногих случаев, где латинский обряд католицизма не соблюдается неукоснительно. Как и во всех вопросах, касающихся веры и морали, выбор принадлежит Папе и только Папе."
haiti.80.a: "Хм. Он приводит убедительные доводы. Разрешить создание этого «Гаитянского обряда»."
haiti.80.b: "Кем он себя возомнил? Немедленно отлучить его от церкви!"

haiti.81.t: "Император Фостен отлучён от церкви!"
haiti.81.d: "Несмотря на его письмо Понтифику, император Фостен II был официально отлучён от церкви Папой за «публичную демонстрацию и участие в языческих ритуалах». Хотя это не было неожиданным, поскольку Фостен просил о многом, это всё равно печальный шаг. Тем не менее Император решил не позволить этому сбить себя с пути. Он по-прежнему будет заботиться о гаитянском народе как о своём собственном, защищая его от всех опасностей и стараясь вести его как можно лучше."
haiti.81.a: "Разочаровывает, но я буду присматривать за своими овцами, как Папа - за своими."

haiti.82.t: "Новый хозяин встречает свою паству"
haiti.82.d: "Поскольку его правление хорошо укрепилось, а его администрация работает без серьёзных заминок и сбоев, Макс Юдикур смог тратить меньше времени на работу и больше на занятия более элитарными увлечениями. Не нуждаясь в работе в полях или на фабриках, как рабочие, которым он, очевидно, посвятил свою жизнь, Юдикур теперь начал следовать по стопам своего собственного Хозяина. Используя свою партию, PSP, как источник ресурсов и помощи, Юдикур основал своего рода собственную школу, где он стремится обучить следующее поколение социалистических мыслителей для Гаити. Встречаясь с молодыми, многообещающими интеллектуалами, включая Тони Блонкура, Жака Стивена Алексиса, Рене Депестра и Макса Шанси, среди прочих, Юдикур надеется взрастить социалистическую мысль для будущих поколений. Он станет новым отцом и хозяином целой новой эры гаитянского социализма, на которую повлияют он сам и его собственные взгляды."
haiti.82.a: "Социализм станет частью самого Гаити, укореняясь всё глубже с каждым новым поколением, выросшим под опекой Юдикура."

haiti.83.t: "Гаитянский обряд Католической церкви"
haiti.83.d: "После того как Папа принял предложение Императора, Католическая церковь официально создала «Гаитянский обряд». Хотя основой обряда является обычный латинский обряд, он сильно модифицирован. В отличие от обычного латинского обряда, Гаитянский обряд читается на креольском, но это, пожалуй, наименьшее из изменений. Каждый хунофор был освящён, что означает, что они являются действительными местами для проведения мессы. Многие уже существующие приходы были, по сути, переоборудованы, чтобы больше походить на хуноферы вуду; самым заметным изменением является замена традиционного алтаря на Потамитан - «центральный столб», вокруг которого произносится месса. Наряду с этим, барабаны и другие подобные инструменты также используются во время вступительных и заключительных гимнов. Кроме того, некоторые упоминания о святых были слегка изменены, чтобы соответствовать их аналогам-веве. Самое спорное изменение: женщины-жрецы вуду получили право читать всё, кроме Евангелия, которое по-прежнему зарезервировано только для священника.\n\nХотя эти изменения всё ещё новы и продолжаются, императорское правительство и церковные власти надеются, что со временем Гаитянский обряд полностью вытеснит вуду. Несмотря на это, не все довольны изменениями. Некоторые более традиционные теологи уже называют этот шаг Святого Отца ересью или принятием язычества. Некоторые протестантские группы называют это доказательством того, что Католическая церковь - языческая религия. Тем не менее, похоже, что попытки Фустиана II использовать вуду как способ католицизации Гаити увенчались успехом."
haiti.83.a: "Преемник Папы Легбы доказал, что он истинный друг гаитянского народа."

haiti.84.t: "Отец Гаитянского центра"
haiti.84.d: "Хотя наша либерально-консервативная коалиция велика и разнообразна, один человек всё ещё стоит в центре всего этого - Жан Прайс-Марс. Странное сочетание антиэлитарного популиста и убеждённого консерватора, когда дело касается гаитянского народа и его традиций, Прайс-Марс смог найти общий язык с группами, о которых ни один другой центрист в Гаити не мог и мечтать. Его интересы и убеждения разнообразны, нюансированы и полностью развиты благодаря его собственному острому интеллекту и проницательному уму. Будучи обученным как учитель и этнолог, он уделяет большое внимание документированию и сохранению врождённой культуры и уникальности Гаити, возглавляя такие движения, как негритюд и нуаризм. Его карьера и дело всей жизни - это маяк, который дерадикализировал большую часть гаитянских политических крайностей, способствуя укреплению чувства единства и сотрудничества среди наших народов, сотрудничества, невиданного ранее. Он истинный отец современного и свободного Гаити. Он работает внутри коалиции со всеми своими коллегами как с истинно равными, помогая им стать лучше, в то время как они, в свою очередь, улучшают Гаити в целом. Вместе, под руководством Прайс-Марса и других подобных ему фигур единства, таких как Луи Дежуа и Стенио Винсент, демократические традиции и либеральные идеалы Гаити находятся в безопасности, как и его традиции и исторический уклад жизни."
haiti.84.a: "Истинный сын Гаити, если такой вообще существовал."

haiti.85.t: "Гаити: Голгофа солдата"
haiti.85.d: "Книжные магазины и другие литературные лавки сегодня переполнены, поскольку известный лидер левых и бывший офицер Гард д’Гаити Демосфен Каликст выпустил свой новый полнометражный роман. Автобиографическое произведение о его собственной политической и военной карьере, роман даёт подробное представление о ключевых моментах жизни Каликста, как они происходили: от переживания попытки Папы Дока захватить власть и спасения Гаити от националистических радикалов до службы под американской оккупацией в качестве офицера кавалерии, когда он был вынужден бороться с лояльностью к своей должности и лояльностью к своему народу. Хотя некоторые критики назвали книгу поверхностной или пустой, большая часть публики открыто восхищалась этим редким взглядом на жизнь своего лидера, и книга была распродана по всей стране. Похоже, Каликст снова завоевал сердца людей."
haiti.85.a: "Истинный воин-поэт."

haiti.86.t: "Держи друзей близко..."
haiti.86.d: "Задолго до того, как они оба вышли на политическую сцену, Жак Ромен и Карл Бруар поддерживали тесную дружбу и уровень сотрудничества. Они часто сотрудничали в литературных произведениях и философии, перебрасываясь шутками и споря из-за их противоположных идеологических установок. Однако их любовь к Гаити, их общая культура и их преданность таким движениям и идеалам, как нуаризм и негритюд, укрепили их узы за гранью, где их невозможно было бы разорвать mere разногласиями по экономическим вопросам. Но со временем, когда реалии политической борьбы Гаити стали более очевидными, Ромену пришлось принять правду: как бы близки ни были эти две творческие легенды, ничто не могло помешать Гаити достичь своей судьбы с Роменом у руля. Осознав это, Ромен знал, что должно было быть сделано. Поскольку Карл Бруар был лицом радикальных нуаристов, их прошлые связи теперь вызывали лишь подозрения среди его товарищей-красных. Ромен должен был заставить своего старого друга замолчать раз и навсегда. Зная, что Бруар обычно находится в своей квартире, запивая горе и стресс, Ромен приказал своей верной милиции убить беднягу безболезненно, во сне - настолько справедливую смерть, какую он мог дать своему старому соратнику. Теперь он сидел за своим столом, ожидая вестей от своих людей о том, что дело сделано, потягивая ром из последней бутылки, которую его дорогой, но ужасно алкоголичный друг оставил ему при последней встрече, вспоминая лучшие времена."
haiti.86.a: "...но врагов держи ещё ближе."

haiti.87.t: "Жемчужина Карибского моря"
haiti.87.d: "Гаити долгое время подвергалась прихотям иностранных капризов и империалистической жадности; сама нация родилась в огне колониализма в эпоху Великих географических открытий. Прозябая под испанскими исследователями, французскими рабовладельцами и, совсем недавно, американскими морпехами и бизнесменами, гаитянский народ провёл большую часть своей истории под сапогом угнетения.\n\nАмериканцы были последними «благодетелями», удостоившими нас своим присутствием, впервые похитив наш суверенитет в 1915 году. Долгих 20 тяжёлых лет эти янки и их приспешники правили гаитянским народом железной хваткой, а их самой преданной марионеткой был нынешний президент Луи Борно, назначенный американскими оккупантами в 1922 году. С тех пор Борно и его покровители из Соединённых Штатов внесли скромные улучшения в общую экономику и инфраструктуру Гаити, хотя большая часть прибыли от этого роста идёт прямо в карманы американских друзей Борно. Кроме того, командир морской пехоты Джон Рассел управляет Гард д’Гаити - единственной постоянной военной силой Гаити, используя её как полувоенную группу и лоббистскую группу для интересов Вашингтона. Однако их господство не могло длиться вечно...\n\nС Великой депрессией и внутренними распрями, вынудившими основные силы американских оккупационных войск покинуть наши берега зимой 1935 года в водовороте паники и хаоса, Гаити теперь балансирует на грани краха, поскольку внутренние фракции и радикальные движения стремятся разорвать Гаити на части в своих нечестивых целях. Слева Жак Ромен и его протеже Макс Юдикур призывают к прекращению тирании Борно, чтобы Красный прилив захлестнул наш островной дом, в то время как справа Карл Бруар ведёт своего жаждущего власти ученика Франсуа Дювалье и остальных националистических, пан-африканских нуаристов, требующих полного преобразования гаитянского общества, избавления его от любого иностранного влияния. Шторм в Гаитянском центре переживают умеренные гиганты, такие как Жан Прайс-Марс и Стенио Винсент, и даже ходят слухи, что некоторые внутри самой Гард д’Гаити тоже строят планы по захвату власти.\n\nГаити теперь стоит на краю своей судьбы, и всё, что ей сейчас нужно, - это толчок в правильном направлении..."
haiti.87.a: "L'Union fait la force"

haiti.88.t: "Хозяин пугал"
haiti.88.d: "По мере того как хватка Франсуа «Папы Дока» Дювалье на Гаити становится всё туже, неорганизованная чернь, которую мы называем армией, продолжает прозябать, поскольку скудное количество доступных военных кадров и финансирования Гаити уходит на собственную тайную полицию Папы Дока. Когда-то называемые кагулярами (людьми в капюшонах) и Milice Civile, народ Гаити знает их только как Тонтон Макут, и их лидер - именно тот человек, который нужен армии Гаити, чтобы поднять её из пепла её былой славы. Клеман Барбо, глава этого личного полувоенного формирования, долгое время служил Папе Доку и его режиму, и он вместе со своим братом Гарри сыграл важную роль в обеспечении прихода Дювалье к власти в качестве ведущих фигур военного крыла нуаристов. Никогда не возражая против непотизма и вознаграждения тех, кто лоялен ему, Папа Док объявил, что Клеман Барбо повышен до нового фельдмаршала вооружённых сил Гаити, став ведущей фигурой как в официальных, так и в полулегальных военных ветвях Гаити. Хотя его назначение перепрыгивает через возможное повышение многих других ценных, проверенных и опытных военных, которые могли бы возглавить наши армии, Папа Док ставит лояльность выше всего. Предоставляя ему эту высокую должность официального правительственного лица, Дювалье надеется держать Барбо и его растущие амбиции под контролем, позволяя ему одновременно расширять и улучшать вооружённые силы Гаити, не упуская из виду этого возможного змея."
haiti.88.a: "Держи друзей близко, а соперников - ещё ближе."

haiti.89.t: "Август Дерлет и гаитянский оккультизм"
haiti.89.d: "В начале 1930-х годов Август Дерлет - знаменитый американский писатель-фантаст и один из самых многообещающих «лавкрафтовских» авторов - отправился на наш яркий и богатый культурой остров Эспаньола, чтобы погрузиться в гаитянские традиции. Находясь здесь, он путешествовал по гаитянской сельской местности и каждому уголку наших деревень и городов в поисках увлекательных аспектов нашей местной мифологии и духовных идей, которые можно было бы включить в его собственные сочинения. Узнав о Лоа из нашей веры вуду и о рассказах о колдунах и унганах, истории, которые действительно заинтересовали Дерлета, были местные повествования о нежити, и именно это заставило его вернуться сюда сейчас.\n\nВ гаитянской традиции существуют существа, известные как Зомби. Бокор - гаитянские тёмные жрецы, противостоящие унганам - якобы создают этих «неживых» зомби, забирая «ти бон анж» (половину дуальной души в вуду, которая контролирует свободную волю) и помещая её в бутылку, что позволяет бокору контролировать жертву после смерти, поскольку ти бон анж затем может манипулировать «гро бон анж» (второй половиной дуальной души, которая контролирует тело). Создаваемые существа - бездумные оболочки, полностью порабощённые воле своего хозяина, не имеющие разума и не чувствующие боли или каких-либо эмоций. Их создают, а затем кормят ядом, приготовленным из местной флоры и фауны, который заставляет их казаться мёртвыми, чтобы их близкие похоронили их и жили дальше. Затем Бокор эксгумирует этих порабощённых слуг для использования в качестве личных слуг, в то время как семья считает их мёртвыми, что создаёт у сторонних наблюдателей вуду впечатление, что зомби - это настоящие живые мертвецы, как в любопытном и известном случае Клервиуса Нарцисса - молодого гаитянина, который утверждал, что был превращён в зомби, а его история была освещена выпускником Гарварда и этноботаником Уэйдом Дэвисом.\n\nВсегда находя эту практику и всю веру вуду глубоко интересными, Дерлет вернулся на наш островной рай, чтобы написать ещё больше на эту тему. Любимый автор - знакомое лицо, и наша нация сделала всё возможное, чтобы быть гостеприимной, чтобы сохранить лицо перед миром. Теперь, когда Дерлет ходит по Порт-о-Пренсу и всей Гаити в поисках искры вдохновения, мы присматриваем за этим иностранцем из тени. Независимо от того, что он найдёт, Дерлет, несомненно, насладится отдыхом среди пальм и тропического бриза нашего культурного тропического оазиса."
haiti.89.a: "Зомби, Лоа и унганы, о боже!"

haiti.90.t: "Истинный король Гаитянской империи"
haiti.90.d: "Несмотря на его любимую репутацию среди граждан Гаити, многие на нашем прекрасном острове начали сомневаться в реальности того, что белый монарх правит нацией, которая примерно на 98% состоит из афро-гаитян. Эти радикалы начали сомневаться в воле императора Фостена Виркуса и вместо этого объединили свою поддержку вокруг некоего «принца» Жозефа-Фостена д’Гаити, который является истинным наследником и потомком изначального императора Фостена из Второй Гаитянской империи. Эти фанатики хотят, чтобы нынешний монарх был заменён тем, кого они объявляют истинным наследником наследуемого трона, но у нынешней администрации много лоялистов, которые сопротивляются этой позиции. Должны ли мы уступить этим так называемым «истинным гаитянским монархистам» или мы должны продолжать поддерживать Белого Негра-императора этой новой Гаити?"
haiti.90.a: "Фостен Виркус - истинный монарх, сейчас и навсегда!"
haiti.90.b: "Мы преклоняем колени перед единым истинным королём!"

haiti.91.t: "Флаг Anpi an Ayiti"
haiti.91.d: "С восшествием истинного наследника императора Фостена I и изначальной второй Империи Гаити, или Anpi an Ayiti, как она известна на местном креольском, в монархических кругах возникла небольшая дискуссия, а именно по поводу дизайна нашего флага. Флаг, который мы сейчас развеваем, был тем же флагом, который использовал Фостен I, но в глазах многих он был осквернён ложным Белым Негром-императором Фостеном Виркусом. Эти критики вместо этого предлагают принять флаг и идентичность одного из старых монархических движений Гаити. Наиболее вероятным вариантом было бы использование флага первого Anpi an Ayiti, которое было сформировано и возглавлено великим гаитянским героем Жан-Жаком Дессалином. Однако бывший президент, ставший монархом, король Гаити Анри Кристоф использовал два разных флага за время своего правления как единственный монарх Wayòm an Ayiti, и оба этих дизайна также имеют свои достоинства. Что мы должны решить?"
haiti.91.a: "Использовать наше законное знамя - флаг Второй империи и Фостена I."
haiti.91.b: "Выбрать флаг Первой империи Дессалина."
haiti.91.c: "Использовать первый флаг королевства Кристофа."
haiti.91.e: "Использовать второй флаг королевства Кристофа и провозгласить новое Wayòm an Ayiti."

haiti.92.t: "Флаг для нашего пан-африканского движения"
haiti.92.d: "С нашим решением поднять факел пан-африканского единства и объединить наших заблудших братьев возник вопрос о флаге, который подходит для представления наших амбициозных целей. Должны ли мы принять пан-африканский триколор, популяризированный Маркусом Гарви и UNIA, или цвета, символизирующие движение негритюд, которое набрало популярность во Французской Западной Африке и Карибском бассейне."
haiti.92.a: "Обратиться к более широкому африканскому единству, используя цвета UNIA."
haiti.92.b: "Принять наше французское влияние, используя цвета зарождающегося движения негритюд."

haiti.93.t: "Масштабы наших пан-африканских амбиций"
haiti.93.d: "Поскольку наши устремлены на освобождение Старого Света от слабости и вероломства, масштабы нашей борьбы стали предметом раздора для Папы Дока. Хотя искупление земель Невольничьего берега является гарантированным обязательством нашего пан-африканского движения, освобождение всего континента - более благоприятный шаг, поскольку мы сможем наконец объединить Африканский континент раз и навсегда. Однако такой идеал будет невероятно сложной задачей, и сосредоточение нашего внимания на первом варианте было бы относительно более реалистичным и выполнимым."
haiti.93.a: "Остаться с нашими нынешними претензиями."
haiti.93.b: "Вся Африка должна быть освобождена!"

haiti.94.t: "Растущий фракционизм внутри PSH"
haiti.94.d: "Поскольку Жак Ромен и его реформированный PSH продолжают толкать Гаити к его воображаемой судьбе, многие из самых радикальных членов Parti Syndicaliste Haïtien, организованные в маргинальную отколовшуюся группу PRH (Parti Révolutionnaire Haïtien), начали публично выражать своё недовольство увлечённостью Ромена французской идеологией синдикализма, которая, по-видимому, противоречит его индиженистским и афроцентричным тенденциям, ведь именно французы так долго угнетали Гаити, что создали те суровые условия, которые делают социализм популярным и, трагически, необходимым в современном Гаити. Ромена в основном защищает лишь растущая клика фанатичных нуаристов, поддерживаемая старыми националистическими приятелями Ромена, такими как Карл Бруар и Кловис Дезинор, и его прошлое решение вытеснить всех умеренных из партии теперь наконец возвращается, чтобы навредить ему, поскольку единственным умеренным, оставшимся в его углу, является «Профессор» Пьер-Эсташ Даниэль Финьоле и его популистская группа умеренных синдикалистов и социалистов, называемая Mouvement pour l'Organisation du Pays, которые организуют великие митинги, называемые «паровыми катками» - woulo konpresè - и одновременно стремятся взять под контроль партию и всю революцию, чтобы по-настоящему освободить Гаити от элитизма, что, вероятно, вынудит Ромена занять младшую позицию в администрации, если они придут к власти.\n\nВедущими фигурами оппозиционного PRH являются молодой поэт и коммунистический агитатор Жак Стивен Алексис, прямой потомок великого Жан-Жака Дессалина, проповедующий форму афрокоммунизма, вдохновлённую якобинцами и черпающую из пан-африканских теорий, таких как Онъянго Обама, Кваме Нкрума и Джордж Падмор, а также бывший актив американской морской пехоты, ставший лидером революционеров, Жозеф Жолибуа Фильс, который борется против империализма, как современный Туссен-Лувертюр, излагая нуаристскую риторику, вдохновлённую его старыми разговорами с Жаном Прайс-Марсом, придерживаясь интернационалистской позиции в отношении глобального синдикалистского, коммунистического и социалистического сотрудничества. Поскольку эти фракции теперь открыто борются за контроль над партией, Ромену предстоит решить, что делать, иначе Гаитянская революция выскользнет из его рук."
haiti.94.a: "Ромен стоит один и стоит твёрдо!"
haiti.94.b: "Молодая восходящая звезда и радикальный поэт Жак Стивен Алексис берёт контроль."
haiti.94.c: "PSH становится младшим членом коалиции с PRH под руководством Жолибуа."
haiti.94.e: "Ромен встаёт на сторону радикального нуаризма, чтобы сохранить контроль над партией."
haiti.94.f: "Ромен уступает контроль над партией MOP Финьоле."

haiti.95.t: "Новый хозяин и его новый соперник"
haiti.95.d: "Несмотря на то, что он довольно эффективно управлял PSP в течение длительного времени, многие всё ещё с опаской относятся к былому радикализму президента Макса Лелио Юдикура и его карьере маргинального национального коммуниста, связанного с националистом Жаком Роменом, прежде чем последний дрейфовал к синдикализму, а Юдикур начал придерживаться более демократических течений коммунистической и социалистической мысли. Эти критики опасаются, что однажды президент Юдикур внезапно обрушит Гаити в авторитарную практику, основанную на якобинской или большевистской автократии, и вместо этого хотят более мягкой руки, направляющей партию, хотя многие шепчутся, что эти обвинения - всего лишь ширма, скрывающая правду - что это просто анти-мулатский расизм и нуаристский афро-гаитянский национализм, подпитываемые страхами и отвращением к воспитанию Юдикура в богатой смешанной семье.\n\nПредпочитая умеренного левого с документами, подтверждающими его опыт и сдержанность, эти критики назвали либерального рабочего лидера и популистского профсоюзного организатора Даниэля Финьоле своим предпочтительным кандидатом на пост лидера PSP. Давний ведущий член левой сферы нации - руководящий своим собственным Mouvement pour l'Organisation du Pays, который организует великие митинги, называемые «паровыми катками» - woulo konpresè - и одновременно стремящийся взять под контроль партию и всю революцию, чтобы по-настоящему освободить Гаити от элитизма, Даниэль Финьоле также известен тем, что активно сопротивлялся поддерживаемым американцами консервативным клептократам режима Борно, но через всё это он сохранил свои умеренные и синкретические позиции; причудливую социалистическую идеологию, которую он называет финьолизмом, выступающую за ненасильственный нуаристский национализм, антиэлитарный синдикализм, феминизм, популизм и собственную версию Гаити политики социального обеспечения «честной сделки». Должно ли Финьоле позволить взять на себя руководство партией, чтобы успокоить страхи и расовые предрассудки этих умеренных, или Юдикур и его годы службы и успехи смогут убедить своих коллег в PSP, таких как другие лидеры партии Энтони Леспес и Этьен Шарлье, в его приверженности умеренному электорализму, как он уже это сделал, позволив ему продолжать быть ведущим лицом PSP в будущем? Если всё остальное не поможет, он всегда может обратиться к своему старому наставнику Ромену за поддержкой, если потребуется..."
haiti.95.a: "Даниэль Финьоле берёт на себя руководство, чтобы успокоить партию и массы."
haiti.95.b: "Юдикур каким-то образом успокаивает страхи партии."
haiti.95.c: "Юдикур полагается на своих старых радикальных союзников, чтобы выжить."

haiti.96.t: "Судьба режима Каликста"
haiti.96.d: "Полковник и президент Демосфен Петрус Каликст создал креольскую демократию своей мечты, наконец освободив низшие классы Гаити от мулатского элитизма и американского угнетения в миссии, которую он начал много лет назад, когда дезертировал из морской пехоты США, чтобы сражаться за своих собратьев-гаитян. Военный в душе, Каликст жаждет либо заслуженной отставки дома, либо почётной смерти на поле боя - ни того, ни другого он не сможет насладиться, всё ещё находясь в президентском кресле, растрачивая себя в борьбе с бюрократией и законодательным органом. Перед ним есть несколько вариантов решения этой его проблемы.\n\nВо-первых, он может взять себя в руки и остаться президентом ради блага нации и партии, наблюдая за честной и свободной демократической системой, которую он создал, чтобы гарантировать, что она просуществует достаточно долго, чтобы укорениться и стать самодостаточной и самоконтролирующейся, или, по крайней мере, он на это надеется. Во-вторых, он может уйти в отставку, уступив своему преемнику - креольскому рабочему лидеру и активисту Даниэлю Финьоле, известному своими импровизированными народными протестами и митингами, называемыми «woulo konpresè» (паровые катки), которые приводили массы в неистовство, когда он излагал риторику, включающую популизм, феминизм, демократический синдикализм и антиэлитизм, и призывал к независимости и демократическому управлению гаитянского народа и для гаитянского народа, достигнув пика своей популярности во время поддерживаемого американцами режима Борно, прежде чем Каликст помог принести демократию в Гаити и Финьоле - в национальное правительство.\n\nПрозванный Профессором своими разнообразными группами сторонников, Финьоле - харизматичный глава своего собственного популистского массового движения, имеющий политические связи внутри PSP и с другими либеральными и социалистическими группами по всей Гаити. Способный и верный сын Гаити, доказавший свою ценность как Каликсту, так и, что более важно, широкой гаитянской общественности своими эффективными реформами, направленными на улучшение повседневной жизни рабочего класса, Финьоле - подходящий человек для руководства нацией в отсутствие Каликста, если до этого дойдёт, несмотря на то, что он заставляет оставшуюся мулатскую элиту нервничать своими разговорами о национализации и перераспределении богатства. В-третьих, Каликст мог бы применить свои военные мышцы в последний раз, создав военный наблюдательный совет, который будет служить избирательным и исполнительным надзирателем за социальной демократией, которую он так тщательно построил, гарантируя, что ничего плохого не случится с его любимой демократической системой, пока он переходит в полуотставку с помощью Финьоле. Однако это, вероятно, приведёт к падению популярности Каликста среди масс, поскольку люди боятся, что полковник превратится в собственного каудильо Гаити, и увидят в этом, казалось бы, авторитарном шаге отказ Каликста от власти. Что он решит?"
haiti.96.a: "Каликст снова надевает бархатную перчатку, оставаясь президентом."
haiti.96.b: "Каликст уходит в отставку и уступает гражданскому лицу Даниэлю Финьоле."
haiti.96.c: "Каликст проявляет свою железную хватку и устанавливает защитные меры, прежде чем отойти в сторону."

haiti.97.t: "Отправляя речные лодки в море"
haiti.97.d: "Гаитянский флот был впервые создан в 1860 году с вводом в строй одного корабля - бывшего 600-тонного однотрубного фрегата, переоборудованного для работы в качестве железной канонерской лодки. Две дополнительные канонерские лодки поступили на вооружение в 1875 году, а через десять лет - корвет. К 1900 году были спущены на воду три британские и французские канонерские лодки, а в 1902 году наш флот увидел своё первое крупное действие против иностранной державы, когда гаитянская канонерка Crête-à-Pierrot имела недолгую стычку с немецким военным кораблём, причём капитан корабля и адмирал гаитянского флота Хаммертон Киллик затопил канонерку, уйдя на дно вместе со своим кораблём, вместо того чтобы сдаться. Однако слава нашего морского флота вскоре закончилась, поскольку американская оккупация примерно десятилетие спустя принесла с собой насильственное разоружение, когда Гаити была вынуждена отказаться от своих военных кораблей и сократить свою армию вдвое. С тех пор гаитянский флот действовал только как речная сила, патрулируя национальные воды болот и берегов Гаити, не имея никакой возможности поддерживать современные силы, по крайней мере, так было до сих пор. С новым финансированием от государства и с тем, что американцы наконец свалили с нас, мы снова выйдем в море! Спасая любые морские суда, которые американцы и другие иностранцы оставили позади, переоборудуя любые доступные плавсредства и одновременно стремясь развить нашу собственную внутреннюю судостроительную инфраструктуру, мы превратим Гаити в истинную военно-морскую державу Карибского бассейна."
haiti.97.a: "L'union fait la force!"

haiti.98.t: "Судьба династии Дювалье"
haiti.98.d: "Нация медленно заживает, пока мы адаптируемся к его странной идеологии и политике. Папа Док держит мёртвую хватку на повседневной жизни гаитян, объявляя себя живым воплощением самой нации. Пока он и Симона «Мама Док» Дювалье работают над превращением администрации Дювалье в истинную политическую династию, у них ещё нет настоящего наследника, и, поскольку они открыто преследуют эту цель, их приближённые уже начали играть свои игры, чтобы тайно, за спиной Папы Дока, обеспечить своё преемничество, если какая-либо трагедия постигнет гаитянского героя. Однако ходят слухи о заговоре, плетущемся под поверхностью: соперничающие нуаристы внутри партии хотят направить революцию Дювалье в другое русло или даже просто открыто и эгоистично захватить власть и богатства Гаити для себя. В предполагаемый заговор входят Клеман Барбо, глава полувоенного формирования Папы Дока Тонтон Макут (он же пугала Дювалье); главные теоретики и умы, стоящие за наиболее связными аспектами идеологии Дювалье, партийный писатель и организатор Жан-Жозеф Лоример Дени и его соратник, партийный экономист Кловис Дезинор; а также Карл Бруар, один из создателей нуаризма, вместе с Жаном Прайс-Марсом, который, как утверждается, отрезвился и теперь стремится очистить свою философию от скверны Папы Дока. Реален ли этот заговор, является ли он проверкой на лояльность или плодом воображения Папы Дока - пока неизвестно, но мы должны быть начеку на всякий случай."
haiti.98.a: "Полагаю, это всё было у него в голове?"
haiti.98.b: "Заговор был реален, но теоретик Папы Дока обуздал его, чтобы избежать его."
haiti.98.c: "Заговор был реален! Папа Док арестован своей полувоенной организацией."
haiti.98.e: "Заговор был реален! Недавно отрезвившийся Бруар спасает нуаризм и Гаити."

haiti.99.t: "Статус законодательной власти и местной демократии"
haiti.99.d: "По мере того как мы продолжаем укреплять власть Короны над Гаити, некоторые задаются вопросом, следует ли нам позволить ныне ослабленному законодательному органу и более широкому аппарату гражданского местного самоуправления иметь более громкий голос в правительстве короля Фостена. Многие требуют некоторого подобия конституционной монархии, где Корона работает в тандеме с сильным местным правительством, продолжая при этом свои популистские позиции, вместо текущего популистского патерналистского правления, поддерживаемого военными, которое Корона осуществляет благодаря поддержке Гвардии и нескольких оставшихся морских пехотинцев, верных трону. Итак, должна ли Корона позволить гражданскому законодательному органу некоторую большую степень участия в местном управлении Гаити, даже позволив вернуть местные демократические выборы под властью Короны, или же Корона и её военные приспешники должны править в одиночку навечно?"
haiti.99.a: "Сохранить нашу хватку при военной поддержке."
haiti.99.b: "Надеть бархатную перчатку и разрешить местное самоуправление под властью Короны."

haiti.100.t: "Чёрный пояс призывает о помощи"
haiti.100.d: "Пока бушует Гражданская война в Америке, наши собратья по диаспоре, разбросанные по Чёрному поясу, обращаются к нам с мольбами о поддержке от наших собратьев по афро-новосветскому населению, включая нас здесь, на Гаити. Это даёт нам уникальную возможность вмешаться во Вторую Гражданскую войну в Америке от имени освобождения чёрных и принципов нуаризма. Итак, должны ли мы вмешаться в американские дела или оставить наших бывших угнетателей гнить, даже если это означает оставить наших родичей в Чёрном поясе на произвол судьбы?"
haiti.100.a: "Выступить в поддержку военных усилий Чёрного пояса."
haiti.100.b: "Спасти Чёрный пояс от них самих."
haiti.100.c: "Мы сами освободим Чёрный пояс."
haiti.100.e: "Одна борьба! Выступить за объединение с Чёрным поясом."
haiti.100.f: "Оставить их на произвол судьбы."

haiti.101.t: "Выбор национального знамени для режима Папы Дока"
haiti.101.d: "По мере того как наша администрация консолидирует нашу власть надо всем, что касается Гаити, мы должны также принять окончательное решение о том, каким будет наше национальное знамя в будущем. С тех пор как мы, радикальные нуаристы, взяли под контроль правительство, мы использовали чёрно-красную версию традиционного гаитянского флага, но ведутся дебаты о том, является ли это наилучшим соответствием для нашего режима. Перед нами несколько вариантов: чёрно-красная версия гаитянского флага, которую Дювалье долгое время использовал как своё личное знамя; сине-красная версия, традиционно используемая для гаитянского флага; или чёрно-красное знамя, украшенное пуль-ди, или цесаркой - местной птицей, также родом из Африки, которую Лоример Дени и широкая партия при Папе Доке долгое время использовали как символ афро-гаитянской борьбы. Независимо от выбора, все варианты по-своему уникальны для Гаити, но какой из них кажется истинным объединяющим флагом для нашего движения?"
haiti.101.a: "Выбрать чёрно-красное знамя Дювалье."
haiti.101.b: "Выбрать более традиционное сине-красное знамя."
haiti.101.c: "Выбрать чёрно-красное знамя, украшенное птичьим символом партии."

haiti.102.t: "Знамя для Америки под властью императора-морпеха"
haiti.102.d: "По ироничному стечению обстоятельств Гаити превратилась из оккупированной в оккупанта, поскольку император Фостен и его верные солдаты преодолели почти невозможные трудности и захватили мантию старой Америки. Благожелательный император и его королевская гвардия создали плацдарм на американских берегах и начали изнурительную кампанию по освобождению наших потерянных братьев по диаспоре от трёх веков угнетения. Поскольку Америка и Гаити объединены под непредсказуемым императором Америки, будет поднято новое знамя в ознаменование этого союза. Чтобы представить новую Америку, некоторые предложили использовать один из первоначальных проектов Большой печати, разработанных Уильямом Бартоном, для обозначения новой эры для наших двух наций. В честь Императора и исторической связи между Гаити и Польшей некоторые предложили использовать герб Рыпина, места рождения Фостена. Поскольку было предложено множество вариантов, окончательное решение остаётся за Императором."
haiti.102.a: "Мы примем дизайн герба с тринадцатью полосами."
haiti.102.b: "Мы примем дизайн Большой печати с тринадцатью полосами."
haiti.102.c: "Мы примем чёрно-полосатый дизайн с Большой печатью."
haiti.102.e: "Мы примем чёрно-полосатый дизайн с гербом."
haiti.102.f: "Мы примем чёрно-красный дизайн с гербом."
haiti.102.g: "Мы примем чёрно-красный дизайн с Большой печатью."