kr_dorris_psa: "Dorris"
kr_dorris_psa_desc: "Банкротство оригинальной Dorris Motor Corporation стало серьезным ударом для и без того приходящей в упадок автомобильной промышленности Сент-Луиса. С началом гражданской войны старый завод Dorris был приобретен местными бизнесменами для производства столь необходимых танков для федеральных военных нужд. Как только компания получила разрешение на возобновление деятельности от победившего тихоокеанского правительства, производство танков и гражданских автомобилей быстро возобновилось."
