kr_marlin_firearms_psa_desc: "До начала Гражданской войны в США компания Marlin Company испытывала трудности после десятилетий падения продаж. Поддержка правительства Новой Англии в военных усилиях изменила судьбу компании, и она быстро восстановила свое место среди многих крупных производителей оружия на северо-востоке страны. Получив разрешение на продолжение деятельности после победы правительства Тихоокеанского региона, компания продолжала добиваться успеха."
