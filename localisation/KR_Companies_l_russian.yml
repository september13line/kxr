kr_ingalls_shipyards_psa_desc: "Роберт Ингерсолл Инглс, основатель судостроительной компании, носящей его имя, в течение многих лет боролся за получение финансирования для своей грандиозной верфи на реке Паскагула. С началом гражданской войны Союзное государство, испытывающее острую нехватку как военных, так и торговых судов, выделило компании значительную сумму, что дало толчок ее развитию. После поражения Союзного государства от правительства Западного побережья компания была реорганизована и возобновила свою деятельность."
