kr_cushman_nee_desc: "Компания Cushman, известная своими моторизованными скутерами, была вынуждена перейти на производство военных транспортных средств для федеральных военных нужд после начала второй американской гражданской войны; она продолжает производить грузовики и полугусеничные транспортные средства под управлением режима Новой Англии."
