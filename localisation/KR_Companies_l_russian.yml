### Shanxi ###

#Industrial Concerns
SHX_shanxi_university_concern: "Shanxi University"
SHX_shanxi_university_concern_desc: "Университет Шаньси – относительно новое учебное заведение, основанное в 1902 году как Императорский университет Шаньси. Первоначально его штат в значительной степени состоял из иностранных миссионеров, но со временем кампус и профессорско-преподавательский состав стали гораздо более разнообразными, что иногда приводило к конфликтам между учеными, получившими образование в разных странах и исповедующими разные идеологии. Недавно университет вновь получил поддержку от правительства провинции, что позволило ему выйти из прежнего застоя. Университет относительно современный, в нем есть юридический и медицинский факультеты, а также инженерный, языковой и более традиционный литературный факультеты. Рядом находится педагогический институт, который готовит будущих учителей. Университет предлагает разнообразные курсы, особенно с недавним переходом от преподавания гуманитарных наук к естественным наукам и инженерии. Хотя университет и далек от гламура своих пекинских коллег, он является жемчужиной молодой системы образования Шаньси."

SHX_economic_reconstruction_committee: "Economic Reconstruction Committees"
SHX_economic_reconstruction_committee_desc: "Комитеты по экономической реконструкции были созданы по всей провинции, поскольку высшие эшелоны власти Шаньси пришли к общему мнению, что предыдущие неудачи провинции были вызваны неэффективным институциональным планированием. Эти комитеты возглавляют местные элиты, которые ежегодно разрабатывают и реализуют планы реконструкции своих деревень. Затем районные комитеты по реконструкции объединяют различные планы на уровне деревень, учитывая мнения квалифицированных технократов. Наконец, Центральный комитет по восстановлению со штаб-квартирой в столице формулирует программу действий на уровне провинции. Эта система интегрированного планирования «снизу вверх» в теории является очень современным, почти авангардным способом централизованного планирования. Хотя, конечно, дьявол всегда кроется в деталях. И есть много деталей, которые необходимо изучить."

SHX_pekin_syndicate_concern: "Pekin Syndicate (Ostchina-Direktorium)"
SHX_pekin_syndicate_concern_desc: "Ранние попытки англо-китайского «Пекинского синдиката» эксплуатировать ресурсы в Шаньси часто наталкивались на ксенофобскую и антиконцессионную агитацию со стороны студентов Шаньси. После краха британской колониальной власти инвесторы и бизнесмены Пекинского синдиката больше не имели значительной силы, поддерживающей их против китайских интересов. Ostchina Direktorium из Н.С.О. вмешалось и выкупило контрольный пакет акций компании, обеспечив ей стабильность и крупного спонсора, необходимых для сохранения конкурентоспособности. Под эгидой Chung Fu Mining Administration, совместного предприятия Pekin Syndicate и Ostchina Direktorium, эти иностранные компании работали над укреплением своих позиций в горнодобывающей промышленности Шаньси, используя любые возможности в ранее жестко контролируемой экономике провинции. С тех пор компания расширила свою деятельность, пригласив под свою эгиду другие (преимущественно немецкие) крупные корпорации, готовые идти на риск. Вернер Яннингс из Siemssen & Co стал де-факто лидером этой влиятельной группы интересов и использовал свою армию лоббистов и огромные суммы легких денег, чтобы проникнуть в ближайшее окружение Яна. Чтобы успокоить подозрения противников концессий, небольшому числу китайских инвесторов было разрешено присоединиться к оставшимся британским акционерам в северокитайском отделении Н.С.О."
SHX_northwest_industrial_company_concern: "Northwestern Industrial Company"
SHX_northwest_industrial_company_concern_desc: "Северо-Западная промышленная компания (Xibei Shi-ye Gong-si) - это контролируемая государством корпорация по развитию, созданная с целью перехода от государственного капитализма к государственному социализму, с заявленной целью развития тяжелой промышленности в Шаньси. Основанный в 1932 году и получивший более 2 миллионов долларов инвестиций в течение следующих пяти лет, этот конгломерат поглотил почти 40% капитала, изъятого у богатых землевладельцев посредством принудительных займов, и заставил энергетические предприятия почти удвоить количество киловатт-часов для его обслуживания. Контролируя станочное производство, локомотивы и другие заводы, этот проект представляет собой титанические инвестиции, сделанные Шаньси для преобразования бедной, отсталой области. Недавно возрожденный благодаря очередному крупному промышленному рывку, он стал краеугольным камнем промышленной программы провинции благодаря благосклонности правительства."
SHX_taiyuan_electric_light_concern: "Taiyuan Electric Light Company"
SHX_taiyuan_electric_light_concern_desc: "Компания Taiyuan Electric Light часто находилась в плохом финансовом положении и в 1923 году была вынуждена объявить о банкротстве из-за широко распространенной коррупции и неэффективного управления. В течение следующих полутора десятилетий многие машины простаивали, а помещения пустовали, несмотря на обещания Пекинского синдиката, а затем и их благодетелей из Ostchina-Direktorium спасти компанию. Никогда не ликвидированная, руководство Шаньси решило продолжать работу с убытками за счет государственных инвестиций, надеясь сохранить некоторую стабильность."
SHX_tung_chi_mining_concern: "Tung Chi Mining Company"
SHX_tung_chi_mining_concern_desc: "С тех пор как группа японских инвесторов во главе с загадочным Комото Дайсаку обосновалась недалеко от границы с Датуном, их влияние, похоже, неуклонно растет. Они произвели впечатление на некоторых руководителей нашей провинции своим умелым управлением ранее убыточными горнодобывающими предприятиями, превратив их в одни из самых эффективных и продуктивных шахт в провинции. Некоторые призывают к расширению партнерства, поскольку многие члены клики Яна и Фэна восхищаются экономической мощью Японии. Тем не менее, возможно, за этой корпорацией скрывается нечто большее, чем кажется на первый взгляд, и, учитывая высокий уровень ксенофобии, все еще присутствующий в Шаньси, возможно, нам следует оставить все как есть."
SHX_share_the_wealth_mining_concern: "Share the Wealth Mining Company"
SHX_share_the_wealth_mining_concern_desc: "На протяжении многих лет и под колеблющейся юрисдикцией Бюро государственных шахт Шаньси правительство Яна (а зачастую и его личный кошелек) приобретало все более крупные доли во многих якобы частных горнодобывающих предприятиях в провинции Шаньси. Одно из них привлекло к себе новое внимание в связи с недавними событиями в Шаньси, а именно горнодобывающая компания «Share-the-Wealth» (Tung-Bao), которая исторически стремилась эксплуатировать крупные месторождения угля в северной и восточной частях провинции. Фактическая потеря Восточного Шаньси в пользу Чжили, серьезные потрясения, вызванные войнами Фэньтянь-Чжили, и широкомасштабная коррупция, вызванная непомерными зарплатами, выплачиваемыми лакеям Яна, помешали значимой модернизации в 1920-х годах. Однако теперь, с расширением деятельности, многие надеются, что реорганизованная компания «Share the Wealth» действительно позволит жителям Шаньси воспользоваться обширными минеральными богатствами провинции."

SHX_experimental_school_concern: "Experimental School for Village Education"
SHX_experimental_school_concern_desc: "В рамках ранней фазы Десятилетнего плана в Шаньси была построена «Экспериментальная школа сельского образования», правление которой возглавили Янь Сишань, Фэн Юйсян и Чжао Дайвэнь. С 1933 года школа была очень успешной внутри страны, привлекала студентов с разным финансовым положением и давала своим ученикам скромное, но продвинутое сельскохозяйственное образование. Ее очень идеалистическая цель - сломать классовые предрассудки, модернизировать сельскохозяйственное образование и объединить теоретическое образование с практическим обучением в полевых условиях - была чрезвычайно амбициозной. Она широко рекламировалась по всей провинции и за ее пределами как знак прогрессивности правителей Шаньси, причем один из них утверждал, что «они революционизируют сельскую местность, выступая в качестве авангарда организации масс - в качестве основного кадрового резерва для осуществления экономического восстановления на уровне деревень». Признание этой школы вершиной достижений Десятилетнего плана поднимет ее престиж на новую высоту, но будет ли она действительно оправдывать свое название (и будет ли она чем-то большим, чем просто еще одним пропагандистским экспонатом), станет ясно в ближайшие годы."

#Material Concerns
SHX_taiyuan_arsenal: "Taiyuan Arsenal"
SHX_taiyuan_arsenal_desc: "Тайюаньский арсенал, построенный в 1923 году по приказу Янь Сишаня, является важным центром производства оружия в Китае и важным рычагом, обеспечивающим автономию Шаньси. На огромных заводах Шаньси, производящих различные виды оружия, включая пистолеты, винтовки, артиллерию, гранаты и боеприпасы, работают тысячи рабочих. Арсенал в Тайюане способен производить западную технику (или, по крайней мере, ее точные копии), и качество производимого здесь оборудования в значительной степени не имеет себе равных в Китае. Контроль над этим арсеналом дает клике Шаньси надежду, что однажды она сможет противостоять на поле боя своим более обеспеченным противникам."

SHX_shanxi_automobile_company_concern: "Northwest Automobile Transportation Company"
SHX_shanxi_automobile_company_concern_desc: "Гордое детище государственной капиталистической программы «Десятилетнего плана», Северо-Западная автомобильная транспортная компания является предприятием, поддерживаемым правительством и получающим значительное финансирование от провинциального правительства. Разделяя название и являясь духовным наследником более раннего проекта, созданного Фэн Юйсяном, эта современная версия контрастирует со своим предшественником тем, что вместо поиска иностранных поставщиков она сосредоточена на внутреннем производстве. Выпуская впечатляющий каталог легковых и грузовых автомобилей, а также других моторных транспортных средств, власти надеются заполнить недавно отремонтированные дороги Шаньси новыми автомобилями, за рулем которых будут сидеть представители китайского среднего класса, а не богатые иностранцы. Несмотря на то, что качество продукции вызывает некоторые сомнения, несмотря на заявления государственной пропаганды, она, похоже, набирает популярность и хорошо продается (хотя и в основном внутри провинции, а не на экспорт). В долгосрочной перспективе администрация надеется повторить успех аналогичных государственных проектов, таких как производство сульфатов, металлургические заводы и станочные заводы, которые сами по себе не особенно эффективны, но помогают подготовить квалифицированную промышленную рабочую силу для будущего. Если повезет, однажды Шаньси будет иметь собственную процветающую автомобильную промышленность."

#Aircraft Concerns
SHX_aircraft_design_board: "Taiyuan Aircraft Design Board"
SHX_aircraft_design_board_desc: "Совместное сотрудничество между Комитетом по вооружению Тайюаньского арсенала, исследовательским отделом Военно-технической школы и нанятыми иностранными консультантами, инициатива губернатора по созданию собственных ВВС Шаньси приняла новое направление с амбициозным планом провинции по производству самолетов собственной разработки. Благодаря недавним усилиям, которые привели к успешному созданию авиационного завода, этот новый конструкторский совет отражает растущие амбиции Шаньси, которая надеется достичь новых высот."

#Armor Concerns
SHX_arsenal_arms_committee: "Taiyuan Arsenal Arms Committee"
SHX_arsenal_arms_committee_desc: "Тайюаньский арсенал не просто производит огнестрельное оружие и артиллерию по проектам, украденным или купленным за рубежом. Он также может похвастаться инновационной, умной командой конструкторов и инженеров, которые постоянно дорабатывают и улучшают различные проекты. Предлагая крупные бонусы всем (не только штатным сотрудникам), кто способен проектировать или совершенствовать оружие для использования в Тайюане, немецкие и обученные в Германии техники Тайюаньского арсенала сумели убедить комитет выделить значительные средства на проектирование бронетехники. Это амбициозное начинание инженеров Шаньси вызвало большие ожидания, хотя остается открытым вопрос, сможет ли промышленная база Шаньси действительно производить разработанные проекты в значительных количествах."

