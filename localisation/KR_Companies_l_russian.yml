### United States of America ###
kr_auto_ordnance_company_usa: "Компания Авто-Орднанс"
kr_colt_usa: "Кольт"
kr_colt_usa_desc: "В условиях спада продаж, вызванного Великой депрессией, компания Кольт диверсифицировала свою деятельность в различных отраслях. В связи с ростом напряженности между компанией и рабочими организациями на Северо-Востоке, Кольт решила полностью перенести производство оружия. Она нашла поддержку у тогдашнего сенатора Хьюи Лонга для финансирования своего переезда на юго-восток, и в итоге компания открыла магазин в развивающемся городе Таллахасси."
kr_winchester_western_usa: "Winchester Repeating Arms"
kr_springfield_armory_usa: "Springfield Armory"
kr_smith_wesson_usa: "Smith & Wesson"
kr_browning_usa: "Browning Arms"
kr_remington_usa: "Remington Arms"
kr_remington_usa_desc: "Обеспокоенная растущей активностью профсоюзов на северо-востоке страны и возможными сбоями в своей деятельности, химическая компания DuPont решила перенести свою дочернюю компанию Remington. В конечном итоге она получила федеральное финансирование для этой цели в обмен на помощь в создании нескольких новых современных складов боеприпасов на западе страны. В своем новом месте расположения в Денвере Remington продолжает производить свое знаменитое оружие, как и раньше."
kr_harrington_richardson_usa: "Harrington & Richardson Arms Company"
kr_marlin_firearms_usa: "Marlin Firearms"
kr_marlin_firearms_usa_desc: "До начала Гражданской войны в США компания Marlin Company переживала трудности после десятилетий падения продаж. Поддержка правительства Новой Англии в военных усилиях изменила судьбу компании, и она быстро восстановила свое место среди многих крупных производителей оружия на северо-востоке страны. Получив разрешение на продолжение деятельности после победы федерального правительства, компания продолжала добиваться успеха."
kr_savage_arms_usa: "Savage Arms"
kr_watervliet_arsenal_usa: "Watervliet Arsenal"
kr_marble_arms_usa: "Marble Arms"
kr_western_cart_usa: "Western Cartridge Company"
kr_fedlabs_usa: "Federal Laboratories"
kr_fedlabs_usa_desc: "Первоначально основанная недалеко от Питтсбурга для производства нелетального оружия и средств подавления беспорядков, компания Federal Laboratories тайно упаковала все свое оборудование и контрабандой перевезла его на территорию, контролируемую федеральным правительством в Мэриленде. Новая компания Federal Laboratories, базирующаяся в Мэриленде, сразу же приступила к производству стрелкового оружия для гражданской войны."
