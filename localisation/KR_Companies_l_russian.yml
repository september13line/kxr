kr_jackson_usa: "Jackson"
kr_dorris_usa: "Dorris"
kr_dorris_usa_desc: "Банкротство оригинальной Dorris Motor Corporation стало серьезным ударом для и без того приходящей в упадок автомобильной промышленности Сент-Луиса. С началом гражданской войны старый завод Dorris был приобретен местными бизнесменами для производства столь необходимых танков для федералистов."
