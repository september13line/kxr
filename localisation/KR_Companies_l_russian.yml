kr_cunningham_nee: "Cunningham"
kr_cunningham_nee_desc: "Благодаря финансированию со стороны режима Новой Англии, банкротство не стало концом компании Cunningham. Хотя ее первая попытка разработать танк не принесла больших результатов, новая компания Cunningham сосредоточилась в основном на производстве легких бронированных машин и, по всем данным, добилась большого успеха."
