kr_ryan_aircraft_usa_desc: "Хотя роль Тубала Клода Райана в создании знаменитого «Духа Сент-Луиса» часто преувеличивается, отношения компании Райана с Линдбергами привели к переезду компании с побережья Сан-Диего в Северную Каролину и в тогдашний формирующийся блок Лонгистов. Даже после поражения Союза компания продолжает свою деятельность."
