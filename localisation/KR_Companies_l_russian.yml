kr_cushman_psa_desc: "Компания Cushman, известная своими моторизованными скутерами, была привлечена к производству военных транспортных средств для федеральных военных нужд после начала второй американской гражданской войны; она продолжает производить грузовики и полугусеничные транспортные средства под управлением правительства Тихоокеанского региона."
