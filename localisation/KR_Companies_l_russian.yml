kr_fedlabs_psa: "Federal Laboratories"
kr_fedlabs_psa_desc: "Первоначально основанная недалеко от Питтсбурга для производства нелетального оружия и средств подавления беспорядков, руководство и владельцы Federal Laboratories тайно упаковали все свое оборудование и контрабандой перевезли его на территорию, контролируемую федеральным правительством в Мэриленде. Новая компания Federal Laboratories, базирующаяся в Мэриленде, сразу же приступила к производству стрелкового оружия для гражданской войны. После победы правительства Западного побережья компании вскоре было разрешено возобновить свою деятельность."
