kr_stutz_usa: "Stutz"
kr_stutz_usa_desc: "Великая депрессия сильно ударила по автомобильной компании Stutz, почти полностью уничтожив ее бизнес по производству роскошных автомобилей. Однако компания, имевшая связи с Югом благодаря своим гоночным традициям и опасавшаяся все более нестабильной обстановки в родном Индиане, переехала во Флориду при финансовой поддержке политиков штата. С падением Союза компания вскоре получила разрешение возобновить свою деятельность."
