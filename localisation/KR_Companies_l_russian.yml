wilton_fijenoord: "Wilton-Fijenoord"
wilton_fijenoord_desc: "NV Dok en Werf Maatschappij Wilton-Fijenoord расположена в Схидаме, к западу от Роттердама. Ее история восходит к первой половине XIX века, и она была первой голландской судостроительной компанией, которая использовала паровые турбины. Она отвечает за строительство большинства голландских крейсеров, а также некоторых эсминцев и подводных лодок."
rotterdamsche_maatschappij: "Rotterdamsche Droogdok Maatschappij"
rotterdamsche_maatschappij_desc: "Крупнейшая судостроительная и судоремонтная компания Роттердама, Rotterdamsche Droogdok Maatschappij, строила различные гражданские и военные суда, в том числе большую часть голландского подводного флота, который создавался в специально построенном «Onderzeebootloods» (подводном ангаре)."

### New_England ###
kr_auto_ordnance_company_nee: "Auto-Ordnance Company"
kr_colt_nee: "Colt"
kr_colt_nee_desc: "В связи со спадом продаж из-за Великой депрессии компания Colt диверсифицировала свою деятельность, выйдя на рынки различных отраслей. В связи с ростом напряженности между компанией и профсоюзами на северо-востоке страны Colt решила полностью перенести производство оружия. Компания нашла поддержку у тогдашнего сенатора Хьюи Лонга, который помог ей профинансировать переезд на юго-восток, и в конечном итоге она обосновалась в быстро развивающемся городе Таллахасси."
kr_winchester_western_nee: "Winchester Repeating Arms"
kr_springfield_armory_nee: "Springfield Armory"
kr_smith_wesson_nee: "Smith & Wesson"
kr_browning_nee: "Browning Arms"
kr_remington_nee: "Remington Arms"
kr_remington_nee_desc: "Обеспокоенная растущей воинственностью профсоюзов на северо-востоке и потенциальным угрозой для своего бизнеса, химическая компания DuPont решила перенести свою дочернюю компанию Remington. В конечном итоге она получила федеральное финансирование для этого в обмен на помощь в создании нескольких новых передовых складов боеприпасов на западе страны. В своем новом доме в Денвере Remington производит свое знаменитое оружие, как и раньше, но, учитывая связи компании со старым режимом, под пристальным вниманием победившего правительства Новой Англии."
kr_harrington_richardson_nee: "Harrington & Richardson Arms Company"
kr_marlin_firearms_nee: "Marlin Firearms"
kr_marlin_firearms_nee_desc: "До начала Гражданской войны в США компания Marlin Company испытывала трудности после десятилетий падения продаж. Поддержка правительства Новой Англии в военных усилиях изменила судьбу компании, и она быстро восстановила свое место среди многих крупных производителей оружия на северо-востоке."
kr_savage_arms_nee: "Savage Arms"
kr_watervliet_arsenal_nee: "Watervliet Arsenal"
kr_marble_arms_nee: "Marble Arms"
kr_western_cart_nee: "Western Cartridge Company"
kr_fedlabs_nee: "Federal Laboratories"
kr_fedlabs_nee_desc: "Первоначально основанная недалеко от Питтсбурга для производства нелетального оружия и средств подавления беспорядков, компания Federal Laboratories тайно упаковала все свое оборудование и контрабандой перевезла его на территорию, контролируемую федеральным правительством в Мэриленде. Новая компания Federal Laboratories, базирующаяся в Мэриленде, сразу же приступила к производству стрелкового оружия для гражданской войны. После победы правительства Новой Англии компании вскоре было разрешено возобновить свою деятельность."
