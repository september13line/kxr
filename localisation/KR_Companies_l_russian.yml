kr_cunningham_psa: "Cunningham"
kr_cunningham_psa_desc: "Благодаря финансированию со стороны режима Новой Англии, банкротство не стало концом компании Cunningham. Хотя ее первые попытки в области разработки танков принесли мало плодов, новая компания Cunningham сосредоточилась в основном на производстве легких бронированных машин и, по всем данным, добилась большого успеха даже после победы тихоокеанского правительства."
