kr_cunningham_usa: "Cunningham"
kr_cunningham_usa_desc: "Благодаря финансированию со стороны режима Новой Англии, банкротство не стало концом компании Cunningham. Хотя ее первые попытки в области разработки танков не принесли больших результатов, новая компания Cunningham сосредоточилась в основном на производстве легких бронированных машин и, по всем данным, добилась большого успеха даже после победы федерального правительства."
