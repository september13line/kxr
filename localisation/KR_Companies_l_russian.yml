kr_ingalls_shipyards_usa_desc: "Роберт Ингерсолл Инглс, основатель судостроительной компании, носящей его имя, годами боролся за получение финансирования для своей грандиозной верфи на реке Паскагула. С началом гражданской войны Союзные Штаты, испытывавшие острую нехватку как военных, так и торговых судов, выделили компании значительную сумму, что дало толчок ее развитию. После поражения Союзных Штатов от федерального правительства компания была реорганизована и вновь открыта."
