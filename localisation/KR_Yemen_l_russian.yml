### Events ###

yemen.1.t: "Имамат Йемена"
yemen.1.d: "После побед Османской империи в Южной Аравии и победы в Мировой войне, а также после краха Британской империи в 1925 году Йемен пережил значительное расширение своих границ. Однако из-за продолжающегося османского управления суннитским населением и их крайне небрежного правления на подконтрольных территориях недавно увеличенное государство оказалось охвачено беспорядками. Поскольку во главе государства стоит зайдитский шиитский имам, он стремится доминировать над йеменскими землями, обрести свободу от османов и защитить то, что его страна законно заслужила."
yemen.1.a: "Великий Йемен должен быть защищён!"

yemen.2.t: "Волны Чёрного понедельника достигают Йемена!"
yemen.2.d: "После краха немецких фондовых рынков их волны уже накрыли как экономически слабых османов, так и экономически молодой Египет. Та небольшая экономика, что есть в Йемене, пришла в упадок из-за мирового кризиса."
yemen.2.a: "Мы должны действовать скорее!"

yemen.3.t: "Мятежные настроения в Йемене"
yemen.3.d: "После окончания Мировой войны и далее беспорядки в Йемене только усиливались. Плохое управление османов и недовольство авторитарным правлением имамата привели к возникновению многочисленных интеллектуальных групп, которые со временем искали убежища в районах, находящихся вне нашего контроля, и в более слабо управляемых османами регионах. Теперь мы должны решить, как поступить с этими революционерами, скрывающимися на наших землях."
yemen.3.a: "Они будут искоренены!"

yemen.4.t: "Мятежные настроения в Асире"
yemen.4.d: "Мы отправили верные войска под руководством нескольких местных министров и одного из сыновей имама в провинцию Асир для охоты на мятежников и поиска способа справиться с беспорядками."
yemen.4.a: "Они будут поставлены к стене!"
yemen.4.b: "Йемен должен быть единым!"

yemen.5.t: "Мятежные настроения в Адене"
yemen.5.d: "Мы отправили верные войска под руководством нескольких местных министров и одного из сыновей имама в провинцию Аден для охоты на мятежников и поиска способа справиться с беспорядками."
yemen.5.a: "Они будут поставлены к стене!"
yemen.5.b: "Йемен должен быть единым!"

yemen.6.t: "Конец анархии"
yemen.6.d: "Теперь, когда мы отправили разведывательные силы по всей сельской местности и воцарилась атмосфера контроля. Всё, на что мы можем надеяться, - что наших действий было достаточно для сохранения внутренней стабильности в Йемене."
yemen.6.a: "Пришло время исцеления."

yemen.8.t: "Мягкая рука"
yemen.8.d: "Наши военные вылазки на земли, удерживаемые османами, привели нас к пониманию того, что истинные враги - это оккупанты-турки; они виноваты в этих беспорядках, и мы сплотим народ против них."
yemen.8.a: "Долой османов!"

yemen.9.t: "Целенаправленное подавление"
yemen.9.d: "После первых нескольких подавлений инакомыслия мы заняли более мягкий тон в наших антипартизанских усилиях. Это гарантирует, что народ Йемена не возненавидит нас, и что открытые нами раны заживут скорее."
yemen.9.a: "Мы показали свою руку."

yemen.10.t: "Твёрдая хватка"
yemen.10.d: "Мы обыскали все уголки в поисках как можно большего числа людей, питающих неблагонадёжные идеи; некоторые бежали в более глубокие укрытия, однако они политически сломлены. Кровь пятнает улицы городов по всему Йемену."
yemen.10.a: "Никто не будет оспаривать мою власть!"

yemen.11.t: "Королевство провозглашено!"
yemen.11.d: "В пепле старого порядка в Аравии поднимется наше свободное королевство. Теперь мы должны справиться с последствиями отсутствия крупной внешней помощи. Поскольку силы внутри Йемена начинают шевелиться, мы должны быть в курсе мира за пределами наших земель."
yemen.11.a: "Трижды ура Йемену!"

yemen.14.t: "Восстание подавлено"
yemen.14.d: "Поскольку восстание было искоренено в зародыше, у него не хватило сил сопротивляться силам имамата, королевство сохранено!"
yemen.14.a: "Мы обеспечили мир и стабильность."

yemen.16.t: "На грани краха"
yemen.16.d: "Из-за нашего милосердия к повстанческим группам внутри страны, пока мы находились под властью османов, повстанцы начали подниматься против нашего режима! Желая покончить с имаматом и провозгласить Йеменскую республику, эта группа может представлять угрозу для нашего суверенитета. Мы должны немедленно раздавить этих выскочек!"
yemen.16.a: "За республику!"
yemen.16.b: "Их нужно остановить!"

yemen.17.t: "Беспорядки в королевстве"
yemen.17.d: "Из-за нашего милосердия к повстанческим группам внутри страны, пока мы находились под властью османов, повстанцы начали подниматься против нашего режима! Желая покончить с имаматом и провозгласить Йеменскую республику, эта группа может представлять угрозу для нашего суверенитета. Мы должны немедленно раздавить этих выскочек!"
yemen.17.a: "Республика восторжествует!"
yemen.17.b: "Мы сломаем их!"

yemen.18.t: "Восстание подавлено"
yemen.18.d: "После тяжело завоёванной победы над мятежниками они потеряли всякую способность сопротивляться силам имамата, королевство сохранено!"
yemen.18.a: "Мы обеспечили мир и стабильность."

yemen.19.t: "Восстание подавлено"
yemen.19.d: "Поскольку восстание было частично искоренено в зародыше, оно было ослаблено для сил имамата, королевство сохранено!"
yemen.19.a: "Мы обеспечили мир и стабильность."

yemen.20.t: "Первые выборы Новой республики"
yemen.20.d: "После свержения коррумпированного имамата были проведены первые в истории Йемена выборы. Две основные фракции, которые и свергли имамат, - это «Хаит аль-Надиаль» и «Шабаб аль-Амр». Обе партии проделали большую работу в своей предвыборной кампании, и народ с нетерпением ждёт результатов выборов."
yemen.20.a: "«Хаит аль-Нидаль» поведёт нас."
yemen.20.b: "«Шабаб аль-Амр» даст нам необходимые перемены!"

yemen.22.t: "Йемен обретает независимость"
yemen.22.d: "Мятежное вассальное государство Йемен на юге объявило независимость от нас более двух месяцев назад. Из-за очень ограниченного продвижения на их территорию и ожесточённого сопротивления наши советники предложили отпустить их, и большинство правительства и султан согласились, что ресурсы и люди, потерянные в этом конфликте, не стоят того, когда у нас есть более серьёзные угрозы со стороны Египта, Аравии и [PER.GetNameDef]."
yemen.22.a: "Мы вернёмся сильнее, чем прежде."

yemen.23.t: "Наша независимость обеспечена"
yemen.23.d: "После нашего восстания против османов четыре месяца назад османы добились минимальных территориальных приобретений против нашего недавно основанного королевства, и османское правительство официально решило завершить войну. Однако с исчезновением единой угрозы республиканцы внутри Йемена снова начали действовать. Хотя независимость обретена, путь впереди всё ещё будет тернистым."
yemen.23.a: "Мы выстоим."

yemen.24.t: "Наше присутствие в Йемене"
yemen.24.d: "Хотя Йемен восстал против нашего правления более четырёх месяцев назад, нам удалось прорвать их подготовленную оборону и захватить остальную часть Хиджаза. Поскольку йеменский имам и народ осознали своё поражение, они согласились сдаться на условиях, что имам останется на йеменском троне."
yemen.24.a: "Ещё одна угроза устранена."

yemen.25.t: "Поражение от османов"
yemen.25.d: "Хотя королевство было провозглашено не более четырёх месяцев назад, вечная османская угроза сумела глубоко проникнуть в наши линии. С потерей Азира и приближением османов к нашей столице наш имам официально решил сдаться османам. Благодаря этому решению имаму было позволено остаться на йеменском троне, но отныне за нашей нацией, скорее всего, будет установлен более пристальный надзор."
yemen.25.a: "Однажды мы все будем свободны."

yemen.26.t: "Завоевание Аравии"
yemen.26.d: "Хотя большинство считало, что наша война против Аравии будет в значительной степени бесплодной, нам удалось не только победить, но и продвинуться дальше. С падением аравийской столицы мы смогли объединить Аравию под нашим знаменем. Хотя процесс интеграции будет долгим и затяжным, теперь мы можем провозгласить себя Аравией."
yemen.26.a: "Воистину Великий Йемен."

yemen.27.t: "Поддержка Рашидидов"
yemen.27.d: "Напряжённость между Джебель-Шаммаром и Недждом из-за объединения Аравии была высокой и сейчас достигла точки кипения. Поскольку Джебель-Шаммар, ведомый династией Рашидидов, которая напрямую связана с нашей династией Рассидов, объявил войну, мы можем помочь им одержать победу над ненавистными Саудитами на севере."
yemen.27.a: "Отправить поддержку нашим братьям."
yemen.27.b: "Наша независимость превыше всего."

yemen.28.t: "Рассиды отправляют поддержку"
yemen.28.d: "Наша кузенная династия в Йемене, Рассиды, начала посылать нам поддержку в свержении эмирата Саудитов на юге Аравии. Хотя Йемен всё ещё находится под влиянием османов, они обязались делать всё возможное для поддержки наших решений и амбиций в будущем."
yemen.28.a: "У нас всегда будет друг на юге."

yemen.29.t: "Дофар взят"
yemen.29.d: "Поскольку наше вторжение в Оман за территорию Дофара увенчалось успехом, мы можем оставить их на произвол судьбы. Конечно, есть некоторые в правительстве, кто считает, что мы должны продолжить войну, чтобы ещё больше укрепить наше государство, но затяжная война в Омане менее желательна, когда вокруг всё ещё существуют другие угрозы."
yemen.29.a: "Мы заберём Дофар."
yemen.29.b: "Мы заберём Оман!"

yemen.30.t: "Дофар интегрирован"
yemen.30.d: "После нашего недавнего захвата Дофара у Омана мы начали успешно интегрировать территорию в нашу страну. Хотя территория малонаселена и засушлива, она не менее полезна для нашего королевства, чем любая другая часть Великого Йеменского государства. Теперь все претензии Йемена находятся в наших руках, и мы постараемся сохранить их."
yemen.30.a: "Наша мечта сбылась."

yemen.31.t: "Оман интегрирован"
yemen.31.d: "После нашего недавнего полного захвата Омана мы начали успешно интегрировать оманские земли в нашу страну. Хотя Оман малонаселен и засушлив, мы получили стратегическое преимущество в Персидском заливе и Ормузском проливе. Благодаря этому мы значительно расширим влияние Йемена на Аравийское море и, возможно, на весь Ближний Восток."
yemen.31.a: "Наша мечта сбылась."

yemen.32.t: "Имам казнён"
yemen.32.d: "Бывший диктатор и имам Йемена Яхья аль-Хамид был сегодня публично казнён через повешение во имя Республики. С повешением приходит и уничтожение влияния имперских реставраторов, поскольку им остаётся лишь Ахмад бин Яхья на троне, который является менее заметной и вдохновляющей фигурой, чем его отец. Надеюсь, это обеспечит сохранение сильной Республики перед лицом будущих угроз."
yemen.32.a: "Он получил по заслугам."

yemen.33.t: "Казнь Саудитов"
yemen.33.d: "Поскольку нам удалось значительно успокоить ситуацию в Аравии, мы можем начать предпринимать шаги против политических оппонентов. Самым очевидным была династия Саудитов, которая раньше правила Аравией и пыталась уничтожить нашу нацию. Сегодня утром на публичном суде вся династия Саудитов, захваченная нами в плен во время войны, включая Абдулазиза ибн Сауда, была предана смерти."
yemen.33.a: "Конец вечному врагу."

yemen.34.t: "Рашидиды приглашены в Аравию"
yemen.34.d: "Со смертью династии Саудитов и Аравией, которая теперь спокойнее, чем когда-либо, условия благоприятствуют тому, чтобы наша кузенная династия, Рашидиды, приняла участие в управлении нашей новой Аравией. Рашидиды чрезвычайно благодарны за эту возможность, так как они думали, что их шансы когда-либо править Аравией были разбиты после их поражения от Неджда, но враг моего врага - мой друг."
yemen.34.a: "Добро пожаловать домой, дорогие друзья."

yemen.35.t: "Остатки повстанцев"
yemen.35.d: "Поскольку нам удалось выдержать натиск повстанческой мрази ранее, наше внимание в основном было сосредоточено не на остатках повстанцев, а на консолидации режима после гражданской войны. Консолидация режима означает, что мы наконец можем покончить с ними. Йеменские жандармы были отправлены по всему Йемену для охоты на остатки этой республиканской мрази, что в основном увенчалось успехом. Повторного появления республиканских движений в Йемене в ближайшее время не произойдёт."
yemen.35.a: "С предателями государства всегда будут разбираться."

yemen.36.t: "Продолжающийся поток беженцев"
yemen.36.d: "Поскольку Османская империя продолжает закручивать гайки в Хиджазе, а стычки между Саудитами и Рашидидами затягиваются, всё больше людей стекается к нашим границам в поисках убежища. Среди них есть и те, кто поддерживает республиканскую сторону йеменской политики."
yemen.36.a: "Надеюсь, они не доставят хлопот..."

yemen.37.t: "Волны Чёрного понедельника"
yemen.37.d: "Чёрный понедельник, хотя и не затронул нас так сильно, как другие страны, косвенно привёл к росту антимонархических настроений внутри страны. Республиканцы, обычно сосредоточенные на севере и юге нашей страны, начали появляться в нашей столице и других местах, где их раньше не было. Это может стать тревожной тенденцией, если не обращаться с этим осторожно..."
yemen.37.a: "Они будут раздавлены на месте."

yemen.38.t: "Йемен просит старый корабль"
yemen.38.d: "Йемен, государство в Южной Аравии, уже несколько месяцев пытается построить флот, добиваясь успеха в редких случаях. Чтобы помочь дальнейшему запуску проекта, Йемен попросил купить «SMS Kaiser Wilhelm der Grosse», построенный на рубеже веков. Учитывая приличную цену, которую Йемен предлагает за такой старый корабль, нет причин отказывать в их просьбе."
yemen.38.a: "Мы примем покупку."
yemen.38.b: "Мы предпочли бы сдать его на слом."

yemen.39.t: "Германия предоставляет корабль"
yemen.39.d: "Германия приняла нашу покупку корабля! Они дали нам старый корабль «SMS Kaiser Wilhelm der Grosse», который отныне переименовывается в «Yahya Sana'a Aden Arwa» под нашим контролем. Этот корабль станет отправной точкой для великого йеменского флота в будущем!"
yemen.39.a: "Йемен властвует над волнами!"

yemen.40.t: "Германия отказывает в покупке"
yemen.40.d: "Несмотря на наше щедрое предложение за такой старый корабль, Германия решила отклонить наше предложение о покупке старого немецкого крейсера. Хотя это не означает конец шанса для йеменского флота в будущем, это деморализовало йеменский народ, который мечтал бороздить моря в будущем."
yemen.40.a: "Действительно печальный день."

yemen.41.t: "Всеобщие выборы [GetYear] года"
yemen.41.d: "После нашего освобождения более четырёх лет назад настало время для очередных всеобщих выборов. Партии остались теми же, что и в прошлый раз: «Хаит аль-Надиаль» и «Шабаб аль-Амр» идут ноздря в ноздрю за победу. Результаты вскрыты, и победитель..."
yemen.41.a: "«Хаит аль-Надиаль»!"
yemen.41.b: "«Шабаб аль-Амр»!"

yemen.42.t: "Мир с Саудитами?"
yemen.42.d: "Наша война с Саудовской Аравией идёт не в нашу пользу: Асир потерян, и Саудиты приближаются к нашей столице. Поскольку существование нашей нации под угрозой, нам, возможно, придётся отдать Асир ради нашего выживания."
yemen.42.a: "Предложить им Наджран и Асир."
yemen.42.b: "Мы отобьём их!"

yemen.43.t: "Йемен предлагает Асир и Наджран"
yemen.43.d: "Поскольку война против Йемена идёт в нашу пользу, они предложили нам пустыню Наджран и Асир в обмен на своё выживание. Хотя мы могли бы продолжать наступление, есть более серьёзные угрозы, такие как [PER.GetNameDef] на севере, дышащие нам в спину."
yemen.43.a: "Какая выгодная сделка!"
yemen.43.b: "Йемен - это Аравия, несмотря ни на что."

yemen.44.t: "Саудиты принимают"
yemen.44.d: "Саудиты приняли наше предложение о мире в обмен на Наджран и Асир. Хотя наше выживание обеспечено, это в значительной степени положило конец идее Великого Йемена и остановило любые экспансионистские идеи."
yemen.44.a: "Судьба хуже смерти..."

yemen.45.t: "Саудиты продолжают войну!"
yemen.45.d: "Саудиты наотрез отказались от любых попыток заключить мир между нашими двумя странами, заявляя, что «Йемен по праву является частью Аравии». Эта война теперь будет продолжаться неизвестно как долго, и конца ей не видно!"
yemen.45.a: "Мы будем сопротивляться до последнего человека!"

yemen.47.t: "Пределы амбиций Рассидов"
yemen.47.d: "С нашим возвышением йеменский народ теперь доминирует на Аравийском полуострове, но многие всё ещё жаждут большего. Хотя изоляционисты и региональные сторонники полуострова призывают нашу администрацию обратить взор внутрь и сосредоточиться на Мекке и Сане, начали возникать более ястребиные желания. Некоторые утверждают, что Йемен должен пройти по всему Ближнему Востоку, объединив Египет, Левант и Месопотамию под нашим владычеством. Другие стремятся вывести даже эти чересчур рьяные планы на новый уровень, продвигая полный панарабский идеал, выступая за то, чтобы Йемен возглавил создание панарабского государства, простирающегося по всему Ближнему Востоку, Северной Африке, Аравийскому полуострову и даже частям Африканского Рога, объединив наших арабских братьев под одним знаменем. На чью сторону мы встанем, глядя в будущее?"
yemen.47.a: "Мы останемся здесь, в колыбели Аравии."
yemen.47.b: "От Египта и Синая до Леванта и Багдада - весь Ближний Восток наш!"
yemen.47.c: "Мы возьмём панарабский факел на обозрение всем!"

yemen.48.t: "Будущее Свободного йеменского движения"
yemen.48.d: "Свободное йеменское движение - это радикальная йеменская националистическая группа, вдохновлённая «Братьями-мусульманами» Египта и посвятившая себя свержению несправедливого и коррумпированного режима имама Яхья Мухаммада Хамид ад-Дина, который долгое время угнетал и топил в застое государство Йемен и его народ, но с падением правительства имама и провозглашением нашей исламской республики судьба Свободного йеменского движения оставалась неизвестной - до сих пор. Однако движение раскололось на две половины: консервативную половину, более тесно связанную с Комитетом борьбы (Hay'at al-Nidāl) и «Братьями-мусульманами», возглавляемую отцом йеменского национализма Ахмадом Мухаммадом Нуманом и «отцом свободных и поэтом Йемена» Мухаммадом Махмудом аз-Зубайри, и либеральную половину, более тесно связанную с «Молодёжью за поощрение добра и предотвращение зла» (Shabāb al-Amr bi'l-Ma'rūf wa'l-Nahy'an al-Munkar), возглавляемую поэтом-прогрессистом и революционером Али Насером аль-Кардаи, который прославился убийством тиранического имама Яхьи во время подъёма республики, а также тем, что он выжил в невооружённой схватке с леопардом, доказав, что ничто не может сломить его волю привести Йемен к миру и процветанию. Мы должны сделать выбор: работать с этими фракциями или нет, продолжая консолидировать нашу новую республиканскую администрацию, и да направит Аллах наше решение."
yemen.48.a: "Дистанцироваться от этих радикальных националистов."
yemen.48.b: "Укрепить либеральное крыло нашей партии, чтобы ослабить движение."
yemen.48.c: "Полноценно сотрудничать со Свободным йеменским движением."

yemen.49.t: "Будущее Свободного йеменского движения"
yemen.49.d: "Свободное йеменское движение - это радикальная йеменская националистическая группа, вдохновлённая «Братьями-мусульманами» Египта и посвятившая себя свержению несправедливого и коррумпированного режима имама Яхья Мухаммада Хамид ад-Дина, который долгое время угнетал и топил в застое государство Йемен и его народ, но с тех пор как республиканский элемент в Йемене, который Свободное йеменское движение надеялось использовать как средство для прихода к власти, был полностью уничтожен, у этих националистов осталось мало вариантов. В настоящее время они слишком малочисленны и слабы, чтобы захватить власть самостоятельно, поэтому они вынуждены либо сдаться и предстать перед суровым правосудием, либо попытаться уйти в подполье, либо, в случае некоторых, поддержать притязания Ахмада бин Яхьи Хамидаддина на пост имама Мутаваккилитского королевства Йемен, которого они считают более склонным к реформам, ибо группа не является изначально антимонархической, она просто против нынешнего правителя. Однако они могут быть нам полезны, если мы сможем переманить на свою сторону некоторых из их более непостоянных членов. Поскольку их главный принцип не антимонархический, а в основном сосредоточен на строгом следовании исламским учениям, расширении образования, экономических реформах и более тесных дипломатических связях с другими мусульманскими странами, оставшихся членов движения, вероятно, можно будет привлечь к сотрудничеству, ибо эти желания достаточно приемлемы. Однако, поступив так, нынешний имам, вероятно, должен будет отречься от престола, чтобы позволить некоррумпированному реформатору, которого не презирает вся нация, занять его место, например вышеупомянутому Ахмаду бин Яхье. Мы должны сделать выбор: работать с этими националистами или нет, продолжая консолидировать администрацию Короны, и да направит Аллах наше решение."
yemen.49.a: "Искоренить этих радикальных националистов."
yemen.49.b: "Сотрудничать с умеренными остатками движения."
yemen.49.c: "Укрепить радикальную окраину движения."

### Focuses ###
YEM_My_Clay: "Защищать Великий Йемен"
YEM_My_Clay_desc: "После Мировой войны и падения Британской империи Йемен никогда не был сильнее. Защита нашей нынешней формы должна быть главным приоритетом, наряду с обеспечением нашей свободы от Османской империи."
YEM_Consolidate_Hinterlands: "Консолидировать глубинные районы"
YEM_Consolidate_Hinterlands_desc: "Йемен, особенно на юге, имеет малонаселённые территории за пределами побережий и крупных портов. Мы должны обеспечить консолидацию этих регионов и создать условия для лучшей жизни."
YEM_Teaboo_Problems_commith: "Борьба с остатками повстанцев"
YEM_Teaboo_Problems_commith_desc: "Хотя ранее считалось, что с повстанческими группами покончено, проблема возникла снова, когда повстанцы, бежавшие из Саны в Асир, были спровоцированы людьми, бежавшими из Хиджаза. Теперь, когда мы владеем Асиром и повстанцы снова активны, мы должны так или иначе разобраться с ними."
YEM_Live_and_let_live: "Религиозная автономия"
YEM_Live_and_let_live_desc: "Религиозная автономия существовала в Йемене ещё до соглашения с османами, и это соглашение становится ещё более выгодным для нас с учётом наших масштабных территориальных захватов в последние годы."
YEM_Support_Zaydi: "Поощрять зайдитскую веру"
YEM_Support_Zaydi_desc: "Из-за нашего масштабного расширения в последние несколько лет зайдитская вера стала занимать всё меньшую и меньшую долю в нашей собственной стране. Это необходимо исправить."
YEM_Protecc_Imam: "Создать йеменскую жандармерию"
YEM_Protecc_Imam_desc: "В связи с новым подъёмом повстанческих групп мы должны обеспечить безопасность имама от угрозы. Создание жандармерии должно помочь нам подавлять мятежные настроения в столице."
YEM_Steal_Ottoman_Jobs: "Забрать полномочия у османов"
YEM_Steal_Ottoman_Jobs_desc: "Османские чиновники всё ещё занимают многие места в наших правительствах и на рабочих местах; их удаление поможет снизить влияние, которое они оказывают на наших людей и страну."
YEM_Rebel_Crackdown: "Подавление повстанцев"
YEM_Rebel_Crackdown_desc: "Хотя жандармерия хорошо справляется со своей работой с момента своего расширения, повстанцы всё ещё находятся там, где мы их не видим. Начало официальной кампании по подавлению повстанческой деятельности в Асире и Адене поможет навсегда устранить угрозу."
YEM_Minorities_Census: "Перепись меньшинств"
YEM_Minorities_Census_desc: "Хотя Йемен был известен наличием культурных меньшинств и до расширения границ, недавнее территориальное расширение увеличило численность этих меньшинств. Проведение переписи поможет нам понять, как обращаться с новыми меньшинствами в нашей стране."
YEM_Expand_Post_Services: "Расширить почтовую службу"
YEM_Expand_Post_Services_desc: "Распространение информации по Йемену было затруднительным не только из-за отсутствия дорог и инфраструктуры, но и из-за небольшой почтовой отрасли для распространения новостей о событиях в стране. Её расширение поможет нам ясно объяснить нашему народу происходящее."
YEM_Rally_The_Tribesmen: "Собрать соплеменников"
YEM_Rally_The_Tribesmen_desc: "На Ближнем Востоке назревает война, и турецкие армии, возможно, очень скоро перестанут считать себя доминирующей силой, которой они были последние несколько десятилетий. Поскольку другие арабы собирают своих соплеменников, нам будет разумно последовать их примеру."
YEM_Every_Yemen_a_Kingdom: "Провозгласить Мутаваккилитское королевство"
YEM_Every_Yemen_a_Kingdom_desc: "Поскольку наша подготовка завершена, мы можем провозгласить себя независимым королевством, когда османы окажутся в самой отчаянной ситуации."

YEM_Modern_Construction: "Современное строительство"
YEM_Modern_Construction_desc: "Методы нашего текущего строительства устарели и не подходят для современных условий. Реформа нашей строительной политики может стать хорошим началом в строительстве Йемена для будущего."
YEM_Update_Aden_Rail: "Новые железнодорожные линии Адена"
YEM_Update_Aden_Rail_desc: "Железная дорога Адена была построена британцами в 1916 году для помощи в транспортировке припасов в регионе. Хотя железная дорога всё ещё полезна, она остро нуждается в обновлении для эффективного использования."
YEM_Western_Yemen_Infra: "Железные дороги Красного моря"
YEM_Western_Yemen_Infra_desc: "Красное море было центром йеменской прибыли с начала тысячелетия, принося огромный доход. Расширение железных дорог должно помочь увеличить прибыль, получаемую нами от региона."
YEM_Hinterlands_Settling: "Заселить глубинные районы"
YEM_Hinterlands_Settling_desc: "Несмотря на наши лучшие усилия, глубинные районы на юге Йемена всё ещё пусты и бесплодны как никогда. Облегчение доступа в регион должно способствовать росту населения региона с течением времени."
YEM_Aden_Trade: "Расширить торговое влияние Адена"
YEM_Aden_Trade_desc: "С колонизацией глубинных районов Адена, Аден вскоре станет местом коммерческой прибыли для Йемена."
YEM_Aden_Goods: "Производство товаров в Адене"
YEM_Aden_Goods_desc: "Товары, полученные нами через аденскую торговлю, раскрывают новые, ранее неизвестные вещи, открытые иностранными торговцами. Используя эти новые знания и материалы, мы можем расширить промышленность Адена."
YEM_New_Oasis_Hunt: "Изучить иностранные планы"
YEM_New_Oasis_Hunt_desc: "Хотя мы могли бы попытаться разработать свой собственный план для экономики, несомненно, что державы, которые уже проходили через те же проблемы, что и мы, имеют планы, которые будут способствовать модернизации страны."
YEM_Start_Recovery: "Прекратить экономический спад"
YEM_Start_Recovery_desc: "Хотя Чёрный понедельник затронул нас гораздо меньше, чем другие страны, из-за нашей оторванности от Германии, некоторые его последствия всё же смогли повлиять на нас. Решение этих проблем должно помочь пролить некоторый свет на нашу и без того бедную экономику."
YEM_Arable_Land_Reforms: "Импорт промышленных инструментов"
YEM_Arable_Land_Reforms_desc: "Наша страна во многом демонстрирует образ старого мира, поскольку многие наши методы выполнения повседневных дел устарели. Это включает инструменты, которые наши рабочие используют ежедневно. Импорт инструментов из-за рубежа должен помочь облегчить жизнь рабочих."
YEM_Oil_Prospects: "Искать нефть"
YEM_Oil_Prospects_desc: "Хотя нам удалось обнаружить небольшие объёмы нефти в Йемене, их пока недостаточно для получения прибыли. Возможно, поиск дополнительных запасов принесёт неожиданные результаты."
YEM_Big_Farma: "Поддержать сельскохозяйственную промышленность"
YEM_Big_Farma_desc: "Сельскохозяйственная промышленность в Йемене является местом, где занята значительная часть населения, особенно в более малонаселённых районах. Мы должны обеспечить, чтобы отрасль оставалась в соответствии с современными стандартами, установленными современным миром."
YEM_Modern_Economy: "Современная экономика"
YEM_Modern_Economy_desc: "Благодаря различным реформам, трудностям и кризисам Йемен смог извлечь уроки и восстановиться после всего этого печального опыта. Теперь Йемен стоит гордо наравне с другими европейскими странами со своей недавно перекованной экономикой."

YEM_Officers_Come_Home: "Возвращение 40 офицеров"
YEM_Officers_Come_Home_desc: "40 офицеров - это группа, отправленная нашим правительством в Османскую империю, чтобы перенять их методы обучения. Возможно, пришло время сказать им возвращаться?"
YEM_Modern_Naval_Transports: "Металлические конвои"
YEM_Modern_Naval_Transports_desc: "Торговые флоты были ключом к экономическому успеху на протяжении веков, и нашему флоту нужны лучшие корабли, которые мы можем собрать, чтобы иметь какое-либо влияние в этом богатом торговлей море."
YEM_Merchant_Marine: "Учредить торговый флот"
YEM_Merchant_Marine_desc: "Торговые флоты используются для защиты торговых судов и торговли и используются многими странами. Учреждение йеменского торгового флота, надеюсь, увеличит прибыль от нашей обильной торговли."
YEM_Trade_Protection: "Защитить новый торговый флот"
YEM_Trade_Protection_desc: "После создания Йеменского торгового флота мы должны обеспечить, чтобы он мог получать всё необходимое без перебоев."
YEM_Aden_Ports: "Развить порт Адена"
YEM_Aden_Ports_desc: "Аден - один из наших самых прибыльных портов, откуда поступает большая часть нашего дохода. С недавно созданным торговым флотом расширение порта может максимизировать нашу торговую прибыль."
YEM_Ship_Commission: "Заказать флагман"
YEM_Ship_Commission_desc: "Флагманы используются как предмет национальной гордости стран, поскольку это их самый большой и лучший корабль, который они отправляют в бой. Взятие иностранного проекта и создание его как своего может помочь повысить наш национализм."
YEM_This_Is_My_Boomstick: "Новые проекты винтовок"
YEM_This_Is_My_Boomstick_desc: "Нынешний проект нашей винтовки давно устарел и неэффективен для современного боя; создание нового проекта для нашей армии имеет первостепенное значение."
YEM_Bigger_Boom: "Импорт артиллерии"
YEM_Bigger_Boom_desc: "В нашей стране в настоящее время нет никакого подобия артиллерийских проектов, и артиллерия нигде не используется в армии. Импорт артиллерии из-за рубежа может вывести нас на шаг вперёд перед нашими опасными соседями."
YEM_Fortify_To_Protecc: "Укрепить Асир"
YEM_Fortify_To_Protecc_desc: "Асир - это место, где будут происходить основные боевые действия с нашими османскими повелителями и эмиратом Неджд на севере, поэтому его защита, наряду с остальной частью страны, является нашим высшим приоритетом."
YEM_Mountain_Warriors: "Профессиональные горные стрелки"
YEM_Mountain_Warriors_desc: "В различных районах Йемена очень гористый ландшафт, который может быть труднопроходимым, но мы можем обратить это в преимущество. Обучение специальных полков эффективным боевым действиям в этих горах может поставить нас на ступень выше наших неопытных врагов."
YEM_Arabian_Knights: "Аравийские всадники"
YEM_Arabian_Knights_desc: "Кавалерия считается сильно устаревшей формой ведения боя в «современном мире», но она всё ещё имеет место на Ближнем Востоке из-за покрывающих его обширных пустынь. Обеспечение нашего мастерства в этом искусстве имеет решающее значение для ближневосточной войны."
YEM_Better_Shovels: "Военная поддержка"
YEM_Better_Shovels_desc: "Создание по-настоящему современной армии требует поддержки с тыла, так называемых подразделений поддержки. Такие вещи, как госпитали и инженерные войска, могут помочь специализировать наши силы для конкретных нужд и обстоятельств."
YEM_Trench_War: "Изучить траншейную войну"
YEM_Trench_War_desc: "Траншейная война в основном использовалась в Мировой войне и доказала свою эффективность. Поскольку современная доктрина ещё не была испытана в масштабах Мировой войны, траншейная война является более безопасным вариантом до более позднего времени."
YEM_Scouts: "Военная инженерия"
YEM_Scouts_desc: "Винтовки, особенно нашего слегка устаревшего образца, имеют тенденцию выходить из строя в самые неподходящие и неожиданные моменты, что может решить исход битвы. Наличие надёжных механиков и инженеров наготове может помочь обратить этот эффект вспять."
YEM_Hold_The_Line: "Планирование заранее"
YEM_Hold_The_Line_desc: "Мы будем разрабатывать планы войны против наций до того, как они начнутся, и откроем целое крыло для наших военных экспертов и членов правительства, чтобы они могли разрабатывать планы и обсуждать их."
YEM_Rifle_Guilds: "Гильдии оружейников и ружейных мастеров"
YEM_Rifle_Guilds_desc: "Гильдии - это способ для многих оружейников и ружейных мастеров встречаться и придумывать новые проекты, что весьма выгодно."
YEM_Taiz_Arsenal: "Основать арсенал Таизза"
YEM_Taiz_Arsenal_desc: "Зарождающаяся промышленная зона Таизза является идеальным местом для основания нашего первого завода по производству тяжёлого вооружения."
YEM_Modern_Army: "Модернизированные вооружённые силы"
YEM_Modern_Army_desc: "Благодаря различным реформам, иностранным исследованиям и собственным разработкам, Йемен теперь готов продемонстрировать свою современную армию другим державам мира."
YEM_Military_Science: "Военная наука"
YEM_Military_Science_desc: "Современная военная наука продолжает развиваться. Мы должны обучить следующее поколение умов, чтобы они не отставали и развивали нашу собственную военную мысль и руководство, чтобы армия Йемена оставалась на высоте."

YEM_Free_Kingdom: "Свободное королевство"
YEM_Free_Kingdom_desc: "После нашего освобождения от коррумпированной Османской империи мы можем двигаться в будущее как Йеменское королевство."
YEM_Claim_Dhofar: "Претендовать на Дофар"
YEM_Claim_Dhofar_desc: "Поскольку Великий Йемен становится очень близок к реальности, последняя часть, которая нам нужна, - это Дофар, находящийся во владении изолированного Омана."
YEM_Desperate_Struggle: "Отчаянная борьба"
YEM_Desperate_Struggle_desc: "Поскольку наша армия возвращается свежей после боёв с турецкими угнетателями, неблагонадёжные элементы общества поднялись и ударили нас, когда мы были не готовы. Битва за Йемен началась."
YEM_Chaos_In_The_Cities: "Хаос в городах"
YEM_Chaos_In_The_Cities_desc: "Восстание достигло невиданных ранее высот, оно приближается к военным условиям по всей стране."
YEM_Rebels_Crushed: "Повстанцы разгромлены"
YEM_Rebels_Crushed_desc: "Несмотря на пыл и преданность повстанцев, наша верная армия сумела потушить последние пламена восстания. Это, надеюсь, приведёт к мирному будущему для Йемена."
#YEM_Nepotism: "Доверенное правительство" уже определено выше как идея
#YEM_Nepotism_desc: "На протяжении веков народ доверял имаму вести нацию, и он будет продолжать это делать." уже определено выше как описание идеи
YEM_Efficient_Rule: "Эффективное правление"
YEM_Efficient_Rule_desc: "Имам всю свою жизнь посвятил Йемену, производя впечатление на государственных деятелей со всего мира. Его правление будет провозглашено как правление прогресса и эффективности."
YEM_Devoted_Sovereign: "Преданный государь"
YEM_Devoted_Sovereign_desc: "Король теперь остаётся высшей властью в Йемене, и никто не может встать на его пути. Все люди будут смотреть на него и его превосходное правление."
YEM_Humane_And_Just: "Гуманный и справедливый"
YEM_Humane_And_Just_desc: "Один иностранец однажды назвал методы имама «гуманными и патриархальными». Таким его правление видят его верные подданные - гуманным и справедливым."
YEM_Troop_Passage: "Военные дороги"
YEM_Troop_Passage_desc: "Реконструкция дорог в стране, построенных для военных, поможет войскам более эффективно добираться до места назначения."
YEM_All_Roads_To_Sanaa: "Сердце Йемена"
YEM_All_Roads_To_Sanaa_desc: "Сана - это сердце и дом йеменского народа, где все дороги начинаются и заканчиваются. Мы должны развивать её дальше, чтобы обеспечить сохранение её славы."
YEM_Unified_Economy: "Единая экономика"
YEM_Unified_Economy_desc: "Экономика Йемена сильно пострадала от последствий Чёрного понедельника, и многие уроки были извлечены. Теперь мы можем попытаться восстановить единство экономики."
YEM_Advanced_Comms: "Передовые коммуникации"
YEM_Advanced_Comms_desc: "Радар - это довольно недавнее изобретение в западном мире, которое помогает таким силам, как войска, корабли и самолёты, обнаруживать передвижения врага. Изучение этой технологии могло бы позволить контролировать все уголки Йемена из Саны."
#YEM_Prepared_Army: "Готовая армия" уже определено выше как идея
#YEM_Prepared_Army_desc: "Поскольку Йемен полностью объединён и готов встретить любые внешние угрозы, мы должны иметь надлежащую армию для его защиты." уже определено выше как описание идеи
YEM_Centralize_Power: "Единственная и высшая власть"
YEM_Centralize_Power_desc: "Имам Йемена будет действовать как единственная и высшая власть во всём Йемене, и всё, что делается правительством, будет им одобрено."

YEM_Remove_Imam: "Упразднить имамат"
YEM_Remove_Imam_desc: "Пришло время освободить йеменский народ и позволить Йемену стать свободным! Провозглашается Первая Йеменская республика!"
YEM_Hold_Elections: "Провести выборы"
YEM_Hold_Elections_desc: "После освобождения страны настало время провести первые выборы в Йемене. Две основные конкурирующие партии - «Шабаб аль-Амр» и «Хаит аль-Надиаль», у обеих есть хорошие шансы на победу."
YEM_Soc_Cons: "Консервативная республика"
YEM_Soc_Cons_desc: "С победой на первых йеменских выборах партии «Хаит аль-Надиаль» основание Республики будет построено на консервативных принципах и структурах."
YEM_Reaffirm_Common_Law: "Подтвердить общее право"
YEM_Reaffirm_Common_Law_desc: "Общее право, или шариат, составляет основу законов в мусульманском мире. Мы останемся верны нашим традициям и построим нашу республику на этих ценностях."
YEM_Presidential_Powers: "Президентские полномочия"
YEM_Presidential_Powers_desc: "Следующим шагом к установлению мира в новой Республике является назначение президента для заполнения вакуума власти, оставленного имамом."
YEM_Qat_And_Coffee: "Торговля товарными культурами"
YEM_Qat_And_Coffee_desc: "Многие культуры выращиваются вдоль побережья Йемена, фермеры постоянно трудятся над ними. Некоторые из них являются более эксклюзивными для нашего географического региона и могут быть проданы за наличные."
YEM_Red_Sea_Trade: "Центр Красного моря"
YEM_Red_Sea_Trade_desc: "Красное море - это область, которую нам жизненно необходимо защищать, если мы хотим сохранить наши многочисленные торговые прибыли, но наш нынешний посредственный флот не может этого достичь."
YEM_Trade_With_Europe: "Торговля с Европой"
YEM_Trade_With_Europe_desc: "Благодаря нашему ключевому расположению за Суэцким каналом и через Красное море, европейцы, торгующие с нами, могут помочь нам использовать наше превосходное географическое положение."
YEM_Soc_Libs: "Либеральная республика"
YEM_Soc_Libs_desc: "С победой на первых йеменских выборах партии «Шабаб аль-Амр» основание Республики будет построено на либеральных принципах и структурах."
YEM_Modernize_laws: "Модернизировать законы"
YEM_Modernize_laws_desc: "Законы Йемена всё ещё содержат много авторитарных практик и устаревших империалистических конструкций и остро нуждаются в пересмотре."
YEM_Regional_Rulers: "Региональное управление"
YEM_Regional_Rulers_desc: "С победой либеральной партии мы можем положить конец автократии Саны и вернуть власть Йемена всей нации. Уменьшение власти центрального правительства и передача её региональным правительствам может помочь обеспечить это."
YEM_Electrification: "Электрификация"
YEM_Electrification_desc: "Почти весь Йемен лишён преимуществ чуда электрического освещения. Если мы хотим просветить народ, мы должны осветить страну."
YEM_New_Development: "Новое развитие"
YEM_New_Development_desc: "Благодаря быстрому развитию по всему Йемену мы можем начать расширять промышленность для нашего народа. Наши действия здесь станут фундаментом нашего нового Йемена."
YEM_Begin_Industrialization: "Начать индустриализацию"
YEM_Begin_Industrialization_desc: "После того как конституция будет уточнена, а промышленность начнёт развиваться, Йемен сможет приступить к индустриализации будущего. Это будет долгий и трудный процесс, но модернизация страны может сотворить чудеса в будущем."
YEM_Islamic_Constitution: "Исламская конституция"
YEM_Islamic_Constitution_desc: "Хотя мы освободились от монархии, наша национальная идентичность по-прежнему строится на исламских идеях и принципах. Теперь, когда наша страна готова, мы можем уточнить содержание такой конституции, основанной на исламе и зайдитской вере."
YEM_Local_Representation: "Местные представители"
YEM_Local_Representation_desc: "Хотя Йемен в значительной степени един, каждый регион Йемена содержит различные меньшинства и племена, особенно на юге. Назначение представителей для отстаивания потребностей каждой из этих групп позволит нам надлежащим образом управлять страной."
YEM_Welcome_Intellectuals: "Приветствовать интеллектуалов"
YEM_Welcome_Intellectuals_desc: "Йемен стоит как маяк свободной мысли и самовыражения в море угнетающих и полных страха монархий. Уже интеллектуалы стекаются из соседних земель в поисках убежища."
YEM_Begin_Nahda: "Начать Нахду"
YEM_Begin_Nahda_desc: "Нахда подобна Ренессансу западного мира, но сосредоточена вокруг исламской веры. Поскольку она поддерживает такие идеи, как панисламизм и антиколониализм, она будет важна для построения нашей страны в будущем."
YEM_Political_Liberties: "Политические свободы"
YEM_Political_Liberties_desc: "Наши люди должны иметь возможность свободно высказывать своё мнение по различным вопросам, касающимся правительства и его политики, и помочь нам правильно построить правительство."
YEM_Pan_Arabist_Thought: "Панарабистская мысль"
YEM_Pan_Arabist_Thought_desc: "Благодаря нашим различным модернизациям и принятию Нахды изначально панисламская мысль эволюционировала в специфически панарабистскую. Этот образ мыслей может помочь нашему правительству и стране работать над будущим, где это возможно."

YEM_Rassid_Arabia: "Рассидская Аравия"
YEM_Rassid_Arabia_desc: "Сумев обеспечить нашу независимость от османской и аравийской угрозы, мы смогли объединить Аравию под нашим знаменем. Хотя консолидация огромных территорий будет сложным процессом, теперь мы можем официально провозгласить Рассидскую Аравию."
YEM_Damage_Control: "Контроль ущерба"
YEM_Damage_Control_desc: "Ущерб, нанесённый нашей войной с бывшей Аравией, вызвал разрушения во многих частях наших новых и старых земель. Мы должны ограничить ущерб, сдерживая его везде, где только возможно."
YEM_Rebuild_and_Heal: "Восстановить и исцелить"
YEM_Rebuild_and_Heal_desc: "Люди на новых землях едва ли культурно являются йеменцами, и интеграция йеменской культуры в аравийский идеал будет долгим и трудным процессом."
YEM_Appease_Tribes: "Умиротворить племена"
YEM_Appease_Tribes_desc: "Многие местные племена находятся в слабонаселённых районах Аравии и действуют независимо от нашего правительства. Нам нужно будет компенсировать этим племенам, если мы хотим, чтобы наше правительство было ими признано."
YEM_Mobilize_Military_As_Police: "Мобилизовать армию как полицию"
YEM_Mobilize_Military_As_Police_desc: "Поскольку большая часть местных угроз устранена, мы можем безопасно начать мобилизацию армии в качестве полиции внутри нашей страны, чтобы успокоить беспорядки."
YEM_Crackdown_On_Dissent: "Подавление инакомыслия"
YEM_Crackdown_On_Dissent_desc: "С мобилизацией полиции подавление нелояльности и местных племён стало гораздо более лёгкой задачей."
YEM_Purge_Saudis: "Очистить саудитов"
YEM_Purge_Saudis_desc: "Династия Саудитов пыталась уничтожить нашу страну и династию, и мы ответим тем же. Не будет пощады семье Саудитов, которая угрожала нашей стране, народу и имаму."
YEM_Give_Religious_Freedom: "Даровать религиозную свободу"
YEM_Give_Religious_Freedom_desc: "Сам Йемен следует очень разной секте ислама по сравнению с остальной Аравией, и было бы трудно обратить всех в нашу точку зрения. Обеспечение возможности исповедовать свои религии в мире должно стать альтернативным решением."
YEM_Begin_Integration: "Начать интеграцию"
YEM_Begin_Integration_desc: "Благодаря нашим многочисленным реформам мы можем начать интеграцию многих частей Аравии. Это будет лишь началом ещё более долгого процесса."
YEM_New_Administration: "Новая администрация"
YEM_New_Administration_desc: "Поскольку беспорядки в основном ушли, мы можем наладить администрацию нашей обширной территории."
YEM_Welcome_Rashids_Back: "Приветствовать возвращение Рашидидов"
YEM_Welcome_Rashids_Back_desc: "Династия Рашидидов из Джебель-Шаммара была побеждена Саудитами и состоит в родстве с нашей. Предоставление им места в нашем правительстве продемонстрирует хорошую вежливость и поможет улучшить наши аравийские связи."
YEM_Complete_Integration: "Завершить интеграцию"
YEM_Complete_Integration_desc: "После того как все процессы завершены, мы можем стать больше, чем просто Рассидской Аравией по названию, и заставить наших людей видеть себя также людьми внутри Рассидской Аравии."

