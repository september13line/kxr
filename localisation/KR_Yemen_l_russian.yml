yemen_focus: "Yemen Focus Tree"

### Leaders ###
POLITICS_YAHYA_HAMID_DESC: "Начиная с 1934 года, Яхья направил свою энергию на внутреннюю консолидацию своей власти и создание дееспособного центрального правительства, подотчётного лично ему. С этой целью он теперь стремится установить контроль над внутренними районами Йемена, создать современную регулярную армию и установить чёткие правила престолонаследия наследственных губернаторств, всё это - внимательно следя за бурной политической обстановкой в самой Сане. С аль-Хамидом у руля Йемен движется в современную эпоху, сохраняя при этом своё полуфеодальное устройство."
POLITICS_ALI_NASSAR_AL-QADARI_DESC: "Сын шейха Нассера бин Мас'ада. Али Нассер имел простое происхождение. Будучи суннитом, он поднял восстание против имама Яхьи в 1928 году, когда имам навязал свою власть над Аденом. Затем ан-Нассер уклонился от призыва имама и присоединился к повстанцам. Во время восстания Али Нассер обратился к своему артистическому началу, расписывая поэтично свою миссию убить имама. С этой целью он вступил в подпольную организацию «Хаит аль-Надиаль» и благодаря своему выразительному голосу стал её лидером."
POLITICS_SHABAB_AL-AMR_DESC: "Родом из Таизза, семью Нуманов можно охарактеризовать как средний класс. Будучи суннитом, Ахмад не мог получить надлежащего образования в области мусульманских наук, чтобы продвинуться в Йемене. Возможно, это было связано со слухами о том, что его семья происходила от йеменских евреев. Вместо этого Ахмад получил образование в области западной логики в аль-Мадрасса аль-Ахлийя. Эта школа в конечном итоге стала местом действия реформаторской группы Ахмада «Нади аль-Ислах». «Нади аль-Ислах» считало как Мутаваккилийское королевство, так и Османский халифат пережитками, сдерживающими Йемен. Он разработал программу, которая маскировала социальные реформы под терминологией реакционеров. «Продвижение добра и предотвращение зла» позволило его восстанию привлечь на свою сторону в остальном консервативных йеменцев. В конечном итоге эта прокламация для Йемена должна была облегчить перемены в стране, разделённой на два враждующих лагеря."

### Ideas ###
YEM_black_monday: "Волны Чёрного понедельника"
YEM_black_monday_desc: "Хотя кризис затронул нас не так сильно, как другие страны, наши связи с Османской империей принесли нам экономическую контагию Чёрного понедельника. Несомненно, республиканцы возложат вину за это на имама."
YEM_Modern_Eco: "Модернизированная экономика"
YEM_Modern_Eco_desc: "Западные газеты снова начали выражать надежду на йеменскую экономику. Благодаря валютной реформе и мерам жёсткой экономии наши рынки восстановили некоторое доверие. Теперь Йемен может экономически стоять наравне с остальным миром."
YEM_Ottoman_Rule: "Османское правление"
YEM_Ottoman_Rule_desc: "Османское правление в Йемене привело к формированию двух различных типов инакомыслия. Одни - это мятежники, которые считают нашу верность халифу предательством нашего зайдитского порядка, а другие видят в национализме Османской империи предпочтение мудрому правлению имама."
YEM_Old_Army: "Устаревшая армия"
YEM_Old_Army_desc: "Армия Йемена умеет только защищать свою территорию и ещё не вкусила победы в зарубежной войне. Мы отстаём от большинства стран современного мира."
YEM_Modern_Plans: "Современное планирование"
YEM_Modern_Plans_desc: "Благодаря опыту войны против османов и усилению военного образования в иностранных академиях армия Йемена теперь может твёрдо стоять на ногах."
YEM_Anarchy: "Государство в беспорядке"
YEM_Anarchy_desc: "Из-за сочетания османского правления и огромных просторов недавно приобретённой территории Йемена имаму было трудно демонстрировать свою власть всем своим подданным."
YEM_Anarchy_2: "Государство в беспорядке"
YEM_Anarchy_2_desc: "Из-за сочетания османского правления и огромных просторов недавно приобретённой территории Йемена имаму было трудно демонстрировать свою власть всем своим подданным."
YEM_NiceGuy: "Благожелательное правление"
YEM_NiceGuy_desc: "Имам решил показать свою благожелательную сторону менее лояльным племенным подданным. Как ни удивительно, эти подданные ответили давно просроченными налогами и контрактами, демонстрирующими свою лояльность."
YEM_ToughGuy: "Строгое правление"
YEM_ToughGuy_desc: "Те, кто отказывается от призыва имама, должны быть загнаны в загон. Нелояльность в этот критический час не будет прощена."
YEM_Gendarmes: "Йеменская жандармерия"
YEM_Gendarmes_desc: "Создание жандармерии помогло нам удержать повстанческие движения от угрозы стране, по крайней мере, пока."
YEM_Thicc_Gendarmes: "Расширенная жандармерия"
YEM_Thicc_Gendarmes_desc: "Расширение жандармерии сделало её ещё более эффективной силой, способной даже помогать в защите от внешних угроз."
YEM_Ottoman_Rule_weak: "Угасающий сюзерен"
YEM_Ottoman_Rule_weak_desc: "Хотя османское правление всё ещё существует, их присутствие и власть над страной уменьшились. Многие османские солдаты устали от приключений на нашей земле."
YEM_Ottoman_Rule_Split: "Йеменская администрация"
YEM_Ottoman_Rule_Split_desc: "Даже если наша страна остаётся разделённой по религиозным и политическим вопросам, мы должны немедленно управлять своими собственными землями, иначе рискуем их потерять."
YEM_Purges: "Очищенное население"
YEM_Purges_desc: "Нелояльные элементы нашего общества были принудительно удалены по приказу имама."
YEM_HorsieBoyes: "Аравийские всадники"
YEM_HorsieBoyes_desc: "В отличие от остального мира, Ближний Восток - одно из немногих мест, где кавалерия всё ещё эффективна. Наши генералы обучены использованию лошадей для защиты."
YEM_forts: "Защитить Йемен"
YEM_forts_desc: "Йемен - дом для многих, и он должен быть защищён любой ценой."
YEM_Rifle_Guilds_Temp: "Гильдии оружейников"
YEM_Rifle_Guilds_Temp_desc: "Производство оружия значительно улучшилось благодаря скоординированным усилиям оружейников в стране."
YEM_Merchant_Fleet: "Основан торговый флот"
YEM_Merchant_Fleet_desc: "Наше ключевое положение в торговле привело к созданию торгового флота, что значительно увеличило торговую прибыль."
YEM_Yemen_On_Fire: "Королевство в хаосе"
YEM_Yemen_On_Fire_desc: "Наше освобождение от османов имело одно очень важное disadvantage: свободу повстанческих групп снова начать движение. Насилие вернулось на улицы, и существование имамата под угрозой."
YEM_Prepared_Army: "Готовая армия"
YEM_Prepared_Army_desc: "Наши солдаты верны имаму и готовы сражаться за его дело в любое время."
YEM_Troop_Movement: "Дороги с ограниченным доступом"
YEM_Troop_Movement_desc: "Обеспечение дорог для использования верной армией имама привело к сокращению времени в пути повсюду."
YEM_Unified_Eco: "Единая экономика"
YEM_Unified_Eco_desc: "Имам сумел вдохновить большинство подвластных ему людей работать вместе на будущее развитие Йемена."
YEM_Nepotism: "Контроль над государством"
YEM_Nepotism_desc: "Новая политическая ситуация в Йемене требует полного и безоговорочного сотрудничества нашего народа."
YEM_Devotion: "Преданный государь"
YEM_Devotion_desc: "Наши усилия по подавлению нелояльных элементов в нашем обществе, которые вредят нашему населению, сильно удовлетворили наш народ."
YEM_Humane: "Популярный король"
YEM_Humane_desc: "Король восстановил некоторую честь среди народа. Большинство йеменцев видят в имаме необходимость для своей жизни, и безопасность имамата в результате обеспечена."
YEM_Eternal_Saana: "База власти в Сане"
YEM_Eternal_Saana_desc: "Имам действует как единственная и высшая власть Йемена, и все вопросы должны проходить через него в первую очередь."
YEM_Common_Law: "Общее право подтверждено"
YEM_Common_Law_desc: "Общее право, также известное как шариат, теперь утверждено в стране и является неотъемлемой частью общества."
YEM_President: "Президентские полномочия"
YEM_President_desc: "Роль президента теперь является ключевой в управлении Йеменом, поскольку он обладает наибольшей властью в Республике."
YEM_Euro_Zone: "Европейская торговля"
YEM_Euro_Zone_desc: "Торговля с европейскими странами начинает составлять большой сектор нашей экономики и благосостояния."
YEM_New_Laws: "Пересмотренные законы"
YEM_New_Laws_desc: "Старые законы Йемена, основанные на модели руководства зайдитов, были заменены гражданским правом, основанным на прецеденте."
YEM_Local: "Местное правление"
YEM_Local_desc: "Отдельным областям страны предоставлено больше автономии, и решения ложатся на плечи местных жителей."
YEM_Pol_Indust: "Политическая индустриализация"
YEM_Pol_Indust_desc: "Промышленность в стране начала бурно развиваться в результате наших политических реформ."
YEM_Farm_boye: "Фермы ката и кофе"
YEM_Farm_boye_desc: "Сельское хозяйство распространилось на новые плодородные долины Йемена. Лучше всего то, что на новых фермах выращивают кат и кофе - еду и наркотики, которыми мы, йеменцы, славимся."
YEM_embrace_nahda: "Принятие Нахды"
YEM_embrace_nahda_desc: "Нахда начала влиять на наше общество в соответствии с новыми традициями, включая развитие исламской культуры, которой будет завидовать арабский мир."
YEM_local_admin: "Местные представители"
YEM_local_admin_desc: "В каждый регион Йемена назначены представители, чтобы объяснять потребности этого района и способы решения их проблем."
YEM_pan_arab_thot: "Панарабистская мысль"
YEM_pan_arab_thot_desc: "Арабское единство снова достигло берегов Йемена. Идея о том, что мы можем преодолеть наши национальные различия и объединиться против мушрикун."
YEM_famine: "Голод"
YEM_disloyal_vassal: "Нелояльный вассал"
YEM_disloyal_vassal_desc: "Османы не должны иметь никакого контроля над нами или нашими решениями. Наша власть проистекает из большей силы, чем их."
YEM_arabian_integration: "Интеграция Аравии"
YEM_arabian_integration_desc: "С нашим поражением Аравии мы теперь контролируем всю Аравию. Однако проблемы бушуют, поскольку йеменская и аравийская культуры испытывают взаимную неприязнь."
YEM_arabian_integration_rebuild: "Восстановление Аравии"
YEM_arabian_integration_rebuild_desc: "Наша помощь в восстановлении нашей великой и святой земли вызывает восхищение у многих."
YEM_arabian_integration_dissent: "Подавление аравийского инакомыслия"
YEM_arabian_integration_dissent_desc: "Многие бывшие аравийцы заняли откровенно враждебную позицию по отношению к нашей администрации, и с ними поступают соответствующим образом."
YEM_arabian_integration_2: "Умиротворение племён"
YEM_arabian_integration_2_desc: "Многие племена на наших недавно приобретённых землях получают компенсацию в виде даров и особых привилегий, чтобы сделать их лояльными нашему правительству."
YEM_arabian_integration_administration: "Новая администрация Аравии"
YEM_arabian_integration_administration_desc: "Административные законы были обновлены, чтобы позволить нам сохранить это великое богатство земли, которое мы завоевали."
YEM_arabian_integration_rashids: "Дом Рашидидов приглашён"
YEM_arabian_integration_rashids_desc: "Дом Рашидидов был приглашён в Йемен после бегства из Саудовской Аравии."
YEM_arabian_integration_arabian_spirit: "Аравийский дух"
YEM_arabian_integration_arabian_spirit_desc: "Население теперь полностью довольно нашим правлением, и наша новая аравийская страна пройдёт через этот век с высоко поднятой головой."
YEM_PostalService: "Йеменская почтовая служба"
YEM_PostalService_desc: "Чтобы лучше осуществлять контроль над обширными территориями, которыми мы управляем, и соединить наш народ с центральным правительством, имам создал новую и расширенную почтовую службу."

### Decisions###
YEM_rebel_category: "Борьба за нашу свободу"
YEM_rebel_category_desc: "Когда наша подготовка будет завершена, мы сможем официально объявить независимость от османской угрозы, как только представится возможность."

YEM_proclaim_kingdom: "Провозгласить Мутаваккилитское королевство"
YEM_proclaim_kingdom_desc: "Время пришло! Поскольку наша страна более едина, чем когда-либо, мы можем официально упразднить имамат и провозгласить Йеменское королевство! Конечно, для начала мы должны разобраться с османами, которым это не понравится."

