#Tanks

AOG_gw_tank_equipment: "Sturmpanzerwagen A7V"
AOG_gw_tank_equipment_short: "A7V"
AOG_gw_tank_equipment_desc: "The Sturmpanzerwagen A7V is a German tank which was used extensively during the Вельткриг, and is often seen depicted in works of art celebrating the German victory over the Entente. However, its design has since become obsolete and Germany has come to use newer, more complicated tank designs."
AOG_light_tank_equipment_1: "Sturmpanzerwagen M.I 'Kätzchen'"
AOG_light_tank_equipment_1_short: "Kätzchen"
AOG_light_tank_equipment_1_desc: "Лёгкий Panzer I вооружён лишь двумя ручными пулемётами. Разработка началась в 1932 году как стандартного учебного танка. Незадолго до массового выпуска в 1934-м назначение и конструкцию пересмотрели, и армия приняла его для боя."
AOG_light_tank_equipment_2: "Sturmpanzerwagen M.II 'Ozelot'"
AOG_light_tank_equipment_2_short: "Ozelot"
AOG_light_tank_equipment_2_desc: "Хотя Panzer II основан на шасси Panzer I, он существенно отличается усиленными вооружением, бронёй и двигателем, а также полностью новой трансмиссией. Машину задумывали временной, пока разрабатывались более крупные и совершенные танки, но хорошие боевые качества обеспечили ей прочное место в немецких войсках."
AOG_light_tank_equipment_3: "VK1602 'Leopard'"
AOG_light_tank_equipment_3_short: "Leopard"
AOG_light_tank_equipment_3_desc: "VK1602 Leopard планировался как разведчик с 75-мм KwK 41. В ходе разработки её заменили меньшей 50-мм пушкой с большей бронепробиваемостью. В отличие от старых немецких машин, он получил наклонную лобовую броню и сверхширокие гусеницы. Теперь Leopard успешно сочетает разведку с поддержкой войск."
AOG_light_tank_artillery_equipment_1: "Sturmpanzer I Bison"
AOG_light_tank_artillery_equipment_1_short: "Bison"
AOG_light_tank_artillery_equipment_1_desc: "Буксируемым орудиям пехотных артиллерийских рот моторизованных полков было трудно поспевать за танками в бою. Простейшим решением стала установка орудия на имеющееся танковое шасси. «Бизон» использует для этого шасси Panzer I."
AOG_light_tank_artillery_equipment_2: "Sd. Kfz. 124 Wespe"
AOG_light_tank_artillery_equipment_2_short: "Wespe"
AOG_light_tank_artillery_equipment_2_desc: "Sd.Kfz.124 «Веспе» — немецкая самоходная артиллерийская установка на изменённом шасси Panzer II."
AOG_light_tank_artillery_equipment_3: "Waffenträger Leopard"
AOG_light_tank_artillery_equipment_3_short: "WT Leopard"
AOG_light_tank_artillery_equipment_3_desc: "Waffenträger Leopard — самоходная артиллерийская установка на шасси VK1602 Leopard."
AOG_light_tank_destroyer_equipment_1: "Panzerjäger I"
AOG_light_tank_destroyer_equipment_1_short: "Pzjäger I"
AOG_light_tank_destroyer_equipment_1_desc: "Panzerjäger I — первая немецкая бронемашина, созданная совместно с зарубежной фирмой. На переделанном шасси Panzer I Ausf. установлена 47-мм противотанковая пушка габсбургской Škoda."
AOG_light_tank_destroyer_equipment_2: "7.5 cm PaK 40 auf Fahrgestell Marder II"
AOG_light_tank_destroyer_equipment_2_short: "Marder II"
AOG_light_tank_destroyer_equipment_2_desc: "Marder II — немецкий истребитель танков на шасси Panzer II."
AOG_light_tank_destroyer_equipment_3: "Sturmgeschütz auf Leopard"
AOG_light_tank_destroyer_equipment_3_short: "JagdLeopard"
AOG_light_tank_destroyer_equipment_3_desc: "JagdLeopard — вариант лёгкого VK1602 Leopard с новой 88-мм пушкой высокой бронепробиваемости."
AOG_light_tank_aa_equipment_1: "Flakpanzer I"
AOG_light_tank_aa_equipment_1_short: "FlakPz I"
AOG_light_tank_aa_equipment_1_desc: "Зенитная пушка на шасси Panzer I."
AOG_light_tank_aa_equipment_2: "Flakpanzer Luchs"
AOG_light_tank_aa_equipment_2_short: "FlakPz Luchs"
AOG_light_tank_aa_equipment_2_desc: "Зенитная пушка на шасси Panzer II."
AOG_light_tank_aa_equipment_3: "Flakpanzer 1602"
AOG_light_tank_aa_equipment_3_short: "FlakPz 1602"
AOG_light_tank_aa_equipment_3_desc: "Зенитная пушка на шасси VK1602 Leopard."

AOG_medium_tank_equipment_1: "Kavalleriepanzerwagen P.II 'Donnerschlag'"
AOG_medium_tank_equipment_1_short: "Donnerschlag"
AOG_medium_tank_equipment_1_desc: "The 'Donnerschlag' was designed from the beginning to be the backbone of Germany's new armoured forces. With that in mind, the vehicle is much simpler and efficient to produce than comparable designs. The tank features a 5 cm KwK 38 L/42 main gun and two machine guns. Rumors abound that General Гейнц Гудериан was directly involved with the vehicles design and initial production."
AOG_medium_tank_equipment_2: "Kavalleriepanzerwagen P.IId 'Donnerschlag-4'"
AOG_medium_tank_equipment_2_short: "Donnerschlag-4"
AOG_medium_tank_equipment_2_desc: "Созданный для поддержки пехоты «Доннершлаг-4» первоначально не предназначался для борьбы с танками — эту задачу выполнял более лёгкий «Доннершлаг». Однако недостатки доктрины быстро проявились, и с появлением зарубежных машин «Доннершлаг-4» взял на себя противотанковую роль всё более устаревающего собрата."
AOG_medium_tank_equipment_3: "Kavalleriepanzerwagen P.IIIf 'Kriegsengel'"
AOG_medium_tank_equipment_3_short: "Kriegsengel"
AOG_medium_tank_equipment_3_desc: "«Кригсенгель» — общепринятое название среднего танка, созданного в ответ на новые машины коммунаров и для замены «Доннершлага». Превосходное сочетание огневой мощи, подвижности и защищённости «Пантеры», несомненно, станет образцом для других стран."
AOG_medium_tank_artillery_equipment_1: "Sd.Kfz. 138/1 'Grille'"
AOG_medium_tank_artillery_equipment_1_short: "Grille"
AOG_medium_tank_artillery_equipment_1_desc: "Sd.Kfz.138/1 «Грилле» — самоходная артиллерийская установка. Её представление вызвало споры: многие обвиняли конструкторов в том, что они лишь приукрасили старую габсбургскую разработку."
AOG_medium_tank_artillery_equipment_2: "Hummel"
AOG_medium_tank_artillery_equipment_2_short: "Hummel"
AOG_medium_tank_artillery_equipment_2_desc: "«Хуммель» — самоходная артиллерийская установка на шасси «Доннершлага», вооружённая 150-мм гаубицей."
AOG_medium_tank_artillery_equipment_3: "Grille 12"
AOG_medium_tank_artillery_equipment_3_short: "Grille 12"
AOG_medium_tank_artillery_equipment_3_desc: "Grille 12 — предложенная Krupp самоходная артиллерийская установка из узлов «Кригсенгеля» со 128-мм гаубицей. Поначалу проект не выходил за пределы чертежей, но армейский конкурс вдохнул в него новую жизнь."
AOG_medium_tank_destroyer_equipment_1: "Sturmgeschütz III"
AOG_medium_tank_destroyer_equipment_1_short: "StuG III"
AOG_medium_tank_destroyer_equipment_1_desc: "Штурмовое орудие StuG III построено на проверенном шасси «Доннершлага». Первоначально мобильная бронированная лёгкая пушка поддержки пехоты, оно постоянно дорабатывалось и теперь предназначено для борьбы с танками."
AOG_medium_tank_destroyer_equipment_2: "Jagdpanzer IV"
AOG_medium_tank_destroyer_equipment_2_short: "JagdPz IV"
AOG_medium_tank_destroyer_equipment_2_desc: "Jagdpanzer IV — штурмовое орудие и истребитель танков на шасси «Доннершлага-4»."
AOG_medium_tank_destroyer_equipment_3: "Jagdengel"
AOG_medium_tank_destroyer_equipment_3_short: "Jagdengel"
AOG_medium_tank_destroyer_equipment_3_desc: "«Ягденгель» — штурмовое орудие и истребитель танков на шасси «Кригсенгеля»."
AOG_medium_tank_aa_equipment_1: "Flakpanzer III 'Möbelwagen'"
AOG_medium_tank_aa_equipment_1_short: "Möbelwagen"
AOG_medium_tank_aa_equipment_1_desc: "Прозванная «Мёбельвагеном» из-за сходства закрытой коробчатой башни с мебельным фургоном, эта зенитная самоходная установка построена на шасси «Доннершлага» и вооружена счетверённой 20-мм установкой."
AOG_medium_tank_aa_equipment_2: "Flakpanzer IV 'Ostwind'"
AOG_medium_tank_aa_equipment_2_short: "Ostwind"
AOG_medium_tank_aa_equipment_2_desc: "Flakpanzer IV «Оствинд» создан в 1944 году на шасси «Доннершлага-4» как преемник раннего Flakpanzer IV. Обычную башню заменили открытой шестигранной с 37-мм FlaK 43. Закрытая башня была бы предпочтительнее, но этому мешало сильное задымление при стрельбе."
AOG_medium_tank_aa_equipment_3: "Flakpanzer Coelian"
AOG_medium_tank_aa_equipment_3_short: "Coelian"
AOG_medium_tank_aa_equipment_3_desc: "Flakpanzer Coelian — зенитная самоходная установка Rheinmetall с двумя 37-мм пушками FlaK 43 в полностью закрытой вращающейся башне на корпусе среднего танка «Кригсенгель»."

AOG_heavy_tank_equipment_1: "Versuchskonstruktion 31"
AOG_heavy_tank_equipment_1_short: "VK 31"
AOG_heavy_tank_equipment_1_desc: "Versuchskonstruktion 31 — одна из ранних немецких попыток создать более тяжёлый танк. Совместный проект Krupp и Rheinmetall-Borsig был принят германской армией в небольшом количестве."
AOG_heavy_tank_equipment_2: "Panzerkampfwagen VI Tiger"
AOG_heavy_tank_equipment_2_short: "Tiger"
AOG_heavy_tank_equipment_2_desc: "«Тигр» — немецкий тяжёлый танк с чрезвычайно мощной бронёй, созданный в ответ на всё более сильные танковые пушки коммунаров."
AOG_heavy_tank_equipment_3: "Panzerkampfwagen Tiger Ausf. B"
AOG_heavy_tank_equipment_3_short: "Königstiger"
AOG_heavy_tank_equipment_3_desc: "Неофициально известный как «Королевский тигр», Tiger II развивает концепцию Tiger I, становясь ещё более грозным. Толстая броня предшественника сочетается с наклонной бронёй среднего «Кригсенгеля». Почти семидесятитонный танк имеет лобовую защиту толщиной 100–180 мм и длинноствольную 88-мм пушку KwK 43 L/71."
AOG_heavy_tank_artillery_equipment_2: "Sturmtiger"
AOG_heavy_tank_artillery_equipment_2_short: "Sturmtiger"
AOG_heavy_tank_artillery_equipment_3: "Geschützwagen Tiger"
AOG_heavy_tank_artillery_equipment_3_short: "GW Tiger"
AOG_heavy_tank_artillery_equipment_3_desc: "На корпусе «Королевского тигра» установлено 170-мм орудие K 72 L/50."
AOG_heavy_tank_destroyer_equipment_1: "Selbstfahrlafette auf VK3001(H) Sturer Emil"
AOG_heavy_tank_destroyer_equipment_1_short: "Sturer Emil"
AOG_heavy_tank_destroyer_equipment_1_desc: "Selbstfahrlafette auf VK3001(H) «Штурер Эмиль» — немецкое самоходное противотанковое орудие на шасси Henschel VK3001."
AOG_heavy_tank_destroyer_equipment_2: "Panzerjäger Tiger (P)"
AOG_heavy_tank_destroyer_equipment_2_short: "Elefant"
AOG_heavy_tank_destroyer_equipment_2_desc: "«Элефант» («Слон») — тяжёлый истребитель танков на шасси отменённого проекта Porsche Tiger с 88-мм пушкой PaK 43/2."
AOG_heavy_tank_destroyer_equipment_3: "Panzerjäger Tiger Ausf. B"
AOG_heavy_tank_destroyer_equipment_3_short: "Jagdtiger"
AOG_heavy_tank_destroyer_equipment_3_desc: "«Ягдтигр» имеет 128-мм пушку PaK 44 L/55 и тяжёлую лобовую броню."

AOG_super_heavy_tank_equipment_1: "Panzerkampfwagen VIII Maus"
AOG_super_heavy_tank_equipment_1_short: "Maus"
AOG_super_heavy_tank_equipment_1_desc: "Panzerkampfwagen VIII Maus — самая тяжёлая из спроектированных полностью закрытых боевых бронемашин. Основное вооружение — 128-мм KwK 44 L/55 со спаренной 75-мм пушкой."
AOG_super_heavy_tank_artillery_equipment_1: "Geschützwagen E-100"
AOG_super_heavy_tank_artillery_equipment_1_short: "GW E-100"
AOG_super_heavy_tank_artillery_equipment_1_desc: "Эта самоходная установка со 210-мм орудием на шасси сверхтяжёлого танка соперничает по огневой мощи с некоторыми железнодорожными орудиями."
AOG_super_heavy_tank_destroyer_equipment_1: "SturmGeschütz auf Fahrgestell Maus"
AOG_super_heavy_tank_destroyer_equipment_1_short: "Jagdmaus"
AOG_super_heavy_tank_destroyer_equipment_1_desc: "Шасси «Мауса» со 150-мм орудием в неподвижной рубке."
AOG_super_heavy_tank_aa_equipment_1: "Flakpanzer VIII Maus"
AOG_super_heavy_tank_aa_equipment_1_short: "FlakMaus"
AOG_super_heavy_tank_aa_equipment_1_desc: "The chassis of a Maus mounting twin 88mm anti-air guns."

AOG_modern_tank_equipment_1: "E-50 Standardpanzer"
AOG_modern_tank_equipment_1_short: "E-50"
AOG_modern_tank_equipment_1_desc: "Серия Entwicklung Standardpanzer изначально построена на модульности. Эти танки должны господствовать на поле боя благодаря передовому вооружению и делать это с максимальной эффективностью."
AOG_modern_tank_destroyer_equipment_1: "E-25 Standardpanzer"
AOG_modern_tank_destroyer_equipment_1_short: "E-25"
AOG_modern_tank_destroyer_equipment_1_desc: "Обновлённый вариант Jagdpanzer IV, E-25 отличается большей скоростью и усиленной бронёй."

### Sea ###
AOG_submarine_1: "UB III Type"
#AOG_submarine_1_desc: "The UB III Type coastal submarine was a class of U-boat built during World War I by the German Imperial Navy. They carried ten torpedoes and displaced over 500 tons. Between 1916 and 1918, 96 were built, though all were out of service by 1935."
AOG_submarine_2: "Type IIA"
#AOG_submarine_2_desc: "The German Type IIA submarine was a single hull, all welded coastal submarine with internal ballast tanks. It displaced over 250 tons and mounts five 533mm torpedo tubes. Six were built between 1934 and 1935."
#AOG_submarine_2b: "Type VIIA"
AOG_submarine_3: "Type VIIC"
#AOG_submarine_3_desc: "The Type VIIC seagoing submarine was the workhorse of the German U-boat force, with 568 commissioned between 1940 and 1945. The ships displaced 770 tons and were armed with five 533mm torpedo tubes."
#AOG_submarine_3b: "Type IXC"
AOG_submarine_4: "Type XXI"
#AOG_submarine_4_desc: "Type XXI submarines, also known as 'Elektroboote', were the first submarines designed to operate primarily submerged, rather than as surface ships that could submerge as a means to escape detection or launch an attack. Its key features were its streamlined hull and conning tower and its large number of battery cells. It was among the largest of the German submarine classes, displacing over 1,620 tons. There were 118 ships commissioned between 1943 and 1945."
AOG_destroyer_1: "Type 23"
#AOG_destroyer_1_desc: "The Type 23 was a class of torpedo boat built for the Kaiserliche Marine following World War I. Six vessels were built between 1926 and 1928 and all served during World War II. Despite their torpedo boat designation, the ships were destroyer-sized, displacing over 920 tons and armed with three 105mm L/45 guns."
AOG_destroyer_2: "Zerstörer 1934"
#AOG_destroyer_2_desc: "The Zerstörer 1934 class was the first class of German destroyers built since World War I. They were armed with five 5" guns and eight torpedo tubes. 16 ships were built, out of which 12 were the improved Zerstörer 1934A subclass."
AOG_destroyer_3: "Narvik Class"
#AOG_destroyer_3_desc: "Zerstörer 1936A, known to the allies as Narvik Class destroyers, was designed to carry the new 150mm (5.9") guns. Designed with three single guns aft and a twin gun in the bow, they were originally fitted with a single gun in the bow. Four of the eight ships of the class were later refitted with the twin turrets. A second group of seven destroyers were built to a slightly modified design with twin guns in the bow."
AOG_destroyer_4: "Zerstörer 1944"
#AOG_destroyer_4_desc: "Although the first prototype of a diesel powered destroyer (Zerstörer 1942) was not completed, the development of the ship type continued. Several proposals were made which finally lead to the Zerstörer 1944 project. In addition to a heavy main armament, the ships had an increased Flak armament compared to its predecessors, including the new 5,5 cm AA gun."
AOG_light_cruiser_1: "Emden Class"
#AOG_light_cruiser_1_desc: "Emden was the first large warship built in Germany after World War I. She was laid down in 1921 and commissioned in 1925. The armament consisted of eight 150mm (5.9") guns in single turrets."
#AOG_light_cruiser_1b: "Königsberg Class"
AOG_light_cruiser_2:1 "Leipzig Class"
#AOG_light_cruiser_2_desc:1 "The Leipzig-class light cruisers were built between 1928 and 1935 as improvements over the preceding Königsberg-class cruisers. They displaced over 8,100 tons, had adequate speed and range, and were armed with nine 15cm SK C/25 guns in their main armament."
AOG_light_cruiser_3: "M Class"
#AOG_light_cruiser_3_desc: "The M-class cruisers were designed as scouts for commerce raiding squadrons. Six ships were ordered as part of Plan Z, with two being laid down before work was halted at the outbreak of the war. The main armament would have been eight 150mm guns in four twin turrets."
AOG_light_cruiser_4: "Q Class"
#AOG_light_cruiser_4_desc: "The Q-class cruisers were a modified M-class design. They were designed to be larger than the M-class with a heavier anti-aircraft armament and improved fire control."
AOG_heavy_cruiser_1: "Blücher Class"
#AOG_heavy_cruiser_1_desc: "Blücher was the last armoured cruiser built by Germany. Her design was innovative for her time and paved the way for the later Von der Tann-class Battlecruisers. By World War I, she was already obsolete. Blücher was sunk at the Battle at the Doggerbank in 1915."
AOG_heavy_cruiser_2: "Hipper Class"
#AOG_heavy_cruiser_2_desc: "The Admiral Hipper Class heavy cruisers were the first heavy cruisers of the Kaiserliche Marine. Officially displacing 10,000 tons, in reality they displaced over 16000 tons. They were armed with eight 8" guns in four twin turrets, with a secondary battery of twelve 105mm guns."
AOG_heavy_cruiser_3: "Prinz Eugen Class"
#AOG_heavy_cruiser_3_desc: "Officially part of the Hipper Class, the Prinz Eugen subclass incorporates many improvements, including a heavier anti air armament. Of the three ships in the subclass, only Prinz Eugen was completed. She participated in the sinking of HMS Hood during Operation Rheinübung. After the war, she was transferred to the United States and served as USS Prinz Eugen in the Able and Baker atomic bomb tests before sinking at the Kwajalein Atoll in 1946."
AOG_heavy_cruiser_4: "P Class Cruiser"
#AOG_heavy_cruiser_4_desc: "The P Class was a large heavy cruiser design, officially designated as Panzerschiff (Armoured Ship) by the Kaiserliche Marine. Displacing almost 24,000 tons, they would have been 3,000 tons lighter but 55 metres longer than the U.S. New York-class battleships. The armament consisted of six 280mm guns in two triple turrets."
AOG_battle_cruiser_1: "Yorck Class"
#AOG_battle_cruiser_1_desc: "The three ships of the Yorck-class battlecruisers were designed in response to the British Renown Class. They would have been armed with eight 380mm guns in four twin turrets. All three ships were laid down in 1916, but none were completed due to the war."
AOG_battle_cruiser_2: "O Class"
#AOG_battle_cruiser_2_desc: "In 1939, the Kaiserliche Marine decided to replace three of the planned P-class cruisers with battlecruisers. This resulted in the O-class battlecruisers, armed with six 38cm (15") guns in three twin turrets. The ships were designed with a displacement of 35,400 tons and a top speed of 35 knots. Construction orders were given for the three ships of the class, but none were started."
AOG_battleship_1: "Deutschland Class"
#AOG_battleship_1_desc: "Following the Treaty of Versailles, Germany was allowed to retain six pre-dreadnought battleships. Classified as Linienschiffe (Ships of the Line) by the Kaiserliche Marine, only two ships of the Deutschland Class, not to be confused with the later Deutschland-class Pocket Battleships, remained in active service through the 1930s. At 04:47 on September 1, 1939, Schleswig-Holstein fired the first shots of World War II as she opened fire on the Westerplatte base in Danzig, Poland."
AOG_battleship_2: "Scharnhorst Class"
#AOG_battleship_2_desc: "The Scharnhorst-class battleships were the first modern battleships to be built for the Kaiserliche Marine. They were built as a response to the French Dunkerque-class battlecruisers, themselves a response to the German Deutschland-class Panzerschiffe (Pocket Battleships). The Scharnhorst class is armed with nine 283mm (11") guns in three triple turrets. Plans were made to up gun them with twin 380mm (15") guns, but with the outbreak of the war, this never happened."
AOG_battleship_3: "Bismarck Class"
#AOG_battleship_3_desc: "The two-ship Bismarck-class battleships were the largest warships built for the Kaiserliche Marine. The ships were designed in response to the new French battleships under construction, with a similar armament of eight 38cm (15") guns as the Richelieu Class, with four twin turrets as opposed to the two quad turrets of the Richelieus. Bismarck is famous for the sinking of the British battlecruiser HMS Hood in the Battle of the Denmark Strait, but was subsequently hunted down and sunk before reaching port."
AOG_battleship_4: "Hindenburg Class"
#AOG_battleship_4_desc: "The German Plan Z envisioned a force of ten battleships in order to challenge the naval power of the United Kingdom. The H-class was a series of designs for the six battleships needed to meet the demands of the plan. Two ships of the H39 design were laid down at the outbreak of World War II, but construction was halted as the war begun. Neither of the ships were officially named, but Hindenburg was speculated as a possible name for the lead ship of the class. Had the ships been completed, they would have been augmented Bismarck Class ships, with a main battery of eight 40.6cm (16") guns."
AOG_carrier_1: "Flugzeugdampfer I"
#AOG_carrier_1_desc: "Designed in 1915, the Flugzeugdampfer I (Airplane Steamer I) Project was a conversion of the incomplete passenger liner Ausonia into an aircraft carrier. The construction was abandoned at the end of World War I. Had she been completed, she would have carried a mix of seaplanes and wheeled aircraft in her three hangars and would have displaced 12,500 tons."
AOG_carrier_2: "Seydlitz Class"
#AOG_carrier_2_desc: "Seydlitz was laid down as the fourth ship of the Admiral Hipper-class heavy cruisers. Partially completed by the beginning of the war, she was considered for conversion into an aircraft carrier. The project, codenamed Weser 1, was partially underway when work was halted due to increasing air attacks on Bremen and the lack of resources for her construction."
AOG_carrier_3: "Graf Zeppelin Class"
#AOG_carrier_3_desc: "Graf Zeppelin was the only class of ships in the Kaiserliche Marine that had been designed as an aircraft carrier from the keel up. Two ships were ordered, but neither was completed. As designed, the Graf Zeppelin would carry 30 Bf-109T fighters and 12 Ju-87E dive bombers, ship versions of the Bf-109E and the Ju-87D."
AOG_carrier_4: "Europa Class"
#AOG_carrier_4_desc: "Several civilian ships were considered for conversions to aircraft carriers by the Kaiserliche Marine in the 1940s. The largest of these ships was the passenger ship Europa. Being the largest passenger ship in Germany, she had been used as a barracks ship and a troop transport before work began on converting her to a carrier. Had she been completed, she would have displaced 56,000 tons and carried an air group of 42 aircraft."
AOG_SH_battleship_1: "Schlachtschiff H41"
#AOG_SH_battleship_1_desc: "The H41 design of battleships was an improvement over the previous H39 design. The design called for significantly stronger armour, strengthened torpedo bulkheads and protection for the ships rudder and propeller shafts. The main battery was upgraded to eight 42cm guns, larger than that of the proposed Lion Class battleships of the United Kingdom. As designed, these ships would have a displacement of almost 70,000 tons."
AOG_SH_battleship_2: "Schlachtschiff H44"
#AOG_SH_battleship_2_desc: "The H44 Class was the last of the H-series of Battleship designs. With no limit on gun caliber or displacement, the H42 to H44 designs mounted increasingly heavier armament and armour protection, culminating in the 131,000 ton H44 design armed with eight 508mm (20") guns."

