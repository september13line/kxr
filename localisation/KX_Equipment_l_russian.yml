AOG_jet_strat_bomber_equipment_1_desc: "В ответ на потребность Германии в реактивном межконтинентальном бомбардировщике Arado разработала увеличенный вариант опытного тактического Ar 234. Все четыре двигателя Ar 576 встроены в крыло. При раскрутке они издают резкий звук, будто по фюзеляжу бьют молотом; за него немецкие испытатели прозвали самолёт «Молотом»."
